    answers: ['3']
    explanation: |
      선택지 1: 컴파일은 고급 언어 프로그램을 기계어로 번역하는 과정이다.
      선택지 2: 스칼라는 하나의 값만 갖는 단순 자료(정수, 실수 등)를 가리키는 말이다.
      선택지 3: 바인딩은 이름(변수, 서브프로그램 등)에 타입, 주소, 값 같은 속성을 연결하는 과정이므로 정답이다.
