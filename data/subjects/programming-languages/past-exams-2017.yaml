questions:
  - id: e17-01
    type: multiple-choice
    chapter: 1
    prompt: 프로그래밍 언어에서의 추상화에 대한 설명으로 바른 것은?
    choices:
      - { id: '1', text: 프로그래머의 의도를 추상화하여 컴퓨터에게 전달 }
      - { id: '2', text: 컴퓨터의 CPU를 변수로 추상화 }
      - { id: '3', text: '제어를 추상화한 것으로 문자열, 수 등이 있음' }
      - { id: '4', text: '자료를 추상화한 것으로 반복문, 조건문 등이 있음' }
    answers: ['1']
    explanation: |
      선택지 1: 프로그래밍 언어는 기계의 세부 동작 대신 프로그래머의 의도를 추상화된 형태로 표현해 컴퓨터에게 전달하므로 정답이다.
      선택지 2: 변수는 CPU(Central Processing Unit)가 아니라 기억 장소(메모리 셀)를 추상화한 것이다.
      선택지 3: 문자열, 수는 자료를 추상화한 것이다. 제어 추상화의 예는 반복문, 조건문, 프로시저 호출이다.
      선택지 4: 반복문, 조건문은 제어를 추상화한 것이다. 3번과 설명이 서로 바뀌었다.

      핵심 개념:
      추상화는 복잡한 세부 사항을 감추고 핵심만 드러내는 것이다.
      자료 추상화는 문자열, 수, 배열, 레코드처럼 데이터 표현을 추상화한다.
      제어 추상화는 조건문, 반복문, 프로시저처럼 실행 흐름을 추상화한다.
      고급 언어는 추상화 수준이 높아 기계를 몰라도 프로그램을 작성할 수 있게 한다.
    tags: [abstraction]

  - id: e17-02
    type: multiple-choice
    chapter: 3
    prompt: 명령형 언어에 대한 설명으로 바른 것은?
    choices:
      - { id: '1', text: 순차적인 명령의 수행을 기본 개념으로 하는 언어 }
      - { id: '2', text: 알려진 값들을 함수에 적용하는 방식으로 프로그램을 기술하는 언어 }
      - { id: '3', text: 무엇을 하려고 하는가를 선언하듯 기술하는 언어 }
      - { id: '4', text: 자료형과 연산으로 이루어지는 객체에 기반하는 언어 }
    answers: ['1']
    explanation: |
      선택지 1: 명령형 언어는 변수의 상태를 바꾸는 명령들을 순서대로 실행하는 것을 기본으로 하므로 정답이다(예: C, Pascal, Fortran).
      선택지 2: 값들을 함수에 적용해 프로그램을 기술하는 것은 함수형 언어이다(예: LISP, Haskell).
      선택지 3: 무엇을 원하는지 선언하듯 기술하는 것은 논리형 언어이다(예: Prolog).
      선택지 4: 자료와 연산을 묶은 객체에 기반하는 것은 객체 지향 언어이다(예: Java, C++).

      핵심 개념:
      명령형 언어는 폰 노이만 구조를 반영해 기억 장소의 값을 대입문으로 바꾸어 가며 계산한다.
      함수형 언어는 부작용 없는 함수 적용과 합성으로 계산한다.
      논리형 언어는 사실과 규칙을 선언하고 추론으로 답을 구한다.
      객체 지향 언어는 객체와 클래스, 상속, 다형성으로 프로그램을 구성한다.
    tags: [paradigm, imperative]

  - id: e17-03
    type: multiple-choice
    chapter: 2
    prompt: 프로그래밍 언어의 설계 기준 중 정의에 의존하여 프로그래밍 언어의 행위를 예측할 수 있음을 의미하는 것은?
    choices:
      - { id: '1', text: 효율성 }
      - { id: '2', text: 일반성 }
      - { id: '3', text: 표현력 }
      - { id: '4', text: 정확성 }
    answers: ['4']
    explanation: |
      선택지 1: 효율성은 번역과 실행이 빠르고 자원을 적게 쓰는 정도를 뜻한다.
      선택지 2: 일반성은 특별한 경우를 두지 않고 관련 개념을 하나로 일반화하는 성질이다.
      선택지 3: 표현력은 복잡한 과정이나 구조를 쉽게 표현할 수 있는 정도이다.
      선택지 4: 정확성은 언어의 정의(명세)만 보고도 프로그램의 행위를 정확히 예측할 수 있음을 뜻하므로 정답이다.

      핵심 개념:
      프로그래밍 언어의 설계 기준에는 효율성, 일반성, 직교성, 정확성, 안전성, 표현력, 확장성, 부분성 등이 있다.
      정확성은 언어가 모호함 없이 정의되어 행위를 예측할 수 있는지를 본다.
      이를 위해 BNF(Backus-Naur Form) 같은 형식적 구문 정의와 의미 정의가 사용된다.
      안전성은 오류를 줄이고 쉽게 발견하게 하는 성질로 정확성과 구분된다.
    tags: [design-criteria, preciseness]

  - id: e17-04
    type: multiple-choice
    chapter: 1
    prompt: 프로그래밍 언어의 구조를 분석하기 위해 다음 중 가장 마지막에 분석하는 것은?
    choices:
      - { id: '1', text: 문자 }
      - { id: '2', text: 어휘 }
      - { id: '3', text: 토큰 }
      - { id: '4', text: 구문 }
    answers: ['4']
    explanation: |
      선택지 1: 문자는 가장 먼저 읽는 최소 단위이다.
      선택지 2: 어휘는 문자를 모아 만든 단어로 문자 다음 단계에서 분석한다.
      선택지 3: 토큰은 어휘 분석의 결과로 얻는 의미 단위이며 구문 분석 이전에 만들어진다.
      선택지 4: 구문은 토큰(어휘)들이 결합된 구조를 분석하는 단계로 가장 마지막에 분석하므로 정답이다.

      핵심 개념:
      프로그래밍 언어의 구조는 문자 → 어휘(토큰) → 구문 순으로 분석한다.
      어휘 분석은 문자열을 토큰으로 나누고, 구문 분석은 토큰의 결합 구조를 검사한다.
      구문 분석 결과는 파스 트리(구문 트리)로 나타낸다.
      컴파일러에서도 어휘 분석기 다음에 구문 분석기가 동작한다.
    tags: [lexical-structure, syntax]

  - id: e17-05
    type: multiple-choice
    chapter: 4
    passageRefs: [g17-bnf-letter-01]
    prompt: 비단말 기호는?
    choices:
      - { id: '1', text: '<letter>' }
      - { id: '2', text: '::=' }
      - { id: '3', text: a }
      - { id: '4', text: '|' }
    answers: ['1']
    explanation: |
      선택지 1: < >로 묶인 <letter>는 생성 규칙으로 정의되는 비단말 기호이므로 정답이다.
      선택지 2: ::=는 "정의한다"를 뜻하는 메타 기호이다.
      선택지 3: a는 실제 문장에 나타나는 단말 기호이다.
      선택지 4: |는 택일을 뜻하는 메타 기호이다.

      핵심 개념:
      BNF 생성 규칙은 "비단말 기호 ::= 정의"의 형태이다.
      비단말 기호는 < >로 묶고, 단말 기호는 그대로 적는다.
      메타 기호 ::=는 정의, |는 여러 정의 중 하나를 고르는 택일을 뜻한다.
      <letter> ::= a | b | c | d | e는 <letter>가 a~e 중 하나임을 뜻한다.
    tags: [bnf, nonterminal]

  - id: e17-06
    type: multiple-choice
    chapter: 4
    passageRefs: [g17-bnf-letter-01]
    prompt: 택일을 나타내는 메타 기호는?
    choices:
      - { id: '1', text: '<letter>' }
      - { id: '2', text: '::=' }
      - { id: '3', text: a }
      - { id: '4', text: '|' }
    answers: ['4']
    explanation: |
      선택지 1: <letter>는 비단말 기호이다.
      선택지 2: ::=는 정의를 나타내는 메타 기호이다.
      선택지 3: a는 단말 기호이다.
      선택지 4: |는 "또는"의 의미로 여러 대안 중 하나를 택하는 메타 기호이므로 정답이다.

      핵심 개념:
      BNF의 메타 기호는 ::=(정의), |(택일), < >(비단말 표시)이다.
      택일 기호 |로 여러 생성 규칙을 한 줄에 묶어 쓸 수 있다.
      메타 기호는 문법을 설명하기 위한 기호로 실제 프로그램에는 나타나지 않는다.
      EBNF(Extended BNF)는 여기에 { }, [ ], ( )를 추가한다.
    tags: [bnf, meta-symbol]

  - id: e17-07
    type: multiple-choice
    chapter: 4
    prompt: BNF 표기법과 EBNF 표기법에 모두 해당하는 메타 기호는?
    choices:
      - { id: '1', text: '[ ]' }
      - { id: '2', text: '{ }' }
      - { id: '3', text: '( | )' }
      - { id: '4', text: '::=' }
    answers: ['4']
    explanation: |
      선택지 1: [ ]는 생략 가능(0번 또는 1번)을 나타내는 EBNF 전용 메타 기호이다.
      선택지 2: { }는 0번 이상 반복을 나타내는 EBNF 전용 메타 기호이다.
      선택지 3: ( | )처럼 괄호로 택일을 묶는 그룹 표기는 EBNF에서 추가된 것이다.
      선택지 4: ::=는 BNF에서 정의를 나타내며 EBNF에서도 그대로 쓰이므로 정답이다.

      핵심 개념:
      BNF 메타 기호: ::=, |, < >.
      EBNF는 BNF의 메타 기호를 모두 쓰면서 { }(반복), [ ](선택), ( )(그룹)를 추가했다.
      따라서 두 표기법에 공통인 메타 기호는 ::=, |, < >이다.
      EBNF를 쓰면 재귀 규칙 없이 반복을 간결하게 표현할 수 있다.
    tags: [bnf, ebnf, meta-symbol]

  - id: e17-08
    type: multiple-choice
    chapter: 4
    passageRefs: [g17-syntax-diagram-number-01]
    prompt: 다음 구문 도표를 EBNF로 올바르게 표현한 것은?
    choices:
      - { id: '1', text: '<number> ::= { <digit> }' }
      - { id: '2', text: '<number> ::= <digit> { <digit> }' }
      - { id: '3', text: '<number> ::= <digit> [ <digit> ]' }
      - { id: '4', text: '<number> ::= [ <digit> ]' }
    answers: ['2']
    explanation: |
      선택지 1: { <digit> }만 있으면 digit이 0번 나올 수도 있다. 도표는 digit을 최소 한 번 거쳐야 하므로 맞지 않는다.
      선택지 2: 처음 digit을 반드시 한 번 지나고, 아래 되돌이 경로로 digit을 0번 이상 더 반복하므로 <digit> { <digit> }이다. 정답이다.
      선택지 3: [ <digit> ]는 추가 digit이 0번 또는 1번만 온다는 뜻이라, 되돌이 경로로 여러 번 반복하는 도표를 표현하지 못한다.
      선택지 4: [ <digit> ]만 있으면 digit이 없거나 한 개뿐이어서 도표와 다르다.

      핵심 개념:
      구문 도표에서 앞으로 되돌아가는 화살표는 반복을 뜻하며 EBNF의 { }에 대응한다.
      건너뛰는 우회 경로는 생략 가능을 뜻하며 [ ]에 대응한다.
      "한 번 이상 반복"은 X { X } 형태로 표현한다.
      <number> ::= <digit> { <digit> }는 한 자리 이상의 숫자열을 정의한다.
    tags: [syntax-diagram, ebnf, repetition]

  - id: e17-09
    type: multiple-choice
    chapter: 5
    passageRefs: [g17-parse-trees-01]
    prompt: 다음 두 파스 트리가 동일한 문법으로 만들어졌을 때 이 문법을 일컫는 표현은?
    choices:
      - { id: '1', text: 명확한 문법 }
      - { id: '2', text: 단순한 문법 }
      - { id: '3', text: 모호한 문법 }
      - { id: '4', text: 다양한 문법 }
    answers: ['3']
    explanation: |
      선택지 1: 명확한 문법은 한 표현에 파스 트리가 하나만 존재하는 문법이다. 여기서는 같은 3-2*5에 트리가 두 개 있다.
      선택지 2: 단순한 문법은 모호성을 가리키는 용어가 아니다.
      선택지 3: 같은 표현 3-2*5에 대해 3-(2*5)와 (3-2)*5로 해석되는 서로 다른 파스 트리가 존재하므로 모호한 문법이다. 정답이다.
      선택지 4: 다양한 문법은 교재에서 쓰는 분류 용어가 아니다.

      핵심 개념:
      모호한 문법은 하나의 표현에 대해 둘 이상의 파스 트리가 존재하는 문법이다.
      왼쪽 트리는 -의 오른쪽에 2*5가 묶여 3-(2*5) = -7이 된다.
      오른쪽 트리는 3-2가 먼저 묶여 (3-2)*5 = 5가 된다.
      연산자 우선순위와 결합 규칙을 문법에 반영하면 모호성을 제거할 수 있다.
    tags: [ambiguous-grammar, parse-tree]

