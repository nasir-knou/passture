  - id: e17-16
    type: multiple-choice
    chapter: 8
    prompt: 프로그램에서 사용되는 식별자가 의미를 가질 수 있는 범위를 일컫는 용어는?
    choices:
      - { id: '1', text: 할당 }
      - { id: '2', text: 영역 }
      - { id: '3', text: 수명 }
      - { id: '4', text: 링크 }
    answers: ['2']
    explanation: |
      선택지 1: 할당은 변수에 기억 장소를 배정하거나 값을 저장하는 것이다.
      선택지 2: 영역(scope)은 식별자가 유효하게 참조될 수 있는 프로그램의 범위이므로 정답이다.
      선택지 3: 수명(lifetime)은 변수가 기억 장소를 차지하고 존재하는 실행 시간의 구간이다.
      선택지 4: 링크는 활성화 레코드 사이를 연결하는 포인터(정적·동적 링크) 등을 뜻한다.

      핵심 개념:
      영역은 프로그램 텍스트상의 공간적 범위, 수명은 실행 중 시간적 범위이다.
      영역 규칙은 이름의 사용이 어느 선언을 가리키는지 결정한다.
      정적 영역 규칙은 블록 중첩 구조, 동적 영역 규칙은 호출 순서를 기준으로 한다.
      영역과 수명은 일치하지 않을 수 있다(예: C의 static 지역 변수).
    tags: [scope, lifetime]

  - id: e17-17
    type: multiple-choice
    chapter: 8
    prompt: 자유 변수에 대한 설명으로 바른 것은?
    choices:
      - { id: '1', text: 현 블록에서 정의된 변수 }
      - { id: '2', text: 정적 영역 규칙에서는 현 블록을 내포하고 있는 가장 바깥쪽의 블록부터 조사 }
      - { id: '3', text: 동적 영역 규칙에서는 프로그램의 실행 순서로 해결 }
      - { id: '4', text: 선언을 찾지 못하면 0으로 초기화 }
    answers: ['3']
    explanation: |
      선택지 1: 자유 변수는 현 블록에서 정의되지 않은 채 사용되는 변수이다. 현 블록에서 정의된 변수는 지역 변수이다.
      선택지 2: 정적 영역 규칙은 현 블록을 감싼 블록 중 가장 안쪽(가까운) 블록부터 바깥쪽으로 조사한다.
      선택지 3: 동적 영역 규칙에서는 서브프로그램이 호출된 실행 순서를 거슬러 올라가며 자유 변수의 선언을 찾으므로 정답이다.
      선택지 4: 선언을 찾지 못하면 오류로 처리하며 0으로 초기화하지 않는다.

      핵심 개념:
      자유 변수는 사용되는 블록 안에 선언이 없는 변수이다.
      영역 규칙은 자유 변수가 어느 선언을 가리키는지 결정한다.
      정적 영역 규칙은 가장 가까운 바깥 블록부터 텍스트 구조를 따라 찾는다.
      동적 영역 규칙은 가장 최근에 호출된 서브프로그램부터 호출 순서를 따라 찾는다.
    tags: [free-variable, scope-rule]

  - id: e17-18
    type: multiple-choice
    chapter: 8
    prompt: C 언어에서 외부 파일에 있는 변수를 연결하여 사용할 수 있도록 하는 명령어는?
    choices:
      - { id: '1', text: extern }
      - { id: '2', text: static }
      - { id: '3', text: float }
      - { id: '4', text: void }
    answers: ['1']
    explanation: |
      선택지 1: extern은 다른 파일에서 정의된 전역 변수나 함수를 현재 파일에서 참조하겠다고 선언하는 키워드이므로 정답이다.
      선택지 2: static은 변수의 수명을 프로그램 전체로 늘리거나, 전역 변수의 영역을 해당 파일 안으로 제한한다.
      선택지 3: float는 실수 자료형 키워드이다.
      선택지 4: void는 반환값이 없음이나 형이 정해지지 않은 포인터를 나타내는 키워드이다.

      핵심 개념:
      C는 여러 파일로 나뉜 프로그램에서 이름의 영역을 extern과 static으로 조절한다.
      extern 선언은 기억 장소를 새로 만들지 않고 다른 곳의 정의를 참조한다.
      static 전역 변수는 선언된 파일 안에서만 보인다.
      이렇게 이름이 보이는 범위를 나누는 것은 이름 공간 관리의 한 방법이다.
    tags: [extern, c-language, scope]

  - id: e17-19
    type: multiple-choice
    chapter: 14
    prompt: 단위 활성화에 대한 설명으로 바른 것은?
    choices:
      - { id: '1', text: '코드부, 실행부, 활성화 레코드로 구성' }
      - { id: '2', text: 코드부의 내용은 프로그램의 실행 동안 변하지 않음 }
      - { id: '3', text: 실행부는 고정된 크기임 }
      - { id: '4', text: 지역 변수는 자신의 활성화 레코드에 저장되지 않음 }
    answers: ['2']
    explanation: |
      선택지 1: 단위 활성화는 코드부와 활성화 레코드 두 부분으로 구성된다. 실행부라는 구성 요소는 없다.
      선택지 2: 코드부에는 명령어가 들어 있어 실행 중에 바뀌지 않으므로 정답이다.
      선택지 3: 실행부는 단위 활성화의 구성 요소가 아니다. 또한 활성화 레코드는 가변 크기 자료에 따라 크기가 달라질 수 있다.
      선택지 4: 지역 변수는 해당 서브프로그램의 활성화 레코드에 저장된다.

      핵심 개념:
      서브프로그램이 실행되는 한 번의 단위를 단위 활성화라 한다.
      단위 활성화는 변하지 않는 코드부와 실행 중 변하는 활성화 레코드로 이루어진다.
      활성화 레코드에는 지역 변수, 매개변수, 복귀 주소, 정적·동적 링크 등이 저장된다.
      재귀 호출이 가능하려면 호출마다 새 활성화 레코드가 만들어져야 한다.
    tags: [unit-activation, activation-record]

  - id: e17-20
    type: multiple-choice
    chapter: 14
    prompt: 활성화 레코드에 대한 설명으로 바른 것은?
    choices:
      - { id: '1', text: 동적 링크는 호출한 단위 활성화로 되돌아갈 주소값을 저장하는 포인터로 코드부를 가리킴 }
      - { id: '2', text: 반환 주소는 호출한 활성화 레코드를 가리키는 주소 }
      - { id: '3', text: '매개변수, 정적링크 등을 포함' }
      - { id: '4', text: 활성화 레코드의 크기는 변하지 않음 }
    answers: ['3']
    explanation: |
      선택지 1: 동적 링크는 호출한 단위 활성화의 활성화 레코드를 가리키는 포인터이다. 코드부의 되돌아갈 위치를 저장하는 것은 반환 주소이다.
      선택지 2: 반환 주소는 호출한 쪽 코드부에서 다음에 실행할 명령어의 위치이다. 호출한 활성화 레코드를 가리키는 것은 동적 링크이다. 1번과 설명이 서로 바뀌었다.
      선택지 3: 활성화 레코드는 지역 변수, 매개변수, 반환 주소, 정적 링크, 동적 링크 등을 포함하므로 정답이다.
      선택지 4: 가변 크기 배열 같은 자료가 있으면 활성화 레코드 크기가 호출마다 달라질 수 있다.

      핵심 개념:
      활성화 레코드는 서브프로그램 실행에 필요한 자료를 담는 기억 장소이다.
      반환 주소는 호출자 코드의 복귀 지점, 동적 링크는 호출자의 활성화 레코드를 가리킨다.
      정적 링크는 소스 코드상 자신을 감싼 블록의 활성화 레코드를 가리킨다.
      스택 기반 구현에서는 호출 시 활성화 레코드를 쌓고 복귀 시 제거한다.
    tags: [activation-record, dynamic-link, static-link]

  - id: e17-21
    type: multiple-choice
    chapter: 14
    prompt: 디스플레이 사용 기법에 대한 설명으로 바른 것은?
    choices:
      - { id: '1', text: 지역 변수들의 자료값에 대한 참조 시간을 줄이기 위한 구현 기법 }
      - { id: '2', text: 정적 체인 사용 기법과 달리 어떤 지역 변수에 대한 참조 시간도 동일 }
      - { id: '3', text: 디스플레이라는 1차원 가변 배열을 사용 }
      - { id: '4', text: 지역 변수들의 사용이 증가할 경우 매력적 }
    answers: ['3']
    explanation: |
      선택지 1: 디스플레이는 지역 변수가 아니라 비지역 변수의 참조 시간을 줄이기 위한 기법이다.
      선택지 2: 참조 시간이 동일해지는 대상은 비지역 변수이다. 지역 변수는 원래 자신의 활성화 레코드에서 바로 찾는다.
      선택지 3: 디스플레이 기법은 중첩 수준별 활성화 레코드 주소를 담는 1차원 가변 배열(디스플레이)을 사용하므로 정답이다.
      선택지 4: 디스플레이가 매력적인 경우는 비지역 변수의 사용이 많을 때이다.

      핵심 개념:
      디스플레이는 정적 영역 규칙에서 비지역 변수를 빠르게 찾는 구현 기법이다.
      디스플레이 배열의 i번째 원소는 중첩 수준 i의 활성화 레코드를 가리킨다.
      비지역 변수는 디스플레이[수준] + 변위로 한 번에 접근하므로 참조 시간이 일정하다.
      대신 서브프로그램 호출과 복귀 때 디스플레이를 갱신하는 비용이 든다.
    tags: [display, nonlocal-variable]

  - id: e17-22
    type: multiple-choice
    chapter: 13
    prompt: 부프로그램이 실행되는 동안 호출자가 보내준 식 또는 다른 이름을 대신하여 그 프로그램에서 사용되는 이름을 일컫는 용어는?
    choices:
      - { id: '1', text: 실 매개변수 }
      - { id: '2', text: 형식 매개변수 }
      - { id: '3', text: 원본 매개변수 }
      - { id: '4', text: 프로시저 }
    answers: ['2']
    explanation: |
      선택지 1: 실 매개변수는 호출자가 호출문에서 실제로 보내는 식이나 변수이다.
      선택지 2: 형식 매개변수는 부프로그램 정의부에서 호출자가 보낸 값이나 이름을 대신해 쓰는 이름이므로 정답이다.
      선택지 3: 원본 매개변수는 교재에서 쓰는 용어가 아니다.
      선택지 4: 프로시저는 반환값 없이 작업을 수행하는 부프로그램 자체를 가리킨다.

      핵심 개념:
      매개변수는 호출자와 부프로그램 사이에서 자료를 주고받는 수단이다.
      형식 매개변수는 부프로그램 정의에 적힌 이름이고, 실 매개변수는 호출 시 넘기는 인수이다.
      호출하면 실 매개변수와 형식 매개변수가 전달 방식(값, 참조, 이름 등)에 따라 연결된다.
      부프로그램은 반환값이 있는 함수와 없는 프로시저로 나뉜다.
    tags: [formal-parameter, actual-parameter]

  - id: e17-23
    type: multiple-choice
    chapter: 13
    passageRefs: [g17-exchange-01]
    prompt: 참조호출을 사용하는 프로그래밍 언어에서 위 프로그램의 출력 결과는 무엇인가?
    choices:
      - { id: '1', text: '10 20' }
      - { id: '2', text: '10 10' }
      - { id: '3', text: '20 20' }
      - { id: '4', text: '20 10' }
    answers: ['4']
    explanation: |
      선택지 1: X, Y가 바뀌지 않은 결과로 값호출일 때의 출력이다.
      선택지 2: 한 값만 덮어쓴 경우로 TEMP를 이용한 교환 과정과 맞지 않는다.
      선택지 3: 2번과 마찬가지로 교환이 불완전할 때의 결과이다.
      선택지 4: 참조호출에서는 형식 매개변수 X, Y가 main의 X, Y와 같은 기억 장소를 가리키므로 EXCHANGE가 실제로 값을 교환한다. 출력은 20 10이므로 정답이다.

      핵심 개념:
      참조호출은 실 매개변수의 주소를 넘겨 부프로그램이 호출자의 변수를 직접 바꾸게 한다.
      EXCHANGE는 TEMP를 이용해 두 값을 교환하는 부프로그램이다.
      참조호출이면 교환 결과가 main에 반영되어 X = 20, Y = 10이 된다.
      이름이 같아도 main의 X, Y와 EXCHANGE의 X, Y는 서로 다른 영역의 이름이다.
    tags: [call-by-reference, parameter-passing]

  - id: e17-24
    type: multiple-choice
    chapter: 13
    passageRefs: [g17-exchange-01]
    prompt: 값호출을 사용하는 프로그래밍 언어에서 위 프로그램의 출력 결과는 무엇인가?
    choices:
      - { id: '1', text: '10 20' }
      - { id: '2', text: '10 10' }
      - { id: '3', text: '20 20' }
      - { id: '4', text: '20 10' }
    answers: ['1']
    explanation: |
      선택지 1: 값호출에서는 main의 X, Y 값이 복사되어 전달될 뿐이라 EXCHANGE 안에서 교환해도 main의 X, Y는 10, 20 그대로이다. 정답이다.
      선택지 2: 한쪽 값만 덮어쓴 결과로 이 프로그램과 맞지 않는다.
      선택지 3: 2번과 마찬가지로 나올 수 없는 결과이다.
      선택지 4: 교환이 호출자에게 반영된 참조호출의 결과이다.

      핵심 개념:
      값호출은 실 매개변수의 값을 형식 매개변수에 복사한다.
      형식 매개변수를 바꿔도 복사본만 바뀌므로 호출자 변수에는 영향이 없다.
      그래서 값호출 방식의 EXCHANGE는 main의 변수를 교환하지 못한다.
      교환 결과를 호출자에게 돌려주려면 참조호출이나 포인터 전달이 필요하다.
    tags: [call-by-value, parameter-passing]

  - id: e17-25
    type: multiple-choice
    chapter: 15
    prompt: 한 개체가 두 가지 이상의 개념으로 사용되는 것을 의미하는 용어는?
    choices:
      - { id: '1', text: 별명 }
      - { id: '2', text: 중복정의 }
      - { id: '3', text: 부작용 }
      - { id: '4', text: 포인터 }
    answers: ['2']
    explanation: |
      선택지 1: 별명(alias)은 하나의 기억 장소를 두 개 이상의 이름으로 참조하는 것이다.
      선택지 2: 중복정의(overloading)는 하나의 이름이나 연산자(개체)가 문맥에 따라 두 가지 이상의 의미로 쓰이는 것이므로 정답이다(예: +가 정수 덧셈과 문자열 연결에 모두 쓰임).
      선택지 3: 부작용(side effect)은 함수가 값을 반환하는 것 외에 비지역 변수나 매개변수를 바꾸는 것이다.
      선택지 4: 포인터는 다른 자료의 주소를 값으로 갖는 자료형이다.

      핵심 개념:
      중복정의는 같은 이름의 연산자나 서브프로그램을 매개변수 형이나 개수에 따라 다르게 정의하는 것이다.
      컴파일러는 인수의 형을 보고 어떤 정의를 쓸지 결정한다.
      중복정의는 다형성의 한 형태(임시 다형성)이다.
      별명은 여러 이름이 한 개체를, 중복정의는 한 이름이 여러 개체를 가리킨다는 점에서 반대 개념이다.
    tags: [overloading, polymorphism]
