      배열은 동질형 원소를 위치(첨자)로, 레코드는 이질형 원소를 필드명으로 접근한다.
      C의 struct, Pascal의 record가 레코드에 해당한다.
      공용체는 여러 필드가 같은 기억 장소를 공유한다는 점에서 레코드와 다르다.
