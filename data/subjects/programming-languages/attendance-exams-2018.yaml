questions:
  - id: e18-46
    type: multiple-choice
    chapter: 1
    prompt: 프로그래밍 언어와 거리가 ==먼== 언어는?
    choices:
      - { id: '1', text: C }
      - { id: '2', text: C++ }
      - { id: '3', text: Java }
      - { id: '4', text: Hangul }
    answers: ['4']
    explanation: |
      선택지 1: C는 시스템 프로그래밍에 널리 쓰이는 명령형 프로그래밍 언어이다.
      선택지 2: C++는 C에 객체 지향 기능을 더한 프로그래밍 언어이다.
      선택지 3: Java는 JVM(Java Virtual Machine) 위에서 실행되는 객체 지향 프로그래밍 언어이다.
      선택지 4: Hangul(한글)은 한국어를 적는 문자 체계로, 사람 사이의 의사소통에 쓰이는 자연어 표기이므로 프로그래밍 언어가 아니다. 정답이다.

      핵심 개념:
      프로그래밍 언어는 프로그래머가 컴퓨터에게 작업을 지시하기 위한 형식 언어이다.
      구문과 의미가 엄밀히 정의되어 컴퓨터가 번역·실행할 수 있어야 한다.
      자연어와 그 문자 체계는 모호성이 있어 그대로는 프로그래밍 언어로 쓸 수 없다.
      C, C++, Java는 고급 프로그래밍 언어의 대표적인 예이다.
    tags: [programming-language-definition]

  - id: e18-47
    type: multiple-choice
    chapter: 3
    prompt: 무엇을 하려고 하는가를 선언하듯 기술하는 언어로 기호 논리학에 근거를 둔 프로그래밍 언어는?
    choices:
      - { id: '1', text: 명령형 언어 }
      - { id: '2', text: 함수형 언어 }
      - { id: '3', text: 논리형 언어 }
      - { id: '4', text: 객체 지향 언어 }
    answers: ['3']
    explanation: |
      선택지 1: 명령형 언어는 어떻게 계산할지를 명령의 순서로 기술한다.
      선택지 2: 함수형 언어는 수학의 함수(람다 계산)에 근거하며 함수 적용으로 계산한다.
      선택지 3: 논리형 언어는 기호 논리학(술어 논리)에 근거해 사실과 규칙을 선언하고, 무엇을 원하는지 질의하는 방식으로 기술하므로 정답이다(예: Prolog).
      선택지 4: 객체 지향 언어는 자료와 연산을 묶은 객체에 기반한다.

      핵심 개념:
      논리형 언어는 선언형 언어의 대표이다.
      프로그램은 사실(fact)과 규칙(rule)의 집합이며, 질의(query)에 대해 추론 엔진이 답을 찾는다.
      "어떻게"가 아니라 "무엇을" 기술한다는 점이 명령형 언어와 다르다.
      인공지능, 전문가 시스템, 자연어 처리 분야에서 사용되었다.
    tags: [paradigm, logic-programming]

  - id: e18-48
    type: multiple-choice
    chapter: 2
    prompt: 1950년대 등장한 언어로 레코드 구조를 도입하였고 영어 문장처럼 프로그래밍 하는 언어는?
    choices:
      - { id: '1', text: Fortran }
      - { id: '2', text: COBOL }
      - { id: '3', text: LISP }
      - { id: '4', text: APL }
    answers: ['2']
    explanation: |
      선택지 1: Fortran(1957)은 과학 기술 계산용 최초의 고급 언어로, 수식 표현이 중심이며 레코드 구조를 도입한 언어가 아니다.
      선택지 2: COBOL(1959~1960)은 사무 처리용 언어로 레코드 구조를 도입했고, ADD A TO B처럼 영어 문장과 비슷하게 프로그램을 작성하므로 정답이다.
      선택지 3: LISP(1958)은 리스트 처리 중심의 함수형 언어이다.
      선택지 4: APL(1960년대)은 특수 기호로 배열 연산을 간결하게 표현하는 언어이다.

      핵심 개념:
      1950년대에는 Fortran, LISP, COBOL, Algol 같은 초기 고급 언어가 등장했다.
      Fortran은 과학 계산, COBOL은 사무 처리, LISP은 인공지능·기호 처리, Algol은 알고리즘 기술에 중점을 두었다.
      COBOL은 레코드와 파일 처리 기능이 강하고 영어와 유사한 문법을 가진다.
      Algol은 블록 구조와 BNF(Backus-Naur Form) 구문 정의로 이후 언어에 큰 영향을 주었다.
    tags: [language-history, cobol]

  - id: e18-49
    type: multiple-choice
    chapter: 2
    prompt: 프로그래밍 언어의 설계 기준 중 프로그래머가 언어의 일부만 이해해도 프로그램을 작성할 수 있음을 의미하는 것은?
    choices:
      - { id: '1', text: 효율성 }
      - { id: '2', text: 안전성 }
      - { id: '3', text: 직교성 }
      - { id: '4', text: 부분성 }
    answers: ['4']
    explanation: |
      선택지 1: 효율성은 번역과 실행의 경제성을 뜻한다.
      선택지 2: 안전성은 오류를 줄이고 쉽게 발견하게 하는 성질이다.
      선택지 3: 직교성은 언어 구성 요소를 자유롭게 조합할 수 있고 그 의미가 일관된 성질이다.
      선택지 4: 부분성은 언어 전체를 몰라도 일부만 이해하면 프로그램을 작성할 수 있는 성질이므로 정답이다.

      핵심 개념:
      부분성(subset)은 초보자가 언어의 핵심 부분만 배워도 쓸모 있는 프로그램을 작성할 수 있게 한다.
      언어가 크고 복잡할수록 부분성이 중요해진다.
      다른 설계 기준으로 효율성, 일반성, 직교성, 정확성, 안전성, 표현력, 확장성 등이 있다.
      각 기준의 정의를 핵심 키워드와 연결해 기억한다.
    tags: [design-criteria, subset]

  - id: e18-50
    type: multiple-choice
    chapter: 1
    prompt: 프로그래밍 언어의 구조를 분석하는 단계가 바르게 나열된 것은?
    choices:
      - { id: '1', text: '문자 → 어휘 → 구문' }
      - { id: '2', text: '문자 → 구문 → 어휘' }
      - { id: '3', text: '어휘 → 문자 → 구문' }
      - { id: '4', text: '구문 → 어휘 → 문자' }
    answers: ['1']
    explanation: |
      선택지 1: 가장 작은 단위인 문자를 먼저 읽고, 문자를 모아 어휘(토큰)를 만든 뒤, 어휘의 결합 구조인 구문을 분석하므로 정답이다.
      선택지 2: 어휘를 만들기 전에 구문을 분석할 수는 없다.
      선택지 3: 어휘는 문자로 구성되므로 문자보다 먼저 분석할 수 없다.
      선택지 4: 분석 순서가 완전히 거꾸로 되었다.

      핵심 개념:
      프로그래밍 언어는 문자 → 어휘(토큰) → 구문의 계층 구조를 가진다.
      어휘 분석은 문자열을 토큰으로 나누고, 구문 분석은 토큰이 문법에 맞게 결합되었는지 검사한다.
      컴파일러도 어휘 분석기 → 구문 분석기 순으로 동작한다.
      구문 분석 이후 의미 분석과 코드 생성이 이어진다.
    tags: [lexical-structure, syntax]

  - id: e18-51
    type: multiple-choice
    chapter: 4
    prompt: BNF에 대한 설명으로 ==틀린== 것은?
    choices:
      - { id: '1', text: '<A>는 비단말 기호임' }
      - { id: '2', text: 5는 단말 기호임 }
      - { id: '3', text: '|는 메타 기호로 정의를 의미' }
      - { id: '4', text: '::=의 왼쪽에는 비단말 기호가 옴' }
    answers: ['3']
    explanation: |
      선택지 1: < >로 묶인 <A>는 비단말 기호이므로 옳다.
      선택지 2: 5처럼 그대로 쓰는 기호는 단말 기호이므로 옳다.
      선택지 3: |는 택일(또는)을 뜻하는 메타 기호이다. 정의를 뜻하는 메타 기호는 ::=이므로 틀렸다. 정답이다.
      선택지 4: 생성 규칙의 왼쪽(::= 앞)에는 정의될 비단말 기호가 오므로 옳다.

      핵심 개념:
      BNF 메타 기호 ::=는 정의, |는 택일, < >는 비단말 기호 표시이다.
      생성 규칙은 "비단말 기호 ::= 정의" 형태이다.
      단말 기호는 실제 프로그램에 나타나는 문자열이다.
      비단말 기호는 규칙에 따라 다른 기호열로 치환된다.
    tags: [bnf, meta-symbol]

  - id: e18-52
    type: multiple-choice
    chapter: 4
    prompt: EBNF에 대한 설명으로 바른 것은?
    choices:
      - { id: '1', text: '[A]는 A 혹은 AA를 의미' }
      - { id: '2', text: '{A}는 A 혹은 아무것도 없음을 의미' }
      - { id: '3', text: '(A|B)는 A 혹은 B를 의미' }
      - { id: '4', text: "'A'는 메타 기호를 비단말 기호로 사용함을 의미" }
    answers: ['3']
    explanation: |
      선택지 1: [A]는 A가 없거나 한 번 나타남(선택적 생략)을 뜻한다. AA처럼 두 번 나오지 않는다.
      선택지 2: {A}는 A가 0번 이상 반복됨을 뜻한다. "A 혹은 아무것도 없음"은 [A]의 의미이다.
      선택지 3: (A|B)는 괄호 안에서 A 또는 B 중 하나를 택함을 뜻하므로 정답이다.
      선택지 4: 'A'처럼 따옴표로 묶는 것은 메타 기호로 쓰이는 문자를 단말 기호로 사용함을 뜻한다. 비단말 기호가 아니다.

      핵심 개념:
      EBNF(Extended BNF)는 BNF에 { }(0번 이상 반복), [ ](0번 또는 1번), ( )(그룹 택일)를 추가했다.
      메타 기호와 같은 문자를 단말 기호로 쓰려면 따옴표로 묶는다.
      EBNF를 쓰면 BNF의 재귀 규칙을 짧은 반복 표현으로 바꿀 수 있다.
      EBNF의 각 메타 기호는 구문 도표의 반복·생략·택일 경로에 대응한다.
    tags: [ebnf, meta-symbol]

  - id: e18-53
    type: multiple-choice
    chapter: 4
    prompt: 구문 도표에서 비단말 기호를 표현하는 도형은?
    choices:
      - { id: '1', text: 원 }
      - { id: '2', text: 사각형 }
      - { id: '3', text: 삼각형 }
      - { id: '4', text: 별 }
    answers: ['2']
    explanation: |
      선택지 1: 원(또는 타원)은 구문 도표에서 단말 기호를 표현한다.
      선택지 2: 사각형은 다른 도표로 다시 정의되는 비단말 기호를 표현하므로 정답이다.
      선택지 3: 삼각형은 구문 도표에서 쓰는 도형이 아니다.
      선택지 4: 별도 구문 도표에서 쓰는 도형이 아니다.

      핵심 개념:
      구문 도표는 사각형(비단말 기호), 원·타원(단말 기호), 화살표(흐름)로 구성된다.
      화살표를 따라가며 만나는 기호를 차례로 나열하면 그 구문에 맞는 문장이 된다.
      분기는 택일, 되돌이는 반복, 우회는 생략 가능을 뜻한다.
      구문 도표는 EBNF와 일대일로 대응시킬 수 있다.
    tags: [syntax-diagram, nonterminal]

  - id: e18-54
    type: multiple-choice
    chapter: 4
    prompt: 구문 도표에 대한 설명으로 바른 것은?
    choices:
      - { id: '1', text: 구문에 대한 형식 정의를 하는 방법 }
      - { id: '2', text: BNF와는 대응되지만 EBNF와는 대응이 안됨 }
      - { id: '3', text: 'BNF의 |는 세 갈래의 화살표와 대응' }
      - { id: '4', text: 'EBNF의 [ ]는 반복이 가능한 원형의 화살표와 대응' }
    answers: ['1']
    explanation: |
      선택지 1: 구문 도표는 BNF, EBNF와 함께 구문을 형식적으로 정의하는 방법이므로 정답이다.
      선택지 2: 구문 도표는 반복·선택 경로가 있어 오히려 EBNF와 바로 대응된다.
      선택지 3: |는 대안의 개수만큼 갈라지는 화살표에 대응한다. 항상 세 갈래인 것은 아니다.
      선택지 4: EBNF의 [ ]는 건너뛸 수 있는 우회 경로에 대응한다. 되돌아가는 반복 경로는 { }에 대응한다.

      핵심 개념:
      구문을 정의하는 형식적 방법에는 BNF, EBNF, 구문 도표가 있다.
      구문 도표에서 택일은 갈라지는 경로로 그리며 BNF·EBNF의 |에 대응한다.
      반복은 되돌아가는 경로로 { }에, 생략 가능은 건너뛰는 경로로 [ ]에 대응한다.
      구문 도표는 그림이라 사람이 문법을 직관적으로 이해하기 쉽다.
    tags: [syntax-diagram, ebnf]

  - id: e18-55
    type: multiple-choice
    chapter: 5
    prompt: 파스 트리에 대한 설명으로 바르지 ==않은== 것은?
    choices:
      - { id: '1', text: 주어진 표현에 대해 항상 두 가지 파스 트리가 존재 }
      - { id: '2', text: 단말 노드의 나열이 주어진 표현이 됨 }
      - { id: '3', text: '비단말 기호는 비단말 노드, 단말 기호는 단말 노드로 표현' }
      - { id: '4', text: 주어진 BNF에 의해 어떤 표현이 생성될 수 있는지 확인 가능 }
    answers: ['1']
    explanation: |
      선택지 1: 모호하지 않은 문법에서는 한 표현에 파스 트리가 하나뿐이다. 두 개 이상 존재하는 것은 모호한 문법일 때이므로 "항상 두 가지"는 틀렸다. 정답이다.
      선택지 2: 단말 노드(리프)를 왼쪽부터 나열하면 주어진 표현이 되므로 옳다.
      선택지 3: 비단말 기호는 내부(비단말) 노드로, 단말 기호는 리프(단말) 노드로 나타나므로 옳다.
      선택지 4: 파스 트리를 그릴 수 있으면 그 표현이 문법으로 생성 가능함을 확인할 수 있으므로 옳다.

      핵심 개념:
      파스 트리는 문법에 따른 유도 과정을 트리 구조로 나타낸 것이다.
      루트는 시작 기호, 내부 노드는 비단말 기호, 리프는 단말 기호이다.
      리프를 차례로 읽으면 원래 표현이 된다.
      한 표현에 파스 트리가 둘 이상이면 모호한 문법이며, 이는 예외적인 경우이다.
    tags: [parse-tree, ambiguous-grammar]

  - id: e18-56
    type: multiple-choice
    chapter: 6
    prompt: 중간 코드 실행 기법에 대한 설명으로 바른 것은?
    choices:
      - { id: '1', text: 인터프리트를 먼저 적용한 후 컴파일하여 실행 }
      - { id: '2', text: Java는 중간 코드 실행 기법을 이용 }
      - { id: '3', text: 컴파일 기법의 언어보다 프로그램 실행 속도가 빠름 }
      - { id: '4', text: 운영체제가 바뀌면 컴파일을 다시 해야 함 }
    answers: ['2']
    explanation: |
      선택지 1: 중간 코드 기법은 먼저 컴파일해 중간 코드를 만든 뒤, 그 중간 코드를 인터프리트한다. 순서가 반대이다.
      선택지 2: Java는 소스 코드를 바이트코드(중간 코드)로 컴파일하고 JVM이 이를 해석·실행하므로 정답이다.
      선택지 3: 중간 코드를 실행 시 해석해야 하므로 기계어로 직접 컴파일한 언어보다 일반적으로 느리다.
      선택지 4: 중간 코드는 특정 운영체제·기계에 독립적이라, 해당 환경에 가상 기계만 있으면 다시 컴파일하지 않고 실행할 수 있다.

      핵심 개념:
      언어 구현 방법에는 컴파일 기법, 인터프리트 기법, 중간 코드(혼합) 기법이 있다.
      중간 코드 기법은 컴파일(소스 → 중간 코드)과 인터프리트(중간 코드 실행)를 결합한다.
      Java 바이트코드와 JVM이 대표 예이며 이식성이 높다.
      JIT(Just-In-Time) 컴파일로 자주 쓰는 중간 코드를 기계어로 바꾸어 속도를 보완하기도 한다.
    tags: [intermediate-code, java, language-implementation]

  - id: e18-57
    type: multiple-choice
    chapter: 7
    passageRefs: [g18-binding-time-01]
    prompt: 다음 프로그램 문장에서 각 요소에 대한 바인딩 시간을 바르게 설명한 것은?
    choices:
      - { id: '1', text: '변수 A의 값(13) - 실행 시간' }
      - { id: '2', text: '변수 B의 값(3) - 번역 시간' }
      - { id: '3', text: '상수 10의 진법(10진법) - 실행 시간' }
      - { id: '4', text: '기호 +의 의미(덧셈) - 번역 시간' }
    answers: ['1']
    explanation: |
      선택지 1: 변수 A의 값 13은 A = B + 10이 실제로 실행될 때 정해지므로 실행 시간에 바인딩된다. 정답이다.
      선택지 2: 변수 B의 값 3도 B = B + 2가 실행될 때 정해지므로 실행 시간에 바인딩된다.
      선택지 3: 상수를 10진법으로 해석한다는 규칙은 언어를 정의할 때 정해진다(언어 정의 시간).
      선택지 4: 기호 +가 덧셈을 뜻한다는 것은 언어 정의 시간에 정해진다. 다만 어떤 형의 덧셈인지는 번역 시간에 결정된다.

      핵심 개념:
      바인딩 시간에는 언어 정의 시간, 언어 구현 시간, 번역 시간, 실행 시간 등이 있다.
      연산자 기호의 의미나 상수 표기 규칙은 언어 정의 시간에 정해진다.
      변수의 형은 주로 번역 시간에 정해진다.
      변수의 값은 대입문이 실행되는 실행 시간에 정해진다.
    tags: [binding-time]

  - id: e18-58
    type: multiple-choice
    chapter: 7
    passageRefs: [g18-java-array-01]
    prompt: 다음 문장의 의미로 바른 것은?
    choices:
      - { id: '1', text: 명시적 선언 }
      - { id: '2', text: A는 실수형 }
      - { id: '3', text: A는 함수명 }
      - { id: '4', text: A는 2차원 배열 }
    answers: ['1']
    explanation: |
      선택지 1: int[] A = new int[20];은 A의 형(int 배열)을 선언문으로 직접 밝힌 명시적 선언이므로 정답이다.
      선택지 2: A의 원소형은 int, 즉 정수형이다.
      선택지 3: A는 배열을 가리키는 변수 이름이며 함수명이 아니다.
      선택지 4: int[]는 1차원 배열이다. 2차원 배열은 int[][]로 선언한다.

      핵심 개념:
      명시적 선언은 선언문에 변수의 형을 직접 적는 방식이다.
      Java는 모든 변수를 명시적으로 선언해야 하는 강타입 언어이다.
      new int[20]은 실행 시간에 크기 20인 정수 배열을 힙에 생성해 A에 연결한다.
      선언된 형 정보로 컴파일러는 정적 형 검사를 수행한다.
    tags: [explicit-declaration, java, array]

  - id: e18-59
    type: multiple-choice
    chapter: 12
    prompt: 할당문에 해당하지 ==않는== 것은?
    choices:
      - { id: '1', text: 'A /= B' }
      - { id: '2', text: 'A *= B' }
      - { id: '3', text: 'A != B' }
      - { id: '4', text: 'A++' }
    answers: ['3']
    explanation: |
      선택지 1: A /= B는 A = A / B를 줄인 복합 할당문이다.
      선택지 2: A *= B는 A = A * B를 줄인 복합 할당문이다.
      선택지 3: A != B는 A와 B가 다른지 비교하는 관계 연산이며 값을 저장하지 않으므로 할당문이 아니다. 정답이다.
      선택지 4: A++는 A = A + 1과 같은 효과를 갖는 증가 할당이다.

      핵심 개념:
      할당문은 계산 결과를 변수에 저장하는 문장이다.
      복합 할당 연산자(+=, -=, *=, /=)와 증감 연산자(++, --)도 할당 효과를 가진다.
      !=, ==, <, > 등은 비교 결과를 만드는 관계 연산자이다.
      != 는 모양이 복합 할당 연산자와 비슷해 혼동하기 쉬우므로 주의한다.
    tags: [assignment-statement]

  - id: e18-60
    type: multiple-choice
    chapter: 12
    prompt: 제어문과 그 설명이 바르게 연결된 것은?
    choices:
      - { id: '1', text: 'if - 반복문' }
      - { id: '2', text: 'for - 조건문' }
      - { id: '3', text: 'repeat - 조건문' }
      - { id: '4', text: 'while - 반복문' }
    answers: ['4']
    explanation: |
      선택지 1: if는 조건에 따라 실행할 부분을 고르는 조건문이다.
      선택지 2: for는 정해진 범위나 조건만큼 반복하는 반복문이다.
      선택지 3: repeat(repeat-until)는 조건이 참이 될 때까지 반복하는 반복문이다.
      선택지 4: while은 조건이 참인 동안 문장을 반복 실행하는 반복문이므로 정답이다.

      핵심 개념:
      제어문은 프로그램의 실행 흐름을 바꾸는 문장이다.
      조건문: if, case/switch.
      반복문: for, while, do-while, repeat-until.
      while은 조건을 먼저 검사하고, repeat-until과 do-while은 본문을 먼저 실행한 뒤 조건을 검사한다.
    tags: [control-statement, loop]
