    answers: ['1']
    explanation: |
      선택지 1: 인터프리트 기법은 고급 언어 프로그램을 기계어로 따로 번역해 두지 않고 문장을 읽는 대로 직접 실행하므로 정답이다.
      선택지 2: 인터프리트 기법은 실행할 때마다 해석하므로 느리다. 실행 시간이 중요하면 컴파일 기법이 적합하다.
      선택지 3: 한 번 번역한 목적 코드를 재사용하는 것은 컴파일 기법의 장점이다.
      선택지 4: 기계어로 번역한 후 실행하는 것은 컴파일 기법이다.

      핵심 개념:
      언어 구현 방법에는 컴파일 기법, 인터프리트 기법, 중간 코드(혼합) 기법이 있다.
      컴파일 기법은 전체를 기계어로 번역해 실행 속도가 빠르다.
      인터프리트 기법은 번역 없이 직접 실행하여 유연하고 디버깅이 쉽지만 느리다.
      Java처럼 중간 코드(바이트코드)로 번역한 뒤 가상 기계가 실행하는 혼합 방식도 있다.
    tags: [interpreter, language-implementation]

