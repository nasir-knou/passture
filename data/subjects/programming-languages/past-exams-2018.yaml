questions:
  - id: e18-01
    type: multiple-choice
    chapter: 1
    prompt: 프로그래밍 언어에 대한 설명으로 가장 적절한 것은?
    choices:
      - { id: '1', text: 컴퓨터와 사람이 모두 읽을 수 있는 언어 }
      - { id: '2', text: 'C, Java 뿐만 아니라 한국어, 영어도 해당' }
      - { id: '3', text: 프로그래머가 사용자에게 의사를 전달하는 방법 }
      - { id: '4', text: 오랜 시간을 통해 형성된 비형식적인 표현 방법 }
    answers: ['1']
    explanation: |
      선택지 1: 프로그래밍 언어는 사람이 작성하고 읽을 수 있으면서 컴퓨터도 해석·실행할 수 있는 언어이므로 정답이다.
      선택지 2: 한국어, 영어는 자연어이다. 프로그래밍 언어는 C, Java처럼 컴퓨터가 처리하도록 형식이 정해진 인공 언어이다.
      선택지 3: 프로그래밍 언어는 프로그래머가 컴퓨터에게 의사(명령)를 전달하는 수단이다. 전달 대상이 사용자가 아니다.
      선택지 4: 오랜 시간 자연스럽게 형성된 비형식적 표현은 자연어의 특징이다. 프로그래밍 언어는 구문과 의미가 엄밀하게 정의된 형식 언어이다.

      핵심 개념:
      프로그래밍 언어는 사람과 컴퓨터가 모두 이해할 수 있도록 설계된 형식 언어이다.
      프로그래머의 의도를 컴퓨터에게 전달하고, 다른 프로그래머와도 의사소통하게 한다.
      자연어와 달리 모호성이 없도록 구문과 의미를 엄밀히 정의한다.
      기계어·어셈블리어 같은 저급 언어와 C, Java 같은 고급 언어로 나눌 수 있다.
    tags: [programming-language-definition]

  - id: e18-02
    type: multiple-choice
    chapter: 3
    prompt: 다음 중 객체 지향 언어의 개념을 설명한 것은?
    choices:
      - { id: '1', text: 순차적 명령의 수행을 기본 개념으로 하는 언어 }
      - { id: '2', text: 무엇을 하려고 하는가를 선언하듯 기술하는 언어 }
      - { id: '3', text: 자료형과 연산으로 이루어지는 객체에 기반하는 언어 }
      - { id: '4', text: 알려진 값들을 함수에 적용하는 방식으로 프로그램을 기술하는 언어 }
    answers: ['3']
    explanation: |
      선택지 1: 순차적 명령 수행을 기본으로 하는 것은 명령형(절차형) 언어이다.
      선택지 2: 무엇을 하려는지 선언하듯 기술하는 것은 논리형(선언형) 언어이다.
      선택지 3: 객체 지향 언어는 데이터(자료형)와 그 데이터를 다루는 연산을 하나로 묶은 객체를 기반으로 프로그램을 구성하므로 정답이다.
      선택지 4: 값들을 함수에 적용하는 방식으로 프로그램을 기술하는 것은 함수형 언어이다.

      핵심 개념:
      프로그래밍 언어 패러다임은 명령형, 함수형, 논리형, 객체 지향으로 구분한다.
      명령형은 상태를 바꾸는 명령의 순차 실행, 함수형은 함수 적용과 합성이 중심이다.
      논리형은 사실과 규칙을 선언하고 질의로 답을 구한다(예: Prolog).
      객체 지향은 데이터와 연산을 묶은 객체와 클래스, 상속, 다형성을 핵심으로 한다.
    tags: [paradigm, object-oriented]

  - id: e18-03
    type: multiple-choice
    chapter: 2
    prompt: 프로그래밍 언어의 설계기준 중 프로그래밍 언어가 복잡한 과정이나 구조를 표현하는데 용이함을 의미하는 것은?
    choices:
      - { id: '1', text: 일반성 }
      - { id: '2', text: 확장성 }
      - { id: '3', text: 표현력 }
      - { id: '4', text: 부분성 }
    answers: ['3']
    explanation: |
      선택지 1: 일반성은 특별한 경우를 따로 두지 않고 관련 개념을 하나로 일반화해 적용할 수 있는 성질이다.
      선택지 2: 확장성은 사용자가 언어에 새로운 기능(자료형, 연산 등)을 추가할 수 있는 성질이다.
      선택지 3: 표현력은 복잡한 과정이나 구조를 쉽고 간결하게 표현할 수 있는 정도를 뜻하므로 정답이다.
      선택지 4: 부분성은 언어의 일부만 이해해도 프로그램을 작성할 수 있는 성질이다.

      핵심 개념:
      프로그래밍 언어의 설계(평가) 기준에는 효율성, 일반성, 직교성, 정확성, 안전성, 표현력, 확장성, 부분성 등이 있다.
      표현력은 복잡한 계산을 자연스럽게 나타낼 수 있는지를 본다.
      일반성과 직교성은 규칙이 예외 없이 일관되게 조합되는지를 본다.
      부분성은 초보자가 언어의 일부만으로도 프로그래밍할 수 있게 한다.
    tags: [design-criteria, expressiveness]

  - id: e18-04
    type: multiple-choice
    chapter: 1
    passageRefs: [g18-declaration-start-01]
    prompt: 다음 선언문에서 식별자 start의 세 번째 글자 'a'에 대한 설명으로 가장 올바른 것은?
    choices:
      - { id: '1', text: 문자 }
      - { id: '2', text: 토큰 }
      - { id: '3', text: 예약어 }
      - { id: '4', text: 미리 정의된 식별자 }
    answers: ['1']
    explanation: |
      선택지 1: start 안의 a는 프로그램을 이루는 가장 작은 단위인 문자이므로 정답이다.
      선택지 2: 토큰은 문자들이 모여 의미를 갖는 최소 단위로, 이 문장에서는 int, start, ;가 토큰이다. a 한 글자는 토큰이 아니다.
      선택지 3: 예약어는 int처럼 언어가 특별한 의미로 미리 정해 둔 단어이다.
      선택지 4: 미리 정의된 식별자는 printf처럼 언어나 라이브러리가 미리 의미를 부여해 둔 이름이다.

      핵심 개념:
      프로그래밍 언어의 구조는 문자 → 어휘(토큰) → 구문 순으로 쌓인다.
      문자는 알파벳, 숫자, 특수 문자 같은 가장 작은 단위이다.
      토큰은 문자를 모아 만든 의미 단위로 예약어, 식별자, 상수, 연산자, 구분자 등이 있다.
      구문은 토큰을 결합해 문장을 만드는 규칙이다.
    tags: [character, token, lexical-structure]

  - id: e18-05
    type: multiple-choice
    chapter: 4
    passageRefs: [g18-bnf-digit-01]
    prompt: 비단말 기호는?
    choices:
      - { id: '1', text: '<digit>' }
      - { id: '2', text: '4' }
      - { id: '3', text: '|' }
      - { id: '4', text: '::=' }
    answers: ['1']
    explanation: |
      선택지 1: < >로 묶인 <digit>은 다른 기호들로 정의되는 비단말 기호이므로 정답이다.
      선택지 2: 4는 더 이상 다른 기호로 바뀌지 않는 단말 기호이다.
      선택지 3: |는 "또는"을 뜻하는 메타 기호이다.
      선택지 4: ::=는 "정의한다"를 뜻하는 메타 기호이다.

      핵심 개념:
      BNF(Backus-Naur Form)는 단말 기호, 비단말 기호, 메타 기호로 구문을 정의한다.
      비단말 기호는 < >로 묶어 표시하며 생성 규칙의 왼쪽에 와서 정의된다.
      단말 기호는 실제 프로그램에 나타나는 문자열(숫자, 예약어 등)이다.
      메타 기호 ::=는 정의, |는 선택(택일)을 나타낸다.
    tags: [bnf, nonterminal]

  - id: e18-06
    type: multiple-choice
    chapter: 4
    passageRefs: [g18-bnf-digit-01]
    prompt: 단말 기호는?
    choices:
      - { id: '1', text: '<digit>' }
      - { id: '2', text: '4' }
      - { id: '3', text: '|' }
      - { id: '4', text: '::=' }
    answers: ['2']
    explanation: |
      선택지 1: <digit>은 < >로 묶인 비단말 기호이다.
      선택지 2: 4는 프로그램에 그대로 나타나는 기호로 더 이상 치환되지 않는 단말 기호이므로 정답이다.
      선택지 3: |는 택일을 나타내는 메타 기호이다.
      선택지 4: ::=는 정의를 나타내는 메타 기호이다.

      핵심 개념:
      단말 기호는 문법이 최종적으로 만들어 내는 실제 문자열이다.
      비단말 기호는 생성 규칙으로 계속 치환되는 중간 기호이다.
      메타 기호는 문법 자체를 기술하기 위한 기호로 프로그램에는 나타나지 않는다.
      <digit> ::= 0 | 1 | 2 | 3 | 4에서 0~4가 단말 기호이다.
    tags: [bnf, terminal]

  - id: e18-07
    type: multiple-choice
    chapter: 4
    prompt: BNF가 EBNF로 확장되면서 추가된 메타 기호는?
    choices:
      - { id: '1', text: '::=' }
      - { id: '2', text: '{ }' }
      - { id: '3', text: '< >' }
      - { id: '4', text: '|' }
    answers: ['2']
    explanation: |
      선택지 1: ::=는 BNF에 원래 있던 정의 메타 기호이다.
      선택지 2: { }는 0번 이상 반복을 나타내기 위해 EBNF(Extended BNF)에서 추가된 메타 기호이므로 정답이다.
      선택지 3: < >는 BNF에서 비단말 기호를 묶는 메타 기호이다.
      선택지 4: |는 BNF에서 택일을 나타내는 메타 기호이다.

      핵심 개념:
      EBNF(Extended BNF)는 BNF를 간결하게 만들기 위해 메타 기호를 추가했다.
      { }는 반복(0번 이상), [ ]는 선택(0번 또는 1번), ( )는 그룹 안의 택일을 뜻한다.
      BNF에서는 반복을 재귀 규칙으로 써야 했지만 EBNF에서는 { }로 짧게 쓴다.
      EBNF에서 메타 기호 문자를 단말 기호로 쓰려면 '{'처럼 따옴표로 묶는다.
    tags: [ebnf, meta-symbol]

  - id: e18-08
    type: multiple-choice
    chapter: 4
    passageRefs: [g18-syntax-diagram-ex-01]
    prompt: 다음 구문 도표를 EBNF로 올바르게 표현한 것은?
    choices:
      - { id: '1', text: '<ex> ::= 0 | ( ex1 )' }
      - { id: '2', text: '<ex> ::= 0 | ( <ex1> )' }
      - { id: '3', text: '<ex> ::= <0> | ( ex1 )' }
      - { id: '4', text: "<ex> ::= 0 | '(' <ex1> ')'" }
    answers: ['4']
    explanation: |
      선택지 1: ex1은 사각형으로 그려진 비단말 기호이므로 <ex1>로 써야 한다. 또 괄호가 따옴표 없이 쓰여 EBNF 그룹 메타 기호로 해석된다.
      선택지 2: <ex1>은 맞지만, 원으로 그려진 ( )는 단말 기호이다. EBNF에서 ( )는 그룹 메타 기호이므로 단말 기호로 쓰려면 따옴표로 묶어야 한다.
      선택지 3: 0은 원으로 그려진 단말 기호이므로 <0>처럼 비단말로 쓰면 안 된다.
      선택지 4: 0 또는 단말 기호 '(' 다음 비단말 <ex1> 다음 단말 기호 ')'로, 도표의 두 갈래를 정확히 표현하므로 정답이다.

      핵심 개념:
      구문 도표에서 원(타원)은 단말 기호, 사각형은 비단말 기호, 갈라지는 화살표는 택일을 뜻한다.
      택일은 EBNF에서 |로 표현한다.
      EBNF에서 { } [ ] ( ) |는 메타 기호이므로, 같은 문자를 단말 기호로 쓰려면 따옴표로 구분한다.
      구문 도표를 EBNF로 옮길 때는 각 도형의 종류와 경로를 차례로 읽는다.
    tags: [syntax-diagram, ebnf]

  - id: e18-09
    type: multiple-choice
    chapter: 5
    prompt: 모호한 문법에 대한 설명으로 바른 것은?
    choices:
      - { id: '1', text: 다른 표현에 대해 같은 파스 트리가 만들어지는 문법 }
      - { id: '2', text: 다른 표현에 대해 서로 다른 파스 트리가 만들어지는 문법 }
      - { id: '3', text: 동일 표현에 대해 같은 파스 트리가 만들어지는 문법 }
      - { id: '4', text: 동일 표현에 대해 서로 다른 파스 트리가 만들어지는 문법 }
    answers: ['4']
    explanation: |
      선택지 1: 파스 트리의 리프를 읽으면 표현이 정해지므로 다른 표현이 같은 파스 트리를 가질 수 없다.
      선택지 2: 다른 표현이 서로 다른 파스 트리를 갖는 것은 당연한 일로 모호성과 관계없다.
      선택지 3: 같은 표현에 파스 트리가 하나로 정해지는 것은 모호하지 않은 문법이다.
      선택지 4: 하나의 표현에 대해 서로 다른 파스 트리가 두 개 이상 만들어지면 모호한 문법이므로 정답이다.

      핵심 개념:
      모호한 문법은 같은 문장에 대해 여러 파스 트리(유도 방법)가 존재하는 문법이다.
      파스 트리가 다르면 연산 순서나 else의 소속 같은 의미가 달라진다.
      연산자 우선순위와 결합 규칙을 문법에 반영하면 수식의 모호성을 없앨 수 있다.
      프로그래밍 언어의 문법은 모호하지 않도록 설계해야 한다.
    tags: [ambiguous-grammar, parse-tree]

  - id: e18-10
    type: multiple-choice
    chapter: 5
    prompt: 다음 다양한 언어의 조건문 중 A에 1이 할당되는 것은 무엇인가?
    choices:
      - { id: '1', text: 'Pascal : if 5>3 then if 5>7 then A=2 else A=1' }
      - { id: '2', text: 'Pascal : if 5>3 then if 5>7 then A=2 else else A=1' }
      - { id: '3', text: 'Algol68: if 5>3 then if 5>7 then A=2 fi else A=1 fi' }
      - { id: '4', text: 'Algol60: if 5>3 then begin if 5>7 then A=2 end else A=1' }
    answers: ['1']
    explanation: |
      선택지 1: Pascal은 else를 짝이 없는 가장 가까운 if(if 5>7)에 연결한다. 5>3이 참이라 안쪽 if를 실행하고, 5>7이 거짓이므로 else 쪽 A=1이 실행된다. 정답이다.
      선택지 2: else가 연속으로 두 번 나오는 형태는 Pascal 문법에 맞지 않는 문장이다.
      선택지 3: fi로 안쪽 if가 먼저 닫혔으므로 else A=1은 바깥 if 5>3에 속한다. 5>3이 참이라 else가 실행되지 않고, 안쪽 5>7도 거짓이라 A에는 아무것도 할당되지 않는다.
      선택지 4: begin-end로 안쪽 if를 묶었으므로 else는 바깥 if에 속한다. 결과는 3번과 같이 A에 할당되지 않는다.

      핵심 개념:
      중첩 if문에서 else가 어느 if에 속하는지 모호해지는 문제를 dangling else라고 한다.
      Pascal, C 등은 가장 가까운 짝 없는 if에 else를 연결하는 규칙을 쓴다.
      Algol68은 fi 같은 종결 키워드로, Algol60은 begin-end 블록으로 if의 범위를 명시한다.
      if의 범위가 달라지면 같은 조건이라도 실행되는 문장이 달라진다.
    tags: [dangling-else, conditional-statement]

