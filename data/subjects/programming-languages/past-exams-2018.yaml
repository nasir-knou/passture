      선택지 2: 레코드는 서로 다른 형의 원소를 이름(필드명)으로 구별해 묶은 집합체이다.
      선택지 3: 포인터는 다른 변수의 주소를 값으로 갖는 형으로 자료의 집합체가 아니다.
      선택지 4: 연상배열은 원소를 순서가 아닌 키로 접근하는 순서 없는 집합체이므로 정답이다(예: 해시, 딕셔너리).

