  - id: e18-13
    type: multiple-choice
    chapter: 7
    prompt: 바인딩 시간과 예시가 바르게 짝지어진 것은?
    choices:
      - { id: '1', text: '언어의 정의 시간 - 레코드의 각 항목의 형 확정' }
      - { id: '2', text: '언어의 구현 시간 - 수의 기계 내에서의 표기법 확정' }
      - { id: '3', text: '번역 시간 - 변수의 값 확정' }
      - { id: '4', text: '실행 시간 - 정수의 자릿수 확정' }
    answers: ['2']
    explanation: |
      선택지 1: 레코드 각 항목의 형은 프로그램을 번역할 때 선언을 보고 정해지므로 번역 시간에 해당한다.
      선택지 2: 정수·실수가 기계 안에서 어떤 비트 표기법으로 표현될지는 언어를 특정 기계에 구현할 때 정해지므로 정답이다.
      선택지 3: 변수의 값은 대입문이 실행될 때 정해지므로 실행 시간에 해당한다.
      선택지 4: 정수의 자릿수(표현 범위)는 언어 구현 시간에 기계의 워드 크기 등에 맞춰 정해진다.

      핵심 개념:
      바인딩 시간은 언어 정의 시간, 언어 구현 시간, 번역(컴파일) 시간, 링크·적재 시간, 실행 시간으로 나눈다.
      언어 정의 시간에는 허용되는 자료형의 종류와 연산자 기호의 의미 등이 정해진다.
      언어 구현 시간에는 수의 기계 내부 표현과 정수 자릿수 같은 구현 세부가 정해진다.
      번역 시간에는 변수의 형이, 실행 시간에는 변수의 값이 정해진다.
    tags: [binding-time]

  - id: e18-14
    type: multiple-choice
    chapter: 7
    prompt: 명시적 선언을 통해 얻을 수 있는 이점은?
    choices:
      - { id: '1', text: 동적 형 검사가 가능해짐 }
      - { id: '2', text: 정적 바인딩을 제공할 수 있음 }
      - { id: '3', text: '자료형의 표현 범위가 넓어짐(2바이트 → 4바이트)' }
      - { id: '4', text: 한 변수가 동시에 다양한 자료형을 표현할 수 있음 }
    answers: ['2']
    explanation: |
      선택지 1: 명시적 선언을 하면 번역 시간에 형을 알 수 있어 정적 형 검사가 가능해진다. 동적 형 검사는 실행 중에 하는 검사이다.
      선택지 2: 선언문으로 변수의 형을 미리 밝히면 번역 시간에 형을 바인딩(정적 바인딩)할 수 있으므로 정답이다.
      선택지 3: 자료형의 표현 범위는 형의 종류와 구현에 따라 정해지며 선언 방식과는 관계없다.
      선택지 4: 명시적 선언은 변수의 형을 하나로 고정한다. 여러 형을 표현하는 것은 오히려 동적 바인딩의 특징이다.

      핵심 개념:
      선언은 변수의 이름과 속성(형 등)을 번역기에 알려 주는 문장이다.
      명시적 선언은 선언문으로 형을 직접 적고, 묵시적 선언은 이름 규칙 등으로 형을 정한다.
      선언이 있으면 번역 시간에 형이 정해져 정적 바인딩과 정적 형 검사가 가능하다.
      정적 형 검사는 오류를 실행 전에 발견하고 효율적인 코드를 생성하게 한다.
    tags: [explicit-declaration, static-binding]

  - id: e18-15
    type: multiple-choice
    chapter: 12
    prompt: 다음 중 할당문에 해당하는 것은?
    choices:
      - { id: '1', text: 'K == J' }
      - { id: '2', text: 'K <= J' }
      - { id: '3', text: 'K += J' }
      - { id: '4', text: 'K - J' }
    answers: ['3']
    explanation: |
      선택지 1: K == J는 두 값이 같은지 비교하는 관계 연산이다.
      선택지 2: K <= J는 K가 J 이하인지 비교하는 관계 연산이다.
      선택지 3: K += J는 K = K + J를 줄인 복합 할당문으로, 계산 결과를 K에 저장하므로 정답이다.
      선택지 4: K - J는 값을 계산하는 산술 수식일 뿐 결과를 저장하지 않는다.

      핵심 개념:
      할당문(대입문)은 수식의 값을 변수에 저장하는 문장이다.
      =, +=, -=, *=, /= 같은 할당 연산자가 있고 ++, --도 할당 효과를 가진다.
      ==, <=, != 등은 비교 결과(참/거짓)를 만드는 관계 연산자이다.
      할당 여부는 연산 결과가 변수에 저장되는지로 판단한다.
    tags: [assignment-statement]

  - id: e18-16
    type: multiple-choice
    chapter: 10
    prompt: '열우선 프로그래밍 언어에서 선언된 2차원 배열 M(1:2, 1:2)이 기억장소에 저장되는 순서로 올바른 것은?'
    choices:
      - { id: '1', text: 'M[1][1] M[2][1] M[1][2] M[2][2]' }
      - { id: '2', text: 'M[1][1] M[2][1] M[2][2] M[1][2]' }
      - { id: '3', text: 'M[1][1] M[1][2] M[2][1] M[2][2]' }
      - { id: '4', text: 'M[1][1] M[1][2] M[2][2] M[2][1]' }
    answers: ['1']
    explanation: |
      선택지 1: 열우선 저장은 한 열의 원소를 모두 저장한 뒤 다음 열로 넘어간다. 1열의 M[1][1], M[2][1] 다음에 2열의 M[1][2], M[2][2]가 오므로 정답이다.
      선택지 2: 2열에서 행 순서가 뒤바뀌어 규칙적인 저장 순서가 아니다.
      선택지 3: 한 행을 먼저 저장하는 행우선 순서이다(C, Pascal 방식).
      선택지 4: 행과 열의 순서가 섞여 있어 어느 규칙에도 맞지 않는다.

      핵심 개념:
      다차원 배열은 1차원 기억장소에 행우선 또는 열우선으로 저장된다.
      행우선(row-major)은 첫 번째 첨자가 가장 느리게 변하며 C, Pascal이 사용한다.
      열우선(column-major)은 첫 번째 첨자가 가장 빠르게 변하며 Fortran이 사용한다.
      저장 순서를 알면 원소의 주소를 계산 공식으로 구할 수 있다.
    tags: [array, column-major]

