      선택지 2: 묵시적 형 변환은 프로그래머가 따로 적지 않아도 컴파일러가 자동으로 수행하므로 정답이다.
      선택지 3: A와 B가 모두 실수형이면 형이 같아 변환이 필요 없다.
      선택지 4: 명시적 형 변환은 프로그래머가 (int)처럼 변환할 형을 직접 명시하는 것이다.

      핵심 개념:
      형 변환은 한 형의 값을 다른 형의 값으로 바꾸는 것이다.
      묵시적 형 변환(coercion)은 서로 다른 형이 섞인 연산이나 대입에서 컴파일러가 자동으로 수행한다.
      명시적 형 변환(cast)은 프로그래머가 변환할 형을 직접 지정한다.
      묵시적 변환은 주로 정보 손실이 없는 확대 변환으로 일어난다.
    tags: [type-conversion, implicit-conversion]

  - id: e18-19
    type: multiple-choice
    chapter: 8
    prompt: Java에서의 영역에 대한 설명으로 바른 것은?
    choices:
      - { id: '1', text: 전역변수 선언은 COMMON 문을 사용 }
      - { id: '2', text: BEGIN-END 그룹을 도입 }
      - { id: '3', text: 변수 정의는 어느 부분에서도 나타날 수 있음 }
      - { id: '4', text: 모든 변수를 명시적으로 선언하지 않아도 됨 }
    answers: ['3']
    explanation: |
      선택지 1: COMMON 문으로 전역 공유 영역을 선언하는 것은 Fortran의 방식이다.
      선택지 2: BEGIN-END로 블록을 만드는 것은 Algol, Pascal 계열의 방식이다. Java는 { }로 블록을 만든다.
      선택지 3: Java에서는 블록 안 어느 위치에서든 변수를 정의할 수 있고, 그 변수의 영역은 정의된 곳부터 블록 끝까지이다. 정답이다.
      선택지 4: Java는 모든 변수를 사용 전에 형과 함께 명시적으로 선언해야 한다.

      핵심 개념:
      영역(scope)은 이름이 유효한 프로그램 범위이다.
      Fortran은 COMMON 문, Algol·Pascal은 begin-end 블록으로 영역을 구성한다.
      C, C++, Java는 { } 블록을 사용하며 Java는 블록 내 어디서든 변수 정의를 허용한다.
      Java의 지역 변수 영역은 선언 위치부터 해당 블록의 끝까지이다.
    tags: [scope, java]

  - id: e18-20
    type: multiple-choice
    chapter: 14
    prompt: 정적 기억장소 할당에 대한 설명으로 바른 것은?
    choices:
      - { id: '1', text: 실행 중 배열의 크기 변화 가능 }
      - { id: '2', text: 단순하여 쉽게 구현 가능 }
      - { id: '3', text: 재귀호출이 허용됨 }
      - { id: '4', text: 프로그래밍 언어에 대한 유연성이 많음 }
    answers: ['2']
    explanation: |
      선택지 1: 정적 할당은 실행 전에 크기가 정해지므로 실행 중 배열 크기를 바꿀 수 없다.
      선택지 2: 정적 할당은 번역 시간에 모든 기억 장소의 위치와 크기를 정하므로 구조가 단순하고 구현이 쉽다. 정답이다.
      선택지 3: 서브프로그램마다 활성 레코드가 하나로 고정되므로 재귀 호출을 허용할 수 없다.
      선택지 4: 크기와 개수가 고정되어 유연성이 적다. 유연성은 동적(스택·힙) 할당의 장점이다.

      핵심 개념:
      기억장소 할당은 정적 할당, 스택 기반 할당, 힙 기반 동적 할당으로 나뉜다.
      정적 할당은 실행 전에 모든 변수의 기억 장소를 고정 배정한다(예: 초기 Fortran).
      구현이 단순하고 접근이 빠르지만 재귀 호출과 가변 크기 자료를 지원하지 못한다.
      스택 기반 할당은 호출마다 활성 레코드를 만들어 재귀 호출을 지원한다.
    tags: [static-allocation, storage-allocation]

  - id: e18-21
    type: multiple-choice
    chapter: 7
    prompt: 변수의 종류와 사용하는 기억장소가 바르게 짝지어진 것은?
    choices:
      - { id: '1', text: '힙 - 준정적 변수, 준동적 변수' }
      - { id: '2', text: '힙 - 준정적 변수, 동적 변수' }
      - { id: '3', text: '스택 - 동적 변수' }
      - { id: '4', text: '스택 - 준동적 변수' }
    answers: ['4']
    explanation: |
      선택지 1: 준정적 변수와 준동적 변수는 서브프로그램이 활성화될 때 스택에 할당된다. 힙이 아니다.
      선택지 2: 동적 변수는 힙에 할당되지만, 준정적 변수는 스택에 할당된다.
      선택지 3: 동적 변수는 실행 중 명령(new, malloc 등)으로 생성되어 힙에 할당된다.
      선택지 4: 준동적 변수는 활성화될 때마다 크기가 정해져 스택에 할당되므로 정답이다.

      핵심 개념:
      변수는 기억장소 할당 시점과 위치에 따라 정적, 준정적, 준동적, 동적 변수로 나뉜다.
      정적 변수는 실행 전에 고정 영역에 할당된다.
      준정적 변수(크기 고정)와 준동적 변수(활성화 시 크기 결정)는 서브프로그램 활성화 때 스택에 할당된다.
      동적 변수는 실행 중 명시적 할당 명령으로 힙에 생성된다.
    tags: [storage-binding, stack, heap]

  - id: e18-22
    type: multiple-choice
    chapter: 14
    prompt: 비지역 변수 참조 방법에 대한 설명으로 바른 것은?
    choices:
      - { id: '1', text: 정적 체인 사용 기법은 검색 시간이 짧아 많이 사용함 }
      - { id: '2', text: 디스플레이 사용 기법은 지역 변수들의 사용이 증가할 경우 매력적 }
      - { id: '3', text: 정적 체인 사용 기법은 모든 활성화 레코드에 정적 링크를 할당 }
      - { id: '4', text: 디스플레이 사용 기법은 비지역 변수에 따라 참조 시간이 다름 }
    answers: ['3']
    explanation: |
      선택지 1: 정적 체인 기법은 선언된 블록까지 정적 링크를 여러 번 따라가야 하므로 중첩이 깊으면 검색 시간이 길어진다.
      선택지 2: 디스플레이 기법이 유리한 경우는 지역 변수가 아니라 비지역 변수 참조가 많아질 때이다.
      선택지 3: 정적 체인 기법은 각 활성화 레코드에 자신을 감싼 블록의 활성화 레코드를 가리키는 정적 링크를 둔다. 정답이다.
      선택지 4: 디스플레이 기법은 디스플레이 배열로 해당 블록에 바로 접근하므로 어떤 비지역 변수든 참조 시간이 같다.

      핵심 개념:
      정적 영역 규칙에서 비지역 변수는 정적 체인이나 디스플레이로 찾는다.
      정적 체인은 활성화 레코드마다 정적 링크를 두고 체인 변위만큼 링크를 따라간다.
      디스플레이는 중첩 수준별 활성화 레코드 주소를 1차원 배열에 저장해 한 번에 접근한다.
      비지역 참조가 많으면 디스플레이가, 호출이 잦으면 유지 비용이 적은 정적 체인이 유리하다.
    tags: [static-chain, display, nonlocal-variable]

  - id: e18-23
    type: multiple-choice
    chapter: 13
    passageRefs: [g18-swap-01]
    prompt: 변수명과 매개변수의 종류가 바르게 짝지어진 것은?
    choices:
      - { id: '1', text: 'a, b - 실 매개변수' }
      - { id: '2', text: 'a, X - 실 매개변수' }
      - { id: '3', text: 'X, Y - 실 매개변수' }
      - { id: '4', text: 'TEMP - 형식 매개변수' }
    answers: ['3']
    explanation: |
      선택지 1: a, b는 SWAP의 정의에 적힌 매개변수이므로 형식 매개변수이다.
      선택지 2: X는 실 매개변수지만 a는 형식 매개변수라 짝이 틀렸다.
      선택지 3: X, Y는 main에서 SWAP(X, Y)를 호출할 때 실제로 넘기는 값이므로 실 매개변수이다. 정답이다.
      선택지 4: TEMP는 SWAP 안에서 선언한 지역 변수이며 매개변수가 아니다.

      핵심 개념:
      형식 매개변수는 서브프로그램 정의부에 적혀 전달받을 값을 대신하는 이름이다.
      실 매개변수(인수)는 호출문에서 실제로 전달하는 식이나 변수이다.
      호출 시 실 매개변수와 형식 매개변수가 순서대로 대응된다.
      서브프로그램 내부에서 따로 선언한 변수는 지역 변수이다.
    tags: [formal-parameter, actual-parameter]

  - id: e18-24
    type: multiple-choice
    chapter: 13
    passageRefs: [g18-swap-01]
    prompt: 값호출을 사용하는 프로그래밍 언어에서 위 프로그램의 출력 결과는 무엇인가?
    choices:
      - { id: '1', text: '3 3' }
      - { id: '2', text: '7 7' }
      - { id: '3', text: '3 7' }
      - { id: '4', text: '7 3' }
    answers: ['4']
    explanation: |
      선택지 1: 두 변수가 같은 값이 되는 경우는 교환 과정이 잘못되었을 때로, 이 프로그램과 맞지 않는다.
      선택지 2: 1번과 마찬가지로 이 프로그램으로는 나올 수 없는 결과이다.
      선택지 3: X와 Y가 실제로 교환된 결과로, 참조 호출일 때의 출력이다.
      선택지 4: 값호출에서는 X, Y의 값이 a, b에 복사될 뿐이라 SWAP 안에서 a, b를 바꿔도 X, Y는 그대로 7, 3이다. 정답이다.

      핵심 개념:
      값호출(call by value)은 실 매개변수의 값을 형식 매개변수에 복사한다.
      서브프로그램 안의 변경은 복사본에만 적용되어 호출한 쪽 변수에 영향을 주지 않는다.
      그래서 값호출로 작성한 SWAP은 호출한 쪽의 두 변수를 교환하지 못한다.
      호출한 쪽 변수를 바꾸려면 참조호출이 필요하다.
    tags: [call-by-value, parameter-passing]

  - id: e18-25
    type: multiple-choice
    chapter: 13
    passageRefs: [g18-swap-01]
    prompt: 참조호출을 사용하는 프로그래밍 언어에서 위 프로그램의 출력 결과는 무엇인가?
    choices:
      - { id: '1', text: '3 3' }
      - { id: '2', text: '7 7' }
      - { id: '3', text: '3 7' }
      - { id: '4', text: '7 3' }
    answers: ['3']
    explanation: |
      선택지 1: TEMP를 쓰지 않고 한쪽 값만 덮어썼을 때 나올 수 있는 결과로 이 프로그램과 맞지 않는다.
      선택지 2: 1번과 마찬가지로 교환이 불완전할 때의 결과이다.
      선택지 3: 참조호출에서 a, b는 X, Y 자체를 가리키므로 SWAP이 X와 Y를 실제로 교환한다. 출력은 3 7이므로 정답이다.
      선택지 4: X, Y가 바뀌지 않은 값호출의 결과이다.

      핵심 개념:
      참조호출(call by reference)은 실 매개변수의 주소를 전달해 형식 매개변수가 같은 기억 장소를 공유하게 한다.
      서브프로그램에서 형식 매개변수를 바꾸면 호출한 쪽 변수도 바뀐다.
      SWAP처럼 호출자의 변수를 교환하는 함수는 참조호출(또는 포인터)이 필요하다.
      값호출과 참조호출의 차이는 호출이 끝난 뒤 실 매개변수 값이 바뀌었는지로 확인한다.
    tags: [call-by-reference, parameter-passing]
