questions:
  - id: e19-01
    type: multiple-choice
    chapter: 4
    prompt: 다음 중 설명이 바르게 짝지어진 것은?
    choices:
      - { id: '1', text: '구문론 - 프로그램의 내용적인 효과를 정의' }
      - { id: '2', text: '의미론 - 프로그램의 표면적인 구조를 정의' }
      - { id: '3', text: '구문론 - 프로그램 작성 시 어떤 형태로 작성해야 하는지를 기술' }
      - { id: '4', text: '의미론 - 문자들을 모아 최소한의 의미를 갖는 단어를 기술' }
    answers: ['3']
    explanation: |
      선택지 1: 프로그램의 내용적인 효과(의미)를 정의하는 것은 의미론이다. 구문론은 형태를 다룬다.
      선택지 2: 프로그램의 표면적인 구조(형태)를 정의하는 것은 구문론이다. 구문론과 의미론이 뒤바뀌었다.
      선택지 3: 구문론은 프로그램을 어떤 형태로 작성해야 하는지, 즉 문법적으로 올바른 구조를 기술하므로 정답이다.
      선택지 4: 문자들을 모아 최소 의미 단위인 단어(어휘, 토큰)를 만드는 것은 어휘 구조의 설명이며 의미론이 아니다.

      핵심 개념:
      구문론(syntax)은 프로그램의 형태, 즉 올바른 문장 구조를 정의한다.
      의미론(semantics)은 올바른 구조의 프로그램이 실행될 때 갖는 의미와 효과를 정의한다.
      어휘는 문자를 모아 만든 최소 의미 단위이며, 구문은 어휘들을 결합하는 규칙이다.
      같은 구문이라도 언어마다 의미가 다를 수 있어 두 개념을 구분해야 한다.
    tags: [syntax, semantics]

  - id: e19-02
    type: multiple-choice
    chapter: 4
    prompt: 구문을 표현하는 방법과 거리가 먼 것은?
    choices:
      - { id: '1', text: BNF }
      - { id: '2', text: EBNF }
      - { id: '3', text: WORA }
      - { id: '4', text: 구문 도표 }
    answers: ['3']
    explanation: |
      선택지 1: BNF(Backus-Naur Form)는 생성 규칙으로 구문을 형식적으로 정의하는 대표적 표기법이다.
      선택지 2: EBNF(Extended BNF)는 BNF에 반복 { }, 선택 [ ], 그룹 ( ) 등의 메타 기호를 추가한 구문 표기법이다.
      선택지 3: WORA(Write Once, Run Anywhere)는 한 번 작성하면 어디서나 실행된다는 Java의 이식성 표어로, 구문 표현 방법이 아니므로 정답이다.
      선택지 4: 구문 도표는 BNF/EBNF 규칙을 도형과 화살표로 그림처럼 나타낸 구문 표현 방법이다.

      핵심 개념:
      구문은 BNF, EBNF, 구문 도표로 표현할 수 있다.
      BNF는 ::=, |, < > 같은 메타 기호를 사용한다.
      EBNF는 반복·선택을 간결하게 표현하도록 BNF를 확장한 것이다.
      구문 도표는 비단말 기호를 사각형, 단말 기호를 원(타원)으로 그려 흐름으로 보여준다.
    tags: [bnf, ebnf, syntax-diagram]

  - id: e19-03
    type: multiple-choice
    chapter: 4
    passageRefs: [g19-ebnf-unsigned-integer-01]
    prompt: EBNF로 표현된 다음 구문을 실수로 BNF 표현으로 간주하고 해석하였다. EBNF일때의 해석과 달라진 부분은?
    choices:
      - { id: '1', text: '<unsigned integer>는 비단말 기호임' }
      - { id: '2', text: '::=는 정의를 나타내는 메타 기호임' }
      - { id: '3', text: '<digit>는 비단말 기호임' }
      - { id: '4', text: '{는 단말 기호임' }
    answers: ['4']
    explanation: |
      선택지 1: < >로 묶인 <unsigned integer>는 BNF와 EBNF 모두에서 비단말 기호이므로 해석이 달라지지 않는다.
      선택지 2: ::=는 BNF와 EBNF 모두에서 "정의한다"는 뜻의 메타 기호이다.
      선택지 3: <digit> 역시 두 표기법 모두에서 비단말 기호이다.
      선택지 4: EBNF에서 { }는 0번 이상 반복을 뜻하는 메타 기호이지만, BNF에는 { } 메타 기호가 없으므로 BNF로 읽으면 { 는 그대로 쓰이는 단말 기호가 된다. 따라서 해석이 달라진 부분이다.

      핵심 개념:
      BNF의 메타 기호는 ::=, |, < > 정도이다.
      EBNF는 여기에 { }(반복), [ ](선택적 생략), ( )(그룹)를 추가했다.
      같은 문자라도 어느 표기법으로 읽느냐에 따라 메타 기호인지 단말 기호인지가 달라진다.
      그래서 EBNF에서 { 같은 문자를 단말 기호로 쓰려면 '{'처럼 따옴표로 구분한다.
    tags: [bnf, ebnf, meta-symbol]

  - id: e19-04
    type: multiple-choice
    chapter: 5
    prompt: 파스 트리에 대한 설명으로 바른 것은?
    choices:
      - { id: '1', text: 유도를 트리 형태로 나타낸 것 }
      - { id: '2', text: 루트 노드는 단말 기호가 됨 }
      - { id: '3', text: 단말 노드는 비단말 기호가 됨 }
      - { id: '4', text: 비단말 노드를 차례로 나열하면 주어진 프로그램이 됨 }
    answers: ['1']
    explanation: |
      선택지 1: 파스 트리는 시작 기호에서 생성 규칙을 적용해 문장을 만들어 가는 유도 과정을 트리로 나타낸 것이므로 정답이다.
      선택지 2: 루트 노드는 시작 기호, 즉 비단말 기호이다.
      선택지 3: 단말(리프) 노드에는 단말 기호가 온다. 비단말 기호는 내부 노드가 된다.
      선택지 4: 주어진 프로그램(표현)이 되는 것은 단말 노드들을 왼쪽부터 차례로 나열한 결과이다.

      핵심 개념:
      파스 트리는 BNF 규칙으로 어떤 표현이 생성되는 과정을 계층 구조로 보여준다.
      루트는 시작 비단말 기호, 내부 노드는 비단말 기호, 리프는 단말 기호이다.
      리프를 왼쪽에서 오른쪽으로 읽으면 원래 표현이 된다.
      파스 트리를 만들 수 있으면 그 표현은 주어진 문법으로 생성 가능한 것이다.
    tags: [parse-tree, derivation]

  - id: e19-05
    type: multiple-choice
    chapter: 5
    prompt: 모호한 문법에 대한 설명으로 바른 것은?
    choices:
      - { id: '1', text: 동일한 표현에 대해 동일한 파스 트리가 만들어지는 문법 }
      - { id: '2', text: 동일한 표현에 대해 서로 다른 파스 트리가 만들어지는 문법 }
      - { id: '3', text: 주어진 표현에 대해 파스 트리가 존재하지 않는 문법 }
      - { id: '4', text: 서로 다른 표현에 대해 동일한 파스 트리가 만들어지는 문법 }
    answers: ['2']
    explanation: |
      선택지 1: 한 표현에 대해 파스 트리가 하나로 정해지는 것은 모호하지 않은(명확한) 문법의 성질이다.
      선택지 2: 하나의 표현에 대해 두 개 이상의 서로 다른 파스 트리가 존재하면 모호한 문법이므로 정답이다.
      선택지 3: 파스 트리가 존재하지 않는다는 것은 그 표현이 문법으로 생성될 수 없다는 뜻으로, 모호성과는 관계없다.
      선택지 4: 파스 트리의 리프를 읽으면 표현이 정해지므로, 서로 다른 표현이 같은 파스 트리를 가질 수는 없다.

      핵심 개념:
      모호한 문법은 같은 문장에 대해 파스 트리가 여러 개 존재하는 문법이다.
      파스 트리가 다르면 연산 순서 등 의미 해석이 달라질 수 있다.
      대표 예로 3-2*5 같은 수식의 연산 우선순위와 중첩 if문의 else 대응 문제가 있다.
      모호성은 문법을 고치거나 우선순위·결합 규칙을 정해 해소한다.
    tags: [ambiguous-grammar, parse-tree]

  - id: e19-06
    type: multiple-choice
    chapter: 5
    prompt: 중첩된 if문의 else 문제를 해결하기 위해 다수의 언어들이 적용하고 있는 방법은?
    choices:
      - { id: '1', text: else를 사용하지 못하게 함 }
      - { id: '2', text: if문 개수만큼 else를 사용하게 함 }
      - { id: '3', text: else문 앞에 나온 if문들 중 가장 가까운 if문과 짝이 되게 함 }
      - { id: '4', text: else문 앞에 나온 if문들 중 다른 else문과 짝이 되지 않은 가장 가까운 if문과 짝이 되게 함 }
    answers: ['4']
    explanation: |
      선택지 1: else를 금지하면 조건문의 표현력이 크게 떨어지므로 실제 언어가 쓰는 방법이 아니다.
      선택지 2: if문마다 else를 강제하는 것은 else가 필요 없는 조건문까지 불필요하게 길게 만든다.
      선택지 3: 단순히 가장 가까운 if와 짝을 지으면, 그 if가 이미 다른 else와 짝이 된 경우를 처리하지 못한다.
      선택지 4: C, Pascal, Java 등 다수 언어는 else를 "아직 else와 짝이 되지 않은 가장 가까운 if"와 연결하는 규칙으로 모호성을 없애므로 정답이다.

      핵심 개념:
      if-then-if-then-else 구조는 else가 어느 if에 속하는지 두 가지로 해석될 수 있어 모호하다(dangling else).
      많은 언어는 짝이 없는 가장 가까운 if에 else를 연결하는 규칙을 둔다.
      Algol68의 fi, Ada의 end if처럼 if문의 끝을 표시하는 키워드를 두어 해결하는 방법도 있다.
      블록(begin-end, { })으로 감싸 짝을 명시적으로 지정할 수도 있다.
    tags: [dangling-else, ambiguous-grammar]

  - id: e19-07
    type: multiple-choice
    chapter: 6
    prompt: '함수 모형으로 프로그래밍 언어 구현을 설명하였을 때, 프로그래밍 언어 $L$의 인터프리터 $Int_L$을 바르게 나타낸 것은? 단, $P_A$는 언어 혹은 기계어 $A$로 작성된 프로그램을 뜻하며, $in$은 입력, $out$은 출력, $M$은 기계어를 뜻한다.'
    choices:
      - { id: '1', text: '$Int_L \llbracket P_L \rrbracket = P_M$' }
      - { id: '2', text: '$Int_L \llbracket P_L \rrbracket (in) = (out)$' }
      - { id: '3', text: '$Int_L \llbracket P_M \rrbracket = P_L$' }
      - { id: '4', text: '$Int_L \llbracket P_L \rrbracket (out) = (in)$' }
    answers: ['2']
    explanation: |
      선택지 1: $L$ 프로그램을 받아 기계어 프로그램 $P_M$을 만들어 내는 것은 컴파일러(번역기)의 함수 모형이다.
      선택지 2: 인터프리터는 $L$ 프로그램 $P_L$을 번역하지 않고 곧바로 실행하므로, 입력 $in$을 주면 출력 $out$을 내는 함수로 표현된다. 정답이다.
      선택지 3: 기계어 프로그램을 $L$ 프로그램으로 바꾸는 것은 역번역에 해당하며 $L$의 인터프리터가 아니다.
      선택지 4: 입력과 출력의 방향이 뒤바뀌었다. 프로그램은 입력을 받아 출력을 만든다.

      핵심 개념:
      함수 모형은 언어 구현기를 "프로그램을 받아 무엇을 내놓는 함수"로 설명한다.
      컴파일러는 $P_L$을 받아 목적 프로그램 $P_M$을 출력한다.
      인터프리터는 $P_L$과 입력을 받아 곧바로 실행 결과(출력)를 낸다.
      두 방식의 차이는 번역 결과물을 따로 만드는지, 즉시 실행하는지에 있다.
    tags: [interpreter, compiler, language-implementation]

  - id: e19-08
    type: multiple-choice
    chapter: 6
    prompt: |
      언어 구현에 필요한 자료 구조 중 다음 설명에 해당하는 것은?

      - 컴파일러 구현에 사용
      - 식별자의 정보(타입, 선언 위치 등)를 저장
    choices:
      - { id: '1', text: 구문 트리 }
      - { id: '2', text: 심볼 테이블 }
      - { id: '3', text: 환경 }
      - { id: '4', text: 실행 환경 }
    answers: ['2']
    explanation: |
      선택지 1: 구문 트리는 프로그램의 구문 구조를 트리로 표현한 것으로, 식별자 정보를 모아 두는 표가 아니다.
      선택지 2: 심볼 테이블(기호표)은 컴파일러가 식별자의 이름, 타입, 선언 위치 등의 정보를 저장하고 조회하는 자료 구조이므로 정답이다.
      선택지 3: 환경은 이름과 그 이름이 가리키는 대상(값, 위치)의 대응을 뜻하며, 주로 인터프리터의 실행 모델에서 쓰인다.
      선택지 4: 실행 환경은 프로그램이 실행되는 동안의 메모리 구성(스택, 힙 등)과 상태를 말한다.

      핵심 개념:
      컴파일러는 어휘 분석, 구문 분석, 의미 분석 과정에서 여러 자료 구조를 사용한다.
      구문 트리는 프로그램 구조를, 심볼 테이블은 식별자 속성을 담는다.
      의미 분석과 코드 생성 단계는 심볼 테이블을 조회해 타입 검사와 주소 배정을 한다.
      환경·실행 환경은 실행 시점의 이름-값 대응과 메모리 상태를 나타낸다.
    tags: [symbol-table, compiler]

  - id: e19-09
