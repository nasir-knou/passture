    prompt: 변수의 네 가지 속성에 해당하지 ==않는== 것은?
    choices:
      - { id: '1', text: 인수 }
      - { id: '2', text: 타입 }
      - { id: '3', text: 주소 }
      - { id: '4', text: 변수명 }
    answers: ['1']
    explanation: |
      선택지 1: 인수는 서브프로그램을 호출할 때 전달하는 값(실 매개변수)으로, 변수 자체의 속성이 아니므로 정답이다.
      선택지 2: 타입은 변수가 가질 수 있는 값의 집합과 연산을 정하는 속성이다.
      선택지 3: 주소는 변수 값이 저장된 기억 장소의 위치이다.
      선택지 4: 변수명(이름)은 변수를 식별하는 속성이다.

      핵심 개념:
      변수는 이름, 주소, 값, 타입의 네 가지 속성을 가진다.
      이름은 식별, 주소는 저장 위치, 값은 저장된 내용, 타입은 허용 값과 연산을 나타낸다.
      각 속성이 언제 정해지는지를 바인딩 시간으로 설명한다.
      배런(Barron) 표기법은 이 속성들을 도형으로 연결해 표현한다.
    tags: [variable-attributes]

