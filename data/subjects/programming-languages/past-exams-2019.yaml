      선택지 2: 이름 자리에 값 A가, 값 자리에 주소 FFD0가, 주소 자리에 이름 x가 들어가 속성 위치가 뒤섞였다.
      선택지 3: 이름과 값이 서로 바뀌었고 타입도 int로 틀렸다.
