      - { id: '3', text: '실수형 변수 A, B에 대해 A+B를 계산할 때 발생' }
      - { id: '4', text: 명시적 타입 변환은 프로그래머가 명시한 타입으로 변환 }
    answers: ['3']
    explanation: |
      선택지 1: 타입 변환은 어떤 타입의 값을 다른 타입의 값으로 바꾸는 것으로 옳은 정의이다.
      선택지 2: 묵시적 변환은 정보 손실을 막기 위해 보통 int → double처럼 표현 범위가 넓어지는 확대 변환으로 일어나므로 옳다.
      선택지 3: A와 B가 모두 실수형이면 두 피연산자의 타입이 같으므로 A+B 계산에 타입 변환이 필요 없다. 따라서 바르지 않으며 정답이다.
      선택지 4: 명시적 변환(캐스트)은 프로그래머가 (int)x처럼 변환할 타입을 직접 적는 것이므로 옳다.

      핵심 개념:
      타입 변환은 서로 다른 타입의 값을 함께 연산하거나 대입할 때 필요하다.
      묵시적 변환은 컴파일러가 자동으로 수행하며 주로 확대 변환이다.
      명시적 변환은 프로그래머가 캐스트 연산자로 지정하며 축소 변환도 가능하다.
      피연산자 타입이 같으면 변환이 일어나지 않는다.
    tags: [type-conversion, implicit-conversion, cast]

  - id: e19-19
    type: multiple-choice
    chapter: 12
    prompt: 다음 중 대입문과 거리가 ==먼== 것은?
    choices:
      - { id: '1', text: 'A++;' }
      - { id: '2', text: 'A = 2;' }
      - { id: '3', text: 'A += 3;' }
      - { id: '4', text: 'A == 4;' }
    answers: ['4']
    explanation: |
      선택지 1: A++는 A = A + 1과 같은 효과를 가지는 증가 대입이다.
      선택지 2: A = 2는 가장 기본적인 대입문이다.
      선택지 3: A += 3은 A = A + 3을 줄여 쓴 복합 대입문이다.
      선택지 4: A == 4는 A가 4와 같은지 비교하는 관계 연산으로 값을 저장하지 않으므로 대입문이 아니다. 정답이다.

      핵심 개념:
      대입문은 오른쪽 수식의 값을 왼쪽 변수에 저장하는 문장이다.
      C 계열 언어는 =, +=, -=, ++, -- 등 다양한 대입 연산자를 제공한다.
      ==는 같음을 비교하는 관계 연산자로 결과는 참/거짓 값이다.
      = 와 == 를 혼동하면 논리 오류가 생기기 쉽다.
    tags: [assignment-statement]

  - id: e19-20
    type: multiple-choice
    chapter: 11
    passageRefs: [g19-java-assignment-01]
    prompt: Java에서 다음과 같이 선언된 변수를 이용할 때 오류가 발생하는 대입문은?
    choices:
      - { id: '1', text: 'x = d1 + d2;' }
      - { id: '2', text: 'y = d1 + d2;' }
      - { id: '3', text: 'x = i1 + i2;' }
      - { id: '4', text: 'y = i1 + i2;' }
    answers: ['1']
    explanation: |
      선택지 1: d1 + d2는 double 값인데 int 변수 x에 대입하면 정보가 손실되는 축소 변환이 필요하다. Java는 이를 묵시적으로 허용하지 않아 컴파일 오류가 발생하므로 정답이다.
      선택지 2: double + double의 결과를 double 변수 y에 대입하므로 변환이 필요 없다.
      선택지 3: int + int의 결과를 int 변수 x에 대입하므로 문제가 없다.
      선택지 4: int 결과를 double 변수에 대입하는 것은 확대 변환이므로 Java가 자동으로 변환한다.

      핵심 개념:
      Java는 확대 변환(int → double)은 묵시적으로 허용하지만 축소 변환(double → int)은 허용하지 않는다.
      축소 변환이 필요하면 (int)(d1 + d2)처럼 명시적으로 캐스트해야 한다.
      이는 정보 손실을 컴파일 시간에 막기 위한 강한 타입 검사 정책이다.
      대입문에서는 오른쪽 수식의 타입이 왼쪽 변수 타입과 호환되는지 확인해야 한다.
    tags: [type-conversion, java, assignment-statement]

  - id: e19-21
    type: multiple-choice
    chapter: 12
    prompt: 제어문에 대한 설명으로 바르지 ==않은== 것은?
    choices:
      - { id: '1', text: 프로그램의 수행 흐름을 제어함 }
      - { id: '2', text: 조건문은 조건에 따라 서로 다른 처리를 하도록 제어함 }
      - { id: '3', text: '반복문에는 for문, while문, do-while문 등이 있음' }
      - { id: '4', text: 'do-while문은 필요한 문장을 0번 이상 반복 수행함' }
    answers: ['4']
    explanation: |
      선택지 1: 제어문은 문장의 실행 순서, 즉 수행 흐름을 바꾸는 문장이므로 옳다.
      선택지 2: 조건문(if, switch)은 조건의 참/거짓에 따라 다른 문장을 실행하므로 옳다.
      선택지 3: 반복문에는 for, while, do-while 등이 있으므로 옳다.
      선택지 4: do-while문은 본문을 먼저 실행한 뒤 조건을 검사하므로 최소 1번 이상 실행된다. 0번 이상 반복하는 것은 while문이다. 정답이다.

      핵심 개념:
      제어문은 조건문, 반복문, 분기문(goto, break, continue) 등으로 나뉜다.
      while문은 조건을 먼저 검사하므로 본문이 한 번도 실행되지 않을 수 있다(0번 이상).
      do-while문은 조건을 나중에 검사하므로 본문이 적어도 한 번 실행된다(1번 이상).
      for문은 초기화·조건·증감을 한 줄에 모은 반복문이다.
    tags: [control-statement, loop]

  - id: e19-22
    type: multiple-choice
    chapter: 13
    passageRefs: [g19-parameter-passing-01]
    prompt: 값 전달 방식의 인수 전달을 가정할 때, 위 프로그램에서 fun의 호출이 끝난 후 배열 list의 값은?
    choices:
      - { id: '1', text: '1, 2, 3' }
      - { id: '2', text: '0, 2, 3' }
      - { id: '3', text: '1, 0, 3' }
      - { id: '4', text: '1, 2, 0' }
    answers: ['1']
    explanation: |
      선택지 1: 값 전달에서는 i와 list[0]의 값(0과 1)이 형식 매개변수 a, b에 복사될 뿐이다. fun 안에서 a와 b를 바꿔도 호출한 쪽의 변수는 변하지 않으므로 list는 1, 2, 3 그대로이다. 정답이다.
      선택지 2: list[0]이 0으로 바뀌는 것은 참조 전달일 때의 결과이다.
      선택지 3: list[1]은 fun에 전달되지 않았으므로 바뀔 이유가 없다.
      선택지 4: list[2]도 전달되지 않았으므로 바뀌지 않는다.

      핵심 개념:
      값 전달(call by value)은 실 매개변수의 값을 형식 매개변수에 복사한다.
      서브프로그램 안에서 형식 매개변수를 바꿔도 실 매개변수에는 영향이 없다.
      그래서 값 전달로는 swap 함수가 호출한 쪽의 변수를 교환하지 못한다.
      호출 쪽 변수를 바꾸려면 참조 전달이나 포인터 전달이 필요하다.
    tags: [call-by-value, parameter-passing]

  - id: e19-23
    type: multiple-choice
    chapter: 13
    passageRefs: [g19-parameter-passing-01]
    prompt: 참조 전달 방식의 인수 전달을 가정할 때, 위 프로그램에서 fun의 호출이 끝난 후 배열 list의 값은?
    choices:
      - { id: '1', text: '1, 2, 3' }
      - { id: '2', text: '0, 2, 3' }
      - { id: '3', text: '1, 0, 3' }
      - { id: '4', text: '1, 2, 0' }
    answers: ['2']
    explanation: |
      선택지 1: 1, 2, 3이 그대로인 것은 값 전달일 때의 결과이다.
      선택지 2: 참조 전달에서 a는 i를, b는 호출 시점에 결정된 list[0]을 가리킨다. temp = a(0), a = b로 i = 1, b = temp로 list[0] = 0이 되므로 list는 0, 2, 3이다. 정답이다.
      선택지 3: list[1]이 0이 되려면 b가 list[1]을 가리켜야 한다. 참조 전달은 호출 시점(i = 0)에 list[0]의 위치를 넘기므로, 나중에 i가 1로 바뀌어도 b는 계속 list[0]을 가리킨다.
      선택지 4: list[2]는 전달되지 않았으므로 바뀌지 않는다.

      핵심 개념:
      참조 전달(call by reference)은 실 매개변수의 주소를 넘겨 형식 매개변수가 같은 기억 장소를 가리키게 한다.
      따라서 서브프로그램 안의 변경이 호출한 쪽 변수에 그대로 반영된다.
      배열 원소 list[i]를 넘길 때는 호출 시점의 i 값으로 위치가 결정된다.
      이름 전달(call by name)이었다면 사용 시점마다 list[i]를 다시 계산하므로 결과가 달라질 수 있다.
    tags: [call-by-reference, parameter-passing]

  - id: e19-24
    type: multiple-choice
    chapter: 14
    passageRefs: [g19-static-chain-code-01, g19-static-chain-stack-01]
    prompt: 다음 Pascal 형태의 프로그램이 정적 영역 규칙을 따른다고 할 때, A 지점에서 A, B, E의 체인 변위는?
    choices:
      - { id: '1', text: '0, 1, 2' }
      - { id: '2', text: '1, 2, 3' }
      - { id: '3', text: '2, 1, 0' }
      - { id: '4', text: '2, 2, 1' }
    answers: ['3']
    explanation: |
      선택지 1: 변위 순서를 거꾸로 적은 것이다. E가 S3의 지역변수라 0이다.
      선택지 2: 모든 변위를 1씩 크게 센 것으로, 현재 블록 자신의 변위를 0으로 두는 규칙과 맞지 않는다.
      선택지 3: A 지점은 S3 안이다. E는 S3의 지역변수이므로 변위 0, B는 S3을 감싼 S2의 매개변수이므로 변위 1, A는 S2를 감싼 Main의 변수이므로 변위 2이다. A, B, E 순서로 2, 1, 0이므로 정답이다.
      선택지 4: B를 Main의 변수로 보면 2가 되지만, S2의 매개변수 B가 Main의 B를 가리므로 정적 영역 규칙에서 B의 변위는 1이다.

      핵심 개념:
      체인 변위는 현재 블록에서 변수가 선언된 블록까지 정적 링크를 몇 번 따라가야 하는지를 나타낸다.
      정적 영역 규칙에서는 소스 코드의 중첩 관계(S3 ⊂ S2 ⊂ Main)를 기준으로 센다.
      같은 이름이 여러 블록에 있으면 가장 가까운 바깥 블록의 선언이 사용된다.
      호출 순서(S3가 S1을 호출)는 동적 링크에만 영향을 주고 정적 체인 변위에는 영향을 주지 않는다.
    tags: [static-chain, static-scope, activation-record]

  - id: e19-25
    type: multiple-choice
    chapter: 14
    prompt: 동적 체인에 대한 설명으로 바르지 ==않은== 것은?
    choices:
      - { id: '1', text: 비지역변수를 찾을 때까지 동적 링크를 거슬러 올라감 }
      - { id: '2', text: 호출 순서와 무관하게 참조하는 비지역변수가 결정됨 }
      - { id: '3', text: 활성 레코드에 변수 이름을 저장해야 함 }
      - { id: '4', text: 동적 체인의 길이는 정적 체인의 길이보다 길 수 있음 }
    answers: ['2']
    explanation: |
      선택지 1: 동적 체인 기법은 동적 링크를 따라 호출한 쪽 활성 레코드를 차례로 거슬러 올라가며 비지역변수를 찾으므로 옳다.
      선택지 2: 동적 링크는 호출한 순서대로 연결되므로, 동적 체인으로 찾는 비지역변수는 호출 순서에 따라 달라진다. "호출 순서와 무관"이라는 설명은 틀렸으므로 정답이다.
      선택지 3: 이름으로 변수를 찾아야 하므로 활성 레코드에 변수 이름 정보를 함께 저장해야 한다는 설명은 옳다.
      선택지 4: 재귀 호출 등으로 호출 깊이가 깊어지면 동적 체인이 소스 코드 중첩 깊이에 따른 정적 체인보다 길어질 수 있으므로 옳다.

      핵심 개념:
      동적 체인은 동적 영역 규칙을 구현하기 위해 동적 링크를 따라 비지역변수를 찾는 기법이다.
      동적 링크는 호출한 서브프로그램의 활성 레코드를 가리킨다.
      정적 체인은 소스 코드의 중첩 관계를 따르는 정적 링크를 사용한다.
      동적 체인은 실행 시 이름 검색이 필요해 느리고, 결과가 호출 순서에 의존한다.
