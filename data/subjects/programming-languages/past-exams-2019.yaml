  - id: e19-11
    type: multiple-choice
    chapter: 7
    prompt: 타입 바인딩에 대한 설명으로 바른 것은?
    choices:
      - { id: '1', text: 명시적 선언은 변수명으로부터 정해지는 타입으로 바인딩 }
      - { id: '2', text: 묵시적 선언은 선언문에 명시된 타입으로 바인딩 }
      - { id: '3', text: 동적 바인딩은 대입할 값에 맞추어 타입을 계속 변화시킴 }
      - { id: '4', text: 정적 바인딩은 명시적 선언만 가능 }
    answers: ['3']
    explanation: |
      선택지 1: 변수명(예: Fortran의 첫 글자 규칙)으로 타입이 정해지는 것은 묵시적 선언이다. 명시적 선언은 선언문에 타입을 적는다.
      선택지 2: 선언문에 명시된 타입으로 바인딩하는 것은 명시적 선언이다. 1번과 설명이 서로 바뀌었다.
      선택지 3: 동적 타입 바인딩은 실행 중 대입되는 값에 따라 변수의 타입이 정해지고 바뀔 수 있으므로 정답이다.
      선택지 4: 정적 바인딩은 명시적 선언뿐 아니라 묵시적 선언으로도 이루어진다. 두 방식 모두 번역 시간에 타입이 정해진다.

      핵심 개념:
      타입 바인딩은 변수에 타입을 연결하는 것으로, 시점에 따라 정적·동적 바인딩으로 나뉜다.
      정적 바인딩은 실행 전에 정해지며 명시적 선언이나 묵시적 선언으로 이루어진다.
      명시적 선언은 선언문에 타입을 적고, 묵시적 선언은 이름 규칙 등 기본 규칙으로 타입을 정한다.
      동적 바인딩은 대입되는 값에 따라 실행 중 타입이 정해져 유연하지만 오류 검출이 늦어진다.
    tags: [type-binding, static-binding, dynamic-binding]

  - id: e19-12
    type: multiple-choice
    chapter: 8
    prompt: 영역 규칙에 대한 설명으로 바르지 ==않은== 것은?
    choices:
      - { id: '1', text: 영역 규칙은 변수의 참조 위치를 결정하는 방법임 }
      - { id: '2', text: 정적 영역 규칙은 블록들의 문맥적 포함 관계를 이용 }
      - { id: '3', text: 동적 영역 규칙은 서브프로그램의 호출 관계를 이용 }
      - { id: '4', text: 동적 영역 규칙은 컴파일 시점에만 판단 가능 }
    answers: ['4']
    explanation: |
      선택지 1: 영역 규칙은 어떤 이름의 사용이 어느 선언을 가리키는지, 즉 참조 위치를 정하는 규칙이므로 옳다.
      선택지 2: 정적 영역 규칙은 프로그램 텍스트에서 블록이 어떻게 포함되어 있는지를 보고 선언을 찾으므로 옳다.
      선택지 3: 동적 영역 규칙은 실행 중 서브프로그램이 호출된 순서를 거슬러 올라가 선언을 찾으므로 옳다.
      선택지 4: 동적 영역 규칙은 호출 관계가 실행 중에 정해지므로 실행 시간에 판단한다. 컴파일 시점에만 판단한다는 설명은 틀렸으므로 정답이다.

      핵심 개념:
      영역(scope)은 이름이 유효하게 쓰일 수 있는 프로그램 범위이다.
      정적 영역 규칙은 소스 코드의 블록 중첩 구조로 비지역 변수를 결정하며 컴파일 시간에 알 수 있다.
      동적 영역 규칙은 호출 순서로 비지역 변수를 결정하므로 실행 시간에야 알 수 있다.
      대부분의 현대 언어는 이해와 검증이 쉬운 정적 영역 규칙을 사용한다.
    tags: [scope-rule, static-scope, dynamic-scope]

  - id: e19-13
    type: multiple-choice
    chapter: 8
    prompt: 변수의 종류와 설명이 바르게 짝지어진 것은?
    choices:
      - { id: '1', text: '지역변수 - 블록 밖에서 선언된 변수' }
      - { id: '2', text: '비지역변수 - 블록 안에서 선언된 변수' }
      - { id: '3', text: '자유변수 - 어떤 블록에도 포함되지 않는 곳에서 선언된 변수' }
      - { id: '4', text: '전역변수 - 모든 블록에서 비지역변수임' }
    answers: ['4']
    explanation: |
      선택지 1: 지역변수는 해당 블록 안에서 선언된 변수이다.
      선택지 2: 비지역변수는 해당 블록 밖에서 선언되었지만 그 블록에서 사용되는 변수이다. 1번과 설명이 서로 바뀌었다.
      선택지 3: 자유변수는 현재 블록 안에서 선언되지 않은 채 사용되는 변수를 말한다. 선언 위치가 "어떤 블록에도 포함되지 않는 곳"이라는 설명은 틀렸다.
      선택지 4: 전역변수는 가장 바깥에서 선언되어 모든 블록에서 사용할 수 있으므로, 각 블록 입장에서는 비지역변수이다. 정답이다.

      핵심 개념:
      변수는 사용되는 블록을 기준으로 지역변수와 비지역변수로 나뉜다.
      지역변수는 그 블록 안에서 선언된 변수이고, 비지역변수는 바깥 블록에서 선언된 변수이다.
      전역변수는 프로그램 최상위에서 선언되어 모든 블록에서 비지역변수로 보인다.
      자유변수는 현재 블록에서 선언 없이 쓰인 변수로, 영역 규칙에 따라 어느 선언을 가리키는지 결정된다.
    tags: [local-variable, nonlocal-variable, global-variable]

  - id: e19-14
    type: multiple-choice
    chapter: 9
    prompt: 변수의 속성 중 한 가지로, 데이터 집합과 연산 집합의 결합으로 나타내는 것은?
    choices:
      - { id: '1', text: 인수 }
      - { id: '2', text: 타입 }
      - { id: '3', text: 주소 }
      - { id: '4', text: 변수명 }
    answers: ['2']
    explanation: |
      선택지 1: 인수는 서브프로그램 호출 시 전달하는 값으로 변수의 속성이 아니다.
      선택지 2: 타입은 변수가 가질 수 있는 값(데이터)의 집합과 그 값에 적용할 수 있는 연산의 집합을 함께 정의하므로 정답이다.
      선택지 3: 주소는 값이 저장된 기억 장소의 위치를 나타내는 속성이다.
      선택지 4: 변수명은 변수를 식별하는 이름 속성이다.

      핵심 개념:
      타입은 "값의 집합 + 연산의 집합"으로 정의된다.
      예를 들어 정수형은 정수 값들과 +, -, *, / 같은 연산을 가진다.
      타입 정보로 컴파일러는 잘못된 연산을 검출(타입 검사)하고 기억 공간 크기를 정한다.
      변수의 네 속성은 이름, 주소, 값, 타입이다.
    tags: [type]

  - id: e19-15
    type: multiple-choice
    chapter: 9
    prompt: 언어의 타입에 대한 설명으로 바르지 ==않은== 것은?
    choices:
      - { id: '1', text: '강타입 언어 - 타입 오류를 모두 검출하는 언어' }
      - { id: '2', text: '약타입 언어 - 일부 타입 오류를 허용하는 언어' }
      - { id: '3', text: '무타입 언어 - 타입 개념이 없는 언어' }
      - { id: '4', text: '무타입 언어 - 타입이 계속 바뀔 수 있는 언어' }
    answers: ['3']
    explanation: |
      선택지 1: 강타입(strongly typed) 언어는 모든 타입 오류를 컴파일 시간이나 실행 시간에 검출하는 언어로 옳은 설명이다.
      선택지 2: 약타입 언어는 일부 타입 오류를 검출하지 않고 허용하는 언어로 옳다.
      선택지 3: 공식 정답은 3번으로, "타입 개념이 없는 언어"를 무타입 언어의 설명으로 바르지 않다고 본다.
      선택지 4: 공식 정답에 따르면 "변수의 타입이 고정되지 않고 계속 바뀔 수 있는 언어"를 무타입 언어의 설명으로 인정한다.

      핵심 개념:
      언어는 타입 오류를 얼마나 엄격하게 검출하느냐에 따라 강타입, 약타입, 무타입 언어로 나뉜다.
      강타입 언어는 모든 타입 오류를 검출하고, 약타입 언어는 일부를 허용한다.
      일반적으로 무타입 언어는 "타입 개념이 없는 언어"로 정의되지만, 이 문제의 공식 정답은 3번(선택지 4를 옳은 설명으로 봄)이다.
      시험 대비로는 공식 정답(3번) 기준으로 기억한다.
    tags: [strong-typing, weak-typing, untyped-language]

  - id: e19-16
    type: multiple-choice
    chapter: 9
    prompt: 타입 분류가 바르게 된 것은?
    choices:
      - { id: '1', text: '정수형 - 원시타입' }
      - { id: '2', text: '실수형 - 사용자정의타입' }
      - { id: '3', text: '배열 - 단순타입' }
      - { id: '4', text: '열거형 - 복합타입' }
    answers: ['1']
    explanation: |
      선택지 1: 정수형은 언어가 기본으로 제공하는 원시(primitive) 타입이므로 정답이다.
      선택지 2: 실수형도 언어가 기본 제공하는 원시 타입이며 사용자 정의 타입이 아니다.
      선택지 3: 배열은 여러 원소를 모아 구성하는 복합 타입이다.
      선택지 4: 열거형은 값들을 나열해 정의하는 단순 타입(순서 타입)이며, 여러 값을 묶은 복합 타입이 아니다.

      핵심 개념:
      타입은 크게 단순 타입과 복합 타입으로 나뉜다.
      단순 타입에는 정수형, 실수형, 문자형, 논리형 같은 원시 타입과 열거형, 부분범위형이 있다.
      복합 타입은 배열, 문자열, 레코드(구조체), 공용체, 포인터처럼 다른 타입을 조합해 만든다.
      원시 타입은 언어가 미리 제공하는 타입이고, 사용자 정의 타입은 프로그래머가 새로 만든 타입이다.
    tags: [type-classification, primitive-type]

  - id: e19-17
    type: multiple-choice
    chapter: 11
    prompt: 수식에 대한 설명으로 바른 것은?
    choices:
      - { id: '1', text: 값을 나타내는 표현 }
      - { id: '2', text: 하나 이상의 피연산자와 하나 이상의 연산자로 구성 }
      - { id: '3', text: '"abc"+"def"는 수식이 아님' }
      - { id: '4', text: 5 - 3과 1 + 1은 서로 값이 다른 수식임 }
    answers: ['1']
    explanation: |
      선택지 1: 수식은 계산하면 하나의 값을 나타내는 표현이므로 정답이다.
      선택지 2: 수식은 연산자 없이 피연산자 하나(예: 상수 5, 변수 x)만으로도 성립한다. "하나 이상의 연산자"가 반드시 필요한 것은 아니다.
      선택지 3: "abc"+"def"는 문자열 연결 연산으로 값 "abcdef"를 나타내므로 수식이다.
      선택지 4: 5 - 3과 1 + 1은 모두 값이 2이므로 값이 같은 수식이다.

      핵심 개념:
      수식(expression)은 평가(계산)되어 값을 만드는 표현이다.
      수식은 피연산자와 연산자로 구성되며, 피연산자 하나만으로도 수식이 된다.
      숫자뿐 아니라 문자열, 논리값 등 어떤 타입의 값을 만들어도 수식이다.
      문장(statement)은 동작을 수행하는 단위로, 값을 만드는 수식과 구분된다.
    tags: [expression]

  - id: e19-18
    type: multiple-choice
    chapter: 11
    prompt: 타입 변환에 대한 설명으로 바르지 ==않은== 것은?
    choices:
