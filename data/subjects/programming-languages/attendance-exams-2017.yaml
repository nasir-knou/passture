title: 프로그래밍언어론 2017 출석대체
kind: exam
year: 2017

questions:
  - id: e17-46
    type: multiple-choice
    chapter: 1
    prompt: 프로그래밍 언어론에 대한 설명과 거리가 ==먼== 것은?
    choices:
      - { id: '1', text: 프로그래밍 언어들의 공통점과 차이점을 고찰 }
      - { id: '2', text: 컴퓨터에게 프로그래머의 의사를 전달하는 방법에 대한 근본적인 이해 }
      - { id: '3', text: 현재 사용하고 있는 언어를 더 잘 이해하게 해줌 }
      - { id: '4', text: 새로운 외국어를 배우기 쉽게 해줌 }
    answers: ['4']
    explanation: |
      선택지 1: 프로그래밍 언어론은 여러 언어의 공통 개념과 차이점을 비교·고찰하는 학문이므로 옳은 설명이다.
      선택지 2: 프로그래머의 의사를 컴퓨터에 전달하는 방법, 즉 언어의 구문·의미·구현을 근본적으로 이해하게 하므로 옳다.
      선택지 3: 언어의 설계 원리를 알면 지금 쓰는 언어의 특징과 제약을 더 깊이 이해할 수 있으므로 옳다.
      선택지 4: 프로그래밍 언어론은 새로운 프로그래밍 언어를 배우는 데 도움을 주지만, 영어·일어 같은 자연어(외국어) 학습과는 관계가 없다. 정답이다.

      핵심 개념:
      프로그래밍 언어론은 프로그래밍 언어의 설계 원리, 구문과 의미, 구현 방법을 연구한다.
      이를 배우면 알고리즘 표현 능력이 늘고 새로운 프로그래밍 언어를 빨리 익힐 수 있다.
      적합한 언어를 선택하는 안목과 새로운 언어를 설계하는 능력도 기를 수 있다.
      학습 대상은 인공 언어인 프로그래밍 언어이며 자연어가 아니다.
    tags: [programming-language-theory]

  - id: e17-47
    type: multiple-choice
    chapter: 1
    prompt: 프로그래밍 언어에서의 추상화를 대상에 따라 바르게 구분한 것은?
    choices:
      - { id: '1', text: '자료 추상화 - 반복문' }
      - { id: '2', text: '자료 추상화 - 조건문' }
      - { id: '3', text: '제어 추상화 - 문자열' }
      - { id: '4', text: '제어 추상화 - 프로시저 호출' }
    answers: ['4']
    explanation: |
      선택지 1: 반복문은 실행 흐름을 추상화한 제어 추상화이다.
      선택지 2: 조건문도 제어 추상화이다.
      선택지 3: 문자열은 자료의 표현을 추상화한 자료 추상화이다.
      선택지 4: 프로시저 호출은 여러 명령의 실행을 하나의 이름으로 묶어 흐름을 추상화한 제어 추상화이므로 정답이다.

      핵심 개념:
      추상화는 대상에 따라 자료 추상화와 제어 추상화로 나뉜다.
      자료 추상화의 예: 수, 문자열, 배열, 레코드, 추상 자료형.
      제어 추상화의 예: 대입문, 조건문, 반복문, 프로시저·함수 호출.
      추상화 덕분에 프로그래머는 기계의 세부 사항 대신 문제 자체에 집중할 수 있다.
    tags: [abstraction]

  - id: e17-48
    type: multiple-choice
    chapter: 3
    prompt: 알려진 값들을 함수에 적용하는 방식으로 프로그램을 기술하는 프로그래밍 언어는?
    choices:
      - { id: '1', text: 명령형 언어 }
      - { id: '2', text: 함수형 언어 }
      - { id: '3', text: 논리형 언어 }
      - { id: '4', text: 객체 지향 언어 }
    answers: ['2']
    explanation: |
      선택지 1: 명령형 언어는 순차적인 명령 수행과 상태 변경을 기본으로 한다.
      선택지 2: 함수형 언어는 값을 함수에 적용하고 함수를 합성하는 방식으로 프로그램을 기술하므로 정답이다(예: LISP, Haskell).
      선택지 3: 논리형 언어는 사실과 규칙을 선언하고 추론으로 답을 구한다.
      선택지 4: 객체 지향 언어는 자료와 연산을 묶은 객체에 기반한다.

      핵심 개념:
      함수형 언어는 수학의 함수 개념에 기반하며 대입문과 부작용을 최소화한다.
      프로그램은 함수 정의와 함수 적용의 조합으로 구성된다.
      반복 대신 재귀를 주로 사용한다.
      같은 입력에는 항상 같은 결과를 내므로 프로그램을 추론하고 검증하기 쉽다.
    tags: [paradigm, functional]

  - id: e17-49
    type: multiple-choice
    chapter: 2
    prompt: 객체지향 개념에 기반한 언어로 JVM 위에서 수행되는 프로그래밍 언어는?
    choices:
      - { id: '1', text: 기계어 }
      - { id: '2', text: Fortran }
      - { id: '3', text: C }
      - { id: '4', text: JAVA }
    answers: ['4']
    explanation: |
      선택지 1: 기계어는 CPU(Central Processing Unit)가 직접 실행하는 저급 언어로 JVM(Java Virtual Machine)이 필요 없다.
      선택지 2: Fortran은 과학 계산용 명령형 언어로 기계어로 컴파일되어 실행된다.
      선택지 3: C는 명령형 언어로 기계어로 컴파일되어 실행된다.
      선택지 4: Java는 객체 지향 언어로, 바이트코드로 번역된 뒤 JVM(Java Virtual Machine) 위에서 실행되므로 정답이다.

      핵심 개념:
      Java는 1995년 발표된 객체 지향 언어이다.
      소스 코드는 플랫폼에 독립적인 바이트코드로 번역된다.
      JVM이 바이트코드를 해석·실행하므로 "한 번 작성하면 어디서나 실행(WORA)"된다.
      이는 컴파일과 인터프리트를 결합한 중간 코드 실행 방식이다.
    tags: [java, jvm, language-history]

  - id: e17-50
    type: multiple-choice
    chapter: 2
    prompt: 프로그래밍 언어의 설계 기준 중 프로그래밍의 오류를 줄이고 이를 쉽게 발견하기 위한 것은?
    choices:
      - { id: '1', text: 효율성 }
      - { id: '2', text: 직교성 }
      - { id: '3', text: 안전성 }
      - { id: '4', text: 부분성 }
    answers: ['3']
    explanation: |
      선택지 1: 효율성은 번역·실행 속도와 자원 사용의 경제성을 뜻한다.
      선택지 2: 직교성은 언어 구성 요소들을 제약 없이 조합해 쓸 수 있고 조합의 의미가 일관된 성질이다.
      선택지 3: 안전성은 프로그래밍 오류가 덜 생기게 하고, 생긴 오류를 쉽게 발견하게 하는 성질이므로 정답이다.
      선택지 4: 부분성은 언어의 일부만 알아도 프로그램을 작성할 수 있는 성질이다.

      핵심 개념:
      안전성을 높이는 장치로 강한 형 검사, 변수 선언 강제, 배열 범위 검사 등이 있다.
      포인터의 무분별한 사용이나 묵시적 형 변환은 안전성을 떨어뜨릴 수 있다.
      설계 기준은 서로 충돌하기도 한다(예: 안전성 검사는 효율성을 낮춤).
      언어 설계자는 목적에 따라 기준 사이의 균형을 정한다.
    tags: [design-criteria, safety]

  - id: e17-51
    type: multiple-choice
    chapter: 1
    prompt: 프로그래밍 언어의 구조에 대한 설명이 ==잘못== 짝지어진 것은?
    choices:
      - { id: '1', text: '문자 - 영어 알파벳과 아라비아 숫자를 주로 이용' }
      - { id: '2', text: '어휘 - 프로그래밍 언어 문자로 구성된 단어' }
      - { id: '3', text: '토큰 - 한 개 이상의 어휘를 이용한 구문적으로 허용된 구조' }
      - { id: '4', text: '구문 - 프로그래밍 언어로 프로그램을 작성하는 규칙' }
    answers: ['3']
    explanation: |
      선택지 1: 프로그래밍 언어의 문자는 주로 영문 알파벳, 아라비아 숫자, 특수 문자로 이루어지므로 옳다.
      선택지 2: 어휘는 문자들을 모아 만든 단어로 옳다.
      선택지 3: 토큰은 문자를 모아 만든 의미 있는 최소 단위(어휘 단위)이다. 한 개 이상의 어휘를 결합해 구문적으로 허용된 구조를 만드는 것은 구문(문장)의 설명이므로 잘못 짝지어졌다. 정답이다.
      선택지 4: 구문은 어휘(토큰)들을 결합해 프로그램을 작성하는 규칙이므로 옳다.

      핵심 개념:
      프로그래밍 언어의 구조는 문자 → 어휘(토큰) → 구문으로 이루어진다.
      토큰의 종류에는 예약어, 식별자, 상수(리터럴), 연산자, 구분자가 있다.
      어휘 분석은 문자열을 토큰으로 나누는 단계이다.
      구문 분석은 토큰들이 문법 규칙에 맞게 결합되었는지 검사하는 단계이다.
    tags: [lexical-structure, token]

  - id: e17-52
    type: multiple-choice
    chapter: 4
    prompt: BNF에 대한 설명으로 바른 것은?
    choices:
      - { id: '1', text: 구문에 대한 형식 정의를 하는 방법 }
      - { id: '2', text: 생성 규칙의 오른쪽 부분은 정의될 대상임 }
      - { id: '3', text: 생성 규칙의 왼쪽 부분은 정의될 대상에 대한 정의임 }
      - { id: '4', text: '{x}는 x가 나타나지 않거나 한번 나타날 수 있음' }
    answers: ['1']
    explanation: |
      선택지 1: BNF(Backus-Naur Form)는 생성 규칙으로 프로그래밍 언어의 구문을 형식적으로 정의하는 표기법이므로 정답이다.
      선택지 2: 생성 규칙의 오른쪽은 정의될 대상에 대한 정의(내용)이다.
      선택지 3: 생성 규칙의 왼쪽이 정의될 대상(비단말 기호)이다. 2번과 설명이 서로 바뀌었다.
      선택지 4: { }는 BNF가 아니라 EBNF(Extended BNF)의 메타 기호이고, 의미도 0번 이상 반복이다. 0번 또는 1번은 [ ]이다.

      핵심 개념:
      BNF 생성 규칙은 "왼쪽(정의될 비단말 기호) ::= 오른쪽(정의)" 형태이다.
      BNF는 Algol60의 구문을 정의하기 위해 Backus와 Naur가 사용했다.
      BNF 메타 기호는 ::=, |, < >이다.
      EBNF는 { }(반복), [ ](선택), ( )(그룹)를 추가해 BNF를 간결하게 만든다.
    tags: [bnf, production-rule]

  - id: e17-53
    type: multiple-choice
    chapter: 4
    prompt: BNF 표기법에 대한 설명으로 ==잘못된== 것은?
    choices:
      - { id: '1', text: '비단말 기호 - 각괄호 < >로 묶인 기호' }
      - { id: '2', text: '단말 기호 - 각괄호로 묶이지 않은 기호로 예약어 등 존재' }
      - { id: '3', text: '메타 기호 ::= - 정의' }
      - { id: '4', text: '메타 기호 | - 반복' }
    answers: ['4']
    explanation: |
      선택지 1: BNF에서 비단말 기호는 < >로 묶어 표시하므로 옳다.
      선택지 2: 단말 기호는 < >로 묶지 않으며 예약어, 연산자 기호, 숫자 등이 있으므로 옳다.
      선택지 3: ::=는 "정의한다"는 뜻의 메타 기호이므로 옳다.
      선택지 4: |는 택일(또는)을 뜻하는 메타 기호이다. 반복은 BNF에서 재귀 규칙으로, EBNF에서 { }로 표현한다. 정답이다.

      핵심 개념:
      BNF는 단말 기호, 비단말 기호, 메타 기호로 구성된다.
      메타 기호 ::=는 정의, |는 택일, < >는 비단말 기호 표시이다.
      BNF에는 반복 전용 기호가 없어 <list> ::= <item> | <item> <list>처럼 재귀로 반복을 표현한다.
      EBNF의 { }는 이런 반복을 간결하게 나타낸다.
    tags: [bnf, meta-symbol]

  - id: e17-54
    type: multiple-choice
    chapter: 4
    prompt: 구문 도표에 대한 설명으로 바른 것은?
    choices:
      - { id: '1', text: 구문에 대한 형식 정의를 하는 유일한 방법 }
      - { id: '2', text: '순서도와 비슷하며, EBNF 선언과 바로 대응시킬 수 있음' }
      - { id: '3', text: 비단말 기호는 원으로 표시 }
      - { id: '4', text: 단말 기호는 사각형으로 표시 }
    answers: ['2']
    explanation: |
      선택지 1: 구문의 형식 정의 방법에는 BNF, EBNF, 구문 도표가 있으므로 유일한 방법이 아니다.
      선택지 2: 구문 도표는 화살표 흐름으로 구문을 그리므로 순서도와 비슷하고, 택일·반복·선택 경로가 EBNF의 |, { }, [ ]와 바로 대응되므로 정답이다.
      선택지 3: 구문 도표에서 비단말 기호는 사각형으로 표시한다.
      선택지 4: 단말 기호는 원(타원)으로 표시한다. 3번과 4번은 도형이 서로 바뀌었다.

      핵심 개념:
      구문 도표(syntax diagram)는 구문 규칙을 그림으로 표현한 것이다.
      비단말 기호는 사각형, 단말 기호는 원 또는 타원으로 그린다.
      갈라지는 경로는 택일, 되돌아가는 경로는 반복, 건너뛰는 경로는 생략 가능을 뜻한다.
      Pascal의 구문 정의에 구문 도표가 사용된 것으로 유명하다.
    tags: [syntax-diagram, ebnf]

  - id: e17-55
    type: multiple-choice
    chapter: 5
    prompt: 파스 트리에 대한 설명으로 바른 것은?
    choices:
      - { id: '1', text: 구문에 대한 형식 정의를 하는 방법 }
      - { id: '2', text: 비단말 노드의 나열이 주어진 BNF로 생성 가능한 표현임 }
      - { id: '3', text: 주어진 BNF에 의해 어떤 표현이 생성될 수 있는지 확인하는 방법 }
      - { id: '4', text: 주어진 표현에 대한 파스 트리는 항상 유일함 }
    answers: ['3']
    explanation: |
      선택지 1: 구문을 형식적으로 정의하는 방법은 BNF, EBNF, 구문 도표이다. 파스 트리는 정의된 문법을 적용한 결과를 보여 준다.
      선택지 2: 생성된 표현은 단말 노드(리프)를 차례로 나열한 것이다.
      선택지 3: 파스 트리를 그려 보면 어떤 표현이 주어진 BNF로 생성될 수 있는지 확인할 수 있으므로 정답이다.
      선택지 4: 모호한 문법에서는 같은 표현에 대해 파스 트리가 두 개 이상 존재할 수 있다.

      핵심 개념:
      파스 트리는 시작 기호로부터 생성 규칙을 적용해 표현을 유도하는 과정을 트리로 나타낸다.
      루트는 시작 기호, 내부 노드는 비단말 기호, 리프는 단말 기호이다.
      리프를 왼쪽부터 읽으면 유도된 표현이 된다.
      한 표현에 파스 트리가 여럿이면 그 문법은 모호하다.
    tags: [parse-tree]

  - id: e17-56
    type: multiple-choice
    chapter: 6
    prompt: 컴파일 기법에 대한 설명으로 바른 것은?
    choices:
      - { id: '1', text: 한번 번역된 코드는 다시 번역할 필요 없음 }
      - { id: '2', text: 논리적 순서대로 문장을 번역 }
      - { id: '3', text: 직접 고수준의 프로그램을 실행 }
      - { id: '4', text: 사용자의 유연성을 중시함 }
    answers: ['1']
    explanation: |
      선택지 1: 컴파일 기법은 원시 프로그램 전체를 기계어로 번역해 목적 프로그램을 만들어 두므로, 프로그램을 바꾸지 않는 한 다시 번역할 필요가 없다. 정답이다.
      선택지 2: 실행 흐름(논리적 순서)을 따라 문장을 하나씩 해석해 나가는 것은 인터프리트 기법이다.
      선택지 3: 고수준 프로그램을 직접 실행하는 것은 인터프리트 기법이다.
      선택지 4: 사용자의 유연성을 중시하는 것은 인터프리트 기법이다. 컴파일 기법은 실행 효율을 중시한다.

      핵심 개념:
      컴파일 기법은 번역 후 실행하므로 실행 속도가 빠르다.
      번역 결과(목적 코드)를 반복해 실행할 수 있다.
      인터프리트 기법은 실행할 때마다 해석하므로 느리지만 대화형 개발과 디버깅에 유리하다.
      Java처럼 중간 코드로 번역한 뒤 해석하는 혼합 방식도 있다.
    tags: [compiler, language-implementation]

  - id: e17-57
    type: multiple-choice
    chapter: 7
    prompt: 변수의 네 가지 요소에 해당하는 것은?
    choices:
      - { id: '1', text: 상수 }
      - { id: '2', text: 주소 }
      - { id: '3', text: 예약어 }
      - { id: '4', text: 객체 }
    answers: ['2']
    explanation: |
      선택지 1: 상수는 값이 바뀌지 않는 자료이며 변수의 구성 요소가 아니다.
      선택지 2: 주소는 변수 값이 저장된 기억 장소의 위치로, 이름·주소·값·타입의 네 요소 중 하나이므로 정답이다.
      선택지 3: 예약어는 언어가 특별한 의미로 정해 둔 단어이다.
      선택지 4: 객체는 객체 지향 언어에서 자료와 연산을 묶은 실체이며 변수의 요소가 아니다.

      핵심 개념:
      변수의 네 가지 요소는 이름, 주소, 값, 타입(속성)이다.
      이름으로 변수를 식별하고, 주소로 기억 장소를 찾으며, 값은 그 안에 저장된 내용이다.
      타입은 가질 수 있는 값의 범위와 적용 가능한 연산을 정한다.
      배런 표기법은 이 네 요소를 그림으로 표현한다.
    tags: [variable-attributes]

  - id: e17-58
    type: multiple-choice
    chapter: 7
    prompt: 선언에 대한 설명과 거리가 ==먼== 것은?
    choices:
      - { id: '1', text: 바인딩을 제공하는 중요한 방법 }
      - { id: '2', text: 실행 시 사용될 자료의 속성을 컴파일러 등에게 알려주는 것 }
      - { id: '3', text: 묵시적 선언만 존재 }
      - { id: '4', text: 정적 형 검사를 가능하게 함 }
    answers: ['3']
    explanation: |
      선택지 1: 선언은 이름에 타입 등 속성을 연결하는 바인딩의 중요한 수단이므로 옳다.
      선택지 2: 선언은 실행 시 사용될 자료의 속성을 번역기(컴파일러)에게 미리 알려 주는 것이므로 옳다.
      선택지 3: 선언에는 선언문으로 타입을 적는 명시적 선언과 이름 규칙 등으로 타입을 정하는 묵시적 선언이 모두 있다. 묵시적 선언만 존재한다는 설명은 틀렸으므로 정답이다.
      선택지 4: 선언으로 번역 시간에 타입을 알 수 있어 정적 형 검사가 가능해지므로 옳다.

      핵심 개념:
      선언(declaration)은 프로그램에서 사용할 이름과 그 속성을 알리는 문장이다.
      명시적 선언은 int x;처럼 타입을 직접 적고, 묵시적 선언은 Fortran의 I~N 규칙처럼 기본 규칙을 따른다.
      선언은 정적 바인딩과 정적 형 검사를 가능하게 한다.
      그 결과 오류를 실행 전에 찾고 효율적인 코드를 만들 수 있다.
    tags: [declaration, explicit-declaration, implicit-declaration]

  - id: e17-59
    type: multiple-choice
    chapter: 12
    prompt: 할당문이 ==아닌== 것은?
    choices:
      - { id: '1', text: 'A == B' }
      - { id: '2', text: 'A += B' }
      - { id: '3', text: 'A -= B' }
      - { id: '4', text: 'A = B' }
    answers: ['1']
    explanation: |
      선택지 1: A == B는 두 값이 같은지 비교하는 관계 연산이며 값을 저장하지 않으므로 할당문이 아니다. 정답이다.
      선택지 2: A += B는 A = A + B를 줄인 복합 할당문이다.
      선택지 3: A -= B는 A = A - B를 줄인 복합 할당문이다.
      선택지 4: A = B는 B의 값을 A에 저장하는 기본 할당문이다.

      핵심 개념:
      할당문은 오른쪽 수식의 값을 왼쪽 변수에 저장하는 문장이다.
      C 계열 언어에는 =, +=, -=, *=, /= 등의 할당 연산자가 있다.
      ==는 같음을 비교하는 관계 연산자로 결과는 참 또는 거짓이다.
      Pascal은 할당에 :=, 비교에 =를 써서 둘을 구분한다.
    tags: [assignment-statement]

  - id: e17-60
    type: multiple-choice
    chapter: 12
    prompt: 반복문과 관련된 것은?
    choices:
      - { id: '1', text: if }
      - { id: '2', text: for }
      - { id: '3', text: then }
      - { id: '4', text: else }
    answers: ['2']
    explanation: |
      선택지 1: if는 조건문을 시작하는 키워드이다.
      선택지 2: for는 초기값, 조건, 증감을 정해 문장을 반복 실행하는 반복문 키워드이므로 정답이다.
      선택지 3: then은 조건문에서 조건이 참일 때 실행할 부분을 나타내는 키워드이다.
      선택지 4: else는 조건문에서 조건이 거짓일 때 실행할 부분을 나타내는 키워드이다.

      핵심 개념:
      제어문은 조건문과 반복문으로 나눌 수 있다.
      조건문 키워드: if, then, else, case, switch.
      반복문 키워드: for, while, do-while, repeat-until.
      반복문은 조건이 만족되는 동안 또는 정해진 횟수만큼 같은 문장을 되풀이한다.
    tags: [loop, control-statement]
