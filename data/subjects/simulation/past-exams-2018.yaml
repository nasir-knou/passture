      선택지 3: 고객3은 TIME 3에 도착해 TIME 4에 봉사를 시작하여 1, 고객4는 TIME 5에 도착해 TIME 7에 봉사를 시작하여 2를 기다렸다. 나머지 고객은 도착 즉시 봉사를 받았으므로 총대기시간은 1+2=3이다. QUEUE 열의 합(TIME 3, 5, 6의 1)도 3이다.
      선택지 4: 대기한 고객의 대기시간 합보다 큰 값이다.

      핵심 개념:
      대기시간 = 봉사 시작 시간 - 도착 시간이다.
      고정시간법에서는 매 단위시간의 QUEUE 값을 누적한 totque가 총대기시간과 같다.
