  - id: e18-22
    type: multiple-choice
    chapter: 5
    prompt: 다음 중 고정시간법의 특징은?
    choices:
      - { id: '1', text: 사건중심으로 진행하는 경우 효율적이다. }
      - { id: '2', text: 처리 고객수를 미리 알 수 있다. }
      - { id: '3', text: 언제 끝날지 종료 시간을 미리 알 수 없다. }
      - { id: '4', text: '1분, 1시간 등 고정시간 단위로 진행한다.' }
    answers: ['4']
    explanation: |
      선택지 1: 사건이 일어나는 시점으로 시간을 건너뛰며 진행하는 방식은 다음사건법(사건중심 시간 진행법)이다.
      선택지 2: 처리할 고객 수를 정해 두고 진행하는 것은 다음사건법의 특징이며, 고정시간법은 종료 시각까지 몇 명이 처리될지 미리 알 수 없다.
      선택지 3: 종료 시간을 미리 알 수 없는 것은 고객 수로 종료하는 다음사건법의 특징이다. 고정시간법은 종료 시각을 정해 두고 진행한다.
      선택지 4: 고정시간법은 1분, 1시간처럼 일정한 시간 단위(tstep)만큼 시각을 증가시키며 그 사이의 변화를 처리하므로 정답이다.

      핵심 개념:
      이산사건 시뮬레이션의 시간 진행법에는 고정시간법과 다음사건법이 있다.
      고정시간법은 일정 간격으로 시계를 진행하므로 종료 시각은 알지만 사건이 없는 구간도 처리해야 한다.
      다음사건법은 다음 사건 발생 시각으로 바로 이동하므로 사건이 드문 경우 효율적이다.
    tags: [time-advance, fixed-time-increment]

  - id: e18-23
    type: multiple-choice
    chapter: 5
    passageRefs: [g18-discrete-event-01, g18-discrete-event-02]
    prompt: 시뮬레이션 종료조건으로 처리해야 할 총고객 수는?
    choices:
      - { id: '1', text: totarr }
      - { id: '2', text: timing }
      - { id: '3', text: next }
      - { id: '4', text: marrvt }
    answers: ['1']
    explanation: |
      선택지 1: 주프로그램은 while( numcus < totarr )로 반복하므로 봉사받은 고객 수 numcus가 totarr(1000)에 도달하면 종료한다. 따라서 처리해야 할 총고객 수는 totarr이다.
      선택지 2: timing은 다음에 일어날 사건과 그 시각을 결정하는 부프로그램이다.
      선택지 3: next는 timing이 정한 다음 사건의 종류(1이면 도착, 아니면 출발)이다.
      선택지 4: marrvt는 평균 도착간격 5.0이다.

      핵심 개념:
      다음사건법 시뮬레이션은 init으로 초기화한 뒤 timing으로 다음 사건을 고르고 해당 사건 루틴(arrive, depart)을 호출하는 과정을 반복한다.
      종료조건으로 처리 고객 수를 지정하므로 종료 시각은 미리 알 수 없다.
      반복이 끝나면 report로 결과를 출력한다.
    tags: [discrete-event, termination-condition]

  - id: e18-24
    type: multiple-choice
    chapter: 5
    passageRefs: [g18-discrete-event-01, g18-discrete-event-02]
    prompt: 현재 고객의 봉사시간을 구하려고 한다. 관계==없는== 것은?
    choices:
      - { id: '1', text: nseed }
      - { id: '2', text: e_dep }
      - { id: '3', text: marrvt }
      - { id: '4', text: mservt }
    answers: ['3']
    explanation: |
      선택지 1: nseed는 expon(nseed, mservt, e_dep)에서 봉사시간 난수의 초기값으로 쓰인다.
      선택지 2: e_dep는 expon이 발생시킨 봉사시간 값으로 tne[2] = time + e_dep 계산에 쓰인다.
      선택지 3: marrvt는 expon(seed, marrvt, e_arr)에서 도착간격을 발생시키는 평균 도착간격이므로 봉사시간 계산과 관계없다.
      선택지 4: mservt는 평균 봉사시간 2.5로 봉사시간을 발생시키는 지수분포의 평균이다.

      핵심 개념:
      arrive 루틴은 다음 고객의 도착간격(e_arr)과, 창구가 비어 있을 때 현재 고객의 봉사시간(e_dep)을 지수분포로 발생시킨다.
      도착간격은 seed와 marrvt, 봉사시간은 nseed와 mservt를 사용하여 서로 독립적으로 발생시킨다.
    tags: [discrete-event, service-time]

