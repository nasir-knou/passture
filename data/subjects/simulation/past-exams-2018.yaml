  - id: g18-chi-square-01
    type: text
    body: |
      ※ (67~68) $\chi^2$-검정에 관한 사항이다. 6000개의 난수를 발생시켜서 100개의 구간으로 나누었다.

      $\chi^2 = k/n \sum_{i=1}^{k} (O_i - n/k)^2$

questions:
  - id: e18-01
    type: multiple-choice
    chapter: 2
    prompt: 다음은 시뮬레이션 모델의 이용 범주에 대한 설명이다. ==틀린== 것은?
    choices:
      - { id: '1', text: 시스템이나 문제를 정의하고 이해를 주는 설명적 기능 }
      - { id: '2', text: 미래의 개발계획을 예측하고 도와주는 예측적인 도구 }
      - { id: '3', text: 실시스템을 수리적인 공식으로 표현하는 해석적 기능 }
      - { id: '4', text: 제안된 해결방안을 종합하고 평가하는 설계평가 도구 }
    answers: ['3']
    explanation: |
      선택지 1: 모델은 시스템이나 문제를 정의하고 그 구조를 이해하게 해 주는 설명적 기능을 가진다.
      선택지 2: 모델은 미래의 개발계획을 예측하고 의사결정을 돕는 예측 도구로 이용된다.
      선택지 3: 모델의 해석적(분석적) 이용은 실시스템을 분석하는 도구로 쓰는 것이다. 실시스템을 수리적인 공식으로 표현하는 것은 모델의 형태(수리적 모델)에 대한 설명이지 이용 범주가 아니므로 틀린 설명이다.
      선택지 4: 모델은 제안된 해결방안을 종합하고 평가하는 설계평가 도구로 이용된다.

      핵심 개념:
      모델은 실시스템을 대신하여 연구하기 위한 시스템의 표현이다.
      모델의 이용 범주는 설명적 기능, 분석(해석)적 도구, 설계평가 도구, 예측 도구로 정리된다.
      물리적 모델과 수리적 모델은 이용 범주가 아니라 모델을 표현하는 형태에 따른 구분이다.
    tags: [model, model-usage]

  - id: e18-02
    type: multiple-choice
    chapter: 2
    prompt: 다음은 시스템에 대한 설명이다. 설명이 ==틀린== 것은?
    choices:
      - { id: '1', text: 관심의 대상이 되는 실세계의 부분집합 }
      - { id: '2', text: 어느 목적을 위하여 하나 이상 서로 관련 있는 구성요소가 결합된 것 }
      - { id: '3', text: 특별한 대상들의 집합은 하위시스템이 될 수 있다. }
      - { id: '4', text: 모든 외적요인들은 함수식으로 명시된다. }
    answers: ['4']
    explanation: |
      선택지 1: 시스템은 실세계 가운데 관심의 대상으로 삼아 경계를 정한 부분집합이다.
      선택지 2: 시스템은 어떤 목적을 위해 서로 관련된 하나 이상의 구성요소가 결합된 것으로 정의된다.
      선택지 3: 시스템 안의 특정 대상들의 집합은 다시 하나의 하위시스템(subsystem)으로 볼 수 있다.
      선택지 4: 시스템 외부에서 영향을 주는 외적요인(환경)은 시스템 경계 밖에 있으며 모두 함수식으로 명시되는 것이 아니므로 틀린 설명이다.

      핵심 개념:
      시스템은 목적을 가지고 상호작용하는 구성요소(개체)들의 집합이다.
      시스템은 경계를 기준으로 내부의 구성요소와 외부의 환경으로 나뉜다.
      시스템의 일부 대상 집합은 하위시스템이 되어 계층적으로 구성될 수 있다.
    tags: [system, subsystem]

  - id: e18-03
    type: multiple-choice
    chapter: 2
    passageRefs: [g18-model-difficulty-01]
    prompt: 다음은 시스템 모델링이 어려운 경우에 대한 설명이다. 괄호 안에 들어갈 내용을 올바르게 나열한 것은?
    choices:
      - { id: '1', text: '의사결정, 랜덤한, 기본규칙, 정량화' }
      - { id: '2', text: '기본규칙, 정량화, 의사결정, 랜덤화' }
      - { id: '3', text: '기본규칙, 의사결정, 랜덤 규칙, 정량화' }
      - { id: '4', text: '의사결정, 정량화 된, 기본규칙, 랜덤화' }
    answers: ['1']
    explanation: |
      선택지 1: 인간의 의사결정이 시스템의 절대적인 부분을 차지하고, 랜덤한 구성요소들이 중요한 요인이 되며, 이용 가능한 기본규칙이 거의 없고, 정량화하기 어려운 정책적 입력이 요구되는 경우이므로 올바른 나열이다.
      선택지 2: 가에 기본규칙, 다에 의사결정을 넣으면 문장이 성립하지 않고, 라의 '랜덤화하기 어려운 정책적 입력'도 모델링 곤란 사유와 맞지 않는다.
      선택지 3: 가에 기본규칙을 넣으면 '인간의 기본규칙'이 되어 뜻이 통하지 않으며, 나와 다의 순서도 뒤바뀌어 있다.
      선택지 4: 나에 '정량화 된'을 넣으면 오히려 모델링이 쉬운 구성요소가 되고, 라의 '랜덤화'도 맞지 않는다.

      핵심 개념:
      시스템 모델링이 어려운 경우는 인간의 의사결정이 큰 비중을 차지할 때, 랜덤한 구성요소가 중요한 요인일 때이다.
      또한 이용 가능한 기본규칙이 거의 없거나, 정량화하기 어려운 정책적 입력이 필요할 때도 모델링이 어렵다.
      이런 경우 해석적 방법보다 시뮬레이션이 유용한 대안이 된다.
    tags: [modeling, model]

  - id: e18-04
    type: multiple-choice
    chapter: 2
    prompt: 시뮬레이션 모델을 분류하는 방법은 여러 형태가 있다. 다음 중 상태변수가 확률변수를 사용하는지의 여부에 따라 분류하는 방법은?
    choices:
      - { id: '1', text: 결정적 모델과 확률적 모델 }
      - { id: '2', text: 정적모델과 동적모델 }
      - { id: '3', text: 이산모델과 연속모델 }
      - { id: '4', text: 물리적 모델과 수리적 모델 }
    answers: ['1']
    explanation: |
      선택지 1: 확률변수를 전혀 포함하지 않으면 결정적 모델, 하나 이상의 확률변수를 포함하면 확률적 모델로 분류하므로 정답이다.
      선택지 2: 정적모델과 동적모델은 시간의 흐름에 따라 상태가 변하는지 여부에 따른 분류이다.
      선택지 3: 이산모델과 연속모델은 상태변수가 시간에 따라 이산적으로 변하는지 연속적으로 변하는지에 따른 분류이다.
      선택지 4: 물리적 모델과 수리적 모델은 모델을 실물 형태로 만드는지 수학적·논리적 관계로 표현하는지에 따른 분류이다.

      핵심 개념:
      시뮬레이션 모델의 분류 기준에는 시간 개념(정적/동적), 상태 변화 방식(이산/연속), 확률 요소 포함 여부(결정적/확률적)가 있다.
      결정적 모델은 입력이 정해지면 출력이 하나로 정해지고, 확률적 모델은 확률변수 때문에 출력도 확률적으로 변한다.
    tags: [model-classification, stochastic-model]

  - id: e18-05
    type: multiple-choice
    chapter: 1
    passageRefs: [g18-monte-carlo-pi-01, g18-monte-carlo-pi-02, g18-monte-carlo-pi-03, g18-monte-carlo-pi-04]
    prompt: 다음 중 발생시킨 2차원 난수의 개수로 값이 50,000 인 변수는?
    choices:
      - { id: '1', text: U }
      - { id: '2', text: limit }
      - { id: '3', text: count }
      - { id: '4', text: s }
    answers: ['2']
    explanation: |
      선택지 1: U는 random(n,U)로 발생시킨 $U[0,1)$ 난수 하나의 값으로, x와 y 좌표에 차례로 대입된다.
      선택지 2: 반복문 while i ≤ limit가 limit번 수행되며 매번 (x, y) 한 쌍을 만들므로 limit가 발생시킨 2차원 난수의 개수 50,000이다.
      선택지 3: count는 $x^2+y^2 \le 1$을 만족하여 1/4 원 A 안에 들어간 점의 개수이다.
      선택지 4: s는 count/limit로 구한 A의 면적과, 이를 4배 한 π의 추정값을 담는 변수이다.

      핵심 개념:
      몬테칼로 시뮬레이션은 난수를 이용해 확률적 실험을 반복하여 근사값을 구하는 방법이다.
      면적이 1인 정사각형 안에 점을 limit개 찍으면 1/4 원 안의 점 비율 count/limit가 면적 π/4에 근사한다.
      따라서 π ≈ 4 × count/limit로 추정한다.
    tags: [monte-carlo, random-number]

  - id: e18-06
    type: multiple-choice
    chapter: 1
    passageRefs: [g18-monte-carlo-pi-01, g18-monte-carlo-pi-02, g18-monte-carlo-pi-03, g18-monte-carlo-pi-04]
    prompt: 다음 중 알고리즘에서 A의 면적을 나타내는 것은?
    choices:
      - { id: '1', text: ㉮ }
      - { id: '2', text: ㉯ }
      - { id: '3', text: ㉰ }
      - { id: '4', text: ㉱ }
    answers: ['3']
    explanation: |
      선택지 1: ㉮ x=U는 첫 번째 난수를 점의 x 좌표로 정하는 부분이다.
      선택지 2: ㉯ count=count+1은 점이 1/4 원 안에 들어갈 때 개수를 세는 부분이다.
      선택지 3: ㉰ s = count/limit는 해결방법의 A = count/50,000에 해당하므로 A의 면적을 나타낸다.
      선택지 4: ㉱ s = s*4는 π = 4*A를 계산한 것으로 π의 추정값이다.

      핵심 개념:
      50,000 : 1 = count : A 의 비례식에서 A = count/50,000이다.
      알고리즘에서 limit가 50,000이므로 count/limit가 A의 면적 추정값이다.
      A = π/4이므로 A에 4를 곱하면 π의 근사값을 얻는다.
    tags: [monte-carlo, area-estimation]

