  - id: e18-09
    type: multiple-choice
    chapter: 3
    passageRefs: [g18-multi-server-01, g18-multi-server-02]
    prompt: 다음 중 prarr 의 초기값은?
    choices:
      - { id: '1', text: 1/2 }
      - { id: '2', text: 1/3 }
      - { id: '3', text: 1/4 }
      - { id: '4', text: 1/5 }
    answers: ['1']
    explanation: |
      선택지 1: 도착상태가 시간당 평균 30대이므로 분당 도착확률은 30/60 = 1/2이다. U < prarr*tstep으로 도착 여부를 판정하므로 prarr = 1/2이다.
      선택지 2: 1/3은 시간당 평균 20대가 도착할 때의 분당 확률이다.
      선택지 3: 1/4는 시간당 평균 15대가 도착할 때의 분당 확률이다.
      선택지 4: 1/5는 시간당 평균 12대가 도착할 때의 분당 확률이다.

      핵심 개념:
      고정시간 단위(tstep = 1분)로 진행하는 대기행렬 시뮬레이션은 매 단위시간마다 난수 U를 발생시켜 도착 여부를 결정한다.
      단위시간당 도착확률 prarr는 시간당 도착 대수를 60분으로 나눈 값이다.
      U가 prarr*tstep보다 작으면 고객이 도착한 것으로 보고 대기행렬에 추가한다.
    tags: [multi-server-queue, arrival-probability]

  - id: e18-10
    type: multiple-choice
    chapter: 3
    passageRefs: [g18-multi-server-01, g18-multi-server-02]
    prompt: 다음 중 tlimit 의 초기값은?
    choices:
      - { id: '1', text: '5' }
      - { id: '2', text: '30' }
      - { id: '3', text: '100' }
