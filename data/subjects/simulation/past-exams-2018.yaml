    language: text
    body: |
      <알고리즘>
      {
             :
         while time < tlimit do
           {time = time+tstep
            arrive = 0
            call random(seed, U)
            if U < prarr*tstep then
              { arrive = 1
                queue = queue+arrive
                totarr=totarr+1   }
                i = 0
              while(i < 2  ) do
                { i = i + 1
                 if (tpump(i) > 0.0) then
                      { tpump(i) = tpump(i) - tstep
                          if (tpump(i)  < 0.0) then
                              tpump(i) = 0.0 }
                 if (tpump(i) = 0.0 and queue ≠ 0) then
                          {  queue = queue - 1
                             call poissn(seed,mean,p)
                             tpump(i) = p}
                                        } end of while1
                               ‘가’            } end of while2
         aveque = totque/(tlimit/tstep)
         print aveque, totarr
         stop  }

