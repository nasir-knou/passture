      선택지 1: 0,1,1,2,4는 도착시간 간격이다.
      선택지 2: 1,2,3,5,9는 도착 시간이다.
      선택지 3: 세 번째 고객의 봉사시간은 5이고 다섯 번째 고객까지 있으므로 3,5,6,9는 맞지 않는다.
      선택지 4: 봉사가 시작될 때 TPUMP에 새로 설정되는 값을 읽는다. 고객1은 TIME 1에 TPUMP[1]=3, 고객2는 TIME 2에 TPUMP[2]=5, 고객3은 TIME 4에 TPUMP[1]=5, 고객4는 TIME 7에 TPUMP[2]=3, 고객5는 TIME 9에 TPUMP[1]=9이므로 3,5,5,3,9이다.

      핵심 개념:
      TPUMP[i]는 i번 창구의 남은 봉사시간이며 매 단위시간 1씩 줄어든다.
      값이 감소하지 않고 새로 커지는 시점이 새 고객의 봉사가 시작된 시점이고, 그 값이 봉사시간이다.
      창구가 모두 사용 중이면 도착 고객은 QUEUE에서 기다린다.
    tags: [multi-server-queue, service-time]

  - id: e18-17
    type: multiple-choice
    chapter: 3
    passageRefs: [g18-multi-server-output-01, g18-multi-server-output-02]
    prompt: 4번 고객까지 출발 시간을 순서대로 구한 것은?
    choices:
      - { id: '1', text: '1,2,3,4' }
      - { id: '2', text: '3,4,7,9' }
      - { id: '3', text: '4,7,9,10' }
      - { id: '4', text: '5,6,10,12' }
    answers: ['3']
    explanation: |
      선택지 1: 표의 TPUMP 변화로 구한 출발 시간 4,7,9,10과 맞지 않는다.
      선택지 2: 첫 고객의 출발 시간은 3이 아니라 TPUMP[1]이 0이 되는 TIME 4이다.
      선택지 3: 고객1은 TIME 1에 봉사 3을 시작하여 TIME 4에 출발, 고객2는 TIME 2에 봉사 5를 시작하여 TIME 7에 출발, 고객3은 TIME 4에 봉사 5를 시작하여 TIME 9에 출발, 고객4는 TIME 7에 봉사 3을 시작하여 TIME 10에 출발하므로 4,7,9,10이다.
      선택지 4: 표의 TPUMP 변화로 구한 출발 시간 4,7,9,10과 맞지 않는다.

      핵심 개념:
      출발 시간 = 봉사 시작 시간 + 봉사시간이다.
      대기한 고객은 창구가 비는 시각에 봉사를 시작하므로 봉사 시작 시간이 도착 시간보다 늦다.
      TPUMP 값이 0이 되는 시각에 해당 창구의 고객이 출발하고, 대기 고객이 있으면 곧바로 다음 봉사가 시작된다.
    tags: [multi-server-queue, departure-time]

