  - id: e18-19
    type: multiple-choice
    chapter: 3
    passageRefs: [g18-service-time-01, g18-service-time-02]
    prompt: 다음 중 정규확률변수의 평균 값으로 연료탱크의 평균을 나타내는 것은?
    choices:
      - { id: '1', text: liters }
      - { id: '2', text: nseed }
      - { id: '3', text: nmean }
      - { id: '4', text: stdev }
    answers: ['3']
    explanation: |
      선택지 1: liters는 normal 루틴이 발생시킨 정규확률변수 값, 즉 고객 한 명의 급유량이다.
      선택지 2: nseed는 정규확률변수를 발생시키기 위한 난수의 초기값이다.
      선택지 3: normal(nseed,nmean,stdev,liters)에서 nmean은 정규분포의 평균으로 연료탱크의 평균 20 liter를 나타낸다.
      선택지 4: stdev는 정규분포의 표준편차 3을 나타낸다.

      핵심 개념:
      봉사시간의 변화를 반영하기 위해 급유량을 평균 20, 표준편차 3인 정규분포로 발생시킨다.
      봉사시간은 tpump = 1.0 + 1.0/8.0 * liters로 계산되어 급유량에 따라 달라진다.
    tags: [service-time, normal-distribution]

