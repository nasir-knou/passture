      - { id: '4', text: '12345' }
    answers: ['4']
    explanation: |
      선택지 1: 5는 봉사시간의 평균으로 poissn(seed,mean,p)의 mean에 해당한다.
      선택지 2: 30은 시간당 평균 도착 대수이다.
      선택지 3: 100은 시뮬레이션 시간으로 tlimit에 해당한다.
      선택지 4: random(seed, U)와 poissn(seed,mean,p)에 쓰이는 seed는 난수 발생의 초기값이므로 조건의 난수의 초기값 12345이다.

      핵심 개념:
      난수 발생 루틴은 seed(초기값)에서 시작하여 난수열을 차례로 만든다.
      같은 seed를 쓰면 같은 난수열이 재현되므로 시뮬레이션 결과를 반복 확인할 수 있다.
    tags: [multi-server-queue, random-seed]

  - id: e18-12
    type: multiple-choice
    chapter: 3
    passageRefs: [g18-multi-server-01, g18-multi-server-02]
    prompt: 빈칸 ‘가’에 적당한 것은?
    choices:
      - { id: '1', text: totque = totarr+tpump(i) }
      - { id: '2', text: totque = totque+totarr }
      - { id: '3', text: totque = totque+tstep }
      - { id: '4', text: totque = totque+queue }
    answers: ['4']
    explanation: |
      선택지 1: 총 도착 고객 수와 창구의 남은 봉사시간을 더하는 것은 대기 누적량과 관계가 없다.
      선택지 2: 매 단위시간마다 누적 도착 고객 수를 더하면 대기와 무관한 값이 과도하게 누적된다.
      선택지 3: tstep을 더하면 경과 시간만 누적될 뿐 대기행렬 길이가 반영되지 않는다.
      선택지 4: 매 단위시간마다 현재 대기행렬 길이 queue를 totque에 누적해야 aveque = totque/(tlimit/tstep)로 평균 대기행렬 길이를 구할 수 있다.

      핵심 개념:
      totque는 단위시간마다 대기 중인 고객 수를 합한 값으로, 모든 고객의 총 대기시간(단위시간 기준)과 같다.
      이를 전체 단위시간 수로 나누면 평균 대기행렬 길이, 총 도착 고객 수로 나누면 평균 대기시간이 된다.
