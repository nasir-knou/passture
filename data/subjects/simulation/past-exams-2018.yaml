      선택지 3: while time < tlimit 조건으로 시뮬레이션 종료 시각을 정하므로 tlimit는 시뮬레이션 시간 100이다.
      선택지 4: 12345는 난수의 초기값으로 seed에 해당한다.

      핵심 개념:
      고정시간법 시뮬레이션은 시각 time을 tstep씩 증가시키며 종료 시각 tlimit에 도달할 때까지 반복한다.
      조건에 주어진 값은 각각 도착률(prarr), 봉사시간 평균(mean), 창구 수(2), 종료 시각(tlimit), 난수 초기값(seed)에 대응한다.
    tags: [multi-server-queue, fixed-time-increment]

  - id: e18-11
    type: multiple-choice
    chapter: 3
    passageRefs: [g18-multi-server-01, g18-multi-server-02]
    prompt: 다음 중 seed 의 초기값은?
    choices:
