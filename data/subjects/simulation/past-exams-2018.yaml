  - id: e18-13
    type: multiple-choice
    chapter: 3
    passageRefs: [g18-multi-server-01, g18-multi-server-02]
    prompt: 평균 대기시간을 구하는 공식을 만들려고 한다. 가장 적당한 것은?
    choices:
      - { id: '1', text: totque / totarr }
      - { id: '2', text: totque / arrive }
      - { id: '3', text: totque / queue }
      - { id: '4', text: totque / (tlimit / tstep) }
    answers: ['1']
    explanation: |
      선택지 1: totque는 모든 고객의 총 대기시간이고 totarr는 도착한 총 고객 수이므로 totque/totarr가 고객 1명당 평균 대기시간이다.
      선택지 2: arrive는 해당 단위시간에 도착이 있었는지를 나타내는 0 또는 1의 값이므로 나누는 값으로 부적절하다.
      선택지 3: queue는 현재 시점의 대기행렬 길이일 뿐 전체 고객 수가 아니다.
      선택지 4: totque/(tlimit/tstep)는 알고리즘의 aveque, 즉 평균 대기행렬 길이이다.

      핵심 개념:
      평균 대기시간 = 총 대기시간 / 총 고객 수이다.
      평균 대기행렬 길이 = 총 대기시간 / 전체 시뮬레이션 단위시간 수이다.
      두 지표는 분자가 같고 분모가 다르므로 혼동하지 않도록 한다.
