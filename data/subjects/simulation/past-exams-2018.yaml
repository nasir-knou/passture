  - id: g18-world-view-01
    type: text
    body: '“시뮬레이션 모델 개발에 있어서 분석가는 모델 대상이 되는 시스템을 설명하기 위하여 개념적인 기본구조를 갖고 있어야 한다. 만일 모델 작성자가 시뮬레이션 언어를 사용한다면 기본구조는 언어에 의해 자연히 암시적으로 표현된다. 그러나 모델 작성자가 C, JAVA 등과 같은 범용언어를 사용하는 경우에는 모델 작성자가 시스템을 조직화하여 표현할 수 있는 기본구조를 작성해야 한다. 어떤 경우이든 간에 모델 작성자에 의해 사용되는 기본구조는 시스템 표현을 명확히 해주는 개념적인 도구가 된다.”'

