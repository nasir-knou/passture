    explanation: |
      선택지 1: 시뮬레이션 언어는 모델링 월드뷰에 따른 일반화된 구조를 제공하여 모델 설계를 돕는다.
      선택지 2: 시뮬레이션 언어는 필요한 기능이 내장되어 있어 프로그래밍 시간이 짧고, 출력 보고서가 정해진 형태로 제공된다. 프로그래밍 시간이 길고 보고서 형태를 자유롭게 작성할 수 있는 것은 범용언어의 특징이므로 틀린 설명이다.
      선택지 3: 시뮬레이션 언어는 모델의 설계와 변경이 쉽고 변경 내용을 곧바로 실행 프로그램에 반영할 수 있다.
      선택지 4: 범용언어는 C, JAVA, BASIC처럼 널리 쓰여 익숙하고 융통성이 크며 거의 모든 컴퓨터에서 이용할 수 있다.

      핵심 개념:
      시뮬레이션 언어의 장점은 모델 구조 제공, 짧은 프로그래밍 시간, 쉬운 모델 변경, 오류 검출 기능 등이다.
      범용언어의 장점은 익숙함, 융통성, 이식성, 자유로운 출력 형식이며 대신 프로그래밍 시간이 길다.
    tags: [simulation-language, general-purpose-language]

  - id: e18-28
    type: multiple-choice
    chapter: 7
    prompt: U[0,1)의 난수를 발생시키는데 사용되는 분포는?
    choices:
      - { id: '1', text: 정규분포 }
      - { id: '2', text: 일양분포 }
      - { id: '3', text: 포아송분포 }
      - { id: '4', text: 지수분포 }
    answers: ['2']
    explanation: |
      선택지 1: 정규분포는 평균을 중심으로 좌우 대칭인 종 모양의 연속분포로, 일양난수를 변환하여 발생시킨다.
      선택지 2: $U[0,1)$은 0 이상 1 미만의 구간에서 모든 값이 같은 확률밀도를 갖는 일양분포이다.
      선택지 3: 포아송분포는 단위시간당 사건 발생 횟수를 나타내는 이산분포이다.
      선택지 4: 지수분포는 사건 사이의 시간 간격을 나타내는 연속분포이다.

      핵심 개념:
      난수는 보통 구간 [0,1)의 일양분포를 따르는 수열을 말한다.
      다른 분포의 확률변수는 이 일양난수를 역변환법 등으로 변환하여 발생시킨다.
    tags: [random-number, uniform-distribution]

  - id: e18-29
    type: multiple-choice
    chapter: 7
    passageRefs: [g18-lcg-01]
    prompt: 이 방법의 이름은?
    choices:
      - { id: '1', text: 중앙 이승법 }
      - { id: '2', text: shift 연산법 }
      - { id: '3', text: 승산식 합동법 }
      - { id: '4', text: 혼합식 합동법 }
    answers: ['4']
    explanation: |
      선택지 1: 중앙 이승법은 수를 제곱한 뒤 가운데 자릿수를 취하여 다음 난수로 삼는 방법이다.
      선택지 2: shift 연산법은 비트 이동 연산으로 난수를 만드는 방법이다.
      선택지 3: 승산식 합동법은 $X_i = aX_{i-1} \pmod m$처럼 증분 $c$가 0인 합동법이다.
      선택지 4: $X_i = aX_{i-1} + c \pmod m$에서 $a=5$, $c=3 \ne 0$, $m=10$이므로 곱셈과 덧셈을 함께 쓰는 혼합식 합동법이다.

      핵심 개념:
      합동법(선형합동법)은 $X_i = (aX_{i-1} + c) \bmod m$으로 난수를 생성한다.
      $c \ne 0$이면 혼합식 합동법, $c = 0$이면 승산식 합동법이라 한다.
      생성된 $X_i$를 $m$으로 나누면 $[0,1)$ 구간의 난수를 얻는다.
    tags: [congruential-method, random-number]

  - id: e18-30
    type: multiple-choice
    chapter: 7
    passageRefs: [g18-lcg-01]
    prompt: '$X_0 = 1$ 를 대입하여 $X_1$ 을 구하면?'
    choices:
      - { id: '1', text: '3' }
      - { id: '2', text: '5' }
      - { id: '3', text: '8' }
      - { id: '4', text: '10' }
    answers: ['3']
    explanation: |
      선택지 1: 3은 증분 $c$만 남긴 값으로 $5X_0$을 더하지 않았다.
      선택지 2: 5는 $5X_0$만 계산하고 3을 더하지 않은 값이다.
      선택지 3: $X_1 = 5 \times 1 + 3 = 8$이고 $8 \bmod 10 = 8$이므로 정답이다.
      선택지 4: 10을 법으로 하면 나머지는 0~9 사이이므로 10은 나올 수 없다.

      핵심 개념:
      합동법에서는 이전 값에 승수를 곱하고 증분을 더한 뒤 법 $m$으로 나눈 나머지를 다음 값으로 삼는다.
      $m = 10$이면 생성 가능한 값은 0부터 9까지이다.
    tags: [congruential-method]

  - id: e18-31
    type: multiple-choice
    chapter: 7
    passageRefs: [g18-lcg-01]
    prompt: 주기는?
    choices:
      - { id: '1', text: '2' }
      - { id: '2', text: '3' }
      - { id: '3', text: '4' }
      - { id: '4', text: '5' }
    answers: ['1']
    explanation: |
      선택지 1: $X_0=1$에서 $X_1=8$, $X_2=(40+3) \bmod 10=3$, $X_3=(15+3) \bmod 10=8$이 되어 8, 3이 반복되므로 주기는 2이다.
      선택지 2: 3개의 서로 다른 값이 반복되지 않으므로 주기 3이 아니다.
      선택지 3: 생성되는 값은 8과 3 두 개뿐이므로 주기 4가 아니다.
      선택지 4: 법이 10이라도 이 식에서 반복되는 값은 두 개뿐이므로 주기 5가 아니다.

      핵심 개념:
      주기는 난수열에서 같은 값의 순환이 다시 시작될 때까지 생성되는 서로 다른 수의 개수이다.
      합동법의 최대 주기는 법 $m$이지만, $a$, $c$, $m$을 적절히 고르지 않으면 주기가 짧아진다.
      좋은 난수 발생기는 주기가 충분히 길어야 한다.
    tags: [congruential-method, period]

  - id: e18-32
    type: multiple-choice
    chapter: 7
    passageRefs: [g18-chi-square-01]
    prompt: 자유도는?
    choices:
      - { id: '1', text: '99' }
      - { id: '2', text: '100' }
      - { id: '3', text: '101' }
      - { id: '4', text: '102' }
    answers: ['1']
    explanation: |
      선택지 1: 구간의 수가 $k = 100$이므로 $\chi^2$ 검정의 자유도는 $k - 1 = 99$이다.
      선택지 2: 100은 구간의 수 $k$ 자체이다.
      선택지 3: 101은 $k + 1$로 자유도 계산과 맞지 않는다.
      선택지 4: 102는 $k + 2$로 자유도 계산과 맞지 않는다.

      핵심 개념:
      $\chi^2$ 검정은 난수의 균일성(일양성)을 검정하는 방법이다.
      $[0,1)$ 구간을 $k$개로 나누어 각 구간의 관측빈도 $O_i$와 기대빈도 $n/k$를 비교한다.
      검정통계량은 자유도 $k-1$인 $\chi^2$ 분포를 따르므로 임계값과 비교하여 판정한다.
    tags: [chi-square-test, degrees-of-freedom]

  - id: e18-33
    type: multiple-choice
    chapter: 7
    passageRefs: [g18-chi-square-01]
    prompt: 구간별 기대값인 n/k 의 값은?
    choices:
      - { id: '1', text: '20' }
      - { id: '2', text: '40' }
      - { id: '3', text: '50' }
      - { id: '4', text: '60' }
    answers: ['4']
    explanation: |
      선택지 1: 20은 난수 2000개를 100개 구간으로 나눌 때의 기대값이다.
      선택지 2: 40은 난수 4000개를 100개 구간으로 나눌 때의 기대값이다.
      선택지 3: 50은 난수 5000개를 100개 구간으로 나눌 때의 기대값이다.
      선택지 4: 난수의 개수 $n = 6000$, 구간의 수 $k = 100$이므로 $n/k = 6000/100 = 60$이다.

      핵심 개념:
      난수가 일양분포를 따른다면 각 구간에 들어갈 기대 개수는 전체 개수를 구간 수로 나눈 $n/k$이다.
      $\chi^2$ 통계량은 각 구간의 관측빈도 $O_i$가 이 기대값에서 얼마나 벗어나는지를 합하여 계산한다.
    tags: [chi-square-test, expected-frequency]

  - id: e18-34
    type: multiple-choice
    chapter: 7
    prompt: 난수의 검정에서 독립성을 검정하는 것은?
    choices:
      - { id: '1', text: '$\chi^2$ 검정' }
      - { id: '2', text: 연속형 검정 }
      - { id: '3', text: Run-up 검정 }
      - { id: '4', text: Kolmogorov-Smirnov 검정 }
    answers: ['3']
    explanation: |
      선택지 1: $\chi^2$ 검정은 구간별 관측빈도와 기대빈도를 비교하는 균일성(일양성) 검정이다.
      선택지 2: 연속형 검정(serial test)은 연속된 난수 쌍을 2차원 구간으로 나누어 $\chi^2$-검정을 하는 방법이다. 이 문제의 공식 정답은 3번이다.
      선택지 3: Run-up 검정은 난수열에서 값이 연속하여 증가하는 런(run)의 길이와 개수를 조사하여 난수들이 서로 독립인지를 검정하므로 정답이다.
      선택지 4: Kolmogorov-Smirnov 검정은 경험적 누적분포와 이론적 누적분포의 최대 차이를 비교하는 균일성 검정이다.

      핵심 개념:
      난수의 검정은 균일성 검정과 독립성 검정으로 나뉜다.
      균일성 검정에는 $\chi^2$ 검정과 Kolmogorov-Smirnov 검정이 있다.
      독립성 검정에는 Run-up 검정 등 난수열의 순서 패턴을 조사하는 방법이 있다.
    tags: [random-number-test, independence-test, runs-test]

