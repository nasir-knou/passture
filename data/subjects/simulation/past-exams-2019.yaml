  - id: e19-20
    type: multiple-choice
    chapter: 3
    passageRefs: [g19-normal-service-condition-01, g19-normal-service-code-01]
    prompt: 다음 중 정규확률변수의 평균 값으로 연료탱크의 평균을 나타내는 것은?
    choices:
      - { id: '1', text: liters }
      - { id: '2', text: nseed }
      - { id: '3', text: nmean }
      - { id: '4', text: stdev }
    answers: ['3']
    explanation: |
      선택지 1: liters는 정규분포에서 발생시킨 급유량(연료탱크 크기) 확률변수 값으로, 봉사시간 계산에 쓰인다.
      선택지 2: nseed는 정규 난수 발생을 위한 난수의 초기값이다.
      선택지 3: call normal(nseed,nmean,stdev,liters)에서 정규분포의 평균 20 liter를 전달하는 변수가 nmean이므로 정답이다.
      선택지 4: stdev는 정규분포의 표준편차 3을 나타낸다.

      핵심 개념:
      봉사시간의 변화에서는 봉사시간을 고정값이 아니라 급유량에 따라 계산한다.
      급유량 liters는 평균 20, 표준편차 3인 정규분포에서 발생시킨다.
      봉사시간은 tpump = 1.0 + 1.0/8.0 × liters로 1 liter당 1/8분을 반영한다.
    tags: [service-time, normal-distribution]

