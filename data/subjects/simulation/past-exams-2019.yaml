      선택지 2: 확률적 시뮬레이션은 난수에 따라 결과가 달라지는 추정량만 산출하고 정확한 값을 주지 못한다. 이는 시뮬레이션의 단점이므로 장점과 관계없어 정답이다.
      선택지 3: 원자력 발전소 사고처럼 실제로 실험하기 위험한 경우에도 안전하게 실험할 수 있어 장점이다.
      선택지 4: 현실에서 실현할 수 없는 조건도 모델에서는 설정해 실험·평가할 수 있어 장점이다.

