  - id: g19-chi-square-01
    type: text
    body: |
      ※ (68~69) $\chi^2$-검정에 관한 사항이다.

      6000개의 난수를 발생시켜서 100개의 구간으로 나누었다.
      $\chi^2 = k/n \sum_{i=1}^{k}(f_i - n/k)^2$

questions:
  - id: e19-01
    type: multiple-choice
    chapter: 2
    prompt: 시뮬레이션 모델은 다음과 같은 4가지 수준에서 이용될 수 있다. 이 중에서 공장의 제조공정이나 물류시스템을 분석하고 개선점을 찾는 시뮬레이션과 관련 있는 것은?
    choices:
      - { id: '1', text: '시스템이나 문제를 정의하는 설명적 장치' }
      - { id: '2', text: '한계적(critical) 구성요소를 결정하는 분석 도구' }
      - { id: '3', text: '제안된 해결방안을 종합하고 평가하는 설계평가도구' }
      - { id: '4', text: '해석적 문제를 풀이하고 해를 구하는 계산 도구' }
    answers: ['3']
    explanation: |
      선택지 1: 설명적 장치는 시스템이나 문제 자체를 정의하고 기술하는 수준으로, 현재 시스템을 이해하는 데 쓰인다. 개선안을 평가하는 용도는 아니다.
      선택지 2: 분석 도구는 시스템 성능에 결정적 영향을 주는 한계적(critical) 구성요소를 찾아내는 수준이다. 개선점 도출의 앞 단계에 해당한다.
      선택지 3: 공장의 제조공정이나 물류시스템에 대해 여러 개선안(해결방안)을 모델에 적용해 보고 결과를 비교·평가하는 것은 설계평가도구로서의 이용이므로 정답이다.
      선택지 4: 계산 도구는 해석적(수학적) 방법으로 풀기 어려운 문제의 해를 수치적으로 구하는 수준이다. 몬테칼로 적분 같은 예가 여기에 해당한다.

      핵심 개념:
      시뮬레이션 모델은 설명적 장치, 분석 도구, 설계평가도구, 계산 도구의 4가지 수준에서 이용된다.
      설계평가도구는 제안된 여러 대안을 실제로 구축하지 않고 모델에서 실험해 성능을 비교한다.
      제조공정·물류시스템의 병목 개선, 설비 배치 변경 등은 대표적인 설계평가 사례이다.
    tags: [simulation-model, model-usage]

  - id: e19-02
    type: multiple-choice
    chapter: 2
    prompt: 다음은 시스템에 대한 설명이다. 설명이 ==틀린== 것은?
    choices:
      - { id: '1', text: '관심의 대상이 되는 실세계의 부분집합.' }
      - { id: '2', text: '어느 목적을 위하여 하나 이상 서로 관련 있는 구성요소가 결합된 것' }
      - { id: '3', text: '따라서 이러한 시스템은 상대적인 것이 된다.' }
      - { id: '4', text: '범위를 고려할 때 모든 외적요인들은 입력 데이터가 된다.' }
    answers: ['4']
    explanation: |
      선택지 1: 시스템은 실세계 전체가 아니라 관심의 대상이 되는 일부분, 즉 실세계의 부분집합이다.
      선택지 2: 시스템은 어떤 목적을 달성하기 위해 서로 관련 있는 구성요소들이 결합된 것으로 정의된다.
      선택지 3: 무엇을 시스템으로 보는지는 연구 목적과 관심에 따라 달라지므로 시스템은 상대적인 개념이다.
      선택지 4: 시스템의 범위를 정하면 범위 밖의 외적요인 중 시스템에 영향을 주는 것만 입력으로 고려한다. 모든 외적요인이 입력 데이터가 되는 것은 아니므로 틀린 설명이며 정답이다.

      핵심 개념:
      시스템은 목적을 위해 상호 관련된 구성요소의 집합이며 관심 대상이 되는 실세계의 부분집합이다.
      같은 대상도 연구 목적에 따라 시스템이 되기도 하고 다른 시스템의 구성요소가 되기도 하므로 상대적이다.
      시스템의 범위(경계)를 정하면 경계 밖에서 시스템에 영향을 주는 요인만 환경(입력)으로 다룬다.
    tags: [system, system-boundary]

  - id: e19-03
    type: multiple-choice
    chapter: 2
    prompt: 다음 중  모델링을 하기 쉬운 경우는?
    choices:
      - { id: '1', text: '인간의 의사결정이 시스템의 절대적인 부분을 차지한다.' }
      - { id: '2', text: '시스템에 부수되는 물리적인 규칙이 이용 가능하다.' }
      - { id: '3', text: '랜덤한 구성요소들이 중요한 요인이 된다.' }
      - { id: '4', text: '이용 가능한 기본 규칙이 거의 없다.' }
    answers: ['2']
    explanation: |
      선택지 1: 인간의 의사결정은 규칙으로 정형화하기 어려워 이 비중이 클수록 모델링이 어려워진다.
      선택지 2: 시스템을 지배하는 물리적인 법칙(규칙)을 이용할 수 있으면 이를 수식과 논리로 그대로 표현할 수 있어 모델링이 쉬우므로 정답이다.
      선택지 3: 랜덤한 구성요소가 중요한 요인이면 확률분포를 추정하고 불확실성을 다뤄야 하므로 모델링이 어려워진다.
      선택지 4: 이용 가능한 기본 규칙이 거의 없으면 구성요소 간 관계를 정의할 근거가 없어 모델링이 어렵다.

      핵심 개념:
      모델은 시스템을 수학적·논리적 관계로 추상화한 것이다.
      물리 법칙처럼 명확한 규칙이 있는 시스템은 모델링이 쉽다.
      인간의 의사결정, 랜덤한 요소, 규칙의 부재는 모델링을 어렵게 만드는 요인이다.
    tags: [modeling, model]

  - id: e19-04
    type: multiple-choice
    chapter: 2
    prompt: 다음 중 특정 시각에서의 시스템 표현으로 몬테칼로 시뮬레이션 등과 관계있는 모델은?
    choices:
      - { id: '1', text: '결정적 모델' }
      - { id: '2', text: '정적모델' }
      - { id: '3', text: '이산모델' }
      - { id: '4', text: '수리적 모델' }
    answers: ['2']
    explanation: |
      선택지 1: 결정적 모델은 확률적 요소가 없어 입력이 정해지면 출력이 하나로 결정되는 모델이다. 시간 관점의 분류가 아니다.
      선택지 2: 정적모델은 시간의 흐름을 고려하지 않고 특정 시각에서의 시스템을 표현하는 모델이며, 몬테칼로 시뮬레이션이 대표적인 예이므로 정답이다.
      선택지 3: 이산모델은 상태변수가 이산적인 시점에서만 변하는 모델로, 시간에 따른 변화를 다루는 동적 모델의 한 종류이다.
      선택지 4: 수리적 모델은 시스템을 수식과 논리적 관계로 표현한 모델을 뜻하며, 물리적 모델과 대비되는 분류이다.

      핵심 개념:
      시뮬레이션 모델은 시간 개념에 따라 정적 모델과 동적 모델로 나뉜다.
      정적 모델은 특정 시각의 시스템 상태만 표현하며 몬테칼로 시뮬레이션에 쓰인다.
      동적 모델은 시간에 따라 변하는 시스템을 표현하며 이산형·연속형으로 다시 나뉜다.
      확률적 요소 유무에 따라서는 결정적 모델과 확률적 모델로 분류한다.
    tags: [model-classification, static-model, monte-carlo]

  - id: e19-05
    type: multiple-choice
    chapter: 1
    passageRefs: [g19-montecarlo-pi-01, g19-montecarlo-pi-figure-01, g19-montecarlo-pi-algorithm-intro-01, g19-montecarlo-pi-code-01]
    prompt: 난수 U는 총 몇 개 발생되는가?
    choices:
      - { id: '1', text: '30,000' }
      - { id: '2', text: '50,000' }
      - { id: '3', text: '100,000' }
      - { id: '4', text: '150,000' }
    answers: ['3']
    explanation: |
      선택지 1: 30,000은 지문의 어떤 반복 횟수와도 맞지 않는다.
      선택지 2: 50,000은 발생시킨 2차원 난수 (x, y)의 개수, 즉 while 반복 횟수(limit)이다. 난수 U의 개수가 아니다.
      선택지 3: 반복 한 번마다 call random(n,U)를 두 번 호출해 x와 y를 만든다. 2차원 난수 50,000개를 발생시켰으므로 U는 50,000 × 2 = 100,000개 발생하여 정답이다.
      선택지 4: 150,000은 반복 한 번에 난수를 세 개씩 발생시킬 때의 개수이다.

      핵심 개념:
      몬테칼로 시뮬레이션으로 $\pi$를 구할 때 U[0,1) 난수 두 개로 점 (x, y) 하나를 만든다.
      점이 $x^2+y^2 \le 1$을 만족하면 1/4 원 안에 들어간 것으로 보고 count를 증가시킨다.
      count/limit는 1/4 원의 면적 $\pi/4$의 추정값이므로 4를 곱하면 $\pi$의 추정값이 된다.
    tags: [monte-carlo, random-number]

  - id: e19-06
    type: multiple-choice
    chapter: 1
    passageRefs: [g19-montecarlo-pi-01, g19-montecarlo-pi-figure-01, g19-montecarlo-pi-algorithm-intro-01, g19-montecarlo-pi-code-01]
    prompt: 원안에 들어가는 점의 개수를 나타내는 변수는?
    choices:
      - { id: '1', text: s }
      - { id: '2', text: y }
      - { id: '3', text: limit }
      - { id: '4', text: count }
    answers: ['4']
    explanation: |
      선택지 1: s는 count/limit로 구한 비율에 4를 곱한 $\pi$의 추정값이다.
      선택지 2: y는 두 번째로 발생시킨 난수 U를 저장하는 점의 y좌표이다.
      선택지 3: limit는 발생시킬 2차원 난수(점)의 총 개수, 즉 반복 횟수의 상한이다.
      선택지 4: if x²+y² ≦ 1 then count=count+1에서 점이 1/4 원 안에 들어갈 때마다 1씩 증가하므로 원 안에 들어가는 점의 개수를 나타내며 정답이다.

      핵심 개념:
      몬테칼로 방법은 난수로 표본을 만들어 비율로 면적이나 확률을 추정한다.
      50,000 : 1 = count : A 관계에서 A = count/50,000이다.
      1/4 원의 면적이 $\pi/4$이므로 $\pi \approx 4 \times count/limit$이다.
    tags: [monte-carlo, estimation]

