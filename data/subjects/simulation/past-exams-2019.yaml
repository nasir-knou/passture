  - id: e19-10
    type: multiple-choice
    chapter: 3
    passageRefs: [g19-multi-server-condition-01, g19-multi-server-code-01]
    prompt: 0.25를 초기값으로 갖는 변수는?
    choices:
      - { id: '1', text: tstep }
      - { id: '2', text: prarr }
      - { id: '3', text: seed }
      - { id: '4', text: mean }
    answers: ['2']
    explanation: |
      선택지 1: tstep은 시간 증가 단위(1분)로, time = time+tstep에서 쓰인다.
      선택지 2: 도착상태가 시간당 평균 15대이므로 1분당 도착 확률은 15/60 = 0.25이다. if U < prarr*tstep then에서 도착 여부를 판정하는 prarr가 0.25를 가지므로 정답이다.
      선택지 3: seed는 난수의 초기값 35213을 갖는다.
      선택지 4: mean은 봉사시간 평균 5분을 갖는다.

      핵심 개념:
      고정시간 간격 시뮬레이션에서는 각 시간 단위마다 난수 U를 발생시켜 도착 여부를 결정한다.
      U < prarr × tstep이면 그 시간에 고객이 도착한 것으로 본다.
      시간당 평균 도착 수를 분 단위 확률로 바꾸면 prarr = 15/60 = 0.25이다.
    tags: [multi-server-queue, arrival-probability]

  - id: e19-11
    type: multiple-choice
    chapter: 3
    passageRefs: [g19-multi-server-condition-01, g19-multi-server-code-01]
    prompt: 150을 초기값으로 갖는 변수는?
    choices:
      - { id: '1', text: tlimit }
      - { id: '2', text: prarr }
      - { id: '3', text: seed }
      - { id: '4', text: mean }
    answers: ['1']
    explanation: |
      선택지 1: 시뮬레이션 시간 150은 while time < tlimit do의 종료 조건으로 쓰이는 tlimit의 값이므로 정답이다.
      선택지 2: prarr는 분당 도착 확률 0.25를 갖는다.
      선택지 3: seed는 난수의 초기값 35213을 갖는다.
      선택지 4: mean은 봉사시간 평균 5를 갖는다.

      핵심 개념:
      tlimit는 전체 시뮬레이션 시간이며 time이 tlimit에 도달하면 반복을 끝낸다.
      평균 대기행렬 길이는 aveque = totque/(tlimit/tstep)로 구한다.
      tlimit/tstep은 시뮬레이션에서 관측한 시간 단위의 총 개수이다.
    tags: [multi-server-queue, simulation-time]

  - id: e19-12
    type: multiple-choice
    chapter: 3
    passageRefs: [g19-multi-server-condition-01, g19-multi-server-code-01]
    prompt: 5를 초기값으로 갖는 변수는?
    choices:
      - { id: '1', text: tlimit }
      - { id: '2', text: prarr }
      - { id: '3', text: seed }
      - { id: '4', text: mean }
    answers: ['4']
    explanation: |
      선택지 1: tlimit는 시뮬레이션 시간 150을 갖는다.
      선택지 2: prarr는 분당 도착 확률 0.25를 갖는다.
      선택지 3: seed는 난수의 초기값 35213을 갖는다.
      선택지 4: 봉사시간이 평균 5분의 포아송 분포이므로 call poissn(seed,mean,p)에 전달되는 평균 mean이 5를 가져 정답이다.

      핵심 개념:
      봉사시간은 포아송 분포를 따르는 확률변수로 발생시킨다.
      poissn 서브루틴은 seed와 평균 mean을 받아 봉사시간 p를 돌려준다.
      발생된 p는 빈 창구의 tpump(i)에 저장되어 남은 봉사시간이 된다.
    tags: [multi-server-queue, poisson-distribution]

  - id: e19-13
    type: multiple-choice
    chapter: 3
    passageRefs: [g19-multi-server-condition-01, g19-multi-server-code-01]
    prompt: 현재 봉사하려는 고객의 봉사시간을 구한 것은?
    choices:
      - { id: '1', text: p }
      - { id: '2', text: queue }
      - { id: '3', text: prarr }
      - { id: '4', text: totque }
    answers: ['1']
    explanation: |
      선택지 1: 창구가 비고 대기 고객이 있으면 call poissn(seed,mean,p)로 포아송 분포 봉사시간 p를 구하고 tpump(i) = p로 저장하므로 정답이다.
      선택지 2: queue는 현재 대기행렬에 있는 고객 수이다.
      선택지 3: prarr는 분당 도착 확률이다.
      선택지 4: totque는 매 시간 단위의 대기행렬 길이를 누적한 합이다.

      핵심 개념:
      tpump(i)는 i번 창구의 남은 봉사시간이며 매 tstep마다 감소한다.
      tpump(i)가 0이고 queue ≠ 0이면 대기 고객 한 명을 꺼내 봉사를 시작한다.
      이때 새 고객의 봉사시간 p를 확률분포로 발생시켜 tpump(i)에 넣는다.
    tags: [multi-server-queue, service-time]

  - id: e19-14
    type: multiple-choice
    chapter: 3
    passageRefs: [g19-multi-server-condition-01, g19-multi-server-code-01]
    prompt: 평균 대기행렬길이는?
    choices:
      - { id: '1', text: aveque }
      - { id: '2', text: queue }
      - { id: '3', text: prarr }
      - { id: '4', text: tpump }
    answers: ['1']
    explanation: |
      선택지 1: aveque = totque/(tlimit/tstep)는 누적 대기행렬 길이를 관측 시간 단위 수로 나눈 값으로 평균 대기행렬길이이므로 정답이다.
      선택지 2: queue는 특정 시점의 대기행렬 길이이며 평균이 아니다.
      선택지 3: prarr는 분당 도착 확률이다.
      선택지 4: tpump는 각 창구의 남은 봉사시간이다.

      핵심 개념:
      매 시간 단위마다 totque = totque+queue로 대기행렬 길이를 누적한다.
      시뮬레이션이 끝나면 누적값을 전체 시간 단위 수 tlimit/tstep로 나누어 평균 대기행렬 길이를 구한다.
      totarr는 총 도착 고객 수로 함께 출력된다.
    tags: [multi-server-queue, average-queue-length]

  - id: e19-15
    type: multiple-choice
    chapter: 3
    passageRefs: [g19-multi-server-condition-01, g19-multi-server-code-01]
    prompt: 평균 대기시간을 구하는 공식을 만들려고 한다. 가장 적당한 것은?
    choices:
      - { id: '1', text: 'totque / totarr' }
      - { id: '2', text: 'totque / arrive' }
      - { id: '3', text: 'totque / queue' }
      - { id: '4', text: 'totque / (tlimit/tstep)' }
    answers: ['1']
    explanation: |
      선택지 1: totque는 매 시간 단위 대기 고객 수의 합이므로 전체 고객이 기다린 총 시간(고객·시간 단위)이다. 이를 총 도착 고객 수 totarr로 나누면 고객 한 명당 평균 대기시간이 되므로 정답이다.
      선택지 2: arrive는 현재 시간 단위의 도착 여부(0 또는 1)이므로 분모로 적절하지 않다.
      선택지 3: queue는 특정 시점의 대기행렬 길이로 평균 대기시간과 관계없다.
      선택지 4: totque를 시간 단위 수로 나누면 평균 대기행렬 길이(aveque)가 된다.

      핵심 개념:
      대기 고객 수를 매 시간 단위 누적한 totque는 모든 고객의 대기시간 합과 같다.
      평균 대기행렬 길이 = totque / (tlimit/tstep)이다.
      평균 대기시간 = totque / totarr이다.
    tags: [multi-server-queue, average-waiting-time]

