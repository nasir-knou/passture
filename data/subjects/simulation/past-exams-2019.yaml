  - id: g19-montecarlo-pi-algorithm-intro-01
    type: text
    body: 이는 알고리즘으로 다음과 같이 표현된다.
  - id: g19-montecarlo-pi-code-01
    type: code
    language: text
    body: |
      {
        while i  ≤  limit do
         {
          call random(n,U)
              x=U
          call random(n,U)
              y=U
          if x²+y² ≦ 1  then
               count=count+1
          i=i+1
         }
         s  =  count/limit
         s  =  s*4
         print 'result', s
  - id: g19-multi-server-condition-01
    type: text
    body: |
      ※ (44~50) 다음은 복수창구 대기행렬 시뮬레이션의 조건과 알고리즘 일부이다.

      <조  건>
      도착상태 = 시간당 평균 15대
      봉사시간 = 평균 5분의 포아송 분포
      봉사창구 = 2
      시뮬레이션 시간 = 150
      난수의 초기값 = 35213

      <알고리즘>
  - id: g19-multi-server-code-01
    type: code
    language: text
    body: |
      {
            :
         while time < tlimit do
           {time = time+tstep
            arrive = 0
            call random(seed, U)
            if U < prarr*tstep then
              { arrive = 1
                queue = queue+arrive
                totarr=totarr+1   }
                i = 0
              while(i < 2   ) do
                { i = i + 1
               if (tpump(i) > 0.0) then
                   { tpump(i) = tpump(i) - tstep
                        if (tpump(i)   < 0.0) then
                           tpump(i) = 0.0 }
               if (tpump(i) = 0.0 and queue ≠ 0) then
                       {   queue = queue - 1
                           call poissn(seed,mean,p)
                           tpump(i) = p}
                                        }// end of   while1
               totque = totque+queue }// end of while2
        aveque = totque/(tlimit/tstep)
        print aveque, totarr
        stop   }
