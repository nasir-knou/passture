  - id: g19-normal-service-code-01
    type: code
    language: text
    body: |
      if (tpump > 0.0)   then
            { tpump = tpump - tstep
                  if (tpump < 0.0) then
                         tpump = 0.0
            }
      if ((tpump = 0) & (queue ≠ 0))   then
            { queue = queue - 1
              call normal(nseed,nmean,stdev,liters);
              tpump = 1.0 + 1.0 / 8.0 * liters;
            }
