      선택지 4: 네 번째 간격은 6-4=2이므로 3이 될 수 없다.

      핵심 개념:
      도착시간 간격은 연속된 두 고객의 도착 시각 차이이다.
      첫 고객은 시뮬레이션 시작 시각과의 차이로 간격을 구한다.
      시작 시각이 1이고 첫 도착도 1이므로 첫 간격은 0이다.
    tags: [multi-server-queue, interarrival-time]

  - id: e19-18
    type: multiple-choice
    chapter: 3
    passageRefs: [g19-multi-server-output-intro-01, g19-multi-server-output-01]
    prompt: 고객들에 대한 봉사 시간을 순서대로 구한 것은?
    choices:
      - { id: '1', text: '4,2,4,4,6' }
      - { id: '2', text: '4,3,4,3,6' }
      - { id: '3', text: '4,5,4,3,6' }
      - { id: '4', text: '4,4,4,5,6' }
    answers: ['3']
    explanation: |
      선택지 1: 두 번째 고객의 봉사시간은 TIME 2에 TPUMP[2]에 들어간 5이므로 2가 아니다.
      선택지 2: 두 번째 고객의 봉사시간 5를 3으로 잘못 읽었다.
      선택지 3: 봉사시간은 새 값이 창구에 들어가는 시점에서 읽는다. 1번 고객은 TIME 1에 TPUMP[1]=4, 2번 고객은 TIME 2에 TPUMP[2]=5, 3번 고객(TIME 4 도착, 대기)은 TIME 5에 TPUMP[1]=4, 4번 고객(TIME 6 도착, 대기)은 TIME 7에 TPUMP[2]=3, 5번 고객(TIME 8 도착, 대기)은 TIME 9에 TPUMP[1]=6이다. 따라서 4,5,4,3,6이므로 정답이다.
      선택지 4: 두 번째 고객은 5, 네 번째 고객은 3이므로 순서가 맞지 않는다.

      핵심 개념:
      TPUMP 값은 매 시간 단위 1씩 줄어들다가, 창구가 비고 대기 고객이 있으면 새 봉사시간으로 다시 채워진다.
      값이 줄지 않고 갑자기 커지는 시점이 새 고객의 봉사가 시작되는 시점이다.
      두 창구가 모두 바쁠 때 도착한 고객은 QUEUE에 1로 나타난 뒤 다음 시간 단위에 빈 창구로 들어간다.
    tags: [multi-server-queue, service-time]

  - id: e19-19
    type: multiple-choice
    chapter: 3
    passageRefs: [g19-multi-server-output-intro-01, g19-multi-server-output-01]
