    answers: ['2']
    explanation: |
      선택지 1: 모델 설계에 일반화된 구조(월드뷰)를 제공하는 것은 시뮬레이션 언어의 장점이다.
      선택지 2: 범용 고급언어는 사용자가 이미 알고 있는 경우가 많아 사용하기 쉽고, 제약 없이 원하는 논리를 자유롭게 구현할 수 있어 융통성이 크므로 정답이다.
      선택지 3: 시간 진행, 난수 발생, 통계 수집 기능이 내장되어 있어 모델링과 프로그래밍 시간이 줄어드는 것은 시뮬레이션 언어의 장점이다.
      선택지 4: 다양한 그래픽과 애니메이션 출력 기능은 시뮬레이션 언어가 제공하는 장점이다.

      핵심 개념:
      범용 고급언어는 익숙하고 융통성이 크며 실행 효율과 이식성이 좋다.
      시뮬레이션 언어는 모델링 구조, 시간 관리, 난수·통계·출력 기능을 기본 제공해 개발 시간을 줄인다.
      두 방식의 장단점을 비교해 목적에 맞는 언어를 선택한다.
    tags: [general-purpose-language, simulation-language]

  - id: e19-28
    type: multiple-choice
    chapter: 7
    prompt: 컴퓨터를 이용하여 난수를 발생하는 경우 갖추어야 할 점이 ==아닌== 것은?
    choices:
      - { id: '1', text: '반복발생이 가능해야 한다.' }
      - { id: '2', text: '상관관계가 없어야 한다.' }
      - { id: '3', text: '난수들 상호간에 종속적이어야 한다.' }
      - { id: '4', text: '[0,1) 범위에서 일양분포를 만족해야 한다.' }
    answers: ['3']
    explanation: |
      선택지 1: 같은 초기값으로 같은 난수열을 다시 만들 수 있어야 실험을 재현하고 비교할 수 있다.
      선택지 2: 난수들 사이에 상관관계가 없어야 무작위성을 가진다.
      선택지 3: 난수는 서로 독립이어야 하며 상호간에 종속적이면 무작위성이 깨진다. 갖추어야 할 점이 아니므로 정답이다.
      선택지 4: 난수는 [0,1) 범위에서 일양분포를 따라야 다른 확률분포로 변환하는 기초가 된다.

      핵심 개념:
      컴퓨터로 만드는 난수는 알고리즘으로 생성되는 의사난수이다.
      좋은 난수는 일양성, 독립성(무상관), 재현성, 긴 주기, 빠른 발생 속도를 갖추어야 한다.
      난수의 검정은 이러한 성질, 특히 일양성과 독립성을 통계적으로 확인하는 과정이다.
