      선택지 3: 난수의 초기값 35213은 call random(seed, U)와 call poissn(seed,mean,p)에 전달되는 난수 발생의 씨앗(seed) 값이므로 정답이다.
      선택지 4: mean은 포아송 분포 봉사시간의 평균 5분을 갖는다.

      핵심 개념:
      복수창구 대기행렬 시뮬레이션은 고정시간 간격(tstep)마다 도착과 봉사를 처리한다.
      seed는 난수 발생기의 초기값이며 같은 seed를 쓰면 같은 난수열이 재현된다.
