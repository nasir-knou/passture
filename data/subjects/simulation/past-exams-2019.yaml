      - { id: '2', text: '이 기본구조는 시스템의 기능적인 관계를 잘 이해해서 그것을 표현할 수 있는 전체적인 시각인 월드뷰(world view)에 의하여 결정된다.' }
      - { id: '3', text: '만일 모델 작성자가 시뮬레이션 언어를 사용한다면 기본구조는 언어에 의해 자연히 암시적으로 표현된다.' }
      - { id: '4', text: '혼합형 시뮬레이션 모델링의 경우 사건중심 진행방법, 액티비티 관찰중심방법, 프로세스중심 진행방법들이 있다.' }
    answers: ['4']
    explanation: |
