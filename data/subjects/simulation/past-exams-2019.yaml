      선택지 2: 기본구조는 시스템의 기능적 관계를 표현하는 전체적인 시각인 월드뷰에 의해 결정된다는 옳은 설명이다.
      선택지 3: 시뮬레이션 언어는 특정 월드뷰를 바탕으로 만들어져 있어, 언어를 사용하면 기본구조가 언어에 의해 암시적으로 표현된다.
      선택지 4: 사건중심 진행방법, 액티비티 관찰중심방법, 프로세스중심 진행방법은 이산형 시뮬레이션 모델링의 세 가지 방법이다. 혼합형의 방법으로 설명했으므로 틀린 설명이며 정답이다.

      핵심 개념:
      모델링 월드뷰는 시스템을 바라보는 전체적인 시각으로 모델의 기본구조를 결정한다.
      시뮬레이션 모델링은 이산형, 연속형, 혼합형으로 나뉜다.
      이산형 시뮬레이션 모델링에는 사건중심, 액티비티 관찰중심, 프로세스중심 진행방법이 있다.
      혼합형은 이산적 변화와 연속적 변화가 함께 있는 시스템을 다룬다.
    tags: [world-view, discrete-modeling]

  - id: e19-22
    type: multiple-choice
    chapter: 5
    prompt: 다음 중 고정시간법의 특징은?
    choices:
      - { id: '1', text: '사건중심으로 진행하는 경우 효율적이다.' }
      - { id: '2', text: '종료조건을 봉사 고객 수로 한다.' }
      - { id: '3', text: '종료조건을 처리 시간으로 한다.' }
      - { id: '4', text: '언제 끝날지 종료 시간을 미리 알 수 없다.' }
    answers: ['3']
    explanation: |
      선택지 1: 사건이 발생하는 시점으로 시간을 건너뛰며 진행하는 방식은 다음사건 시간 진행법(변동시간법)이며, 사건 사이 간격이 불규칙할 때 효율적이다.
      선택지 2: 종료조건을 봉사 고객 수로 하는 것은 다음사건 시간 진행법에서 주로 쓰는 방식이다.
      선택지 3: 고정시간법은 일정한 시간 간격 Δt씩 시간을 증가시키며 진행하므로 정해진 처리 시간(시뮬레이션 시간)에 도달하면 종료한다. 따라서 정답이다.
      선택지 4: 고정시간법은 종료 시간을 미리 정해 두므로 언제 끝날지 알 수 있다. 종료 시간을 미리 알 수 없는 것은 고객 수로 종료하는 다음사건 방식이다.

      핵심 개념:
      시간 진행법에는 고정시간 진행법과 다음사건 시간 진행법이 있다.
      고정시간 진행법은 일정 간격으로 시간을 증가시키고 그 구간에 일어난 사건을 처리한다.
      다음사건 시간 진행법은 가장 가까운 다음 사건 시점으로 시계를 옮긴다.
      앞의 복수창구 알고리즘(while time < tlimit)은 고정시간법의 예이다.
    tags: [time-advance, fixed-increment]

