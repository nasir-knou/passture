  - id: e19-29
    type: multiple-choice
    chapter: 7
    passageRefs: [g19-mixed-congruential-01]
    prompt: 이 방법의 이름은?
    choices:
      - { id: '1', text: 중앙 이승법 }
      - { id: '2', text: shift 연산법 }
      - { id: '3', text: 승산식 합동법 }
      - { id: '4', text: 혼합식 합동법 }
    answers: ['4']
    explanation: |
      선택지 1: 중앙 이승법은 이전 난수를 제곱한 뒤 가운데 자릿수를 취하는 방법이다.
      선택지 2: shift 연산법은 비트를 이동하고 결합해 난수를 만드는 방법이다.
      선택지 3: 승산식 합동법은 증분 c = 0인 $X_i = aX_{i-1} \pmod m$ 형태이다.
      선택지 4: $X_i = aX_{i-1} + c \pmod m$에서 a = 2, c = 3, m = 10으로 곱셈과 덧셈을 함께 사용하므로 혼합식 합동법이며 정답이다.

      핵심 개념:
      합동법은 나머지 연산으로 난수열을 만드는 방법이다.
      혼합식 합동법은 $X_i = (aX_{i-1} + c) \bmod m$ (c ≠ 0)이다.
      승산식 합동법은 c = 0인 경우이다.
      발생된 정수를 m으로 나누면 [0,1) 범위의 난수가 된다.
    tags: [congruential-method, mixed-congruential]

  - id: e19-30
    type: multiple-choice
    chapter: 7
    passageRefs: [g19-mixed-congruential-01]
    prompt: $X_0$ = 3 을 대입하여 $X_1$ 을 구하면?
    choices:
      - { id: '1', text: '1' }
      - { id: '2', text: '3' }
      - { id: '3', text: '5' }
      - { id: '4', text: '9' }
    answers: ['4']
    explanation: |
      선택지 1: 1은 $X_2$의 값이다.
      선택지 2: 3은 초기값 $X_0$이다.
      선택지 3: 5는 $X_3$의 값이다.
      선택지 4: $X_1 = 2 \times 3 + 3 = 9$이고 $9 \bmod 10 = 9$이므로 정답이다.

      핵심 개념:
      혼합식 합동법은 직전 값에 a를 곱하고 c를 더한 뒤 m으로 나눈 나머지를 다음 값으로 한다.
      여기서는 a = 2, c = 3, m = 10이다.
      $X_1 = (2X_0 + 3) \bmod 10$이다.
    tags: [mixed-congruential, calculation]

  - id: e19-31
    type: multiple-choice
    chapter: 7
    passageRefs: [g19-mixed-congruential-01]
    prompt: 계속해서 $X_2$ 을 구하면?
    choices:
      - { id: '1', text: '1' }
      - { id: '2', text: '3' }
      - { id: '3', text: '5' }
      - { id: '4', text: '9' }
    answers: ['1']
    explanation: |
      선택지 1: $X_2 = 2 \times 9 + 3 = 21$이고 $21 \bmod 10 = 1$이므로 정답이다.
      선택지 2: 3은 $X_0$(그리고 $X_4$)의 값이다.
      선택지 3: 5는 $X_3 = (2 \times 1 + 3) \bmod 10$의 값이다.
      선택지 4: 9는 $X_1$의 값이다.

      핵심 개념:
      합동법은 앞에서 구한 값을 다시 식에 넣어 다음 값을 구한다.
      $X_1 = 9$를 대입하면 $X_2 = (2 \times 9 + 3) \bmod 10 = 1$이다.
      나머지 연산 때문에 값은 항상 0 이상 m-1 이하이다.
    tags: [mixed-congruential, calculation]

  - id: e19-32
    type: multiple-choice
    chapter: 7
    passageRefs: [g19-mixed-congruential-01]
    prompt: 주기는?
    choices:
      - { id: '1', text: '3' }
      - { id: '2', text: '4' }
      - { id: '3', text: '5' }
      - { id: '4', text: '6' }
    answers: ['2']
    explanation: |
      선택지 1: 3개 값 뒤에는 아직 초기값 3이 다시 나오지 않는다.
      선택지 2: $X_0=3$, $X_1=9$, $X_2=1$, $X_3=(2+3) \bmod 10=5$, $X_4=(10+3) \bmod 10=3$으로 $X_4$에서 초기값 3이 다시 나온다. 3, 9, 1, 5가 반복되므로 주기는 4이며 정답이다.
      선택지 3: 5개 값을 발생시키면 이미 3이 한 번 반복된다.
      선택지 4: 6은 수열 3, 9, 1, 5, 3, 9, …의 반복 길이와 맞지 않는다.

      핵심 개념:
      주기는 난수열이 같은 값으로 되돌아와 반복되기까지 발생되는 서로 다른 값의 개수이다.
      혼합식 합동법의 주기는 최대 m이며, 여기서는 m = 10이지만 주기는 4에 그친다.
      좋은 난수 발생기는 매개변수 a, c, m을 적절히 골라 주기를 최대한 길게 한다.
    tags: [mixed-congruential, period]

  - id: e19-33
    type: multiple-choice
    chapter: 7
    passageRefs: [g19-chi-square-01]
    prompt: 구간별 기대값인 n/k 의 값은?
    choices:
      - { id: '1', text: '30' }
      - { id: '2', text: '40' }
      - { id: '3', text: '50' }
      - { id: '4', text: '60' }
    answers: ['4']
    explanation: |
      선택지 1: 30은 6000개를 200개 구간으로 나눌 때의 값이다.
      선택지 2: 40은 6000개를 150개 구간으로 나눌 때의 값이다.
      선택지 3: 50은 6000개를 120개 구간으로 나눌 때의 값이다.
      선택지 4: 난수 개수 n = 6000, 구간 수 k = 100이므로 기대값 n/k = 6000/100 = 60이며 정답이다.

      핵심 개념:
      $\chi^2$-검정은 난수의 일양성을 검정하는 방법이다.
      [0,1)을 k개 구간으로 나누면 일양분포에서 각 구간의 기대 빈도는 n/k이다.
      관측 빈도 $f_i$와 기대 빈도의 차이로 $\chi^2 = \frac{k}{n}\sum_{i=1}^{k}(f_i - n/k)^2$을 계산해 임계값과 비교한다.
    tags: [chi-square-test, uniformity-test]

  - id: e19-34
    type: multiple-choice
    chapter: 7
    passageRefs: [g19-chi-square-01]
    prompt: 계속해서 2차원의 연속형 검정을 하려고 한다. 같은 수의 난수 6000개로 2차원의 (x, y)난수를 만들고 100(10*10)개의 2차원 구간을 선정하였다. 기대 값 $n/k^2$ 은?
    choices:
      - { id: '1', text: '30' }
      - { id: '2', text: '40' }
      - { id: '3', text: '50' }
      - { id: '4', text: '60' }
    answers: ['1']
    explanation: |
      선택지 1: 난수 두 개로 (x, y) 한 쌍을 만들므로 6000개 난수에서 쌍의 개수는 n = 3000이다. 각 축을 k = 10개로 나누어 $k^2 = 100$개 구간이 되므로 기대값은 $n/k^2 = 3000/100 = 30$이며 정답이다.
      선택지 2: 40은 쌍의 개수 n을 4000으로 계산한 값이다.
      선택지 3: 50은 쌍의 개수 n을 5000으로 계산한 값이다.
      선택지 4: 60은 난수 6000개를 그대로 쌍의 개수로 보고 100으로 나눈 값이다. 2차원에서는 난수 두 개가 하나의 점이 된다.

      핵심 개념:
      연속형 검정(serial test)은 연속된 난수 쌍의 독립성을 2차원 $\chi^2$-검정으로 확인한다.
      n개의 쌍을 $k \times k$개 구간에 배정하면 각 구간의 기대 빈도는 $n/k^2$이다.
      난수 개수가 N이면 겹치지 않는 쌍은 N/2개이다.
    tags: [chi-square-test, serial-test]

  - id: e19-35
    type: multiple-choice
    chapter: 2
    prompt: 다음은 시뮬레이션의 응용사례들이다. 시뮬레이션 목적이 미래를 예측하는 것으로 나머지 셋과 가장 관련 ==없==는 것은?
    choices:
      - { id: '1', text: 원자력 발전소 시뮬레이터 }
      - { id: '2', text: 운전연습 시뮬레이터 }
      - { id: '3', text: 성형 시뮬레이션 }
      - { id: '4', text: 파일러트(조종사) 시뮬레이션 }
    answers: ['3']
    explanation: |
      선택지 1: 원자력 발전소 시뮬레이터는 운전원이 정상·비상 상황의 조작을 익히는 교육훈련용이다.
      선택지 2: 운전연습 시뮬레이터는 실제 차량 없이 운전 기술을 익히는 교육훈련용이다.
      선택지 3: 성형 시뮬레이션은 수술 후의 얼굴 모습을 미리 보여 주는 것으로 미래를 예측하는 것이 목적이다. 나머지 셋(교육훈련)과 목적이 달라 정답이다.
      선택지 4: 파일러트(조종사) 시뮬레이션은 비행 조종 기술을 안전하게 익히는 교육훈련용이다.

      핵심 개념:
      시뮬레이션은 목적에 따라 분석·설계 평가, 미래 예측, 교육훈련 등에 활용된다.
      교육훈련용 시뮬레이터는 위험하거나 비용이 큰 실제 조작을 안전하게 반복 연습하게 한다.
      미래 예측용 시뮬레이션은 아직 일어나지 않은 결과를 모델로 미리 보여 준다.
    tags: [simulation-applications, training-simulator]
