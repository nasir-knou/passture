      - { id: '3', text: '모델 변환 : 컴퓨터에서의 처리에 적절하게 모델을 변환 함.' }
      - { id: '4', text: '타당성 검토 : 모델이 의도한 대로 컴퓨터 프로그램이 수행될 수 있도록 준비함.' }
