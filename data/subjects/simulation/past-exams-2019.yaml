    choices:
      - { id: '1', text: '1,4,6,8' }
      - { id: '2', text: '4,6,8,9' }
      - { id: '3', text: '5,7,9,10' }
      - { id: '4', text: '5,6,10,12' }
    answers: ['3']
    explanation: |
      선택지 1: 1, 4, 6, 8은 도착 시간 일부로 출발 시간이 아니다.
      선택지 2: 봉사 시작 시각에 봉사시간을 더한 값보다 1씩 작게 계산한 결과이다.
      선택지 3: 출발 시간 = 봉사 시작 시각 + 봉사시간이다. 1번 고객 1+4=5, 2번 고객 2+5=7, 3번 고객 5+4=9, 4번 고객 7+3=10이다. 실제로 TPUMP[1]은 TIME 5, 9에, TPUMP[2]는 TIME 7에 새 고객으로 바뀌므로 정답이다.
      선택지 4: 2번 고객은 TIME 7에 창구 2를 비우므로 6이 될 수 없고, 4번 고객도 봉사시간 3을 더하면 10이다.

      핵심 개념:
      고객의 출발 시간은 봉사 시작 시각에 봉사시간을 더해 구한다.
      대기한 고객은 도착 시각이 아니라 창구가 비어 봉사를 시작한 시각을 기준으로 한다.
      창구의 TPUMP가 새 값으로 바뀌는 시각이 이전 고객이 떠난 시각이다.
