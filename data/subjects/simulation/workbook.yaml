    explanation: |
      선택지 1: 도착시간 0, 2, 3, 7에서 앞 고객과의 차이를 구하면 첫 값이 2이므로 맞지 않는다.
      선택지 2: 고객 2의 도착간격은 2−0=2이므로 첫 값부터 맞지 않는다.
      선택지 3: 고객 2는 2−0=2, 고객 3은 3−2=1, 고객 4는 7−3=4이므로 정답이다.
      선택지 4: 고객 2, 3, 4의 도착시간(2, 3, 7)을 그대로 적은 값으로, 도착간격은 앞 고객과의 시간 차이이므로 틀렸다.

      핵심 개념:
      도착간격 = 지금 고객의 도착시간 − 앞 고객의 도착시간이다.
