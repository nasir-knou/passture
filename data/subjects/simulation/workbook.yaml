      핵심 개념:
      2진법에서도 중앙이승법은 제곱한 뒤 가운데 비트를 취한다.
      4비트 수의 제곱은 최대 8비트이므로 앞에 0을 채워 8비트로 맞춘 뒤 가운데 4비트를 취한다.
    tags:
