      선택지 2: 시뮬레이터는 모델을 실험할 수 있는 기계나 도구로, 설계자의 개념적 기본구조와는 다르다.
      선택지 3: 실시스템을 표현하려고 설계자가 갖는 개념적 기본구조(frame work)를 결정하는 전체적인 시각이 모델링 월드뷰이므로 정답이다. 시뮬레이션 언어를 쓰면 언어에 내장되어 있고, 범용언어를 쓰면 설계자가 직접 작성한다.
