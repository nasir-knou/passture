    explanation: |
      선택지 1: $m$-Erlang 분포는 분포함수의 역함수를 간단한 식으로 구하기 어려워 역변환법을 그대로 적용하기 어렵다.
      선택지 2: 합성법은 분포함수가 여러 분포함수의 가중 조합일 때 쓰는 방법으로, 확률변수의 합 구조와는 다르다.
      선택지 3: $m$-Erlang 확률변수는 $m$개의 독립인 지수확률변수의 합이므로, 지수확률변수 $m$개를 발생시켜 더하는 결합법을 이용할 수 있다. 정답이다.
      선택지 4: 채택-기각법은 조건에 따라 난수를 채택하거나 기각하는 방법으로, 합으로 표현되는 특징을 이용하는 방법이 아니다.

      핵심 개념:
      $m$-Erlang 분포는 결합(convolution)법을 이용할 수 있는 대표적인 예이다.
      $m$이 크면 난수와 로그 계산이 많아 느려지므로 $X=-\dfrac{\beta}{m}\ln\left(\prod_{i=1}^{m}U_i\right)$처럼 로그를 한 번만 취해 발생시킬 수 있다.
