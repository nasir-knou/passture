  - id: gsw07-p4-theorem71-01
    type: text
    body: |
      합동법 $X_i = aX_{i-1}+c\ \ (\text{mod}\ \ m)$은 다음의 정리에 나오는 세 가지 조건을 모두 만족할 때만 최대주기를 갖는다.

      [정리 7.1]
      1. $m$과 $c$ 모두를 나눌 수 있는 양의 정수는 1이다.
      $(m,\ c)=1$
      2. 만약 어떤 소수 $q$가 $m$을 나눌 수 있다면, $q$는 $a-1$도 나눈다.
      $q \mid m \rightarrow q \mid a-1\ \ (q : \text{소수})$
      3. 만약 4가 $m$을 나눌 수 있다면, 4는 $a-1$도 나눈다.
      $4 \mid m \rightarrow 4 \mid a-1$
  - id: gsw07-p4-chi-2000-01
    type: text
    body: |
      ※ (01～03) $\chi^2$ 검정에 관한 사항이다. 2,000개의 난수를 발생시켜 100개의 구간으로 나누었다.

      $$\chi^2 = \frac{k}{n}\sum_{i=1}^{k}\left(O_i-\frac{n}{k}\right)^2$$
  - id: gsw07-p4-chi-4000-01
    type: text
    body: |
      ※ (04～07) $\chi^2$ 검정에 관한 사항이다.

      4,000개의 난수를 발생시켜 100개의 구간으로 나누었다.

      $$\chi^2 = \frac{k}{n}\sum_{i=1}^{k}\left(O_i-\frac{n}{k}\right)^2$$
  - id: gsw07-p4-chi-3000-01
    type: text
    body: |
      3,000개의 난수를 발생시켜 100개의 구간으로 나누었다.

      $$\chi^2 = \frac{k}{n}\sum_{i=1}^{k}\left(O_i-\frac{n}{k}\right)^2$$
  - id: gsw07-p4-chi-5000-01
    type: text
    body: |
      ※ (09～10) $\chi^2$ 검정에 관한 사항이다.

      5,000개의 난수를 발생시켜 100개의 구간으로 나누었다.

      $$\chi^2 = \frac{k}{n}\sum_{i=1}^{k}\left(O_i-\frac{n}{k}\right)^2$$
  - id: gsw08-p4-composition-01
    type: text
    body: |
      분포함수 $F$가 다른 분포함수들 $F_1$, $F_2$, $\cdots$의 조합으로 표시될 수 있는 경우에 사용된다. 즉, 분포함수가 다음과 같이 나타나는 경우이다.

      $$F(x)=\sum_{j=1}^{\infty}P_jF_j(x)$$
  - id: gsw08-p4-accept-reject-01
    type: text
    body: |
      (1) 난수 $U$를 발생시킨다.
      (2) a) $U \ge \dfrac{1}{4}$이면, $X=U$로 하고 (3)을 수행
           b) $U < \dfrac{1}{4}$이면, $U$를 거부하고 (1)을 다시 수행
      (3) 다른 일양확률변수가 필요하면 (1)을 수행하고, 아니면 중단한다.
  - id: gsw08-p4-inverse-exp-01
    type: text
    body: |
      $$U=1-e^{F^{-1}(U)/m}$$

      $$e^{F^{-1}(U)/m}=1-U$$
  - id: gsw08-p4-erlang-sum-01
    type: text
    body: |
      $$X=Y_1+Y_2+\ \cdots\ +Y_m$$

      (단, 평균$=\beta$, $Y_i$는 모수 $\beta/m$를 갖는 지수확률변수)

questions:
  - id: b01-01
    type: multiple-choice
    prompt: 시뮬레이션의 특징과 ==관계없는== 것은?
    choices:
      - id: '1'
        text: 실시스템의 실질적인 구축 없이도 평가할 수 있다.
      - id: '2'
        text: 반복실험으로 인하여 비용을 절감한다.
      - id: '3'
        text: 위험성을 내포한 경우 유용하다.
      - id: '4'
        text: 해석적인 해를 구하기 어려운 경우 사용한다.
    answers:
      - '2'
    explanation: |
      선택지 1: 모델을 대상으로 실험하므로 실시스템을 실제로 구축하지 않고도 성능을 평가할 수 있다. 시뮬레이션의 대표적인 특징이다.
      선택지 2: 시뮬레이션은 초기 모델링 작업과 모델에 대한 많은 반복실험 때문에 오히려 비용이 많이 든다. 반복실험이 비용을 절감한다는 설명은 특징과 관계없으므로 정답이다.
      선택지 3: 전쟁, 원자로 사고처럼 실제로 실험하면 위험한 경우 모델로 대신 실험할 수 있어 유용하다.
      선택지 4: 시스템이 복잡해 해석적인 해를 구하기 어려울 때 사용하는 실험적 방법이다.

      핵심 개념:
      시뮬레이션은 실시스템을 흉내 내는 모델을 만들어 반복실험하는 방법이다.
      모델링과 반복실험에 비용이 많이 들지만, 실제 시스템으로 실험하는 것보다는 경제적일 수 있다(비행기 조종사 훈련).
      실험이 불가능하거나 위험한 경우, 해석적 해를 구하기 어려운 경우에 유용하다.
    tags:
      - simulation-overview
      - characteristics
  - id: b01-02
    type: multiple-choice
    prompt: 다음은 시뮬레이션을 행하는 이유들이다. ==관계없는== 것은?
    choices:
      - id: '1'
        text: 해석적 모델이 가능한 경우
      - id: '2'
        text: 직접적인 실행이 불가능한 경우
      - id: '3'
        text: 위험부담이 많은 경우
      - id: '4'
        text: 함수관계가 복잡한 경우
    answers:
      - '1'
    explanation: |
      선택지 1: 해석적 모델로 정확한 해를 구할 수 있다면 굳이 실험적 방법인 시뮬레이션을 쓸 이유가 없다. 시뮬레이션을 행하는 이유와 관계없으므로 정답이다.
      선택지 2: 우주 탐사나 전쟁처럼 실제 시스템을 직접 실행해 볼 수 없을 때 모델로 실험한다.
      선택지 3: 원자로 사고, 비행 훈련처럼 실제 실험의 위험부담이 클 때 시뮬레이션으로 대신한다.
      선택지 4: 변수 사이의 함수관계가 복잡해 수식으로 풀기 어려울 때 시뮬레이션을 사용한다.

      핵심 개념:
      시뮬레이션은 해석적 방법이 어려운 경우 사용하는 실험적 방법이다.
