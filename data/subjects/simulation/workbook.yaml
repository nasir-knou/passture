  - id: b03-01
    type: multiple-choice
    passageRefs:
      - gsw03-p2-multi-server-01
      - gsw03-p2-multi-server-code-01
    prompt: 주유대가 봉사하고 있는지 점검하는 것은?
    choices:
      - id: '1'
        text: 가
      - id: '2'
        text: 나
      - id: '3'
        text: 다
      - id: '4'
        text: 라
    answers:
      - '3'
    explanation: |
      선택지 1: (가) `while time < tlimit do`는 시뮬레이션 시각이 종료 시간에 이를 때까지 반복하는 주 반복문이다.
      선택지 2: (나) `if U < prarr * tstep then`은 이번 시간 단위에 고객이 도착했는지 판단하는 문장이다.
      선택지 3: (다) `if (tpump(i) > 0.0) then`은 i번째 주유대의 남은 봉사시간이 0보다 큰지, 즉 아직 봉사 중인지 점검하므로 정답이다. 0보다 크지 않으면 그 주유대는 쉬고 있다.
      선택지 4: (라)는 봉사를 마친 주유대에 기다리는 고객을 새로 배정할 수 있는지 점검하는 문장이다.

      핵심 개념:
      tpump(i)는 i번째 주유대(창구)에 남은 봉사시간이다.
      매 시간 단위마다 tpump(i)를 tstep만큼 줄이고, 0이 되면 봉사가 끝난 것으로 본다.
    tags:
      - multi-server-queue
      - queue-algorithm
  - id: b03-02
    type: multiple-choice
    passageRefs:
      - gsw03-p2-multi-server-01
      - gsw03-p2-multi-server-code-01
    prompt: 고객의 도착을 점검하는 것은?
    choices:
      - id: '1'
        text: 가
      - id: '2'
        text: 나
      - id: '3'
        text: 다
      - id: '4'
        text: 라
    answers:
      - '2'
    explanation: |
      선택지 1: (가)는 시뮬레이션 시간이 tlimit에 이를 때까지 반복하는 조건이다.
      선택지 2: (나) `if U < prarr * tstep then`에서 prarr은 단위시간당 도착확률이므로, 난수 U가 이보다 작으면 고객이 도착한 것으로 보고 `arrive = 1`로 둔다. 도착을 점검하는 문장이므로 정답이다.
      선택지 3: (다)는 주유대가 아직 봉사 중인지 점검한다.
      선택지 4: (라)는 비어 있는 주유대에 대기 고객을 배정할 수 있는지 점검한다.

      핵심 개념:
      고정시간 증가법에서는 매 tstep마다 난수 U를 발생시켜 U < prarr × tstep이면 도착이 일어난 것으로 처리한다.
      도착하면 queue와 totarr(총 도착 고객 수)를 1씩 늘린다.
    tags:
      - multi-server-queue
      - queue-algorithm
  - id: b03-03
    type: multiple-choice
    passageRefs:
      - gsw03-p2-multi-server-01
      - gsw03-p2-multi-server-code-01
    prompt: 봉사를 마치고 새 고객을 맞을 수 있는지 점검하는 것은?
    choices:
      - id: '1'
        text: 가
      - id: '2'
        text: 나
      - id: '3'
        text: 다
      - id: '4'
        text: 라
    answers:
      - '4'
    explanation: |
      선택지 1: (가)는 시뮬레이션 전체를 반복하는 조건이다.
      선택지 2: (나)는 고객 도착 여부를 판단한다.
      선택지 3: (다)는 주유대가 아직 봉사 중이면 남은 봉사시간을 줄이는 부분으로, 새 고객 배정과는 다르다.
      선택지 4: (라) `if (tpump(i) = 0.0 and queue ≠ 0) then`은 주유대의 봉사가 끝나 비어 있고(tpump(i) = 0.0) 기다리는 고객이 있을 때(queue ≠ 0) 새 고객의 봉사를 시작하므로 정답이다.

      핵심 개념:
      새 고객 봉사 시작 조건 = 창구가 비어 있음 AND 대기 고객이 있음.
      조건이 맞으면 queue를 1 줄이고 포아송 난수 p를 봉사시간으로 tpump(i)에 넣는다.
    tags:
      - multi-server-queue
      - queue-algorithm
