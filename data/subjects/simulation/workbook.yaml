      선택지 2: timing은 tne[1]과 tne[2]를 비교해 더 이른 사건을 고르고, 도착이면 next = 1, 출발이면 next = 2로 정한 뒤 time을 그 사건 시간으로 진행시키므로 정답이다.
      선택지 3: arrive는 next = 1일 때 호출되는 도착사건 처리 부프로그램이다.
      선택지 4: depart는 next = 2일 때 호출되는 출발사건 처리 부프로그램이다.

      핵심 개념:
      timing: `if(tne[1] <= tne[2])`이면 next = 1(도착사건), 아니면 next = 2(출발사건)로 정하고 `time = tne[next]`로 시계를 진행한다.
      가장 이른 사건 시간이 아주 큰 값이면 사건 목록이 비었다고 보고한다.
    tags:
      - event-algorithm
      - timing
