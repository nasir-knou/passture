  - id: b05-56
    type: multiple-choice
    passageRefs:
      - gsw05-p3-algo-j-01
      - gsw05-p3-algo-j-code-01
    prompt: 빈칸 ‘나’에 알맞은 것은?
    choices:
      - id: '1'
        text: call expon(nseed, marrvt, tne[2])
      - id: '2'
        text: call expon(nseed, mservt, tne[2])
      - id: '3'
        text: call expon(nseed, marrvt, e_dep)
      - id: '4'
        text: call expon(nseed, mservt, e_dep)
    answers:
      - '4'
    explanation: |
      선택지 1: marrvt는 평균 도착간격(5.0)이므로 봉사시간을 구하는 데 쓰지 않는다. 또한 결과를 tne[2]에 넣으면 바로 다음 줄 `tne[2] = time + e_dep`에서 쓸 e_dep가 구해지지 않는다.
      선택지 2: 평균 봉사시간 mservt를 쓰는 것은 맞지만 결과를 tne[2]에 저장하면 e_dep가 구해지지 않아 다음 줄의 출발시간 계산이 성립하지 않는다.
      선택지 3: 결과를 e_dep에 받는 것은 맞지만 평균 도착간격 marrvt로 발생시키면 도착간격 분포에서 값을 뽑게 되므로 봉사시간이 아니다.
      선택지 4: 봉사창구가 비어 있어(status = 0) 도착한 고객이 바로 봉사를 시작하므로, 평균이 mservt인 지수분포에서 봉사시간 e_dep를 발생시키고 다음 줄에서 출발시간 `tne[2] = time + e_dep`를 정한다. 정답이다.

      핵심 개념:
      arrive 부프로그램은 먼저 다음 고객의 도착시간(tne[1] = time + e_arr)을 예약한다.
      창구가 비어 있으면 numcus를 1 늘리고 status를 1(바쁨)로 바꾼 뒤 봉사시간 e_dep를 발생시켜 출발사건 시간 tne[2]를 정한다.
      도착간격은 평균 marrvt, 봉사시간은 평균 mservt인 지수분포에서 expon으로 발생시킨다.
