    explanation: |
      선택지 1: 6분에 고객 1이 봉사를 마치고 출발하며(1+5=6), 같은 시간에 고객 3이 도착하므로 정답이다.
      선택지 2: 9분에는 고객 2의 출발사건만 일어나고 도착하는 고객은 없다.
      선택지 3: 13분에는 도착사건도 출발사건도 없다. 고객 3은 12분, 고객 4는 14분에 출발한다.
      선택지 4: 15분에는 아무 사건도 없으며, 마지막 출발은 14분이다.

      핵심 개념:
      도착사건 시간은 표의 도착시간(1, 3, 6, 8분)이다.
      출발사건 시간은 봉사 시작 시간 + 봉사시간으로 구한 6, 9, 12, 14분이다.
      두 목록에 함께 있는 시간에 도착사건과 출발사건이 동시에 일어난다.
