    prompt: 빈칸의 대기시간을 구하면?
    choices:
      - id: '1'
        text: 3, 3, 3
      - id: '2'
        text: 3, 3, 4
      - id: '3'
        text: 3, 3, 5
      - id: '4'
        text: 3, 4, 6
    answers:
      - '2'
    explanation: |
      선택지 1: 고객 4의 대기시간을 3으로 본 값이다. 고객 4는 8분에 도착하지만 고객 3이 12분에 떠나므로 4분을 기다린다.
      선택지 2: 출발시간이 고객 1부터 6, 9, 12, 14이므로 고객 2는 6−3=3, 고객 3은 9−6=3, 고객 4는 12−8=4분을 기다려 정답이다.
      선택지 3: 고객 4의 대기시간을 5로 계산한 값으로, 앞 고객의 출발시간 12분에서 도착시간 8분을 빼면 4분이다.
      선택지 4: 고객 3의 대기시간을 4로 본 값이다. 고객 3은 6분에 도착하고 고객 2가 9분에 떠나므로 3분을 기다린다.

      핵심 개념:
      대기시간 = 앞의 고객이 출발한 시간 − 지금 고객이 도착한 시간이다(음수이면 0).
      출발시간은 봉사 시작 시간에 봉사시간을 더해 구하고, 봉사 시작 시간은 앞 고객의 출발시간과 자신의 도착시간 중 늦은 쪽이다.
      이 표에서 출발시간은 6, 9, 12, 14분이다.
