  - id: b07-08
    type: multiple-choice
    prompt: 계수가 $m$인 승산식 합동법에서 최대주기는?
    choices:
      - id: '1'
        text: $m$
      - id: '2'
        text: $m-1$
      - id: '3'
        text: $m+1$
      - id: '4'
        text: $m/4$
    answers:
      - '2'
    explanation: |
      선택지 1: 주기가 $m$이 되려면 [정리 7.1]의 첫 번째 조건 $(m,\ c)=1$을 만족해야 하는데, 승산식은 $c=0$이므로 이 조건을 만족할 수 없어 주기 $m$을 가질 수 없다.
      선택지 2: 승산식 합동법 $X_i=aX_{i-1} \pmod m$에서는 한 번 0이 나오면 이후 계속 0이 되므로 0을 제외한 값만 순환한다. $m$과 $a$를 적당하게 택하면(예: $m$이 소수) 최대주기 $p=m-1$을 얻을 수 있다. 정답이다.
      선택지 3: 나머지는 0부터 $m-1$까지 $m$가지뿐이므로 주기가 $m$을 넘을 수 없다.
      선택지 4: $m/4$는 $m$이 2의 거듭제곱일 때 승산식 합동법이 가질 수 있는 주기의 상한이며, $m$과 $a$를 적당히 택해 얻을 수 있는 최대주기 $m-1$보다 작다.

      핵심 개념:
      승산식 합동법은 혼합식 합동법에서 $c=0$인 경우이다.
      덧셈이 없어 계산이 빠르지만 최대주기 $m$은 가질 수 없고, $m$과 $a$를 적당히 택하면 최대주기 $m-1$을 가질 수 있다.
    tags:
      - random-number
      - congruential-method
      - period
  - id: b07-09
    type: multiple-choice
    passageRefs:
      - gsw07-p4-lcg-general-01
    prompt: 다음 난수발생식에 대한 설명 중 옳지 ==않은== 것은?
    choices:
      - id: '1'
        text: 컴퓨터에 의하여 임의적(random)인 난수를 발생시킬 수 있다.
      - id: '2'
        text: $X_i$가 결정적으로 구해진다는 문제가 있다.
      - id: '3'
        text: 구해진 난수 $U_i$가 유리수 값만을 취한다.
      - id: '4'
        text: $m$의 값을 크게 할수록 좋다.
    answers:
      - '1'
    explanation: |
      선택지 1: $X_i=\left[a^iX_0+\dfrac{c(a^i-1)}{a-1}\right] \pmod m$으로 모든 $X_i$가 $m$, $a$, $c$, $X_0$로 완전히 결정되므로 진짜 임의적인 난수가 아니다. 네 변수를 적절히 택해 일양분포처럼 보이게 할 뿐이므로 옳지 않은 설명이다. 정답이다.
      선택지 2: 모든 $X_i$가 네 변수로 완전히 결정된다는 것은 합동법의 첫째 문제점으로, 옳은 설명이다.
      선택지 3: $U_i=X_i/m$은 $0, \frac{1}{m}, \frac{2}{m}, \cdots, \frac{m-1}{m}$의 유리수 값만 취하므로 그 사이의 값은 나오지 않는다는 둘째 문제점으로, 옳은 설명이다.
      선택지 4: $m$을 매우 크게 하면 $U_i$가 가질 수 있는 값이 촘촘해져 분포가 일양분포에 가까워지므로, 옳은 설명이다.

      핵심 개념:
      합동법으로 만든 난수는 식으로 결정되는 의사난수이다.
      구해진 $U_i$는 $m$개의 유리수 값만 가지므로 $m$을 매우 크게 하여 일양분포에 가깝게 만든다.
    tags:
      - random-number
      - congruential-method
  - id: b07-10
    type: multiple-choice
    passageRefs:
      - gsw07-p4-lcg-5x3-mod16-01
    prompt: 이 방법의 이름은?
    choices:
      - id: '1'
        text: 중앙이승법
      - id: '2'
        text: shift 연산법
      - id: '3'
        text: 승산식 합동법
      - id: '4'
        text: 혼합식 합동법
    answers:
      - '4'
    explanation: |
      선택지 1: 중앙이승법은 앞의 수를 제곱한 뒤 가운데 자리를 취하는 방법으로, 주어진 식처럼 곱하고 더한 뒤 나머지를 구하지 않는다.
      선택지 2: shift 연산법은 비트를 자리이동하여 난수를 만드는 방법으로, 주어진 식과 형태가 다르다.
      선택지 3: 승산식 합동법은 $c=0$인 $X_i=aX_{i-1} \pmod m$ 형태인데, 주어진 식은 더하는 상수가 0이 아니다.
      선택지 4: $X_i=aX_{i-1}+c \pmod m$ 형태에서 $a=5$, $c=3$으로 $c$가 0이 아니므로 혼합식 합동법이다. 정답이다.

      핵심 개념:
      $X_i=aX_{i-1}+c \pmod m$에서 $c\ne0$이면 혼합식 합동법, $c=0$이면 승산식 합동법이다.
      중앙이승법은 제곱한 수의 가운데 자리를, shift 연산법은 비트 이동 결과를 다음 수로 쓰는 방법이다.
    tags:
      - random-number
      - congruential-method
  - id: b07-11
    type: multiple-choice
