  - id: gsw02-p2-sim-steps-01
    type: text
    body: |
      ※ (03～04) 다음은 시뮬레이션 절차이다.
      (가) 문제의 정의　　(나) 모델 설계　　(다) 자료 수집
      (라) 모델 변환　　(마) 검증 및 타당성 검토
      (바) 실험　　(사) 결과분석
  - id: gsw02-p2-sim-steps-box-01
    type: text
    body: |
      〈보기〉
      (가) 문제해결의 목적을 포함하여 연구하고자 하는 문제를 정의한다.
      (나) 문제의 정의에 따라 시스템을 수학적이고 논리적인 관계로 추상화한다.
      (다) 시뮬레이션 모델이 표현한 것을 정확하게 컴퓨터 프로그램으로 바꾸어서 제대로 수행되는지 확인한다.
      (라) 시뮬레이션 모델과 실시스템의 관계가 일치하는가를 검토한다.
  - id: gsw02-p2-model-design-box-01
    type: text
    body: |
      정적인 서술과 동적인 서술로 구성된다. 이 과정은 예술과 같은 성격을 갖고 있다. 작성자는 시스템의 구조 및 운영규칙을 이해해야 하며, 상세한 내용을 포함하지 않고서도 시스템의 본질을 도출할 수 있어야 한다. 모델은 쉽게 이해될 수 있어야 하지만, 실시스템의 중요한 특성을 현실적으로 반영할 수 있어야 한다. 모델은 단순화하는 과정을 거치는데, 여기서 어떤 가정이 타당하고, 어떤 요소들이 모델에 포함되어야 하며, 구성요소들 간에 어떤 상호작용이 일어나야만 하는가 하는 문제가 중요한 의사결정이 된다. 모델의 상세성 정도는 구축되는 모델의 목적에 근거하여 결정된다.
  - id: gsw02-p2-formulation-box-01
    type: text
    body: |
