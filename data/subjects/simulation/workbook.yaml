  - id: b08-05
    type: multiple-choice
    passageRefs:
      - gsw08-p4-accept-reject-01
    prompt: 다음은 일양확률변수 $U\left[\dfrac{1}{4},\ 1\right)$을 발생시키는 과정이다. 이 방법의 이름은?
    choices:
      - id: '1'
        text: 역변환법
      - id: '2'
        text: 합성법
      - id: '3'
        text: 결합법
      - id: '4'
        text: 채택-기각법
    answers:
      - '4'
    explanation: |
      선택지 1: 역변환법은 모든 난수를 역함수에 넣어 그대로 변환하며, 난수를 거부하고 다시 발생시키는 단계가 없다.
      선택지 2: 합성법은 여러 분포 중 하나를 확률적으로 고르는 방법으로, 조건에 따라 난수를 버리지 않는다.
      선택지 3: 결합법은 여러 확률변수를 더해 $X$를 만드는 방법이다.
      선택지 4: 조건 $U\ge\frac{1}{4}$을 만족하면 채택($X=U$)하고 아니면 기각하여 다시 발생시키므로 채택-기각법이다. 채택된 $U$는 조건부 확률 $P\left(a\le U\le b \mid \frac{1}{4}\le U<1\right)=\dfrac{b-a}{3/4}$를 만족해 $\left[\frac{1}{4},1\right)$에서 일양분포를 따른다. 정답이다.

      핵심 개념:
      채택-기각(acceptance-rejection)법은 일정한 조건을 정해서 만족하면 채택하고 아니면 기각하는 방식으로 확률변수를 발생시킨다.
      기각된 경우에는 새 난수를 발생시켜 과정을 되풀이한다.
