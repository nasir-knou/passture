  - id: b07-05
    type: multiple-choice
    prompt: 중앙이승법을 사용하여 $X_0$=1009일 때 $X_1$을 구하면?
    choices:
      - id: '1'
        text: '180'
      - id: '2'
        text: '1018'
      - id: '3'
        text: '8081'
      - id: '4'
        text: '1018081'
    answers:
      - '1'
    explanation: |
      선택지 1: $1009^2=1018081$을 8자리로 맞추면 01018081이고, 가운데 네 자리 0180을 취하면 $X_1=180$이다. 정답이다.
      선택지 2: 1018은 제곱값 1018081의 앞 네 자리로, 8자리로 맞춘 뒤 가운데 네 자리를 취하지 않은 값이다.
      선택지 3: 8081은 제곱값의 마지막 네 자리로 가운데 자리가 아니다.
      선택지 4: 1018081은 제곱한 값 자체이며 중앙의 자리를 취하지 않았다.

      핵심 개념:
      중앙이승법(midsquare method)은 $X_{i-1}$을 제곱한 뒤 그 가운데 자리를 다음 수 $X_i$로 취한다.
      4자리 수를 제곱하면 최대 8자리이므로, 자릿수가 모자라면 앞에 0을 채워 8자리로 맞추고 가운데 4자리를 취한다.
    tags:
      - random-number
      - midsquare
  - id: b07-06
