      선택지 2: 도착한 고객이 바로 봉사를 받을 수 있으면 봉사자를 바쁜 상태로 바꾸므로 도착 논리에 속한다.
      선택지 3: 대기열 고객 수를 하나 줄이는 것은 봉사가 끝나 고객이 떠날 때(출발사건) 대기하던 고객을 봉사창구로 보내는 처리이므로 도착 논리와 관계없으며 정답이다.
      선택지 4: 봉사자가 쉬고 있으면 도착한 고객의 봉사를 바로 시작하고 봉사 종료(출발) 시간을 계획하므로 도착 논리에 속한다.

