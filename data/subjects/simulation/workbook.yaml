    explanation: |
      선택지 1: 도착시간에 봉사시간만 더한 값(2+3, 3+2, 7+2)으로, 앞 고객이 봉사 중이면 기다려야 한다는 점을 무시했다.
      선택지 2: 고객 2는 고객 1이 떠나는 5분에 봉사를 시작해 5+3=8, 고객 3은 8+2=10, 고객 4는 7분에 도착했지만 10분까지 기다려 10+2=12에 출발하므로 정답이다.
      선택지 3: 고객 2의 출발시간부터 맞지 않는다. 고객 2는 고객 1이 떠나는 5분에 봉사를 시작하므로 5+3=8에 출발한다.
