    body: |
      ※ (01～02) 다음은 저축문제 시뮬레이션을 설계하는 과정이다.
      〈조건〉
      연봉 : salary
      매년 5% 인상 : 0.05 * salary
      저축액 : 연봉의 10%
      savings = 0.10 * salary
      은행이율 : 매년 복리 9%

      다음은 알고리즘의 일부이다.
  - id: gsw01-p1-savings-code-01
    type: code
    language: text
    body: |
      year = 0
      while year 〈 30 do
      {year = year + 1
       savings = savings + (perint * savings + 0.10 * salary)
       salary = salary + perinc * salary
       print  year, salary, savings}
