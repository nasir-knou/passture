      선택지 1: 고객의 도착과 출발은 시스템 상태(대기 고객 수, 봉사자 상태)를 순간적으로 바꾸는 사건이므로 정답이다. 대기행렬 문제는 도착사건과 출발사건을 중심으로 모델링한다.
      선택지 2: 프로세스는 한 엔티티가 겪는 사건들을 시간 순서로 늘어놓은 것으로, 도착이나 출발 하나를 가리키지 않는다.
      선택지 3: 액티비티는 두 사건 사이의 기간(예: 봉사시간)으로, 도착이나 출발 자체가 아니다.
      선택지 4: 애트리뷰트는 엔티티가 갖는 속성(예: 고객의 도착시간, 종류)이다.

      핵심 개념:
      사건(event)은 시스템 상태를 순간적으로 바꾸는 일로, 대기행렬에서는 도착과 출발이다.
      액티비티는 사건 사이의 기간, 프로세스는 시간순으로 정렬된 사건들의 순서이다.
