        text: '100'
      - id: '3'
        text: '110'
      - id: '4'
        text: '1100'
    answers:
      - '4'
    explanation: |
      선택지 1: 111은 11100의 상위 3비트로, overflow로 없어지는 비트를 포함한 값이며 하위 4비트 1100이 아니다.
      선택지 2: 100은 하위 3비트만 취한 값으로, 4비트 워드에서는 하위 4비트를 모두 남겨야 한다.
      선택지 3: 110은 하위 4비트 1100이 아니다.
      선택지 4: 4비트 워드이므로 11100에서 넘친 맨 앞의 비트 1은 overflow로 없어지고 하위 4비트 1100이 남는다. 정답이다.

      핵심 개념:
      $b$비트 워드 컴퓨터에서 곱셈 결과가 $b$비트를 넘으면 넘친 상위 비트는 overflow로 없어지고 하위 $b$비트만 남는다.
      이는 $m=2^b$로 나눈 나머지를 구하는 것과 같아 나눗셈 없이 빠르게 합동법을 계산할 수 있다.
