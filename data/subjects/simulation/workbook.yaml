    explanation: |
      선택지 1: 역변환법은 분포함수의 역함수 $X=F^{-1}(U)$를 이용하는 방법이다.
      선택지 2: 합성법은 분포함수 $F$가 다른 분포함수 $F_1, F_2, \cdots$의 가중 조합 $F(x)=\sum p_jF_j(x)$로 표시될 때, 확률 $p_j$로 $J=j$를 고른 뒤 $F_j$에서 $X$를 발생시키는 방법이다. 정답이다.
