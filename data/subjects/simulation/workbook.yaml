    explanation: |
      선택지 1: 기대값은 각 구간에 들어갈 것으로 기대되는 개수 $n/k$로, $O_i$에서 빼는 값이다.
      선택지 2: 신뢰구간은 모수를 구간으로 추정할 때 쓰는 개념으로 식에 나타나지 않는다.
      선택지 3: 자유도는 통계량이 따르는 chi-square 분포의 모수 $k-1$이다.
      선택지 4: $O_i$는 실제로 난수를 발생시켰을 때 $i$번째 구간 안에 들어간 난수의 개수, 즉 관측값이다. 기대값이 20이어도 실제 개수는 정확히 20개가 되지 않는다. 정답이다.

      핵심 개념:
      $\chi^2$ 통계량은 각 구간의 관측값 $O_i$와 기대값 $n/k$의 차이를 제곱해 더한 값을 바탕으로 한다.
      관측값이 기대값에서 많이 벗어날수록 $\chi^2$이 커져 일양분포 가설이 기각된다.
