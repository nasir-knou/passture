      - id: '4'
        text: call expon(seed, mservt, tne[1])
    answers:
      - '1'
    explanation: |
      선택지 1: 고객이 도착했으므로 다음 고객의 도착간격 e_arr를 평균 도착간격 marrvt인 지수분포에서 발생시키고, 다음 줄에서 `tne[1] = time + e_arr`로 다음 도착시간을 계산하므로 정답이다.
      선택지 2: 도착간격을 발생시키면서 평균 봉사시간 mservt를 평균으로 쓰므로 틀렸다.
      선택지 3: 결과를 tne[1]에 바로 저장하면 다음 줄에서 쓰는 e_arr가 정해지지 않으며, tne[1]은 간격이 아니라 시각이다.
      선택지 4: 평균도 결과 변수도 모두 맞지 않는다.

      핵심 개념:
      도착사건 처리의 첫 단계는 다음 도착을 계획하는 것이다: 도착간격 e_arr 발생 → tne[1] = time + e_arr.
      도착간격은 평균 marrvt, 봉사시간은 평균 mservt인 지수분포로 발생시킨다.
