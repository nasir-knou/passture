      선택지 2: totque는 대기행렬 길이의 누적값으로 창구 수와 직접 관계가 없다.
      선택지 3: tpump는 창구가 하나일 때 그 창구의 남은 봉사시간이므로, 창구를 2개로 늘리면 tpump(1), tpump(2)처럼 배열로 바꾸고 창구 수만큼 반복해 점검해야 한다. 직접 관련되므로 정답이다.
