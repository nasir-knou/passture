  - id: b02-33
    type: multiple-choice
    prompt: 다음 중 한 종족의 수를 예측해 보는 모델과 관련 있는 것은?
    choices:
      - id: '1'
        text: 몬테칼로 시뮬레이션
      - id: '2'
        text: $V_y(t+\delta t)=V_y(t)+a_y*\delta t$
      - id: '3'
        text: $P(t+\delta t)=P(t)+c*P(t)\delta t$
      - id: '4'
        text: 대기행렬 문제
    answers:
      - '3'
    explanation: |
      선택지 1: 몬테칼로 시뮬레이션은 난수로 $\pi$나 적분 값 같은 정적인 문제를 푸는 방법이다.
      선택지 2: $V_y(t+\delta t)=V_y(t)+a_y*\delta t$는 공의 탄성문제에서 $y$방향의 속도를 나타내는 식이다.
      선택지 3: population 모델은 한 종족의 수를 예측해 보는 모델로, $t$ 시점의 종족 수 $P(t)$에 상대적인 번식률 $c$를 적용해 $P(t+\delta t)=P(t)+c*P(t)\delta t$로 다음 시점의 종족 수를 구하므로 정답이다.
      선택지 4: 대기행렬 문제는 고객의 도착과 봉사를 다루는 모델이다.

      핵심 개념:
      population 모델: $P(t+\delta t)=P(t)+c*P(t)\delta t$ ($\delta t$: 시간, $P(t)$: $t$ 시점의 종족 수, $c$: 상대적인 번식률)
      최대 종족 수 $P_{\max}$를 고려하면 $P(t+\delta t)=P(t)+c*\left[\frac{P_{\max}-P(t)}{P_{\max}}\right]*P(t)\delta t$가 되어 $P(t)=P_{\max}$일 때 증가가 멈춘다.
    tags:
      - simulation-model-examples
      - population-model
  - id: b02-34
    type: multiple-choice
    prompt: 토끼와 여우의 관계처럼 천적과 숙주 두 종족 간의 상호작용으로 인한 종족 수를 예측해 보는 모델은?
    choices:
      - id: '1'
        text: prey-predator 모델
      - id: '2'
        text: $V_y(t+\delta t)=V_y(t)+a_y*\delta t$
      - id: '3'
        text: $P(t+\delta t)=P(t)+c*P(t)\delta t$
      - id: '4'
        text: 몬테칼로 시뮬레이션
    answers:
      - '1'
    explanation: |
      선택지 1: prey-predator 모델은 population 모델을 확장해 천적(여우)과 숙주(토끼) 두 종족 간의 상호작용으로 인한 종족 수를 예측하는 모델이므로 정답이다.
      선택지 2: 공의 탄성문제에서 $y$방향의 속도를 나타내는 식이다.
      선택지 3: 한 종족의 수만 예측하는 population 모델의 식으로, 두 종족 간의 상호작용은 들어 있지 않다.
      선택지 4: 몬테칼로 시뮬레이션은 난수로 정적인 문제를 푸는 방법이다.

      핵심 개념:
      prey-predator 모델에서는 토끼 수 $R(t)$와 여우 수 $F(t)$를 함께 갱신한다.
      토끼는 여우에게 잡아먹혀 감소하고, 여우의 증가는 토끼 수에 따라 제한된다.
      예: $R(t+\delta t)=R(t)+c*\delta t*\left[\frac{R_{\max}-R(t)}{R_{\max}}\right]*R(t)$, $F(t+\delta t)=F(t)+0.167*\delta t\left[\frac{R_{\max}-15*F(t)}{R_{\max}}\right]*F(t)$
    tags:
      - simulation-model-examples
      - prey-predator
