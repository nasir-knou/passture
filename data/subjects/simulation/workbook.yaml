  - id: gsw02-p1-pi-montecarlo-01
    type: text
    body: |
      ※ (09～10) 다음은 난수를 사용하여 $\pi$를 구하는 몬테칼로 시뮬레이션의 예이다.
      〈해결방법〉
      반지름의 길이가 1인 원의 면적은 $\pi$이므로 이 면적을 구하면 곧 $\pi$값을 구하게 된다. 이것을 1/4분면에 적용해 보자. 난수 $U$[0, 1)을 2개씩 발생시킨 후 앞의 것을 $x$, 뒤의 것을 $y$라 하면 좌표 ($x$, $y$)는 하나의 점이 되어 2차원 좌표에 표현된다. 이때 1사분면에 있는 면적이 1인 사각형과 1사분면에 있는 1/4원 A 안에 들어가는 점의 개수를 비율로 계산하면 $\pi$/4값에 근사한 값을 구할 수 있다. 다음과 같은 비례식이 성립하는데, 이 식을 풀면 $\pi$의 근사값을 구할 수 있다.

      1(=사각형의 면적) : A=50,000 : count
      $\Rightarrow$ 1 : A=50,000 : count
      $\Rightarrow\ \therefore$ A=count/50,000
      $\Rightarrow\ \therefore\ \pi=4*\mathrm{A}$

      이는 알고리즘으로 다음과 같이 표현된다.
  - id: gsw02-p1-pi-montecarlo-code-01
    type: code
    language: text
    body: |
      {
        while i ≤ limit do
         {
          call random(n,U)
             x = U              ---------------  ㉮
          call random(n,U)
             y = U
          if x² + y²≤1 then
              count = count + 1  -------------  ㉯
          i = i + 1
         }
        s = count/limit        ----------------  ㉰
        s = s * 4              ----------------  ㉱
        print 'result', s
  - id: gsw02-p1-pi-montecarlo-02
    type: text
    body: |
      ※ (11～14) 반지름의 길이가 1인 원의 면적은 $\pi$이다. 다음은 몬테칼로 시뮬레이션을 이용하여 $\pi$값을 구하는 알고리즘이다.
      〈해결방법〉
      반지름의 길이가 1인 원의 면적은 $\pi$이므로 이 면적을 구하면 곧 $\pi$값을 구하게 된다. 이것을 1/4분면에 적용해 보자. 난수 $U$[0, 1)을 2개씩 발생시킨 후 앞의 것을 $x$, 뒤의 것을 $y$라 하면 좌표 ($x$, $y$)는 하나의 점이 되어 2차원 좌표에 표현된다. 이때 1사분면에 있는 면적이 1인 사각형과 1사분면에 있는 1/4원 A 안에 들어가는 점의 개수를 비율로 계산하면 $\pi$/4값에 근사한 값을 구할 수 있다. 다음과 같은 비례식이 성립하는데, 이 식을 풀면 $\pi$의 근사값을 구할 수 있다.

      1(=사각형의 면적) : A=100,000 : count
      $\Rightarrow$ 1 : A=100,000 : count
      $\Rightarrow\ \therefore$ A=count/100,000
      $\Rightarrow\ \therefore\ \pi=4*\mathrm{A}$
  - id: gsw02-p1-pi-montecarlo-code-02
    type: code
    language: text
    body: |
      { count = 0
        limit = 100,000
        while i ≤ limit do
         {
          call random(n,U)
             x = U
          call random(n,U)
             y = U
          if x² + y² ≤ 1 then
              count = count + 1
          i = i + 1
         }
        s = count/limit
        s = s * 4
        print 'result', s
        stop }
