      선택지 2: 해석적 방법이 불가능한 경우에도 시뮬레이션으로 문제를 해결할 수 있다는 것은 장점이므로, 단점이 아닌 것으로 정답이다.
      선택지 3: 확률적 시뮬레이션은 특정 입력에 대한 추정량만 산출하므로 정확한 해를 얻지 못한다는 단점이 있다.
      선택지 4: 산출되는 많은 양의 수치가 연구결과에 대해 과잉의 신뢰를 주는 경향이 있다는 것은 단점이다.

