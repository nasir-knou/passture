    explanation: |
      선택지 1: 역변환법은 일양난수 $U$를 분포함수의 역함수에 넣어 $X=F^{-1}(U)$로 확률변수를 발생시키는 방법이다.
      선택지 2: 합성법은 분포함수가 여러 분포함수의 조합일 때 하나를 확률적으로 고른 뒤 그 분포에서 확률변수를 발생시키는 방법이다.
      선택지 3: 채택-기각법은 일정한 조건을 만족하는 난수만 채택하고 나머지는 기각하여 확률변수를 발생시키는 방법이다.
      선택지 4: 합동법은 $X_i=aX_{i-1}+c \pmod m$으로 [0, 1)의 일양난수를 만드는 난수발생법이며, 원하는 분포의 확률변수를 만드는 방법이 아니다. 정답이다.

      핵심 개념:
      역변환법: 분포함수의 역함수 $X=F^{-1}(U)$를 이용한다.
      합성법: 분포함수가 다른 분포함수들의 조합 $F(x)=\sum p_jF_j(x)$일 때 사용한다.
      결합법: $X$가 확률변수들의 합 $Y_1+\cdots+Y_m$일 때, 채택-기각법: 조건을 만족하는 난수만 채택한다.
