  - id: b01-10
    type: multiple-choice
    passageRefs:
      - gsw01-p1-savings-cond-01
      - gsw01-p1-savings-code-01
    prompt: 다음 중 은행이율을 나타내는 변수는?
    choices:
      - id: '1'
        text: savings
      - id: '2'
        text: salary
      - id: '3'
        text: perint
      - id: '4'
        text: perinc
    answers:
      - '3'
    explanation: |
      선택지 1: savings는 매년 이자와 새 저축액이 더해지는 누적 저축액이다.
      선택지 2: salary는 연봉으로, 매년 저축액(`0.10 * salary`)의 기준이 된다.
      선택지 3: 은행이율은 저축액에만 적용된다. 저축액 갱신식 `savings = savings + (perint * savings + 0.10 * salary)`에서 기존 저축액에 곱해지는 perint가 은행이율이므로 정답이다.
      선택지 4: perinc는 `salary = salary + perinc * salary`에서 연봉에 곱해지는 연봉 인상률이다.

      핵심 개념:
      저축문제는 확률변수를 쓰지 않는 결정적 시뮬레이션의 예이다.
      저축액 갱신식: savings ← savings + (perint × savings + 0.10 × salary)
      변수의 의미는 그 변수가 어떤 식에서 무엇에 곱해지는지로 판단한다.
    tags:
      - deterministic-simulation
      - savings-problem
