        text: savings
      - id: '2'
        text: salary
      - id: '3'
        text: perint
      - id: '4'
        text: perinc
    answers:
      - '4'
    explanation: |
      선택지 1: savings는 누적 저축액으로, 인상률이 아니라 매년 갱신되는 금액이다.
      선택지 2: salary는 연봉 자체이며 인상률이 곱해지는 대상이다.
      선택지 3: perint는 `perint * savings`로 저축액에 곱해지는 은행이율이다.
      선택지 4: 조건에서 연봉은 매년 5% 인상되며, 연봉 갱신식 `salary = salary + perinc * salary`에서 연봉에 곱해져 인상분을 만드는 perinc가 연봉 인상률이므로 정답이다.

      핵심 개념:
      저축문제의 조건은 연봉 매년 5% 인상, 저축액은 연봉의 10%, 은행이율은 매년 복리 9%이다.
      연봉 갱신식: salary ← salary + perinc × salary
      저축액 갱신식: savings ← savings + (perint × savings + 0.10 × salary)
    tags:
