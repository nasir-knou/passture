        text: '30'
      - id: '3'
        text: '50'
      - id: '4'
        text: '60'
    answers:
      - '1'
    explanation: |
      선택지 1: $n=2000$, $k=100$이므로 $\dfrac{n}{k}=\dfrac{2000}{100}=20$이다. 난수가 정확히 일양분포를 따른다면 각 구간에 20개씩 들어간다. 정답이다.
      선택지 2: 30은 3,000개의 난수를 100개 구간으로 나눌 때의 기대값이다.
      선택지 3: 50은 5,000개의 난수를 100개 구간으로 나눌 때의 기대값이다.
      선택지 4: 60은 6,000개의 난수를 100개 구간으로 나눌 때의 기대값이다.

      핵심 개념:
      $\chi^2$ 검정은 [0, 1)을 $k$개 구간으로 나누고 $n$개의 난수를 발생시켜 각 구간의 관측값 $O_i$와 기대값 $n/k$를 비교한다.
      $k$는 적어도 100이고 $n/k$가 5 이상이 되도록 정한다.
      큰 $n$에 대해 $\chi^2$은 자유도 $k-1$의 chi-square 분포를 따른다.
    tags:
      - random-number-test
      - chi-square-test
