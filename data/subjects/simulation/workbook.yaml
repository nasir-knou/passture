      - gsw03-p2-arrival-table-02
    prompt: 빈칸의 출발시간을 구하면?
    choices:
      - id: '1'
        text: 8, 11, 13
      - id: '2'
        text: 9, 12, 14
      - id: '3'
        text: 9, 13, 15
      - id: '4'
        text: 9, 13, 16
    answers:
      - '2'
    explanation: |
      선택지 1: 고객 2의 출발시간부터 맞지 않는다. 고객 2는 고객 1이 출발하는 6분에 봉사를 시작하므로 6+3=9분에 출발한다.
      선택지 2: 고객 2는 고객 1이 떠난 6분에 봉사를 시작해 6+3=9분에, 고객 3은 9분에 시작해 9+3=12분에, 고객 4는 12분에 시작해 12+2=14분에 출발하므로 정답이다.
      선택지 3: 고객 3의 봉사시간을 4분으로 계산한 값으로, 표의 봉사시간 3분과 맞지 않는다.
      선택지 4: 고객 3과 고객 4의 봉사시간을 실제보다 길게 더한 값으로 표와 맞지 않는다.

      핵심 개념:
      출발시간 = 봉사를 시작한 시간 + 봉사시간이다.
      봉사 시작 시간은 자신의 도착시간과 앞 고객의 출발시간 중 늦은 쪽이다.
      단일창구에서는 앞 고객이 떠나야 다음 고객이 봉사를 받는다.
    tags:
      - queueing-table
      - departure-time
