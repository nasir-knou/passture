  - id: b01-32
    type: multiple-choice
    prompt: 다음 중 지수분포의 확률변수 발생식은?
    choices:
      - id: '1'
        text: $X=a+(b-a)U$
      - id: '2'
        text: $X=-m\cdot\log_e U$
      - id: '3'
        text: $X=(\sum_{i=1}^{12}U_i-6)\cdot S+m,\ i=1,\ \cdots,\ 12$
      - id: '4'
        text: $T>e^{-m}>T\cdot U_{i+1}$
    answers:
      - '2'
    explanation: |
      선택지 1: $X=a+(b-a)U$는 구간 $[a, b)$의 일양분포 확률변수 발생식이다.
      선택지 2: $X=-m\cdot\log_e U$ (단, $m$은 평균)는 역변환법으로 유도한 지수분포 확률변수 발생식이므로 정답이다.
      선택지 3: 난수 12개의 합에서 6을 빼면 근사적으로 표준정규분포를 따르므로, 표준편차 $S$를 곱하고 평균 $m$을 더하는 이 식은 정규분포 확률변수 발생식이다.
      선택지 4: 난수를 차례로 곱한 값 $T$를 $e^{-m}$과 비교하는 식은 포아송 확률변수를 발생시키는 방법의 형태이다.

      핵심 개념:
      일양분포: $X=a+(b-a)U$
      지수분포: $X=-m\ln U$
      정규분포: $X=(\sum_{i=1}^{12}U_i-6)\cdot S+m$
      포아송분포: $\prod U_i\ge e^{-m}$를 만족하는 동안 난수를 곱해 나가며 센 횟수
    tags:
      - random-variable-generation
      - exponential-distribution
  - id: b01-33
    type: multiple-choice
    passageRefs:
      - gsw01-p1-exp-formula-01
    prompt: 위에서 제시된 지수분포 확률변수 공식을 유도하려 한다. 가장 적당한 방법은?
    choices:
      - id: '1'
        text: 역변환법
      - id: '2'
        text: 합성법
      - id: '3'
        text: 결합법
      - id: '4'
        text: 채택-기각법
    answers:
      - '1'
    explanation: |
      선택지 1: 지수분포의 분포함수 $F(x)=1-e^{-x/m}$은 역함수를 쉽게 구할 수 있다. $U=F(x)$로 놓고 $x$에 대해 풀면 $x=-m\ln(1-U)$이고, $1-U$와 $U$는 같은 일양분포를 따르므로 $X=-m\ln U$가 된다. 이렇게 분포함수의 역함수를 쓰는 방법이 역변환법이므로 정답이다.
      선택지 2: 합성법은 분포함수를 여러 분포의 가중합(혼합)으로 나타낼 수 있을 때 어느 분포를 쓸지 먼저 고르고 그 분포에서 발생시키는 방법이다.
      선택지 3: 결합법(convolution)은 확률변수를 다른 확률변수들의 합으로 나타낼 수 있을 때 쓰는 방법으로, 얼랑분포를 지수확률변수의 합으로 발생시키는 경우가 예이다.
      선택지 4: 채택-기각법은 역함수를 구하기 어려울 때 후보 값을 발생시켜 조건에 따라 채택하거나 기각하는 방법이다.

      핵심 개념:
      역변환법: $U=F(X)$로 놓고 $X=F^{-1}(U)$로 확률변수를 발생시킨다.
      지수분포 $F(x)=1-e^{-x/m}\ (x\ge 0)$ → $F^{-1}(U)=-m\ln(1-U)$ → $X=-m\ln U$
      분포함수의 역함수를 닫힌 형태로 구할 수 있을 때 가장 간단한 방법이다.
    tags:
      - random-variable-generation
      - inverse-transform
