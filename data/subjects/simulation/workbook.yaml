  - id: b09-05
    type: multiple-choice
    prompt: 다음 중 확률분포의 적합도 검정에서 $\chi^2$ 검정과 ==관계없는== 것은?
    choices:
      - id: '1'
        text: 구간의 빈도수가 5 이상이 되도록 조정한다.
      - id: '2'
        text: 누적확률분포를 비교한다.
      - id: '3'
        text: 실제 빈도수와 숫자만 사용한다.
      - id: '4'
        text: 표본의 수가 100 이상인 경우 유용하다.
    answers:
      - '2'
    explanation: |
      선택지 1: $\chi^2$ 검정에서는 각 구간의 기대빈도가 5 이상이어야 하며, 작으면 주위 구간을 합해서 계산한다. 관계있다.
      선택지 2: 이론적 분포와 관측자료의 누적확률분포를 비교해 절대값 차이가 가장 큰 값을 찾는 것은 Kolmogorov-Smirnov 검정이다. $\chi^2$ 검정과 관계없으므로 정답이다.
      선택지 3: $\chi^2$ 검정에서는 상대빈도수나 비율이 아니라 실제 빈도수나 숫자만 사용한다. 관계있다.
      선택지 4: $\chi^2$ 검정은 구간별 기대빈도가 충분해야 하므로 표본의 수가 많을 때(100 이상) 유용하다. 관계있다.

      핵심 개념:
      $\chi^2$ 검정 통계량: $\chi^2=\sum\dfrac{(f_0-f_e)^2}{f_e}$, 자유도 $\nu=k-1-m$ ($m$: 추정한 매개변수의 수)
      K-S 검정은 누적확률분포를 비교하는 또 다른 적합도 검정이다.
    tags:
      - input-distribution
      - goodness-of-fit
      - chi-square-test
