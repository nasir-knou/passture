  - id: gsw01-p1-gas-station-01
    type: text
    body: |
      ※ (01～08) 다음은 대기행렬 시뮬레이션으로 주유소 문제이다.
      〈조건〉
      봉사창구 : 1대
      도착형태 : 시간당 평균 15명의 일양분포
      봉사형태 : 평균 4분의 포아송분포

      다음은 평균 대기행렬의 길이를 구하는 알고리즘이다.
  - id: gsw01-p1-gas-station-code-01
    type: code
    language: text
    body: |
      tstep = 1, prarr = 1/4, seed = 35213, mean = 4
       ⋮
      while time 〈 tlimit do
        {time = time + tstep
         arrive = 0
         call random(seed, U)
         if U 〈 prarr * tstep then
           { arrive = 1
             queue = queue + arrive
             totarr = totarr + 1  }
         if tpump 〉 0 then
            tpump = tpump - tstep
         if tpump = 0 and queue ≠ 0 then
            { queue = queue - 1
               call poissn(seed, mean, p)
               tpump = p  }
         totque = totque + queue }( * end of while * )
      aveque = totque/(tlimit/tstep)
          ⋮
