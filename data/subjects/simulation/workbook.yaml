        text: 채택-기각법
      - id: '4'
        text: 합동법
    answers:
      - '3'
    explanation: |
      선택지 1: 역변환법은 분포함수의 역함수로 도착간격 같은 확률변수 값을 직접 계산하는 방법이다. 교재는 매분 도착 여부를 조건 판정으로 채택하는 이 방식을 역변환법이 아닌 채택-기각법으로 분류하므로 정답이 아니다(※ 참고).
      선택지 2: 합성법은 여러 분포 중 하나를 확률적으로 고르는 방법이다.
      선택지 3: 시간당 15명이면 1분 동안의 도착확률은 $15/60=1/4$이다. 매분 난수 $U$를 발생시켜 $U\le\frac{1}{4}$이면 고객이 도착한 것으로 채택(arrive = 1)하고 아니면 arrive = 0으로 하므로 교재는 채택-기각법으로 분류한다. 정답이다(※ 참고).
      선택지 4: 합동법은 [0, 1)의 일양난수 $U$ 자체를 만드는 난수발생법으로, 도착 여부를 정하는 방법이 아니다.

      핵심 개념:
      교재는 조건을 만족하는 난수만 채택하는 방식으로 사건 발생 여부를 정하는 것을 채택-기각법으로 다룬다.
      시뮬레이션 시간을 1분씩 진행하며 매분 $U$와 도착확률 $1/4$을 비교해 도착 여부를 결정한다.

      ※ 원본은 $U\le\frac{1}{4}$이면 도착을 '채택'한다는 점에서 이 방법을 채택-기각법으로 보고 정답도 채택-기각법이다. 엄밀히는 난수를 기각하고 다시 발생시키는 단계가 없으므로, $U\le\frac{1}{4}$이면 1, 아니면 0으로 정하는 것은 베르누이 확률변수를 역변환법으로 발생시키는 것과 같다.
    tags:
      - random-variate-generation
      - acceptance-rejection
  - id: b08-07
    type: multiple-choice
    passageRefs:
      - gsw08-p4-inverse-exp-01
    prompt: 다음은 지수확률변수를 발생시키는 과정이다. 이 방법의 이름은?
    choices:
      - id: '1'
        text: 역변환법
      - id: '2'
        text: 합성법
      - id: '3'
        text: 결합법
      - id: '4'
        text: 채택-기각법
    answers:
      - '1'
    explanation: |
      선택지 1: 평균이 $m$인 지수분포의 분포함수 $U=F(x)=1-e^{-x/m}$을 $x$에 대해 풀어 역함수 $X=F^{-1}(U)=-m\ln(1-U)$를 구하는 과정이므로 역변환법이다. 정답이다.
      선택지 2: 합성법은 분포함수가 여러 분포함수의 조합일 때 쓰는 방법으로, 역함수를 구하는 과정이 없다.
      선택지 3: 결합법은 여러 확률변수를 더해 $X$를 만드는 방법이다.
      선택지 4: 채택-기각법은 조건에 따라 난수를 채택하거나 기각하는 방법이다.

      핵심 개념:
      역변환법은 $U=F(X)$로 놓고 역함수 $X=F^{-1}(U)$를 구해 확률변수를 발생시킨다.
      지수분포는 분포함수의 역함수를 간단히 구할 수 있어 역변환법의 대표적인 예이다.
      $1-U$도 $U[0,1)$이므로 $X=-m\ln U$로 써도 된다.

      ※ 원본 표기: 지수의 부호가 빠져 $e^{F^{-1}(U)/m}$로 인쇄되어 있으나, 평균 $m$인 지수분포라면 $U=1-e^{-F^{-1}(U)/m}$이다.
    tags:
      - random-variate-generation
      - inverse-transform
  - id: b08-08
    type: multiple-choice
    passageRefs:
      - gsw08-p4-erlang-sum-01
    prompt: 확률변수 $X$가 다음의 식으로 나타나는 분포는?
    choices:
      - id: '1'
        text: 일양분포
      - id: '2'
        text: $m$-Erlang 분포
      - id: '3'
        text: 베타분포
      - id: '4'
        text: 감마분포
    answers:
      - '2'
    explanation: |
      선택지 1: 일양분포는 구간 안에서 확률밀도가 일정한 분포로, 지수확률변수의 합으로 정의되지 않는다.
      선택지 2: 평균이 $\beta$인 $m$-Erlang 변수는 모수(평균) $\beta/m$인 독립 지수확률변수 $m$개의 합으로 나타낸다. 정답이다.
      선택지 3: 베타분포는 [0, 1] 구간에서 두 개의 형태모수로 모양이 정해지는 분포로, 지수확률변수의 합과 관계없다.
      선택지 4: $m$-Erlang 분포는 형태모수가 정수 $m$인 감마분포의 특수한 경우이지만, 지수확률변수 $m$개의 합이라는 식으로 정의되는 분포의 이름은 $m$-Erlang 분포이다.

      핵심 개념:
      $m$-Erlang 분포는 지수확률변수들의 합이므로 결합(convolution)법으로 발생시킬 수 있다.
      $Y_i=-\dfrac{\beta}{m}\ln U_i$이므로 $X=-\dfrac{\beta}{m}\ln\left(\prod_{i=1}^{m}U_i\right)$로 로그를 한 번만 취해 발생시킬 수 있다.
    tags:
      - random-variate-generation
      - erlang-distribution
