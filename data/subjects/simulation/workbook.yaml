    explanation: |
      선택지 1: [0, 1) 난수 U를 정수 구간 [perlow, perhig]로 바꾸려면 `int(U * (perhig + 1 - perlow) + perlow)`처럼 하한 perlow를 더해야 하므로 정답이다. perlow = 0.0, perhig = 10.0이면 0~10 사이의 정수가 나온다.
