                    { tpump(i) = tpump(i) - tstep
                         if (tpump(i) < 0.0) then
                             tpump(i) = 0.0 }
               if (tpump(i) = 0.0 and queue ≠ 0) then
                       {  queue = queue - 1
                          call poissn(seed, mean, p)
                          tpump(i) = p} }
               totque = totque + queue }
         aveque = totque/(tlimit/tstep)
         print aveque, totarr
         stop  }
  - id: gsw03-p2-multi-server-04
    type: text
    body: |
      ※ (20～24) 다음은 복수창구의 대기행렬 시뮬레이션의 알고리즘 일부이고 조건은 다음과 같다.
      〈조건〉
      도착형태 : 시간당 평균 15대
      봉사시간 : 평균 5분의 포아송분포
      봉사창구＝2
      시뮬레이션 시간＝150
      난수의 초기값＝35213
  - id: gsw03-p2-multi-server-code-04
    type: code
    language: text
    body: |
      〈알고리즘〉
      {
             ⋮
         while time < tlimit do
           {time = time + tstep
            arrive = 0
            call random(seed, U)
            if U < prarr * tstep then
              { arrive = 1
                queue = queue + arrive
                totarr = totarr + 1  }
                i = 0
                while(i < 2) do
                { i = i + 1
                  if (tpump(i) > 0.0) then
                        { tpump(i) = tpump(i) - tstep
                            if (tpump(i) < 0.0) then
                                tpump(i) = 0.0 }
                  if (tpump(i) = 0.0 and queue ≠ 0) then
                          { queue = queue - 1
                            call poissn(seed, mean, p)
                            tpump(i) = p} }
            totque = totque + queue }
         aveque = totque/(tlimit/tstep)
         print aveque, totarr
         stop  }
  - id: gsw03-p2-service-var-01
    type: text
    body: |
      ※ (01～06) 단일창구 대기행렬에서 봉사시간의 변화를 적용하였다. 다음은 시뮬레이션 알고리즘의 일부이고 조건은 다음과 같다.
      〈조건〉
      종료시간＝120
      고객의 도착상태 : 시간당 평균 15대의 일양분포
      연료탱크 : 평균＝21ℓ, 표준편차＝3인 정규분포
      급유시간 계산 : 1ℓ당 1/10분
  - id: gsw03-p2-service-var-code-01
    type: code
    language: text
    body: |
      〈알고리즘〉
        nseed = seed
        while (time < tlimit) do
             {
               time = time + tstep
               arrive = 0
               call random(seed, U)
               if (U < (prarr * tstep)) then
                    { arrive = 1
                      queue = queue + arrive
                      totarr = totarr + 1
                    }
               if (tpump > 0.0)  then
                     { tpump = tpump - tstep
                          if (tpump < 0.0) then
                                 tpump = 0.0
                     }
               if ((tpump = 0) & (queue ≠ 0))  then
                     { queue = queue - 1
                       call normal(nseed, nmean, stdev, liters)
                       tpump = 1.0 + 1.0 / 10 * liters
                     }
               totque = totque + queue
               print, time, arrive, queue, tpump
             }
