  - id: b04-10
    type: multiple-choice
    prompt: 시스템의 모델이 상태변수들의 도함수로 표현되는 것과 가장 관계있는 것은?
    choices:
      - id: '1'
        text: 연속형 모델
      - id: '2'
        text: 이산형 모델
      - id: '3'
        text: 혼합형 모델
      - id: '4'
        text: 확률적 모델
    answers:
      - '1'
    explanation: |
      선택지 1: 연속형 모델에서 시스템 상태는 시간에 따라 연속적으로 변하는 종속변수로 표현되며, $\frac{dS(t)}{dt}=S^2(t)+t^2,\ S(0)=K$처럼 상태변수의 미분방정식과 초기조건으로 기술하므로 정답이다.
      선택지 2: 이산형 모델은 상태가 사건발생시간에만 변하므로 사건과 상태 변화 논리로 표현하며, 도함수를 쓰지 않는다.
      선택지 3: 혼합형 모델은 연속적 변화와 이산적 변화가 함께 있는 모델로, 도함수 표현만으로 특징지어지지 않는다.
      선택지 4: 확률적 모델은 난수·확률변수를 포함하는 모델이라는 분류로, 상태변수의 도함수 표현과 직접 관계없다.

      핵심 개념:
      연속형 모델은 상태변수의 도함수로 이루어진 미분방정식으로 표현한다.
      시간축을 $\Delta t$ 길이의 기간으로 나누어 차분방정식 $S_{k+1}=S_k+r\cdot\Delta t$처럼 $k$기간의 값에서 $k+1$기간의 값을 계산하기도 한다.
    tags:
      - continuous-model
      - differential-equation
