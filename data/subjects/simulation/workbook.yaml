  - id: b07-35
    type: multiple-choice
    passageRefs:
      - gsw07-p4-chi-2000-01
    prompt: 2차원의 연속형 검정을 하려고 한다. 같은 수의 난수에 대하여 100(10 * 10)개의 2차원 구간을 선정하였다. 이때의 $\dfrac{n}{k}$은?
    choices:
      - id: '1'
        text: '10'
      - id: '2'
        text: '15'
      - id: '3'
        text: '20'
      - id: '4'
        text: '30'
    answers:
      - '1'
    explanation: |
      선택지 1: 2,000개의 난수를 2개씩 묶어 ($x$, $y$) 좌표로 만들면 1,000개의 2차원 점이 된다. 이를 100개의 2차원 구간으로 나누면 기대값은 $1000/100=10$이다. 정답이다.
      선택지 2: 15는 3,000개의 난수(1,500개의 점)를 100개 2차원 구간으로 나눌 때의 기대값이다.
      선택지 3: 20은 2,000개를 1차원 100개 구간으로 나눈 $\chi^2$ 검정의 기대값으로, 2차원에서는 난수 2개가 점 하나가 되는 점을 반영하지 않았다.
      선택지 4: 30은 3,000개의 난수를 1차원 100개 구간으로 나눌 때의 기대값이다.

      핵심 개념:
      연속형 검정(serial test)은 $\chi^2$ 검정을 $d$차원으로 일반화한 것으로, 겹치지 않는 $d$-tuple들이 단위입방체 $[0,1)^d$에 균등하게 분포하는지 본다.
      $d=2$이면 난수 2개가 점 하나가 되므로 $n$개의 점을 만들려면 $2n$개의 난수가 필요하다.
      기대값은 $n/k^d$이고 통계량은 자유도 $k^d-1$인 $\chi^2$ 분포를 따른다.
