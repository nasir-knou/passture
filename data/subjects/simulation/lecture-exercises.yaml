    prompt: 빈칸의 출발시간을 구하면?
    choices:
      - { id: '1', text: '1, 2, 2' }
      - { id: '2', text: '2, 3, 2' }
      - { id: '3', text: '3, 3, 3' }
      - { id: '4', text: '9, 11, 15' }
    answers: ['4']
    explanation: |
      선택지 1: 출발시간은 봉사를 마친 시각이므로 도착시간(3, 6, 8)보다 작을 수 없다.
      선택지 2: 고객 2~4의 도착간격 값(2, 3, 2)과 같으며 출발시간이 아니다.
      선택지 3: 고객 2~4의 대기시간(3, 3, 3)이며 출발시간이 아니다.
      선택지 4: 단일 창구이므로 봉사 시작 = max(도착시간, 앞 고객의 출발시간)이다. 고객 2는 6에 시작해 6+3 = 9, 고객 3은 9에 시작해 9+2 = 11, 고객 4는 11에 시작해 11+4 = 15에 출발하므로 정답이다.

      핵심 개념:
      봉사 시작시간 = max(자신의 도착시간, 앞 고객의 출발시간)
      출발시간 = 봉사 시작시간 + 봉사시간
      대기시간 = 봉사 시작시간 − 도착시간
      표에서 고객 2, 3, 4는 모두 앞 고객이 떠나기 전에 도착하므로 앞 고객의 출발시간에 봉사를 시작한다.
    tags: [queueing-system, single-server]

