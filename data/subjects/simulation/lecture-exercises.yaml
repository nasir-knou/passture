      봉사시간 = 평균 3분의 포아송 분포
      봉사창구 = 2
      시뮬레이션 시간 = 100
      난수의 초기값 = 12345
      〈알고리즘〉

  - id: gl06-multi-server-code-01
    type: code
    language: text
    body: |
      {
         :
        while time 〈 tlimit do
         {time = time+tstep
          arrive = 0
          call random(seed, U)
          if U 〈 prarr*tstep then
           { arrive = 1
             queue = queue+arrive
             totarr=totarr+1  }
         i = 0
         while(i 〈 2) do
         { i = i + 1
             if (tpump(i) 〉 0.0) then
            { tpump(i) = tpump(i) - tstep
                if (tpump(i)  〈 0.0) then
                   tpump(i) = 0.0 }
             if (tpump(i) = 0.0 and queue ≠ 0) then
              {  queue = queue - 1
                 call poissn(seed,mean,p)
                 tpump(i) = p} }
                totque = totque+queue }
        aveque = totque/(tlimit/tstep)
        print aveque, totarr
        stop  }

