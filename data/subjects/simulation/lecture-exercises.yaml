  - id: l06-04
    type: multiple-choice
    passageRefs: [gl06-multi-server-01, gl06-multi-server-code-01]
    prompt: 지문의 프로그램에서 totarr을 가장 잘 설명한 것은?
    choices:
      - { id: '1', text: '현재까지 도착한 총 고객수' }
      - { id: '2', text: '현재까지 봉사를 마치고 출발한 총 고객수' }
      - { id: '3', text: '매 분마다 대기행렬의 길이를 누적한 값' }
      - { id: '4', text: '매 분마다 대기시간들을 누적한 값' }
    answers: ['1']
    explanation: |
      선택지 1: 고객이 도착할 때마다(`U 〈 prarr*tstep`이 참일 때) `totarr=totarr+1`로 1씩 늘어나므로 현재까지 도착한 총 고객수이며 정답이다.
      선택지 2: 지문에는 봉사를 마치고 출발한 고객 수를 세는 변수가 없으며, totarr는 도착 시점에만 증가한다.
      선택지 3: 매 분 대기행렬 길이를 누적하는 변수는 `totque = totque+queue`의 totque이다.
      선택지 4: 대기시간의 누적도 totque로 표현되며(1분마다 대기 중인 고객 수를 더함), totarr와는 관계없다.

      핵심 개념:
      totarr: 도착한 총 고객 수(도착할 때마다 1 증가)
      totque: 매 단계 대기행렬 길이의 누적값(= 전체 대기시간의 총합)
      aveque = totque/(tlimit/tstep): 평균 대기행렬 길이
      프로그램은 마지막에 평균 대기행렬 길이와 총 도착 고객 수를 출력한다.
    tags: [queueing-system, multi-server]

  - id: l06-05
    type: multiple-choice
    passageRefs: [gl06-multi-server-01, gl06-multi-server-code-01]
    prompt: 지문의 프로그램에서 평균 대기행렬을 구하는 공식은?
    choices:
      - { id: '1', text: 'totque / totarr' }
      - { id: '2', text: 'totque / arrive' }
      - { id: '3', text: 'totque / queue' }
      - { id: '4', text: 'totque/(tlimit/tstep)' }
    answers: ['4']
    explanation: |
      선택지 1: 누적 대기행렬 길이를 도착한 총 고객 수로 나누면 고객 1명당 평균 대기시간이 되므로, 시간 단위로 평균한 대기행렬 길이가 아니다.
      선택지 2: arrive는 이번 단계에 고객이 도착했는지를 나타내는 0 또는 1의 값이라 누적량을 나누는 기준이 될 수 없고, 도착이 없으면 0으로 나누게 된다.
      선택지 3: queue는 현재 단계의 대기행렬 길이일 뿐이므로, 누적값을 이 값으로 나누어도 평균 길이가 되지 않는다.
      선택지 4: totque는 매 단계 대기행렬 길이를 더한 값이고 tlimit/tstep은 시뮬레이션을 진행한 단계 수이므로, 둘을 나눈 값이 평균 대기행렬 길이이며 정답이다. 지문의 `aveque = totque/(tlimit/tstep)`과 같다.

      핵심 개념:
      totque는 매 단계(tstep)마다 대기 중인 고객 수를 더한 값으로, tstep = 1분이면 전체 대기시간의 총합과 같다.
      평균 대기행렬 길이 = 대기행렬 길이의 누적값 ÷ 시뮬레이션 단계 수 = totque/(tlimit/tstep)
      같은 누적값을 도착 고객 수(totarr)로 나누면 고객 1명당 평균 대기시간이 된다.
      두 값은 리틀의 법칙(평균 대기행렬 길이 = 도착률 × 평균 대기시간)으로 이어진다.
    tags: [queueing-system, multi-server]

  # 7강 대기행렬 문제2
  - id: l07-01
    type: multiple-choice
