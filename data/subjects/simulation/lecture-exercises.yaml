    explanation: |
      선택지 1: 모델 설계에 일반화된 구조를 제공하는 것은 시뮬레이션 언어의 장점이다. 범용언어는 모델 구조를 사용자가 직접 설계해야 한다.
      선택지 2: FORTRAN, BASIC, PASCAL, C 같은 범용언어는 대부분의 컴퓨터에 갖춰져 있고 사용자에게 익숙하며, 원하는 논리와 출력을 자유롭게 작성할 수 있어 융통성이 크다. 범용언어의 장점이다.
      선택지 3: 시간 진행, 난수 발생, 통계 수집 기능이 내장된 시뮬레이션 언어가 모델링과 프로그래밍 시간을 줄여 준다. 범용언어는 이런 기능을 직접 만들어야 하므로 시간이 더 걸린다.
      선택지 4: 그래픽과 애니메이션 출력은 최근 시뮬레이션 언어가 제공하는 기능이다. 범용언어로는 별도로 구현해야 한다.

