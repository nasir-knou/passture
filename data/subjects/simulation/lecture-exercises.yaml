    explanation: |
      선택지 1: 계산 결과와 맞지 않는다. 고객 2만 보아도 앞 고객이 6에 떠나므로 3에 도착한 고객 2는 3만큼 기다린다.
      선택지 2: 고객 2~4의 도착간격(2, 3, 2)으로, 대기시간이 아니다.
      선택지 3: 고객 2는 3에 도착해 고객 1이 떠나는 6에 시작하므로 6−3 = 3, 고객 3은 6에 도착해 9에 시작하므로 9−6 = 3, 고객 4는 8에 도착해 11에 시작하므로 11−8 = 3이다. 따라서 3, 3, 3이 정답이다.
      선택지 4: 8, 10, 14는 고객 2~4의 출발시간(9, 11, 15)보다 1씩 작은 값으로, 봉사 시작시간에서 도착시간을 뺀 대기시간과 관계없다.

      핵심 개념:
      대기시간 = 봉사 시작시간 − 도착시간이다.
      단일 창구에서 봉사 시작시간은 앞 고객의 출발시간과 자신의 도착시간 중 늦은 쪽이다.
      출발시간: 고객 2 = 9, 고객 3 = 11, 고객 4 = 15
      대기시간: 고객 2 = 6−3, 고객 3 = 9−6, 고객 4 = 11−8로 모두 3이다.
    tags: [queueing-system, single-server]

  - id: l07-03
    type: multiple-choice
    passageRefs: [gl07-fuel-01, gl07-fuel-code-01]
    prompt: nmean의 값은?
    choices:
      - { id: '1', text: '0.25' }
      - { id: '2', text: '3' }
      - { id: '3', text: '20' }
      - { id: '4', text: '100' }
    answers: ['3']
    explanation: |
      선택지 1: nmean은 급유량(ℓ)의 평균이므로 조건의 "평균 = 20ℓ"에서 정해진다. 0.25는 prarr 같은 도착확률 형태의 값이지만 이 지문에는 도착확률이 주어지지 않았고, 급유시간 계수 1/8(=0.125)과도 달라 조건 어디에서도 나오지 않는 값이다.
      선택지 2: 3은 연료량 정규분포의 표준편차로 stdev에 해당한다.
      선택지 3: `call normal(nseed,nmean,stdev,liters)`는 평균 nmean, 표준편차 stdev인 정규 확률변수 liters(급유량)를 발생시킨다. 조건에서 연료탱크가 평균 20ℓ인 정규분포이므로 nmean은 20이며 정답이다.
      선택지 4: 100은 tlimit 같은 시뮬레이션 시간 크기의 값이지만 이 지문에는 시뮬레이션 시간이 주어지지 않았다. 평균 20ℓ, 표준편차 3인 연료량 분포의 어느 모수와도 맞지 않아 nmean이 될 수 없다.

      핵심 개념:
      주유량(liters)은 평균 20ℓ, 표준편차 3인 정규분포 확률변수로 발생시킨다.
      normal 루틴의 인자: nseed(난수 초기값), nmean(평균), stdev(표준편차), liters(결과)
      봉사시간은 급유량에 따라 정해진다: tpump = 1.0 + liters/8 (1ℓ당 1/8분에 기본 1분 추가)
      봉사시간을 포아송 분포로 바로 발생시키는 대기행렬 문제와 달리, 이 문제는 정규분포로 발생시킨 급유량으로 봉사시간을 계산한다.
    tags: [queueing-system, normal-distribution]

  - id: l07-04
    type: multiple-choice
    passageRefs: [gl07-fuel-01, gl07-fuel-code-01]
    prompt: stdev의 값은?
    choices:
      - { id: '1', text: '0.25' }
      - { id: '2', text: '3' }
      - { id: '3', text: '20' }
      - { id: '4', text: '100' }
    answers: ['2']
    explanation: |
      선택지 1: stdev는 급유량의 흩어진 정도(표준편차)이며 조건에서 3으로 주어진다. 0.25는 prarr 같은 도착확률 형태의 값이지만 이 지문에는 도착확률이 주어지지 않았고, 조건 어디에서도 나오지 않는 값이다.
      선택지 2: `call normal(nseed,nmean,stdev,liters)`에서 stdev는 정규 확률변수의 표준편차이고, 조건에서 연료탱크의 표준편차가 3이므로 정답이다.
      선택지 3: 20은 연료량 정규분포의 평균으로 nmean에 해당한다.
      선택지 4: 100은 tlimit 같은 시뮬레이션 시간 크기의 값이지만 이 지문에는 시뮬레이션 시간이 주어지지 않았다. 연료량 분포의 평균(20)이나 표준편차(3) 어느 쪽에도 해당하지 않아 stdev가 될 수 없다.

      핵심 개념:
      정규분포는 평균과 표준편차 두 모수로 결정된다.
      이 문제의 급유량: 평균 nmean = 20ℓ, 표준편차 stdev = 3
      정규 확률변수는 일양난수 12개를 이용해 $(\sum_{i=1}^{12} U_i - 6) \times \text{stdev} + \text{nmean}$으로 근사해 발생시킬 수 있다.
      발생된 급유량 liters로 봉사시간 tpump = 1.0 + 1.0/8.0 × liters를 계산한다.
    tags: [queueing-system, normal-distribution]

  - id: l07-05
    type: multiple-choice
    passageRefs: [gl07-fuel-01, gl07-fuel-code-01]
    prompt: 평균 대기시간을 구하는 것은?
    choices:
      - { id: '1', text: 'totque' }
      - { id: '2', text: 'totarr' }
      - { id: '3', text: 'aveque' }
      - { id: '4', text: 'avgwt' }
    answers: ['4']
    explanation: |
      선택지 1: totque는 매 단계 대기행렬 길이를 누적한 값으로, 전체 대기시간의 총합이지 평균이 아니다.
      선택지 2: totarr는 도착한 총 고객 수이다.
      선택지 3: aveque = totque / (tlimit/tstep)은 누적값을 진행 단계 수로 나눈 평균 대기행렬 길이이다.
      선택지 4: avgwt = totque / (totarr)는 총 대기시간을 도착한 총 고객 수로 나눈 값이므로 고객 한 명당 평균 대기시간이며 정답이다.

      핵심 개념:
      매 단계(1분)마다 대기 중인 고객 수를 더하면 모든 고객의 대기시간 총합이 된다.
      평균 대기시간 = 총 대기시간 / 도착한 총 고객 수 = totque / totarr
      평균 대기행렬 길이 = 총 대기시간 / 전체 단계 수 = totque / (tlimit/tstep)
      두 값은 분자가 같고 분모가 고객 수인지 시간인지가 다르다.
    tags: [queueing-system, average-waiting-time]

