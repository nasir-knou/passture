      선택지 2: 종속변수의 이산적 변화가 어떤 시간에도 일어날 수 있으면 연속형 모델, 명시된 순간에만 일어날 수 있으면 이산형 모델이 된다. 두 모델을 서로 바꿔 설명했으므로 틀린 설명이며 정답이다.
