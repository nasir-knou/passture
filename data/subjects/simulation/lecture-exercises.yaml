  - id: l06-03
    type: multiple-choice
    passageRefs: [gl06-multi-server-01, gl06-multi-server-code-01]
    prompt: 3 을 초기값으로 갖는 변수는?
    choices:
      - { id: '1', text: 'tlimit' }
      - { id: '2', text: 'prarr' }
      - { id: '3', text: 'seed' }
      - { id: '4', text: 'mean' }
    answers: ['4']
    explanation: |
      선택지 1: tlimit은 시뮬레이션 시간 100을 갖는다.
      선택지 2: prarr는 1분당 도착확률 0.5를 갖는다.
      선택지 3: seed는 난수의 초기값 12345를 갖는다.
      선택지 4: 봉사시간이 평균 3분의 포아송 분포이므로 `call poissn(seed,mean,p)`에 넘기는 평균 mean이 3이며 정답이다.

      핵심 개념:
      poissn 루틴은 seed로 난수를 만들어 평균 mean인 포아송 확률변수 p를 돌려준다.
      빈 창구(tpump(i) = 0.0)에 대기 고객이 있으면 한 명을 봉사하고 p를 그 창구의 남은 봉사시간 tpump(i)로 둔다.
      tpump(i)는 매 분 tstep씩 줄고, 0보다 작아지면 0.0으로 맞춘다.
      창구가 2개이므로 i = 1, 2에 대해 같은 처리를 반복한다.
