      시뮬레이션 언어는 따로 설치해야 하고, 그래픽 처리나 애니메이션을 위해 요구하는 시스템 사양도 높은 편이다.
      대신 시뮬레이션 언어는 모델 구조를 제공하고 프로그래밍 시간이 짧으며 오류 검출이 쉽다.
      어떤 언어를 쓸지는 문제의 복잡도, 사용자 숙련도, 비용 등을 고려해 선택한다.
