      선택지 1: 분석가는 대상 시스템을 설명하기 위한 개념적인 기본구조(frame work)를 갖고 있어야 한다는 옳은 설명이다.
      선택지 2: 기본구조는 시스템의 기능적 관계를 표현하는 전체적인 시각인 월드뷰에 의해 결정된다는 옳은 설명이다.
      선택지 3: 시뮬레이션 언어는 특정 월드뷰를 바탕으로 만들어져 있어, 언어를 사용하면 기본구조가 언어에 의해 암시적으로 주어진다는 옳은 설명이다.
      선택지 4: 사건중심 진행방법, 액티비티 관찰중심방법, 프로세스중심 진행방법은 이산형 시뮬레이션 모델링의 세 가지 방법이다. 혼합형의 방법으로 설명했으므로 틀린 설명이며 정답이다.

      핵심 개념:
      모델링 월드뷰는 시스템을 모델로 표현하는 전체적인 시각으로 모델의 기본구조를 결정한다.
      시뮬레이션 모델링은 이산형, 연속형, 혼합형으로 나뉜다.
      이산형 모델링의 방법: 사건중심, 액티비티 관찰중심, 프로세스중심 진행방법
      시뮬레이션 언어를 쓰면 기본구조가 언어에 내장되어 있고, 범용언어를 쓰면 모델 작성자가 직접 만들어야 한다.
    tags: [modeling-world-view, world-view]

  - id: l08-05
    type: multiple-choice
    prompt: 다음 중 혼합형 모델링에 속하는 것은?
    choices:
      - { id: '1', text: '미분 방정식으로 표현된다.' }
      - { id: '2', text: '은행 문제에서 고객의 대기시간을 측정하는 문제' }
      - { id: '3', text: '공을 던졌을 때 튀는 과정을 표현하는 문제' }
      - { id: '4', text: '생태계로 공해물질이 방출되면 서식하는 개체군의 성장률을 변화시킨다.' }
    answers: ['4']
    explanation: |
      선택지 1: 미분방정식으로 표현되는 것은 종속변수가 연속적으로 변하는 연속형 모델링의 특징이다.
      선택지 2: 은행 대기시간 문제는 고객의 도착·출발 사건 시점에만 상태가 바뀌는 이산형 모델링이다.
      선택지 3: 공의 탄성(튀는 과정) 문제는 공의 위치가 시간에 따라 연속적으로 변하는 연속형 모델링의 예이다.
      선택지 4: 개체군은 성장률 공식에 따라 연속적으로 늘거나 줄다가, 공해물질 방출이라는 사건 순간에 성장률이 이산적으로 바뀌고 그 뒤 새 공식에 따라 다시 연속적으로 변하므로 혼합형이며 정답이다.

      핵심 개념:
      혼합형 모델링은 연속형 변화와 이산형 변화가 함께 있는 시스템을 다룬다.
      이산적 사건이 연속형 변수의 값을 급변시키거나 연속형 변화의 공식 자체를 바꾼다.
      예: 공해물질 방출로 바뀌는 개체군 성장률, 결합 후 바뀌는 우주선 비행 방정식
      연속형은 미분방정식, 이산형은 사건 중심으로 표현하며 혼합형은 둘을 함께 쓴다.

      ※ 교재는 공의 탄성 문제를 공의 위치가 연속적으로 변하는 연속형 모델의 예로 다룬다. 다만 공이 바닥에 닿는 순간 속도의 방향이 불연속적으로 바뀌는 것을 사건으로 보면 혼합형으로 모델링할 수도 있다.
    tags: [modeling-world-view, combined-simulation]

  - id: l09-01
    type: multiple-choice
    prompt: 다음 중 시간 진행법에 대한 설명이다. 틀린 것은?
    choices:
      - { id: '1', text: '가변시간법에서는 사건이 발생하면 시간을 진행시킨다.' }
      - { id: '2', text: '고정시간법에서는 종료조건인 처리 고객수가 정해진다.' }
      - { id: '3', text: '고정시간법에서는 고정된 시간만큼 시계를 진행시킨다.' }
      - { id: '4', text: '가변시간법에서는 시뮬레이션 증가시간이 일정하지 않다.' }
    answers: ['2']
    explanation: |
      선택지 1: 가변시간법(다음 사건 진행법)은 다음에 일어날 사건의 발생 시각으로 시뮬레이션 시계를 곧바로 옮기므로, 사건이 발생할 때마다 시간이 진행된다는 설명은 옳다.
      선택지 2: 고정시간법은 일정한 시간 간격씩 시계를 진행하므로 종료조건도 시간, 즉 종료시간으로 정한다. 처리 고객수를 종료조건으로 두는 것은 사건 단위로 진행하는 가변시간법의 방식이므로 틀린 설명이다.
      선택지 3: 고정시간법은 미리 정한 단위시간 Δt만큼씩 시계를 진행시키고 그 구간 안에 일어난 사건을 처리하므로 옳은 설명이다.
      선택지 4: 가변시간법에서 시계 증가량은 현재 시각과 다음 사건 시각의 차이이며, 사건 간격이 제각각이므로 증가시간이 일정하지 않다는 설명은 옳다.

      핵심 개념:
      이산사건 시뮬레이션의 시간 진행법에는 고정시간법과 가변시간법이 있다.
      고정시간법은 일정한 시간 간격씩 시계를 진행하며, 종료조건으로 종료시간을 정한다.
      가변시간법은 다음 사건이 일어나는 시각으로 시계를 건너뛰므로 증가시간이 일정하지 않다.
      가변시간법은 사건이 없는 구간을 건너뛰어 효율적이며, 처리 고객수 같은 사건 기준 종료조건을 쓰기 쉽다.
    tags: [discrete-event-simulation, time-advance]

  - id: l09-02
    type: multiple-choice
    passageRefs: [gl09-main-intro-01, gl09-main-code-01]
    prompt: 평균 도착시간 간격을 나타내는 변수는?
    choices:
      - { id: '1', text: 'marrvt' }
      - { id: '2', text: 'mservt' }
      - { id: '3', text: 'totarr' }
      - { id: '4', text: 'numcus' }
    answers: ['1']
    explanation: |
      선택지 1: marrvt(mean arrival time)는 평균 도착시간 간격으로, 주 프로그램에서 5.0으로 초기화된다. 도착간격을 지수분포로 발생시킬 때 평균값으로 쓰인다.
      선택지 2: mservt(mean service time)는 평균 봉사시간으로 2.5로 초기화되며, 봉사시간을 발생시킬 때 쓰인다.
      선택지 3: totarr는 시뮬레이션할 총 고객 수(1000)로, while문의 종료조건에 쓰인다.
      선택지 4: numcus는 지금까지 봉사를 시작한 고객 수를 세는 변수로, totarr와 비교해 반복을 끝낼지 정한다.

      핵심 개념:
      주 프로그램은 입력 모수(marrvt, mservt, totarr)를 정하고 init으로 상태를 초기화한다.
      while문에서 timing이 다음 사건을 고르고, next 값에 따라 도착(arrive) 또는 출발(depart) 사건을 처리한다.
      numcus가 totarr에 이르면 반복을 끝내고 report로 결과를 출력한다.
      도착간격은 평균 marrvt, 봉사시간은 평균 mservt의 지수분포로 발생시킨다.
    tags: [discrete-event-simulation, main-program]

  - id: l09-03
    type: multiple-choice
    passageRefs: [gl09-main-intro-01, gl09-main-code-01]
    prompt: 평균 봉사시간을 나타내는 변수는?
    choices:
      - { id: '1', text: 'marrvt' }
      - { id: '2', text: 'mservt' }
      - { id: '3', text: 'totarr' }
      - { id: '4', text: 'numcus' }
    answers: ['2']
    explanation: |
      선택지 1: marrvt는 평균 도착시간 간격(5.0)으로, 고객이 도착하는 간격을 발생시킬 때 쓰인다.
      선택지 2: mservt(mean service time)는 평균 봉사시간으로 2.5로 초기화되며, 봉사시간 e_dep을 지수분포로 발생시킬 때 평균값으로 쓰인다.
      선택지 3: totarr는 시뮬레이션할 총 고객 수(1000)로, 반복을 끝내는 기준값이다.
      선택지 4: numcus는 봉사를 시작한 고객 수를 누적하는 변수로, 입력 모수가 아니다.

      핵심 개념:
      주 프로그램의 입력 모수는 평균 도착간격 marrvt, 평균 봉사시간 mservt, 총 고객 수 totarr이다.
      이 예에서 평균 도착간격(5.0)이 평균 봉사시간(2.5)보다 크므로 창구 이용률은 (1/5.0)÷(1/2.5)=0.5이다.
      timing은 예약된 사건 시각 중 가장 이른 것을 골라 next에 사건 종류를 넣는다.
      numcus가 totarr에 이르면 반복을 끝내고 report를 호출한다.
    tags: [discrete-event-simulation, main-program]

  - id: l09-04
    type: multiple-choice
    passageRefs: [gl09-arrive-code-01]
    prompt: 지문은 arrive  부프로그램 알고리즘이다.  다음에 도착하는 고객의 도착시간 간격을 나타내는 변수는?
    choices:
      - { id: '1', text: 'tne[1]' }
      - { id: '2', text: 'tne[2]' }
      - { id: '3', text: 'e_arr' }
      - { id: '4', text: 'e_dep' }
    answers: ['3']
    explanation: |
      선택지 1: tne[1]은 다음 도착 사건이 일어날 시각(time + e_arr)이다. 간격이 아니라 현재 시각에 간격을 더한 절대 시각이다.
      선택지 2: tne[2]는 다음 출발 사건이 일어날 시각(time + e_dep)으로, 봉사를 마치는 시각이다.
      선택지 3: call expon(seed, marrvt, e_arr)는 평균 marrvt의 지수분포로 다음 고객의 도착간격을 발생시켜 e_arr에 넣으므로 e_arr이 도착시간 간격이다.
      선택지 4: e_dep는 call expon(nseed, mservt, e_dep)로 발생시킨 봉사시간으로, 도착 간격과 관계가 없다.

      핵심 개념:
      arrive 부프로그램은 먼저 다음 고객의 도착간격 e_arr을 발생시키고 다음 도착 시각 tne[1]을 예약한다.
      창구가 비어 있으면(status = 0) 도착한 고객이 바로 봉사를 받으므로 창구 상태를 1로 바꾼다.
      이때 봉사시간 e_dep을 발생시켜 출발 시각 tne[2] = time + e_dep을 예약한다.
      창구가 사용 중이면 고객은 대기행렬에 들어가 기다린다.
    tags: [discrete-event-simulation, arrival-event]

  - id: l09-05
    type: multiple-choice
    passageRefs: [gl09-single-server-table-01]
    prompt: 지문은 단일 창구의 대기행렬문제에서 고객의 도착시간과  간격 및 봉사 시간 그리고 출발시간과 대기시간을 나타낸 표이다. 빈칸의 도착간격을 구하면?
    choices:
      - { id: '1', text: '1, 2, 2' }
      - { id: '2', text: '2, 3, 2' }
      - { id: '3', text: '3,3,3' }
      - { id: '4', text: '8,10,14' }
    answers: ['2']
    explanation: |
      선택지 1: 도착간격은 이전 고객과의 도착시간 차이이다. 도착시간이 0, 2, 5, 7이므로 첫 간격은 2−0=2이며 1이 될 수 없다.
      선택지 2: 도착간격은 2−0=2, 5−2=3, 7−5=2이므로 2, 3, 2가 정답이다.
      선택지 3: 3, 3, 3은 고객 2~4의 대기시간이다. 출발시간은 5+3=8, 8+2=10, 10+4=14이고, 대기시간은 봉사 시작 시각에서 도착시간을 뺀 5−2=3, 8−5=3, 10−7=3이다.
      선택지 4: 8, 10, 14는 고객 2~4의 출발시간으로, 도착간격이 아니다.

      핵심 개념:
      도착간격은 연속한 두 고객의 도착시간 차이다.
      단일 창구에서 봉사 시작 시각은 자신의 도착시간과 앞 고객의 출발시간 중 늦은 쪽이다.
      출발시간은 봉사 시작 시각에 봉사시간을 더한 값이다.
      대기시간은 봉사 시작 시각에서 도착시간을 뺀 값이다.
    tags: [queueing-system, single-server]

  - id: l10-01
    type: multiple-choice
    prompt: 다음은 시뮬레이션 언어에 대한 설명이다. 틀린 것은?
    choices:
      - { id: '1', text: '시뮬레이션 모델을 설계하기 위한 일반화된 구조를 제시한다.' }
      - {
          id: '2',
          text: '시뮬레이션 모델을 다시 컴퓨터 프로그램으로 바꾸는 신속한 방법을 제시한다.',
        }
      - {
          id: '3',
          text: '시뮬레이션 모델의 변경이 용이하고 이와 같은 변경이 기계어 프로그램으로 즉시 적용될 수 있게 한다.',
        }
      - { id: '4', text: '산출되는 출력 보고서의 형태를 자유롭게 작성할 수 있다.' }
    answers: ['4']
    explanation: |
      선택지 1: 시뮬레이션 언어는 개체, 자원, 대기행렬, 사건 같은 모델 구성 요소를 미리 제공하여 모델 설계를 위한 일반화된 구조를 제시하므로 옳은 설명이다.
      선택지 2: 모델을 언어가 제공하는 구문이나 블록으로 바로 옮길 수 있어 컴퓨터 프로그램으로 신속하게 바꿀 수 있으므로 옳은 설명이다.
      선택지 3: 모델 구조를 바꾸면 언어 처리기가 이를 실행 가능한 프로그램으로 곧바로 반영하므로 모델 변경이 쉽다는 설명은 옳다.
      선택지 4: 시뮬레이션 언어는 미리 정해진 양식의 통계 보고서를 자동으로 출력한다. 출력 보고서 형태를 자유롭게 만들 수 있는 것은 범용언어의 장점이므로 틀린 설명이다.

      핵심 개념:
      시뮬레이션 언어는 모델 설계를 위한 일반화된 구조와 모델을 프로그램으로 바꾸는 신속한 방법을 제공한다.
      시간 진행, 난수 발생, 통계 수집, 보고서 작성 같은 기능이 내장되어 프로그래밍 시간이 짧다.
      출력은 정해진 양식으로 나오지만, 범용언어로 직접 작성할 때보다 훨씬 많은 정보를 자동으로 얻을 수 있다.
      범용언어는 출력 형태를 자유롭게 바꿀 수 있는 대신 그 기능을 직접 프로그래밍해야 한다.
    tags: [simulation-language, characteristics]

  - id: l10-02
    type: multiple-choice
    prompt: 다음 중 범용언어의 장점은?
    choices:
