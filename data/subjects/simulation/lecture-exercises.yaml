    tags: [stochastic-simulation, deterministic-simulation]

  - id: l04-05
    type: multiple-choice
    prompt: 다음 중 포아송 확률변수의 발생공식은?
    choices:
      - { id: '1', text: '$X=a+(b-a)U$' }
      - { id: '2', text: '$X=-m\cdot\log U$' }
      - { id: '3', text: '$X=\left(\sum_{i=1}^{12} U_i-6\right)\cdot S+m$' }
      - { id: '4', text: '$\prod_{i=0}^{n} U_i > e^{-m} > \prod_{i=0}^{n+1} U_i$' }
    answers: ['4']
    explanation: |
      선택지 1: [a, b) 구간의 연속형 일양분포 확률변수 발생식이다.
      선택지 2: 평균 m인 지수분포 확률변수 발생식이다. 지수분포는 연속형이며 포아송 과정의 사건 간격을 나타낸다.
      선택지 3: 일양난수 12개의 합을 이용한 정규분포(평균 m, 표준편차 S) 확률변수 근사식이다.
      선택지 4: 일양난수를 하나씩 곱해 가다가 누적곱이 $e^{-m}$보다 작아지기 직전까지 곱한 개수 n을 포아송 확률변수 값으로 정하는 조건이므로 정답이다.

      핵심 개념:
      포아송분포는 단위시간당 사건 발생 횟수를 나타내는 이산형 분포이다.
      발생 방법: 난수 $U_1, U_2, \dots$를 차례로 곱하면서 $\prod_{i=1}^{n} U_i \ge e^{-m} > \prod_{i=1}^{n+1} U_i$를 만족하는 n을 찾는다.
      정답 선택지의 식은 첨자를 $i=0$부터 적어 $\prod_{i=0}^{n} U_i$가 난수 $n+1$개의 곱이 되며, 위 식은 첨자 시작을 $i=1$로 옮겨 곱한 난수 개수를 n과 맞춘 표준형이다.
      지수분포 간격을 합해 가는 것과 같은 원리이며, 로그를 취하면 $-\log U_i$의 합이 m을 넘기 전까지의 개수가 n이다.
      대기행렬 문제에서 봉사시간을 poissn 루틴으로 발생시킬 때 이 방법을 사용한다.
    tags: [random-variate-generation, poisson-distribution]

