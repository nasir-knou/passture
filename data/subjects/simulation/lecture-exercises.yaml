    answers: ['2']
    explanation: |
      선택지 1: tstep은 한 번에 진행하는 시간 간격이다. 도착확률을 1분 단위(30/60)로 계산하므로 tstep은 1분이며 0.5가 아니다.
      선택지 2: `if U 〈 prarr*tstep then { arrive = 1 …`에서 prarr가 고객의 도착확률이다. 시간당 30대가 도착하므로 1분당 도착확률은 30/60 = 0.5이며 정답이다.
      선택지 3: seed는 난수의 초기값 12345를 갖는다.
      선택지 4: mean은 포아송 분포 봉사시간의 평균 3을 갖는다.

      핵심 개념:
      시간당 평균 도착 수를 분 단위 확률로 바꾸면 도착확률이 된다: 30/60 = 0.5
      매 분 [0,1) 난수 U가 0.5보다 작으면 고객 한 명이 도착한 것으로 처리한다.
      도착하면 queue와 totarr를 1씩 늘린다.
      이 방식은 한 tstep 동안 최대 한 명만 도착한다고 가정한 고정시간 진행법이다.
