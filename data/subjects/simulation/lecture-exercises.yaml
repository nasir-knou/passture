  - id: l11-01
    type: multiple-choice
    prompt: 컴퓨터를 이용하여 난수를 발생하는 경우 갖추어야 할 점이 아닌 것은?
    choices:
      - { id: '1', text: '반복발생이 불가능해야 한다.' }
      - { id: '2', text: '상관관계가 없어야 한다.' }
      - { id: '3', text: '난수의 발생속도가 빨라야 한다.' }
      - { id: '4', text: '[0,1) 범위에서 일양분포를 만족해야 한다.' }
    answers: ['1']
    explanation: |
      선택지 1: 컴퓨터 난수는 같은 초기값(seed)을 주면 같은 난수열을 언제든지 다시 발생시킬 수 있어야 한다. 그래야 난수의 성질을 검정하고, 프로그램 오류를 찾거나 대안 시스템을 같은 조건에서 비교할 수 있다. 반복발생이 불가능해야 한다는 것은 갖추어야 할 점이 아니다.
      선택지 2: 발생된 난수들 사이에 상관관계가 없어야(독립이어야) 시뮬레이션 결과가 특정 패턴에 치우치지 않으므로 갖추어야 할 성질이다.
      선택지 3: 시뮬레이션은 난수를 매우 많이 사용하므로 발생속도가 빨라야 한다. 갖추어야 할 성질이다.
      선택지 4: 난수는 [0,1) 범위에서 일양분포를 따라야 이를 변환해 여러 확률변수를 발생시킬 수 있으므로 갖추어야 할 성질이다.

      핵심 개념:
      컴퓨터로 만드는 난수는 일정한 식으로 계산하는 의사난수(pseudo-random number)이다.
      좋은 난수는 [0,1)에서 일양분포를 따르고, 서로 상관관계가 없어야 한다.
      발생속도가 빠르고 메모리를 적게 쓰며, 주기가 충분히 길어야 한다.
      같은 seed로 같은 난수열을 재현할 수 있어야 검정과 디버깅, 대안 비교가 가능하다.
    tags: [random-number, requirements]

  - id: l11-02
    type: multiple-choice
    passageRefs: [gl11-lcg-01]
    prompt: 이 방법과 같은 난수 발생식은 무엇인가?
    choices:
      - { id: '1', text: '중앙 이승법' }
      - { id: '2', text: 'shift 연산법' }
      - { id: '3', text: '승산식 합동법' }
      - { id: '4', text: '혼합식 합동법' }
    answers: ['4']
    explanation: |
      선택지 1: 중앙 이승법(중앙제곱법)은 앞의 수를 제곱한 뒤 가운데 자릿수를 뽑아 다음 수로 쓰는 방법으로, 곱하고 더한 뒤 나머지를 구하는 지문의 식과 다르다.
      선택지 2: shift 연산법은 비트를 좌우로 이동시키고 결합해 난수를 만드는 방법으로, 합동식 형태가 아니다.
      선택지 3: 승산식 합동법은 $X_i = aX_{i-1}\ (\text{mod}\ m)$처럼 상수항 $c$가 0인 합동법이다. 지문은 $c=3$을 더하므로 승산식이 아니다.
      선택지 4: 지문의 식은 $X_i = aX_{i-1} + c\ (\text{mod}\ m)$ 형태에서 $a=5$, $c=3$, $m=16$이고 $c \ne 0$이므로 혼합식 합동법이다.

      핵심 개념:
      합동법(선형합동법)은 $X_i = (aX_{i-1} + c) \bmod m$으로 난수열을 만든다.
      $c \ne 0$이면 혼합식 합동법, $c = 0$이면 승산식 합동법이라 한다.
      얻은 정수 $X_i$를 $m$으로 나눈 $U_i = X_i/m$을 [0,1) 난수로 쓴다.
      주기는 최대 $m$이며, $a$, $c$, $m$을 잘 골라야 최대 주기를 얻는다.
    tags: [random-number, congruential-method]

  - id: l11-03
    type: multiple-choice
    passageRefs: [gl11-lcg-01]
    prompt: $X_0 = 1$ 일 때 $X_1$ 을 구하면?
    choices:
      - { id: '1', text: '3' }
      - { id: '2', text: '5' }
      - { id: '3', text: '6' }
      - { id: '4', text: '8' }
    answers: ['4']
    explanation: |
      선택지 1: 3은 상수항 $c$만 남긴 값이다. $5 \cdot 1$을 빠뜨렸으므로 틀리다.
      선택지 2: 5는 $5 \cdot 1$만 계산하고 상수항 3을 더하지 않은 값이다.
      선택지 3: 6은 $X_0=7$일 때의 값이다($5 \cdot 7 + 3 = 38$, $38 \bmod 16 = 6$). $X_0=1$이면 $5 \cdot 1 + 3 = 8$이고 16보다 작으므로 나머지 연산 후에도 8이다.
      선택지 4: $X_1 = 5 \cdot 1 + 3 = 8$이고, $8 \bmod 16 = 8$이므로 정답이다.

      핵심 개념:
      합동법은 앞의 값 $X_{i-1}$에 $a$를 곱하고 $c$를 더한 뒤 $m$으로 나눈 나머지를 다음 값으로 한다.
      계산 결과가 $m$보다 작으면 나머지 연산을 해도 값이 그대로다.
      이 예에서 $X_0=1$에서 시작하면 $X_1=8$이다.
      [0,1) 난수로 바꾸면 $U_1 = 8/16 = 0.5$이다.
    tags: [random-number, congruential-method]

  - id: l11-04
    type: multiple-choice
    passageRefs: [gl11-lcg-01, gl11-lcg-seed-01]
    prompt: 계속해서 $X_2$ 를 구하면?
    choices:
      - { id: '1', text: '6' }
      - { id: '2', text: '10' }
      - { id: '3', text: '11' }
      - { id: '4', text: '13' }
    answers: ['3']
    explanation: |
      선택지 1: 6은 $X_1=7$일 때의 값이다($5 \cdot 7 + 3 = 38$, $38 \bmod 16 = 6$). $X_0=1$에서 $X_1=8$이므로 $5 \cdot 8 + 3 = 43$을 16으로 나눈 나머지를 구해야 한다.
      선택지 2: 10은 $X_1=11$일 때의 값이다($5 \cdot 11 + 3 = 58$, $58 \bmod 16 = 10$). $X_1=8$을 넣으면 43이 되고 나머지는 11이다.
      선택지 3: $X_0=1$일 때 $X_1=8$이므로 $X_2 = 5 \cdot 8 + 3 = 43$이고, $43 = 2 \cdot 16 + 11$이므로 $X_2 = 11$이다.
      선택지 4: 13은 $X_1=2$일 때의 값이다($5 \cdot 2 + 3 = 13$). $X_1=8$이면 $43$에서 16의 배수 32를 빼 11이 남는다.

      핵심 개념:
      합동법에서는 앞 단계의 결과를 그대로 다음 단계 입력으로 쓴다.
      $X_2 = (5X_1 + 3) \bmod 16 = 43 \bmod 16 = 11$이다.
      나머지 연산 때문에 값은 항상 0부터 $m-1$ 사이에 있다.
      [0,1) 난수로 바꾸면 $U_2 = 11/16 = 0.6875$이다.
    tags: [random-number, congruential-method]

  - id: l11-05
    type: multiple-choice
    prompt: 컴퓨터가 부호비트를 제외하고 4 비트인 경우 즉, mod=4 인 경우 오버플로우를 이용해서 난수를 발생하는 과정이다. 계산 결과가 101010 (2진수) 이라면 구해진 난수는?
    choices:
      - { id: '1', text: '101' }
      - { id: '2', text: '0101' }
      - { id: '3', text: '1010' }
      - { id: '4', text: '10101' }
    answers: ['3']
    explanation: |
      선택지 1: 101은 101010의 상위 3자리를 뽑은 값이다. 오버플로우로 버려지는 것은 상위 자리이고, 남는 것은 하위 4자리이다.
      선택지 2: 0101은 101010의 가운데 4자리를 뽑은 값이다. 4비트 레지스터에는 가장 아래 4자리가 남으므로 틀리다.
      선택지 3: 4비트에는 하위 4자리만 남고, 101010에서 앞의 두 자리 10은 오버플로우로 없어진다. 따라서 1010이 난수이며, 이는 $42 \bmod 16 = 10$과 같다.
      선택지 4: 10101은 101010의 상위 5자리로, 5비트라서 4비트 레지스터에 담을 수 없다.

      핵심 개념:
      합동법의 나머지 연산 $\bmod\ 2^b$는 $b$비트 레지스터에서 오버플로우로 상위 비트가 버려지는 것과 같다.
      따라서 나눗셈 없이 곱셈과 덧셈만으로 빠르게 난수를 만들 수 있다.
      부호비트를 뺀 4비트라면 법은 $2^4 = 16$이고, 결과의 하위 4비트가 난수가 된다.
      101010(2진수) = 42이고, $42 \bmod 16 = 10$ = 1010(2진수)이다.

      ※ 원본 표기: 발문의 "mod=4"는 4비트 레지스터, 즉 법 $2^4=16$을 뜻한다.
    tags: [random-number, overflow]

  - id: l12-01
    type: multiple-choice
    passageRefs: [gl12-chi-square-01]
    prompt: 자유도는?
    choices:
      - { id: '1', text: '99' }
      - { id: '2', text: '100' }
      - { id: '3', text: '101' }
      - { id: '4', text: '102' }
    answers: ['1']
    explanation: |
      선택지 1: 난수의 일양성 $\chi^2$ 검정 통계량은 근사적으로 자유도 $k-1$인 $\chi^2$ 분포를 따르므로, 구간 수 $k=100$일 때 자유도는 $100-1=99$이다.
      선택지 2: 100은 구간 수 $k$ 자체이다. 각 구간 빈도의 합이 $n$으로 고정되어 있어 자유도가 하나 줄어든다.
      선택지 3: 101은 구간 수에 1을 더한 값으로, 자유도 계산 방식과 맞지 않는다.
      선택지 4: 102도 구간 수보다 큰 값으로, 자유도는 구간 수보다 클 수 없다.

      핵심 개념:
      $\chi^2$ 검정은 [0,1)을 $k$개 구간으로 나누고 각 구간의 관측치 $O_i$와 기대치 $n/k$를 비교한다.
      통계량은 $\chi^2 = \frac{k}{n}\sum_{i=1}^{k}(O_i - n/k)^2$이다.
      $n$이 충분히 크면 이 통계량은 자유도 $k-1$인 $\chi^2$ 분포를 따른다.
      계산값이 유의수준에 해당하는 임계값보다 크면 일양분포 가설을 기각한다.
    tags: [random-number-test, chi-square-test]

  - id: l12-02
    type: multiple-choice
    passageRefs: [gl12-chi-square-01]
    prompt: $O_i$ 가 뜻하는 것은?
    choices:
      - { id: '1', text: '기대값' }
      - { id: '2', text: '신뢰 구간' }
      - { id: '3', text: '자유도' }
      - { id: '4', text: '관측치' }
    answers: ['4']
    explanation: |
      선택지 1: 기대값은 식에서 $n/k$로 나타나며, 난수가 정확히 일양분포를 따를 때 한 구간에 들어갈 것으로 기대되는 개수이다.
      선택지 2: 신뢰 구간은 모수의 값이 포함될 범위를 추정하는 개념으로, 검정 통계량 식의 항이 아니다.
      선택지 3: 자유도는 $k-1$로, 검정에 쓸 $\chi^2$ 분포를 정할 때 쓰는 값이며 식 안의 $O_i$가 아니다.
      선택지 4: $O_i$(observed)는 실제 발생시킨 난수 중 $i$번째 구간에 들어간 개수, 즉 관측치이다. 난수가 일양분포를 따르더라도 실제 개수는 기대치 $n/k$와 정확히 같지 않고 표본마다 달라진다.

      핵심 개념:
      $\chi^2$ 검정은 관측치 $O_i$와 기대치 $E_i = n/k$의 차이를 제곱해 합한다.
      차이가 클수록 통계량이 커지고, 일양분포 가설이 기각될 가능성이 커진다.
      $O_i$를 모두 더하면 전체 난수 개수 $n$이 된다.
      관측치는 표본에 따라 달라지므로 우연한 변동을 $\chi^2$ 분포로 판단한다.
    tags: [random-number-test, chi-square-test]

  - id: l12-03
    type: multiple-choice
    passageRefs: [gl12-chi-square-01]
    prompt: 기대치 n/k 의 값은?
    choices:
      - { id: '1', text: '20' }
      - { id: '2', text: '30' }
      - { id: '3', text: '40' }
      - { id: '4', text: '50' }
    answers: ['3']
    explanation: |
      선택지 1: 구간마다 20개씩이면 전체가 $20 \times 100 = 2000$개가 되어 발생시킨 난수 4000개와 맞지 않는다.
      선택지 2: 구간마다 30개씩이면 전체가 $30 \times 100 = 3000$개가 되어 발생시킨 난수 4000개와 맞지 않는다.
      선택지 3: 4000개의 난수가 정확히 일양분포를 따른다면 100개 구간에 고르게 들어가므로 기대치는 $n/k = 4000/100 = 40$이다.
      선택지 4: 구간마다 50개씩이면 전체가 $50 \times 100 = 5000$개가 되어 발생시킨 난수 4000개보다 많다.

      핵심 개념:
      기대치는 일양분포 가정 아래에서 한 구간에 들어갈 것으로 예상되는 난수의 개수이다.
      [0,1)을 $k$개의 같은 길이 구간으로 나누면 각 구간의 확률은 $1/k$이므로 기대치는 $n/k$이다.
      $\chi^2$ 근사가 잘 맞으려면 기대치가 충분히 커야 하며, 보통 5 이상이 되도록 한다.
      이 예에서 $n=4000$, $k=100$이므로 기대치는 40이다.
    tags: [random-number-test, chi-square-test]

  - id: l12-04
    type: multiple-choice
    prompt: 2차원 평면상에 점들을 발생시켜 일양분포의 성격을 검정하려 한다. 다음 중 적당한 것은?
    choices:
      - { id: '1', text: '$X^2$ 검정' }
      - { id: '2', text: '연속형 검정' }
      - { id: '3', text: 'Run-up 검정' }
      - { id: '4', text: 'Kolmogorov-Smirnov 검정' }
    answers: ['2']
    explanation: |
      선택지 1: 보통의 $\chi^2$ 검정은 [0,1)을 $k$개 구간으로 나누어 1차원 구간 빈도를 비교하는 일양성 검정이다. 연이은 난수를 짝지은 점을 $d$차원 칸으로 나누어 빈도를 비교하도록 넓힌 방법은 따로 연속형 검정이라 부르며, 통계량은 $\chi^2$를 그대로 쓴다.
      선택지 2: 연속형 검정(serial test)은 연이은 난수 $U$들을 $d$개씩 묶어 $d$-tuple로 만들고, $d$차원 단위입방체에서 고르게 분포하는지 검정한다. $d=2$이면 2차원 평면상의 점들이므로 정답이다.
      선택지 3: Run-up 검정은 연속해서 증가하는 난수열(run-up)의 길이를 조사해 독립성을 검정하는 방법이다.
      선택지 4: Kolmogorov-Smirnov 검정은 경험적 누적분포함수와 이론적 누적분포함수의 최대 차이로 1차원 일양성을 검정한다.

      핵심 개념:
      난수 검정은 일양성 검정과 독립성 검정으로 나눌 수 있다.
      $\chi^2$ 검정과 K-S 검정은 1차원 일양성을 검정한다.
      연속형 검정은 $d$차원 공간에서의 일양성을 검정하여 연이은 난수 사이의 관계까지 확인한다.
      Run-up 검정은 독립성 가정을 직접 검정한다.
    tags: [random-number-test, serial-test]

  - id: l12-05
    type: multiple-choice
    prompt: 난수의 검정에서 독립성을 검정하는 것은?
    choices:
      - { id: '1', text: '$x^2$ 검정' }
      - { id: '2', text: '연속형 검정' }
      - { id: '3', text: 'Run-up 검정' }
      - { id: '4', text: 'Kolmogorov-Smirnov 검정' }
    answers: ['3']
    explanation: |
      선택지 1: $\chi^2$ 검정은 각 구간의 관측 빈도와 기대 빈도를 비교하여 일양성을 검정한다.
      선택지 2: 연속형 검정은 $d$-tuple이 $d$차원 단위입방체에서 고르게 분포하는지 보는 다차원 일양성 검정이다. 연이은 난수 사이에 상관이 있으면 점의 분포가 치우치므로 독립성을 간접적으로 드러내지만, 독립성 자체를 직접 검정하는 방법은 아니다.
      선택지 3: Run-up 검정은 일련의 $U_i$에서 끊이지 않고 증가하는 부분열(run-up)의 길이별 개수를 조사하여, 일양성(uniformity)이 아닌 독립가정(independence assumption)을 직접 검정한다.
      선택지 4: Kolmogorov-Smirnov 검정은 경험적 누적분포와 일양분포의 누적분포를 비교하는 일양성 검정이다.

      핵심 개념:
      좋은 난수는 일양성과 독립성을 모두 만족해야 한다.
      일양성은 $\chi^2$ 검정, K-S 검정, 연속형 검정 등으로 확인한다.
      독립성은 Run-up 검정처럼 난수열의 증가·감소 패턴을 조사해 확인한다.
      독립이라면 run-up 길이의 분포가 이론적으로 기대되는 값과 비슷해야 한다.
    tags: [random-number-test, runs-test]

  - id: l13-01
    type: multiple-choice
    prompt: 확률변수를 발생시키는 방법이 아닌 것은?
    choices:
      - { id: '1', text: '역변환' }
      - { id: '2', text: '합성법' }
      - { id: '3', text: '채택-기각방법' }
      - { id: '4', text: '합동법' }
    answers: ['4']
    explanation: |
      선택지 1: 역변환법은 일양난수 $U$를 누적분포함수의 역함수에 넣어 $X = F^{-1}(U)$로 확률변수를 발생시키는 방법이다.
      선택지 2: 합성법은 분포가 여러 분포의 가중 결합으로 표현될 때, 확률 $p_j$로 분포 하나를 고른 뒤 그 분포에서 값을 발생시키는 방법이다.
      선택지 3: 채택-기각방법은 다루기 쉬운 분포에서 후보 값을 발생시키고 일정한 조건을 만족하면 채택, 아니면 기각하는 확률변수 발생방법이다.
      선택지 4: 합동법은 $X_i = (aX_{i-1}+c) \bmod m$으로 [0,1) 일양난수를 만드는 난수 발생법이다. 난수를 특정 분포의 확률변수로 바꾸는 방법이 아니므로 정답이다.

      핵심 개념:
      난수 발생은 [0,1) 일양난수를 만드는 단계이고, 확률변수 발생은 그 난수를 원하는 분포로 바꾸는 단계이다.
      확률변수 발생방법에는 역변환법, 합성법, 결합법, 채택-기각방법이 있다.
      합동법(혼합식·승산식)은 난수 발생 단계에 속한다.
      어떤 방법을 쓸지는 분포함수의 역함수 존재 여부, 분포의 구조, 발생 효율을 고려해 정한다.
    tags: [random-variate-generation, methods]

  - id: l13-02
    type: multiple-choice
    prompt: m - Erlang 분포의 특징을 이용하면 어느 방법으로 확률변수를 발생시키는 것이 적당한가?
    choices:
      - { id: '1', text: '역변환법' }
      - { id: '2', text: '합성법' }
      - { id: '3', text: '결합법' }
      - { id: '4', text: '채택기각법' }
    answers: ['3']
    explanation: |
      선택지 1: m-Erlang 분포의 누적분포함수는 역함수를 닫힌 식으로 구할 수 없어 역변환법을 바로 적용하기 어렵다.
      선택지 2: 합성법은 분포함수가 여러 분포함수의 가중 결합 $\sum p_j F_j(x)$로 표현될 때 쓰는 방법으로, 확률변수들의 합이라는 m-Erlang의 특징과 다르다.
      선택지 3: m-Erlang 확률변수는 서로 독립이고 같은 지수분포를 따르는 확률변수 $m$개의 합이므로, 지수 확률변수 $m$개를 발생시켜 더하는 결합법을 쓸 수 있다.
      선택지 4: 채택기각법은 발생시킨 후보 값을 조건에 따라 받아들이거나 버리는 방법으로, m-Erlang의 합 구조를 이용하는 방법이 아니다.

      핵심 개념:
      m-Erlang 분포는 평균이 같은 독립 지수분포 $m$개의 합의 분포이다.
      따라서 $Y_1, \ldots, Y_m$을 각각 지수분포로 발생시켜 $X = Y_1 + \cdots + Y_m$을 구하면 된다.
      $m$이 크면 지수 확률변수를 많이 발생시켜야 하므로 속도가 느려진다.
      이때는 m-Erlang이 감마분포의 특수한 경우라는 점을 이용해 감마분포 발생법을 쓰면 더 효율적이다.
    tags: [random-variate-generation, convolution-method]

  - id: l13-03
    type: multiple-choice
    prompt: 확률 변수가 $X = Y_1 + Y_2$ ........+ $Y_m$ 으로 나타내어질 때 사용하는 확률변수 발생법은?
    choices:
      - { id: '1', text: '역변환법' }
      - { id: '2', text: '합성법' }
      - { id: '3', text: '결합법' }
      - { id: '4', text: '채택기각법' }
    answers: ['3']
    explanation: |
      선택지 1: 역변환법은 누적분포함수의 역함수 $F^{-1}(U)$를 이용하는 방법으로, 확률변수가 여러 확률변수의 합으로 표현된다는 구조를 이용하지 않는다.
      선택지 2: 합성법은 분포함수가 여러 분포함수의 가중 결합으로 표현될 때 확률에 따라 분포 하나를 골라 발생시키는 방법으로, 확률변수들을 더하는 방법이 아니다.
      선택지 3: 결합법은 발생시킬 $X$가 몇 개의 확률변수 $Y_1, Y_2, \ldots, Y_m$의 합으로 나타날 때 각 $Y_j$를 발생시켜 더하는 방법이다. 이런 $X$를 $Y_j$의 $m$-겹 결합(m-fold convolution)이라고 한다.
      선택지 4: 채택기각법은 후보 값을 발생시킨 뒤 조건에 따라 채택하거나 기각하는 방법으로, 합의 구조와 관계가 없다.

      핵심 개념:
      결합법(convolution method)은 $X = Y_1 + Y_2 + \cdots + Y_m$ 꼴의 확률변수를 발생시킬 때 쓴다.
      각 $Y_j$는 서로 독립이며, 개별적으로 발생시키기 쉬운 분포여야 한다.
      대표적인 예는 m-Erlang 분포(지수분포 $m$개의 합)와 이항분포(베르누이 $m$개의 합)이다.
      합성법은 분포의 가중 결합, 결합법은 확률변수의 합이라는 점에서 구분된다.
    tags: [random-variate-generation, convolution-method]

  - id: l13-04
    type: multiple-choice
    passageRefs: [gl13-composition-01]
    prompt: 지문은 확률변수 발생 방법에 대한 설명이다. 어느 방법을 설명하는 것인가?
    choices:
      - { id: '1', text: '역변환법' }
      - { id: '2', text: '합성법' }
      - { id: '3', text: '결합법' }
      - { id: '4', text: '채택기각법' }
    answers: ['2']
    explanation: |
      선택지 1: 역변환법은 분포함수 하나의 역함수를 이용해 $X = F^{-1}(U)$로 발생시키는 방법으로, 여러 분포함수의 조합을 다루지 않는다.
      선택지 2: 합성법은 분포함수 $F$가 다른 분포함수들 $F_1, F_2, \ldots$의 조합(가중 결합)으로 표시될 수 있을 때 쓰는 방법이다. 확률 $p_j$에 따라 $j$를 고른 뒤 $F_j$에서 값을 발생시킨다.
      선택지 3: 결합법은 확률변수 자체가 여러 확률변수의 합 $X = Y_1 + \cdots + Y_m$으로 표현될 때 쓰는 방법으로, 분포함수의 가중 결합과 다르다.
      선택지 4: 채택기각법은 후보 값을 발생시킨 뒤 조건을 만족하면 채택하고 아니면 기각하는 방법이다.

      핵심 개념:
      합성법은 $F(x) = \sum_{j} p_j F_j(x)$ 또는 $f(x) = \sum_{j} p_j f_j(x)$로 나타나는 분포에 쓴다.
      가중치는 $p_j \ge 0$, $\sum_j p_j = 1$을 만족한다.
      먼저 난수로 $P(J=j)=p_j$인 $J$를 정하고, 다음에 분포 $F_J$에서 $X$를 발생시킨다.
      대표적인 예로 양쪽으로 나뉘는 이중지수(라플라스)분포 발생이 있다.

      ※ 원본 표기: 지문 식은 좌변이 분포함수 $F(x)$인데 우변에 소문자 $f_j(x)$를 썼다. 분포함수로 쓰면 $F(x)=\sum p_j F_j(x)$, 확률밀도함수로 쓰면 $f(x)=\sum p_j f_j(x)$이다.
    tags: [random-variate-generation, composition-method]

  - id: l13-05
    type: multiple-choice
    passageRefs: [gl13-exponential-generation-01]
    prompt: 지문은 지수 확률변수를 발생시키는 과정이다. 이 방법의 이름은 ?
    choices:
      - { id: '1', text: '역변환법' }
      - { id: '2', text: '합성법' }
      - { id: '3', text: '결합법' }
      - { id: '4', text: '채택기각법' }
    answers: ['1']
    explanation: |
      선택지 1: 지수분포의 누적분포함수 $F(x) = 1-e^{-x/m}$을 일양난수 $U$와 같다고 놓고 $x$에 대해 풀어 $x = -m\ln(1-U)$를 얻는다. 분포함수의 역함수를 쓰므로 역변환법이다.
      선택지 2: 합성법은 분포함수가 여러 분포함수의 가중 결합일 때 분포를 먼저 고르는 방법으로, 지문처럼 식 하나를 역으로 푸는 과정이 아니다.
      선택지 3: 결합법은 여러 확률변수를 발생시켜 더하는 방법으로, 지문은 난수 하나로 값 하나를 얻는다.
      선택지 4: 채택기각법은 후보 값을 채택하거나 버리는 판정 단계가 있지만, 지문에는 그런 판정이 없다.

      핵심 개념:
      역변환법은 $U = F(X)$로 놓고 $X = F^{-1}(U)$를 구해 확률변수를 발생시킨다.
      평균이 $m$인 지수분포는 $F(x)=1-e^{-x/m}$이므로 $X = -m\ln(1-U)$이다.
      $1-U$도 [0,1)의 일양난수이므로 $X = -m\ln U$로 간단히 쓰기도 한다.
      역함수를 닫힌 식으로 구할 수 있는 분포(지수분포, 일양분포 등)에 특히 효율적이다.
    tags: [random-variate-generation, inverse-transform]

  - id: l14-01
    type: multiple-choice
    prompt: 확률분포의 모수 중에서 분포의 축소 또는 확대와 관계있는 것은?
    choices:
      - { id: '1', text: '위치모수' }
      - { id: '2', text: '규모모수' }
      - { id: '3', text: '형태모수' }
      - { id: '4', text: '위치모수와 규모모수' }
    answers: ['2']
    explanation: |
      선택지 1: 위치모수는 분포가 놓이는 x축 위치를 정하는 모수로, 값이 바뀌면 분포 모양과 폭은 그대로이고 왼쪽 또는 오른쪽으로 이동할 뿐이다.
      선택지 2: 규모모수는 분포의 기본형태는 변하지 않고 측정 단위(눈금)를 바꾸듯 분포를 축소하거나 확대시키는 모수이므로 정답이다.
      선택지 3: 형태모수는 위치나 크기가 아니라 분포의 기본 모양 자체를 바꾸는 모수이다.
      선택지 4: 위치모수는 분포를 이동시킬 뿐 축소·확대와 관계가 없으므로 두 모수를 함께 고른 것은 맞지 않는다.

      핵심 개념:
      확률분포의 모수는 위치모수, 규모모수, 형태모수로 나눌 수 있다.
      위치모수 $\gamma$는 분포를 x축 방향으로 평행이동시킨다.
      규모모수 $\beta$는 분포의 모양은 그대로 두고 퍼진 정도를 늘이거나 줄인다.
      형태모수 $\alpha$는 분포의 기본 모양을 바꾼다(예: 감마·와이블 분포).
    tags: [probability-distribution, parameters]

  - id: l14-02
    type: multiple-choice
    prompt: 확률분포의 모수 중에서 분포를 왼쪽이나 오른쪽으로의 이동시키는 것과 관계있는 것은?
    choices:
      - { id: '1', text: '위치모수' }
      - { id: '2', text: '규모모수' }
      - { id: '3', text: '형태모수' }
      - { id: '4', text: '위치모수와 규모모수' }
    answers: ['1']
    explanation: |
      선택지 1: 위치모수(location parameter 또는 shift parameter) $\gamma$는 분포가 가질 수 있는 값의 범위에 대한 x축의 위치를 나타내며, $\gamma$가 바뀌면 다른 성질은 그대로이고 분포가 왼쪽 또는 오른쪽으로 이동한다.
      선택지 2: 규모모수는 분포를 축소하거나 확대시키는 모수로, 좌우 이동과는 관계가 없다.
      선택지 3: 형태모수는 분포의 기본 모양을 바꾸는 모수이다.
      선택지 4: 규모모수는 이동이 아니라 축소·확대에 관계하므로 두 모수를 함께 고른 것은 맞지 않는다.

      핵심 개념:
      위치모수는 분포의 위치, 규모모수는 분포의 크기(퍼짐), 형태모수는 분포의 모양을 정한다.
      예를 들어 정규분포에서 평균 $\mu$는 위치모수, 표준편차 $\sigma$는 규모모수이다.
      위치모수를 바꾸면 분포 전체가 평행이동하고, 분산은 변하지 않는다.
      입력분포를 선택할 때 이 세 모수를 추정해 분포를 구체적으로 정한다.
    tags: [probability-distribution, parameters]

  - id: l14-03
    type: multiple-choice
    prompt: 연속형의 입력분포를 선택하는데 사용하는 방법이 아닌 것은?
    choices:
      - { id: '1', text: '점통계량' }
      - { id: '2', text: '히스토그램' }
      - { id: '3', text: '확률도' }
      - { id: '4', text: '막대그래프' }
    answers: ['4']
    explanation: |
      선택지 1: 점통계량(예: 변동계수)은 자료의 요약 통계량으로 후보 분포의 특징과 비교해 연속형 분포를 고르는 데 쓴다.
      선택지 2: 히스토그램은 자료를 구간으로 나누어 빈도를 그린 그림으로, 모양을 연속형 분포의 확률밀도함수와 비교한다.
      선택지 3: 확률도(probability plots)는 자료의 분위수나 누적확률을 후보 분포와 비교해 직선에 가까운지 보는 방법으로, 연속형 분포 선택에 쓴다.
      선택지 4: 막대그래프(line graph)는 이산값마다 빈도를 막대로 나타내는 방법으로, 이산형 분포를 선택할 때 히스토그램 대신 쓴다. 연속형 분포 선택 방법이 아니므로 정답이다.

      핵심 개념:
      연속형 입력분포를 선택하는 발견적 기법(heuristics)으로 점통계량, 히스토그램, 확률도가 있다.
      이산형 분포는 값이 떨어져 있으므로 히스토그램 대신 막대그래프를 쓴다.
      이산형은 분포함수의 역함수가 잘 정의되지 않는 경우가 많아 확률도를 일반적으로 쓰기 어렵다.
      분포를 고른 뒤에는 모수를 추정하고 적합도 검정으로 확인한다.
    tags: [input-distribution, distribution-selection]

  - id: l14-04
    type: multiple-choice
    prompt: 입력분포를 선택하는데 사용하는 방법으로 연속형과 이산형에 모두 사용될 수 있는 방법은?
    choices:
      - { id: '1', text: '점통계량' }
      - { id: '2', text: '히스토그램' }
      - { id: '3', text: '확률도' }
      - { id: '4', text: '막대그래프' }
    answers: ['1']
    explanation: |
      선택지 1: 점통계량은 평균, 분산, 변동계수처럼 자료에서 계산한 요약값으로, 연속형과 이산형 자료 모두에서 계산해 후보 분포의 특성과 비교할 수 있다.
      선택지 2: 히스토그램은 연속형 자료를 구간으로 나누어 밀도함수 모양을 보는 방법이다. 이산형에서는 히스토그램 대신 막대그래프가 더 유용하다.
      선택지 3: 확률도는 역함수가 잘 정의되지 않는 경우가 많은 이산형 분포에는 일반적으로 이용하기 어렵다.
      선택지 4: 막대그래프는 이산값별 빈도를 나타내는 방법으로 이산형 분포에 쓰며, 연속형에는 히스토그램을 쓴다.

      핵심 개념:
      점통계량은 연속형과 이산형에 모두 쓸 수 있는 분포 선택 방법이다.
      연속형에서는 변동계수 $\sigma/\mu$, 이산형에서는 $\sigma^2/\mu$ 같은 비율을 후보 분포의 이론값과 비교한다.
      연속형은 히스토그램과 확률도, 이산형은 막대그래프로 분포 모양을 살핀다.
      발견적 기법으로 후보를 고른 뒤 모수 추정과 적합도 검정을 한다.
    tags: [input-distribution, distribution-selection]

  - id: l14-05
    type: multiple-choice
    prompt: 다음 중 확률분포의 적합도 검정에서    $X^2$ - 검정과 관계없는 것은?
    choices:
      - { id: '1', text: '구간의 빈도수가 5 이상이 되도록 조정한다.' }
      - { id: '2', text: '누적 확률분포를 비교한다.' }
      - { id: '3', text: '실제 빈도수와 숫자만을 사용한다.' }
      - { id: '4', text: '표본의 수가 100 이상인 경우 유용하다.' }
    answers: ['2']
    explanation: |
      선택지 1: $\chi^2$ 검정에서는 각 구간의 기대빈도가 5 이상이 되어야 하며, 그보다 작으면 이웃 구간을 합쳐서 계산한다. $\chi^2$ 검정과 관계있는 설명이다.
      선택지 2: 이론적 확률분포의 누적확률분포와 관측자료의 누적확률분포를 비교하는 것은 Kolmogorov-Smirnov 검정의 방식이다. $\chi^2$ 검정은 구간별 빈도를 비교하므로 관계없는 설명이다.
      선택지 3: $\chi^2$ 검정은 상대빈도나 비율이 아니라 실제 빈도수(개수)만 사용하므로 관계있는 설명이다.
      선택지 4: 표본 수 $n$이 100 이상이면 $\chi^2$ 검정이 좋고, $10 \le n \le 99$이면 K-S 검정을 쓰는 것이 좋다. $\chi^2$ 검정과 관계있는 설명이다.

      핵심 개념:
      $\chi^2$ 적합도 검정은 구간별 관측빈도와 이론분포에서 얻은 기대빈도를 비교한다.
      각 구간의 기대빈도는 5 이상이어야 하고, 부족하면 인접 구간을 합친다.
      자유도는 $\nu = k-1-m$이며, $k$는 구간 수, $m$은 자료로 추정한 모수의 수이다.
      K-S 검정은 누적분포를 비교하며 표본이 작을 때 유용하다.
    tags: [goodness-of-fit, chi-square-test]

  - id: l15-01
    type: multiple-choice
    prompt: IEEE 802.3에 표준으로 정의되어 있으며 가장 광범위하게 설치된 근거리통신망 네크워크 모델로 일반적으로 동축케이블을 전송매체로 하는 것은?
    choices:
      - { id: '1', text: 'Ethernet' }
      - { id: '2', text: 'Hub' }
      - { id: '3', text: 'MAC' }
      - { id: '4', text: 'CSMA/CD' }
    answers: ['1']
    explanation: |
      선택지 1: Ethernet은 가장 광범위하게 설치된 근거리통신망(LAN) 네트워크 모델로 IEEE 802.3에 표준으로 정의되어 있다. 제록스가 처음 개발했고 제록스, DEC, 인텔 등이 발전시켰으며, 동축케이블이나 등급이 매겨진 비차폐 연선을 전송매체로 쓴다.
      선택지 2: Hub는 여러 장치를 하나의 네트워크 세그먼트로 연결하는 중계 장비로, 표준으로 정의된 LAN 네트워크 모델 자체가 아니다.
      선택지 3: MAC(Medium Access Control)은 여러 장치가 공유 매체에 접근하는 방식을 정하는 데이터링크 계층의 부계층으로, 네트워크 모델의 이름이 아니다.
      선택지 4: CSMA/CD는 Ethernet이 사용하는 매체 접근 방식(프로토콜)으로, LAN 네트워크 모델 자체를 가리키지 않는다.

      핵심 개념:
      Ethernet은 IEEE 802.3으로 표준화된 대표적인 LAN 기술이다.
      초기 Ethernet은 동축케이블을 공유 버스로 썼고, 이후 비차폐 연선(UTP)이 널리 쓰였다.
      공유 매체에 여러 장치가 접근하므로 MAC 방식으로 CSMA/CD를 사용한다.
      네트워크 시뮬레이션 실습에서는 Hub에 여러 station을 연결한 Shared Ethernet 모델을 설계한다.
    tags: [network-simulation, ethernet]

  - id: l15-02
    type: multiple-choice
    prompt: 근거리통신망에서 사용하는 통신방식으로 버스에 연결된 여러통신 주체들이 동시에 통신을 하면서 발생하는 충돌을 방지하기 위한 프로토콜은?
    choices:
      - { id: '1', text: 'Ethernet' }
      - { id: '2', text: 'Hub' }
      - { id: '3', text: 'MAC' }
      - { id: '4', text: 'CSMA/CD' }
    answers: ['4']
    explanation: |
      선택지 1: Ethernet은 CSMA/CD를 사용하는 LAN 네트워크 모델(표준)의 이름으로, 충돌을 다루는 특정 프로토콜 자체를 가리키지 않는다.
      선택지 2: Hub는 station들을 연결하는 장비로, 충돌을 제어하는 프로토콜이 아니다. 허브에 연결된 장치들은 하나의 충돌 영역을 공유한다.
      선택지 3: MAC은 매체 접근 제어라는 계층·기능의 이름이며, 구체적인 충돌 처리 방식은 CSMA/CD 같은 프로토콜이 정한다.
      선택지 4: CSMA/CD는 회선이 사용 중인지 감지(Carrier Sense)해 사용 중이면 기다리고, 비어 있으면 전송한다. 두 주체가 동시에 전송해 충돌이 나면 전송 중에 이를 감지(Collision Detection)하고 임의의 시간(random backoff) 동안 기다렸다가 재전송한다.

      핵심 개념:
      CSMA/CD(Carrier Sense Multiple Access with Collision Detection)는 공유 버스형 Ethernet의 매체 접근 방식이다.
      전송 전에 반송파를 감지해 충돌 가능성을 줄이고, 그래도 생긴 충돌은 전송 중 신호를 감시해 검출한다.
      충돌이 검출되면 전송을 멈추고 무작위 대기 시간 뒤 재전송한다.
      부하가 커질수록 충돌과 재전송이 늘어 네트워크 성능이 떨어진다.

      ※ 발문의 "충돌을 방지하기 위한"은 엄밀히는 "충돌을 감지·처리하기 위한"이다. CSMA/CD는 반송파 감지로 충돌을 줄이고, 생긴 충돌은 전송 중 검출해 재전송한다. 인쇄 정답(CSMA/CD)은 그대로 유지한다.
    tags: [network-simulation, csma-cd]

  - id: l15-03
    type: multiple-choice
    prompt: 네트워크 구조에서 표준화된 통신규약으로서 통신을 원하는 두 개체간에 무엇을, 어떻게, 언제 통신할 것인가를 서로 약속한 규약은?
    choices:
      - { id: '1', text: 'Ethernet' }
      - { id: '2', text: 'Protocol' }
      - { id: '3', text: 'Hub' }
      - { id: '4', text: 'Collision' }
    answers: ['2']
    explanation: |
      선택지 1: Ethernet은 IEEE 802.3으로 표준화된 LAN 기술의 이름으로, 통신 규약 일반을 가리키는 용어가 아니다.
      선택지 2: Protocol(프로토콜)은 네트워크 기능을 효율적으로 발휘하기 위한 표준화된 통신규약으로, 통신을 원하는 두 개체간에 무엇을, 어떻게, 언제 통신할 것인가를 약속한 규약이다.
      선택지 3: Hub는 여러 장치를 연결하는 네트워크 장비로, 약속이나 규약이 아니다.
      선택지 4: Collision은 두 개 이상의 station이 동시에 전송해 신호가 겹치는 충돌 현상을 뜻한다.

      핵심 개념:
      프로토콜은 통신하는 개체들이 지켜야 할 약속이다.
      프로토콜의 기본 요소는 구문(무엇을, 데이터 형식), 의미(어떻게, 제어 정보), 타이밍(언제, 속도와 순서)이다.
      Ethernet은 이런 규약들을 포함한 LAN 표준이고, CSMA/CD는 그중 매체 접근 규약이다.
      Hub는 장비, Collision은 공유 매체에서 생기는 현상이다.
    tags: [network-simulation, protocol]

  - id: l15-04
    type: multiple-choice
    prompt: 주어진 시간 동안에 컴퓨터가 할 수 있는 일의 양은?
    choices:
      - { id: '1', text: 'load' }
      - { id: '2', text: 'Protocol' }
      - { id: '3', text: 'Throughput' }
      - { id: '4', text: 'Collision' }
    answers: ['3']
    explanation: |
      선택지 1: load(부하)는 시스템이나 네트워크에 가해지는 작업·트래픽의 양으로, 실제로 처리해 낸 양이 아니다.
      선택지 2: Protocol은 통신하는 개체 사이의 약속(통신규약)이다.
      선택지 3: Throughput(처리량)은 주어진 시간 동안 컴퓨터가 할 수 있는 일의 양, 네트워크에서는 주어진 시간 동안 한 지점에서 다른 지점으로 옮겨진 데이터의 양이다. 역사적으로 여러 프로그램을 동시에 실행하는 대형 컴퓨터의 유효성을 비교하는 척도로 쓰였다.
      선택지 4: Collision은 공유 매체에서 여러 station이 동시에 전송해 신호가 겹치는 충돌 현상이다.

      핵심 개념:
      처리량(throughput)은 단위 시간당 처리한 작업이나 전달한 데이터의 양이다.
      네트워크에서는 초당 전달된 비트 수(bits/sec) 등으로 나타낸다.
      부하(load)가 커져도 충돌과 재전송 때문에 처리량이 부하만큼 늘지 않을 수 있다.
      네트워크 시뮬레이션에서는 부하에 따른 처리량, 이용률, 충돌 수를 비교한다.
    tags: [network-simulation, throughput]

  - id: l15-05
    type: multiple-choice
    prompt: 다음 중 Low_Load 시나리오와 관계 없는 것은?
    choices:
      - { id: '1', text: 'Interarrival Time(seconds)이 exponential(0.004) 으로 설정되었다.' }
      - {
          id: '2',
          text: '각 station들은 평균 100 byte packet을 매 약 4 milliseconds 마다 Traffic 을 발생시킨다.',
        }
      - {
          id: '3',
          text: '받은 traffic(약 7,000,000) 보다 더 많은 traffic (약 9,600,000) 이 전송되었다.',
        }
      - {
          id: '4',
          text: '모든 데이터의 전송이 수월하게 진행이 되었고 Utilization이 약 0.30 으로 비교적 작다.',
        }
    answers: ['3']
    explanation: |
      선택지 1: Low_Load 시나리오에서는 패킷 도착간격(Interarrival Time)을 평균 0.004초인 지수분포 exponential(0.004)로 설정하므로 관계있는 설명이다.
      선택지 2: 평균 도착간격 0.004초는 4 milliseconds이므로, 각 station이 평균 100 byte 패킷을 약 4 ms마다 발생시킨다는 설명은 Low_Load 설정과 같다.
      선택지 3: 받은 traffic(약 7,000,000)보다 보낸 traffic(약 9,600,000)이 많은 것은 High_Load 시나리오의 결과이다. High_Load에서는 Hub가 overload되어 보낸 traffic을 모두 전달하지 못한다. Low_Load에서는 보낸 traffic을 모두 받았으므로 관계없는 설명이다.
      선택지 4: Low_Load에서는 모든 데이터 전송이 수월하게 진행되었고 Utilization이 약 0.30으로, High_Load(약 0.90)보다 작다. 관계있는 설명이다.

      핵심 개념:
      Shared Ethernet 실습은 부하가 다른 두 시나리오(Low_Load, High_Load)를 만들어 결과를 비교한다.
      Low_Load에서는 보낸 traffic과 받은 traffic이 같아 모든 데이터가 전달된다.
      High_Load에서는 Hub가 overload되어 보낸 traffic보다 받은 traffic이 적고 Utilization도 높다.
      이렇게 시나리오별 traffic, Utilization, 충돌 수를 비교해 네트워크 성능을 분석한다.
    tags: [network-simulation, scenario-analysis]
