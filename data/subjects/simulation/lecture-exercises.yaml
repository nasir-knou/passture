  - id: gl07-fuel-01
    type: text
    body: |
      ※ (3~5) 다음은 단일 창구 대기행렬 시뮬레이션의 알고리즘 일부이고 조건은 다음과 같다.

      연료탱크 : 평균 = 20ℓ, 표준편차 = 3인 정규분포
      급유시간계산 : 1ℓ당 1/8분
      (알고리즘)

  - id: gl07-fuel-code-01
    type: code
    language: text
    body: |
      nseed=seed
      while (time 〈 tlimit) do
         {
          time = time + tstep
          arrive = 0
          call random(seed, U);
          if (U 〈 (prarr*tstep)) then
               { arrive = 1;
                queue = queue + arrive;
                totarr = totarr + 1;
               }
          if (tpump 〉 0.0)  then
               { tpump = tpump - tstep
                   if (tpump 〈 0.0) then
                       tpump = 0.0
               }
          if ((tpump = 0) & (queue ≠ 0))  then
               { queue = queue - 1
                call normal(nseed,nmean,stdev,liters);
                tpump = 1.0 + 1.0 / 8.0 * liters;
               }
          totque = totque + queue;
          print, time,arrive,queue,tpump
         }
      aveque = totque / (tlimit/tstep)
      avgwt =  totque / (totarr)
      print aveque, avgwt, totarr

