      AUTOMOD는 ASI가 개발한 물류·생산설비용 3차원 애니메이션 시뮬레이션 언어이다.
      AweSim은 SLAM 계열로 네트워크 노드 방식의 모델링을 제공한다.
      최근의 시뮬레이션 언어는 그래픽 사용자 인터페이스와 애니메이션 기능을 강조한다.
    tags: [simulation-language, promodel]

