  - id: gl05-monte-carlo-pi-01
    type: text
    body: |
      다음은  몬테칼로 시뮬레이션을 이용하여 π 값을 구하는 알고리즘이다.
      (방법)
      반지름의 길이가 1인 원의 면적은 π 이므로 이 면적을 구하면 곧 π 값을 구하게 된다.  난수 U[0,1)를 두개씩 발생시킨 후  앞의 것을 x 뒤의 것을 y 라 하면  좌표 (x, y)는 하나의 점이되어 이차원 좌표에 표현된다. 계산을 간단히 하기 위하여 1사분면 원안에 들어가는 점의 개수를 비율로 계산한 후 4를 곱하면 π 값에 근사한 값을 구할 수 있다.  따라서 전체 알고리즘은 다음과 같다.

  - id: gl05-monte-carlo-pi-code-01
    type: code
    language: text
    body: |
      { count=0
        limit = 50000
       while i≤limit do
         {
          call random(n,U)
             x=U
          call random(n,U)
             y=U
          if then
              count=count+1
          i=i+1
         }
       s=count/limit
         s=s*4
       print 'result', s
       stop }

  - id: gl06-multi-server-01
    type: text
    body: |
      다음은 복수창구의 대기행렬 시뮬레이션의 알고리즘 일부이고 조건은 다음과 같다.
