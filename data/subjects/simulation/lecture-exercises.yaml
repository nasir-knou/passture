      선택지 2: 무엇을 풀지 정하는 문제의 정의가 모델 설계보다 뒤에 있어 순서가 맞지 않는다.
      선택지 3: 문제를 정의하기 전에 자료를 수집하면 어떤 자료가 필요한지 정할 수 없으므로 순서가 맞지 않는다.
      선택지 4: 자료수집이 모델변환 뒤에 있다. 모델에 넣을 입력 자료는 프로그램으로 변환하기 전에 수집되어야 한다.

