      핵심 개념:
      GASP → SLAM → AweSim은 Pritsker 계열 시뮬레이션 언어의 발전 흐름이다.
      AweSim은 네트워크 노드(Create, Await, Resource, Free, Collect 등)로 대기행렬 시스템을 그래픽하게 설계한다.
      GPSS는 블록 다이어그램 방식의 이산형 언어이고, DYNAMO는 연속형 시스템 다이내믹스 언어이다.
      언어마다 지원하는 모델링 월드뷰(사건, 프로세스, 연속)가 다르다.
