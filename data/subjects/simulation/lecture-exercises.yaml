    prompt: 12345를 초기값으로 갖는 변수는?
    choices:
      - { id: '1', text: 'tlimit' }
      - { id: '2', text: 'prarr' }
      - { id: '3', text: 'seed' }
      - { id: '4', text: 'mean' }
    answers: ['3']
    explanation: |
      선택지 1: tlimit은 시뮬레이션 시간으로, 조건에서 100이다.
      선택지 2: prarr는 1분당 도착확률로, 시간당 30대이므로 30/60 = 0.5이다.
      선택지 3: 조건의 "난수의 초기값 = 12345"는 `call random(seed, U)`와 `call poissn(seed,mean,p)`에 넘기는 seed의 초기값이므로 정답이다.
      선택지 4: mean은 포아송 분포 봉사시간의 평균으로, 조건에서 3분이다.

      핵심 개념:
      조건의 각 값은 알고리즘 변수에 다음과 같이 대응한다.
      시뮬레이션 시간 100 → tlimit, 도착상태 시간당 30대 → prarr = 0.5
      봉사시간 평균 3분 → mean, 난수의 초기값 12345 → seed
      봉사창구 2개는 tpump(1), tpump(2)와 `while(i 〈 2)` 반복으로 표현된다.
    tags: [queueing-system, multi-server]

  - id: l06-02
    type: multiple-choice
    passageRefs: [gl06-multi-server-01, gl06-multi-server-code-01]
    prompt: 0.5를 초기값으로 갖는 변수는?
    choices:
