      모델링은 실시스템의 행위를 흉내 내는 모델을 만드는 과정이다.
      모델링이 쉬운 경우: 물리적 규칙이 이용 가능하고, 구성요소 간 관계가 명확하며, 자료가 충분할 때
      모델링이 어려운 경우: 인간의 판단이 큰 비중을 차지하거나, 랜덤한 구성요소가 중요하거나, 이용 가능한 자료가 거의 없거나, 정량화하기 어려운 정책적 입력이 요구될 때
      모델은 목적에 필요한 수준으로 실시스템을 단순화해 표현한다.
    tags: [modeling, modeling-difficulty]

  - id: l05-03
    type: multiple-choice
    chapter: 1
    passageRefs: [gl05-monte-carlo-pi-01, gl05-monte-carlo-pi-code-01]
    prompt: 난수 U는 총 몇 개 발생되는가?
    choices:
      - { id: '1', text: '31415' }
      - { id: '2', text: '50,000' }
      - { id: '3', text: '100,000' }
      - { id: '4', text: '200,000' }
    answers: ['3']
    explanation: |
      선택지 1: 31415는 π(3.1415…)의 숫자를 흉내 낸 값일 뿐, 반복 횟수나 난수 개수와 관계없다.
      선택지 2: 50,000은 limit, 즉 발생시키는 점 (x, y)의 개수이다. 점 하나에 난수가 두 개 필요하므로 난수 개수는 이보다 많다.
      선택지 3: 반복을 limit = 50,000회 하고 한 번 반복할 때마다 `call random(n,U)`를 두 번(x용, y용) 호출하므로 50,000 × 2 = 100,000개이며 정답이다.
      선택지 4: 200,000은 반복마다 난수를 네 개 발생시켜야 나오는 값으로, 알고리즘의 호출 횟수와 맞지 않는다.

      핵심 개념:
      몬테칼로 방법은 난수를 이용한 반복 실험으로 값을 추정한다.
      [0,1) 난수 두 개로 1사분면의 단위정사각형 안에 점 (x, y)를 하나 만든다.
      반지름 1인 사분원 안에 드는 점의 비율은 넓이 비 π/4에 가까워지므로, 비율에 4를 곱하면 π의 근삿값이 된다.
      점이 많을수록 추정값이 π에 가까워진다.

      ※ 지문 알고리즘에는 i의 초기값이 없고 반복 조건이 `i≤limit`이므로 i를 0부터 시작하면 50,001회 반복되어 난수가 100,002개 발생한다. 인쇄 정답 100,000은 반복을 limit회로 본 값이며 정답은 그대로 둔다.
    tags: [monte-carlo, pi-estimation]

  - id: l05-04
    type: multiple-choice
    chapter: 1
    passageRefs: [gl05-monte-carlo-pi-01, gl05-monte-carlo-pi-code-01]
    prompt: 원안에 들어가는 점의 개수를 나타내는 변수는?
    choices:
      - { id: '1', text: 's' }
      - { id: '2', text: 'y' }
      - { id: '3', text: 'limit' }
      - { id: '4', text: 'count' }
    answers: ['4']
    explanation: |
      선택지 1: s는 원안에 든 점의 비율(count/limit)에 4를 곱한 π의 추정값이다.
      선택지 2: y는 두 번째로 발생시킨 난수로, 점의 y 좌표이다.
      선택지 3: limit은 발생시키는 전체 점의 개수(50000)이다.
      선택지 4: if 조건으로 점이 원 안에 드는지 판정하고 참이면 `count=count+1`로 1씩 늘리므로, 원안에 들어가는 점의 개수는 count이며 정답이다.

      핵심 개념:
      점 (x, y)가 반지름 1인 원 안에 드는 조건은 $x^2 + y^2 \le 1$이다.
      원 안의 점 개수 count를 전체 점 개수 limit으로 나누면 사분원 넓이 π/4의 추정값이다.
      따라서 π ≈ 4 × count / limit이고, 알고리즘에서는 s=count/limit, s=s*4로 계산한다.
      점을 많이 발생시킬수록 추정 오차가 줄어든다.

      ※ 원본 표기: 지문의 `if then`에는 조건식이 빠져 있으며, 원 안에 드는 점을 판정하는 조건은 $x^2 + y^2 \le 1$이다.
    tags: [monte-carlo, pi-estimation]

