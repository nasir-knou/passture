  - id: gl11-lcg-01
    type: text
    body: |
      ※ (2-4) 다음은 난수의 발생식이다.
      $X_i = 5 \cdot X_{i-1} + 3\ (\text{mod}\ 16)$

  - id: gl11-lcg-seed-01
    type: text
    body: |
      $X_0 = 1$ 일 때

  - id: gl12-chi-square-01
    type: text
    body: |
      ※ (1-3) $\chi^2$ - 검정에 관한 사항이다.
      4000개의 난수를 발생시켜서 100개의 구간으로 나누었다.

      $$
      \chi^2 = k/n \sum_{i=1}^{k} (O_i - n/k)^2
      $$

  - id: gl13-composition-01
    type: text
    body: |
      분포함수 F가 다른 분포함수들 $F_1$,$F_2$,...의 조합으로 표시될 수 있는 경우에 사용된다. 즉, 분포함수가 다음과 같이 나타나는 경우이다.

      $$
      F(x)= \sum_{j=1}^{\infty} p_j f_j(x)
      $$

  - id: gl13-exponential-generation-01
    type: text
    body: |
      $$
      \begin{aligned}
      F(x) &= U = 1-e^{-x/m} \\
      e^{-x/m} &= 1-U \\
      -x/m &= \ln(1-U) \\
      x &= -m*\ln(1-U)
      \end{aligned}
      $$

questions:
  # 1강 결정적 시뮬레이션
  - id: l01-01
    type: multiple-choice
    prompt: 시뮬레이션의 특징과 관계 ==없는== 것은?
    choices:
      - { id: '1', text: '실시스템의 실질적인 구축 없이도 평가 할 수 있다.' }
      - { id: '2', text: '비용이 매우 적게 든다.' }
      - { id: '3', text: '위험성을 내포한 경우 유용하다.' }
      - { id: '4', text: '해석적인 해를 구하기 어려운 경우 사용한다.' }
    answers: ['2']
    explanation: |
      선택지 1: 모델을 대상으로 실험하므로 실제 시스템을 짓기 전에도 성능을 평가하고 예측할 수 있다. 시뮬레이션의 대표적인 특징이다.
      선택지 2: 시뮬레이션은 초기 모델링 작업과 모델에 대한 많은 반복 실험 때문에 비용이 많이 든다. 실제 시스템을 그대로 실험하는 것보다 경제적일 수는 있어도 비용이 매우 적게 든다고 할 수는 없으므로 특징과 관계없는 설명이며 정답이다.
      선택지 3: 전쟁, 원자로 사고, 비행 훈련처럼 실제로 실험하면 위험한 경우 모델로 대신 실험할 수 있어 유용하다.
      선택지 4: 시스템이 복잡해 수학적(해석적) 해를 구하기 어려울 때 시뮬레이션을 사용한다.

      핵심 개념:
      시뮬레이션은 실시스템을 흉내 내는 모델을 만들어 실험하는 방법이다.
      실시스템을 구축하지 않고도 평가할 수 있고, 위험하거나 실험이 불가능한 경우에 유용하다.
      해석적 방법으로 풀기 어려운 문제에 사용하는 실험적 방법이다.
      모델링과 반복 실험에 비용이 많이 들지만, 실제 시스템으로 실험하는 것보다는 경제적일 수 있다(비행기 조종사 훈련 시뮬레이터).
    tags: [simulation, characteristics]

  - id: l01-02
    type: multiple-choice
    prompt: 다음 설명 중 틀린 것은?
    choices:
      - { id: '1', text: '실시스템 : 시뮬레이션 하고자 하는 실제 시스템' }
      - { id: '2', text: '시뮬레이션 : 시뮬레이터 위에서 실험하는 행위' }
      - { id: '3', text: '모델 : 실시스템을 흉내 내는 수학적 공식이나 실험절차' }
      - { id: '4', text: '시뮬레이터 : 모델을 실험하는 컴퓨터' }
    answers: ['4']
    explanation: |
      선택지 1: 실시스템은 시뮬레이션의 대상이 되는 실제 시스템이라는 옳은 정의이다.
      선택지 2: 시뮬레이션은 모델을 시뮬레이터 위에서 실험하는 행위라는 옳은 정의이다.
      선택지 3: 모델은 실시스템의 행위를 흉내 내는 수학적 공식이나 실험절차라는 옳은 정의이다.
      선택지 4: 시뮬레이터는 모델을 실험할 수 있는 기계나 도구이며 반드시 컴퓨터일 필요는 없다. 모델하우스, 충돌실험에 쓰는 진흙모델, 비행기·자동차 모형, 운전연습 시뮬레이터도 시뮬레이터이므로 틀린 설명이며 정답이다.

      핵심 개념:
      실시스템: 시뮬레이션하고자 하는 실제 시스템
      모델: 실시스템을 흉내 내는 수학적 공식이나 실험절차
      시뮬레이터: 모델을 실험할 수 있는 기계나 도구(컴퓨터에 한정되지 않음)
      시뮬레이션: 시뮬레이터 위에서 모델을 실험하는 행위
    tags: [simulation, terminology]

  - id: l01-03
    type: multiple-choice
    passageRefs: [gl01-savings-01, gl01-savings-code-01]
    prompt: 다음 중 은행이율을 나타내는 변수는 ?
    choices:
      - { id: '1', text: 'savings' }
      - { id: '2', text: 'salary' }
      - { id: '3', text: 'perint' }
      - { id: '4', text: 'perinc' }
    answers: ['3']
    explanation: |
      선택지 1: savings는 매년 이자와 저축액이 더해지는 누적 저축액이다.
      선택지 2: salary는 매년 저축액(`0.10*salary`)의 기준이 되고 인상률만큼 늘어나는 연봉이다.
      선택지 3: `perint * savings`는 기존 저축액에 붙는 이자이므로 perint가 은행이율(매년복리 5%)이며 정답이다.
      선택지 4: perinc는 `salary = salary+perinc * salary`에서 연봉에 곱해지는 연봉 인상률이다.

      핵심 개념:
      저축문제는 입력과 규칙이 모두 정해진 결정적 시뮬레이션의 예이다.
      매년 저축액은 이전 저축액의 이자(perint × savings)와 새 저축액(연봉의 10%)만큼 늘어난다.
      연봉은 매년 perinc(5%)만큼 인상된다.
      같은 입력이면 항상 같은 결과가 나오므로 한 번의 실행으로 30년 뒤의 결과를 얻는다.
    tags: [deterministic-simulation, savings-problem]

  - id: l01-04
    type: multiple-choice
    passageRefs: [gl01-savings-01, gl01-savings-code-01]
    prompt: 다음 중 연봉의 인상율을 나타내는 변수는 ?
    choices:
      - { id: '1', text: 'savings' }
      - { id: '2', text: 'salary' }
      - { id: '3', text: 'perint' }
      - { id: '4', text: 'perinc' }
    answers: ['4']
    explanation: |
      선택지 1: savings는 누적 저축액으로, 인상률이 아니라 매년 갱신되는 금액이다.
      선택지 2: salary는 연봉 자체이며 인상률이 곱해지는 대상이다.
      선택지 3: perint는 `perint * savings`로 저축액에 곱해지는 은행이율이다.
      선택지 4: `salary = salary+perinc * salary`에서 연봉에 perinc를 곱한 만큼 연봉이 늘어나므로 perinc가 연봉 인상률(매년 5%)이며 정답이다.

      핵심 개념:
      저축문제의 조건은 연봉 매년 5% 인상, 저축액은 연봉의 10%, 은행이율은 매년복리 5%이다.
      연봉 갱신식: salary ← salary + perinc × salary
      저축액 갱신식: savings ← savings + (perint × savings + 0.10 × salary)
      변수의 의미는 그 변수가 어떤 식에서 무엇에 곱해지는지로 판단한다.
    tags: [deterministic-simulation, savings-problem]

  - id: l01-05
    type: multiple-choice
    passageRefs: [gl01-savings-01, gl01-savings-code-01]
    prompt: 다음 중 연봉을 나타내는 변수는?
    choices:
      - { id: '1', text: 'savings' }
      - { id: '2', text: 'salary' }
      - { id: '3', text: 'perint' }
      - { id: '4', text: 'perinc' }
    answers: ['2']
    explanation: |
      선택지 1: savings는 저축액의 누적값으로, 연봉의 일부가 매년 더해지는 변수이다.
      선택지 2: 저축액이 연봉의 10%이므로 `0.10*salary`에서 salary가 연봉이며, 매년 인상률만큼 갱신되므로 정답이다.
      선택지 3: perint는 저축액에 곱해지는 은행이율이다.
      선택지 4: perinc는 연봉에 곱해지는 연봉 인상률로, 연봉 자체가 아니다.

      핵심 개념:
      조건의 "저축액: 연봉의 10%"는 알고리즘에서 `0.10*salary`로 표현된다.
      따라서 0.10이 곱해지는 salary가 연봉이다.
      salary는 반복마다 perinc만큼 인상되고, 인상된 연봉이 다음 해 저축액 계산에 쓰인다.
      반복은 year가 30이 될 때까지 계속되며 매년 year, salary, savings를 출력한다.
    tags: [deterministic-simulation, savings-problem]

  # 2강 확률적 시뮬레이션
  - id: l02-01
    type: multiple-choice
    prompt: 다음 확률적 시뮬레이션에 대한 설명 중 틀린 것은?
    choices:
      - { id: '1', text: 'probabilistic 또는 stochastic simulation 이라고 한다.' }
      - { id: '2', text: '결정적 시뮬레이션 보다 효율적이다.' }
      - { id: '3', text: '확률변수는 난수와 확률분포를 이용하여 발생할 수가 있다.' }
      - {
          id: '4',
          text: '[0, 1) 사이의 난수 U 에다 적당한 변형식을 적용하여 원하는 확률변수를 발생시킨다.',
        }
    answers: ['2']
    explanation: |
      선택지 1: 확률적 시뮬레이션은 영어로 probabilistic simulation 또는 stochastic simulation이라고 한다.
      선택지 2: 확률적 시뮬레이션과 결정적 시뮬레이션은 실시스템을 표현하는 모델 구성(확률변수 포함 여부)이 다를 뿐이며, 어느 쪽이 반드시 더 효율적이라고 할 수 없다. 오히려 확률적 시뮬레이션은 결과가 실행마다 달라 여러 번 반복 실행해야 하므로 틀린 설명이며 정답이다.
      선택지 3: 확률변수는 난수를 발생시킨 뒤 원하는 확률분포에 맞게 변형하여 만든다.
      선택지 4: [0, 1) 사이의 일양난수 U에 분포별 변형식(예: $a+(b-a)U$)을 적용하여 원하는 확률변수를 얻는다.

      핵심 개념:
      확률적 시뮬레이션은 확률변수를 포함하는 모델을 실험하는 시뮬레이션이다.
      결정적 시뮬레이션은 같은 입력에 항상 같은 결과를 내지만, 확률적 시뮬레이션은 실행마다 결과가 달라질 수 있다.
      확률변수는 [0, 1) 난수 U와 확률분포의 변형식을 이용하여 발생시킨다.
      두 방식은 모델 구성이 다를 뿐 효율의 우열이 정해져 있지 않다.
    tags: [stochastic-simulation, characteristics]

  - id: l02-02
    type: multiple-choice
    prompt: 다음 중 확률적 시뮬레이션과 관계없는 것은?
    choices:
      - { id: '1', text: '난수발생기' }
      - { id: '2', text: '연속형 확률변수' }
      - { id: '3', text: '공의 탄성문제' }
      - { id: '4', text: '[0, 1)' }
    answers: ['3']
    explanation: |
      선택지 1: 난수발생기는 확률변수를 만드는 출발점인 난수를 생성하므로 확률적 시뮬레이션의 핵심 요소이다.
      선택지 2: 연속형 확률변수(일양·지수·정규분포 등)는 확률적 시뮬레이션에서 발생시켜 사용하는 대상이다.
      선택지 3: 공의 탄성문제는 공의 위치와 속도가 물리 법칙으로 정해지는 결정적 시뮬레이션의 예로, 확률변수가 사용되지 않으므로 정답이다.
      선택지 4: [0, 1)은 난수발생기가 만드는 일양난수 U의 범위로, 확률변수 발생에 쓰인다.

      핵심 개념:
      결정적 시뮬레이션의 예: 저축문제, 공의 탄성문제, population 모델
      확률적 시뮬레이션은 난수발생기로 [0, 1) 난수를 만들고 이를 변형해 확률변수를 얻는다.
      확률변수는 연속형(일양, 지수, 정규 등)과 이산형(포아송 등)으로 나뉜다.
      모델 안에 확률변수가 있는지가 결정적·확률적 시뮬레이션을 가르는 기준이다.
    tags: [stochastic-simulation, deterministic-simulation]

  - id: l02-03
    type: multiple-choice
    prompt: U[0,1)의 난수를 발생시키는데 사용되는 분포는?
    choices:
      - { id: '1', text: '일양분포' }
      - { id: '2', text: '이항분포' }
      - { id: '3', text: '정규분포' }
      - { id: '4', text: '지수분포' }
    answers: ['1']
    explanation: |
      선택지 1: U[0,1)은 0 이상 1 미만의 범위에서 모든 값이 같은 확률밀도를 갖는 일양(균등) 확률변수이므로 정답이다.
      선택지 2: 이항분포는 n번의 독립 시행에서 성공 횟수를 나타내는 이산분포로, [0,1) 구간의 연속 난수를 나타내지 않는다.
      선택지 3: 정규분포는 평균을 중심으로 좌우 대칭인 종 모양 분포이며 범위가 제한되지 않는다. 일양난수를 여러 개 더해 근사적으로 만든다.
      선택지 4: 지수분포는 0 이상의 값을 갖는 연속분포로, 일양난수 U를 $-m\log_e U$로 변형해 얻는다.

      핵심 개념:
      난수발생기는 [0, 1) 구간의 일양난수 U를 만든다.
      U[0,1)의 U는 Uniform(일양분포)을 뜻한다.
      다른 확률분포의 확률변수는 이 일양난수를 변형식에 넣어 발생시킨다.
      따라서 일양난수는 모든 확률변수 발생의 기초가 된다.
    tags: [random-number, uniform-distribution]

  - id: l02-04
    type: multiple-choice
    passageRefs: [gl02-random-count-01]
    prompt: 지문은  난수 발생기의 예이다. (가) 에 알맞은 것은?
    choices:
      - { id: '1', text: 'n' }
      - { id: '2', text: 'random' }
      - { id: '3', text: 'j' }
      - { id: '4', text: 'U' }
    answers: ['2']
    explanation: |
      선택지 1: n은 `call (가) (n,U)`에 넘기는 인자로, 난수 발생에 쓰이는 초기값(seed) 역할을 한다. 호출할 루틴 이름이 아니다.
      선택지 2: (가)는 call로 호출하는 서브루틴 이름 자리이며, 난수를 발생시키는 함수 random이 들어가 `call random(n,U)`가 되므로 정답이다.
      선택지 3: j는 안쪽 for 문에서 5개 구간을 차례로 검사하는 반복 변수이다.
      선택지 4: U는 random 루틴이 돌려주는 결과 난수로, 호출 뒤 출력되고 구간 비교에 쓰인다.

      핵심 개념:
      `call random(seed, U)`는 seed를 이용해 [0, 1) 일양난수 U를 발생시키는 루틴이다.
      지문은 난수를 5000개 발생시키고, 각 난수가 [0, 0.2), [0.2, 0.4), …, [0.8, 1.0) 중 어느 구간에 속하는지 COUNT[j]에 센다.
      r1, r2를 0.2씩 늘리며 구간의 하한과 상한을 옮긴다.
      난수가 일양분포라면 각 구간에 약 1000개씩 고르게 나타난다.
    tags: [random-number, frequency-count]

  - id: l02-05
    type: multiple-choice
    passageRefs: [gl02-random-count-01]
    prompt: 지문은  난수 발생기의 예이다. (나) 에 알맞은 것은?
    choices:
      - { id: '1', text: 'n' }
      - { id: '2', text: 'random' }
      - { id: '3', text: 'j' }
      - { id: '4', text: 'U' }
    answers: ['4']
    explanation: |
      선택지 1: n은 난수 루틴에 넘기는 초기값 인자로, 구간 비교 대상이 아니다.
      선택지 2: random은 난수를 발생시키는 루틴 이름이며 값으로 비교할 수 없다.
      선택지 3: j는 몇 번째 구간인지를 나타내는 반복 변수로, COUNT의 첨자로 쓰인다.
      선택지 4: `r1 ≤ (나) 〈 r2`는 발생한 난수가 현재 구간 [r1, r2)에 들어가는지 검사하는 조건이므로, 루틴의 결과값인 난수 U가 들어가며 정답이다.

      핵심 개념:
      random 루틴이 돌려준 U는 [0, 1) 범위의 일양난수이다.
      [0, 1)을 폭 0.2인 5개 구간으로 나누고, U가 속한 구간의 COUNT[j]를 1 늘린다.
      이렇게 구간별 빈도를 세면 난수가 고르게 분포하는지 확인할 수 있다.
      5000개를 발생시키면 이론적으로 각 구간의 기대 빈도는 1000이다.
