      선택지 2: GASP는 FORTRAN 부프로그램 모음 형태의 이산사건 시뮬레이션 언어로, SLAM의 전신에 해당한다. SLAM의 상위버전이 아니다.
      선택지 3: AweSim은 SLAM(SLAM II)을 윈도우 환경으로 확장한 상위버전으로, Create, Await, Resource, Free, Collect 같은 그래픽 노드로 네트워크 모델을 구성한다.
