  # 3강 확률변수의 발생
  - id: l03-01
    type: multiple-choice
    passageRefs: [gl03-savings-uniform-01, gl03-savings-uniform-code-01]
    prompt: 빈칸 (가) 에 적당한 것은?
    choices:
      - { id: '1', text: 'call random(seed, U)' }
      - { id: '2', text: 'perinc= perinc * 0.01' }
      - { id: '3', text: 'salary = salary+perinc * salary' }
      - { id: '4', text: 'perinc= int (U*(perhig+1 - perlow)+perlow)' }
    answers: ['1']
    explanation: |
      선택지 1: 바로 다음 줄에서 U를 사용해 인상률을 계산하므로, 그 전에 일양난수 U를 발생시켜야 한다. 연봉 인상률을 0~10% 일양분포 확률변수로 만들기 위해 가장 먼저 할 일이 난수 발생이므로 정답이다.
      선택지 2: 인상률 perinc의 단위를 바꾸는 식이므로 perinc가 계산된 뒤에 와야 한다. perinc를 계산하는 줄보다 앞인 (가) 자리에는 올 수 없다.
      선택지 3: 연봉 갱신식은 인상률 perinc가 확정된 뒤에 적용해야 하므로 (가) 자리에 올 수 없다.
      선택지 4: 이미 (가) 다음 줄에 있는 식으로, 이 식이 쓰는 U가 먼저 발생되어 있어야 한다.

      핵심 개념:
      확률적 저축문제에서는 연봉 인상률이 고정 5%가 아니라 0~10% 범위의 일양분포를 따른다.
      매년 난수 U 발생 → 인상률 계산 → 비율 변환 → 연봉 갱신 순서로 처리한다.
      `int(U*(perhig+1-perlow)+perlow)`는 U[0,1)을 0~10의 정수로 바꾼다.
      결정적 모델의 상수를 확률변수로 바꾸면 확률적 시뮬레이션이 된다.
    tags: [random-variate-generation, savings-problem]

  - id: l03-02
    type: multiple-choice
    passageRefs: [gl03-savings-uniform-01, gl03-savings-uniform-code-02]
    prompt: 빈칸 (나) 에 적당한 것은?
    choices:
      - { id: '1', text: 'perinc= perinc * 0.1' }
      - { id: '2', text: 'perinc= perinc * 0.01' }
      - { id: '3', text: 'perint = perint * 0.1' }
      - { id: '4', text: 'perint = perint * 0.01' }
    answers: ['2']
    explanation: |
      선택지 1: 0~10에 0.1을 곱하면 0.0~1.0, 즉 0~100%가 되어 조건(0~10%)과 맞지 않는다.
      선택지 2: 앞 줄에서 perinc는 0~10 범위의 이산형 일양 확률변수(정수)로 구해졌다. 이를 퍼센트 비율로 쓰려면 0.01을 곱해 0.00~0.10으로 바꿔야 연봉 갱신식에 쓸 수 있으므로 정답이다.
      선택지 3: perint는 은행이율로, 이 문제에서 확률변수로 바꾼 대상이 아니며 새로 구한 인상률의 단위 변환과 관계없다.
      선택지 4: 역시 은행이율 perint를 바꾸는 식이라, 방금 구한 인상률 perinc의 변환이 이루어지지 않는다.

      핵심 개념:
      `perinc= int ( U*(perhig+1 - perlow)+perlow )`에서 perlow=0, perhig=10이면 int(11U)가 되어 0, 1, …, 10이 각각 1/11 확률로 나온다.
      이 값은 퍼센트 단위이므로 0.01을 곱해 비율(0.00~0.10)로 바꾼다.
      변환된 perinc를 `salary = salary+perinc * salary`에 적용해 연봉을 갱신한다.
      은행이율 perint는 조건대로 고정값을 유지한다.
    tags: [random-variate-generation, savings-problem]

  - id: l03-03
    type: multiple-choice
    prompt: 일양 분포의 확률 변수식은?
    choices:
      - { id: '1', text: '$x = -m\log_e U$' }
      - { id: '2', text: '$\prod_{i=0}^{n+1} U_i < e^{-m} \le \prod_{i=0}^{n} U_i$ (단, m은 평균)' }
      - { id: '3', text: '$x = \left(\sum_{i=1}^{12} U_i - 6\right) * S + m,\quad i = 1,...,12$' }
      - { id: '4', text: '$x = a + (b-a) * U$' }
    answers: ['4']
    explanation: |
      선택지 1: 평균이 m인 지수분포 확률변수를 역변환법으로 발생시키는 식이다.
      선택지 2: 일양난수를 차례로 곱해 가며 $e^{-m}$과 비교해 n을 정하는, 평균 m인 포아송 확률변수의 발생 조건이다.
      선택지 3: 일양난수 12개의 합에서 6을 빼면 근사적으로 표준정규분포가 되고, 여기에 표준편차 S를 곱하고 평균 m을 더한 정규분포 확률변수 식이다.
      선택지 4: [0,1) 난수 U를 구간 폭 (b−a)만큼 늘리고 a만큼 옮기면 [a, b) 구간의 연속형 일양분포 확률변수가 되므로 정답이다.

      핵심 개념:
      연속형 일양분포: $x = a + (b-a)U$
      지수분포(평균 m): $x = -m\log_e U$
      정규분포(평균 m, 표준편차 S): $x = (\sum_{i=1}^{12} U_i - 6)S + m$
      포아송분포(평균 m): 난수의 누적곱이 $e^{-m}$ 아래로 처음 떨어지기 직전까지 곱한 개수 n을 값으로 한다.
      포아송 발생 조건처럼 첨자를 $i=0$부터 적으면 $\prod_{i=0}^{n} U_i$는 난수 $n+1$개의 곱이며, 첨자를 $i=1$부터 적은 $\prod_{i=1}^{n} U_i \ge e^{-m} > \prod_{i=1}^{n+1} U_i$는 첨자 시작을 옮겨 곱한 난수 개수를 n과 맞춘 표준형이다.
    tags: [random-variate-generation, uniform-distribution]

  - id: l03-04
    type: multiple-choice
    passageRefs: [gl03-dice-01, gl03-dice-code-01]
    prompt: 시행횟수를 나타내는 변수는?
    choices:
      - { id: '1', text: 'nrolls' }
      - { id: '2', text: 'seed' }
      - { id: '3', text: 'U' }
      - { id: '4', text: 'side' }
    answers: ['1']
    explanation: |
      선택지 1: `while i〈 nrolls do { … i=i+1 }`은 i를 0부터 1씩 늘리며 nrolls번 반복하는 구조이므로, 주사위를 던지는 횟수(3000)가 nrolls이며 정답이다.
      선택지 2: seed는 random 루틴에 넘기는 난수의 초기값이다.
      선택지 3: U는 매 반복마다 발생하는 [0,1) 일양난수이다.
      선택지 4: side는 난수를 변형해 얻은 주사위 눈(1~6)으로, COUNT의 첨자로 쓰인다.

      핵심 개념:
      주사위 시뮬레이션은 한 번 던질 때마다 난수 U를 하나 발생시켜 눈 side로 바꾼다.
      COUNT[side]를 1씩 늘려 각 면이 나온 횟수를 센다.
      반복 횟수(시행횟수)는 while 조건의 상한 nrolls가 정한다.
      시행횟수가 커질수록 각 면의 상대빈도는 1/6에 가까워진다.
    tags: [random-variate-generation, dice-simulation]

  - id: l03-05
    type: multiple-choice
    passageRefs: [gl03-dice-01, gl03-dice-code-01]
    prompt: ( 가 )에 적당한 식은?
    choices:
      - { id: '1', text: '(U*6)' }
      - { id: '2', text: '(U*6)+1' }
      - { id: '3', text: 'int(U*6)' }
      - { id: '4', text: 'int(U*6)+1' }
    answers: ['4']
    explanation: |
      선택지 1: U*6은 [0, 6) 범위의 연속형 값(예: 2.37)이라 주사위 눈이나 배열 첨자로 쓸 수 없다.
      선택지 2: (U*6)+1은 [1, 7) 범위의 연속형 값으로, 정수로 바꾸는 과정이 없다.
      선택지 3: int(U*6)은 0~5의 정수를 만들어 눈 6이 나오지 않고 존재하지 않는 눈 0이 나온다.
      선택지 4: int(U*6)은 0~5의 정수이고 여기에 1을 더하면 1, 2, 3, 4, 5, 6이 각각 1/6 확률로 나오므로 정답이다.

      핵심 개념:
      U[0,1)은 연속형 값이므로 주사위 눈 같은 이산형 값으로 바꾸려면 정수 변환이 필요하다.
      int(U*6)+1 = int[0, 6)+1 = {0,…,5}+1 = {1,…,6}
      일반적으로 1~k의 이산형 일양 확률변수는 int(U*k)+1로 발생시킨다.
      int는 소수점 이하를 버리는 정수형 변환 함수이다.
    tags: [random-variate-generation, dice-simulation]

  # 4강 시뮬레이션 응용문제
  - id: l04-01
    type: multiple-choice
    passageRefs: [gl04-gas-station-01, gl04-gas-station-code-01]
    prompt: 도착한 총 고객의 수를 나타내는 것은?
    choices:
      - { id: '1', text: 'prarr' }
      - { id: '2', text: 'seed' }
      - { id: '3', text: 'tpump' }
      - { id: '4', text: 'totarr' }
    answers: ['4']
    explanation: |
      선택지 1: prarr는 단위시간(1분)당 고객의 도착확률 1/4로, 난수 U와 비교하는 기준값이다.
      선택지 2: seed는 random과 poissn 루틴에 넘기는 난수의 초기값(35213)이다.
      선택지 3: tpump는 현재 봉사 중인 고객의 남은 봉사시간으로, 매 단계 tstep씩 줄어든다.
      선택지 4: `U〈prarr*tstep`이 참이어서 고객이 도착할 때마다 `totarr=totarr+1`로 1씩 늘어나므로, 도착한 총 고객 수는 totarr이며 정답이다.

      핵심 개념:
      고정시간 진행 방식에서는 매 tstep마다 난수로 도착 여부를 정한다.
      U가 도착확률보다 작으면 고객이 도착한 것으로 보고 queue와 totarr를 1씩 늘린다.
      창구가 비고(tpump=0) 대기 고객이 있으면 한 명을 봉사하고 포아송 분포 봉사시간 p를 tpump에 넣는다.
      totque는 매 단계의 대기행렬 길이를 누적한 값이다.
    tags: [queueing-system, gas-station]

  - id: l04-02
    type: multiple-choice
    passageRefs: [gl04-gas-station-01, gl04-gas-station-code-01]
    prompt: 고객의 도착확률을 나타내는 것은?
    choices:
      - { id: '1', text: 'prarr' }
      - { id: '2', text: 'seed' }
      - { id: '3', text: 'tpump' }
      - { id: '4', text: 'totarr' }
    answers: ['1']
    explanation: |
      선택지 1: 시간당 평균 15명이 도착하므로 1분당 도착확률은 15/60 = 1/4이다. `if U〈prarr*tstep then`에서 tstep(=1)은 진행시간이고 prarr가 난수와 비교되는 도착확률이므로 정답이다.
      선택지 2: seed는 난수 발생의 초기값으로, 확률값이 아니다.
      선택지 3: tpump는 봉사 중인 고객의 남은 봉사시간이다.
      선택지 4: totarr는 지금까지 도착한 고객 수를 세는 누적 변수이다.

      핵심 개념:
      도착형태 "시간당 평균 15명"은 1분마다 1/4의 확률로 고객이 도착한다는 뜻으로 바꿔 쓴다.
      [0,1) 일양난수 U가 prarr*tstep보다 작을 확률이 곧 prarr*tstep이다.
      tstep은 한 번에 진행하는 시간 간격(1분)이다.
      이렇게 난수와 확률을 비교해 사건 발생 여부를 정하는 것이 확률적 시뮬레이션의 기본 기법이다.
    tags: [queueing-system, gas-station]

  - id: l04-03
    type: multiple-choice
    passageRefs: [gl04-gas-station-01, gl04-gas-station-code-02]
    prompt: 평균 대기행렬길이는?
    choices:
      - { id: '1', text: 'p' }
      - { id: '2', text: 'queue' }
      - { id: '3', text: 'totque' }
      - { id: '4', text: 'aveque' }
    answers: ['4']
    explanation: |
      선택지 1: p는 poissn 루틴이 돌려주는 포아송 분포 봉사시간이다.
      선택지 2: queue는 현재 시점의 대기행렬 길이로, 평균이 아니다.
      선택지 3: totque는 매 단계의 queue를 더한 누적값(전체 대기시간의 총합)으로, 아직 시간으로 나누지 않았다.
      선택지 4: aveque = totque/(tlimit/tstep)은 누적 대기행렬 길이를 진행 단계 수로 나눈 값이므로 평균 대기행렬 길이이며 정답이다.

      핵심 개념:
      매 단계 `totque = totque+queue`로 대기행렬 길이를 누적한다.
      tstep=1분이면 이 누적값은 모든 고객의 대기시간 총합(고객·분)과 같다.
      평균 대기행렬 길이 = 누적 대기행렬 길이 / 전체 단계 수(tlimit/tstep)
      평균 대기시간은 같은 누적값을 도착한 고객 수로 나누어 구한다.
    tags: [queueing-system, gas-station]

