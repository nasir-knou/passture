      - { id: '2', text: '시뮬레이션 증가시간이 일정하지 않다.' }
      - { id: '3', text: '고정시간 진행법과 반대되는 개념이다.' }
      - { id: '4', text: '최종 시뮬레이션 시간은 고정된다.' }
    answers: ['4']
    explanation: |
      선택지 1: 가변시간 진행법은 다음 사건이 발생하는 시각으로 시뮬레이션 시계를 바로 옮긴다.
      선택지 2: 사건 사이의 간격이 제각각이므로 시간 증가폭이 일정하지 않다.
      선택지 3: 일정한 간격 $\Delta t$씩 시간을 늘리는 고정시간 진행법과 대비되는 방식이다.
      선택지 4: 최종 시뮬레이션 시간은 종료 조건에 관한 것이며 시간 진행법의 특징이 아니다.

      핵심 개념:
      시간 진행법에는 고정시간 진행법과 가변시간(다음 사건) 진행법이 있다.
      고정시간 진행법은 일정 간격마다 시간을 늘리고 그 사이에 일어난 사건을 처리한다.
      가변시간 진행법은 사건 목록에서 가장 이른 사건을 찾아 그 시각으로 시계를 옮긴다.
      사건이 없는 구간을 건너뛰므로 이산사건 시뮬레이션에서 효율적이다.
    tags: [time-advance, next-event]

  - id: e17-23
    type: multiple-choice
    chapter: 5
    passageRefs: [g17-discrete-event-intro-01, g17-discrete-event-code-01]
    prompt: 종료조건으로 처리를 해야 할 총 고객수는?
    choices:
      - { id: '1', text: 'totarr' }
      - { id: '2', text: 'timing' }
      - { id: '3', text: 'next' }
      - { id: '4', text: 'nseed' }
    answers: ['1']
    explanation: |
      선택지 1: totarr = 1000으로 설정되고 while( numcus < totarr ) 조건으로 봉사를 시작한 고객 수가 1000명이 될 때까지 반복하므로 종료조건의 총 고객 수이다.
      선택지 2: timing은 사건 목록에서 다음에 일어날 사건을 찾아 시간을 진행시키는 부프로그램이다.
      선택지 3: next는 timing이 결정한 다음 사건의 종류(1이면 도착, 그 외는 출발)이다.
      선택지 4: nseed는 난수 발생에 쓰이는 시드 변수로 알고리즘의 종료조건과 무관하다.

      핵심 개념:
      이산사건 시뮬레이션의 주 프로그램은 초기화(init) → 시간 진행(timing) → 사건 처리(arrive/depart) 반복 → 보고(report)로 구성된다.
      종료조건은 시간 한도나 처리 고객 수로 정할 수 있으며 여기서는 고객 수 1000명이다.
      tne[1]은 다음 도착 사건 시각, tne[2]는 다음 출발 사건 시각이다.
      timing은 tne 중 가장 이른 사건을 골라 time과 next를 갱신한다.
    tags: [discrete-event-simulation, termination-condition]

  - id: e17-24
    type: multiple-choice
    chapter: 5
    passageRefs: [g17-discrete-event-intro-01, g17-discrete-event-code-01]
    prompt: 빈칸 ‘가’에 알맞은 것은?
    choices:
      - { id: '1', text: 'call expon(seed, marrvt, e_arr)' }
      - { id: '2', text: 'call expon(seed, mservt, e_arr)' }
      - { id: '3', text: 'call expon(seed, marrvt, tne[1])' }
      - { id: '4', text: 'call expon(seed, mservt, tne[1])' }
    answers: ['1']
    explanation: |
      선택지 1: 다음 줄 tne[1]=time+e_arr에서 도착간격 e_arr이 필요하므로, 평균 도착간격 marrvt의 지수분포로 e_arr을 먼저 발생시켜야 한다.
      선택지 2: mservt는 평균 봉사시간이므로 도착간격의 평균으로 쓰면 안 된다.
      선택지 3: tne[1]에 도착간격만 넣으면 현재 시각이 더해지지 않고, 다음 줄에서 쓰는 e_arr도 정해지지 않는다.
      선택지 4: 봉사시간 평균을 쓰고 결과도 tne[1]에 바로 넣어 두 가지가 모두 맞지 않는다.

      핵심 개념:
      도착 사건 처리에서는 먼저 다음 고객의 도착 사건을 예약한다.
      도착간격을 지수분포로 발생시키고 현재 시각에 더해 다음 도착 시각 tne[1]을 정한다.
      창구가 비어 있으면(status = 0) 도착 고객의 봉사를 바로 시작하고 출발 사건을 예약한다.
      창구가 사용 중이면 고객을 대기행렬에 넣는다.
    tags: [discrete-event-simulation, arrival-event]

  - id: e17-25
    type: multiple-choice
    chapter: 5
    passageRefs: [g17-discrete-event-intro-01, g17-discrete-event-code-01]
    prompt: 빈칸 ‘나’에 알맞은 것은?
    choices:
      - { id: '1', text: 'call expon(nseed, marrvt, tne[2])' }
      - { id: '2', text: 'call expon(nseed, mservt, tne[2])' }
      - { id: '3', text: 'call expon(nseed, marrvt, e_dep)' }
      - { id: '4', text: 'call expon(nseed, mservt, e_dep)' }
    answers: ['4']
    explanation: |
      선택지 1: 도착간격 평균을 쓰고 결과를 tne[2]에 바로 넣어 다음 줄의 e_dep이 정해지지 않는다.
      선택지 2: 평균은 맞지만 결과를 tne[2]에 바로 넣으므로 다음 줄 tne[2] = time + e_dep에 필요한 e_dep이 없다.
      선택지 3: marrvt는 평균 도착간격이므로 봉사시간 발생에 쓰면 안 된다.
      선택지 4: 봉사를 시작한 고객의 봉사시간 e_dep을 평균 mservt의 지수분포로 발생시킨 뒤 tne[2] = time + e_dep으로 출발 사건 시각을 정한다.

      핵심 개념:
      창구가 비어 있을 때 도착한 고객은 즉시 봉사를 시작하며 창구 상태를 status = 1(사용 중)로 바꾼다.
      봉사시간을 발생시켜 현재 시각에 더하면 그 고객의 출발 사건 시각이 된다.
      도착간격은 marrvt, 봉사시간은 mservt를 평균으로 하는 지수분포를 따른다.
      이렇게 예약된 사건 시각들을 timing이 비교해 다음 사건을 결정한다.
    tags: [discrete-event-simulation, departure-event]

