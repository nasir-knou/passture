      선택지 2: 연속형 모델은 상태변수가 시간에 따라 연속적으로 변하며, 상태함수의 도함수로 이루어진 미분방정식으로 표현된다.
      선택지 3: 연속적으로 변하는 개체 수가 화학약품 살포라는 사건으로 순간적으로 불연속 변화하므로 혼합형 시뮬레이션 모델링의 예이다.
      선택지 4: 연속적인 비행 방정식이 결합이라는 이산 사건을 계기로 바뀌므로 혼합형 시뮬레이션 모델링의 예이다.

