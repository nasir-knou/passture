  - id: g17-congruential-01
    type: text
    body: |
      ※ (64~66) 다음은 난수의 발생식이다. 물음에 답하라.

      $$
      X_i = 2X_{i-1} + 3 \ (\text{mod } 10)
      $$

  - id: g17-chi-square-01
    type: text
    body: |
      ※ (67~68) $\chi^2$ - 검정에 관한 사항이다. 물음에 답하라.
      6000개의 난수를 발생시켜서 100개의 구간으로 나누었다.

      $$
      \chi^2 = k/n \sum_{i=1}^{k} (O_i - n/k)^2
      $$

questions:
  - id: e17-01
    type: multiple-choice
    chapter: 2
    passageRefs: [g17-model-roles-01]
    prompt: 다음은 시뮬레이션 모델에 대한 설명이다. 보기에서 설명과 이름을 바르게 연결한 것은?
    choices:
      - { id: '1', text: '가-A  나-B  다-C  라-D' }
      - { id: '2', text: '가-A  나-C  다-B  라-D' }
      - { id: '3', text: '가-D  나-A  다-C  라-B' }
      - { id: '4', text: '가-D  나-B  다-C  라-A' }
    answers: ['4']
    explanation: |
      선택지 1: 시스템이나 문제를 정의하고 이해를 주는 것은 예측 도구가 아니라 설명적 장치이고, 미래 계획을 예측하는 것이 예측 도구이다.
      선택지 2: 한계적 구성요소를 결정하는 것은 분석 도구, 해결방안을 종합·평가하는 것은 설계평가 도구이므로 나와 다의 연결이 서로 바뀌었다.
      선택지 3: 한계적 구성요소를 결정하는 역할은 예측 도구가 아니라 분석 도구이고, 미래 개발계획 예측은 예측 도구의 역할이다.
      선택지 4: 가-설명적 장치, 나-분석 도구, 다-설계평가 도구, 라-예측 도구로 모델의 네 가지 역할을 바르게 연결했다.

      핵심 개념:
      시뮬레이션 모델은 쓰임새에 따라 네 가지 역할을 한다.
      설명적 장치는 시스템이나 문제를 정의하고 이해하도록 돕는다.
      분석 도구는 시스템 성능을 좌우하는 한계적(핵심) 구성요소를 찾아낸다.
      설계평가 도구는 제안된 해결방안을 종합하고 평가하며, 예측 도구는 미래의 개발계획을 예측하고 돕는다.
    tags: [model-roles, simulation-model]

  - id: e17-02
    type: multiple-choice
    chapter: 2
    prompt: 다음 시뮬레이션 모델에서 확률변수를 사용하지 ==않는== 것은?
    choices:
      - { id: '1', text: '이산형 모델' }
      - { id: '2', text: '확률적 모델' }
      - { id: '3', text: '결정적 모델' }
      - { id: '4', text: '동적 모델' }
    answers: ['3']
    explanation: |
      선택지 1: 이산형 모델은 상태변수가 특정 시점에만 변하는지에 따른 분류이며, 대기행렬처럼 확률변수를 사용하는 경우가 많다.
      선택지 2: 확률적 모델은 도착간격·봉사시간 같은 확률변수를 입력으로 사용하는 모델이다.
      선택지 3: 결정적 모델은 입력과 관계식이 확정되어 있어 확률변수 없이 같은 입력에 항상 같은 결과를 낸다.
      선택지 4: 동적 모델은 시간의 흐름에 따른 변화를 다루는 모델로, 확률변수 사용 여부와는 별개의 분류이다.

      핵심 개념:
      시뮬레이션 모델은 확률변수 포함 여부에 따라 결정적 모델과 확률적 모델로 나눈다.
      결정적 모델은 무작위 요소가 없어 한 번의 실행으로 결과가 정해진다.
      확률적 모델은 난수로 확률변수를 발생시키므로 결과도 추정치로 얻는다.
      정적/동적, 이산형/연속형은 시간과 상태 변화 방식에 따른 별도의 분류 기준이다.
    tags: [model-classification, deterministic-model]

  - id: e17-03
    type: multiple-choice
    chapter: 2
    prompt: 토끼와 여우의 관계처럼 천적과 먹이관계인 두 종족간의 상호작용으로 인한 종족수를 예측해 보는 모델은?
    choices:
      - { id: '1', text: 'prey-predator 모델' }
      - { id: '2', text: '$V_y(t+\delta t)=V_y(t)+a_y*\delta t$' }
      - { id: '3', text: '저축문제2' }
      - { id: '4', text: '몬테칼로 시뮬레이션' }
    answers: ['1']
    explanation: |
      선택지 1: prey-predator(먹이-포식자) 모델은 토끼(먹이)와 여우(포식자)의 개체 수가 서로의 증감에 영향을 주는 관계를 식으로 표현해 종족수 변화를 예측한다.
      선택지 2: 시간 간격 $\delta t$마다 속도를 가속도로 갱신하는 식으로, 공의 운동(탄성) 문제를 푸는 데 쓰인다.
      선택지 3: 저축문제는 이자율에 따라 원리금이 변하는 과정을 계산하는 결정적 시뮬레이션의 예이다.
      선택지 4: 몬테칼로 시뮬레이션은 난수를 이용해 확률적 문제의 해를 추정하는 기법이며 두 종족의 상호작용 모델 자체를 가리키지 않는다.

      핵심 개념:
      prey-predator 모델은 두 종족 간 천적 관계를 연립 차분(미분)방정식으로 표현한다.
      먹이의 수가 늘면 포식자가 늘고, 포식자가 늘면 먹이가 줄어드는 순환적 상호작용을 보인다.
      시간을 작은 간격으로 나누어 각 종족 수를 반복 계산하는 방식으로 시뮬레이션한다.
      연속적으로 변하는 상태변수를 다루므로 연속형 모델의 대표적인 예이다.
    tags: [prey-predator-model, simulation-model-example]

  - id: e17-04
    type: multiple-choice
    chapter: 1
    prompt: 다음 중 확률적 시뮬레이션에 해당하는 것은?
    choices:
      - { id: '1', text: '저축문제I' }
      - { id: '2', text: '대기행렬문제' }
      - { id: '3', text: '공의탄성문제' }
      - { id: '4', text: 'population모델' }
    answers: ['2']
    explanation: |
      선택지 1: 저축문제는 원금과 이자율이 정해지면 결과가 하나로 정해지는 결정적 시뮬레이션이다.
      선택지 2: 대기행렬문제는 고객의 도착간격과 봉사시간이 확률변수이므로 난수를 이용해 발생시키는 확률적 시뮬레이션이다.
      선택지 3: 공의 탄성문제는 물리 법칙에 따른 운동 방정식을 반복 계산하는 결정적 시뮬레이션이다.
      선택지 4: population모델은 증가율 등 정해진 관계식으로 개체 수 변화를 계산하는 결정적 시뮬레이션이다.

      핵심 개념:
      결정적 시뮬레이션은 모델에 무작위 요소가 없어 같은 입력에 항상 같은 결과를 낸다.
      확률적 시뮬레이션은 확률분포를 따르는 입력을 난수로 발생시켜 사용한다.
      대기행렬 시스템은 도착과 봉사가 불확실하므로 확률적 시뮬레이션의 대표 예이다.
      확률적 시뮬레이션의 결과는 실행마다 달라질 수 있어 여러 번 실행해 통계적으로 해석한다.
    tags: [stochastic-simulation, queueing-system]

  - id: e17-05
    type: multiple-choice
    chapter: 2
    prompt: 다음은 시뮬레이션의 특징들이다. ==잘못== 설명된 것은?
    choices:
      - { id: '1', text: '시뮬레이션 모델은 개발 상 많은 비용과 시간을 요한다.' }
      - { id: '2', text: '시뮬레이션에 의해 산출되는 많은 양의 수치들은 연구 결과에 대하여 과잉의 신뢰를 주는 경향이 있다.' }
      - { id: '3', text: '확률적 시뮬레이션 모델은 정확한 값을 요구하는 시스템 최적화 등에 적합하다.' }
      - { id: '4', text: '실시스템의 실질적인 구축 없이도 평가할 수 있다' }
    answers: ['3']
    explanation: |
      선택지 1: 모델 개발에 많은 비용과 시간이 드는 것은 시뮬레이션의 단점으로 옳은 설명이다.
      선택지 2: 대량의 수치 결과가 실제보다 결과를 더 믿게 만드는 경향이 있다는 것도 시뮬레이션의 단점으로 옳은 설명이다.
      선택지 3: 확률적 시뮬레이션은 실행마다 달라지는 추정치를 제공할 뿐 정확한 최적해를 주지 못하므로, 정확한 값을 요구하는 최적화에는 해석적 방법이 더 적합하다. 따라서 잘못된 설명이다.
      선택지 4: 실제 시스템을 만들지 않고도 설계안을 평가할 수 있는 것은 시뮬레이션의 대표적인 장점이다.

      핵심 개념:
      시뮬레이션의 장점은 실시스템 구축 없이 평가 가능, 시간 압축·확장, 다양한 대안 비교 등이다.
      단점은 모델 개발 비용과 시간이 크고, 결과가 추정치에 불과하며, 많은 수치가 과잉 신뢰를 준다는 점이다.
      확률적 시뮬레이션의 출력은 표본에 기반한 추정값이므로 정확한 최적값을 보장하지 않는다.
      정확한 해가 필요하고 해석적 풀이가 가능하면 해석적 방법을 우선한다.
    tags: [simulation-characteristics, advantages-disadvantages]

  - id: e17-06
    type: multiple-choice
    chapter: 2
    prompt: 일반적인 시뮬레이션 과정 순서가 올바른 것은?
    choices:
      - { id: '1', text: '문제의 정의 → 모델설계 → 자료수집 → 모델변환 → 검증 → 실험' }
      - { id: '2', text: '모델설계 → 모델변환 → 문제의 정의 → 자료수집 → 검증 → 실험' }
      - { id: '3', text: '자료수집 → 문제의 정의 → 모델설계 → 모델변환 → 검증 → 실험' }
      - { id: '4', text: '문제의 정의 → 모델설계 → 모델변환 → 자료수집 → 검증 → 실험' }
    answers: ['1']
    explanation: |
      선택지 1: 문제를 정의하고, 모델을 설계한 뒤 모델에 필요한 자료를 수집하고, 이를 컴퓨터 프로그램으로 변환한 다음 검증하고 실험하는 올바른 순서이다.
      선택지 2: 문제를 정의하기 전에 모델을 설계·변환할 수는 없으므로 순서가 맞지 않는다.
      선택지 3: 무엇을 풀지 정하지 않고 자료부터 수집하면 필요한 자료를 판단할 수 없으므로 첫 단계는 문제의 정의이다.
      선택지 4: 모델 변환(프로그래밍)은 입력 자료를 수집해 모델의 모수를 정한 뒤에 이루어지므로 자료수집과 모델변환의 순서가 바뀌었다.

      핵심 개념:
      시뮬레이션 과정은 문제의 정의에서 출발한다.
      모델설계 단계에서 시스템의 구성요소와 관계를 정하고, 자료수집으로 입력 분포와 모수를 얻는다.
      모델변환은 설계된 모델을 시뮬레이션 언어나 범용 언어의 프로그램으로 옮기는 단계이다.
      검증을 통해 모델이 의도대로 동작하고 실시스템을 잘 대표하는지 확인한 뒤 실험을 수행한다.
    tags: [simulation-process]

  - id: e17-07
    type: multiple-choice
    chapter: 3
    passageRefs: [g17-single-queue-intro-01, g17-single-queue-code-01]
    prompt: 난수의 초기값을 나타내는 변수는?
    choices:
      - { id: '1', text: 'tstep' }
      - { id: '2', text: 'prarr' }
      - { id: '3', text: 'seed' }
      - { id: '4', text: 'mean' }
    answers: ['3']
    explanation: |
      선택지 1: tstep은 한 번 반복할 때 증가하는 시간 단위(1분)이다.
      선택지 2: prarr은 단위시간당 고객의 도착 확률이다.
      선택지 3: seed=35213은 call random(seed, U)와 call poissn(seed, mean, p)에 전달되어 난수열을 시작하는 초기값(시드)이다.
      선택지 4: mean은 포아송분포를 따르는 봉사시간의 평균 4분이다.

      핵심 개념:
      컴퓨터의 난수는 초기값(seed)에서 시작해 정해진 식으로 계속 만들어지는 의사난수이다.
      같은 seed를 쓰면 같은 난수열이 재현되므로 실험 결과를 반복 확인할 수 있다.
      random 루틴은 [0,1) 일양난수 U를, poissn 루틴은 평균 mean의 포아송 확률변수를 돌려준다.
      이 알고리즘은 고정시간 간격 tstep마다 도착과 봉사를 검사하는 방식이다.
    tags: [queueing-simulation, random-seed]

  - id: e17-08
    type: multiple-choice
    chapter: 3
    passageRefs: [g17-single-queue-intro-01, g17-single-queue-code-01]
    prompt: 고객의 도착 비율을 나타내는 변수는?
    choices:
      - { id: '1', text: 'tstep' }
      - { id: '2', text: 'prarr' }
      - { id: '3', text: 'seed' }
      - { id: '4', text: 'mean' }
    answers: ['2']
    explanation: |
      선택지 1: tstep은 시간 증가 단위로, 도착 비율과 곱해져 한 단계의 도착 확률을 만든다.
      선택지 2: 시간당 15명은 분당 $15/60 = 0.25$명이므로 prarr=0.25가 고객의 도착 비율이며, U<prarr*tstep이면 고객이 도착한 것으로 처리한다.
      선택지 3: seed는 난수의 초기값이다.
      선택지 4: mean은 평균 봉사시간이다.

      핵심 개념:
      고정시간 간격 시뮬레이션에서는 한 시간 단계 동안 고객이 도착할 확률을 도착률 × 시간 간격으로 둔다.
      일양난수 U가 이 확률보다 작으면 도착, 크면 도착 없음으로 판정한다.
      시간당 15명 도착은 1분 간격 기준 도착 확률 0.25에 해당한다.
      도착이 일어나면 queue와 totarr를 1씩 증가시킨다.
    tags: [queueing-simulation, arrival-rate]

  - id: e17-09
    type: multiple-choice
    chapter: 3
    passageRefs: [g17-single-queue-intro-01, g17-single-queue-code-01]
    prompt: 지금까지 도착한 총 고객의 수를 표현하는 것은?
    choices:
      - { id: '1', text: 'queue' }
      - { id: '2', text: 'totque' }
      - { id: '3', text: 'totarr' }
      - { id: '4', text: 'tpump' }
    answers: ['3']
    explanation: |
      선택지 1: queue는 현재 대기행렬에서 기다리는 고객 수로, 봉사가 시작되면 1씩 줄어든다.
      선택지 2: totque는 매 시간 단계의 대기행렬 길이를 누적한 합이다.
      선택지 3: 도착이 발생할 때마다 totarr=totarr+1로 증가하고 줄어들지 않으므로 지금까지 도착한 총 고객 수이다.
      선택지 4: tpump는 현재 봉사 중인 고객의 남은 봉사시간이다.

      핵심 개념:
      대기행렬 시뮬레이션은 상태변수(queue, tpump)와 통계 누적변수(totque, totarr)를 구분해 관리한다.
      상태변수는 현재 시스템 상태를, 누적변수는 성능 척도 계산용 합계를 나타낸다.
      totarr는 평균 대기시간을 구할 때 고객 1인당으로 나누는 분모로 쓰인다.
      totque는 평균 대기행렬 길이와 평균 대기시간 계산의 분자로 쓰인다.
    tags: [queueing-simulation, state-variable]

  - id: e17-10
    type: multiple-choice
    chapter: 3
    passageRefs: [g17-single-queue-intro-01, g17-single-queue-code-01]
    prompt: 고객의 봉사시간을 표현하는 것은?
    choices:
      - { id: '1', text: 'queue' }
      - { id: '2', text: 'totque' }
      - { id: '3', text: 'totarr' }
      - { id: '4', text: 'tpump' }
    answers: ['4']
    explanation: |
      선택지 1: queue는 대기 중인 고객 수이다.
      선택지 2: totque는 대기행렬 길이의 누적합이다.
      선택지 3: totarr는 총 도착 고객 수이다.
      선택지 4: 봉사가 시작될 때 poissn으로 발생시킨 봉사시간 p를 tpump = p로 저장하고, 매 단계 tstep만큼 줄여 0이 되면 봉사가 끝난 것으로 본다.

      핵심 개념:
      tpump는 창구(펌프)에서 현재 고객에게 남은 봉사시간을 나타낸다.
      tpump>0이면 창구가 사용 중이고, tpump=0이면 창구가 비어 있다.
      창구가 비어 있고 대기 고객이 있으면 한 명을 꺼내 새 봉사시간을 발생시킨다.
      봉사시간은 평균 4분의 포아송분포를 따르도록 poissn 루틴으로 만든다.
    tags: [queueing-simulation, service-time]

  - id: e17-11
    type: multiple-choice
    chapter: 3
    passageRefs: [g17-single-queue-intro-01, g17-single-queue-code-01]
    prompt: 평균대기행렬의 길이를 구하는 공식으로 빈칸 ‘가’에 적당한 것은?
    choices:
      - { id: '1', text: 'totque / totarr' }
      - { id: '2', text: 'totque / arrive' }
      - { id: '3', text: 'totque / queue' }
      - { id: '4', text: 'totque / (tlimit / tstep)' }
    answers: ['4']
    explanation: |
      선택지 1: totque를 총 도착 고객 수로 나누면 고객 1인당 평균 대기시간이 되므로 빈칸 ‘나’에 해당한다.
      선택지 2: arrive는 현재 단계의 도착 여부(0 또는 1)이므로 평균을 구하는 분모가 될 수 없다.
      선택지 3: queue는 종료 시점의 대기 고객 수일 뿐 관측 횟수가 아니다.
      선택지 4: totque는 매 시간 단계의 대기행렬 길이를 더한 값이므로, 전체 시간 단계 수 tlimit/tstep으로 나누면 평균 대기행렬 길이가 된다.

      핵심 개념:
      평균 대기행렬 길이는 시간에 대한 대기 고객 수의 평균이다.
      고정시간 간격 방식에서는 각 단계의 queue를 합산한 뒤 단계 수로 나누어 구한다.
      tlimit=100, tstep=1이면 단계 수는 100이다.
      같은 누적값 totque를 고객 수로 나누면 평균 대기시간이 된다.
    tags: [queueing-simulation, average-queue-length]

  - id: e17-12
    type: multiple-choice
    chapter: 3
    passageRefs: [g17-single-queue-intro-01, g17-single-queue-code-01]
    prompt: 평균 대기시간을 구하는 공식으로 빈칸 ‘나’에 적당한 것은?
    choices:
      - { id: '1', text: 'totque / totarr' }
      - { id: '2', text: 'totque / arrive' }
      - { id: '3', text: 'totque / queue' }
      - { id: '4', text: 'totque / (tlimit / tstep)' }
    answers: ['1']
    explanation: |
      선택지 1: 한 단계(1분) 동안 대기행렬에 있는 고객은 각각 1분씩 기다린 것이므로 totque는 모든 고객의 총 대기시간이 되고, 이를 총 도착 고객 수 totarr로 나누면 고객 1인당 평균 대기시간이다.
      선택지 2: arrive는 마지막 단계의 도착 여부(0 또는 1)이므로 분모로 적절하지 않다.
      선택지 3: queue는 종료 시점의 대기 고객 수이다.
      선택지 4: 시간 단계 수로 나누면 평균 대기행렬 길이가 되므로 빈칸 ‘가’의 식이다.

      핵심 개념:
      totque는 시간 단계마다 queue를 더한 값으로, tstep=1이면 "고객×분" 단위의 총 대기시간과 같다.
      총 대기시간을 시간으로 나누면 평균 대기행렬 길이, 고객 수로 나누면 평균 대기시간이 된다.
      두 척도는 같은 누적값에서 분모만 다르게 하여 구한다.
      대기시간은 창구가 비기를 기다린 시간으로, 봉사시간은 포함하지 않는다.
    tags: [queueing-simulation, average-waiting-time]

  - id: e17-13
    type: multiple-choice
    chapter: 3
    passageRefs: [g17-single-queue-intro-01, g17-single-queue-code-01]
    prompt: 봉사창구를 2개로 늘리려고 한다. 다음 중 직접 관련되어 알고리즘에서 수정되는 변수는?
    choices:
      - { id: '1', text: 'queue' }
      - { id: '2', text: 'totque' }
      - { id: '3', text: 'tpump' }
      - { id: '4', text: 'totarr' }
    answers: ['3']
    explanation: |
      선택지 1: 창구가 늘어도 고객은 하나의 대기행렬에 서므로 queue는 그대로 쓸 수 있다.
      선택지 2: totque는 대기행렬 길이의 누적합으로 창구 수와 직접 관련이 없다.
      선택지 3: tpump는 창구 하나의 남은 봉사시간이므로, 창구가 2개가 되면 각 창구의 봉사 상태를 따로 관리하도록 tpump(1), tpump(2)처럼 창구별 변수로 바꾸고 비어 있는 창구를 찾아 배정하도록 수정해야 한다.
      선택지 4: totarr는 총 도착 고객 수로 창구 수와 무관하다.

      핵심 개념:
      복수창구의 대기행렬 시스템 문제에서는 창구마다 봉사 상태와 남은 봉사시간을 따로 유지한다.
      매 시간 단계에서 모든 창구의 남은 봉사시간을 줄이고, 비어 있는 창구에 대기 고객을 배정한다.
      도착 과정과 대기행렬, 통계 누적 방법은 단일창구와 같다.
      창구 수를 늘리면 대기행렬 길이와 대기시간이 줄어드는 효과를 시뮬레이션으로 비교할 수 있다.
    tags: [multi-server-queue, queueing-simulation]

  - id: e17-14
    type: multiple-choice
    chapter: 3
    passageRefs: [g17-fuel-queue-intro-01, g17-fuel-queue-code-01]
    prompt: 빈칸 ‘가’에 알맞은 것은?
    choices:
      - { id: '1', text: 'call random(nseed,nmean,U)' }
      - { id: '2', text: 'call random(nseed,nmean,stdev,liters)' }
      - { id: '3', text: 'call normal(nseed,nmean,stdev,liters)' }
      - { id: '4', text: 'call normal(nseed,prarr,stdev,liters)' }
    answers: ['3']
    explanation: |
      선택지 1: random은 [0,1) 일양난수 U를 만드는 루틴이며 급유량 liters를 만들지 않는다.
      선택지 2: random 루틴으로는 평균과 표준편차를 갖는 정규분포 값을 만들 수 없다.
      선택지 3: 연료량은 평균 18ℓ, 표준편차 2인 정규분포이므로 normal 루틴에 평균 nmean과 표준편차 stdev를 주어 급유량 liters를 발생시키고, 다음 줄에서 이를 급유시간으로 환산한다.
      선택지 4: prarr은 도착 확률이므로 정규분포의 평균 인자로 쓰면 안 된다.

      핵심 개념:
      봉사시간의 변화 문제에서는 봉사시간이 다른 확률변수(급유량)에 따라 결정된다.
      급유량을 정규분포로 발생시킨 뒤 tpump = 1.0 + 1.0/8.0 * liters로 봉사시간을 계산한다.
      1.0은 기본 처리 시간, 1/8은 1ℓ당 급유시간이다.
      확률변수마다 알맞은 분포의 발생 루틴(일양·정규·포아송 등)을 호출해야 한다.
    tags: [service-time-variation, normal-distribution]

  - id: e17-15
    type: multiple-choice
    chapter: 3
    passageRefs: [g17-fuel-queue-intro-01, g17-fuel-queue-code-01]
    prompt: 봉사시간을 나타내는 것은?
    choices:
      - { id: '1', text: 'liters' }
      - { id: '2', text: 'queue' }
      - { id: '3', text: 'tpump' }
      - { id: '4', text: 'aveque' }
    answers: ['3']
    explanation: |
      선택지 1: liters는 고객의 급유량으로, 봉사시간을 계산하는 데 쓰이는 입력값이다.
      선택지 2: queue는 대기 중인 고객 수이다.
      선택지 3: tpump = 1.0 + 1.0 / 8.0 * liters로 계산된 봉사시간이 저장되고 매 단계 tstep만큼 줄어든다.
      선택지 4: aveque는 평균 대기행렬 길이이다.

      핵심 개념:
      주유소 대기행렬 모델에서 봉사시간은 급유량에 비례하는 시간과 고정 시간의 합으로 표현된다.
      급유량이 정규분포를 따르므로 봉사시간도 확률적으로 변한다.
      tpump는 남은 봉사시간을 나타내며 0이 되면 다음 고객의 봉사를 시작한다.
      봉사시간 분포가 달라지면 대기행렬 길이와 대기시간도 달라진다.
    tags: [service-time-variation, queueing-simulation]

  - id: e17-16
    type: multiple-choice
    chapter: 5
    passageRefs: [g17-event-table-intro-01, g17-event-table-01]
    prompt: 빈칸의 도착간격을 구하면?
    choices:
      - { id: '1', text: '1, 2, 2' }
      - { id: '2', text: '2, 3, 2' }
      - { id: '3', text: '3, 3, 3' }
      - { id: '4', text: '9, 11, 15' }
    answers: ['2']
    explanation: |
      선택지 1: 도착시간의 차는 $3-1=2$, $6-3=3$, $8-6=2$이므로 1, 2, 2와 맞지 않는다.
      선택지 2: 도착간격은 앞 고객과의 도착시간 차이이므로 고객 2는 $3-1=2$, 고객 3은 $6-3=3$, 고객 4는 $8-6=2$이다.
      선택지 3: 고객 2~4의 대기시간이다.
      선택지 4: 고객 2~4의 출발시간이다.

      핵심 개념:
      도착간격은 연속한 두 고객의 도착시간 차이이다.
      도착시간 = 앞 고객의 도착시간 + 도착간격 관계로 도착 사건을 만든다.
      시뮬레이션에서는 도착간격을 확률분포에서 발생시켜 다음 도착 사건 시간을 정한다.
      첫 고객의 도착간격은 기준 시점이 없으므로 0으로 둔다.
    tags: [discrete-event-simulation, interarrival-time]

  - id: e17-17
    type: multiple-choice
    chapter: 5
    passageRefs: [g17-event-table-intro-01, g17-event-table-01]
    prompt: 빈칸의 출발시간을 구하면?
    choices:
      - { id: '1', text: '1, 2, 2' }
      - { id: '2', text: '2, 3, 2' }
      - { id: '3', text: '3, 3, 3' }
      - { id: '4', text: '9, 11, 15' }
    answers: ['4']
    explanation: |
      선택지 1: 출발시간은 도착시간보다 커야 하므로 맞지 않는다.
      선택지 2: 도착간격이다.
      선택지 3: 대기시간이다.
      선택지 4: 봉사 시작 시간은 도착시간과 앞 고객 출발시간 중 늦은 쪽이다. 고객 2는 $\max(3,6)+3=9$, 고객 3은 $\max(6,9)+2=11$, 고객 4는 $\max(8,11)+4=15$이다.

      핵심 개념:
      단일 창구에서는 앞 고객이 떠나야 다음 고객의 봉사가 시작된다.
      봉사 시작 시간 = max(도착시간, 앞 고객의 출발시간)이다.
      출발시간 = 봉사 시작 시간 + 봉사시간이다.
      출발 사건 시간을 알면 대기시간과 창구 이용률을 계산할 수 있다.
    tags: [discrete-event-simulation, departure-time]

  - id: e17-18
    type: multiple-choice
    chapter: 5
    passageRefs: [g17-event-table-intro-01, g17-event-table-01]
    prompt: 빈칸의 대기시간을 구하면?
    choices:
      - { id: '1', text: '1, 2, 2' }
      - { id: '2', text: '2, 3, 2' }
      - { id: '3', text: '3, 3, 3' }
      - { id: '4', text: '8, 10, 14' }
    answers: ['3']
    explanation: |
      선택지 1: 대기시간 계산과 맞지 않는 값이다.
      선택지 2: 도착간격이다.
      선택지 3: 대기시간 = 봉사 시작 시간 − 도착시간이다. 고객 2는 $6-3=3$, 고객 3은 $9-6=3$, 고객 4는 $11-8=3$이다.
      선택지 4: 8, 10, 14는 계산한 대기시간 3, 3, 3과 맞지 않는다.

      핵심 개념:
      대기시간은 고객이 도착한 뒤 봉사를 시작하기까지 기다린 시간이다.
      앞 고객의 출발시간이 자기 도착시간보다 늦으면 그 차이만큼 기다린다.
      앞 고객이 이미 떠났다면 대기시간은 0이다.
      평균 대기시간은 모든 고객의 대기시간 합을 고객 수로 나누어 구한다.
    tags: [discrete-event-simulation, waiting-time]

