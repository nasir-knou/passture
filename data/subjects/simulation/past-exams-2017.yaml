    type: text
    body: |
      <보 기>
      가. 시스템이나 문제를 정의하고 이해를 주는
      나. 한계적 구성요소를 결정하는
      다. 제안된 해결방안을 종합하고 평가하는
      라. 미래의 개발계획을 예측하고 도와주는

      A 예측 도구
      B 분석 도구
      C 설계평가 도구
      D 설명적 장치

  - id: g17-single-queue-intro-01
    type: text
    body: |
      ※ (42~48) 다음은 평균대기행렬과 평균대기시간을 구하는 단일 창구 대기행렬 시뮬레이션이다.
      조건은 다음과 같다.

      <조 건>
      · 고객의 도착 상황 : 시간당 15명
      · 고객의 서비스 상황 : 평균 4분의 포아송분포

  - id: g17-single-queue-code-01
    type: code
    language: text
    body: |
      {
          tstep=1, prarr=0.25, seed=35213, mean=4
          queue  = 0
          totque = 0
          totarr=0
          tpump = 0
          time   = 0
          tlimit =100
          while time < tlimit do
            {
             time = time+tstep
             arrive = 0
             call random(seed, U)
             if U<prarr*tstep then
               { arrive = 1
                 queue = queue+arrive
                 totarr=totarr+1  }
             if tpump>0 then
               { tpump = tpump-tstep
                 if tpump<0 then
                    tpump = 0       }
             if tpump=0 and queue≠0 then
                { queue = queue-1
                  call poissn(seed, mean, p)
                  tpump = p     }
             totque = totque+queue
                                    } (* end of while *)
          aveque = ( ‘가’ )
          avgwt  = ( ‘나’ )
          print aveque, avgwt, totarr
      }

