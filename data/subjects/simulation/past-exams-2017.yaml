    type: text
    body: |
      ※ (49~50) 다음은 단일 창구 대기행렬 시뮬레이션의 알고리즘 일부이고 조건은 다음과 같다.

      <조 건>
      종료시간 : 150
      고객의 도착상태 : 시간당 평균 20대의 일양분포
      연료탱크 : 평균 = 18ℓ, 표준편차 = 2인 정규분포
      급유시간계산 : 1ℓ당 1/8분

  - id: g17-fuel-queue-code-01
    type: code
    language: text
    body: |
      <알고리즘>
      nseed=seed
      while (time < tlimit) do
          {
            time = time + tstep
            arrive = 0
