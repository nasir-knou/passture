                 { arrive = 1;
                   queue = queue + arrive;
                   totarr = totarr + 1;
                 }
           if (tpump > 0.0)  then
                 { tpump = tpump - tstep
                        if (tpump < 0.0) then
                               tpump = 0.0
                 }
           if ((tpump = 0) & (queue ≠ 0))  then
                 { queue = queue - 1
                   (        ‘가’        );
                   tpump = 1.0 + 1.0 / 8.0 * liters;
                 }
            totque = totque + queue;
            print, time,arrive,queue,tpump
          }
      aveque = totque / (tlimit/tstep)

