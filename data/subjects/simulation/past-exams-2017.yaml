      - { id: '3', text: '대기행렬 시스템은 이산형 시뮬레이션에 해당된다. 이 예에서 종속변수는 대기행렬 내의 고객수가 된다. 사건 발생시간은 시스템에 고객이 도착하는 시간과 떠나는 시간이 된다.' }
