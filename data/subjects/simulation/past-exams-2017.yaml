      선택지 2: 이산형 시뮬레이션은 종속변수가 사건발생 시간에 이산적으로 변하는 경우이며, 시간변수 자체는 연속적이거나 이산적일 수 있다.
      선택지 3: 대기행렬 시스템은 고객 수가 도착·출발 시각에만 바뀌므로 이산형 시뮬레이션의 대표 예이다.
      선택지 4: 이산형 모델의 종속변수는 사건과 사건 사이에는 일정하게 유지된다.

      핵심 개념:
      이산형 시뮬레이션 모델링은 상태변수가 사건발생 시각에만 불연속적으로 변하는 시스템을 다룬다.
      연속형 시뮬레이션 모델링은 상태변수가 시간에 따라 연속적으로 변하는 시스템을 다룬다.
      이산형 모델에서는 사건 사이의 시간을 건너뛰고 사건 시각에서만 상태를 갱신할 수 있다.
      대기행렬, 재고 시스템 등이 이산형의 전형적인 예이다.
    tags: [discrete-simulation-modeling, model-classification]

  - id: e17-21
    type: multiple-choice
