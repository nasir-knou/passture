  - id: e17-28
    type: multiple-choice
    chapter: 7
    prompt: 컴퓨터를 이용하여 난수를 발생하는 경우 갖추어야 할 점이 ==아닌== 것은?
    choices:
      - { id: '1', text: '반복발생이 불가능해야 한다.' }
      - { id: '2', text: '상관관계가 없어야 한다.' }
      - { id: '3', text: '난수의 발생속도가 빨라야 한다.' }
      - { id: '4', text: '[0,1) 범위에서 일양분포를 만족해야 한다.' }
    answers: ['1']
    explanation: |
      선택지 1: 좋은 난수 발생기는 같은 초기값으로 같은 난수열을 다시 만들 수 있어야(재현성) 디버깅과 대안 비교가 가능하므로, 반복발생이 불가능해야 한다는 것은 갖추어야 할 점이 아니다.
      선택지 2: 난수들은 서로 독립이어야 하므로 상관관계가 없어야 한다.
      선택지 3: 시뮬레이션에서는 난수를 대량으로 쓰므로 발생속도가 빨라야 한다.
      선택지 4: 기본 난수는 [0,1) 구간의 일양분포를 따라야 다른 확률변수로 변환할 수 있다.

      핵심 개념:
      컴퓨터 난수 발생기가 갖추어야 할 조건은 일양성, 독립성, 재현성, 긴 주기, 빠른 속도, 적은 기억장소이다.
      컴퓨터 난수는 식으로 만드는 의사난수이므로 초기값이 같으면 같은 수열이 반복된다.
      이 재현성 덕분에 같은 조건에서 여러 시스템 대안을 공정하게 비교할 수 있다.
      일양성과 독립성은 난수의 검정으로 확인한다.
    tags: [random-number-generation, random-number-properties]

  - id: e17-29
    type: multiple-choice
    chapter: 7
    passageRefs: [g17-congruential-01]
    prompt: $X_0$ = 5 일 때  $X_1$을 구하면?
    choices:
      - { id: '1', text: '3' }
      - { id: '2', text: '5' }
      - { id: '3', text: '6' }
      - { id: '4', text: '9' }
    answers: ['1']
    explanation: |
      선택지 1: $X_1 = 2 \times 5 + 3 = 13$이고 $13 \bmod 10 = 3$이다.
      선택지 2: 초기값 $X_0$ 그대로이다.
      선택지 3: 계산식과 맞지 않는 값이다.
      선택지 4: $X_2$의 값이다.

      핵심 개념:
      합동법은 $X_i = (aX_{i-1} + c) \bmod m$ 형태로 난수열을 만든다.
      여기서 승수 $a=2$, 증분 $c=3$, 모듈러스 $m=10$인 혼합 합동법이다.
      이전 값에 $a$를 곱하고 $c$를 더한 뒤 $m$으로 나눈 나머지가 다음 값이다.
      $[0,1)$ 난수는 $X_i/m$으로 얻는다.
    tags: [congruential-method, random-number-generation]

  - id: e17-30
    type: multiple-choice
    chapter: 7
    passageRefs: [g17-congruential-01]
    prompt: 계속해서 $X_2$ 를 구하면?
    choices:
      - { id: '1', text: '3' }
      - { id: '2', text: '5' }
      - { id: '3', text: '6' }
      - { id: '4', text: '9' }
    answers: ['4']
    explanation: |
      선택지 1: $X_1$의 값이다.
      선택지 2: $X_0$의 값이다.
      선택지 3: 계산식과 맞지 않는 값이다.
      선택지 4: $X_2 = 2 \times 3 + 3 = 9$이고 $9 \bmod 10 = 9$이다.

      핵심 개념:
      합동법은 직전 값만으로 다음 값을 계산하는 점화식이다.
      $X_0=5$에서 $X_1=3$, $X_2=9$, $X_3=1$, $X_4=5$로 이어진다.
      같은 값이 다시 나오면 그 뒤로 같은 수열이 반복된다.
      모듈러스가 작으면 주기가 짧아 좋은 난수가 되지 못한다.
    tags: [congruential-method, random-number-generation]

  - id: e17-31
    type: multiple-choice
    chapter: 7
    passageRefs: [g17-congruential-01]
    prompt: 주기는?
    choices:
      - { id: '1', text: '3' }
      - { id: '2', text: '4' }
      - { id: '3', text: '5' }
      - { id: '4', text: '6' }
    answers: ['2']
    explanation: |
      선택지 1: 3번째 값 $X_3=1$은 아직 초기값과 다르므로 주기가 3이 아니다.
      선택지 2: $X_3 = 2 \times 9 + 3 = 21 \bmod 10 = 1$, $X_4 = 2 \times 1 + 3 = 5 = X_0$이므로 5, 3, 9, 1이 반복되어 주기는 4이다.
      선택지 3: 4번째에 이미 초기값 5로 돌아오므로 주기가 5가 아니다.
      선택지 4: 주기는 반복 전까지 나오는 서로 다른 값의 개수 4이다.

      핵심 개념:
      주기는 난수열이 같은 값으로 돌아와 반복되기 전까지 생성되는 수의 개수이다.
      합동법의 주기는 최대 $m$이며, 매개변수 선택에 따라 더 짧아질 수 있다.
      $m=10$에서도 주기가 4에 불과하므로 이 발생식은 실용적인 난수 발생기로 부적합하다.
      좋은 합동법은 $m$을 크게 하고 최대 주기를 얻도록 $a$, $c$를 선택한다.
    tags: [congruential-method, period]

  - id: e17-32
    type: multiple-choice
    chapter: 7
    passageRefs: [g17-chi-square-01]
    prompt: 자유도는?
    choices:
      - { id: '1', text: '99' }
      - { id: '2', text: '100' }
      - { id: '3', text: '101' }
      - { id: '4', text: '102' }
    answers: ['1']
    explanation: |
      선택지 1: 구간 수 $k=100$이므로 자유도는 $k-1 = 99$이다.
      선택지 2: 구간 수 자체이며, 관측도수의 합이 $n$으로 고정되는 제약 1개를 빼야 한다.
      선택지 3: 구간 수에 1을 더한 값으로 자유도가 아니다.
      선택지 4: 자유도 계산과 무관한 값이다.

      핵심 개념:
      $\chi^2$ 검정은 난수의 일양성을 검정하는 방법이다.
      $[0,1)$을 $k$개 구간으로 나누고 각 구간의 관측도수 $O_i$와 기대도수 $n/k$를 비교한다.
      검정통계량은 자유도 $k-1$인 $\chi^2$ 분포를 따른다.
      계산된 $\chi^2$ 값이 유의수준에서의 임계값보다 작으면 일양분포라는 가설을 기각하지 않는다.
    tags: [chi-square-test, random-number-test]

  - id: e17-33
    type: multiple-choice
    chapter: 7
    passageRefs: [g17-chi-square-01]
    prompt: 구간별 기대값인 $n/k$ 의 값은?
    choices:
      - { id: '1', text: '30' }
      - { id: '2', text: '40' }
      - { id: '3', text: '50' }
      - { id: '4', text: '60' }
    answers: ['4']
    explanation: |
      선택지 1: 30은 $n/k = 6000/100 = 60$과 다르다.
      선택지 2: 40은 $n/k = 6000/100 = 60$과 다르다.
      선택지 3: 50은 $n/k = 6000/100 = 60$과 다르다.
      선택지 4: 난수 $n=6000$개를 $k=100$개 구간으로 나누었으므로 구간별 기대값은 $6000/100 = 60$이다.

      핵심 개념:
      일양분포를 따른다면 각 구간에 같은 개수의 난수가 들어가야 한다.
      따라서 구간별 기대도수는 전체 개수를 구간 수로 나눈 $n/k$이다.
      $\chi^2 = \frac{k}{n}\sum (O_i - n/k)^2$는 관측도수와 기대도수 차이의 제곱합을 기대도수로 나눈 값이다.
      $\chi^2$ 검정의 신뢰성을 위해 구간별 기대도수는 충분히 커야(보통 5 이상) 한다.
    tags: [chi-square-test, expected-frequency]

  - id: e17-34
    type: multiple-choice
    chapter: 8
    prompt: |
      다음은 지수 확률변수를 발생시키는 과정이다. 역함수를 이용하는 이 방법의 이름은?

      $$
      \begin{aligned}
      F(x) &= 1 - e^{-x/m} = U \\
      \log_e(1-U) &= -\frac{x}{m} \\
      x &= -m \bullet \log_e(U)
      \end{aligned}
      $$
    choices:
      - { id: '1', text: '역변환법' }
      - { id: '2', text: '합성법' }
      - { id: '3', text: '결합법' }
      - { id: '4', text: '채택기각법' }
    answers: ['1']
    explanation: |
      선택지 1: 누적분포함수 $F(x)$를 일양난수 $U$와 같다고 놓고 역함수 $x = F^{-1}(U)$를 구해 확률변수를 발생시키는 역변환법이다. $1-U$도 $[0,1)$ 일양분포이므로 $U$로 바꾸어 $x=-m\log_e U$를 쓴다.
      선택지 2: 합성법은 분포함수를 여러 분포의 가중합으로 나누고 그중 하나를 골라 발생시키는 방법이다.
      선택지 3: 결합법은 얼랑분포처럼 확률변수를 여러 독립 확률변수의 합으로 표현해 발생시키는 방법이다.
      선택지 4: 채택기각법은 후보값을 발생시킨 뒤 조건에 맞으면 채택하고 아니면 버리는 방법으로 역함수를 쓰지 않는다.

      핵심 개념:
      확률변수의 발생방법에는 역변환법, 합성법, 결합법, 채택기각법 등이 있다.
      역변환법은 $U \sim U(0,1)$일 때 $F^{-1}(U)$가 분포 $F$를 따른다는 성질을 이용한다.
      지수분포는 역함수가 닫힌 형태로 구해져 역변환법을 적용하기 쉽다.
      역함수를 구하기 어려운 분포에는 채택기각법 등 다른 방법을 쓴다.
    tags: [inverse-transform, exponential-distribution]

  - id: e17-35
    type: multiple-choice
    chapter: 2
    prompt: 다음은 시뮬레이션의 응용사례들이다. 시뮬레이션 목적이 나머지 셋과 가장 ==다른== 것은?
    choices:
      - { id: '1', text: '일기예보' }
      - { id: '2', text: '자동차 드라이빙 시뮬레이터' }
      - { id: '3', text: '원자력 발전소 시뮬레이터' }
      - { id: '4', text: '파일러트(조종사) 시뮬레이션' }
    answers: ['1']
    explanation: |
      선택지 1: 일기예보는 기상 모델을 실행해 미래의 날씨를 예측하는 것이 목적이므로 나머지와 목적이 다르다.
      선택지 2: 자동차 드라이빙 시뮬레이터는 운전자를 교육·훈련하는 것이 목적이다.
      선택지 3: 원자력 발전소 시뮬레이터는 운전원을 실제 위험 없이 훈련시키는 것이 목적이다.
      선택지 4: 조종사 시뮬레이션은 비행 조종 훈련이 목적이다.

      핵심 개념:
      시뮬레이션은 분석·예측, 설계 평가, 교육·훈련 등 여러 목적으로 활용된다.
      훈련용 시뮬레이터는 실제 장비를 쓰기에 비용이 크거나 위험한 상황을 안전하게 재현한다.
      예측용 시뮬레이션은 모델을 이용해 미래 상태를 추정해 의사결정을 돕는다.
      같은 시뮬레이션이라도 목적에 따라 모델의 정밀도와 실시간성 요구가 달라진다.
    tags: [simulation-applications, simulation-purpose]
