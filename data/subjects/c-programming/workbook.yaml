  - id: b09-10
    type: multiple-choice
    chapter: 8
    prompt: 다음 중 파일 입출력함수가 ==아닌== 것은?
    choices:
      - id: '1'
        text: 'fprintf( ), fscanf( )'
      - id: '2'
        text: 'fread( ), fwrite( );'
      - id: '3'
        text: 'fgetc( ), fputc( )'
      - id: '4'
        text: 'gets( ), puts( )'
    answers: ['4']
    explanation: |
      선택지 1: fprintf( )와 fscanf( )는 파일 포인터를 인수로 받아 서식에 맞춰 파일에 출력하고 파일에서 입력하는 파일 입출력함수다.
      선택지 2: fread( )와 fwrite( )는 지정한 크기의 자료 블록을 파일에서 읽고 파일에 쓰는 파일 입출력함수다.
      선택지 3: fgetc( )와 fputc( )는 파일에서 문자 하나를 읽고 파일에 문자 하나를 쓰는 파일 입출력함수다.
      선택지 4: 정답. gets( )는 키보드로부터 문자열을 입력받고 puts( )는 화면에 문자열을 출력하는 표준 입출력함수로, 파일 포인터를 사용하지 않는다.

      핵심 개념:
      파일 입출력함수는 보통 이름이 f로 시작하고 FILE 포인터를 인수로 받는다.
      fprintf/fscanf는 서식 입출력, fgetc/fputc는 문자 입출력, fread/fwrite는 블록 단위 입출력이다.
      gets/puts, getchar/putchar, printf/scanf는 키보드와 화면을 대상으로 하는 표준 입출력함수다.

  - id: b10-01
    type: multiple-choice
    chapter: 8
    prompt: 랜덤 파일의 특정 부분을 파일 포인터를 이용하여 임의 위치로 이동시키는 함수는?
    choices:
      - id: '1'
        text: fseek( )
      - id: '2'
        text: fread( )
      - id: '3'
        text: fwrite( )
      - id: '4'
        text: fset( )
    answers: ['1']
    explanation: |
      선택지 1: 정답. fseek( )는 기준 위치(SEEK_SET, SEEK_CUR, SEEK_END)로부터 지정한 오프셋만큼 파일 포인터를 임의의 위치로 이동시킨다.
      선택지 2: fread( )는 파일 포인터가 가리키는 현재 위치에서 자료 블록을 읽는 함수로, 위치 이동이 목적이 아니다.
      선택지 3: fwrite( )는 현재 위치에 자료 블록을 쓰는 함수로, 위치를 임의로 옮기는 기능은 없다.
      선택지 4: fset( )이라는 표준 함수는 없다.

      핵심 개념:
      랜덤 파일은 원하는 위치로 바로 이동해 레코드를 읽고 쓸 수 있는 파일이다.
      fseek(파일포인터, 오프셋, 기준위치)로 파일 포인터를 임의 위치로 옮긴다.
      ftell( )은 현재 위치를, rewind( )는 처음 위치로 되돌리는 기능을 한다.
      위치를 정한 뒤 fread( )/fwrite( )로 해당 위치의 자료를 처리한다.

  - id: b10-02
