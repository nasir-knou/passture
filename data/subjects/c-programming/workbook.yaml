        text: a+
      - id: '3'
        text: w
      - id: '4'
        text: wb
    answers: ['4']
    explanation: |
      선택지 1: r+는 텍스트 파일을 읽기와 쓰기 모두 가능하게 여는 모드로, b가 없어 2진 모드가 아니다.
      선택지 2: a+는 텍스트 파일을 읽기와 추가(끝에 덧붙이기)용으로 여는 모드로, 2진 모드가 아니다.
      선택지 3: w는 텍스트 파일을 쓰기용으로 여는 모드다.
      선택지 4: 정답. 모드 문자열에 b가 붙은 wb는 2진 파일을 쓰기용으로 여는 모드다.

      핵심 개념:
      fopen( )의 사용 모드는 r(읽기), w(쓰기), a(추가)와 +(읽기·쓰기 겸용)로 구성된다.
      2진 파일을 다룰 때는 모드 문자에 b를 붙인다(rb, wb, ab, rb+ 등).
      t를 붙이거나 아무것도 붙이지 않으면 텍스트 모드다.
      2진 모드에서는 개행 문자 변환 없이 자료가 그대로 입출력된다.

  - id: b10-03
    type: multiple-choice
    chapter: 8
    prompt: 2진 모드 파일에서 파일의 끝을 판별할 때 사용되는 함수는?
    choices:
      - id: '1'
        text: fread( )
      - id: '2'
        text: fseek( )
      - id: '3'
        text: feof( )
      - id: '4'
        text: ftell( )
    answers: ['3']
    explanation: |
      선택지 1: fread( )는 파일에서 자료 블록을 읽는 함수로, 파일의 끝 여부를 판별하는 전용 함수가 아니다.
      선택지 2: fseek( )는 파일 포인터를 임의의 위치로 이동시키는 함수다.
      선택지 3: 정답. feof( )는 파일의 끝에 도달했으면 0이 아닌 값을, 아니면 0을 반환해 파일의 끝을 판별한다.
      선택지 4: ftell( )은 파일 포인터의 현재 위치(시작점부터의 바이트 수)를 알려 주는 함수다.

      핵심 개념:
      2진 파일에서는 자료 값 자체가 EOF(-1)와 같을 수 있어 EOF 비교만으로 끝을 판단하기 어렵다.
      feof(파일포인터)는 파일 끝에 도달했는지를 판별하는 함수다.
      fseek( )는 위치 이동, ftell( )은 현재 위치 확인, fread( )는 블록 읽기를 담당한다.

  - id: b10-04
    type: multiple-choice
    chapter: 8
    passageRefs: [gcp094-fprintf-stdout-code]
    prompt: 다음과 같은 fprintf( ) 함수의 설명으로 올바른 것은?
    choices:
      - id: '1'
        text: 이중 인용부호 안의 문장을 모니터에 출력한다.
      - id: '2'
        text: stdout라는 텍스트 파일로 이중 인용부호 안의 문장을 출력한다.
      - id: '3'
        text: 파일 포인터가 없으므로 이중 인용부호 안의 문장이 어디에 출력되는지 알 수 없다.
      - id: '4'
        text: 문법적으로 잘못되어 컴파일 에러가 발생한다.
    answers: ['1']
    explanation: |
      선택지 1: 정답. stdout은 모니터(표준 출력)를 가리키는 특수 파일 포인터이므로 fprintf(stdout, …)는 문장을 모니터에 출력한다.
      선택지 2: stdout은 파일 이름이 아니라 미리 정의된 표준 출력 스트림의 파일 포인터이므로 stdout이라는 파일이 만들어지지 않는다.
      선택지 3: stdout 자체가 파일 포인터 역할을 하므로 출력 대상이 모니터로 정해져 있다.
      선택지 4: fprintf(파일포인터, 서식 문자열) 형식을 지키고 있어 문법적으로 올바르다.

      핵심 개념:
      fprintf( )는 첫 번째 인수로 받은 파일 포인터가 가리키는 대상에 서식에 맞춰 출력한다.
      stdin(키보드), stdout(모니터), stderr(모니터, 오류 출력)는 프로그램 시작 시 자동으로 열리는 특수 파일 포인터다.
      fprintf(stdout, …)는 printf(…)와 같은 효과를 낸다.
      특수 파일 포인터는 fopen( )으로 열거나 선언할 필요가 없다.

  - id: b10-05
    type: multiple-choice
    chapter: 8
    prompt: 다음 중 랜덤 파일을 다루는 입출력함수는?
    choices:
      - id: '1'
        text: fputc( )
      - id: '2'
        text: fscanf( )
      - id: '3'
        text: fwrite( )
      - id: '4'
        text: putc( )
    answers: ['3']
    explanation: |
      선택지 1: fputc( )는 문자 하나를 파일에 순서대로 쓰는 함수로 주로 순차 파일(텍스트 파일) 처리에 쓰인다.
      선택지 2: fscanf( )는 서식에 맞춰 텍스트를 읽는 함수로, 가변 길이 텍스트 자료를 다루는 순차 파일 처리에 쓰인다.
      선택지 3: 정답. fwrite( )는 지정한 크기의 자료 블록을 그대로 쓰므로 레코드 길이가 일정한 랜덤 파일 처리에 주로 사용된다.
      선택지 4: putc( )는 fputc( )와 같은 기능의 문자 출력 함수로, 순차 처리용이다.

      핵심 개념:
      랜덤 파일은 레코드 길이가 일정해 원하는 레코드 위치로 바로 이동해 처리할 수 있다.
      랜덤 파일은 주로 fwrite( )/fread( )로 블록 단위 입출력을 하고 fseek( )로 위치를 옮긴다.
      fputc/putc/fscanf/fprintf 등은 문자·서식 단위로 처음부터 차례로 처리하는 순차 파일에 주로 쓰인다.
      fwrite( )는 텍스트 파일 저장에도 쓸 수 있지만 랜덤 파일 처리에 많이 사용된다.

