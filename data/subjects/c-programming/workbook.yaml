      - id: '3'
        text: fscanf
      - id: '4'
        text: stdio
    answers: ['2']
    explanation: |
      선택지 1: fclose는 열린 파일을 닫는 함수로, 파일명과 모드를 받아 파일 포인터를 반환하지 않는다.
      선택지 2: 정답. fopen(“oldname.dat”, “rb”)는 oldname.dat를 2진 읽기 모드로 열어 파일 포인터를 반환하며, 열기에 실패하면 NULL을 반환하므로 `== NULL` 비교와도 맞다.
      선택지 3: fscanf는 열린 파일에서 서식 입력을 하는 함수로, 첫 인수가 파일 포인터여야 하며 파일을 열지 않는다.
