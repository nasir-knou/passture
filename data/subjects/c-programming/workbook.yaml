  - id: b06-08
    type: multiple-choice
    chapter: 6
    prompt: 다음 중 배열에 대한 설명으로 올바르지 ==않은== 것은?
    choices:
      - id: '1'
        text: 배열명을 증가시키거나 감소시킬 수 있다.
      - id: '2'
        text: 배열의 각 원소를 변수처럼 사용한다.
      - id: '3'
        text: '배열의 값을 초기화할 때는 중괄호({ })를 사용한다.'
      - id: '4'
        text: 배열은 일차원 배열뿐만 아니라 다차원 배열도 만들 수 있다.
    answers: ['1']
    explanation: |
      선택지 1: 배열명은 배열 영역의 시작 주소가 수록된 포인터 상수이므로 a++나 a--처럼 값을 바꿀 수 없다. 따라서 틀린 설명이다.
      선택지 2: 배열의 각 원소는 a[0], a[1]처럼 첨자로 지정하여 일반 변수처럼 대입·연산에 사용할 수 있으므로 옳다.
      선택지 3: 배열의 초기값은 int a[3]={1, 2, 3};처럼 중괄호 안에 나열하므로 옳다.
      선택지 4: C 언어는 int a[3][4]처럼 2차원 이상의 다차원 배열도 선언할 수 있으므로 옳다.

      핵심 개념:
      배열은 같은 자료형의 데이터를 연속된 기억공간에 저장하는 자료구조이다.
      배열명은 배열의 시작 주소를 나타내는 포인터 상수이다.
      포인터 상수이므로 배열명 자체를 증가·감소시키거나 다른 주소를 대입할 수 없다.
      초기화는 중괄호를 사용하며, 1차원뿐 아니라 다차원 배열도 만들 수 있다.
    tags: [y2014, y2016, y2017, y2018]

  - id: b06-09
    type: multiple-choice
    chapter: 6
    prompt: 다음 중 배열과 포인터에 대한 설명으로 올바르지 ==않은== 것은?
    choices:
      - id: '1'
        text: 배열과 포인터는 서로 호환적이다.
      - id: '2'
        text: 배열 이름은 포인터로서 포인터 상수이다.
      - id: '3'
        text: 배열과 포인터는 모두 기억공간을 동적으로 활용한다.
      - id: '4'
        text: 포인터는 배열에 비해 기억공간의 활용이 보다 효율적이다.
    answers: ['3']
    explanation: |
      선택지 1: 배열 a의 원소 a[i]는 포인터 표기 *(a+i)로도 접근할 수 있어 배열과 포인터는 서로 호환적으로 사용할 수 있으므로 옳다.
      선택지 2: 배열 이름은 배열의 시작 주소를 갖는 포인터이지만 값을 바꿀 수 없는 포인터 상수이므로 옳다.
      선택지 3: 배열은 선언할 때 크기가 정해지는 정적 할당 방식이라 실행 중에 기억공간을 동적으로 늘리거나 줄일 수 없다. 동적 할당은 malloc( ) 등의 함수가 하고 포인터는 그 공간의 주소를 받아 가리킬 뿐이므로, 배열과 포인터가 모두 기억공간을 동적으로 활용한다는 설명은 틀렸다.
      선택지 4: 포인터는 필요한 위치를 주소로 직접 가리켜 다루므로 배열에 비해 기억공간의 활용이 보다 효율적이라는 설명은 옳다.

      핵심 개념:
      배열 이름은 시작 주소를 나타내는 포인터 상수이다.
      a[i]와 *(a+i)는 같은 원소를 가리키므로 배열과 포인터는 호환적이다.
      배열은 선언 시 크기가 고정되는 정적 할당 방식을 사용한다.
      포인터는 주소를 직접 다루므로 기억공간을 효율적으로 활용할 수 있다.

      ※ 원본 표기: 원본 해설은 "배열과 포인터는 메모리 정적 할당 방식을 사용한다"라고 인쇄되어 있으나, 포인터는 malloc( ) 등으로 동적 할당한 공간을 가리키는 데 쓰이므로 정적 할당 방식에 한정되지 않는다. 정적 할당 방식인 것은 배열이며, 인쇄된 정답은 그대로 둔다.
    tags: [y2015]

  - id: b06-10
    type: multiple-choice
    chapter: 6
    passageRefs: [gcp060-pointer-sum-code]
    prompt: |
      ※ (60~61) 다음과 같은 프로그램이 있을 때 물음에 답하시오.
      위에서 ㉠의 결과로서 올바른 것은?
    choices:
      - id: '1'
        text: b = 10
      - id: '2'
        text: b = 30
      - id: '3'
        text: b = 40
      - id: '4'
        text: b = 50
    answers: ['3']
    explanation: |
      선택지 1: 10은 *pt, 즉 a[0]의 값만 해당한다. b=*pt + *(pt+2);는 a[0]에 a[2]를 더하므로 10이 아니다.
      선택지 2: 30은 *(pt+2), 즉 a[2]의 값만 해당한다. 여기에 a[0]의 10이 더해지므로 30이 아니다.
      선택지 3: pt=a;로 pt가 a[0]을 가리키므로 *pt=10, *(pt+2)=a[2]=30이다. b=10+30=40이므로 ㉠은 b=40을 출력한다. 정답이다.
      선택지 4: 50은 a[4]의 값이며, b의 계산에는 a[4]가 사용되지 않으므로 50이 아니다.

      핵심 개념:
      pt=a;는 배열의 시작 주소(첫 번째 원소의 주소)를 포인터에 대입한다.
      *pt는 pt가 가리키는 원소의 값, 즉 a[0]이다.
      *(pt+2)는 pt에서 원소 2개만큼 떨어진 원소, 즉 a[2]의 값이다.
      따라서 b는 a[0]+a[2]=10+30=40이 된다.
    tags: [y2019]

  - id: b07-01
    type: multiple-choice
    chapter: 6
    passageRefs: [gcp060-pointer-sum-code]
    prompt: 위에서 ㉡의 결과로서 올바른 것은?
    choices:
      - id: '1'
        text: c = 30
      - id: '2'
        text: c = 40
      - id: '3'
        text: c = 50
      - id: '4'
        text: c = 80
    answers: ['4']
    explanation: |
      선택지 1: 30은 pt=pt+2; 이후 *pt, 즉 a[2]의 값만 해당한다. 여기에 a[4]가 더해지므로 30이 아니다.
      선택지 2: 40은 ㉠에서 출력되는 b의 값(a[0]+a[2])이다. c는 이동한 pt를 기준으로 계산하므로 40이 아니다.
      선택지 3: 50은 *(pt+2), 즉 a[4]의 값만 해당하므로 합계인 c가 아니다.
      선택지 4: pt=pt+2;로 pt가 a[2]를 가리키게 되므로 *pt=30, *(pt+2)=a[4]=50이다. c=30+50=80이므로 ㉡은 c=80을 출력한다. 정답이다.

      핵심 개념:
      pt=pt+2;는 포인터를 원소 2개만큼 뒤로 이동시켜 a[2]를 가리키게 한다.
      포인터에 정수 n을 더하면 주소가 (자료형 크기 × n)만큼 이동한다.
      이동 후 *pt는 a[2], *(pt+2)는 a[4]를 나타낸다.
      따라서 c는 a[2]+a[4]=30+50=80이 된다.
    tags: [y2019]

  - id: b07-02
    type: multiple-choice
    chapter: 6
    passageRefs: [gcp062-array-init-code]
    prompt: 다음 프로그램의 실행 결과로서 올바른 것은?
    choices:
      - id: '1'
        text: 10 20
      - id: '2'
        text: 10 20 10 20
      - id: '3'
        text: 10 20 20 20
      - id: '4'
        text: 10 20 0 0
    answers: ['4']
    explanation: |
      선택지 1: printf는 %d 4개로 a[0]~a[3] 네 값을 모두 출력하므로 두 값만 출력될 수 없다.
      선택지 2: 초기값 목록이 반복되어 채워지는 규칙은 없으므로 a[2], a[3]이 10, 20이 되지 않는다.
      선택지 3: 마지막 초기값이 나머지 원소에 복사되는 규칙도 없으므로 20 20이 되지 않는다.
      선택지 4: int a[4]={10, 20,  };는 a[0]=10, a[1]=20을 차례로 할당하고 초기값이 없는 a[2], a[3]은 0으로 초기화한다. 따라서 10 20 0 0이 출력된다. 정답이다.

      핵심 개념:
      배열을 초기화할 때 초기값은 첫 번째 원소부터 차례로 할당된다.
      초기값 개수가 배열 크기보다 적으면 나머지 원소는 0으로 초기화된다.
      초기값 목록 끝의 쉼표는 허용되며 원소를 추가하지 않는다.
      int a[4]={10, 20, };은 {10, 20, 0, 0}과 같다.
    tags: [y2014, y2017, y2018]

  - id: b07-03
    type: multiple-choice
    chapter: 6
    passageRefs: [gcp063-pointer-add-code]
    prompt: 다음 프로그램의 실행 결과로서 올바른 것은?
    choices:
      - id: '1'
        text: 1 2 3 4 5
      - id: '2'
        text: 1 3 5
      - id: '3'
        text: 3 4 5 6 7
      - id: '4'
        text: 에러 발생
    answers: ['3']
    explanation: |
      선택지 1: 1 2 3 4 5는 배열의 초기값이다. 첫 번째 for문에서 p[i]=p[i]+2;로 각 원소가 2씩 증가하므로 초기값이 그대로 출력되지 않는다.
      선택지 2: 두 번째 for문은 i를 0부터 4까지 1씩 증가시키며 다섯 원소를 모두 출력하므로 일부 원소만 출력되지 않는다.
      선택지 3: int *p=a;로 p가 배열 a의 시작 주소를 가지므로 p[i]는 a[i]와 같다. 첫 번째 for문에서 각 원소에 2를 더해 a는 {3, 4, 5, 6, 7}이 되고, 두 번째 for문에서 이 값을 차례로 출력한다. 정답이다.
      선택지 4: 포인터 p에 배열 이름 a(시작 주소)를 대입하고 p[i]처럼 첨자를 쓰는 것은 올바른 문법이므로 에러가 발생하지 않는다.

      핵심 개념:
      int *p=a;는 포인터 p에 배열 a의 시작 주소를 대입한다.
      포인터에도 첨자를 쓸 수 있으며 p[i]는 *(p+i), 즉 a[i]와 같다.
      p[i]를 통해 값을 바꾸면 원래 배열 a의 원소가 바뀐다.
      두 번째 for문은 바뀐 값 3, 4, 5, 6, 7을 차례로 출력한다.

      ※ 원본 표기: 코드의 printf(“%d”, p[i]);에는 공백이 없어 실제 출력은 34567로 붙어서 나온다.
    tags: [y2014, y2017]

  - id: b07-04
    type: multiple-choice
    chapter: 6
    passageRefs: [gcp064-pointer-array-code]
    prompt: 다음 프로그램의 실행 결과로서 올바른 것은?
    choices:
      - id: '1'
        text: '10'
      - id: '2'
        text: '20'
      - id: '3'
        text: '30'
      - id: '4'
        text: 에러 발생
    answers: ['2']
    explanation: |
      선택지 1: 10은 array[0]이 가리키는 a의 값이다. 출력하는 것은 *array[1]이므로 10이 아니다.
      선택지 2: int *array[3]={&a, &b, &c};는 a, b, c의 주소를 원소로 갖는 포인터 배열이다. array[1]은 &b이고, *array[1]은 b의 값 20이므로 20이 출력된다. 정답이다.
      선택지 3: 30은 array[2]가 가리키는 c의 값이므로 *array[1]의 결과가 아니다.
      선택지 4: 포인터 배열을 변수의 주소로 초기화하고 간접 연산자 *로 값을 읽는 것은 올바른 문법이므로 에러가 발생하지 않는다.

      핵심 개념:
      포인터 배열은 원소 하나하나가 포인터(주소)인 배열이다.
      int *array[3]={&a, &b, &c};에서 array[0], array[1], array[2]는 각각 a, b, c의 주소를 갖는다.
      *array[1]은 [ ]가 먼저 적용되어 *(array[1])로 해석된다.
      따라서 두 번째 원소가 가리키는 b의 값 20이 출력된다.
    tags: [y2014, y2015, y2017, y2018]

  - id: b07-05
    type: multiple-choice
    chapter: 6
    passageRefs: [gcp065-pointer-diff-code]
    prompt: |
      ※ (65~67) 다음과 같은 프로그램이 있을 때 물음에 답하시오.
      위에서 ㉠의 결과로서 올바른 것은?
    choices:
      - id: '1'
        text: 10   40
      - id: '2'
        text: 30   60
      - id: '3'
        text: 50   53
      - id: '4'
        text: 50   80
    answers: ['4']
    explanation: |
      선택지 1: 10은 a[0], 40은 a[3]의 값이다. p=&a[4];이므로 *p는 a[0]이 아니다.
      선택지 2: 30은 a[2], 60은 a[5]의 값으로 p, q가 가리키는 위치와 맞지 않는다.
      선택지 3: q=p+3;은 값에 3을 더하는 것이 아니라 주소를 원소 3개만큼 이동시키는 것이므로 *q는 50+3=53이 아니다.
      선택지 4: p=&a[4];로 p는 a배열의 다섯 번째 값(50)의 주소를, q=p+3;으로 q는 여덟 번째 값 a[7](80)의 주소를 갖는다. 따라서 *p, *q는 50 80으로 출력된다. 정답이다.

      핵심 개념:
      &a[4]는 배열의 다섯 번째 원소 a[4]의 주소이다.
      포인터에 정수를 더하면 그 수만큼 원소 단위로 주소가 이동한다.
      q=p+3;은 a[4]에서 3칸 뒤인 a[7]을 가리킨다.
      *p와 *q는 각각 가리키는 원소의 값 50과 80이다.
    tags: [y2016, y2018]

  - id: b07-06
    type: multiple-choice
