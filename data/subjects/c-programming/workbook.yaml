  - id: b05-10
    type: multiple-choice
    chapter: 5
    prompt: main( ) 함수가 a, b, c, d를 갖는 함수 fun( )을 3개의 인수를 사용해서 호출할 때 발생하는 결과는?
    choices:
      - { id: '1', text: '컴파일 에러가 발생한다.' }
      - { id: '2', text: '매개변수 모두에 이상한 값이 입력된다.' }
      - { id: '3', text: 'a, b, c는 정상적인 인수값이, d는 이상한 값이 입력된다.' }
      - { id: '4', text: '알 수 없다.' }
    answers: ['3']
    explanation: |
      선택지 1: 함수 원형 없이 호출하면 컴파일러가 인수 개수를 검사하지 않아 컴파일 에러가 나지 않는다. 원형이 선언되어 있으면 인수 개수가 다를 때 컴파일 에러가 난다.
      선택지 2: 교재는 3개의 인수가 앞에서부터 a, b, c에 차례로 전달되는 일반적인 구현을 기준으로 하므로, 모든 매개변수가 이상한 값이 된다고 보지 않는다.
      선택지 3: 교재는 인수가 순서대로 매개변수에 대응된다고 보아, a, b, c에는 전달된 값이 들어가고 대응되는 인수가 없는 d에는 쓰레기값이 들어간다고 설명한다. 흔한 구현에서 실제로 이렇게 동작하지만 표준 C가 보장하는 결과는 아니다(아래 ※ 참고).
      선택지 4: 교재는 인수가 앞에서부터 순서대로 전달되는 일반적인 구현을 기준으로 하므로 a, b, c의 값이 정해진다고 보고 "알 수 없다"를 답으로 보지 않는다(아래 ※ 참고).

      핵심 개념:
      함수 호출 시 인수는 왼쪽부터 순서대로 매개변수에 복사되어 전달된다(값에 의한 호출).
      원형 없이 인수를 매개변수보다 적게 전달하면 정의되지 않은 동작이 되며, 흔한 구현에서는 남는 매개변수가 쓰레기값을 갖게 된다.
      함수 원형을 선언하면 컴파일러가 인수의 개수와 자료형을 검사해 이런 오류를 막을 수 있다.
      따라서 사용자 정의 함수는 원형을 선언하고 인수 개수를 맞춰 호출해야 한다.

      ※ 원본 표기: 정답이 "a, b, c는 정상적인 인수값이, d는 이상한 값이 입력된다"로 인쇄되어 있으나, 함수 원형이나 정의가 호출보다 앞에 있으면 표준 C에서는 컴파일 에러가 발생한다. 원형 없이 인수 개수를 틀리게 호출하는 것은 정의되지 않은 동작이라 a, b, c의 값도 보장되지 않는다. 채점은 인쇄된 정답을 그대로 따른다.

  - id: b06-01
    type: multiple-choice
    chapter: 5
    passageRefs: [gcp051-static-code]
    prompt: 다음과 같은 프로그램의 실행 결과로서 올바른 것은?
    choices:
      - { id: '1', text: 'a=5   b=15' }
      - { id: '2', text: 'a=5   b=20' }
      - { id: '3', text: 'a=10   b=15' }
      - { id: '4', text: 'a=10   b=20' }
    answers: ['3']
    explanation: |
      선택지 1: `int a=5;`는 안쪽 블록의 자동변수로 블록을 벗어나면 사라지므로 printf 위치의 a는 바깥의 10이다.
      선택지 2: a는 10이고, b는 블록 안에서 `b=a+10`으로 15로 바뀌었으므로 20도 아니다.
      선택지 3: 안쪽 블록에서 a=5를 사용해 b=5+10=15가 저장되고, 블록을 벗어나면 바깥 a=10이 보이므로 "a=10   b=15"가 출력된다.
      선택지 4: 안쪽 블록은 b를 새로 선언하지 않았으므로 `b=a+10`은 바깥의 b를 15로 바꾸고, 블록이 끝나도 그 값이 남아 20이 출력되지 않는다. 이 결과는 b가 static이 아니어도 같다.

      핵심 개념:
      블록 안에서 선언한 자동변수는 그 블록 안에서만 유효하고 블록을 벗어나면 소멸한다.
      같은 이름의 변수가 안쪽 블록에 있으면 그 블록 안에서는 안쪽 변수가 사용된다.
      static 변수는 정적 영역에 할당되어 프로그램이 끝날 때까지 값을 유지한다.
      블록 안에서 바깥 변수 b에 대입한 값은 블록이 끝난 뒤에도 남는다.
    tags: [y2016, y2018, y2019]

  - id: b06-02
    type: multiple-choice
    chapter: 5
    prompt: 다음은 표준함수와 해당되는 헤더 파일을 나타낸 것이다. 올바르지 ==않은== 것은?
    choices:
      - { id: '1', text: 'stdio.h → printf( ), scanf( )' }
      - { id: '2', text: 'string.h → strcat( ), strlen( )' }
      - { id: '3', text: 'math.h → rand( ), gsort( )' }
      - { id: '4', text: 'ctype.h → isalpha( ), isdigit( )' }
    answers: ['3']
    explanation: |
      선택지 1: `printf()`와 `scanf()`는 표준 입출력 함수로 stdio.h에 선언되어 있다.
      선택지 2: `strcat()`(문자열 연결)과 `strlen()`(문자열 길이)은 문자열 처리 함수로 string.h에 선언되어 있다.
      선택지 3: math.h는 sqrt(), pow() 같은 수학 함수용 헤더 파일이다. `rand()`는 난수 관련 함수, 정렬 함수 qsort()는 정렬/검색 함수로 stdlib.h에 선언되어 있으므로 올바르지 않다.
      선택지 4: `isalpha()`(영문자 판별)와 `isdigit()`(숫자 판별)는 문자 판별 함수로 ctype.h에 선언되어 있다.

      핵심 개념:
      stdio.h는 표준 입출력, string.h는 문자열 처리, ctype.h는 문자 판별·변환 함수의 헤더 파일이다.
      math.h는 sqrt(), pow(), sin() 등 수학 함수의 헤더 파일이다.
      stdlib.h에는 rand(), srand(), qsort(), malloc() 등 범용 유틸리티 함수가 선언되어 있다.
      표준함수를 사용하려면 해당 헤더 파일을 `#include`로 포함해야 한다.

      ※ 원본 표기: math.h 선택지의 "gsort( )"는 정렬 함수 qsort()를 가리킨다.

