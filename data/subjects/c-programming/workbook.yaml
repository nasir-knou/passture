    answers: ['3']
    explanation: |
      선택지 1: C 프로그램은 함수들의 집합이며 최소한 main( ) 함수 하나를 포함하므로 옳은 규칙이다.
      선택지 2: 함수 본체는 중괄호({ })로 시작과 끝을 표시하므로 옳은 규칙이다.
      선택지 3: C 실행 프로그램에는 실행이 시작되는 main( ) 함수가 반드시 존재해야 하므로 규칙이라고 할 수 없다.
      선택지 4: 함수 본체의 중괄호 안에는 변수 선언문, 치환문, 함수 호출 등을 기입하므로 옳은 규칙이다.

      핵심 개념:
      C 프로그램은 하나 이상의 함수로 구성된다.
      main( ) 함수는 프로그램 실행의 시작점이므로 반드시 있어야 한다.
      함수 본체는 중괄호로 감싸고 그 안에 선언문과 실행문을 쓴다.
