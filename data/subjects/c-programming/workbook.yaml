  - id: b11-02
    type: multiple-choice
    chapter: 9
    prompt: 스택에 대한 설명으로 ==틀린== 것은?
    choices:
      - id: '1'
        text: LIFO 구조라고 하며 나중에 들어간 자료가 가장 빨리 나오게 된다.
      - id: '2'
        text: 프로그램에서 전역변수는 스택을 이용한다.
      - id: '3'
        text: 운체제에서는 효율적 기억공간 관리를 위해 스택의 개념을 사용한다.
      - id: '4'
        text: 스택에 자료를 넣는 것을 ‘PUSH’, 꺼내는 것을 ‘POP’이라고 한다.
    answers: ['2']
    explanation: |
      선택지 1: 스택은 마지막에 넣은 자료가 가장 먼저 나오는 LIFO(Last In First Out) 구조이므로 옳다.
      선택지 2: 정답. 스택 영역에는 함수 호출 시 생성되는 지역변수와 매개변수가 저장된다. 전역변수는 프로그램 실행 내내 유지되는 데이터 영역에 저장되므로 틀린 설명이다.
      선택지 3: 운영체제는 함수 호출·복귀 관리 등 기억공간을 효율적으로 관리하기 위해 스택 개념을 사용하므로 옳다.
      선택지 4: 스택에 자료를 넣는 연산을 PUSH, 꺼내는 연산을 POP이라 하므로 옳다.

      핵심 개념:
      스택은 LIFO 구조로, PUSH로 넣고 POP으로 꺼낸다.
      프로그램의 스택 영역에는 지역변수와 매개변수가 저장되고 함수가 끝나면 자동으로 소멸한다.
      전역변수와 정적변수는 데이터 영역에 저장되어 프로그램 종료 시까지 유지된다.
      동적으로 할당받는 공간은 힙 영역을 사용한다.

  - id: b11-03
    type: multiple-choice
    chapter: 9
    prompt: 다음 중 힙(heap)에 대한 설명으로 ==틀린== 것은?
    choices:
      - id: '1'
        text: 할당받은 힙 공간은 사용이 끝나면 자동으로 해제된다.
      - id: '2'
        text: 힙의 사용 가능한 공간은 malloc( ) 등의 함수로 할당받을 수 있다.
      - id: '3'
        text: 프로그램 실행 중 동적으로 기억공간을 할당받기 위해 사용되는 메모리 역이다.
      - id: '4'
        text: 힙에 남아 있는 사용 가능 공간이 새로 할당받고자 하는 공간보다 커도 사용 가능한 공간이 여러 개로 쪼개져 있으면 사용할 수 없다.
    answers: ['1']
    explanation: |
      선택지 1: 정답. 힙은 프로그래머의 필요에 따라 할당·소멸되는 영역으로, 할당받은 공간은 free( )로 직접 해제해야 하며 자동으로 해제되지 않는다.
      선택지 2: malloc( ), calloc( ), realloc( ) 등의 함수로 힙의 사용 가능한 공간을 할당받으므로 옳다.
      선택지 3: 힙은 프로그램 실행 중 필요한 만큼 기억공간을 동적으로 할당받는 메모리 영역이므로 옳다.
      선택지 4: 동적 할당은 연속된 공간을 요구하므로 남은 공간의 합이 충분해도 여러 조각으로 나뉘어 있으면(단편화) 할당할 수 없다. 옳은 설명이다.

      핵심 개념:
      힙은 프로그램 실행 중 동적 할당에 사용되는 메모리 영역이다.
      malloc( ) 등으로 할당받고, 사용이 끝나면 free( )로 프로그래머가 직접 반납해야 한다.
      해제하지 않으면 공간이 계속 점유되어 메모리 누수가 생긴다.
      할당은 연속된 공간 단위로 이루어지므로 단편화가 심하면 큰 공간을 할당받지 못할 수 있다.

  - id: b11-04
    type: multiple-choice
    chapter: 9
    prompt: 다음 중 힙에 대한 설명으로 올바르지 ==않은== 것은?
    choices:
      - id: '1'
        text: 힙의 공간 할당은 memset( ) 등의 함수로 할당받을 수 있다.
      - id: '2'
        text: 할당받은 힙 공간은 사용이 끝나면 자동으로 해제되지 않는다.
      - id: '3'
        text: 메모리 동적 할당을 위해 프로그래머가 사용하는 영역이다.
      - id: '4'
        text: 프로그램 실행 중에 필요한 만큼의 공간을 할당받을 때 사용되는 메모리 영역이다.
    answers: ['1']
    explanation: |
      선택지 1: 정답. memset( )은 이미 할당된 기억공간을 지정한 값으로 채워 초기화하는 함수로, 힙 공간을 할당하지 않는다. 힙 할당은 malloc( ), calloc( ), realloc( )로 한다.
      선택지 2: 힙 공간은 free( )로 직접 해제해야 하며 자동으로 해제되지 않으므로 옳다.
      선택지 3: 힙은 프로그래머가 메모리 동적 할당을 위해 사용하는 영역이므로 옳다.
      선택지 4: 힙은 실행 중 필요한 만큼의 공간을 할당받는 메모리 영역이므로 옳다.

      핵심 개념:
      힙은 동적 할당용 메모리 영역으로, 실행 중 필요한 만큼 공간을 할당받는다.
      할당 함수는 malloc( ), calloc( ), realloc( )이고, 해제 함수는 free( )다.
      memset( )은 할당된 기억공간의 초기화를 위해 사용하는 함수다.
      힙 공간은 자동 해제되지 않으므로 사용 후 반드시 free( )로 반납한다.
    tags: [y2014, y2017]

  - id: b11-05
    type: multiple-choice
    chapter: 9
    prompt: 다음의 기억공간 할당 함수에 대한 설명으로 ==틀린== 것은?
    choices:
      - id: '1'
        text: malloc( ) 함수는 가장 대표적인 기억공간 할당 표준함수이다.
      - id: '2'
        text: calloc( ) 함수는 할당받은 기억공간을 0으로 초기화한다.
      - id: '3'
        text: memset( ) 함수는 기억공간을 동적으로 할당 또는 해제하기 위해 사용한다.
      - id: '4'
        text: realloc( ) 함수는 새로운 영역에 기억공간을 재할당하면 기존의 기억공간에 있던 자료를 복사해 온다.
    answers: ['3']
    explanation: |
      선택지 1: malloc( )은 요청한 바이트 수만큼 힙 공간을 할당하고 시작 주소를 반환하는 가장 대표적인 할당 표준함수이므로 옳다.
      선택지 2: calloc( )은 (개수, 크기)만큼 공간을 할당하고 모든 바이트를 0으로 초기화하므로 옳다.
      선택지 3: 정답. memset( )은 할당된 기억공간을 지정한 값으로 채워 초기화하는 함수로, 기억공간을 할당하거나 해제하지 않는다. 해제는 free( )가 담당한다.
      선택지 4: realloc( )은 할당된 공간의 크기를 바꾸며, 새 영역으로 옮겨 재할당하면 기존 공간의 자료를 새 영역으로 복사하므로 옳다.

      핵심 개념:
      malloc( )은 크기만큼 할당하고 초기화하지 않는다.
      calloc( )은 할당과 함께 0으로 초기화한다.
      realloc( )은 이미 할당된 공간의 크기를 조정하며 필요하면 자료를 새 위치로 복사한다.
      free( )는 할당받은 공간을 반납하고, memset( )은 할당된 공간의 초기화에 사용한다.
    tags: [y2015, y2019]

  - id: b11-06
    type: multiple-choice
    chapter: 9
    prompt: 다음 중 동적 할당을 이용한 프로그램을 작성할 때 등장하는 함수의 순서가 올바르게 나열된 것은?
    choices:
      - id: '1'
        text: free( ) → malloc( )
      - id: '2'
        text: malloc( ) → free( ) → realloc( )
      - id: '3'
        text: malloc( ) → realloc( ) → free( )
      - id: '4'
        text: calloc( ) → realloc( )
    answers: ['3']
    explanation: |
      선택지 1: free( )는 할당받은 공간을 반납하는 함수이므로 할당(malloc( )) 전에 호출할 수 없다.
      선택지 2: free( )로 공간을 반납한 뒤에는 그 공간의 크기를 realloc( )으로 조정할 수 없으므로 순서가 잘못되었다.
      선택지 3: 정답. 메모리 확보(malloc( )) → 기억공간 크기 조정(realloc( )) → 메모리 공간 반납(free( )) 순서로 진행된다.
      선택지 4: 할당과 크기 조정만 있고 사용이 끝난 공간을 반납하는 free( )가 빠져 있다.

      핵심 개념:
      동적 할당은 확보 → (필요 시) 크기 조정 → 반납 순서로 진행한다.
      malloc( )이나 calloc( )으로 힙 공간을 확보한다.
      realloc( )으로 이미 할당된 공간의 크기를 늘리거나 줄인다.
      사용이 끝나면 free( )로 공간을 반납해야 메모리 누수가 생기지 않는다.

  - id: b11-07
    type: multiple-choice
    chapter: 9
    passageRefs: [gcp107-memset-code]
    prompt: 다음은 문자열 배열에 보관된 자료를 ‘*’를 이용하여 삭제하려 이를 위해 빈칸 안에 들어갈 함수로 적당한 것은?
    choices:
      - id: '1'
        text: strcpy( )
      - id: '2'
        text: memset( )
      - id: '3'
        text: memcmp( )
      - id: '4'
        text: realloc( )
    answers: ['2']
    explanation: |
      선택지 1: strcpy( )는 한 문자열을 다른 문자열 배열로 복사하는 함수로, 같은 문자로 기억공간을 채우는 기능이 아니다.
      선택지 2: 정답. memset(s, '*', n)은 s부터 n바이트를 ‘*’로 채운다. 예를 들어 memset(s, '*', 5)를 실행하면 s는 *****67890이 되어 앞의 자료가 ‘*’로 지워진다.
      선택지 3: memcmp( )는 두 기억공간의 내용을 바이트 단위로 비교하는 함수로, 내용을 바꾸지 않는다.
      선택지 4: realloc( )은 동적으로 할당받은 기억공간의 크기를 조정하는 함수로, 자료를 특정 문자로 채우지 않는다.

      핵심 개념:
      memset(주소, 값, 바이트수)는 지정한 주소부터 바이트 수만큼 같은 값으로 채운다.
      memset( )은 할당된 기억공간의 초기화를 위해 사용한다.
      memcmp( )는 기억공간 비교, memcpy( )는 기억공간 복사를 담당한다.
      realloc( )은 할당 공간의 크기 조정, strcpy( )는 문자열 복사에 쓰인다.
