    answers: ['2']
    explanation: |
      선택지 1: *fp는 파일 포인터를 선언할 때 쓰는 형태로, 파일명과 모드를 인수로 받는 함수 호출 자리에 올 수 없다.
      선택지 2: 정답. fopen(“sample.dat”, “wt”)는 파일명과 모드를 지정해 파일을 열고 파일 포인터를 반환하므로 file에 대입할 수 있다.
      선택지 3: fprintf( )는 이미 열린 파일에 서식 출력을 하는 함수로, 첫 인수가 파일 포인터여야 하고 파일을 여는 기능이 없다.
      선택지 4: feof( )는 파일 끝 여부를 판별하는 함수로, 파일을 열지 않는다.

      핵심 개념:
      파일 처리 순서는 파일 포인터 선언 → fopen( )으로 열기 → 입출력 → fclose( )로 닫기다.
      fopen( )은 파일명과 사용 모드를 받아 열린 파일을 가리키는 FILE 포인터를 반환한다.
      “wt”는 텍스트 모드 쓰기를 뜻한다.
      반환값을 파일 포인터 변수에 저장해야 이후 입출력 함수에서 사용할 수 있다.
    tags: [y2014]

