    prompt: 위에서 ㉡의 결과로서 올바른 것은?
    choices:
      - id: '1'
        text: '*(p+3)=40'
      - id: '2'
        text: '*(p+3)=43'
      - id: '3'
        text: '*(p+3)=70'
      - id: '4'
        text: '*(p+3)=80'
    answers: ['4']
    explanation: |
      선택지 1: 40은 a[3]의 값이다. p는 a[4]를 가리키므로 p+3이 a[3]이 될 수 없다.
      선택지 2: 배열 a에는 43이라는 값이 없다. *(p+3)은 주소를 원소 3개만큼 이동한 뒤 그 원소의 값을 읽으므로 a[7]의 값 80이 나오며 43이 아니다.
      선택지 3: 70은 a[6]의 값으로, a[4]에서 2칸만 이동한 위치이다. p+3은 3칸 뒤이므로 70이 아니다.
      선택지 4: p+3은 a배열의 다섯 번째 주소(a[4])에서 여덟 번째 주소(a[7])로 이동한 주소이고, *(p+3)은 그 주소의 값 80이다. 정답이다.

      핵심 개념:
      *(p+3)은 p에서 원소 3개만큼 이동한 주소의 값을 읽는다.
      p+3 자체는 p의 값을 바꾸지 않으므로 p는 여전히 a[4]를 가리킨다.
      p가 a[4]를 가리키므로 *(p+3)은 a[7]과 같다.
      따라서 *(p+3)=80이 출력된다.
    tags: [y2016, y2018]

  - id: b07-07
    type: multiple-choice
