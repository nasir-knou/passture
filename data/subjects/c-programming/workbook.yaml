      선택지 3: 첫 번째 printf는 자신이 속한 블록에서 선언된 i=3을, 두 번째 printf는 main 맨 위에서 선언된 i=1을 출력한다.
      선택지 4: 안쪽 블록의 i=4는 바깥 블록의 i에 영향을 주지 않으므로 4가 두 번 출력될 수 없다.

