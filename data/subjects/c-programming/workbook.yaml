      선택지 1: pa는 구조체가 아니라 구조체 포인터이므로 도트 연산자 .를 바로 쓸 수 없다. pa.name은 잘못된 표현이다.
      선택지 2: ->가 *보다 우선하므로 *pa->name은 *(pa->name), 즉 name 멤버가 가리키는 값을 뜻하며 pa->name과 다르다.
      선택지 3: 식 앞에 도트 연산자를 붙이는 .pa->name은 C 언어 문법에 맞지 않는다.
