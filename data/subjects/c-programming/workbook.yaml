      선택지 3: fscanf는 파일에서 서식 입력을 하는 함수 이름으로, 닫을 파일을 가리키지 않는다.
      선택지 4: 정답. fclose( )에는 닫을 파일을 가리키는 파일 포인터를 넘겨야 하며, 이 프로그램에서 FILE * file;로 선언하고 fopen의 반환값을 저장한 변수는 file이다.

