  - id: b08-02
    type: multiple-choice
    chapter: 6
    passageRefs: [gcp071-static-2d-array-code]
    prompt: 위에서 ㉡의 결과로 올바른 것은?
    choices:
      - id: '1'
        text: '15'
      - id: '2'
        text: '50'
      - id: '3'
        text: '60'
      - id: '4'
        text: '90'
    answers: ['4']
    explanation: |
      선택지 1: 배열 a에는 15라는 값이 없다. *(pt+5)는 a[1][0]에서 원소 5개만큼 이동한 a[2][2]의 값 90을 읽으므로 15가 아니다.
      선택지 2: 50은 pt+1이 가리키는 a[1][1]의 값이다.
      선택지 3: 60은 pt+2가 가리키는 a[1][2]의 값이다.
      선택지 4: 2차원 배열은 기억공간에 행 순서로 연속 저장된다. pt가 2행 1열(a[1][0])을 가리키는 상태에서 +5를 하면 a[1][1], a[1][2], a[2][0], a[2][1]을 지나 3행 3열(a[2][2])을 가리키므로 90이 출력된다. 정답이다.

      핵심 개념:
      2차원 배열의 원소는 메모리에 행 우선으로 연속 배치된다.
      따라서 int형 포인터로 행의 경계를 넘어 다음 행의 원소에 접근할 수 있다.
      pt=a[1]은 1차원 인덱스 3번(40)을 가리키고, pt+5는 인덱스 8번을 가리킨다.
      인덱스 8번은 a[2][2]이므로 *(pt+5)=90이다.
