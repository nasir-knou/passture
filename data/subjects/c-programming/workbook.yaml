  - id: b08-03
    type: multiple-choice
    chapter: 6
    passageRefs: [gcp073-char-array-code]
    prompt: 다음과 같은 배열을 선언할 때 배열의 크기는 어떻게 되는가?
    choices:
      - id: '1'
        text: '11'
      - id: '2'
        text: '12'
      - id: '3'
        text: '13'
      - id: '4'
        text: '14'
    answers: ['4']
    explanation: |
      선택지 1: 11은 공백 2개를 빼고 영문자(HONG, GIL, DONG)만 센 개수이다. 공백도 문자로 저장되므로 크기가 아니다.
      선택지 2: HONG GIL DONG은 공백 2개를 포함해 13문자이고 '\0'까지 더하면 14이므로 12가 아니다.
      선택지 3: 13은 공백을 포함한 문자 수이다. 여기에 문자열 끝을 나타내는 널 문자 '\0'이 추가되므로 배열 크기는 13이 아니다.
      선택지 4: HONG GIL DONG은 띄어쓰기 포함 13개 문자이고, 문자열 마지막에 '\0'용 1바이트가 추가되어 총 14개의 배열 크기가 된다. 정답이다.

      핵심 개념:
      문자열 상수로 초기화하면서 배열 크기를 생략하면 컴파일러가 크기를 자동으로 정한다.
      배열 크기는 문자열의 문자 수(공백 포함)에 널 문자 '\0' 1개를 더한 값이다.
      '\0'은 문자열의 끝을 나타내는 문자이다.
      char name[ ]="HONG GIL DONG";의 크기는 13+1=14이다.
    tags: [y2017, y2019]

  - id: b08-04
    type: multiple-choice
    chapter: 6
    passageRefs: [gcp074-string-pointer-array-code]
    prompt: 다음 프로그램의 실행 결과로서 올바른 것은?
    choices:
      - id: '1'
        text: Ko
      - id: '2'
        text: KoreaNational
      - id: '3'
        text: Open
      - id: '4'
        text: KN
    answers: ['3']
    explanation: |
      선택지 1: Ko는 첫 번째 문자열의 앞 두 글자이다. names[2]는 문자열 전체의 시작 주소이며 %s는 '\0'까지 출력하므로 Ko가 아니다.
      선택지 2: KoreaNational은 names[0]과 names[1]을 이어 붙인 것이다. printf는 names[2] 하나만 출력하므로 해당하지 않는다.
      선택지 3: char *names[4]는 네 문자열의 시작 주소를 원소로 갖는 포인터 배열이다. names[2]는 세 번째 값인 "Open"의 시작 주소이므로 %s로 Open이 출력된다. 정답이다.
      선택지 4: KN은 names[0], names[1]의 첫 글자에 해당한다. printf(“%s”, names[2]);는 names[2]가 가리키는 문자열 하나를 '\0' 전까지 출력하므로 KN이 아니다.

      핵심 개념:
      char *names[4]는 문자열(문자 포인터)을 원소로 갖는 포인터 배열이다.
      각 원소는 해당 문자열 상수의 시작 주소를 저장한다.
      첨자는 0부터 시작하므로 names[2]는 세 번째 문자열 "Open"을 가리킨다.
      %s는 주어진 주소부터 널 문자 전까지 문자열 전체를 출력한다.
    tags: [y2014, y2017, y2019]

  - id: b08-05
    type: multiple-choice
    chapter: 6
    passageRefs: [gcp075-char-pointer-code]
    prompt: 다음과 같은 배열이 선언되어 있을 때 *(cp+2)의 값은?
    choices:
      - id: '1'
        text: c
      - id: '2'
        text: o
      - id: '3'
        text: m
      - id: '4'
        text: p
    answers: ['3']
    explanation: |
      선택지 1: c는 *cp, 즉 s[0]의 값이다. cp+2는 두 칸 이동한 위치이므로 c가 아니다.
      선택지 2: o는 *(cp+1), 즉 s[1]의 값이다.
      선택지 3: cp=s;로 cp에 s의 주소(s[0])를 대입한 후 cp+2를 하면 0번째 배열에서 두 칸 이동한 s[2]를 가리키므로 s 문자열의 세 번째 값인 m이 된다. 정답이다.
      선택지 4: p는 *(cp+3), 즉 s[3]의 값이다.

      핵심 개념:
      문자 배열의 이름 s는 첫 번째 문자의 주소이다.
      cp=s;로 문자 포인터 cp는 s[0]을 가리킨다.
      *(cp+2)는 cp[2], 즉 s[2]와 같다.
      "computer"에서 s[0]=c, s[1]=o, s[2]=m이므로 값은 m이다.
    tags: [y2017, y2019]

  - id: b08-06
    type: multiple-choice
    chapter: 6
    passageRefs: [gcp076-array-init-code]
    prompt: 다음과 같은 배열 선언에서 초기화 값으로 올바른 것은?
    choices:
      - id: '1'
        text: 'array[0]=10, array[1]=20, array[2]=30'
      - id: '2'
        text: 'array[0]=10, array[1]=20, array[2]=0'
      - id: '3'
        text: 'array[0]=10, array[1]=20, array[2]=20'
      - id: '4'
        text: 'array[0]=10, array[1]=20, array[2]=10'
    answers: ['2']
    explanation: |
      선택지 1: 초기값의 증가 규칙을 이어서 채우는 기능은 없으므로 array[2]가 30이 되지 않는다.
      선택지 2: 초기값 10, 20이 array[0], array[1]에 차례로 할당되고, 초기화 값이 설정되지 않은 나머지 array[2]는 0으로 초기화된다. 정답이다.
      선택지 3: 마지막 초기값이 나머지 원소에 복사되는 규칙은 없으므로 array[2]가 20이 되지 않는다.
      선택지 4: 초기값 목록이 처음부터 반복되는 규칙도 없으므로 array[2]가 10이 되지 않는다.

      핵심 개념:
      배열 초기화 시 초기값은 첫 번째 원소부터 순서대로 할당된다.
      초기값이 배열 크기보다 적으면 남은 원소는 0으로 초기화된다.
      초기값 목록 끝의 쉼표는 원소를 추가하지 않는다.
      int array[3] = {10, 20, };은 {10, 20, 0}과 같다.

  - id: b08-07
    type: multiple-choice
    chapter: 6
    passageRefs: [gcp077-pointer-postincrement-code]
    prompt: |
      ※ (77~78) 다음과 같은 프로그램이 있을 때 물음에 답하시오.
      위에서 ㉠의 결과로 올바른 것은?
    choices:
      - id: '1'
        text: '10'
      - id: '2'
        text: '11'
      - id: '3'
        text: '12'
      - id: '4'
        text: 알 수 없다
    answers: ['1']
    explanation: |
      선택지 1: int *p1=&n;으로 p1에 n의 주소가 저장된다. (*p1)++는 후위 증가이므로 현재 값 10이 printf에 전달되어 출력되고, 그 후에 n이 11로 증가한다. 정답이다.
      선택지 2: 11은 증가가 먼저 적용되는 전위 증가 ++(*p1)일 때의 결과이다. 후위 ++는 출력 후에 증가하므로 11이 아니다.
      선택지 3: 12는 n이 두 번 증가한 뒤의 값으로, ㉢에서 출력되는 값이다.
      선택지 4: p1은 초기화된 변수 n의 주소를 가지므로 *p1의 값은 10으로 정해져 있다.

      핵심 개념:
      *p1은 p1이 가리키는 변수 n 자체를 나타낸다.
      (*p1)++는 괄호 때문에 포인터가 아니라 가리키는 값 n을 증가시킨다.
      후위 증가 연산자 ++는 현재 값을 먼저 사용한 뒤 1을 증가시킨다.
      따라서 ㉠에서는 10이 출력되고, 이후 n은 11이 된다.
    tags: [y2015]

