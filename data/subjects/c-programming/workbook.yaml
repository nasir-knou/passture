  - id: b10-10
    type: multiple-choice
    chapter: 8
    passageRefs: [gcp100-fgetc-stdout-code]
    prompt: |
      ※ (100~101) 다음과 같은 프로그램이 있을 때 물음에 답하시오.
      위에서 빈칸 ㉠에 들어갈 내용으로 올바른 것은?
    choices:
      - id: '1'
        text: '*fp'
      - id: '2'
        text: fopen
      - id: '3'
        text: stdin
      - id: '4'
        text: EOF
    answers: ['1']
    explanation: |
      선택지 1: 정답. 뒤에서 fp=fopen(…), fgetc(fp), fclose(fp)로 fp를 파일 포인터로 사용하므로 FILE *fp;로 파일 포인터를 선언해야 한다.
      선택지 2: fopen은 함수 이름이므로 FILE형 변수 선언 자리에 올 수 없다.
      선택지 3: stdin은 키보드를 가리키는 미리 정의된 특수 파일 포인터로, 새로 선언하는 변수 이름이 아니고 뒤에서 쓰는 fp도 선언되지 않는다.
      선택지 4: EOF는 파일의 끝을 나타내는 상수(-1)로, 변수로 선언할 수 없다.

      핵심 개념:
      파일을 다루려면 FILE *파일포인터; 형태로 포인터 변수를 먼저 선언한다.
      FILE은 stdio.h에 정의된 구조체형이고, 파일 포인터는 그 구조체를 가리키는 포인터다.
      선언한 파일 포인터는 fopen( )의 반환값을 받아 열린 파일을 가리킨다.
      stdin, stdout, stderr는 이미 정의되어 있어 따로 선언하지 않는 특수 파일 포인터다.
    tags: [y2015, y2016, y2017, y2018, y2019]

  - id: b11-01
    type: multiple-choice
