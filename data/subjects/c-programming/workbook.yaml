      선택지 3: 30은 가리키는 값끼리의 차이(*q-*p=80−50)이다. p-q는 값이 아니라 위치 차이를 구하며 부호도 음수이므로 30이 아니다.
      선택지 4: −30은 값의 차이(*p-*q=50−80)이다. 포인터 뺄셈은 가리키는 값을 빼지 않으므로 −30이 아니다.

      핵심 개념:
      같은 배열을 가리키는 두 포인터의 뺄셈은 두 위치 사이의 원소 개수를 구한다.
      결과는 바이트 수가 아니라 원소 단위이다.
      p는 a[4], q는 a[7]을 가리키므로 p-q=4−7=−3이다.
      포인터가 가리키는 값의 차이와 포인터 자체의 차이를 구분해야 한다.
