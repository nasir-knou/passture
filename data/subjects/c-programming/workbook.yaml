      선택지 1: -36은 실행 결과 -40 + 2 = -38과 다르다.
      선택지 2: -37은 실행 결과 -38과 다르다.
      선택지 3: -a*b/5+c%7에 값을 대입하면 -10*20/5 + 30%7이다. 단항 -가 먼저, 이어서 *, /, %가 왼쪽부터 계산되어 -200/5 = -40, 30%7 = 2이고 -40 + 2 = -38이 출력된다.
      선택지 4: -39는 실행 결과 -38과 다르다.

      핵심 개념:
      단항 연산자(-)는 이항 산술 연산자보다 우선순위가 높다.
      *, /, %는 +, -보다 먼저 계산되며 같은 우선순위끼리는 왼쪽부터 결합한다.
      %는 정수 나눗셈의 나머지를 구한다(30%7 = 2).
      정수끼리의 /는 몫만 남긴다.
    tags: [y2017]

  - id: b02-06
    type: multiple-choice
    chapter: 2
    prompt: 다음 중 문자열 상수에 대한 설명으로 올바르지 ==않은== 것은?
    choices:
      - id: '1'
        text: 문자열 치환 시 단일 인용부호(‘ ’)로 묶는다.
      - id: '2'
        text: 문자열은 복수 개의 영문자와 숫자로 이루어진 상수이다.
      - id: '3'
        text: 문자열 입력 시 문자열 끝에 NULL 문자(‘\0’)가 붙는다.
      - id: '4'
        text: 문자열의 길이는 NULL 문자를 제외한 문자열의 문자 개수이다.
    answers: ['1']
    explanation: |
      선택지 1: 단일 인용부호(‘ ’)는 문자 상수 하나를 묶을 때 사용하고, 문자열 상수는 이중 인용부호(“ ”)로 묶으므로 잘못된 설명이다.
      선택지 2: 문자열 상수는 여러 개의 문자와 숫자로 이루어진 상수이므로 옳은 설명이다.
      선택지 3: 문자열의 끝에는 끝을 표시하는 NULL 문자(‘\0’)가 자동으로 붙으므로 옳은 설명이다.
      선택지 4: 문자열의 길이는 끝의 NULL 문자를 제외한 실제 문자 개수이므로 옳은 설명이다.

      핵심 개념:
      문자 상수는 작은따옴표로, 문자열 상수는 큰따옴표로 묶는다.
      문자열의 끝에는 NULL 문자(‘\0’)가 자동으로 추가된다.
      따라서 문자열을 저장할 배열은 문자 개수보다 1바이트 더 필요하다.
      문자열의 길이에는 NULL 문자가 포함되지 않는다.
    tags: [y2015]

  - id: b02-07
    type: multiple-choice
    chapter: 2
    prompt: 다음 중 매크로 정의가 올바르게 된 것은?
    choices:
      - id: '1'
        text: '#define CONDITION 1;'
      - id: '2'
        text: '#define<CONDITION 1>;'
      - id: '3'
        text: '#define CONDITION 1'
      - id: '4'
        text: '#define <CONDITION 1>'
    answers: ['3']
    explanation: |
      선택지 1: 매크로 정의 끝에 세미콜론(;)을 붙이면 세미콜론까지 치환 내용에 포함되므로 올바른 정의가 아니다.
      선택지 2: 매크로 정의에는 ‘< >’를 사용하지 않고 끝에 ‘;’도 붙이지 않으므로 잘못되었다.
      선택지 3: "#define 매크로명 치환값" 형식에 맞고 세미콜론이 없으므로 올바른 정의다.
      선택지 4: ‘< >’는 #include의 헤더 파일 지정에 쓰는 기호로 매크로 정의에는 사용하지 않는다.

      핵심 개념:
      매크로 정의 형식은 #define 매크로명 치환문자열이다.
      선행처리 지시어이므로 끝에 세미콜론을 붙이지 않는다.
      ‘< >’는 #include에서 표준 헤더 파일을 지정할 때 사용한다.
      매크로명은 보통 대문자로 써서 변수와 구별한다.
    tags: [y2017]

  - id: b02-08
