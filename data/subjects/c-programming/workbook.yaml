  - id: b07-08
    type: multiple-choice
    chapter: 6
    passageRefs: [gcp068-float-var-code]
    prompt: |
      ※ (68~69) 다음과 같이 변수 선언과 초기화가 되어 있을 때 물음에 답하시오.
      위에서 실수형 포인터 변수 fptr을 선언한다면 올바른 표현은?
    choices:
