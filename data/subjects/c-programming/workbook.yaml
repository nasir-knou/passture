      매크로 정의문 끝에는 세미콜론을 붙이지 않는다.
      #undef 매크로명으로 정의를 해제한다.

  - id: b02-09
    type: multiple-choice
    chapter: 2
    prompt: 선행처리기(preprocessor)의 설명으로 올바르지 ==않은== 것은?
    choices:
      - id: '1'
        text: '반드시 #으로 시작해야 한다.'
      - id: '2'
        text: 명령문 끝에는 세미콜론( ; )을 붙인다.
      - id: '3'
        text: 한 줄에 하나의 명령만 쓴다.
      - id: '4'
        text: 선행처리 문자열이 한 줄을 넘어설 때는 \를 사용한다.
    answers: ['2']
    explanation: |
      선택지 1: 선행처리 지시어는 #include, #define처럼 반드시 #으로 시작하므로 옳은 설명이다.
      선택지 2: 선행처리 명령문은 C 문장이 아니므로 끝에 세미콜론을 붙이지 않아 잘못된 설명이다.
      선택지 3: 선행처리 명령은 줄 단위로 처리되어 한 줄에 하나만 쓰므로 옳은 설명이다.
      선택지 4: 한 줄을 넘어가는 선행처리 문자열은 줄 끝에 \를 써서 다음 줄로 이어 쓰므로 옳은 설명이다.

      핵심 개념:
      선행처리기는 컴파일 전에 #으로 시작하는 지시어를 처리한다.
