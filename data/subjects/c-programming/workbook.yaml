  - id: b05-03
    type: multiple-choice
    chapter: 5
    prompt: 다음 중 함수에 대한 설명이 ==잘못된== 것은?
    choices:
      - { id: '1', text: '하나의 프로그램에서 반드시 main( ) 함수를 쓸 필요는 없다.' }
      - { id: '2', text: '함수를 호출할 때 괄호를 생략해서는 안 된다.' }
      - { id: '3', text: '되돌려 줄 자료가 없을 때는 void를 쓴다.' }
      - { id: '4', text: 'C 언어에서 함수는 서로 독립적이다.' }
    answers: ['1']
    explanation: |
      선택지 1: C 프로그램은 실행이 시작되는 main() 함수를 반드시 하나 가져야 하므로 잘못된 설명이다.
      선택지 2: 함수 호출은 함수명 뒤에 괄호 `()`를 붙여야 하며, 인수가 없어도 괄호는 생략할 수 없다.
      선택지 3: 반환값이 없는 함수는 반환형을 `void`로 지정한다.
      선택지 4: C 언어의 함수는 각각 독립적으로 정의되며, 함수 안에 다른 함수를 정의할 수 없다.

      핵심 개념:
      C 프로그램은 하나 이상의 함수로 구성되며 main() 함수는 반드시 하나 있어야 한다.
      프로그램 실행은 main() 함수에서 시작해 main() 함수에서 끝난다.
      함수는 `반환형 함수명(매개변수 목록)` 형식으로 정의하고, 반환값이 없으면 void를 쓴다.
      함수는 서로 독립적이며, 인수와 반환값으로 자료를 주고받는다.
    tags: [y2014, y2018]

  - id: b05-04
    type: multiple-choice
    chapter: 5
    prompt: 다음 중 레지스터(register) 변수에 대한 설명이 올바르지 ==않은== 것은?
    choices:
      - { id: '1', text: '함수 내에서만 사용이 가능하다.' }
      - { id: '2', text: '메모리가 아닌 레지스터에 저장된다.' }
      - { id: '3', text: '다른 변수에 비해 속도가 빠르다.' }
      - { id: '4', text: '모든 자료형의 변수를 레지스터 변수로 사용할 수 있다.' }
    answers: ['4']
    explanation: |
      선택지 1: 레지스터 변수는 자동 변수처럼 함수(블록) 내부에서 선언되어 그 안에서만 사용된다.
      선택지 2: register로 선언한 변수는 CPU 레지스터에 두도록 요청되며, 컴파일러가 레지스터를 배정하면 주기억장치가 아닌 레지스터에 저장된다(아래 ※ 참고).
      선택지 3: 레지스터는 메모리보다 접근 속도가 빨라 반복문 제어 변수 등에 사용하면 실행 속도가 빨라진다.
      선택지 4: 교재는 레지스터 크기(예: 32비트 컴퓨터에서 32bit)를 넘는 자료형은 레지스터에 담을 수 없다는 관점에서 이 보기를 잘못된 설명으로 본다. 실제로 그런 자료형은 register로 선언해도 레지스터에 놓이지 않아 레지스터 변수로서의 이점을 얻지 못한다(아래 ※ 참고).

      핵심 개념:
      기억 클래스에는 자동(auto), 레지스터(register), 정적(static), 외부(extern) 변수가 있다.
      register 변수는 CPU 레지스터에 두도록 요청한 변수로, 레지스터에 배정되면 접근 속도가 빠르다.
      레지스터의 개수와 크기가 제한되어 있어 실제로 레지스터에 놓이는 변수의 자료형과 개수는 컴파일러가 정한다.
      register로 선언한 변수에는 주소 연산자 `&`를 적용할 수 없다.

      ※ 원본 표기: 원본 해설은 레지스터 크기를 넘는 자료형은 레지스터 변수로 사용할 수 없다고 하여 "모든 자료형의 변수를 레지스터 변수로 사용할 수 있다"를 정답으로 인쇄했다. 표준 C에서는 register를 어떤 자료형의 지역 변수에도 붙일 수 있고 실제로 레지스터에 둘지는 컴파일러가 정하므로, 엄밀히는 이 보기가 틀린 설명이 아니며 "메모리가 아닌 레지스터에 저장된다"도 보장되지 않는다. 채점은 인쇄된 정답을 그대로 따른다.

  - id: b05-05
    type: multiple-choice
    chapter: 5
    prompt: 다음 중 표준함수에 대한 설명이 ==잘못된== 것은?
    choices:
      - { id: '1', text: '표준함수의 원형은 헤더 파일에 선언되어 있다.' }
      - { id: '2', text: '표준함수를 사용하기 위해서는 표준함수의 헤더 파일을 #define시켜야 한다.' }
      - { id: '3', text: '표준함수를 사용하기 위해서는 원형과 실체가 알려져야 한다.' }
      - { id: '4', text: '표준함수의 실체는 라이브러리 파일에 수록되어 있다.' }
    answers: ['2']
    explanation: |
      선택지 1: 표준함수의 원형(prototype)은 stdio.h, string.h 같은 헤더 파일에 선언되어 있다.
      선택지 2: 헤더 파일은 `#define`이 아니라 `#include`로 포함시켜야 한다. `#define`은 매크로 상수·함수를 정의하는 전처리기 지시어이므로 잘못된 설명이다.
      선택지 3: 표준함수를 사용하려면 컴파일 시 원형(헤더 파일)이, 링크 시 실체(라이브러리)가 필요하다.
      선택지 4: 표준함수의 실제 코드(실체)는 컴파일된 형태로 라이브러리 파일에 수록되어 있다.

      핵심 개념:
      표준함수는 C 컴파일러가 제공하는 라이브러리 함수이다.
      함수 원형은 헤더 파일에, 실체는 라이브러리 파일에 들어 있다.
      `#include <헤더 파일>`로 원형을 포함하면 컴파일러가 호출 형식을 검사할 수 있다.
      `#define`은 매크로 정의용 지시어로 헤더 파일 포함과는 다르다.
    tags: [y2014]

  - id: b05-06
    type: multiple-choice
    chapter: 5
    prompt: 다음 중 지역변수와 전역변수의 차이점이 ==잘못된== 것은?
    choices:
      - { id: '1', text: '변수의 선언 위치가 다르다.' }
      - { id: '2', text: '변수의 초기화가 다르다.' }
      - { id: '3', text: '사용되는 자료형이 다르다.' }
      - { id: '4', text: '사용범위(유효범위)가 다르다.' }
    answers: ['3']
    explanation: |
      선택지 1: 지역변수는 함수(블록) 내부에, 전역변수는 함수 외부에 선언되므로 선언 위치가 다르다.
      선택지 2: 초기화하지 않은 전역변수는 자동으로 0으로 초기화되지만 지역변수는 쓰레기값을 가지므로 초기화 방식이 다르다.
      선택지 3: 지역변수와 전역변수는 int, char, float 등 같은 자료형을 모두 사용할 수 있으므로 자료형은 차이점이 아니다.
      선택지 4: 지역변수는 선언된 블록 안에서만, 전역변수는 프로그램 전체에서 사용할 수 있어 유효범위가 다르다.

      핵심 개념:
      변수는 선언 위치에 따라 지역변수와 전역변수로 나뉜다.
      지역변수는 블록 안에서만 유효하고 블록을 벗어나면 소멸한다.
      전역변수는 함수 밖에서 선언되어 프로그램 전체에서 유효하며 기본값 0으로 초기화된다.
      두 변수는 선언 위치·초기화·유효범위·존속기간이 다를 뿐 사용할 수 있는 자료형은 같다.
    tags: [y2017]

