    answers: ['2']
    explanation: |
      선택지 1: 10은 ㉠에서 출력된 값이다. ㉠의 (*p1)++로 n이 이미 11로 증가했으므로 10이 아니다.
      선택지 2: int *p2=p1;으로 p1의 주소값(n의 주소)이 p2에 저장된다. ㉠ 이후 n은 11이고, (*p2)++는 후위 증가이므로 11을 출력한 후 n을 12로 증가시킨다. 정답이다.
      선택지 3: 12는 ㉡의 증가가 적용된 뒤의 값이다. 후위 ++는 출력 후에 증가하므로 ㉡에서 12가 출력되지 않는다.
      선택지 4: p2는 p1과 같은 n의 주소를 가지므로 *p2의 값은 11로 정해져 있다.

      핵심 개념:
      p2=p1;이면 두 포인터가 같은 변수 n을 가리킨다.
      어느 포인터로 값을 바꾸든 같은 변수 n이 바뀐다.
      ㉠ 실행 후 n은 11이고, ㉡의 (*p2)++는 11을 출력한 뒤 n을 12로 만든다.
