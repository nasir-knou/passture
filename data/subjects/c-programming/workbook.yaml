      - id: '4'
        text: fptr float;
    answers: ['2']
    explanation: |
      선택지 1: float fptr;는 *가 없으므로 포인터가 아닌 일반 실수형 변수 fptr을 선언한다.
      선택지 2: 포인터 변수는 '자료형 *변수명;' 형식으로 선언하므로 float *fptr;가 실수형 포인터 변수 fptr의 올바른 선언이다. 정답이다.
      선택지 3: 자료형과 변수명의 순서가 뒤바뀌어 있어 선언문으로 성립하지 않는다.
      선택지 4: 변수명 뒤에 자료형을 쓰는 형식은 C 언어 선언문이 아니며 *도 없어 포인터 선언이 아니다.

      핵심 개념:
      포인터 변수는 [자료형] *[변수명]; 형식으로 선언한다.
      자료형은 포인터가 가리킬 대상의 자료형이다.
      float *fptr;는 float형 변수의 주소를 저장하는 포인터를 선언한다.
      *가 없으면 일반 변수 선언이 된다.
    tags: [y2015, y2017, y2018]

  - id: b07-09
    type: multiple-choice
    chapter: 6
    passageRefs: [gcp068-float-var-code]
    prompt: 위에서 포인터 변수 fptr에 주소를 할당하는 방법으로 올바른 것은?
    choices:
      - id: '1'
        text: fptr=var1;
      - id: '2'
        text: fptr=&var1;
      - id: '3'
        text: fptr=&3.14;
      - id: '4'
        text: fptr=3.14;
    answers: ['2']
    explanation: |
      선택지 1: var1은 주소가 아니라 저장된 값(3.14)이므로 포인터 변수에 대입하는 주소가 될 수 없다.
      선택지 2: 주소 연산자 &로 var1의 주소를 구해 대입하는 fptr=&var1;이 포인터 변수에 주소를 할당하는 올바른 방법이다. 정답이다.
      선택지 3: &는 기억공간을 가진 변수에만 쓸 수 있으며 상수 3.14에는 주소가 없으므로 &3.14는 잘못된 표현이다.
      선택지 4: 3.14는 실수 값이므로 포인터 변수에 주소로 대입할 수 없다.

      핵심 개념:
      포인터 변수에는 변수의 주소를 대입한다.
      변수의 주소는 주소 연산자 &를 사용하여 [포인터 변수명] = &[변수명]; 형식으로 대입한다.
      상수에는 기억공간 주소가 없으므로 &를 적용할 수 없다.
      주소 대입 후 *fptr은 var1의 값을 나타낸다.
    tags: [y2015, y2017, y2018]

  - id: b07-10
    type: multiple-choice
    chapter: 6
    passageRefs: [gcp070-2d-array-code]
    prompt: 다음 프로그램의 실행 결과로서 올바른 것은?
    choices:
      - id: '1'
        text: '5'
      - id: '2'
        text: '6'
      - id: '3'
        text: '9'
      - id: '4'
        text: '10'
    answers: ['4']
    explanation: |
      선택지 1: 5는 array[1][0]의 값이다. 출력하는 원소는 array[2][1]이므로 5가 아니다.
      선택지 2: 6은 array[1][1]의 값으로, 행 첨자가 1일 때의 값이다.
      선택지 3: 9는 array[2][0]의 값으로, 열 첨자가 0일 때의 값이다.
      선택지 4: int array[3][4]는 1~12를 행 우선으로 채워 1행 {1,2,3,4}, 2행 {5,6,7,8}, 3행 {9,10,11,12}가 된다. array[2][1]은 세 번째 행의 두 번째 값이므로 10이 출력된다. 정답이다.

      핵심 개념:
      2차원 배열 array[3][4]는 3행 4열 배열이다.
      초기값을 중괄호 하나로 나열하면 행 우선(첫 번째 행부터) 순서로 채워진다.
      첨자는 0부터 시작하므로 array[2][1]은 세 번째 행, 두 번째 열이다.
      array[i][j]는 1차원으로 보면 i*4+j번째 원소이므로 array[2][1]은 9번째 인덱스의 값 10이다.
    tags: [y2015, y2016, y2017, y2018, y2019]

  - id: b08-01
    type: multiple-choice
    chapter: 6
    passageRefs: [gcp071-static-2d-array-code]
    prompt: |
      ※ (71~72) 다음과 같은 프로그램이 있을 때 물음에 답하시오.
