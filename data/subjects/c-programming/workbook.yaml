  - id: b01-10
    type: multiple-choice
    chapter: 2
    prompt: 다음 중 escape 문자에 대한 설명이 ==잘못된== 것은?
    choices:
      - id: '1'
        text: '\n: 출력 시 줄을 바꿈'
      - id: '2'
        text: '\t: 프린터의 form feed'
      - id: '3'
        text: '\a: ‘삑’ 소리를 냄'
      - id: '4'
        text: '\r: 커서를 행의 마지막 위치로 이동'
    answers: ['4']
    explanation: |
      선택지 1: \n(new line)은 출력 시 줄을 바꾸는 escape 문자이므로 옳은 설명이다.
      선택지 2: \t는 수평 탭(tab)으로 커서를 다음 탭 위치로 옮기는 문자이고, 프린터의 form feed는 \f이다.
      선택지 3: \a(alert)는 ‘삑’ 하는 경고음을 내는 escape 문자이므로 옳은 설명이다.
      선택지 4: \r(carriage return)은 커서를 행의 시작 위치로 이동시키므로 "행의 마지막 위치로 이동"은 잘못된 설명이다.

      핵심 개념:
      escape 문자는 역슬래시(\)와 문자를 결합해 특수 제어 기능을 표현한다.
      \n은 줄바꿈, \t는 수평 탭, \r은 행의 처음으로 복귀, \a는 경고음이다.
      \f는 form feed(프린터 용지 넘김), \b는 백스페이스다.
      \0은 NULL 문자로 문자열의 끝을 나타낸다.

      ※ 원본 표기: \t 선택지의 설명(form feed)도 실제 의미와 다르다(form feed는 \f).

  - id: b02-01
    type: multiple-choice
    chapter: 1
    prompt: 다음 중 C 프로그램 작성 시 고려하는 일반적인 규칙이라고 할 수 ==없는== 것은?
    choices:
