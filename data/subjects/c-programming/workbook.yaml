      선택지 2: 20은 a[0][1]의 값으로 첫 번째 행의 원소이므로 해당하지 않는다.
      선택지 3: pt=a[1];에서 a[1]은 a배열의 두 번째 행의 시작 주소(&a[1][0])이다. *pt는 2행의 첫 번째 값 40이므로 40이 출력된다. 정답이다.
      선택지 4: 50은 a[1][1], 즉 2행의 두 번째 값이다. *pt는 행의 첫 번째 값을 가리키므로 50이 아니다.

      핵심 개념:
      2차원 배열에서 a[i]는 i번째 행(0부터)의 시작 주소를 나타낸다.
      pt=a[1];이면 pt는 a[1][0]을 가리킨다.
