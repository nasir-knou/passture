    explanation: |
      선택지 1: #include는 선행처리 지시어이므로 문장 끝에 세미콜론(;)을 붙이지 않는다. #include <stdio.h>;는 잘못된 문장이다.
      선택지 2: void main(){는 main 함수의 머리 부분으로, 이 문장 자체에는 문법 오류가 없다.
      선택지 3: printf(“keep looking!”);는 문자열을 출력하는 올바른 문장이다.
