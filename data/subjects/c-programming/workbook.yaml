  - id: b10-07
    type: multiple-choice
    chapter: 8
    passageRefs: [gcp097-file-pointer-code]
    prompt: 다음과 같은 파일포인터가 있을 때 fopen( ) 함수의 사용이 올바른 것은?
    choices:
      - id: '1'
        text: 'fp=fopen(“sample.dat”, “w”);'
      - id: '2'
        text: 'fopen(“fp”, “w”);'
      - id: '3'
        text: 'fp=fopen(fp);'
      - id: '4'
        text: 'fopen(“r”, “sample.dat”)'
    answers: ['1']
    explanation: |
      선택지 1: 정답. fopen(“파일명”, “모드”) 형식으로 sample.dat를 쓰기 모드로 열고, 반환된 파일 포인터를 fp에 대입해 이후 fp로 파일을 다룰 수 있다.
      선택지 2: “fp”라는 이름의 파일을 여는 것이 되고, 반환값을 fp에 저장하지 않아 fp가 열린 파일을 가리키지 않는다.
      선택지 3: fopen( )은 파일명과 모드 두 개의 문자열 인수가 필요한데 파일 포인터 하나만 넘겨 형식이 맞지 않는다.
      선택지 4: 인수 순서가 뒤바뀌어 “r”이라는 파일을 “sample.dat” 모드로 열려는 꼴이 되고, 반환값도 fp에 대입하지 않는다.

      핵심 개념:
      파일을 다루려면 먼저 FILE *fp;로 파일 포인터를 선언한다.
      fp=fopen(“파일명”, “모드”);로 파일을 지정한 모드로 열고 fp가 그 파일을 가리키게 한다.
      fopen( )의 첫 번째 인수는 파일명, 두 번째 인수는 사용 모드다.
      파일을 열 수 없으면 fopen( )은 NULL을 반환한다.
