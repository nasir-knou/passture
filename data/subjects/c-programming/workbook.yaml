      선택지 2: 자료형 short와 int 사이에 변수명이 끼어 있어 "자료형 변수명" 형식에 맞지 않는다.
      선택지 3: 자료형 double 다음에 변수명 a를 쓰고 세미콜론으로 끝냈으므로 올바른 선언이다.
