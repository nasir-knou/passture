      선택지 2: 랜덤 파일은 위치를 계산해 이동하기 위해 레코드 길이를 일정하게 저장하므로 옳은 설명이다.
      선택지 3: 순차 파일은 자료 길이만큼만 저장하므로 고정 길이로 공간을 잡는 랜덤 파일보다 기억공간이 절약된다.
      선택지 4: 순차 파일은 자료를 차례로 기록하므로 레코드 길이가 일정하지 않아도 된다.

      핵심 개념:
      순차 파일은 자료를 처음부터 차례로 기록·처리하며 레코드 길이가 가변적이다.
      순차 파일은 기억공간 낭비가 적지만 특정 레코드를 찾으려면 앞에서부터 읽어야 해 검색이 느리다.
      랜덤 파일은 레코드 길이를 고정해 원하는 위치로 바로 이동할 수 있다.
      랜덤 파일은 기억공간을 어느 정도 낭비하지만 레코드 검색이 빠르고 효율적이다.
