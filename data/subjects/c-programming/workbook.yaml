questions:
  - id: b01-01
    type: multiple-choice
    chapter: 1
    prompt: 다음 중 C 프로그램 완성 과정의 순서로 올바른 것은?
    choices:
      - id: '1'
        text: 코딩 → 실행 → 링킹 → 컴파일
      - id: '2'
        text: 코딩 → 링킹 → 실행 → 컴파일
      - id: '3'
        text: 코딩 → 컴파일 → 링킹 → 실행
      - id: '4'
        text: 코딩 → 컴파일 → 실행 → 링킹
    answers: ['3']
    explanation: |
      선택지 1: 실행은 링킹으로 실행 파일이 만들어진 뒤에야 가능하므로 컴파일·링킹보다 먼저 올 수 없다.
      선택지 2: 링킹은 컴파일이 만든 목적 파일을 묶는 단계이므로 컴파일보다 앞설 수 없다.
      선택지 3: 소스 작성(editing) → 컴파일(compile)로 목적 파일 생성 → 링킹(linking)으로 실행 파일 생성 → 실행(execute)의 올바른 순서다.
      선택지 4: 링킹을 거쳐야 실행 파일이 생기므로 실행이 링킹보다 먼저 올 수 없다.

      핵심 개념:
      C 프로그램은 코딩 → 컴파일 → 링킹 → 실행 순으로 완성된다.
      컴파일러는 소스 파일(.c)을 목적 파일(.obj)로 번역한다.
      링커는 목적 파일과 라이브러리를 결합해 실행 파일(.exe)을 만든다.
      실행 파일이 만들어진 뒤에 프로그램을 실행할 수 있다.
    tags: [y2016, y2017]

  - id: b01-02
    type: multiple-choice
    chapter: 1
    prompt: C 프로그램 작성 시 반드시 작성해야 하는 함수는?
    choices:
      - id: '1'
        text: scanf( )
      - id: '2'
        text: printf( )
      - id: '3'
        text: malloc( )
      - id: '4'
        text: main( )
    answers: ['4']
    explanation: |
      선택지 1: scanf( )는 표준 입력 라이브러리 함수로, 입력이 필요할 때만 사용하므로 필수가 아니다.
      선택지 2: printf( )는 표준 출력 라이브러리 함수로, 출력이 필요할 때만 사용하므로 필수가 아니다.
      선택지 3: malloc( )은 동적 메모리 할당 함수로, 동적 할당이 필요할 때만 사용한다.
      선택지 4: main( )은 프로그램 실행이 시작되는 함수로 C 실행 프로그램에는 반드시 존재해야 한다.

      핵심 개념:
      C 프로그램은 하나 이상의 함수로 구성된다.
      실행 시 운영체제는 main( ) 함수부터 호출한다.
      따라서 실행 프로그램에는 main( ) 함수가 반드시 하나 있어야 한다.
      scanf, printf, malloc 등은 필요할 때 선택적으로 쓰는 라이브러리 함수다.
    tags: [y2014, y2018]

  - id: b01-03
    type: multiple-choice
    chapter: 1
    prompt: 다음 중 C 프로그램 언어의 예약어(reserved word)가 ==아닌== 것은?
    choices:
      - id: '1'
        text: for
      - id: '2'
        text: switch
      - id: '3'
        text: standard
      - id: '4'
        text: define
    answers: ['3']
    explanation: |
      선택지 1: for는 반복문을 나타내는 C의 예약어다.
      선택지 2: switch는 다중 분기 선택문을 나타내는 C의 예약어다.
      선택지 3: standard는 C에서 특별한 의미가 정해진 단어가 아니므로 예약어가 아니다.
      선택지 4: define은 #define 선행처리 지시어에 쓰이는 이름으로, C 표준의 키워드(예약어) 목록에는 들어 있지 않다.

      핵심 개념:
      예약어는 C 언어에서 용도가 미리 정해져 있어 다른 의미로 쓸 수 없는 단어다.
      for, while, if, switch, int, char, return 등이 대표적인 예약어다.
      예약어는 변수명·함수명 같은 사용자 정의 명칭으로 사용할 수 없다.
      standard처럼 특별한 의미가 없는 단어는 예약어가 아니다.

      ※ 원본 표기: 정답이 standard로 인쇄되어 있으나, define은 선행처리 지시어이고 C의 키워드가 아니므로 define도 예약어가 아니다.
    tags: [y2015]

  - id: b01-04
    type: multiple-choice
    chapter: 1
    prompt: 다음 중 사용자 정의 명칭으로 올바른 것은?
    choices:
      - id: '1'
        text: For
      - id: '2'
        text: 2knou
      - id: '3'
        text: int
      - id: '4'
        text: OUN TV
    answers: ['1']
    explanation: |
      선택지 1: C는 대소문자를 구분하므로 For는 예약어 for와 다른 명칭이며, 영문자로 시작하므로 사용할 수 있다.
      선택지 2: 명칭은 숫자로 시작할 수 없으므로 2knou는 사용할 수 없다.
      선택지 3: int는 자료형을 나타내는 예약어이므로 명칭으로 사용할 수 없다.
      선택지 4: 명칭 중간에 띄어쓰기(공백)를 넣을 수 없으므로 OUN TV는 사용할 수 없다.

      핵심 개념:
      사용자 정의 명칭은 영문자, 숫자, 밑줄(_)로 구성한다.
      첫 글자는 숫자가 될 수 없고 공백을 포함할 수 없다.
      예약어는 명칭으로 사용할 수 없다.
      C는 대소문자를 구분하므로 For와 for는 서로 다른 명칭이다.
