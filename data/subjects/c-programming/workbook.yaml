      선택지 2: 매크로 정의는 선행처리 지시어이므로 끝에 세미콜론을 붙이지 않아 옳은 설명이다.
      선택지 3: 매크로로는 #define PI 3.14 같은 상수와 #define SUM(x,y) x+y 같은 함수 형태를 모두 정의할 수 있으므로 잘못된 설명이다.
      선택지 4: 매크로 정의 해제는 #undef 뒤에 매크로명만 기입하므로 옳은 설명이다.

