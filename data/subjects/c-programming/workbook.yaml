  - id: b02-04
    type: multiple-choice
    chapter: 2
    passageRefs: [gcp014-macro-sum-code]
    prompt: 다음과 같은 프로그램의 실행 결과로서 올바른 것은?
    choices:
      - id: '1'
        text: '10'
      - id: '2'
        text: '34'
      - id: '3'
        text: '45'
      - id: '4'
        text: '70'
    answers: ['2']
    explanation: |
      선택지 1: a=10*3+4 = 34이므로 10은 실행 결과와 다르다.
      선택지 2: SUM(3, 4)는 괄호 없이 3+4로 치환되어 a=10*3+4가 되고, 곱셈이 먼저 계산되어 30+4=34가 출력된다.
      선택지 3: 45는 계산 과정에서 나올 수 없는 값이다.
      선택지 4: 70은 10*(3+4)로 계산했을 때의 값인데, 매크로 정의에 괄호가 없어 이렇게 계산되지 않는다.

      핵심 개념:
      매크로는 컴파일 전에 선행처리기가 문자열 그대로 치환한다.
      #define SUM(x,y) x+y는 SUM(3, 4)를 3+4로 바꿀 뿐 괄호를 추가하지 않는다.
      치환 후 연산자 우선순위에 따라 곱셈이 덧셈보다 먼저 계산된다.
      의도대로 계산하려면 #define SUM(x,y) ((x)+(y))처럼 괄호로 감싸야 한다.
    tags: [y2014, y2017, y2018]

