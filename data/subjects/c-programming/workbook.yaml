      선택지 3: ㉣은 `/* */`로 둘러싸인 부분으로 컴파일되지 않는 설명문(주석)이다.
      선택지 4: ㉤은 display_line 함수의 정의가 시작되는 함수 헤더이다.

      핵심 개념:
      설명문(주석)은 프로그램의 이해를 돕기 위한 글로, 컴파일 시 무시된다.
      C 언어에서 설명문은 `/*`로 시작해 `*/`로 끝난다.
      설명문은 여러 줄에 걸쳐 쓸 수 있고 실행 결과에 영향을 주지 않는다.
      이 프로그램에서는 ㉣의 `/* print asterisk line */`이 설명문이다.
    tags: [y2014, y2017, y2019]

