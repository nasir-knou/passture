          union var ab;
          var.a=‘A’;
          var.b=133.0;
      - id: '2'
        text: |
          union var ab;
          union.a=133.0;
          union.b=‘A’;
      - id: '3'
        text: |
          union var ab;
          ab.a=‘A’;
          ab.b=133.0;
      - id: '4'
        text: |
          union var ab;
          var.a=133.0;
          var.b=‘A’;
    answers: ['3']
    explanation: |
      선택지 1: var는 공용체 태그(형 이름)이지 변수가 아니다. 멤버는 선언한 변수 ab를 통해 참조해야 하므로 var.a는 잘못이다.
      선택지 2: union은 예약어이므로 union.a처럼 변수 자리에 쓸 수 없다. 또한 char형 a에 133.0, float형 b에 ‘A’를 넣어 멤버 자료형과도 맞지 않는다.
      선택지 3: 정답. union var ab;로 선언한 공용체 변수 ab에 도트 연산자를 붙여 ab.a, ab.b로 참조하고, char형 a에는 문자 ‘A’, float형 b에는 실수 133.0을 넣어 자료형도 맞다.
      선택지 4: 태그 var로 멤버를 참조해 잘못이고, a와 b에 넣는 값도 멤버 자료형과 뒤바뀌어 있다.

      핵심 개념:
      공용체는 union 태그 { 멤버 선언 }; 형태로 정의하고 union 태그 변수명; 으로 변수를 선언한다.
      멤버는 태그가 아니라 선언한 공용체 변수명에 도트 연산자를 붙여 참조한다.
      값은 각 멤버의 자료형에 맞게 넣어야 한다.
      공용체의 모든 멤버는 같은 기억공간을 공유하므로 마지막에 저장한 멤버의 값만 유효하다.

  - id: b09-08
    type: multiple-choice
    chapter: 7
    passageRefs: [gcp088-union-hold-code]
    prompt: 정수형 변수의 크기가 16비트인 시스템에서 다음과 같이 공용체가 정의되어 있을 경우 공용체 hold가 갖는 기억공간의 크기는?
    choices:
      - id: '1'
        text: 1byte
      - id: '2'
        text: 2byte
      - id: '3'
        text: 4byte
      - id: '4'
        text: 8byte
    answers: ['4']
    explanation: |
      선택지 1: 1byte는 char형의 크기로, hold에는 char 멤버가 없고 가장 큰 멤버보다 작아 아니다.
      선택지 2: 2byte는 16비트 시스템에서 int digit의 크기다. 공용체는 가장 큰 멤버 크기로 할당되므로 아니다.
      선택지 3: 4byte는 float number의 크기다. double보다 작으므로 공용체 전체 크기가 될 수 없다.
      선택지 4: 정답. 공용체는 멤버들이 같은 기억공간을 공유하며 가장 큰 멤버의 크기만큼 할당된다. 가장 큰 자료형은 double(8byte)이므로 hold는 8byte다.

      핵심 개념:
      공용체는 모든 멤버가 하나의 기억공간을 공유하는 자료형이다.
      공용체의 크기는 멤버 크기의 합이 아니라 가장 큰 멤버의 크기로 정해진다.
      구조체는 멤버마다 별도 공간을 가지므로 크기가 멤버 크기의 합 이상이 된다.
      이 문제에서 int 2byte, float 4byte, double 8byte 중 최대인 8byte가 공용체 크기다.

