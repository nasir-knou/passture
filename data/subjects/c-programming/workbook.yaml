  - id: b02-10
    type: multiple-choice
    chapter: 3
    prompt: 다음 설명 중 ==잘못된== 것은?
    choices:
      - id: '1'
        text: '%d는 출력값을 10진수로 나타낸다.'
      - id: '2'
        text: '%x는 출력값을 16진수로 나타낸다.'
      - id: '3'
        text: '%e는 부동소수점 수를 지수형으로 나타낸다.'
      - id: '4'
        text: '%c는 출력값을 부동소수점 형식으로 나타낸다.'
    answers: ['4']
    explanation: |
      선택지 1: %d는 정수를 부호 있는 10진수로 출력하므로 옳은 설명이다.
      선택지 2: %x는 정수를 16진수로 출력하므로 옳은 설명이다.
      선택지 3: %e는 실수를 지수 형식(예: 1.5e+02)으로 출력하므로 옳은 설명이다.
      선택지 4: %c는 지정한 자료를 한 문자로 변환하여 출력하며, 부동소수점 형식 출력은 %f이므로 잘못된 설명이다.

      핵심 개념:
      printf의 변환 문자는 출력 형식을 지정한다.
      %d는 10진 정수, %o는 8진수, %x는 16진수로 출력한다.
      %f는 소수점 형식, %e는 지수 형식의 실수로 출력한다.
      %c는 한 문자, %s는 문자열을 출력한다.
    tags: [y2014, y2017, y2018]

  - id: b03-01
    type: multiple-choice
    chapter: 2
    prompt: 다음 중 상수에 대한 설명으로 올바르지 ==않은== 것은?
    choices:
      - id: '1'
        text: 8진 상수를 표현할 때는 숫자 앞에 0(영)을 붙인다.
      - id: '2'
        text: 16진 상수를 표현할 때는 숫자 앞에 0x를 붙인다.
      - id: '3'
        text: 문자형 상수는 내부적으로 정숫값이 사용된다.
      - id: '4'
        text: 실수형 상수는 지수 형식으로 표시할 수 없다.
    answers: ['4']
    explanation: |
      선택지 1: 012처럼 숫자 앞에 0을 붙이면 8진 상수가 되므로 옳은 설명이다.
      선택지 2: 0x1A처럼 숫자 앞에 0x를 붙이면 16진 상수가 되므로 옳은 설명이다.
      선택지 3: 문자형 상수는 내부적으로 ASCII 코드값(정숫값)으로 저장되고 연산되므로 옳은 설명이다.
      선택지 4: 실수형 상수는 3.14 같은 소수점 형식뿐 아니라 1.5e3 같은 지수 형식으로도 표시할 수 있으므로 잘못된 설명이다.

      핵심 개념:
      정수형 상수는 10진, 8진(앞에 0), 16진(앞에 0x)으로 표현한다.
      실수형 상수는 소수점 형식과 지수 형식(e 또는 E)으로 표현한다.
      문자형 상수는 작은따옴표로 묶으며 내부적으로 ASCII 코드값을 갖는다.
      따라서 문자 상수도 정수처럼 산술 연산에 사용할 수 있다.
    tags: [y2019]

  - id: b03-02
    type: multiple-choice
    chapter: 3
    passageRefs: [gcp022-putchar-code]
    prompt: 다음 프로그램의 결과로 올바른 것은?
    choices:
      - id: '1'
        text: A+2  K+2
      - id: '2'
        text: B  L
      - id: '3'
        text: A+2  K
      - id: '4'
        text: C  L
    answers: ['4']
    explanation: |
      선택지 1: putchar는 인자의 식을 계산한 정숫값을 문자로 출력하므로 "A+2"라는 글자가 그대로 출력되지 않는다.
      선택지 2: var+2는 ‘A’(65)+2 = 67이므로 B(66)가 아니라 C가 출력된다.
      선택지 3: 식이 계산되어 문자로 출력되므로 "A+2"가 출력되지 않고, ‘K’+1도 K가 아니라 L이 된다.
      선택지 4: putchar(var+2)는 65+2 = 67인 C를, putchar(‘K’+1)은 75+1 = 76인 L을 출력한다.

      핵심 개념:
      putchar( )는 한 문자를 화면에 출력하는 함수다.
      문자 상수는 내부적으로 ASCII 코드값을 가지므로 정수 연산이 가능하다.
      인자에 식이 있으면 먼저 계산한 뒤 그 정숫값에 해당하는 문자를 출력한다.
      ‘A’는 65, ‘K’는 75이므로 각각 +2, +1 하면 C, L이 된다.
    tags: [y2017]

  - id: b03-03
    type: multiple-choice
    chapter: 3
    prompt: 다음 중 논리 연산자가 ==아닌== 것은?
    choices:
      - id: '1'
        text: '&&'
      - id: '2'
        text: '||'
      - id: '3'
        text: '!'
      - id: '4'
        text: '!='
    answers: ['4']
    explanation: |
      선택지 1: &&는 두 조건이 모두 참일 때 참이 되는 논리곱(AND) 연산자다.
      선택지 2: ||는 두 조건 중 하나라도 참이면 참이 되는 논리합(OR) 연산자다.
      선택지 3: !는 참과 거짓을 뒤집는 논리부정(NOT) 연산자다.
      선택지 4: !=는 두 값이 같지 않은지 비교하는 관계 연산자이므로 논리 연산자가 아니다.

      핵심 개념:
      논리 연산자는 &&(AND), ||(OR), !(NOT) 세 가지다.
      관계 연산자는 >, <, >=, <=, `==`, != 로 두 값을 비교한다.
      두 종류 모두 결과는 참이면 1, 거짓이면 0이다.
      !와 !=는 모양이 비슷하지만 !는 논리, !=는 관계 연산자다.
    tags: [y2017]

  - id: b03-04
    type: multiple-choice
    chapter: 3
    passageRefs: [gcp024-string-io-code]
    prompt: |
      ※ (24~25) 다음과 같은 프로그램이 있을 때 물음에 답하시오.
      위에서 문자열 자료를 입력받기 위해 ㉠의 위치에서 사용될 수 있는 표준입력함수는?
    choices:
      - id: '1'
        text: 'scanf(“%s”, &s);'
      - id: '2'
        text: s=getchar( );
      - id: '3'
        text: puts(s);
      - id: '4'
        text: gets(s);
    answers: ['4']
    explanation: |
      선택지 1: 배열명 s 자체가 배열의 시작 주소이므로 scanf의 %s에는 s를 전달해야 하며 &s를 쓰는 형식은 올바른 답이 아니다.
      선택지 2: getchar( )는 한 문자만 입력받아 정수로 반환하므로 문자열 배열 s에 대입할 수 없다.
      선택지 3: puts( )는 문자열을 화면에 출력하는 함수로 입력 함수가 아니다.
      선택지 4: gets( )는 키보드로부터 문자열을 입력받아 s가 가리키는 기억 공간에 저장하는 문자열 입력 함수다.

      핵심 개념:
      gets( )는 한 줄의 문자열을 입력받아 배열에 저장한다.
      getchar( )는 한 문자를 입력받는 함수다.
      배열명은 배열의 시작 주소이므로 scanf("%s", s)처럼 & 없이 전달한다.
      puts( )는 입력 함수가 아니라 문자열 출력 함수다.
    tags: [y2015, y2018]

  - id: b03-05
    type: multiple-choice
    chapter: 3
    passageRefs: [gcp024-string-io-code]
    prompt: 위에서 입력된 문자열 자료를 출력하기 위해 ㉡의 위치에서 사용될 수 있는 출력함수로서 올바른 것은?
    choices:
      - id: '1'
        text: 'printf(“%c”, s);'
      - id: '2'
        text: 'printf(“%s”, &s);'
      - id: '3'
        text: puts(s);
      - id: '4'
        text: gets(s);
    answers: ['3']
    explanation: |
      선택지 1: %c는 한 문자를 출력하는 변환 문자이므로 문자열 배열 s 전체를 출력할 수 없다.
      선택지 2: 문자열 출력의 %s에는 배열의 시작 주소인 s를 전달해야 하며 &s를 쓰는 형식은 올바른 답이 아니다.
      선택지 3: puts( )는 s가 가리키는 문자열을 화면에 출력하고 줄을 바꾸는 문자열 출력 함수다.
      선택지 4: gets( )는 문자열 입력 함수이므로 출력에 사용할 수 없다.

      핵심 개념:
      puts( )는 문자열을 출력한 뒤 자동으로 줄을 바꾼다.
      printf로 문자열을 출력할 때는 %s와 배열명(시작 주소)을 사용한다.
      %c는 한 문자 출력용 변환 문자다.
      gets( )/puts( )는 문자열 입력/출력 함수 쌍이다.
    tags: [y2015, y2018]

  - id: b03-06
    type: multiple-choice
    chapter: 3
    passageRefs: [gcp026-char-output-code]
    prompt: |
      ※ (26~27) 다음과 같은 프로그램이 있을 때 물음에 답하시오.
      (여기서 ‘A’의 ASCII 코드값은 65이다.)
      위에서 ㉠의 결과로 올바른 것은?
    choices:
      - id: '1'
        text: var1=65   var2=A
      - id: '2'
        text: var1=a   var2=65
      - id: '3'
        text: var1=a   var2=A
      - id: '4'
        text: var1=65   var2=65
    answers: ['1']
    explanation: |
      선택지 1: 첫 번째 %d는 var의 값 ‘A’를 10진 정수 65로, 두 번째 %c는 한 문자 A로 출력하므로 var1=65 var2=A가 된다.
      선택지 2: %d는 문자를 코드값(정수)으로 출력하므로 var1이 a가 될 수 없고, %c는 문자로 출력하므로 var2가 65가 될 수 없다.
      선택지 3: %d로 출력한 var1은 정수 65이며 문자 a가 아니다.
      선택지 4: %c로 출력한 var2는 문자 A이며 정수 65가 아니다.

      핵심 개념:
      같은 값이라도 printf의 변환 문자에 따라 출력 모양이 달라진다.
      %d는 부호 있는 10진 정수로, %c는 한 문자로 변환해 출력한다.
      문자 ‘A’는 내부적으로 ASCII 코드값 65로 저장된다.
      따라서 %d로는 65, %c로는 A가 출력된다.
    tags: [y2016, y2017, y2019]

  - id: b03-07
    type: multiple-choice
    chapter: 3
    passageRefs: [gcp026-char-output-code]
    prompt: 위에서 ㉡의 결과로 올바른 것은?
    choices:
      - id: '1'
        text: '65'
      - id: '2'
        text: '67'
      - id: '3'
        text: A
      - id: '4'
        text: C
    answers: ['4']
    explanation: |
      선택지 1: 65는 ‘A’의 코드값으로, +2가 반영되지 않았고 putchar는 숫자가 아니라 문자로 출력한다.
      선택지 2: var+2의 값은 67이지만 putchar는 이 정숫값을 숫자가 아니라 해당 문자로 출력한다.
      선택지 3: A는 var 자체의 문자로 +2가 반영되지 않았다.
      선택지 4: var+2 = 65+2 = 67이고 putchar가 코드값 67에 해당하는 문자 C를 출력한다.

      핵심 개념:
      putchar( )는 인자의 정숫값에 해당하는 한 문자를 출력한다.
      문자 변수에 정수를 더하면 ASCII 코드값이 증가한다.
      ‘A’(65)+2 = 67은 문자 C다.
      출력 결과는 숫자 67이 아니라 문자 C다.
    tags: [y2016, y2017, y2019]

  - id: b03-08
    type: multiple-choice
    chapter: 3
    passageRefs: [gcp028-relational-code]
    prompt: 다음 프로그램의 실행 결과로 올바른 것은?
    choices:
      - { id: '1', text: 'b=1  c=0' }
      - { id: '2', text: 'b=4  c=1' }
      - { id: '3', text: 'b=0  c=1' }
      - { id: '4', text: 'b=1  c=4' }
    answers: ['1']
    explanation: |
      선택지 1: a=4이므로 `a>2`는 참이 되어 b=1, `a<2`는 거짓이 되어 c=0이 출력된다.
      선택지 2: 관계 연산의 결과는 비교 대상의 값(4)이 아니라 참이면 1, 거짓이면 0이므로 b=4가 될 수 없고, `a<2`는 거짓이므로 c=1도 아니다.
      선택지 3: 참과 거짓을 반대로 판단한 결과이다. 4>2는 참, 4<2는 거짓이다.
      선택지 4: c에는 a의 값이 아니라 `a<2`의 비교 결과(0)가 저장된다.

      핵심 개념:
      `>`, `<`, `>=`, `<=`, `==`, `!=`는 관계 연산자이다.
      관계 연산의 결과는 참이면 정수 1, 거짓이면 정수 0이다.
      관계 연산자는 대입 연산자보다 우선순위가 높아 `b=a>2`는 `b=(a>2)`로 계산된다.
      따라서 비교 결과가 그대로 정수 변수에 저장되어 출력된다.
    tags: [y2014, y2018]

  - id: b03-09
    type: multiple-choice
    chapter: 3
    passageRefs: [gcp029-conditional-code]
    prompt: 다음 프로그램의 출력 결과로 올바른 것은?
    choices:
      - { id: '1', text: 'b=9' }
      - { id: '2', text: 'b=10' }
      - { id: '3', text: 'b=14' }
      - { id: '4', text: 'b=15' }
    answers: ['1']
    explanation: |
      선택지 1: a=10이므로 `a>15`는 거짓이고, 조건 연산자는 뒤쪽 식 `a-1`을 계산해 b=9가 된다.
      선택지 2: b에 a의 값이 그대로 들어가는 경우로, 조건 연산자는 반드시 `a+1`이나 `a-1` 중 하나를 계산한다.
      선택지 3: 조건 연산의 결과는 11 또는 9뿐이므로 14는 나올 수 없다.
      선택지 4: 15는 조건식의 비교 기준값일 뿐 b에 대입되는 값이 아니다.

      핵심 개념:
      조건 연산자 `조건 ? 식1 : 식2`는 조건이 참이면 식1, 거짓이면 식2의 값을 결과로 한다.
      if~else 문을 하나의 식으로 줄여 쓸 수 있는 삼항 연산자이다.
      10>15는 거짓이므로 `(a-1)`이 선택되어 9가 b에 대입된다.
      조건식은 관계 연산 결과(1 또는 0)에 따라 두 식 중 하나만 평가한다.
    tags: [y2014, y2015, y2016, y2017, y2019]

  - id: b03-10
    type: multiple-choice
    chapter: 3
    passageRefs: [gcp030-logical-code]
    prompt: 다음 프로그램이 실행된 후 출력되는 값으로 올바른 것은?
    choices:
      - { id: '1', text: 'c=0 d=0' }
      - { id: '2', text: 'c=0 d=1' }
      - { id: '3', text: 'c=1 d=0' }
      - { id: '4', text: 'c=1 d=1' }
    answers: ['2']
    explanation: |
      선택지 1: `a<5`가 참(1)이므로 OR 연산 `a<5||b<=7`은 1이 되어 d=0이 될 수 없다.
      선택지 2: `a<2`(4<2)는 거짓이므로 `a<2&&b>=8`은 0이 되어 c=0, `a<5`(4<5)가 참이므로 `a<5||b<=7`은 1이 되어 d=1이다.
      선택지 3: AND 연산은 두 조건이 모두 참이어야 1인데 `a<2`와 `b>=8`이 모두 거짓이므로 c=1이 될 수 없다.
      선택지 4: c는 AND 연산 결과로 0이므로 c=1이 될 수 없다.

      핵심 개념:
      관계 연산자(`<`, `>=`, `<=` 등)는 논리 연산자(`&&`, `||`)보다 우선순위가 높아 비교가 먼저 계산된다.
      `&&`는 두 피연산자가 모두 참일 때만 1, `||`는 하나라도 참이면 1이다.
      `&&`는 왼쪽이 거짓이면, `||`는 왼쪽이 참이면 오른쪽을 계산하지 않고 결과를 정한다.
      따라서 c는 0, d는 1이 출력된다.
    tags: [y2017]

  - id: b04-01
    type: multiple-choice
    chapter: 3
    prompt: 다음 중 문자열의 입출력에 사용되는 함수가 ==아닌== 것은?
    choices:
      - { id: '1', text: 'puts( )' }
      - { id: '2', text: 'gets( )' }
      - { id: '3', text: 'scanf( )' }
      - { id: '4', text: 'strings( )' }
    answers: ['4']
    explanation: |
      선택지 1: `puts()`는 문자열을 화면에 출력하고 줄을 바꾸는 문자열 출력 함수이다.
      선택지 2: `gets()`는 키보드로부터 한 줄의 문자열을 입력받는 문자열 입력 함수이다.
      선택지 3: `scanf()`는 `%s` 변환 기호를 사용해 문자열을 입력받을 수 있는 서식 입력 함수이다.
      선택지 4: `strings()`는 C 표준 입출력 함수가 아니므로 문자열 입출력 함수가 아니다.

      핵심 개념:
      문자열 입력 함수에는 `gets()`, `scanf("%s", ...)`가 있다.
      문자열 출력 함수에는 `puts()`, `printf("%s", ...)`가 있다.
      `gets()`/`puts()`는 문자열 전용 함수이고, `scanf()`/`printf()`는 서식을 지정하는 범용 입출력 함수이다.
      이 함수들의 원형은 `stdio.h` 헤더 파일에 선언되어 있다.
    tags: [y2016]

  - id: b04-02
    type: multiple-choice
    chapter: 3
    passageRefs: [gcp032-format-code]
    prompt: 다음 프로그램의 ㉠, ㉡, ㉢에서 각각 10진수, 8진수, 16진수를 출력하려고 한다. 출력 양식 변환기호가 순서대로 올바르게 나열된 것은?
    choices:
      - { id: '1', text: '%d, %f, %e' }
      - { id: '2', text: '%d, %o, %x' }
      - { id: '3', text: '%c, %e, %d' }
      - { id: '4', text: '%e, %f, %g' }
    answers: ['2']
    explanation: |
      선택지 1: `%d`는 10진 정수이지만 `%f`는 소수점 형식 실수, `%e`는 지수 형식 실수 변환기호이다.
      선택지 2: `%d`는 10진수, `%o`는 8진수, `%x`는 16진수 정수를 출력하는 변환기호이다. 8086은 각각 8086, 17626, 1f96으로 출력된다.
      선택지 3: `%c`는 한 문자, `%e`는 지수 형식 실수를 출력하며, `%d`는 10진수이므로 순서와 진법이 맞지 않는다.
      선택지 4: `%e`, `%f`, `%g`는 모두 실수 출력용 변환기호이다.

      핵심 개념:
      printf의 정수 변환기호는 `%d`(부호 있는 10진수), `%o`(8진수), `%x`(16진수), `%u`(부호 없는 10진수)이다.
      실수 변환기호는 `%f`(소수점 형식), `%e`(지수 형식), `%g`(둘 중 짧은 형식)이다.
      `%c`는 한 문자, `%s`는 문자열을 출력한다.
      같은 정수라도 변환기호에 따라 다른 진법으로 표현되어 출력된다.
    tags: [y2016, y2019]

  - id: b04-03
    type: multiple-choice
    chapter: 3
    prompt: 다음 중 대입 연산자의 사용 예와 기능을 ==잘못== 연결한 것은?
    choices:
      - { id: '1', text: 'A+=10 ← A의 값에 10을 더한 후 결과를 A에 저장' }
      - { id: '2', text: 'A%=10 ← A의 값을 10으로 나눈 후 그 나머지를 A에 저장' }
      - { id: '3', text: 'A≫=3 ← A의 값을 3비트 오른쪽으로 이동한 후 결과를 A에 저장' }
      - { id: '4', text: 'A&=10 ← A의 값과 10에 대해 비트 단위의 OR 연산을 한 후 결과를 A에 저장' }
    answers: ['4']
    explanation: |
      선택지 1: `A+=10`은 `A=A+10`과 같아 올바른 연결이다.
      선택지 2: `A%=10`은 `A=A%10`과 같아 나머지를 A에 저장하므로 올바른 연결이다.
      선택지 3: `A>>=3`은 `A=A>>3`과 같아 A를 3비트 오른쪽으로 이동한 결과를 저장하므로 올바른 연결이다.
      선택지 4: `&=`는 비트 단위 AND 연산 후 저장하는 연산자이다. 비트 단위 OR 연산 후 저장하는 연산자는 `|=`이므로 잘못된 연결이다.

      핵심 개념:
      복합 대입 연산자 `A op= B`는 `A = A op B`와 같다.
      산술 복합 대입 연산자에는 `+=`, `-=`, `*=`, `/=`, `%=`가 있다.
      비트 복합 대입 연산자에는 `&=`(AND), `|=`(OR), `^=`(XOR), `<<=`, `>>=`(이동)가 있다.
      연산 결과는 왼쪽 피연산자 변수에 다시 저장된다.

  - id: b04-04
    type: multiple-choice
    chapter: 3
    passageRefs: [gcp034-if-else-code]
    prompt: 다음 프로그램을 조건 연산자를 사용하여 바꾼다면 가장 올바른 것은?
    choices:
      - { id: '1', text: 'x=(a>10; a*100 : a*200);' }
      - { id: '2', text: 'x=(a>10; a*200 : a*100);' }
      - { id: '3', text: 'x=(a>10? a*100 : a*200);' }
      - { id: '4', text: 'x=(a>10? a*200 : a*100);' }
    answers: ['3']
    explanation: |
      선택지 1: 조건 연산자는 `?`와 `:`로 구성되며 `;`는 문장의 끝을 나타내므로 조건 연산자 문법이 아니다.
      선택지 2: `;`를 사용해 문법이 틀렸고, 참과 거짓일 때의 식도 서로 바뀌었다.
      선택지 3: 조건 `a>10`이 참이면 `a*100`, 거짓이면 `a*200`을 x에 대입하므로 주어진 if~else 문과 같다.
      선택지 4: 문법은 맞지만 참일 때 `a*200`, 거짓일 때 `a*100`이 대입되어 원래 프로그램과 반대이다.

      핵심 개념:
      조건 연산자는 `조건 ? 참일 때의 식 : 거짓일 때의 식` 형식의 삼항 연산자이다.
      `if(조건) x=식1; else x=식2;`는 `x=(조건 ? 식1 : 식2);`로 바꿔 쓸 수 있다.
      `?` 앞의 조건이 참(0이 아닌 값)이면 `:` 앞의 식, 거짓(0)이면 `:` 뒤의 식이 결과가 된다.
      간단한 양자택일 대입을 한 문장으로 표현할 때 사용한다.
    tags: [y2016, y2017, y2018]

  - id: b04-05
    type: multiple-choice
    chapter: 4
    prompt: for, while, do～while 루프 실행 중 루프를 다시 실행하고자 할 때, 루프를 빠져나오는 것이 아니라 그 루프의 선두로 다시 제어를 옮기는 기능을 가진 명령어는?
    choices:
      - { id: '1', text: 'for' }
      - { id: '2', text: 'return' }
      - { id: '3', text: 'continue' }
      - { id: '4', text: 'break' }
    answers: ['3']
    explanation: |
      선택지 1: `for`는 반복문 자체를 만드는 명령어이지 루프 안에서 제어를 선두로 옮기는 명령어가 아니다.
      선택지 2: `return`은 함수의 실행을 끝내고 호출한 곳으로 제어를 되돌리는 명령어이다.
      선택지 3: `continue`는 루프의 나머지 부분을 건너뛰고 루프의 선두(조건 검사나 증감식)로 제어를 옮겨 반복을 계속한다.
      선택지 4: `break`는 루프를 완전히 빠져나오는 명령어로, 문제의 설명과 반대이다.

      핵심 개념:
      `continue`는 현재 반복의 남은 문장을 건너뛰고 다음 반복을 진행한다.
      for 문에서는 증감식으로, while·do~while 문에서는 조건식 검사로 제어가 이동한다.
      `break`는 가장 가까운 루프나 switch 문을 빠져나온다.
      두 명령어 모두 반복의 흐름을 바꾸지만 루프 유지 여부가 다르다.

  - id: b04-06
    type: multiple-choice
    chapter: 4
    passageRefs: [gcp036-nested-if-code]
    prompt: 다음 프로그램의 출력 결과로 올바른 것은?
    choices:
      - { id: '1', text: '첫 번째 if' }
      - { id: '2', text: '두 번째 if' }
      - { id: '3', text: '세 번째 if' }
      - { id: '4', text: '두 번째 if 세 번째 if' }
    answers: ['2']
    explanation: |
      선택지 1: "첫 번째 if"는 a가 0일 때 출력되는데 a=10이므로 `a==0`은 거짓이다.
      선택지 2: `a>=0`은 참이므로 안쪽 if로 들어가고, `a==0`은 거짓이므로 안쪽 else의 "두 번째 if"가 출력된다.
      선택지 3: "세 번째 if"는 바깥 조건 `a>=0`이 거짓일 때 출력되는데 10>=0은 참이다.
      선택지 4: if~else 문은 조건에 따라 한 쪽만 실행되므로 두 문장이 함께 출력되지 않는다.

      핵심 개념:
      if 문 안에 다른 if 문이 들어간 구조를 중첩 if 문이라 한다.
      바깥 조건이 참일 때만 안쪽 if~else가 실행된다.
      else는 짝이 없는 가장 가까운 if와 결합한다.
      실행 경로는 조건을 바깥에서 안쪽 순서로 차례로 판단해 결정한다.
    tags: [y2016, y2018]

  - id: b04-07
    type: multiple-choice
    chapter: 4
    passageRefs: [gcp037-dangling-else-code]
    prompt: 다음 프로그램의 출력 결과로 올바른 것은?
    choices:
      - { id: '1', text: '0' }
      - { id: '2', text: '3' }
      - { id: '3', text: '4' }
      - { id: '4', text: '7' }
    answers: ['3']
    explanation: |
      선택지 1: 0은 `i=i-j`가 실행될 때의 값인데, 그 else는 안쪽 `if(i==4)`에 속하므로 바깥 if의 조건(i가 3인지)이 거짓인 이상 실행되지 않는다.
      선택지 2: 3은 조건식의 비교값일 뿐 i에 대입된 적이 없다.
      선택지 3: i=4이므로 바깥 `if(i==3)`이 거짓이 되어 안쪽 if~else 전체가 건너뛰어지고, 마지막 printf만 실행되어 4가 출력된다.
      선택지 4: 7은 i+j(8)나 i-j(0) 어느 쪽과도 맞지 않는 값이며, 바깥 조건이 거짓이므로 i는 4 그대로 출력된다.

      핵심 개념:
      else는 들여쓰기와 관계없이 짝이 없는 가장 가까운 if와 결합한다.
      따라서 이 프로그램의 else는 안쪽 `if(i==4)`의 else이고, 두 문장 모두 바깥 if 문에 종속된다.
      `i=j=4`는 오른쪽부터 대입되어 i와 j가 모두 4가 된다.
      바깥 조건이 거짓이면 안쪽 if~else는 전혀 실행되지 않는다.
    tags: [y2014, y2017, y2019]

  - id: b04-08
    type: multiple-choice
    chapter: 4
    prompt: 다음 중 특정 동작을 반복하기 위해 사용되는 명령어로서 적절하지 ==않은== 것은?
    choices:
      - { id: '1', text: 'goto' }
      - { id: '2', text: 'do ~ while' }
      - { id: '3', text: 'whlie' }
      - { id: '4', text: 'for' }
    answers: ['1']
    explanation: |
      선택지 1: `goto`는 지정한 레이블로 제어를 옮기는 무조건 분기 명령으로, 반복문이 아니다. 주로 여러 겹 중첩된 루프를 한 번에 빠져나올 때 사용된다.
      선택지 2: `do ~ while`은 문장을 먼저 한 번 실행한 뒤 조건을 검사해 반복하는 반복문이다.
      선택지 3: while 문은 조건을 먼저 검사하고 참인 동안 반복하는 반복문이다.
      선택지 4: `for`는 초기식, 조건식, 증감식을 사용해 정해진 횟수만큼 반복할 때 주로 쓰는 반복문이다.

      핵심 개념:
      C 언어의 반복문에는 for, while, do~while이 있다.
      while과 for는 조건을 먼저 검사하고, do~while은 최소 한 번 실행한 뒤 조건을 검사한다.
      goto는 무조건 분기 명령으로 프로그램 흐름을 복잡하게 만들어 사용을 권장하지 않는다.
      반복 제어에는 break와 continue를 함께 사용한다.

      ※ 원본 표기: 선택지 "whlie"는 원본에 그렇게 인쇄되어 있으며 while 문을 가리킨다.
    tags: [y2017]

  - id: b04-09
    type: multiple-choice
    chapter: 4
    passageRefs: [gcp039-nested-for-code]
    prompt: 다음 프로그램의 출력 결과로 올바른 것은?
    choices:
      - { id: '1', text: '36' }
      - { id: '2', text: '40' }
      - { id: '3', text: '45' }
      - { id: '4', text: '45' }
    answers: ['2']
    explanation: |
      선택지 1: 바깥 루프는 a=0~9로 10번, 안쪽 루프는 4번 반복하므로 실행 횟수는 40이며 36과 다르다.
      선택지 2: 바깥 for는 a=0~9로 10번, 안쪽 for는 b=5, 4, 3, 2로 4번 반복하므로 `sum+=1`이 10×4=40번 실행되어 40이 출력된다.
      선택지 3: 안쪽 루프는 b>1인 동안만 반복하므로 b=1일 때는 실행되지 않아 실행 횟수는 10×4=40이며 45와 다르다.
      선택지 4: 45는 실행 횟수 10×4=40과 다르다.

      핵심 개념:
      중첩 for 문의 안쪽 문장 실행 횟수는 바깥 반복 횟수 × 안쪽 반복 횟수이다.
      `for(a=0; a<10; a++)`는 0부터 9까지 10번 반복한다.
      `for(b=5; b>1; b--)`는 b가 5, 4, 3, 2일 때 4번 반복한다.
      반복 횟수는 초기값, 조건식의 경계, 증감 방향을 함께 보고 센다.

      ※ 원본 표기: 코드의 `sum+=1` 뒤에 세미콜론이 빠져 있고, 선택지 두 개가 모두 45로 인쇄되어 있다.
    tags: [y2015, y2016, y2017, y2019]

  - id: b04-10
    type: multiple-choice
    chapter: 4
    passageRefs: [gcp040-switch-code]
    prompt: 다음과 같은 프로그램의 실행 결과로서 올바른 것은?
    choices:
      - { id: '1', text: '나머지는 1' }
      - { id: '2', text: '나머지는 1 나머지는 2' }
      - { id: '3', text: '나머지는 2' }
      - { id: '4', text: '나머지는 2 나머지는 3이나 4' }
    answers: ['3']
    explanation: |
      선택지 1: 12%5는 2이므로 case 1이 아니라 case 2부터 실행된다.
      선택지 2: 실행은 일치하는 case 2에서 시작하므로 그 앞의 case 1 문장은 실행되지 않는다.
      선택지 3: n%5=2이므로 case 2의 "나머지는 2"가 출력되고 바로 다음의 break로 switch 문을 빠져나온다.
      선택지 4: case 2 다음에 break가 있으므로 default의 문장까지 이어서 실행되지 않는다.

      핵심 개념:
      switch 문은 식의 값과 일치하는 case 레이블로 이동해 그 위치부터 실행한다.
      break를 만나기 전까지는 아래쪽 case의 문장도 이어서 실행된다.
      일치하는 case가 없으면 default의 문장이 실행된다.
      이 프로그램에서 0, 1, 2 이외의 나머지(3, 4)일 때만 default가 실행된다.
    tags: [y2014, y2015, y2016, y2017]

  - id: b05-01
    type: multiple-choice
    chapter: 4
    passageRefs: [gcp041-for-puts-code]
    prompt: 다음 문장이 완전히 수행되었을 때 x는 몇 번 출력되는가?
    choices:
      - { id: '1', text: '5' }
      - { id: '2', text: '10' }
      - { id: '3', text: '36' }
      - { id: '4', text: '50' }
    answers: ['4']
    explanation: |
      선택지 1: 5는 안쪽 for 문의 반복 횟수일 뿐이고, 바깥 for 문이 10번 반복되므로 전체 출력 횟수는 50이다.
      선택지 2: 10은 바깥 for 문의 반복 횟수일 뿐이고, 한 번마다 안쪽 for 문이 5번 반복되므로 전체 출력 횟수는 50이다.
      선택지 3: 36은 두 반복 횟수의 곱과 맞지 않는 값이다.
      선택지 4: 바깥 for는 x=0~9로 10번, 안쪽 for는 y=5, 4, 3, 2, 1로 5번 반복하므로 `puts`가 10×5=50번 실행된다.

      핵심 개념:
      중첩 반복문에서 안쪽 문장은 바깥 반복마다 안쪽 반복 횟수만큼 실행된다.
      `for(x=0; x<10; x++)`는 10번, `for(y=5; y>0; y--)`는 5번 반복한다.
      따라서 전체 실행 횟수는 10×5=50번이다.
      `puts()`는 문자열을 출력하고 자동으로 줄을 바꾼다.

