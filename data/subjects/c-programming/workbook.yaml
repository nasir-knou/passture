  - id: b09-07
    type: multiple-choice
    chapter: 7
    passageRefs: [gcp087-union-var-code]
    prompt: 다음과 같은 공용체가 선언되어 있을 때 공용체 변수 참조 방법으로 올바른 것은?
    choices:
