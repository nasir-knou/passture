questions:
  - id: e19-01
    type: multiple-choice
    chapter: 1
    prompt: 다음 중 원시 프로그램이 번역되어 실행될 때의 파일 확장자로서 올바른 것은?
    choices:
      - { id: '1', text: 'example.exe' }
      - { id: '2', text: 'example.obj' }
      - { id: '3', text: 'example.doc' }
      - { id: '4', text: 'example.c' }
    answers: ['1']
    explanation: |
      선택지 1: 원시 프로그램(.c)을 컴파일하고 링크까지 마치면 운영체제가 바로 실행할 수 있는 실행 파일 .exe가 만들어진다. 정답이다.
      선택지 2: .obj는 컴파일러가 만든 목적 파일(object file)로, 라이브러리와 링크하기 전의 중간 결과라서 그대로 실행되지 않는다.
      선택지 3: .doc는 문서 편집기의 문서 파일 확장자로 C 프로그램 번역 과정과 관계없다.
      선택지 4: .c는 프로그래머가 작성한 원시 프로그램(source program) 파일 자체이며 번역 전 단계이다.

      핵심 개념:
      C 프로그램은 편집 → 컴파일 → 링크 → 실행 순으로 처리된다.
      원시 파일(.c)을 컴파일하면 목적 파일(.obj)이 생긴다.
      목적 파일을 라이브러리와 링크하면 실행 파일(.exe)이 생긴다.
      실행 단계에서 사용하는 것은 실행 파일이다.

  - id: e19-02
    type: multiple-choice
    chapter: 2
    prompt: 다음 중 상수에 대한 설명으로 올바르지 ==않는== 것은?
    choices:
      - { id: '1', text: '8진 상수를 표현할 때는 숫자 앞에 0(영)을 붙인다.' }
      - { id: '2', text: '16진 상수를 표현할 때는 숫자 앞에 0x를 붙인다.' }
      - { id: '3', text: '문자형 상수는 내부적으로 정수 값이 사용된다.' }
      - { id: '4', text: '실수형 상수는 지수형식으로 표시할 수 없다.' }
    answers: ['4']
    explanation: |
      선택지 1: 017처럼 숫자 앞에 0을 붙이면 8진 상수로 해석되므로 올바른 설명이다.
      선택지 2: 0x1F처럼 0x(또는 0X)를 붙이면 16진 상수가 되므로 올바른 설명이다.
      선택지 3: 'A' 같은 문자형 상수는 내부적으로 ASCII(American Standard Code for Information Interchange) 코드 값 65 같은 정수로 저장·연산되므로 올바른 설명이다.
      선택지 4: 실수형 상수는 3.14 같은 소수점 형식뿐 아니라 1.5e3, 2.0E-4 같은 지수 형식으로도 표시할 수 있으므로 틀린 설명이다. 정답이다.

      핵심 개념:
      정수 상수는 10진(접두어 없음), 8진(0), 16진(0x)으로 표현한다.
      문자 상수는 작은따옴표로 쓰며 값은 문자 코드 정수이다.
      실수 상수는 소수점 형식과 지수 형식(e/E) 모두 가능하다.
      문자열 상수는 큰따옴표로 쓰며 끝에 널 문자가 붙는다.

  - id: e19-03
    type: multiple-choice
    chapter: 3
    passageRefs: [g19-char-intro-01, g19-char-code-01]
    prompt: 위에서 ㉠의 결과로 올바른 것은?
    choices:
      - { id: '1', text: 'var1 = 65   var2 = A' }
      - { id: '2', text: 'var1 = a    var2 = 65' }
      - { id: '3', text: 'var1 = a    var2 = A' }
      - { id: '4', text: 'var1 = 65   var2 = 65' }
    answers: ['1']
    explanation: |
      선택지 1: var에는 'A'의 코드값 65가 저장된다. %d는 이를 정수 65로, %c는 문자 A로 출력하므로 var1=65 var2=A가 된다. 정답이다.
      선택지 2: %d는 정수 변환이므로 문자 a가 나올 수 없고, %c는 문자 변환이므로 65라는 숫자가 나오지 않는다.
      선택지 3: var1은 %d로 출력되어 65가 나오며, 변수에 저장된 문자는 소문자 a가 아니라 대문자 A이다.
      선택지 4: var2는 %c로 출력되므로 숫자 65가 아니라 문자 A로 출력된다.

      핵심 개념:
      char 변수는 문자 코드를 정수로 저장한다.
      같은 값도 %d로 출력하면 코드값, %c로 출력하면 문자가 된다.
      'A'의 ASCII 코드는 65이다.
      printf의 변환 문자가 출력 모양을 결정한다.

  - id: e19-04
    type: multiple-choice
    chapter: 3
    passageRefs: [g19-char-intro-01, g19-char-code-01]
    prompt: 위에서 ㉡의 결과로 올바른 것은?
    choices:
      - { id: '1', text: '65' }
      - { id: '2', text: '67' }
      - { id: '3', text: 'A' }
      - { id: '4', text: 'C' }
    answers: ['4']
    explanation: |
      선택지 1: 65는 'A'의 코드값이며, var+2는 67이고 putchar는 숫자가 아닌 문자를 출력하므로 65가 나오지 않는다.
      선택지 2: var+2의 값은 67이지만 putchar는 인수를 문자 코드로 보고 문자 한 개를 출력하므로 숫자 67이 출력되지 않는다.
      선택지 3: A는 var 자체의 문자이며 2를 더한 값이 아니다.
      선택지 4: var+2=65+2=67이고, putchar(67)은 코드 67에 해당하는 문자 C를 출력한다. 정답이다.

      핵심 개념:
      putchar(c)는 정수 c를 문자 코드로 보고 문자 하나를 표준 출력에 쓴다.
      문자에 정수를 더하면 코드값 연산이 된다.
      'A'+2는 67이며 문자로는 'C'이다.
      문자 출력 함수는 숫자 문자열이 아니라 해당 문자를 출력한다.

  - id: e19-05
    type: multiple-choice
    chapter: 3
    passageRefs: [g19-format-code-01]
    prompt: 다음 프로그램의 ㉠, ㉡, ㉢에서 각각 10진수, 8진수, 16진수를 출력하려고 한다. 출력양식변환기호가 순서대로 올바르게 나열된 것은?
    choices:
      - { id: '1', text: '%d, %f, %e' }
      - { id: '2', text: '%d, %o, %x' }
      - { id: '3', text: '%c, %e, %d' }
      - { id: '4', text: '%e, %f, %g' }
    answers: ['2']
    explanation: |
      선택지 1: %d는 10진 정수이지만 %f는 소수점 형식 실수, %e는 지수 형식 실수 변환이므로 8진·16진 출력이 아니다.
      선택지 2: %d는 10진 정수, %o는 8진 정수(octal), %x는 16진 정수(hexadecimal) 출력이므로 순서가 모두 맞다. 정답이다.
      선택지 3: %c는 문자 한 개, %e는 지수 형식 실수 출력이며, %d는 10진이므로 요구한 순서와 다르다.
      선택지 4: %e, %f, %g는 모두 실수 출력 변환(지수형, 소수점형, 둘 중 짧은 형식)이라 정수의 진법 출력과 관계없다.

      핵심 개념:
      정수 출력: %d(10진), %o(8진), %x/%X(16진).
      실수 출력: %f(소수점형), %e(지수형), %g(짧은 쪽 자동 선택).
      문자 %c, 문자열 %s를 출력한다.
      진법만 바꿔 출력해도 저장된 값은 같다.

  - id: e19-06
    type: multiple-choice
    chapter: 5
    passageRefs: [g19-scope-code-01]
    prompt: 다음과 같은 프로그램의 실행결과로서 올바른 것은?
    choices:
      - { id: '1', text: 'a = 5    b = 15' }
      - { id: '2', text: 'a = 5    b = 20' }
      - { id: '3', text: 'a = 10   b = 15' }
      - { id: '4', text: 'a = 10   b = 20' }
    answers: ['3']
    explanation: |
      선택지 1: a=5는 안쪽 블록에서만 유효한 지역 변수이다. 블록이 끝나면 사라지므로 printf의 a는 바깥 a=10이다.
      선택지 2: a도 5가 아니고, b도 안쪽 블록의 b=a+10;에서 5+10=15로 바뀌었으므로 20이 아니다.
      선택지 3: 안쪽 블록의 b=a+10;에서 a는 안쪽 a=5이므로 b=15가 되고, b는 새로 선언되지 않아 바깥 b가 바뀐다. 블록 밖 printf의 a는 바깥 a=10이므로 a=10, b=15이다. 정답이다.
      선택지 4: a=10은 맞지만 b는 블록 안에서 15로 대입되었으므로 초기값 20이 그대로 남지 않는다.

      핵심 개념:
      블록 안에서 같은 이름으로 선언한 변수는 바깥 변수를 가린다.
      블록 안에서 선언되지 않은 이름은 바깥 변수를 가리킨다.
      안쪽 지역 변수는 블록이 끝나면 소멸한다.
      static 변수도 대입하면 값이 바뀐다.

  - id: e19-07
    type: multiple-choice
    chapter: 3
    passageRefs: [g19-ternary-code-01]
    prompt: 다음과 같은 프로그램의 실행결과로서 올바른 것은?
    choices:
      - { id: '1', text: 'a = 20   b = 21' }
      - { id: '2', text: 'a = 2   b = 9' }
      - { id: '3', text: 'a = 20   b = 9' }
      - { id: '4', text: 'a = 29  b = 11' }
    answers: ['1']
    explanation: |
      선택지 1: a*=(b-1);은 a=a*(b-1)=10*2=20이다. (a>15)는 20>15로 참이므로 b=a+1=21이 되어 a=20 b=21이다. 정답이다.
      선택지 2: a*=(b-1);은 a=a*(b-1)=10*2=20이므로 a는 2가 아니다. b도 조건이 참이라 21이 되므로 9가 아니다.
      선택지 3: a=20은 맞지만 20>15가 참이므로 b=a+1=21이다. b=9가 되려면 조건이 거짓이어야 하는데 그렇지 않다.
      선택지 4: a=29는 a*=(b-1)을 올바르게 계산한 값이 아니며, b=11도 조건 연산 결과와 맞지 않는다.

      핵심 개념:
      a *= x는 a = a * x와 같다.
      조건 연산자 (조건)? 식1 : 식2 는 조건이 참이면 식1, 거짓이면 식2의 값을 갖는다.
      문장은 위에서 아래로 차례대로 실행되므로 앞에서 바뀐 a가 조건에 쓰인다.
      괄호 안 b-1이 먼저 계산된다.

  - id: e19-08
    type: multiple-choice
    chapter: 4
    passageRefs: [g19-nested-if-code-01]
    prompt: 다음 프로그램의 출력결과로 올바른 것은?
    choices:
      - { id: '1', text: '0' }
      - { id: '2', text: '3' }
      - { id: '3', text: '4' }
      - { id: '4', text: '7' }
    answers: ['3']
    explanation: |
      선택지 1: 0은 else의 i=i-j가 실행된 경우이다. else는 가장 가까운 안쪽 if에 짝지어지고, 바깥 if(i==3)이 거짓이라 안쪽 if·else 전체가 건너뛰어지므로 실행되지 않는다.
      선택지 2: 3은 비교식 i==3의 상수일 뿐 i에 대입된 적이 없다.
      선택지 3: i=j=4이므로 i==3이 거짓이고 안쪽 if-else 전체가 실행되지 않는다. 마지막 printf("\n%d", i);만 실행되어 4가 출력된다. 정답이다.
      선택지 4: 7은 i와 j(4) 어느 연산으로도 만들어지지 않는 값이며, i=i+j(8)도 바깥 조건이 거짓이라 실행되지 않는다.

      핵심 개념:
      else는 짝이 없는 가장 가까운 if와 짝지어진다(dangling else).
      바깥 if가 거짓이면 그 안의 if-else 문 전체를 건너뛴다.
      i=j=4는 오른쪽부터 대입되어 둘 다 4가 된다.
      ==는 비교, =는 대입이다.

  - id: e19-09
    type: multiple-choice
    chapter: 5
    passageRefs: [g19-block-scope-code-01]
    prompt: 다음과 같은 프로그램의 실행결과로서 올바른 것은?
    choices:
      - { id: '1', text: 'i = 3    i = 1' }
      - { id: '2', text: 'i = 4    i = 1' }
      - { id: '3', text: 'i = 4    i = 3' }
      - { id: '4', text: 'i = 4    i = 4' }
    answers: ['1']
    explanation: |
      선택지 1: 첫 printf는 i=3이 선언된 블록 안에 있고, i=4는 그 안쪽 블록이 끝나며 사라졌으므로 i=3이 출력된다. 두 번째 printf는 main 수준 블록에 있어 i=1이 출력된다. 정답이다.
      선택지 2: i=4는 가장 안쪽 블록에서만 유효하므로 첫 printf 위치에서는 보이지 않는다.
      선택지 3: 첫 출력도 4가 아니고, 두 번째 printf 위치에서는 i=3 블록이 이미 끝났으므로 3이 아니다.
      선택지 4: 두 printf 모두 i=4가 선언된 블록 밖에 있으므로 4가 출력되지 않는다.

      핵심 개념:
      변수의 유효 범위는 선언된 블록 { } 안으로 한정된다.
      안쪽 블록의 같은 이름 변수가 바깥 변수를 가린다.
      블록을 벗어나면 바깥 변수가 다시 보인다.
      printf 위치가 어느 블록에 속하는지로 참조 변수를 판정한다.

  - id: e19-10
    type: multiple-choice
    chapter: 4
    passageRefs: [g19-nested-for-code-01]
    prompt: 다음 프로그램의 출력결과로 올바른 것은?
    choices:
      - { id: '1', text: '36' }
      - { id: '2', text: '40' }
      - { id: '3', text: '45' }
      - { id: '4', text: '50' }
    answers: ['2']
    explanation: |
      선택지 1: 바깥 for는 a=0~9로 10회, 안쪽 for는 4회 반복하므로 sum은 10×4=40이며 36이 아니다.
      선택지 2: 바깥 for는 a=0~9로 10회, 안쪽 for는 b=5,4,3,2로 b>1인 동안 4회 반복한다. sum+=1이 10×4=40회 실행되고, 중괄호가 없으므로 printf는 루프가 끝난 뒤 한 번 실행되어 40이 출력된다. 정답이다.
      선택지 3: 45는 0부터 9까지의 합과 같은 값으로, sum에 1씩 더한 횟수(10×4)와 관계없다.
      선택지 4: 50은 안쪽 루프를 b=5~1의 5회로 센 경우로, 조건이 b>1이라 b=1에서는 실행되지 않는다.

      핵심 개념:
      중첩 루프의 실행 횟수는 바깥 횟수 × 안쪽 횟수이다.
      for(b=5; b>1; b--)는 b=5,4,3,2의 4회 반복한다.
      중괄호 없는 for는 바로 다음 한 문장만 반복한다.
      들여쓰기는 실행 구조에 영향을 주지 않는다.

      ※ 원본 표기: sum+=1 뒤에 세미콜론이 빠져 있다(sum+=1; 이어야 컴파일되며 이때 40이 출력된다).

  - id: e19-11
    type: multiple-choice
    chapter: 6
    passageRefs: [g19-array2d-code-01]
    prompt: 다음과 같은 프로그램의 결과로 올바른 것은?
    choices:
      - { id: '1', text: '7' }
      - { id: '2', text: '8' }
      - { id: '3', text: '10' }
      - { id: '4', text: '12' }
    answers: ['4']
    explanation: |
      선택지 1: 7은 array[1][2]의 값(1×4+2=6번째 인덱스)이다.
      선택지 2: 8은 array[1][3]의 값이다.
      선택지 3: 10은 array[2][1]의 값이다.
      선택지 4: 초기값은 행 우선으로 채워져 array[2]는 {9, 10, 11, 12}이다. array[2][3]은 2×4+3=11번째 인덱스, 즉 12이다. 정답이다.

      핵심 개념:
      2차원 배열은 행 우선(row-major) 순서로 저장·초기화된다.
      array[i][j]의 위치는 i×열 수+j 번째이다.
      인덱스는 0부터 시작한다.
      안쪽 중괄호 없이 초기화해도 순서대로 채워진다.

  - id: e19-12
    type: multiple-choice
    chapter: 1
    passageRefs: [g19-function-intro-01, g19-function-code-01]
    prompt: 위에서 설명문은 어느 부분인가?
    choices:
      - { id: '1', text: '㉡' }
      - { id: '2', text: '㉢' }
      - { id: '3', text: '㉣' }
      - { id: '4', text: '㉤' }
    answers: ['3']
    explanation: |
      선택지 1: ㉡ void display_line(void);는 함수의 원형 선언이다.
      선택지 2: ㉢ display_line();은 함수를 호출하는 문장이다.
      선택지 3: ㉣ /* print asterisk line */은 /*와 */ 사이에 쓴 설명문(주석)으로 컴파일러가 무시한다. 정답이다.
      선택지 4: ㉤ void display_line(void) {는 함수 정의의 머리 부분이다.

      핵심 개념:
      설명문(주석)은 /* ... */ 사이에 쓰며 실행되지 않는다.
      프로그램 이해를 돕기 위한 설명을 적는 용도이다.
      #include는 전처리기 지시자이다.
      원형 선언, 호출, 정의는 각각 형태가 다르다.

  - id: e19-13
    type: multiple-choice
    chapter: 5
    passageRefs: [g19-function-intro-01, g19-function-code-01]
    prompt: 위에서 사용자 정의 함수의 원형선언이 이루어지는 부분은 어디인가?
    choices:
      - { id: '1', text: '㉠' }
      - { id: '2', text: '㉡' }
      - { id: '3', text: '㉤' }
      - { id: '4', text: '㉥' }
    answers: ['2']
    explanation: |
      선택지 1: ㉠ #include <stdio.h>는 표준 입출력 헤더 파일을 포함시키는 전처리기 지시자이다.
      선택지 2: ㉡ void display_line(void);는 main보다 앞에서 반환형·이름·매개변수를 알리고 세미콜론으로 끝나는 함수 원형 선언이다. 정답이다.
      선택지 3: ㉤ void display_line(void) {는 중괄호로 본체가 이어지는 함수 정의이다.
      선택지 4: ㉥ int counter;는 함수 안의 지역 변수 선언이다.

      핵심 개념:
      함수 원형(prototype)은 반환형 함수명(매개변수형); 형태로 쓴다.
      호출보다 정의가 뒤에 있으면 원형을 먼저 선언한다.
      원형은 세미콜론으로 끝나고 본체가 없다.
      함수 정의는 머리 뒤에 { } 본체가 있다.

  - id: e19-14
    type: multiple-choice
    chapter: 5
    passageRefs: [g19-function-intro-01, g19-function-code-01]
    prompt: 위에서 사용자 정의 함수의 호출이 일어나는 부분은?
    choices:
      - { id: '1', text: '㉠' }
      - { id: '2', text: '㉡' }
      - { id: '3', text: '㉢' }
      - { id: '4', text: '㉣' }
    answers: ['3']
    explanation: |
      선택지 1: ㉠은 헤더 파일을 포함하는 전처리기 지시자로 함수 호출이 아니다.
      선택지 2: ㉡은 반환형이 붙은 함수 원형 선언이며 실행 시 함수를 부르지 않는다.
      선택지 3: ㉢ display_line();은 main 안에서 반환형 없이 함수명과 인수 목록으로 쓴 문장이므로 사용자 정의 함수 호출이다. 정답이다.
      선택지 4: ㉣은 주석(설명문)으로 실행되지 않는다.

      핵심 개념:
