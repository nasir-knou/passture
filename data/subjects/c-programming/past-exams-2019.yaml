      ※ (18~19) 다음과 같은 프로그램이 있을 때 물음에 답하시오.

  - id: g19-pointer-sum-code-01
    type: code
    language: c
    body: |
      #include <stdio.h>
      void main() {
            static int a[ ]={10, 20, 30, 40, 50};
            int *pt, b, c;
            pt=a;
            b=*pt + *(pt+2);
            pt=pt+2;
            c=*pt + *(pt+2);
              printf("b=%d\n", b); ----㉠
              printf("c=%d\n", c); ----㉡
      }

