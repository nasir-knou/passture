  - id: e19-23
    type: multiple-choice
    chapter: 8
    passageRefs: [g19-file-intro-01, g19-file-code-01]
    prompt: 위에서 빈칸 ㉠에 들어갈 내용으로 올바른 것은?
    choices:
      - { id: '1', text: '*fp' }
      - { id: '2', text: 'fopen' }
      - { id: '3', text: 'stdin' }
      - { id: '4', text: 'EOF' }
    answers: ['1']
    explanation: |
      선택지 1: 뒤에서 fp를 fopen의 반환값 저장, fgetc(fp), fclose(fp)에 쓰므로 fp는 FILE 포인터여야 한다. FILE *fp;로 선언해야 한다. 정답이다.
      선택지 2: fopen은 파일을 여는 함수 이름으로 변수 선언 자리에 올 수 없다.
      선택지 3: stdin은 표준 입력 스트림을 나타내는 이미 정의된 FILE 포인터로, 새 변수 fp를 선언하지 못한다.
      선택지 4: EOF는 파일 끝을 나타내는 상수(보통 -1)로 선언할 변수 이름이 아니다.

      핵심 개념:
      파일을 다루려면 FILE *fp;로 파일 포인터를 선언한다.
      fopen은 열린 파일의 FILE 포인터를 반환하고 실패하면 NULL을 반환한다.
      fgetc는 한 문자씩 읽고 파일 끝에서 EOF를 반환한다.
      작업이 끝나면 fclose로 파일을 닫는다.

