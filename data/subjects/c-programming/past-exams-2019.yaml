  - id: g19-scope-code-01
    type: code
    language: c
    body: |
      #include <stdio.h>
      void main() {
              int a=10;
              static int b=20;
              {
                      int a=5;
                      b=a+10;
              }
              printf("a=%d     b=%d\n", a, b);
      }

  - id: g19-ternary-code-01
    type: code
    language: c
    body: |
      #include <stdio.h>
      void main() {
          int a=10, b=3 ;
          a*=(b-1);
          b=(a>15)? (a+1):(a-1);
          printf("a=%d b=%d", a, b);
      }

  - id: g19-nested-if-code-01
    type: code
    language: c
    body: |
      #include<stdio.h>
      void main(){
         int i, j;
         i=j=4;
         if(i==3)
            if(i==4)
                printf("\n%d", i=i+j);
            else
                printf("\n%d", i=i-j);
         printf("\n%d", i);
      }

