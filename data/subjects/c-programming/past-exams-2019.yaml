      호출되면 제어가 함수 본체로 넘어갔다가 끝나면 돌아온다.
      선언·정의에는 반환형이 붙고 호출에는 붙지 않는다.
      같은 함수를 여러 번 호출할 수 있다.

  - id: e19-15
    type: multiple-choice
    chapter: 6
    passageRefs: [g19-string-array-code-01]
    prompt: 다음과 같은 배열을 선언할 때 배열의 크기는 어떻게 되는가?
    choices:
      - { id: '1', text: '11' }
      - { id: '2', text: '12' }
      - { id: '3', text: '13' }
      - { id: '4', text: '14' }
    answers: ['4']
    explanation: |
      선택지 1: 11은 공백을 뺀 영문자 수(HONG 4 + GIL 3 + DONG 4)로, 공백과 널 문자를 빠뜨렸다.
      선택지 2: 12는 문자 13개와 널 문자 1개를 합한 14와 다르다.
      선택지 3: 13은 공백 포함 문자열 길이이며, 문자열 끝의 널 문자 '\0'을 빠뜨렸다.
      선택지 4: "HONG GIL DONG"은 영문자 11개와 공백 2개로 13문자이고, 끝에 널 문자 '\0'이 자동으로 붙어 배열 크기는 14이다. 정답이다.

      핵심 개념:
      크기를 생략한 char 배열은 초기 문자열 길이 + 1로 크기가 정해진다.
      문자열 상수 끝에는 널 문자 '\0'이 자동 추가된다.
      공백도 문자 하나로 센다.
      strlen은 널 문자를 세지 않지만 sizeof는 센다.

  - id: e19-16
    type: multiple-choice
    chapter: 6
    prompt: 다음의 포인터에 대한 설명으로 올바르지 ==않은== 것은?
    choices:
      - { id: '1', text: '메모리를 정적으로 할당받을 수 있다.' }
      - { id: '2', text: '포인터는 변수의 주소값을 데이터로 받는다.' }
      - { id: '3', text: '자료의 개수가 가변적인 경우 배열보다 효율적이다.' }
      - { id: '4', text: '포인터는 배열의 요소를 다룰 수 있다.' }
    answers: ['1']
    explanation: |
      선택지 1: 포인터의 장점은 malloc 등으로 실행 중에 필요한 만큼 메모리를 동적으로 할당받아 다룰 수 있다는 것이다. 크기가 컴파일 때 고정되는 정적 할당은 배열의 특징이므로 포인터 설명으로 틀리다. 정답이다.
      선택지 2: 포인터 변수는 다른 변수의 주소를 값으로 저장하므로 올바른 설명이다.
      선택지 3: 자료 개수가 바뀌는 경우 포인터와 동적 할당으로 필요한 만큼만 확보할 수 있어 크기가 고정된 배열보다 효율적이므로 올바른 설명이다.
      선택지 4: 배열 이름은 시작 주소이므로 *(p+i)처럼 포인터로 배열 요소에 접근할 수 있어 올바른 설명이다.

      핵심 개념:
      포인터는 주소를 저장하는 변수이다.
      배열은 정적 할당, 포인터는 동적 할당과 함께 쓰여 기억공간을 유연하게 사용한다.
      a[i]와 *(a+i)는 같은 요소를 가리킨다.
      자료 개수가 가변적이면 포인터와 동적 할당이 유리하다.

  - id: e19-17
    type: multiple-choice
    chapter: 6
    passageRefs: [g19-string-pointer-array-code-01]
    prompt: 다음 프로그램의 실행결과로서 올바른 것은?
    choices:
      - { id: '1', text: 'Ko' }
      - { id: '2', text: 'KoreaNational' }
      - { id: '3', text: 'Open' }
      - { id: '4', text: 'KN' }
    answers: ['3']
    explanation: |
      선택지 1: Ko는 첫 문자열의 앞 두 글자로, names[2]는 문자 단위가 아니라 세 번째 문자열을 가리킨다.
      선택지 2: KoreaNational은 names[0]과 names[1]을 이어 붙인 모양이며 %s는 포인터 하나가 가리키는 문자열만 출력한다.
      선택지 3: names는 문자열 4개의 시작 주소를 담은 포인터 배열이고 names[2]는 0부터 세어 세 번째인 "Open"을 가리킨다. %s로 "Open"이 출력된다. 정답이다.
      선택지 4: KN은 각 문자열의 첫 글자를 모은 것으로 names[2]의 값과 관계없다.

      핵심 개념:
      char *names[4]는 문자열 주소 4개를 저장하는 포인터 배열이다.
      names[i]는 i번째 문자열의 시작 주소이다.
      %s는 주소부터 널 문자 전까지 출력한다.
      배열 인덱스는 0부터 시작한다.

  - id: e19-18
    type: multiple-choice
    chapter: 6
    passageRefs: [g19-pointer-sum-intro-01, g19-pointer-sum-code-01]
    prompt: 위에서 ㉠의 결과로서 올바른 것은?
    choices:
      - { id: '1', text: 'b = 10' }
      - { id: '2', text: 'b = 30' }
      - { id: '3', text: 'b = 40' }
      - { id: '4', text: 'b = 50' }
    answers: ['3']
    explanation: |
      선택지 1: 10은 *pt(a[0])만 본 값으로 *(pt+2)를 더하지 않았다.
      선택지 2: 30은 *(pt+2)=a[2]만의 값이다.
      선택지 3: pt=a;로 pt가 a[0]을 가리키므로 *pt=10, *(pt+2)=a[2]=30이고 b=10+30=40이다. 정답이다.
      선택지 4: 50은 a[4] 값이며 ㉠ 시점의 b 계산에는 쓰이지 않는다.

      핵심 개념:
      배열 이름은 첫 요소의 주소이므로 pt=a;는 pt가 a[0]을 가리키게 한다.
      *(pt+i)는 pt가 가리키는 위치에서 i번째 뒤 요소의 값이다.
      포인터에 정수를 더하면 요소 크기 단위로 이동한다.
      *pt는 가리키는 요소의 값이다.

  - id: e19-19
    type: multiple-choice
    chapter: 6
    passageRefs: [g19-pointer-sum-intro-01, g19-pointer-sum-code-01]
    prompt: 위에서 ㉡의 결과로서 올바른 것은?
    choices:
      - { id: '1', text: 'c = 30' }
      - { id: '2', text: 'c = 40' }
      - { id: '3', text: 'c = 50' }
      - { id: '4', text: 'c = 80' }
    answers: ['4']
    explanation: |
      선택지 1: 30은 이동 후 *pt(a[2])만의 값이다.
      선택지 2: 40은 ㉠에서 출력되는 b의 값(a[0]+a[2])이다.
      선택지 3: 50은 *(pt+2)=a[4]만의 값이다.
      선택지 4: pt=pt+2;로 pt가 a[2]를 가리키므로 *pt=30, *(pt+2)=a[4]=50이고 c=30+50=80이다. 정답이다.

      핵심 개념:
      pt=pt+2;는 포인터를 두 요소 뒤로 이동시킨다.
      이동 후의 *(pt+2)는 원래 기준으로 a[4]이다.
      포인터 연산은 현재 가리키는 위치를 기준으로 한다.
      배열 요소 접근 a[i]와 *(a+i)는 같다.

  - id: e19-20
    type: multiple-choice
    chapter: 6
    passageRefs: [g19-char-pointer-code-01]
    prompt: 다음과 같은 배열이 선언되어 있을 때 *(cp+2)의 값?
    choices:
      - { id: '1', text: 'c' }
      - { id: '2', text: 'o' }
      - { id: '3', text: 'm' }
      - { id: '4', text: 'p' }
    answers: ['3']
    explanation: |
      선택지 1: c는 *(cp+0), 즉 s[0]의 값이다.
      선택지 2: o는 *(cp+1), 즉 s[1]의 값이다.
      선택지 3: cp=s;로 cp가 "computer"의 첫 문자를 가리키므로 *(cp+2)는 s[2]인 'm'이다. 정답이다.
      선택지 4: p는 *(cp+3), 즉 s[3]의 값이다.

      핵심 개념:
      문자 배열 이름은 첫 문자의 주소이다.
      char 포인터에 i를 더하면 i문자 뒤를 가리킨다.
      *(cp+i)는 cp[i]와 같다.
      인덱스는 0부터 센다.

  - id: e19-21
    type: multiple-choice
    chapter: 7
    passageRefs: [g19-struct-person-code-01]
    prompt: 다음과 같은 구조체가 선언되어 있을 때 초기화 방법으로 알맞은 것은?
    choices:
      - { id: '1', text: 'person.x="홍길동";' }
      - { id: '2', text: "x.gender='M';" }
      - { id: '3', text: 'person x.name="홍길동";' }
      - { id: '4', text: "struct x='M';" }
    answers: ['2']
    explanation: |
      선택지 1: person은 구조체 태그(자료형 이름)이고 x는 변수이므로 person.x처럼 태그 뒤에 멤버 연산자를 쓸 수 없다. 또 구조체 person에는 x라는 멤버가 없다.
      선택지 2: 구조체 변수 x의 멤버 gender는 char형이므로 x.gender='M';처럼 멤버 연산자 .로 접근해 문자 상수를 대입할 수 있다. 정답이다.
      선택지 3: person x.name은 문법에 맞지 않고, 배열 멤버 name에는 대입문으로 문자열을 넣을 수 없다(strcpy 사용).
      선택지 4: struct는 구조체를 선언하는 키워드로 변수처럼 값을 대입할 수 없으며, x 전체에 문자 하나를 대입할 수도 없다.

      핵심 개념:
      구조체 멤버는 변수명.멤버명으로 접근한다.
      struct 태그는 자료형 이름이지 변수가 아니다.
      char 배열 멤버에는 = 대신 strcpy로 문자열을 복사한다.
      멤버의 자료형에 맞는 값을 대입해야 한다.

