  - id: e19-25
    type: multiple-choice
    chapter: 9
    prompt: 다음 기억공간 할당함수들에 대한 설명으로 ==잘못된== 것은?
    choices:
      - { id: '1', text: 'malloc()함수는 가장 대표적인 기억공간 할당 표준함수이다.' }
      - { id: '2', text: 'memset()함수는 기억 공간을 동적으로 할당 또는 해제하기 위해 사용한다.' }
      - { id: '3', text: 'calloc()함수는 할당받은 기억 공간을 0으로 초기화한다.' }
      - {
          id: '4',
          text: 'realloc()함수는 새로운 영역에 기억공간을 재할당을 하게 되면 기존의 기억공간에 있던 자료를 복사해 온다.',
        }
    answers: ['2']
    explanation: |
      선택지 1: malloc()은 지정한 바이트 수만큼 기억공간을 동적으로 할당하고 시작 주소를 반환하는 대표적 표준 함수이므로 올바른 설명이다.
      선택지 2: memset()은 이미 확보된 기억공간의 지정 바이트를 특정 값으로 채우는 함수이다. 동적 할당은 malloc/calloc/realloc, 해제는 free가 담당하므로 틀린 설명이다. 정답이다.
      선택지 3: calloc()은 요소 개수×크기만큼 할당하면서 모든 바이트를 0으로 초기화하므로 올바른 설명이다.
      선택지 4: realloc()은 크기를 바꿀 때 새 영역으로 옮기게 되면 기존 내용을 새 영역으로 복사하므로 올바른 설명이다.

      핵심 개념:
      malloc: 지정 크기 할당(초기화 없음).
      calloc: 개수×크기 할당 후 0으로 초기화.
      realloc: 크기 변경, 이동 시 기존 자료 복사.
      free: 할당 해제. memset: 메모리 영역을 특정 값으로 채움.
