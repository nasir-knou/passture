questions:
  - id: e17-01
    type: multiple-choice
    prompt: 다음 중 사용자 정의 명칭으로 올바른 것은?
    choices:
      - { id: '1', text: 'For' }
      - { id: '2', text: '2knou' }
      - { id: '3', text: 'int' }
      - { id: '4', text: 'OUN TV' }
    answers: ['1']
    explanation: |
      선택지 1: C는 대소문자를 구분하므로 For는 예약어 for와 다른 명칭이고, 영문자로 시작하며 영문자만으로 이루어져 사용자 정의 명칭으로 쓸 수 있다.
      선택지 2: 명칭은 영문자나 밑줄(_)로 시작해야 하며 숫자로 시작할 수 없으므로 2knou는 잘못된 명칭이다.
      선택지 3: int는 정수형을 나타내는 예약어(keyword)이므로 사용자 정의 명칭으로 쓸 수 없다.
      선택지 4: 명칭 안에는 공백을 넣을 수 없으므로 OUN TV는 하나의 명칭이 될 수 없다.

      핵심 개념:
      사용자 정의 명칭(identifier)은 영문자, 숫자, 밑줄(_)로 구성한다.
      첫 글자는 영문자나 밑줄이어야 하고 숫자로 시작할 수 없다.
      공백이나 특수문자는 쓸 수 없고, 예약어는 명칭으로 쓸 수 없다.
      C는 대소문자를 구분하므로 For, FOR는 예약어 for와 다른 명칭이다.

  - id: e17-02
    type: multiple-choice
    prompt: |
      다음 중 변수선언 형식으로 올바른 것은?
      (여기서 a는 변수명이다)
    choices:
      - { id: '1', text: 'a int;' }
      - { id: '2', text: 'double a;' }
      - { id: '3', text: 'short a int;' }
      - { id: '4', text: 'int char a;' }
    answers: ['2']
    explanation: |
      선택지 1: 변수 선언은 자료형이 먼저 오고 변수명이 뒤에 와야 하므로 a int;는 순서가 뒤바뀐 잘못된 형식이다.
      선택지 2: 자료형 double 뒤에 변수명 a를 쓰고 세미콜론으로 끝냈으므로 올바른 변수 선언이다.
      선택지 3: short int a;처럼 자료형(short, short int)을 모두 변수명 앞에 써야 하며, 변수명 뒤에 int가 오는 short a int;는 문법 오류이다.
      선택지 4: int와 char는 서로 다른 기본 자료형이라 함께 지정할 수 없으므로 int char a;는 오류이다.

      핵심 개념:
      변수 선언 형식은 `자료형 변수명;`이다.
      자료형 수식어(short, long, unsigned 등)는 자료형과 함께 변수명 앞에 둔다.
      서로 다른 기본 자료형(int, char, double)을 한 변수에 동시에 지정할 수 없다.
      여러 변수는 `int a, b;`처럼 쉼표로 이어 선언한다.

  - id: e17-03
    type: multiple-choice
    passageRefs: [g17-code-01]
    prompt: 다음과 같은 프로그램의 실행결과로 올바른 것은?
    choices:
      - { id: '1', text: 'result=-36' }
      - { id: '2', text: 'result=-37' }
      - { id: '3', text: 'result=-38' }
      - { id: '4', text: 'result=-39' }
    answers: ['3']
    explanation: |
      선택지 1: -36이 되려면 c%7이 4여야 하지만 30%7은 2이므로 틀리다.
      선택지 2: -a*b/5는 -40이고 c%7은 30%7=2이므로 결과는 -38이며 -37이 아니다.
      선택지 3: 단항 -가 가장 먼저 적용되어 -a=-10, 이어서 *, /, %가 왼쪽부터 계산되어 -10*20=-200, -200/5=-40, c%7=30%7=2이고, 마지막으로 -40+2=-38이므로 result=-38이 출력된다.
      선택지 4: -40+2=-38이므로 -39는 계산 결과와 맞지 않는다.

      핵심 개념:
      단항 연산자(-)는 이항 산술 연산자보다 우선순위가 높다.
      *, /, %는 같은 우선순위로 왼쪽에서 오른쪽으로 결합하며 +, -보다 먼저 계산된다.
      정수끼리의 /는 몫만 남기고, %는 나머지를 구한다.
      따라서 (-a)*b/5 + (c%7) = -40 + 2 = -38이다.

  - id: e17-04
    type: multiple-choice
    passageRefs: [g17-code-02]
    prompt: 다음 프로그램의 결과로 올바른 것은?
    choices:
      - { id: '1', text: 'A+2  K+2' }
      - { id: '2', text: 'B  L' }
      - { id: '3', text: 'A+2  K' }
      - { id: '4', text: 'C  L' }
    answers: ['4']
    explanation: |
      선택지 1: putchar()는 식을 문자열로 출력하지 않고 계산된 문자 코드 하나를 출력하므로 A+2 같은 글자가 나오지 않는다.
      선택지 2: var+2는 'A'의 코드 65에 2를 더한 67이므로 B(66)가 아니라 C가 출력된다.
      선택지 3: 식이 그대로 출력되지 않으며, 'K'+1은 K가 아니라 다음 문자 L이다.
      선택지 4: var+2는 65+2=67로 문자 C, 'K'+1은 75+1=76으로 문자 L이 되어 C와 L이 출력된다(실제 출력은 CL로 붙어 나온다).

      핵심 개념:
      C의 문자형(char)은 내부적으로 ASCII(American Standard Code for Information Interchange) 코드 정수값을 가진다.
      문자에 정수를 더하면 코드값이 증가해 코드표상 다음 문자가 된다.
      putchar()는 인수로 받은 코드값에 해당하는 문자 하나를 출력한다.
      'A'+2는 'C', 'K'+1은 'L'이다.

  - id: e17-05
    type: multiple-choice
    passageRefs: [g17-code-03]
    prompt: 다음 프로그램의 출력결과로 올바른 것은?
    choices:
      - { id: '1', text: '0' }
      - { id: '2', text: '3' }
      - { id: '3', text: '4' }
      - { id: '4', text: '7' }
    answers: ['3']
    explanation: |
      선택지 1: 0은 else 쪽 printf("\n%d", i=i-j)가 실행되어야 나오는 값인데, else는 가장 가까운 안쪽 if에 붙어 있고 바깥 if(i==3)이 거짓이라 실행되지 않는다.
      선택지 2: 3은 i나 j에 대입된 적이 없는 값이다.
      선택지 3: i=j=4로 i와 j가 모두 4가 되고, if(i==3)이 거짓이므로 그 안의 if~else 전체가 건너뛰어진다. 마지막 printf("\n%d", i)만 실행되어 4가 출력된다.
      선택지 4: 7은 코드 어디에서도 나오지 않는 값이고, i=i+j로 8을 출력하는 문장도 바깥 if가 거짓이라 실행되지 않는다.

      핵심 개념:
      대입 연산자는 오른쪽에서 왼쪽으로 결합하므로 i=j=4는 j=4 후 i=4이다.
      중첩 if에서 else는 들여쓰기와 관계없이 가장 가까운 짝 없는 if에 연결된다(dangling else).
      이 코드의 else는 안쪽 if에 속하므로 바깥 if(i==3)이 거짓이면 안쪽 if와 else 모두 실행되지 않는다.
      결과적으로 마지막 printf만 실행되어 4가 출력된다.

  - id: e17-06
    type: multiple-choice
    passageRefs: [g17-code-04]
    prompt: 다음 프로그램의 출력결과로 올바른 것은?
    choices:
      - { id: '1', text: 'b=9' }
      - { id: '2', text: 'b=10' }
      - { id: '3', text: 'b=14' }
      - { id: '4', text: 'b=15' }
    answers: ['1']
    explanation: |
      선택지 1: a>15는 10>15로 거짓이므로 조건 연산자는 두 번째 식 (a-1)=9를 선택해 b=9가 출력된다.
      선택지 2: 10은 a의 원래 값이며, 조건 연산자는 a를 그대로 대입하지 않고 a+1 또는 a-1 중 하나를 대입한다.
      선택지 3: 14는 두 식 어디에서도 나오지 않는 값이다.
      선택지 4: 15는 조건식에 쓰인 비교값일 뿐 대입되는 값이 아니다.

      핵심 개념:
      조건 연산자 `조건 ? 식1 : 식2`는 조건이 참이면 식1, 거짓이면 식2의 값을 가진다.
      a=10이므로 a>15는 거짓이다.
      따라서 b=a-1=9가 된다.
      조건 연산자는 C의 유일한 삼항 연산자이며 간단한 if~else를 대신한다.

  - id: e17-07
    type: multiple-choice
    passageRefs: [g17-display-line-intro-01, g17-display-line-code-01]
    prompt: 위에서 변수 선언은 어디에서 이루어지고 있는가?
    choices:
      - { id: '1', text: '㉡' }
      - { id: '2', text: '㉣' }
      - { id: '3', text: '㉧' }
      - { id: '4', text: '㉨' }
    answers: ['3']
    explanation: |
      선택지 1: ㉡은 함수 display_line의 원형(prototype) 선언으로, 변수가 아니라 함수를 선언한다.
      선택지 2: ㉣은 display_line() 함수를 호출하는 문장이다.
      선택지 3: ㉧의 int couner;는 자료형 int와 변수명을 적은 변수 선언문이다.
      선택지 4: ㉨은 for 반복문으로, 이미 선언된 변수를 사용할 뿐 새 변수를 선언하지 않는다.

      핵심 개념:
      변수 선언은 `자료형 변수명;` 형태로 기억공간을 확보하는 문장이다.
      함수 원형 선언은 반환형, 함수명, 매개변수 목록 뒤에 세미콜론이 붙는다.
      함수 호출은 함수명과 괄호로 함수를 실행시키는 문장이다.
      반복문은 선언된 변수를 조건과 증감에 사용한다.

  - id: e17-08
    type: multiple-choice
    passageRefs: [g17-display-line-intro-01, g17-display-line-code-01]
    prompt: 위에서 설명문은 어디인가?
    choices:
      - { id: '1', text: '㉢' }
      - { id: '2', text: '㉤' }
      - { id: '3', text: '㉥' }
      - { id: '4', text: '㉦' }
    answers: ['3']
    explanation: |
      선택지 1: ㉢은 main 함수의 시작(함수 헤더)이다.
      선택지 2: ㉤은 문자열을 출력하는 printf 호출문이다.
      선택지 3: ㉥의 /* print asterisk line*/은 /*와 */ 사이에 적힌 설명문(주석)으로, 컴파일 시 무시된다.
      선택지 4: ㉦은 display_line 함수 정의의 헤더이다.

      핵심 개념:
      설명문(주석)은 /*와 */ 사이에 쓰며 여러 줄에 걸칠 수 있다.
      설명문은 컴파일러가 무시하므로 실행에 영향을 주지 않는다.
      프로그램의 이해를 돕기 위한 설명을 적는 데 사용한다.
      C99부터는 //로 한 줄 설명문도 쓸 수 있다.

  - id: e17-09
    type: multiple-choice
    passageRefs: [g17-display-line-intro-01, g17-display-line-code-01]
    prompt: 위에서 선행처리기는 어느 부분인가?
    choices:
      - { id: '1', text: '㉠' }
      - { id: '2', text: '㉢' }
      - { id: '3', text: '㉣' }
      - { id: '4', text: '㉥' }
    answers: ['1']
    explanation: |
      선택지 1: ㉠의 #include<stdio.h>는 #으로 시작하는 선행처리기 지시자로, 컴파일 전에 stdio.h 헤더파일 내용을 끼워 넣는다.
      선택지 2: ㉢은 main 함수의 시작 부분이다.
      선택지 3: ㉣은 사용자 정의 함수 display_line의 호출문이다.
      선택지 4: ㉥은 설명문(주석)이다.

      핵심 개념:
      선행처리기(preprocessor)는 컴파일 이전에 소스 코드를 처리한다.
      선행처리기 지시자는 #으로 시작하며 세미콜론을 붙이지 않는다.
      #include는 헤더파일을 포함하고, #define은 매크로를 정의한다.
      stdio.h에는 printf 같은 표준 입출력 함수의 원형이 들어 있다.

  - id: e17-10
    type: multiple-choice
    passageRefs: [g17-display-line-intro-01, g17-display-line-code-01]
    prompt: 위에서 사용자정의함수의 원형선언이 이루어지는 부분은?
    choices:
