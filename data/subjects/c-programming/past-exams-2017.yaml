      - { id: '2', text: '㉣' }
      - { id: '3', text: '㉤' }
      - { id: '4', text: '㉥' }
    answers: ['1']
    explanation: |
      선택지 1: ㉡의 void display_line(void);는 반환형, 함수명, 매개변수 목록 뒤에 세미콜론을 붙인 함수 원형 선언이다.
      선택지 2: ㉣은 반환형 없이 함수명과 괄호만 쓴 함수 호출문이다.
      선택지 3: ㉤은 표준함수 printf를 호출하는 문장이다.
      선택지 4: ㉥은 설명문(주석)이다.

      핵심 개념:
      함수 원형(prototype)은 함수의 반환형, 이름, 매개변수 형을 미리 알려주는 선언이다.
      함수 정의가 호출보다 뒤에 있을 때 원형을 앞쪽에 선언해야 컴파일러가 호출을 검사할 수 있다.
      원형 선언은 함수 헤더와 같은 모양에 세미콜론을 붙인다.
      함수 정의 헤더(㉦)에는 세미콜론 없이 중괄호 본체가 이어진다.

  - id: e17-11
    type: multiple-choice
    passageRefs: [g17-display-line-intro-01, g17-display-line-code-01]
    prompt: 위에서 사용자정의함수의 호출이 일어나는 부분은?
    choices:
      - { id: '1', text: '㉠' }
      - { id: '2', text: '㉡' }
      - { id: '3', text: '㉣' }
      - { id: '4', text: '㉥' }
    answers: ['3']
    explanation: |
      선택지 1: ㉠은 헤더파일을 포함하는 선행처리기 지시자이다.
      선택지 2: ㉡은 display_line의 원형 선언으로, 함수를 실행하지 않고 형태만 알린다.
      선택지 3: ㉣의 display_line();은 main 안에서 사용자 정의 함수 display_line을 실행시키는 호출문이다.
      선택지 4: ㉥은 설명문(주석)이다.

      핵심 개념:
      함수 호출은 `함수명(인수);` 형태로 함수를 실행시킨다.
      호출이 일어나면 제어가 함수 본체로 넘어갔다가 끝나면 호출한 곳으로 돌아온다.
      이 프로그램의 main은 display_line()을 두 번 호출하며, 번호가 붙은 곳은 ㉣이다.
      원형 선언(㉡)과 함수 정의(㉦)는 호출과 구별된다.

  - id: e17-12
    type: multiple-choice
    passageRefs: [g17-code-05]
    prompt: 다음과 같은 프로그램의 실행결과로서 올바른 것은?
    choices:
      - { id: '1', text: 'i=4  i=3' }
      - { id: '2', text: 'i=3  i=1' }
      - { id: '3', text: 'i=4  i=1' }
      - { id: '4', text: 'i=4  i=4' }
    answers: ['2']
    explanation: |
      선택지 1: int i=4;는 가장 안쪽 블록의 지역변수라 그 블록이 끝나면 사라지므로 첫 printf에서 4가 출력되지 않는다.
      선택지 2: 첫 printf는 i=3이 선언된 블록 안에 있어 i=3을 출력하고, 두 번째 printf는 main 블록에 있어 i=1을 출력한다.
      선택지 3: 첫 printf 위치에서는 안쪽 블록의 i=4가 이미 소멸했으므로 i=4가 아니다.
      선택지 4: 두 번째 printf 위치에서 보이는 i는 main 블록의 i=1이다.

      핵심 개념:
      블록({ }) 안에서 선언한 변수는 그 블록 안에서만 유효한 지역변수이다.
      안쪽 블록에서 같은 이름을 선언하면 바깥 변수를 가린다.
      블록이 끝나면 그 블록의 변수는 소멸하고 바깥 변수가 다시 보인다.
      따라서 출력은 i=3, i=1 순서이다(실제로는 i=3i=1로 붙어 출력된다).

  - id: e17-13
    type: multiple-choice
    passageRefs: [g17-code-06]
    prompt: 다음과 같은 프로그램의 실행결과로서 올바른 것은?
    choices:
      - { id: '1', text: '나머지는 1' }
      - { id: '2', text: '나머지는 1 나머지는 2' }
      - { id: '3', text: '나머지는 2' }
      - { id: '4', text: '나머지는 2 나머지는 3이나 4' }
    answers: ['2']
    explanation: |
      선택지 1: case 1 뒤에 break가 없으므로 "나머지는 1"만 출력하고 멈추지 않는다.
      선택지 2: 11%5=1이라 case 1로 분기하여 "나머지는 1"을 출력하고, break가 없어 case 2의 "나머지는 2"까지 이어서 실행한 뒤 break에서 switch를 빠져나온다.
      선택지 3: 실행은 case 1부터 시작하므로 "나머지는 1"이 먼저 출력된다.
      선택지 4: case 2 다음의 break로 switch를 벗어나므로 default는 실행되지 않고, case 1의 출력도 빠져 있다.

      핵심 개념:
      switch는 식의 값과 일치하는 case로 이동해 그 지점부터 실행한다.
      break를 만나기 전까지 아래 case의 문장들이 계속 실행된다(fall-through).
      break는 switch문을 즉시 빠져나오게 한다.
      default는 일치하는 case가 없을 때 실행된다.

  - id: e17-14
    type: multiple-choice
    prompt: 다음 중 표준함수에 대한 설명으로 올바르지 ==않은== 것은?
    choices:
      - { id: '1', text: '표준함수의 원형은 헤더파일에 선언되어 있다.' }
      - { id: '2', text: '표준함수의 실체는 라이브러리 파일에 수록되어 있다.' }
      - { id: '3', text: '표준함수를 사용하기 위해서는 원형과 실체가 알려져 있어야 한다.' }
      - { id: '4', text: '표준함수를 사용하기 위해서는 표준함수의 헤더파일을 #define 시켜야 한다.' }
    answers: ['4']
    explanation: |
      선택지 1: printf의 원형이 stdio.h에 있는 것처럼 표준함수의 원형은 헤더파일에 선언되어 있으므로 옳다.
      선택지 2: 표준함수의 실제 코드(실체)는 컴파일된 형태로 라이브러리 파일에 들어 있고 링크 단계에서 연결되므로 옳다.
      선택지 3: 컴파일러는 원형으로 호출을 검사하고, 링커는 실체를 연결해야 하므로 둘 다 알려져 있어야 한다는 설명은 옳다.
      선택지 4: 헤더파일은 #include로 포함시켜야 한다. #define은 매크로(기호 상수)를 정의하는 지시자이므로 틀린 설명이다.

      핵심 개념:
      표준함수는 C 컴파일러가 제공하는 라이브러리 함수이다.
      원형은 헤더파일(.h)에, 실체(구현)는 라이브러리 파일에 있다.
      헤더파일은 #include 지시자로 프로그램에 포함시킨다.
      #define은 매크로 정의용 선행처리기 지시자이다.

  - id: e17-15
    type: multiple-choice
    passageRefs: [g17-fcn-desc-01]
    prompt: 다음의 설명에 대한 함수 헤더의 정의로 올바른 것은?
    choices:
      - { id: '1', text: 'int fcn(int a1, int a2, int a3)' }
      - { id: '2', text: 'int fcn(char a1, int a2, float a3)' }
      - { id: '3', text: 'double fcn(int a1, int a2, int a3)' }
      - { id: '4', text: 'double fcn(char a1, int a2, float a3)' }
    answers: ['4']
    explanation: |
      선택지 1: 반환형이 배정도 실수형(double)이 아니라 int이고, 매개변수도 모두 int라 문자형·실수형 조건과 맞지 않는다.
      선택지 2: 매개변수 형(char, int, float)은 맞지만 반환형이 int라 배정도 실수형을 되돌려 준다는 조건과 다르다.
      선택지 3: 반환형 double은 맞지만 매개변수가 모두 int라 문자형(a1)·실수형(a3) 조건과 다르다.
      선택지 4: 반환형이 double(배정도 실수형)이고 매개변수가 char a1(문자형), int a2(정수형), float a3(실수형)이므로 설명과 일치한다.

      핵심 개념:
      함수 헤더는 `반환형 함수명(매개변수 목록)` 형태이다.
      문자형은 char, 정수형은 int, 실수형은 float, 배정도 실수형은 double이다.
      매개변수는 각각 자료형과 이름을 짝지어 쉼표로 구분한다.
      반환형은 return으로 되돌려 주는 값의 자료형이다.

  - id: e17-16
    type: multiple-choice
    prompt: 다음의 배열에 대한 설명 중 올바르지 ==않은== 것은?
    choices:
      - { id: '1', text: '배열의 각 원소를 변수처럼 사용한다.' }
      - { id: '2', text: '배열명을 증가시키거나 감소시킬 수 있다.' }
      - { id: '3', text: '배열의 값을 초기화할 때는 중괄호({ })를 사용한다.' }
      - { id: '4', text: '배열은 일차원 배열뿐만 아니라 다차원 배열도 만들 수 있다.' }
    answers: ['2']
    explanation: |
      선택지 1: a[0], a[1]처럼 첨자를 붙인 배열 원소는 일반 변수처럼 대입·연산에 쓸 수 있으므로 옳다.
      선택지 2: 배열명은 배열의 시작 주소를 나타내는 포인터 상수이므로 a++나 a--처럼 값을 바꿀 수 없다. 따라서 틀린 설명이다.
      선택지 3: int a[3]={1, 2, 3};처럼 배열 초기화 값은 중괄호 안에 나열하므로 옳다.
      선택지 4: int b[2][3];처럼 2차원 이상 다차원 배열도 선언할 수 있으므로 옳다.

      핵심 개념:
      배열은 같은 자료형의 원소를 연속된 기억공간에 저장한다.
      배열명은 첫 원소의 주소를 가진 포인터 상수로, 값을 변경할 수 없다.
      배열 원소를 가리키는 포인터 변수는 증감시킬 수 있다.
      초기화는 중괄호를 쓰며, 다차원 배열도 만들 수 있다.

  - id: e17-17
    type: multiple-choice
    passageRefs: [g17-code-07]
    prompt: 다음 프로그램의 결과로서 올바른 것은?
    choices:
      - { id: '1', text: '10 20' }
      - { id: '2', text: '10 20 10 20' }
      - { id: '3', text: '10 20 20 20' }
      - { id: '4', text: '10 20 0 0' }
    answers: ['4']
    explanation: |
      선택지 1: printf의 형식 문자열에 %d가 네 개이므로 값 네 개가 출력된다.
      선택지 2: 초기값이 부족할 때 앞의 값이 반복되어 채워지지 않는다.
      선택지 3: 마지막 초기값이 나머지 원소로 복사되지 않는다.
      선택지 4: 초기값 10, 20은 a[0], a[1]에 들어가고, 초기값이 없는 a[2], a[3]은 0으로 채워져 10 20 0 0이 출력된다.

      핵심 개념:
      배열 초기화에서 초기값 개수가 원소 수보다 적으면 앞에서부터 차례로 채운다.
      초기값이 지정되지 않은 나머지 원소는 0으로 초기화된다.
      int a[4]={10, 20, };의 마지막 쉼표는 허용되는 문법이다.
      따라서 a는 {10, 20, 0, 0}이 된다.

  - id: e17-18
    type: multiple-choice
    passageRefs: [g17-code-08]
    prompt: 다음과 같은 프로그램의 실행결과로서 올바른 것은?
    choices:
      - { id: '1', text: '1 2 3 4 5' }
      - { id: '2', text: '1 3 5' }
      - { id: '3', text: '3 4 5 6 7' }
      - { id: '4', text: '에러 발생' }
    answers: ['3']
    explanation: |
      선택지 1: 첫 번째 for문에서 p[i]=p[i]+2로 모든 원소에 2를 더했으므로 원래 값이 그대로 출력되지 않는다.
      선택지 2: 두 번째 for문은 i를 1씩 증가시켜 다섯 원소를 모두 출력하므로 일부만 출력되지 않는다.
      선택지 3: p는 a의 시작 주소를 가리키므로 p[i]는 a[i]와 같다. 각 원소에 2를 더해 a가 {3, 4, 5, 6, 7}이 되고 이를 차례로 출력한다(실제 출력은 34567로 붙어 나온다).
      선택지 4: 포인터 변수에 배열명을 대입하고 첨자로 접근하는 것은 올바른 문법이라 에러가 없다.

      핵심 개념:
      배열명은 첫 원소의 주소이므로 int *p=a;로 포인터에 대입할 수 있다.
      포인터에 첨자를 붙인 p[i]는 *(p+i)와 같고 a[i]를 가리킨다.
      포인터를 통해 값을 바꾸면 원래 배열의 값이 바뀐다.
      따라서 각 원소가 2씩 증가한 3 4 5 6 7이 출력된다.

  - id: e17-19
    type: multiple-choice
    passageRefs: [g17-code-09]
    prompt: 다음 프로그램의 실행결과로서 올바른 것은?
    choices:
      - { id: '1', text: '10' }
      - { id: '2', text: '20' }
      - { id: '3', text: '30' }
      - { id: '4', text: '에러 발생' }
    answers: ['2']
    explanation: |
      선택지 1: 10은 array[0]이 가리키는 a의 값이다.
      선택지 2: array는 포인터 배열로 array[1]에 &b가 저장되어 있으므로 *array[1]은 b의 값 20이다.
      선택지 3: 30은 array[2]가 가리키는 c의 값이다.
      선택지 4: 변수 주소로 포인터 배열을 초기화하고 간접 참조하는 것은 올바른 문법이다.

      핵심 개념:
      포인터 배열은 주소를 원소로 저장하는 배열이다(int *array[3]).
      [ ]는 *보다 우선순위가 높아 *array[1]은 *(array[1])로 해석된다.
      array[1]은 &b이므로 간접 참조하면 b의 값이 된다.
      배열 첨자는 0부터 시작한다.

  - id: e17-20
    type: multiple-choice
    passageRefs: [g17-code-10]
    prompt: 다음 프로그램의 실행결과로서 올바른 것은?
    choices:
      - { id: '1', text: 'Ko' }
      - { id: '2', text: 'KoreaNational' }
      - { id: '3', text: 'KN' }
      - { id: '4', text: 'Open' }
    answers: ['4']
    explanation: |
      선택지 1: names[2]는 문자 몇 개가 아니라 세 번째 문자열 전체의 시작 주소이다.
      선택지 2: 한 원소만 출력하므로 두 문자열이 이어져 나오지 않는다.
      선택지 3: 각 문자열의 첫 글자를 모으는 연산이 없다.
      선택지 4: names는 문자열 4개의 시작 주소를 가진 포인터 배열이며, 첨자 2는 세 번째 원소 "Open"을 가리키므로 %s로 Open이 출력된다.

      핵심 개념:
      char *names[4]는 문자열 상수의 주소를 저장하는 포인터 배열이다.
      배열 첨자는 0부터 시작하므로 names[2]는 세 번째 문자열이다.
      %s는 주어진 주소에서 널 문자('\0') 전까지의 문자열을 출력한다.
      따라서 Open이 출력된다.

  - id: e17-21
    type: multiple-choice
    passageRefs: [g17-struct-intro-01, g17-struct-code-01]
    prompt: 위에서 ㉠의 결과로 올바른 것은?
    choices:
      - { id: '1', text: 'AAA' }
      - { id: '2', text: 'BBB' }
      - { id: '3', text: 'CCC' }
      - { id: '4', text: 'DDD' }
    answers: ['3']
    explanation: |
      선택지 1: AAA는 MAN[0].x이다.
      선택지 2: BBB는 MAN[0].y이다.
      선택지 3: MAN[1]은 두 번째 구조체 {"CCC", "DDD"}이고, 그 멤버 x는 "CCC"이므로 CCC가 출력된다.
      선택지 4: DDD는 MAN[1]의 멤버 y이다.

      핵심 개념:
      구조체 배열은 같은 구조체형 변수를 여러 개 모은 배열이다.
      초기화 시 안쪽 중괄호 하나가 구조체 원소 하나에 대응한다.
      멤버는 `배열명[첨자].멤버명`으로 접근하며 첨자는 0부터 시작한다.
      MAN[1].x는 두 번째 원소의 첫 멤버 CCC이다.

  - id: e17-22
    type: multiple-choice
    passageRefs: [g17-struct-intro-01, g17-struct-code-01]
    prompt: 위에서 ㉡의 결과로 올바른 것은?
    choices:
      - { id: '1', text: 'AAA' }
      - { id: '2', text: 'DDD' }
      - { id: '3', text: 'EEE' }
      - { id: '4', text: 'FFF' }
    answers: ['4']
    explanation: |
      선택지 1: AAA는 MAN[0].x이다.
      선택지 2: DDD는 MAN[1].y이다.
      선택지 3: EEE는 MAN[2]의 멤버 x이다.
      선택지 4: MAN[2]는 세 번째 구조체 {"EEE", "FFF"}이고, 그 멤버 y는 "FFF"이므로 FFF가 출력된다.

      핵심 개념:
      구조체 멤버는 선언 순서대로 초기값을 받는다(x, y 순).
      MAN[2]는 첨자 2, 즉 세 번째 원소이다.
      점(.) 연산자로 구조체 변수의 멤버에 접근한다.
      MAN[2].y는 FFF이다.

  - id: e17-23
    type: multiple-choice
    passageRefs: [g17-file-intro-01, g17-file-code-01]
    prompt: 위에서 빈칸 ㉠에 들어갈 내용으로 올바른 것은?
    choices:
      - { id: '1', text: 'fcanf;' }
      - { id: '2', text: 'fopen' }
      - { id: '3', text: 'fprintf;' }
      - { id: '4', text: 'malloc;' }
    answers: ['2']
    explanation: |
      선택지 1: 파일에서 형식에 맞춰 자료를 읽는 함수는 fscanf로, 파일을 여는 함수가 아니며 FILE 포인터를 반환하지 않는다.
      선택지 2: fopen("oldname.dat", "rb")는 파일을 이진 읽기 모드로 열고 FILE 포인터를 반환하며, 실패하면 NULL을 반환하므로 NULL 검사와 맞는다.
      선택지 3: fprintf는 파일에 형식화된 출력을 하는 함수로, 파일을 열지 않는다.
      선택지 4: malloc은 힙(heap)에 기억공간을 동적 할당하는 함수로, 파일명과 모드를 인수로 받지 않는다.

      핵심 개념:
      파일 처리는 fopen으로 열고, 입출력 함수로 처리한 뒤, fclose로 닫는다.
      fopen(파일명, 모드)은 성공 시 FILE 포인터, 실패 시 NULL을 반환한다.
      "rb"는 이진(binary) 파일 읽기 모드이다.
      fgetc는 파일에서 문자 하나를 읽고 파일 끝에서 EOF를 반환한다.

  - id: e17-24
    type: multiple-choice
    passageRefs: [g17-file-intro-01, g17-file-code-01]
    prompt: 위에서 빈칸 ㉡에 들어갈 내용으로 올바른 것은?
    choices:
      - { id: '1', text: 'stdout' }
      - { id: '2', text: 'stdin' }
      - { id: '3', text: 'stderr' }
      - { id: '4', text: 'stdio' }
    answers: ['1']
    explanation: |
      선택지 1: stdout은 표준 출력(화면)을 가리키는 파일 포인터이므로, 파일에서 읽은 문자를 fprintf(stdout, "%c", c)로 화면에 출력하게 된다.
      선택지 2: stdin은 표준 입력(키보드) 스트림으로, 출력 대상이 될 수 없다.
      선택지 3: stderr는 표준 에러 출력 스트림으로, 오류 메시지 출력용이며 일반 내용 출력에는 stdout을 쓴다.
      선택지 4: stdio는 표준 입출력 헤더파일 이름(stdio.h)의 일부일 뿐 파일 포인터가 아니다.

      핵심 개념:
      C 프로그램 실행 시 표준 스트림 stdin, stdout, stderr가 자동으로 열린다.
      fprintf의 첫 인수는 출력할 대상 FILE 포인터이다.
      fprintf(stdout, ...)는 printf(...)와 같은 효과를 낸다.
      이 프로그램은 파일 내용을 한 문자씩 읽어 화면에 출력한다.

  - id: e17-25
    type: multiple-choice
    prompt: 다음 중 기억공간 힙(heap)에 대한 설명으로 ==잘못된== 것은?
    choices:
      - { id: '1', text: '메모리 동적할당을 위해 프로그래머가 사용하는 영역이다.' }
      - { id: '2', text: '힙의 공간 할당은 memset()등의 함수로 할당받을 수 있다.' }
      - { id: '3', text: '할당받은 힙 공간은 사용이 끝나면 자동으로 해제되지 않는다.' }
      - { id: '4', text: '프로그램 실행 중에 필요한 만큼의 공간을 할당받을 때 사용되는 메모리 영역이다.' }
    answers: ['2']
    explanation: |
      선택지 1: 힙은 malloc 등으로 프로그래머가 직접 동적 할당하는 영역이므로 옳다.
      선택지 2: 힙 공간은 malloc(), calloc(), realloc() 같은 함수로 할당받는다. memset()은 이미 확보된 메모리를 지정한 값으로 채우는 함수로 할당 기능이 없으므로 틀린 설명이다.
      선택지 3: 힙에 할당한 공간은 free()로 직접 해제해야 하며 자동으로 해제되지 않으므로 옳다.
      선택지 4: 힙은 실행 중(run time)에 필요한 크기만큼 공간을 얻는 데 쓰이므로 옳다.

      핵심 개념:
      힙(heap)은 실행 중에 동적으로 할당·해제하는 메모리 영역이다.
      할당은 malloc, calloc, realloc으로 하고, 해제는 free로 한다.
      해제하지 않으면 메모리 누수(memory leak)가 생긴다.
      memset은 메모리 내용을 특정 값으로 채우는 함수이다.
