          };
          struct var data;
      - id: '2'
        text: |
          struct data{
             int x;
             double y;
          };
          struct data var;
      - id: '3'
        text: |
          struct var{
             int x;
             double y;
          }struct var data;
      - id: '4'
        text: |
          struct data{
             int x;
             double y;
          };
          struct var;
    answers: ['2']
    explanation: |
      선택지 1: 구조체명을 var, 구조체 변수명을 data로 써서 요구한 이름과 서로 뒤바뀌어 있다.
      선택지 2: struct data{ … };로 int형 멤버 x와 double형 멤버 y를 갖는 구조체 data를 정의하고, struct data var;로 구조체 변수 var를 선언하므로 올바르다. 정답이다.
      선택지 3: 구조체명과 변수명이 뒤바뀌었고, 정의를 닫는 } 뒤에 struct var data;를 이어 써서 문법에도 맞지 않는다.
      선택지 4: 구조체 data의 정의는 맞지만 struct var;는 var라는 이름의 구조체형을 선언할 뿐 구조체 data형 변수 var를 선언하지 않는다.

      핵심 개념:
      구조체 정의는 struct 구조체명{ 멤버 선언 };의 형태다.
      구조체 변수 선언은 struct 구조체명 변수명; 형태다.
      구조체명(태그)은 자료형 이름이고, 변수명은 실제 기억공간의 이름이다.
      정의와 선언을 함께 할 때는 struct data{ … } var;처럼 쓴다.

  - id: e18-23
    type: multiple-choice
    chapter: 8
    passageRefs: [g18-file-intro-01, g18-file-code-01]
    prompt: 위에서 빈칸 ㉠에 들어갈 내용으로 올바른 것은?
    choices:
      - { id: '1', text: '*fscanf()' }
      - { id: '2', text: 'oldname.dat' }
      - { id: '3', text: 'stdin' }
      - { id: '4', text: '*fp' }
    answers: ['4']
    explanation: |
      선택지 1: FILE *fscanf();로 쓰면 파일 포인터 fp가 선언되지 않아 이후 코드의 fp를 쓸 수 없고, stdio.h에 있는 표준 함수 fscanf()의 선언과도 충돌해 컴파일 에러가 난다.
      선택지 2: oldname.dat는 fopen()에 문자열로 전달하는 파일 이름이며 변수명이 아니다.
      선택지 3: stdin은 표준 입력을 나타내는 미리 정의된 파일 포인터로, 새로 선언하는 변수명이 아니며 이후 코드에서 쓰는 fp와도 맞지 않는다.
      선택지 4: 이후 코드에서 fp=fopen(…), fgetc(fp)로 fp를 파일 포인터로 사용하므로 FILE *fp;로 선언해야 한다. 정답이다.

      핵심 개념:
      파일 입출력에는 FILE 구조체를 가리키는 파일 포인터가 필요하다.
      파일 포인터는 FILE *변수명; 형식으로 선언한다.
      fopen()은 파일을 열고 파일 포인터를 반환하며, 실패하면 NULL을 반환한다.
      "rb"는 이진 파일 읽기 모드다.

  - id: e18-24
    type: multiple-choice
    chapter: 8
    passageRefs: [g18-file-intro-01, g18-file-code-01]
    prompt: 위에서 빈칸 ㉡에 들어갈 내용으로 올바른 것은?
    choices:
      - { id: '1', text: 'fclose(fp)' }
      - { id: '2', text: 'fopen(fp)' }
      - { id: '3', text: 'END' }
      - { id: '4', text: 'stderr' }
    answers: ['1']
    explanation: |
      선택지 1: 파일 처리를 마친 뒤에는 fclose(fp);로 열었던 파일을 닫아 버퍼를 비우고 자원을 반환한다. 정답이다.
      선택지 2: fopen()은 파일을 여는 함수이며 파일 이름과 모드를 인수로 받으므로 fopen(fp)는 형식에 맞지 않고 닫는 동작도 아니다.
      선택지 3: END는 C 언어의 예약어나 표준 함수가 아니다. 파일 끝은 EOF로 판단한다.
      선택지 4: stderr는 표준 오류 출력 파일 포인터로, 단독 문장으로 써서 파일을 닫을 수 없다.

      핵심 개념:
      파일 처리 순서는 파일 포인터 선언 → fopen()으로 열기 → 읽기/쓰기 → fclose()로 닫기다.
      fgetc()는 파일에서 문자 하나를 읽고, 파일 끝에서 EOF를 반환한다.
      fprintf(stdout, …)는 표준 출력(화면)에 출력한다.
      stdin, stdout, stderr는 미리 열려 있는 표준 파일 포인터다.

  - id: e18-25
    type: multi-answer
    chapter: 9
    prompt: 다음 중 동적할당에 대한 설명으로 ==잘못된== 것은?
    choices:
      - { id: '1', text: '동적할당을 동해 기억공간의 낭비를 막을 수 있다.' }
      - { id: '2', text: '동적할당은 실행중 필요한 만큼 기억공간을 사용할 수 있다.' }
      - { id: '3', text: '배열의 경우 동적할당을 사용하여 배열의 크기를 결정할 수 있다.' }
      - { id: '4', text: '동적할당은 정수형 자료에 대해서만 가능하다.' }
    answers: ['1', '4']
    answerKey: C
    explanation: |
      선택지 1: 동적할당은 실행 중 필요한 만큼만 기억공간을 할당하므로 기억공간의 낭비를 막을 수 있다. 이는 동적할당의 장점을 적은 문장으로 내용은 옳지만, 공식 정답표는 이 선택지와 "정수형 자료에 대해서만 가능하다" 선택지를 모두 정답으로 처리했다.
      선택지 2: 동적할당은 프로그램 실행 중 malloc() 등으로 필요한 크기만큼 기억공간을 확보하므로 옳은 설명이다.
      선택지 3: 배열 크기를 실행 중에 정해 malloc(n*sizeof(int))처럼 할당하면 크기가 가변적인 배열을 만들 수 있으므로 옳은 설명이다.
      선택지 4: malloc()은 바이트 수를 받아 void형 포인터를 반환하므로 char, double, 구조체 등 모든 자료형에 사용할 수 있다. 정수형에만 가능하다는 것은 잘못된 설명이다. 정답이다.

      핵심 개념:
      동적할당은 실행 중에 heap 영역에서 필요한 만큼 기억공간을 확보하는 방법이다.
      malloc(바이트 수)은 할당한 공간의 시작주소를 void형 포인터로 반환하며, 원하는 자료형 포인터로 형 변환해 쓴다.
      자료형과 관계없이 sizeof로 크기를 계산해 할당할 수 있다.
      사용이 끝난 공간은 free()로 반환해야 메모리 누수를 막을 수 있다.
