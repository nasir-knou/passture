  - id: e18-17
    type: multiple-choice
    chapter: 6
    passageRefs: [g18-pointer-array-code-01]
    prompt: 다음 프로그램의 실행결과로서 올바른 것은?
    choices:
      - { id: '1', text: '10' }
      - { id: '2', text: '20' }
      - { id: '3', text: '30' }
      - { id: '4', text: '에러 발생' }
    answers: ['2']
    explanation: |
      선택지 1: 10은 *array[0], 즉 a의 값이다.
      선택지 2: int *array[3]은 int형 포인터 3개를 원소로 갖는 포인터 배열이고 array[1]에는 &b가 저장되어 있으므로 *array[1]은 b의 값 20이다. 정답이다.
      선택지 3: 30은 *array[2], 즉 c의 값이다.
      선택지 4: 포인터 배열에 변수 주소를 초기값으로 주는 것은 올바른 문법이므로 에러가 발생하지 않는다.

      핵심 개념:
      포인터 배열은 주소를 원소로 저장하는 배열이다.
      int *array[3]={&a, &b, &c};에서 array[i]는 i번째 변수의 주소다.
      [ ]가 *보다 우선하므로 *array[1]은 *(array[1])로 해석된다.
      간접 연산자 *는 주소가 가리키는 곳의 값을 꺼낸다.

  - id: e18-18
    type: multiple-choice
    chapter: 6
    passageRefs: [g18-pointer-arith-intro-01, g18-pointer-arith-code-01]
    prompt: 위에서 ㉠의 결과로서 올바른 것은?
    choices:
      - { id: '1', text: '10   50' }
      - { id: '2', text: '30   60' }
      - { id: '3', text: '30   33' }
      - { id: '4', text: '30   70' }
    answers: ['4']
    explanation: |
      선택지 1: p=&a[2];이므로 *p는 a[0]의 10이 아니라 a[2]의 30이다.
      선택지 2: q=p+4는 a[2]에서 원소 4개 뒤인 a[6]을 가리키므로 *q는 a[5]의 60이 아니다.
      선택지 3: q=p+4는 a[2]에서 원소 4개 뒤인 a[6]을 가리키므로 *q는 70이며, 33은 배열 a의 어떤 원소 값도 아니다.
      선택지 4: *p는 a[2]=30, q=p+4는 &a[6]이므로 *q는 70이 되어 30 70이 출력된다. 정답이다.

      핵심 개념:
      포인터에 정수 n을 더하면 자료형 크기×n만큼 주소가 이동해 n번째 뒤 원소를 가리킨다.
      p=&a[2]이면 p+4는 &a[6]이다.
      *p는 p가 가리키는 원소의 값이다.
      배열 a는 a[0]=10부터 a[9]=100까지 10씩 증가한다.

  - id: e18-19
    type: multiple-choice
    chapter: 6
    passageRefs: [g18-pointer-arith-intro-01, g18-pointer-arith-code-01]
    prompt: 위에서 ㉡의 결과로서 올바른 것은?
    choices:
      - { id: '1', text: '*(p+3)=30' }
      - { id: '2', text: '*(p+3)=33' }
      - { id: '3', text: '*(p+3)=60' }
      - { id: '4', text: '*(p+3)=70' }
    answers: ['3']
    explanation: |
      선택지 1: 30은 *p, 즉 a[2]의 값으로 p+3만큼 이동한 결과가 아니다.
      선택지 2: 33은 *p+3처럼 값에 3을 더한 결과이며, *(p+3)은 주소를 먼저 이동한 뒤 값을 꺼낸다.
      선택지 3: p는 a[2]를 가리키므로 p+3은 a[5]를 가리키고 *(p+3)은 60이다. 정답이다.
      선택지 4: 70은 a[6]의 값으로 *q에 해당하며, p+3이 아닌 p+4 위치다.

      핵심 개념:
      *(p+3)은 p에서 원소 3개 뒤의 값이다.
      *p+3은 p가 가리키는 값에 3을 더한 것으로 *(p+3)과 다르다.
      p=&a[2]이면 *(p+3)은 a[5]와 같다.
      ㉢의 p-q는 두 포인터 사이의 원소 개수 차이로 -4가 출력된다.

  - id: e18-20
    type: multiple-choice
    chapter: 6
    passageRefs: [g18-float-var-intro-01, g18-float-var-code-01]
    prompt: 위에서 실수형 포인터 변수 fptr을 선언한다면 올바른 표현은?
    choices:
      - { id: '1', text: 'float fptr ;' }
      - { id: '2', text: 'float *fptr ;' }
      - { id: '3', text: 'fptr *float ;' }
      - { id: '4', text: 'fptr float;' }
    answers: ['2']
    explanation: |
      선택지 1: float fptr;는 *가 없어 포인터가 아닌 일반 실수형 변수를 선언한다.
      선택지 2: 포인터 변수는 자료형 *변수명; 형식으로 선언하므로 float *fptr;가 float형 자료의 주소를 저장하는 포인터 변수 선언이다. 정답이다.
      선택지 3: 자료형 float가 변수명 앞에 와야 하는데 순서가 뒤바뀌어 문법에 맞지 않는다.
      선택지 4: 자료형과 변수명의 순서가 바뀌었고 *도 없어 포인터 선언이 아니다.

      핵심 개념:
      포인터 변수 선언 형식은 자료형 *포인터변수명;이다.
      자료형은 포인터가 가리키는 대상의 형이다.
      float *fptr;는 float형 변수의 주소를 저장한다.
      선언문에서 *는 포인터임을 나타내는 표시다.

  - id: e18-21
    type: multiple-choice
    chapter: 6
    passageRefs: [g18-float-var-intro-01, g18-float-var-code-01]
    prompt: 위에서 포인터 변수 fptr에 주소를 할당하는 방법으로 올바른 것은?
    choices:
      - { id: '1', text: 'fptr=var1 ;' }
      - { id: '2', text: 'fptr=&var1;' }
      - { id: '3', text: 'fptr=&3.14 ;' }
      - { id: '4', text: 'fptr=3.14;' }
    answers: ['2']
    explanation: |
      선택지 1: var1은 실수 값 3.14를 담은 변수이므로 그 값을 포인터에 대입하면 주소가 아니다.
      선택지 2: 주소 연산자 &로 변수 var1의 주소를 구해 포인터 변수 fptr에 대입하므로 올바르다. 정답이다.
      선택지 3: 3.14는 기억공간을 갖는 변수가 아닌 상수이므로 & 연산자를 적용할 수 없다.
      선택지 4: 실수 상수 3.14는 주소가 아니므로 포인터 변수에 대입할 수 없다.

      핵심 개념:
      주소 연산자 &는 변수의 기억공간 주소를 구한다.
      포인터 변수에는 같은 자료형 변수의 주소를 대입한다(fptr=&var1;).
      상수나 수식에는 &를 적용할 수 없다.
      대입 후 *fptr로 var1의 값 3.14를 참조할 수 있다.

  - id: e18-22
    type: multiple-choice
