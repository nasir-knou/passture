questions:
  - id: e18-01
    type: multiple-choice
    chapter: 1
    prompt: C 프로그램 작성 시 반드시 작성해야 하는 함수는?
    choices:
      - { id: '1', text: 'scanf()' }
      - { id: '2', text: 'printf()' }
      - { id: '3', text: 'malloc()' }
      - { id: '4', text: 'main()' }
    answers: ['4']
    explanation: |
      선택지 1: scanf()는 표준 입력 함수로, 입력이 필요할 때만 쓰며 모든 프로그램에 반드시 있어야 하는 함수가 아니다.
      선택지 2: printf()는 표준 출력 함수로, 화면 출력이 필요할 때 쓰는 라이브러리 함수일 뿐 필수 함수가 아니다.
      선택지 3: malloc()은 실행 중 기억공간을 할당하는 동적할당 함수로, 동적할당이 필요할 때만 쓴다.
      선택지 4: main()은 프로그램 실행이 시작되는 함수로, 모든 C 프로그램에 반드시 하나 있어야 한다. 정답이다.

      핵심 개념:
      C 프로그램은 하나 이상의 함수로 구성된다.
      실행은 항상 main() 함수에서 시작하므로 main()은 반드시 하나 있어야 한다.
      scanf(), printf(), malloc() 같은 라이브러리 함수는 필요할 때 헤더 파일을 포함해 호출한다.
      main() 외의 함수는 main()이나 다른 함수에서 호출될 때 실행된다.

  - id: e18-02
    type: multiple-choice
    chapter: 3
    prompt: 다음 중 출력양식 변환기호의 설명으로 ==잘못된== 것은?
    choices:
      - { id: '1', text: '%d는 출력 값을 지수형식으로 나타낸다.' }
      - { id: '2', text: '%f는 출력 값을 부동 소수점 형식으로 나타낸다.' }
      - { id: '3', text: '%o는 출력 값을 8진수로 나타낸다.' }
      - { id: '4', text: '%x는 출력 값을 16진수로 나타낸다.' }
    answers: ['1']
    explanation: |
      선택지 1: %d는 정수를 10진수(decimal)로 출력하는 변환기호이며, 지수형식 출력은 %e가 담당하므로 잘못된 설명이다. 정답이다.
      선택지 2: %f는 실수를 소수점 형식(부동 소수점 표기, 예: 3.140000)으로 출력하므로 옳은 설명이다.
      선택지 3: %o는 정수를 8진수(octal)로 출력하므로 옳은 설명이다.
      선택지 4: %x는 정수를 16진수(hexadecimal)로 출력하므로 옳은 설명이다.

      핵심 개념:
      %d: 10진 정수, %o: 8진 정수, %x: 16진 정수를 출력한다.
      %f: 소수점 형식 실수, %e: 지수형식 실수를 출력한다.
      %c: 문자 하나, %s: 문자열을 출력한다.
      변환기호는 출력할 자료형과 일치해야 올바른 값이 표시된다.

  - id: e18-03
    type: multiple-choice
    chapter: 2
    passageRefs: [g18-macro-code-01]
    prompt: 다음과 같은 프로그램의 실행결과로서 올바른 것은?
    choices:
      - { id: '1', text: '10' }
      - { id: '2', text: '34' }
      - { id: '3', text: '45' }
      - { id: '4', text: '70' }
    answers: ['2']
    explanation: |
      선택지 1: 10은 치환 결과 10*3+4=34와 맞지 않는 값이다.
      선택지 2: #define SUM(x,y) x+y는 괄호 없이 문자 그대로 치환되므로 a=10*SUM(3, 4);는 a=10*3+4;가 된다. 곱셈이 덧셈보다 먼저 계산되어 30+4=34이고 a=34가 출력된다. 정답이다.
      선택지 3: 45는 치환 결과 10*3+4와 맞지 않는 값이다.
      선택지 4: 70은 10*(3+4)로 계산한 값으로, 매크로 정의에 괄호가 있을 때(#define SUM(x,y) ((x)+(y)))의 결과다. 주어진 매크로는 괄호가 없어 이렇게 계산되지 않는다.

      핵심 개념:
      #define 매크로는 전처리 단계에서 문자열 그대로 치환된다.
      치환 후 연산자 우선순위가 그대로 적용되므로 곱셈(*)이 덧셈(+)보다 먼저 계산된다.
      의도한 계산 순서를 보장하려면 매크로 본문과 인수를 괄호로 감싼다.
      10*SUM(3, 4) → 10*3+4 → 34이다.

  - id: e18-04
    type: multiple-choice
    chapter: 3
    passageRefs: [g18-if-else-code-01]
    prompt: 다음 프로그램을 조건 연산자를 사용하여 바꾼다면 가장 올바른 것은?
    choices:
      - { id: '1', text: 'x=(a>10; a*100 : a*200);' }
      - { id: '2', text: 'x=(a>10; a*200 : a*100);' }
      - { id: '3', text: 'x=(a>10? a*100 : a*200);' }
      - { id: '4', text: 'x=(a>10? a*200 : a*100);' }
    answers: ['3']
    explanation: |
      선택지 1: 조건 연산자는 조건 뒤에 ?를 써야 하는데 세미콜론(;)을 써서 문법에 맞지 않는다.
      선택지 2: ? 대신 세미콜론을 썼고, 참·거짓일 때의 값도 원래 프로그램과 반대로 되어 있다.
      선택지 3: 조건식 a>10이 참이면 a*100, 거짓이면 a*200을 x에 대입하므로 if~else 문과 같은 동작을 한다. 정답이다.
      선택지 4: 형식은 맞지만 참일 때 a*200, 거짓일 때 a*100을 대입해 원래 프로그램과 반대로 동작한다.

      핵심 개념:
      조건 연산자는 조건식 ? 식1 : 식2 형태의 삼항 연산자다.
      조건식이 참이면 식1, 거짓이면 식2의 값이 결과가 된다.
      if(조건) x=식1; else x=식2;는 x=(조건 ? 식1 : 식2);로 바꿀 수 있다.
      ?와 :의 순서와 위치를 바꾸면 의미가 달라진다.

  - id: e18-05
    type: multiple-choice
    chapter: 3
    passageRefs: [g18-relational-code-01]
    prompt: 다음 프로그램의 실행결과로 올바른 것은?
    choices:
      - { id: '1', text: 'b=1     c=0' }
      - { id: '2', text: 'b=4     c=1' }
      - { id: '3', text: 'b=0     c=1' }
      - { id: '4', text: 'b=1     c=4' }
    answers: ['1']
    explanation: |
      선택지 1: 관계 연산자 >가 대입 연산자 =보다 우선하므로 b=(a>2)이다. 4>2는 참이라 b=1, 4<2는 거짓이라 c=0이 출력된다. 정답이다.
      선택지 2: b에 a의 값 4가 대입되는 것이 아니라 비교 결과(1 또는 0)가 대입되므로 b=4가 될 수 없고, 4<2는 거짓이라 c=1도 아니다.
      선택지 3: 참·거짓 결과를 반대로 적용한 값으로, 4>2는 참(1), 4<2는 거짓(0)이다.
      선택지 4: c=a<2는 c=(a<2)로 비교 결과 0이 대입되며 a의 값 4가 대입되지 않는다.

      핵심 개념:
      관계 연산자(>, <, >=, <=, `==`, !=)의 결과는 참이면 1, 거짓이면 0이다.
      관계 연산자는 대입 연산자보다 우선순위가 높다.
      b=a>2;는 b=(a>2);로 해석된다.
      출력은 줄바꿈 없이 b=1c=0 순서로 이어진다.

  - id: e18-06
    type: multiple-choice
    chapter: 4
    passageRefs: [g18-nested-for-code-01]
    prompt: 다음 프로그램이 실행됐을 때 x는 몇 번 출력되는가?
    choices:
      - { id: '1', text: '15' }
      - { id: '2', text: '18' }
      - { id: '3', text: '24' }
      - { id: '4', text: '36' }
    answers: ['1']
    explanation: |
      선택지 1: 바깥 for문은 i=0~4로 5번, 안쪽 for문은 j=5, 4, 3으로 3번(j>2인 동안) 반복하므로 putchar('x')는 5×3=15번 실행된다. 정답이다.
      선택지 2: 18은 실제 실행 횟수 5×3=15와 맞지 않는다.
      선택지 3: 24는 실제 실행 횟수 5×3=15와 맞지 않는다.
      선택지 4: 36은 실제 실행 횟수 5×3=15와 맞지 않는다.

      핵심 개념:
      중첩 for문의 실행 횟수는 바깥 반복 횟수 × 안쪽 반복 횟수이다.
      for(i=0; i<5; i++)는 i=0, 1, 2, 3, 4로 5번 반복한다.
      for(j=5; j>2; j--)는 j=5, 4, 3으로 3번 반복한다.
      따라서 x는 15번 출력된다.

  - id: e18-07
    type: multiple-choice
    chapter: 4
    passageRefs: [g18-nested-if-code-01]
    prompt: 다음 프로그램의 출력결과로 올바른 것은?
    choices:
      - { id: '1', text: '첫 번째 if' }
      - { id: '2', text: '두 번째 if' }
      - { id: '3', text: '세 번째 if' }
      - { id: '4', text: '두 번째 if 세 번째 if' }
    answers: ['2']
    explanation: |
      선택지 1: 첫 번째 if는 안쪽 조건 `a==0`이 참일 때 출력되는데 a=10이라 거짓이므로 출력되지 않는다.
      선택지 2: 바깥 조건 a>=0은 참이므로 안쪽 if문으로 들어가고, `a==0`은 거짓이라 안쪽 else의 printf("두 번째 if");가 실행된다. 정답이다.
      선택지 3: 세 번째 if는 바깥 조건 a>=0이 거짓일 때 실행되는 else에 있으므로 a=10에서는 실행되지 않는다.
      선택지 4: if~else 구조에서는 참·거짓 중 한쪽만 실행되므로 두 문장이 함께 출력되지 않는다.

      핵심 개념:
      중첩 if문에서 else는 가장 가까운 짝 없는 if와 짝을 이룬다.
      이 프로그램은 if(a>=0) { `if(a==0)` … else … } else … 구조다.
      a=10이면 바깥 조건 참, 안쪽 조건 거짓이므로 "두 번째 if"만 출력된다.
      if~else는 조건에 따라 둘 중 한 문장만 실행한다.

  - id: e18-08
    type: multiple-choice
    chapter: 3
    passageRefs: [g18-string-io-intro-01, g18-string-io-code-01]
    prompt: 위에서 문자열 자료를 입력받기 위해 ㉠의 위치에 사용될 수 있는 표준 입력함수로서 올바르게 나타낸 것은?
    choices:
      - { id: '1', text: 'gets(s);' }
      - { id: '2', text: 'puts(s);' }
      - { id: '3', text: 'scanf("%c", s);' }
      - { id: '4', text: 's=putchar();' }
    answers: ['1']
    explanation: |
      선택지 1: gets(s);는 Enter 키를 누를 때까지 입력한 한 줄의 문자열을 문자 배열 s에 저장하는 표준 입력함수이다. 정답이다.
      선택지 2: puts(s);는 배열 s의 문자열을 화면에 출력하는 표준 출력함수이므로 입력에 쓸 수 없다.
      선택지 3: %c는 문자 하나만 입력받는 변환기호이므로 문자열 전체를 입력받지 못한다. 문자열 입력에는 %s를 쓴다.
      선택지 4: putchar()는 문자 하나를 출력하는 함수이며 인수 없이 호출할 수 없고, 반환값을 배열명 s에 대입할 수도 없다.

      핵심 개념:
      문자열 입력: gets(문자배열), scanf("%s", 문자배열)
      문자열 출력: puts(문자배열), printf("%s", 문자배열)
      문자 하나 입출력: getchar(), putchar(문자)
      배열명은 시작 주소를 나타내는 상수이므로 대입 연산의 왼쪽에 올 수 없다.

  - id: e18-09
    type: multiple-choice
    chapter: 3
    passageRefs: [g18-string-io-intro-01, g18-string-io-code-01]
    prompt: 위에서 입력된 문자열 자료를 출력하기 위해 ㉡의 위치에 사용될 수 있는 표준 출력함수로서 올바르게 나타낸 것은?
    choices:
      - { id: '1', text: 's=puts();' }
      - { id: '2', text: 'printf("%c", s);' }
      - { id: '3', text: 'puts(s);' }
      - { id: '4', text: 'gets(s);' }
    answers: ['3']
    explanation: |
      선택지 1: puts()는 출력할 문자열을 인수로 받아야 하며, 배열명 s는 상수 주소라 대입 연산의 왼쪽에 올 수 없다.
      선택지 2: %c는 문자 하나를 출력하는 변환기호인데 s는 배열의 시작 주소이므로 문자열을 올바르게 출력하지 못한다. 문자열 출력에는 %s를 쓴다.
      선택지 3: puts(s);는 배열 s에 저장된 문자열을 화면에 출력하고 줄을 바꾸는 표준 출력함수이다. 정답이다.
      선택지 4: gets(s);는 문자열을 입력받는 함수이므로 출력 위치에 쓸 수 없다.

      핵심 개념:
      puts(문자배열)는 문자열을 출력한 뒤 자동으로 줄을 바꾼다.
      printf("%s", 문자배열)로도 문자열을 출력할 수 있다.
      gets()는 입력, puts()는 출력 함수로 짝을 이룬다.
      %c는 문자 하나, %s는 문자열에 대응한다.

  - id: e18-10
    type: multiple-choice
    chapter: 5
    passageRefs: [g18-static-block-code-01]
    prompt: 다음과 같은 프로그램의 실행결과로서 올바른 것은?
    choices:
      - { id: '1', text: 'a=5     b=15' }
      - { id: '2', text: 'a=5     b=20' }
      - { id: '3', text: 'a=10   b=15' }
      - { id: '4', text: 'a=10   b=20' }
    answers: ['3']
    explanation: |
      선택지 1: 안쪽 블록의 int a=5;는 블록 안에서만 유효한 별개의 변수이므로 블록이 끝난 뒤 printf의 a는 바깥 a=10이다.
      선택지 2: a의 값도 5가 아니고, 블록 안에서 b=a+10;으로 b가 15로 바뀌었으므로 20도 아니다.
      선택지 3: 블록 안의 b=a+10;은 블록 안의 a(5)를 사용해 b=15로 바꾸고, 블록을 벗어나면 바깥 a=10이 보이므로 a=10 b=15가 출력된다. 정답이다.
      선택지 4: b는 블록 안에서 새로 선언되지 않았으므로 바깥의 static 변수 b 자체가 15로 바뀌어 20이 유지되지 않는다.

      핵심 개념:
      블록 { } 안에서 선언한 변수는 그 블록 안에서만 유효하다.
      안쪽 블록에서 같은 이름의 변수를 선언하면 바깥 변수를 가린다.
      블록 안에서 선언하지 않은 변수(b)를 쓰면 바깥 변수를 그대로 사용·변경한다.
      static 변수는 정적 기억 클래스로 값이 프로그램 종료 시까지 유지된다.

  - id: e18-11
    type: multiple-choice
    chapter: 5
    prompt: 다음 중 함수에 대한 설명으로 ==잘못된== 것은?
    choices:
      - { id: '1', text: '하나의 프로그램에서 반드시 main()함수를 쓸 필요는 없다.' }
      - { id: '2', text: '함수를 호출할 때 괄호를 생략해서는 안 된다.' }
      - { id: '3', text: '되돌려 줄 자료가 없을 때는 void를 쓴다.' }
      - { id: '4', text: 'C 언어에서 함수는 서로 독립적이다.' }
    answers: ['1']
    explanation: |
      선택지 1: C 프로그램은 main() 함수에서 실행을 시작하므로 모든 프로그램에 main() 함수가 반드시 하나 있어야 한다. 잘못된 설명이다. 정답이다.
      선택지 2: 함수는 이름 뒤에 괄호를 붙여 호출하며, 인수가 없어도 fcn1();처럼 괄호를 써야 하므로 옳은 설명이다.
      선택지 3: 반환할 값이 없는 함수는 반환형을 void로 선언하므로 옳은 설명이다.
      선택지 4: C 언어의 함수는 각각 독립된 단위로 정의되며, 한 함수 안에 다른 함수를 정의할 수 없으므로 옳은 설명이다.

      핵심 개념:
      모든 C 프로그램에는 main() 함수가 반드시 하나 있다.
      함수 호출은 함수명(인수) 형태이며 인수가 없어도 괄호를 쓴다.
      반환값이 없는 함수는 void형으로 선언한다.
      함수는 서로 독립적으로 정의되고 인수와 반환값으로 자료를 주고받는다.

  - id: e18-12
    type: multiple-choice
    chapter: 6
    prompt: 다음의 배열에 대한 설명 중 올바르지 ==않은== 것은?
    choices:
      - { id: '1', text: '모든 배열은 자료형과 기억 클래스를 갖는다.' }
      - { id: '2', text: '배열의 각 원소를 변수처럼 사용한다.' }
      - { id: '3', text: '배열명을 증가시키거나 감소시킬 수 있다.' }
      - { id: '4', text: '배열명은 배열 공간의 시작주소를 가리킨다.' }
    answers: ['3']
    explanation: |
      선택지 1: 배열도 변수처럼 int, char 같은 자료형과 auto, static 같은 기억 클래스를 가지므로 옳은 설명이다.
      선택지 2: a[0], a[1]처럼 첨자를 붙인 각 원소는 일반 변수처럼 값을 대입하고 참조할 수 있으므로 옳은 설명이다.
      선택지 3: 배열명은 배열의 시작주소를 나타내는 포인터 상수이므로 a++, a--처럼 값을 바꿀 수 없다. 올바르지 않은 설명이다. 정답이다.
      선택지 4: 배열명은 배열 공간의 첫 원소 주소(&a[0])를 나타내므로 옳은 설명이다.

      핵심 개념:
      배열은 같은 자료형의 원소를 연속된 기억공간에 저장한다.
      배열명은 시작주소를 나타내는 포인터 상수로 변경할 수 없다.
      포인터 변수는 증감할 수 있지만 배열명은 증감할 수 없다.
      배열 원소는 첨자로 접근하며 일반 변수처럼 사용한다.

  - id: e18-13
    type: multiple-choice
    chapter: 5
    passageRefs: [g18-global-intro-01, g18-global-code-01]
    prompt: 위에서 ㉠에 대한 결과로서 올바른 것은?
    choices:
      - { id: '1', text: 'x=0' }
      - { id: '2', text: 'x=1' }
      - { id: '3', text: '알 수 없다' }
      - { id: '4', text: '에러발생' }
    answers: ['1']
    explanation: |
      선택지 1: x는 함수 밖에서 선언한 전역 변수이고, 전역 변수는 초기값을 주지 않으면 0으로 자동 초기화된다. fcn1() 호출 전이므로 ㉠에서 x= 0이 출력된다. 정답이다.
      선택지 2: x가 1이 되는 것은 fcn1()에서 x++;가 실행된 뒤이므로 ㉠ 시점의 값이 아니다.
      선택지 3: 초기화하지 않은 지역(auto) 변수는 쓰레기 값을 갖지만, 전역 변수는 0으로 초기화되므로 값을 알 수 있다.
      선택지 4: x는 main() 이전에 선언되어 main()과 fcn1()에서 모두 사용할 수 있으므로 에러가 발생하지 않는다.

      핵심 개념:
      함수 밖에서 선언한 변수는 전역 변수로, 모든 함수에서 공유한다.
      전역 변수와 static 변수는 초기값이 없으면 0으로 초기화된다.
      지역(auto) 변수는 초기값이 없으면 쓰레기 값을 갖는다.
      한 함수에서 전역 변수를 바꾸면 다른 함수에도 그 값이 반영된다.

