      - { id: '3', text: 'traceroute - 특정 호스트까지 패킷의 통신 경로를 확인' }
      - { id: '4', text: 'route - IP 라우팅 테이블의 설정 또는 확인' }
    answers: ['2']
    explanation: |
      선택지 1: ifconfig는 네트워크 인터페이스의 IP 주소, 넷마스크, MAC 주소 등을 확인하거나 설정하므로 옳은 설명이다.
      선택지 2: nslookup은 DNS(Domain Name System) 서버에 질의해 도메인 이름과 IP 주소를 조회하는 명령이다. 네트워크 연결 상태와 사용 현황을 확인하는 명령은 netstat이므로 잘못된 설명이다.
      선택지 3: traceroute는 목적지 호스트까지 패킷이 거쳐 가는 라우터 경로를 보여 주므로 옳은 설명이다.
      선택지 4: route는 커널의 IP 라우팅 테이블을 출력하거나 경로를 추가·삭제하므로 옳은 설명이다.

      핵심 개념:
      ifconfig(또는 ip addr)는 인터페이스 설정, route(또는 ip route)는 라우팅 테이블을 다룬다.
      ping은 호스트의 응답 여부를, traceroute는 호스트까지의 경로를 점검한다.
      netstat은 네트워크 연결, 열린 포트, 라우팅 등 네트워크 사용 현황을 보여 준다.
      nslookup, dig, host는 DNS 이름 풀이를 점검하는 명령이다.

  - id: e18-25
    type: multiple-choice
    outdated: true
    prompt: 보호된 원격 로그인이나 원격 데이터 통신에 사용되는 프로토콜로서 전자서명으로 연결을 인증하고 패킷을 암호화하여 전송하는 방식은?
    choices:
      - { id: '1', text: 'Telnet' }
      - { id: '2', text: 'FTP' }
      - { id: '3', text: 'SSH' }
      - { id: '4', text: 'SCP' }
    answers: ['3']
    explanation: |
      선택지 1: Telnet은 원격 로그인 프로토콜이지만 계정과 암호를 포함한 모든 데이터를 평문으로 전송해 보안에 취약하다.
      선택지 2: FTP(File Transfer Protocol)는 파일 전송용 프로토콜이며 인증 정보와 데이터를 암호화하지 않는다.
      선택지 3: SSH(Secure Shell)는 공개키 기반 전자서명으로 서버와 사용자를 인증하고 모든 패킷을 암호화해 보호된 원격 로그인과 데이터 통신을 제공한다.
      선택지 4: SCP(Secure Copy)는 SSH 위에서 동작하는 파일 복사 명령·프로토콜로, 원격 로그인이나 통신 전반을 위한 프로토콜 자체는 SSH이다.

      핵심 개념:
      Telnet, FTP, rlogin 같은 전통적 원격 서비스는 데이터를 평문으로 보내 도청 위험이 있다.
      SSH는 기본 22번 포트를 사용하며 인증과 암호화를 모두 제공한다.
      SSH 서버 데몬은 sshd, 클라이언트 명령은 ssh이다.
      scp와 sftp는 SSH의 암호화 채널을 이용해 파일을 안전하게 전송한다.
