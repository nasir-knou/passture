  - id: g18-script-intro-01
    type: text
    body: |
      ※ 다음은 2개의 정수를 비교하여 결과를 표시한 후 두 정수의 합을 출력하는 셸 스크립트이다. 실행 결과를 보고 물음에 답하여라. \$는 셸 프롬프트이다. (56~58)

  - id: g18-script-code-01
    type: code
    language: bash
    body: |
      $ cat intCompare.sh
      #!/bin/bash
      if _____ㄱ_____ then
        echo "You must supply two numbers as arguments"
        exit 1
      fi
      if [ $1 -eq $2 ]; then
        echo "$1 equals to $2."
      elif [ $1 -gt $2 ]; then
        echo "$1 is greater than $2."
      else
        echo "$1 is less than $2."
      fi
      echo ________ㄴ________
      $ chmod u+x intCompare.sh
      $ ________ㄷ________
      36 is less than 68.
      36 + 68는 104입니다.

questions:
  - id: e18-01
    type: multiple-choice
    chapter: 1
    prompt: 리눅스 커널을 포함하여 리눅스 배포판에서 사용되는 많은 소프트웨어들은 주로 어떤 라이선스를 따르고 있는가?
    choices:
      - { id: '1', text: 'Apache' }
      - { id: '2', text: 'BSD' }
      - { id: '3', text: 'GPL' }
      - { id: '4', text: 'MPL' }
    answers: ['3']
    explanation: |
      선택지 1: Apache 라이선스는 아파치 소프트웨어 재단이 만든 허용적(permissive) 라이선스로, 아파치 웹 서버 등 일부 프로젝트에 쓰이지만 리눅스 커널의 라이선스는 아니다.
      선택지 2: BSD(Berkeley Software Distribution) 라이선스는 FreeBSD 등 BSD 계열 운영체제의 허용적 라이선스로, 수정본의 소스 공개 의무가 없다.
      선택지 3: GPL(GNU General Public License)은 자유 소프트웨어 재단(FSF)의 라이선스로, 리눅스 커널과 GNU 도구 등 배포판을 구성하는 대부분의 소프트웨어가 이를 따른다.
      선택지 4: MPL(Mozilla Public License)은 모질라 재단의 라이선스로 파이어폭스 등에 쓰이며 리눅스 소프트웨어의 주된 라이선스가 아니다.

      핵심 개념:
      리눅스 커널은 GPL 버전 2로 배포된다.
      GPL은 소스 코드의 공개와 자유로운 수정·재배포를 보장한다.
      GPL 소프트웨어를 수정해 배포하면 수정본도 GPL로 소스를 공개해야 한다(카피레프트).
      배포판의 기본 도구들도 GNU 프로젝트의 GPL 소프트웨어가 대부분이라 GNU/리눅스라고도 부른다.

  - id: e18-02
    type: multiple-choice
    chapter: 1
    prompt: 다음 중 레드햇 계열의 리눅스 배포판이 ==아닌== 것은?
    choices:
      - { id: '1', text: 'CentOS' }
      - { id: '2', text: 'RHEL' }
      - { id: '3', text: 'ubuntu' }
      - { id: '4', text: 'fedora' }
    answers: ['3']
    explanation: |
      선택지 1: CentOS(Community Enterprise Operating System)는 RHEL의 공개 소스를 다시 빌드한 무료 배포판으로 레드햇 계열이다.
      선택지 2: RHEL(Red Hat Enterprise Linux)은 레드햇사가 판매하는 기업용 배포판으로 레드햇 계열의 중심이다.
      선택지 3: ubuntu는 데비안(Debian)을 기반으로 캐노니컬사가 만든 배포판으로, dpkg·apt 패키지 관리를 쓰는 데비안 계열이다.
      선택지 4: fedora는 레드햇이 후원하는 커뮤니티 배포판으로, 새 기술을 먼저 적용한 뒤 RHEL에 반영하는 레드햇 계열이다.

      핵심 개념:
      리눅스 배포판은 크게 레드햇 계열과 데비안 계열로 나눈다.
      레드햇 계열은 RPM(Red Hat Package Manager) 패키지와 yum을 사용한다.
      데비안 계열(Debian, ubuntu 등)은 deb 패키지와 dpkg·apt를 사용한다.
      Fedora → RHEL → CentOS 순으로 기술이 이어지는 관계를 가진다.

  - id: e18-03
    type: multiple-choice
    chapter: 2
    prompt: 리눅스 시스템에서 표준 디렉터리의 용도에 관한 설명으로 올바른 것은?
    choices:
      - { id: '1', text: '/etc - 시스템의 주요 환경 설정 파일이 위치하는 디렉터리' }
      - { id: '2', text: '/usr - 사용자의 홈 디렉터리가 생성되는 디렉터리' }
      - { id: '3', text: '/dev - 이동식 저장 장치의 마운트 지점을 제공하는 디렉터리' }
      - { id: '4', text: '/var - 커널이 사용하는 가상의 파일 시스템이 위치하는 디렉터리' }
    answers: ['1']
    explanation: |
      선택지 1: /etc에는 passwd, fstab, inittab 등 시스템과 서비스의 주요 설정 파일이 모여 있으므로 올바른 설명이다.
      선택지 2: /usr은 사용자용 명령어·라이브러리·문서 등 공유 프로그램이 설치되는 디렉터리이고, 사용자 홈 디렉터리는 /home 아래에 생성된다.
      선택지 3: /dev는 디스크·터미널 같은 장치 파일이 있는 디렉터리이고, 이동식 저장 장치의 마운트 지점은 /media(또는 /mnt)이다.
      선택지 4: /var는 로그·메일 스풀 등 크기가 계속 변하는 데이터를 담는 디렉터리이고, 커널의 가상 파일 시스템은 /proc(및 /sys)이다.

      핵심 개념:
      리눅스 디렉터리 구조는 FHS(Filesystem Hierarchy Standard)를 따른다.
      /etc는 설정 파일, /home은 사용자 홈, /usr은 사용자 프로그램, /var는 가변 데이터를 둔다.
      /dev는 장치 파일, /proc는 커널·프로세스 정보를 보여 주는 가상 파일 시스템이다.
      /media와 /mnt는 이동식 매체나 임시 파일 시스템의 마운트 지점으로 쓰인다.

  - id: e18-04
    type: multiple-choice
    chapter: 3
    prompt: 셸의 명령 행에서 사용하는 특수 문자에 관한 설명으로 올바른 것은?
    choices:
      - { id: '1', text: '| : 특수 문자 앞에 붙어 특수 문자의 기능을 제거함' }
      - { id: '2', text: '>> : 명령 수행을 위해 파일의 입력이 필요할 때 사용함' }
      - { id: '3', text: '# : 명령을 백그라운드로 실행할 때 사용함' }
      - { id: '4', text: '! : 명령 히스토리 기능을 이용할 때 사용함' }
    answers: ['4']
    explanation: |
      선택지 1: |는 앞 명령의 표준 출력을 뒤 명령의 표준 입력으로 넘기는 파이프이다. 특수 문자 앞에 붙어 그 기능을 없애는(인용하는) 문자는 역슬래시 \이다.
      선택지 2: >>는 명령의 출력을 파일 끝에 덧붙이는 출력 재지정(append)이다. 파일을 명령의 입력으로 쓰는 것은 입력 재지정 <이다.
      선택지 3: #은 그 뒤의 내용을 주석으로 처리하는 문자이다. 명령을 백그라운드로 실행할 때는 명령 끝에 &를 붙인다.
      선택지 4: !는 히스토리 확장 문자로, !!(직전 명령), !번호, !문자열처럼 이전에 실행한 명령을 다시 불러 실행한다.

      핵심 개념:
      셸은 명령 행의 특수 문자(메타 문자)를 먼저 해석한 뒤 명령을 실행한다.
      재지정 >, >>, <와 파이프 |는 입출력의 방향을 바꾼다.
      &는 백그라운드 실행, ;는 명령 순차 실행, #은 주석을 뜻한다.
      \, ' ', " "는 특수 문자의 기능을 없애는 인용 문자이고, !는 히스토리 기능에 쓰인다.

  - id: e18-05
    type: multiple-choice
    chapter: 3
    passageRefs: [g18-type-cd-01]
    prompt: 셸에서 사용되는 명령이 어떻게 해석되는지 알기 위해 아래 밑줄 부분에서 사용해야 하는 명령은 무엇인가? \$는 셸 프롬프트이며 cd는 셸의 내장 명령이다.
    choices:
      - { id: '1', text: 'alias' }
      - { id: '2', text: 'type' }
      - { id: '3', text: 'whereis' }
      - { id: '4', text: 'man' }
    answers: ['2']
    explanation: |
      선택지 1: alias는 명령의 별칭을 정의하거나 목록을 보여 주는 명령으로, 명령이 어떻게 해석되는지 알려 주지 않는다.
      선택지 2: type은 주어진 이름이 별칭, 셸 내장 명령, 함수, 외부 실행 파일 중 무엇으로 해석되는지 알려 주며, type cd를 실행하면 "cd is a shell builtin"이 출력된다.
      선택지 3: whereis는 명령의 실행 파일·소스·매뉴얼 파일의 위치를 찾아 주는 명령으로, 셸 내장 여부를 알려 주지 않는다.
      선택지 4: man은 명령의 온라인 매뉴얼 페이지를 보여 주는 명령이다.

      핵심 개념:
      셸은 입력된 명령을 별칭 → 예약어 → 함수 → 내장 명령 → PATH의 외부 명령 순서로 해석한다.
      type 명령은 그 이름이 실제로 무엇으로 해석되는지 출력한다.
      cd, echo, type 같은 내장 명령은 같은 이름의 실행 파일(예: /usr/bin/echo)이 있더라도 PATH를 찾지 않고 셸이 직접 처리한다.
      외부 명령의 경로는 which나 whereis로 확인할 수 있다.

  - id: e18-06
    type: multiple-choice
    chapter: 4
    prompt: 파일이냐 디렉터리냐에 따라 접근권한의 의미가 약간 다르다. 다음 중 ‘디렉터리의 읽기 권한’을 의미하는 설명은?
    choices:
      - { id: '1', text: '디렉터리에 존재하는 파일의 내용을 읽을 수 있다.' }
      - { id: '2', text: '디렉터리에 어떤 파일과 서브 디렉터리가 있는지 목록을 볼 수 있다.' }
      - {
          id: '3',
          text: '접근권한, 소유자, 크기, 수정 시간 등 디렉터리의 메타 정보를 조회할 수 있다.',
        }
      - { id: '4', text: 'cd 명령을 사용하여 해당 디렉터리로 이동할 수 있다.' }
    answers: ['2']
    explanation: |
      선택지 1: 디렉터리 안 파일의 내용을 읽을 수 있는지는 그 파일 자체의 읽기 권한이 결정한다.
      선택지 2: 디렉터리는 파일 이름 목록을 담은 특수 파일이므로, 디렉터리의 읽기(r) 권한은 ls로 그 안의 파일·서브 디렉터리 목록을 볼 수 있는 권한이다.
      선택지 3: 디렉터리 자체의 접근권한·소유자·크기·수정 시간 같은 메타 정보(inode 정보)는 상위 디렉터리의 실행(x) 권한만 있으면 ls -ld로 조회되며, 해당 디렉터리의 읽기 권한과는 관계없다. 디렉터리 안 항목의 메타 정보를 보려면 그 디렉터리의 실행(x) 권한이 필요하다.
      선택지 4: cd로 디렉터리에 들어가는 것은 디렉터리의 실행(x) 권한이 허용하는 동작이다.

      핵심 개념:
      파일의 r·w·x는 각각 내용 읽기, 내용 수정, 프로그램으로 실행을 뜻한다.
      디렉터리의 r은 목록 보기, w는 파일 생성·삭제·이름 변경, x는 디렉터리 진입과 항목 접근을 뜻한다.
      디렉터리에 w 권한이 있어도 x 권한이 없으면 안의 파일을 만들거나 지울 수 없다.
      같은 rwx 표기라도 대상이 파일인지 디렉터리인지에 따라 의미가 다르다.

  - id: e18-07
    type: multiple-choice
    chapter: 5
    prompt: 리눅스 시스템의 런레벨(runlevel)에 관한 설명으로 ==잘못된== 것은?
    choices:
      - { id: '1', text: '0 - 시스템 종료' }
      - { id: '2', text: '1 - 단일 사용자 모드' }
      - { id: '3', text: '3 - 네트워크 기능을 지원하는 다중 사용자 모드' }
      - { id: '4', text: '5 - 시스템 재부팅' }
    answers: ['4']
    explanation: |
      선택지 1: 런레벨 0은 시스템을 종료(halt)하는 상태로 옳은 설명이다.
      선택지 2: 런레벨 1은 관리자만 로그인해 유지보수를 하는 단일 사용자 모드로 옳은 설명이다.
      선택지 3: 런레벨 3은 네트워크를 지원하는 텍스트(콘솔) 기반 다중 사용자 모드로 옳은 설명이다.
      선택지 4: 런레벨 5는 그래픽 환경(X 윈도)을 지원하는 다중 사용자 모드이고, 시스템 재부팅은 런레벨 6이므로 잘못된 설명이다.

      핵심 개념:
      런레벨은 init 프로세스가 시스템을 어떤 운영 상태로 둘지 나타내는 번호이다.
      0 종료, 1 단일 사용자, 2 네트워크 없는 다중 사용자, 3 텍스트 다중 사용자, 5 그래픽 다중 사용자, 6 재부팅이다.
      기본 런레벨은 전통적으로 /etc/inittab에 지정한다.
      systemd 환경에서는 runlevel 대신 poweroff.target, multi-user.target, graphical.target 같은 타깃을 사용한다.

  - id: e18-08
    type: multiple-choice
    chapter: 6
    prompt: 관리자가 사용자 계정을 생성할 때, 사용자 계정의 기본적 환경 설정이 필요하다. 이때 사용되는 설정 파일(또는 디렉터리)이 ==아닌== 것은?
    choices:
      - { id: '1', text: '/etc/skel/' }
      - { id: '2', text: '/etc/login.defs' }
      - { id: '3', text: '/etc/fstab' }
      - { id: '4', text: '/etc/default/useradd' }
    answers: ['3']
    explanation: |
      선택지 1: /etc/skel/에 있는 .bashrc, .bash_profile 등의 초기 환경 파일이 새 사용자의 홈 디렉터리로 복사된다.
      선택지 2: /etc/login.defs는 UID·GID 범위, 암호 유효 기간, 홈 디렉터리 생성 여부 등 계정 생성의 기본 정책을 정한다.
      선택지 3: /etc/fstab은 부팅 시 마운트할 파일 시스템 목록을 적는 파일로, 사용자 계정 생성과 관계없다.
      선택지 4: /etc/default/useradd는 useradd 명령의 기본값(기본 그룹, 홈 디렉터리 위치, 기본 셸, skel 디렉터리 등)을 정한다.

      핵심 개념:
      useradd로 계정을 만들면 /etc/passwd, /etc/shadow, /etc/group에 정보가 추가된다.
      이때 기본값은 /etc/default/useradd와 /etc/login.defs에서 가져온다.
      홈 디렉터리의 초기 파일은 /etc/skel/의 내용을 복사해 만든다.
      /etc/fstab은 파일 시스템 마운트 설정 파일이다.

  - id: e18-09
    type: multiple-choice
    chapter: 7
    prompt: vi를 사용한 편집 작업 중에 Esc 키를 두 번 치면 항상 어떤 모드로 이동하는가?
    choices:
      - { id: '1', text: '입력 모드' }
      - { id: '2', text: '명령 모드' }
      - { id: '3', text: '라인 모드' }
      - { id: '4', text: '검색 모드' }
    answers: ['2']
    explanation: |
      선택지 1: 입력 모드는 명령 모드에서 i, a, o 등을 눌러 들어가는 모드이며, Esc는 오히려 입력 모드를 빠져나오게 한다.
      선택지 2: Esc는 입력 모드나 입력 중인 라인 명령을 취소하고 명령 모드로 돌아가게 하므로, 현재 모드가 무엇이든 두 번 누르면 항상 명령 모드가 된다.
      선택지 3: 라인 모드(ex 모드)는 명령 모드에서 :을 입력해 들어가며, 이 상태에서 Esc를 누르면 명령 모드로 돌아온다.
      선택지 4: 검색은 명령 모드에서 /나 ?로 시작하는 라인 명령이며, Esc를 누르면 취소되고 명령 모드로 돌아온다.

      핵심 개념:
      vi는 명령 모드, 입력 모드, 라인 모드로 동작한다.
      vi를 실행하면 명령 모드로 시작하며, 모든 모드 전환의 중심이 명령 모드이다.
      명령 모드에서 i·a·o로 입력 모드, :로 라인 모드에 들어간다.
      Esc는 어느 모드에서든 명령 모드로 되돌아가게 하므로, 현재 모드를 모를 때 두 번 누른다.

  - id: e18-10
    type: multiple-choice
    chapter: 8
    passageRefs: [g18-umount-01]
    prompt: 다음 명령이 의미하는 것으로 적당한 것은? \$는 셸 프롬프트이다.
    choices:
      - { id: '1', text: '해당 유형의 모든 파일시스템이 마운트 가능한지 점검함' }
      - { id: '2', text: '/etc/inittab에 나열된 해당 유형의 모든 파일시스템을 점검한 후 마운트함' }
      - { id: '3', text: '/etc/fstab에 나열된 해당 유형의 파일시스템을 모두 언마운트함' }
      - { id: '4', text: '/etc/fstab에 나열된 모든 파일시스템을 언마운트함' }
    answers: ['3']
    explanation: |
      선택지 1: umount는 마운트를 해제하는 명령이고, 마운트 가능 여부를 점검하는 기능이 아니다.
      선택지 2: umount는 마운트를 하지 않으며, /etc/inittab은 런레벨 등 init 설정 파일이지 파일 시스템 목록이 아니다.
      선택지 3: -a는 모든 파일 시스템을, -t iso9660은 대상을 iso9660 유형(CD-ROM 파일 시스템)으로 제한하므로 해당 유형의 파일 시스템을 모두 언마운트한다. 보기 중 -a와 -t의 뜻을 모두 맞게 설명한 것은 이것뿐이다.
      선택지 4: -t iso9660으로 유형을 지정했으므로 모든 파일 시스템이 아니라 iso9660 유형만 언마운트한다.

      핵심 개념:
      mount는 파일 시스템을 디렉터리 트리에 연결하고, umount는 그 연결을 해제한다.
      -a 옵션은 mount에서는 /etc/fstab의 모든 항목을, umount에서는 마운트된 모든 파일 시스템을 대상으로 한다.
      -t 옵션은 대상 파일 시스템의 유형(ext4, xfs, vfat, iso9660 등)을 지정한다.
      iso9660은 CD-ROM에 쓰이는 표준 파일 시스템 유형이다.

      ※ 원본 표기: 정답 선택지는 대상을 /etc/fstab에 나열된 해당 유형의 파일 시스템으로 적었지만, 실제 umount -a는 현재 마운트된 파일 시스템(/proc/self/mountinfo)을 대상으로 한다.

  - id: e18-11
    type: multiple-choice
    chapter: 8
    prompt: 볼륨 관리에서 사용되는 용어의 설명이다. ==잘못된== 것은?
    choices:
      - { id: '1', text: '물리볼륨(pv) - 하나의 물리적 디스크를 말함' }
      - {
          id: '2',
          text: '볼륨그룹(vg) - 여러 물리볼륨을 하나로 묶은 것으로 가상의 하드디스크로 생각할 수 있음',
        }
      - {
          id: '3',
          text: '논리볼륨(lv) - 볼륨 그룹에서 가용 공간을 분할한 것으로 기존 파티션과 개념적으로 일치함',
        }
      - {
          id: '4',
          text: '물리 익스텐트(pe) - 하나의 표준 블록 디바이스로 표현되며 마운트 작업과 파일시스템 검사의 단위가 됨',
        }
    answers: ['4']
    explanation: |
      선택지 1: 물리볼륨(PV, Physical Volume)은 LVM(Logical Volume Manager)에 쓰기 위해 초기화한 물리적 디스크(또는 파티션)로 옳은 설명이다.
      선택지 2: 볼륨그룹(VG, Volume Group)은 여러 물리볼륨을 묶어 만든 저장 공간 풀로, 하나의 큰 가상 하드디스크처럼 다룰 수 있어 옳은 설명이다.
      선택지 3: 논리볼륨(LV, Logical Volume)은 볼륨그룹의 공간을 나누어 만든 것으로, 기존 디스크의 파티션에 해당하므로 옳은 설명이다.
      선택지 4: 물리 익스텐트(PE, Physical Extent)는 물리볼륨을 일정한 크기로 나눈 공간 할당의 최소 단위이다. 표준 블록 디바이스로 표현되어 마운트와 파일 시스템 검사의 단위가 되는 것은 논리볼륨이므로 잘못된 설명이다.

      핵심 개념:
      LVM은 여러 디스크를 묶어 크기를 유연하게 조절할 수 있는 논리적 저장 공간을 만든다.
      PV를 모아 VG를 만들고, VG에서 LV를 잘라내 파일 시스템을 만들어 마운트한다.
      PE는 PV를 같은 크기로 나눈 조각이며, LV는 PE 단위로 공간을 할당받는다.
      LV는 /dev/vg이름/lv이름 형태의 블록 장치로 나타나 일반 파티션처럼 사용된다.

  - id: e18-12
    type: multiple-choice
    chapter: 8
    prompt: 파일 시스템 유형에 관한 설명으로 ==잘못된== 것은?
    choices:
      - {
          id: '1',
          text: 'XFS - 리눅스의 차세대 파일 시스템으로 여러 서버에서 동시 마운트와 동시 접근이 가능한 공유 파일 시스템이다.',
        }
      - {
          id: '2',
          text: 'ext2 - 저널링을 지원하지 않으며 100MB 이하의 작은 파티션에 사용하는 것이 좋다.',
        }
      - {
          id: '3',
          text: 'ext4 - 레드햇 계열 리눅스의 기본 파일 시스템으로 범용이며 특별한 이유가 없다면 이것을 사용하면 된다.',
        }
      - {
          id: '4',
          text: 'vfat - 윈도우 운영체제와 호환되는 파일 시스템으로 USB에서 주로 사용된다.',
        }
    answers: ['1']
    explanation: |
      선택지 1: XFS는 대용량 파일과 파일 시스템에 강한 고성능 저널링 파일 시스템이다. 여러 서버가 동시에 마운트하고 접근하는 공유(클러스터) 파일 시스템은 GFS2(Global File System 2)이므로 잘못된 설명이다.
      선택지 2: ext2는 저널링 기능이 없는 파일 시스템으로, 저널 공간 부담이 없어 /boot처럼 작은 파티션에 적합하다는 옳은 설명이다.
      선택지 3: ext4는 ext3를 확장한 범용 저널링 파일 시스템으로, RHEL 6(CentOS 6) 등 레드햇 계열에서 기본 파일 시스템으로 쓰였다.
      선택지 4: vfat은 윈도우의 FAT 파일 시스템과 호환되어 USB 메모리 등 이동식 매체에 주로 쓰인다.

      핵심 개념:
      ext2는 비저널링, ext3는 저널링 추가, ext4는 대용량·성능을 개선한 저널링 파일 시스템이다.
      저널링은 변경 내용을 먼저 기록해 두어 비정상 종료 뒤 빠르게 복구할 수 있게 한다.
      XFS는 대용량에 적합한 고성능 저널링 파일 시스템이고, GFS2는 여러 노드가 공유하는 클러스터 파일 시스템이다.
      vfat은 윈도우와의 호환용, iso9660은 CD-ROM용 파일 시스템이다.

  - id: e18-13
    type: multiple-choice
    chapter: 9
    passageRefs: [g18-ps-01]
    prompt: 다음 명령의 결과를 정확히 설명한 것은? \$는 셸 프롬프트이다.
    choices:
      - {
          id: '1',
          text: '현재 터미널과 연결되어 있는 프로세스 중 EUID가 현재 사용자의 UID와 같은 프로세스를 보여준다.',
        }
      - {
          id: '2',
          text: '터미널을 종료해도 현재 실행 중인 프로그램이 종료되지 않고 계속 수행되게 한다.',
        }
      - {
          id: '3',
          text: '현재 사용자가 소유한 모든 프로세스를 출력한다. 데몬 프로세스처럼 터미널과 연결되어 있지 않은 프로세스도 출력한다.',
        }
      - { id: '4', text: '모든 사용자의 모든 프로세스를 자세히 보여준다.' }
    answers: ['1']
    explanation: |
      선택지 1: 옵션 없는 ps는 현재 터미널에 연결된 프로세스 중 유효 사용자 ID(EUID)가 현재 사용자와 같은 프로세스만 보여 주므로 정확한 설명이다.
      선택지 2: 터미널이 종료되어도 프로그램이 계속 실행되게 하는 명령은 nohup이다.
      선택지 3: 터미널과 관계없이 현재 사용자가 소유한 모든 프로세스를 보려면 ps -u 사용자명이나 ps x처럼 옵션을 주어야 한다.
      선택지 4: 모든 사용자의 모든 프로세스를 자세히 보려면 ps -ef나 ps aux를 사용한다.

      핵심 개념:
      ps는 실행 중인 프로세스의 스냅숏을 출력하는 명령이다.
      옵션 없이 실행하면 현재 터미널의 자기 프로세스만 PID, TTY, TIME, CMD 형식으로 보여 준다.
      -e(또는 ax)는 모든 프로세스, -f(또는 u)는 자세한 정보를 출력하게 한다.
      nohup은 로그아웃 후에도 프로세스가 계속 실행되게 하는 별도의 명령이다.

  - id: e18-14
    type: multiple-choice
    chapter: 9
    prompt: 특정 작업을 주기적으로 실행시키는 cron 서비스에 관한 설명이다. ==잘못된== 것은?
    choices:
      - { id: '1', text: 'crond 데몬 프로그램이 1분 간격으로 설정 파일을 검사하여 수행한다.' }
      - {
          id: '2',
          text: '관리자가 시스템 수준의 설정 파일을 수정할 때, vi 편집기로 편집할 수 없으며 반드시 crontab 명령을 사용해야 한다.',
        }
      - {
          id: '3',
          text: '시스템 수준에서 /etc/crontab 파일과 /etc/cron.d/ 디렉터리에 존재하는 파일이 cron 서비스의 작업 설정 파일이다.',
        }
      - { id: '4', text: '일반 사용자도 자신만의 cron 작업을 등록하거나 수정할 수 있다.' }
    answers: ['2']
    explanation: |
      선택지 1: crond 데몬은 매분 설정 파일을 검사해 실행 시각이 된 작업을 수행하므로 옳은 설명이다.
      선택지 2: 시스템 수준 설정 파일인 /etc/crontab과 /etc/cron.d/의 파일은 관리자가 vi 같은 편집기로 직접 편집한다. crontab 명령은 사용자별 cron 작업을 편집할 때 쓰므로 잘못된 설명이다.
      선택지 3: /etc/crontab과 /etc/cron.d/ 아래의 파일이 시스템 수준 cron 작업 설정 파일이므로 옳은 설명이다.
      선택지 4: 일반 사용자도 crontab -e로 자신의 cron 작업을 등록·수정할 수 있으며(cron.allow/cron.deny로 제한 가능), 옳은 설명이다.

      핵심 개념:
      cron은 정해진 시각에 작업을 반복 실행하는 서비스이고, crond 데몬이 매분 설정을 확인한다.
      설정 형식은 분 시 일 월 요일 명령이며, 시스템 설정 파일에는 실행 사용자 필드가 추가된다.
      시스템 작업은 /etc/crontab, /etc/cron.d/에 편집기로 직접 작성한다.
      사용자 작업은 crontab -e(편집), -l(목록), -r(삭제)로 관리하며 /var/spool/cron/에 저장된다.

  - id: e18-15
    type: multiple-choice
    chapter: 4
    passageRefs: [g18-passwd-ls-01]
    prompt: 다음 명령은 /usr/bin/passwd 파일의 자세한 정보를 보여준다. 이 파일에 적용된 특수권한과 관련된 설명 중 ==잘못된== 것은? \$는 셸 프롬프트이다.
    choices:
      - { id: '1', text: 'passwd 파일에 특수권한인 SetUID가 설정되어 있다.' }
      - { id: '2', text: '일반 사용자가 passwd 명령을 실행할 때 root 권한으로 실행된다.' }
      - {
          id: '3',
          text: '일반 사용자 계정으로도 /usr/bin/passwd 파일을 vi 편집기로 직접 수정할 수 있다.',
        }
      - {
          id: '4',
          text: '일반 사용자가 passwd 명령을 사용하여 암호를 수정할 때, 암호가 저장된 /etc/shadow 파일의 수정이 가능하다.',
        }
    answers: ['3']
    explanation: |
      선택지 1: 소유자 실행 위치에 x 대신 s가 표시된 -rwsr-xr-x이므로 SetUID가 설정되어 있다.
      선택지 2: SetUID가 설정된 실행 파일은 실행한 사용자가 아니라 파일 소유자(root)의 권한으로 실행된다.
      선택지 3: 파일 쓰기 권한은 소유자 root에게만 있고(rws), 그룹과 기타 사용자는 r-x이므로 일반 사용자는 이 파일을 수정할 수 없다. SetUID는 실행 시 권한에만 영향을 주므로 잘못된 설명이다.
      선택지 4: passwd가 root 권한으로 실행되므로, 일반 사용자는 쓸 수 없는 /etc/shadow에 새 암호를 기록할 수 있다.

      핵심 개념:
      특수권한에는 SetUID(4000), SetGID(2000), Sticky bit(1000)가 있다.
      SetUID가 설정된 실행 파일은 실행되는 동안 파일 소유자의 유효 사용자 ID(EUID)로 동작한다.
      ls -l에서 SetUID는 소유자 실행 자리에 s(실행 권한 없으면 S)로 표시된다.
      특수권한은 실행 중의 권한을 바꿀 뿐, 파일 자체의 읽기·쓰기 권한을 바꾸지 않는다.

  - id: e18-16
    type: multiple-choice
    chapter: 10
    prompt: 다음은 RPM 패키지 관리에 대한 설명이다. ==잘못된== 것은?
    choices:
      - { id: '1', text: 'RPM은 레드햇 계열 리눅스에서 패키지 파일의 표준 형식이다.' }
      - { id: '2', text: 'RPM은 RPM 패키지 관리 프로그램(Rpm Package Manager)을 의미한다.' }
      - {
          id: '3',
          text: 'rpm 명령을 사용하여 신규로 패키지를 설치하거나 기존 패키지를 업그레이드할 수 있다.',
        }
      - {
          id: '4',
          text: 'rpm 명령을 사용하면 설치하고자 하는 패키지의 ‘선행 패키지’가 필요할 때 자동으로 찾아 설치해 준다.',
        }
    answers: ['4']
    explanation: |
      선택지 1: RPM은 레드햇 계열 배포판에서 쓰는 표준 패키지 파일 형식(.rpm)이므로 옳은 설명이다.
      선택지 2: RPM은 패키지 형식이자 이를 관리하는 프로그램인 RPM Package Manager를 가리키므로 옳은 설명이다.
      선택지 3: rpm -i로 신규 설치, rpm -U로 설치 또는 업그레이드를 할 수 있으므로 옳은 설명이다.
      선택지 4: rpm은 의존성을 검사만 할 뿐 필요한 선행 패키지를 자동으로 찾아 설치하지 않아 의존성 오류가 나면 직접 설치해야 한다. 자동 해결은 yum의 기능이므로 잘못된 설명이다.

      핵심 개념:
      RPM은 레드햇 계열의 패키지 형식과 관리 도구를 함께 가리킨다.
      rpm 명령은 -i(설치), -U(업그레이드), -e(삭제), -q(질의) 등으로 로컬 패키지 파일을 다룬다.
      rpm은 선행 패키지(의존성)를 자동 해결하지 못한다.
      yum은 저장소에서 필요한 패키지와 의존 패키지를 자동으로 내려받아 설치한다.

  - id: e18-17
    type: multiple-choice
    chapter: 10
    prompt: yum 명령의 사용법을 설명한 것이다. ==잘못된== 것은?
    choices:
      - { id: '1', text: 'yum list installed [패키지명] - 패키지를 설치' }
      - { id: '2', text: 'yum info [패키지명] - 패키지의 설명과 요약 정보를 출력' }
      - { id: '3', text: 'yum remove 패키지명 - 패키지를 삭제' }
      - { id: '4', text: 'yum history - 패키지 설치 이력을 확인' }
    answers: ['1']
    explanation: |
      선택지 1: yum list installed는 이미 설치된 패키지의 목록을 보여 주는 명령이고, 패키지 설치는 yum install이므로 잘못된 설명이다.
      선택지 2: yum info는 패키지의 버전, 크기, 저장소, 요약, 설명 등 정보를 출력하므로 옳은 설명이다.
      선택지 3: yum remove(또는 erase)는 패키지를 삭제하므로 옳은 설명이다.
      선택지 4: yum history는 설치·삭제·업데이트 등 트랜잭션 이력을 보여 주므로 옳은 설명이다.

      핵심 개념:
      yum(Yellowdog Updater Modified)은 레드햇 계열의 저장소 기반 패키지 관리 도구이다.
      install(설치), update(업데이트), remove(삭제), info(정보), search(검색)를 사용한다.
      list는 패키지 목록을 보이며 installed, available, updates 등으로 범위를 정한다.
      history는 작업 이력을 확인하고 undo 등으로 되돌릴 때 쓴다.

  - id: e18-18
    type: multiple-choice
    chapter: 10
    prompt: 두 파일을 압축하고 연결시켜 하나의 압축 파일(bar.gz)을 만드는 명령으로 적당하지 ==않은== 것은 무엇인가? gzip 명령의 -c 옵션은 결과를 표준 출력으로 내보낸다.
    choices:
      - { id: '1', text: 'cat file1 file2 | gzip > bar.gz' }
      - { id: '2', text: 'gzip -c file1 > bar.gz; gzip -c file2 >> bar.gz' }
      - { id: '3', text: 'gzip -c file1 file2 > bar.gz' }
      - { id: '4', text: 'gzip file1 file2 > bar.gz' }
    answers: ['4']
    explanation: |
      선택지 1: cat으로 두 파일을 이어 붙인 내용을 파이프로 gzip에 넘기고, gzip이 표준 입력을 압축해 표준 출력으로 내보낸 결과가 bar.gz에 저장된다.
      선택지 2: file1의 압축 결과를 bar.gz에 쓰고 file2의 압축 결과를 >>로 덧붙인다. gzip 형식은 여러 압축 멤버를 이어 붙여도 풀면 원본이 연결된 결과가 나오므로 적당하다.
      선택지 3: -c 옵션으로 file1, file2를 각각 압축한 결과를 차례로 표준 출력에 내보내므로 두 압축 멤버가 이어진 bar.gz가 만들어진다.
      선택지 4: -c 없이 실행하면 gzip은 file1.gz, file2.gz를 따로 만들고 원본을 지우며 표준 출력으로는 아무것도 내보내지 않으므로, bar.gz는 빈 파일이 된다.

      핵심 개념:
      gzip은 기본적으로 파일마다 .gz 파일을 만들고 원본을 삭제한다.
      -c 옵션을 주면 원본을 그대로 두고 압축 결과를 표준 출력으로 보낸다.
      여러 gzip 압축 데이터를 이어 붙인 파일은 풀면 원본들이 연결된 내용이 된다.
      파일 인자 없이 실행하면 gzip은 표준 입력을 압축해 표준 출력으로 내보낸다.

  - id: e18-19
    type: multiple-choice
    outdated: true
    passageRefs: [g18-httpd-listen-01]
    prompt: Apache 웹 서버의 설정 파일인 httpd.conf에서 다음 항목이 의미하는 것은 무엇인가?
    choices:
      - { id: '1', text: '클라이언트가 보낼 수 있는 최대 요청 수를 설정' }
      - { id: '2', text: '웹 서버가 사용할 TCP 포트 번호를 설정' }
      - { id: '3', text: '유휴 자식 서버 프로세스 수의 최댓값을 설정' }
      - { id: '4', text: '동시에 접속 가능한 클라이언트 수의 최댓값을 설정' }
    answers: ['2']
    explanation: |
      선택지 1: 하나의 지속 연결에서 허용하는 최대 요청 수는 MaxKeepAliveRequests 지시자로 설정한다.
      선택지 2: Listen 지시자는 웹 서버가 연결을 기다릴 TCP 포트(와 IP 주소)를 지정하므로, 이 설정으로 80번과 8080번 포트에서 요청을 받는다.
      선택지 3: 유휴 자식 서버 프로세스 수의 최댓값은 MaxSpareServers 지시자로 설정한다.
      선택지 4: 동시에 접속 가능한 클라이언트 수의 최댓값은 MaxClients(MaxRequestWorkers) 지시자로 설정한다.

      핵심 개념:
      Apache 웹 서버의 주 설정 파일은 httpd.conf이다.
      Listen은 서버가 수신할 포트를 정하며, 여러 줄을 써서 여러 포트를 동시에 열 수 있다.
      HTTP의 기본 포트는 80이고, 8080은 대체 HTTP 포트로 흔히 쓰인다.
      Max로 시작하는 지시자들은 프로세스 수와 연결 수 등 서버 자원을 제한한다.

  - id: e18-20
    type: multiple-choice
    chapter: 5
    prompt: 실행 중인 Apache 웹 서버의 설정을 변경한 후에는 프로그램을 다시 시작해야 효력이 발생한다. 이때 적당한 명령을 보기에서 찾으면 무엇인가?
    choices:
      - { id: '1', text: 'chkconfig httpd on' }
      - { id: '2', text: 'chkconfig --list sshd' }
      - { id: '3', text: 'service sshd restart' }
      - { id: '4', text: 'service httpd restart' }
    answers: ['4']
    explanation: |
      선택지 1: chkconfig httpd on은 부팅할 때 httpd가 자동으로 시작되도록 등록하는 명령으로, 실행 중인 서버를 다시 시작하지 않는다.
      선택지 2: chkconfig --list sshd는 런레벨별로 sshd 서비스의 자동 시작 여부를 보여 주는 명령이다.
      선택지 3: service sshd restart는 원격 접속 서비스인 SSH 데몬을 다시 시작하는 명령으로 Apache와 관계없다.
      선택지 4: Apache 웹 서버의 데몬 이름은 httpd이므로 service httpd restart로 서비스를 재시작해 변경된 설정을 적용한다.

      핵심 개념:
      service 명령은 서비스를 start, stop, restart, status 등으로 즉시 제어한다.
      chkconfig는 런레벨별 부팅 시 자동 시작 여부를 설정(on/off)하거나 확인(--list)한다.
      Apache 웹 서버의 서비스 이름은 httpd, SSH 서버는 sshd이다.
      systemd 환경에서는 systemctl restart httpd, systemctl enable httpd가 같은 역할을 한다.

  - id: e18-21
    type: multiple-choice
    chapter: 11
    passageRefs: [g18-script-intro-01, g18-script-code-01]
    prompt: 2개의 인수가 제공되었는지 확인하기 위해 밑줄 친 ㄱ에 들어갈 내용으로 적당한 것은?
    choices:
      - { id: '1', text: 'test \$* -ne 2;' }
      - { id: '2', text: 'test \$# -eq 2;' }
      - { id: '3', text: '[ \$# -ne 2 ];' }
      - { id: '4', text: '[ \$# -eq 2 ];' }
    answers: ['3']
    explanation: |
      선택지 1: \$*는 모든 위치 매개변수를 나열한 값(36 68)이므로 인수의 개수와 비교할 수 없고, 정수 비교에 인자가 너무 많아 오류가 난다.
      선택지 2: 인수가 2개일 때 참이 되므로, 정상 입력인데도 "You must supply two numbers as arguments"를 출력하고 exit 1로 종료하게 된다.
      선택지 3: \$#은 인수의 개수이며, 개수가 2가 아닐 때(-ne) 참이 되어 오류 메시지를 출력하고 종료하므로 스크립트의 의도와 맞다.
      선택지 4: 인수가 2개일 때 참이 되어 정상 입력에서 오류 메시지를 출력하고 종료하므로 조건이 반대이다.

      핵심 개념:
      \$#은 위치 매개변수의 개수, \$1·\$2는 각 인수, \$*와 \$@는 모든 인수를 나타낸다.
      test 조건식과 [ 조건식 ]은 같은 의미이며, [ 뒤와 ] 앞에는 공백이 필요하다.
      정수 비교 연산자는 -eq(같음), -ne(다름), -gt(큼), -lt(작음), -ge, -le이다.
      if 조건 다음 줄에 then을 쓰지 않으면 ;로 구분해 같은 줄에 then을 쓴다.

      ※ 공통 지문의 (56~58)은 원본 문항 번호로, 이 세트의 21~23번에 해당한다.

  - id: e18-22
    type: multiple-choice
    chapter: 11
    passageRefs: [g18-script-intro-01, g18-script-code-01]
    prompt: 두 정수의 합을 출력하기 위해 밑줄 친 ㄴ에 들어갈 내용으로 적당한 것은?
    choices:
      - { id: '1', text: '"\$1 + \$2는 (\$1+\$2)입니다."' }
      - { id: '2', text: '"\$1 + \$2는 \$(\$1+\$2)입니다."' }
      - { id: '3', text: '''\$1 + \$2는 \$[\$1+\$2]입니다.''' }
      - { id: '4', text: '"\$1 + \$2는 \$[\$1+\$2]입니다."' }
    answers: ['4']
    explanation: |
      선택지 1: 괄호 앞에 \$가 없어 산술 연산이 일어나지 않으므로 "36 + 68는 (36+68)입니다."가 출력된다.
      선택지 2: \$( )는 괄호 안을 명령으로 실행하는 명령 치환이므로 36+68이라는 명령을 찾다가 오류가 나고 합이 출력되지 않는다.
      선택지 3: 작은따옴표 안에서는 \$의 의미가 사라지므로 "\$1 + \$2는 \$[\$1+\$2]입니다."가 글자 그대로 출력된다.
      선택지 4: 큰따옴표 안에서는 변수와 산술 확장이 수행되고 \$[ ]는 산술 연산을 계산하므로 "36 + 68는 104입니다."가 출력되어 실행 결과와 같다.

      핵심 개념:
      큰따옴표는 \$ 확장(변수, 명령 치환, 산술 확장)을 허용하고 작은따옴표는 모든 확장을 막는다.
      bash의 산술 확장은 \$(( 식 ))이 표준이고 \$[ 식 ]은 예전 형식이다.
      \$( 명령 )은 명령 치환으로, 명령의 출력으로 대체된다.
      expr 명령이나 let으로도 정수 연산을 할 수 있다.

      ※ 공통 지문의 (56~58)은 원본 문항 번호로, 이 세트의 21~23번에 해당한다.

  - id: e18-23
    type: multiple-choice
    chapter: 11
    passageRefs: [g18-script-intro-01, g18-script-code-01]
    prompt: 셸 스크립트를 실행하기 위해 밑줄 친 ㄷ에 들어갈 명령으로 적당한 것은?
    choices:
      - { id: '1', text: './intCompare.sh 36 68' }
      - { id: '2', text: 'script inCompare.sh 36 68' }
      - { id: '3', text: './intCompare 36 68' }
      - { id: '4', text: 'intCompare 36 68' }
    answers: ['1']
    explanation: |
      선택지 1: chmod u+x로 실행 권한을 준 현재 디렉터리의 intCompare.sh를 ./로 경로를 지정해 실행하고 인수 36, 68을 전달하므로 적당하다.
      선택지 2: script는 터미널 세션의 입출력을 파일에 기록하는 명령으로 셸 스크립트를 실행하지 않으며, 파일 이름도 intCompare.sh가 아니다.
      선택지 3: 파일 이름은 확장자를 포함한 intCompare.sh이므로 ./intCompare라는 파일은 없다.
      선택지 4: 경로 없이 이름만 쓰면 PATH에 등록된 디렉터리에서만 찾으며, 파일 이름도 intCompare.sh와 다르다.

      핵심 개념:
      셸 스크립트는 실행 권한을 준 뒤 경로를 지정해 실행하거나 bash 스크립트명으로 실행한다.
      현재 디렉터리는 보통 PATH에 없으므로 ./스크립트명처럼 경로를 붙인다.
      명령 행에서 스크립트 이름 뒤에 쓴 값은 \$1, \$2 등의 위치 매개변수로 전달된다.
      #!/bin/bash는 스크립트를 해석할 셸을 지정하는 첫 줄이다.

      ※ 공통 지문의 (56~58)은 원본 문항 번호로, 이 세트의 21~23번에 해당한다.

  - id: e18-24
    type: multiple-choice
    outdated: true
    prompt: 네트워크 점검 명령에 관한 일반적 설명으로 ==잘못된== 것은?
    choices:
