      - redirection
  - id: b05-01
    type: multiple-choice
    prompt: Rocky Linux에서 제일 먼저 실행되는 사용자 프로세스이며, PID가 1인 프로세스로 모든 사용자 프로세스의 최상위 부모 프로세스인 것은?
    choices:
      - id: '1'
        text: boot loader
      - id: '2'
        text: bootstrap loader
      - id: '3'
        text: systemd
      - id: '4'
        text: kernel
    answers:
      - '3'
    explanation: |
      선택지 1: boot loader(부트 로더)는 커널 이미지를 메모리에 적재하고 실행시키는 프로그램으로, 커널이 실행된 뒤에는 남아 있는 프로세스가 아니다.
      선택지 2: bootstrap loader는 전원이 켜졌을 때 펌웨어가 실행하는 초기 적재 프로그램으로, 사용자 프로세스가 아니다.
      선택지 3: systemd는 커널이 부팅 마지막에 실행하는 첫 번째 사용자 프로세스로 PID가 1이며, 모든 사용자 프로세스의 최상위 부모 프로세스다. 정답이다.
      선택지 4: kernel(커널)은 운영체제의 핵심으로 프로세스를 생성·관리하는 주체이며, PID 1인 사용자 프로세스가 아니다.

      핵심 개념:
      Rocky Linux 등 최신 리눅스는 init 대신 systemd를 PID 1의 초기화 데몬으로 사용한다.
      systemd는 서비스(유닛)를 병렬로 시작하고, 고아가 된 프로세스의 부모 역할도 맡는다.
    tags:
      - systemd
      - boot-process
  - id: b05-02
    type: multiple-choice
    passageRefs:
      - guw05-p1-boot-steps-01
    prompt: 시스템마다 약간의 차이는 있으나 전형적인 부팅 절차를 요약하면 다음과 같다. ㉠에 들어갈 용어는 무엇인가?
    choices:
      - id: '1'
        text: 프로세스
      - id: '2'
        text: 마스터 부트 레코드
      - id: '3'
        text: 부트 로더
      - id: '4'
        text: 부트스트랩
    answers:
      - '3'
    explanation: |
      선택지 1: 프로세스는 실행 중인 프로그램을 가리키는 일반적인 용어로, 커널 이미지를 찾아 메모리에 로드하는 특정 단계의 프로그램이 아니다.
      선택지 2: 마스터 부트 레코드(MBR)는 디스크의 첫 섹터로, 부트 로더의 첫 단계 코드와 파티션 테이블을 담는 저장 영역이다. 커널 이미지를 찾아 로드하고 시작시키는 주체는 아니다.
      선택지 3: 부트 로더(GRUB 등)는 BIOS나 부트 펌웨어가 로드·실행하며, 디스크에서 커널 이미지를 찾아 메모리에 로드하고 시작시킨다. 정답이다.
      선택지 4: 부트스트랩은 전원이 켜진 뒤 스스로 시스템을 기동하는 과정 전체를 가리키는 말로, ㉠ 자리에 들어갈 구체적인 프로그램이 아니다.

      핵심 개념:
      부팅 순서: BIOS/UEFI → 부트 로더 → 커널 적재·실행 → 장치 초기화와 루트 파일 시스템 마운트 → systemd 실행 → 서비스 시작과 로그인 화면.
      커널을 찾아 로드하는 것이 부트 로더의 역할이다.
    tags:
      - boot-process
      - boot-loader
  - id: b05-03
    type: multiple-choice
    passageRefs:
      - guw05-p1-boot-steps-01
    prompt: 2번 문제에서 ㉡에 들어갈 내용은 무엇인가?
    choices:
      - id: '1'
        text: systemd 데몬
      - id: '2'
        text: start 데몬
      - id: '3'
        text: httpd 데몬
      - id: '4'
        text: cron 데몬
    answers:
      - '1'
    explanation: |
      선택지 1: 커널은 루트 파일 시스템을 마운트한 뒤 systemd 데몬을 시작시키고 제어권을 넘기며, systemd는 '시스템과 서비스 관리자'로서 기존 init 프로세스가 하던 시스템 초기화 작업을 수행한다. 정답이다.
      선택지 2: start 데몬이라는 표준 초기화 데몬은 없다.
      선택지 3: httpd 데몬은 아파치 웹 서버 데몬으로, 초기화 데몬이 시작시키는 서비스 중 하나다.
      선택지 4: cron 데몬은 예약된 작업을 정해진 시간에 실행하는 서비스로, 역시 초기화 데몬이 시작시키는 서비스다.

      핵심 개념:
      커널이 처음 실행하는 사용자 프로세스는 초기화 데몬(systemd, 예전에는 init)이다.
      systemd가 나머지 서비스(httpd, crond 등)를 시작하고 로그인 화면을 띄운다.
    tags:
      - systemd
      - boot-process
  - id: b05-04
    type: multiple-choice
    prompt: systemd가 수행하는 기능으로 옳지 ==않은== 것은?
    choices:
      - id: '1'
        text: 압축된 커널 이미지를 메모리에 로드하여 압축을 푼다.
      - id: '2'
        text: 파일 시스템을 마운트한다.
      - id: '3'
        text: 부팅 시 구동되어야 할 서비스를 시작시킨다.
      - id: '4'
        text: 로그인 서비스를 시작시킨다.
    answers:
      - '1'
    explanation: |
      선택지 1: 압축된 커널 이미지를 메모리에 로드하는 것은 부트 로더의 기능이고, 압축을 푸는 것은 커널 이미지 자신이 한다. systemd는 커널이 실행된 뒤에 시작되므로 이 일을 할 수 없다. 옳지 않은 설명이므로 정답이다.
      선택지 2: systemd는 /etc/fstab 등을 바탕으로 마운트 유닛을 만들어 파일 시스템을 마운트한다. 옳은 설명이다.
      선택지 3: systemd는 기본 타깃에 연결된 서비스 유닛을 시작시킨다. 옳은 설명이다.
      선택지 4: systemd는 getty나 디스플레이 관리자 같은 로그인 서비스를 시작시킨다. 옳은 설명이다.

      핵심 개념:
      systemd는 PID 1의 시스템·서비스 관리자로, 유닛(서비스, 마운트, 타깃 등) 단위로 시스템을 초기화한다.
      커널 적재는 부팅 단계상 systemd보다 앞선 부트 로더의 몫이다.
    tags:
      - systemd
      - boot-process
  - id: b05-05
    type: multiple-choice
    prompt: 리눅스 시스템의 런레벨(runlevel)에 관한 설명으로 ==잘못된== 것은?
    choices:
      - id: '1'
        text: 0 - 시스템 종료
      - id: '2'
        text: 1 - 단일 사용자 모드
      - id: '3'
        text: 3 - 네트워크 기능을 지원하는 다중 사용자 모드
      - id: '4'
        text: 5 - 시스템 재부팅
    answers:
      - '4'
    explanation: |
      선택지 1: 런레벨 0은 시스템 종료(halt)다. 옳은 설명이다.
      선택지 2: 런레벨 1은 관리 작업을 위한 단일 사용자 모드다. 옳은 설명이다.
      선택지 3: 런레벨 3은 네트워크를 지원하는 텍스트 기반 다중 사용자 모드다. 옳은 설명이다.
      선택지 4: 런레벨 5는 그래픽 사용자 환경을 지원하는 다중 사용자 모드다. 재부팅에 사용되는 런레벨은 6이다. 잘못된 설명이므로 정답이다.

      핵심 개념:
      런레벨 0 종료, 1 단일 사용자, 2 네트워크 없는 다중 사용자, 3 텍스트 다중 사용자, 4 미사용, 5 그래픽 다중 사용자, 6 재부팅이다.
      systemd에서는 각각 poweroff.target, rescue.target, multi-user.target, graphical.target, reboot.target 등의 타깃이 대응한다.
    tags:
      - runlevel
      - systemd-target
  - id: b05-06
    type: multiple-choice
    prompt: 현재 설정되어 있는 기본 타깃을 확인하는 명령은?
    choices:
      - id: '1'
        text: systemctl isolate
      - id: '2'
        text: systemctl list-dependencies
      - id: '3'
        text: systemctl get-default
      - id: '4'
        text: systemctl set-default
    answers:
      - '3'
    explanation: |
      선택지 1: systemctl isolate는 지정한 타깃으로 즉시 전환하는 명령으로, 기본 타깃을 확인하지 않는다.
      선택지 2: systemctl list-dependencies는 유닛이 의존하는 다른 유닛을 트리 형태로 보여 준다.
      선택지 3: systemctl get-default는 부팅 시 사용할 현재의 기본 타깃을 출력한다. 정답이다.
      선택지 4: systemctl set-default는 관리자 권한으로 기본 타깃을 다른 타깃 유닛으로 변경할 때 사용한다(systemctl set-default 이름.target).

      핵심 개념:
      systemd의 타깃은 런레벨에 대응하는 유닛 묶음이다.
      기본 타깃 확인은 get-default, 변경은 set-default, 즉시 전환은 isolate를 쓴다.
    tags:
      - systemctl
      - systemd-target
  - id: b05-07
    type: multiple-choice
    prompt: shutdown 명령을 수행하면 모든 프로세스는 시스템의 종료 소식을 접하면서 ‘프로세스가 스스로 종료하라’는 시그널을 받는다. 이 시그널은 무엇인가?
    choices:
      - id: '1'
        text: Process aborted(SIGABRT)
      - id: '2'
        text: Interrupt(SIGINT)
      - id: '3'
        text: Kill(SIGKILL)
      - id: '4'
        text: Termination(SIGTERM)
    answers:
      - '4'
    explanation: |
      선택지 1: SIGABRT는 프로세스가 abort()를 호출하는 등 비정상적으로 중단(abort)되었음을 알리는 시그널이다.
      선택지 2: SIGINT는 키보드에서 Ctrl+C를 눌렀을 때 보내지는 인터럽트 시그널이다.
      선택지 3: SIGKILL은 프로세스가 무시하거나 처리할 수 없는 강제 종료 시그널이다.
      선택지 4: SIGTERM은 프로세스에게 정리 작업을 마치고 스스로 종료하라고 요청하는 시그널로, shutdown 시 먼저 보내진다. 정답이다.

      핵심 개념:
      SIGTERM(15)은 정상 종료 요청으로 프로세스가 처리하거나 무시할 수 있고, SIGKILL(9)은 즉시 강제 종료한다.
      시스템 종료 시에는 SIGTERM을 먼저 보내고, 일정 시간 안에 끝나지 않는 프로세스에 SIGKILL을 보낸다.
    tags:
      - signal
      - shutdown
  - id: b05-08
    type: multiple-choice
    prompt: “This System is going down”이라는 메시지를 전달하고 현재부터 20분 후에 재부팅하기 위한 명령은?
    choices:
      - id: '1'
        text: shutdown -h now "This System is going down"
      - id: '2'
        text: shutdown -r +20 "This System is going down"
      - id: '3'
        text: shutdown -r "This System is going down"
      - id: '4'
        text: shutdown -c
    answers:
      - '2'
    explanation: |
      선택지 1: -h now는 지금 즉시 시스템을 종료(halt)하라는 뜻으로, 20분 후 재부팅이 아니다.
      선택지 2: -r은 재부팅 옵션이고 +20은 지금부터 20분 후를 뜻하며, 뒤의 문자열이 사용자들에게 전달된다. 정답이다.
      선택지 3: 시간 인자가 빠져 있어 20분 후라는 조건을 지정하지 못한다. 시간 인자는 메시지보다 앞에 와야 한다.
      선택지 4: -c는 예약된 shutdown을 취소하는 옵션이다.

      핵심 개념:
      shutdown 형식: shutdown [옵션] 시간 [메시지]. -r은 재부팅, -h(-P)는 종료, -c는 예약 취소다.
      시간은 now, +분, hh:mm 형식으로 지정한다.
    tags:
      - shutdown
  - id: b05-09
    type: multiple-choice
    prompt: 다음 중 리눅스를 편리하게 사용할 수 있도록 그래픽 사용자 인터페이스와 윈도우 매니저, 여러 가지 유틸리티 프로그램을 통합하여 제공하는 환경은?
    choices:
      - id: '1'
        text: GNU
      - id: '2'
        text: GNOME
      - id: '3'
        text: Shell
      - id: '4'
        text: X Window
    answers:
      - '2'
    explanation: |
      선택지 1: GNU는 리처드 스톨먼이 시작한 자유 소프트웨어 운영체제 프로젝트로, 데스크톱 환경이 아니다.
      선택지 2: GNOME은 그래픽 사용자 인터페이스, 윈도우 매니저, 파일 관리자 등 여러 유틸리티를 통합하여 제공하는 리눅스의 대표적인 데스크톱 환경으로, 대부분의 배포판에 포함되어 있다. 정답이다.
      선택지 3: Shell은 명령어를 입력받아 해석하는 텍스트 기반 인터페이스다.
      선택지 4: X Window는 그래픽 화면을 그리는 기반 시스템(디스플레이 서버)일 뿐, 윈도우 매니저와 유틸리티를 통합한 데스크톱 환경은 아니다.

      핵심 개념:
      데스크톱 환경은 디스플레이 서버(X Window, Wayland) 위에서 동작하며 창 관리, 패널, 응용 프로그램 묶음을 제공한다.
      리눅스의 대표적인 데스크톱 환경으로 GNOME과 KDE가 있다.
    tags:
      - desktop-environment
      - gnome
  - id: b05-10
    type: multiple-choice
    passageRefs:
      - guw05-p1-systemctl-enable-cmd-01
    prompt: 다음과 같은 관리자 명령이 의도하는 것은?
    choices:
      - id: '1'
        text: 중지되었던 웹서버 데몬을 즉시 시작시키려는 것이다.
      - id: '2'
        text: /usr/lib/systemd/system 디렉터리에 httpd를 시작시키는 유닛을 추가하는 것이다.
      - id: '3'
        text: httpd 서비스 유닛의 동작을 확인한 후 중지 상태라면 시작시킨다.
      - id: '4'
        text: 시스템이 부팅될 때 자동으로 httpd 서비스를 시작시키려는 것이다.
    answers:
      - '4'
    explanation: |
      선택지 1: 서비스를 즉시 시작시키는 명령은 systemctl start httpd.service이다. enable은 지금 바로 시작시키지 않는다.
      선택지 2: /usr/lib/systemd/system에는 패키지를 설치할 때 유닛 파일이 들어간다. enable은 새 유닛을 그곳에 추가하지 않고, /etc/systemd/system 아래의 타깃 디렉터리에 그 유닛을 가리키는 심볼릭 링크를 만든다.
      선택지 3: 서비스가 동작 중인지 확인하는 명령은 systemctl is-active httpd.service이며, enable은 상태를 확인하거나 조건부로 시작하지 않는다.
      선택지 4: systemctl enable은 서비스를 부팅 시 자동으로 시작하도록 등록한다. 정답이다.

      핵심 개념:
      systemctl start/stop은 지금 서비스를 시작·중지하고, enable/disable은 부팅 시 자동 시작 여부를 설정한다.
      enable --now를 쓰면 등록과 즉시 시작을 함께 한다.
      상태 확인은 systemctl status 또는 is-active로 한다.
    tags:
      - systemctl
      - service
  - id: b06-01
    type: multiple-choice
    prompt: 리눅스 시스템에서 사용자 계정명, UID, GID, 홈 디렉터리, 셸의 종류 등 사용자 계정에 대한 자세한 정보가 저장되는 파일은?
    choices:
      - id: '1'
        text: /etc/group
      - id: '2'
        text: /etc/login.defs
      - id: '3'
        text: /etc/passwd
      - id: '4'
        text: /etc/shadow
    answers:
      - '3'
    explanation: |
      선택지 1: /etc/group은 그룹 이름, GID, 그룹 구성원 등 그룹 계정 정보를 저장한다.
      선택지 2: /etc/login.defs는 UID 범위, 비밀번호 유효 기간 등 계정을 만들 때 적용할 기본값을 정의한다.
      선택지 3: /etc/passwd는 한 줄에 한 계정씩 계정명, 비밀번호 자리(x), UID, GID, 설명, 홈 디렉터리, 로그인 셸을 저장한다. 정답이다.
      선택지 4: /etc/shadow는 암호화된 비밀번호와 비밀번호 유효 기간 정보를 저장한다.

      핵심 개념:
      /etc/passwd의 형식은 계정명:x:UID:GID:설명:홈디렉터리:셸이다.
      /etc/passwd는 누구나 읽을 수 있으므로 실제 비밀번호는 root만 읽을 수 있는 /etc/shadow에 둔다.
    tags:
      - user-account
      - passwd-file
  - id: b06-02
    type: multiple-choice
    prompt: 리눅스 사용자의 암호화된 비밀번호가 저장되어 있는 파일은?
    choices:
      - id: '1'
        text: /etc/bashrc
      - id: '2'
        text: /etc/passwd
      - id: '3'
        text: /etc/shadow
      - id: '4'
        text: /etc/login.defs
    answers:
      - '3'
    explanation: |
      선택지 1: /etc/bashrc는 모든 사용자에게 적용되는 bash 셸의 시스템 전체 환경 설정 파일이다.
      선택지 2: /etc/passwd에는 계정 정보가 저장되지만 비밀번호 필드는 x로 표시되고 실제 비밀번호는 저장되지 않는다.
      선택지 3: 실제 비밀번호는 /etc/passwd에 저장되지 않고 /etc/shadow 파일에 계정별로 암호화되어 저장된다. 정답이다.
      선택지 4: /etc/login.defs는 계정 생성 시 적용되는 기본값을 정의하는 파일이다.

      핵심 개념:
      /etc/shadow는 root만 읽을 수 있어 암호화된 비밀번호가 노출되지 않도록 보호한다.
      각 줄에는 계정명, 암호화된 비밀번호, 최근 변경일, 최소·최대 사용 기간 등이 기록된다.
    tags:
      - shadow-file
      - password
  - id: b06-03
    type: multiple-choice
    prompt: sudo 명령에 관한 설명으로 옳지 ==않은== 것은?
    choices:
      - id: '1'
        text: 관리자 권한으로 명령을 수행하고자 할 때 사용한다.
      - id: '2'
        text: 모든 사용자가 sudo 명령을 수행할 수 있는 것은 아니다.
      - id: '3'
        text: /etc/sudoers 파일은 슈퍼유저 권한이 있어야 편집할 수 있다.
      - id: '4'
        text: sudo 명령을 사용할 때 사용자는 root 사용자의 비밀번호를 알고 있어야 한다.
    answers:
      - '4'
    explanation: |
      선택지 1: sudo는 일반 사용자가 관리자(root) 권한으로 명령을 수행할 때 사용한다. 옳은 설명이다.
      선택지 2: /etc/sudoers에 등록된 사용자(또는 wheel 그룹 구성원)만 sudo를 사용할 수 있다. 옳은 설명이다.
      선택지 3: /etc/sudoers는 root만 수정할 수 있으며 보통 visudo 명령으로 편집한다. 옳은 설명이다.
      선택지 4: sudo는 root의 비밀번호가 아니라 sudo를 실행하는 사용자 자신의 비밀번호를 묻는다. 옳지 않은 설명이므로 정답이다.

      핵심 개념:
      /etc/sudoers에는 sudo 명령을 사용할 수 있는 사용자와 그 사용자에게 허용된 명령이 기록되어 있다.
      su는 root 비밀번호로 root 계정으로 전환하고, sudo는 자기 비밀번호로 허용된 명령만 관리자 권한으로 실행한다.
    tags:
      - sudo
      - privilege
  - id: b06-04
    type: multiple-choice
    prompt: 사용자 계정 생성과 관련이 있는 파일이 ==아닌== 것은?
    choices:
      - id: '1'
        text: /etc/passwd
      - id: '2'
        text: /etc/shadow
      - id: '3'
        text: /etc/skel
      - id: '4'
        text: /etc/fstab
    answers:
      - '4'
    explanation: |
      선택지 1: 계정을 생성하면 /etc/passwd에 새 계정의 정보가 한 줄 추가된다. 관련이 있다.
      선택지 2: 계정을 생성하면 /etc/shadow에 비밀번호 정보가 한 줄 추가된다. 관련이 있다.
      선택지 3: /etc/skel의 기본 환경 설정 파일이 새 계정의 홈 디렉터리로 복사된다. 관련이 있다.
      선택지 4: /etc/fstab에는 부팅 시 자동으로 마운트되는 파일 시스템에 대한 정보가 저장되어 있어 계정 생성과 관련이 없다. 정답이다.

      핵심 개념:
      useradd는 /etc/passwd, /etc/shadow, /etc/group에 항목을 추가하고, /etc/skel을 복사해 홈 디렉터리를 만든다.
      기본값은 /etc/login.defs와 /etc/default/useradd에서 가져온다.
    tags:
      - useradd
      - user-account
  - id: b06-05
    type: multiple-choice
    prompt: useradd 명령으로 사용자 계정을 추가하면 /home 디렉터리에 기본 사용자 디렉터리가 생성되고, 환경 설정을 위한 기본 파일이 복사된다. 다음 중 사용자 기본 환경 설정 파일을 갖는 디렉터리는?
    choices:
      - id: '1'
        text: /etc/skel
      - id: '2'
        text: /etc/rc.d
      - id: '3'
        text: /etc/services
      - id: '4'
        text: /etc/hosts
    answers:
      - '1'
    explanation: |
      선택지 1: /etc/skel 디렉터리에는 .bashrc, .bash_logout, .bash_profile 등이 있으며, 새 계정의 홈 디렉터리로 복사된다. 정답이다.
      선택지 2: /etc/rc.d는 SysV init 방식의 부팅 스크립트를 두는 디렉터리다.
      선택지 3: /etc/services는 서비스 이름과 포트 번호의 대응을 정의한 파일이다.
      선택지 4: /etc/hosts는 호스트 이름과 IP 주소의 대응을 정의한 파일이다.

      핵심 개념:
      skel은 skeleton(뼈대)의 줄임말로, 새 사용자 홈 디렉터리의 기본 틀이다.
      관리자가 /etc/skel에 파일을 넣어 두면 이후 만들어지는 모든 계정에 같은 기본 파일이 복사된다.
    tags:
      - skel
      - useradd
  - id: b06-06
    type: multiple-choice
    prompt: 사용자 계정을 실제로 삭제하지 않고 계정을 잠그는 명령은?
    choices:
      - id: '1'
        text: userdel -r user
      - id: '2'
        text: userdel -f user
      - id: '3'
        text: usermod -L user
      - id: '4'
        text: usermod -U user
    answers:
      - '3'
    explanation: |
      선택지 1: userdel -r은 계정을 삭제하면서 홈 디렉터리와 메일 스풀까지 함께 삭제한다.
      선택지 2: userdel -f는 사용자가 로그인 중이어도 계정을 강제로 삭제한다.
      선택지 3: usermod -L은 /etc/shadow의 암호화된 비밀번호 앞에 !를 붙여 비밀번호 로그인을 막는다. 계정을 삭제하지 않고 잠그므로 정답이다.
      선택지 4: usermod -U는 잠긴 계정의 잠금을 해제한다.

      핵심 개념:
      계정을 지우면 UID가 다른 사용자에게 재할당되어 남은 파일의 소유권 문제가 생길 수 있으므로, 일시적으로 사용을 막을 때는 계정을 잠근다.
      잠금은 usermod -L 또는 passwd -l, 해제는 usermod -U 또는 passwd -u로 한다.
    tags:
      - usermod
      - account-lock
  - id: b06-07
    type: multiple-choice
    prompt: root 사용자가 사용자 kdhong의 비밀번호 변경에 사용하는 명령은?
    choices:
      - id: '1'
        text: info kdhong
      - id: '2'
        text: change kdhong
      - id: '3'
        text: passwd kdhong
      - id: '4'
        text: chpasswd kdhong
    answers:
      - '3'
    explanation: |
      선택지 1: info는 GNU 형식의 문서를 보여 주는 명령으로, 비밀번호와 관계없다.
      선택지 2: change라는 비밀번호 변경 명령은 없다. 비밀번호 유효 기간을 바꾸는 명령은 chage이다.
      선택지 3: root는 passwd 뒤에 사용자 이름을 지정하여 그 사용자의 비밀번호를 변경할 수 있다. 정답이다.
      선택지 4: chpasswd는 사용자이름:비밀번호 형식의 줄을 표준입력으로 받아 여러 계정의 비밀번호를 일괄 변경하는 명령으로, 사용자 이름을 인자로 받지 않는다.

      핵심 개념:
      인수 없이 passwd를 실행하면 자신의 비밀번호를 바꾼다.
      root는 passwd 사용자이름으로 다른 사용자의 비밀번호를 기존 비밀번호 확인 없이 바꿀 수 있다.
    tags:
      - passwd-command
      - password
  - id: b06-08
    type: multiple-choice
    prompt: 사용자 계정과 그룹에 관한 일반적 설명으로 옳지 ==않은== 것은?
    choices:
      - id: '1'
        text: 사용자 계정을 생성할 때 기본적으로 사용자 계정과 같은 이름의 그룹(GID도 UID와 같음)이 만들어진다.
      - id: '2'
        text: 사용자 계정은 0개 이상의 부 그룹에 속할 수 있다.
      - id: '3'
        text: 모든 사용자는 스스로 다른 부 그룹의 구성원으로 가입할 수 있다.
      - id: '4'
        text: 모든 사용자 계정은 주 그룹을 가지며, 그것의 구성원이 된다.
    answers:
      - '3'
    explanation: |
      선택지 1: Rocky Linux 등에서는 계정을 만들 때 계정과 같은 이름의 개인 그룹이 함께 만들어지며, 보통 GID도 UID와 같은 값이 된다. 옳은 설명이다.
      선택지 2: 사용자는 부 그룹에 하나도 속하지 않을 수도, 여러 개에 속할 수도 있다. 옳은 설명이다.
      선택지 3: 사용자를 그룹의 구성원으로 등록하는 작업은 관리자(또는 그룹 관리자)만 할 수 있다. 그룹 비밀번호가 설정된 그룹이라면 비밀번호를 아는 사용자가 newgrp로 그 그룹 권한을 일시적으로 얻을 수 있을 뿐이다. 모든 사용자가 스스로 가입할 수 있는 것은 아니므로 옳지 않은 설명이며 정답이다.
      선택지 4: 모든 계정은 /etc/passwd의 GID 필드로 지정된 주 그룹을 하나 가지며 그 그룹의 구성원이 된다. 옳은 설명이다.

      핵심 개념:
      주 그룹은 계정마다 하나이며 새로 만드는 파일의 그룹 소유자가 된다.
      부 그룹은 0개 이상 가질 수 있고 /etc/group에 구성원으로 기록된다.
      그룹 구성원 추가는 관리자가 usermod -aG나 gpasswd -a로 한다.
    tags:
      - group-account
  - id: b07-01
    type: multiple-choice
    prompt: vi 편집기로 작업한 뒤 변경된 내용을 저장하고 종료하려 한다. 명령 모드에 있다고 가정하고, 다음 중 어떠한 키 입력을 해야 하는가?
    choices:
      - id: '1'
        text: :wq Enter
      - id: '2'
        text: :save Enter
      - id: '3'
        text: :q! Enter
      - id: '4'
        text: zz
    answers:
      - '1'
    explanation: |
      선택지 1: 명령 모드에서 :을 입력해 라인 모드로 들어간 뒤 wq와 Enter를 입력하면 저장(w)하고 종료(q)한다. 정답이다.
      선택지 2: vi에는 :save라는 저장 명령이 없다. 저장은 :w이다.
      선택지 3: :q!는 변경 내용을 저장하지 않고 강제로 종료한다.
      선택지 4: 소문자 zz는 저장·종료 명령이 아니며, vim(Rocky Linux의 vi)에서는 커서가 있는 줄을 화면 가운데로 옮기는 화면 이동 명령이다. 저장하고 종료하는 것은 대문자 ZZ이다.

      핵심 개념:
      vi 라인 모드 명령: :w 저장, :q 종료, :wq 저장 후 종료, :q! 저장하지 않고 강제 종료.
      명령 모드에서 대문자 ZZ를 입력해도 저장 후 종료된다.
    tags:
      - vi-editor
      - save-quit
  - id: b07-02
    type: multiple-choice
    prompt: vi 편집기가 명령 모드에 있을 때, 문자열 패턴을 검색하는 명령은?
    choices:
      - id: '1'
        text: :pattern Enter
      - id: '2'
        text: ?pattern Enter
      - id: '3'
        text: '!pattern Enter'
      - id: '4'
        text: /pattern Enter
    answers:
      - '4'
    explanation: |
      선택지 1: :는 라인 모드로 들어가는 명령으로, :pattern은 pattern을 ex 명령으로 해석하므로 검색이 되지 않는다.
      선택지 2: ?pattern은 커서 위치에서 파일 앞쪽(역방향)으로 pattern을 검색하는 명령이다. ※ 줄 참고.
      선택지 3: !는 외부 셸 명령과 관련된 문자로, 명령 모드에서 !pattern은 문자열 검색 명령이 아니다.
      선택지 4: /를 누른 뒤 찾고자 하는 문자열 패턴(pattern)을 입력하고 Enter를 누르면 커서 위치에서 파일 뒤쪽(순방향)으로 검색한다. 정답이다.

      핵심 개념:
      vi 검색: /pattern은 순방향, ?pattern은 역방향 검색이다.
      n은 같은 방향으로, N은 반대 방향으로 다음 일치 항목을 찾는다.

      ※ 인쇄 정답은 "/pattern Enter"이지만, "?pattern Enter"도 역방향으로 문자열 패턴을 검색하는 명령이므로 발문만으로는 두 선택지 모두 검색 명령이다. 인쇄 정답(순방향 검색)을 유지한다.
    tags:
      - vi-editor
      - search
  - id: b07-03
    type: multiple-choice
    prompt: vi 편집기의 명령 모드에서 이전 명령을 반복하는 키 입력은?
    choices:
      - id: '1'
        text: .
      - id: '2'
        text: ^
      - id: '3'
        text: +
      - id: '4'
        text: \$
    answers:
      - '1'
    explanation: |
      선택지 1: .(점)은 바로 전에 수행한 편집 명령을 반복한다. 정답이다.
      선택지 2: ^는 현재 줄에서 공백이 아닌 첫 문자로 커서를 옮긴다.
      선택지 3: +는 다음 줄의 공백이 아닌 첫 문자로 커서를 옮긴다.
      선택지 4: \$는 현재 줄의 끝으로 커서를 옮긴다.

      핵심 개념:
      명령 모드에서 .은 직전 편집 명령의 반복, u는 직전 명령의 취소(undo)다.
      ^, \$, +, -, 0 등은 커서 이동 명령이다.
    tags:
      - vi-editor
      - repeat-command
  - id: b07-04
    type: multiple-choice
    prompt: vi 편집기의 명령 모드에서 커서가 위치한 단어를 치환하는 명령은?
    choices:
      - id: '1'
        text: dd
      - id: '2'
        text: d)
      - id: '3'
        text: cw
      - id: '4'
        text: yy
    answers:
      - '3'
    explanation: |
      선택지 1: dd는 커서가 있는 한 줄을 삭제한다.
      선택지 2: d)는 커서 위치부터 문장 끝까지 삭제한다.
      선택지 3: cw는 'change word'를 의미하며, 커서 위치부터 단어의 끝까지 삭제하고 입력 모드로 전환되어 새로운 단어를 입력할 수 있다. 정답이다.
      선택지 4: yy는 현재 줄을 복사(yank)한다.

      핵심 개념:
      vi의 c(change)는 지정 범위를 지우고 입력 모드로 바꾸는 변경 명령이다(cw 단어, cc 줄, c\$ 줄 끝까지).
      d는 삭제, y는 복사이며, dw·yw처럼 이동 명령과 결합해 범위를 지정한다.
    tags:
      - vi-editor
      - change-command
  - id: b07-05
    type: multiple-choice
    prompt: vi 편집기의 명령 모드에서 입력 모드로 전환하기 위한 명령이 ==아닌== 것은?
    choices:
      - id: '1'
        text: a
      - id: '2'
        text: i
      - id: '3'
        text: o
      - id: '4'
        text: ':'
    answers:
      - '4'
    explanation: |
      선택지 1: a는 커서 다음 위치부터 입력하는 입력 모드 전환 명령이다.
      선택지 2: i는 커서 위치(커서 앞)부터 입력하는 입력 모드 전환 명령이다.
      선택지 3: o는 커서가 있는 줄 다음에 새 줄을 만들고 입력하는 입력 모드 전환 명령이다.
      선택지 4: :는 화면 아래에서 ex 명령을 입력하는 라인 모드로 전환하는 명령으로, 입력 모드 전환 명령이 아니다. 정답이다.

      핵심 개념:
      입력 모드 전환 명령: i, I, a, A, o, O 등. Esc를 누르면 명령 모드로 돌아온다.
      :는 라인 모드, /와 ?는 검색으로 들어간다.
    tags:
      - vi-editor
      - vi-mode
  - id: b07-06
    type: multiple-choice
    prompt: vi 편집기를 이용할 때, 명령 모드에서 현재 라인을 포함하여 총 10개 라인을 삭제하는 명령으로 알맞은 것은?
    choices:
      - id: '1'
        text: 10dw
      - id: '2'
        text: 10x
      - id: '3'
        text: 10dd
      - id: '4'
        text: d10G
    answers:
      - '3'
    explanation: |
      선택지 1: 10dw는 커서 위치부터 단어 10개를 삭제한다.
      선택지 2: 10x는 커서 위치부터 문자 10개를 삭제한다.
      선택지 3: 10dd는 현재 줄을 포함하여 아래로 10개 줄을 삭제한다. 정답이다.
      선택지 4: d10G는 현재 줄부터 파일의 10번째 줄까지 삭제하므로, 삭제되는 줄 수는 현재 줄의 위치에 따라 달라진다.

      핵심 개념:
      vi 명령 앞에 숫자를 붙이면 그 횟수만큼 반복한다(10dd, 3yy, 5x).
      x는 문자, dw는 단어, dd는 줄 삭제이고, d와 G를 결합하면 지정 줄까지 삭제한다.
    tags:
      - vi-editor
      - delete-command
  - id: b07-07
    type: multiple-choice
    prompt: vi 편집기의 명령 모드에서 사용할 수 있는 명령과 그 기능이 ==잘못== 설명된 것은?
    choices:
      - id: '1'
        text: i - 입력 모드로 전환하기
      - id: '2'
        text: u - 커서 이동하기
      - id: '3'
        text: d - 삭제
      - id: '4'
        text: c - 변경
    answers:
      - '2'
    explanation: |
      선택지 1: i는 커서 위치에서 입력 모드로 전환한다. 옳은 설명이다.
      선택지 2: u는 이전에 수행했던 명령을 취소(undo)하는 명령으로, 커서 이동 명령이 아니다. 잘못된 설명이므로 정답이다.
      선택지 3: d는 dd, dw처럼 범위와 결합하여 삭제하는 명령이다. 옳은 설명이다.
      선택지 4: c는 cw, cc처럼 범위를 지우고 새 내용으로 바꾸는 변경 명령이다. 옳은 설명이다.

      핵심 개념:
      vi 명령 모드의 주요 명령: i·a·o(입력), d(삭제), c(변경), y(복사), p(붙이기), u(취소), .(반복).
      커서 이동은 h·j·k·l, w·b, 0·\$, G 등으로 한다.
    tags:
      - vi-editor
      - undo
  - id: b07-08
    type: multiple-choice
    prompt: 다음 중 vi 편집기의 커서 이동 명령으로 알맞은 것은?
    choices:
      - id: '1'
        text: G - 문서의 마지막 라인으로 이동한다.
      - id: '2'
        text: W - 화면을 아래로 내린다.
      - id: '3'
        text: Ctrl+f - 반 페이지 위로 이동한다.
      - id: '4'
        text: \pattern - 문자열 pattern을 역방향으로 검색해 이동한다.
    answers:
      - '1'
    explanation: |
      선택지 1: G는 문서의 마지막 줄로 커서를 이동한다(숫자를 앞에 붙이면 해당 줄로 이동). 옳은 설명이므로 정답이다.
      선택지 2: W는 공백으로 구분된 다음 단어의 시작으로 커서를 옮기는 명령으로, 화면을 내리는 명령이 아니다.
      선택지 3: Ctrl+f는 한 화면(페이지) 아래로 이동한다. 반 페이지 위로 이동하는 것은 Ctrl+u이다.
      선택지 4: 문자열 패턴을 역방향으로 검색할 때는 ?pattern을 입력한다. 순방향 검색은 /pattern이며, \는 검색 명령이 아니다.

      핵심 개념:
      G는 마지막 줄, nG는 n번째 줄로 이동한다.
      Ctrl+f/Ctrl+b는 한 화면 아래/위, Ctrl+d/Ctrl+u는 반 화면 아래/위로 이동한다.
      /pattern은 순방향, ?pattern은 역방향 검색이다.
    tags:
      - vi-editor
      - cursor-movement
  - id: b07-09
    type: multiple-choice
    prompt: find 명령의 사용례를 설명한 것으로 옳지 ==않은== 것은?
    choices:
      - id: '1'
        text: (find /etc -name passwd) 파일의 이름이 정확히 passwd인 파일을 찾음
      - id: '2'
        text: (find /usr/share -size +10M) 파일의 크기가 10M보다 큰 파일을 찾음
      - id: '3'
        text: (find /home -user chris -ls) 소유자가 chris인 파일을 찾아 파일의 정보를 자세히 보여 줌
      - id: '4'
        text: (find /bin -mtime 644 -ls) 접근권한이 rwxr-xr-x인 파일이나 디렉터리를 찾아 정보를 보여 줌
    answers:
      - '4'
    explanation: |
      선택지 1: -name passwd는 이름이 정확히 passwd인 파일을 /etc 아래에서 찾는다. 옳은 설명이다.
      선택지 2: -size +10M은 크기가 10MB보다 큰 파일을 찾는다. 옳은 설명이다.
      선택지 3: -user chris는 소유자가 chris인 파일을 찾고, -ls는 찾은 파일의 정보를 ls -l처럼 자세히 보여 준다. 옳은 설명이다.
      선택지 4: -mtime은 수정 시간(일 단위)을 조건으로 하는 옵션이므로 -mtime 644는 정확히 644일 전에 수정된 파일을 찾는다. 접근권한을 조건으로 지정하려면 -perm을 사용하며, 8진수 644는 rw-r--r--이지 rwxr-xr-x(755)가 아니다. 옳지 않은 설명이므로 정답이다.

      핵심 개념:
      find 경로 조건 동작 형식으로 쓴다.
      주요 조건: -name(이름), -user(소유자), -size(크기), -perm(권한), -mtime(수정 일수), -type(종류).
      주요 동작: -print, -ls, -exec 명령 {} \;.
    tags:
      - find-command
  - id: b07-10
    type: multiple-choice
    prompt: /home 디렉터리와 그 서브디렉터리 구조에서 .bak로 끝나는 파일을 모두 찾아 강제로 삭제하는 완전한 명령은 무엇인가?
    choices:
      - id: '1'
        text: rm -r /home/*.bak
      - id: '2'
        text: find . -type f -exec grep '.*.bak' {} \;
      - id: '3'
        text: find /home -name '*.bak' -exec rm -f {} \;
      - id: '4'
        text: find /home -type '*.bak' -exec rm {} \;
    answers:
      - '3'
    explanation: |
      선택지 1: /home/*.bak는 /home 바로 아래의 .bak 파일만 가리키므로 서브디렉터리의 파일은 삭제되지 않으며, -f가 없어 강제 삭제도 아니다.
      선택지 2: 현재 디렉터리(.)의 모든 일반 파일 내용에서 문자열 패턴을 grep으로 검색할 뿐, 파일을 삭제하지 않는다.
      선택지 3: find는 지정된 디렉터리의 서브디렉터리까지 검색하므로 /home 아래에서 이름이 *.bak인 파일을 모두 찾고, -exec rm -f {} \;로 찾은 파일을 하나씩 강제 삭제한다. 정답이다.
      선택지 4: -type은 f, d, l처럼 파일 종류를 지정하는 옵션이므로 '*.bak'를 줄 수 없어 오류가 나며, rm에 -f도 없다.

      핵심 개념:
      find는 지정한 디렉터리부터 하위 디렉터리까지 재귀적으로 검색한다.
      -exec 명령 {} \;는 찾은 파일마다 명령을 실행하며, {}에 파일 이름이 들어간다.
      파일의 강제 삭제 명령은 rm -f 파일이다.
    tags:
      - find-command
      - rm-command
  - id: b08-01
    type: multiple-choice
    prompt: 리눅스 시스템에서 파일로 취급되지 ==않는== 것은?
    choices:
      - id: '1'
        text: inode 테이블
      - id: '2'
        text: 디렉터리
      - id: '3'
        text: 하드디스크 장치
      - id: '4'
        text: 심벌릭 링크
    answers:
      - '1'
    explanation: |
      선택지 1: inode 테이블은 파일 시스템이 각 파일의 정보를 관리하기 위해 디스크에 두는 자료 구조로, 그 자체가 파일로 취급되지는 않는다. 정답이다.
      선택지 2: 디렉터리는 파일 이름과 inode 번호의 목록을 담은 특수한 파일이다.
      선택지 3: 하드디스크 같은 장치는 /dev/sda처럼 장치 파일로 취급된다.
      선택지 4: 심볼릭 링크는 원본 경로를 담은 특수한 파일이다.

      핵심 개념:
      리눅스는 일반 파일뿐 아니라 디렉터리, 장치, 링크, 파이프, 소켓도 파일로 다룬다.
      inode는 파일의 메타데이터(권한, 소유자, 크기, 데이터 블록 위치)를 담는 파일 시스템 내부 구조다.
    tags:
      - file-type
      - inode
  - id: b08-02
    type: multiple-choice
    prompt: 마운트할 파일 시스템의 목록을 가지고 있는 파일은?
    choices:
      - id: '1'
        text: /dev/hda
      - id: '2'
        text: /dev/mapper
      - id: '3'
        text: /etc/fstab
      - id: '4'
        text: /etc/rc.local
    answers:
      - '3'
    explanation: |
      선택지 1: /dev/hda는 첫 번째 IDE 디스크를 나타내는 장치 파일이다.
      선택지 2: /dev/mapper는 LVM 논리 볼륨 등 장치 매퍼가 만든 장치 파일이 있는 디렉터리다.
      선택지 3: /etc/fstab에는 부팅 시 자동으로 마운트되는 파일 시스템의 목록이 줄 단위로 저장되어 있다. 정답이다.
      선택지 4: /etc/rc.local은 부팅 마지막에 실행할 명령을 적어 두는 스크립트 파일이다.

      핵심 개념:
      /etc/fstab의 각 줄은 장치, 마운트 포인트, 파일 시스템 종류, 옵션, 덤프, 검사 순서로 구성된다.
      mount -a는 /etc/fstab에 적힌 파일 시스템을 모두 마운트한다.
    tags:
      - fstab
      - mount
  - id: b08-03
    type: multiple-choice
    prompt: 하드디스크의 파티션을 생성하는 명령어는?
    choices:
      - id: '1'
        text: fdisk
      - id: '2'
        text: fsck
      - id: '3'
        text: mkfs
      - id: '4'
        text: mkswap
    answers:
      - '1'
    explanation: |
      선택지 1: fdisk는 하드디스크의 파티션을 생성·삭제·조회하는 대화식 명령이다. 정답이다.
      선택지 2: fsck는 파일 시스템의 무결성을 검사하고 복구한다.
      선택지 3: mkfs는 이미 만들어진 파티션에 파일 시스템을 생성한다.
      선택지 4: mkswap은 파티션이나 파일을 스왑 영역으로 설정한다.

      핵심 개념:
      디스크 사용 순서는 파티션 생성(fdisk) → 파일 시스템 생성(mkfs) → 마운트(mount)다.
      fsck는 파일 시스템 오류 검사, mkswap은 스왑 영역 생성에 쓴다.
    tags:
      - fdisk
      - partition
  - id: b08-04
    type: multiple-choice
    prompt: 파일 시스템 관리를 위한 명령어가 ==아닌== 것은?
    choices:
      - id: '1'
        text: fsck
      - id: '2'
        text: fdisk
      - id: '3'
        text: mkfs
      - id: '4'
        text: reiser
    answers:
      - '4'
    explanation: |
      선택지 1: fsck는 파일 시스템을 검사하고 복구하는 명령이다.
      선택지 2: fdisk는 디스크 파티션을 관리하는 명령이다.
      선택지 3: mkfs는 파티션에 파일 시스템을 생성하는 명령이다.
      선택지 4: reiser는 명령어가 아니라, 리눅스 커널에 처음으로 포함된 저널링 파일 시스템(ReiserFS)의 이름이다. 정답이다.

      핵심 개념:
      파일 시스템 관리 명령: fdisk(파티션), mkfs(생성), fsck(검사), mount/umount(연결·해제), df(사용량).
      ext3·ext4, XFS, ReiserFS는 명령이 아니라 파일 시스템의 종류다.
    tags:
      - filesystem-command
  - id: b08-05
    type: multiple-choice
    prompt: 볼륨 관리에 관한 설명으로 옳지 ==않은== 것은?
    choices:
      - id: '1'
        text: 여러 저장장치를 묶어 하나의 볼륨으로 만들 수 있다.
      - id: '2'
        text: 볼륨은 크기가 재조정될 수 있는 파티션이다.
      - id: '3'
        text: 볼륨 관리를 위한 도구로 fdisk 또는 mkfs를 사용한다.
      - id: '4'
        text: 논리 볼륨에 파일 시스템을 만들 수 있다.
    answers:
      - '3'
    explanation: |
      선택지 1: 볼륨 관리에서는 여러 물리 볼륨(디스크·파티션)을 볼륨 그룹으로 묶어 하나의 큰 저장 공간처럼 쓸 수 있다. 옳은 설명이다.
      선택지 2: 논리 볼륨은 볼륨 그룹 안에서 잘라 쓰는 파티션 같은 단위로, 필요에 따라 크기를 늘리거나 줄일 수 있다. 옳은 설명이다.
      선택지 3: fdisk는 파티션을 만드는 명령이고 mkfs는 파일 시스템을 만드는 명령이다. 볼륨 관리 도구는 LVM으로, pvcreate·vgcreate·lvcreate 같은 명령을 쓴다. 옳지 않은 설명이므로 정답이다.
      선택지 4: 만들어진 논리 볼륨은 일반 파티션처럼 mkfs로 파일 시스템을 만든 뒤 마운트해 사용할 수 있다. 옳은 설명이다.

      핵심 개념:
      LVM(Logical Volume Manager)은 물리 볼륨(PV) → 볼륨 그룹(VG) → 논리 볼륨(LV) 순으로 저장 공간을 구성한다.
      논리 볼륨은 여러 디스크에 걸칠 수 있고 크기를 조정할 수 있어 고정 크기 파티션보다 유연하다.
    tags:
      - lvm
      - volume-management
  - id: b08-06
    type: multiple-choice
    prompt: 파일 시스템이나 디스크 관리를 위해 사용되는 명령의 일반적 설명으로 옳은 것은?
    choices:
      - id: '1'
        text: df - 사용자의 디스크 사용량 한도를 결정한다.
      - id: '2'
        text: fdisk - 하드디스크 파티션을 관리하는 대화식 유틸리티이다.
      - id: '3'
        text: fsck  - 디스크 파티션에 리눅스 파일 시스템을 생성한다.
      - id: '4'
        text: umount - 파일 시스템을 디렉터리에 붙여 사용할 수 있게 한다.
    answers:
      - '2'
    explanation: |
      선택지 1: df는 마운트된 파일 시스템별 전체·사용·남은 디스크 공간을 보여 주는 명령이다. 사용자별 사용량 한도를 정하는 것은 디스크 쿼터(quota) 기능이다.
      선택지 2: fdisk는 하드디스크의 파티션을 만들고 지우고 종류를 바꾸는 대화식 유틸리티이다. 옳은 설명이므로 정답이다.
      선택지 3: fsck는 파일 시스템의 일관성을 검사하고 복구하는 명령이다. 파티션에 파일 시스템을 생성하는 것은 mkfs이다.
      선택지 4: umount는 마운트된 파일 시스템을 디렉터리에서 분리하는 명령이다. 파일 시스템을 디렉터리에 붙이는 것은 mount이다.

      핵심 개념:
      파티션 관리는 fdisk, 파일 시스템 생성은 mkfs, 검사·복구는 fsck가 맡는다.
      mount는 파일 시스템을 마운트 포인트에 연결하고 umount는 연결을 해제한다.
      df는 파일 시스템의 공간 사용 현황을, du는 파일·디렉터리의 사용량을 보여 준다.
    tags:
      - filesystem-commands
      - fdisk
  - id: b08-07
    type: multiple-choice
    prompt: 파일에 사용되는 블록 수를 보여 주는 명령어는?
    choices:
      - id: '1'
        text: dc
      - id: '2'
        text: dd
      - id: '3'
        text: df
      - id: '4'
        text: du
    answers:
      - '4'
    explanation: |
      선택지 1: dc는 역폴란드 표기법을 쓰는 계산기 프로그램으로 디스크 사용량과 관계없다.
      선택지 2: dd는 블록 단위로 파일이나 장치를 복사·변환하는 명령이다.
      선택지 3: df는 파일 시스템 단위의 전체·사용·남은 공간을 보여 줄 뿐 개별 파일의 사용 블록 수를 보여 주지 않는다.
      선택지 4: du(disk usage)는 파일이나 디렉터리가 차지하는 블록 수(디스크 사용량)를 보여 준다. 정답이다.

      핵심 개념:
      du는 파일·디렉터리 단위, df는 파일 시스템 단위로 디스크 사용량을 보여 준다.
      du -s는 합계만, du -h는 사람이 읽기 쉬운 단위로 출력한다.
    tags:
      - disk-usage
      - du
  - id: b08-08
    type: multiple-choice
    prompt: 변경을 기록하는 로그를 두어 시스템 비정상 종료 시 파일 시스템의 복구를 쉽게 하는 방법은 무엇인가?
    choices:
      - id: '1'
        text: 단편화(fragmentation)
      - id: '2'
        text: 저널링( journaling)
      - id: '3'
        text: 테일패킹(tailpacking)
      - id: '4'
        text: 레이저(reiser)
    answers:
      - '2'
    explanation: |
      선택지 1: 단편화는 파일 블록이 디스크 여러 곳에 흩어져 저장되는 현상으로, 복구 기법이 아니다.
      선택지 2: 저널링은 파일 시스템 변경 내용을 먼저 저널(로그)에 기록한 뒤 반영하므로, 비정상 종료 후 저널만 확인해 빠르게 일관성을 되찾을 수 있다. 정답이다.
      선택지 3: 테일패킹은 여러 파일의 끝 조각을 한 블록에 모아 저장해 공간 낭비를 줄이는 기법이다.
      선택지 4: reiser(ReiserFS)는 저널링을 지원한 파일 시스템의 이름일 뿐, 복구 방법 자체를 가리키는 말이 아니다.

      핵심 개념:
      저널링 파일 시스템은 변경 내용을 로그에 먼저 기록해 비정상 종료 후 전체 검사 없이 빠르게 복구한다.
      ext2는 저널링이 없고, ext3·ext4·XFS 등은 저널링을 지원한다.
    tags:
