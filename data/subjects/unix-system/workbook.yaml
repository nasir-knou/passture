  - id: guw14-git-practice-intro-01
    type: text
    body: |
      실습을 위한 예
      • 3회의 커밋을 포함하여 파일 h.py에 1라인씩 다섯 차례 추가하는 예
  - id: guw14-git-practice-code-01
    type: code
    language: bash
    body: |
      ① echo “print(‘123’)” > h.py
      ② git add h.py
      ③ git commit -m ‘Numeric’
      ④ echo “print(‘ABC’)” >> h.py
      ⑤ git commit -am ‘Alphabet’
      ⑥ echo “print(‘AB12’)” >> h.py
      ⑦ git commit -am ‘AlphaNumeric’
      ⑧ echo “print([1, 2])” >> h.py
      ⑨ git add h.py
      ⑩ echo “print({1, 2})” >> h.py

questions:
  - id: b01-01
    type: multiple-choice
    prompt: 리눅스의 특징으로 볼 수 ==없는== 것은?
    choices:
      - id: '1'
        text: 멀티태스킹을 지원한다.
      - id: '2'
        text: 여러 종류의 파일 시스템을 지원한다.
      - id: '3'
        text: 대부분 어셈블리어로 작성된다.
      - id: '4'
        text: 소스 코드가 공개된다.
    answers:
      - '3'
    explanation: |
      선택지 1: 리눅스는 여러 프로세스를 번갈아 실행하는 멀티태스킹과 여러 사용자가 동시에 쓰는 다중 사용자 환경을 지원한다. 리눅스의 특징이다.
      선택지 2: 리눅스는 ext4, XFS, Btrfs, FAT, NTFS 등 다양한 파일 시스템을 지원한다. 리눅스의 특징이다.
      선택지 3: 리눅스 커널은 대부분 C 언어로 작성되어 있고, 하드웨어에 밀접한 일부분만 어셈블리어로 작성되어 있다. 대부분 어셈블리어로 작성된다는 것은 리눅스의 특징이 아니므로 정답이다.
      선택지 4: 리눅스는 GPL에 따라 소스 코드가 공개된 오픈소스 운영체제다. 리눅스의 특징이다.

      핵심 개념:
      리눅스는 1991년 리누스 토르발스가 개발을 시작한 유닉스 계열의 공개 운영체제다.
      대부분 C 언어로 작성되어 다양한 하드웨어로 이식하기 쉽다.
      멀티태스킹, 다중 사용자, 다양한 파일 시스템 지원, 소스 코드 공개가 주요 특징이다.
    tags:
      - linux-features
      - open-source
  - id: b01-02
    type: multiple-choice
    prompt: 리눅스 소프트웨어의 대부분은 어떤 라이선스를 따르고 있는가?
    choices:
      - id: '1'
        text: Apache 라이선스
      - id: '2'
        text: BSD 라이선스
      - id: '3'
        text: GPL
      - id: '4'
        text: MPL
    answers:
      - '3'
    explanation: |
      선택지 1: Apache 라이선스는 아파치 재단의 소프트웨어에 적용되는 허용적 라이선스로, 리눅스 소프트웨어 대부분이 따르는 라이선스가 아니다.
      선택지 2: BSD 라이선스는 BSD 유닉스 계열에서 쓰이는 허용적 라이선스로, 수정본의 소스 공개를 요구하지 않는다. 리눅스 소프트웨어 대부분이 따르는 라이선스가 아니다.
      선택지 3: 리눅스 커널과 GNU 도구 등 리눅스 소프트웨어의 대부분은 GNU GPL(General Public License)을 따른다. 정답이다.
      선택지 4: MPL(Mozilla Public License)은 모질라 재단이 만든 라이선스로, 파이어폭스 등에 쓰이며 리눅스 소프트웨어 대부분이 따르는 라이선스가 아니다.

      핵심 개념:
      GPL은 프로그램을 자유롭게 사용·수정·재배포할 수 있게 하되, 수정본을 배포할 때 소스 코드도 GPL로 공개하도록 요구하는 카피레프트 라이선스다.
      리눅스 커널은 GPL 버전 2로 배포된다.
    tags:
      - license
      - gpl
  - id: b01-03
    type: multiple-choice
    prompt: UNIX와 유사한 공개 운영체제를 만들기 위한 프로젝트로 리처드 스톨먼에 의해 시작된 프로젝트는?
    choices:
      - id: '1'
        text: Eclipse 프로젝트
      - id: '2'
        text: Debian 프로젝트
      - id: '3'
        text: Fedora 프로젝트
      - id: '4'
        text: GNU 프로젝트
    answers:
      - '4'
    explanation: |
      선택지 1: Eclipse 프로젝트는 통합 개발 환경(IDE) 등을 개발하는 이클립스 재단의 프로젝트로, 운영체제 개발 프로젝트가 아니다.
      선택지 2: Debian 프로젝트는 이안 머독이 시작한 리눅스 배포판 개발 프로젝트로, 리처드 스톨먼이 시작한 것이 아니다.
      선택지 3: Fedora 프로젝트는 Red Hat이 후원하는 커뮤니티 리눅스 배포판 프로젝트로, 리처드 스톨먼과 관계없다.
      선택지 4: GNU 프로젝트는 1983년 리처드 스톨먼이 유닉스와 호환되는 자유 소프트웨어 운영체제를 만들기 위해 시작했다. 정답이다.

      핵심 개념:
      GNU는 "GNU's Not Unix"의 재귀 약자다.
      스톨먼은 자유 소프트웨어 재단(FSF)을 설립하고, 소프트웨어의 상업적 독점에 반대하여 GPL을 발표했다.
      GNU 도구와 리눅스 커널이 결합하여 오늘날의 리눅스 시스템(GNU/Linux)이 되었다.
    tags:
      - gnu-project
      - open-source
  - id: b01-04
    type: multiple-choice
    prompt: 수정된 프로그램의 재배포가 의무사항은 아니라서 소스 코드의 비공개가 허용되는 라이선스가 ==아닌== 것은?
    choices:
      - id: '1'
        text: BSD 라이선스
      - id: '2'
        text: GPL
      - id: '3'
        text: MIT 라이선스
      - id: '4'
        text: Apache 라이선스
    answers:
      - '2'
    explanation: |
      선택지 1: BSD 라이선스는 저작권 표시만 유지하면 수정한 프로그램의 소스 코드를 공개하지 않아도 되는 허용적 라이선스다. 비공개가 허용된다.
      선택지 2: GPL은 GPL 소스 코드를 이용해 개발한 프로그램을 배포할 때 소스 코드도 함께 공개하도록 요구하는 카피레프트 라이선스다. 소스 코드 비공개가 허용되지 않으므로 정답이다.
      선택지 3: MIT 라이선스는 저작권·허가 표시만 포함하면 수정본을 비공개로 배포할 수 있는 허용적 라이선스다. 비공개가 허용된다.
      선택지 4: Apache 라이선스는 수정 사항 표시와 라이선스 사본 포함 등을 요구하지만, 수정한 소스 코드의 공개는 요구하지 않는다. 비공개가 허용된다.

      핵심 개념:
      카피레프트 라이선스(GPL, LGPL, MPL 등)는 해당 소스를 이용한 프로그램을 배포할 때 소스 공개 의무를 둔다.
      허용적 라이선스(BSD, MIT, Apache 등)는 소스 공개를 요구하지 않아 상용 제품에 포함하기 쉽다.
    tags:
      - license
      - copyleft
  - id: b01-05
    type: multiple-choice
    prompt: UNIX 운영체제에서 CPU, 메모리 등 주요 자원을 관리하며 가장 핵심적인 기능을 수행하는 프로그램은?
    choices:
      - id: '1'
        text: desktop
      - id: '2'
        text: kernel
      - id: '3'
        text: shell
      - id: '4'
        text: vi
    answers:
      - '2'
    explanation: |
      선택지 1: desktop(데스크톱)은 윈도우 관리자와 그래픽 사용자 인터페이스를 제공하는 사용 환경으로, 자원을 관리하는 핵심 프로그램이 아니다.
      선택지 2: kernel(커널)은 CPU 스케줄링, 메모리 관리, 파일 시스템, 장치 제어 등 운영체제의 핵심 기능을 수행한다. 정답이다.
      선택지 3: shell(셸)은 사용자가 입력한 명령을 해석해 커널에 전달하는 명령어 기반의 대화형 사용자 인터페이스다.
      선택지 4: vi는 텍스트 파일을 작성·수정하는 편집기 프로그램이다.

      핵심 개념:
      유닉스 운영체제는 커널, 셸, 유틸리티(응용 프로그램)로 구성된다.
      커널은 하드웨어 자원을 직접 관리하는 운영체제의 핵심이고, 셸은 사용자와 커널 사이의 인터페이스다.
    tags:
      - kernel
      - unix-structure
  - id: b01-06
    type: multiple-choice
    prompt: Red Hat사에서 자사의 상용 리눅스 운영체제인 RHEL에 안정적인 새로운 기능을 추가하기 위해 테스트 베드로 사용함으로써 새로운 버전이 자주 발표된다는 특징을 가지는 리눅스 배포판의 이름은 무엇인가?
    choices:
      - id: '1'
        text: Ubuntu
      - id: '2'
        text: Slackware
      - id: '3'
        text: Fedora
      - id: '4'
        text: CentOS
    answers:
      - '3'
    explanation: |
      선택지 1: Ubuntu는 Canonical사가 지원하는 데비안 기반 배포판으로, Red Hat의 RHEL과 관계가 없다.
      선택지 2: Slackware는 초기부터 이어져 온 오래된 배포판으로, RHEL의 테스트 베드가 아니다.
      선택지 3: Fedora는 Red Hat이 후원하는 커뮤니티 배포판으로, 새 기능을 먼저 도입해 검증하는 RHEL의 테스트 베드 역할을 하므로 새 버전이 자주 발표된다. Red Hat사는 Fedora의 버그나 결함을 참조하여 RHEL을 출시한다. 정답이다.
      선택지 4: CentOS는 RHEL의 공개 소스를 다시 빌드한 무료 배포판으로, 새 기능의 시험장이 아니라 RHEL과 호환되는 안정 버전을 목표로 했다.

      핵심 개념:
      레드햇 계열 배포판에는 RHEL(상용), Fedora(커뮤니티·최신 기능 시험), CentOS·Rocky Linux(RHEL 호환 무료 배포판)가 있다.
      Fedora에서 검증된 기능이 이후 RHEL에 반영된다.
    tags:
      - linux-distribution
      - fedora
  - id: b01-07
    type: multiple-choice
    prompt: GNU 정신에 가장 충실한 배포판이며, GNU 프로젝트의 공식적인 후원을 받는 유일한 배포판으로서 Ubuntu의 기초가 되었던 배포판은?
    choices:
      - id: '1'
        text: OpenSUSE
      - id: '2'
        text: Slackware
      - id: '3'
        text: Debian
      - id: '4'
        text: CentOS
    answers:
      - '3'
    explanation: |
      선택지 1: OpenSUSE는 SUSE사가 후원하는 커뮤니티 배포판으로, 우분투의 기반이 아니다.
      선택지 2: Slackware는 패트릭 볼커딩이 만든 오래된 배포판으로, 우분투의 기반이 아니다.
      선택지 3: Debian은 이안 머독이 시작한 '데비안 프로젝트'에서 많은 자원봉사자의 자발적 참여로 개발되는 배포판으로, 자유 소프트웨어 정신을 엄격히 따르고 Ubuntu의 기초가 되었다. 정답이다.
      선택지 4: CentOS는 RHEL을 다시 빌드한 레드햇 계열 배포판으로, 우분투의 기반이 아니다.

      핵심 개념:
      데비안은 상업 회사가 아닌 커뮤니티가 개발하는 대표적인 배포판이며 dpkg·apt 패키지 관리 체계를 쓴다.
      Ubuntu, Linux Mint 등 많은 배포판이 데비안을 기반으로 만들어졌다.

      ※ 발문의 "GNU 프로젝트의 공식적인 후원을 받는 유일한 배포판"은 자유 소프트웨어 재단(FSF)이 데비안 개발을 후원했던 초기(1994~1995년)의 사정을 설명한 것이다. 현재 FSF는 데비안을 공식 후원하지 않으며 FSF의 자유 배포판 목록에도 데비안은 들어 있지 않다. 인쇄 정답(Debian)을 유지한다.
    tags:
      - linux-distribution
      - debian
  - id: b01-08
    type: multiple-choice
    prompt: 수정 프로그램에 대한 소스 코드의 공개를 요구하지 않는 라이선스로 BSD 라이선스와 비슷하나 특허권 등의 법적인 문제를 보완한 소프트웨어 라이선스는?
    choices:
      - id: '1'
        text: MPL
      - id: '2'
        text: GPL
      - id: '3'
        text: LGPL
      - id: '4'
        text: Apache 라이선스
    answers:
      - '4'
    explanation: |
      선택지 1: MPL은 수정한 MPL 파일의 소스 코드 공개를 요구하는 약한 카피레프트 라이선스다.
      선택지 2: GPL은 수정본을 배포할 때 소스 코드 공개를 요구하는 카피레프트 라이선스다.
      선택지 3: LGPL은 라이브러리를 동적으로 링크해 쓰는 것은 허용하지만, 라이브러리 자체를 수정해 배포하면 그 소스 코드를 공개해야 하는 라이선스다.
      선택지 4: Apache 라이선스는 아파치 웹 서버를 포함한 아파치 재단(ASF: Apache Software Foundation)의 소프트웨어에 적용되며, BSD처럼 소스 공개를 요구하지 않으면서 특허 사용 허가 등 법적 조항을 보완했다. 정답이다.

      핵심 개념:
      허용적 라이선스 중 Apache 라이선스는 기여자의 특허권 사용 허가와 상표 조항을 명시한 점이 BSD·MIT 라이선스와 다르다.
      GPL 계열(GPL, LGPL)과 MPL은 정도의 차이는 있지만 소스 공개 의무가 있다.
    tags:
      - license
      - apache-license
  - id: b02-01
