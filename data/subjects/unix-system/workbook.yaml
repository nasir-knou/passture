  - id: b02-02
    type: multiple-choice
    prompt: 다음 중 리눅스를 ‘하드디스크의 비어 있는 파티션에 설치’하는 방법과 관련이 가장 ==적은== 것은?
    choices:
      - id: '1'
        text: 기존 운영체제에서 사용하지 않는 파티션이 있는지 확인한다.
      - id: '2'
        text: 새로운 하드디스크를 추가하여 파티션을 확보한다.
      - id: '3'
        text: 기존 파티션의 ‘볼륨 축소’를 통해 파티션을 확보한다.
      - id: '4'
        text: 가상머신 소프트웨어를 이용하여 ‘새 가상 하드디스크’를 생성한다.
    answers:
      - '4'
    explanation: |
      선택지 1: 기존 운영체제가 쓰지 않는 파티션이 있다면 그 파티션에 바로 리눅스를 설치할 수 있다. 빈 파티션 설치와 관련이 있다.
      선택지 2: 새 하드디스크를 추가하면 그 디스크에 리눅스용 파티션을 만들 수 있다. 빈 파티션을 확보하는 방법이다.
      선택지 3: 기존 파티션의 볼륨을 축소하면 남는 공간에 새 파티션을 만들 수 있다. 빈 파티션을 확보하는 방법이다.
      선택지 4: 가상 하드디스크 생성은 가상머신에 '게스트 운영체제'를 설치할 때 쓰는 방법으로, 실제 하드디스크의 빈 파티션에 설치하는 방법과 관련이 가장 적다. 정답이다.

      핵심 개념:
      리눅스를 물리 디스크에 직접 설치하려면 리눅스 전용 파티션이 필요하다.
      빈 파티션은 사용하지 않는 파티션 활용, 디스크 추가, 기존 볼륨 축소로 확보한다.
      가상머신 설치는 호스트 운영체제 위에 가상 하드디스크를 만들어 설치하므로 기존 파티션을 건드리지 않는다.
    tags:
      - linux-installation
      - partition
  - id: b02-03
    type: multiple-choice
    prompt: 리눅스에서 시스템 환경 설정 파일이 주로 위치하는 디렉터리는?
    choices:
      - id: '1'
        text: /
      - id: '2'
        text: /dev
      - id: '3'
        text: /etc
      - id: '4'
        text: /proc
    answers:
      - '3'
    explanation: |
      선택지 1: /는 루트 디렉터리로 모든 파일과 디렉터리의 최상위 디렉터리이며, 설정 파일을 모아 두는 곳이 아니다.
      선택지 2: /dev는 하드디스크, 터미널 같은 장치를 나타내는 장치 파일이 위치하는 디렉터리다.
      선택지 3: /etc에는 passwd, fstab 등 시스템의 중요한 환경 설정 파일이 위치한다. 정답이다.
      선택지 4: /proc는 프로세스와 커널 정보를 파일 형태로 보여 주는 가상 파일 시스템이다.

      핵심 개념:
      리눅스 표준 디렉터리는 용도에 따라 정해져 있다.
      /etc는 설정 파일, /dev는 장치 파일, /proc는 커널·프로세스 정보를 담는 가상 파일 시스템, /home은 사용자 홈 디렉터리를 둔다.
    tags:
      - standard-directory
  - id: b02-04
    type: multiple-choice
    prompt: 리눅스에서 ‘장치 파일’이 위치하는 디렉터리는?
    choices:
      - id: '1'
        text: /boot
      - id: '2'
        text: /tmp
      - id: '3'
        text: /dev
      - id: '4'
        text: /sys
    answers:
      - '3'
    explanation: |
      선택지 1: /boot에는 커널 이미지와 부트 로더의 설정 파일 등 부팅에 필요한 파일이 저장된다.
      선택지 2: /tmp에는 프로그램과 사용자가 임시로 만드는 파일이 저장된다.
      선택지 3: /dev에는 /dev/sda, /dev/tty처럼 장치를 파일로 나타낸 장치 파일이 위치한다. 정답이다.
      선택지 4: /sys는 커널이 장치와 드라이버 등의 시스템 정보를 보여 주는 가상 파일 시스템(sysfs)으로, 장치 파일 자체가 위치하는 곳은 아니다.

      핵심 개념:
      리눅스는 하드웨어 장치도 파일로 다루며, 장치 파일은 /dev 디렉터리에 둔다.
      응용 프로그램은 장치 파일을 읽고 쓰는 방식으로 장치에 접근한다.
    tags:
      - standard-directory
      - device-file
  - id: b02-05
    type: multiple-choice
    prompt: PC에 장착된 SCSI 하드디스크 중 primary master 드라이브(또는 첫 번째 디스크)의 두 번째 파티션을 리눅스의 파일명으로 표시하면?
    choices:
      - id: '1'
        text: /dev/hda2
      - id: '2'
        text: /dev/ide2
      - id: '3'
        text: /dev/pdm2
      - id: '4'
        text: /dev/sda2
    answers:
      - '4'
    explanation: |
      선택지 1: /dev/hda2는 IDE 방식 첫 번째 디스크의 두 번째 파티션 이름으로, SCSI 디스크의 이름 형식이 아니다.
      선택지 2: /dev/ide2는 리눅스의 디스크 장치 파일 이름 규칙에 없는 이름이다.
      선택지 3: /dev/pdm2도 리눅스의 디스크 장치 파일 이름 규칙에 없는 이름이다.
      선택지 4: SCSI(및 SATA·USB) 디스크는 /dev/sd* 형태이고, 첫 번째 디스크는 a, 두 번째 파티션은 2를 붙여 /dev/sda2가 된다. 정답이다.

      핵심 개념:
      디스크 장치 파일 이름은 /dev/sd + 디스크 순서 문자(a, b, c…) + 파티션 번호로 구성된다.
      예전 IDE 디스크는 /dev/hd*, NVMe 디스크는 /dev/nvme0n1p1 형태를 쓴다.
    tags:
      - device-name
      - partition
  - id: b02-06
    type: multiple-choice
    prompt: 가상머신 소프트웨어를 이용하여 리눅스를 설치할 때, 다음 중 가장 먼저 수행해야 하는 것은?
    choices:
      - id: '1'
        text: 가상머신 만들기
      - id: '2'
        text: 네트워크 설정하기
      - id: '3'
        text: Rocky Linux 설치 프로그램 시작하기
      - id: '4'
        text: BIOS 부팅 순서 조정하기
    answers:
      - '1'
    explanation: |
      선택지 1: 리눅스가 설치될 가상머신을 먼저 만들어야 그 가상머신에서 설치 프로그램을 시작할 수 있다. 정답이다.
      선택지 2: 네트워크 설정은 설치 과정이나 설치 후에 하는 작업으로, 가상머신이 있어야 할 수 있다.
      선택지 3: 설치 프로그램은 만들어 둔 가상머신에 설치 이미지(ISO)를 연결한 뒤 시작한다.
      선택지 4: BIOS 부팅 순서 조정은 실제 컴퓨터에 설치 매체로 부팅할 때 필요한 작업이며, 가상머신 방식에서도 가상머신을 만든 뒤에야 할 수 있다.

      핵심 개념:
      가상머신 설치 순서는 가상머신 소프트웨어 설치 → 가상머신 생성(CPU·메모리·가상 하드디스크 지정) → 설치 이미지 연결 → 설치 프로그램 시작 → 설치 옵션 설정이다.
    tags:
      - virtual-machine
      - linux-installation
  - id: b02-07
    type: multiple-choice
    prompt: 다음 중 디렉터리와 해당 디렉터리의 일반적인 용도에 대한 설명으로 ==틀린== 것은?
    choices:
      - id: '1'
        text: '/: 일시적으로 부팅에 필요한 시스템 파일이 위치한다.'
      - id: '2'
        text: '/usr: 시스템을 위한 명령, 라이브러리, 매뉴얼 페이지가 들어 있다.'
      - id: '3'
        text: '/mnt: 마운트될 파일 시스템의 마운트 포인터가 되는 디렉터리가 존재한다.'
      - id: '4'
        text: '/home: 사용자 파일이 저장된다.'
    answers:
      - '1'
    explanation: |
      선택지 1: 루트 디렉터리(/)는 모든 파일과 디렉터리의 최상위 디렉터리다. 부팅에 필요한 커널 이미지와 부트 로더 파일이 위치하는 곳은 /boot이다. 틀린 설명이므로 정답이다.
      선택지 2: /usr에는 사용자와 시스템이 쓰는 명령(/usr/bin), 라이브러리(/usr/lib), 매뉴얼 페이지(/usr/share/man) 등이 들어 있다. 옳은 설명이다.
      선택지 3: /mnt는 파일 시스템을 임시로 마운트할 때 마운트 포인트로 쓰는 디렉터리다. 옳은 설명이다.
      선택지 4: /home 아래에 사용자별 홈 디렉터리가 만들어지고 사용자 파일이 저장된다. 옳은 설명이다.

      핵심 개념:
      /는 디렉터리 계층의 시작점이고, 나머지 표준 디렉터리는 모두 그 아래에 있다.
      /boot는 부팅 파일, /usr는 프로그램과 라이브러리, /mnt는 임시 마운트 포인트, /home은 사용자 홈 디렉터리를 둔다.
    tags:
      - standard-directory
  - id: b02-08
    type: multiple-choice
    prompt: 모든 작업에 우선하여 동작하는 프로그램으로 CPU와 메모리 관리, 파일 시스템 관리, 프로세스 관리, 입출력 장치의 제어 등 운영체제의 핵심 기능을 수행하는 요소를 무엇이라 하는가?
    choices:
      - id: '1'
        text: 응용 프로그램
      - id: '2'
        text: 데이터베이스
      - id: '3'
        text: 커널
      - id: '4'
        text: 유틸리티
    answers:
      - '3'
    explanation: |
      선택지 1: 응용 프로그램은 사용자의 특정 작업을 위해 커널 위에서 실행되는 프로그램으로, 자원을 직접 관리하지 않는다.
      선택지 2: 데이터베이스는 데이터를 저장·관리하는 시스템으로, 운영체제의 구성 요소가 아니다.
      선택지 3: 커널은 CPU·메모리·파일 시스템·프로세스·입출력 장치를 관리하는 운영체제의 핵심이다. 원래 '리눅스'라는 용어는 리눅스 배포판이 사용하는 커널의 이름이다. 정답이다.
      선택지 4: 유틸리티는 파일 관리, 압축 등 시스템을 쓰기 편하게 돕는 보조 프로그램이다.

      핵심 개념:
      커널은 부팅 후 메모리에 상주하면서 하드웨어 자원을 관리하고, 시스템 호출을 통해 응용 프로그램에 서비스를 제공한다.
      리눅스 배포판은 리눅스 커널에 GNU 도구, 셸, 응용 프로그램을 묶은 것이다.
    tags:
      - kernel
  - id: b02-09
    type: multiple-choice
    prompt: 시스템 부팅과 함께 자동으로 마운트되어야 할 항목과 옵션이 들어 있는 곳은?
    choices:
      - id: '1'
        text: /home
      - id: '2'
        text: /mount
      - id: '3'
        text: /etc/fstab
      - id: '4'
        text: /dev
    answers:
      - '3'
    explanation: |
      선택지 1: /home은 사용자 홈 디렉터리가 만들어지는 디렉터리로, 마운트 정보를 담지 않는다.
      선택지 2: /mount는 리눅스 표준 디렉터리가 아니다. 임시 마운트 포인트로 쓰는 표준 디렉터리는 /mnt이다.
      선택지 3: /etc/fstab은 부팅 시 자동으로 마운트할 장치, 마운트 포인트, 파일 시스템 종류, 마운트 옵션 등을 한 줄씩 기록한 설정 파일이다. 정답이다.
      선택지 4: /dev는 장치 파일이 위치하는 디렉터리다.

      핵심 개념:
      /etc/fstab의 각 줄은 장치(또는 UUID), 마운트 포인트, 파일 시스템 종류, 마운트 옵션, 덤프 여부, 검사 순서로 구성된다.
      부팅 과정에서 이 파일에 적힌 파일 시스템이 자동으로 마운트된다.
    tags:
      - fstab
      - mount
  - id: b02-10
    type: multiple-choice
    prompt: 부팅될 때 필요한 파일을 포함하는 디렉터리로 커널 이미지(vmlinuz)와 부트 로더의 설정 파일이 있는 리눅스 표준 디렉터리는?
    choices:
      - id: '1'
        text: /kernel
      - id: '2'
        text: /bin과 /sbin
      - id: '3'
        text: /etc
      - id: '4'
        text: /boot
    answers:
      - '4'
    explanation: |
      선택지 1: /kernel은 리눅스 표준 디렉터리가 아니다.
      선택지 2: /bin과 /sbin에는 일반 사용자 명령과 시스템 관리 명령의 실행 파일이 있다.
      선택지 3: /etc에는 시스템 환경 설정 파일이 있다.
      선택지 4: /boot에는 커널 이미지(vmlinuz), 초기 램디스크, GRUB 같은 부트 로더의 설정 파일이 있으며, 부트 로더는 이 디렉터리에서 필요한 파일을 찾아 부팅을 진행한다. 정답이다.

      핵심 개념:
      부트 로더는 /boot에 있는 커널 이미지를 메모리에 적재하여 실행한다.
      /boot 디렉터리가 손상되면 시스템이 부팅되지 않는다.
    tags:
      - standard-directory
      - boot
  - id: b03-01
    type: multiple-choice
    prompt: Rocky Linux에서 기본으로 주어지는 셸의 종류는 무엇인가?
    choices:
      - id: '1'
        text: Bourne Shell(sh)
      - id: '2'
        text: Korn Shell(ksh)
      - id: '3'
        text: Bash Shell(bash)
      - id: '4'
        text: C Shell(csh)
    answers:
      - '3'
    explanation: |
      선택지 1: Bourne Shell(sh)은 유닉스 초기의 표준 셸로, Rocky Linux의 기본 로그인 셸이 아니다.
      선택지 2: Korn Shell(ksh)은 Bourne 셸을 확장한 AT&T 계열 셸로, 별도로 설치해야 사용된다.
      선택지 3: bash는 Rocky Linux를 비롯한 대부분의 리눅스 배포판에서 기본으로 사용되는 셸이다. 정답이다.
      선택지 4: C Shell(csh)은 C 언어와 비슷한 문법을 가진 BSD 계열 셸로, 기본 셸이 아니다.

      핵심 개념:
      셸은 사용자 명령을 해석해 커널에 전달하는 명령 해석기다.
      bash(Bourne Again Shell)는 sh와 호환되면서 히스토리, 명령 완성 등의 기능을 더한 셸이다.
      사용자의 로그인 셸은 /etc/passwd의 마지막 필드에 기록된다.
    tags:
      - shell
      - bash
  - id: b03-02
    type: multiple-choice
    prompt: 리눅스 명령어의 이름, 개요, 옵션, 환경과 매개변수 등을 자세히 보여 주는 명령어는?
    choices:
      - id: '1'
        text: cat
      - id: '2'
        text: help
      - id: '3'
        text: info
      - id: '4'
        text: man
    answers:
      - '4'
    explanation: |
      선택지 1: cat은 파일의 내용을 화면에 출력하는 명령이다.
      선택지 2: help는 cd, echo 같은 bash 내장 명령의 간단한 사용법을 보여 주는 내장 명령이다.
      선택지 3: info는 GNU 형식의 하이퍼텍스트 문서를 보여 주는 명령으로, 이름·개요·옵션 등의 정해진 항목으로 구성된 온라인 매뉴얼을 보여 주는 명령은 아니다.
      선택지 4: man은 명령의 이름(NAME), 개요(SYNOPSIS), 설명·옵션, 환경 등을 정해진 형식으로 보여 주는 온라인 매뉴얼 명령이다. 정답이다.

      핵심 개념:
      man 명령 이름 형식으로 매뉴얼 페이지를 보며, 매뉴얼은 섹션(1: 사용자 명령, 5: 파일 형식, 8: 관리 명령 등)으로 나뉜다.
      man -k 키워드로 관련 명령을 검색할 수 있다.
    tags:
      - man-page
      - shell-command
  - id: b03-03
    type: multiple-choice
    passageRefs:
      - guw03-p1-echo-home-cmd-01
    prompt: 다음 명령의 출력은? 사용자의 홈 디렉터리는 /home/linuxuser라 가정한다.
    choices:
      - id: '1'
        text: \$HOME
      - id: '2'
        text: '''\$HOME'''
      - id: '3'
        text: /home/linuxuser
      - id: '4'
        text: "'/home/linuxuser'"
    answers:
      - '4'
    explanation: |
      선택지 1: 큰따옴표 안에서는 달러(\$) 문자가 해석되어 변수 확장이 일어나므로 \$HOME이 그대로 출력되지 않는다.
      선택지 2: 작은따옴표가 큰따옴표 안에 있으므로 변수 확장을 막지 못한다. '\$HOME'이 그대로 출력되지 않는다.
      선택지 3: 큰따옴표 안의 작은따옴표는 일반 문자로 취급되어 출력에 남으므로, 작은따옴표가 빠진 결과는 틀렸다.
      선택지 4: 바깥의 큰따옴표만 인용 기능을 하고, 안쪽 작은따옴표는 그대로 출력되며 \$HOME은 /home/linuxuser로 확장되어 '/home/linuxuser'가 출력된다. 정답이다.

      핵심 개념:
      작은따옴표는 안의 모든 특수 문자를 해석하지 않는다.
      큰따옴표는 대부분의 특수 문자를 막지만 \$(변수 확장), 역따옴표(명령 치환), \(이스케이프)는 해석한다.
      따옴표가 겹치면 바깥 따옴표의 규칙만 적용되고 안쪽 따옴표는 일반 문자가 된다.
    tags:
      - quoting
      - variable-expansion
  - id: b03-04
    type: multiple-choice
    passageRefs:
      - guw03-p1-echo-date-cmd-01
    prompt: 다음 명령의 실행 결과로 예상되는 것은?
    choices:
      - id: '1'
        text: ''
        diagram:
          type: data-table
          cellFormat: code
          columns:
            - 출력 결과
          rows:
            - - Today is `date`
      - id: '2'
        text: ''
        diagram:
          type: data-table
          cellFormat: code
          columns:
            - 출력 결과
          rows:
            - - '"Today is `date`"'
      - id: '3'
        text: ''
        diagram:
          type: data-table
          cellFormat: code
          columns:
            - 출력 결과
          rows:
            - - Today is 2023. 12. 25. (월) 10:58:44 KST
      - id: '4'
        text: ''
        diagram:
          type: data-table
          cellFormat: code
          columns:
            - 출력 결과
          rows:
            - - 아무것도 출력되지 않는다.
    answers:
      - '3'
    explanation: |
      선택지 1: 큰따옴표 안에서도 역따옴표는 해석되므로 역따옴표와 date가 글자 그대로 출력되지 않는다.
      선택지 2: 바깥 큰따옴표는 인용 기호로 쓰이고 출력되지 않으며, 역따옴표 부분도 명령 치환되므로 이런 출력은 나오지 않는다.
      선택지 3: 큰따옴표 안에서 역따옴표로 감싼 date가 명령 치환되어 그 자리에 현재 날짜와 시간이 들어가므로 "Today is"에 이어 날짜가 출력된다. 정답이다.
      선택지 4: echo는 인자를 출력하는 명령이고 date 실행도 성공하므로 아무것도 출력되지 않는 경우는 없다.

      핵심 개념:
      명령 치환은 역따옴표 또는 \$(명령) 형식으로 쓰며, 명령의 표준 출력이 그 자리에 들어간다.
      큰따옴표 안에서는 명령 치환과 변수 확장이 일어나고, 작은따옴표 안에서는 일어나지 않는다.
    tags:
      - command-substitution
      - quoting
  - id: b03-05
    type: multiple-choice
    prompt: 셸에서 사용하는 특수 문자 중 표준출력을 파일로 지정하되 파일의 기존 내용에 덧붙여서 출력되도록 하는 것은?
    choices:
      - id: '1'
        text: '>'
      - id: '2'
        text: <
      - id: '3'
        text: '>>'
      - id: '4'
        text: '<<'
    answers:
      - '3'
    explanation: |
      선택지 1: >는 표준출력을 파일로 보내되 기존 내용을 지우고 덮어쓴다.
      선택지 2: <는 파일을 명령의 표준입력으로 연결하는 입력 재지정이다.
      선택지 3: command >> file 형태는 명령의 표준출력을 화면으로 보내지 않고 지정된 파일의 끝에 덧붙인다. 정답이다.
      선택지 4: <<는 히어 도큐먼트(here document)로, 지정한 종료 문자열이 나올 때까지 입력한 내용을 명령의 표준입력으로 사용한다.

      핵심 개념:
      출력 재지정: >는 덮어쓰기, >>는 덧붙이기다.
      입력 재지정: <는 파일에서 입력, <<는 히어 도큐먼트다.
      2>는 표준오류를 파일로 보낸다.
    tags:
      - redirection
  - id: b03-06
    type: multiple-choice
    prompt: 셸의 명령 행에서 사용하는 특수 문자에 대한 설명으로 옳은 것은?
    choices:
      - id: '1'
        text: '& — 명령을 백그라운드로 실행'
      - id: '2'
        text: '! — 바로 전에 실행한 명령'
      - id: '3'
        text: '? — 임의의 문자열 패턴'
      - id: '4'
        text: '| — 이전 명령이 실패하면 실행하라는 조건부 실행'
    answers:
      - '1'
    explanation: |
      선택지 1: 명령 끝에 &를 붙이면 그 명령은 백그라운드로 실행되고 셸은 곧바로 다음 명령을 받는다. 옳은 설명이므로 정답이다.
      선택지 2: !는 히스토리 확장 문자로, !번호나 !문자열처럼 히스토리의 명령을 불러온다. 바로 전에 실행한 명령은 !!이다.
      선택지 3: ?는 임의의 한 문자에 대응하는 와일드카드다. 임의의 문자열(0개 이상의 문자)에 대응하는 것은 *이다.
      선택지 4: |는 앞 명령의 표준출력을 뒤 명령의 표준입력으로 연결하는 파이프다. 앞 명령이 실패했을 때만 뒤 명령을 실행하는 조건부 실행은 ||이다.

      핵심 개념:
      &는 백그라운드 실행, ;는 순차 실행, &&는 앞 명령이 성공하면 실행, ||는 앞 명령이 실패하면 실행이다.
      *는 0개 이상의 임의 문자, ?는 임의의 한 문자, [ ]는 괄호 안 문자 중 하나에 대응한다.
    tags:
      - special-character
      - background-job
  - id: b03-07
    type: multiple-choice
    prompt: Bash 셸의 환경 설정 파일 중 로그인할 때 실행되는 것은?
    choices:
      - id: '1'
        text: ~/.bashrc
      - id: '2'
        text: ~/.bash_profile
      - id: '3'
        text: ~/.bash_history
      - id: '4'
        text: ~/.bash_logout
    answers:
      - '2'
    explanation: |
      선택지 1: ~/.bashrc는 비로그인 셸(로그인 후 새로 여는 대화형 셸)이 시작될 때 실행된다. 로그인 시에는 보통 ~/.bash_profile이 이 파일을 불러서 간접적으로 실행된다.
      선택지 2: ~/.bash_profile은 로그인 셸이 시작될 때 실행되는 사용자별 환경 설정 파일이다. 정답이다.
      선택지 3: ~/.bash_history는 실행한 명령의 히스토리가 저장되는 파일로, 실행되는 설정 파일이 아니다.
      선택지 4: ~/.bash_logout은 로그아웃을 수행할 때 실행된다.

      핵심 개념:
      로그인 셸은 /etc/profile을 실행한 뒤 ~/.bash_profile(없으면 ~/.bash_login, ~/.profile)을 실행한다.
      비로그인 대화형 셸은 ~/.bashrc를 실행하고, 로그인 셸이 끝날 때 ~/.bash_logout이 실행된다.
    tags:
      - bash-startup-file
  - id: b04-01
    type: multiple-choice
    prompt: 파일 목록을 보여 주는 ls 명령에서 숨김 파일까지 보여 주는 옵션은?
    choices:
      - id: '1'
        text: -a
      - id: '2'
        text: -i
      - id: '3'
        text: -l
      - id: '4'
        text: -F
    answers:
      - '1'
    explanation: |
      선택지 1: -a(--all)는 이름이 도트(.)로 시작하는 숨김 파일까지 모든 파일을 보여 준다. 정답이다.
      선택지 2: -i는 각 파일의 inode 번호를 함께 보여 준다.
      선택지 3: -l은 권한, 링크 수, 소유자, 크기, 수정 시간 등 자세한 정보를 한 줄에 하나씩 보여 준다.
      선택지 4: -F는 디렉터리 뒤에 /, 실행 파일 뒤에 * 등을 붙여 파일 종류를 표시한다.

      핵심 개념:
      리눅스에서 이름이 .으로 시작하는 파일은 숨김 파일로, ls가 기본적으로 보여 주지 않는다.
      .bashrc 같은 환경 설정 파일이 대표적인 숨김 파일이다.
    tags:
      - ls-command
  - id: b04-02
    type: multiple-choice
    prompt: ls 명령의 옵션에 관한 설명 중 옳지 ==않은== 것은?
    choices:
      - id: '1'
        text: '-t: 파일 목록을 가로 방향으로 나열한다.'
      - id: '2'
        text: '-a: 디렉터리 내의 모든 파일을 출력한다.'
      - id: '3'
        text: '-l: 라인당 한 파일씩 자세한 정보를 출력한다.'
      - id: '4'
        text: '-s: Kb 단위로 파일 크기를 출력한다.'
    answers:
      - '1'
    explanation: |
      선택지 1: -t는 수정 시간을 기준으로 최근 파일부터 정렬하여 보여 주는 옵션이다. 가로 방향으로 나열하는 옵션은 -x이다. 옳지 않은 설명이므로 정답이다.
      선택지 2: -a는 숨김 파일을 포함해 디렉터리 내의 모든 파일을 출력한다. 옳은 설명이다.
      선택지 3: -l은 한 줄에 한 파일씩 권한, 소유자, 크기 등 자세한 정보를 출력한다. 옳은 설명이다.
      선택지 4: -s는 각 파일이 차지하는 크기를 블록 단위(기본 1KB)로 출력한다. 옳은 설명이다.

      핵심 개념:
      ls의 주요 옵션: -a(숨김 파일 포함), -l(자세한 정보), -t(수정 시간순 정렬), -R(하위 디렉터리까지), -s(크기), -i(inode 번호).
      옵션은 ls -al처럼 묶어서 쓸 수 있다.
    tags:
      - ls-command
  - id: b04-03
    type: multiple-choice
    prompt: cd 명령에 관한 설명 중 옳은 것은?
    choices:
      - id: '1'
        text: cd ~를 실행하였을 때 사용자의 홈 디렉터리로 이동한다.
      - id: '2'
        text: cd를 실행하였을 때 현재 디렉터리의 위치를 출력한다.
      - id: '3'
        text: cd -al 명령을 실행하면 현재 디렉터리에 있는 파일에 관한 모든 정보를 출력한다.
      - id: '4'
        text: Change Disk의 약자로 CD Disk 등을 바꿀 때 사용한다.
    answers:
      - '1'
    explanation: |
      선택지 1: 틸드(~) 문자는 현재 사용자의 홈 디렉터리를 의미하므로 cd ~를 실행하면 홈 디렉터리로 이동한다. 옳은 설명이므로 정답이다.
      선택지 2: 인자 없이 cd를 실행하면 홈 디렉터리로 이동한다. 현재 디렉터리의 위치를 출력하는 명령은 pwd이다.
      선택지 3: cd에는 -al 같은 목록 출력 옵션이 없다. 파일에 관한 모든 정보를 출력하는 것은 ls -al이다.
      선택지 4: cd는 'change directory'의 약자로, 작업 디렉터리를 바꾸는 명령이다.

      핵심 개념:
      cd 경로로 작업 디렉터리를 바꾼다. cd 또는 cd ~는 홈 디렉터리, cd ..는 상위 디렉터리, cd -는 직전 디렉터리로 이동한다.
      ~user는 지정한 사용자의 홈 디렉터리를 뜻한다.
    tags:
      - cd-command
      - home-directory
