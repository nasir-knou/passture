  - id: guw05-p1-boot-steps-01
    type: text
    body: |
      • 머신 BIOS 또는 부트 펌웨어가 ___㉠___을/를 로드하고 실행시킨다.
      • ___㉠___이/가 디스크에서 커널 이미지를 찾아 메모리에 로드하고 시작시킨다.
      • 커널이 디바이스를 찾고 디바이스 드라이버를 로드한다.
      • 커널이 루트 파일 시스템을 마운트한다.
      • 커널은 ___㉡___ 프로세스를 시작시키고 제어권을  넘긴다.
      • ___㉡___ 프로세스는 시스템 초기화 작업을 수행한다.
      • 사용자가 로그인을 수행할 수 있도록 화면이 등장한다.
