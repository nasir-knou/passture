    explanation: |
      선택지 1: rmdir에는 -r 옵션이 없다. 하위 내용까지 재귀적으로 삭제하는 -r은 rm 명령의 옵션이다.
      선택지 2: rmdir -p mydir은 mydir만 삭제하려 하는데, mydir 안에 mydoc이 있어 비어 있지 않으므로 실패한다.
      선택지 3: rmdir에는 -r 옵션이 없으므로 오류가 난다.
      선택지 4: rmdir -p mydir/mydoc은 빈 디렉터리 mydoc을 삭제한 뒤 비게 된 상위 디렉터리 mydir까지 차례로 삭제한다. 정답이다.

      핵심 개념:
      rmdir은 빈 디렉터리만 삭제하며, -p 옵션을 주면 경로에 있는 상위 디렉터리도 비어 있으면 함께 삭제한다.
      비어 있지 않은 디렉터리는 rm -r 디렉터리로 삭제한다.
    tags:
