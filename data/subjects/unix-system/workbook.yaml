  - id: b09-02
    type: multiple-choice
    prompt: 프로세스가 준비상태에서 실행상태로 전이되는 과정인 것은?
    choices:
      - id: '1'
        text: 대기(block)
      - id: '2'
        text: 디스패치(dispatch)
      - id: '3'
        text: 선점(preemption)
      - id: '4'
        text: 웨이크업(wakeup)
    answers:
      - '2'
    explanation: |
      선택지 1: 대기(block)는 실행 중인 프로세스가 입출력 등을 기다리느라 실행상태에서 대기상태로 가는 전이다.
      선택지 2: 디스패치는 스케줄러가 준비상태의 프로세스를 골라 CPU를 할당해 실행상태로 바꾸는 전이다. 정답이다.
      선택지 3: 선점은 실행 중인 프로세스가 시간 할당량 만료 등으로 CPU를 빼앗겨 실행상태에서 준비상태로 돌아가는 전이다.
      선택지 4: 웨이크업은 기다리던 사건이 끝난 프로세스가 대기상태에서 준비상태로 가는 전이다.

      핵심 개념:
      준비 → 실행은 디스패치, 실행 → 준비는 선점(시간 만료), 실행 → 대기는 블록, 대기 → 준비는 웨이크업이다.
      대기상태의 프로세스는 곧바로 실행상태로 가지 않고 반드시 준비상태를 거친다.
    tags:
