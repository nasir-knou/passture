  - id: b04-06
    type: multiple-choice
    prompt: 현재 디렉터리에 있는 test 파일의 접근권한을 소유자는 읽기와 쓰기 권한, 그룹은 읽기 권한, 다른 사용자는 아무 권한이 없도록 설정하는 명령어는?
    choices:
      - id: '1'
        text: chmod 'u+rw,g+r,o-rwx' test
      - id: '2'
        text: chmod 640 test
      - id: '3'
        text: chmod 'ug+r,u+w,o=' test
      - id: '4'
        text: chmod 755 test
    answers:
      - '2'
    explanation: |
      선택지 1: +는 기존 권한에 더하기만 하므로, test에 소유자의 실행 권한이나 그룹의 쓰기·실행 권한이 원래 있었다면 그대로 남아 요구한 권한이 되지 않을 수 있다.
      선택지 2: 640은 소유자 6(rw-), 그룹 4(r--), 다른 사용자 0(---)으로 rw-r----- 권한을 정확히 설정한다. 정답이다.
      선택지 3: ug+r, u+w는 기존 권한에 더하기만 하므로 원래 있던 소유자의 실행 권한이나 그룹의 쓰기·실행 권한이 남을 수 있다. o=만 다른 사용자의 권한을 모두 없앤다.
      선택지 4: 755는 rwxr-xr-x로, 소유자에게 실행 권한, 그룹과 다른 사용자에게 읽기·실행 권한을 준다.

      핵심 개념:
      8진수 표기법은 r=4, w=2, x=1을 더한 세 자리 숫자로 소유자·그룹·기타 사용자의 권한을 한 번에 지정하므로 기존 권한과 관계없이 결과가 정해진다.
      기호 표기법에서 +와 -는 기존 권한을 더하거나 빼고, =는 지정한 권한으로 바꾼다.
    tags:
      - chmod
      - permission
  - id: b04-07
    type: multiple-choice
    prompt: 파일의 별명을 만들 수 있는 명령어는?
    choices:
      - id: '1'
        text: cp
      - id: '2'
        text: ln
      - id: '3'
        text: mv
      - id: '4'
        text: rm
