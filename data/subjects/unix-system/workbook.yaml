  - id: b04-05
    type: multiple-choice
    prompt: 현재 디렉터리 아래에 있는 mydir 디렉터리 안에는 mydoc 디렉터리만 있고 mydoc 디렉터리는 비어 있다. mydir 디렉터리와 mydoc 디렉터리를 동시에 삭제할 수 있는 명령어는?
    choices:
      - id: '1'
        text: rmdir -r mydir
      - id: '2'
