    explanation: |
      선택지 1: 명령 끝에 &를 붙이면 그 명령은 백그라운드에서 실행된다. 옳은 설명이다.
      선택지 2: 키보드 입력은 포어그라운드 프로세스만 받을 수 있으므로 백그라운드 프로세스는 키보드 입력을 받지 못한다. 옳은 설명이다.
      선택지 3: 백그라운드 프로세스를 실행하면 셸은 그 종료를 기다리지 않고 곧바로 프롬프트를 띄워 다음 명령을 받는다. 종료를 기다려야 하는 것은 포어그라운드 프로세스이다. 옳지 않은 설명이므로 정답이다.
      선택지 4: 백그라운드 실행은 오래 걸리는 작업을 돌려 두고 셸에서 다른 일을 할 때 주로 쓴다. 옳은 설명이다.

      핵심 개념:
      포어그라운드 프로세스는 터미널을 차지해 끝날 때까지 셸이 기다리고, 백그라운드 프로세스는 셸과 동시에 실행된다.
      백그라운드 작업은 jobs로 보고, fg로 포어그라운드로 가져올 수 있다.
    tags:
