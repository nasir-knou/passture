      선택지 2: 작은따옴표는 둘러싼 내용을 문자 그대로 두고 변수·명령 치환 등 어떤 해석도 하지 않는다. 정답이다.
      선택지 3: 큰따옴표 안에서는 공백 분리와 파일 이름 확장은 막지만 변수 참조와 명령 치환은 해석된다.
      선택지 4: 역슬래시는 바로 뒤의 한 문자만 특수 의미를 없애므로, 둘러싼 내용 전체를 해석하지 않게 하는 기호가 아니다.

      핵심 개념:
      작은따옴표는 모든 특수 문자를 무력화하고, 큰따옴표는 변수·명령 치환과 역슬래시 일부를 허용한다.
      역슬래시는 한 문자만 이스케이프하고, 백틱은 명령 치환에 쓰인다.
    tags:
      - quoting
      - special-characters
  - id: b11-05
    type: multiple-choice
    prompt: 다음은 셸의 test 명령에서 파일의 상태 검사에 사용되는 연산자이다. 파일의 존재 여부를 확인하는 연산자는?
    choices:
      - id: '1'
        text: -e file
      - id: '2'
        text: -f file
      - id: '3'
        text: -n file
      - id: '4'
        text: -x file
    answers:
      - '1'
    explanation: |
      선택지 1: -e는 파일 종류와 관계없이 그 파일이 존재하면 참이다. 정답이다.
      선택지 2: -f는 파일이 존재하면서 정규(일반) 파일일 때만 참이므로 디렉터리 등은 거짓이 된다.
      선택지 3: -n은 문자열의 길이가 0이 아닌지 검사하는 문자열 연산자로, 파일 검사용이 아니다.
      선택지 4: -x는 파일이 존재하고 실행 권한이 있는지 검사한다.

      핵심 개념:
      `test -e file` 또는 `[ -e file ]` 형태로 if 조건에 사용한다.
      -d는 디렉터리, -r·-w·-x는 읽기·쓰기·실행 권한, -s는 크기가 0보다 큰지 검사한다.
    tags:
      - test-operators
      - file-test
  - id: b11-06
    type: multiple-choice
    prompt: BASH 셸에서 myScript라는 셸 스크립트를 디버깅 모드에서 실행하는 옵션은?
    choices:
      - id: '1'
        text: bash -d myScript
      - id: '2'
        text: bash --debug myScript
      - id: '3'
        text: bash -i myScript
      - id: '4'
        text: bash -x myScript
    answers:
      - '4'
    explanation: |
      선택지 1: bash에는 스크립트 디버깅을 위한 -d 옵션이 없다.
      선택지 2: --debug는 bash가 받아들이는 긴 옵션이지만 실행되는 명령을 추적해 보여 주지 않으므로, 옵션 없이 실행할 때와 출력이 같다(디버거 지원용 옵션은 --debugger이다).
      선택지 3: -i는 셸을 대화식(interactive) 모드로 실행하는 옵션이다.
      선택지 4: -x는 각 명령을 실행하기 전에 확장된 명령을 + 표시와 함께 출력해 실행 과정을 추적할 수 있게 한다. 정답이다.

      핵심 개념:
      bash -x 스크립트는 실행되는 명령을 하나씩 보여 주어 디버깅에 쓰인다.
      스크립트 안에서 set -x로 켜고 set +x로 끌 수도 있으며, -n은 실행 없이 문법만 검사한다.
    tags:
      - debugging
      - bash-options
  - id: b11-07
    type: multiple-choice
    prompt: 셸에서 괄호 안의 명령을 실행하여 명령의 결괏값으로 치환하라는 의미를 가진 것은?
    choices:
      - id: '1'
        text: '@(명령)'
      - id: '2'
        text: '@{명령}'
      - id: '3'
        text: \$(명령)
      - id: '4'
        text: \${명령}
    answers:
      - '3'
    explanation: |
      선택지 1: @는 셸의 명령 치환 기호가 아니다.
      선택지 2: @는 셸의 명령 치환 기호가 아니므로 중괄호를 붙여도 명령 치환이 되지 않는다.
      선택지 3: `$( )`는 괄호 안의 명령을 실행하고 그 출력으로 치환하는 명령 치환이다. 정답이다.
      선택지 4: `${ }`는 변수 이름을 감싸 값을 참조하는 변수 확장 표기로, 명령을 실행하지 않는다.

      핵심 개념:
      명령 치환은 `$(명령)` 또는 백틱으로 감싼 형태로 쓴다.
      `${변수}`는 변수 확장, `$((식))`은 산술 확장이다.
    tags:
      - command-substitution
      - shell-expansion
  - id: b12-01
    type: multiple-choice
    prompt: 깃은 무엇인가?
    choices:
      - id: '1'
        text: 버전 관리 시스템
      - id: '2'
        text: 프로그래밍 환경
      - id: '3'
        text: 프로그래밍 언어
      - id: '4'
        text: 공유 저장소 서버
    answers:
      - '1'
    explanation: |
      선택지 1: 깃은 파일의 변경 이력을 스냅숏으로 기록해 관리하는 분산 버전 관리 시스템이다. 정답이다.
      선택지 2: 깃은 코드 작성·빌드를 지원하는 통합 개발 환경이 아니다.
      선택지 3: 깃은 프로그램을 작성하는 언어가 아니다.
      선택지 4: 깃허브처럼 원격 저장소를 제공하는 서비스는 깃을 활용하는 것이며, 깃 자체는 공유 저장소 서버가 아니다.

      핵심 개념:
      깃은 리누스 토르발스가 리눅스 커널 개발을 위해 만든 분산 버전 관리 시스템이다.
      각 사용자가 전체 이력을 가진 로컬 저장소를 갖는다.
    tags:
      - git
      - version-control
  - id: b12-02
    type: multiple-choice
    prompt: 깃의 파일 상태 중 ‘수정 전(unmodified)’ 상태란?
    choices:
      - id: '1'
        text: 파일이 생성되었지만 깃으로 관리하지 않는 파일의 상태
      - id: '2'
        text: 파일 수정 작업을 커밋한 이후에 파일이 수정되지 않은 상태
      - id: '3'
        text: 파일을 생성하고 작성한 후 스테이지 영역에 올린 상태
      - id: '4'
        text: 파일을 수정하였지만 스테이지 영역에 올리지 않은 상태
    answers:
      - '2'
    explanation: |
      선택지 1: 깃이 관리하지 않는 파일은 추적되지 않는(untracked) 상태이다.
      선택지 2: 커밋된 뒤 아직 수정하지 않아 최신 커밋과 내용이 같은 파일이 수정 전(unmodified) 상태이다. 정답이다.
      선택지 3: 스테이지 영역에 올린 파일은 스테이지에 올라감(staged) 상태이다.
      선택지 4: 수정했지만 스테이지 영역에 올리지 않은 파일은 수정됨(modified) 상태이다.

      핵심 개념:
      깃의 파일 상태는 추적되지 않음(untracked), 수정 전(unmodified), 수정됨(modified), 스테이지에 올라감(staged)으로 나뉜다.
      스테이지에 올라간 파일을 커밋하면 수정 전 상태가 된다.
    tags:
      - git
      - file-status
  - id: b12-03
    type: multiple-choice
    prompt: 깃 저장소의 상태를 확인하는 명령은?
    choices:
      - id: '1'
        text: git check
      - id: '2'
        text: git status
      - id: '3'
        text: git state
      - id: '4'
        text: git log
    answers:
      - '2'
    explanation: |
      선택지 1: git check라는 명령은 없다.
      선택지 2: git status는 추적되지 않는 파일, 작업 디렉터리와 인덱스의 차이, 인덱스와 최신 커밋의 차이를 보여 준다. 정답이다.
      선택지 3: git state라는 명령은 없다.
      선택지 4: git log는 커밋 이력을 보여 주는 명령으로, 현재 파일들의 상태를 보여 주지 않는다.

      핵심 개념:
      git status는 작업 디렉터리와 스테이지 영역의 현재 상태를 요약한다.
      git status -s는 상태를 짧은 형식으로 출력한다.
    tags:
      - git-status
  - id: b12-04
    type: multiple-choice
    prompt: 깃 저장소를 만들고 초기화하는 명령은?
    choices:
      - id: '1'
        text: git config
      - id: '2'
        text: git run
      - id: '3'
        text: git init
      - id: '4'
        text: git start
    answers:
      - '3'
    explanation: |
      선택지 1: git config는 사용자 이름·이메일 같은 깃 설정을 보거나 지정하는 명령이다.
      선택지 2: git run이라는 명령은 없다.
      선택지 3: git init [directory]는 지정한 디렉터리(생략하면 현재 디렉터리)를 깃 저장소로 초기화하며, 디렉터리가 없으면 만든 뒤 초기화한다. 정답이다.
      선택지 4: git start라는 명령은 없다.

      핵심 개념:
      git init은 .git 디렉터리를 만들어 해당 디렉터리를 깃 저장소로 만든다.
      원격 저장소를 복사해 오는 경우에는 git clone을 쓴다.
    tags:
      - git-init
  - id: b12-05
    type: multiple-choice
    prompt: 스테이지 영역에 기록된 변경 내용을 깃 저장소에 커밋하는 명령은?
    choices:
      - id: '1'
        text: git commit
      - id: '2'
        text: git add
      - id: '3'
        text: git save
      - id: '4'
        text: git snapshot
    answers:
      - '1'
    explanation: |
      선택지 1: git commit은 스테이지 영역에 등록된 변경 내용을 스냅숏으로 만들어 깃 저장소에 새 버전으로 기록한다. 정답이다.
      선택지 2: git add는 작업 디렉터리의 변경 내용을 스테이지 영역에 등록하는 명령이다.
      선택지 3: git save라는 명령은 없다.
      선택지 4: git snapshot이라는 명령은 없다.

      핵심 개념:
      깃의 기본 흐름은 작업 디렉터리 수정 → git add로 스테이지 등록 → git commit으로 저장소 기록이다.
      커밋에는 -m 옵션으로 커밋 메시지를 붙인다.
    tags:
      - git-commit
  - id: b12-06
    type: multiple-choice
    prompt: 현재 디렉터리에서 모든 변경 내용을 인덱스에 등록하는 명령은?
    choices:
      - id: '1'
        text: git commit .
      - id: '2'
        text: git commit --all
      - id: '3'
        text: git push .
      - id: '4'
        text: git add .
    answers:
      - '4'
    explanation: |
      선택지 1: git commit .은 현재 디렉터리의 추적 중인 변경 파일을 바로 커밋하는 것으로, 인덱스 등록만 하는 명령이 아니다.
      선택지 2: git commit --all은 추적 중인 파일의 변경을 자동으로 스테이지에 올리면서 커밋까지 하며, 추적되지 않는 새 파일은 포함하지 않는다.
      선택지 3: git push는 로컬 커밋을 원격 저장소로 보내는 명령이다.
      선택지 4: git add .은 현재 디렉터리 아래의 모든 변경 내용(새 파일 포함)을 인덱스(스테이지 영역)에 등록한다. 정답이다.

      핵심 개념:
      인덱스는 스테이지 영역의 다른 이름이며, 커밋할 내용을 모아 두는 곳이다.
      수정된 파일은 커밋하기 전에 git add로 인덱스에 등록해야 한다.
    tags:
      - git-add
      - staging
  - id: b12-07
    type: multiple-choice
    prompt: 깃 저장소에 저장된 커밋 이력을 확인하는 명령으로, 커밋당 한 줄의 정보만 출력하는 명령은?
    choices:
      - id: '1'
        text: git status -s
      - id: '2'
        text: git log --short
      - id: '3'
        text: git log --oneline
      - id: '4'
        text: git show --oneline
    answers:
      - '3'
    explanation: |
      선택지 1: git status -s는 파일 상태를 짧게 보여 줄 뿐 커밋 이력을 출력하지 않는다.
      선택지 2: git log에는 --short라는 옵션이 없다.
      선택지 3: git log --oneline은 각 커밋을 짧은 해시와 커밋 메시지 첫 줄로 한 줄씩 출력한다. 정답이다.
      선택지 4: git show --oneline은 git show HEAD --oneline과 같아 최신 커밋 하나의 정보를 한 줄로 보이고 이전 커밋과의 변경 내용까지 출력하므로, 커밋 이력을 커밋당 한 줄로 보여 주는 명령이 아니다.

      핵심 개념:
      git log는 커밋 이력을 출력하고, --oneline은 커밋당 한 줄 형식으로 요약한다.
      git show는 특정 커밋(기본 HEAD)의 정보와 변경 내용을 보여 준다.
    tags:
      - git-log
  - id: b12-08
    type: multiple-choice
    prompt: 두 커밋 사이에 저장된 파일을 비교하는 명령은?
    choices:
      - id: '1'
        text: git diff HEAD~ HEAD
      - id: '2'
        text: git diff
      - id: '3'
        text: git diff --staged
      - id: '4'
        text: git diff file1 file2
    answers:
      - '1'
    explanation: |
      선택지 1: HEAD~(직전 커밋)와 HEAD(최신 커밋)를 지정했으므로 두 커밋에 저장된 파일의 차이를 비교한다. 정답이다.
      선택지 2: 인자 없는 git diff는 스테이지 영역을 기준으로 작업 디렉터리의 변경 내용을 비교한다.
      선택지 3: git diff --staged는 최신 커밋을 기준으로 스테이지 영역의 내용을 비교한다.
      선택지 4: 파일 이름만 주면 해당 파일들에 대해 작업 디렉터리와 스테이지 영역을 비교하며, 커밋끼리 비교하는 것이 아니다.

      핵심 개념:
      git diff 커밋1 커밋2는 두 커밋 사이의 차이를 보여 준다.
      HEAD~는 HEAD의 직전 커밋(HEAD~1)을 가리킨다.
    tags:
      - git-diff
  - id: b13-01
    type: multiple-choice
    prompt: 깃 저장소에 존재하는 기존 브랜치 이름을 나열하는 명령은?
    choices:
      - id: '1'
        text: git checkout
      - id: '2'
        text: git branch
      - id: '3'
        text: git show
      - id: '4'
        text: git list
    answers:
      - '2'
    explanation: |
      선택지 1: git checkout은 지정한 브랜치나 커밋으로 HEAD를 옮기는 명령이다.
      선택지 2: 인자 없이 git branch를 실행하면 저장소의 브랜치 목록이 출력되고 현재 브랜치에 * 표시가 붙는다. 정답이다.
      선택지 3: git show는 커밋 정보를 이전 커밋과의 비교를 포함해 자세히 출력한다.
      선택지 4: git list라는 명령은 없다.

      핵심 개념:
      git branch는 이름을 주면 브랜치를 만들고, 이름 없이 실행하면 브랜치 목록을 보여 준다.
      git branch -d는 브랜치를 삭제한다.
    tags:
      - git-branch
  - id: b13-02
    type: multiple-choice
    prompt: 커밋 이력을 그래프로 표현해 주는 명령은?
    choices:
      - id: '1'
        text: git showt --graph
      - id: '2'
        text: git log -v
      - id: '3'
        text: git log --graph
      - id: '4'
        text: git log --oneline
    answers:
      - '3'
    explanation: |
      선택지 1: git showt라는 명령은 없다.
      선택지 2: git log에는 그래프를 그리는 -v 옵션이 없다.
      선택지 3: git log --graph는 커밋 이력을 브랜치의 갈라짐과 병합이 보이는 텍스트 그래프로 출력한다. 정답이다.
      선택지 4: --oneline은 커밋당 한 줄로 요약할 뿐 그래프를 그리지 않는다.

      핵심 개념:
      git log는 현재 브랜치의 커밋 이력을 보여 준다.
      git log --all --graph를 쓰면 모든 브랜치의 이력을 그래프로 확인할 수 있다.
    tags:
      - git-log
      - branch-graph
  - id: b13-03
    type: multiple-choice
    prompt: 깃에서 사용하는 브랜치 개념이나 사용에 관한 설명으로 옳지 ==않은== 것은?
    choices:
      - id: '1'
        text: 브랜치는 독립적으로 수행되는 개발 작업의 흐름을 의미한다.
      - id: '2'
        text: 버그 수정이나 기능 추가 작업을 할 때 브랜치를 새로 만들어 작업한다.
      - id: '3'
        text: 저장소에 존재하는 분리 개발되는 특정 용도의 버전을 의미한다.
      - id: '4'
        text: 새로운 브랜치에서의 수정 작업은 기존 브랜치에도 계속 영향을 준다.
    answers:
      - '4'
    explanation: |
      선택지 1: 브랜치는 다른 작업과 독립적으로 진행되는 개발 흐름이다. 옳은 설명이다.
      선택지 2: 버그 수정이나 기능 추가는 별도 브랜치를 만들어 작업한 뒤 병합하는 것이 일반적이다. 옳은 설명이다.
      선택지 3: 브랜치는 저장소 안에서 특정 용도로 분리되어 개발되는 버전으로 볼 수 있다. 옳은 설명이다.
      선택지 4: 브랜치는 독립적인 개발 경로이므로 새 브랜치에서 커밋한 내용은 병합하기 전까지 기존 브랜치에 영향을 주지 않는다. 옳지 않은 설명이므로 정답이다.

      핵심 개념:
      브랜치는 특정 커밋을 가리키는 이동 가능한 포인터로, 독립적인 개발 경로를 만든다.
      다른 브랜치의 변경은 병합(merge)해야 반영된다.
    tags:
      - git-branch
      - branch-concept
  - id: b13-04
    type: multiple-choice
    prompt: 이미 병합된 브랜치를 삭제하는 명령은?
    choices:
      - id: '1'
        text: git delete branchName
      - id: '2'
        text: git checkout -d branchName
      - id: '3'
        text: git switcht -d branchName
      - id: '4'
        text: git branch -d branchName
    answers:
      - '4'
    explanation: |
      선택지 1: git delete라는 명령은 없다.
      선택지 2: git checkout에는 브랜치를 삭제하는 -d 옵션이 없다.
      선택지 3: git switcht라는 명령은 없으며, git switch도 브랜치를 삭제하지 않는다.
      선택지 4: git branch -d(--delete)는 병합이 끝난 브랜치를 삭제한다. 정답이다.

      핵심 개념:
      git branch -d는 병합된 브랜치만 삭제하고, 병합되지 않은 브랜치는 -D로 강제 삭제한다.
      현재 체크아웃된 브랜치는 삭제할 수 없다.
    tags:
      - git-branch
      - branch-delete
  - id: b13-05
    type: multiple-choice
    prompt: 새로운 브랜치를 생성하지만 HEAD가 이동되지 ==않는== 명령은?
    choices:
      - id: '1'
        text: git switch -c newBranchName
      - id: '2'
        text: git checkout -b newBranchName
      - id: '3'
        text: git switch --create newBranchName
      - id: '4'
        text: git branch newBranchName
    answers:
      - '4'
    explanation: |
      선택지 1: git switch -c는 새 브랜치를 만들고 그 브랜치로 HEAD를 옮긴다.
      선택지 2: git checkout -b는 새 브랜치를 만들고 그 브랜치로 HEAD를 옮긴다.
      선택지 3: --create는 -c와 같은 옵션이므로 새 브랜치를 만들고 HEAD를 옮긴다.
      선택지 4: git branch 이름은 현재 커밋을 가리키는 새 브랜치만 만들고 HEAD는 기존 브랜치에 그대로 둔다. 정답이다.

      핵심 개념:
      git branch는 브랜치 생성만, git switch·git checkout은 HEAD 이동을 담당한다.
      switch -c와 checkout -b는 생성과 이동을 한 번에 수행한다.
    tags:
      - git-branch
      - head
  - id: b13-06
    type: multiple-choice
    passageRefs:
      - guw13-p2-merge-graph-01
      - guw13-p2-merge-cmd-01
    prompt: 브랜치와 커밋 이력이 다음 그림과 같다. 아래 명령에서 수행되는 병합방식은 무엇인가?
    choices:
      - id: '1'
        text: fast-forward 병합
      - id: '2'
        text: 2-way 병합
      - id: '3'
        text: 3-way 병합
      - id: '4'
        text: cross 병합
    answers:
      - '1'
    explanation: |
      선택지 1: hotfix가 가리키는 E는 master가 가리키는 C의 자손이므로, master를 E로 앞으로 옮기기만 하면 병합이 끝나는 fast-forward 병합이 수행된다. 정답이다.
      선택지 2: 깃의 병합 방식으로 2-way 병합을 구분해 수행하지 않는다.
      선택지 3: 3-way 병합은 두 브랜치가 공통 조상에서 갈라져 각자 커밋을 가졌을 때 공통 조상과 두 끝 커밋을 비교해 새 병합 커밋을 만드는 방식으로, 이 그림에서는 master에 C 이후의 커밋이 없어 필요하지 않다.
      선택지 4: cross 병합은 깃의 병합 방식이 아니다.

      핵심 개념:
      현재 브랜치의 커밋이 병합할 브랜치의 이력에 모두 포함되어 있으면 fast-forward 병합이 되어 새 커밋 없이 포인터만 이동한다.
      두 브랜치가 갈라져 각각 커밋이 있으면 3-way 병합이 되어 병합 커밋이 생긴다.
    tags:
      - git-merge
      - fast-forward
  - id: b13-07
    type: multiple-choice
    prompt: 주어진 브랜치 또는 커밋으로 HAED를 이동시키는 명령이 ==아닌== 것은?
    choices:
      - id: '1'
        text: git merge branch
      - id: '2'
        text: git switch branch
      - id: '3'
        text: git checkout commit
      - id: '4'
        text: git checkout branch
    answers:
      - '1'
    explanation: |
      선택지 1: git merge는 지정한 브랜치를 현재 브랜치에 병합하는 명령으로, HEAD가 가리키는 브랜치를 다른 브랜치로 바꾸지 않는다. 정답이다.
      선택지 2: git switch는 지정한 브랜치로 HEAD를 옮겨 작업 브랜치를 바꾼다.
      선택지 3: git checkout에 커밋을 주면 HEAD가 그 커밋을 직접 가리키는 detached HEAD 상태가 된다.
      선택지 4: git checkout에 브랜치를 주면 HEAD가 그 브랜치를 가리키게 된다.

      핵심 개념:
      HEAD는 현재 작업 중인 브랜치(또는 커밋)를 가리키는 포인터이다.
      HEAD 이동은 git switch(브랜치)나 git checkout(브랜치·커밋)으로 한다.
    tags:
      - git-head
      - git-switch
  - id: b13-08
    type: multiple-choice
    prompt: 3-way 병합에 관한 설명으로 옳지 ==않은== 것은?
    choices:
      - id: '1'
        text: 독립적 두 브랜치를 하나로 합치는 것이다.
      - id: '2'
        text: 병합이 처리될 때 새로운 커밋은 추가되지 않는다.
      - id: '3'
        text: 충돌이 발생하면 자동 병합은 실패한다.
      - id: '4'
        text: fast-forward 병합과 마찬가지로 git merge 명령을 사용한다.
    answers:
      - '2'
    explanation: |
      선택지 1: 3-way 병합은 공통 조상에서 갈라져 각각 커밋이 쌓인 두 브랜치를 하나로 합친다. 옳은 설명이다.
      선택지 2: 3-way 병합이 성공하면 두 부모 커밋을 가진 새로운 병합 커밋이 만들어진다. 새 커밋이 추가되지 않는 것은 fast-forward 병합이다. 옳지 않은 설명이므로 정답이다.
      선택지 3: 두 브랜치가 같은 부분을 다르게 수정해 충돌이 나면 자동 병합이 멈추고 사용자가 충돌을 해결한 뒤 커밋해야 한다. 옳은 설명이다.
      선택지 4: 병합 방식은 깃이 이력에 따라 정하며, 어느 방식이든 git merge 명령으로 수행한다. 옳은 설명이다.

      핵심 개념:
      3-way 병합은 공통 조상과 두 브랜치의 최신 커밋 세 개를 비교해 합치고 병합 커밋을 만든다.
      충돌이 생기면 수동으로 해결한 뒤 git add와 git commit으로 병합을 마무리한다.
    tags:
      - git-merge
      - three-way-merge
  - id: b14-01
    type: multiple-choice
    prompt: 다른 브랜치로 이동하기 전에 변경 작업을 임시 저장하는 명령으로 옳지 ==않은== 것은?
    choices:
      - id: '1'
        text: git stash
      - id: '2'
        text: git stash save "message"
      - id: '3'
        text: git stash push
      - id: '4'
        text: git stash push "message"
    answers:
      - '4'
    explanation: |
      선택지 1: 옵션 없는 git stash는 git stash push와 같아 변경 작업을 스태시에 임시 저장한다. 옳은 명령이다.
      선택지 2: git stash save는 뒤에 오는 문자열을 메시지로 붙여 스태시에 저장한다. 옳은 명령이다.
      선택지 3: git stash push는 작업 디렉터리와 스테이지 영역의 변경을 스태시에 저장한다. 옳은 명령이다.
      선택지 4: git stash push 뒤에 -m 없이 문자열을 주면 메시지가 아니라 저장할 파일 경로(pathspec)로 해석되므로, 메시지를 붙이려면 git stash push -m "message"처럼 써야 한다. 옳지 않으므로 정답이다.

      핵심 개념:
      스태시는 커밋하지 않은 변경 작업을 임시로 보관해 두고 작업 디렉터리를 깨끗하게 만드는 기능이다.
      메시지는 git stash save "메시지" 또는 git stash push -m "메시지"로 붙인다.
    tags:
      - git-stash
  - id: b14-02
    type: multiple-choice
    prompt: 스태시 명령에서 ‘추적되지 않는 파일’도 저장하는 옵션을 사용한 것은?
    choices:
      - id: '1'
        text: git stash -a
      - id: '2'
        text: git stash -k
      - id: '3'
        text: git stash -u
      - id: '4'
        text: git stash -q
    answers:
      - '3'
    explanation: |
      선택지 1: -a(--all)는 추적되지 않는 파일뿐 아니라 .gitignore로 무시된 파일까지 모두 저장하는 옵션이다. 추적되지 않는 파일도 저장되므로 발문 조건에는 맞지만, 추적되지 않는 파일만 추가로 저장하는 전용 옵션은 아니다. ※ 줄 참고.
      선택지 2: -k(--keep-index)는 스테이지 영역의 내용을 그대로 남겨 두고 스태시하는 옵션이다.
      선택지 3: -u(--include-untracked)는 추적되지 않는 파일도 함께 스태시에 저장한다. 정답이다.
      선택지 4: -q(--quiet)는 메시지 출력을 줄이는 옵션이다.

      핵심 개념:
      기본 git stash는 추적 중인 파일의 변경만 저장한다.
      추적되지 않는 파일은 -u, 무시된 파일까지 포함하려면 -a 옵션을 쓴다.

      ※ -a(--all)도 추적되지 않는 파일을 함께 저장하므로 발문만으로는 두 선택지가 모두 해당한다. 추적되지 않는 파일을 저장하는 전용 옵션인 -u(--include-untracked)를 정답으로 한 인쇄 정답을 유지한다.
    tags:
      - git-stash
      - untracked-files
  - id: b14-03
    type: multiple-choice
    prompt: ‘git stash apply’ 명령의 기능을 정확히 설명한 것은?
    choices:
      - id: '1'
        text: 스태시에서 stash@{0}을 가져와 작업 영역에만 적용한다.
      - id: '2'
        text: 스태시에서 stash@{0}을 가져와 스테이지 영역에만 적용한다.
      - id: '3'
        text: 스태시에서 stash@{0}을 가져와 작업 영역과 스테이지 영역에 적용한다.
      - id: '4'
        text: 스태시에서 stash@{0}을 가져와 추적되지 않는 파일로 복원한다.
    answers:
      - '1'
    explanation: |
      선택지 1: git stash apply는 기본적으로 최신 항목 stash@{0}의 변경 내용을 작업 영역에만 복원하고, 스테이지에 있던 변경도 스테이지에 다시 올려 주지 않는다. 정답이다.
      선택지 2: 스테이지 영역에만 적용하는 동작은 없으며, apply는 작업 영역을 복원한다.
      선택지 3: 스테이지 영역까지 복원하려면 --index 옵션을 붙여야 한다.
      선택지 4: 복원된 파일은 원래의 추적 상태를 유지하며, 추적되지 않는 파일로 바뀌지 않는다.

      핵심 개념:
      git stash apply는 스태시 항목을 적용하되 목록에서 지우지 않고, git stash pop은 적용 후 지운다.
      --index 옵션을 주면 스테이지 영역 상태까지 복원한다.
    tags:
      - git-stash
      - stash-apply
  - id: b14-04
    type: multiple-choice
    prompt: 스태시에 저장된 항목을 불러와 작업 영역을 복원할 때, 스테이지 영역까지 복원하는 명령은?
    choices:
      - id: '1'
        text: git stash --index
      - id: '2'
        text: git stash save --keep-index
      - id: '3'
        text: git stash apply --keep-index
      - id: '4'
        text: git stash apply --index
    answers:
      - '4'
    explanation: |
      선택지 1: 하위 명령 없는 git stash는 저장(push) 동작이므로 스태시 항목을 불러오지 않는다.
      선택지 2: git stash save --keep-index는 작업 영역을 스태시에 임시 저장하면서 스테이지 영역은 그대로 남겨 두는 명령으로, 복원 명령이 아니다.
      선택지 3: --keep-index는 저장할 때 쓰는 옵션으로, apply에서 스테이지 영역을 복원하는 옵션이 아니다.
      선택지 4: git stash apply --index는 작업 영역과 함께 저장 당시의 스테이지 영역 상태까지 복원한다. 정답이다.

      핵심 개념:
      복원 시 --index는 스테이지 상태까지 되살린다.
      저장 시 --keep-index는 스테이지 영역의 내용을 스태시 후에도 남겨 둔다.
    tags:
      - git-stash
      - staging
  - id: b14-05
    type: multiple-choice
    prompt: 스태시 항목을 가져와 작업 영역에 적용하고 스태시 목록에서 제거하는 명령은?
    choices:
      - id: '1'
        text: git stash drop
      - id: '2'
        text: git stash clear
      - id: '3'
        text: git stash pop
      - id: '4'
        text: git stash push
    answers:
      - '3'
    explanation: |
      선택지 1: git stash drop은 스태시 항목을 적용하지 않고 목록에서 삭제만 한다.
      선택지 2: git stash clear는 스태시 목록의 모든 항목을 삭제한다.
      선택지 3: git stash pop은 git stash apply와 git stash drop을 함께 수행해, 항목을 적용한 뒤 목록에서 제거한다. 항목을 지정하지 않으면 stash@{0}을 쓴다. 정답이다.
      선택지 4: git stash push는 변경 작업을 스태시에 새로 저장하는 명령이다.

      핵심 개념:
      pop = apply + drop이다.
      적용 중 충돌이 나면 pop은 항목을 지우지 않고 남겨 둔다.
    tags:
      - git-stash
      - stash-pop
  - id: b14-06
    type: multiple-choice
    prompt: ‘git reset --hard HEAD’의 기능을 바르게 설명한 것은?
    choices:
      - id: '1'
        text: 마지막 커밋의 상태로 작업 영역과 스테이지 영역을 변경한다.
      - id: '2'
        text: 최신 커밋을 취소하고 그 이전 커밋으로 되돌아간다.
      - id: '3'
        text: 마지막 커밋 이후 수행했던 변경 작업을 임시 저장한다.
      - id: '4'
        text: 최신 커밋을 가리키는 HEAD를 그 이전 커밋으로 이동시킨다.
    answers:
      - '1'
    explanation: |
      선택지 1: 대상이 HEAD 자신이므로 HEAD는 그대로이고, --hard에 따라 스테이지 영역과 작업 영역이 마지막 커밋의 내용으로 맞춰진다. 커밋하지 않은 변경은 사라진다. 정답이다.
      선택지 2: 직전 커밋으로 되돌아가려면 git reset --hard HEAD~처럼 이전 커밋을 지정해야 한다.
      선택지 3: 변경 작업을 임시 저장하는 것은 git stash이며, reset --hard는 변경을 저장하지 않고 버린다.
      선택지 4: HEAD를 이전 커밋으로 옮기려면 HEAD~를 지정해야 하며, 대상이 HEAD이면 HEAD는 움직이지 않는다.

      핵심 개념:
      git reset --hard 커밋은 HEAD를 그 커밋으로 옮기고 스테이지 영역과 작업 영역을 모두 그 커밋 상태로 바꾼다.
      대상이 HEAD이면 마지막 커밋 이후의 변경만 지워져 작업 디렉터리가 깨끗해진다.
    tags:
      - git-reset
