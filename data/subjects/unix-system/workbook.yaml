      선택지 2: ln은 하드 링크를, ln -s는 심볼릭 링크를 만들어 같은 파일을 다른 이름으로 가리키게 한다. 정답이다.
      선택지 3: mv는 파일의 이름을 바꾸거나 다른 디렉터리로 옮기는 명령이다.
      선택지 4: rm은 파일을 삭제하는 명령이다.

      핵심 개념:
      하드 링크는 같은 inode를 가리키는 또 하나의 이름이고, 심볼릭 링크는 원본 경로를 담은 별도의 파일이다.
      링크를 이용하면 하나의 파일을 여러 이름(별명)으로 접근할 수 있다.
    tags:
      - link
      - ln-command
  - id: b04-08
    type: multiple-choice
    prompt: 원본 파일 a에 대한 심벌릭 파일 b를 만들 때, 올바른 설명은?
    choices:
      - id: '1'
        text: 추후 a를 삭제하면 b도 삭제된다.
      - id: '2'
        text: 추후 b를 삭제하면 a도 삭제된다.
      - id: '3'
        text: a의 링크 카운트 값이 1 증가된다.
      - id: '4'
        text: 원본 파일 a는 일반 파일 외에 디렉터리도 가능하다.
    answers:
      - '4'
    explanation: |
      선택지 1: a와 b는 별도로 존재하는 파일이므로 a를 삭제해도 b는 남는다. 다만 b가 가리키는 대상이 사라져 b는 쓸모없는 링크가 된다.
      선택지 2: 심볼릭 링크 b를 삭제해도 원본 a에는 영향이 없다.
      선택지 3: 심볼릭 링크는 새 inode를 갖는 별도의 파일이므로 a의 링크 카운트는 변하지 않는다. 링크 카운트가 증가하는 것은 하드 링크다.
      선택지 4: 디렉터리에 대한 하드 링크는 만들 수 없지만 심볼릭 링크는 만들 수 있으므로, 원본 a는 디렉터리여도 된다. 정답이다.

      핵심 개념:
      심볼릭 링크는 원본의 경로명을 내용으로 갖는 별도의 파일로, 디렉터리나 다른 파일 시스템의 파일도 가리킬 수 있다.
      하드 링크는 원본과 같은 inode를 공유하여 링크 카운트를 1 늘리며, 디렉터리와 다른 파일 시스템에는 만들 수 없다.
    tags:
      - symbolic-link
      - hard-link
  - id: b04-09
    type: multiple-choice
    passageRefs:
      - guw04-p1-ls-l-output-01
    prompt: 다음 내용에 대한 설명으로 옳지 ==않은== 것은?
    choices:
      - id: '1'
        text: 이 파일은 linux라는 사용자가 실행권한을 가지고 있다.
      - id: '2'
        text: 일반 사용자는 이 파일에 접근할 수 없다.
      - id: '3'
        text: root 사용자는 이 파일을 수정할 수 있다.
      - id: '4'
        text: 파일의 소유자는 삭제할 수 있는 권한도 있다.
    answers:
      - '1'
    explanation: |
      선택지 1: 출력의 세 번째 필드 ihd는 소유자, 네 번째 필드 linux는 그룹의 이름이다. 그룹 권한은 r--이므로 linux 그룹에 속한 사용자도 읽기 권한만 가지며 실행권한은 없다. 옳지 않은 설명이므로 정답이다.
      선택지 2: 다른 사용자(other)의 권한이 ---이므로 소유자도 linux 그룹 구성원도 아닌 일반 사용자는 이 파일에 접근할 수 없다. 옳은 설명이다.
      선택지 3: root는 파일 권한과 관계없이 모든 파일을 읽고 수정할 수 있다. 옳은 설명이다.
      선택지 4: 소유자 ihd는 rwx 권한을 가진 이 파일의 주인으로 파일을 관리할 수 있다. 실제 삭제 가능 여부는 파일이 들어 있는 디렉터리의 쓰기 권한으로 정해지지만, 일반적으로 자기 홈 디렉터리의 파일은 소유자가 삭제할 수 있다. 옳은 설명이다.

      핵심 개념:
      ls -l 출력은 파일 종류·권한, 링크 수, 소유자, 그룹, 크기, 수정 시간, 이름 순이다.
      권한 문자열 rwxr-----은 소유자 rwx, 그룹 r--, 기타 사용자 ---를 뜻한다.
      root는 권한 검사를 받지 않는다.
    tags:
      - permission
      - ls-command
  - id: b04-10
    type: multiple-choice
    prompt: 이름이 korea와 japan인 두 파일의 내용을 하나로 합쳐 이름이 asia인 파일을 만들 때 사용해야 하는 명령어는?
    choices:
