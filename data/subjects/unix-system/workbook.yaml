  - id: b09-03
    type: multiple-choice
    prompt: 셸에서 포어그라운드로 실행되는 프로세스를 stopped로 전환시키는 키입력은?
    choices:
      - id: '1'
        text: Ctrl+c
      - id: '2'
        text: Ctrl+d
      - id: '3'
        text: Ctrl+x
      - id: '4'
        text: Ctrl+z
    answers:
      - '4'
    explanation: |
      선택지 1: Ctrl+c는 포어그라운드 프로세스에 SIGINT를 보내 실행을 중단(종료)시킨다.
      선택지 2: Ctrl+d는 입력의 끝(EOF)을 알리는 키로, 셸 프롬프트에서 누르면 셸이 종료된다.
      선택지 3: Ctrl+x는 셸에서 프로세스 제어용으로 쓰이지 않는다.
      선택지 4: Ctrl+z는 포어그라운드 프로세스에 SIGTSTP를 보내 멈춤(stopped) 상태로 만든다. 이후 bg로 백그라운드에서, fg로 포어그라운드에서 다시 실행할 수 있다. 정답이다.

      핵심 개념:
      Ctrl+c는 종료(SIGINT), Ctrl+z는 일시 정지(SIGTSTP)이다.
      정지된 작업은 jobs로 확인하고 bg·fg로 실행을 재개한다.
    tags:
