    explanation: |
      선택지 1: more는 파일 내용을 화면 단위로 보여 주는 명령으로, korea, japan, asia 세 파일을 차례로 화면에 보여 줄 뿐 asia 파일을 만들지 않는다.
      선택지 2: 재지정이 두 번 있으면 마지막 재지정만 표준출력이 되므로 korea의 내용만 asia에 저장되고, japan은 내용이 지워진 빈 파일이 된다.
      선택지 3: cat korea japan은 두 파일을 연결하여 표준출력으로 내보내고, > asia가 그 출력을 asia 파일로 재지정하므로 두 파일을 합친 asia가 만들어진다. 정답이다.
      선택지 4: 재지정 없이 세 파일을 인자로 주면 korea, japan, asia의 내용을 화면에 차례로 출력할 뿐이며, asia가 없으면 오류가 난다.

      핵심 개념:
      cat은 인자로 받은 파일들을 순서대로 연결(concatenate)하여 표준출력으로 보낸다.
      cat 파일1 파일2 > 새파일 형식으로 여러 파일을 하나로 합친다.
    tags:
