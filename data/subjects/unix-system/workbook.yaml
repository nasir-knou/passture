      선택지 2: 문맥 교환 때 프로그램 카운터와 레지스터 값을 PCB에 저장했다가 다시 실행할 때 복원한다. 옳은 설명이다.
      선택지 3: PCB에는 열린 파일, 할당된 메모리 등 프로세스가 가진 자원 정보가 기록된다. 옳은 설명이다.
      선택지 4: PCB는 커널이 관리하는 자료구조로 커널 영역에 놓이며, 프로세스 자신의 메모리 영역 앞부분에 있지 않다. 옳지 않은 설명이므로 정답이다.

      핵심 개념:
      PCB는 커널이 프로세스마다 하나씩 두는 자료구조로, PID·상태·레지스터 값·스케줄링 정보·자원 정보를 담는다.
