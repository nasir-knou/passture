    choices:
      - id: '1'
        text: 의존성 문제로 패키지를 설치할 수 없다.
      - id: '2'
        text: 의존성 문제로 패키지를 삭제할 수 없다.
      - id: '3'
        text: 의존성 문제로 패키지를 업데이트할 수 없다.
      - id: '4'
        text: 패키지가 삭제되었으나 기존 패키지에 의존성 문제가 발생한다.
    answers:
      - '2'
    explanation: |
      선택지 1: rpm -e는 설치가 아니라 삭제 옵션이므로 설치 실패를 나타내는 결과가 아니다.
      선택지 2: tkmc 패키지가 mc를 필요로 하므로, mc를 지우려는 rpm -e가 의존성 오류를 내고 삭제를 진행하지 않았다. 정답이다.
      선택지 3: 업데이트는 rpm -U 등으로 하며, 이 명령은 삭제를 시도한 것이다.
      선택지 4: rpm은 의존성 검사에 실패하면 작업을 진행하지 않으므로 mc는 삭제되지 않은 상태로 남는다.

      핵심 개념:
      rpm -e는 패키지를 삭제하는 옵션이다.
      다른 설치된 패키지가 필요로 하는 패키지는 의존성 오류(Failed dependencies)로 삭제가 거부된다.
      의존하는 패키지를 먼저 지우거나 dnf remove로 함께 제거해야 한다.
    tags:
      - rpm
      - dependency
  - id: b10-04
    type: multiple-choice
    prompt: RPM과 비교했을 때, DNF를 이용한 패키지 관리의 장점은?
    choices:
      - id: '1'
        text: 이미 설치된 패키지를 업그레이드할 수 있다.
      - id: '2'
        text: 패키지의 변형 여부를 검증할 수 있다.
      - id: '3'
        text: 패키지의 설정 파일을 확인할 수 있다.
      - id: '4'
        text: 패키지의 의존성 문제를 해결할 수 있다.
    answers:
      - '4'
    explanation: |
      선택지 1: 설치된 패키지의 업그레이드는 rpm -U로도 할 수 있으므로 DNF만의 장점이 아니다.
      선택지 2: 패키지 파일의 변형 여부 검증은 rpm -V로 할 수 있는 RPM의 기능이다.
      선택지 3: 패키지의 설정 파일 확인은 rpm -qc로 할 수 있는 RPM의 기능이다.
      선택지 4: DNF는 저장소에서 필요한 선행 패키지를 찾아 자동으로 함께 설치·제거해 의존성 문제를 해결해 준다. RPM에는 없는 장점이므로 정답이다.

      핵심 개념:
      RPM은 개별 패키지 파일을 설치·조회·검증하는 저수준 도구이고, 의존성 문제를 직접 해결하지 않는다.
      DNF는 저장소 기반의 고수준 패키지 관리 도구로, 의존성을 자동으로 계산해 처리한다.
    tags:
      - dnf
      - dependency
  - id: b10-05
    type: multiple-choice
    prompt: RPM 패키지 관리자의 기능을 설명한 것으로 옳지 ==않은== 것은?
    choices:
      - id: '1'
        text: 패키지의 설치와 업그레이드 및 삭제 기능을 수행한다.
      - id: '2'
        text: 패키지에 관한 정보 확인 기능을 제공한다.
      - id: '3'
        text: 패키지의 의존성과 관련된 검사를 수행한다.
      - id: '4'
        text: 패키지를 설치할 때, 선행 패키지를 자동으로 설치해 준다.
    answers:
      - '4'
    explanation: |
      선택지 1: rpm은 -i(설치), -U(업그레이드), -e(삭제) 옵션을 제공한다. 옳은 설명이다.
      선택지 2: rpm -q 계열 옵션(-qi, -ql 등)으로 패키지 정보를 확인할 수 있다. 옳은 설명이다.
      선택지 3: rpm은 설치·삭제 전에 의존성을 검사해 문제가 있으면 오류를 출력한다. 옳은 설명이다.
      선택지 4: rpm은 의존성을 검사만 할 뿐, 선행 패키지가 없으면 메시지를 출력하고 설치를 멈춘다. 선행 패키지를 자동으로 설치하는 것은 DNF이다. 옳지 않은 설명이므로 정답이다.

      핵심 개념:
      RPM은 설치·업그레이드·삭제·조회·검증 기능과 의존성 검사 기능을 갖는다.
      의존성 해결(선행 패키지 자동 설치)은 DNF·YUM 같은 상위 도구가 맡는다.
    tags:
      - rpm
      - package-manager
  - id: b10-06
    type: multiple-choice
    prompt: 시스템에 센드메일(sendmail) 패키지가 설치되었는지 확인하는 명령은?
    choices:
      - id: '1'
        text: rpm -qa < grep sendmail
      - id: '2'
        text: rpm -i sendmail
      - id: '3'
        text: dnf list --installed | grep sendmail
      - id: '4'
        text: dnf list --available | grep sendmail
    answers:
      - '4'
    explanation: |
      선택지 1: <는 입력 재지정이므로 grep이라는 파일을 rpm의 입력으로 쓰려는 잘못된 명령이다. rpm -qa | grep sendmail처럼 파이프를 써야 한다.
      선택지 2: rpm -i는 패키지 파일을 설치하는 옵션으로, 설치 여부를 확인하는 명령이 아니다.
      선택지 3: dnf list --installed는 설치된 패키지 목록을 한 줄씩 출력하므로 grep sendmail로 걸러 설치 여부를 확인할 수 있다. 설치 여부를 확인하는 올바른 명령이다.
      선택지 4: dnf list --available은 저장소에 있지만 아직 설치되지 않은 패키지 목록을 출력하므로, 설치 여부 확인과는 반대의 정보를 준다. ※ 줄 참고.

      핵심 개념:
      설치된 패키지 확인은 rpm -qa | grep 이름 또는 dnf list --installed | grep 이름으로 한다.
      dnf list --available은 설치 가능한(미설치) 패키지를 보여 준다.

      ※ 인쇄 정답은 '`dnf list --available | grep sendmail`'이지만, 설치 여부를 확인하는 명령은 '`dnf list --installed | grep sendmail`'이다(원본 해설도 --installed를 설명한다). 인쇄 정답을 유지한다.
    tags:
      - dnf
      - package-query
  - id: b10-07
    type: multiple-choice
    prompt: 두 파일을 각각 압축한 후 연결하여, 압축된 하나의 파일을 만드는 명령이 필요하다. 적당하지 ==않은== 것은?
    choices:
      - id: '1'
        text: gzip file1 file2 > bar.gz
      - id: '2'
        text: gzip -c file1 > bar.gz; gzip -c file2 >> bar.gz
      - id: '3'
        text: gzip -c file1 file2 > baz.gz
      - id: '4'
        text: cat file1 file2 | gzip > baz.gz
    answers:
      - '1'
    explanation: |
      선택지 1: -c 없이 실행한 gzip은 file1과 file2를 각각 file1.gz, file2.gz로 바꿔 저장할 뿐 표준출력으로 아무것도 내보내지 않으므로, 재지정된 bar.gz는 빈 파일이 된다. 적당하지 않으므로 정답이다.
      선택지 2: gzip -c는 원본을 그대로 두고 압축 결과를 표준출력으로 내보내므로, 첫 결과를 bar.gz에 쓰고 두 번째 결과를 >>로 덧붙여 하나의 압축 파일이 된다.
      선택지 3: gzip -c에 두 파일을 주면 각 파일의 압축 결과가 차례로 표준출력에 나오므로 baz.gz 하나에 연결되어 저장된다.
      선택지 4: cat으로 두 파일을 이어 붙인 내용을 파이프로 gzip에 넘겨 압축하므로 baz.gz 하나가 만들어진다.

      핵심 개념:
      gzip은 기본적으로 원본 파일을 .gz 파일로 대체하고, -c 옵션을 주면 원본을 두고 결과를 표준출력으로 보낸다.
      여러 gzip 압축 결과를 이어 붙인 파일도 gunzip으로 풀면 원래 내용이 차례로 연결되어 나온다.
    tags:
      - gzip
      - compression
  - id: b10-08
    type: multiple-choice
    prompt: tar 파일로 묶여 있는 sensor.tar 아카이브에서 파일 목록을 보고자 할 때 사용하는 것은?
    choices:
      - id: '1'
        text: tar cvf sensor.tar
      - id: '2'
        text: tar xvf sensor.tar
      - id: '3'
        text: tar tvf sensor.tar
      - id: '4'
        text: tar rvf sensor.tar
    answers:
      - '3'
    explanation: |
      선택지 1: c 옵션은 새 아카이브를 만드는 옵션으로, 파일 목록을 보는 기능이 아니다. 묶을 파일을 주지 않은 이 명령은 빈 아카이브를 만들 수 없다는 오류로 끝나고, 파일을 함께 주면 sensor.tar를 새로 만들어 덮어쓴다.
      선택지 2: x 옵션은 아카이브에서 파일을 추출(풀기)한다.
      선택지 3: t 옵션은 아카이브에 들어 있는 파일 목록을 출력하며, v를 함께 쓰면 자세한 정보까지 보여 준다. 정답이다.
      선택지 4: r 옵션은 기존 아카이브 끝에 파일을 추가한다.

      핵심 개념:
      tar의 주요 기능 옵션은 c(생성), x(추출), t(목록), r(추가)이다.
      v는 처리 과정을 자세히 출력하고, f는 아카이브 파일 이름을 지정한다.
    tags:
      - tar
      - archive
  - id: b10-09
    type: multiple-choice
    prompt: gzip 명령어에서 압축률을 높이기 위한 옵션은?
    choices:
      - id: '1'
        text: -h
      - id: '2'
        text: '-9'
      - id: '3'
        text: -t
      - id: '4'
        text: '-1'
    answers:
      - '2'
    explanation: |
      선택지 1: -h는 도움말을 출력하는 옵션이다.
      선택지 2: -9는 가장 높은 압축률(--best)로 압축하는 옵션이다. 압축 속도는 느려진다. 정답이다.
      선택지 3: -t는 압축 파일이 손상되지 않았는지 검사하는 옵션이다.
      선택지 4: -1은 압축률이 가장 낮은 대신 가장 빠르게 압축하는 옵션(--fast)이다.

      핵심 개념:
      gzip의 -숫자(1~9) 옵션은 압축 수준을 정하며, 숫자가 클수록 압축률이 높고 느리다.
      기본 압축 수준은 6이다.
    tags:
      - gzip
      - compression-level
  - id: b11-01
    type: multiple-choice
    prompt: 셸 스크립트를 /bin/bash가 해석한다는 의미로, 셸 스크립트 파일의 첫 행에 지정해야 하는 내용은?
    choices:
      - id: '1'
        text: '!#/bin/bash'
      - id: '2'
        text: '#!/bin/bash'
      - id: '3'
        text: \$#/bin/bash
      - id: '4'
        text: '#\$/bin/bash'
    answers:
      - '2'
    explanation: |
      선택지 1: 기호 순서가 뒤바뀌어 셔뱅으로 인식되지 않는다.
      선택지 2: 첫 행의 #!(셔뱅) 뒤에 해석기 경로를 적으면 커널이 그 프로그램(/bin/bash)으로 스크립트를 실행한다. 정답이다.
      선택지 3: `$#`은 셸에서 위치 매개변수의 개수를 뜻하는 특수 변수일 뿐, 해석기 지정 표기가 아니다.
      선택지 4: #으로 시작하므로 주석으로 처리될 뿐 해석기를 지정하지 못한다.

      핵심 개념:
      셔뱅(#!)은 스크립트 첫 행에서 실행할 해석기의 절대 경로를 지정한다.
      첫 행이 아닌 곳의 #은 주석으로 처리된다.
    tags:
      - shebang
      - shell-script
  - id: b11-02
    type: multiple-choice
    prompt: 다음 중 셸 스크립트에서 첫 번째 명령 행 인수를 뜻하는 것은?
    choices:
      - id: '1'
        text: \$[1]
      - id: '2'
        text: \${1}
      - id: '3'
        text: '%[1]'
      - id: '4'
        text: '%{1}'
    answers:
      - '2'
    explanation: |
      선택지 1: `$[ ]`는 bash의 옛 산술 확장 문법이라 `$[1]`은 숫자 1로 계산될 뿐 인수를 가리키지 않는다.
      선택지 2: `${1}`은 `$1`과 같이 첫 번째 명령 행 인수(위치 매개변수)를 뜻한다. 중괄호로 묶으면 바로 뒤에 오는 문자와 변수 이름을 구분할 수 있다. 정답이다.
      선택지 3: %는 셸에서 변수 참조 기호가 아니다.
      선택지 4: %는 셸에서 변수 참조 기호가 아니므로 중괄호를 붙여도 인수를 뜻하지 않는다.

      핵심 개념:
      위치 매개변수 `$1`, `$2`, …는 명령 행 인수를 차례로 가리키며, 10번째부터는 `${10}`처럼 중괄호가 필요하다.
      `$0`은 스크립트 이름, `$#`은 인수 개수, `$@`·`$*`는 모든 인수이다.
    tags:
      - positional-parameters
      - shell-variables
  - id: b11-03
    type: multiple-choice
    passageRefs:
      - guw11-p2-for-sum-01
    prompt: 다음 셸 스크립트를 실행하였을 때의 출력은?
    choices:
      - id: '1'
        text: 출력 내용 없음
      - id: '2'
        text: '10'
      - id: '3'
        text: '25'
      - id: '4'
        text: '45'
    answers:
      - '3'
    explanation: |
      선택지 1: 마지막 줄의 echo가 변수 a의 값을 출력하므로 출력 내용이 없을 수 없다.
      선택지 2: 10은 반복 조건의 상한일 뿐이며, 1부터 2씩 증가한 n들의 합이 아니다.
      선택지 3: n은 1, 3, 5, 7, 9 순으로 바뀌고 11이 되면 반복이 끝나므로 a=1+3+5+7+9=25가 출력된다. 정답이다.
      선택지 4: 45는 1부터 9까지 모든 정수의 합으로, n이 2씩 증가하는 것을 무시한 값이다.

      핵심 개념:
      bash의 `for ((초기식; 조건식; 증감식))`은 C 언어 형식의 반복문이다.
      `$( 명령 )`은 명령 치환으로, expr의 계산 결과가 변수에 저장된다.
    tags:
      - for-loop
      - expr
