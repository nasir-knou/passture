  - id: b14-08
    type: multiple-choice
    prompt: reset과 revert 기능 중에서 reset 기능에 관한 것은?
    choices:
      - id: '1'
        text: 새로운 커밋이 생성된다.
      - id: '2'
        text: 취소된 커밋이 커밋 이력에 남아 있다.
      - id: '3'
        text: 작업 폴더가 깨끗한 상태라야 실행이 가능하다.
      - id: '4'
        text: --mixed, --hard, --soft의 세 가지 모드가 있다.
    answers:
      - '4'
    explanation: |
      선택지 1: 취소 내용을 담은 새 커밋을 만드는 것은 revert이다. reset은 새 커밋을 만들지 않고 HEAD를 옮긴다.
      선택지 2: 취소한 커밋이 이력에 그대로 남는 것은 revert이다. reset은 HEAD를 이전 커밋으로 옮겨 이후 커밋이 이력에서 보이지 않게 된다.
      선택지 3: 커밋하지 않은 변경이 있으면 실행이 막히는 것은 revert이다(스테이지에 올린 변경이 있거나 되돌릴 파일이 수정되어 있으면 중단된다). reset은 변경이 있어도 실행되며, --hard면 그 변경을 지운다.
      선택지 4: reset에는 HEAD만 옮기는 --soft, HEAD와 스테이지 영역을 되돌리는 --mixed(기본), 작업 영역까지 되돌리는 --hard의 세 모드가 있다. 정답이다.

      핵심 개념:
      reset은 HEAD(브랜치)를 과거 커밋으로 옮겨 이력을 되돌리고, revert는 되돌리는 내용의 새 커밋을 추가해 이력을 보존한다.
      공유된 브랜치에서는 이력을 바꾸지 않는 revert가 안전하다.
    tags:
      - git-reset
      - git-revert
