    explanation: |
      선택지 1: 분·시가 모두 *이므로 월요일 하루 동안 매분(1,440번) 명령을 수행한다.
      선택지 2: 분은 1, 시는 *이므로 월요일의 매시 1분마다(24번) 명령을 수행한다.
      선택지 3: 1분, 1시, 일·월은 상관없이(*), 요일이 1(월요일)이므로 매주 월요일 1시 1분에 한 번만 수행한다. 정답이다.
      선택지 4: 일 필드가 1이고 요일 필드도 1이면 cron은 두 조건 중 하나만 맞아도 실행하므로, 매월 1일과 매주 월요일의 1시 1분에 수행되어 월요일에 한 번만 수행하는 것이 아니다.

