  - id: b09-05
    type: multiple-choice
    prompt: 터미널을 빠져나가도 실행 중인 프로그램이 종료되지 않고 계속 수행되게 해 주는 명령어는?
    choices:
      - id: '1'
        text: exec
      - id: '2'
        text: fg
      - id: '3'
        text: nice
      - id: '4'
        text: nohup
    answers:
      - '4'
    explanation: |
      선택지 1: exec는 현재 셸 프로세스를 지정한 명령으로 대체해 실행하는 명령이다.
      선택지 2: fg는 백그라운드나 정지 상태의 작업을 포어그라운드로 가져오는 명령이다.
      선택지 3: nice는 우선순위(nice 값)를 지정해 명령을 실행하는 명령이다.
      선택지 4: nohup은 명령이 SIGHUP(행업 시그널)을 무시하게 해 터미널을 닫거나 로그아웃해도 계속 실행되게 한다. 정답이다.

      핵심 개념:
      터미널이 끊기면 그 터미널에서 실행된 프로세스에 SIGHUP이 전달되어 보통 종료된다.
      nohup 명령 & 형태로 실행하면 로그아웃 후에도 작업이 계속되고, 출력은 기본적으로 nohup.out에 저장된다.
