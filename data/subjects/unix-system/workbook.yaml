  - id: b09-04
    type: multiple-choice
    prompt: 백그라운드 프로세스에 관한 설명으로 옳지 ==않은== 것은?
    choices:
      - id: '1'
        text: 셸 프롬프트에서 명령 뒤에 &를 입력하면 백그라운드 프로세스로 실행된다.
