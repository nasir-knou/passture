      선택지 2: cat에는 한 화면의 줄 수를 지정하는 옵션이 없으며, 내용을 끊지 않고 모두 출력한다.
      선택지 3: more의 +숫자 옵션은 해당 줄부터 보여 주라는 뜻으로, 20번째 줄부터 출력할 뿐 한 화면의 줄 수를 20으로 정하지 않는다.
      선택지 4: more의 -숫자 옵션은 한 화면에 보여 줄 줄 수를 지정하므로, 스페이스 바를 누를 때마다 20줄씩 보여 준다. 정답이다.

      핵심 개념:
      more는 파일 내용을 화면 단위로 끊어 보여 주며, 스페이스 바는 다음 화면, Enter는 다음 줄, q는 종료다.
      more -숫자는 화면당 줄 수, more +숫자는 시작 줄 번호를 지정한다.
