    explanation: |
      선택지 1: ps는 실행 중인 프로세스의 PID, 상태, 터미널, 명령 등을 출력한다. 옳은 설명이다.
      선택지 2: top은 프로세스의 CPU·메모리 사용 현황을 주기적으로 갱신해 보여 주며, 실행 중에 kill·renice 같은 관리도 할 수 있는 대화식 도구이다. 옳은 설명이다.
      선택지 3: kill은 지정한 프로세스에 시그널을 보내는 명령으로, 기본은 SIGTERM을 보내 종료를 요청한다. 백그라운드로 전환하는 것은 bg이다. 옳지 않은 설명이므로 정답이다.
      선택지 4: nice는 명령을 실행할 때 nice 값을 지정해 우선순위를 정한다. 옳은 설명이다.

      핵심 개념:
      ps·top은 프로세스 상태를 확인하고, kill은 시그널(SIGTERM, SIGKILL 등)을 보낸다.
      nice는 실행 시 우선순위를, renice는 실행 중인 프로세스의 우선순위를 바꾼다.
