      선택지 2: 논리 드라이브는 확장 파티션 안에 만든 파티션을 가리키는 말로, 하드디스크를 나눈 구역 전체를 부르는 일반적인 용어가 아니다.
      선택지 3: 섹터는 디스크에 데이터를 읽고 쓰는 최소 물리 단위로, 논리적으로 나눈 구역이 아니다.
      선택지 4: 파티션은 하나의 하드디스크를 논리적으로 나눈 구역이다. 정답이다.

      핵심 개념:
      하나의 물리 디스크를 여러 파티션으로 나누면 각 파티션을 별도의 디스크처럼 사용할 수 있다.
      각 파티션에 파일 시스템을 만들고 디렉터리에 마운트하여 사용한다.
    tags:
