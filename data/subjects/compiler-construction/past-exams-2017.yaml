passages:
  - id: g17-language-01
    type: text
    body: |
      <설명>
      IF A=B THEN C:=D ELSE E:=D 의 문장에 대해서 ( ‘가’ )는 IF, A, =, B, … 등의 단어들을 표현하는 것이고 ( ‘나’ )는 전체문장이 IF - THEN - ELSE 문장이라는 것을 표현하는 것이다. 따라서 ( ‘나’ )는 ( ‘가’ ) 보다 표현 범위가 넓어서 이것을 인식하는 오토마타를 구현하는 일도 훨씬 어렵다.

  - id: g17-grammar-01
    type: code
    language: text
    body: |
      (단, S는 시작기호이다.)
      1) S → bAS
      2) S → c
      3) A → SS
      4) A → a

  - id: g17-ambiguous-01
    type: code
    language: text
    body: |
      E → E + E | E * E | id

  - id: g17-useless-01
    type: code
    language: text
    body: |
      P : S → aS | A
          A → bB
          B → c
          C → f

  - id: g17-epsilon-01
    type: code
    language: text
    body: |
      P : S → aSb | bSa | ε
      ⟹ P′는
          S′ → S | ε
          S → (   ) | (   ) | (   ) | (   ) 이다.

