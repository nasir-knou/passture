      - { id: '3', text: 'r4' }
      - { id: '4', text: 'r5' }
    answers: ['1']
    explanation: |
      선택지 1: I₂ = {[E → T·], [T → T·*F]}의 완료 항목 E → T는 2번 규칙이고, +는 FOLLOW(E)에 속하므로 ACTION[2, +] = r2이다.
      선택지 2: r3(T → T*F)은 I₁₀에서 나타난다.
      선택지 3: r4(T → F)는 I₃에서 나타난다.
      선택지 4: r5(F → (E))는 I₁₁에서 나타난다.

      핵심 개념:
      SLR에서 완료 항목 [A → α·]는 FOLLOW(A)의 모든 터미널에 reduce를 넣는다.
      reduce 번호는 증가문법의 규칙 번호이다.
      FOLLOW(E) = { +, ), \$ }이므로 I₂의 +, ), 끝 표시 칸이 r2가 된다.
