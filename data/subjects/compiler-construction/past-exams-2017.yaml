  - id: e17-26
    type: multiple-choice
    chapter: 5
    passageRefs: [g17-clr-graph-01, g17-clr-table-01]
    prompt: 빈칸 ‘나’에 알맞은 것은?
    choices:
      - { id: '1', text: '3' }
      - { id: '2', text: '5' }
      - { id: '3', text: '6' }
      - { id: '4', text: '8' }
    answers: ['4']
    explanation: |
      선택지 1: 3은 I3에서 c를 읽을 때의 shift 대상 상태이다.
      선택지 2: 5는 GOTO[2, C]이다.
      선택지 3: 6은 I2, I6에서 c를 읽을 때의 shift 대상 상태이다.
      선택지 4: I3 = {[C → c·C, c/d], …}에서 C로 전이하면 I8 = {[C → cC·, c/d]}로 가므로 GOTO[3, C] = 8이다.

      핵심 개념:
      GOTO 함수는 비단말 간선의 목적 상태이다.
      I3과 I6은 핵심 항목이 같지만 lookahead가 달라 C 전이 대상도 I8, I9로 다르다.
      이렇게 lookahead로 상태를 나누는 것이 CLR(Canonical LR)의 특징이다.
      LALR은 핵심이 같은 상태를 합쳐 상태 수를 줄인다.
    tags: [clr-parsing-table, goto-function]

  - id: e17-27
    type: multiple-choice
    chapter: 5
    passageRefs: [g17-clr-graph-01, g17-clr-table-01]
    prompt: 빈칸 ‘다’에 알맞은 것은?
    choices:
      - { id: '1', text: 'S3' }
      - { id: '2', text: 'S4' }
      - { id: '3', text: 'r2' }
      - { id: '4', text: 'r3' }
    answers: ['3']
    explanation: |
      선택지 1: 상태 8은 완료 항목만 가져 shift 동작이 없다.
      선택지 2: S4 역시 shift 동작이므로 상태 8에 들어가지 않는다.
      선택지 3: I8 = {[C → cC·, c/d]}는 lookahead c, d에서 C → cC(2번 규칙)로 환원하므로 ACTION[8, c] = r2이다.
      선택지 4: r3(C → d)은 [C → d·]가 있는 I4, I7의 동작이다.

      핵심 개념:
      CLR의 완료 항목 [A → α·, a]는 lookahead a 칸에 reduce를 넣는다.
      I8의 lookahead는 c/d, I9의 lookahead는 \$이다.
      그래서 같은 C → cC라도 상태 8은 c, d 칸, 상태 9는 끝 표시 칸에 r2가 있다.
