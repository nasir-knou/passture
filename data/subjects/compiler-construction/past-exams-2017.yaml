      - { id: '4', text: '(라)' }
    answers: ['1']
    explanation: |
      선택지 1: I₃ = GOTO(I₀, F)는 [T → ·F]의 점을 F 뒤로 옮긴 {[T → F·]}이다.
      선택지 2: (나)는 GOTO(I₀, E)이다.
      선택지 3: (다)는 GOTO(I₀, T)이다.
      선택지 4: (라)는 I₀이다.

      핵심 개념:
      I₃는 완료 항목 하나만 가지므로 FOLLOW(T)의 입력에서 T → F로 환원한다.
      I₀에서 점 뒤가 F인 항목은 [T → ·F] 하나뿐이다.
      완료 항목만 있는 상태는 shift 동작이 없다.
