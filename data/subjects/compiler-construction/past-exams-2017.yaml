    tags: [slr-parsing-table, goto-function]

  - id: e17-25
    type: multiple-choice
    chapter: 5
    passageRefs: [g17-clr-graph-01, g17-clr-table-01]
    prompt: 다음은 CLR 그래프를 이용하여 파싱표를 구성하는 과정이다. 빈칸 ‘가’에 알맞은 것은?
    choices:
      - { id: '1', text: 'S3' }
