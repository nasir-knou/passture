  - id: e17-32
    type: multiple-choice
    chapter: 5
    passageRefs: [g17-ll-01, g17-ll-table-01]
    prompt: 다음은 Top-Down 구문분석에서 predictive 파싱표를 구성하는 과정이다. FIRST(T′) = {*, ε}이다. 따라서 빈 칸 ‘가’에 알맞은 것은?
    choices:
      - { id: '1', text: 'E′ → ε' }
      - { id: '2', text: 'E′ → +TE′' }
      - { id: '3', text: 'T′ → ε' }
      - { id: '4', text: 'T′ → *FT′' }
    answers: ['4']
    explanation: |
      선택지 1: E′ → ε는 E′ 행의 ), 끝 표시 칸에 들어가는 규칙이다.
      선택지 2: E′ → +TE′는 E′ 행의 + 칸에 들어가는 규칙이다.
      선택지 3: T′ → ε는 FOLLOW(T′) = { +, ), \$ } 칸에 들어가며, *는 FOLLOW(T′)에 없다.
      선택지 4: FIRST(*FT′) = {*}이므로 [T′, *] 칸에는 T′ → *FT′가 들어간다.

      핵심 개념:
      예측 파싱표에서 A → α는 FIRST(α)의 각 터미널 칸에 넣는다.
      α가 ε이면 FOLLOW(A)의 각 터미널 칸에 넣는다.
      FIRST(T′) = {*, ε}의 *는 T′ → *FT′, ε은 T′ → ε에서 나온 것이다.
      한 칸에 규칙이 하나씩이면 LL(1)(Left-to-right, Leftmost derivation) 문법이다.
    tags: [predictive-parsing, ll1-parsing-table]

  - id: e17-33
    type: multiple-choice
    chapter: 5
    passageRefs: [g17-yacc-01]
    prompt: 다음 그림에서 빈칸의 A, B에 들어갈 내용으로 알맞은 것은?
    choices:
      - { id: '1', text: 'A: 어휘분석기, B: YACC' }
      - { id: '2', text: 'A: YACC, B: 어휘분석기' }
      - { id: '3', text: 'A: 원시코드, B: YACC' }
      - { id: '4', text: 'A: 어휘분석기, B: LALRGen' }
    answers: ['2']
    explanation: |
      선택지 1: 순서가 반대이다. 문법규칙과 수행코드를 받아 구문분석기를 만드는 것이 YACC이고, 원시 프로그램에서 토큰을 만드는 것이 어휘분석기이다.
      선택지 2: A는 문법규칙과 수행코드로 구문분석기를 생성하는 YACC(Yet Another Compiler-Compiler), B는 원시 프로그램을 읽어 토큰을 넘겨주는 어휘분석기이다.
      선택지 3: 원시코드는 어휘분석기의 입력이며 구문분석기를 생성하지 않는다.
      선택지 4: A 자리에 어휘분석기가 올 수 없고, LALRGen은 토큰을 만드는 도구가 아니다.

      핵심 개념:
      YACC은 문법규칙과 수행코드를 입력받아 LALR(1) 구문분석기를 생성한다.
      생성된 구문분석기는 어휘분석기가 넘겨준 토큰을 받아 분석하고 수행코드를 실행한다.
      어휘분석기는 보통 Lex나 FLEX로 생성한다.
      Lex + YACC 조합으로 컴파일러 앞단을 빠르게 만들 수 있다.
    tags: [yacc, lexical-analyzer]

  - id: e17-34
    type: multiple-choice
    chapter: 6
    prompt: 기호표의 구성 방법 중 가장 효율적인 방법은?
    choices:
      - { id: '1', text: '해시(hash)표' }
      - { id: '2', text: '선형리스트' }
      - { id: '3', text: '배열' }
      - { id: '4', text: 'Tree' }
    answers: ['1']
    explanation: |
      선택지 1: 해시표는 식별자 이름을 해시 함수로 바로 버킷 위치에 대응시키므로 평균 O(1)에 가까운 시간에 삽입·검색할 수 있어 가장 효율적이다.
      선택지 2: 선형리스트는 구현이 간단하지만 검색할 때 처음부터 차례로 비교해야 해 식별자가 많으면 느리다.
      선택지 3: 배열도 순차 검색이나 정렬 유지가 필요해 삽입·검색 비용이 크다.
      선택지 4: Tree(이진 탐색 트리)는 평균 O(log n) 검색이 가능하지만 해시표보다 느리고 한쪽으로 치우치면 성능이 떨어진다.

      핵심 개념:
      기호표는 컴파일 중 식별자를 자주 삽입하고 검색하므로 연산 속도가 중요하다.
      구성 방법으로 선형리스트, 트리, 해시표 등이 있다.
      해시표는 충돌 처리(체이닝 등)만 잘 하면 가장 빠른 방법이다.
      블록 구조 언어에서는 레벨 정보와 함께 관리한다.
    tags: [symbol-table, hash-table]

  - id: e17-35
    type: multiple-choice
    chapter: 7
    passageRefs: [g17-intermediate-01]
    prompt: 산술식 S := E * 3.14 + C / E 에 대한 중간코드를 다음과 같이 표현한다면 다음 중 어떤 방법인가?
    choices:
      - { id: '1', text: '후위표현' }
      - { id: '2', text: 'triple 표현' }
      - { id: '3', text: '간접 triple 표현' }
      - { id: '4', text: 'quadruple 표현' }
    answers: ['4']
    explanation: |
      선택지 1: 후위표현은 S E 3.14 * C E / + := 처럼 연산자를 피연산자 뒤에 두는 방식이다.
      선택지 2: triple 표현은 (op, arg1, arg2) 세 필드만 쓰고 결과는 명령 번호로 참조한다.
      선택지 3: 간접 triple 표현은 triple을 가리키는 포인터 목록으로 실행 순서를 나타낸다.
      선택지 4: (op, 피연산자 1, 피연산자 2, 결과)의 네 필드를 쓰고 결과를 T₀, T₁, T₂, S로 명시하므로 quadruple 표현이다.

      핵심 개념:
      quadruple은 연산자, 두 피연산자, 결과의 네 필드로 3 주소 코드를 표현한다.
      결과를 임시변수로 명시하므로 코드 이동이 쉬워 최적화에 유리하다.
      대입처럼 피연산자가 하나인 경우 빈 필드는 Φ로 표시한다.
      triple은 기억공간을 줄이고, 간접 triple은 재배치를 쉽게 한다.
    tags: [three-address-code, quadruple]
