    tags: [clr-parsing-table, lr1-items]

  - id: e17-28
    type: multiple-choice
    chapter: 5
    passageRefs: [g17-clr-table-01, g17-clr-trace-01]
    prompt: 계속해서 앞에서 구해진 CLR 파싱표를 이용하여 문장 cdcd를 구문분석하는 과정이다. 빈칸 ‘가’에 알맞은 것은?
    choices:
      - { id: '1', text: 'shift 6' }
      - { id: '2', text: 'shift 7' }
      - { id: '3', text: 'reduce 3' }
      - { id: '4', text: 'goto 2' }
    answers: ['4']
    explanation: |
      선택지 1: shift 6은 상태 2에서 c를 읽을 때의 동작으로, 다음 단계에서 수행된다.
      선택지 2: shift 7은 상태 2나 6에서 d를 읽을 때의 동작이다.
      선택지 3: reduce 3은 상태 4나 7에서 수행하는 동작이다.
      선택지 4: 4단계의 reduce 2로 스택이 0C가 되었으므로, C 아래 상태 0과 C로 GOTO[0, C] = 2를 찾아 goto 2를 수행한다.

      핵심 개념:
      reduce 직후에는 비단말만 스택에 올라가고 상태가 없다.
      아래 상태와 비단말로 GOTO 표를 찾아 새 상태를 넣는다.
      goto 결과는 다음 단계 스택 0C2와 일치한다.
      분석 과정은 shift, reduce, goto를 반복하다 accept로 끝난다.
    tags: [lr-parsing, goto-function]

  - id: e17-29
    type: multiple-choice
    chapter: 5
    passageRefs: [g17-clr-table-01, g17-clr-trace-01]
    prompt: 빈칸 ‘나’에 알맞은 것은?
    choices:
      - { id: '1', text: 'shift 6' }
      - { id: '2', text: 'shift 7' }
      - { id: '3', text: 'reduce 3' }
      - { id: '4', text: 'goto 2' }
    answers: ['1']
    explanation: |
      선택지 1: 스택 꼭대기 상태 2에서 입력 c를 보면 ACTION[2, c] = S6이므로 shift 6이다. 다음 스택 0C2c6과 일치한다.
      선택지 2: shift 7은 상태 2에서 d를 읽을 때의 동작인데 현재 입력은 c이다.
      선택지 3: 상태 2는 완료 항목이 없어 reduce하지 않는다.
      선택지 4: goto 2는 이미 앞 단계에서 수행되었다.

      핵심 개념:
      상태 2는 첫 번째 C를 만든 뒤 두 번째 C를 분석하는 상태이다.
      두 번째 C의 c는 lookahead \$를 가진 상태 6으로 shift된다.
      같은 c라도 첫 번째 C에서는 상태 3, 두 번째 C에서는 상태 6으로 간다.
      파싱표의 칸은 현재 상태와 입력 기호로 결정된다.
    tags: [lr-parsing]

  - id: e17-30
    type: multiple-choice
    chapter: 5
    passageRefs: [g17-clr-table-01, g17-clr-trace-01]
    prompt: 빈칸 ‘다’에 알맞은 것은?
    choices:
      - { id: '1', text: 'shift 6' }
      - { id: '2', text: 'shift 7' }
      - { id: '3', text: 'reduce 3' }
      - { id: '4', text: 'goto 2' }
    answers: ['2']
    explanation: |
      선택지 1: shift 6은 상태 6에서 c를 읽을 때의 동작인데 현재 입력은 d이다.
      선택지 2: 스택 꼭대기 상태 6에서 입력 d를 보면 ACTION[6, d] = S7이므로 shift 7이다. 다음 스택 0C2c6d7과 일치한다.
      선택지 3: 상태 6은 완료 항목이 없어 reduce하지 않는다.
      선택지 4: goto는 reduce 직후에만 수행한다.

      핵심 개념:
      I6 = {[C → c·C, \$], [C → ·cC, \$], [C → ·d, \$]}은 d에서 I7로 전이한다.
      I7 = {[C → d·, \$]}는 끝 표시에서 C → d로 환원한다.
      shift 대상 상태는 CLR 그래프의 터미널 간선으로 확인한다.
      분석 표의 다음 단계 스택으로 답을 검증할 수 있다.
    tags: [lr-parsing]

  - id: e17-31
    type: multiple-choice
    chapter: 5
    passageRefs: [g17-clr-table-01, g17-clr-trace-01]
    prompt: 빈칸 ‘라’에 알맞은 것은?
    choices:
      - { id: '1', text: 'shift 6' }
      - { id: '2', text: 'shift 7' }
      - { id: '3', text: 'reduce 3' }
      - { id: '4', text: 'goto 2' }
    answers: ['3']
    explanation: |
      선택지 1: 입력이 끝 표시뿐이므로 shift할 수 없다.
      선택지 2: 입력이 끝 표시뿐이므로 shift할 수 없다.
      선택지 3: 스택 꼭대기 상태 7에서 입력 끝 표시를 보면 ACTION[7, \$] = r3이므로 C → d로 환원한다.
      선택지 4: goto는 reduce 다음에 수행되며, 스택 꼭대기에 상태 7이 있는 지금은 reduce 차례이다.

      핵심 개념:
      reduce 3 후 스택은 0C2c6C가 되고 GOTO[6, C] = 9로 간다.
      이어서 상태 9에서 reduce 2(C → cC), GOTO[2, C] = 5로 간다.
      상태 5에서 reduce 1(S → CC), GOTO[0, S] = 1 후 accept한다.
      CLR 구문분석은 파싱표만으로 결정적으로 진행된다.
