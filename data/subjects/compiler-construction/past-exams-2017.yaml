  - id: g17-ll-01
    type: code
    language: text
    body: |
      <문법>
      1) E → TE′
      2) E′ → +TE′
      3) E′ → ε
      4) T → FT′
      5) T′ → *FT′
      6) T′ → ε
      7) F → (E)
      8) F → id

      FIRST(E) = FIRST(T) = FIRST(F) = { (, id }
      FOLLOW(E) = FOLLOW(E′) = { ), $ }
      FOLLOW(T) = FOLLOW(T′) = { +, ), $ }
      FOLLOW(F) = { +, *, ), $ }

