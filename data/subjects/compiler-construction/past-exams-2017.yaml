questions:
  - id: e17-01
    type: multiple-choice
    chapter: 4
    passageRefs: [g17-language-01]
    prompt: 다음의 설명에서 빈칸 ‘가’와 ‘나’에 적당한 것은?
    choices:
      - { id: '1', text: 'Context-Free-언어, 정규언어' }
      - { id: '2', text: 'Context-sensitive 언어, Context-Free-언어' }
      - { id: '3', text: '정규언어, Context-Free-언어' }
      - { id: '4', text: '정규언어, Context-sensitive 언어' }
    answers: ['3']
    explanation: |
      선택지 1: 순서가 반대이다. 단어를 표현하는 것은 정규언어이고 문장 구조를 표현하는 것이 Context-Free 언어이다.
      선택지 2: Context-sensitive 언어는 표현력이 너무 커서 컴파일러의 단어 표현에 쓰지 않는다.
      선택지 3: IF, A, = 같은 단어(토큰)는 정규언어로, IF-THEN-ELSE 문장 전체의 구조는 Context-Free 언어로 표현한다.
      선택지 4: 문장 구조는 Context-sensitive 언어가 아니라 Context-Free 언어로 표현하며, 이를 인식하는 푸시다운 오토마타로 구문분석한다.

      핵심 개념:
      정규언어는 유한 오토마타로 인식되며 어휘분석에서 토큰을 기술한다.
      Context-Free 언어는 푸시다운 오토마타로 인식되며 구문분석에서 문장 구조를 기술한다.
      Context-Free 언어는 정규언어를 포함하므로 표현 범위가 더 넓다.
      표현 범위가 넓을수록 인식하는 오토마타의 구현이 어려워진다.
    tags: [regular-language, context-free-language]

  - id: e17-02
    type: multiple-choice
    chapter: 4
    passageRefs: [g17-grammar-01]
    prompt: 다음은 bccc를 좌단유도하는 과정이다. ==관계없는== 것은?
    choices:
      - { id: '1', text: 'bAS' }
      - { id: '2', text: 'bSSc' }
      - { id: '3', text: 'bcSS' }
      - { id: '4', text: 'bccS' }
    answers: ['2']
    explanation: |
      선택지 1: S → bAS를 적용한 첫 문장형이므로 좌단유도에 포함된다.
      선택지 2: bSSc는 오른쪽 S를 먼저 c로 대치해야 나오므로 우단유도의 문장형이다. 좌단유도와 관계없다.
      선택지 3: bSSS에서 가장 왼쪽 S를 c로 대치한 문장형이므로 포함된다.
      선택지 4: bcSS에서 가장 왼쪽 S를 c로 대치한 문장형이므로 포함된다.

      핵심 개념:
      bccc의 좌단유도는 S ⇒ bAS ⇒ bSSS ⇒ bcSS ⇒ bccS ⇒ bccc 이다.
      좌단유도는 항상 가장 왼쪽 비단말부터 대치하므로 왼쪽부터 터미널이 확정된다.
      중간 문장형의 오른쪽 끝이 먼저 터미널이 되었다면 우단유도의 흔적이다.
      좌단유도는 Top-down 구문분석이 따라가는 유도이다.
    tags: [leftmost-derivation]

  - id: e17-03
    type: multiple-choice
    chapter: 4
    passageRefs: [g17-grammar-01]
    prompt: 다음은 bccc를 우단유도하는 과정이다. ==관계없는== 것은?
    choices:
      - { id: '1', text: 'bAS' }
      - { id: '2', text: 'bAc' }
      - { id: '3', text: 'bSSS' }
      - { id: '4', text: 'bSSc' }
    answers: ['3']
    explanation: |
      선택지 1: S → bAS를 적용한 첫 문장형이므로 우단유도에 포함된다.
      선택지 2: bAS의 가장 오른쪽 S를 c로 대치한 문장형이므로 포함된다.
      선택지 3: bSSS는 오른쪽 S를 그대로 둔 채 A를 먼저 대치해야 나오므로 좌단유도의 문장형이다. 우단유도와 관계없다.
      선택지 4: bAc에서 A → SS를 적용한 문장형이므로 포함된다.

      핵심 개념:
      bccc의 우단유도는 S ⇒ bAS ⇒ bAc ⇒ bSSc ⇒ bScc ⇒ bccc 이다.
      우단유도는 항상 가장 오른쪽 비단말부터 대치하므로 오른쪽부터 터미널이 확정된다.
      우단유도를 거꾸로 따라가면 Bottom-up 구문분석의 환원 순서가 된다.
      좌단유도와 우단유도의 문장형을 구분하는 것이 핵심이다.
    tags: [rightmost-derivation]

  - id: e17-04
    type: multiple-choice
    chapter: 5
    passageRefs: [g17-grammar-01]
    prompt: First(A)는?
    choices:
      - { id: '1', text: 'a' }
      - { id: '2', text: 'a, c' }
      - { id: '3', text: 'b, c' }
      - { id: '4', text: 'a, b, c' }
    answers: ['4']
    explanation: |
      선택지 1: A → a의 a만 넣고 A → SS에서 오는 First(S)를 빠뜨렸다.
      선택지 2: First(S)에는 c뿐 아니라 S → bAS의 b도 들어가므로 b가 빠졌다.
      선택지 3: First(S) = {b, c}만 넣고 A → a의 a를 빠뜨렸다.
      선택지 4: A → SS에서 First(S) = {b, c}, A → a에서 a를 얻으므로 First(A) = {a, b, c}이다.

      핵심 개념:
      FIRST(A)는 A의 모든 생성규칙 오른쪽 첫 기호로부터 구한다.
      오른쪽이 비단말로 시작하면 그 비단말의 FIRST를 포함한다.
      First(S)는 S → bAS, S → c에서 {b, c}이다.
      ε을 유도하지 않으면 첫 기호의 FIRST만 보면 된다.
    tags: [first-set]

  - id: e17-05
    type: multiple-choice
    chapter: 5
    passageRefs: [g17-grammar-01]
    prompt: Follow(A)는?
    choices:
      - { id: '1', text: 'a' }
      - { id: '2', text: 'a, b' }
      - { id: '3', text: 'b, c' }
      - { id: '4', text: 'a, b, c' }
    answers: ['3']
    explanation: |
      선택지 1: a는 A 자신의 FIRST에 속할 뿐 A 뒤에 오는 기호가 아니다.
      선택지 2: A 뒤에는 S가 오므로 a는 들어가지 않고, c가 빠져 있다.
      선택지 3: A가 오른쪽에 나타나는 규칙은 S → bAS뿐이고 A 뒤에 S가 오므로 Follow(A) = First(S) = {b, c}이다.
      선택지 4: a는 A 뒤에 올 수 없으므로 포함되지 않는다.

      핵심 개념:
      FOLLOW(A)는 생성규칙 오른쪽에서 A 바로 뒤에 오는 기호열의 FIRST로 구한다.
      A 뒤의 기호열이 ε을 유도하지 않으면 왼쪽 비단말의 FOLLOW는 더하지 않는다.
      FIRST와 FOLLOW를 혼동하지 않도록 A의 규칙과 A가 쓰인 규칙을 구분해서 본다.
      FOLLOW는 예측 파싱표와 SLR(Simple LR) 파싱표에서 사용된다.
    tags: [follow-set]

  - id: e17-06
    type: multiple-choice
    chapter: 4
    passageRefs: [g17-ambiguous-01]
    prompt: 다음은 모호한 문법이다. 다음 중 이 문법의 특징에 대한 설명 중에서 ==틀린== 것은?
    choices:
      - { id: '1', text: 'id + id * id를 유도하면 두 개 이상의 유도트리가 생성된다.' }
      - { id: '2', text: '구문분석기가 단순하며 구문분석 시간이 빠르다.' }
      - { id: '3', text: '연산자 우선순위를 적용하면 모호성이 해결될 수도 있다.' }
      - { id: '4', text: '결합법칙을 적용하면 모호성이 해결될 수도 있다.' }
    answers: ['2']
    explanation: |
      선택지 1: +를 먼저 묶는 트리와 *를 먼저 묶는 트리가 모두 가능하므로 옳은 설명이다.
      선택지 2: 모호한 문법은 한 입력에 여러 해석이 있어 결정적인 구문분석이 어렵고 시간이 더 걸린다. 틀린 설명이다.
      선택지 3: *를 +보다 높은 우선순위로 정하면 id + id * id의 해석이 하나로 정해지므로 옳은 설명이다.
      선택지 4: 같은 연산자의 왼쪽 결합을 정하면 id + id + id 같은 모호성이 해결되므로 옳은 설명이다.

      핵심 개념:
      모호한 문법은 한 문장에 유도트리가 두 개 이상 존재한다.
      연산자 우선순위는 서로 다른 연산자, 결합법칙은 같은 연산자 사이의 모호성을 해결한다.
      두 규칙을 반영하면 E → E + T | T, T → T * F | F, F → id로 바꿀 수 있다.
      모호성을 해결해야 구문분석기가 결정적으로 동작한다.
    tags: [ambiguity]

  - id: e17-07
    type: multiple-choice
    chapter: 4
    passageRefs: [g17-useless-01]
    prompt: 다음 중 생성할 수 ==없는== 터미널 문자열은?
    choices:
      - { id: '1', text: 'f' }
      - { id: '2', text: 'bc' }
      - { id: '3', text: 'abc' }
      - { id: '4', text: 'aabc' }
    answers: ['1']
    explanation: |
      선택지 1: f는 C → f로만 만들 수 있는데, C는 시작기호 S에서 도달할 수 없으므로 생성할 수 없다.
      선택지 2: S ⇒ A ⇒ bB ⇒ bc로 생성할 수 있다.
      선택지 3: S ⇒ aS ⇒ aA ⇒ abB ⇒ abc로 생성할 수 있다.
      선택지 4: S ⇒ aS ⇒ aaS ⇒ aaA ⇒ aabB ⇒ aabc로 생성할 수 있다.

      핵심 개념:
      문법이 생성하는 언어는 시작기호에서 유도되는 터미널 문자열의 집합이다.
      이 문법의 언어는 a*bc(a가 0개 이상 뒤에 bc)이다.
      시작기호에서 도달할 수 없는 비단말의 규칙은 언어에 아무 영향을 주지 않는다.
      이런 규칙은 불필요한 생성규칙으로 제거할 수 있다.
    tags: [useless-production]

  - id: e17-08
    type: multiple-choice
    chapter: 4
    passageRefs: [g17-useless-01]
    prompt: 터미널 문자열을 생성할 수 ==없는== 불필요한 생성규칙은?
    choices:
      - { id: '1', text: 'S → aS' }
      - { id: '2', text: 'A → bB' }
      - { id: '3', text: 'B → c' }
      - { id: '4', text: 'C → f' }
    answers: ['4']
    explanation: |
      선택지 1: S → aS는 S에서 적용할 수 있고 aabc 같은 단말 문자열의 유도에 쓰이므로 필요한 규칙이다.
      선택지 2: A → bB는 S ⇒ A로 적용할 수 있고 bc 같은 단말 문자열의 유도에 쓰이므로 필요한 규칙이다.
      선택지 3: B → c는 A → bB 다음에 적용되어 단말 문자열의 마지막 c를 만들므로 필요한 규칙이다.
      선택지 4: C → f 자체는 f를 만들지만, C가 어떤 규칙의 오른쪽에도 나타나지 않아 시작기호 S에서 출발한 유도에서 이 규칙을 적용할 수 없다. 즉 이 규칙은 문법이 생성하는 어떤 단말 문자열의 유도에도 쓰이지 않으므로 불필요한 생성규칙이다.

      핵심 개념:
      불필요한 생성규칙은 도달 불가능한 기호나 터미널 문자열을 만들지 못하는 기호를 포함한 규칙이다.
      도달 가능성은 시작기호에서 출발해 오른쪽에 나타나는 비단말을 따라가며 판정한다.
      불필요한 규칙을 제거해도 문법이 생성하는 언어는 바뀌지 않는다.
      문법 효율화의 첫 단계로 불필요한 규칙을 제거한다.
    tags: [useless-production, unreachable-symbol]

  - id: e17-09
    type: multiple-choice
    chapter: 4
    passageRefs: [g17-epsilon-01]
    prompt: 다음 문법을 ε-free 문법으로 바꾸려 한다. 빈칸에 알맞지 ==않은== 것은?
    choices:
      - { id: '1', text: 'aS' }
      - { id: '2', text: 'ab' }
      - { id: '3', text: 'bSa' }
      - { id: '4', text: 'ba' }
    answers: ['1']
    explanation: |
      선택지 1: aS는 aSb에서 b를 지워야 나오는데, 터미널 b는 지울 수 없다. 빈칸에 알맞지 않다.
      선택지 2: aSb에서 S를 ε으로 지우면 ab가 되므로 빈칸에 들어간다.
      선택지 3: 원래 규칙 bSa는 그대로 남으므로 빈칸에 들어간다.
      선택지 4: bSa에서 S를 ε으로 지우면 ba가 되므로 빈칸에 들어간다.

      핵심 개념:
      ε-생성규칙 제거에서는 nullable 비단말(ε을 유도하는 비단말)을 지운 경우를 모두 규칙으로 추가한다.
      S → aSb | bSa | ε는 S → aSb | ab | bSa | ba가 된다.
      시작기호가 ε을 유도하므로 S′ → S | ε을 새로 둔다.
      터미널은 지우는 대상이 아니다.
    tags: [epsilon-production]

  - id: e17-10
    type: multiple-choice
    chapter: 4
    prompt: 생성규칙의 오른쪽이 단 한 개의 논 터미널로 구성되어 Top-down 구문분석에서 효율을 떨어뜨리는 것은?
    choices:
      - { id: '1', text: 'right recursion' }
      - { id: '2', text: '단일 생성규칙' }
      - { id: '3', text: '모호성' }
      - { id: '4', text: 'left factoring' }
    answers: ['2']
    explanation: |
      선택지 1: right recursion은 A → αA처럼 오른쪽 끝이 자기 자신인 규칙으로, Top-down 구문분석에서 문제를 일으키지 않는다.
      선택지 2: A → B처럼 오른쪽이 논터미널 하나뿐인 규칙이 단일 생성규칙이다. 의미 없는 유도 단계를 늘려 효율을 떨어뜨린다.
      선택지 3: 모호성은 한 문장에 유도트리가 여러 개 있는 성질로, 규칙의 모양을 가리키는 말이 아니다.
      선택지 4: left factoring은 공통 접두사를 묶는 변환 방법이다.

      핵심 개념:
      단일 생성규칙(unit production)은 A → B 형태의 규칙이다.
      E → T, T → F처럼 연쇄되면 구문분석 중 불필요한 대치가 반복된다.
      B의 단일이 아닌 규칙을 A로 옮겨 단일 생성규칙을 제거할 수 있다.
      문법 효율화에는 불필요 규칙, ε 규칙, 단일 규칙 제거가 포함된다.
    tags: [unit-production]

  - id: e17-11
    type: multiple-choice
    chapter: 4
    passageRefs: [g17-left-recursion-01]
    prompt: 다음 문법은 TOP-DOWN 방식으로 구문 분석하게 되면 문제가 발생한다. 가장 관련 있는 것은?
    choices:
      - { id: '1', text: '불필요한 생성규칙' }
      - { id: '2', text: 'left-recursion' }
      - { id: '3', text: 'left-factoring' }
      - { id: '4', text: '모호성' }
    answers: ['2']
    explanation: |
      선택지 1: 모든 비단말이 도달 가능하고 터미널 문자열을 만들므로 불필요한 생성규칙은 없다.
      선택지 2: E → E + T, T → T * F처럼 오른쪽이 자기 자신으로 시작하는 left-recursion이 있다. Top-down 구문분석기는 E를 전개할 때 다시 E를 전개해 무한 루프에 빠진다.
      선택지 3: left-factoring은 문제가 아니라 공통 접두사를 해결하는 변환 방법이다.
      선택지 4: 이 문법은 우선순위가 계층화되어 있어 모호하지 않다.

      핵심 개념:
      left recursion은 A → Aα 형태로, Top-down 구문분석에서 입력을 소비하지 않고 A를 반복 전개한다.
      A → Aα | β는 A → βA′, A′ → αA′ | ε로 바꿔 제거한다.
      E → E + T | T는 E → TE′, E′ → +TE′ | ε가 된다.
      Bottom-up 구문분석은 left recursion을 문제없이 처리한다.
    tags: [left-recursion]

  - id: e17-12
    type: multiple-choice
    chapter: 4
    passageRefs: [g17-left-recursion-01, g17-left-recursion-02]
    prompt: 다음은 문제점을 해결하기 위해서 생성규칙을 변환하는 과정이다. T → T * F | F 를 변환했을 때 나올 수 ==없는== 규칙은?
    choices:
      - { id: '1', text: 'T → FT′' }
      - { id: '2', text: 'T′ → *FT′' }
      - { id: '3', text: 'T′ → ε' }
      - { id: '4', text: 'T → id' }
    answers: ['4']
    explanation: |
      선택지 1: T → T * F | F에서 α = * F, β = F이므로 T → FT′가 나온다.
      선택지 2: 반복 부분 * F를 오른쪽 재귀로 만든 T′ → *FT′가 나온다.
      선택지 3: 반복을 끝내는 T′ → ε가 나온다.
      선택지 4: T → id는 left recursion 제거로 생기는 규칙이 아니다. id는 F → id에서만 나온다.

      핵심 개념:
      A → Aα | β의 left recursion은 A → βA′, A′ → αA′ | ε로 제거한다.
      T → T * F | F는 T → FT′, T′ → *FT′ | ε가 된다.
      변환 후에도 같은 언어를 생성하지만 재귀 방향이 오른쪽으로 바뀐다.
      이 변환 결과가 예측 파싱표 문제에서 쓰는 E, E′, T, T′, F 문법이다.
    tags: [left-recursion]

  - id: e17-13
    type: multiple-choice
    chapter: 5
    passageRefs: [g17-sr-grammar-01, g17-sr-trace-01]
    prompt: 다음은 주어진 문법을 보고 id+id*id를 shift-reduce 구문분석 하는 과정이다. 빈칸 ‘가’에 알맞은 것은?
    choices:
      - { id: '1', text: 'id' }
      - { id: '2', text: 'E → id' }
      - { id: '3', text: 'E → E*E' }
      - { id: '4', text: 'E → E+E' }
    answers: ['1']
    explanation: |
      선택지 1: 6단계에서 남은 입력 id를 스택으로 옮기므로 shift id이다. 7단계 스택 \$E+E*id와 일치한다.
      선택지 2: E → id는 reduce 동작에 쓰는 규칙이다.
      선택지 3: E → E*E는 스택에 E * E가 있을 때의 환원 규칙이다.
      선택지 4: E → E+E는 스택에 E + E가 있을 때의 환원 규칙이다.

      핵심 개념:
      shift 동작에는 옮기는 입력 기호, reduce 동작에는 사용하는 생성규칙을 적는다.
      5단계에서 E + E를 환원하지 않고 *를 shift한 것은 *의 우선순위가 높기 때문이다.
      그 결과 id * id 부분이 먼저 환원된다.
      스택과 입력의 변화를 다음 단계와 비교해 동작을 판별한다.
    tags: [shift-reduce-parsing]

  - id: e17-14
    type: multiple-choice
    chapter: 5
    passageRefs: [g17-sr-grammar-01, g17-sr-trace-01]
    prompt: 빈칸 ‘나’에 알맞은 것은?
    choices:
      - { id: '1', text: 'id' }
      - { id: '2', text: 'E → id' }
      - { id: '3', text: 'E → E*E' }
      - { id: '4', text: 'E → E+E' }
    answers: ['2']
    explanation: |
      선택지 1: id는 shift 대상이며 reduce 동작의 내용이 아니다.
      선택지 2: 7단계 스택 꼭대기 id가 핸들이므로 E → id로 환원해 스택이 \$E+E*E가 된다.
      선택지 3: 아직 스택 꼭대기가 E * E가 아니다.
      선택지 4: 스택 꼭대기가 E + E가 아니다.

      핵심 개념:
      reduce는 스택 꼭대기의 핸들을 생성규칙 왼쪽 비단말로 바꾼다.
      id는 곧바로 E → id로 환원되어 피연산자 E가 된다.
      환원 결과가 다음 단계 스택과 일치하는지 확인한다.
      이 과정은 우단유도의 역순이다.
    tags: [shift-reduce-parsing]

  - id: e17-15
    type: multiple-choice
    chapter: 5
    passageRefs: [g17-sr-grammar-01, g17-sr-trace-01]
    prompt: 빈칸 ‘다’에 알맞은 것은?
    choices:
      - { id: '1', text: 'id' }
      - { id: '2', text: 'E → id' }
      - { id: '3', text: 'E → E*E' }
      - { id: '4', text: 'E → E+E' }
    answers: ['3']
    explanation: |
      선택지 1: 입력이 모두 소비되어 shift할 수 없다.
      선택지 2: 스택 꼭대기가 id가 아니다.
      선택지 3: 8단계 스택 \$E+E*E의 꼭대기 E * E가 핸들이므로 E → E*E로 환원한다. 9단계 스택이 \$E+E가 된다.
      선택지 4: E + E 환원은 E * E를 환원한 다음 단계에서 일어난다.

      핵심 개념:
      스택 꼭대기에서 규칙 오른쪽과 일치하는 가장 짧은 핸들을 찾는다.
      *가 나중에 shift되었으므로 * 부분이 먼저 환원된다.
      이것이 *가 +보다 먼저 계산되는 우선순위를 구현한 결과이다.
      환원 후 남은 E + E는 다음 단계에서 환원된다.
    tags: [shift-reduce-parsing, operator-precedence]

  - id: e17-16
    type: multiple-choice
    chapter: 5
    passageRefs: [g17-sr-grammar-01, g17-sr-trace-01]
    prompt: 빈칸 ‘라’에 알맞은 것은?
    choices:
      - { id: '1', text: 'id' }
      - { id: '2', text: 'E → id' }
      - { id: '3', text: 'E → E*E' }
      - { id: '4', text: 'E → E+E' }
    answers: ['4']
    explanation: |
      선택지 1: 입력이 남아 있지 않다.
      선택지 2: 스택 꼭대기가 id가 아니다.
      선택지 3: E * E는 이미 8단계에서 환원되었다.
      선택지 4: 9단계 스택 \$E+E 전체가 핸들이므로 E → E+E로 환원하고, 10단계에서 E만 남아 accept한다.

      핵심 개념:
      입력이 끝난 뒤 스택에 남은 핸들을 차례로 환원한다.
      id+id*id는 * 부분이 먼저, + 부분이 나중에 환원된다.
      이는 id + (id * id)로 해석하는 유도트리에 해당한다.
      스택에 시작기호만 남으면 accept한다.
    tags: [shift-reduce-parsing]

  - id: e17-17
    type: multiple-choice
    chapter: 5
    passageRefs: [g17-precedence-01]
    prompt: 다음은 단순순위문법을 이용해서 기호들 사이의 순위관계를 정하는 과정이다. 빈칸 ‘가’에 알맞은 것을 고르시오.
    choices:
      - { id: '1', text: 'T ⋖ *' }
      - { id: '2', text: '* ⋖ F' }
      - { id: '3', text: 'T ⋗ *' }
      - { id: '4', text: 'T ≐ *' }
    answers: ['4']
    explanation: |
      선택지 1: T와 *는 같은 규칙 오른쪽에서 이웃하므로 ⋖가 아니라 ≐ 관계이다.
      선택지 2: *와 F도 같은 규칙 T*F 안에서 이웃하므로 ≐ 관계이며 ⋖가 아니다.
      선택지 3: T ⋗ *는 T가 다른 기호열로 대치되어 * 앞에서 끝날 때 생기는 관계이다.
      선택지 4: 생성규칙 T → T*F의 오른쪽에서 T와 *가 바로 이웃하므로 T ≐ *이다.

      핵심 개념:
      같은 생성규칙 오른쪽에서 이웃한 두 기호 X, Y는 X ≐ Y이다.
      X ≐ A이고 A ⇒ Y…이면 X ⋖ Y(예: * ⋖ id)이다.
      A ≐ Y이고 A ⇒ …X이면 X ⋗ Y(예: F ⋗ *)이다.
      세 관계 중 하나만 성립하면 단순순위문법이다.
    tags: [simple-precedence-grammar]

  - id: e17-18
    type: multiple-choice
    chapter: 5
    passageRefs: [g17-lr0-01]
    prompt: 다음은 LR(0) 항목 집합의 Canonical Collection을 구하는 과정이다. I₀를 보기에서 고르면?
    choices:
      - { id: '1', text: '(가)' }
      - { id: '2', text: '(나)' }
      - { id: '3', text: '(다)' }
      - { id: '4', text: '(라)' }
    answers: ['4']
    explanation: |
      선택지 1: (가)는 GOTO(I₀, F)이다.
      선택지 2: (나)는 GOTO(I₀, E)이다.
      선택지 3: (다)는 GOTO(I₀, T)이다.
      선택지 4: closure([S′ → ·E])는 E, T, F의 모든 시작 항목을 추가한 (라)이다.

      핵심 개념:
      I₀는 증가문법의 시작 항목 [S′ → ·E]의 closure이다.
      점 뒤가 비단말이면 그 비단말의 규칙을 점이 맨 앞인 항목으로 추가한다.
      E → ·E+T, E → ·T를 추가하면 다시 T, F의 항목이 연쇄적으로 들어간다.
      I₀에서 각 기호로 GOTO를 구해 나머지 상태를 만든다.
    tags: [lr0-items, closure]

  - id: e17-19
    type: multiple-choice
    chapter: 5
    passageRefs: [g17-lr0-01]
    prompt: I₁을 보기에서 고르면?
    choices:
      - { id: '1', text: '(가)' }
      - { id: '2', text: '(나)' }
      - { id: '3', text: '(다)' }
      - { id: '4', text: '(라)' }
    answers: ['2']
    explanation: |
      선택지 1: (가)는 GOTO(I₀, F)이다.
      선택지 2: I₁ = GOTO(I₀, E)는 [S′ → ·E], [E → ·E+T]의 점을 E 뒤로 옮긴 {[S′ → E·], [E → E·+T]}이다.
      선택지 3: (다)는 GOTO(I₀, T)이다.
      선택지 4: (라)는 I₀이다.

      핵심 개념:
      GOTO(I, X)는 점 뒤가 X인 항목의 점을 옮긴 뒤 closure를 구한다.
      I₁의 [S′ → E·]는 accept를, [E → E·+T]는 +에 대한 shift를 만든다.
      점 뒤가 터미널이거나 규칙 끝이면 closure로 추가할 항목이 없다.
      각 상태는 파싱표의 한 행이 된다.
    tags: [lr0-items, goto-function]

  - id: e17-20
    type: multiple-choice
    chapter: 5
    passageRefs: [g17-lr0-01]
    prompt: I₂를 보기에서 고르면?
    choices:
      - { id: '1', text: '(가)' }
      - { id: '2', text: '(나)' }
      - { id: '3', text: '(다)' }
      - { id: '4', text: '(라)' }
    answers: ['3']
    explanation: |
      선택지 1: (가)는 GOTO(I₀, F)이다.
      선택지 2: (나)는 GOTO(I₀, E)이다.
      선택지 3: I₂ = GOTO(I₀, T)는 [E → ·T], [T → ·T*F]의 점을 T 뒤로 옮긴 {[E → T·], [T → T·*F]}이다.
      선택지 4: (라)는 I₀이다.

      핵심 개념:
      I₂는 완료 항목 [E → T·]와 shift 항목 [T → T·*F]를 함께 가진다.
      SLR에서는 FOLLOW(E)에 속하는 입력에서 E → T로 환원하고 *에서는 shift한다.
      FOLLOW(E) = { +, ), \$ }에 *가 없으므로 충돌이 없다.
      항목 집합을 정확히 구해야 파싱표 충돌 여부를 판단할 수 있다.
    tags: [lr0-items, goto-function]

  - id: e17-21
    type: multiple-choice
    chapter: 5
