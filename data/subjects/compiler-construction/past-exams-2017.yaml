    answers: ['2']
    explanation: |
      선택지 1: S4는 상태 0에서 ( 를 읽을 때의 동작이다.
      선택지 2: I₀에서 id로 전이하면 I₅로 가므로 ACTION[0, id] = S5이다.
      선택지 3: S6은 상태 1에서 +를 읽을 때의 동작이다.
