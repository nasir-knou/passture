      - { id: '3', text: 'r2' }
      - { id: '4', text: 'r3' }
    answers: ['2']
    explanation: |
      선택지 1: S3은 상태 0에서 c를 읽을 때의 동작으로 이미 표에 있다.
      선택지 2: I0에서 d로 전이하면 I4로 가므로 ACTION[0, d] = S4이다.
      선택지 3: r2(C → cC)는 I8, I9에서 나타나는 reduce이다.
      선택지 4: r3(C → d)은 I4, I7에서 나타나는 reduce이다.

      핵심 개념:
      CLR(Canonical LR) 파싱표의 shift는 LR(1) 항목 집합 사이의 터미널 전이에서 얻는다.
      I0의 [C → ·d, c/d]에서 d를 읽으면 [C → d·, c/d]인 I4가 된다.
