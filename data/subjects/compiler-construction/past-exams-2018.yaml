  - id: e18-31
    type: multiple-choice
    chapter: 5
    passageRefs: [g18-ll-01, g18-ll-table-01]
    prompt: 다음은 Top-Down 구문분석에서 predictive 파싱표를 구성하는 과정이다. FOLLOW(E′) = { ), $ }로부터 빈칸 ‘가’에 알맞은 내용은?
    choices:
      - { id: '1', text: 'E′ → ε' }
      - { id: '2', text: 'E → TE′' }
      - { id: '3', text: 'T′ → ε' }
      - { id: '4', text: 'E′ → +TE′' }
    answers: ['1']
    explanation: |
      선택지 1: E′ → ε는 FOLLOW(E′)의 각 터미널 칸에 넣으므로 [E′, )] = E′ → ε이다.
      선택지 2: E → TE′는 E 행에 들어가는 규칙이다.
      선택지 3: T′ → ε는 T′ 행에 들어가는 규칙이다.
      선택지 4: E′ → +TE′는 FIRST(+TE′) = {+}인 + 칸에 들어간다.

      핵심 개념:
      예측 파싱표에서 A → α는 FIRST(α)의 터미널 칸에 들어간다.
      α가 ε을 유도하면 FOLLOW(A)의 칸에도 들어간다.
      E′ → ε은 식이 끝나는 자리(닫는 괄호, 입력 끝)에서 E′를 지우는 규칙이다.
      빈칸의 행(비단말)과 열(터미널)을 먼저 확인하면 답을 좁힐 수 있다.
    tags: [predictive-parsing, ll1-parsing-table]

  - id: e18-32
    type: multiple-choice
    chapter: 5
    passageRefs: [g18-ll-01, g18-ll-table-01]
    prompt: FOLLOW(E′) = { ), $ }로부터 빈칸 ‘나’에 알맞은 내용은?
    choices:
      - { id: '1', text: 'E′ → ε' }
      - { id: '2', text: 'E → TE′' }
      - { id: '3', text: 'T′ → ε' }
      - { id: '4', text: 'E′ → +TE′' }
    answers: ['1']
    explanation: |
      선택지 1: 입력 끝 표시도 FOLLOW(E′)에 속하므로 [E′, 끝 표시] 칸에도 E′ → ε를 넣는다.
      선택지 2: E → TE′는 E 행의 규칙이다.
      선택지 3: T′ → ε는 T′ 행의 규칙이다.
      선택지 4: E′ → +TE′는 + 칸에만 들어간다.

      핵심 개념:
      ε-규칙은 FOLLOW 집합의 모든 터미널 칸에 넣는다.
      FOLLOW(E′) = FOLLOW(E) = { ), ＄ }이므로 두 칸 모두 E′ → ε이다.
      파싱표의 한 칸에 규칙이 하나씩만 있으면 LL(1) 문법이다.
      이 식 문법은 left recursion을 제거해 LL(1)이 되었다.
    tags: [predictive-parsing, ll1-parsing-table]

  - id: e18-33
    type: multiple-choice
    chapter: 5
    prompt: Bell 연구소에서 Stephen C. Johnson을 중심으로 개발된 LALR(1) 구문분석기 생성기로 선언부분(declation), 변환규칙 부분(translation rules), 사용자 프로그램 부분(user program) 등의 세 부분으로 구성된 것은?
    choices:
      - { id: '1', text: 'Lex' }
      - { id: '2', text: 'Scan gen' }
      - { id: '3', text: 'YACC' }
      - { id: '4', text: 'LALR GEN' }
    answers: ['3']
    explanation: |
      선택지 1: Lex는 정규표현으로 토큰을 기술해 어휘분석기를 만드는 도구이다.
      선택지 2: Scan gen은 스캐너(어휘분석기) 생성기이다.
      선택지 3: YACC(Yet Another Compiler-Compiler)은 Stephen C. Johnson이 만든 LALR(1) 구문분석기 생성기로, 선언부 %% 변환규칙부 %% 사용자 프로그램부의 세 부분으로 구성된다.
      선택지 4: Bell 연구소에서 Stephen C. Johnson이 개발한 LALR(1) 구문분석기 생성기는 YACC이므로 LALR GEN은 정답이 아니다.

      참고: 문제의 declation은 원문 표기를 그대로 둔 것으로, declaration의 오기이다.

      핵심 개념:
      YACC 입력 파일은 선언부, 변환규칙부, 사용자 프로그램부로 나뉘고 %%로 구분한다.
      변환규칙부에는 문법규칙과 수행코드(semantic action)를 적는다.
      YACC은 LALR(1)(Look-Ahead LR) 파싱표를 이용하는 C 구문분석기를 생성한다.
      Lex가 만든 어휘분석기와 함께 사용하며, GNU 계열 호환 도구는 Bison이다.
    tags: [yacc, parser-generator]

  - id: e18-34
    type: multiple-choice
    chapter: 6
    prompt: 다음 기호표의 내용 중 식별자의 위치를 나타내는 것은?
    choices:
      - { id: '1', text: '유형' }
      - { id: '2', text: '레벨' }
      - { id: '3', text: '오프셋' }
      - { id: '4', text: '차원수' }
    answers: ['3']
    explanation: |
      선택지 1: 유형은 식별자의 자료형 정보이다.
      선택지 2: 레벨은 식별자가 선언된 블록의 중첩 깊이로, 유효 범위를 판단하는 데 쓰인다.
      선택지 3: 오프셋은 데이터 영역의 시작 위치로부터의 상대 거리로, 식별자의 기억장치 위치를 나타낸다.
      선택지 4: 차원수는 배열의 차원 정보이다.

      핵심 개념:
      기호표에는 식별자의 이름, 유형, 종류, 레벨, 오프셋, 차원수, 매개변수 등이 기록된다.
      레벨과 오프셋을 함께 쓰면 실행 시 식별자의 실제 주소를 계산할 수 있다.
      기호표는 의미분석에서 선언 확인과 형 검사에 사용된다.
      목적코드 생성 단계는 오프셋 정보로 기억장소를 할당한다.
    tags: [symbol-table, offset]

  - id: e18-35
    type: multiple-choice
    chapter: 7
    passageRefs: [g18-quad-01]
    prompt: 다음은 A := -B*(C+D)를 3 주소 코드로 표현하는 과정이다. ‘가’에 알맞은 것은?
    choices:
      - { id: '1', text: 'T₁' }
      - { id: '2', text: 'T₂' }
      - { id: '3', text: 'T₃' }
      - { id: '4', text: 'A' }
    answers: ['2']
    explanation: |
      선택지 1: T₁은 (0)번 uminus B의 결과로 이미 사용되었다.
      선택지 2: C + D의 결과를 새 임시변수 T₂에 저장해야 (2)번에서 T₁ * T₂로 쓸 수 있다.
      선택지 3: T₃은 (2)번 곱셈의 결과이다.
      선택지 4: A는 (3)번 대입의 결과이다.

      핵심 개념:
      quadruple 표현은 (op, 피연산자 1, 피연산자 2, 결과)의 네 필드를 가진다.
      중간 결과마다 새 임시변수(T₁, T₂, T₃)를 만들어 결과 필드에 적는다.
      뒤의 명령은 앞 명령의 결과 임시변수를 피연산자로 참조한다.
      A := -B*(C+D)는 uminus, +, *, := 네 개의 3 주소 명령이 된다.
    tags: [three-address-code, quadruple]
