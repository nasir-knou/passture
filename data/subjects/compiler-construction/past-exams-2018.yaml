questions:
  - id: e18-01
    type: multiple-choice
    chapter: 4
    prompt: 다음은 컴파일러와 관련된 설명들이다. ==틀린== 것은?
    choices:
      - { id: '1', text: '정규언어는 어휘분석에서 단어들을 표현하는데 사용된다.' }
      - { id: '2', text: '유한오토마타는 정규언어를 인식한다.' }
      - { id: '3', text: '푸시다운 오토마타는 구문분석과 관련이 있다.' }
      - { id: '4', text: 'Context-Free-언어는 단어들을 표현하는데 사용된다.' }
    answers: ['4']
    explanation: |
      선택지 1: 식별자, 상수, 연산자 같은 단어(토큰)는 정규언어로 표현하며 어휘분석에서 사용한다. 옳은 설명이다.
      선택지 2: 정규언어는 유한오토마타(Finite Automata)로 인식된다. 옳은 설명이다.
      선택지 3: 푸시다운 오토마타(Pushdown Automata)는 Context-Free 언어를 인식하므로 구문분석과 관련이 있다. 옳은 설명이다.
      선택지 4: Context-Free 언어는 단어가 아니라 문장 전체의 구조를 표현하는 데 사용한다. 단어 표현은 정규언어의 역할이므로 틀린 설명이다.

      핵심 개념:
      컴파일러 앞단은 어휘분석(정규언어, 유한오토마타)과 구문분석(Context-Free 언어, 푸시다운 오토마타)으로 나뉜다.
      정규언어는 반복과 선택은 표현하지만 괄호 짝 맞추기 같은 중첩 구조는 표현하지 못한다.
      Context-Free 언어는 스택을 이용해 중첩 구조를 인식할 수 있다.
      따라서 단어는 정규언어, 문장은 Context-Free 언어로 기술한다.
    tags: [regular-language, context-free-language, automata]

  - id: e18-02
    type: multiple-choice
    chapter: 4
    passageRefs: [g18-grammar-01, g18-leftmost-01]
    prompt: 다음은 aaaa를 좌단유도하는 과정이다. 빈 칸에 알맞은 것은?
    choices:
      - { id: '1', text: 'aAa' }
      - { id: '2', text: 'aaSS' }
      - { id: '3', text: 'aSSa' }
      - { id: '4', text: 'aSSS' }
    answers: ['4']
    explanation: |
      선택지 1: aAa는 오른쪽 S를 먼저 대치한 결과로 우단유도의 두 번째 문장형이다.
      선택지 2: aaSS는 좌단유도의 세 번째 문장형으로, aAS 바로 다음 단계가 아니다.
      선택지 3: aSSa는 우단유도 과정에서 나오는 문장형이다.
      선택지 4: aAS에서 가장 왼쪽 비단말 A에 A → SS를 적용하면 aSSS가 된다. 이후 S ⇒ a를 왼쪽부터 세 번 적용해 aaaa가 된다.

      핵심 개념:
      좌단유도는 가장 왼쪽 비단말부터 대치한다.
      aaaa의 좌단유도는 S ⇒ aAS ⇒ aSSS ⇒ aaSS ⇒ aaaS ⇒ aaaa 이다.
      A → SbA, A → ba는 b를 만들기 때문에 aaaa 유도에는 쓸 수 없다.
      같은 문장이라도 좌단·우단유도의 중간 문장형은 다르다.
    tags: [leftmost-derivation]

  - id: e18-03
    type: multiple-choice
    chapter: 4
    passageRefs: [g18-grammar-01, g18-rightmost-01]
    prompt: 다음은 aaaa를 우단유도하는 과정이다. 빈 칸에 알맞은 것은?
    choices:
      - { id: '1', text: 'aAa' }
      - { id: '2', text: 'aaSS' }
      - { id: '3', text: 'aSSa' }
      - { id: '4', text: 'aSSS' }
    answers: ['1']
    explanation: |
      선택지 1: aAS에서 가장 오른쪽 비단말 S에 S → a를 적용하면 aAa가 된다. 우단유도의 두 번째 문장형이다.
      선택지 2: aaSS는 왼쪽 S를 먼저 대치한 좌단유도 문장형이다.
      선택지 3: aSSa는 aAa에서 A → SS를 적용한 세 번째 문장형으로, 바로 다음 단계가 아니다.
      선택지 4: aSSS는 A를 먼저 대치한 좌단유도 문장형이다.

      핵심 개념:
      우단유도는 가장 오른쪽 비단말부터 대치한다.
      aaaa의 우단유도는 S ⇒ aAS ⇒ aAa ⇒ aSSa ⇒ aSaa ⇒ aaaa 이다.
      우단유도의 역순은 Bottom-up 구문분석에서 환원이 일어나는 순서이다.
      좌단유도 aSSS와 우단유도 aAa를 구분하는 것이 핵심이다.
    tags: [rightmost-derivation]

  - id: e18-04
    type: multiple-choice
    chapter: 5
    passageRefs: [g18-grammar-01]
    prompt: First(A)는?
    choices:
      - { id: '1', text: 'a' }
      - { id: '2', text: 'a, b' }
      - { id: '3', text: 'a, b, ε' }
      - { id: '4', text: 'a, b, $' }
    answers: ['2']
    explanation: |
      선택지 1: A → SbA, A → SS에서 First(S) = {a}를 얻지만 A → ba의 b가 빠져 있다.
      선택지 2: A → SbA, A → SS에서 First(S) = {a}, A → ba에서 b를 얻으므로 First(A) = {a, b}이다.
      선택지 3: A와 S 모두 ε을 유도하지 않으므로 ε은 포함되지 않는다.
      선택지 4: 입력 끝 표시(＄)는 FIRST 집합에 들어가지 않는다.

      핵심 개념:
      FIRST(A)는 A의 각 생성규칙 오른쪽의 첫 기호를 기준으로 구한다.
      첫 기호가 터미널이면 그 터미널을, 비단말이면 그 비단말의 FIRST를 넣는다.
      S의 규칙은 모두 a로 시작하므로 First(S) = {a}이다.
      ε은 빈 문자열을 유도할 수 있을 때만 FIRST에 포함한다.
    tags: [first-set]

  - id: e18-05
    type: multiple-choice
    chapter: 5
    passageRefs: [g18-grammar-01]
    prompt: Follow(A)는?
    choices:
      - { id: '1', text: 'a' }
      - { id: '2', text: 'b' }
      - { id: '3', text: 'a, b' }
      - { id: '4', text: 'a, b, $' }
    answers: ['1']
    explanation: |
      선택지 1: S → aAS에서 A 뒤에 S가 오므로 First(S) = {a}가 Follow(A)에 들어간다. A → SbA에서는 A가 끝에 있어 Follow(A) 자신만 더하므로 Follow(A) = {a}이다.
      선택지 2: b는 A → SbA에서 S 바로 뒤에 오므로 Follow(S)의 원소이다.
      선택지 3: b는 A 뒤에 올 수 없으므로 포함되지 않는다.
      선택지 4: A 뒤에는 항상 S가 오므로 입력 끝 표시(＄)도 Follow(A)에 들어가지 않는다.

      핵심 개념:
      FOLLOW(A)는 생성규칙 오른쪽에서 A 바로 뒤에 오는 기호들의 FIRST로 구한다.
      A가 오른쪽 끝에 있으면 왼쪽 비단말의 FOLLOW를 더한다.
      A → SbA처럼 자기 자신을 더하는 경우는 새 원소를 만들지 않는다.
      FOLLOW 집합에는 ε이 들어가지 않는다.
    tags: [follow-set]

  - id: e18-06
    type: multiple-choice
    chapter: 4
    passageRefs: [g18-ambiguous-01]
    prompt: 다음 문법에 대한 설명으로 가장 적당한 것은?
    choices:
      - { id: '1', text: 'id + id * id를 유도하면 오직 하나의 유도트리가 생성된다.' }
      - { id: '2', text: '구문분석기를 구성하는 것이 단순하고 쉽다.' }
      - { id: '3', text: '구문분석기를 구성하는 것은 복잡하지만 구문분석 시간이 빠르다.' }
      - { id: '4', text: '모호한 문법이므로 모호하지 않은 문법으로 바꾸어 주어야 한다.' }
    answers: ['4']
    explanation: |
      선택지 1: id + id * id는 +를 먼저 묶는 트리와 *를 먼저 묶는 트리 두 개가 생성되므로 틀린 설명이다.
      선택지 2: 모호한 문법은 한 입력에 여러 해석이 있어 결정적인 구문분석기를 바로 만들기 어렵다.
      선택지 3: 모호성 때문에 구문분석 중 선택 문제가 생기므로 구문분석 시간이 빠르다고 할 수 없다.
      선택지 4: 이 문법은 모호하므로 연산자 우선순위와 결합법칙을 반영해 모호하지 않은 문법으로 바꾸어야 한다. 가장 적당한 설명이다.

      핵심 개념:
      한 문장에 대해 유도트리가 둘 이상이면 모호한 문법이다.
      모호한 문법은 문장의 의미(연산 순서)가 하나로 정해지지 않는다.
      E → E + T | T, T → T * F | F, F → id처럼 우선순위를 계층화하면 모호성을 없앨 수 있다.
      YACC처럼 우선순위 선언으로 모호성을 해결하는 방법도 있다.
    tags: [ambiguity]

  - id: e18-07
    type: multiple-choice
    chapter: 4
    passageRefs: [g18-epsilon-01]
    prompt: 다음 문법을 ε-free 문법으로 바꾸려고 한다. 빈칸에 알맞지 ==않은== 것은? (단, | 표시는 생략한다)
    choices:
      - { id: '1', text: 'ba' }
      - { id: '2', text: 'SaS' }
      - { id: '3', text: 'baS' }
      - { id: '4', text: 'bSaS' }
    answers: ['2']
    explanation: |
      선택지 1: bSaS에서 두 S를 모두 ε으로 지우면 ba가 되므로 빈칸에 들어간다.
      선택지 2: SaS는 b를 지워야 나오는데, b는 터미널이므로 지울 수 없다. 빈칸에 알맞지 않다.
      선택지 3: bSaS에서 첫 번째 S를 ε으로 지우면 baS가 되므로 빈칸에 들어간다.
      선택지 4: 원래 규칙 bSaS는 그대로 남으므로 빈칸에 들어간다.

      핵심 개념:
      ε-생성규칙 제거는 ε을 유도할 수 있는 비단말(nullable)을 찾는 것부터 시작한다.
      규칙 오른쪽의 nullable 비단말을 지운 경우와 남긴 경우를 모두 규칙으로 추가한다.
      S → bSaS | ε에서 S → bSaS | baS | bSa | ba를 얻는다.
      시작기호가 ε을 유도하면 새 시작기호 S′ → S | ε을 둔다.
    tags: [epsilon-production]

  - id: e18-08
    type: multiple-choice
    chapter: 4
    passageRefs: [g18-unit-01]
    prompt: 다음은 주어진 문법에서 단일 생성규칙을 효율화시키는 과정의 일부이다. 빈칸 ‘가’에 알맞은 것은?
    choices:
      - { id: '1', text: 'F' }
      - { id: '2', text: 'T * F' }
      - { id: '3', text: 'T * F | F' }
      - { id: '4', text: 'T * F | (E) | a' }
    answers: ['4']
    explanation: |
      선택지 1: F만 넣으면 E → F라는 단일 생성규칙이 다시 생긴다.
      선택지 2: T * F만 넣으면 E가 (E)나 a를 직접 유도하지 못해 원래 언어와 달라진다.
      선택지 3: F가 포함되어 여전히 단일 생성규칙이 남는다.
      선택지 4: E → T를 T의 규칙 T * F, F로 바꾸고, 다시 F를 (E), a로 바꾸면 E → E + T | T * F | (E) | a가 된다.

      핵심 개념:
      단일 생성규칙 A → B는 B의 단일이 아닌 규칙들을 A로 복사해 제거한다.
      E ⇒ T ⇒ F처럼 연쇄된 단일 규칙은 끝까지 따라가 모두 옮긴다.
      변환 후에는 오른쪽이 비단말 하나뿐인 규칙이 남지 않는다.
      단일 규칙 제거는 구문분석 단계 수를 줄여 효율을 높인다.
    tags: [unit-production]

  - id: e18-09
    type: multiple-choice
    chapter: 4
    passageRefs: [g18-backtrack-01]
    prompt: 이처럼 다시 되돌아가는 문제점을 무엇이라고 하는가?
    choices:
      - { id: '1', text: 'back tracking' }
      - { id: '2', text: 'left recursion' }
      - { id: '3', text: '단일 생성규칙' }
      - { id: '4', text: 'left factoring' }
    answers: ['1']
    explanation: |
      선택지 1: A → a를 적용했다가 실패해 되돌아가 A → ab를 다시 적용하는 현상이 back tracking이다.
      선택지 2: left recursion은 A → Aα처럼 왼쪽이 자기 자신으로 시작하는 규칙으로, Top-down에서 무한 루프를 일으키는 다른 문제이다.
      선택지 3: 단일 생성규칙은 A → B 형태의 규칙으로 이 문법에는 없다.
      선택지 4: left factoring은 back tracking을 없애는 해결 방법이다.

      핵심 개념:
      Top-down 구문분석은 비단말마다 적용할 규칙을 골라야 한다.
      잘못 고르면 입력을 되돌려 다른 규칙을 시도해야 하는데 이것이 back tracking이다.
      공통 접두사를 가진 규칙 A → a | ab가 대표적인 원인이다.
      back tracking이 없어야 효율적인 예측 구문분석이 가능하다.
    tags: [backtracking]

  - id: e18-10
    type: multiple-choice
    chapter: 4
    passageRefs: [g18-backtrack-01]
    prompt: 이 문제점을 해결하는 방법은?
    choices:
      - { id: '1', text: 'left-factoring' }
      - { id: '2', text: 'backtracking' }
      - { id: '3', text: 'ε생성규칙제거' }
      - { id: '4', text: '연산자 우선순위' }
    answers: ['1']
    explanation: |
      선택지 1: A → a | ab의 공통 접두사 a를 묶어 A → aA′, A′ → ε | b로 바꾸면 되돌아감 없이 규칙을 고를 수 있다. 해결 방법이다.
      선택지 2: backtracking은 해결해야 할 문제점 자체이다.
      선택지 3: ε-생성규칙 제거는 A → ε를 없애는 변환으로 공통 접두사 문제와 관계없다.
      선택지 4: 연산자 우선순위는 모호한 문법을 해결하는 방법이다.

      핵심 개념:
      left factoring은 A → αβ₁ | αβ₂를 A → αA′, A′ → β₁ | β₂로 바꾸는 변환이다.
      공통 부분 α를 먼저 읽고 나서 다음 입력으로 β₁, β₂ 중 하나를 결정한다.
      left recursion 제거와 함께 LL(1)(Left-to-right, Leftmost derivation) 문법으로 만드는 대표적인 변환이다.
      변환 후에도 문법이 생성하는 언어는 같다.
    tags: [left-factoring, backtracking]

  - id: e18-11
    type: multiple-choice
    chapter: 5
    prompt: 다음 구문분석에 대한 설명 중 ==잘못== 설명된 것은?
    choices:
      - { id: '1', text: 'Top-down 구문분석 방법은 backtracking 문제를 갖고 있다.' }
      - {
          id: '2',
          text: 'Bottom-up 방법은 터미널 노드부터 시작하여 루트 노드를 향하는 반면에, Top-down 방법은 루트 노드로부터 터미널 노드를 향하여 파스트리를 만들어 나간다.',
        }
      - {
          id: '3',
          text: 'Shift-reduce 구문분석은 Top-down 방법으로 시작기호로부터 출발하여 유도에 의하여 주어진 문자열을 찾아간다.',
        }
      - { id: '4', text: 'backtracking을 방지하기 위하여 LL(k) 문법을 사용하게 되었다.' }
    answers: ['3']
    explanation: |
      선택지 1: Top-down 방법은 규칙을 잘못 고르면 되돌아가야 하는 backtracking 문제가 있다. 옳은 설명이다.
      선택지 2: Bottom-up은 잎에서 루트로, Top-down은 루트에서 잎으로 파스트리를 만든다. 옳은 설명이다.
      선택지 3: Shift-reduce 구문분석은 입력 문자열에서 출발해 환원으로 시작기호를 찾는 Bottom-up 방법이다. 잘못된 설명이다.
      선택지 4: LL(k) 문법은 k개의 lookahead만으로 규칙을 결정할 수 있어 backtracking 없이 Top-down 구문분석을 할 수 있다. 옳은 설명이다.

      핵심 개념:
      Top-down은 시작기호에서 좌단유도로, Bottom-up은 입력에서 우단유도의 역순으로 진행한다.
      Shift-reduce, 순위 구문분석, LR(Left-to-right, Rightmost derivation) 계열(SLR(Simple LR), CLR(Canonical LR), LALR)은 Bottom-up 방법이다.
      재귀 하강과 예측(LL) 구문분석은 Top-down 방법이다.
      LL(k)의 첫 L은 왼쪽부터 읽기, 둘째 L은 좌단유도를 뜻한다.
    tags: [top-down-parsing, bottom-up-parsing]

  - id: e18-12
    type: multiple-choice
    chapter: 5
    passageRefs: [g18-sr-grammar-01, g18-handle-01]
    prompt: 문자열 id * id + id를 우단 유도하고 핸들을 표시한 것이다. 다음 중 핸들을 ==잘못== 표시한 단계가 있는가?
    choices:
      - { id: '1', text: '1단계' }
      - { id: '2', text: '3단계' }
      - { id: '3', text: '5단계' }
      - { id: '4', text: '없다.' }
    answers: ['4']
    explanation: |
      선택지 1: 1단계 E * E는 E → E * E로 환원되는 전체가 핸들이므로 옳다.
      선택지 2: 3단계 E * E + id에서는 오른쪽 끝 id가 먼저 환원되므로 옳다.
      선택지 3: 5단계 id * id + id에서는 가장 왼쪽 id가 먼저 환원되므로 옳다.
      선택지 4: 우단유도 E ⇒ E * E ⇒ E * E + E ⇒ E * E + id ⇒ E * id + id ⇒ id * id + id의 각 단계 핸들이 모두 올바르게 표시되어 있다. 잘못 표시한 단계는 없다.

      핵심 개념:
      핸들은 환원하면 우단유도의 바로 앞 문장형이 되는 부분 문자열이다.
      이 유도는 +를 먼저 묶는 트리(E * (E + E))에 해당한다.
      모호한 문법에서는 어떤 우단유도를 택하느냐에 따라 핸들이 달라진다.
      문제에 주어진 유도 순서를 거꾸로 따라가며 핸들을 확인한다.
    tags: [handle, rightmost-derivation]

  - id: e18-13
    type: multiple-choice
    chapter: 5
    passageRefs: [g18-sr-grammar-01, g18-sr-trace-01]
    prompt: 계속해서 shift-reduce 구문분석 하는 과정이다. 빈칸 ‘가’에 알맞은 것은?
    choices:
      - { id: '1', text: 'id' }
      - { id: '2', text: 'E → id' }
      - { id: '3', text: 'E → E * E' }
      - { id: '4', text: 'E → E+E' }
    answers: ['1']
    explanation: |
      선택지 1: 0단계에서 입력의 첫 기호 id를 스택으로 옮기므로 shift id이다. 1단계 스택 ＄id와 일치한다.
      선택지 2: E → id는 스택 꼭대기의 id를 환원하는 동작이다.
      선택지 3: E → E * E는 스택에 E * E가 있을 때의 환원이다.
      선택지 4: E → E+E는 스택에 E + E가 있을 때의 환원이다.

      핵심 개념:
      Shift-reduce 구문분석은 스택이 비어 있으면 먼저 입력 기호를 shift한다.
      shift 동작의 괄호에는 옮기는 입력 기호를 적는다.
      reduce 동작의 괄호에는 사용한 생성규칙을 적는다.
      각 단계의 스택 변화를 비교하면 동작을 판별할 수 있다.
    tags: [shift-reduce-parsing]

  - id: e18-14
    type: multiple-choice
    chapter: 5
    passageRefs: [g18-sr-grammar-01, g18-sr-trace-01]
    prompt: 빈칸 ‘나’에 알맞은 것은?
    choices:
      - { id: '1', text: 'id' }
      - { id: '2', text: 'E → id' }
      - { id: '3', text: 'E → E * E' }
      - { id: '4', text: 'E → E+E' }
    answers: ['2']
    explanation: |
      선택지 1: id는 shift 대상이며 reduce 동작의 내용이 아니다.
      선택지 2: 스택 꼭대기 id가 핸들이므로 E → id로 환원해 스택이 ＄E가 된다.
      선택지 3: 스택에 E * E가 없으므로 환원할 수 없다.
      선택지 4: 스택에 E + E가 없으므로 환원할 수 없다.

      핵심 개념:
      id가 스택에 올라오면 E → id로 환원해 피연산자 E를 만든다.
      환원은 스택 꼭대기에서만 일어난다.
      환원 결과가 다음 단계의 스택과 일치하는지 확인한다.
      이 과정은 우단유도의 역순이다.
    tags: [shift-reduce-parsing]

  - id: e18-15
    type: multiple-choice
    chapter: 5
    passageRefs: [g18-sr-grammar-01, g18-sr-trace-01]
    prompt: 빈칸 ‘다’에 알맞은 것은?
    choices:
      - { id: '1', text: 'id' }
      - { id: '2', text: 'E → id' }
      - { id: '3', text: 'E → E * E' }
      - { id: '4', text: 'E → E+E' }
    answers: ['4']
    explanation: |
      선택지 1: 입력이 모두 소비되어 shift할 기호가 없다.
      선택지 2: 스택 꼭대기가 id가 아니므로 E → id 환원이 아니다.
      선택지 3: 스택 꼭대기 세 기호는 E + E이므로 E * E로 환원할 수 없다.
      선택지 4: 8단계 스택 ＄E*E+E의 꼭대기 E + E가 핸들이므로 E → E+E로 환원한다. 9단계 스택이 ＄E*E가 된다.

      핵심 개념:
      5단계에서 E * E를 환원하지 않고 +를 shift했기 때문에 +가 나중에 들어온 연산이 먼저 환원된다.
      그 결과 이 분석은 id * (id + id)로 묶는 해석이 된다.
      모호한 문법에서는 shift/reduce 선택에 따라 연산 순서가 달라진다.
      주어진 12번의 우단유도와 같은 순서로 환원된다.
    tags: [shift-reduce-parsing, ambiguity]

  - id: e18-16
    type: multiple-choice
    chapter: 5
    passageRefs: [g18-sr-grammar-01, g18-sr-trace-01]
    prompt: 빈칸 ‘라’에 알맞은 것은?
    choices:
      - { id: '1', text: 'id' }
      - { id: '2', text: 'E → id' }
      - { id: '3', text: 'E → E * E' }
      - { id: '4', text: 'E → E+E' }
    answers: ['3']
    explanation: |
      선택지 1: 입력이 남아 있지 않아 shift할 수 없다.
      선택지 2: 스택 꼭대기가 id가 아니다.
      선택지 3: 9단계 스택 ＄E*E 전체가 핸들이므로 E → E * E로 환원하고, 10단계에서 E만 남아 accept한다.
      선택지 4: E + E는 이미 8단계에서 환원되었다.

      핵심 개념:
      입력이 끝나면 스택에 남은 핸들을 차례로 환원한다.
      마지막 환원 후 스택에 시작기호만 남으면 accept한다.
      환원 순서는 E + E → E * E로, 우단유도 E ⇒ E * E ⇒ E * E + E의 역순이다.
      shift-reduce 표를 읽을 때는 스택 꼭대기의 기호열을 규칙 오른쪽과 비교한다.
    tags: [shift-reduce-parsing]

  - id: e18-17
    type: multiple-choice
    chapter: 5
    passageRefs: [g18-precedence-01]
    prompt: 다음은 단순순위문법을 이용해서 기호들 사이의 순위관계를 정하는 과정이다. 빈칸 ‘가’에 알맞은 것은?
    choices:
      - { id: '1', text: 'T ⋖ *' }
      - { id: '2', text: '* ⋖ id' }
      - { id: '3', text: 'T ⋗ *' }
      - { id: '4', text: 'id ⋗ *' }
    answers: ['2']
    explanation: |
      선택지 1: T → T*F에서 T와 *는 같은 규칙 오른쪽에서 이웃하므로 T ≐ * 관계이며 ⋖가 아니다.
      선택지 2: T*F의 F를 F → id로 대치하면 id는 * 뒤에서 새로 시작하는 기호이므로 * ⋖ id 관계가 생긴다.
      선택지 3: T ⋗ *는 * 앞의 T가 다른 기호열로 대치될 때 생기는 관계인데, 이 단계에서는 * 뒤의 F가 대치되었다.
      선택지 4: id는 * 뒤에 오므로 id와 * 사이에 ⋗ 관계가 생기지 않는다.

      핵심 개념:
      단순순위 관계는 ≐(같은 핸들 안에서 이웃), ⋖(핸들의 시작), ⋗(핸들의 끝) 세 가지이다.
      생성규칙 T → T*F에서 T ≐ *, * ≐ F이다.
      X ≐ A인 자리에서 A가 Y…로 시작하는 문자열로 대치되면 X ⋖ Y이다.
      * ≐ F이고 F ⇒ id이므로 * ⋖ id가 된다.
    tags: [simple-precedence-grammar]

  - id: e18-18
    type: multiple-choice
    chapter: 5
    passageRefs: [g18-precedence-01]
    prompt: 빈칸 ‘나’에 알맞은 것은?
    choices:
      - { id: '1', text: 'F ⋖ *' }
      - { id: '2', text: '* ⋖ id' }
      - { id: '3', text: 'F ⋗ *' }
      - { id: '4', text: 'id ⋗ *' }
    answers: ['3']
    explanation: |
      선택지 1: F는 * 앞에서 먼저 환원되어야 하므로 ⋖가 아니라 ⋗ 관계이다.
      선택지 2: * ⋖ id는 * 뒤의 F를 id로 대치할 때 생기는 관계로, 이 단계(앞의 T를 F로 대치)와 관계없다.
      선택지 3: 앞의 T를 T → F로 대치하면 F가 * 바로 앞에서 끝나는 기호가 되므로 F ⋗ *이다.
      선택지 4: id는 * 뒤에 있으므로 id ⋗ * 관계가 성립하지 않는다.

      핵심 개념:
      A ≐ X인 자리에서 A가 …Y로 끝나는 문자열로 대치되면 Y ⋗ X 관계가 생긴다.
      T ≐ *이고 T ⇒ F이므로 F ⋗ *이다.
      ⋗ 관계는 스택의 기호를 환원해야 하는 시점을 알려 준다.
      모든 기호 쌍의 관계를 모아 순위관계표를 만든다.
    tags: [simple-precedence-grammar]

  - id: e18-19
    type: multiple-choice
    chapter: 5
    passageRefs: [g18-lr0-01]
    prompt: 다음은 LR(0) 항목 집합의 canonical collection을 구하는 과정이다. I₀ = closure([S′ → ·E])를 보기에서 고르면?
    choices:
      - { id: '1', text: '(가)' }
      - { id: '2', text: '(나)' }
      - { id: '3', text: '(다)' }
      - { id: '4', text: '(라)' }
    answers: ['4']
    explanation: |
      선택지 1: (가) {[T → F·]}는 GOTO(I₀, F)이다.
      선택지 2: (나)는 E 뒤로 점을 옮긴 GOTO(I₀, E)이다.
      선택지 3: (다)는 T 뒤로 점을 옮긴 GOTO(I₀, T)이다.
      선택지 4: [S′ → ·E]에서 점 뒤 E의 항목 [E → ·E+T], [E → ·T]를 추가하고, 다시 T와 F의 항목을 추가하면 (라)가 된다.

      핵심 개념:
      closure(I)는 I의 항목을 모두 넣고, 점 뒤 비단말 B마다 [B → ·γ]를 더 이상 늘지 않을 때까지 추가한다.
      I₀는 증가문법의 시작 항목 [S′ → ·E]의 closure이다.
      (라)와 (마)는 비슷하지만 (라)는 [S′ → ·E], (마)는 [F → (·E)]를 가진다.
      canonical collection은 I₀에서 GOTO를 반복해 얻는다.
    tags: [lr0-items, closure]

  - id: e18-20
    type: multiple-choice
    chapter: 5
    passageRefs: [g18-lr0-01]
    prompt: I₂ = GOTO(I₀, T)를 보기에서 고르면?
    choices:
