    answers: ['2']
    explanation: |
      선택지 1: (나)는 GOTO(I₀, E)이다.
      선택지 2: I₀에서 점 뒤가 T인 항목은 [E → ·T], [T → ·T*F]이다. 점을 T 뒤로 옮기면 {[E → T·], [T → T·*F]}가 되므로 (다)이다.
      선택지 3: (라)는 I₀ 자체이다.
      선택지 4: (마)는 GOTO(I₀, ( )이다.

      핵심 개념:
      GOTO(I, X)는 점 뒤 기호가 X인 항목만 골라 점을 옮긴 뒤 closure를 구한다.
      [T → T·*F]처럼 점 뒤가 터미널이면 closure로 추가할 항목이 없다.
