  - id: e18-23
    type: multiple-choice
    chapter: 5
    passageRefs: [g18-lr0-01, g18-slr-goto-01, g18-slr-table-01]
    prompt: ‘나’에 알맞은 내용은?
    choices:
      - { id: '1', text: 'S4' }
      - { id: '2', text: 'S5' }
      - { id: '3', text: 'S6' }
      - { id: '4', text: 'S7' }
    answers: ['4']
    explanation: |
      선택지 1: S4는 ( 에 대한 shift이다.
      선택지 2: S5는 id에 대한 shift이다.
      선택지 3: S6은 I₁이나 I₈에서 +를 읽을 때의 동작이다.
      선택지 4: I₂에서 *를 읽으면 I₇로 전이하므로 ACTION[2, *] = S7이다.

      핵심 개념:
      I₂ = {[E → T·], [T → T·*F]}는 *에서 shift, FOLLOW(E)에서 reduce를 가진다.
      FOLLOW(E) = { +, ), ＄ }에는 *가 없으므로 충돌이 없다.
      SLR은 FOLLOW로 reduce 위치를 제한해 shift/reduce 충돌을 줄인다.
      그래서 이 식 문법은 SLR(1) 문법이다.
