    answers: ['1']
    explanation: |
      선택지 1: I7 = {[C → d·, ＄]}는 lookahead ＄에서 C → d(3번 규칙)로 환원한다. ACTION[7, ＄] = r3이다.
      선택지 2: 이 문법의 규칙은 S → CC, C → cC, C → d 세 개뿐이므로 r5는 없다.
      선택지 3: r6도 존재하지 않는 규칙 번호이다.
      선택지 4: r7은 규칙 번호가 아니다. S7(shift 7)과 혼동하지 않아야 한다.

      핵심 개념:
      CLR에서 완료 항목 [A → α·, a]는 lookahead a 칸에만 reduce를 넣는다.
      I4는 lookahead c/d, I7은 ＄이므로 같은 C → d라도 reduce 위치가 다르다.
      reduce 번호 rk의 k는 규칙 번호, shift 번호 Sj의 j는 상태 번호이다.
