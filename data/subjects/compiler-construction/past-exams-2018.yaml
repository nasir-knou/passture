    answers: ['2']
    explanation: |
      선택지 1: S6은 상태 2에서 c를 읽을 때의 동작으로 이미 표에 있다.
      선택지 2: I2에서 d를 읽으면 I7로 전이하므로 ACTION[2, d] = S7이다.
      선택지 3: r3(C → d)은 I4, I7처럼 완료 항목 [C → d·]가 있는 상태에서 나온다.
