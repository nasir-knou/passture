    prompt: 다음은 top-down 구문분석에서 predictive 파싱표를 구성하는 과정이다. (가)에 들어갈 내용은?
    choices:
      - { id: '1', text: 'S → iCtSS′' }
      - { id: '2', text: 'S → a' }
      - { id: '3', text: 'S′ → ε' }
