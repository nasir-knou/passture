  - id: b05-63
    type: multiple-choice
    prompt: SLR 방법에서 충돌문제 발생에 대한 설명이다. ==잘못== 설명된 것은?
    choices:
      - { id: '1', text: 'CLR 방법을 사용하면 해결된다.' }
      - { id: '2', text: 'LALR 방법을 사용하면 해결된다.' }
      - { id: '3', text: '파싱표에서 shift와 reduce가 동시에 발생하는 항목이 발생한다.' }
      - { id: '4', text: 'lookahead 정보만으로는 부족하기 때문에 follow 집합을 사용해야 된다.' }
    answers: ['4']
    explanation: |
      선택지 1: CLR(Canonical LR) 방법은 LR(1) 항목의 lookahead로 reduce 칸을 정하므로 SLR에서 생기는 충돌을 해결할 수 있다.
      선택지 2: LALR(Look-Ahead LR) 방법도 lookahead 정보를 사용해 reduce 칸을 정하므로 SLR 충돌을 해결할 수 있다.
      선택지 3: SLR 충돌은 한 칸에 shift와 reduce가 함께 들어가는(shift-reduce) 형태로 나타나므로 옳은 설명이다.
      선택지 4: 반대로 설명했다. 충돌은 FOLLOW 집합만으로 reduce 칸을 정하기 때문에 생기며, 이를 해결하려면 FOLLOW 대신 lookahead 정보를 사용해야 한다.

      핵심 개념:
      SLR은 LR(0) 항목과 FOLLOW 집합으로 파싱표를 만든다.
      [A → α·]가 있는 상태에서 FOLLOW(A)의 모든 기호에 reduce를 넣으므로, 그 상태에서 실제로 A 다음에 올 수 없는 기호에도 reduce가 들어가 충돌이 생긴다.
      CLR과 LALR은 항목마다 lookahead를 붙여 그 상태에서 실제로 올 수 있는 기호에만 reduce를 넣는다.
      문법에 따라 강력함은 SLR < LALR < CLR 순이다.

  # ---- 5.2.6 CLR 구문분석 (1~4): CLR 그래프로 파싱표 구성 ----
  - id: b05-64
    type: multiple-choice
    passageRefs: [gwbd-clr-grammar-01, gwbd-clr-graph-01, gwbd-clr-items-01, gwbd-clr-table-01]
    prompt: 다음은 CLR 그래프를 이용하여 파싱표를 구성하는 과정이다. (가)에 알맞은 것은?
    choices:
      - { id: '1', text: 'S3' }
      - { id: '2', text: 'S4' }
      - { id: '3', text: 'S6' }
      - { id: '4', text: 'S7' }
    answers: ['2']
    explanation: |
      선택지 1: S3은 I₀에서 c에 의해 I₃로 가는 행동으로 [0, c] 칸에 이미 들어가 있다.
      선택지 2: (가)는 [0, d] 칸이다. CLR 그래프에서 I₀가 d에 의해 도달하는 곳은 I₄이므로 S4이다.
      선택지 3: S6은 I₂나 I₆에서 c에 의해 I₆으로 가는 행동이며, I₀의 전이가 아니다.
      선택지 4: S7은 I₂나 I₆에서 d에 의해 I₇로 가는 행동이다. I₀의 d 전이는 lookahead가 c/d인 I₄로 간다.

      핵심 개념:
      CLR 파싱표의 shift 칸은 CLR 그래프(LR(1) 항목 집합의 canonical collection)의 터미널 전이로 채운다.
      GOTO(Iᵢ, a) = Iⱼ이고 a가 터미널이면 ACTION[i, a] = Sj이다.
      논터미널 전이 GOTO(Iᵢ, A) = Iⱼ는 GOTO 부분 [i, A] = j가 된다.
      core가 같아도 lookahead가 다르면 별도 상태(I₄와 I₇, I₃와 I₆)가 된다.

