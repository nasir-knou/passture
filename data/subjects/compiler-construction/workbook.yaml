      선택지 2: 예약어는 DO, IF, WHILE처럼 언어에서 미리 정의된 단어로 토큰의 한 종류이다.
      선택지 3: 피연산자는 연산의 대상이라는 의미상 역할을 가리키는 말로, 토큰의 종류가 아니다.
