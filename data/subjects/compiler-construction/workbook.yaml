    answers: ['4']
    explanation: |
      선택지 1: 단순순위 문법은 ε-생성규칙을 갖지 않으므로 관계있는 조건이다.
      선택지 2: 오른쪽 부분이 같은 생성규칙이 있으면 핸들을 어떤 논터미널로 환원할지 정할 수 없으므로, 단순순위 문법은 이런 규칙을 허용하지 않는다.
      선택지 3: 단순순위 문법은 두 기호 사이에 많아야 한 개의 Wirth-Weber 순위관계를 가지므로 관계있는 조건이다.
      선택지 4: 두 문자열 x, y 사이에 많아야 한 개의 순위관계를 갖는 것은 확장순위 문법에 대한 설명이므로 단순순위 문법과 관계없다.

      핵심 개념:
      단순순위 문법의 세 조건은 ε-생성규칙 없음, 오른쪽이 같은 생성규칙 없음, 두 기호 사이 순위관계가 많아야 한 개이다.
      Wirth-Weber 순위관계는 문법의 모든 기호(터미널, 논터미널) 사이에 정의되는 ⋖, ≐, ⋗ 관계이다.
      확장순위 문법은 기호 대신 문자열 사이의 관계로 조건을 넓힌 것이다.
      순위관계가 충돌 없이 하나로 정해져야 결정적으로 핸들을 찾을 수 있다.
    tags: [simple-precedence-grammar]

  - id: b05-21
