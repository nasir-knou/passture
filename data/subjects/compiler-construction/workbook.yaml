    answers: ['2']
    explanation: |
      선택지 1: S → aB → abC → abd로 생성된다.
      선택지 2: S → aB → abC → abaC → …로 진행하면 C 뒤에는 a 또는 d만 올 수 있어 두 번째 b를 만들 수 없다. 따라서 ababd는 생성될 수 없다.
      선택지 3: S → aS → aaB → aabC → aabaC → aabad로 생성된다.
      선택지 4: S → aB → abC → abaC → abaaC → abaaaC → abaaad로 생성된다.

      핵심 개념:
      S = a*aba*d 형태이므로 b는 정확히 한 번 나온다.
      S는 a를 반복한 뒤 B로 넘어가고, B는 b를 한 번 만든다.
      C는 a를 반복한 뒤 d로 끝난다.
      b가 두 번 이상 나오는 문자열은 생성되지 않는다.
    tags: [derivation, regular-grammar]
    
  - id: b02-24
    type: multiple-choice
    passageRefs: [gwba-grammar-as-ab-d-01]
    prompt: 문법 G가 생성하는 언어를 정규표현으로 표현한 것은?
    choices:
      - { id: '1', text: '$a^*bd^*$' }
      - { id: '2', text: '$a^*aba^*d$' }
      - { id: '3', text: '$a^*ab^*a^*d$' }
      - { id: '4', text: '$(a+b)^*aba^*d$' }
    answers: ['2']
    explanation: |
      선택지 1: $a^*bd^*$는 d를 반복할 수 있고 b 앞의 a가 없어도 되는데, 문법에서는 d가 정확히 한 번, b 바로 앞에 a가 반드시 있다.
      선택지 2: C = aC + d에서 C = a*d, B = bC = ba*d, S = aS + aB = aS + aba*d에서 S = a*aba*d이다.
      선택지 3: $a^*ab^*a^*d$는 b를 0번 또는 여러 번 허용하지만 문법에서는 b가 정확히 한 번 나온다.
      선택지 4: $(a+b)^*$로 시작하면 b가 앞부분에 여러 번 올 수 있어 L(G)보다 큰 언어가 된다.

      핵심 개념:
      정규표현 방정식은 뒤에 있는 논터미널부터 풀어 대입한다.
      C = aC + d ⟹ C = a*d.
      B = bC ⟹ B = ba*d.
      S = aS + aB ⟹ S = a*aba*d.
    tags: [regular-expression, regular-grammar]

