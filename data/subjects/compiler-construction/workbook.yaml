      생성규칙 A → 0A | 1은 방정식 A = 0A + 1로 바꾼다.
      X = αX + β의 해는 X = α*β이다.
      A = 0*1을 S = 1A에 대입하면 S = 10*1이다.
      정규문법 → 정규표현 변환은 정규표현 방정식으로 푼다.
