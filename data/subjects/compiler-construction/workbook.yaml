      bottom-up 구문분석: shift-reduce 구문분석, 연산자 우선순위 구문분석, LR 구문분석(SLR, CLR, LALR).
      CLR은 lookahead를 구해야 하므로 과정이 복잡하고 시간이 오래 걸리며 파싱표가 커진다는 단점이 있다.
