      선택지 2: 3단계 문장형 E - E + id는 2단계 E - E + E의 가장 오른쪽 E에 E → id를 적용한 결과이므로 핸들 (id) 표시가 옳다.
      선택지 3: 5단계 문장형 id - id + id는 4단계 E - id + id의 E에 E → id를 적용한 결과이므로 가장 왼쪽 id가 핸들이며 표시가 옳다.
