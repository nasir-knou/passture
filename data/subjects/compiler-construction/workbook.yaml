    answers: ['2']
    explanation: |
      선택지 1: S → iCtSS′는 FIRST(iCtSS′) = {i}이므로 M[S, i]에 들어가며 (나)에 해당한다.
      선택지 2: (가)는 M[S, a]이다. 2) S → a에서 FIRST(a) = {a}이므로 M[S, a] := S → a이다.
      선택지 3: S′ → ε는 FOLLOW(S′) = {\$, e} 칸인 M[S′, \$], M[S′, e]에 들어간다. S 행이 아니다.
      선택지 4: C → b는 FIRST(b) = {b}이므로 M[C, b]에 들어간다.

      핵심 개념:
      알고리즘: 각 A → α에 대해 a ∈ FIRST(α)이면 M[A, a] := A → α이다.
      α ⟹ ε이면 b ∈ FOLLOW(A)인 각 b에 대해 M[A, b] := A → α이다.
      이 문법은 if-then-else(i: if, t: then, e: else)를 추상화한 문법이다.
      오른쪽이 터미널로 시작하는 규칙은 그 터미널 칸 하나에만 들어간다.

  - id: b05-95
    type: multiple-choice
