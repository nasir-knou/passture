    answers: ['2']
    explanation: |
      선택지 1: 어휘분석기는 원시 프로그램을 받아 토큰을 넘기는 B 자리에 온다. 문법규칙을 받아 구문분석기를 만드는 A 자리는 YACC이다.
      선택지 2: A는 문법규칙과 수행코드를 입력받아 구문분석기를 생성하므로 YACC(Yet Another Compiler-Compiler)이고, B는 원시 프로그램을 읽어 토큰을 구문분석기에 넘기므로 어휘분석기이다.
      선택지 3: 원시코드는 입력 데이터일 뿐 구문분석기를 생성하는 도구가 아니며, YACC는 토큰을 만드는 B의 역할을 하지 않는다.
      선택지 4: LALRGen도 구문분석기 생성기 계열로 토큰을 만드는 어휘분석기 자리(B)에 맞지 않고, A에 어휘분석기가 오는 것도 틀리다.

      핵심 개념:
      YACC는 구문분석기 생성기(parser generator)이다.
      입력으로 문법규칙과 각 규칙의 수행코드를 받아 LALR(1) 구문분석기를 만든다.
      생성된 구문분석기는 어휘분석기(보통 LEX로 생성)가 넘겨주는 토큰을 받아 분석한다.
      출력은 수행코드에 의해 생성된 구문분석기의 결과이다.

  - id: b05-97
    type: multiple-choice
    prompt: 벨연구소에서 스티븐 C. 존슨(Stephen C. Johnson)을 중심으로 개발된 LALR(1) 구문분석기 생성기로 선언(declaration) 부분, 변환규칙(translation rules) 부분, 사용자 프로그램(user program) 부분 등의 세 부분으로 구성된 것은?
    choices:
      - { id: '1', text: 'LEX' }
      - { id: '2', text: 'ScanGen' }
      - { id: '3', text: 'YACC' }
      - { id: '4', text: 'LALRGen' }
    answers: ['3']
    explanation: |
      선택지 1: LEX는 정규표현으로 기술한 토큰 규칙에서 어휘분석기를 생성하는 어휘분석기 생성기이다.
      선택지 2: ScanGen은 스캐너(어휘분석기) 생성기로 구문분석기 생성기가 아니다.
      선택지 3: YACC는 1975년 벨연구소에서 스티븐 C. 존슨을 중심으로 개발된 LALR(1) 구문분석기 생성기로, 입력이 선언 부분 %% 변환규칙 부분 %% 사용자 프로그램 부분으로 구성된다.
      선택지 4: LALRGen도 LALR 구문분석기 생성기의 한 종류이지만 문제에서 말한 벨연구소·스티븐 C. 존슨의 도구는 YACC이다.

      핵심 개념:
      선언 부분: 토큰(%token), 시작 기호(%start), 타입을 선언하고 %{ … %} 안에 C 코드를 적는다. 토큰 이름은 관례적으로 대문자, =, +, − 같은 단일 문자는 선언 없이 쓴다.
      변환규칙 부분: BNF(Backus-Naur Form)와 유사하게 문법규칙(생성규칙)과 각 규칙의 수행코드를 기술한다.
      터미널 기호는 어휘분석기가 리턴한 토큰으로 보통 대문자, 논터미널 기호는 보통 소문자로 나타낸다.
      사용자 프로그램 부분에는 어휘분석기, 오류 처리 루틴 등 보조 함수를 적는다.
      (원문 문제와 해설에는 declation으로 인쇄되어 있으나, 원문 해설의 그림에도 declaration part로 나오듯 declaration의 오식이므로 바로잡았다.)

  - id: b06-01
