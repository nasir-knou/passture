    answers: ['3']
    explanation: |
      선택지 1: S → 0으로 바로 생성된다.
      선택지 2: S → 0AS → 0SSS → 0000으로 생성된다.
      선택지 3: 0010 형태는 만들 수 없다. S는 항상 0으로 끝나므로 0AS에서 S = 0, A = 01이어야 하는데 A는 01을 유도할 수 없다.
      선택지 4: S → 0AS → 0S1AS → 0S1SSS → 001000으로 생성된다.

      핵심 개념:
      생성 여부는 시작기호에서 직접 유도해 확인한다.
      S → 0AS, S → 0이므로 S가 유도하는 문자열은 항상 0으로 시작하고 0으로 끝난다.
      A → 10, A → S1A, A → SS로는 01을 만들 수 없다.
      만들 수 없음을 보일 때는 문자열의 앞뒤 구조 같은 불변 성질을 이용한다.
    tags: [derivation, context-free-grammar]

