      - { id: '2', text: 'TE′' }
      - { id: '3', text: 'FT′' }
      - { id: '4', text: 'TT′' }
    answers: ['3']
    explanation: |
      선택지 1: T*T′는 T로 시작하므로 left-recursion이 남고, 반복 부분은 *F여야 한다.
      선택지 2: TE′는 E의 left-recursion을 제거한 결과로 (가)에 해당한다.
      선택지 3: T → T*F | F는 맨 앞에 F가 나오고 *F가 반복되므로 T → FT′, T′ → *FT′ | ε이다.
      선택지 4: TT′는 T로 시작하므로 left-recursion이 제거되지 않는다.

      핵심 개념:
      T → T*F ⇒ T*F*F ⇒ … ⇒ F*F*…*F처럼 가장 앞에 F가 나오고 *F가 반복된다.
      A → Aα | β에서 α = *F, β = F이므로 T → FT′, T′ → *FT′ | ε이다.
      새 비단말 T′가 반복 부분을 오른쪽 재귀로 표현한다.
      변환 후 문법은 같은 언어를 생성하면서 top-down 구문분석이 가능하다.

