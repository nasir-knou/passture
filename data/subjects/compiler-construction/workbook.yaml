    prompt: 다음은 top-down 구문분석에서 predictive 파싱표를 구성하는 과정이다. (가)에 알맞은 것을 구하면?
    choices:
      - { id: '1', text: 'E′ → ε' }
      - { id: '2', text: 'E′ → +TE′' }
      - { id: '3', text: 'T′ → ε' }
      - { id: '4', text: 'T′ → *FT′' }
    answers: ['2']
    explanation: |
      선택지 1: E′ → ε는 FOLLOW(E′) = {), \$} 칸에 들어가며 + 칸이 아니다.
      선택지 2: (가)는 M[E′, +]이다. 2) E′ → +TE′에서 FIRST(+TE′) = {+}이므로 M[E′, +] := E′ → +TE′이다.
      선택지 3: T′ → ε는 T′ 행에 들어가는 규칙이다. E′ 행과 관계없다.
      선택지 4: T′ → *FT′도 T′ 행의 * 칸에 들어가는 규칙이다.

      핵심 개념:
      각 생성규칙 A → α에 대해 FIRST(α)의 각 터미널 a 칸 M[A, a]에 그 규칙을 넣는다.
      오른쪽이 터미널로 시작하면 FIRST(α)는 그 터미널 하나이다.
      E′의 두 규칙은 + 칸(E′ → +TE′)과 ), \$ 칸(E′ → ε)으로 나뉘어 한 칸에 두 규칙이 겹치지 않는다.
      모든 칸에 규칙이 최대 하나씩이면 LL(1) 문법이다.

  - id: b05-92
    type: multiple-choice
    passageRefs: [gwbd-ll-grammar-02, gwbd-ll-table-02]
    prompt: 다음은 top-down 구문분석에서 predictive 파싱표를 구성하는 과정이다. (나)에 알맞은 것을 구하면?
    choices:
      - { id: '1', text: 'E′ → ε' }
      - { id: '2', text: 'E′ → +TE′' }
      - { id: '3', text: 'T′ → ε' }
      - { id: '4', text: 'T′ → *FT′' }
    answers: ['4']
    explanation: |
      선택지 1: E′ → ε는 E′ 행의 ), \$ 칸에 들어간다.
      선택지 2: E′ → +TE′는 E′ 행의 + 칸에 들어간다.
      선택지 3: T′ → ε는 FOLLOW(T′) = {+, ), \$} 칸에 들어가며 * 칸이 아니다.
      선택지 4: (나)는 M[T′, *]이다. 5) T′ → *FT′에서 FIRST(*FT′) = {*}이므로 M[T′, *] := T′ → *FT′이다.

      핵심 개념:
      T′ → *FT′ | ε처럼 ε-규칙이 있는 논터미널은 FIRST와 FOLLOW를 함께 써서 행을 채운다.
      FIRST(*FT′) = {*} 칸에는 T′ → *FT′, FOLLOW(T′) = {+, ), \$} 칸에는 T′ → ε가 들어간다.
      {*}와 {+, ), \$}가 겹치지 않으므로 충돌이 없다.
      이렇게 완성한 표로 스택과 입력을 비교하며 결정적으로 구문분석한다.

  - id: b05-93
    type: multiple-choice
    passageRefs: [gwbd-ll-grammar-02, gwbd-ll-table-full-01, gwbd-ll-trace-01]
    prompt: 계속해서 다음은 파싱표를 보고 문자열 id+id*id에 대해서 구문분석을 하는 과정이다. (가), (나), (다), (라)에 알맞은 것은?
    choices:
      - { id: '1', text: '1, 4, 6, 8' }
      - { id: '2', text: '1, 4, 8, 6' }
      - { id: '3', text: '1, 6, 8, 4' }
      - { id: '4', text: '4, 6, 8, 1' }
    answers: ['2']
    explanation: |
      선택지 1: 세 번째 칸은 F와 id가 만나는 M[F, id] = F → id(8번)이고 네 번째 칸이 T′와 +의 6번이다. 6과 8의 순서가 바뀌었다.
      선택지 2: (가) M[E, id] = E → TE′(1번), (나) M[T, id] = T → FT′(4번), (다) M[F, id] = F → id(8번), (라) M[T′, +] = T′ → ε(6번)이므로 1, 4, 8, 6이다.
      선택지 3: (나)에서 스택 top이 T이고 입력이 id이면 T → FT′(4번)를 적용해야 하는데 6번을 적었다.
      선택지 4: 처음 스택 top은 E이므로 첫 규칙은 E 행의 1번이어야 하는데 4번으로 시작했다.

      핵심 개념:
      predictive 구문분석은 스택 top 논터미널 X와 현재 입력 a로 M[X, a]를 찾아 X를 규칙 오른쪽으로 바꾼다.
      오른쪽은 역순으로 스택에 넣는다(E → TE′이면 E′, T 순으로 넣어 T가 top).
      스택 top이 터미널이고 입력과 같으면 둘 다 제거(매칭)하고, 스택과 입력이 모두 \$ 이면 성공이다.
      적용된 규칙 번호를 순서대로 모은 것이 좌파스이다.

