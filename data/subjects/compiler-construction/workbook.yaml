      - { id: '4', text: 'id ⋗ id' }
    answers: ['3']
    explanation: |
      선택지 1: * ⋖ id는 T*F에서 F → id를 적용한 (가) 단계의 관계이다.
      선택지 2: id와 F는 한 문장형 안에서 나란히 나오지 않으며, F가 id를 유도하는 부모-자식 관계일 뿐 순위관계가 아니다.
      선택지 3: F*id에서 F → id를 적용해 id*id가 되었다. 왼쪽 id는 * 보다 늦게 유도된 부분의 오른쪽 끝이므로 id ⋗ *가 성립한다.
      선택지 4: 문장형 id*id에서 두 id 사이에는 *가 있으므로 id와 id가 인접하지 않아 둘 사이의 관계는 정의되지 않는다.

      핵심 개념:
      순위관계는 어떤 문장형에서 서로 인접하는 두 기호 사이에만 정의된다.
      T*F를 T*id → F*id → id*id로 유도하면 * ⋖ id, F ⋗ *, id ⋗ *가 차례로 생긴다.
      유도트리에서 비교 대상 기호보다 더 늦게 유도된 기호의 순위가 높다.
      구문분석 시 id*id에서는 id ⋗ * 이므로 왼쪽 id를 먼저 핸들로 환원한다.
    tags: [simple-precedence-parsing, precedence-relation]

  # ===== 5.2.4 LR 구문분석 / 5.2.5 SLR 구문분석 =====
  - id: b05-42
    type: multiple-choice
    passageRefs: [gwbc-lr0-01]
    prompt: 다음은 LR(0) 항목 집합의 canonical collection을 구하는 과정이다. I₀를 보기에서 고르면?
    choices:
      - { id: '1', text: '(가)' }
      - { id: '2', text: '(나)' }
      - { id: '3', text: '(다)' }
      - { id: '4', text: '(라)' }
    answers: ['4']
    explanation: |
      선택지 1: (가) {[T → F·]}는 I₀에서 F를 읽고 이동한 GOTO(I₀, F) = I₃이다.
      선택지 2: (나) {[S′ → E·], [E → E·+T]}는 I₀에서 E를 읽고 이동한 GOTO(I₀, E) = I₁이다.
      선택지 3: (다) {[E → T·], [T → T·*F]}는 I₀에서 T를 읽고 이동한 GOTO(I₀, T) = I₂이다.
      선택지 4: I₀ = closure([S′ → ·E])는 [S′ → ·E]에서 점 뒤의 E, T, F 생성규칙 항목을 모두 추가해 {[S′ → ·E], [E → ·E+T], [E → ·T], [T → ·T*F], [T → ·F], [F → ·(E)], [F → ·id]}가 된다.

      핵심 개념:
      LR(0)(Left-to-right scan, Rightmost derivation, 0-symbol lookahead) 항목은 생성규칙 오른쪽에 점(·)을 찍어 구문분석 진행 위치를 나타낸 것이다.
      closure(I)는 [A → α·Bβ]가 있으면 B의 모든 생성규칙 [B → ·γ]를 더하는 과정을 더 이상 추가가 없을 때까지 반복한다.
      증가문법의 [S′ → ·E]의 closure가 시작 상태 I₀이다.
      I₀에서 각 기호에 대한 GOTO를 구해 나가면 canonical collection이 만들어진다.
    tags: [lr0-item, canonical-collection, closure]

  - id: b05-43
    type: multiple-choice
    passageRefs: [gwbc-lr0-01]
    prompt: I₁을 보기에서 고르면?
    choices:
      - { id: '1', text: '(가)' }
      - { id: '2', text: '(나)' }
      - { id: '3', text: '(다)' }
      - { id: '4', text: '(라)' }
    answers: ['2']
    explanation: |
      선택지 1: (가)는 점 뒤에 F가 있던 항목 [T → ·F]를 이동한 GOTO(I₀, F) = I₃이다.
      선택지 2: I₀에서 점 뒤에 E가 있는 항목은 [S′ → ·E], [E → ·E+T]이므로 GOTO(I₀, E) = closure{[S′ → E·], [E → E·+T]} = {[S′ → E·], [E → E·+T]}이다.
      선택지 3: (다)는 점 뒤에 T가 있던 항목을 이동한 GOTO(I₀, T) = I₂이다.
      선택지 4: (라)는 시작 상태 I₀ 자체이다.

      핵심 개념:
      GOTO(I, X)는 I에서 점 바로 뒤에 X가 있는 항목들의 점을 X 뒤로 옮긴 뒤 closure를 구한 집합이다.
      점 뒤에 논터미널이 없으면 closure로 더해지는 항목이 없다.
      I₁의 [S′ → E·]는 입력 끝 \$에서 accept 동작이 된다.
      [E → E·+T]는 + 에 대한 이동 GOTO(I₁, +) = I₆으로 이어진다.
    tags: [lr0-item, canonical-collection, goto-function]

  - id: b05-44
    type: multiple-choice
    passageRefs: [gwbc-lr0-01]
    prompt: I₂를 보기에서 고르면?
    choices:
      - { id: '1', text: '(가)' }
      - { id: '2', text: '(나)' }
      - { id: '3', text: '(다)' }
      - { id: '4', text: '(라)' }
    answers: ['3']
    explanation: |
      선택지 1: (가) {[T → F·]}는 F를 읽은 GOTO(I₀, F) = I₃이다.
      선택지 2: (나)는 E를 읽은 GOTO(I₀, E) = I₁이다.
      선택지 3: I₀에서 점 뒤에 T가 있는 항목은 [E → ·T], [T → ·T*F]이므로 GOTO(I₀, T) = closure{[E → T·], [T → T·*F]} = {[E → T·], [T → T·*F]}이다.
      선택지 4: (라)는 closure([S′ → ·E])로 구한 시작 상태 I₀이다.

      핵심 개념:
      같은 기호 X를 점 뒤에 둔 항목이 여러 개이면 GOTO(I, X)에는 그 항목들이 모두 함께 이동한다.
      I₂에는 완료 항목 [E → T·](reduce)와 이동 항목 [T → T·*F](shift)가 함께 있다.
      LR(0)만으로는 이 상태에서 reduce와 shift 중 무엇을 할지 정할 수 없어 충돌이 생긴다.
      SLR은 FOLLOW(E)에 속하는 기호에서만 reduce하도록 해 이 충돌을 해결한다.
    tags: [lr0-item, canonical-collection, goto-function]

  - id: b05-45
    type: multiple-choice
    passageRefs: [gwbc-lr0-01]
    prompt: I₃를 보기에서 고르면?
    choices:
      - { id: '1', text: '(가)' }
      - { id: '2', text: '(나)' }
      - { id: '3', text: '(다)' }
      - { id: '4', text: '(라)' }
    answers: ['1']
    explanation: |
      선택지 1: I₀에서 점 뒤에 F가 있는 항목은 [T → ·F] 하나뿐이므로 GOTO(I₀, F) = closure{[T → F·]} = {[T → F·]}이다.
      선택지 2: (나)는 E를 읽은 GOTO(I₀, E) = I₁이다.
      선택지 3: (다)는 T를 읽은 GOTO(I₀, T) = I₂이다.
      선택지 4: (라)는 시작 상태 I₀이다.

      핵심 개념:
      점이 생성규칙 오른쪽 끝에 있는 항목 [A → α·]를 완료 항목(reduce 항목)이라 한다.
      I₃ = {[T → F·]}은 완료 항목만 있으므로 FOLLOW(T)의 기호에서 T → F로 reduce한다.
      I₀의 GOTO는 E → I₁, T → I₂, F → I₃, ( → I₄, id → I₅이다.
      이렇게 모든 상태와 GOTO를 구한 것이 canonical collection이며, 이것으로 SLR 파싱표를 만든다.
    tags: [lr0-item, canonical-collection, goto-function]

