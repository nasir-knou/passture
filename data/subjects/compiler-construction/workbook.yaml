  # ---- 5.2.6 (9~12): CLR 파싱표 구성 ----
  - id: b05-72
    type: multiple-choice
    passageRefs: [gwbd-clr-grammar-01, gwbd-clr-graph-01, gwbd-clr-items-01, gwbd-clr-table-02]
    prompt: 다음은 CLR 그래프를 이용하여 파싱표를 구성하는 과정이다. (가)에 알맞은 것은?
    choices:
      - { id: '1', text: 'S6' }
