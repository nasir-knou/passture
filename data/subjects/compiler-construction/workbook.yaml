      선택지 2: A → b에서 First(A) ⊇ {b}, A → SbA에서 First(A) ⊇ First(S) = {b, a}이므로 First(A) = {b, a}이다.
      선택지 3: A와 S에는 ε-생성규칙이 없으므로 ε은 First(A)에 들어가지 않는다.
      선택지 4: 입력 끝 표시(\$)는 FIRST 집합의 원소가 아니다.

      핵심 개념:
      비단말의 FIRST는 각 생성규칙 오른쪽의 첫 기호로부터 구한다.
      첫 기호가 비단말이면 그 비단말의 FIRST를 포함한다.
      ε은 해당 비단말이 빈 문자열을 유도할 수 있을 때만 FIRST에 넣는다.
      First(S) = {b, a}를 먼저 구한 뒤 First(A)를 구한다.

  - id: b04-17
    type: multiple-choice
    passageRefs: [gwbb-deriv-03]
    prompt: 다음은 bbbba를 좌단유도하는 과정이다. ==관계없는== 것은?
    choices:
      - { id: '1', text: 'bAS' }
      - { id: '2', text: 'bbS' }
      - { id: '3', text: 'bbbAS' }
      - { id: '4', text: 'bAbAS' }
    answers: ['4']
    explanation: |
      선택지 1: 시작기호 S에 S → bAS를 적용한 첫 문장형이므로 좌단유도 과정에 포함된다.
      선택지 2: bAS의 가장 왼쪽 비단말 A에 A → b를 적용한 문장형이므로 포함된다.
      선택지 3: bbS의 S에 S → bAS를 적용한 문장형이므로 포함된다.
      선택지 4: bAbAS는 왼쪽 A를 남긴 채 오른쪽 S를 먼저 대치한 문장형으로, 우단유도 과정에 나타나며 좌단유도와는 관계없다.

      핵심 개념:
      좌단유도는 매 단계에서 가장 왼쪽 비단말을 대치한다.
      bbbba의 좌단유도는 S ⇒ bAS ⇒ bbS ⇒ bbbAS ⇒ bbbbS ⇒ bbbba 이다.
      같은 문장의 우단유도는 S ⇒ bAS ⇒ bAbAS ⇒ bAbAa ⇒ bAbba ⇒ bbbba 이다.
      두 유도의 중간 문장형을 비교하면 좌단·우단유도에만 나타나는 문장형을 구분할 수 있다.

  - id: b04-18
    type: multiple-choice
    passageRefs: [gwbb-deriv-03]
    prompt: 다음은 bbbba를 우단유도하는 과정이다. ==관계없는== 것은?
    choices:
      - { id: '1', text: 'bAS' }
      - { id: '2', text: 'bAbAS' }
      - { id: '3', text: 'bbbAS' }
