      선택지 1: 1은 I₀에서 논터미널 E로 이동한 I₁의 번호로 GOTO E 칸에 들어간다.
      선택지 2: 2는 I₀에서 논터미널 T로 이동한 I₂의 번호로 GOTO T 칸에 들어간다.
      선택지 3: GOTO 그래프에서 I₀는 논터미널 F에 의해 I₃로 이동하므로 상태 0의 GOTO F 칸은 3이다.
      선택지 4: 4는 터미널 ( 로 이동한 I₄의 번호로, GOTO 함수 칸이 아니라 ACTION 칸에 S4로 들어간다.

      핵심 개념:
      논터미널 A에 대해 GOTO(Iᵢ, A) = Iⱼ이면 파싱표의 GOTO[i, A] = j이다.
      상태 0의 GOTO 함수는 E → 1, T → 2, F → 3이다.
      GOTO 칸은 reduce 후 환원된 논터미널을 스택에 올릴 때 다음 상태를 정하는 데 쓰인다.
      상태 4와 6, 7에서도 F에 대해 GOTO가 각각 3, 3, 10으로 정해진다.
    tags: [slr-parsing, parsing-table, goto-function]

  # ---- 5.2.5 SLR 구문분석 (18~21): 파싱표를 이용한 id+id 구문분석 ----
  - id: b05-59
    type: multiple-choice
    passageRefs: [gwbd-slr-table-01, gwbd-slr-trace-01]
    prompt: 파싱표를 이용하여 문장 id+id를 구문분석하는 과정이다. (가)의 내용은?
    choices:
      - { id: '1', text: 'shift 5' }
      - { id: '2', text: 'reduce 4' }
      - { id: '3', text: 'goto 3' }
      - { id: '4', text: 'reduce 6' }
    answers: ['1']
    explanation: |
      선택지 1: 0단계는 스택 top이 상태 0이고 입력기호가 id이다. 파싱표에서 [0, id] 칸을 찾으면 S5이므로 id를 스택에 넣고 상태 5로 가는 shift 5가 된다.
      선택지 2: reduce 4(T → F 환원)는 상태 3에서 +, *, ), \$ 를 만났을 때의 행동이며, 상태 0에서 id를 만났을 때의 행동이 아니다.
      선택지 3: goto 3은 상태 0에서 환원으로 논터미널 F가 스택에 올라온 뒤 GOTO 함수로 이동하는 행동이다. 아직 아무것도 환원하지 않은 0단계에는 해당하지 않는다.
      선택지 4: reduce 6(F → id 환원)은 상태 5에서 id를 읽은 뒤에 일어나는 행동이다. 0단계에는 아직 id가 스택에 없다.

      핵심 개념:
      SLR(Simple LR) 구문분석기는 LR(Left-to-right scanning, Rightmost derivation) 파싱표의 ACTION 부분(shift/reduce/accept)과 GOTO 부분을 사용한다.
      매 단계 스택 top의 상태와 현재 입력기호로 ACTION[상태, 입력] 칸을 찾아 행동을 정한다.
      Sn은 입력기호를 스택에 넣고 상태 n으로 가는 shift, rn은 n번 생성규칙으로 환원하는 reduce이다.
      환원 뒤에는 스택에 올라온 논터미널과 그 아래 상태로 GOTO 칸을 찾아 새 상태를 넣는다.

