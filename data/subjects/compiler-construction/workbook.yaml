      - { id: '3', text: '중간코드를 이용하여 최적화를 수행함으로써 기계와 독립적인 최적화가 가능해졌으며, 또한 기계코드로 바뀐 상태에서 행하는 것보다 훨씬 효율적인 최적화를 수행할 수 있다.' }
      - { id: '4', text: '중간언어를 사용함으로써 목적코드로 직접 번역하는 것보다 효율적인 코드를 생산한다.' }
    answers: ['4']
    explanation: |
      선택지 1: 중간언어를 두면 앞단은 기계와 무관하게 유지하고 뒷단만 바꿔 여러 기계에 대응할 수 있으므로 이식성이 증가한다.
      선택지 2: 중간코드가 고급 원시언어와 저급 목적코드 사이의 의미적 차이를 이어 주어 번역과정을 단계적으로 쉽게 표현할 수 있다.
      선택지 3: 중간코드 수준에서 최적화하면 기계와 독립적인 최적화가 가능하고 기계코드 상태에서보다 효율적으로 최적화할 수 있다.
      선택지 4: 중간언어를 거치면 목적코드로 직접 번역하는 것보다 오히려 비효율적인 코드를 생산하므로 장점이 아니다.

      핵심 개념:
      중간언어는 원시 프로그램과 목적코드 사이에 두는 중간 단계의 표현이다.
      장점은 이식성 증가, 번역과정의 단순화, 기계 독립적인 최적화이다.
      단점은 목적코드로 직접 번역하는 것보다 비효율적인 코드가 생산될 수 있다는 점이다.
      대표적인 중간언어 형태로 후위표현, 3-주소 코드(triple, quadruple, 간접 triple) 등이 있다.

  - id: b07-02
    type: multiple-choice
    prompt: 산술식 b * c - d에 대한 중간코드를 bc * d - 로 표현한다면 다음 중 관계 있는 것은?
    choices:
      - { id: '1', text: '후위표현' }
      - { id: '2', text: 'triple 표현' }
      - { id: '3', text: '간접 triple 표현' }
      - { id: '4', text: 'quadruple 표현' }
    answers: ['1']
    explanation: |
      선택지 1: bc * d - 는 피연산자 뒤에 연산자를 두는 후위(postfix)표현의 예이다.
      선택지 2: triple 표현은 〈op〉〈피연산자 1〉〈피연산자 2〉 세 필드의 레코드로 표현하며, 결과는 triple 번호로 지칭한다.
      선택지 3: 간접 triple 표현은 triple들과 그 수행순서를 나타내는 별도의 표로 구성되며, 기호열 한 줄로 표현하지 않는다.
      선택지 4: quadruple 표현은 〈op〉〈피연산자 1〉〈피연산자 2〉〈결과〉 네 필드의 레코드로 표현한다.

      핵심 개념:
      후위표현은 연산자를 피연산자 뒤에 두어 괄호 없이 산술식을 표현한다.
      b * c - d는 후위표현으로 bc * d - 가 된다.
      후위표현은 연산자 스택을 이용해 쉽게 계산할 수 있다.
      triple, 간접 triple, quadruple은 3-주소 코드를 레코드로 구현하는 형태이다.

  - id: b07-03
    type: multiple-choice
