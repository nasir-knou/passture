    choices:
      - { id: '1', text: '후위표현' }
      - { id: '2', text: 'triple 표현' }
      - { id: '3', text: '간접 triple 표현' }
      - { id: '4', text: 'quadruple 표현' }
    answers: ['1']
    explanation: |
      선택지 1: 후위표현은 괄호 없이 산술연산자를 표현하고 스택으로 쉽게 연산할 수 있으며 변환이 빨라 인터프리터의 중간언어로 적합하지만, 코드이동을 할 수 없어 최적화에는 부적합하다.
      선택지 2: triple 표현은 3-주소 코드의 한 형태로, 코드이동 시 피연산자로 쓰인 triple 번호를 바꿔야 해 불편하지만 코드이동 자체가 불가능한 것은 아니다.
      선택지 3: 간접 triple 표현은 수행순서 표의 순서만 바꾸면 되므로 최적화를 쉽게 할 수 있도록 한 중간코드이다.
      선택지 4: quadruple 표현은 결과 필드에 임시변수를 두므로 코드이동이 쉬워 최적화에 적합하다.

      핵심 개념:
      후위표현은 연산자 스택으로 계산이 쉽고 원시 프로그램으로부터 변환이 빠르다.
      그래서 인터프리터를 사용하는 언어의 중간언어로 적합하다.
      후위표현은 코드이동을 할 수 없어 최적화에는 부적합하다.
      최적화에는 quadruple이나 간접 triple 같은 3-주소 코드 형태가 유리하다.

