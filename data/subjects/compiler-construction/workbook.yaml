  # ── 4.6 단일 생성규칙의 제거 ──
  - id: b04-37
    type: multiple-choice
    passageRefs: [gwbb-unit-01]
    prompt: 다음 문법은 단일 생성규칙을 갖고 있다. 다음은 이를 효율화시키는 과정의 일부이다. (가)에 알맞은 것은?
    choices:
      - { id: '1', text: 'F' }
      - { id: '2', text: 'T+F' }
      - { id: '3', text: 'T+F | a | b' }
      - { id: '4', text: 'T+F | F' }
    answers: ['3']
    explanation: |
      선택지 1: F는 여전히 단일 생성규칙 E → F로 남으므로 효율화된 결과가 아니다.
      선택지 2: E → T를 T+F로만 바꾸면 T → F를 거쳐 생성되던 a, b가 빠져 언어가 달라진다.
      선택지 3: E → T 자리에 T의 규칙 T+F | F를 쓰고, 다시 단일 생성규칙인 F 자리에 F의 규칙 a | b를 쓰면 E → E*T | T+F | a | b가 된다.
      선택지 4: T+F | F에는 단일 생성규칙 E → F가 남아 있으므로 효율화가 끝나지 않았다.

      핵심 개념:
      단일 생성규칙은 A → B처럼 오른쪽이 논터미널 하나로만 된 생성규칙이다.
      단일 생성규칙을 제거하려면 B의 생성규칙 오른쪽을 A의 규칙으로 그대로 옮겨 쓴다.
      옮겨 쓴 결과에 다시 단일 생성규칙이 있으면 같은 방법을 반복한다.
      단일 생성규칙은 유도 단계를 늘려 효율을 떨어뜨리므로 제거한다.

  - id: b04-38
    type: multiple-choice
    prompt: 생성규칙의 오른쪽이 단 한 개의 논터미널로 구성된 것은?
    choices:
      - { id: '1', text: 'backtracking' }
      - { id: '2', text: 'left-recursion' }
      - { id: '3', text: '단일 생성규칙' }
      - { id: '4', text: 'left-factoring' }
    answers: ['3']
    explanation: |
      선택지 1: backtracking은 top-down 구문분석에서 잘못 적용한 생성규칙을 되돌리고 다른 규칙을 시도하는 현상이다.
      선택지 2: left-recursion은 A → Aα처럼 오른쪽이 자기 자신으로 시작하는 생성규칙이다.
      선택지 3: 단 한 개의 논터미널로 구성되어 있는 생성규칙을 단일 생성규칙이라 하며, 효율을 떨어뜨리므로 제거해 주어야 한다.
      선택지 4: left-factoring은 공통 접두사를 가진 생성규칙들을 묶어 backtracking을 없애는 변환이다.

      핵심 개념:
      단일 생성규칙(unit production)은 A → B 꼴의 생성규칙이다.
      단일 생성규칙은 새로운 문자열을 만들지 않고 유도 단계만 늘린다.
      제거할 때는 B의 생성규칙을 A에 직접 대입한다.
      backtracking, left-recursion, left-factoring과 용어를 구분한다.

  - id: b04-39
    type: multiple-choice
    passageRefs: [gwbb-unit-02]
    prompt: 다음 문법을 단일 생성규칙을 갖지 않는 문법으로 변형하려고 한다. 빈칸에 들어갈 내용으로 ==틀린== 것은?
    choices:
      - { id: '1', text: 'E+T' }
      - { id: '2', text: 'T' }
      - { id: '3', text: '(E)' }
      - { id: '4', text: 'a' }
    answers: ['2']
    explanation: |
      선택지 1: E+T는 단일 생성규칙이 아니므로 그대로 남는다.
      선택지 2: T는 오른쪽이 논터미널 하나인 단일 생성규칙 E → T이므로 제거 대상이다. 빈칸에 들어갈 수 없다.
      선택지 3: T → F의 F 자리에 F → (E)를 대입해 얻은 (E)가 E의 규칙에 들어간다.
      선택지 4: 같은 방법으로 F → a를 대입해 얻은 a가 E의 규칙에 들어간다.

      핵심 개념:
      먼저 T → T*F | F에서 F 대신 오른쪽 규칙을 대입하면 T → T*F | (E) | a가 된다.
      이를 E → E+T | T에 다시 적용하면 E → E+T | T*F | (E) | a가 된다.
      빈칸 네 개는 E+T, T*F, (E), a이다.
      단일 생성규칙은 아래쪽 규칙부터 대입해 올라가면 쉽게 제거할 수 있다.

