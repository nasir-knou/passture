  - id: gwba-dfa-pascal-01
    type: code
    language: text
    highlights: ['finalstate']
    body: |
      program DFA(input, output);
            ⋮
      function delta(s : state; c : sigma) : state;
      function deltabar(s : state) : state;
      function accept : boolean;
        begin
          accept := deltabar( 가 ) in finalstate
        end;
      procedure initialize;
            ⋮
      begin {Start main program DFA.}
        initialize;
        if accept then
                writeln('accepted');
              else
                writeln('rejected');
      end.

