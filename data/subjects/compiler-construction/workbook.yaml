      〈식별자〉 ::= 〈영문자〉{〈영숫자〉}는 영문자 하나 뒤에 영숫자가 0번 이상 반복되는 형태이다.
      EBNF의 { }는 0번 이상의 반복을 나타낸다.
      횟수 제한이 없으므로 길이에 상한이 없다.
      프로그래밍 언어의 식별자는 대개 이처럼 영문자로 시작해야 한다.
    tags: [ebnf, identifier]

  - id: b02-38
    type: multiple-choice
    prompt: '정규표현 방정식 $X = \alpha X + \beta$의 해는?'
    choices:
      - { id: '1', text: '$\alpha^*\beta$' }
      - { id: '2', text: '$\alpha\beta$' }
      - { id: '3', text: '$\alpha\beta + \beta$' }
      - { id: '4', text: '$\alpha\beta^*$' }
    answers: ['1']
    explanation: |
      선택지 1: α, β가 정규표현이고 $\varepsilon \notin \alpha$이면 $X = \alpha X + \beta$의 유일해(unique solution)는 $X = \alpha^*\beta$이다.
      선택지 2: $\alpha\beta$는 α를 정확히 한 번만 붙인 것이어서 α가 0번 또는 여러 번 반복되는 경우를 나타내지 못한다.
      선택지 3: $\alpha\beta + \beta$는 α를 0번 또는 1번 붙인 경우만 나타낸다.
      선택지 4: $\alpha\beta^*$는 β를 반복하는 형태로, 방정식에서 반복되는 것은 α이다.

      핵심 개념:
      X = αX + β를 반복 대입하면 X = β + αβ + ααβ + … = α*β이다.
      이 해가 유일하려면 α가 ε을 포함하지 않아야 한다.
      정규문법을 정규표현으로 바꿀 때 이 해를 반복해서 사용한다.
      X = Xα + β(좌선형)의 해는 X = βα*이다.
    tags: [regular-expression, regular-equation]

  - id: b02-39
    type: multiple-choice
    passageRefs: [gwba-regex-eq-01]
    prompt: 주어진 문법은 촘스키 계층구조에 따르면 어디에 속하는가?
    choices:
      - { id: '1', text: 'type 0' }
      - { id: '2', text: 'type 1' }
      - { id: '3', text: 'type 2' }
      - { id: '4', text: 'type 3' }
    answers: ['4']
    explanation: |
      선택지 1: type 0은 제약이 없는 문법으로, 이 문법은 더 강한 제약을 만족한다.
      선택지 2: type 1은 문맥의존 문법으로, 이 문법은 더 좁은 type 3에 속한다.
      선택지 3: 왼쪽이 하나의 논터미널이므로 type 2도 만족하지만 더 제한된 type 3으로 분류한다.
      선택지 4: S → bA | aS, A → bS | aB, B → cB | a는 모두 우선형이므로 type 3 정규문법이다.

      핵심 개념:
      우선형 규칙으로만 이루어진 문법은 type 3 정규문법이다.
      정규문법은 정규표현 방정식을 세워 정규표현으로 바꿀 수 있다.
      생성규칙 A → α | β는 방정식 A = α + β로 바꾼다.
      방정식은 X = αX + β ⟹ X = α*β를 이용해 푼다.
    tags: [chomsky-hierarchy, regular-grammar]

  - id: b02-40
    type: multiple-choice
    passageRefs: [gwba-regex-eq-01]
    prompt: (가)에 알맞은 것은?
    choices:
      - { id: '1', text: '$a^*b$' }
      - { id: '2', text: '$c^*a$' }
      - { id: '3', text: '$b^*a$' }
      - { id: '4', text: '$a^*c$' }
    answers: ['2']
    explanation: |
      선택지 1: $a^*b$는 X = aX + b의 해로, ③ 식과 형태가 다르다.
      선택지 2: B = cB + a에 X = αX + β ⟹ X = α*β를 적용하면 B = $c^*a$이다.
      선택지 3: $b^*a$는 X = bX + a의 해로, ③ 식의 반복 기호는 b가 아니라 c이다.
      선택지 4: $a^*c$는 반복 기호와 끝 기호를 바꾼 것이다.

      핵심 개념:
      X = αX + β의 해는 X = α*β이다.
      B = cB + a에서 α = c, β = a이다.
      따라서 B = c*a이다.
      자기 자신을 오른쪽에 포함한 방정식부터 풀어 대입한다.
    tags: [regular-equation]

  - id: b02-41
    type: multiple-choice
    passageRefs: [gwba-regex-eq-01]
    prompt: (나)에 알맞은 것은?
    choices:
      - { id: '1', text: '$b+a$' }
      - { id: '2', text: '$bb+a$' }
      - { id: '3', text: '$bb+b$' }
      - { id: '4', text: '$bb+ba$' }
    answers: ['2']
    explanation: |
      선택지 1: b + a는 bbS의 계수 bb를 b로 잘못 묶은 것이다.
      선택지 2: S = bA + aS = b(bS + aB) + aS = bbS + baB + aS = (bb + a)S + baB이므로 (나)는 bb + a이다.
      선택지 3: bb + b는 aS 항의 계수 a를 b로 잘못 쓴 것이다.
      선택지 4: ba는 B에 붙는 계수이지 S의 계수가 아니다.

      핵심 개념:
      ② 식 A = bS + aB를 ① 식 S = bA + aS에 대입한다.
      S를 포함한 항끼리 묶어 S = (bb + a)S + baB로 정리한다.
      이 형태가 X = αX + β이므로 α = bb + a이다.
      항을 묶을 때는 S가 오른쪽 끝에 오는 항만 모은다.
    tags: [regular-equation]

  - id: b02-42
    type: multiple-choice
    passageRefs: [gwba-regex-eq-01]
    prompt: (다)에 알맞은 것은?
    choices:
      - { id: '1', text: '$(b+a)^*abc^*a$' }
      - { id: '2', text: '$(bb+a)^*bac^*a$' }
      - { id: '3', text: '$(bb+b)^*abc^*a$' }
      - { id: '4', text: '$(bb+ba)^*ab(c+a)^*$' }
    answers: ['2']
    explanation: |
      선택지 1: 반복 부분이 (b + a)가 아니라 (bb + a)이고, B의 계수는 ab가 아니라 ba이다.
      선택지 2: S = (bb + a)S + baB에 B = c*a를 대입하면 S = (bb + a)S + bac*a이고, X = αX + β의 해로 S = $(bb+a)^*bac^*a$이다.
      선택지 3: 반복 부분에 aS 항의 a 대신 b가 들어갔고 계수도 ba가 아니다.
      선택지 4: 반복 부분과 뒷부분 모두 방정식의 해와 다르다.

      핵심 개념:
      S = bA + aS = b(bS + aB) + aS = bbS + baB + aS.
      = (bb + a)S + baB = (bb + a)S + bac*a.
      X = αX + β ⟹ X = α*β를 적용하면 S = (bb + a)*bac*a.
      대입 순서: B 풀이 → A를 S에 대입 → B를 대입 → S 풀이.
    tags: [regular-equation, regular-expression]

  - id: b02-43
    type: multiple-choice
    passageRefs: [gwba-regex-eq-01]
    prompt: 다음 중 문법 G가 생성할 수 ==없는== 것은?
    choices:
      - { id: '1', text: 'baa' }
      - { id: '2', text: 'abaccba' }
      - { id: '3', text: 'bbbaca' }
      - { id: '4', text: 'aabacca' }
    answers: ['2']
    explanation: |
      선택지 1: baa = (bb + a)⁰ · ba · c⁰ · a이므로 생성된다.
      선택지 2: abaccba는 끝에 ba가 있어서 (bb + a)*bac*a로부터 생성할 수 없다. bac* 뒤에는 a 하나만 올 수 있다.
      선택지 3: bbbaca = bb · ba · c · a이므로 생성된다.
      선택지 4: aabacca = a · a · ba · cc · a이므로 생성된다.

      핵심 개념:
      L(G) = (bb + a)*bac*a이다.
      문자열은 앞부분 (bb + a)의 반복, 가운데 ba, c의 반복, 마지막 a로 나뉜다.
      문자열을 이 구조로 쪼갤 수 있는지 확인한다.
      마지막 부분이 c*a가 아니면 생성할 수 없다.
    tags: [regular-expression]

  - id: b02-44
    type: multiple-choice
    passageRefs: [gwba-regex-eq-02]
    prompt: 주어진 문법은 촘스키 계층구조에 따르면 어디에 속하는가?
    choices:
      - { id: '1', text: 'type 0' }
      - { id: '2', text: 'type 1' }
      - { id: '3', text: 'type 2' }
      - { id: '4', text: 'type 3' }
    answers: ['4']
    explanation: |
      선택지 1: type 0은 제약이 없는 문법으로, 이 문법은 더 강한 제약을 만족한다.
      선택지 2: type 1은 문맥의존 문법으로, 이 문법은 더 좁은 type 3에 속한다.
      선택지 3: 왼쪽이 하나의 논터미널이므로 type 2도 만족하지만 더 제한된 type 3으로 분류한다.
      선택지 4: 왼쪽이 하나의 논터미널로 구성되었고 오른쪽은 S → aA | bS, A → aS | bB, B → aB | bB | ε의 우선형 형태이므로 type 3 정규문법이다.

      핵심 개념:
      B → ε 같은 ε-생성규칙이 있어도 우선형 정규문법으로 본다.
      정규문법은 왼쪽이 하나의 논터미널이고 오른쪽이 우선형(또는 좌선형)이다.
      ε-생성규칙은 방정식에서 + ε 항이 된다.
      정규문법의 언어는 정규언어이다.
    tags: [chomsky-hierarchy, regular-grammar]

  - id: b02-45
    type: multiple-choice
    passageRefs: [gwba-regex-eq-02]
    prompt: (가)에 알맞은 것은?
    choices:
      - { id: '1', text: '$(ab)^*\varepsilon$' }
      - { id: '2', text: '$(ab)^*+\varepsilon$' }
      - { id: '3', text: '$(a+b)^*$' }
      - { id: '4', text: '$(a+b)^*+\varepsilon$' }
    answers: ['3']
    explanation: |
      선택지 1: aB + bB는 (a + b)B로 묶이므로 반복 부분은 ab가 아니라 a + b이다.
      선택지 2: 반복 부분이 ab로 잘못되었고, + ε은 해의 형태가 아니다.
      선택지 3: B = aB + bB + ε = (a + b)B + ε = (a + b)*ε = $(a+b)^*$이다.
      선택지 4: $(a+b)^*$에 이미 ε이 포함되어 있으므로 + ε은 불필요하며 해의 표준 형태도 아니다.

      핵심 개념:
      같은 논터미널이 뒤에 붙는 항은 계수끼리 합쳐 묶는다: aB + bB = (a + b)B.
      X = αX + β에서 β = ε이면 X = α*ε = α*이다.
      ε은 접속의 항등원이므로 α*ε = α*이다.
      $(a+b)^*$는 a, b로 만들 수 있는 모든 문자열(ε 포함)이다.
    tags: [regular-equation]

  - id: b02-46
    type: multiple-choice
    passageRefs: [gwba-regex-eq-02]
    prompt: (나)에 알맞은 것은?
    choices:
      - { id: '1', text: '$(ab)^*ab(a+b)^*$' }
      - { id: '2', text: '$(a+b)^*ab(a+b)^*$' }
      - { id: '3', text: '$(a+b)^*(a+b)^*$' }
      - { id: '4', text: '$(aa+b)^*ab(a+b)^*$' }
    answers: ['4']
    explanation: |
      선택지 1: 반복 부분은 S의 계수 aa + b이어야 하는데 ab로 되어 있다.
      선택지 2: 반복 부분을 (a + b)로 쓰면 L(G)보다 큰 언어가 된다.
      선택지 3: ab 부분이 빠져 모든 문자열을 나타내므로 L(G)와 다르다.
      선택지 4: S = aaS + abB + bS = (aa + b)S + abB이고, B = (a + b)*을 대입하면 S = (aa + b)S + ab(a + b)* = $(aa+b)^*ab(a+b)^*$이다.

      핵심 개념:
      ② 식을 ① 식에 대입: S = a(aS + bB) + bS = aaS + abB + bS.
      S 항끼리 묶기: S = (aa + b)S + abB.
      B = (a + b)*을 대입: S = (aa + b)S + ab(a + b)*.
      X = αX + β ⟹ X = α*β: S = (aa + b)*ab(a + b)*.
    tags: [regular-equation, regular-expression]

  - id: b02-47
    type: multiple-choice
    passageRefs: [gwba-regex-eq-02]
    prompt: 다음 중 문법 G가 생성할 수 ==없는== 것은?
    choices:
      - { id: '1', text: 'ab' }
      - { id: '2', text: 'aab' }
      - { id: '3', text: 'aaab' }
      - { id: '4', text: 'aaaba' }
    answers: ['2']
    explanation: |
      선택지 1: ab = (aa + b)⁰ · ab · (a + b)⁰이므로 생성된다.
      선택지 2: S = (aa + b)*ab(a + b)*에서 ab 앞부분은 aa 또는 b의 반복이어야 한다. aab는 ab 앞에 a가 하나만 남아 이렇게 나눌 수 없으므로 생성되지 않는다.
      선택지 3: aaab = aa · ab이므로 생성된다.
      선택지 4: aaaba = aa · ab · a이므로 생성된다.

      핵심 개념:
      L(G) = (aa + b)*ab(a + b)*이다.
      ab 앞부분은 aa와 b의 조합이므로 a가 짝수 개씩 묶여야 한다.
      ab 뒷부분은 아무 문자열이나 올 수 있다.
      문자열을 앞·가운데·뒤로 나누어 각 부분이 정규표현에 맞는지 확인한다.
    tags: [regular-expression]

  - id: b02-48
    type: multiple-choice
    passageRefs: [gwba-regex-eq-03]
    prompt: 주어진 문법은 촘스키 계층구조에 따르면 어디에 속하는가?
    choices:
      - { id: '1', text: 'type 0' }
      - { id: '2', text: 'type 1' }
      - { id: '3', text: 'type 2' }
      - { id: '4', text: 'type 3' }
    answers: ['4']
    explanation: |
      선택지 1: type 0은 제약이 없는 문법으로, 이 문법은 더 강한 제약을 만족한다.
      선택지 2: type 1은 문맥의존 문법으로, 이 문법은 더 좁은 type 3에 속한다.
      선택지 3: 왼쪽이 하나의 논터미널이므로 type 2도 만족하지만 더 제한된 type 3으로 분류한다.
      선택지 4: S → aA | bS, A → bS | aB, B → cB | b는 모두 우선형이므로 type 3 정규문법이다.

      핵심 개념:
      모든 규칙이 A → tB 또는 A → t 형태이면 우선형 정규문법이다.
      type 3 문법은 정규표현으로 바꿀 수 있다.
      정규표현 방정식은 뒤쪽 논터미널부터 풀어 대입한다.
      촘스키 계층에서 type 3이 가장 제약이 강하다.
    tags: [chomsky-hierarchy, regular-grammar]

  - id: b02-49
    type: multiple-choice
    passageRefs: [gwba-regex-eq-03]
    prompt: (가)에 알맞은 것은?
    choices:
      - { id: '1', text: '$c^*b$' }
      - { id: '2', text: '$c^*a$' }
      - { id: '3', text: '$b^*a$' }
      - { id: '4', text: '$a^*c$' }
    answers: ['1']
    explanation: |
      선택지 1: B = cB + b에 X = αX + β ⟹ X = α*β를 적용하면 B = $c^*b$이다.
      선택지 2: $c^*a$는 B = cB + a의 해로, 이 문법의 B는 b로 끝난다.
      선택지 3: $b^*a$는 X = bX + a의 해이다.
      선택지 4: $a^*c$는 반복 기호와 끝 기호가 모두 다르다.

      핵심 개념:
      B = cB + b에서 α = c, β = b이다.
      해는 B = c*b이다.
      이 결과를 ⑤ 식에 대입해 S를 구한다.
      X = αX + β의 해 α*β는 반복 부분이 앞에 온다.
    tags: [regular-equation]

  - id: b02-50
    type: multiple-choice
    passageRefs: [gwba-regex-eq-03]
    prompt: (나)에 알맞은 것은?
    choices:
      - { id: '1', text: '$ab+b$' }
      - { id: '2', text: '$bb+a$' }
      - { id: '3', text: '$ab+a$' }
      - { id: '4', text: '$bb+ba$' }
    answers: ['1']
    explanation: |
      선택지 1: S = abS + aaB + bS = (ab + b)S + aaB이므로 (나)는 ab + b이다.
      선택지 2: bb + a는 다른 문법(S → bA | aS)에서 나오는 계수이다.
      선택지 3: ab + a는 bS 항의 계수 b를 a로 잘못 쓴 것이다.
      선택지 4: bb + ba는 이 방정식의 어느 항과도 맞지 않는다.

      핵심 개념:
      S = aA + bS에 A = bS + aB를 대입하면 S = abS + aaB + bS이다.
      S가 붙은 항 abS와 bS를 묶어 (ab + b)S로 정리한다.
      나머지 aaB가 β 역할을 한다.
      대입 후 반드시 같은 논터미널 항끼리 묶는다.
    tags: [regular-equation]

  - id: b02-51
    type: multiple-choice
    passageRefs: [gwba-regex-eq-03]
    prompt: (다)에 알맞은 것은?
    choices:
      - { id: '1', text: '$(ab+a)^*abc^*a$' }
      - { id: '2', text: '$(bb+a)^*bac^*a$' }
      - { id: '3', text: '$(ab+b)^*abc^*a$' }
      - { id: '4', text: '$(ab+b)^*aac^*b$' }
    answers: ['4']
    explanation: |
      선택지 1: 반복 부분이 (ab + b)가 아니고 뒷부분도 aac*b가 아니다.
      선택지 2: 다른 문법(2~6번)의 결과인 (bb + a)*bac*a이다.
      선택지 3: 반복 부분은 맞지만 뒷부분이 aa·c*b가 아니라 ab·c*a로 되어 있다.
      선택지 4: S = abS + aaB + bS = (ab + b)S + aaB = (ab + b)S + aac*b = $(ab+b)^*aac^*b$이다.

      핵심 개념:
      S = (ab + b)S + aaB에 B = c*b를 대입한다.
      S = (ab + b)S + aac*b가 된다.
      X = αX + β ⟹ X = α*β에서 S = (ab + b)*aac*b이다.
      비슷한 문법의 결과를 섞어 놓은 선택지를 조심한다.
    tags: [regular-equation, regular-expression]

  - id: b02-52
    type: multiple-choice
    passageRefs: [gwba-regex-eq-04]
    prompt: 주어진 문법은 촘스키 계층구조에 따르면 어디에 속하는가?
    choices:
      - { id: '1', text: 'type 0' }
      - { id: '2', text: 'type 1' }
      - { id: '3', text: 'type 2' }
      - { id: '4', text: 'type 3' }
    answers: ['4']
    explanation: |
      선택지 1: type 0은 제약이 없는 문법으로, 이 문법은 더 강한 제약을 만족한다.
      선택지 2: type 1은 문맥의존 문법으로, 이 문법은 더 좁은 type 3에 속한다.
      선택지 3: 왼쪽이 하나의 논터미널이므로 type 2도 만족하지만 더 제한된 type 3으로 분류한다.
      선택지 4: S → aA | bS, A → aA | bB, B → aB | bB | ε은 모두 우선형이므로 type 3 정규문법이다.

      핵심 개념:
      우선형 문법은 type 3 정규문법이다.
      ε-생성규칙 B → ε은 방정식의 + ε 항이 된다.
      정규문법은 유한 오토마타와 같은 언어를 인식한다.
      분류는 가장 제한된 type으로 한다.
    tags: [chomsky-hierarchy, regular-grammar]

  - id: b02-53
    type: multiple-choice
    passageRefs: [gwba-regex-eq-04]
    prompt: (가)에 알맞은 것은?
    choices:
      - { id: '1', text: '$a^*(a+b)^*$' }
      - { id: '2', text: '$a^*+b(a+b)^*$' }
      - { id: '3', text: '$a^*b(a+b)^*$' }
      - { id: '4', text: '$a^*b(a+b)^*b$' }
    answers: ['3']
    explanation: |
      선택지 1: bB의 b가 빠져 있어 A가 b를 반드시 포함한다는 점을 나타내지 못한다.
      선택지 2: $a^*$와 b(a+b)*를 합집합으로 연결했는데, 해의 형태는 α*β의 접속이다.
      선택지 3: A = aA + bB = aA + b(a + b)*이므로 X = αX + β ⟹ X = α*β를 적용하면 A = $a^*b(a+b)^*$이다.
      선택지 4: 끝에 b가 더 붙어 있어 B = (a + b)*를 잘못 대입한 것이다.

      핵심 개념:
      B = (a + b)*를 A = aA + bB에 대입한다.
      A = aA + b(a + b)*에서 α = a, β = b(a + b)*이다.
      따라서 A = a*b(a + b)*이다.
      +는 합집합, 나란히 쓰는 것은 접속이므로 구분해서 읽는다.
    tags: [regular-equation]

  - id: b02-54
    type: multiple-choice
    passageRefs: [gwba-regex-eq-04]
    prompt: (나)에 알맞은 것은?
    choices:
      - { id: '1', text: '$b^*aa^*b(a+b)^*$' }
      - { id: '2', text: '$b^*+a(a^*+b(a+b)^*)$' }
      - { id: '3', text: '$b^*aa^*(a+b)^*$' }
      - { id: '4', text: '$b^*aa^*b(a+b)^*b$' }
    answers: ['1']
    explanation: |
      선택지 1: S = aA + bS = aa*b(a + b)* + bS = bS + aa*b(a + b)*이므로 S = $b^*aa^*b(a+b)^*$이다.
      선택지 2: 접속이어야 할 부분을 합집합(+)으로 연결해 L(G)와 다르다.
      선택지 3: A에 들어 있는 b가 빠져 있다.
      선택지 4: 끝에 불필요한 b가 붙어 있다.

      핵심 개념:
      ⑤ 식 A = a*b(a + b)*을 ① 식 S = aA + bS에 대입한다.
      S = bS + aa*b(a + b)*에서 α = b, β = aa*b(a + b)*이다.
      따라서 S = b*aa*b(a + b)*이다.
      생성되는 문자열에는 a가 적어도 하나 있고 그 뒤에 b가 나와야 한다.
    tags: [regular-equation, regular-expression]

  - id: b02-55
    type: multiple-choice
    passageRefs: [gwba-regex-eq-04]
    prompt: 문법 G가 생성할 수 ==없는== 것은?
    choices:
      - { id: '1', text: 'ab' }
      - { id: '2', text: 'babab' }
      - { id: '3', text: 'bbbaaaa' }
      - { id: '4', text: 'babababab' }
    answers: ['3']
    explanation: |
      선택지 1: ab = b⁰ · a · a⁰ · b · (a + b)⁰이므로 생성된다.
      선택지 2: babab = b · a · b · ab이므로 생성된다.
      선택지 3: b*aa*b(a+b)*로 표현되는 문자열은 반드시 a 뒤에 b가 나와야 한다. bbbaaaa는 a 뒤에 b가 없으므로 생성할 수 없다.
      선택지 4: babababab = b · a · b · ababab 형태로 a 뒤에 b가 나오므로 생성된다.

      핵심 개념:
      L(G) = b*aa*b(a + b)*이다.
      문자열에 부분 문자열 ab가 한 번 이상 나타나야 한다.
      ab가 나온 뒤에는 어떤 문자열이 와도 된다.
      생성 불가 판단은 정규표현의 필수 부분이 문자열에 있는지로 한다.
    tags: [regular-expression]

  - id: b02-56
    type: multiple-choice
    passageRefs: [gwba-fa-q0123-01]
    prompt: '다음은 유한 오토마타이다(출발상태 = 종료상태 = $q_0$). 상태집합 Q는?'
    choices:
      - { id: '1', text: '$q_0$' }
      - { id: '2', text: '$q_1$' }
      - { id: '3', text: '$q_0, q_2$' }
      - { id: '4', text: '$q_0, q_1, q_2, q_3$' }
    answers: ['4']
    explanation: |
      선택지 1: $q_0$는 출발상태이자 종료상태일 뿐 상태집합 전체가 아니다.
      선택지 2: $q_1$은 상태 중 하나일 뿐이다.
      선택지 3: $q_0, q_2$는 입력 0으로 서로 오가는 상태들일 뿐 전체 상태가 아니다.
      선택지 4: 전이표의 행에 나타난 상태가 $q_0, q_1, q_2, q_3$이므로 상태집합 Q = {$q_0, q_1, q_2, q_3$}이다.

      핵심 개념:
      유한 오토마타는 M = (Q, Σ, δ, q₀, F)의 5개 요소로 정의한다.
      Q는 상태의 유한집합, Σ는 입력 알파벳, δ는 상태전이함수이다.
      q₀는 시작상태, F는 종료상태의 집합이다.
      전이표의 행(상태)과 열(입력기호)에서 Q와 Σ를 읽을 수 있다.
    tags: [finite-automata]

  - id: b02-57
    type: multiple-choice
    passageRefs: [gwba-fa-q0123-01]
    prompt: '다음은 유한 오토마타이다(출발상태 = 종료상태 = $q_0$). 인식할 수 ==없는== 것은?'
    choices:
      - { id: '1', text: '00' }
      - { id: '2', text: '1001' }
      - { id: '3', text: '10001' }
      - { id: '4', text: '0101' }
    answers: ['3']
    explanation: |
      선택지 1: $\delta(q_0, 00) = \delta(q_2, 0) = q_0$이므로 종료상태에 도달해 인식된다.
      선택지 2: $\delta(q_0, 1001) = \delta(q_1, 001) = \delta(q_3, 01) = \delta(q_1, 1) = q_0$이므로 인식된다.
      선택지 3: $\delta(q_0, 10001) = \delta(q_1, 0001) = \delta(q_3, 001) = \delta(q_1, 01) = \delta(q_3, 1) = q_2 \ne q_0$이다. 종료상태 $q_0$가 되지 않으므로 인식할 수 없다.
      선택지 4: $\delta(q_0, 0101) = \delta(q_2, 101) = \delta(q_3, 01) = \delta(q_1, 1) = q_0$이므로 인식된다.

      핵심 개념:
      문자열을 한 기호씩 읽으며 전이표에 따라 상태를 바꾼다.
      모든 입력을 읽은 뒤 종료상태에 있으면 그 문자열을 인식(accept)한다.
      이 오토마타는 0과 1이 각각 짝수 개인 문자열을 인식한다.
      10001은 0이 3개(홀수)이므로 인식되지 않는다.
    tags: [finite-automata, dfa]

  - id: b02-58
    type: multiple-choice
    passageRefs: [gwba-fa-ident-01]
    prompt: '다음의 오토마타 $M = (Q, \Sigma, \delta, q_0, q_1)$가 인식할 수 ==없는== 문자열은? (단, $Q = \{q_0, q_1\}$, $\Sigma = \{a, b, c, \dots, z, 0, 1, \dots, 9\}$)'
    choices:
      - { id: '1', text: '123' }
      - { id: '2', text: 'abc' }
      - { id: '3', text: 'ab123' }
      - { id: '4', text: 'korea' }
    answers: ['1']
    explanation: |
      선택지 1: $q_0$에서 숫자 1을 읽으면 전이가 φ(없음)이므로 더 진행할 수 없다. 123은 숫자로 시작하므로 인식할 수 없다.
      선택지 2: a를 읽으면 $q_1$로 가고, 이후 영문자는 $q_1$에 머무르므로 종료상태 $q_1$에서 끝나 인식된다.
      선택지 3: a로 $q_1$에 간 뒤 영문자와 숫자 모두 $q_1$에 머무르므로 인식된다.
      선택지 4: k로 $q_1$에 간 뒤 나머지 영문자도 $q_1$에 머무르므로 인식된다.

      핵심 개념:
      이 오토마타는 식별자를 인식하는 오토마타이다.
      첫 번째 기호는 영문자여야 한다($q_0$ → $q_1$).
      그 뒤에는 영문자나 숫자가 몇 개든 올 수 있다($q_1$ → $q_1$).
      전이가 φ인 곳에 이르면 그 문자열은 인식되지 않는다.
    tags: [finite-automata, identifier]

  - id: b02-59
    type: multiple-choice
    passageRefs: [gwba-dfa-s012-01, gwba-dfa-s012-table-01]
    prompt: 'S₂가 종료상태(이중 원)인 위 오토마타의 전이함수표이다. 빈칸 (가), (나), (다)에 알맞은 것은?'
    choices:
      - { id: '1', text: '$S_0, S_0, S_0$' }
      - { id: '2', text: '$S_1, S_0, S_1$' }
      - { id: '3', text: '$S_0, S_1, S_2$' }
      - { id: '4', text: '$S_1, S_1, S_2$' }
    answers: ['2']
    explanation: |
      선택지 1: $S_0$에서 a를 보면 $S_1$로 가므로 (가)가 $S_0$일 수 없다.
      선택지 2: 상태전이도를 보면 $S_0$에서 a를 보고 가는 곳은 $S_1$, $S_1$에서 b를 보고 가는 곳은 $S_0$, $S_2$에서 c를 보고 가는 곳은 $S_1$이다.
      선택지 3: $S_1$에서 b를 보면 $S_0$로 가므로 (나)가 $S_1$일 수 없다.
      선택지 4: $S_2$에서 c를 보면 $S_1$로 가므로 (다)가 $S_2$일 수 없다.

      핵심 개념:
      전이함수표의 (상태, 입력) 칸에는 그 상태에서 입력을 읽은 뒤 가는 상태를 적는다.
      상태전이도의 간선 라벨 ‘b|c’는 b 또는 c를 읽으면 그 간선을 따라간다는 뜻이다.
      완성된 표: $S_0$ = (S₁, S₀, S₂), $S_1$ = (S₂, S₀, S₀), $S_2$ = (S₀, S₀, S₁).
      모든 칸에 상태가 하나씩 있으므로 이 오토마타는 DFA(Deterministic Finite Automaton)이다.
    tags: [dfa, transition-table]

  - id: b02-60
    type: multiple-choice
    passageRefs: [gwba-dfa-s012-01]
    prompt: '위 오토마타(S₂가 종료상태)가 인식할 수 ==없는== 문자열은?'
    choices:
      - { id: '1', text: 'cac' }
      - { id: '2', text: 'abc' }
      - { id: '3', text: 'aab' }
      - { id: '4', text: 'bbaa' }
    answers: ['3']
    explanation: |
      선택지 1: cac는 $S_0 \to S_2 \to S_0 \to S_2$로 종료상태에서 끝나므로 인식된다.
      선택지 2: abc는 $S_0 \to S_1 \to S_0 \to S_2$로 종료상태에서 끝나므로 인식된다.
      선택지 3: aab는 $S_0$에서 시작해서 $S_1 \to S_2 \to S_0$로 최종 도착한 상태가 $S_0$이다. $S_0$는 종료상태가 아니므로 인식할 수 없다.
      선택지 4: bbaa는 $S_0 \to S_0 \to S_0 \to S_1 \to S_2$로 종료상태에서 끝나므로 인식된다.

      핵심 개념:
      DFA는 입력 기호마다 다음 상태가 하나로 정해진다.
      문자열을 모두 읽은 뒤의 상태가 종료상태이면 인식한다.
      종료상태를 거쳐 가더라도 마지막 상태가 종료상태가 아니면 인식하지 않는다.
      전이표를 이용하면 빠르게 추적할 수 있다.
    tags: [dfa]

  - id: b02-61
    type: multiple-choice
    passageRefs: [gwba-dfa-s012-01]
    prompt: '위 오토마타(S₂가 종료상태)가 인식할 수 ==없는== 문자열은?'
    choices:
      - { id: '1', text: 'aa' }
      - { id: '2', text: 'aaaaa' }
      - { id: '3', text: 'bbacc' }
      - { id: '4', text: 'bbaaa' }
    answers: ['4']
    explanation: |
      선택지 1: aa는 $S_0 \to S_1 \to S_2$로 인식된다.
      선택지 2: aaaaa는 $S_0 \to S_1 \to S_2 \to S_0 \to S_1 \to S_2$로 인식된다.
      선택지 3: bbacc는 $S_0 \to S_0 \to S_0 \to S_1 \to S_0 \to S_2$로 인식된다.
      선택지 4: bbaaa는 $S_0 \to S_0 \to S_0 \to S_1 \to S_2 \to S_0$로 종료상태인 $S_2$가 아니라 $S_0$ 상태에서 끝나므로 인식될 수 없다.

      핵심 개념:
      a만 계속 읽으면 $S_0 \to S_1 \to S_2 \to S_0$로 순환한다.
      b는 어느 상태에서 읽든 $S_0$로 돌아가거나 $S_0$에 머문다.
      마지막 상태만 종료상태 여부를 판단한다.
      입력을 한 기호씩 정확히 추적하는 것이 핵심이다.
    tags: [dfa]

  - id: b02-62
    type: multiple-choice
    passageRefs: [gwba-dfa-s012-01]
    prompt: 다음은 위 오토마타를 정규문법으로 변경하는 과정이다. ==틀린== 것은?
    choices:
      - { id: '1', text: 'S₀ → cS₂' }
      - { id: '2', text: 'S₁ → cS₂' }
      - { id: '3', text: 'S₁ → bS₀' }
      - { id: '4', text: 'S₂ → cS₁' }
    answers: ['2']
    explanation: |
      선택지 1: $S_0$에서 c를 읽으면 $S_2$로 가므로 S₀ → cS₂는 맞다.
      선택지 2: $S_1$에서 c를 읽으면 $S_0$로 간다. $S_1$ → c → $S_2$ 간선은 없으며, c로 $S_2$와 $S_1$을 잇는 간선은 $S_2$ → $S_1$(S₂ → cS₁)이므로 반대로 표시된 틀린 규칙이다.
      선택지 3: $S_1$에서 b를 읽으면 $S_0$로 가므로 S₁ → bS₀는 맞다.
      선택지 4: $S_2$에서 c를 읽으면 $S_1$로 가므로 S₂ → cS₁은 맞다.

      핵심 개념:
      유한 오토마타 → 정규문법: 전이 δ(A, t) = B를 생성규칙 A → tB로 바꾼다.
      종료상태 F에는 F → ε 규칙을 추가한다.
      상태는 논터미널, 입력기호는 터미널이 된다.
      간선 방향을 반대로 적은 규칙을 조심한다.
    tags: [finite-automata, regular-grammar]

  - id: b02-63
    type: multiple-choice
    passageRefs: [gwba-dfa-s012-01, gwba-dfa-pascal-01]
    prompt: 다음은 위의 유한 오토마타를 구현한 파스칼 프로그램의 일부이다. 프로그램의 진행으로 봐서 전이함수표가 작성되는 곳은?
    choices:
      - { id: '1', text: 'delta' }
      - { id: '2', text: 'deltabar' }
      - { id: '3', text: 'accept' }
      - { id: '4', text: 'initialize' }
    answers: ['4']
    explanation: |
      선택지 1: delta는 상태 s와 입력기호 c를 받아 다음 상태를 돌려주는 전이함수로, 이미 만들어진 표를 참조한다.
      선택지 2: deltabar는 상태에서 입력 문자열 전체를 읽어 도달하는 상태를 계산하는 확장 전이함수이다.
      선택지 3: accept는 deltabar의 결과가 종료상태 집합에 속하는지 판단한다.
      선택지 4: 주 프로그램은 먼저 initialize를 호출하므로 initialize에서 초기화, 즉 전이함수표 작성을 한다.

      핵심 개념:
      DFA 프로그램은 초기화 → 입력 처리 → 인식 여부 출력 순서로 진행된다.
      initialize: 전이함수표 등 자료를 초기화한다.
      delta(s, c): 한 기호에 대한 전이, deltabar(s): 입력 문자열 전체에 대한 전이.
      accept: 최종 상태가 finalstate에 속하면 accepted를 출력한다.
    tags: [dfa, implementation]

  - id: b02-64
    type: multiple-choice
    passageRefs: [gwba-dfa-s012-01, gwba-dfa-pascal-01]
    prompt: 다음은 위의 유한 오토마타를 구현한 파스칼 프로그램의 일부이다. (가)에 알맞은 것은?
    choices:
      - { id: '1', text: '$S_0$' }
      - { id: '2', text: '$S_1$' }
      - { id: '3', text: '$S_2$' }
      - { id: '4', text: '$S_0, S_2$' }
    answers: ['1']
    explanation: |
      선택지 1: deltabar는 시작상태부터 입력을 모두 읽은 결과를 구해야 하므로 인자는 시작상태 $S_0$이다.
      선택지 2: $S_1$은 시작상태가 아니다.
      선택지 3: $S_2$는 종료상태로, finalstate의 값이다.
      선택지 4: deltabar의 인자는 상태 하나이며 상태 집합이 아니다.

      핵심 개념:
      $\bar{\delta}(q_0, w)$는 시작상태 q₀에서 문자열 w를 모두 읽은 뒤의 상태이다.
      w가 인식되려면 $\bar{\delta}(q_0, w) \in F$이어야 한다.
      accept := deltabar(S₀) in finalstate가 이 조건을 구현한다.
      상태전이도에서 start 화살표가 가리키는 상태가 시작상태이다.
    tags: [dfa, implementation]

  - id: b02-65
    type: multiple-choice
    passageRefs: [gwba-dfa-s012-01, gwba-dfa-pascal-01]
    prompt: 오토마타를 볼 때 밑줄 친 finalstate의 값은?
    choices:
      - { id: '1', text: '$S_0$' }
      - { id: '2', text: '$S_1$' }
      - { id: '3', text: '$S_2$' }
      - { id: '4', text: '$S_0, S_2$' }
    answers: ['3']
    explanation: |
      선택지 1: $S_0$는 시작상태이며 종료상태가 아니다.
      선택지 2: $S_1$은 종료상태가 아니다.
      선택지 3: 상태전이도에서 이중 원으로 표시된 $S_2$가 종료상태이므로 finalstate = {$S_2$}이다.
      선택지 4: $S_0$는 종료상태가 아니므로 포함되지 않는다.

      핵심 개념:
      상태전이도에서 종료상태는 이중 원으로 표시한다.
      finalstate는 종료상태의 집합 F이다.
      시작상태는 start 화살표로 표시한다.
      시작상태가 종료상태를 겸할 수도 있지만 이 오토마타에서는 그렇지 않다.
    tags: [dfa, implementation]

  - id: b02-66
    type: multiple-choice
    passageRefs: [gwba-nfa-abb-01]
    prompt: '다음 그림은 $(a|b)^*abb$를 받아들이는 NFA(Nondeterministic Finite Automaton) 상태전이도이며 NFA를 DFA로 변환하는 과정이다. ε-closure(0)을 구하라.'
    choices:
      - { id: '1', text: '0, 1' }
      - { id: '2', text: '0, 1, 2, 4' }
      - { id: '3', text: '0, 1, 2, 4, 7' }
      - { id: '4', text: '0, 1, 2, 4, 7, 8' }
    answers: ['4']
    explanation: |
      선택지 1: 1에서 ε으로 2, 4에 갈 수 있으므로 1까지만 모으면 부족하다.
      선택지 2: 0에서 ε으로 7에 직접 갈 수 있고 7에서 8로도 갈 수 있으므로 빠진 상태가 있다.
      선택지 3: 7에서 ε으로 8에 갈 수 있으므로 8이 빠졌다.
      선택지 4: 0번 상태에서 ε으로만 도달할 수 있는 상태는 1, 2, 4, 7, 8번이므로 자기 자신을 포함해 ε-closure(0) = {0, 1, 2, 4, 7, 8}이다.

      핵심 개념:
      ε-closure(s)는 s에서 ε-전이만으로 도달할 수 있는 모든 상태의 집합이며 s 자신을 포함한다.
      ε-전이를 여러 번 연속으로 따라가는 경로도 모두 포함한다.
      NFA를 DFA로 바꿀 때 ε-closure(시작상태)가 DFA의 시작상태가 된다.
      입력기호가 붙은 간선은 ε-closure 계산에서 따라가지 않는다.
    tags: [nfa, epsilon-closure, subset-construction]

  - id: b02-67
    type: multiple-choice
    passageRefs: [gwba-nfa-abb-01]
    prompt: 'ε-closure(0)을 상태 A라고 하자. 그러면 입력기호 a에 의한 다음 상태는?'
    choices:
      - { id: '1', text: 'ε-closure(1)' }
      - { id: '2', text: 'ε-closure(2)' }
      - { id: '3', text: 'ε-closure(3, 9)' }
      - { id: '4', text: 'ε-closure(4)' }
    answers: ['3']
    explanation: |
      선택지 1: 1번 상태에는 입력기호 a로 가는 간선이 들어오지 않는다.
      선택지 2: 2번은 a를 읽기 전의 상태이지 a를 읽은 뒤의 상태가 아니다.
      선택지 3: ε-closure(0) = {0, 1, 2, 4, 7, 8}에서 입력기호 a가 있는 상태는 2번에서 3번, 그리고 8번에서 9번이다. 따라서 다음 상태는 ε-closure(3, 9)이다.
      선택지 4: 4번에서는 b에 의해 5번으로 가므로 a와 관계없다.

      핵심 개념:
      DFA 상태 T에서 입력 a에 의한 다음 상태는 ε-closure(move(T, a))이다.
      move(T, a)는 T의 각 상태에서 a로 한 번 전이한 상태들의 집합이다.
      A = {0, 1, 2, 4, 7, 8}에서 move(A, a) = {3, 9}이다.
      부분집합 구성(subset construction)은 이 과정을 새 상태가 나오지 않을 때까지 반복한다.
    tags: [nfa, epsilon-closure, subset-construction]

  - id: b02-68
    type: multiple-choice
    passageRefs: [gwba-nfa-abb-01]
    prompt: 'ε-closure(0)을 상태 A라고 할 때, 상태 A에서 입력기호 b에 의한 다음 상태는?'
    choices:
      - { id: '1', text: 'ε-closure(5, 7)' }
      - { id: '2', text: 'ε-closure(5)' }
      - { id: '3', text: 'ε-closure(9)' }
      - { id: '4', text: 'ε-closure(5, 10)' }
    answers: ['2']
    explanation: |
      선택지 1: 7번 상태는 b에 의해 도달하는 상태가 아니라 ε으로 도달하는 상태이다.
      선택지 2: ε-closure(0) = {0, 1, 2, 4, 7, 8}에서 입력기호 b가 있는 상태는 4번에서 5번으로 전이되는 것뿐이므로 ε-closure(5)이다.
      선택지 3: 9번은 8번에서 a에 의해 도달하는 상태이다.
      선택지 4: 10번에서 11번으로 가는 b 전이는 있지만 10번은 A에 속하지 않는다.

      핵심 개념:
      move(A, b)는 A에 속한 상태 중 b 간선이 나가는 상태의 목적지만 모은다.
      A에서 b 간선이 나가는 상태는 4번뿐이다.
      따라서 다음 상태는 ε-closure({5})이다.
      A에 속하지 않는 상태의 전이는 고려하지 않는다.
    tags: [nfa, epsilon-closure, subset-construction]

  - id: b02-69
    type: multiple-choice
    passageRefs: [gwba-nfa-abb-01]
    prompt: 'ε-closure(1)을 구하라.'
    choices:
      - { id: '1', text: '1, 2, 4' }
      - { id: '2', text: '0, 1, 2, 4' }
      - { id: '3', text: '1, 2, 4, 7' }
      - { id: '4', text: '0, 1, 2, 4, 7' }
    answers: ['1']
    explanation: |
      선택지 1: 1을 출발점으로 ε으로 연결되는 상태는 1, 2, 4이므로 ε-closure(1) = {1, 2, 4}이다.
      선택지 2: 0은 1로 들어오는 간선의 출발점이므로 1에서 도달할 수 없다.
      선택지 3: 7은 0이나 6에서 ε으로 갈 수 있지만, 1에서는 ε-전이만으로 6에 갈 수 없으므로(2→3은 a, 4→5는 b 전이) 7에도 도달할 수 없다.
      선택지 4: 0과 7은 모두 1에서 ε-전이로 도달할 수 없다.

      핵심 개념:
      ε-closure는 간선 방향을 따라 나가는 ε-전이만 따라간다.
      들어오는 간선의 출발 상태는 포함하지 않는다.
      2와 4에서는 a, b 간선만 나가므로 더 확장되지 않는다.
      자기 자신은 항상 ε-closure에 포함된다.
    tags: [nfa, epsilon-closure]

  - id: b02-70
    type: multiple-choice
    passageRefs: [gwba-nfa-abb-01]
    prompt: 'ε-closure(3)을 구하라.'
    choices:
      - { id: '1', text: '3, 6, 7' }
      - { id: '2', text: '3, 6, 7, 8' }
      - { id: '3', text: '1, 2, 3, 4, 6' }
      - { id: '4', text: '1, 2, 3, 4, 6, 7, 8' }
    answers: ['4']
    explanation: |
      선택지 1: 6에서 1번으로 가는 ε 경로와 7에서 8로 가는 ε 경로가 빠졌다.
      선택지 2: 6에서 1번으로 되돌아가는 ε 경로(1, 2, 4)가 빠졌다.
      선택지 3: 6에서 7번으로 가는 ε 경로(7, 8)가 빠졌다.
      선택지 4: 3을 출발점으로 ε으로 연결되는 상태는 3, 6이며, 6에서 1번으로 연결되는 길과 7번으로 연결되는 두 가지 길이 나온다. 1번으로 가면 1, 2, 4가, 7번으로 가면 7, 8이 연결되므로 ε-closure(3) = {1, 2, 3, 4, 6, 7, 8}이다.

      핵심 개념:
      ε-closure는 ε 경로가 갈라지면 모든 갈래를 따라간다.
      6 → 1(반복), 6 → 7(탈출) 두 ε-전이가 모두 포함된다.
      ε-closure(3, 9)처럼 여러 상태의 closure는 각 closure의 합집합이다.
      이 결과가 DFA의 새 상태 하나가 된다.
    tags: [nfa, epsilon-closure]

  - id: b02-71
    type: multiple-choice
    passageRefs: [gwba-nfa-abb-01]
    prompt: 'ε-closure(9)를 구하라.'
    choices:
      - { id: '1', text: '8' }
      - { id: '2', text: '9' }
      - { id: '3', text: '10' }
      - { id: '4', text: '9, 10' }
    answers: ['4']
    explanation: |
      선택지 1: 8은 9로 들어오는 a 간선의 출발점이므로 포함되지 않는다.
      선택지 2: 9에서 ε으로 10에 갈 수 있으므로 9만으로는 부족하다.
      선택지 3: ε-closure에는 출발 상태 9 자신도 포함되어야 한다.
      선택지 4: 9를 출발점으로 하여 ε으로 연결되는 상태는 10번이므로 ε-closure(9) = {9, 10}이다.

      핵심 개념:
      ε-closure(s)는 항상 s를 포함한다.
      10에서는 b 간선만 나가므로 더 확장되지 않는다.
      입력기호 간선과 ε 간선을 구분해서 따라간다.
      ε-closure의 원소는 ε 경로로만 도달하는 상태들이다.
    tags: [nfa, epsilon-closure]

  - id: b02-72
    type: multiple-choice
    passageRefs: [gwba-nfa-abb-01]
    prompt: 'ε-closure(0, 9)를 구하라.'
    choices:
      - { id: '1', text: '0, 1, 2, 4, 9, 10' }
      - { id: '2', text: '0, 1, 2, 4, 9, 10' }
      - { id: '3', text: '0, 1, 2, 4, 7, 8, 9, 10' }
      - { id: '4', text: '0, 1, 2, 4, 6, 7, 8, 9, 10' }
    answers: ['3']
    explanation: |
      선택지 1: 0에서 ε으로 도달하는 7, 8이 빠졌다.
      선택지 2: 선택지 1과 같은 집합으로, 역시 7, 8이 빠졌다(원문에서 선택지 1과 2가 같은 내용이다).
      선택지 3: ε-closure(0, 9)는 ε-closure(0)과 ε-closure(9)를 합하면 된다. ε-closure(0) ∪ ε-closure(9) = {0, 1, 2, 4, 7, 8} ∪ {9, 10} = {0, 1, 2, 4, 7, 8, 9, 10}이다.
      선택지 4: 6은 3이나 5에서 ε으로 도달하는 상태로, 0이나 9에서는 도달할 수 없다.

      핵심 개념:
      여러 상태의 ε-closure는 각 상태의 ε-closure를 합집합한 것이다.
      ε-closure(T) = ∪ ε-closure(s), s ∈ T.
      0의 closure와 9의 closure를 따로 구한 뒤 합친다.
      다른 상태를 거쳐야만 도달하는 상태는 넣지 않는다.
    tags: [nfa, epsilon-closure]

  - id: b02-73
    type: multiple-choice
    passageRefs: [gwba-nfa-aa-01]
    prompt: '다음은 NFA를 DFA로 바꾸는 과정이다. ε-closure(1)은?'
    choices:
      - { id: '1', text: '1, 2, 4' }
      - { id: '2', text: '1, 2, 3, 4, 5' }
      - { id: '3', text: '0, 1, 2, 4, 7' }
      - { id: '4', text: '0, 1, 2, 4, 7, 8' }
    answers: ['1']
    explanation: |
      선택지 1: 1에서 ε으로 연결되는 상태는 2, 4이므로 ε-closure(1) = {1, 2, 4}이다.
      선택지 2: 3과 5는 2, 4에서 입력기호 a를 읽어야 도달하므로 포함되지 않는다.
      선택지 3: 0과 7은 1에서 ε으로 도달할 수 없다.
      선택지 4: 0, 7, 8은 1에서 ε으로 도달할 수 없다.

      핵심 개념:
      ε-closure는 ε 간선만 따라간다.
      a 간선을 따라간 상태는 move 연산의 결과이다.
      1 → 2, 1 → 4가 ε-전이이므로 {1, 2, 4}이다.
      이 NFA에서 6 → 7은 ε이 아니라 b 전이이다.
    tags: [nfa, epsilon-closure]

  - id: b02-74
    type: multiple-choice
    passageRefs: [gwba-nfa-aa-01]
    prompt: 'ε-closure(1)을 상태 A라고 하자. 그러면 입력기호 a에 의한 다음 상태는?'
    choices:
      - { id: '1', text: 'ε-closure(2)' }
      - { id: '2', text: 'ε-closure(4)' }
      - { id: '3', text: 'ε-closure(3)' }
      - { id: '4', text: 'ε-closure(3, 5)' }
    answers: ['4']
    explanation: |
      선택지 1: 2는 a를 읽기 전의 상태이다.
      선택지 2: 4도 a를 읽기 전의 상태이다.
      선택지 3: 2에서 a로 3에 가는 것만 고려하고 4에서 a로 5에 가는 전이를 빠뜨렸다.
      선택지 4: ε-closure(1) = {1, 2, 4}에서 보면 2, 4번에서 a에 의하여 각각 3, 5번으로 전이된다. 따라서 ε-closure(3, 5)이다.

      핵심 개념:
      move(A, a)는 A의 모든 상태에서 a로 가는 목적지를 모은 것이다.
      A = {1, 2, 4}에서 move(A, a) = {3, 5}이다.
      다음 DFA 상태는 ε-closure({3, 5})이다.
      한 입력기호에 대해 여러 상태로 가는 것이 NFA의 특징이다.
    tags: [nfa, subset-construction]

  - id: b02-75
    type: multiple-choice
    passageRefs: [gwba-nfa-q01-a-01, gwba-dfa-q01-a-01]
    prompt: '다음 표는 상태전이표로 NFA $M = (\{q_0, q_1\}, \{0, 1\}, \delta, q_0, \{q_1\})$를 DFA로 바꾸는 과정을 보여 주고 있다(위: NFA의 δ, 아래: 변환된 DFA의 δ′). (가)와 (나)에 각각 알맞은 것은?'
    choices:
      - { id: '1', text: '[q₀], [q₀, q₁]' }
      - { id: '2', text: '[q₁], [q₀, q₁]' }
      - { id: '3', text: '[q₀, q₁], [q₁]' }
      - { id: '4', text: '[q₀, q₁], [q₀, q₁]' }
    answers: ['1']
    explanation: |
      선택지 1: δ({q₀}, 1) = {q₀} ⟹ [q₀]이고, δ({q₀, q₁}, 0) = δ(q₀, 0) ∪ δ(q₁, 0) = {q₀, q₁} ∪ φ = {q₀, q₁} ⟹ [q₀, q₁]이다.
      선택지 2: q₀에서 1을 읽으면 q₀로만 가므로 (가)는 [q₁]이 아니다.
      선택지 3: (가)가 [q₀, q₁]이 되려면 δ(q₀, 1)에 q₁이 있어야 하는데 없다. (나)도 q₀에서 0으로 q₀, q₁ 모두에 가므로 [q₁]이 아니다.
      선택지 4: (가)는 [q₀]이어야 한다.

      핵심 개념:
      NFA → DFA 변환에서 DFA의 상태는 NFA 상태의 부분집합이다.
      δ′([p, q], a) = δ(p, a) ∪ δ(q, a)로 계산한다.
      {q₀, q₁}처럼 중복 상태가 나오면 새로운 상태 [q₀, q₁]로 만들어 추가한다.
      NFA의 종료상태 q₁을 포함하는 DFA 상태([q₁], [q₀, q₁])가 DFA의 종료상태가 된다.
    tags: [nfa, subset-construction]

  - id: b02-76
    type: multiple-choice
    passageRefs: [gwba-nfa-q01-b-01, gwba-dfa-q01-b-01]
    prompt: '다음은 NFA $M = (\{q_0, q_1\}, \{0, 1\}, \delta, q_0, \{q_1\})$를 DFA로 바꾸는 과정이다(위: NFA의 δ, 아래: 변환된 DFA의 δ′). (가)에 알맞은 것은?'
    choices:
      - { id: '1', text: 'φ' }
      - { id: '2', text: '[q₀]' }
      - { id: '3', text: '[q₁]' }
      - { id: '4', text: '[q₀, q₁]' }
    answers: ['2']
    explanation: |
      선택지 1: q₁에서 1을 읽으면 q₀로 가는 전이가 있으므로 φ가 아니다.
      선택지 2: 앞의 δ함수 상태전이표에서 q₁에서 1을 보면 q₀이다. 따라서 δ′함수로 변환된 상태전이표에서도 [q₀]가 된다.
      선택지 3: q₁에서 1을 읽어 q₁로 가는 전이는 없다.
      선택지 4: δ(q₁, 1) = {q₀}이므로 q₁은 포함되지 않는다.

      핵심 개념:
      단일 상태 [q]의 전이는 NFA의 δ(q, a)를 그대로 옮긴다.
      δ(q₁, 1) = {q₀} ⟹ δ′([q₁], 1) = [q₀].
      φ는 전이가 없음을 나타낸다.
      집합 표기 { }를 DFA 상태 표기 [ ]로 바꿔 적는다.
    tags: [nfa, subset-construction]

  - id: b02-77
    type: multiple-choice
    passageRefs: [gwba-nfa-q01-b-01, gwba-dfa-q01-b-01]
    prompt: '다음은 NFA $M = (\{q_0, q_1\}, \{0, 1\}, \delta, q_0, \{q_1\})$를 DFA로 바꾸는 과정이다(위: NFA의 δ, 아래: 변환된 DFA의 δ′). (나)에 알맞은 것은?'
    choices:
      - { id: '1', text: 'φ' }
      - { id: '2', text: '[q₀]' }
      - { id: '3', text: '[q₁]' }
      - { id: '4', text: '[q₀, q₁]' }
    answers: ['4']
    explanation: |
      선택지 1: q₀와 q₁ 모두 0에 대한 전이가 있으므로 φ가 아니다.
      선택지 2: q₀에서 0을 보면 {q₀, q₁}이므로 q₁도 포함되어야 한다.
      선택지 3: q₀도 포함되어야 한다.
      선택지 4: 먼저 q₀에서 0을 보면 {q₀, q₁}이고, 다음으로 q₁에서 0을 보면 역시 {q₀, q₁}이다. 이들을 합한 것도 {q₀, q₁}이므로 δ′함수로 변환된 상태전이표에서도 [q₀, q₁]이 된다.

      핵심 개념:
      δ′([q₀, q₁], 0) = δ(q₀, 0) ∪ δ(q₁, 0) = {q₀, q₁} ∪ {q₀, q₁} = {q₀, q₁}.
      완성된 δ′: [q₀] = ([q₀, q₁], [q₀]), [q₁] = ([q₀, q₁], [q₀]), [q₀, q₁] = ([q₀, q₁], [q₀]).
      부분집합 상태의 전이는 구성 상태들의 전이를 합집합한다.
      결과로 얻은 DFA는 각 (상태, 입력)에 다음 상태가 하나씩이다.
    tags: [nfa, subset-construction]

  - id: b02-78
    type: multiple-choice
    passageRefs: [gwba-dfa-min-01]
    prompt: 다음은 DFA의 상태수를 최소화하는 과정이다(단, E는 종료상태). 다음 중 동치류가 같지 ==않은== 것은?
    choices:
      - { id: '1', text: 'B' }
      - { id: '2', text: 'C' }
      - { id: '3', text: 'D' }
      - { id: '4', text: 'E' }
    answers: ['3']
    explanation: |
      선택지 1: B는 a에 대해 B, b에 대해 D로 가므로 첫 분할 단계에서는 동치류 1(미종료상태)로 가서 A, C와 같은 패턴이다. 이후 단계에서 {A, C}와 갈라지지만, 이 문제는 첫 분할에서 달라지는 상태를 묻는다.
      선택지 2: C는 a에 대해 B, b에 대해 C로 가므로 미종료상태 동치류 안에 머문다.
      선택지 3: D는 b에 의해 종료상태 E로 전이한다. 즉 D는 종료상태 E를 포함하는 쪽으로 가므로 다른 미종료상태들과 다르다.
      선택지 4: E는 종료상태로 처음부터 별도의 동치류 {E}를 이룬다. 워크북은 미종료상태 동치류 안에서 갈라지는 상태를 묻는 의도로 D를 정답으로 한다.

      핵심 개념:
      DFA 최소화는 먼저 종료상태 {E}와 미종료상태 {A, B, C, D} 두 동치류로 나눈다.
      같은 동치류의 상태가 어떤 입력에 대해 서로 다른 동치류로 가면 분할한다.
      D는 b로 E(동치류 2)에 가므로 {A, B, C}와 {D}로 나뉜다.
      이후 B가 b로 D에 가므로 다시 {A, C}와 {B}로 나뉘어 최종 동치류는 {A, C}, {B}, {D}, {E}이다.
    tags: [dfa-minimization, equivalence-class]

  - id: b02-79
    type: multiple-choice
    passageRefs: [gwba-dfa-min-01, gwba-dfa-min-class-01]
    prompt: '동치류를 표현한 것이다(동치류 1 = {A, B, C, D}, 동치류 2 = {E}). 다음의 빈칸 (가), (나)에 알맞은 것은?'
    choices:
      - { id: '1', text: '1, 1' }
      - { id: '2', text: '1, 2' }
      - { id: '3', text: '2, 1' }
      - { id: '4', text: '2, 2' }
    answers: ['2']
    explanation: |
      선택지 1: D는 b에 의해 E로 가므로 (나)는 동치류 1이 아니다.
      선택지 2: 먼저 b에 의하여 전이되는 상태를 보면 C → C이므로 동치류 1이다. D → E에서 D는 종료상태 E를 포함하고 있으므로 동치류 2가 된다.
      선택지 3: C는 b에 의해 C 자신으로 가므로 (가)는 동치류 2가 아니다.
      선택지 4: (가)는 동치류 1이어야 한다.

      핵심 개념:
      표의 각 칸에는 그 상태가 입력을 읽고 도착한 상태의 동치류 번호를 적는다.
      같은 동치류 안에서 번호 패턴이 다르면 분할한다: {A, B, C}와 {D}.
      분할을 반복하면 B도 갈라져 {A, C}, {B}, {D}, {E}가 된다.
      A와 C는 끝까지 같은 패턴이므로 하나의 상태로 합칠 수 있다.
    tags: [dfa-minimization, equivalence-class]

  - id: b02-80
    type: multiple-choice
    prompt: 문법의 표기법에서 유한 오토마타와 동치관계가 있는 것은?
    choices:
      - { id: '1', text: '정규표현' }
      - { id: '2', text: 'BNF' }
      - { id: '3', text: 'EBNF' }
      - { id: '4', text: '문법도표' }
    answers: ['1']
    explanation: |
      선택지 1: 유한 오토마타, 정규표현, 정규문법은 서로 동치관계이다. 즉 같은 부류의 언어(정규언어)를 나타낸다.
      선택지 2: BNF는 주로 문맥자유 문법을 표기하는 방법으로, 유한 오토마타보다 표현력이 크다.
      선택지 3: EBNF도 BNF를 확장한 문맥자유 문법 표기법이다.
      선택지 4: 문법도표는 문법을 그림으로 나타낸 것으로 BNF/EBNF와 같은 문법을 도식화한다.

      핵심 개념:
      정규문법 ⟺ 정규표현 ⟺ 유한 오토마타는 서로 변환할 수 있다.
      이들이 나타내는 언어를 정규언어라 한다.
      어휘분석기는 이 동치관계를 이용해 정규표현으로부터 유한 오토마타를 만든다.
      문맥자유 언어는 푸시다운 오토마타로 인식한다.
    tags: [regular-expression, finite-automata]

  - id: b02-81
    type: multiple-choice
    passageRefs: [gwba-fa-abd-01]
    prompt: 유한 오토마타를 보고 정규문법으로 바꾼 내용들이다. ==틀린== 것은?
    choices:
      - { id: '1', text: 'A → aA | bA' }
      - { id: '2', text: 'A → aB' }
      - { id: '3', text: 'B → bD' }
      - { id: '4', text: 'D → εD' }
    answers: ['4']
    explanation: |
      선택지 1: A에서 a 또는 b를 읽으면 A에 머무르므로 A → aA | bA는 맞다.
      선택지 2: A에서 a를 읽으면 B로 가므로 A → aB는 맞다.
      선택지 3: B에서 b를 읽으면 D로 가므로 B → bD는 맞다.
      선택지 4: D는 종료상태이고 나가는 전이가 없으므로 D → ε이 되어야 한다. D → εD는 틀렸다.

      핵심 개념:
      전이 δ(X, t) = Y는 생성규칙 X → tY로 바꾼다.
      종료상태 F에는 F → ε을 추가한다.
      자기 루프는 X → tX 형태의 규칙이 된다.
      ε은 입력을 읽지 않는다는 뜻이므로 ε에 대한 전이 규칙을 만들지 않는다.
    tags: [finite-automata, regular-grammar]

  - id: b02-82
    type: multiple-choice
    passageRefs: [gwba-fa-abd-01]
    prompt: 위 유한 오토마타를 정규표현으로 표현한 것은?
    choices:
      - { id: '1', text: '$(a+b)^*ab$' }
      - { id: '2', text: '$(a+a)^*ab$' }
      - { id: '3', text: '$(a^*+b^*)ab$' }
      - { id: '4', text: '$a(a+b)^*b$' }
    answers: ['1']
    explanation: |
      선택지 1: 문법 A = aA | bA, A = aB, B = bD, D = ε에서 B = bD = bε = b이다. 정규표현 방정식 A = aA + bA + aB에 B = b를 대입하면 A = (a + b)A + ab = $(a+b)^*ab$이다.
      선택지 2: (a + a)*는 a*와 같아 b가 앞부분에 올 수 없으므로 루프의 a|b를 나타내지 못한다.
      선택지 3: $(a^*+b^*)$는 a만 반복하거나 b만 반복하는 것으로, ab가 섞인 앞부분(예: abab)을 나타내지 못한다.
      선택지 4: $a(a+b)^*b$는 a로 시작하고 b로 끝나는 모든 문자열로, 끝이 ab가 아닌 bb 등도 포함한다.

      핵심 개념:
      유한 오토마타 → 정규문법 → 정규표현 방정식 → 정규표현 순서로 변환할 수 있다.
      자기 루프 a|b는 (a + b)*가 된다.
      A = (a + b)A + ab ⟹ A = (a + b)*ab.
      이 오토마타는 ab로 끝나는 문자열을 인식한다.
    tags: [finite-automata, regular-expression]

  - id: b02-83
    type: multiple-choice
    passageRefs: [gwba-fa-abc-01]
    prompt: 유한 오토마타를 보고 정규문법으로 바꾼 내용이다. ==틀린== 것은?
    choices:
      - { id: '1', text: 'A → aB' }
      - { id: '2', text: 'B → (a+b)*' }
      - { id: '3', text: 'B → aB | bB' }
      - { id: '4', text: 'C → ε' }
    answers: ['2']
    explanation: |
      선택지 1: A에서 a를 읽으면 B로 가므로 A → aB는 맞다.
      선택지 2: (a + b)*는 정규표현이지 생성규칙의 형태가 아니다. 정규문법의 규칙은 X → tY 또는 X → t 형태여야 하므로 틀렸다.
      선택지 3: B에서 a 또는 b를 읽으면 B에 머무르므로 B → aB | bB는 맞다.
      선택지 4: C는 종료상태이므로 C → ε은 맞다.

      핵심 개념:
      정규문법의 생성규칙은 터미널과 논터미널로 이루어진다.
      *, + 같은 연산은 정규표현에서 쓰는 기호이다.
      자기 루프 ‘a|b’는 B → aB | bB 두 규칙으로 바꾼다.
      B → bC 규칙도 필요하다(B에서 b로 C에 가는 전이).
    tags: [finite-automata, regular-grammar]

  - id: b02-84
    type: multiple-choice
    passageRefs: [gwba-fa-abc-01]
    prompt: 위 유한 오토마타를 정규표현으로 표현한 것은?
    choices:
      - { id: '1', text: '$a(a+b)^*b$' }
      - { id: '2', text: '$a(a+b)b$' }
      - { id: '3', text: '$aa^*b^*b$' }
      - { id: '4', text: '$a(a^*+b^*)b$' }
    answers: ['1']
    explanation: |
      선택지 1: 문법 A → aB, B → aB | bB | bC, C → ε을 방정식으로 쓰면 A = aB, B = aB + bB + bC, C = ε이다. B = (a + b)B + b = (a + b)*b이고 A = aB = $a(a+b)^*b$이다.
      선택지 2: $a(a+b)b$는 가운데 기호가 정확히 하나인 길이 3의 문자열만 나타낸다.
      선택지 3: $aa^*b^*b$는 a들 뒤에 b들이 오는 형태로, 가운데에 ba가 섞인 문자열(예: abab)을 나타내지 못한다.
      선택지 4: $(a^*+b^*)$는 a만 또는 b만 반복하므로 가운데에 a와 b가 섞인 경우를 나타내지 못한다.

      핵심 개념:
      C = ε을 B = aB + bB + bC에 대입하면 B = (a + b)B + b이다.
      B = (a + b)*b.
      A = aB = a(a + b)*b.
      이 오토마타는 a로 시작하고 b로 끝나는 문자열을 인식한다.
    tags: [finite-automata, regular-expression]

  - id: b02-85
    type: multiple-choice
    passageRefs: [gwba-fa-aef-01]
    prompt: 유한 오토마타를 보고 정규문법으로 바꾼 내용이다. ==틀린== 것은?
    choices:
      - { id: '1', text: 'A → aE' }
      - { id: '2', text: 'E → bF' }
      - { id: '3', text: 'E → cA' }
      - { id: '4', text: 'F → dF | ε' }
    answers: ['3']
    explanation: |
      선택지 1: A에서 a를 읽으면 E로 가므로 A → aE는 맞다.
      선택지 2: E에서 b를 읽으면 F로 가므로 E → bF는 맞다.
      선택지 3: E에서 c를 읽으면 E 자신에 머무른다. 따라서 E → cE | bF이어야 하므로 E → cA는 틀렸다.
      선택지 4: F는 d로 자기 루프가 있고 종료상태이므로 F → dF | ε은 맞다.

      핵심 개념:
      자기 루프 δ(E, c) = E는 E → cE가 된다.
      종료상태 F에는 F → ε을 붙인다.
      전이의 도착 상태를 정확히 옮겨야 한다.
      정규문법: A → aE, E → cE | bF, F → dF | ε.
    tags: [finite-automata, regular-grammar]

  - id: b02-86
    type: multiple-choice
    passageRefs: [gwba-fa-aef-01]
    prompt: 위 유한 오토마타를 정규표현으로 표현한 것은?
    choices:
      - { id: '1', text: 'acbd' }
      - { id: '2', text: '$ac^*b$' }
      - { id: '3', text: '$ac^*bd$' }
      - { id: '4', text: '$ac^*bd^*$' }
    answers: ['4']
    explanation: |
      선택지 1: acbd는 c와 d를 정확히 한 번씩만 허용하는 문자열 하나일 뿐이다.
      선택지 2: $ac^*b$는 F의 d 루프를 반영하지 못한다.
      선택지 3: $ac^*bd$는 d를 정확히 한 번 요구하므로 d가 없거나 여러 개인 경우를 나타내지 못한다.
      선택지 4: A → aE, E → cE | bF, F → dF | ε에서 F = dF + ε = d*, E = cE + bF = cE + bd* = c*bd*, A = aE = $ac^*bd^*$이다.

      핵심 개념:
      F = dF + ε ⟹ F = d*.
      E = cE + bd* ⟹ E = c*bd*.
      A = aE = ac*bd*.
      종료상태의 자기 루프는 끝부분의 반복(*)이 된다.
    tags: [finite-automata, regular-expression]

  - id: b02-87
    type: multiple-choice
    passageRefs: [gwba-fa-abc-02]
    prompt: 유한 오토마타를 보고 정규문법으로 바꾼 내용이다. ==틀린== 것은?
    choices:
      - { id: '1', text: 'A → (a+b)A' }
      - { id: '2', text: 'A → aB' }
      - { id: '3', text: 'B → bC' }
      - { id: '4', text: 'C → aC' }
    answers: ['1']
    explanation: |
      선택지 1: A의 자기 루프는 b뿐이므로 A → bA이어야 한다. (a + b)A는 정규표현식을 섞은 형태이며 a 루프도 없으므로 틀렸다.
      선택지 2: A에서 a를 읽으면 B로 가므로 A → aB는 맞다.
      선택지 3: B에서 b를 읽으면 C로 가므로 B → bC는 맞다.
      선택지 4: C에서 a를 읽으면 C에 머무르므로 C → aC는 맞다.

      핵심 개념:
      상태전이도의 각 간선을 하나의 생성규칙으로 옮긴다.
      정규문법: A → bA | aB, B → bC, C → aC | ε.
      종료상태 C에는 C → ε을 추가한다.
      생성규칙 오른쪽에 +, * 같은 정규표현 연산자를 쓰지 않는다.
    tags: [finite-automata, regular-grammar]

  - id: b02-88
    type: multiple-choice
    passageRefs: [gwba-fa-abc-02]
    prompt: 다음 중 이 유한 오토마타가 인식할 수 ==없는== 것은?
    choices:
      - { id: '1', text: 'baa' }
      - { id: '2', text: 'bab' }
      - { id: '3', text: 'babaa' }
      - { id: '4', text: 'bbbbab' }
    answers: ['1']
    explanation: |
      선택지 1: baa는 A →(b) A →(a) B까지 간 뒤 B에서 a에 대한 전이가 없으므로 인식할 수 없다. 즉 ba 다음에 a를 인식할 수 없다.
      선택지 2: bab는 A → A → B → C로 종료상태에서 끝나 인식된다.
      선택지 3: babaa는 A → A → B → C → C → C로 인식된다.
      선택지 4: bbbbab는 A에서 b를 네 번 읽고 a로 B, b로 C에 가므로 인식된다.

      핵심 개념:
      이 오토마타의 언어는 b*aba*이다.
      전이가 정의되지 않은 입력을 만나면 인식에 실패한다.
      B에서는 b만 읽을 수 있다.
      C에 도달한 뒤에는 a만 몇 개든 읽을 수 있다.
    tags: [finite-automata]

  - id: b02-89
    type: multiple-choice
    passageRefs: [gwba-fa-abc-02]
    prompt: 위 유한 오토마타를 정규표현으로 표현한 것은?
    choices:
      - { id: '1', text: '$b^*aba$' }
      - { id: '2', text: '$b^*aba^*$' }
      - { id: '3', text: '$b^*baba^*$' }
      - { id: '4', text: '$bb^*aba^*$' }
    answers: ['2']
    explanation: |
      선택지 1: $b^*aba$는 C의 a 루프를 반영하지 못하고 a를 정확히 하나 요구한다.
      선택지 2: A → bA | aB, B → bC, C → aC | ε에서 C = aC + ε = a*, B = ba*, A = bA + aB = bA + aba* = $b^*aba^*$이다.
      선택지 3: $b^*baba^*$는 a 앞에 b가 최소 하나 있어야 하는데, 오토마타는 aba처럼 b 없이 시작하는 문자열도 인식한다.
      선택지 4: $bb^*aba^*$도 b가 최소 하나 있어야 하므로 aba를 나타내지 못한다.

      핵심 개념:
      C = aC + ε ⟹ C = a*.
      B = bC ⟹ B = ba*.
      A = bA + aB ⟹ A = b*aba*.
      시작상태의 자기 루프는 앞부분의 반복이 된다.
    tags: [finite-automata, regular-expression]

  - id: b03-01
