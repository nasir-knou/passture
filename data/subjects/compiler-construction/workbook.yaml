      선택지 1: E, T, F는 모두 시작기호에서 도달 가능하고 터미널 id를 생성하므로 불필요한 생성규칙은 없다.
      선택지 2: 이 문법은 우선순위가 계층(E, T, F)으로 반영되어 있어 모호한 문법이 아니다.
      선택지 3: E → E*T, T → T+F는 오른쪽이 자기 자신으로 시작하는 left-recursion이므로 top-down 구문분석에서 무한 루프에 빠진다. left-recursion을 제거해야 한다.
      선택지 4: 같은 접두사를 가진 서로 다른 규칙이 문제가 아니라 left-recursion이 문제이므로 left-factoring의 대상이 아니다.

      핵심 개념:
      A → Aα 꼴의 생성규칙을 left-recursion이라 한다.
      top-down 구문분석은 A를 전개할 때 다시 A를 먼저 전개하게 되어 입력을 소비하지 못하고 무한 루프에 빠진다.
      A → Aα | β는 A → βA′, A′ → αA′ | ε로 바꾸어 left-recursion을 제거한다.
      backtracking은 left-factoring, left-recursion은 left-recursion 제거로 해결한다.

  - id: b04-52
    type: multiple-choice
    passageRefs: [gwbb-lr-03]
    prompt: 다음은 주어진 문법에서 left-recursion을 제거하는 과정이다. (가)에 알맞은 것은?
    choices:
      - { id: '1', text: '*FR′' }
      - { id: '2', text: '+FE′' }
      - { id: '3', text: '+FR′ | ε' }
      - { id: '4', text: '*FR′ | ε' }
    answers: ['4']
    explanation: |
      선택지 1: ε이 빠지면 R′가 끝나지 못해 R → T 같은 짧은 유도를 표현할 수 없다.
      선택지 2: 연산자가 *가 아니라 +이고 비단말도 E′로 잘못되어 있다.
      선택지 3: 원래 규칙 R → R*F의 반복 부분은 +F가 아니라 *F이다.
      선택지 4: R → R*F | T에서 α = *F, β = T이므로 R → TR′, R′ → *FR′ | ε이다.

      핵심 개념:
      A → Aα | β는 A → βA′, A′ → αA′ | ε로 변환한다.
      α는 left-recursion 뒤에 반복되는 부분, β는 재귀가 아닌 나머지 규칙이다.
      결과 문법은 R → TR′, R′ → *FR′ | ε, T → F | R, F → id이다.
      A′의 ε 규칙은 반복이 0번일 때를 나타내므로 빠뜨리면 안 된다.

