    answers: ['2']
    explanation: |
      선택지 1: $01^*0$은 0으로 시작하는데, 문법 G의 문자열은 S → 1A로 1로 시작한다.
      선택지 2: 정규표현 방정식 S = 1A, A = 0A + 1에서 A = 0*1이고, 이를 대입하면 S = 1A = $10^*1$이다.
      선택지 3: $01^*0+1$은 0으로 시작하는 문자열과 1을 포함하므로 L(G)와 다르다.
