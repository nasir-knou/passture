      선택지 2: 생성규칙과 결합된 의미수행 코드를 호출해 중간코드를 만드는 것은 중간코드 생성 방법 중 구문지시적 변환에 대한 설명이므로 틀린 설명이다.
      선택지 3: 변수의 유형선언 과정으로, 변수명칭과 유형설명자가 기호표에 들어가고 변수가 기억장소를 배정받으므로 의미분석에서 하는 일이다.
      선택지 4: 유형정의 과정으로, 생성규칙의 의미에 따라 유형의 자료구조를 구성하고 유형설명자를 만들므로 의미분석에서 하는 일이다.

      핵심 개념:
      의미분석은 선언문을 처리해 기호표에 정보를 채우고, 실행문을 기호표를 이용해 중간코드로 바꾼다.
      상수정의·유형정의·변수의 유형선언·프로시저 선언이 의미분석 과정의 대표 작업이다.
      유형설명자는 유형의 크기와 성격을 보관해 기억장소 배정에 쓰인다.
      구문지시적 변환은 구문분석과 동시에 의미수행 코드로 중간코드를 만드는 중간코드 생성 방법이다.

