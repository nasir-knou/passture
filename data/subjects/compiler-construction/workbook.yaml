    prompt: '알파벳 $T = \{a, b, +\}$일 때 다음 중 문자열이 ==아닌== 것은?'
    choices:
      - { id: '1', text: 'a * b' }
      - { id: '2', text: 'ab' }
      - { id: '3', text: 'ab+aa' }
      - { id: '4', text: '$\varepsilon$' }
    answers: ['1']
    explanation: |
      선택지 1: 알파벳의 원소인 기호는 a, b, + 뿐이다. ‘*’는 알파벳의 기호가 아니므로 a * b는 문자열이 아니다.
      선택지 2: ab는 기호 a와 b를 나열한 것이므로 문자열이다.
      선택지 3: ab+aa는 a, b, + 만으로 이루어졌으므로 문자열이다.
      선택지 4: ε은 기호가 0개 나열된 공문자열로, 모든 알파벳 위에서 문자열이다.

      핵심 개념:
      알파벳은 기호들의 유한집합이다.
      문자열은 알파벳의 기호를 0개 또는 1개 이상 나열한 것이다.
      알파벳에 없는 기호가 하나라도 들어가면 그 알파벳 위의 문자열이 아니다.
      길이가 0인 문자열을 공문자열이라 하고 ε(또는 λ)으로 표시한다.
    tags: [alphabet, string]

  - id: b02-02
    type: multiple-choice
    prompt: '알파벳 $T = \{a, b, c\}$에서 만들 수 ==없는== 문자열은?'
    choices:
      - { id: '1', text: '$\varepsilon$' }
      - { id: '2', text: '$a^n b^n$' }
      - { id: '3', text: '$a^*$' }
      - { id: '4', text: 'a * b' }
    answers: ['4']
    explanation: |
      선택지 1: ε은 기호를 0개 나열한 공문자열이므로 만들 수 있다.
      선택지 2: $a^n b^n$은 a가 n개, b가 n개 나열된 문자열로 a, b만 사용하므로 만들 수 있다.
      선택지 3: $a^*$는 a를 0번 이상 반복한 문자열들을 나타내며 a만 사용하므로 만들 수 있다.
      선택지 4: a * b에서 ‘*’ 기호는 알파벳에 없으므로 만들 수 없다.

      핵심 개념:
      문자열은 알파벳을 구성하는 기호들이 0 또는 하나 이상 나열된 것이다.
      $a^n$은 a가 n개 나열된 문자열이다.
      $a^*$의 *는 반복을 나타내는 연산 표기로, 알파벳의 기호가 아니다.
      문자열 안에 기호로 직접 나타나는 ‘*’는 알파벳에 있어야 한다.
    tags: [alphabet, string]

  - id: b02-03
    type: multiple-choice
    prompt: '알파벳 $T = \{a, b, c, d\}$에서 만들 수 ==없는== 문자열은?'
    choices:
      - { id: '1', text: '$\varepsilon$' }
      - { id: '2', text: '$a^n b^n d$' }
      - { id: '3', text: '$a^*$' }
      - { id: '4', text: 'a * bd' }
    answers: ['4']
    explanation: |
      선택지 1: ε은 길이가 0인 공문자열(empty string)이므로 만들 수 있다.
      선택지 2: $a^n b^n d$는 a, b, d로만 이루어지므로 만들 수 있다.
      선택지 3: $a^*$는 a의 0번 이상 반복이므로 만들 수 있다.
      선택지 4: a * bd의 ‘*’는 T에 없는 기호이므로 a * bd는 문자열이 아니다.

      핵심 개념:
      알파벳 T는 기호들의 유한집합이다.
      a, b, c, d 같은 기호가 0 또는 1개 이상 나열(sequence)된 것이 문자열이다.
      길이가 0인 문자열을 공문자열이라 하며 ε 혹은 λ로 표시한다.
      문자열에 쓰인 모든 기호가 알파벳에 속하는지 확인한다.
    tags: [alphabet, string]

  - id: b02-04
    type: multiple-choice
    prompt: '알파벳 $T = \{a, b, c, d\}$에서 $T^+$에 속하지 ==않는== 것은?'
    choices:
      - { id: '1', text: '$\varepsilon$' }
      - { id: '2', text: '$a^n d$' }
      - { id: '3', text: '$ba^*$' }
      - { id: '4', text: 'aadc' }
    answers: ['1']
    explanation: |
      선택지 1: $T^+$는 $T^*$에서 공문자열(ε)을 제외한 모든 문자열의 집합이므로 ε은 $T^+$에 속하지 않는다.
      선택지 2: $a^n d$는 최소한 d를 포함해 길이가 1 이상이므로 $T^+$에 속한다.
      선택지 3: $ba^*$는 b로 시작해 길이가 1 이상이므로 $T^+$에 속한다.
      선택지 4: aadc는 T의 기호로 이루어진 길이 4의 문자열이므로 $T^+$에 속한다.

      핵심 개념:
      $T^*$는 공문자열을 포함해 T의 기호로 만들 수 있는 모든 문자열의 집합이다.
      $T^* = \{\varepsilon, a, b, c, d, aa, ab, ac, ad, \dots\}$
      $T^+ = T^* - \{\varepsilon\} = \{a, b, c, d, aa, ab, ac, ad, \dots\}$
      ε은 $T^*$에는 속하지만 $T^+$에는 속하지 않는다.
    tags: [kleene-closure, positive-closure]

  - id: b02-05
    type: multiple-choice
    prompt: 다음 설명 중 ==틀린== 것은?
    choices:
      - { id: '1', text: '형식언어 : 알파벳에서 얻은 기호들로 구성되는 문자열의 집합' }
      - { id: '2', text: '알파벳 : 기호들의 유한집합' }
      - { id: '3', text: '문자열 : 알파벳을 구성하는 기호가 1개 이상 나열된 것' }
      - { id: '4', text: '알파벳 T에 대한 형식언어 : $T^*$의 부분집합' }
    answers: ['3']
    explanation: |
      선택지 1: 형식언어는 알파벳에서 얻은 기호들로 구성되는 문자열의 집합이므로 맞는 설명이다.
      선택지 2: 알파벳은 기호들의 유한집합이므로 맞는 설명이다.
      선택지 3: 문자열은 알파벳을 구성하는 기호가 0 또는 1개 이상 나열된 것이다. 즉 공문자열도 포함하므로 1개 이상이라고 한 것은 틀렸다.
      선택지 4: 알파벳 T에 대한 형식언어는 $T^*$의 부분집합이므로 맞는 설명이다.

      핵심 개념:
      기호 → 알파벳(기호의 유한집합) → 문자열(기호의 나열) → 언어(문자열의 집합) 순으로 정의된다.
      문자열의 길이는 0일 수 있으며, 그것이 공문자열 ε이다.
      언어 L은 $T^*$의 부분집합이다.
      공문자열 포함 여부가 $T^*$와 $T^+$를 가른다.
    tags: [formal-language, string]

  - id: b02-06
    type: multiple-choice
    prompt: '집합 $T = \{a, b, c\}$에 대하여 다음 설명 중 ==틀린== 것은?'
    choices:
