      선택지 2: $a^n$은 a가 n개 나열된 문자열이므로 맞는 설명이다.
      선택지 3: $T^*$는 공문자열을 포함한 모든 문자열의 집합이므로 맞는 설명이다.
      선택지 4: T에 대한 언어 L은 $T^*$의 부분집합이므로 맞는 설명이다.

      핵심 개념:
      기호들의 유한집합을 알파벳이라 한다.
      문장(sentence)은 문법으로부터 유도되는 터미널 기호만으로 된 문자열이다.
      $T^*$는 T 위의 모든 문자열의 집합이다.
