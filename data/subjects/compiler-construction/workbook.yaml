      선택지 2: S5는 I₀에서 id를 읽고 I₅로 가는 동작으로, 상태 0의 id 칸에 들어간다.
      선택지 3: S6은 I₁에서 + 를 읽고 I₆으로 가는 동작으로, 상태 1의 + 칸에 들어간다.
      선택지 4: S7은 I₂에서 * 를 읽고 I₇로 가는 동작으로, 상태 2의 * 칸에 들어간다.

      핵심 개념:
      GOTO(Iᵢ, a) = Iⱼ이고 a가 터미널이면 ACTION[i, a] = shift j(Sj)이다.
      GOTO(Iᵢ, A) = Iⱼ이고 A가 논터미널이면 GOTO[i, A] = j이다.
      [S′ → S·]가 있는 상태에서는 ACTION[i, \$] = accept이다.
