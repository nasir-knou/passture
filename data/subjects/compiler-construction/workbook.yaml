    answers: ['1']
    explanation: |
      선택지 1: 연산자 문법은 ε-생성규칙을 갖지 않고 생성규칙 오른쪽에 두 개 이상의 논터미널이 연속해서 나오지 않는 문법으로, 문제의 정의와 같다.
      선택지 2: 단순순위 문법은 ε-생성규칙이 없고 오른쪽 부분이 같은 생성규칙이 없으며 기호 사이에 많아야 한 개의 Wirth-Weber 순위관계를 갖는 문법이다. 논터미널 연속 금지 조건과는 관계없다.
      선택지 3: 확장순위 문법은 두 문자열 x, y 사이에 많아야 한 개의 확장 순위관계를 갖는 문법이다.
      선택지 4: 연산자순위 문법은 연산자 문법이면서 두 터미널 기호 사이에 많아야 한 개의 연산자순위 관계를 갖는 문법이다. 문제의 조건만으로는 순위관계 조건이 빠져 있으므로 연산자 문법이 답이다.

      핵심 개념:
      연산자 문법: ε-생성규칙이 없고 오른쪽에 논터미널이 연속해서 나오지 않는다.
      연산자순위 문법: 연산자 문법 + 두 터미널 사이에 많아야 한 개의 연산자순위 관계.
      단순순위 문법: ε-생성규칙이 없고 오른쪽이 같은 생성규칙이 없으며, 두 기호 사이에 많아야 한 개의 Wirth-Weber 순위관계.
      확장순위 문법은 두 문자열 사이, 한정순위 문법은 두 기호 사이의 순위관계로 정의한다.
    tags: [precedence-grammar, operator-grammar]

  - id: b05-20
    type: multiple-choice
    prompt: 다음 중 단순순위 문법과 ==관계없는== 것은?
    choices:
