      선택지 1: shift 3은 상태 0에서 c를 만났을 때의 행동이다. 0단계 입력기호는 d이다.
      선택지 2: CLR 파싱표에서 상태 = 0, 입력기호 = d인 칸은 S4이므로 shift 4이다. 그 결과 1단계 스택이 0d4가 된다.
      선택지 3: shift 6은 상태 2나 6에서 c를 만났을 때의 행동이다.
      선택지 4: shift 7은 상태 2나 6에서 d를 만났을 때의 행동이다. 상태 0의 d는 상태 4로 간다.

      핵심 개념:
      LR 구문분석 추적표는 매 단계 (스택, 남은 입력, 행동)을 기록한다.
      shift n을 하면 입력기호와 상태 n을 스택에 넣고 입력 포인터를 한 칸 옮긴다.
      다음 단계의 스택 내용을 보면 앞 단계 행동을 검산할 수 있다(0 → 0d4).
      dcd 분석은 shift 4, reduce 3, goto 2, shift 6, shift 7, reduce 3, goto 9, reduce 2, goto 5, reduce 1, goto 1, acc 순이다.

