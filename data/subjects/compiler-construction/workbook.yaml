      선택지 4: E → E + E는 reduce 규칙이며, 스택에 E + E가 없으므로 이 단계의 동작이 될 수 없다.

      핵심 개념:
      스택 꼭대기 \$E-는 어떤 생성규칙 오른쪽과도 일치하지 않으므로 환원할 수 없다.
      이런 경우 입력 버퍼의 맨 앞 기호를 스택으로 옮기는 shift를 한다.
      shift 직후 스택 꼭대기에 id가 오면 다음 단계에서 E → id로 환원한다.
      Shift-reduce 구문분석은 스택 내용과 남은 입력을 붙이면 항상 우문장형이 되도록 진행된다.
    tags: [shift-reduce-parsing]

  - id: b05-16
    type: multiple-choice
    passageRefs: [gwbc-sr-grammar-02, gwbc-sr-trace-02]
    prompt: (다)에 알맞은 것은?
    choices:
      - { id: '1', text: 'id' }
      - { id: '2', text: 'E → id' }
      - { id: '3', text: 'E → E - E' }
      - { id: '4', text: 'E → E + E' }
    answers: ['2']
    explanation: |
      선택지 1: 7단계는 입력이 \$만 남은 reduce 동작이므로 shift 대상인 id가 들어갈 수 없다.
      선택지 2: 7단계 스택 \$E-E+id의 꼭대기 id가 핸들이므로 E → id로 환원한다. 8단계 스택이 \$E-E+E가 된 것과 일치한다.
      선택지 3: 스택 꼭대기가 id이므로 E - E는 아직 스택 꼭대기에 나타나지 않았다. E - E 환원은 9단계에서 일어난다.
      선택지 4: E + E 환원은 id를 E로 바꾼 다음 단계(8단계)에서 일어난다.

      핵심 개념:
      id가 스택 꼭대기에 올라오면 곧바로 E → id로 환원해 피연산자 E를 만든다.
      reduce는 스택 꼭대기의 핸들을 생성규칙 왼쪽 비단말로 바꾸는 동작이다.
      환원 순서는 우단유도 E ⇒ E - E ⇒ E - E + E ⇒ E - E + id ⇒ E - id + id ⇒ id - id + id의 역순을 따른다.
      따라서 id → E, E + E → E, E - E → E 순으로 환원된다.
    tags: [shift-reduce-parsing, handle]

  - id: b05-17
    type: multiple-choice
    passageRefs: [gwbc-sr-grammar-02, gwbc-sr-trace-02]
    prompt: (라)에 알맞은 것은?
    choices:
      - { id: '1', text: 'id' }
      - { id: '2', text: 'E → id' }
      - { id: '3', text: 'E → E - E' }
      - { id: '4', text: 'E → E + E' }
    answers: ['3']
    explanation: |
      선택지 1: 9단계에는 입력이 \$만 남아 shift할 id가 없다.
      선택지 2: 9단계 스택 \$E-E에는 id가 없으므로 E → id로 환원할 수 없다.
      선택지 3: 9단계 스택 \$E-E의 꼭대기 E-E가 핸들이므로 E → E-E로 환원한다. 10단계 스택이 \$E가 되어 accept한다.
      선택지 4: E + E 환원은 8단계에서 이미 끝났고, 스택에 +가 남아 있지 않다.

      핵심 개념:
      5단계에서 스택 \$E-E를 reduce하지 않고 +를 shift했으므로 E + E가 먼저 환원되고 E - E가 마지막에 환원된다.
      E → E - E | E + E | id는 모호한 문법이어서 shift와 reduce 중 무엇을 고르는지에 따라 결합 순서가 달라진다.
      같은 우선순위의 연산자를 왼쪽 결합으로 처리하려면 5단계에서 reduce를 선택해야 한다.
      입력이 모두 소비되고 스택에 시작기호만 남으면 accept한다.
    tags: [shift-reduce-parsing, handle]

  # ===== 5.2.2 여러 가지의 순위문법과 용어 정의 =====
  - id: b05-18
    type: multiple-choice
    prompt: 다음 중 나머지 셋과 다른 하나는?
    choices:
      - { id: '1', text: '연산자순위 문법' }
      - { id: '2', text: '단순순위 문법' }
      - { id: '3', text: '확장순위 문법' }
      - { id: '4', text: 'LR(1) 문법' }
    answers: ['4']
    explanation: |
      선택지 1: 연산자순위 문법은 터미널(연산자) 기호 사이의 순위관계로 핸들을 찾는 순위문법이다.
      선택지 2: 단순순위 문법은 두 기호 사이에 많아야 한 개의 Wirth-Weber 순위관계를 갖는 순위문법이다.
      선택지 3: 확장순위 문법은 두 문자열 사이의 순위관계로 확장한 순위문법이다.
      선택지 4: LR(1)(Left-to-right scan, Rightmost derivation, 1-symbol lookahead) 문법은 순위관계가 아니라 상태와 미리보기 기호 1개로 구문분석표를 만드는 LR 계열 문법이므로 나머지 셋과 다르다.

      핵심 개념:
      순위문법(precedence grammar)은 기호 사이의 순위관계(⋖, ≐, ⋗)로 핸들의 왼쪽·오른쪽 끝을 찾는 상향식 구문분석용 문법이다.
      순위문법에는 연산자순위, 단순순위, 확장순위, 한정순위 문법 등이 있다.
      LR 구문분석은 순위관계 대신 LR 항목 집합으로 만든 상태와 파싱표(ACTION, GOTO)를 사용한다.
      둘 다 상향식 구문분석이지만 핸들을 결정하는 방법이 다르다.
    tags: [precedence-grammar, lr-parsing]

  - id: b05-19
    type: multiple-choice
    prompt: ε-생성규칙을 갖지 않고, 생성규칙의 오른쪽에 두 개 이상의 논터미널이 연속해서 나올 수 없는 문법은?
    choices:
      - { id: '1', text: '연산자 문법' }
      - { id: '2', text: '단순순위 문법' }
      - { id: '3', text: '확장순위 문법' }
