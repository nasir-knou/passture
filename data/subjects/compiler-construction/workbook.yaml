      선택지 2: 토큰이름은 토큰표에 표시하는 항목이다.
      선택지 3: 토큰번호는 토큰표에 표시하는 항목이다.
      선택지 4: 토큰값은 토큰표에 표시하는 항목이다.

      핵심 개념:
      토큰표에는 토큰이름, 토큰번호, 토큰값을 표시한다.
      토큰번호는 토큰의 종류를 구분하는 값이다.
      토큰값은 같은 종류 안에서 개별 토큰을 구분하는 값이다.
      토큰표는 어휘분석기 설계의 첫 단계에서 작성한다.
    tags: [token-table, lexical-analyzer-design]

  - id: b03-06
    type: multiple-choice
    prompt: 다음은 어휘분석기를 설계하는 과정이다. ==틀린== 것은?
    choices:
      - { id: '1', text: '정규문법이 주어지고 정규표현으로 표시한다. 그리고 주어진 문법에 대한 기호표를 작성한다.' }
      - { id: '2', text: '5종류의 토큰 중에서 어느 것이 사용되는가를 조사하여 토큰표를 작성한다. 토큰표에는 토큰이름, 토큰번호, 토큰값을 표시한다.' }
      - { id: '3', text: '문법을 보고 NFA를 구성하고 이를 다시 DFA로 변환 후 최소화한다.' }
      - { id: '4', text: '예약어표 검색은 상태전이도로 구현하거나, 표를 만들어 저장한 다음 검색하도록 한다.' }
    answers: ['1']
    explanation: |
      선택지 1: 정규문법이 주어지고 정규표현으로 표시한 뒤에는 주어진 문법에 대한 토큰표를 작성해야 한다. 기호표가 아니라 토큰표가 올바르므로 틀렸다.
      선택지 2: 5종류의 토큰 중 사용되는 것을 조사해 토큰표(토큰이름, 토큰번호, 토큰값)를 작성하므로 맞는 설명이다.
      선택지 3: 문법으로 NFA를 구성하고 DFA로 변환한 뒤 최소화하므로 맞는 설명이다.
      선택지 4: 예약어는 상태전이도로 인식하거나 예약어표를 만들어 검색하므로 맞는 설명이다.

      핵심 개념:
      어휘분석기 설계 순서: 정규문법/정규표현 → 토큰표 작성 → NFA 구성 → DFA 변환·최소화 → 프로그램 작성.
      토큰표는 설계 단계, 기호표는 실제 분석 과정에서 식별자 정보를 저장할 때 사용한다.
      예약어는 식별자와 형태가 같으므로 예약어표로 구분한다.
      최소화한 DFA로 어휘분석 프로그램을 구현한다.
    tags: [lexical-analyzer-design, token-table]

  - id: b03-07
    type: multiple-choice
    prompt: 다음은 어휘분석기의 구현에서 고려할 사항이다. 가장 거리가 ==먼== 것은?
    choices:
      - { id: '1', text: '문법이 명확하게 주어져야 한다.' }
