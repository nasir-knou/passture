      - { id: '3', text: 'reduce 3' }
      - { id: '4', text: 'goto 2' }
    answers: ['3']
    explanation: |
      선택지 1: shift 3은 상태 0, 3에서 c를 만났을 때의 행동이다. 2단계 스택 top은 상태 4이다.
      선택지 2: shift 4는 1단계에서 이미 수행되었다(0c3 → 0c3d4).
      선택지 3: 2단계는 상태 4, 입력기호 c이다. CLR 파싱표 [4, c] = r3이므로 C → d로 환원하는 reduce 3이며, 3단계 스택이 0c3C가 된다.
      선택지 4: goto 2는 GOTO[0, C]이다. 여기서는 환원 뒤 C 아래 상태가 3이므로 이후 GOTO[3, C] = 8이 적용된다.

      핵심 개념:
      상태 4 = {[C → d·, c/d]}는 c, d 칸에 r3을 가진다.
      cdcd에서 첫 d 뒤에 c가 오므로 lookahead c로 환원이 일어난다.
      환원 후 스택 0c3C에서 GOTO[3, C] = 8이 되어 0c3C8이 되고, 다시 r2로 C → cC를 환원한다.
      reduce 이후 GOTO 대상은 항상 새 논터미널 바로 아래 상태로 결정된다.

  # ---- 5.2.6 (17~19): CLR 그래프로부터 LALR ----
  - id: b05-80
    type: multiple-choice
    passageRefs: [gwbd-clr-grammar-01, gwbd-clr-graph-01, gwbd-clr-items-01]
    prompt: 다음은 CLR 그래프로부터 LALR 파싱표를 구하는 과정이다. I₄₇을 구하면?
    choices:
      - { id: '1', text: '[C → d·]' }
      - { id: '2', text: '[C → d·, \$]' }
      - { id: '3', text: '[C → d·, c/d]' }
      - { id: '4', text: '[C → d·, c/d/\$]' }
    answers: ['4']
    explanation: |
      선택지 1: [C → d·]는 lookahead가 없는 LR(0) 항목으로 두 상태의 공통 core일 뿐이다. LALR 항목은 lookahead를 가진다.
      선택지 2: [C → d·, \$]는 합치기 전의 I₇만 나타낸다.
      선택지 3: [C → d·, c/d]는 합치기 전의 I₄만 나타낸다.
      선택지 4: I₄ = {[C → d·, c/d]}와 I₇ = {[C → d·, \$]}는 core가 같으므로 I₄ ∪ I₇ ⟹ I₄₇ = {[C → d·, c/d/\$]}이다.

      핵심 개념:
      LALR 상태는 CLR 그래프에서 core(LR(0) 부분)가 같은 상태를 하나로 합쳐 만든다.
      합칠 때 각 항목의 lookahead는 합집합이 된다.
      I₄₇은 c, d, \$ 세 칸에 모두 r3을 가진다.
      상태 수는 LR(0)과 같아져 파싱표가 CLR보다 작아진다.

  - id: b05-81
    type: multiple-choice
    passageRefs: [gwbd-clr-grammar-01, gwbd-clr-graph-01, gwbd-clr-items-01]
    prompt: 다음은 CLR 그래프로부터 LALR 파싱표를 구하는 과정이다. I₈₉를 구하면?
    choices:
      - { id: '1', text: '[C → cC·]' }
      - { id: '2', text: '[C → cC·, \$]' }
      - { id: '3', text: '[C → cC·, c/d]' }
      - { id: '4', text: '[C → cC·, c/d/\$]' }
    answers: ['4']
    explanation: |
      선택지 1: [C → cC·]는 lookahead를 뺀 core만 적은 것이다.
      선택지 2: [C → cC·, \$]는 I₉만 나타낸다.
      선택지 3: [C → cC·, c/d]는 I₈만 나타낸다.
      선택지 4: I₈ = {[C → cC·, c/d]}와 I₉ = {[C → cC·, \$]}는 core가 같으므로 I₈ ∪ I₉ ⟹ I₈₉ = {[C → cC·, c/d/\$]}이다.

      핵심 개념:
      이 문법의 CLR 그래프에서 core가 같은 쌍은 I₃와 I₆, I₄와 I₇, I₈과 I₉이다.
      합친 결과 I₃₆ = {[C → c·C, c/d/\$], [C → ·cC, c/d/\$], [C → ·d, c/d/\$]}, I₄₇, I₈₉가 된다.
      LALR 파싱표는 0: S36 S47, 2: S36 S47, 36: S36 S47 / GOTO 89, 47: r3 r3 r3, 89: r2 r2 r2가 된다.
      상태를 합쳐도 shift-reduce 충돌은 새로 생기지 않지만 reduce-reduce 충돌은 생길 수 있다.

  - id: b05-82
    type: multiple-choice
    passageRefs: [gwbd-clr-graph-01, gwbd-clr-items-01]
    prompt: CLR 그래프로부터 LALR의 파싱표를 구할 수 있다. 다음은 core가 같은 상태를 찾는 과정인데 ==틀린== 것은?
    choices:
      - { id: '1', text: 'I₁ ∪ I₅ ⟹ I₁₅' }
      - { id: '2', text: 'I₃ ∪ I₆ ⟹ I₃₆' }
      - { id: '3', text: 'I₄ ∪ I₇ ⟹ I₄₇' }
      - { id: '4', text: 'I₈ ∪ I₉ ⟹ I₈₉' }
    answers: ['1']
    explanation: |
      선택지 1: I₁ = {[S′ → S·, \$]}과 I₅ = {[S → CC·, \$]}는 core가 서로 달라 합칠 수 없다. 따라서 틀린 것이다.
      선택지 2: I₃와 I₆은 core가 [C → c·C], [C → ·cC], [C → ·d]로 같고 lookahead만 c/d와 \$ 로 다르므로 I₃₆으로 합친다.
      선택지 3: I₄와 I₇은 core가 [C → d·]로 같으므로 I₄₇로 합친다.
      선택지 4: I₈과 I₉는 core가 [C → cC·]로 같으므로 I₈₉로 합친다.

      핵심 개념:
      core는 LR(1) 항목에서 lookahead를 뺀 LR(0) 항목 부분이다.
      LALR은 core가 완전히 같은 상태끼리만 합치고 lookahead는 합집합으로 만든다.
      lookahead가 같다는 이유로 합치는 것이 아니다(I₁과 I₅는 lookahead가 모두 \$ 이지만 core가 다르다).
      합친 뒤에는 LR(0) 상태 수와 같은 7개 상태(0, 1, 2, 36, 47, 5, 89)가 된다.

  # ---- 5.2.7 LALR 구문분석 ----
  - id: b05-83
    type: multiple-choice
    prompt: 다음은 LALR 구문분석에 관한 설명이다. ==틀린== 것은?
    choices:
      - { id: '1', text: 'lookahead 정보를 이용하기 때문에 SLR 방법보다 훨씬 강력하다.' }
      - { id: '2', text: 'LALR 파싱표를 구성하려면 반드시 CLR 파싱표를 구해야 한다.' }
      - { id: '3', text: 'lookahead 기호를 구하는 데 상당한 시간과 노력이 소요된다.' }
      - { id: '4', text: 'CLR 파싱표보다 LALR 파싱표가 훨씬 작다.' }
    answers: ['2']
    explanation: |
      선택지 1: LALR은 FOLLOW 대신 lookahead로 reduce 칸을 정하므로 SLR로 처리하지 못하는 문법도 처리할 수 있어 옳다.
      선택지 2: LALR 파싱표는 LR(1) 항목(CLR)에서 유도하는 방법 외에 LR(0) 항목에서 유도하는 방법도 있다. 반드시 CLR 파싱표를 구해야 하는 것은 아니므로 틀린 설명이다.
      선택지 3: LR(0) 항목에서 LALR을 만들 때는 각 reduce 항목의 lookahead를 따로 구해 주어야 하므로 시간과 노력이 든다는 설명은 옳다.
      선택지 4: LALR은 core가 같은 상태를 합쳐 상태 수가 LR(0)과 같으므로 CLR 파싱표보다 훨씬 작다.

      핵심 개념:
      LALR 파싱표를 만드는 방법은 LR(1)에서 유도하는 방법과 LR(0)에서 유도하는 방법 두 가지이다.
      LR(1)에서 유도할 때는 같은 core를 가진 LR(1) 항목을 합치고 reduce 항목의 lookahead를 합집합으로 만든다.
      LR(0)에서 유도할 때는 SLR처럼 canonical collection을 만들고 shift, accept, GOTO는 SLR과 같게 채운다.
      단, reduce 행동은 각 reduce 항목의 lookahead로 결정하므로 lookahead를 구해 주어야 한다.

  # ---- 5.3 Top-down 구문분석 ----
  - id: b05-84
    type: multiple-choice
    prompt: 다음 중 top-down 구문분석에 대한 설명 중 ==틀린== 것은?
    choices:
      - { id: '1', text: 'backtracking의 경우 효율을 떨어뜨리므로 left-factoring을 해야 한다.' }
      - { id: '2', text: 'left-recursion의 경우 무한 루프에 빠지므로 right-recursion으로 바꾸어 주어야 한다.' }
      - { id: '3', text: '이러한 문제점을 해결한 결정적인 구문분석을 LL 구문분석이라고 한다.' }
      - { id: '4', text: '일반적으로 bottom-up 방식보다 편리하므로 자주 사용된다.' }
    answers: ['4']
    explanation: |
      선택지 1: 같은 접두사를 가진 생성규칙이 여러 개면 어느 규칙을 쓸지 몰라 backtracking이 생기므로 공통 접두사를 묶는 left-factoring을 한다. 옳은 설명이다.
      선택지 2: A → Aα 같은 left-recursion은 A를 전개할 때 입력을 소비하지 않고 A를 계속 전개해 무한 루프에 빠지므로 right-recursion으로 바꾼다. 옳은 설명이다.
      선택지 3: backtracking, left-recursion 문제를 없애 결정적으로 분석하는 top-down 방법이 LL(Left-to-right scanning, Left parse) 구문분석이다. 옳은 설명이다.
      선택지 4: top-down 방식은 문법 변형 등 제약이 많아, 일반적으로는 문법적 제약이 적은 bottom-up 방식을 더 많이 사용한다. 따라서 틀린 설명이다.

      핵심 개념:
      top-down 구문분석은 시작기호에서 출발해 좌단유도로 입력 문자열을 만들어 가는 방식이다.
      주요 문제는 backtracking, left-recursion으로 인한 무한 루프, 공통 접두사로 인한 비효율이다.
      해결책은 backtracking 제거, left-recursion을 right-recursion으로 변환, left-factoring이다.
      이를 만족하는 결정적 분석이 LL 구문분석이고, 이 조건을 만족하는 문법이 LL 문법이다.

