    answers: ['3']
    explanation: |
      선택지 1: shift는 입력기호를 스택에 넣는 행동이다. 2단계는 방금 환원으로 F가 올라온 상태라 입력을 읽지 않고 GOTO를 먼저 적용해야 한다.
      선택지 2: reduce 4는 상태 3이 스택 top에 있을 때의 행동이다. 2단계 스택 0F에는 아직 F 다음 상태가 없다.
      선택지 3: 스택 0F에서 F 아래의 상태가 0이다. 파싱표 GOTO 부분 [0, F] 칸이 3이므로 goto 3이 되어 스택은 0F3이 된다.
      선택지 4: reduce 6은 1단계에서 이미 수행되었다. 2단계는 그 결과로 생긴 F에 대해 GOTO를 적용하는 단계이다.

      핵심 개념:
      reduce A → β를 하면 스택에서 β와 그 상태들을 꺼내고 A를 넣는다.
