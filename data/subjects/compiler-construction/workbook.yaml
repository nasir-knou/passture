      GOTO 부분은 논터미널 열(E, T, F)로만 이루어지며 LR(0) 항목 집합 사이의 논터미널 전이를 나타낸다.
      이 예에서 GOTO[0, F] = 3은 GOTO(I₀, F) = I₃ = {[T → F·]}에서 나온다.

