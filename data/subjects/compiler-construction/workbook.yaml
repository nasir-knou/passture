questions:
  - id: b01-01
    type: multiple-choice
    prompt: 다음 중 저급언어를 저급언어로 번역하는 기능을 갖고 있는 번역기는?
    choices:
      - { id: '1', text: '어셈블러' }
      - { id: '2', text: '컴파일러' }
      - { id: '3', text: '프리프로세서' }
      - { id: '4', text: '인터프리터' }
    answers: ['1']
    explanation: |
      선택지 1: 어셈블러는 저급언어인 어셈블리어를 입력으로 받아 저급언어인 기계어로 번역하는 번역기이다.
      선택지 2: 컴파일러는 고급언어를 어셈블리어나 기계어 같은 저급언어로 번역하므로 입력이 저급언어가 아니다.
      선택지 3: 프리프로세서는 고급언어에 확장 기능을 번역해 다시 고급언어로 출력하는 전처리기이다.
      선택지 4: 인터프리터는 고급언어 프로그램을 받아 번역 결과가 아니라 실행 결과를 출력한다.

      핵심 개념:
      번역기는 입력 언어와 출력 언어의 수준으로 구분한다.
      어셈블러: 어셈블리어(저급) → 기계어(저급).
      컴파일러: 고급언어 → 어셈블리어 또는 기계어.
      프리프로세서: 고급언어 → 고급언어, 인터프리터: 고급언어 → 실행 결과.
    tags: [translator, assembler]

  - id: b01-02
    type: multiple-choice
    prompt: 다음 중 고급언어를 저급언어로 번역하는 번역기는?
    choices:
      - { id: '1', text: '어셈블러' }
      - { id: '2', text: '컴파일러' }
      - { id: '3', text: '프리프로세서' }
      - { id: '4', text: '인터프리터' }
    answers: ['2']
    explanation: |
      선택지 1: 어셈블러는 어셈블리어를 기계어로 번역하므로 입력이 저급언어이다.
      선택지 2: 컴파일러는 고급언어로 작성된 원시 프로그램을 어셈블리어나 기계어 같은 저급언어로 번역한다.
      선택지 3: 프리프로세서는 고급언어를 받아 다시 고급언어로 출력하므로 저급언어를 만들지 않는다.
      선택지 4: 인터프리터는 고급언어 프로그램을 받아 곧바로 실행 결과를 출력한다.

      핵심 개념:
      저급언어는 기계의 구성과 관련이 깊은 기계 중심 언어(low-level language)이다.
      고급언어는 사람이 이해하기 쉬운 문제 중심 언어이다.
      컴파일러는 고급언어를 저급언어로 번역하는 대표적인 번역기이다.
