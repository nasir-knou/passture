      컴파일러 기법은 번역을 한 번만 하므로 반복 실행이 많을수록 유리하다.
      인터프리터 기법은 실행할 때마다 디코드하므로 반복이 많으면 불리하다.
      인터프리터는 원시 프로그램을 중간코드로 바꾼 뒤 명령어 단위로 실행한다.
      언어별 구현 기법(컴파일러 언어와 인터프리터 언어)을 구분해 둔다.
    tags: [compiler, interpreter]

  - id: b01-12
    type: multiple-choice
    prompt: 컴파일러의 논리적 구조와 물리적 구조가 일치하면 몇 개의 패스가 만들어지는가?
    choices:
      - { id: '1', text: '1' }
      - { id: '2', text: '2' }
      - { id: '3', text: '4' }
      - { id: '4', text: '6' }
    answers: ['4']
    explanation: |
      선택지 1: 1-패스는 논리적 단계 전체를 한 번의 패스로 묶어 처리하는 경우로, 논리적 구조와 일치하지 않는다.
      선택지 2: 2-패스는 여러 단계를 두 묶음으로 처리하는 경우이다.
      선택지 3: 4개로는 6단계 논리적 구조를 하나씩 대응시킬 수 없다.
      선택지 4: 논리적 구조는 어휘분석, 구문분석, 의미분석, 중간코드 생성, 코드최적화, 목적코드 생성의 6단계이므로 일치시키면 6개의 패스가 만들어진다.

      핵심 개념:
      컴파일러의 논리적 구조는 6단계로 이루어진다.
      물리적 구조는 이 단계들을 몇 번의 패스로 묶어 구현하는지를 뜻한다.
      패스(pass)는 원시 프로그램이나 중간 표현을 한 번 처음부터 끝까지 읽어 처리하는 단위이다.
      단계마다 패스를 하나씩 두면 패스 수는 논리적 단계 수와 같다.
    tags: [compiler-structure, pass]

  - id: b01-13
    type: multiple-choice
    prompt: 컴파일러의 논리적 구조가 올바르게 나열된 것은?
    choices:
      - { id: '1', text: '어휘분석 – 구문분석 – 의미분석 – 중간코드 생성 – 코드최적화 – 목적코드 생성' }
      - { id: '2', text: '어휘분석 – 의미분석 – 구문분석 – 중간코드 생성 – 코드최적화 – 목적코드 생성' }
      - { id: '3', text: '어휘분석 – 구문분석 – 의미분석 – 코드최적화 – 중간코드 생성 – 목적코드 생성' }
      - { id: '4', text: '어휘분석 – 구문분석 – 중간코드 생성 – 의미분석 – 코드최적화 – 목적코드 생성' }
    answers: ['1']
    explanation: |
      선택지 1: 어휘분석 – 구문분석 – 의미분석 – 중간코드 생성 – 코드최적화 – 목적코드 생성은 컴파일러 논리적 구조의 올바른 순서이다.
      선택지 2: 의미분석은 구문분석 결과인 파스트리를 이용하므로 구문분석보다 앞에 올 수 없다.
      선택지 3: 코드최적화는 생성된 중간코드를 개선하는 단계이므로 중간코드 생성보다 앞에 올 수 없다.
      선택지 4: 의미분석은 중간코드 생성 전에 파스트리를 해석하며 유형 검사를 하는 단계이므로 순서가 바뀌었다.

      핵심 개념:
      어휘분석은 원시 프로그램을 토큰으로 분리한다.
      구문분석은 토큰 열이 문법에 맞는지 검사하고 파스트리를 만든다.
      의미분석은 파스트리를 따라 유형 검사 등을 하고, 중간코드 생성은 중간코드를 만든다.
      코드최적화는 중간코드를 개선하고, 목적코드 생성은 최종 목적 프로그램을 만든다.
    tags: [compiler-structure]

  - id: b01-14
    type: multiple-choice
    prompt: 다음 중 원시 프로그램을 토큰으로 구분하는 일을 하는 것은?
    choices:
      - { id: '1', text: '어휘분석' }
      - { id: '2', text: '구문분석' }
      - { id: '3', text: '의미분석' }
      - { id: '4', text: '중간코드 생성' }
    answers: ['1']
    explanation: |
      선택지 1: 어휘분석(lexical analysis) 단계는 원시 프로그램을 읽어 들여 토큰(token)으로 분리한다.
      선택지 2: 구문분석은 어휘분석이 만든 토큰 열이 문법에 맞는 문장인지 검사하는 단계이다.
      선택지 3: 의미분석은 파스트리를 따라 유형 검사 등 의미를 해석하는 단계이다.
      선택지 4: 중간코드 생성은 분석 결과를 바탕으로 중간코드를 만드는 단계이다.

      핵심 개념:
      토큰은 문법적으로 의미를 갖는 최소 단위이다.
      식별자, 예약어, 상수, 연산자, 구분자 등이 토큰이 된다.
      어휘분석기를 스캐너(scanner)라고도 한다.
      어휘분석의 출력인 토큰 열은 구문분석의 입력이 된다.
    tags: [lexical-analysis, token]

  - id: b01-15
    type: multiple-choice
    passageRefs: [gwba-token-count-01]
    prompt: 다음 문장은 몇 개의 토큰으로 분리되는가?
    choices:
      - { id: '1', text: '8' }
      - { id: '2', text: '9' }
      - { id: '3', text: '10' }
      - { id: '4', text: '11' }
    answers: ['3']
    explanation: |
      선택지 1: 8개는 연산자나 구분자 ;를 토큰에서 빠뜨린 경우이다.
      선택지 2: 9개는 토큰 하나를 빠뜨린 경우이다.
      선택지 3: ABC, :=, E, *, 3.14, +, ABC, /, E, ; 로 모두 10개의 토큰으로 분리된다.
      선택지 4: 11개는 := 를 : 와 = 두 토큰으로 나누는 등 한 토큰을 둘로 센 경우이다.

      핵심 개념:
      식별자(ABC, E)는 길이와 관계없이 하나의 토큰이다.
      상수 3.14는 소수점을 포함해 하나의 토큰이다.
      배정 연산자 := 처럼 두 글자로 된 연산자도 하나의 토큰이다.
      문장 끝 구분자 ; 도 토큰으로 센다.
    tags: [token]

  - id: b01-16
    type: multiple-choice
    passageRefs: [gwba-token-count-02]
    prompt: 다음 문장은 몇 개의 토큰으로 분리되는가?
    choices:
      - { id: '1', text: '8' }
      - { id: '2', text: '9' }
      - { id: '3', text: '10' }
      - { id: '4', text: '11' }
    answers: ['2']
    explanation: |
      선택지 1: 8개는 단항 연산자 - 나 구분자 ; 같은 토큰 하나를 빠뜨린 경우이다.
      선택지 2: C, :=, -, E, *, 315, -, B7, ; 로 모두 9개의 토큰으로 분리된다.
      선택지 3: 10개는 := 나 B7처럼 하나인 토큰을 둘로 나눠 센 경우이다.
      선택지 4: 11개는 여러 토큰을 잘게 나눠 센 경우로 맞지 않다.

      핵심 개념:
      단항 연산자 - 와 이항 연산자 - 는 각각 하나의 토큰이다.
      B7처럼 문자로 시작해 숫자가 이어지는 식별자는 하나의 토큰이다.
      정수 상수 315는 하나의 토큰이다.
      := 와 ; 도 각각 하나의 토큰으로 센다.
    tags: [token]

  - id: b01-17
    type: multiple-choice
    prompt: 다음 중 나머지 셋과 ==관계없는== 것은?
    choices:
      - { id: '1', text: '토큰' }
      - { id: '2', text: '어휘분석기' }
      - { id: '3', text: '파서' }
      - { id: '4', text: '스캐너' }
    answers: ['3']
    explanation: |
      선택지 1: 토큰은 어휘분석 단계에서 원시 프로그램을 분리해 얻는 단위이므로 어휘분석과 관련 있다.
      선택지 2: 어휘분석기는 어휘분석을 수행하는 프로그램이다.
      선택지 3: 파서(parser)는 구문분석기를 말하므로 나머지 셋과 관계없다.
      선택지 4: 스캐너(scanner)는 어휘분석기의 다른 이름이다.

      핵심 개념:
      어휘분석기 = 스캐너, 구문분석기 = 파서이다.
      어휘분석기는 문자열을 읽어 토큰을 만든다.
      파서는 토큰 열을 문법에 따라 분석해 파스트리를 만든다.
      용어가 어느 단계에 속하는지 구분하는 문제가 자주 나온다.
    tags: [lexical-analysis, parser]

  - id: b01-18
    type: multiple-choice
    prompt: 파스트리(parse tree)를 따라 노드(node)에서 노드로 움직일 때마다 필요한 해석이나 분석을 하는 단계는?
    choices:
      - { id: '1', text: '어휘분석' }
      - { id: '2', text: '구문분석' }
      - { id: '3', text: '의미분석' }
      - { id: '4', text: '코드최적화' }
    answers: ['3']
    explanation: |
      선택지 1: 어휘분석은 원시 프로그램을 토큰으로 나누는 단계로, 파스트리가 만들어지기 전 단계이다.
      선택지 2: 구문분석은 파스트리를 만드는 단계이며, 만들어진 트리를 따라가며 해석하지는 않는다.
      선택지 3: 의미분석은 파스트리를 따라 노드에서 노드로 움직이며 필요한 해석이나 분석을 하는 단계이다.
      선택지 4: 코드최적화는 생성된 중간코드를 개선하는 단계이다.

      핵심 개념:
      의미분석은 구문분석의 결과인 파스트리를 입력으로 한다.
      노드를 방문하면서 연산자와 피연산자를 인식하고 유형 검사를 한다.
      필요하면 정수를 실수로 바꾸는 등 형 변환 정보를 붙인다.
      의미분석 결과는 중간코드 생성에 이용된다.
    tags: [semantic-analysis]

  - id: b01-19
    type: multiple-choice
    prompt: 기호표를 사용하여 식별자의 속성이나 위치 기억장소 할당 등을 수행하는 단계는?
    choices:
      - { id: '1', text: '어휘분석' }
      - { id: '2', text: '구문분석' }
      - { id: '3', text: '의미분석' }
      - { id: '4', text: '코드최적화' }
    answers: ['3']
    explanation: |
      선택지 1: 어휘분석은 토큰을 분리하며 식별자를 기호표에 등록할 수는 있지만, 속성 처리와 기억장소 할당을 하는 단계는 아니다.
      선택지 2: 구문분석은 토큰 열이 문법에 맞는지 검사하는 단계이다.
      선택지 3: 기호표를 사용해 식별자의 속성을 처리하고 기억장소 위치를 할당하는 것은 의미분석 단계에서 하는 일이다.
      선택지 4: 코드최적화는 중간코드를 더 효율적으로 바꾸는 단계이다.

      핵심 개념:
      기호표(symbol table)는 식별자의 이름, 형, 크기, 위치 등 속성을 저장한다.
      의미분석은 기호표를 참조해 선언과 사용이 맞는지 검사한다.
      식별자에 기억장소 위치를 할당하는 일도 의미분석에서 한다.
      기호표는 컴파일러의 여러 단계가 함께 사용한다.
    tags: [semantic-analysis, symbol-table]

  - id: b01-20
    type: multiple-choice
    prompt: 구문트리를 보며 산술식과 각 문장의 연산자 및 피연산자를 인식하고 유형 검사 등을 하며 혼합형 연산을 하는 경우 정수를 실수로 바꿔 주는 것은 어느 단계인가?
    choices:
      - { id: '1', text: '어휘분석' }
      - { id: '2', text: '구문분석' }
      - { id: '3', text: '의미분석' }
      - { id: '4', text: '코드최적화' }
    answers: ['3']
    explanation: |
      선택지 1: 어휘분석은 연산자나 피연산자를 토큰으로 분리할 뿐 유형 검사는 하지 않는다.
      선택지 2: 구문분석은 구문트리를 만드는 단계이며 유형 검사나 형 변환은 하지 않는다.
      선택지 3: 구문트리를 보며 연산자와 피연산자를 인식하고 유형 검사를 하며, 혼합형 연산에서 정수를 실수로 바꾸는 것은 의미분석에서 하는 일이다.
      선택지 4: 코드최적화는 의미가 확정된 중간코드를 개선하는 단계이다.

      핵심 개념:
      의미분석의 대표 작업은 유형 검사(type checking)이다.
      혼합형 연산(예: 정수 + 실수)에서는 정수를 실수로 바꾸는 형 변환을 한다.
      의미분석은 구문트리(파스트리)를 따라가며 수행한다.
      문법에는 맞지만 의미가 틀린 오류는 의미분석에서 찾는다.
    tags: [semantic-analysis, type-checking]

  - id: b01-21
    type: multiple-choice
    prompt: 다음 설명 중 올바르지 ==않은== 것은?
    choices:
      - { id: '1', text: '어휘분석 단계에서는 문장을 분석하여 토큰으로 분리하며, 이러한 토큰들을 출력한다.' }
      - { id: '2', text: '구문분석 단계의 결과인 파스트리는 중간코드 생성 단계에서 이용된다.' }
      - { id: '3', text: '의미분석 단계에서는 주어진 토큰들의 열이 올바른 문장인지 문법규칙을 적용하여 검사한다.' }
      - { id: '4', text: '목적코드 생성 단계에서는 사용하는 레지스터의 수에 따라서 코드가 달라진다.' }
    answers: ['3']
    explanation: |
      선택지 1: 어휘분석 단계는 문장을 분석해 토큰으로 분리하고 그 토큰들을 출력하므로 맞는 설명이다.
      선택지 2: 구문분석의 결과인 파스트리는 의미분석을 거쳐 중간코드 생성 단계에서 이용되므로 맞는 설명이다.
      선택지 3: 주어진 토큰들로 구성된 문장이 올바른 문장인지, 문법에 맞는지를 검사하는 것은 구문분석 단계이다. 의미분석이라고 했으므로 틀린 설명이다.
      선택지 4: 목적코드 생성 단계는 연산에 쓸 레지스터를 선택하므로, 사용 가능한 레지스터 수에 따라 생성되는 코드가 달라진다.

      핵심 개념:
