    answers: ['3']
    explanation: |
      선택지 1: S3은 I₀와 I₃에서 c에 의해 I₃로 가는 행동이다. I₂의 c 전이는 lookahead가 \$ 인 I₆으로 간다.
      선택지 2: S4는 I₀와 I₃에서 d에 의해 I₄로 가는 행동으로 [2, c] 칸과 관계없다.
      선택지 3: (나)는 [2, c] 칸이다. CLR 그래프에서 I₂가 c에 의해 도달하는 곳은 I₆이므로 S6이다.
      선택지 4: S7은 I₂에서 d에 의해 I₇로 가는 행동으로 [2, d] 칸에 이미 들어가 있다.

      핵심 개념:
      I₂ = {[S → C·C, \$], [C → ·cC, \$], [C → ·d, \$]}에서 c를 읽으면 [C → c·C, \$]의 closure인 I₆이 된다.
      I₃와 I₆은 core가 [C → c·C], [C → ·cC], [C → ·d]로 같지만 lookahead가 c/d와 \$ 로 달라 CLR에서는 다른 상태이다.
      어떤 상태에서 들어오느냐에 따라 lookahead가 달라지므로 같은 기호 c라도 도달 상태가 다를 수 있다.
      shift 칸은 항상 그래프의 터미널 전이 대상 상태 번호로 채운다.

