      선택지 3: +가 빠져 있다. 1), 2)번 규칙으로 FOLLOW(T) ⊇ FOLLOW(E) = {\$, +, )}이므로 +도 포함해야 한다.
      선택지 4: 1)번 E → E+T와 2)번 E → T에서 T가 오른쪽 끝에 있으므로 FOLLOW(T) ⊇ FOLLOW(E) = {\$, +, )}이고, 3)번 T → T*F에서 *가 추가된다. 따라서 FOLLOW(T) = {*, +, ), \$}이다.

      핵심 개념:
      생성규칙 오른쪽 끝에 A가 오면(B → αA) FOLLOW(B)를 FOLLOW(A)에 넣는다.
      T → F에서도 같은 원리로 FOLLOW(F) ⊇ FOLLOW(T) = {*, +, ), \$}이다.
      이 문법의 결과는 FOLLOW(E) = {\$, +, )}, FOLLOW(T) = FOLLOW(F) = {*, +, ), \$}이다.
      FOLLOW 집합은 SLR(Simple LR) 파싱표에서 reduce 동작을 넣을 위치를 정하는 데 쓰인다.
