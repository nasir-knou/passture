      선택지 2: T도 단일 생성규칙 E → T 그대로이므로 제거되지 않았다.
      선택지 3: T의 규칙은 T*F이며 F*F라는 규칙은 없다.
      선택지 4: 단일 생성규칙 E → T, T → F를 제거하면 E → E+T | T*F | (E) | a가 되므로 (가)는 T*F이다.

      핵심 개념:
      E → T 자리에 T의 규칙 T*F | F를 쓰고, 다시 F 자리에 F의 규칙 (E) | a를 쓴다.
      결과는 E → E+T | T*F | (E) | a이다.
      단일 생성규칙 제거 후에도 생성되는 언어는 같다.
