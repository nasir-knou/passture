  - id: b05-49
    type: multiple-choice
    passageRefs: [gwbc-lr0-01, gwbc-slr-table-01, gwbc-slr-trace-01]
    prompt: 계속해서 SLR 파싱표를 이용하여 문장 id+id*id를 구문분석하는 과정이다. (가)의 내용은?
    choices:
