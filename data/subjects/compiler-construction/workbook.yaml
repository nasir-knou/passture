      선택지 2: r3은 3)번 규칙 T → T*F로 환원하는 동작으로, 완료 항목 [T → T*F·]가 있는 상태 10에 들어간다.
      선택지 3: r4는 4)번 규칙 T → F로 환원하는 동작으로, 완료 항목 [T → F·]가 있는 상태 3에 들어간다.
      선택지 4: r5는 5)번 규칙 F → (E)로 환원하는 동작으로, 완료 항목 [F → (E)·]가 있는 상태 11에 들어간다.

      핵심 개념:
      SLR 파싱표에서 상태 i에 완료 항목 [A → α·]가 있으면, FOLLOW(A)의 모든 기호 a에 대해 ACTION[i, a] = reduce(A → α)이다.
      FOLLOW(E) = {+, ), \$}이므로 상태 2의 +, ), \$ 칸에 r2가 들어간다.
      상태 2의 * 칸은 [T → T·*F]가 I₇로 이동하므로 S7이다.
