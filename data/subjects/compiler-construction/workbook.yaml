      - { id: '2', text: "상수 : 1, 2, 3, 'abc'와 같이 정수형 상수, 실수형 상수, 문자형 상수" }
      - { id: '3', text: '구분자 : (, [, ;, :, , 등과 같이 단어와 단어를 구분하기 위해 사용되는 기호' }
      - { id: '4', text: '연산자 : DO, IF, WHILE 등과 같이 언어 구현 시 이미 정의되는 지정어' }
    answers: ['4']
    explanation: |
      선택지 1: 식별자는 SUM, A, B처럼 프로그래머가 정의하는 이름이므로 맞는 설명이다.
      선택지 2: 상수는 정수형, 실수형, 문자형 상수를 포함하므로 맞는 설명이다.
      선택지 3: 구분자는 괄호, 세미콜론, 콜론, 쉼표처럼 단어를 구분하는 기호이므로 맞는 설명이다.
      선택지 4: DO, IF, WHILE처럼 언어 구현 시 이미 정의되는 지정어는 예약어에 대한 설명이다. 연산자는 +, -, *, / 같은 기호이므로 틀렸다.

