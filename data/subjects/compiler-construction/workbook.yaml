  - id: b02-20
    type: multiple-choice
    passageRefs: [gwba-grammar-bs-av-01]
    prompt: 이 문법으로 생성될 수 ==없는== 것은?
    choices:
      - { id: '1', text: 'aa' }
      - { id: '2', text: 'aba' }
      - { id: '3', text: 'abaa' }
      - { id: '4', text: 'baba' }
    answers: ['3']
    explanation: |
      선택지 1: aa = b⁰ a b⁰ a이므로 S → aV → aa로 생성된다.
      선택지 2: aba = a b a이므로 S → aV → abV → aba로 생성된다.
      선택지 3: 정규표현 방정식 S = bS + aV, V = bV + a = b*a에서 S = b*ab*a이다. abaa는 a가 세 번 나오므로 b*ab*a에 해당하지 않는다.
      선택지 4: baba = b a b a이므로 S → bS → baV → babV → baba로 생성된다.

      핵심 개념:
      V = bV + a에서 V = b*a이다.
      S = bS + a(b*a)에서 S = b*ab*a이다.
      L(G)의 문자열은 a를 정확히 두 번 포함하고 a로 끝난다.
      일일이 대입해도 되지만 정규표현으로 해를 구하면 판별이 빠르다.
    tags: [regular-expression, regular-grammar]

  - id: b02-21
    type: multiple-choice
    prompt: 다음 중 정규표현이 ==아닌== 것은?
    choices:
