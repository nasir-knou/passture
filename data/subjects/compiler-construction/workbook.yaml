  - id: gwba-regex-eq-01
    type: code
    language: text
    body: |
      G = ({S, A, B}, {a, b, c}, P, S)
        P : S → bA | aS
            A → bS | aB
            B → cB | a

      <풀이> 생성규칙을 정규표현 방정식으로 변환하면
          S = bA + aS      …… ①
          A = bS + aB      …… ②
          B = cB + a       …… ③이다.
        ③ 식에서
          B = ( 가 )       …… ④
        ② 식을 대입하여 ① 식을 풀면
          S = bbS + baB + aS
            = ( 나 )S + baB  …… ⑤
        여기에 ④ 식을 대입하여 풀면
        S = ( 다 )가 된다.

  - id: gwba-regex-eq-02
    type: code
    language: text
    body: |
      G = ({S, A, B}, {a, b}, P, S)
        P : S → aA | bS
            A → aS | bB
            B → aB | bB | ε

      <풀이> 생성규칙을 정규표현 방정식으로 변환하면
          S = aA + bS          …… ①
          A = aS + bB          …… ②
          B = aB + bB + ε      …… ③이다.
        ③ 식에서
          B = ( 가 )           …… ④
        ② 식을 대입하여 ① 식을 풀면
          S = aaS + abB + bS   …… ⑤
        여기에 ④ 식을 대입하여 풀면
        S = ( 나 )가 된다.

  - id: gwba-regex-eq-03
    type: code
    language: text
    body: |
      G = ({S, A, B}, {a, b, c}, P, S)
        P : S → aA | bS
            A → bS | aB
            B → cB | b

      <풀이> 생성규칙을 정규표현 방정식으로 변환하면
          S = aA + bS      …… ①
          A = bS + aB      …… ②
          B = cB + b       …… ③이다.
        ③ 식에서
          B = ( 가 )       …… ④
        ② 식을 대입하여 ① 식을 풀면
          S = aA + bS
            = a(bS + aB) + bS
            = abS + aaB + bS
            = ( 나 )S + aaB  …… ⑤
        여기에 ④ 식을 대입하여 풀면
        S = ( 다 )가 된다.

  - id: gwba-regex-eq-04
    type: code
    language: text
    body: |
      G = ({S, A, B}, {a, b}, P, S)
        P : S → aA | bS
            A → aA | bB
            B → aB | bB | ε

      <풀이> 생성규칙을 정규표현 방정식으로 변환하면
          S = aA + bS          …… ①
          A = aA + bB          …… ②
          B = aB + bB + ε      …… ③이다.
        ③ 식에서
          B = (a + b)*         …… ④
        ④ 식을 ② 식에 대입하여 풀면
          A = aA + bB = ( 가 )   …… ⑤
        ⑤ 식을 ① 식에 대입하여 풀면
          S = aA + bS = ( 나 )

