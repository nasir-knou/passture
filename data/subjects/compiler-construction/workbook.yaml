      - { id: '3', text: '어휘분석기는 주어진 모든 문법기호에 대한 토큰번호와 토큰값을 갖고 있다. 그러나 연산자에 대한 토큰값은 미리 가지고 있을 수 없다.' }
      - { id: '4', text: '토큰번호란 각각의 토큰을 구분하기 위해서 토큰에게 주는 값이다.' }
    answers: ['3']
    explanation: |
      선택지 1: 식별자와 상수의 토큰값과 속성 정보는 기호표에 보관하므로 맞는 설명이다.
      선택지 2: 이미 기호표에 있는 식별자는 다시 등록하지 않으므로 맞는 설명이다.
      선택지 3: 식별자나 상수에 대한 토큰값은 프로그램마다 달라 미리 가지고 있을 수 없지만, 연산자는 미리 정해져 있으므로 토큰값을 갖고 있다. 연산자라고 한 것이 틀렸다.
      선택지 4: 토큰번호는 각 토큰을 구분하기 위해 부여하는 값이므로 맞는 설명이다.

      핵심 개념:
