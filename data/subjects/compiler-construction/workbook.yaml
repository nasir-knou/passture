          1) E → E+T
          2) E → T
          3) T → T*F
          4) T → F
          5) F → (E)
          6) F → id

      (2) canonical collection
          I₀ : closure([S′ → ·E])
          I₁ = GOTO(I₀, E)
          I₂ = GOTO(I₀, T)
          I₃ = GOTO(I₀, F)

      [보기]
      (가) {[T → F·]}
      (나) {[S′ → E·], [E → E·+T]}
      (다) {[E → T·], [T → T·*F]}
      (라) {[S′ → ·E], [E → ·E+T], [E → ·T], [T → ·T*F],
            [T → ·F], [F → ·(E)], [F → ·id]}

