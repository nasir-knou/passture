  - id: b05-53
    type: multiple-choice
    passageRefs: [gwbc-lr0-02]
    prompt: 다음은 LR(0) 항목 집합의 canonical collection을 구하는 과정이다. 다음 중 I₁에 속하지 ==않는== 것은?
    choices:
      - { id: '1', text: '[S′ → E·]' }
      - { id: '2', text: '[E → E·+T]' }
      - { id: '3', text: '[E → ·E+T]' }
      - { id: '4', text: 'closure{[S′ → E·], [E → E·+T]}' }
    answers: ['3']
    explanation: |
      선택지 1: I₀의 [S′ → ·E]에서 E를 읽어 점을 옮긴 항목이므로 I₁에 속한다.
      선택지 2: I₀의 [E → ·E+T]에서 E를 읽어 점을 옮긴 항목이므로 I₁에 속한다.
      선택지 3: [E → ·E+T]는 점이 E 앞에 있는 항목으로 I₀(및 I₄)에 속한다. I₁은 점 뒤에 논터미널이 없어 closure로 더해지는 항목이 없으므로 이 항목은 I₁에 없다.
      선택지 4: I₁ = GOTO(I₀, E) = closure{[S′ → E·], [E → E·+T]}이므로 I₁ 자체를 나타낸 표현이다.

      핵심 개념:
      GOTO(I, X)는 I에서 점 뒤에 X가 있는 항목들의 점을 X 뒤로 옮긴 핵심 항목(kernel)을 만들고 그 closure를 구한다.
      closure는 점 바로 뒤에 논터미널이 있을 때만 새 항목을 더한다.
      I₁의 두 항목은 점 뒤가 비어 있거나 터미널 +이므로 closure 결과는 핵심 항목과 같다.
      따라서 I₁ = {[S′ → E·], [E → E·+T]}이다.
    tags: [lr0-item, canonical-collection, closure]

  - id: b05-54
    type: multiple-choice
    passageRefs: [gwbc-lr0-02]
    prompt: 다음 중 I₄에 속하지 ==않는== 것은?
    choices:
      - { id: '1', text: '[F → ·(E)]' }
      - { id: '2', text: '[E → E·+T]' }
      - { id: '3', text: '[E → ·T]' }
      - { id: '4', text: '[T → ·T*F]' }
    answers: ['2']
    explanation: |
      선택지 1: I₄의 핵심 항목 [F → (·E)]에서 점 뒤의 E를 closure하면 결국 F의 규칙까지 더해져 [F → ·(E)]가 포함된다.
      선택지 2: [E → E·+T]는 E를 이미 읽은 뒤의 항목으로 I₁이나 I₈에 속한다. I₄는 ( 만 읽은 상태이므로 이 항목이 없다.
      선택지 3: [F → (·E)]의 점 뒤 E를 closure하면 [E → ·E+T], [E → ·T]가 더해지므로 포함된다.
      선택지 4: [E → ·T]의 점 뒤 T를 closure하면 [T → ·T*F], [T → ·F]가 더해지므로 포함된다.

      핵심 개념:
      I₀에서 ( 앞에 점이 있는 항목은 [F → ·(E)] 하나뿐이므로 I₄ = GOTO(I₀, ( ) = closure([F → (·E)])이다.
      closure 결과는 {[F → (·E)], [E → ·E+T], [E → ·T], [T → ·T*F], [T → ·F], [F → ·(E)], [F → ·id]}이다.
      closure로 더해지는 항목은 항상 점이 오른쪽 맨 앞에 있는 [B → ·γ] 형태이다.
      점이 중간에 있는 항목은 GOTO로 옮겨진 핵심 항목에서만 나온다.
    tags: [lr0-item, canonical-collection, closure]

  - id: b05-55
    type: multiple-choice
    passageRefs: [gwbc-lr0-02]
    prompt: 다음 중 I₆에 속하지 ==않는== 것은?
    choices:
      - { id: '1', text: '[F → ·(E)]' }
      - { id: '2', text: '[E → E·+T]' }
      - { id: '3', text: '[T → ·F]' }
      - { id: '4', text: '[T → ·T*F]' }
    answers: ['2']
    explanation: |
      선택지 1: I₆의 핵심 항목 [E → E+·T]를 closure하면 T의 규칙, 이어서 F의 규칙이 더해지므로 [F → ·(E)]가 포함된다.
      선택지 2: [E → E·+T]는 + 를 읽기 전의 항목으로 I₁에 속한다. I₆은 + 를 읽고 점이 + 뒤로 이동한 [E → E+·T]를 핵심 항목으로 가지므로 이 항목은 I₆에 없다.
      선택지 3: [E → E+·T]의 점 뒤 T를 closure하면 [T → ·F]가 더해진다.
      선택지 4: 같은 closure로 [T → ·T*F]도 더해진다.

      핵심 개념:
      I₁ = {[S′ → E·], [E → E·+T]}에서 + 앞에 점이 찍힌 항목은 [E → E·+T] 하나뿐이다.
      따라서 I₆ = GOTO(I₁, +) = closure([E → E+·T]) = {[E → E+·T], [T → ·T*F], [T → ·F], [F → ·(E)], [F → ·id]}이다.
      같은 방법으로 I₂ = {[E → T·], [T → T·*F]}, I₃ = {[T → F·]}, I₅ = {[F → id·]}를 구한다.
      GOTO 전 항목과 GOTO 후 항목은 점 위치가 한 칸 다르므로 서로 다른 상태에 속한다.
    tags: [lr0-item, canonical-collection, goto-function]

