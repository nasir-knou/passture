  - id: b02-26
    type: multiple-choice
    passageRefs: [gwba-grammar-as-ab-a-01]
    prompt: 문법 G가 생성할 수 ==없는== 것은?
    choices:
      - { id: '1', text: 'aba' }
      - { id: '2', text: 'ababa' }
      - { id: '3', text: 'aabaaa' }
      - { id: '4', text: 'abaaa' }
    answers: ['2']
    explanation: |
      선택지 1: aba = a·b·a이므로 S → aB → abC → aba로 생성된다.
      선택지 2: 정규표현 방정식으로 풀면 C = aC + a ⟹ C = a*a, B = bC ⟹ B = ba*a, S = aS + aB ⟹ S = a*aba*a이다. ababa는 b가 두 번 나오므로 생성될 수 없다.
      선택지 3: aabaaa = a·a·b·aa·a이므로 S → aS → aaB → aabC → … → aabaaa로 생성된다.
      선택지 4: abaaa = a·b·aa·a이므로 생성된다.

      핵심 개념:
      L(G) = a*aba*a이다.
      b는 정확히 한 번 나오며, b 앞뒤에 a가 최소 하나씩 있다.
      생성 여부는 정규표현과 문자열의 구조를 비교해 판단한다.
      X = αX + β ⟹ X = α*β를 반복 적용한다.
    tags: [regular-expression, regular-grammar]

  - id: b02-27
    type: multiple-choice
    passageRefs: [gwba-grammar-as-ab-a-01]
    prompt: 문법 G가 생성하는 언어를 정규표현으로 표현한 것은?
    choices:
      - { id: '1', text: '$a^*ba^*$' }
      - { id: '2', text: '$a^*aba^*a$' }
      - { id: '3', text: '$a^*ab^*a^*a$' }
      - { id: '4', text: '$a^*+aba^*a$' }
    answers: ['2']
    explanation: |
      선택지 1: $a^*ba^*$는 b 앞뒤에 a가 없어도 되는 언어인데, 문법에서는 S → aB와 C → a 때문에 b 앞뒤에 a가 최소 하나씩 있다.
      선택지 2: C = a*a, B = ba*a, S = aS + aB에서 S = a*aba*a이다.
      선택지 3: $b^*$는 b가 없거나 여러 번 나올 수 있어 L(G)와 다르다.
      선택지 4: $a^*$ 항은 b가 없는 문자열까지 포함하므로 L(G)와 다르다.

      핵심 개념:
      C = aC + a ⟹ C = a*a.
      B = bC ⟹ B = ba*a.
      S = aS + aB ⟹ S = a*aba*a.
      워크북 해설은 이 문제의 풀이가 앞 문제(6번)의 풀이 과정과 같다고 안내한다.
    tags: [regular-expression, regular-grammar]

