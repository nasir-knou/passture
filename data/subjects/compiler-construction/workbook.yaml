  - id: b03-08
    type: multiple-choice
    prompt: 어휘분석기 생성기로 1975년 벨연구소의 레스크(Lesk)와 슈미트(Schmidt)에 의해 개발되었으며, 정의 부분, 변환규칙 부분, 사용자 부프로그램 부분으로 구성된 것은?
    choices:
      - { id: '1', text: 'LEX' }
      - { id: '2', text: 'NFA' }
      - { id: '3', text: 'Poison' }
      - { id: '4', text: 'ScanGen' }
    answers: ['1']
    explanation: |
      선택지 1: 어휘분석기 생성기 LEX는 1975년 벨연구소의 Lesk와 Schmidt가 개발했으며, 정의 부분, 변환규칙 부분, 사용자 부프로그램 부분으로 구성된다.
      선택지 2: NFA는 비결정적 유한 오토마타로, 어휘분석기 생성기가 아니다.
      선택지 3: Poison은 어휘분석기 생성기로 알려진 도구가 아니다. 1975년 Lesk와 Schmidt가 개발했고 정의 부분·변환규칙 부분·사용자 부프로그램 부분으로 구성된 어휘분석기 생성기는 LEX뿐이다.
      선택지 4: ScanGen도 어휘분석기 생성기의 하나이지만, 1975년 Lesk와 Schmidt가 개발하고 세 부분으로 구성된 도구는 LEX이다.

      핵심 개념:
      LEX 입력 파일은 정의 부분 %% 변환규칙 부분 %% 사용자 부프로그램 부분으로 나뉜다.
      변환규칙 부분에는 정규표현과 그에 대응하는 수행코드를 적는다.
      LEX는 이를 받아 C 언어로 된 어휘분석기(lex.yy.c)를 생성한다.
      LEX는 구문분석기 생성기 YACC(Yet Another Compiler-Compiler)와 함께 자주 사용된다.
