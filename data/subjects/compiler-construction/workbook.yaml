  # ── 4.1 Context-Free 언어와 푸시다운 오토마타 ──
  - id: b04-01
    type: multiple-choice
    prompt: 다음 설명 중 ==틀린== 것은?
    choices:
      - { id: '1', text: '정규언어는 단어를 표현한다.' }
      - { id: '2', text: '유한 오토마타는 정규언어를 인식한다.' }
      - { id: '3', text: '푸시다운 오토마타는 구문분석과 관련이 있다.' }
      - { id: '4', text: 'context-free 언어는 단어를 표현한다.' }
    answers: ['4']
    explanation: |
      선택지 1: 정규언어는 식별자, 상수, 예약어 같은 단어(토큰)를 표현하는 데 쓰이므로 옳은 설명이다.
      선택지 2: 정규언어를 인식하는 기계가 유한 오토마타이므로 옳은 설명이다.
      선택지 3: 푸시다운 오토마타는 context-free 언어를 인식하며 구문분석기의 이론적 모델이 되므로 옳은 설명이다.
      선택지 4: context-free 언어(문법)는 단어가 아니라 IF-THEN-ELSE 같은 문장 전체의 구조를 표현하는 데 효율적인 언어이다. 단어를 표현하는 것은 정규언어이므로 틀린 설명이다.

      핵심 개념:
      컴파일러에서 정규언어는 단어(토큰)를, context-free 언어는 문장을 표현한다.
      정규언어는 유한 오토마타, context-free 언어는 푸시다운 오토마타가 인식한다.
      어휘분석은 정규언어·유한 오토마타, 구문분석은 context-free 문법·푸시다운 오토마타와 관련된다.
      context-free 언어는 정규언어보다 표현범위가 넓어 인식기 구현이 더 복잡하다.

  - id: b04-02
    type: multiple-choice
    passageRefs: [gwbb-if-01]
    prompt: 다음의 설명에서 (가)와 (나)에 적당한 것은?
    choices:
      - { id: '1', text: '정규언어, context-free 언어' }
      - { id: '2', text: 'context-sensitive 언어, context-free 언어' }
      - { id: '3', text: 'context-free 언어, 정규언어' }
      - { id: '4', text: '정규언어, context-sensitive 언어' }
    answers: ['1']
    explanation: |
      선택지 1: IF, A, =, B 같은 단어를 표현하는 (가)는 정규언어이고, 문장 전체가 IF-THEN-ELSE 문장임을 표현하는 (나)는 context-free 언어이므로 정답이다.
      선택지 2: context-sensitive 언어는 문맥에 따라 대치가 제한되는 1형 언어로, 단어 표현에 쓰는 언어가 아니므로 (가)에 맞지 않는다.
      선택지 3: 순서가 뒤바뀌었다. context-free 언어는 문장을, 정규언어는 단어를 표현한다.
      선택지 4: (가)는 맞지만 문장 전체의 구조를 표현하는 (나)는 context-sensitive 언어가 아니라 context-free 언어이다.

      핵심 개념:
      프로그램 문장은 단어 수준과 문장 수준의 두 층으로 나누어 표현한다.
      단어(토큰)는 정규언어, 문장 구조는 context-free 언어로 표현한다.
      context-free 언어가 정규언어보다 표현범위가 넓다.
      표현범위가 넓을수록 이를 인식하는 오토마타를 구현하기 어렵다.

  - id: b04-03
    type: multiple-choice
    passageRefs: [gwbb-if-02]
    prompt: (가)에 적당한 것은?
    choices:
      - { id: '1', text: '정규언어' }
      - { id: '2', text: 'context-free 언어' }
      - { id: '3', text: '푸시다운 오토마타(push-down automata)' }
      - { id: '4', text: '유한 오토마타(finite automata)' }
    answers: ['1']
    explanation: |
      선택지 1: IF, A, =, B 같은 단어들을 표현하는 것은 정규언어이므로 (가)에 알맞다.
      선택지 2: context-free 언어는 전체 문장이 IF-THEN-ELSE 문장임을 표현하는 (나)에 해당한다.
      선택지 3: 푸시다운 오토마타는 언어가 아니라 context-free 언어를 인식하는 기계로 (다)에 해당한다.
      선택지 4: 유한 오토마타는 언어가 아니라 정규언어를 인식하는 기계로 (라)에 해당한다.

      핵심 개념:
      정규언어는 IF, THEN, C, :=, D, ELSE 같은 단어를 표현하는 데 사용된다.
      context-free 언어는 IF-THEN-ELSE 같은 전체 문장을 표현하는 데 사용된다.
      언어(정규언어, context-free 언어)와 그 인식기(유한 오토마타, 푸시다운 오토마타)를 구분해야 한다.
      정규언어 ↔ 유한 오토마타, context-free 언어 ↔ 푸시다운 오토마타로 짝지어진다.

  - id: b04-04
    type: multiple-choice
    passageRefs: [gwbb-if-02]
    prompt: (나)에 적당한 것은?
    choices:
