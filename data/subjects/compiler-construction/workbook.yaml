      - { id: '4', text: 'reduce 6' }
    answers: ['4']
    explanation: |
      선택지 1: shift 5는 상태 0, 4, 6, 7에서 id를 만났을 때의 행동이다. 1단계의 입력기호는 +이므로 해당하지 않는다.
      선택지 2: reduce 4는 상태 3에서 +를 만났을 때의 행동이다. 1단계 스택 top은 상태 5이다.
      선택지 3: goto 3은 환원 뒤 F가 올라온 상태 0에서의 GOTO 행동으로, 1단계처럼 스택 top이 상태 5일 때의 ACTION이 아니다.
      선택지 4: 1단계는 스택 top이 상태 5, 입력기호가 +이다. 파싱표 [5, +] 칸은 r6이므로 6번 규칙 F → id로 환원하는 reduce 6이 된다.

      핵심 개념:
      상태 5는 항목 [F → id·]만 가진 상태로, 점이 끝에 있는 완성 항목(reduce 항목)이다.
      SLR 방법은 완성 항목 [A → α·]에 대해 FOLLOW(A)에 속하는 입력기호 칸에 reduce를 넣는다.
      FOLLOW(F) = {+, *, ), \$} 이므로 상태 5의 이 네 칸이 모두 r6이다.
      reduce 뒤 스택은 0F가 되고, 이어서 GOTO로 새 상태를 찾는다.

