    answers: ['1']
    explanation: |
      선택지 1: 17단계 스택 꼭대기 상태는 10, 입력기호는 \$이다. 파싱표에서 상태 10, \$를 찾으면 r3이므로 3)번 규칙 T → T*F로 reduce한다.
      선택지 2: reduce 5는 F → (E)로 환원하는 동작으로 상태 11에서 일어난다. 스택에 괄호가 없으므로 해당하지 않는다.
      선택지 3: goto는 reduce 직후 논터미널을 스택에 올렸을 때 하는 동작이다. 17단계는 상태 번호 10을 막 올린 뒤이므로 ACTION을 찾아야 한다.
      선택지 4: 상태 10에는 \$에 대한 shift 동작이 없고, \$는 입력 끝이므로 shift할 수 없다.

      핵심 개념:
      LR 구문분석기는 스택 꼭대기 상태 s와 현재 입력기호 a로 ACTION[s, a]를 찾아 shift, reduce, accept, error 중 하나를 수행한다.
      reduce A → β이면 스택에서 β에 해당하는 기호와 상태(2×|β|개)를 꺼내고 A를 넣는다.
      reduce 3(T → T*F)을 하면 스택 0E1+6T9*7F10에서 T9*7F10을 꺼내 0E1+6T가 된다.
      이어서 GOTO[6, T] = 9로 다음 상태를 정한다.
    tags: [slr-parsing, lr-parsing-trace]

