    explanation: |
      선택지 1: ε은 공문자열만으로 이루어진 언어 {ε}을 나타내는 정규표현이다.
      선택지 2: 공집합(φ)은 아무 문자열도 없는 언어를 나타내는 정규표현이다.
      선택지 3: 터미널 기호 a는 언어 {a}를 나타내는 정규표현이다.
      선택지 4: 정규표현은 ε, φ, 터미널 기호와 이들에 연산을 적용한 것으로 정의되므로 논터미널 기호는 정규표현이 아니다.

      핵심 개념:
      기본 정규표현: φ, ε, 터미널 기호 a.
      P, Q가 정규표현이면 P · Q(접속), P + Q(합집합), P*(반복)도 정규표현이다.
      정규표현은 터미널 기호만으로 언어를 표현한다.
      논터미널은 문법(생성규칙)에서 쓰는 기호이다.
    tags: [regular-expression]

