      기호의 ( 가 )과(와) ( 나 )은(는) 실행할 때 식별자의 값을 얻기 위한 주소를 나타낸다. 여기서 ( 가 )은(는) 블록구조 언어의 블록단계를 나타냄으로써, 실행 시 값을 제대로 찾아갈 수 있다.
      매개변수나 배열에 대한 ( 다 )는(은) 의미분석 과정에서 배열이나 매개변수를 참조하는 식별자에 대해서 그 첨자의 개수가 정의된 개수와 같은지를 검사하기 위해, 또 배열에 대해서는 첨자를 계산하기 위해서 있어야 할 요소이다.

