      핵심 개념:
      I₂ = {[E → T·], [T → T·*F]}에서 [T → T·*F]가 * 로 I₇ = closure([T → T*·F])로 이동한다.
      같은 상태 2의 +, ), \$ 칸은 [E → T·]와 FOLLOW(E) = {+, ), \$}에 따라 r2가 된다.
