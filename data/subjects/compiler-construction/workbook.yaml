  # ── 4.8 Left-recursion의 제거 ──
  - id: b04-49
    type: multiple-choice
    passageRefs: [gwbb-lr-01]
    prompt: 다음은 주어진 문법에서 left-recursion을 제거하는 과정이다. (가)에 알맞은 것은?
    choices:
      - { id: '1', text: 'E+E′' }
      - { id: '2', text: 'TE′' }
      - { id: '3', text: 'FT′' }
      - { id: '4', text: 'EE′' }
    answers: ['2']
    explanation: |
      선택지 1: E+E′는 E로 시작하므로 left-recursion이 그대로 남는다.
      선택지 2: E → E+T | T에서 E는 결국 T 하나 뒤에 +T가 반복되는 형태이므로 E → TE′, E′ → +TE′ | ε로 바꿀 수 있다.
      선택지 3: FT′는 T의 left-recursion을 제거한 결과로 (나)에 해당한다.
      선택지 4: EE′는 E로 시작하므로 left-recursion이 제거되지 않는다.

      핵심 개념:
      E → E+T ⇒ E+T+T ⇒ … ⇒ T+T+…+T처럼 left-recursion은 맨 앞의 T 뒤에 +T가 반복되는 형태이다.
      A → Aα | β는 A → βA′, A′ → αA′ | ε로 바꾼다.
      결과 문법은 E → TE′, E′ → +TE′ | ε, T → FT′, T′ → *FT′ | ε, F → (E) | id이다.
      left-recursion이 있으면 top-down 구문분석이 무한 루프에 빠지므로 제거한다.

  - id: b04-50
    type: multiple-choice
    passageRefs: [gwbb-lr-01]
    prompt: 다음은 주어진 문법에서 left-recursion을 제거하는 과정이다. (나)에 알맞은 것은?
    choices:
