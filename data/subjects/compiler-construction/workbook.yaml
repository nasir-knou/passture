    answers: ['3']
    explanation: |
      선택지 1: 단일 생성규칙은 제거 대상이 되는 규칙 형태로, 해결 방법이 아니다.
      선택지 2: backtracking은 발생하는 문제로 (가)에 해당한다.
      선택지 3: backtracking을 해결하려면 공통 접두사 iEtS를 묶어 S → iEtSS′, S′ → ε | eS로 바꾸는 left-factoring을 해야 한다.
      선택지 4: 모호성은 해결 방법이 아니라 문법의 성질이다.

      핵심 개념:
      left-factoring은 A → αβ₁ | αβ₂를 A → αA′, A′ → β₁ | β₂로 바꾸는 변환이다.
      공통 접두사 α를 먼저 읽은 뒤 뒷부분을 보고 규칙을 고르므로 backtracking이 없어진다.
      지문 문법에서 α는 iEtS이다.
      left-factoring은 top-down 구문분석을 위한 문법 변환이다.

