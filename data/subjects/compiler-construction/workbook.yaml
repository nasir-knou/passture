      - { id: '4', text: '어휘분석기가 충분한 시간을 갖고 문자를 검사(scan)하도록 설계해야 한다.' }
    answers: ['4']
    explanation: |
      선택지 1: 어휘분석기를 정확히 만들려면 문법이 명확하게 주어져야 하므로 고려사항이다.
      선택지 2: 상태전이도에서 검사하는 순서에 따라 분석 시간이 달라지므로 고려사항이다.
      선택지 3: 자주 사용되는 토큰을 먼저 검사하도록 확률개념을 도입하면 분석 시간을 줄일 수 있으므로 고려사항이다.
      선택지 4: 어휘분석기가 한 문자 한 문자 검사하며 처리하는 데에는 의외로 시간이 많이 걸리므로 이 시간을 단축시켜야 한다. 충분한 시간을 갖도록 설계한다는 것은 거리가 멀다.

      핵심 개념:
