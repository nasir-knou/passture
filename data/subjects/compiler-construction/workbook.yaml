      - { id: '2', text: 'nullable' }
      - { id: '3', text: 'ε-free' }
      - { id: '4', text: 'Cycle-free' }
    answers: ['2']
    explanation: |
      선택지 1: Proper 문법은 ε-free이고 cycle-free이며 쓸모없는 기호가 없는 문법을 말한다. 논터미널 하나의 성질을 가리키는 용어가 아니다.
      선택지 2: A ⇒* ε, 즉 A가 ε을 유도할 수 있으면 A를 nullable 논터미널이라 한다(기본교재 [정의 5-13]).
      선택지 3: ε-free 문법은 ε-생성규칙이 없는 문법(시작기호의 S → ε 예외 허용)이다.
      선택지 4: Cycle-free 문법은 A ⇒+ A 같은 순환 유도가 없는 문법이다.

      핵심 개념:
      nullable 논터미널은 A ⇒* ε인 논터미널이다.
      nullable 여부는 FIRST에 ε을 넣을지, FOLLOW를 전달할지 판단하는 기준이 된다.
      ε-free, cycle-free, 쓸모없는 기호 제거를 모두 만족하는 문법을 proper 문법이라 한다.
      A → ε 규칙이 직접 없어도 A → BC이고 B, C가 모두 nullable이면 A도 nullable이다.
    tags: [nullable, grammar-terms]

  # ===== 5.2.3 단순순위 구문분석 =====
  - id: b05-37
    type: multiple-choice
    passageRefs: [gwbc-prec-01]
    prompt: 다음은 단순순위 문법을 이용해서 기호 사이의 순위관계를 정하는 과정이다. (가)에 알맞은 것은?
    choices:
      - { id: '1', text: '( ⋖ T' }
      - { id: '2', text: '( ⋖ T,  T ⋗ )' }
      - { id: '3', text: 'T ⋖ (' }
      - { id: '4', text: 'T ⋖ (,  ) ⋗ T' }
    answers: ['2']
    explanation: |
      선택지 1: ( ⋖ T는 맞지만, T가 괄호 안의 오른쪽 끝 기호이므로 생기는 T ⋗ ) 관계가 빠져 있다.
      선택지 2: (T₁)에 문법규칙 T₁ → T를 적용하면 (T)가 된다. T는 ( 보다 늦게 유도된 부분트리의 왼쪽 끝이자 오른쪽 끝이므로 ( ⋖ T, T ⋗ ) 관계가 성립한다.
      선택지 3: 순위관계는 왼쪽 기호와 오른쪽 기호의 순서가 정해져 있다. 문장형 (T)에서 T는 ( 의 오른쪽에 있으므로 T ⋖ ( 처럼 방향을 바꿔 쓸 수 없다.
      선택지 4: T와 괄호의 위치를 뒤집어 쓴 관계로, 문장형 (T)에서는 나타나지 않는다.

      핵심 개념:
      Wirth-Weber 순위관계에서 X ≐ Y는 X와 Y가 한 생성규칙 오른쪽에 나란히 있을 때이다(F → (E)에서 ( ≐ E, E ≐ )).
      X ⋖ Y는 X 오른쪽 논터미널이 Y로 시작하는 문자열을 유도할 때, X ⋗ Y는 X로 끝나는 부분이 Y 왼쪽에 올 때 성립한다.
      유도트리로 보면 비교 대상 기호보다 더 늦게(더 깊이) 유도된 쪽의 순위가 높다.
      F → (E) → (E₁) → (T₁) → (T) → (F)로 내려갈 때마다 ( ⋖ X, X ⋗ ) 관계가 새로 생긴다.
    tags: [simple-precedence-parsing, precedence-relation]

  - id: b05-38
    type: multiple-choice
    passageRefs: [gwbc-prec-01]
    prompt: (나)에 알맞은 것은?
    choices:
      - { id: '1', text: '( ⋖ F' }
      - { id: '2', text: '( ⋖ F,  F ⋗ )' }
      - { id: '3', text: 'F ⋖ (' }
      - { id: '4', text: 'F ⋖ (,  ) ⋗ F' }
    answers: ['2']
    explanation: |
      선택지 1: ( ⋖ F는 맞지만, F가 괄호 안의 마지막 기호이므로 F ⋗ ) 관계도 함께 성립한다.
      선택지 2: (T)에 문법규칙 T → F를 적용하면 (F)가 된다. F는 ( 보다 늦게 유도되고 ) 앞에 오는 오른쪽 끝 기호이므로 ( ⋖ F, F ⋗ ) 관계가 성립한다.
      선택지 3: 문장형 (F)에서 F는 ( 의 오른쪽에 있으므로 F ⋖ ( 처럼 왼쪽·오른쪽을 바꾼 관계는 성립하지 않는다.
      선택지 4: 괄호와 F의 순서를 뒤집은 관계로, 이 유도 과정에서는 나오지 않는다.

      핵심 개념:
      이 문제의 유도 과정 F → (E) → (E₁) → (T₁) → (T) → (F)에서는 E → E₁, E₁ → T₁, T₁ → T, T → F 규칙이 차례로 적용된다.
      F → (E)에서 ( ≐ E, E ≐ )가 생기고, E를 E₁, T₁, T, F로 차례로 유도할 때마다 ( ⋖ X, X ⋗ )가 생긴다.
      ⋖는 핸들의 왼쪽 끝, ⋗는 핸들의 오른쪽 끝, ≐는 핸들 내부를 나타낸다.
      단순순위 구문분석기는 이 관계표로 스택 꼭대기의 핸들을 찾아 환원한다.
    tags: [simple-precedence-parsing, precedence-relation]

  - id: b05-39
    type: multiple-choice
    passageRefs: [gwbc-prec-02]
    prompt: 다음은 단순순위 문법을 이용해서 기호 사이의 순위관계를 정하는 과정이다. (가)에 알맞은 것은?
    choices:
      - { id: '1', text: 'T ⋖ *' }
      - { id: '2', text: '* ⋖ id' }
      - { id: '3', text: 'T ⋗ *' }
      - { id: '4', text: 'id ⋗ *' }
    answers: ['2']
    explanation: |
      선택지 1: T → T*F에서 T와 *는 같은 생성규칙 오른쪽에 나란히 있으므로 T ≐ *이며 T ⋖ *가 아니다.
      선택지 2: T*F에서 F → id를 적용해 T*id가 되었다. id는 * 보다 늦게 유도된 F 부분트리의 첫 기호이므로 * ⋖ id가 성립한다.
      선택지 3: T*id 단계에서 T는 아직 다시 유도되지 않았으므로 T 쪽에서 ⋗ 관계가 생기지 않는다. T의 오른쪽 끝 기호가 유도될 때 X ⋗ * 관계가 생긴다.
      선택지 4: id ⋗ *는 왼쪽 T가 id까지 유도된 뒤(id*id)에 생기는 관계로 (다)에 해당한다.

      핵심 개념:
      X ⋖ Y: 생성규칙 오른쪽에 XB가 있고 B ⇒+ Y…일 때, 즉 Y가 X보다 늦게 유도된 부분의 왼쪽 끝일 때 성립한다.
      X ⋗ Y: 생성규칙 오른쪽에 BY가 있고 B ⇒+ …X일 때, 즉 X가 Y보다 늦게 유도된 부분의 오른쪽 끝일 때 성립한다.
      T → T*F에서는 T ≐ *, * ≐ F가 성립한다.
      이후 F, T를 유도하면서 * ⋖ id, F ⋗ *, id ⋗ * 관계가 차례로 생긴다.
    tags: [simple-precedence-parsing, precedence-relation]

  - id: b05-40
    type: multiple-choice
    passageRefs: [gwbc-prec-02]
    prompt: (나)에 알맞은 것은?
    choices:
      - { id: '1', text: 'F ⋖ *' }
      - { id: '2', text: '* ⋖ id' }
      - { id: '3', text: 'F ⋗ *' }
      - { id: '4', text: 'id ⋗ *' }
    answers: ['3']
    explanation: |
      선택지 1: F는 * 의 왼쪽에 있으면서 * 보다 늦게 유도된 부분의 오른쪽 끝이므로 관계는 ⋖가 아니라 ⋗이다.
      선택지 2: * ⋖ id는 오른쪽 F를 id로 유도한 앞 단계(T*id)에서 생긴 관계로 (가)에 해당한다.
      선택지 3: T*id에서 T → F를 적용해 F*id가 되었다. F는 * 보다 늦게 유도된 T 부분트리의 오른쪽 끝이므로 F ⋗ *가 성립한다.
      선택지 4: id ⋗ *는 F를 다시 id로 유도한 다음 단계(id*id)에서 생기는 관계로 (다)에 해당한다.

      핵심 개념:
      T ≐ *에서 T를 더 유도하면, T로부터 나온 문자열의 오른쪽 끝 기호 X에 대해 X ⋗ *가 성립한다.
      T → F이면 F ⋗ *, 다시 F → id이면 id ⋗ *가 된다.
      유도트리에서 * 보다 더 깊은 위치에 있는 기호가 더 높은 순위를 갖는다.
      ⋗는 핸들의 오른쪽 끝을 표시하므로, 구문분석 중 스택 꼭대기 F와 입력 * 사이에서 F를 환원하게 된다.
    tags: [simple-precedence-parsing, precedence-relation]

