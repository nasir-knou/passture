    prompt: 다음 중 1-패스 컴파일러에 대한 설명은?
    choices:
      - { id: '1', text: '이식성(portability)이 좋다.' }
      - { id: '2', text: '기계코드 표현에 제약을 받는다.' }
      - { id: '3', text: 'backpatching이 요구된다.' }
      - { id: '4', text: '기계와 독립적인 최적화가 가능하다.' }
    answers: ['3']
    explanation: |
      선택지 1: 이식성이 좋은 것은 중간코드를 기점으로 전반부와 후반부를 나누는 2-패스 컴파일러의 특징이다.
      선택지 2: 워크북은 기계코드 표현에 제약을 받는 것을 2-패스 컴파일러의 특징으로 설명한다(1.4절 5번 참고). 직접 목적코드로 번역하지 못하고 중간코드를 거치기 때문이다.
      선택지 3: 1-패스 컴파일러는 전진분기(forward jump)를 처리하기 위해 빈칸으로 남겨 두었다가 그 정보를 얻었을 때 채워 넣는 backpatching이 필요하다.
      선택지 4: 기계와 독립적인 최적화는 중간코드를 이용하는 2-패스 컴파일러에서 가능하다.

      핵심 개념:
      backpatching은 아직 결정되지 않은 분기 주소를 빈칸으로 남겼다가 나중에 채우는 기법이다.
      1-패스 컴파일러는 원시 프로그램을 한 번만 읽으므로 앞쪽으로 가는 분기의 목적지를 미리 알 수 없다.
      중간코드를 이용한 최적화와 이식성은 2-패스 컴파일러의 장점이다.
      1-패스 컴파일러는 초창기 컴파일러 제작에 사용된 방법이다.
    tags: [one-pass-compiler, backpatching]

