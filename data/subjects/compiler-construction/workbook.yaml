      선택지 2: (다)는 GOTO 부분 [2, C] 칸이다. I₂에서 논터미널 C에 의해 도달하는 곳은 I₅ = {[S → CC·, \$]}이므로 GOTO 5이다.
      선택지 3: 6은 I₂의 터미널 c 전이 대상으로 ACTION [2, c] = S6에 해당한다.
