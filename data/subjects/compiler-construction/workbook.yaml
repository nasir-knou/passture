      선택지 2: (나)는 [2, d] 칸이다. I₂에서 d에 의해 도달하는 곳은 I₇이므로 S7이다.
      선택지 3: r3은 완성 항목 [C → d·]를 가진 상태의 행동이다. I₂에는 완성 항목이 없다.
      선택지 4: acc는 [S′ → S·, \$]를 가진 I₁의 \$ 칸에만 들어간다.

      핵심 개념:
      I₂ = {[S → C·C, \$], [C → ·cC, \$], [C → ·d, \$]}의 터미널 전이는 c → I₆, d → I₇이다.
      점 뒤에 터미널이 있는 항목은 shift, 점이 끝에 있는 항목은 reduce를 만든다.
      I₂처럼 점이 끝에 있는 항목이 없는 상태에는 reduce 칸이 없다.
      터미널 전이는 ACTION 부분, 논터미널 전이는 GOTO 부분에 기록한다.

  - id: b05-74
