      선택지 2: top-down 방법은 잘못 선택한 생성규칙을 되돌리는 backtracking이 필요하다는 단점이 있으므로 옳다.
      선택지 3: top-down 방법은 좌단유도를 하므로 좌파스를 생성한다. 옳은 설명이다.
      선택지 4: top-down 방법은 backtracking 때문에 한 입력기호를 여러 번 반복하여 스캐닝해 시간이 매우 오래 걸리므로 실제 컴파일러의 구문분석 알고리즘으로 쓰기에 부적당하다. 일반적으로 bottom-up 방법을 더 많이 사용하므로 틀린 설명이다.

      핵심 개념:
      top-down 방법은 시작기호로부터 생성규칙을 적용하여 주어진 문자열과 같은 문장을 유도해 나간다.
      생성규칙이 잘못되어 문자열을 만들 수 없으면 보았던 문자열을 다시 스캐닝하며 다른 규칙으로 유도를 시도한다(backtracking).
      backtracking은 시간이 많이 걸려 일반 top-down 방법은 실용 컴파일러에 부적당하다.
      실제 컴파일러는 LR 계열 bottom-up 방법이나 backtracking이 없는 LL(k) 방법을 사용한다.

