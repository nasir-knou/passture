    answers: ['3']
    explanation: |
      선택지 1: 시작기호 S에 S → bAS를 적용한 첫 문장형이므로 우단유도 과정에 포함된다.
      선택지 2: bAS의 가장 오른쪽 비단말 S에 S → bAS를 적용한 문장형이므로 포함된다.
      선택지 3: bbbAS는 왼쪽 A를 먼저 b로 대치해야 나오는 문장형으로 좌단유도 과정에 나타나며 우단유도와는 관계없다.
      선택지 4: bAbAa의 가장 오른쪽 비단말 A에 A → b를 적용한 문장형이므로 포함된다.

      핵심 개념:
      우단유도는 매 단계에서 가장 오른쪽 비단말을 대치한다.
      bbbba의 우단유도는 S ⇒ bAS ⇒ bAbAS ⇒ bAbAa ⇒ bAbba ⇒ bbbba 이다.
      우단유도 과정에서는 오른쪽 부분이 먼저 터미널로 바뀌어 간다.
      좌단유도에서는 왼쪽 부분이 먼저 터미널로 바뀌므로 bbbAS 같은 문장형이 나타난다.

  - id: b04-19
    type: multiple-choice
    passageRefs: [gwbb-deriv-03]
    prompt: First(A)는?
    choices:
      - { id: '1', text: 'a' }
      - { id: '2', text: 'a, b' }
      - { id: '3', text: 'a, b, ε' }
      - { id: '4', text: 'a, b, \$' }
    answers: ['2']
    explanation: |
      선택지 1: A → b에서 얻는 b와 First(S)의 b가 빠져 있다.
      선택지 2: S → bAS, S → a에서 First(S) = {b, a}이고, A → SS에서 First(A) ⊇ First(S), A → b에서 First(A) ⊇ {b}이므로 First(A) = {a, b}이다.
      선택지 3: A와 S에는 ε-생성규칙이 없으므로 ε은 First(A)에 들어가지 않는다.
      선택지 4: 입력 끝 표시(\$)는 FIRST 집합에 들어가지 않는다.

      핵심 개념:
      FIRST는 생성규칙 오른쪽의 첫 기호로부터 구한다.
      A → SS처럼 비단말로 시작하면 First(S)를 First(A)에 포함한다.
      S가 ε을 유도하지 않으므로 두 번째 S의 FIRST는 고려하지 않는다.
      FIRST에는 터미널과 (필요할 때) ε만 들어간다.

  - id: b04-20
    type: multiple-choice
    passageRefs: [gwbb-deriv-03]
    prompt: Follow(A)는?
    choices:
      - { id: '1', text: 'a' }
      - { id: '2', text: 'b' }
      - { id: '3', text: 'a, b' }
      - { id: '4', text: 'a, b, \$' }
    answers: ['3']
    explanation: |
      선택지 1: First(S)의 b가 빠져 있다.
      선택지 2: First(S)의 a가 빠져 있다.
      선택지 3: S → bAS에서 A 뒤에 S가 오므로 Follow(A) ⊇ First(S) = {a, b}이다. A가 생성규칙 오른쪽 끝에 오는 경우가 없으므로 Follow(A) = {a, b}이다.
      선택지 4: \$는 A가 문장형의 오른쪽 끝에 올 수 있을 때 들어가는데, A 뒤에는 항상 S가 오므로 \$는 들어가지 않는다.

      핵심 개념:
      B → αAβ이면 FIRST(β)에서 ε을 뺀 것을 FOLLOW(A)에 넣는다.
      B → αA이면 FOLLOW(B)를 FOLLOW(A)에 넣는다.
      좌단유도로 적용한 생성규칙 순서를 좌파스, 우단유도로 적용한 순서의 역순을 우파스라고 한다.
      top-down 구문분석은 좌파스를, bottom-up 구문분석은 우파스를 생성한다.
      유도 과정을 트리로 나타낸 것을 유도트리(derivation tree) 또는 파스트리(parse tree)라고 한다.

  # ── 4.3 모호성 ──
  - id: b04-21
    type: multiple-choice
    passageRefs: [gwbb-amb-01]
    prompt: 다음 문법에 대한 설명 중에서 ==틀린== 것은?
    choices:
      - { id: '1', text: '두 개 이상의 유도트리를 갖는 모호한 문법이다.' }
      - { id: '2', text: '구문분석기를 구현하기는 쉽지만 구문분석 시간이 느리다.' }
      - { id: '3', text: '연산자 우선순위를 적용하면 모호성이 해결될 수 있다.' }
      - { id: '4', text: '결합법칙을 적용하면 모호성이 해결될 수 있다.' }
    answers: ['2']
    explanation: |
      선택지 1: id+id*id 같은 문장에 대해 서로 다른 유도트리가 두 개 이상 만들어지므로 모호한 문법이라는 설명은 옳다.
      선택지 2: 모호한 문법으로는 구문분석기를 구현하기가 복잡하며 시간도 많이 걸린다. 구현이 쉽다는 부분이 틀렸다.
      선택지 3: *를 +보다 높은 우선순위로 정하면 id+id*id의 트리가 하나로 정해지므로 옳은 설명이다.
      선택지 4: 같은 연산자가 이어질 때 왼쪽(또는 오른쪽) 결합을 정하면 id+id+id의 트리가 하나로 정해지므로 옳은 설명이다.

      핵심 개념:
      하나의 문장에 대해 서로 다른 유도트리가 두 개 이상 존재하면 문법이 모호하다(ambiguous)고 한다.
      같은 좌단유도(또는 우단유도) 방법을 써도 생성규칙을 다르게 적용하면 서로 다른 유도트리가 만들어질 수 있다.
      모호한 문법은 구문분석기 구현을 복잡하게 하고 분석 시간을 늘린다.
      연산자 우선순위와 결합법칙을 문법에 반영하면 모호성을 제거할 수 있다.

  - id: b04-22
    type: multiple-choice
    passageRefs: [gwbb-amb-02]
    prompt: 위 문법의 특성은?
    choices:
      - { id: '1', text: '모호하다.' }
      - { id: '2', text: '정규문법이다.' }
      - { id: '3', text: '유일한 유도트리를 생성한다.' }
      - { id: '4', text: '단일 생성규칙을 갖는다.' }
    answers: ['1']
    explanation: |
      선택지 1: id+id*id를 우단유도하면 E ⇒ E+E ⇒ E+E*E ⇒ E+E*id ⇒ E+id*id ⇒ id+id*id와 E ⇒ E*E ⇒ E*id ⇒ E+E*id ⇒ E+id*id ⇒ id+id*id의 두 가지 유도트리가 생기므로 모호하다.
      선택지 2: 정규문법은 A → aB, A → a 꼴만 허용하는데, E → E+E는 오른쪽에 비단말이 두 개 있으므로 정규문법이 아니다.
      선택지 3: 같은 문장에 대해 두 개의 유도트리가 생기므로 유일한 유도트리를 생성하지 않는다.
      선택지 4: 단일 생성규칙은 A → B처럼 오른쪽이 비단말 하나인 규칙인데, 이 문법에는 그런 규칙이 없다.

      핵심 개념:
      모호성은 한 문장에 대해 유도트리가 두 개 이상 존재하는 성질이다.
      E → E+E | E*E | id는 연산자 우선순위와 결합법칙이 정해져 있지 않아 모호하다.
      같은 우단유도라도 처음에 E+E를 쓰느냐 E*E를 쓰느냐에 따라 트리가 달라진다.
      정규문법, 단일 생성규칙 같은 용어의 정의를 구분해 둔다.

  - id: b04-23
    type: multiple-choice
    passageRefs: [gwbb-amb-02]
    prompt: 문자열 id+id*id를 우단유도할 때 핸들이 될 수 ==없는== 것은?
    choices:
      - { id: '1', text: 'E+E' }
      - { id: '2', text: 'E*E' }
      - { id: '3', text: 'id*id' }
      - { id: '4', text: 'id' }
    answers: ['3']
    explanation: |
      선택지 1: E ⇒ E+E ⇒ …의 첫 단계에서 E+E가 핸들이 되므로 핸들이 될 수 있다.
      선택지 2: E ⇒ E+E ⇒ E+E*E에서 E*E가 핸들이 되므로 핸들이 될 수 있다.
      선택지 3: 어느 우단유도에서도 id*id를 한 번에 대치하는 생성규칙이 없으므로 id*id는 핸들이 될 수 없다.
      선택지 4: E+E*id, E+id*id, id+id*id 등의 단계에서 id가 E → id로 환원되는 핸들이다.

      핵심 개념:
      핸들은 우단유도의 한 단계에서 생성규칙 오른쪽과 일치하여 왼쪽 비단말로 환원될 부분 문자열이다.
      핸들은 반드시 어떤 생성규칙의 오른쪽 전체와 같아야 한다.
      이 문법의 생성규칙 오른쪽은 E+E, E*E, id뿐이므로 핸들도 이 셋 중 하나이다.
      bottom-up 구문분석은 핸들을 찾아 reduce하는 과정을 반복한다.

  - id: b04-24
    type: multiple-choice
    passageRefs: [gwbb-amb-02]
    prompt: First(E)는?
    choices:
      - { id: '1', text: 'ε' }
      - { id: '2', text: '+' }
      - { id: '3', text: '*' }
      - { id: '4', text: 'id' }
    answers: ['4']
    explanation: |
      선택지 1: E에는 ε-생성규칙이 없으므로 ε은 First(E)에 들어가지 않는다.
      선택지 2: +는 E → E+E에서 E 뒤에 오는 기호로 Follow(E)의 원소이다.
      선택지 3: *는 E → E*E에서 E 뒤에 오는 기호로 Follow(E)의 원소이다.
      선택지 4: E → E+E, E → E*E는 E로 시작해 First(E) 자신을 더할 뿐이고, E → id에서 id를 얻으므로 First(E) = {id}이다.

      핵심 개념:
      FIRST는 유도되는 문자열의 맨 앞에 나올 수 있는 터미널의 집합이다.
      E → E+E처럼 자기 자신으로 시작하는 규칙은 FIRST에 새 원소를 더하지 않는다.
      연산자 +, *는 항상 E 뒤에 나오므로 FIRST가 아니라 FOLLOW에 들어간다.
      따라서 이 문법에서 First(E) = {id}이다.

  - id: b04-25
    type: multiple-choice
    passageRefs: [gwbb-amb-02]
    prompt: Follow(E)가 ==아닌== 것은?
    choices:
      - { id: '1', text: '\$' }
      - { id: '2', text: '+' }
      - { id: '3', text: '*' }
      - { id: '4', text: 'id' }
    answers: ['4']
    explanation: |
      선택지 1: E는 시작기호이므로 Follow(E) ⊇ {\$}이다.
      선택지 2: E → E+E에서 E 뒤에 +가 오므로 Follow(E) ⊇ FIRST(+) = {+}이다.
      선택지 3: E → E*E에서 E 뒤에 *가 오므로 Follow(E) ⊇ FIRST(*) = {*}이다.
      선택지 4: id는 First(E)의 원소이며 E 바로 뒤에 id가 오는 경우는 없으므로 Follow(E)가 아니다.

      핵심 개념:
      시작기호의 FOLLOW에는 입력 끝 표시(\$)를 넣는다.
      생성규칙 오른쪽에서 E 바로 뒤에 오는 기호의 FIRST를 Follow(E)에 넣는다.
      따라서 Follow(E) = {+, *, \$}이다.
      FIRST와 FOLLOW를 혼동하지 않도록 기호가 비단말의 앞에 오는지 뒤에 오는지 확인한다.

  # ── 4.4 불필요한 생성규칙의 제거 ──
  - id: b04-26
    type: multiple-choice
    passageRefs: [gwbb-useless-01]
    prompt: 다음 문법에서 시작기호로부터 도달 ==불가능한== 기호를 갖는 생성규칙은?
    choices:
      - { id: '1', text: 'S → B' }
      - { id: '2', text: 'B → bB' }
      - { id: '3', text: 'B → b' }
      - { id: '4', text: 'C → d' }
    answers: ['4']
    explanation: |
      선택지 1: 시작기호 S의 생성규칙이므로 도달 가능하다.
      선택지 2: S → B로 B에 도달할 수 있으므로 B → bB는 도달 가능하다.
      선택지 3: 같은 이유로 B → b도 도달 가능하다.
      선택지 4: 어떤 생성규칙의 오른쪽에도 C가 나타나지 않으므로 C는 시작기호 S로부터 도달이 불가능하고, C → d는 불필요한 생성규칙이다.

      핵심 개념:
      불필요한 기호(useless symbol)는 터미널 문자열을 생성할 수 없는 논터미널이거나 시작기호로부터 도달 불가능한(unaccessible) 기호이다.
      불필요한 기호를 가진 생성규칙을 불필요한 생성규칙(useless production)이라 한다.
      불필요한 생성규칙은 유도과정에서 사용되지 않으면서 구문분석을 복잡하게 하므로 제거한다.
      도달 가능성은 시작기호에서 출발해 오른쪽에 나타나는 비단말을 차례로 따라가며 확인한다.

  - id: b04-27
    type: multiple-choice
    passageRefs: [gwbb-useless-02]
    prompt: 다음 문법에서 시작기호로부터 도달 ==불가능한== 기호를 갖는 생성규칙은?
    choices:
      - { id: '1', text: 'S → A | C' }
      - { id: '2', text: 'A → aS' }
      - { id: '3', text: 'B → b' }
      - { id: '4', text: 'C → c' }
    answers: ['3']
    explanation: |
      선택지 1: 시작기호 S의 생성규칙이므로 도달 가능하다.
      선택지 2: S → A로 A에 도달할 수 있으므로 A → aS는 도달 가능하다.
      선택지 3: B는 어떤 생성규칙의 오른쪽에도 나타나지 않으므로 시작기호로부터 도달이 불가능하다. 따라서 B → b가 불필요한 생성규칙이다.
      선택지 4: S → C로 C에 도달할 수 있으므로 C → c는 도달 가능하다.

      핵심 개념:
