      선택지 2: 간접 triple은 triple들과 별도로 수행순서를 나타내는 표를 두는데, 표에 수행순서 표가 없다.
      선택지 3: U코드는 가상 기계를 위한 중간언어로, 3-주소 코드를 표현하는 방법이 아니다.
      선택지 4: quadruple은 결과 필드가 추가된 네 필드로 구성되며 임시변수에 결과를 저장한다.

      핵심 개념:
      3-주소 코드는 중간코드의 추상형식(abstract form)으로 triple, quadruple, 간접 triple로 구현된다.
      triple 표현은 〈op〉〈피연산자 1〉〈피연산자 2〉 세 필드로 구성된다.
      임시변수가 기호표에 들어가는 것을 피하려고 각 triple에 번호를 붙이고 결과를 번호로 지칭한다.
      코드이동 시 그 triple을 참조하는 피연산자도 바꿔야 하므로 triple은 최적화에 불편하다.

