      선택지 2: 단순순위 문법은 ε-생성규칙이 없고 오른쪽 부분이 같은 생성규칙이 없으며, 두 기호 사이에 많아야 한 개의 Wirth-Weber 순위관계를 갖는 문법이다. 문제가 묻는 대표적인 정의이다.
      선택지 3: 확장순위 문법은 두 기호가 아니라 두 문자열 x, y 사이에 많아야 한 개의 확장 순위관계를 갖는 문법이다.
      선택지 4: 한정순위 문법도 워크북 정의상 기호 사이에 많아야 한 개의 Wirth-Weber 순위관계를 갖지만, 이는 단순순위 문법의 조건을 그대로 가져온 것이다. 이 조건을 처음 정의한 문법은 단순순위 문법이므로 워크북은 ②를 정답으로 한다(엄밀히는 ④도 조건을 만족해 복수정답 소지가 있다).

      핵심 개념:
      순위문법은 순위관계를 정의하는 대상에 따라 구분된다.
      연산자순위 문법은 터미널 사이, 단순순위 문법은 모든 기호 사이, 확장순위 문법은 문자열 사이의 관계를 사용한다.
      단순순위 문법은 ε-생성규칙이 없고 오른쪽 부분이 같은 생성규칙이 없어야 한다.
      두 기호 사이에 관계가 두 개 이상이면 순위 충돌이 생겨 결정적 구문분석이 불가능하다.
    tags: [simple-precedence-grammar, precedence-grammar]

  - id: b05-22
    type: multiple-choice
    passageRefs: [gwbc-ff-grammar-01]
    prompt: 다음 문법을 보고 물음에 답하라. First(E)를 구하면?
    choices:
      - { id: '1', text: '+, )' }
      - { id: '2', text: '+, *, )' }
      - { id: '3', text: '(, id' }
      - { id: '4', text: '+, ), (, id' }
    answers: ['3']
    explanation: |
      선택지 1: +와 )는 E 뒤에 나오는 기호로 FOLLOW(E)의 원소이며, E로부터 유도되는 문자열의 첫 기호가 아니다.
      선택지 2: +, *, )는 모두 E, T 뒤에 나오는 기호이다. E의 유도는 항상 ( 나 id로 시작한다.
      선택지 3: E → T에서 First(E) ⊇ First(T), T → F에서 First(T) ⊇ First(F)이고, F → (E) | id이므로 First(F) = {(, id}이다. 따라서 First(E) = {(, id}이다.
      선택지 4: ( 와 id는 맞지만 +와 )는 FIRST가 아니라 FOLLOW에 속하는 기호이다.

      핵심 개념:
      FIRST(X)는 X로부터 유도되는 문자열의 맨 앞에 올 수 있는 터미널의 집합이다.
      X → Yα이고 Y가 ε을 유도하지 않으면 FIRST(Y)가 FIRST(X)에 포함된다.
      E → E+T나 T → T*F처럼 왼쪽 재귀 규칙은 FIRST에 새 기호를 더하지 않는다.
      이 문법에서는 FIRST(E) = FIRST(T) = FIRST(F) = {(, id}이다.
    tags: [first-set]

  - id: b05-23
    type: multiple-choice
    passageRefs: [gwbc-ff-grammar-01]
    prompt: First(T)를 구하면?
    choices:
      - { id: '1', text: '+, )' }
      - { id: '2', text: '+, *, )' }
      - { id: '3', text: '(, id' }
      - { id: '4', text: '+, ), (, id' }
    answers: ['3']
    explanation: |
      선택지 1: +와 )는 T 뒤에 나올 수 있는 기호로 FOLLOW(T)에 속하며 FIRST(T)가 아니다.
      선택지 2: +, *, )는 모두 FOLLOW(T)의 원소이다. T로부터의 유도는 ( 또는 id로 시작한다.
      선택지 3: T → T*F는 First(T) 자신만 더하고, T → F에서 First(T) ⊇ First(F) = {(, id}이다. 더 이상 E, T와 관련된 다른 규칙이 없으므로 First(T) = {(, id}이다.
      선택지 4: +와 )가 섞여 있어 FIRST와 FOLLOW를 혼동한 것이다.

      핵심 개념:
      FIRST는 생성규칙 오른쪽의 첫 기호를 따라가며 구한다.
      오른쪽 첫 기호가 터미널이면 그 터미널을, 논터미널이면 그 논터미널의 FIRST를 더한다.
      E → T, T → F를 거치므로 First(E) ⊇ First(T) ⊇ First(F) 관계가 성립한다.
      F → (E) | id에서 First(F) = {(, id}이므로 세 집합이 모두 {(, id}로 같다.
    tags: [first-set]

  - id: b05-24
    type: multiple-choice
    passageRefs: [gwbc-ff-grammar-01]
    prompt: Follow(E)는?
    choices:
      - { id: '1', text: '+, )' }
      - { id: '2', text: '\$, +, )' }
      - { id: '3', text: '\$, *, )' }
      - { id: '4', text: '*, +, ), \$' }
    answers: ['2']
    explanation: |
      선택지 1: E는 출발기호이므로 입력 끝 표시 \$가 FOLLOW(E)에 반드시 들어가야 하는데 빠져 있다.
      선택지 2: E는 출발기호이므로 \$가 있고, 1)번 규칙 E → E+T에서 +, 5)번 규칙 F → (E)에서 )가 E 뒤에 온다. 따라서 FOLLOW(E) = {\$, +, )}이다.
      선택지 3: *는 T → T*F에서 T 뒤에 오는 기호로 FOLLOW(T)에 속하며, E 뒤에는 *가 올 수 없다.
      선택지 4: *가 포함되어 있으므로 FOLLOW(E)가 아니라 FOLLOW(T)나 FOLLOW(F)에 해당한다.

      핵심 개념:
      FOLLOW(A)는 문장형에서 A 바로 뒤에 나타날 수 있는 터미널의 집합이다.
      출발기호의 FOLLOW에는 입력 끝 표시 \$를 넣는다.
      B → αAβ이면 FIRST(β)에서 ε을 뺀 것을 FOLLOW(A)에 넣는다.
      B → αA이거나 β가 ε을 유도하면 FOLLOW(B)를 FOLLOW(A)에 넣는다.
    tags: [follow-set]

