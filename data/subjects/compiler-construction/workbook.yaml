    answers: ['3']
    explanation: |
      선택지 1: T₁은 (0)번 uminus B의 결과이며, (2)번에서는 피연산자 1로 쓰인다.
      선택지 2: T₂는 (1)번 C + D의 결과이며, (2)번에서는 피연산자 2로 쓰인다.
      선택지 3: (2)번 T₁ * T₂의 결과는 새 임시변수 T₃에 저장되고, (3)번에서 피연산자 1로 T₃이 쓰이므로 (나)는 T₃이다.
      선택지 4: A는 (3)번 대입문의 결과이다.

      핵심 개념:
      quadruple의 결과 필드에는 해당 연산의 결과를 담을 임시변수가 온다.
      A := -B * (C+D)에서 -B → T₁, C+D → T₂, T₁*T₂ → T₃ 순으로 계산된다.
      마지막 (:=, T₃, -, A)가 계산 결과를 A에 대입한다.
      표의 피연산자 필드를 보면 앞 명령어의 결과 임시변수를 역으로 확인할 수 있다.

  - id: b07-10
    type: multiple-choice
    passageRefs: [gwbe-07-quad-blank-01]
    prompt: 다음은 A := -B * (C+D)를 3-주소 코드로 표현한 것이다. (다)에 알맞은 것은?
    choices:
      - { id: '1', text: 'T₁' }
      - { id: '2', text: 'T₂' }
      - { id: '3', text: 'T₃' }
      - { id: '4', text: 'A' }
    answers: ['4']
    explanation: |
      선택지 1: T₁은 (0)번 uminus B의 결과이다.
      선택지 2: T₂는 (1)번 C + D의 결과이다.
      선택지 3: T₃은 (2)번 T₁ * T₂의 결과이며, (3)번에서는 대입할 값(피연산자 1)으로 쓰인다.
      선택지 4: (3)번은 T₃의 값을 A에 대입하는 := 명령어이므로 결과 필드 (다)에는 A가 온다.

      핵심 개념:
      완성된 quadruple 표는 (0) uminus B → T₁, (1) + C D → T₂, (2) * T₁ T₂ → T₃, (3) := T₃ → A이다.
      대입 명령어는 피연산자 1의 값을 결과 필드의 변수에 저장한다.
      대입 명령어에서 피연산자 2 필드는 쓰이지 않는다.
      quadruple은 결과 필드를 명시하므로 명령어 순서를 바꿔도 참조 관계가 유지된다.

  - id: b07-11
    type: multiple-choice
    prompt: 다음 중 나머지 셋과 가장 거리가 먼 것은?
    choices:
      - { id: '1', text: 'triple' }
      - { id: '2', text: '간접 triple' }
      - { id: '3', text: 'quadruple' }
      - { id: '4', text: 'U코드' }
    answers: ['4']
    explanation: |
      선택지 1: triple은 세 필드로 구성된 3-주소 코드 표현 방법이다.
      선택지 2: 간접 triple은 triple의 수행순서를 별도 표로 관리하는 3-주소 코드 표현 방법이다.
      선택지 3: quadruple은 결과 필드를 포함한 네 필드로 구성된 3-주소 코드 표현 방법이다.
      선택지 4: U코드는 3-주소 코드를 표현하는 방법이 아니므로 나머지 셋과 가장 거리가 멀다.

      핵심 개념:
      3-주소 코드는 연산자 하나와 최대 세 개의 주소(피연산자 두 개와 결과)로 이루어진 중간코드이다.
      3-주소 코드는 triple, 간접 triple, quadruple 형태로 구현된다.
      triple은 결과를 번호로, quadruple은 임시변수로 지칭한다.
      간접 triple은 수행순서 표만 바꿔 최적화를 쉽게 한다.

  - id: b07-12
    type: multiple-choice
    prompt: 구문분석을 하면서 중간코드를 생성하는 방법은?
    choices:
      - { id: '1', text: '프리프로세서' }
      - { id: '2', text: '구문지시적 변환' }
      - { id: '3', text: '파스트리' }
      - { id: '4', text: '의미수행 규칙' }
    answers: ['2']
    explanation: |
      선택지 1: 프리프로세서(전처리기)는 컴파일 전에 원시 프로그램을 가공하는 프로그램으로, 구문분석과 함께 중간코드를 생성하는 방법이 아니다.
      선택지 2: 구문지시적 변환(syntax-directed translation)은 구문분석을 하면서 중간코드를 생산하는 방법이다.
      선택지 3: 파스트리는 구문분석 결과로 얻는 문장의 구조를 나타낸 트리로, 중간코드 생성 방법 자체가 아니다.
      선택지 4: 의미수행(semantic action) 코드는 구문지시적 변환에서 각 생성규칙과 결합해 쓰이는 구성 요소일 뿐, 방법 전체를 가리키지는 않는다.

      핵심 개념:
      구문지시적 변환은 구문분석을 하면서 중간코드를 생산하는 방법이다.
      Context-Free 문법의 각 생성규칙과 결합된 부프로그램이나 의미수행 코드로 구성된다.
      생성규칙이 적용(환원)될 때 결합된 의미수행 코드가 호출되어 중간코드를 만든다.
      장점은 컴파일러 설계자가 원시언어의 구문구조에 따라 직접 중간언어 생성을 표현할 수 있다는 것이다.

  - id: b08-01
    type: multiple-choice
    prompt: 다음은 최적화의 분류에 관한 설명이다. ==틀린== 것은?
    choices:
      - { id: '1', text: '지역 최적화(local)와 전역 최적화(global)' }
      - { id: '2', text: '단일문에서의 최적화와 루프(loop)에서의 최적화' }
      - { id: '3', text: '실행속도 측면과 기억장소 절약 측면에서의 최적화' }
      - { id: '4', text: '중복명령어의 최적화와 제어흐름 최적화' }
    answers: ['4']
    explanation: |
      선택지 1: 최적화의 적용 범위에 따라 지역(local)최적화와 전역(global)최적화로 구분하므로 맞는 분류이다.
      선택지 2: 최적화 대상 문장에 따라 단일문에서의 최적화와 순환(loop)문에서의 최적화로 구분하므로 맞는 분류이다.
      선택지 3: 최적화 목적에 따라 실행속도 측면과 기억장소 절약 측면에서의 최적화로 구분하므로 맞는 분류이다.
      선택지 4: 중복명령어 제거나 제어흐름 최적화는 구체적인 최적화 기법이며, 워크북이 제시하는 최적화의 분류 기준에는 포함되지 않는다.

      핵심 개념:
      최적화란 실행속도를 높이고 기억장소를 절약하는 방법이다.
      범위에 따라 지역(local)최적화와 전역(global)최적화로 나눈다.
      대상에 따라 단일문에서의 최적화와 순환(loop)문에서의 최적화로 나눈다.
      목적에 따라 실행속도 측면과 기억장소 절약 측면에서의 최적화로 나눈다.

  - id: b08-02
    type: multiple-choice
    prompt: 최적화를 위하여 치환문을 삭제하고 삭제된 치환문의 l-value 대신에 r-value를 사용하는 것은?
    choices:
      - { id: '1', text: '상수전파' }
      - { id: '2', text: '복사전파' }
      - { id: '3', text: '루프전개' }
      - { id: '4', text: '루프융합' }
    answers: ['2']
    explanation: |
      선택지 1: 상수전파는 변수에 대입된 상수 값을 그 변수의 사용 위치에 직접 대입하는 최적화로, 변수를 다른 변수로 바꾸는 것이 아니다.
      선택지 2: 복사전파는 A := B … C := A + D를 C := B + D처럼 바꾸어, 치환문 A := B를 삭제하고 A 대신 B를 사용하는 최적화이다.
      선택지 3: 루프전개는 루프 몸체를 여러 번 복제해 반복 횟수와 루프 제어 부담을 줄이는 최적화이다.
      선택지 4: 루프융합은 같은 범위를 도는 인접한 루프들을 하나의 루프로 합치는 최적화이다.

      핵심 개념:
      l-value는 기억장소의 주소이고, r-value는 기억장소에 있는 값이다.
      A := B에서 A는 l-value이지만 C := A + D에서 A는 값을 나타내는 r-value이다.
      복사전파는 A := B 이후 A의 사용을 B로 바꾸고 치환문 A := B를 삭제한다.
      예: A := B … C := A + D ⟹ C := B + D.
