  # ── 5.1 구문분석의 종류 ──
  - id: b05-01
    type: multiple-choice
    prompt: 다음 구문분석에 대한 설명 중 ==잘못된== 것은?
    choices:
      - { id: '1', text: 'top-down 구문분석 방법은 루트 노드로부터 터미널 노드를 향하여 파스트리를 만들어 나간다.' }
      - { id: '2', text: 'bottom-up 구문분석 방법은 터미널 노드부터 시작하여 루트노드로 파스트리를 만들어 나간다.' }
      - { id: '3', text: 'shift-reduce 구문분석은 top-down 방법으로 시작기호로부터 출발하여 유도에 의하여 주어진 문자열을 찾아간다.' }
      - { id: '4', text: 'bottom-up 구문분석은 입력된 문자열에서 reduce에 의해 시작기호를 찾아간다. 따라서 우단유도를 하게 된다.' }
    answers: ['3']
    explanation: |
      선택지 1: top-down 구문분석은 루트 노드(시작기호)에서 터미널 노드 방향으로 파스트리를 만들므로 옳다.
      선택지 2: bottom-up 구문분석은 터미널 노드에서 루트 노드 방향으로 파스트리를 만들므로 옳다.
      선택지 3: shift-reduce 구문분석은 입력을 스택에 shift하고 핸들을 reduce하는 bottom-up 구문분석 방법이다. 시작기호에서 출발해 유도로 문자열을 찾아가는 것은 top-down 방법이므로 잘못된 설명이다.
      선택지 4: bottom-up 구문분석은 입력 문자열에서 reduce로 시작기호를 찾아가며, 이는 우단유도의 역순이므로 옳다.

      핵심 개념:
      top-down: 루트 → 터미널 방향, 시작기호에서 유도로 문자열을 찾음, 좌단유도, LL·predictive·recursive-descent 방법, LL(k) 문법을 사용한다.
      bottom-up: 터미널 → 루트 방향, 문자열에서 reduce로 시작기호를 찾음, 우단유도(역순), 우파스를 생성한다.
      bottom-up 방법에는 단순순위, 확장순위, 한정순위, 혼합순위, SLR(Simple LR), CLR(Canonical LR), LALR(Look-Ahead LR)이 있다.
      현재 bottom-up은 LR(k)(Left-to-right scan, Rightmost derivation, k개 lookahead), top-down은 LL(k)(Left-to-right scan, Leftmost derivation) 문법을 사용한다.

  - id: b05-02
    type: multiple-choice
    prompt: 다음 설명 중 올바르게 설명한 것은?
    choices:
      - { id: '1', text: 'top-down 구문분석 방법은 주어진 문자열로부터 reduce에 의해 시작기호를 찾아가는 방법이다.' }
      - { id: '2', text: 'bottom-up 구문분석 방법은 backtracking을 해야 한다는 단점이 있다.' }
      - { id: '3', text: 'top-down 구문분석 방법은 우파스를 생성한다.' }
      - { id: '4', text: '구문분석을 하는 과정을 트리 형태로 나타낸 것을 유도트리 또는 파스트리라고 한다.' }
    answers: ['4']
    explanation: |
      선택지 1: 문자열에서 reduce로 시작기호를 찾아가는 것은 bottom-up 방법이다. top-down은 시작기호에서 유도로 문자열을 찾아간다.
      선택지 2: backtracking은 top-down 구문분석 방법의 단점이다.
      선택지 3: top-down 구문분석은 좌파스를 생성하고, 우파스를 생성하는 것은 bottom-up 구문분석이다.
      선택지 4: 구문분석 과정, 즉 문장이 유도되는 과정을 트리로 나타낸 것을 유도트리(derivation tree) 또는 파스트리(parse tree)라 하므로 올바른 설명이다.

      핵심 개념:
      top-down은 좌단유도로 좌파스를, bottom-up은 우단유도의 역순으로 우파스를 생성한다.
      top-down은 시작기호에서, bottom-up은 입력 문자열에서 출발한다.
      backtracking은 top-down 방법에서 잘못 고른 생성규칙을 되돌릴 때 생긴다.
      유도트리와 파스트리는 같은 개념이다.

