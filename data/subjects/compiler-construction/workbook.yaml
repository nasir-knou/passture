  # ---- 5.2.6 (13~14): LR(1) canonical collection ----
  - id: b05-76
    type: multiple-choice
    passageRefs: [gwbd-clr-lr1-01]
    prompt: 다음은 CLR 구문분석과 관련된 내용이다. GOTO(I₀, c)를 구한 것을 위의 보기에서 고르면?
    choices:
      - { id: '1', text: '가' }
      - { id: '2', text: '나' }
      - { id: '3', text: '다' }
      - { id: '4', text: '라' }
    answers: ['4']
    explanation: |
      선택지 1: (가)는 GOTO(I₀, C) = I₂로, 논터미널 C로 이동한 결과이다.
      선택지 2: (나)는 [S → C·C]에 lookahead c/d가 붙어 있는데, I₀의 [S → ·CC, \$]를 옮기면 lookahead는 \$ 가 유지되어야 하므로 어떤 GOTO 결과도 아니다.
      선택지 3: (다)는 lookahead가 \$ 인 I₆ = GOTO(I₂, c)이다. I₀에서 c로 이동한 항목의 lookahead는 c/d이다.
      선택지 4: I₃ = GOTO(I₀, c) = closure([C → c·C, c/d]) = {[C → c·C, c/d], [C → ·cC, c/d], [C → ·d, c/d]}이므로 (라)이다.

      핵심 개념:
      GOTO(I, X)는 I에서 점 바로 뒤가 X인 항목들의 점을 한 칸 옮긴 뒤 closure를 구한 것이다.
      점을 옮길 때 lookahead는 그대로 유지된다.
      LR(1) closure에서 [A → α·Bβ, a]가 있으면 B → ·γ 항목의 lookahead는 FIRST(βa)이다.
      [C → c·C, c/d]에서 C 뒤가 비어 있으므로 새 C 항목의 lookahead도 c/d가 된다.

  - id: b05-77
    type: multiple-choice
    passageRefs: [gwbd-clr-lr1-01]
    prompt: 다음은 CLR 구문분석과 관련된 내용이다. GOTO(I₀, C)를 구한 것을 위의 보기에서 고르면?
    choices:
      - { id: '1', text: '가' }
      - { id: '2', text: '나' }
      - { id: '3', text: '다' }
      - { id: '4', text: '라' }
    answers: ['1']
    explanation: |
      선택지 1: I₂ = GOTO(I₀, C) = closure([S → C·C, \$]) = {[S → C·C, \$], [C → ·cC, \$], [C → ·d, \$]}이므로 (가)이다.
      선택지 2: (나)는 lookahead를 c/d로 잘못 붙였다. [S → ·CC, \$]의 lookahead \$ 는 점을 옮겨도 유지되고, 두 번째 C 뒤에는 \$ 만 오므로 새 C 항목도 \$ 이다.
      선택지 3: (다)는 GOTO(I₂, c) = I₆으로, 논터미널 C가 아니라 터미널 c로 이동한 결과이다.
      선택지 4: (라)는 GOTO(I₀, c) = I₃이다.

      핵심 개념:
      I₀에서 점 뒤가 C인 항목은 [S → ·CC, \$] 하나이다.
      점을 옮긴 [S → C·C, \$]의 closure에서 C 뒤는 비어 있으므로 FIRST(ε\$) = {\$}가 lookahead가 된다.
      반면 I₀의 [C → ·cC, c/d]의 lookahead c/d는 [S → ·CC, \$]에서 첫 C 뒤의 C로부터 FIRST(C) = {c, d}를 얻은 것이다.
      closure를 구할 때 점 뒤 논터미널 다음 기호열의 FIRST로 lookahead를 정한다는 점이 LR(0)과의 차이이다.

