  - id: b01-24
    type: multiple-choice
    prompt: 다음은 1-패스 컴파일러와 2-패스 컴파일러에 대한 설명이다. ==틀린== 것은?
    choices:
      - { id: '1', text: '1-패스 컴파일러는 기억장소를 절약할 수 있다.' }
      - { id: '2', text: '1-패스 컴파일러는 backpatching이 요구된다.' }
      - { id: '3', text: '2-패스 컴파일러는 이식성(portability)이 좋다.' }
      - { id: '4', text: '2-패스 컴파일러는 실행속도가 늦다.' }
    answers: ['1']
    explanation: |
      선택지 1: 기억장소를 절약할 수 있는 것은 2-패스 컴파일러이다. 2-패스 컴파일러는 한 패스가 사용했던 공간을 다음 패스가 다시 사용하므로 1-패스 컴파일러라고 한 것은 틀린 설명이다.
      선택지 2: 1-패스 컴파일러는 전진분기(forward jump)의 목적지를 아직 모르므로 빈칸으로 남겼다가 나중에 채우는 backpatching이 요구된다.
      선택지 3: 2-패스 컴파일러는 중간코드를 기점으로 전반부와 후반부를 나누므로 후반부만 바꾸면 다른 기계에 옮길 수 있어 이식성이 좋다.
      선택지 4: 2-패스 컴파일러는 패스를 두 번 거치므로 1-패스 컴파일러보다 실행속도가 늦다.

      핵심 개념:
      1-패스 컴파일러: 효율성이 좋고 실행속도가 빠르지만 backpatching이 필요하고 기계코드 표현에 제약을 받는다.
      2-패스 컴파일러: 이식성이 좋고 기계와 독립적인 최적화가 가능하며 기억장소를 절약할 수 있다.
      2-패스 컴파일러는 중간코드를 기점으로 전반부(front-end)와 후반부(back-end)로 나뉜다.
      2-패스 컴파일러는 1-패스에 비해 실행속도가 느리다.
    tags: [pass, one-pass-compiler, two-pass-compiler]

  - id: b01-25
