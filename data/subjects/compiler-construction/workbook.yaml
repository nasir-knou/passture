      - { id: '3', text: 'r3' }
      - { id: '4', text: 'acc' }
    answers: ['4']
    explanation: |
      선택지 1: S6은 I₂, I₆에서 c로 I₆에 가는 shift이다. I₁에는 터미널 전이가 없다.
      선택지 2: S7은 I₂, I₆에서 d로 I₇에 가는 shift이다.
      선택지 3: r3은 C → d 환원으로 I₄, I₇에 들어간다. I₁의 항목은 [S′ → S·, \$]이다.
      선택지 4: (가)는 [1, \$] 칸이다. I₁ = {[S′ → S·, \$]}에서 \$ 를 만나면 시작기호까지 환원이 끝난 것이므로 accept가 된다.

      핵심 개념:
      증가문법은 새 시작기호 S′와 규칙 S′ → S를 추가해 분석 종료 시점을 분명히 한다.
      항목 [S′ → S·, \$]가 있는 상태의 \$ 칸에는 reduce 대신 acc를 넣는다.
      accept는 입력 전체가 문법의 문장으로 인식되었음을 뜻한다.
      acc는 파싱표에 한 칸만 존재한다.

