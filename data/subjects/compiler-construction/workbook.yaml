      선택지 2: 식별자 이름은 기호표 항목을 찾는 키가 되는 문자열이며, 첨자의 개수를 검사하는 데 쓰는 정보가 아니다.
      선택지 3: 유형은 식별자의 자료형 정보이며, 배열 첨자의 개수와 비교할 정보는 차원수이다.
      선택지 4: 블록 단계를 나타내는 것은 레벨이고, 오프세트는 기억장치상의 상대주소이므로 (가)와 (나)의 순서가 바뀌었다.

      핵심 개념:
      전형적인 기호표 레코드는 식별자 이름, 유형, 레벨, 오프세트, 차원수, 기타 속성으로 구성된다.
      레벨과 오프세트는 실행 시 식별자의 값을 얻기 위한 주소를 나타낸다.
      레벨은 블록구조 언어의 블록 단계를 나타내 실행 시 값을 제대로 찾아가게 한다.
      차원수는 첨자 개수 검사와 배열 첨자 계산에 필요하다.

  - id: b06-05
    type: multiple-choice
    prompt: 다음 기호표의 내용 중 식별자의 정확한 위치를 나타내는 상대주소는?
    choices:
      - { id: '1', text: '유형' }
      - { id: '2', text: '레벨' }
      - { id: '3', text: '오프세트' }
      - { id: '4', text: '차원수' }
    answers: ['3']
    explanation: |
      선택지 1: 유형은 식별자의 자료형을 나타내는 속성으로, 위치 정보가 아니다.
      선택지 2: 레벨은 식별자가 속한 블록구조 언어의 블록 단계를 나타내며, 기억장치상의 정확한 위치를 나타내지는 않는다.
      선택지 3: 오프세트(offset)는 기억장치상에서의 상대주소이며 식별자의 정확한 위치를 나타내므로 맞다.
      선택지 4: 차원수는 배열의 차원(dimension) 수로, 첨자 개수 검사와 첨자 계산에 쓰인다.

      핵심 개념:
      기호표에는 식별자 이름, 속성과 사용정보, 배열의 차원 수와 각 차원의 상·하한, 오프세트가 들어간다.
      같은 이름이 여러 블록에서 쓰이면 식별자가 속한 블록이나 프로시저를 나타내는 정보가 필요하다.
      속성으로는 레이블, 형식인자(formal parameter), 배열(array) 등을 나타낸다.
      오프세트는 기억장치상에서 식별자의 위치를 나타내는 상대주소이다.
      기호표는 특정 기호의 속성을 담는 레코드(record)들로 구성된다.

  - id: b06-06
    type: multiple-choice
    prompt: 기호표의 구성방법 중 가장 효율적인 방법은?
    choices:
      - { id: '1', text: 'Stack' }
      - { id: '2', text: '해시(hash)표' }
      - { id: '3', text: '선형 리스트' }
      - { id: '4', text: 'Tree' }
    answers: ['2']
    explanation: |
      선택지 1: Stack은 기호표 구성의 세 가지 방법(선형 리스트, 트리, 해시표)에 속하지 않으며, 임의의 식별자를 효율적으로 검색하는 구조가 아니다.
      선택지 2: 해싱(hashing)을 사용하면 해시표 크기가 $k$일 때 검색시간이 $\frac{n}{k}$에 비례하므로 가장 효율적이다.
      선택지 3: 선형 리스트는 구현이 가장 간단하지만 자료가 많아지면 모두 조사해야 하므로 $t$개 삽입과 $m$개 검색에 $c(t+m)$ ($c=\frac{n}{2}$)의 시간이 들어 가장 비효율적이다.
      선택지 4: 이진 탐색 트리(binary search tree)는 검색시간이 $(t+m)\log n$으로 $n$이 클 때 효율적이지만 해시표보다는 느리다.

      핵심 개념:
      기호표는 선형 리스트(linear list), 트리(tree), 해시(hash)표로 구성할 수 있다.
      $t$개의 식별자 추가와 $m$개의 검색이 있을 때 선형 리스트는 $c(t+m)$, $c=\frac{n}{2}$이다.
      이진 탐색 트리는 $(t+m)\log n$에 비례한다.
      해시표는 크기가 $k$일 때 $\frac{n}{k}(t+m)$에 비례해 가장 효율적이다.

  - id: b06-07
    type: multiple-choice
    prompt: 다음은 기호표 구성에 관한 설명이다. 식별자 이름의 수=n일 때, 다음 중 설명이 ==틀린== 것은?
    choices:
      - { id: '1', text: '선형 리스트 구조 : t개의 이름에 대한 삽입과 m개의 검색에 대한 모든 시간은 $c(t+m)$이다. 단, $c=n/2$은 연산에 필요한 시간이다.' }
      - { id: '2', text: '이진트리 구조 : t개의 이름을 삽입하는 데 필요한 시간은 $t\log n$이고, m개의 검색을 하는 데 필요한 시간은 $m\log n$이다.' }
      - { id: '3', text: '이진트리 구조 : t개의 삽입과 m개의 검색에 필요한 시간은 $(t+m)\log n$에 비례한다. 만일 n이 50보다 크다면 선형 리스트보다 효율적이다.' }
      - { id: '4', text: '해시표 : t개의 식별자 이름의 추가와 m개의 검색이 있다면, 전체적으로 필요한 시간은 $(t+m)\log k$에 비례한다. 단, 해시표가 k개의 단어로 구성되어 있다.' }
    answers: ['4']
    explanation: |
      선택지 1: 선형 리스트는 이름 하나의 삽입·검색에 $\frac{n}{2}=c$의 시간이 들므로 전체 시간은 $c\cdot t + c\cdot m = c(t+m)$으로 맞는 설명이다.
      선택지 2: 이진트리에서 한 번의 삽입·검색은 평균 $\log n$이므로 삽입 $t\log n$, 검색 $m\log n$으로 맞는 설명이다.
      선택지 3: 이진트리 전체 시간은 $(t+m)\log n$에 비례하며, $n$이 커지면 $\frac{n}{2}$보다 $\log n$이 훨씬 작아 선형 리스트보다 효율적이다.
      선택지 4: 해시표의 크기가 $k$일 때 한 번의 검색시간은 $\frac{n}{k}$에 비례하므로 전체 시간은 $\frac{n}{k}(t+m)$에 비례한다. $(t+m)\log k$는 틀린 설명이다.

      핵심 개념:
      기호표 구성 방법별 $t$개 삽입과 $m$개 검색의 전체 시간을 비교한다.
      선형 리스트: $c(t+m)$, $c=\frac{n}{2}$.
      이진 탐색 트리: $(t+m)\log n$.
      해시표(크기 $k$): $\frac{n}{k}(t+m)$.

  - id: b06-08
    type: multiple-choice
    prompt: 기호표를 구성하는 방법으로 이진탐색 트리가 많이 사용된다. 식별자 이름의 수=n일 때 t개의 식별자 이름 추가와 m개의 검색이 있다면, 삽입과 검색에 필요한 시간과 관련 있는 것은?
    choices:
      - { id: '1', text: '$\dfrac{(t+m)n}{2}$' }
      - { id: '2', text: '$\dfrac{(t+m)n}{4}$' }
      - { id: '3', text: '$(t+m)\log t$' }
      - { id: '4', text: '$(t+m)\log n$' }
    answers: ['4']
    explanation: |
      선택지 1: $\frac{(t+m)n}{2}$는 이름 하나에 $\frac{n}{2}$의 시간이 드는 선형 리스트 구조의 전체 시간이다.
      선택지 2: $\frac{(t+m)n}{4}$는 기호표 구성 방법 어느 것의 시간식과도 맞지 않는다.
      선택지 3: 이진탐색 트리의 탐색 깊이는 추가 횟수 $t$가 아니라 트리에 들어 있는 식별자 이름의 수 $n$에 따라 정해지므로 $\log t$가 아니다.
      선택지 4: 이진탐색 트리에서 검색에 필요한 평균 시간은 $\log n$이므로, $t$개 추가와 $m$개 검색에 필요한 시간은 $(t+m)\log n$에 비례한다.

      핵심 개념:
      이진탐색 트리는 한 번의 삽입·검색에 평균 $\log n$의 시간이 든다.
      따라서 $t$개 추가와 $m$개 검색의 전체 시간은 $(t+m)\log n$에 비례한다.
      선형 리스트는 $\frac{n}{2}(t+m)$으로 $n$이 커질수록 이진탐색 트리보다 불리하다.
      해시표는 $\frac{n}{k}(t+m)$으로 가장 효율적이다.

  - id: b06-09
    type: multiple-choice
    prompt: 기호표에서 식별자 이름의 수=n, 해시표의 크기=k일 때, t개의 식별자 이름 추가와 m개의 검색이 있다면, 전체적으로 필요한 시간은?
    choices:
      - { id: '1', text: '$\dfrac{n(t+m)}{2k}$' }
      - { id: '2', text: '$\dfrac{k(t+m)}{n}$' }
      - { id: '3', text: '$\dfrac{n(t+m)}{k}$' }
      - { id: '4', text: '$k(t+m)\log n$' }
    answers: ['3']
    explanation: |
      선택지 1: 분모에 2가 더 들어가 있어 한 번의 검색시간 $\frac{n}{k}$와 맞지 않는다.
      선택지 2: $n$과 $k$의 위치가 뒤바뀌었다. 해시표가 클수록($k$가 클수록) 시간이 줄어야 하므로 $k$는 분모에 있어야 한다.
      선택지 3: 해시표의 크기가 $k$일 때 검색에 필요한 평균 시간은 $\frac{n}{k}$이므로, 전체 시간은 $\frac{n}{k}(t+m)=\frac{n(t+m)}{k}$에 비례한다.
      선택지 4: $\log n$ 항은 이진탐색 트리의 시간식에 나타나며, 해시표의 시간식이 아니다.

      핵심 개념:
      해싱(hashing)은 식별자 이름을 해시함수로 표의 위치에 대응시킨다.
      식별자 $n$개가 크기 $k$의 해시표에 고르게 흩어지면 한 위치에 평균 $\frac{n}{k}$개가 모인다.
      따라서 한 번의 검색은 $\frac{n}{k}$, $t$개 추가와 $m$개 검색은 $\frac{n}{k}(t+m)$에 비례한다.
      해시표는 선형 리스트, 이진탐색 트리보다 효율적인 기호표 구성 방법이다.

  - id: b07-01
    type: multiple-choice
    prompt: 번역과정에서 중간언어를 사용함으로써 얻는 장점이 ==아닌== 것은?
    choices:
