      backtracking을 하는 top-down 방법은 실제 컴파일러의 구문분석 알고리즘으로 쓰기에 부적당하다.
      그래서 backtracking 없이 결정적으로 분석하는 방법이 필요하며, 이를 LL 구문분석이라 한다.
      이 조건을 만족하는 문법을 LL 문법이라 한다.
      LR 계열(SLR, CLR, LALR)은 모두 우파스를 만드는 bottom-up 방식이다.

  - id: b05-87
    type: multiple-choice
    prompt: top-down 구문분석과 ==관계없는== 것은?
    choices:
      - { id: '1', text: 'backtracking' }
      - { id: '2', text: 'left-recursion' }
      - { id: '3', text: 'right parse(우파스)' }
      - { id: '4', text: 'left-factoring' }
    answers: ['3']
    explanation: |
      선택지 1: backtracking은 top-down 구문분석에서 잘못 선택한 생성규칙을 되돌리는 과정으로, top-down의 가장 큰 문제점이다.
      선택지 2: left-recursion은 top-down 구문분석을 무한 루프에 빠뜨리므로 right-recursion으로 바꿔야 하는 top-down의 문제이다.
      선택지 3: 우파스(right parse)는 우단유도의 역순으로 환원하는 bottom-up 구문분석이 만드는 결과이다. top-down은 좌파스(left parse)를 만든다.
      선택지 4: left-factoring은 공통 접두사를 가진 생성규칙을 묶어 top-down 구문분석의 비효율을 없애는 문법 변환이다.

      핵심 개념:
      좌파스는 좌단유도에 적용한 생성규칙 번호의 순서이고 top-down 구문분석의 출력이다.
      우파스는 우단유도에 적용한 생성규칙 번호의 역순이고 bottom-up 구문분석의 출력이다.
      backtracking, left-recursion, left-factoring은 모두 top-down 구문분석을 결정적으로 만들기 위해 다루는 주제이다.
      LL의 두 번째 L이 left parse를 뜻한다.

  - id: b05-88
    type: multiple-choice
    passageRefs: [gwbd-llcond-grammar-01]
    prompt: 다음 문법이 LL 조건을 계산하는 과정이다. ==틀린== 것은?
    choices:
      - { id: '1', text: 'B → SB | ε에서 FIRST(SB) ∩ FOLLOW(B) = ∅' }
      - { id: '2', text: 'S → [eC] | ·i에서 FIRST([eC]) ∩ FIRST(·i) = ∅' }
      - { id: '3', text: 'C → eC | ε에서 FIRST(eC) ∩ FOLLOW(C) = ∅' }
      - { id: '4', text: 'LL 조건을 만족하지 못한다.' }
    answers: ['4']
    explanation: |
      선택지 1: FIRST(SB) = FIRST(S) = {[, ·}이고 FOLLOW(B) = {←}이므로 교집합은 공집합이다. 옳다.
      선택지 2: FIRST([eC]) = {[}, FIRST(·i) = {·}이므로 교집합은 공집합이다. 옳다.
      선택지 3: FIRST(eC) = {e}, FOLLOW(C) = {]}이므로 교집합은 공집합이다. 옳다.
      선택지 4: ①, ②, ③을 모두 만족하므로 이 문법은 LL 조건을 만족한다. 따라서 "만족하지 못한다"는 틀린 설명이다.

      핵심 개념:
      이 문법의 FIRST는 FIRST(A) = {i}, FIRST(B) = {[, ·, ε}, FIRST(S) = {[, ·}, FIRST(C) = {e, ε}이다.
      FOLLOW는 FOLLOW(A) = {\$}, FOLLOW(B) = {←}, FOLLOW(S) = {[, ·, ←}, FOLLOW(C) = {]}이다.
      LL 조건: A → α | β이면 FIRST(α) ∩ FIRST(β) = ∅이어야 한다.
      또 β ⟹* ε이면 FIRST(α) ∩ FOLLOW(A) = ∅이어야 한다. 모든 선택 규칙이 이를 만족하면 LL(1) 문법이다.

  # ---- 5.3.2 Predictive 구문분석 (1~2) ----
  - id: b05-89
    type: multiple-choice
    passageRefs: [gwbd-ll-grammar-01, gwbd-ll-table-01]
    prompt: 다음은 top-down 구문분석에서 predictive 파싱표를 구성하는 과정이다. FIRST(E) = {(, id}로부터 (가)와 (나)에 공통적으로 들어갈 내용은?
    choices:
      - { id: '1', text: 'E → TE′' }
      - { id: '2', text: 'E′ → +TE′' }
      - { id: '3', text: 'T → FT′' }
      - { id: '4', text: 'T′ → *FT′' }
    answers: ['1']
    explanation: |
      선택지 1: (가)는 M[E, id], (나)는 M[E, (]이다. 1) E → TE′에서 FIRST(TE′) = {(, id}이므로 두 칸 모두 E → TE′이다.
      선택지 2: E′ → +TE′는 FIRST(+TE′) = {+}이므로 M[E′, +]에 들어간다. E 행이 아니다.
      선택지 3: T → FT′는 T 행의 id, ( 칸에 들어가며 (다), (라)에 해당한다.
      선택지 4: T′ → *FT′는 M[T′, *]에 들어간다.

      핵심 개념:
      predictive 파싱표 구성 알고리즘: 각 생성규칙 A → α에 대해 a ∈ FIRST(α)이면 M[A, a] := A → α로 한다.
      α ⟹* ε이면 b ∈ FOLLOW(A)인 각 b에 대해 M[A, b] := A → α로 한다.
      E의 생성규칙은 E → TE′ 하나이므로 FIRST(TE′) = FIRST(T) = {(, id} 두 칸에 들어간다.
      파싱표의 행은 논터미널(VN), 열은 터미널과 \$ (VT)이다.

  - id: b05-90
    type: multiple-choice
    passageRefs: [gwbd-ll-grammar-01, gwbd-ll-table-01]
    prompt: 다음은 top-down 구문분석에서 predictive 파싱표를 구성하는 과정이다. FIRST(T) = {(, id}로부터 (다)와 (라)에 공통적으로 들어갈 내용은?
    choices:
      - { id: '1', text: 'E → TE′' }
      - { id: '2', text: 'E′ → +TE′' }
      - { id: '3', text: 'T → FT′' }
      - { id: '4', text: 'F → (E)' }
    answers: ['3']
    explanation: |
      선택지 1: E → TE′는 E 행에 들어가는 규칙으로 (가), (나)에 해당한다.
      선택지 2: E′ → +TE′는 M[E′, +]에 들어간다.
      선택지 3: (다)는 M[T, id], (라)는 M[T, (]이다. 4) T → FT′에서 FIRST(FT′) = FIRST(F) = {(, id}이므로 두 칸 모두 T → FT′이다.
      선택지 4: F → (E)는 F 행의 ( 칸에만 들어간다. T 행이 아니다.

      핵심 개념:
      FIRST는 초깃값에서 출발해 반복 계산한다: FIRST(E′) = {+, ε}, FIRST(T′) = {*, ε}, FIRST(F) = {(, id}.
      FIRST(T) = FIRST(FT′) = FIRST(F) = {(, id}이고 FIRST(E) = FIRST(TE′) = FIRST(T) = {(, id}이다.
      FOLLOW는 FOLLOW(E) = FOLLOW(E′) = {), \$}, FOLLOW(T) = FOLLOW(T′) = {+, ), \$}, FOLLOW(F) = {+, *, ), \$}이다.
      ε-생성규칙 E′ → ε, T′ → ε은 FOLLOW 칸에 들어가 E′ 행의 ), \$ 칸, T′ 행의 +, ), \$ 칸을 채운다.

  # ---- 5.3.2 (3~5) ----
  - id: b05-91
    type: multiple-choice
