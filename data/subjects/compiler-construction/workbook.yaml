      - { id: '4', text: 'korea' }
    answers: ['2']
    explanation: |
      선택지 1: 〈식별자〉 → 〈영문자〉{〈영숫자〉}₀⁷에서 반복을 0번 택하면 〈영문자〉 → a가 된다.
      선택지 2: 〈식별자〉는 반드시 〈영문자〉로 시작해야 하는데 7abc는 숫자로 시작하므로 생성할 수 없다.
      선택지 3: 〈영문자〉{〈영숫자〉}₀³ → 〈영문자〉〈숫자〉〈영문자〉〈숫자〉 → a 7 b 8로 생성된다.
      선택지 4: 〈영문자〉{〈영숫자〉}₀⁴ → 〈영문자〉〈영문자〉〈영문자〉〈영문자〉〈영문자〉 → k o r e a로 생성된다.

      핵심 개념:
      식별자는 영문자로 시작하고 뒤에 영숫자가 0~7개 온다.
      따라서 식별자의 길이는 1~8이다.
      {X}₀⁷은 X를 0번 이상 7번 이하 반복한다는 뜻이다.
      첫 글자가 숫자인 문자열은 식별자로 생성될 수 없다.
    tags: [ebnf, identifier]

  - id: b02-37
    type: multiple-choice
