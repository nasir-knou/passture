  # ── 4.7 Backtracking과 Left-factoring ──
  - id: b04-41
    type: multiple-choice
    passageRefs: [gwbb-lf-01]
    prompt: (가)에 알맞은 것은?
    choices:
      - { id: '1', text: '단일 생성규칙' }
      - { id: '2', text: 'backtracking' }
      - { id: '3', text: 'left-factoring' }
      - { id: '4', text: '모호성' }
    answers: ['2']
    explanation: |
      선택지 1: 단일 생성규칙은 A → B 꼴의 규칙으로, 공통 접두사 문제와 관계없다.
      선택지 2: S → iEtS | iEtSeS는 공통 접두사 iEtS를 가지므로 top-down 방식으로 구문분석하면 잘못 선택한 규칙을 되돌리는 backtracking이 발생한다.
      선택지 3: left-factoring은 문제를 해결하는 방법으로 (나)에 해당한다.
      선택지 4: 모호성은 한 문장에 유도트리가 여럿 있는 성질로, 지문에서 해결 방법으로 제시한 left-factoring이 해결하는 문제가 아니다.

      핵심 개념:
      같은 기호열로 시작하는 생성규칙이 둘 이상이면 top-down 구문분석에서 어느 규칙을 쓸지 바로 결정할 수 없다.
      잘못 고른 규칙을 되돌리고 다시 시도하는 것을 backtracking이라 한다.
      backtracking은 입력을 여러 번 다시 읽게 하여 효율을 떨어뜨린다.
      공통 접두사를 묶어 내는 left-factoring으로 backtracking을 해결한다.

  - id: b04-42
    type: multiple-choice
    passageRefs: [gwbb-lf-01]
    prompt: (나)에 알맞은 것은?
    choices:
      - { id: '1', text: '단일 생성규칙' }
