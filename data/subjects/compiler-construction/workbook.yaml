    prompt: 다음은 top-down 구문분석에서 predictive 파싱표를 구성하는 과정이다. (나)에 들어갈 내용은?
    choices:
      - { id: '1', text: 'S → iCtSS′' }
      - { id: '2', text: 'S → a' }
      - { id: '3', text: 'S′ → ε' }
      - { id: '4', text: 'C → b' }
    answers: ['1']
    explanation: |
      선택지 1: (나)는 M[S, i]이다. 1) S → iCtSS′에서 FIRST(iCtSS′) = {i}이므로 M[S, i] := S → iCtSS′이다.
      선택지 2: S → a는 M[S, a]에 들어가며 (가)에 해당한다.
      선택지 3: S′ → ε는 S′ 행의 \$, e 칸에 들어간다.
      선택지 4: C → b는 C 행의 b 칸에 들어간다.

      핵심 개념:
      3) S′ → eS는 FIRST(eS) = {e}이므로 M[S′, e] := S′ → eS이다.
      4) S′ → ε는 FOLLOW(S′) = {\$, e}이므로 M[S′, \$], M[S′, e] := S′ → ε이다.
      따라서 M[S′, e]에 S′ → eS와 S′ → ε 두 규칙이 겹쳐 이 문법은 LL(1) 문법이 아니다.
      이 충돌은 dangling else 모호성에서 비롯되며, 보통 S′ → eS를 선택해 else를 가까운 if와 짝짓는다.

