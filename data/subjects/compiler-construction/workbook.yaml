      - { id: '3', text: '선언되는 변수들이 선언된 유형에 의하여 설명자가 주어지고 변수명칭과 유형설명자가 모두 같이 기호표에 들어가며 기억장소를 배정받는다.' }
      - { id: '4', text: '문법의 각 생성규칙과 그와 결합된 의미수행 코드를 구성하고 호출되면 중간코드를 만든다.' }
    answers: ['4']
    explanation: |
      선택지 1: 상수정의(constant definition) 과정의 설명이다. 상수의 이름과 정의된 값이 기호표에 보관되고 이후 기억장소와 초깃값을 갖게 되므로 의미분석에서 하는 일이다.
      선택지 2: 유형정의(type definition) 과정의 설명이다. 구성된 자료구조의 크기와 성격을 유형설명자(type descriptor)에 보관해 이후 기억장소 배정에 필요한 정보를 제공하므로 의미분석에서 하는 일이다.
      선택지 3: 변수의 유형선언(variable type declaration) 과정의 설명이다. 변수명칭과 유형설명자가 기호표에 들어가고 각 변수가 기억장소를 배정받으므로 의미분석에서 하는 일이다.
      선택지 4: 생성규칙과 결합된 의미수행 코드를 호출해 중간코드를 만드는 것은 중간코드 생성 방법 중 구문지시적 변환에 대한 설명이므로 의미분석 과정의 일로 보기 어렵다.

      핵심 개념:
      의미분석 과정의 주요 일은 상수정의, 유형정의, 변수의 유형선언, 프로시저 선언이다.
      상수정의는 상수 이름과 값을 기호표에 보관하고, 유형정의는 유형설명자를 만든다.
      변수의 유형선언은 변수명칭과 유형설명자를 기호표에 넣고 기억장소를 배정한다.
      프로시저 선언은 새 블록의 시작과 레벨(level)을 나타내고, 레이블 선언은 정수가 레이블임을 나타낸다.
      생성규칙과 의미수행 코드를 결합해 중간코드를 만드는 것은 구문지시적 변환이다.

