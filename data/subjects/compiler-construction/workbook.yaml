    tags: [alphabet, formal-language]

  - id: b02-07
    type: multiple-choice
    prompt: '$T = \{a, b, c\}$가 주어졌을 때 다음 설명 중 ==틀린== 것은?'
    choices:
      - { id: '1', text: '$a^n = abc$' }
      - { id: '2', text: '$|abc| = 3$' }
      - { id: '3', text: '$T^* = \{\varepsilon, a, b, c, aa, ab, ac, \dots\}$' }
      - { id: '4', text: '$T^+ = \{a, b, c, aa, ab, ac, \dots\}$' }
    answers: ['1']
    explanation: |
      선택지 1: $a^n$은 a가 n개 나열된 문자열(aa…a)이다. abc가 될 수 없으므로 틀린 설명이다.
      선택지 2: |abc|는 문자열 abc의 길이로, 기호가 3개이므로 3이다.
      선택지 3: $T^*$는 공문자열 ε을 포함한 모든 문자열의 집합이므로 맞는 표현이다.
      선택지 4: $T^+$는 $T^*$에서 ε을 뺀 집합이므로 맞는 표현이다.

      핵심 개념:
      $a^n$: a를 n번 이어 붙인 문자열이며 $a^0 = \varepsilon$이다.
      |w|: 문자열 w의 길이(기호의 개수)이다.
      $T^*$: ε을 포함한 모든 문자열의 집합이다.
      $T^+$: ε을 제외한 모든 문자열의 집합이다.
    tags: [string, kleene-closure]

  - id: b02-08
    type: multiple-choice
    prompt: '$T = \{a, b, c\}$가 주어졌을 때 다음 설명 중 ==틀린== 것은?'
    choices:
      - { id: '1', text: '$a^n$이란 a가 n개 나열된 문자열을 나타낸다.' }
      - { id: '2', text: '$a \cdot \varepsilon = \varepsilon \cdot a = a$ (단, ε은 공문자열)' }
      - { id: '3', text: '$T^+ = \{\varepsilon, a, b, c, aa, ab, ac, \dots\}$' }
      - { id: '4', text: 'ε, abc, $a^n b^n$, $a^*$ 등의 문자열을 생성한다.' }
    answers: ['3']
    explanation: |
      선택지 1: $a^n$은 a가 n개 나열된 문자열이므로 맞는 설명이다.
      선택지 2: 공문자열은 접속(concatenation)의 항등원이므로 $a \cdot \varepsilon = \varepsilon \cdot a = a$가 성립한다.
      선택지 3: ε은 $T^* = \{\varepsilon, a, b, c, aa, ab, ac, \dots\}$에 포함되는 원소이다. $T^+$에는 ε이 없어야 하므로 틀린 설명이다.
      선택지 4: ε, abc, $a^n b^n$, $a^*$는 모두 T의 기호로 만들 수 있는 문자열(집합)이므로 맞는 설명이다.

      핵심 개념:
      공문자열 ε은 어떤 문자열과 접속해도 그 문자열을 바꾸지 않는다.
      $T^+ = T^* - \{\varepsilon\}$이다.
      $T^+$에 ε을 넣은 선택지는 틀린 표현이다.
      $T^* = T^+ \cup \{\varepsilon\}$로 나타낼 수 있다.
    tags: [string, positive-closure]

  - id: b02-09
    type: multiple-choice
    passageRefs: [gwba-derive-blank-01]
    prompt: 다음은 형식문법과 관련된 설명이다. 빈칸에 적당한 것은?
    choices:
      - { id: '1', text: '유도, reduce' }
      - { id: '2', text: '실행, 유도' }
      - { id: '3', text: 'compile, parse' }
      - { id: '4', text: 'parse, scan' }
    answers: ['1']
    explanation: |
      선택지 1: $\alpha_1 \overset{*}{\Longrightarrow} \alpha_n$에서 $\alpha_1$은 $\alpha_n$을 생성 혹은 유도(derive)한다고 하고, $\alpha_n$은 $\alpha_1$으로 reduce된다고 한다.
      선택지 2: 실행은 형식문법의 용어가 아니며, 두 번째 칸은 유도의 반대 방향인 reduce가 들어가야 한다.
      선택지 3: compile은 번역 전체를 뜻하고 parse는 구문분석을 뜻하므로 유도 관계를 나타내는 용어가 아니다.
      선택지 4: parse와 scan은 각각 구문분석과 어휘분석을 가리키는 용어이다.

      핵심 개념:
      유도(derive)는 생성규칙을 적용해 문자열을 바꾸어 나가는 것이다.
      reduce는 유도의 역방향으로, 생성규칙 오른쪽 부분을 왼쪽 비단말로 대체하는 것이다.
      S ⇒ αAw ⇒ αβw에서 문장형태 αβw의 β를 A로 대체하는 것이 reduce이다.
      reduce는 bottom-up 구문분석에서 사용한다.
    tags: [derivation, reduce]

  - id: b02-10
    type: multiple-choice
    prompt: 다음 용어에 대한 설명 중 옳지 ==않은== 것은?
    choices:
      - { id: '1', text: '직접유도(directly derive)란 한 문자열에서 생성규칙을 한 번 이상 적용해서 다른 문자열로 바뀌는 것을 나타낸다.' }
      - { id: '2', text: '$\alpha_1 \Longrightarrow \alpha_2 \Longrightarrow \cdots \alpha_n$이 존재한다면, $\alpha_1 \overset{*}{\Longrightarrow} \alpha_n$으로 쓰며, $\alpha_1$은 $\alpha_n$을 생성(produce) 혹은 유도(derive)한다고 하고 $\alpha_n$은 $\alpha_1$으로 reduce된다고 한다.' }
      - { id: '3', text: '$S \overset{*}{\Longrightarrow} w$이고 w가 $V^*$에 속하면 w를 문장형태(sentential form)라 하고, w가 $V_T^*$에 속할 경우, w를 문장(sentence)이라 한다.' }
      - { id: '4', text: '생성규칙의 형태에 가해지는 제한에 따라 미국의 영문학자 촘스키(Chomsky)는 형식문법을 4종류로 나누었으며, 이를 촘스키 계층구조(Chomsky hierarchy)라고 부른다.' }
    answers: ['1']
    explanation: |
      선택지 1: 직접유도는 생성규칙을 한 번 적용한 것이다. 한 번 이상이라고 했으므로 틀린 설명이다.
      선택지 2: 여러 번의 직접유도가 이어지면 $\overset{*}{\Longrightarrow}$로 쓰고, 앞의 문자열이 뒤의 문자열을 유도하며 뒤의 문자열은 앞의 문자열로 reduce된다고 하므로 맞는 설명이다.
      선택지 3: 시작기호에서 유도된 문자열 중 비단말을 포함할 수 있으면 문장형태, 터미널만으로 이루어지면 문장이므로 맞는 설명이다.
      선택지 4: 촘스키는 생성규칙 형태의 제한에 따라 형식문법을 4종류로 나누었고 이를 촘스키 계층구조라 하므로 맞는 설명이다.

      핵심 개념:
      ⇒ 는 생성규칙을 한 번 적용한 직접유도이다.
      $\overset{*}{\Longrightarrow}$는 0번 이상, $\overset{+}{\Longrightarrow}$는 1번 이상의 유도이다.
      문장형태는 $V^*$, 문장은 $V_T^*$에 속하는 유도 결과이다.
      촘스키 계층구조는 type 0 ~ type 3의 4종류로 나뉜다.
    tags: [derivation, sentential-form, chomsky-hierarchy]

  - id: b02-11
    type: multiple-choice
    passageRefs: [gwba-chomsky-g1-01]
    prompt: 다음 문법을 촘스키 계층구조(Chomsky hierarchy)로 분류하면?
    choices:
      - { id: '1', text: 'type 0' }
      - { id: '2', text: 'type 1' }
      - { id: '3', text: 'type 2' }
      - { id: '4', text: 'type 3' }
    answers: ['3']
    explanation: |
      선택지 1: type 0(무제약 문법)은 생성규칙 형태에 제한이 없는 문법으로, 이 문법은 더 강한 제한을 만족한다.
      선택지 2: type 1(문맥의존 문법)은 문맥을 가진 규칙을 허용하는데, 이 문법의 왼쪽은 모두 단일 논터미널이므로 더 좁은 type 2로 분류한다.
      선택지 3: 모든 생성규칙의 왼쪽이 하나의 논터미널이므로 type 2 CFG(Context-Free Grammar)이다.
      선택지 4: type 3(정규문법)은 오른쪽이 tB, t(우선형) 또는 Bt, t(좌선형) 형태여야 하는데, A → aCa, C → bBb는 논터미널 양쪽에 터미널이 있어 정규문법이 아니다.

      핵심 개념:
      type 0: 무제약(위축형) 문법, type 1: 문맥의존(비위축형) 문법.
      type 2: 문맥자유 문법으로, 왼쪽이 하나의 논터미널이다.
      type 3: 정규문법으로, 오른쪽이 우선형 또는 좌선형이다.
      분류는 모든 생성규칙이 만족하는 가장 제한된 type으로 한다.
    tags: [chomsky-hierarchy, context-free-grammar]

  - id: b02-12
    type: multiple-choice
    passageRefs: [gwba-grammar-v0v1-01]
    prompt: 다음 생성규칙의 문법은 문법의 유형에서 어느 type에 속하는가?
    choices:
      - { id: '1', text: 'type 0' }
      - { id: '2', text: 'type 1' }
      - { id: '3', text: 'type 2' }
      - { id: '4', text: 'type 3' }
    answers: ['4']
    explanation: |
      선택지 1: type 0은 제약이 없는 문법으로, 이 문법은 훨씬 강한 제약을 만족한다.
      선택지 2: type 1은 문맥의존 문법으로, 이 문법은 더 좁은 type 3에 속한다.
      선택지 3: 왼쪽이 모두 하나의 논터미널이므로 type 2도 만족하지만, 오른쪽이 우선형이므로 더 제한된 type 3으로 분류한다.
      선택지 4: V0 → aV1, V1 → bV0, V1 → a는 모두 A → tB 또는 A → t 형태이므로 type 3의 우선형(right-linear) 문법이다.

      핵심 개념:
      type 3 문법을 정규문법(regular grammar)이라 한다.
      A → tB, A → t 형태(t ∈ $V_T^*$, A, B ∈ $V_N$)이면 우선형(right-linear) 문법이다.
      A → Bt, A → t 형태이면 좌선형(left-linear) 문법이다.
      우선형과 좌선형을 한 문법에 섞으면 정규문법이 아니다.
    tags: [chomsky-hierarchy, regular-grammar]

  - id: b02-13
    type: multiple-choice
    passageRefs: [gwba-grammar-v0v1-01]
    prompt: 다음 생성규칙으로 생성될 수 ==없는== 것은?
    choices:
      - { id: '1', text: 'aa' }
      - { id: '2', text: 'aba' }
      - { id: '3', text: 'abaa' }
      - { id: '4', text: 'ababaa' }
    answers: ['2']
    explanation: |
      선택지 1: V0 ⇒ aV1 ⇒ aa로 생성된다.
      선택지 2: 정규표현 방정식으로 풀면 V0 = a(bV0 + a) = abV0 + aa = (ab)*aa이다. aba는 끝이 aa가 아니므로 생성되지 않는다.
      선택지 3: abaa = (ab)¹aa이므로 V0 ⇒ aV1 ⇒ abV0 ⇒ abaV1 ⇒ abaa로 생성된다.
      선택지 4: ababaa = (ab)²aa이므로 생성된다.

      핵심 개념:
      정규문법은 정규표현 방정식으로 바꿔 언어를 구할 수 있다.
      V0 = aV1, V1 = bV0 + a를 대입하면 V0 = abV0 + aa이다.
      X = αX + β의 해는 X = α*β이므로 V0 = (ab)*aa이다.
      생성되는 문자열은 ab를 0번 이상 반복한 뒤 aa로 끝난다.
    tags: [regular-grammar, regular-expression]

