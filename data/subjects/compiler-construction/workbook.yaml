  - id: b02-29
    type: multiple-choice
    passageRefs: [gwba-grammar-1a-0-01]
    prompt: 문법 G가 생성할 수 ==없는== 것은?
    choices:
      - { id: '1', text: '0' }
      - { id: '2', text: '01' }
      - { id: '3', text: '101' }
      - { id: '4', text: '1001' }
    answers: ['2']
    explanation: |
      선택지 1: 0은 S → 0으로 생성된다.
      선택지 2: 0으로 시작하는 문자열은 S → 0뿐이어서 0 뒤에 다른 기호가 올 수 없다. 따라서 01은 생성할 수 없다.
      선택지 3: 101은 S → 1A → 10A → 101로 생성된다.
      선택지 4: 1001은 S → 1A → 10A → 100A → 1001로 생성된다.

      핵심 개념:
      L(G) = 10*1 + 0이다.
      0은 단독으로만 생성된다.
      1로 시작하는 문자열은 가운데 0을 0개 이상 가진 뒤 1로 끝난다.
      생성 불가를 보일 때는 가능한 첫 규칙을 모두 따져 본다.
    tags: [derivation, regular-grammar]

  - id: b02-30
    type: multiple-choice
    passageRefs: [gwba-grammar-1a-0-01]
    prompt: 문법 G가 생성하는 언어를 정규표현으로 표현한 것은?
    choices:
      - { id: '1', text: '$1^*01$' }
      - { id: '2', text: '$1^*010$' }
      - { id: '3', text: '$1^*01+1$' }
      - { id: '4', text: '$10^*1+0$' }
    answers: ['4']
    explanation: |
      선택지 1: $1^*01$은 0 하나를 포함하고 1로 끝나는 문자열인데, 문법은 1 다음에 0을 여러 개 허용하고 단독 0도 생성한다.
      선택지 2: $1^*010$은 0으로 끝나는 긴 문자열을 포함하므로 L(G)와 다르다.
      선택지 3: $1^*01+1$은 단독 1을 포함하는데 문법은 1을 단독으로 생성하지 않는다.
      선택지 4: S = 1A + 0, A = 0A + 1에서 A = 0*1이고, 이를 대입하면 S = 1A + 0 = $10^*1+0$이다.

      핵심 개념:
      S → 1A | 0은 S = 1A + 0으로 바꾼다.
      A = 0A + 1 ⟹ A = 0*1.
      대입하면 S = 10*1 + 0.
      선택(|)은 정규표현의 +(합집합)에 대응한다.
    tags: [regular-expression, regular-grammar]

  - id: b02-31
    type: multiple-choice
    prompt: 문법의 표기법에서 그림으로 표현하는 것은?
    choices:
      - { id: '1', text: '정규표현' }
      - { id: '2', text: 'BNF' }
      - { id: '3', text: 'EBNF' }
      - { id: '4', text: '문법도표' }
    answers: ['4']
    explanation: |
      선택지 1: 정규표현은 ε, φ, 터미널 기호와 접속·합집합·반복 연산을 이용한 식으로 표현한다.
      선택지 2: BNF(Backus-Naur Form)는 〈 〉, ::=, | 같은 메타기호로 생성규칙을 글로 표현한다.
      선택지 3: EBNF(Extended BNF)는 BNF에 반복 { }, 선택 [ ] 등의 기호를 더한 텍스트 표기법이다.
      선택지 4: 문법도표는 초보자가 쉽게 이해할 수 있도록 문법을 도식화하는 방법으로, 사각형과 타원 그리고 이들 사이를 연결한 지시선으로 이루어져 있다.

      핵심 개념:
      문법 표기법에는 정규표현, 문법도표, BNF, EBNF가 있다.
      문법도표(syntax diagram)에서 사각형은 논터미널, 타원(원)은 터미널을 나타낸다.
      지시선을 따라가며 읽으면 생성되는 문자열을 알 수 있다.
      그림으로 표현하는 것은 문법도표뿐이다.
    tags: [syntax-diagram, bnf]

  - id: b02-32
    type: multiple-choice
    passageRefs: [gwba-syntax-diagram-01]
    prompt: 다음 문법도표로 생성할 수 ==없는== 문자열은?
    choices:
      - { id: '1', text: 'aa' }
      - { id: '2', text: 'abaa' }
      - { id: '3', text: 'aabaa' }
      - { id: '4', text: 'ababaa' }
    answers: ['3']
    explanation: |
      선택지 1: 반복 경로를 한 번도 거치지 않고 a, a를 지나면 aa가 생성된다.
      선택지 2: 반복 경로에서 a, b를 한 번 지난 뒤 a, a를 지나면 abaa가 생성된다(ab 반복).
      선택지 3: 문법도표가 만드는 문자열은 (ab)*aa 형태인데, aabaa는 ab 반복 없이 aa로 시작한 뒤 다시 b가 나오므로 생성할 수 없다.
      선택지 4: 반복 경로를 두 번 지나면 ababaa가 생성된다.

      핵심 개념:
      문법도표는 지시선을 따라 원(터미널)을 지나며 문자열을 읽는다.
      되돌아가는 경로는 반복(*)을 나타낸다.
      이 도표의 언어는 (ab)*aa이다.
      분기점에서 어느 경로를 택하는지에 따라 서로 다른 문자열이 생성된다.
    tags: [syntax-diagram]

  - id: b02-33
    type: multiple-choice
    passageRefs: [gwba-bnf-integer-01]
    prompt: 다음의 생성규칙(production rule)에 대한 설명 중 올바른 것은?
    choices:
      - { id: '1', text: '절대정수로 11, 45, 112, 2315 등이 허용된다.' }
      - { id: '2', text: '절대정수로 0을 포함하는 모든 수를 의미한다.' }
      - { id: '3', text: '절대정수로 1을 포함하는 모든 수를 의미한다.' }
      - { id: '4', text: '절대정수로 1, 5, 9, 10, 13 등이 허용된다.' }
    answers: ['1']
    explanation: |
      선택지 1: 〈절대정수〉 ::= 〈숫자〉 | 〈절대정수〉〈숫자〉이므로 0~5 숫자를 1개 이상 이어 붙인 수가 허용된다. 11, 45, 112, 2315는 모두 0~5로만 이루어져 있다.
      선택지 2: 〈숫자〉가 0~5뿐이므로 6~9를 포함하는 수는 만들 수 없어 모든 수를 의미하지 않는다.
      선택지 3: 같은 이유로 1을 포함하더라도 6~9가 들어간 수는 만들 수 없다.
      선택지 4: 9는 〈숫자〉에 없으므로 허용되지 않는다.

      핵심 개념:
      BNF에서 논터미널 기호는 ‘〈 〉’로 표기한다.
      대체(replacement)는 ‘::=’, 양자택일은 ‘|’로 나타낸다.
      〈절대정수〉〈숫자〉처럼 자기 자신을 다시 쓰면 반복을 표현할 수 있다.
      생성 가능한 기호의 범위는 〈숫자〉의 정의(0~5)로 제한된다.
    tags: [bnf]

  - id: b02-34
    type: multiple-choice
    passageRefs: [gwba-ebnf-ident-01]
    prompt: 이 표기법의 이름은?
    choices:
      - { id: '1', text: '정규표현' }
      - { id: '2', text: '문법도표' }
      - { id: '3', text: 'BNF' }
      - { id: '4', text: 'EBNF' }
    answers: ['4']
    explanation: |
      선택지 1: 정규표현은 +, *, 접속으로 표현하며 〈 〉나 ::= 기호를 쓰지 않는다.
      선택지 2: 문법도표는 사각형, 타원, 지시선으로 그린 그림이다.
      선택지 3: BNF는 〈 〉, ::=, | 를 쓰지만 반복을 나타내는 { } 기호가 없다.
      선택지 4: 반복 부분을 ‘{ }’로 표시하고 반복 횟수를 위아래 첨자로 붙였으므로 EBNF(Extended BNF) 표기법이다.

      핵심 개념:
      EBNF는 BNF에서 표현하기 어려운 단점을 보강한 표기법이다.
      { }는 0번 이상 반복, [ ]는 생략 가능(선택)을 나타낸다.
      $\{\ \}_0^7$처럼 반복 횟수의 하한과 상한을 표시할 수 있다.
      BNF 메타기호: 〈 〉(논터미널), ::=(대체), |(양자택일).
    tags: [ebnf, bnf]

  - id: b02-35
    type: multiple-choice
    passageRefs: [gwba-ebnf-ident-01]
    prompt: 이 문법은 어느 문법에 속하는가?
    choices:
      - { id: '1', text: '위축형 문법' }
      - { id: '2', text: '비위축형 문법' }
      - { id: '3', text: 'CFG' }
      - { id: '4', text: '정규문법' }
    answers: ['3']
    explanation: |
      선택지 1: 위축형 문법은 type 0 무제약 문법으로, 이 문법은 훨씬 제한된 형태이다.
      선택지 2: 비위축형 문법은 type 1 문맥의존 문법으로, 이 문법의 왼쪽은 모두 단일 논터미널이다.
      선택지 3: 왼쪽이 모두 하나의 논터미널 기호로 되어 있으므로 type 2 CFG이다.
      선택지 4: 〈식별자〉 ::= 〈영문자〉{〈영숫자〉}는 오른쪽이 논터미널로 시작하고 논터미널이 여러 개 이어지므로 A → tB, A → t 형태의 정규문법 규칙이 아니다.

      핵심 개념:
      CFG는 생성규칙의 왼쪽이 하나의 논터미널인 문법이다.
      BNF와 EBNF는 주로 CFG를 표기하는 데 쓰인다.
      위축형(type 0), 비위축형(type 1), CFG(type 2), 정규문법(type 3) 순으로 제약이 강해진다.
      프로그래밍 언어의 구문은 대부분 CFG로 기술한다.
    tags: [ebnf, context-free-grammar]

  - id: b02-36
