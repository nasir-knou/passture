    answers: ['2']
    explanation: |
      선택지 1: (가) {[T → F·]}는 I₀에서 F 다음으로 점을 옮긴 GOTO(I₀, F)이다.
      선택지 2: I₀에서 점 뒤가 E인 항목은 [S′ → ·E], [E → ·E+T]이다. 점을 E 뒤로 옮기면 {[S′ → E·], [E → E·+T]}가 되며, 점 뒤에 비단말이 없어 더 추가할 항목이 없다.
      선택지 3: (다) {[E → T·], [T → T·*F]}는 GOTO(I₀, T)이다.
      선택지 4: (라)는 [F → (·E)]의 closure로 GOTO(I₀, ( )이다.

      핵심 개념:
      LR(0) 항목은 생성규칙 오른쪽에 점(·)을 찍어 분석 진행 위치를 나타낸다.
      GOTO(I, X)는 I에서 점 바로 뒤가 X인 항목들의 점을 X 뒤로 옮긴 뒤 closure를 구한 집합이다.
      closure는 점 뒤의 비단말 B에 대해 [B → ·γ] 항목을 계속 추가하는 연산이다.
      I₀에서 모든 문법기호에 대해 GOTO를 반복하면 canonical collection을 얻는다.
    tags: [lr0-items, canonical-collection]

