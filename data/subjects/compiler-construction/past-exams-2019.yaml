      선택지 4: I₀의 [F → ·(E)]에서 점을 ( 뒤로 옮기면 [F → (·E)]가 되고, 점 뒤 E의 closure로 E, T, F의 모든 시작 항목이 추가된다. 따라서 (라)이다.

      핵심 개념:
      점 뒤에 비단말이 오면 closure로 그 비단말의 항목을 모두 추가해야 한다.
