      - { id: '4', text: '( ⋖ T₁, T₁ ⋖ )' }
    answers: ['2']
    explanation: |
      선택지 1: ( ⋖ T₁ 관계만 적고 오른쪽 괄호와의 관계를 빠뜨렸다.
      선택지 2: F → (E)에서 E가 E₁, 다시 T₁로 대치되면 T₁은 ( 뒤에서 새로 시작되는 기호이므로 ( ⋖ T₁, ) 앞에서 끝나는 기호이므로 T₁ ⋗ )가 된다.
      선택지 3: T₁ ⋗ ) 관계만 적고 왼쪽 괄호와의 관계를 빠뜨렸다.
      선택지 4: T₁은 ) 앞에서 먼저 환원되어야 하므로 T₁ ⋗ )이어야 하며 ⋖가 아니다.

      핵심 개념:
