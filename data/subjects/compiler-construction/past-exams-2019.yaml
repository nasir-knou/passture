      핵심 개념:
      I3 = {[C → c·C, c/d], …}은 c를 다시 읽으면 자기 자신(I3)으로 전이한다.
      그래서 c가 연속되면 상태 3이 스택에 반복해서 쌓인다.
      첫 C를 만드는 중인 상태(I3)와 두 번째 C를 만드는 중인 상태(I6)는 lookahead로 구분된다.
      현재 입력 기호와 스택 꼭대기 상태만 보고 동작을 결정한다.
    tags: [lr-parsing, clr-parsing-table]

  - id: e19-29
    type: multiple-choice
    chapter: 5
    passageRefs: [g19-clr-table-01, g19-clr-trace-01]
    prompt: ‘다’에 알맞은 것은?
    choices:
      - { id: '1', text: 'reduce 1' }
      - { id: '2', text: 'reduce 2' }
      - { id: '3', text: 'reduce 3' }
      - { id: '4', text: 'reduce 4' }
    answers: ['3']
    explanation: |
      선택지 1: reduce 1(S → CC)은 상태 5에서 입력 끝 표시를 볼 때 수행한다.
      선택지 2: reduce 2(C → cC)는 상태 8이나 9에서 수행하며, 다음 단계(5단계)에서 나온다.
      선택지 3: 스택 꼭대기가 상태 4이고 입력이 d이므로 ACTION[4, d] = r3, 즉 C → d로 환원한다. d4를 꺼내고 C를 넣어 다음 스택이 0c3c3C가 된다.
      선택지 4: 이 문법에는 4번 규칙이 없다.

      핵심 개념:
      reduce는 규칙 오른쪽 길이만큼 스택에서 기호·상태 쌍을 꺼낸다.
      C → d는 길이 1이므로 d4 하나를 꺼낸다.
      꺼낸 뒤 드러난 상태(3)와 C로 GOTO를 찾아 다음 상태를 넣는다.
      표의 4단계와 6단계가 이 GOTO 동작을 보여 준다.
    tags: [lr-parsing, reduce]

  - id: e19-30
    type: multiple-choice
    chapter: 5
    passageRefs: [g19-clr-table-01, g19-clr-trace-01]
    prompt: ‘라’에 알맞은 것은?
    choices:
      - { id: '1', text: 'goto 1' }
      - { id: '2', text: 'goto 2' }
      - { id: '3', text: 'goto 5' }
      - { id: '4', text: 'goto 8' }
    answers: ['4']
    explanation: |
      선택지 1: goto 1은 상태 0에서 S를 만났을 때의 GOTO[0, S]이다.
      선택지 2: goto 2는 상태 0에서 C를 만났을 때의 GOTO[0, C]이다.
      선택지 3: goto 5는 상태 2에서 C를 만났을 때의 GOTO[2, C]이다.
      선택지 4: 스택 0c3c3C에서 C 바로 아래 상태가 3이므로 GOTO[3, C] = 8이다. 다음 스택이 0c3c3C8인 것과 일치한다.

      핵심 개념:
      reduce 직후에는 스택에 비단말만 올라가고 상태가 없다.
      그 아래 상태와 비단말로 GOTO 표를 찾아 새 상태를 넣는다.
      같은 비단말 C라도 아래 상태에 따라 2, 5, 8, 9 등 다른 상태로 간다.
      GOTO 함수는 파싱표의 비단말 열에서 읽는다.
    tags: [lr-parsing, goto-function]

  - id: e19-31
    type: multiple-choice
    chapter: 5
    passageRefs: [g19-ll-01, g19-ll-table-01]
    prompt: 다음은 Top-Down 구문분석에서 주어진 문법에 대하여 predictive 파싱표를 구성하는 과정이다. 빈칸 ‘가’에 들어갈 내용은?
    choices:
      - { id: '1', text: 'E′ → ε' }
      - { id: '2', text: 'E → TE′' }
      - { id: '3', text: 'F → (E)' }
      - { id: '4', text: 'E′ → +TE′' }
    answers: ['1']
    explanation: |
      선택지 1: E′ → ε는 FOLLOW(E′) = { ), \$ }의 각 터미널에 넣는다. 따라서 [E′, )] = E′ → ε이다.
      선택지 2: E → TE′는 E 행의 FIRST(TE′) = { (, id } 칸에 들어간다.
      선택지 3: F → (E)는 F 행의 ( 칸에 들어간다.
      선택지 4: E′ → +TE′는 FIRST(+TE′) = {+}이므로 E′ 행의 + 칸에 들어가며 이미 표에 있다.

      핵심 개념:
      예측(predictive) 파싱표는 각 규칙 A → α에 대해 FIRST(α)의 터미널 칸에 규칙을 넣는다.
      α가 ε을 유도하면 FOLLOW(A)의 터미널(입력 끝 표시 포함) 칸에도 넣는다.
      한 칸에 규칙이 두 개 이상 들어가지 않으면 LL(1) 문법이다.
      구문분석기는 스택 꼭대기 비단말과 현재 입력으로 이 표를 찾아 규칙을 적용한다.
    tags: [predictive-parsing, ll1-parsing-table]

  - id: e19-32
    type: multiple-choice
    chapter: 5
    passageRefs: [g19-ll-01, g19-ll-table-01]
    prompt: 빈칸 ‘나’에 들어갈 내용은?
    choices:
      - { id: '1', text: 'E′ → ε' }
      - { id: '2', text: 'E → TE′' }
      - { id: '3', text: 'F → (E)' }
      - { id: '4', text: 'E′ → +TE′' }
    answers: ['1']
    explanation: |
      선택지 1: 입력 끝 표시는 FOLLOW(E′)에 속하므로 [E′, 끝 표시] 칸에도 E′ → ε를 넣는다.
      선택지 2: E → TE′는 E 행에만 들어간다.
      선택지 3: F → (E)는 F 행에만 들어간다.
      선택지 4: E′ → +TE′는 + 칸에만 들어간다.

      핵심 개념:
      ε-규칙은 FIRST가 아니라 FOLLOW를 기준으로 파싱표에 넣는다.
      E′는 식의 끝에서 사라져야 하므로 ) 와 입력 끝 표시에서 E′ → ε를 적용한다.
      T′ → ε도 같은 원리로 FOLLOW(T′) = { +, ), \$ } 칸에 들어간다.
      FIRST와 FOLLOW를 정확히 구하는 것이 LL(1) 파싱표 구성의 핵심이다.
    tags: [predictive-parsing, ll1-parsing-table]

  - id: e19-33
    type: multiple-choice
    chapter: 5
    passageRefs: [g19-yacc-01]
    prompt: Bell 연구소에서 Stephen C. Johnson을 중심으로 개발된 LALR(1) 구문분석기 생성기로 아래 그림 ‘가’에 적당한 것은?
    choices:
      - { id: '1', text: 'Lex' }
      - { id: '2', text: 'Scan gen' }
      - { id: '3', text: 'YACC' }
      - { id: '4', text: 'FLEX' }
    answers: ['3']
    explanation: |
      선택지 1: Lex는 정규표현으로 기술한 토큰 규칙에서 어휘분석기를 만드는 어휘분석기 생성기이다.
      선택지 2: Scan gen은 스캐너(어휘분석기)를 생성하는 도구로 구문분석기 생성기가 아니다.
      선택지 3: YACC(Yet Another Compiler-Compiler)은 Bell 연구소의 Stephen C. Johnson이 만든 LALR(1)(Look-Ahead LR) 구문분석기 생성기로, 문법규칙과 수행코드를 입력받아 구문분석기를 만든다.
      선택지 4: FLEX(Fast Lexical analyzer generator)는 Lex를 개선한 어휘분석기 생성기이다.

      핵심 개념:
      YACC은 문법규칙과 각 규칙의 수행코드(semantic action)를 입력으로 받는다.
      출력은 LALR(1) 파싱표를 이용하는 구문분석기(C 프로그램)이다.
      어휘분석기(Lex/FLEX 생성)가 넘겨주는 토큰을 받아 구문분석하고 수행코드를 실행한다.
      GNU 계열의 호환 도구가 Bison이다.
    tags: [yacc, parser-generator]

  - id: e19-34
    type: multiple-choice
    chapter: 6
    prompt: 다음 기호표의 내용 중 기억장치에서 식별자의 정확한 위치를 나타내는 것은?
    choices:
      - { id: '1', text: '유형' }
      - { id: '2', text: '매개변수' }
      - { id: '3', text: '오프셋' }
      - { id: '4', text: '차원수' }
    answers: ['3']
    explanation: |
      선택지 1: 유형(type)은 정수, 실수 같은 식별자의 자료형으로, 위치 정보가 아니다.
      선택지 2: 매개변수는 프로시저·함수의 인자 개수와 종류에 대한 정보이다.
      선택지 3: 오프셋(offset)은 데이터 영역의 기준 주소로부터 식별자가 떨어진 거리로, 기억장치에서 식별자의 정확한 위치를 나타낸다.
      선택지 4: 차원수는 배열의 차원 정보로, 배열 원소 주소 계산에 쓰이지만 식별자 자체의 위치는 아니다.

      핵심 개념:
      기호표(symbol table)는 식별자의 이름과 속성을 저장하는 자료구조이다.
      주요 속성으로 이름, 유형, 종류(변수·상수·함수), 레벨, 오프셋, 차원수, 매개변수 정보가 있다.
      레벨은 블록 중첩 깊이, 오프셋은 그 영역 안의 상대 위치를 나타낸다.
      기호표 정보는 의미분석과 목적코드 생성에서 사용된다.
    tags: [symbol-table, offset]

  - id: e19-35
    type: multiple-choice
    chapter: 7
    passageRefs: [g19-quad-01]
    prompt: 다음은 A := -B * (C + D)를 3 주소 코드로 표현한 것이다. 이 방법의 이름은?
    choices:
      - { id: '1', text: '후위표현' }
      - { id: '2', text: 'triple 표현' }
      - { id: '3', text: '간접 triple 표현' }
      - { id: '4', text: 'quadruple 표현' }
    answers: ['4']
    explanation: |
      선택지 1: 후위표현은 B uminus C D + * A := 처럼 연산자를 피연산자 뒤에 나열하는 방식으로 표 형태가 아니다.
      선택지 2: triple 표현은 (op, 피연산자 1, 피연산자 2)의 세 필드만 쓰고 결과는 명령어 번호로 참조한다.
      선택지 3: 간접 triple 표현은 triple 목록을 가리키는 포인터 배열을 두어 명령 순서를 바꾸기 쉽게 한 방식이다.
      선택지 4: op, 피연산자 1, 피연산자 2, 결과(T₁, T₂, T₃, A)의 네 필드를 가지므로 quadruple 표현이다.

      핵심 개념:
      3 주소 코드는 연산자 하나와 최대 세 개의 주소(피연산자 2개, 결과 1개)로 이루어진 중간코드이다.
      quadruple은 결과를 임시변수 이름으로 명시하는 4필드 구조이다.
      triple은 결과 필드 없이 명령 번호로 중간 결과를 참조한다.
      간접 triple은 triple을 재배치해야 하는 코드 최적화에 유리하다.
    tags: [three-address-code, quadruple]
