      같은 생성규칙 오른쪽에서 이웃한 두 기호는 ≐ 관계이다.
      X ≐ A이고 A가 Y…로 시작하는 문자열을 유도하면 X ⋖ Y이다.
      A ≐ X이고 A가 …Y로 끝나는 문자열을 유도하면 Y ⋗ X이다.
