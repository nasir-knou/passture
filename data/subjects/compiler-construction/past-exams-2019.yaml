questions:
  - id: e19-01
    type: multiple-choice
    chapter: 4
    prompt: 다음 중 프로그램 문장 전체를 표현하는 것으로 구문분석과 관련 있는 언어는?
    choices:
      - { id: '1', text: '위축형 문법' }
      - { id: '2', text: '비위축형 문법' }
      - { id: '3', text: 'Context-Free 문법' }
      - { id: '4', text: '정규문법' }
    answers: ['3']
    explanation: |
      선택지 1: 위축형 문법은 생성규칙 적용 중 문장형 길이가 줄어들 수 있는 0형(무제약) 문법으로, 인식에 튜링 기계가 필요해 구문분석기 구현에 쓰지 않는다.
      선택지 2: 비위축형 문법은 1형 문맥의존(Context-Sensitive) 문법으로 표현력은 크지만 효율적인 구문분석기를 만들기 어렵다.
      선택지 3: Context-Free 문법은 if-then-else나 블록처럼 문장 전체의 중첩 구조를 표현하며 푸시다운 오토마타로 인식되므로 구문분석의 기반이 된다.
      선택지 4: 정규문법은 식별자, 상수 같은 단어(토큰)를 표현하는 데 쓰이며 구문분석이 아니라 어휘분석과 관련된다.

      핵심 개념:
      촘스키 계층은 0형(무제약) ⊃ 1형(문맥의존) ⊃ 2형(Context-Free) ⊃ 3형(정규) 순으로 표현 범위가 좁아진다.
      컴파일러에서 정규문법은 어휘분석, Context-Free 문법은 구문분석에 사용한다.
      Context-Free 언어는 푸시다운 오토마타, 정규언어는 유한 오토마타가 인식한다.
      프로그램 문장 전체의 구조는 Context-Free 문법으로 표현한다.
    tags: [chomsky-hierarchy, context-free-grammar]

  - id: e19-02
    type: multiple-choice
    chapter: 4
    passageRefs: [g19-grammar-01]
    prompt: 다음은 ababa를 좌단유도하는 과정이다. ==관계없는== 것은?
    choices:
      - { id: '1', text: 'aAS' }
      - { id: '2', text: 'abS' }
      - { id: '3', text: 'abaAS' }
      - { id: '4', text: 'aSbAS' }
    answers: ['4']
    explanation: |
      선택지 1: 시작기호 S에 S → aAS를 적용한 첫 문장형이므로 좌단유도 과정에 포함된다.
      선택지 2: aAS의 가장 왼쪽 비단말 A에 A → b를 적용한 문장형이므로 포함된다.
      선택지 3: abS의 가장 왼쪽 비단말 S에 S → aAS를 적용한 문장형이므로 포함된다.
      선택지 4: aSbAS는 A → SbA를 적용해야 나오는데, 이후 S가 a로 시작하므로 aa…가 되어 ababa를 만들 수 없다. 따라서 좌단유도 과정과 관계없다.

      핵심 개념:
      좌단유도(leftmost derivation)는 매 단계에서 가장 왼쪽 비단말을 대치하는 유도이다.
      ababa의 좌단유도는 S ⇒ aAS ⇒ abS ⇒ abaAS ⇒ ababS ⇒ ababa 이다.
      선택지의 문장형이 이 순서 안에 나타나는지 확인하면 된다.
      다른 규칙을 적용한 문장형은 목표 문장의 접두사와 맞지 않으면 유도 과정에 포함되지 않는다.
    tags: [leftmost-derivation]

  - id: e19-03
    type: multiple-choice
    chapter: 4
    passageRefs: [g19-grammar-01]
    prompt: 다음은 ababa를 우단유도하는 과정이다. ==관계없는== 것은?
    choices:
      - { id: '1', text: 'aAS' }
      - { id: '2', text: 'aAa' }
      - { id: '3', text: 'aAaAS' }
      - { id: '4', text: 'aAaba' }
    answers: ['2']
    explanation: |
      선택지 1: 시작기호 S에 S → aAS를 적용한 첫 문장형이므로 우단유도 과정에 포함된다.
      선택지 2: aAa는 오른쪽 S에 S → a를 바로 적용한 것인데, 이 경우 A가 bab를 유도해야 한다. A → SbA, A → SS, A → b 중 어느 것으로도 bab를 만들 수 없으므로 관계없다.
      선택지 3: aAS의 가장 오른쪽 비단말 S에 S → aAS를 적용한 문장형이므로 포함된다.
      선택지 4: aAaAa에서 가장 오른쪽 A에 A → b를 적용한 문장형이므로 포함된다.

      핵심 개념:
      우단유도(rightmost derivation)는 매 단계에서 가장 오른쪽 비단말을 대치하는 유도이다.
      ababa의 우단유도는 S ⇒ aAS ⇒ aAaAS ⇒ aAaAa ⇒ aAaba ⇒ ababa 이다.
      같은 문장이라도 좌단유도와 우단유도의 중간 문장형은 서로 다르다.
      우단유도의 역순이 상향식(Bottom-up) 구문분석의 환원 순서가 된다.
    tags: [rightmost-derivation]

  - id: e19-04
    type: multiple-choice
    chapter: 5
    passageRefs: [g19-grammar-01]
    prompt: First(A)는?
    choices:
      - { id: '1', text: 'a' }
      - { id: '2', text: 'a, b' }
      - { id: '3', text: 'a, b, ε' }
      - { id: '4', text: 'a, b, \$' }
    answers: ['2']
    explanation: |
      선택지 1: A → SbA, A → SS에서 First(S) = {a}가 들어가지만 A → b의 b가 빠져 있다.
      선택지 2: A → SbA와 A → SS에서 First(S) = {a}, A → b에서 b를 얻으므로 First(A) = {a, b}이다.
      선택지 3: A나 S에는 ε-생성규칙이 없으므로 ε은 First(A)에 포함되지 않는다.
      선택지 4: 입력 끝 표시(\$)는 FOLLOW 집합에만 들어가며 FIRST 집합의 원소가 아니다.

      핵심 개념:
      FIRST(X)는 X로부터 유도되는 문자열의 첫 터미널 기호들의 집합이다.
      생성규칙 오른쪽이 비단말로 시작하면 그 비단말의 FIRST를 포함한다.
      ε은 X가 빈 문자열을 유도할 수 있을 때만 FIRST에 넣는다.
      FIRST와 FOLLOW는 예측(predictive) 구문분석표와 SLR(Simple LR) 파싱표 구성에 사용한다.
    tags: [first-set]

  - id: e19-05
    type: multiple-choice
    chapter: 5
    passageRefs: [g19-grammar-01]
    prompt: Follow(A)는?
    choices:
      - { id: '1', text: 'a' }
      - { id: '2', text: 'a, b' }
      - { id: '3', text: 'a, b, \$' }
      - { id: '4', text: 'ε, a, b, \$' }
    answers: ['1']
    explanation: |
      선택지 1: S → aAS에서 A 뒤에 S가 오므로 First(S) = {a}가 Follow(A)에 들어간다. A → SbA는 A가 끝에 있어 Follow(A) 자신을 더할 뿐이므로 Follow(A) = {a}이다.
      선택지 2: b는 A → SbA에서 S 뒤에 오는 기호이므로 Follow(S)에 들어가며 Follow(A)와는 관계없다.
      선택지 3: 입력 끝 표시(\$)는 A가 시작기호 S의 오른쪽 끝에 올 때 들어가는데, S → aAS에서 A 뒤에는 항상 S가 온다.
      선택지 4: ε은 FOLLOW 집합에 들어가지 않는다.

      핵심 개념:
      FOLLOW(A)는 문장형에서 A 바로 뒤에 나타날 수 있는 터미널의 집합이다.
      B → αAβ이면 FIRST(β)에서 ε을 뺀 것을 FOLLOW(A)에 넣는다.
      B → αA이거나 β가 ε을 유도하면 FOLLOW(B)를 FOLLOW(A)에 넣는다.
      시작기호의 FOLLOW에는 입력 끝 표시(\$)를 넣는다.
    tags: [follow-set]

  - id: e19-06
    type: multiple-choice
    chapter: 4
    passageRefs: [g19-ambiguous-01]
    prompt: 다음은 모호한 문법이다. 이 문법을 모호하지 ==않은== 문법으로 변환하는 방법은?
    choices:
      - { id: '1', text: '불필요한 생성규칙 제거' }
      - { id: '2', text: 'ε-생성규칙의 제거' }
      - { id: '3', text: 'left factoring' }
      - { id: '4', text: '연산자 우선순위 또는 결합법칙 적용' }
    answers: ['4']
    explanation: |
      선택지 1: 불필요한 생성규칙 제거는 도달할 수 없거나 터미널 문자열을 만들지 못하는 규칙을 없애는 것으로, 유도트리가 여러 개 생기는 문제는 해결하지 못한다.
      선택지 2: ε-생성규칙 제거는 A → ε 형태를 없애는 변환인데, 이 문법에는 ε-생성규칙이 없고 모호성과도 관계없다.
      선택지 3: left factoring은 공통 접두사를 가진 규칙을 묶어 선택을 결정적으로 만드는 변환으로, 모호성을 없애지 않는다.
      선택지 4: *가 +보다 먼저 결합하도록 우선순위를 두고 같은 연산자는 왼쪽 결합으로 정하면 E → E + T | T, T → T * F | F, F → id처럼 모호하지 않은 문법이 된다.

      핵심 개념:
      모호한 문법은 한 문장에 대해 두 개 이상의 유도트리(또는 좌단유도)가 존재하는 문법이다.
      E → E + E | E * E | id에서 id + id * id는 두 가지 유도트리를 가진다.
      연산자 우선순위와 결합법칙을 반영해 비단말을 계층화하면 모호성을 없앨 수 있다.
      모호성 제거는 불필요 규칙·ε 규칙 제거 같은 문법 정리와는 다른 문제이다.
    tags: [ambiguity, operator-precedence]

  - id: e19-07
    type: multiple-choice
    chapter: 4
    passageRefs: [g19-reachable-01]
    prompt: 다음 문법규칙에서 시작기호로부터 도달 불가능한 기호를 갖는 생성규칙은?
    choices:
      - { id: '1', text: 'S → A | C' }
      - { id: '2', text: 'A → aS' }
      - { id: '3', text: 'B → b' }
      - { id: '4', text: 'C → c' }
    answers: ['3']
    explanation: |
      선택지 1: 시작기호 S의 생성규칙이므로 당연히 도달 가능하다.
      선택지 2: S → A로 A에 도달할 수 있으므로 A → aS는 도달 가능한 규칙이다.
      선택지 3: 어떤 생성규칙의 오른쪽에도 B가 나타나지 않으므로 S에서 B에 도달할 수 없다. B → b는 불필요한 생성규칙이다.
      선택지 4: S → C로 C에 도달할 수 있으므로 C → c는 도달 가능한 규칙이다.

      핵심 개념:
      불필요한 생성규칙에는 도달 불가능한(unreachable) 기호를 가진 규칙과 터미널 문자열을 만들지 못하는(non-terminating) 기호를 가진 규칙이 있다.
      도달 가능성은 시작기호에서 출발해 오른쪽에 나타나는 기호를 차례로 표시해 판정한다.
      표시되지 않은 기호의 생성규칙은 제거해도 언어가 바뀌지 않는다.
      불필요한 규칙 제거는 문법을 효율화하는 기본 단계이다.
    tags: [useless-production, unreachable-symbol]

  - id: e19-08
    type: multiple-choice
    chapter: 4
    passageRefs: [g19-unit-01]
    prompt: 다음 문법을 단일생성 규칙을 갖지 않는 문법으로 변환하려 한다. 빈칸에 들어갈 내용으로 ==틀린== 것은?
    choices:
      - { id: '1', text: 'E + T' }
      - { id: '2', text: 'T' }
      - { id: '3', text: '(E)' }
      - { id: '4', text: 'a' }
    answers: ['2']
    explanation: |
      선택지 1: E → E + T는 단일 생성규칙이 아니므로 그대로 남는다.
      선택지 2: E → T는 오른쪽이 비단말 하나뿐인 단일 생성규칙이므로 변환 후에는 남아 있으면 안 된다. 빈칸에 들어갈 수 없다.
      선택지 3: E → T, T → F, F → (E)를 이어 붙이면 E → (E)가 된다.
      선택지 4: E → T, T → F, F → a를 이어 붙이면 E → a가 된다.

      핵심 개념:
      단일 생성규칙(unit production)은 A → B처럼 오른쪽이 비단말 하나인 규칙이다.
      A → B가 있으면 B의 단일이 아닌 규칙 B → α를 A → α로 옮기고 A → B를 지운다.
      이 문법에서 E는 T와 F를 거쳐 T * F, (E), a를 직접 유도하도록 바뀐다.
      결과는 E → E + T | T * F | (E) | a 이다.
    tags: [unit-production]

  - id: e19-09
    type: multiple-choice
    chapter: 4
    passageRefs: [g19-backtrack-01]
    prompt: 이처럼 다시 되돌아가는 문제점을 무엇이라고 하는가?
    choices:
      - { id: '1', text: '모호성' }
      - { id: '2', text: 'back tracking' }
      - { id: '3', text: '단일 생성규칙' }
      - { id: '4', text: 'left factoring' }
    answers: ['2']
    explanation: |
      선택지 1: 모호성은 한 문장에 유도트리가 여러 개 있는 문제로, 잘못 고른 규칙을 되돌리는 현상과는 다르다.
      선택지 2: A → a를 먼저 적용했다가 실패해 입력을 되돌리고 A → ab를 다시 적용하는 현상이 back tracking이다.
      선택지 3: 단일 생성규칙은 A → B 형태의 규칙으로, 이 문법에는 나타나지 않는다.
      선택지 4: left factoring은 back tracking을 없애기 위한 문법 변환 방법이지 문제점 자체가 아니다.

      핵심 개념:
      Top-down 구문분석에서 같은 비단말의 여러 규칙 중 하나를 골랐다가 실패하면 되돌아가야 한다.
      이를 back tracking이라 하며 구문분석 시간이 크게 늘어난다.
      같은 접두사를 가진 규칙(A → a | ab)이 원인이 되는 경우가 많다.
      left factoring으로 공통 접두사를 묶으면 되돌아감 없이 규칙을 선택할 수 있다.
    tags: [backtracking]

  - id: e19-10
    type: multiple-choice
    chapter: 4
    passageRefs: [g19-backtrack-01]
    prompt: 이 문제점에 대한 설명으로 ==관계없는== 것은?
    choices:
      - { id: '1', text: 'left factoring 으로 해결한다.' }
      - { id: '2', text: '구문분석의 효율이 높아진다.' }
      - { id: '3', text: '같은 기호 a 를 prefix로 갖는 2개 이상의 생성규칙이 존재한다.' }
      - { id: '4', text: '해결된 문법은 S → cAd, A → aA′, A′ → ε | b 이다.' }
    answers: ['2']
    explanation: |
      선택지 1: 공통 접두사 a를 묶는 left factoring으로 back tracking을 없앨 수 있으므로 옳은 설명이다.
      선택지 2: back tracking이 일어나면 입력을 되돌려 다시 분석해야 하므로 구문분석의 효율은 오히려 떨어진다. 관계없는 설명이다.
      선택지 3: A → a와 A → ab가 모두 a로 시작하는 것이 back tracking의 원인이므로 옳은 설명이다.
      선택지 4: A → a | ab를 left factoring하면 A → aA′, A′ → ε | b가 되므로 옳은 설명이다.

      핵심 개념:
      back tracking은 Top-down 구문분석의 대표적인 비효율 원인이다.
      같은 접두사를 가진 선택 규칙 A → αβ₁ | αβ₂가 원인이다.
      left factoring은 이를 A → αA′, A′ → β₁ | β₂로 바꾼다.
      변환 후에는 다음 입력 기호만 보고 규칙을 결정할 수 있다.
    tags: [backtracking, left-factoring]

  - id: e19-11
    type: multiple-choice
    chapter: 5
    prompt: 다음 구문분석에 대한 설명 중 올바르게 설명한 것은?
    choices:
      - { id: '1', text: 'Shift-reduce 구문분석은 Top-down 방법이다.' }
      - { id: '2', text: 'Bottom-up 구문분석방법은 backtracking을 해야 한다는 단점이 있다.' }
      - {
          id: '3',
          text: 'Top-down 구문분석방법은 주어진 문자열로부터 reduce에 의해 시작기호를 찾아가는 방법이다.',
        }
      - {
          id: '4',
          text: 'Bottom-up 방법은 터미널 노드부터 시작하여 루트 노드를 향하여, 반면에 Top-down 방법은 루트 노드로부터 터미널 노드를 향하여 파스트리를 만들어 나간다.',
        }
    answers: ['4']
    explanation: |
      선택지 1: Shift-reduce 구문분석은 입력을 스택에 옮기고(shift) 핸들을 환원(reduce)하는 Bottom-up 방법이다.
      선택지 2: backtracking은 규칙을 잘못 골랐을 때 되돌아가는 Top-down 방법의 문제점이다.
      선택지 3: 문자열에서 reduce로 시작기호를 찾아가는 것은 Bottom-up 방법의 설명이다.
      선택지 4: Bottom-up은 잎(터미널)에서 루트로, Top-down은 루트(시작기호)에서 잎으로 파스트리를 만든다. 올바른 설명이다.

      핵심 개념:
      Top-down 구문분석은 시작기호에서 출발해 좌단유도로 입력 문자열을 만들어 간다.
      Bottom-up 구문분석은 입력 문자열에서 출발해 우단유도의 역순으로 환원하며 시작기호에 도달한다.
      Shift-reduce, 순위(precedence), LR(Left-to-right, Rightmost derivation) 구문분석은 Bottom-up 방법이다.
      재귀 하강, 예측(predictive, LL(Left-to-right, Leftmost derivation)) 구문분석은 Top-down 방법이다.
    tags: [top-down-parsing, bottom-up-parsing]

  - id: e19-12
    type: multiple-choice
    chapter: 5
    passageRefs: [g19-sr-grammar-01, g19-handle-01]
    prompt: 문자열 id - id * id를 우단 유도하고 핸들을 표시한 것이다. 다음 중 핸들을 ==잘못== 표시한 단계가 있는가?
    choices:
      - { id: '1', text: '1단계' }
      - { id: '2', text: '3단계' }
      - { id: '3', text: '5단계' }
      - { id: '4', text: '없다.' }
    answers: ['4']
    explanation: |
      선택지 1: 1단계 문장형 E - E에서 E → E - E로 환원되는 부분은 E - E 전체이므로 핸들 표시가 옳다.
      선택지 2: 3단계 문장형 E - E * id에서 가장 먼저 환원되는 부분은 오른쪽 id이므로 핸들 표시가 옳다.
      선택지 3: 5단계 문장형 id - id * id에서 가장 먼저 환원되는 부분은 가장 왼쪽 id이므로 핸들 표시가 옳다.
      선택지 4: 우단유도 E ⇒ E - E ⇒ E - E * E ⇒ E - E * id ⇒ E - id * id ⇒ id - id * id의 각 단계에서 바로 전 단계로 되돌리는 부분이 모두 올바르게 표시되어 있다. 잘못 표시한 단계는 없다.

      핵심 개념:
      핸들은 우문장형에서 어떤 생성규칙의 오른쪽과 일치하고, 그것을 환원하면 우단유도의 바로 앞 단계가 되는 부분 문자열이다.
      Shift-reduce 구문분석은 스택 꼭대기에 핸들이 나타날 때마다 환원한다.
      우단유도를 역순으로 따라가면 각 단계의 핸들을 확인할 수 있다.
      모호한 문법에서는 우단유도가 여러 개일 수 있어 핸들도 유도에 따라 달라진다.
    tags: [handle, rightmost-derivation]

  - id: e19-13
    type: multiple-choice
    chapter: 5
    passageRefs: [g19-sr-grammar-01, g19-sr-trace-01]
    prompt: 계속해서 id-id*id를 shift-reduce 구문분석하는 과정이다. 빈칸 ‘가’에 알맞은 것은?
    choices:
      - { id: '1', text: 'id' }
      - { id: '2', text: 'E → id' }
      - { id: '3', text: 'E → E * E' }
      - { id: '4', text: 'E → E-E' }
    answers: ['1']
    explanation: |
      선택지 1: 0단계에서 스택은 비어 있고 입력의 첫 기호가 id이므로 shift id를 수행한다. 1단계 스택이 \$id인 것과 일치한다.
      선택지 2: E → id는 스택 꼭대기에 id가 있을 때 하는 reduce 동작으로, shift 대상이 아니다.
      선택지 3: E → E * E는 스택에 E * E가 있을 때의 환원 규칙이다.
      선택지 4: E → E-E는 스택에 E - E가 있을 때의 환원 규칙이다.

      핵심 개념:
      Shift-reduce 구문분석은 shift(입력 기호를 스택에 넣기), reduce(핸들 환원), accept, error 네 동작으로 진행한다.
      shift 뒤에는 옮긴 입력 기호, reduce 뒤에는 사용한 생성규칙을 적는다.
      스택과 입력의 변화를 다음 단계와 비교하면 각 동작을 알 수 있다.
      입력이 모두 소비되고 스택에 시작기호만 남으면 accept한다.
    tags: [shift-reduce-parsing]

  - id: e19-14
    type: multiple-choice
    chapter: 5
    passageRefs: [g19-sr-grammar-01, g19-sr-trace-01]
    prompt: 빈칸 ‘나’에 알맞은 것은?
    choices:
      - { id: '1', text: 'id' }
      - { id: '2', text: 'E → id' }
      - { id: '3', text: 'E → E * E' }
      - { id: '4', text: 'E → E-E' }
    answers: ['2']
    explanation: |
      선택지 1: id는 shift할 때 적는 입력 기호이며 reduce 동작의 내용이 아니다.
      선택지 2: 1단계 스택 \$id의 꼭대기 id가 핸들이므로 E → id로 환원한다. 2단계 스택이 \$E가 된 것과 일치한다.
      선택지 3: 스택에 E * E가 없으므로 E → E * E로 환원할 수 없다.
      선택지 4: 스택에 E - E가 없으므로 E → E-E로 환원할 수 없다.

      핵심 개념:
      reduce는 스택 꼭대기의 핸들을 생성규칙 왼쪽 비단말로 바꾸는 동작이다.
      id가 스택에 올라오면 곧바로 E → id로 환원해 피연산자 E를 만든다.
      환원 후 스택의 모양이 다음 단계 스택과 같아야 한다.
      이 과정은 우단유도의 역순을 따른다.
    tags: [shift-reduce-parsing]

  - id: e19-15
    type: multiple-choice
    chapter: 5
    passageRefs: [g19-sr-grammar-01, g19-sr-trace-01]
    prompt: 빈칸 ‘다’에 알맞은 것은?
    choices:
      - { id: '1', text: 'id' }
      - { id: '2', text: 'E → id' }
      - { id: '3', text: 'E → E * E' }
      - { id: '4', text: 'E → E-E' }
    answers: ['3']
    explanation: |
      선택지 1: 8단계에서 입력은 이미 모두 소비되어 shift할 기호가 없다.
      선택지 2: 스택 꼭대기가 id가 아니라 E이므로 E → id로 환원할 수 없다.
      선택지 3: 8단계 스택 \$E-E*E의 꼭대기 E * E가 핸들이므로 E → E * E로 환원한다. 9단계 스택이 \$E-E가 된 것과 일치한다.
      선택지 4: E - E 환원은 E * E를 먼저 환원한 다음 단계(9단계)에서 일어난다.

      핵심 개념:
      5단계에서 reduce E → E - E 대신 shift *를 선택했기 때문에 *가 먼저 계산된다.
      이는 *의 우선순위가 -보다 높다는 규칙을 반영한 선택이다.
      모호한 문법에서는 이런 shift/reduce 선택으로 연산자 우선순위를 정한다.
      그 결과 스택 꼭대기의 E * E가 먼저 환원된다.
    tags: [shift-reduce-parsing, operator-precedence]

