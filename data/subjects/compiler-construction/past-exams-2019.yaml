  - id: g19-lr0-01
    type: code
    language: text
    body: |
      (1) 증가문법은 다음과 같다.
          0) S′ → E
          1) E → E+T
          2) E → T
          3) T → T*F
          4) T → F
          5) F → (E)
          6) F → id

      (2) Canonical Collection.
          I₀ = closure([S′ → ·E]) = {[S′ → ·E], [E → ·E+T], [E → ·T],
                                     [T → ·T*F], [T → ·F], [F → ·(E)], [F → ·id]}
          I₁ = GOTO(I₀, E)
          I₂ = GOTO(I₀, T)
          I₃ = GOTO(I₀, F)
          I₄ = GOTO(I₀, ( )

      <보기>
      (가) {[T → F·]}
      (나) {[S′ → E·], [E → E·+T]}
      (다) {[E → T·], [T → T·*F]}
      (라) {[F → (·E)], [E → ·E+T], [E → ·T], [T → ·T*F],
            [T → ·F], [F → ·(E)], [F → ·id]}

