      선택지 4: (라)는 ( 다음으로 점을 옮긴 GOTO(I₀, ( )이다.

      핵심 개념:
      GOTO를 구할 때는 먼저 점 뒤 기호가 X인 항목만 골라 점을 한 칸 옮긴다.
      옮긴 뒤 점이 규칙 끝에 있으면(완료 항목) closure로 추가할 항목이 없다.
