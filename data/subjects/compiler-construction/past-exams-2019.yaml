    explanation: |
      선택지 1: 9단계에서도 입력이 남아 있지 않아 shift할 수 없다.
      선택지 2: 스택 꼭대기가 id가 아니므로 E → id 환원이 아니다.
      선택지 3: E * E는 이미 8단계에서 환원되어 스택에 남아 있지 않다.
      선택지 4: 9단계 스택 \$E-E 전체가 핸들이므로 E → E-E로 환원하고, 10단계에서 스택에 E만 남아 accept한다.

      핵심 개념:
      shift-reduce 구문분석은 입력이 끝난 뒤에도 스택에 남은 핸들을 차례로 환원한다.
      id - id * id에서 * 부분이 먼저, - 부분이 나중에 환원된다.
      환원 순서는 우단유도 E ⇒ E - E ⇒ E - E * E ⇒ … 의 역순이다.
