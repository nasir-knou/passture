questions:
  - id: l01-01
    type: multiple-choice
    prompt: 다음 중 저급언어를 저급언어로 번역하는 기능을 갖고 있는 번역기는?
    choices:
      - { id: '1', text: '어셈블러' }
      - { id: '2', text: '컴파일러' }
      - { id: '3', text: '프리프로세서' }
      - { id: '4', text: '인터프리터' }
    answers: ['1']
    explanation: |
      선택지 1: 어셈블러는 저급언어인 어셈블리어로 쓴 프로그램을 역시 저급언어인 기계어로 번역하므로 정답이다.
      선택지 2: 컴파일러는 고급언어로 쓴 원시 프로그램을 어셈블리어나 기계어 같은 저급언어로 번역한다. 입력이 고급언어라는 점에서 조건과 맞지 않는다.
      선택지 3: 프리프로세서는 확장된 고급언어를 표준 고급언어로 바꾸는 고급언어 → 고급언어 번역기다.
      선택지 4: 인터프리터는 고급언어 프로그램을 목적 프로그램으로 바꾸지 않고 문장 단위로 해석해 바로 실행 결과를 낸다.

      핵심 개념:
      번역기는 입력 언어와 출력 언어의 수준으로 구분할 수 있다.
      컴파일러: 고급언어 → 어셈블리어/기계어, 프리프로세서: 고급언어 → 고급언어.
      인터프리터: 고급언어 → 실행 결과, 어셈블러: 어셈블리어 → 기계어.
      저급언어끼리 번역하는 것은 어셈블러다.
    tags: [translator, assembler]

  - id: l01-02
    type: multiple-choice
    prompt: 다음 중 컴파일러 기법에 대한 설명 중 옳지 않은 것은?
    choices:
      - { id: '1', text: '사용자에게 많은 융통성을 준다.' }
      - { id: '2', text: '실행시간이 효율적이다.' }
      - { id: '3', text: '번역기법이라고도 한다.' }
      - { id: '4', text: '입출력 포맷 등 큰 기억장소를 요구한다.' }
    answers: ['1']
    explanation: |
      선택지 1: 사용자에게 많은 융통성을 주는 것은 프로그램을 문장 단위로 해석·실행하는 인터프리터 기법의 특징이다. 컴파일러 기법에 대한 설명이 아니므로 옳지 않은 것으로 정답이다.
      선택지 2: 컴파일러 기법은 번역을 한 번 끝낸 목적 프로그램을 반복 실행하므로 실행시간이 효율적이다. 옳은 설명이다.
      선택지 3: 컴파일러 기법은 원시 프로그램 전체를 목적 프로그램으로 번역한 뒤 실행하므로 번역기법이라고도 한다. 옳은 설명이다.
      선택지 4: 컴파일러 기법은 번역된 목적 프로그램과 입출력 포맷 등을 모두 기억장소에 두어야 하므로 큰 기억장소를 요구한다. 옳은 설명이다.

      핵심 개념:
      컴파일러 기법(번역기법)은 프로그램 전체를 먼저 번역한 뒤 목적 프로그램을 실행한다.
      번역이 한 번이면 되므로 실행시간이 효율적이지만, 목적 프로그램 등을 저장할 큰 기억장소가 필요하다.
      인터프리터 기법(해석기법)은 문장 단위로 해석·실행하므로 기억장소가 적게 들고 사용자에게 융통성을 준다.
      대신 반복되는 문장도 매번 해석해야 하므로 실행 속도는 느리다.
    tags: [compiler, interpreter]

  - id: l01-03
    type: multiple-choice
    prompt: 다음 중 프로그래밍 언어에 유용한 기능들을 추가하여 언어를 확장하는 경우 주로 사용되는 것은?
    choices:
      - { id: '1', text: '어셈블러' }
      - { id: '2', text: '컴파일러' }
      - { id: '3', text: '프리프로세서' }
      - { id: '4', text: '인터프리터' }
    answers: ['3']
    explanation: |
      선택지 1: 어셈블러는 어셈블리어를 기계어로 바꾸는 번역기로, 고급언어의 기능을 확장하는 용도가 아니다.
      선택지 2: 컴파일러는 고급언어를 저급언어로 번역하는 번역기이며, 확장된 언어를 기존 언어로 바꾸는 전처리 역할과는 다르다.
      선택지 3: 프리프로세서는 매크로 등 유용한 기능이 추가된 확장 언어로 쓴 프로그램을 기존 고급언어 프로그램으로 바꾸어 주므로, 언어를 확장할 때 주로 사용된다. 정답이다.
      선택지 4: 인터프리터는 고급언어 프로그램을 문장 단위로 해석해 실행하는 방식으로, 언어 확장과 관계가 없다.

      핵심 개념:
      프리프로세서(전처리기)는 고급언어를 고급언어로 바꾸는 번역기다.
      매크로 확장, 파일 포함 등 언어에 없는 편리한 기능을 추가한 확장 언어를 처리할 때 쓴다.
      프리프로세서의 출력은 다시 컴파일러의 입력이 된다.
      C 언어의 `#define`, `#include` 처리가 대표적인 예다.
    tags: [translator, preprocessor]

  - id: l01-04
    type: multiple-choice
    prompt: 혼합형 연산을 하는 경우 정수를 실수로 바꾸어 주어야 한다. 다음 중 어느 단계와 관계 있는가?
    choices:
      - { id: '1', text: '어휘분석' }
      - { id: '2', text: '구문분석' }
      - { id: '3', text: '의미분석' }
      - { id: '4', text: '최적화' }
    answers: ['3']
    explanation: |
      선택지 1: 어휘분석은 원시 프로그램의 문자열을 읽어 토큰으로 나누는 단계로, 피연산자의 형을 맞추지 않는다.
      선택지 2: 구문분석은 토큰열이 문법에 맞는지 검사하고 구문 구조를 만드는 단계로, 형 변환은 이 단계의 일이 아니다.
      선택지 3: 의미분석 단계는 형 검사를 하면서 혼합형 연산의 피연산자를 같은 형으로 변환해 준다. 정수를 실수로 바꾸는 작업이 여기에 해당하므로 정답이다.
      선택지 4: 최적화는 생성된 중간코드를 더 효율적으로 바꾸는 단계로, 연산의 의미를 맞추기 위한 형 변환과는 목적이 다르다.

      핵심 개념:
      의미분석은 구문적으로 맞는 프로그램이 의미상으로도 맞는지 검사하는 단계다.
      대표적인 작업이 형 검사(type checking)이며, 연산자에 맞지 않는 피연산자 형을 찾아낸다.
      정수와 실수가 섞인 혼합형 연산에서는 정수를 실수로 바꾸는 등 동일한 형으로 변환해 준다.
      이렇게 얻은 정보는 이후 중간코드 생성에 쓰인다.
    tags: [semantic-analysis, type-checking]

  - id: l01-05
    type: multiple-choice
    prompt: 다음은 컴파일러의 물리적 구조에 대한 설명이다. 틀린 것은?
    choices:
      - {
          id: '1',
          text: '컴파일러의 논리적 구조를 구현한 것을 패스(pass)라고 하며, 패스는 논리적 구조와 순서가 같게 구현해야 한다.',
        }
      - { id: '2', text: '1-패스 컴파일러는 초창기에 컴파일러를 만들 때 사용했던 방법이다.' }
      - {
          id: '3',
          text: '2-패스 컴파일러는 중간코드를 기점으로 하여 전반부 (front-end)와 후반부(back-end)로 구성하는 방법이다.',
        }
      - { id: '4', text: '1-패스 컴파일러는 backpatching이 요구된다.' }
    answers: ['1']
    explanation: |
      선택지 1: 컴파일러의 논리적 구조를 실제로 구현한 단위가 패스(pass)인 것은 맞지만, 패스가 논리적 구조와 순서까지 같아야 하는 것은 아니다. 여러 논리 단계를 한 패스로 묶거나 나누어 구현할 수 있으므로 틀린 설명이고 정답이다.
      선택지 2: 1-패스 컴파일러는 원시 프로그램을 한 번만 읽어 중간코드 없이 직접 목적코드로 번역하는 방법으로, 초창기에 컴파일러를 만들 때 사용했다. 옳은 설명이다.
      선택지 3: 2-패스 컴파일러는 중간코드를 경계로 기계 독립적인 전반부(front-end)와 기계 종속적인 후반부(back-end)로 나누어 구성한다. 옳은 설명이다.
      선택지 4: 1-패스 컴파일러는 앞으로 점프하는 명령의 목적지 번지를 번역 시점에 알 수 없으므로, 번지를 비워 두었다가 나중에 채우는 backpatching이 필요하다. 옳은 설명이다.

      핵심 개념:
      컴파일러의 논리적 구조는 어휘분석, 구문분석, 의미분석, 중간코드 생성, 코드최적화, 코드생성 단계다.
      물리적 구조는 이 단계들을 실제로 몇 번의 패스로 구현하는가를 말한다.
      1-패스 컴파일러는 빠르지만 backpatching이 필요하고 최적화가 어렵다.
      2-패스 컴파일러는 중간코드를 기준으로 전반부와 후반부를 나누어 이식성과 최적화에 유리하다.
    tags: [pass, one-pass-compiler, two-pass-compiler, backpatching]

  - id: l01-06
    type: multiple-choice
    prompt: 컴파일러의 논리적 구조가 올바르게 나열된 것은?
    choices:
      - { id: '1', text: '어휘분석-구문분석-의미분석-중간코드 생성-코드최적화-코드생성' }
      - { id: '2', text: '어휘분석-의미분석-구문분석-중간코드 생성-코드최적화-코드생성' }
      - { id: '3', text: '어휘분석-구문분석-의미분석-코드최적화-중간코드 생성-코드생성' }
      - { id: '4', text: '어휘분석-구문분석-중간코드 생성-의미분석-코드최적화-코드생성' }
    answers: ['1']
    explanation: |
      선택지 1: 원시 프로그램을 토큰으로 나누고(어휘분석), 구문 구조를 만들고(구문분석), 의미를 검사한 뒤(의미분석), 중간코드를 만들어(중간코드 생성) 개선하고(코드최적화) 목적코드를 만드는(코드생성) 순서이므로 정답이다.
      선택지 2: 의미분석은 구문분석이 만든 구문 구조를 대상으로 하므로 구문분석보다 앞에 올 수 없다.
      선택지 3: 코드최적화는 생성된 중간코드를 개선하는 단계이므로 중간코드 생성보다 앞에 올 수 없다.
      선택지 4: 의미분석에서 검사·변환한 정보를 바탕으로 중간코드를 만들기 때문에 중간코드 생성이 의미분석보다 앞에 올 수 없다.

      핵심 개념:
      컴파일러의 논리적 구조는 어휘분석 → 구문분석 → 의미분석 → 중간코드 생성 → 코드최적화 → 코드생성 순이다.
      앞 단계의 출력(토큰, 구문 트리, 중간코드)이 다음 단계의 입력이 된다.
      어휘분석부터 중간코드 생성까지를 전반부, 코드최적화와 코드생성을 후반부로 나누기도 한다.
      기호표와 오류 처리기는 모든 단계에서 함께 사용된다.
    tags: [compiler-structure]

  - id: l02-01
    type: multiple-choice
    prompt: T = {a, b, c} 가 주어졌을 때 다음 설명 중 틀린 것은?
    choices:
      - { id: '1', text: '$a^n$ = abc' }
      - { id: '2', text: '|abc| = 3' }
      - { id: '3', text: '$T^*$ = {ε, a, b, c, aa, ab, ac, ⋯}' }
      - { id: '4', text: '$T^+$ = {a, b, c, aa, ab, ac, ⋯}' }
    answers: ['1']
    explanation: |
      선택지 1: $a^n$은 기호 a가 n개 나열된 문자열(aa⋯a)을 뜻한다. 서로 다른 기호로 이루어진 abc와 같을 수 없으므로 틀린 설명이고 정답이다.
      선택지 2: |w|는 문자열 w의 길이, 즉 w를 이루는 기호의 개수다. abc는 기호 3개로 이루어져 있으므로 |abc| = 3은 맞다.
      선택지 3: $T^*$는 공문자열 ε을 포함해 T의 기호로 만들 수 있는 모든 문자열의 집합이므로 맞는 설명이다.
      선택지 4: $T^+$는 $T^*$에서 공문자열 ε을 뺀 집합, 즉 길이가 1 이상인 모든 문자열의 집합이므로 맞는 설명이다.

      핵심 개념:
      알파벳 T는 기호의 유한 집합이고, 문자열은 T의 기호를 나열한 것이다.
      $a^n$은 a를 n번 이어 붙인 문자열이며, $a^0$ = ε이다.
      |w|는 문자열의 길이를 나타내고, |ε| = 0이다.
      $T^*$는 ε을 포함한 모든 문자열의 집합, $T^+ = T^* - \{\varepsilon\}$이다.
    tags: [alphabet, string, kleene-closure, positive-closure]

  - id: l02-02
    type: multiple-choice
    passageRefs: [gl02-grammar-sbc-intro-01, gl02-grammar-sbc-01]
    prompt: 촘스키 분류법에 따르면 어디에 속하는가?
    choices:
      - { id: '1', text: 'type 0' }
      - { id: '2', text: 'type 1' }
      - { id: '3', text: 'type 2' }
      - { id: '4', text: 'type 3' }
    answers: ['4']
    explanation: |
      선택지 1: type 0은 생성규칙에 제약이 없는 무제약 문법이다. 문법 G도 형식상 type 0에 포함되지만, 훨씬 강한 제약을 만족하므로 가장 좁은 유형으로 분류하면 type 0이 아니다.
      선택지 2: type 1은 문맥의존 문법(|α| ≤ |β|)이다. G의 규칙도 이 조건을 만족하지만 더 제한된 유형에 속한다.
      선택지 3: type 2는 왼쪽이 논터미널 하나인 context-free 문법이다. G의 왼쪽은 모두 논터미널 하나이지만, 오른쪽까지 제한된 형태이므로 더 좁은 type 3으로 분류한다.
      선택지 4: S → aS, S → aB, B → bC, C → aC는 A → tB 형태이고 C → a는 A → t 형태이므로 모든 규칙이 우선형(right-linear)이다. 따라서 type 3 정규문법이고 정답이다.

      핵심 개념:
      촘스키 분류는 생성규칙의 제약에 따라 type 0(무제약), type 1(문맥의존), type 2(context-free), type 3(정규)으로 나눈다.
      type 3 정규문법은 모든 규칙이 A → tB, A → t(우선형) 또는 A → Bt, A → t(좌선형) 중 한 가지 형태로 통일되어야 한다.
      제약이 강할수록 번호가 크며, 문법은 만족하는 가장 제한된 유형으로 분류한다.
      정규문법이 생성하는 언어는 정규언어이고 유한 오토마타로 인식할 수 있다.
    tags: [chomsky-hierarchy, regular-grammar]

  - id: l02-03
    type: multiple-choice
    passageRefs: [gl02-grammar-sbc-intro-01, gl02-grammar-sbc-01]
    prompt: 문법 G가 생성할 수 없는 것은?
    choices:
      - { id: '1', text: 'aba' }
      - { id: '2', text: 'ababa' }
      - { id: '3', text: 'aabaaa' }
      - { id: '4', text: 'abaaa' }
    answers: ['2']
    explanation: |
      선택지 1: S ⇒ aB ⇒ abC ⇒ aba로 생성된다.
      선택지 2: 문법 G에서 b를 만드는 규칙은 B → bC 하나뿐이고, B는 S → aB로 한 번만 나타난다. C에서는 aC | a로 a만 만들 수 있으므로 문자열에 b가 두 번 나올 수 없다. b가 두 개인 ababa는 생성할 수 없으므로 정답이다.
      선택지 3: S ⇒ aS ⇒ aaB ⇒ aabC ⇒ aabaC ⇒ aabaaC ⇒ aabaaa로 생성된다.
      선택지 4: S ⇒ aB ⇒ abC ⇒ abaC ⇒ abaaC ⇒ abaaa로 생성된다.

      핵심 개념:
      S → aS | aB는 a를 1개 이상 만든 뒤 B로 넘어간다.
      B → bC는 b를 정확히 한 번 만들고 C로 넘어간다.
      C → aC | a는 a를 1개 이상 만들고 끝난다.
      따라서 G가 생성하는 언어는 a가 1개 이상, b가 1개, a가 1개 이상 이어진 문자열 $a^+ba^+$이다.
    tags: [regular-grammar, derivation]

  - id: l02-04
    type: multiple-choice
    passageRefs: [gl02-grammar-sbc-intro-01, gl02-grammar-sbc-01]
    prompt: 문법 G가 생성하는 언어를 정규표현으로 표현한 것은?
    choices:
      - { id: '1', text: 'a*ba*' }
      - { id: '2', text: 'a*aba*a' }
      - { id: '3', text: 'a*ab*a*a' }
      - { id: '4', text: 'a*+aba*a' }
    answers: ['2']
    explanation: |
      선택지 1: a*ba*는 b 하나만으로 된 문자열 b도 포함한다. G는 b 앞뒤에 a를 최소 한 개씩 만들므로 b를 생성할 수 없어 같은 언어가 아니다.
      선택지 2: 정규표현 방정식으로 풀면 C = aC + a에서 C = a*a, B = bC에서 B = ba*a, S = aS + aB = aS + aba*a에서 S = a*aba*a이다. 정답이다.
      선택지 3: a*ab*a*a는 b를 0개 또는 여러 개 허용하므로 aa, abba처럼 G가 만들 수 없는 문자열까지 포함한다.
      선택지 4: a*+aba*a는 a*와 aba*a의 합집합이므로 ε, a, aa처럼 b가 없는 문자열을 포함하고, aaba처럼 b 앞에 a가 두 개 이상인 문자열은 포함하지 않는다.

      핵심 개념:
      정규문법은 각 논터미널을 미지수로 하는 정규표현 방정식으로 바꾸어 풀 수 있다.
      X = αX + β 형태의 방정식의 해는 X = α*β이다.
      뒤쪽 논터미널부터 차례로 풀어 대입하면 시작 기호 S의 정규표현을 얻는다.
      a*a는 a가 1개 이상 반복된 문자열이므로 결과는 $a^+ba^+$와 같다.
    tags: [regular-grammar, regular-expression, regular-equation]

  - id: l02-05
    type: multiple-choice
    passageRefs: [gl02-grammar-v0v1-01]
    prompt: 다음 문법에서 생성될 수 없는 것은?
    choices:
      - { id: '1', text: 'aa' }
      - { id: '2', text: 'aba' }
      - { id: '3', text: 'abaa' }
      - { id: '4', text: 'ababaa' }
    answers: ['2']
    explanation: |
      선택지 1: V0 ⇒ aV1 ⇒ aa로 생성된다.
      선택지 2: 모든 유도는 V0 ⇒ aV1로 시작하고, V1은 bV0로 가서 다시 a를 붙이거나 a로 끝난다. 따라서 생성되는 문자열은 반드시 aa로 끝난다. aba는 ba로 끝나므로 생성될 수 없어 정답이다.
      선택지 3: V0 ⇒ aV1 ⇒ abV0 ⇒ abaV1 ⇒ abaa로 생성된다.
      선택지 4: V0 ⇒ aV1 ⇒ abV0 ⇒ abaV1 ⇒ ababV0 ⇒ ababaV1 ⇒ ababaa로 생성된다.

      핵심 개념:
      정규표현 방정식으로 바꾸면 V0 = aV1, V1 = bV0 + a이다.
      대입하면 V0 = a(bV0 + a) = abV0 + aa이다.
      X = αX + β의 해가 X = α*β이므로 V0 = (ab)*aa이다.
      문자열이 언어에 속하는지는 이 정규표현에 맞는지로 판단하면 된다.
    tags: [regular-grammar, regular-equation]

  - id: l02-06
    type: multiple-choice
    passageRefs: [gl02-bnf-integer-01]
    prompt: 다음의 production rule에 대한 설명 중 올바른 것은?
    choices:
      - { id: '1', text: '절대정수로 11, 45, 112, 2315 등이 허용된다.' }
      - { id: '2', text: '절대정수로 0을 포함하는 모든 수를 의미한다.' }
      - { id: '3', text: '절대정수로 1을 포함하는 모든 수를 의미한다.' }
      - { id: '4', text: '절대정수로 1, 5, 9, 10, 13 등이 허용된다.' }
    answers: ['1']
    explanation: |
      선택지 1: 〈절대정수〉는 〈숫자〉 하나이거나 〈절대정수〉 뒤에 〈숫자〉를 붙인 것이므로, 0~5의 숫자를 1개 이상 이어 붙인 수다. 11, 45, 112, 2315는 모두 0~5로만 이루어져 있으므로 정답이다.
      선택지 2: 〈숫자〉는 0부터 5까지만 정의되어 있으므로 6, 7, 8, 9가 들어간 수는 만들 수 없다. 모든 수를 의미하지 않는다.
      선택지 3: 〈숫자〉는 0부터 5까지만 정의되어 있어 6~9가 들어간 수는 만들 수 없으므로, 1을 포함하는 모든 수를 의미한다는 설명은 틀리다.
      선택지 4: 1, 5, 10, 13은 만들 수 있지만 9는 〈숫자〉에 없으므로 허용되지 않는다.

      핵심 개념:
      BNF에서 ::=는 정의, |는 선택, 〈 〉는 논터미널을 나타낸다.
      〈절대정수〉 ::= 〈숫자〉 | 〈절대정수〉 〈숫자〉는 왼쪽 재귀로 〈숫자〉를 1번 이상 반복하는 규칙이다.
      따라서 허용되는 수는 〈숫자〉로 정의된 기호(0~5)만으로 이루어진 길이 1 이상의 숫자열이다.
      어떤 수가 허용되는지는 각 자리의 숫자가 〈숫자〉에 정의되어 있는지로 판단한다.
    tags: [bnf]

  - id: l03-01
    type: multiple-choice
    passageRefs: [gl03-identifier-fa-01, gl03-identifier-fa-table-01]
    prompt: 다음의 오토마타가 인식 할 수 없는 문자열은?
    choices:
      - { id: '1', text: '123' }
      - { id: '2', text: 'abc' }
      - { id: '3', text: 'ab123' }
      - { id: '4', text: 'korea' }
    answers: ['1']
    explanation: |
      선택지 1: 시작상태 q₀에서 숫자 1을 읽으면 전이가 ∅이므로 더 이상 진행할 수 없다. 첫 글자가 숫자인 123은 인식할 수 없으므로 정답이다.
      선택지 2: q₀에서 a를 읽어 q₁로 가고, q₁에서 b, c를 읽어도 q₁에 머문다. 끝난 상태 q₁이 종료상태이므로 인식된다.
      선택지 3: q₀에서 a를 읽어 q₁로 간 뒤, q₁에서는 영문자와 숫자 모두 q₁로 가므로 b, 1, 2, 3을 읽어도 q₁에 머문다. 인식된다.
      선택지 4: 첫 글자 k가 영문자이므로 q₁로 가고 나머지 영문자도 q₁에 머물러 인식된다.

      핵심 개념:
      M = (Q, Σ, δ, q0, q1)에서 q0는 시작상태, 마지막 q1은 종료상태이다.
      q₀에서는 영문자만 q₁로 가고 숫자는 ∅(전이 없음)이다.
      q₁에서는 영문자와 숫자 모두 q₁로 간다.
      따라서 이 오토마타는 영문자로 시작하고 영문자·숫자가 이어지는 식별자를 인식한다.
    tags: [finite-automata, identifier]

  - id: l03-02
    type: multiple-choice
    passageRefs: [gl03-nfa-bab-intro-01, gl03-nfa-bab-01]
    prompt: ε-closure(0)을 구하라.
    choices:
      - { id: '1', text: '0,1' }
      - { id: '2', text: '0,1,2,4' }
      - { id: '3', text: '0,1,2,4,7' }
      - { id: '4', text: '0,1,2,4,7,8' }
    answers: ['3']
    explanation: |
      선택지 1: 1에서 ε으로 2와 4에 갈 수 있고, 0에서 ε으로 7에도 직접 갈 수 있으므로 빠진 상태가 있다.
      선택지 2: 0에서 아래쪽 ε 간선으로 7에 직접 갈 수 있으므로 7이 빠졌다.
      선택지 3: 0에서 ε으로 1과 7에, 1에서 ε으로 2와 4에 갈 수 있다. 2, 4, 7에서 나가는 간선은 모두 입력기호(a, b)이므로 더 늘어나지 않는다. 자기 자신을 포함해 ε-closure(0) = {0, 1, 2, 4, 7}이므로 정답이다.
      선택지 4: 7에서 8로 가려면 입력기호 b를 읽어야 하므로 8은 ε-전이만으로 도달할 수 없다.

      핵심 개념:
      ε-closure(s)는 s에서 ε-전이만으로 도달할 수 있는 모든 상태의 집합이며 s 자신을 포함한다.
      ε-전이를 여러 번 연속으로 따라가는 경로도 모두 포함한다.
      입력기호가 붙은 간선은 ε-closure 계산에서 따라가지 않는다.
      NFA를 DFA로 바꿀 때 ε-closure(시작상태)가 DFA의 시작상태가 된다.
    tags: [nfa, epsilon-closure]

  - id: l03-03
    type: multiple-choice
    passageRefs: [gl03-nfa-bab-intro-01, gl03-nfa-bab-01]
    prompt: ε-closure(0)을 상태 A라 하자. 그러면  입력기호 a에 의한 다음 상태는?
    choices:
      - { id: '1', text: 'ε-closure(1)' }
      - { id: '2', text: 'ε-closure(2)' }
      - { id: '3', text: 'ε-closure(3)' }
      - { id: '4', text: 'ε-closure(4)' }
    answers: ['3']
    explanation: |
      선택지 1: 1로 들어오는 간선은 0과 6에서 오는 ε 간선뿐이므로 a를 읽어 도달하는 상태가 아니다.
      선택지 2: 2는 a를 읽기 전의 상태로, 1에서 ε으로 도달한다. a를 읽은 뒤의 상태가 아니다.
      선택지 3: A = {0, 1, 2, 4, 7}에서 입력기호 a로 전이되는 것은 2번에서 3번으로 가는 것뿐이다. 따라서 move(A, a) = {3}이고 다음 상태는 ε-closure(3)이므로 정답이다.
      선택지 4: 4는 1에서 ε으로 도달하는 상태이며, 4에서는 a가 아니라 b로 5에 간다.

      핵심 개념:
      DFA 상태 T에서 입력 a에 의한 다음 상태는 ε-closure(move(T, a))이다.
      move(T, a)는 T의 각 상태에서 a로 한 번 전이한 상태들의 집합이다.
      A = {0, 1, 2, 4, 7}에서 a 간선이 나가는 상태는 2뿐이므로 move(A, a) = {3}이다.
      부분집합 구성(subset construction)은 이 과정을 새 상태가 나오지 않을 때까지 반복한다.
    tags: [nfa, epsilon-closure, subset-construction]

  - id: l03-04
    type: multiple-choice
    passageRefs: [gl03-nfa-bab-intro-01, gl03-nfa-bab-01]
    prompt: ε-closure(0)을 상태 A 라 하자. 상태 A 에서  입력기호 b 에 의한 다음 상태는?
    choices:
      - { id: '1', text: 'ε-closure(5,7)' }
      - { id: '2', text: 'ε-closure(5,8)' }
      - { id: '3', text: 'ε-closure(5,9)' }
      - { id: '4', text: 'ε-closure(5,10)' }
    answers: ['2']
    explanation: |
      선택지 1: 7은 A에 이미 속한 상태이며 b를 읽어 도달하는 상태가 아니다. 7에서 b를 읽으면 8로 간다.
      선택지 2: A = {0, 1, 2, 4, 7}에서 입력기호 b로 전이되는 것은 4번에서 5번, 7번에서 8번이다. 따라서 move(A, b) = {5, 8}이고 다음 상태는 ε-closure(5,8)이므로 정답이다.
      선택지 3: 9는 8에서 a를 읽어 도달하는 상태이고, 8은 A에 속하지 않으므로 고려하지 않는다.
      선택지 4: 10은 9에서 b를 읽어 도달하는 상태인데, 9는 A에 속하지 않는다.

      핵심 개념:
      move(A, b)는 A에 속한 상태 중 b 간선이 나가는 상태의 목적지만 모은다.
      A = {0, 1, 2, 4, 7}에서 b 간선이 나가는 상태는 4와 7이다.
      따라서 move(A, b) = {5, 8}이고, 다음 DFA 상태는 ε-closure({5, 8})이다.
      A에 속하지 않는 상태의 전이는 고려하지 않는다.
    tags: [nfa, epsilon-closure, subset-construction]

  - id: l03-05
    type: multiple-choice
    passageRefs:
      [gl03-nfa-q01-01, gl03-nfa-q01-table-01, gl03-dfa-q01-intro-01, gl03-dfa-q01-table-01]
    prompt: 다음은 NFA를 DFA로 변환하는 과정이다. 빈칸 ‘가’에 알맞은 것은?
    choices:
      - { id: '1', text: 'ϕ' }
      - { id: '2', text: '[q₀]' }
      - { id: '3', text: '[q₁]' }
      - { id: '4', text: '[q₀, q₁]' }
    answers: ['4']
    explanation: |
      선택지 1: δ(q₁, 1)은 공집합이 아니라 {q₀, q₁}이므로 ϕ가 아니다. 공집합이 되는 것은 δ(q₁, 0)이다.
      선택지 2: [q₀]는 q₀에서 1을 읽었을 때의 결과 δ(q₀, 1) = {q₀}에 해당한다.
      선택지 3: q₁에서 1을 읽으면 q₁만이 아니라 q₀에도 갈 수 있으므로 [q₁]은 부족하다.
      선택지 4: ‘가’는 δ'([q₁], 1)이다. NFA의 δ함수표에서 q₁에서 1을 보면 {q₀, q₁}이므로 δ'함수표에서도 [q₀, q₁]이 된다. 정답이다.

      핵심 개념:
      NFA를 DFA로 바꿀 때 DFA의 상태는 NFA 상태들의 집합 $[q_i, \ldots, q_j]$로 나타낸다.
      $\delta'([q_i, \ldots, q_j], a)$는 집합에 속한 각 상태의 δ(q, a)를 모두 합집합한 것이다.
      상태가 하나인 [q₁]은 δ(q₁, a)를 그대로 옮기면 된다.
      종료상태 q₁을 포함하는 DFA 상태([q₁], [q₀, q₁])가 DFA의 종료상태가 된다.
    tags: [nfa, dfa, subset-construction]

  - id: l03-06
    type: multiple-choice
    passageRefs:
      [gl03-nfa-q01-01, gl03-nfa-q01-table-01, gl03-dfa-q01-intro-01, gl03-dfa-q01-table-01]
    prompt: 다음은 NFA를 DFA로 변환하는 과정이다. 빈칸 ‘나’에 알맞은 것은?
    choices:
      - { id: '1', text: 'ϕ' }
      - { id: '2', text: '[q₀]' }
      - { id: '3', text: '[q₁]' }
      - { id: '4', text: '[q₀, q₁]' }
    answers: ['4']
    explanation: |
      선택지 1: δ(q₁, 0)은 Φ이지만 δ(q₀, 0) = {q₀, q₁}과 합집합을 하므로 결과가 공집합이 되지 않는다.
      선택지 2: q₀에서 0을 읽으면 q₀뿐 아니라 q₁에도 갈 수 있으므로 [q₀]는 부족하다.
      선택지 3: q₀에서 0을 읽어 q₀에도 갈 수 있으므로 [q₁]만으로는 부족하다.
      선택지 4: ‘나’는 δ'([q₀, q₁], 0) = δ(q₀, 0) ∪ δ(q₁, 0) = {q₀, q₁} ∪ Φ = {q₀, q₁}이다. 따라서 δ'함수표에서도 [q₀, q₁]이 되므로 정답이다.

      핵심 개념:
      여러 NFA 상태로 이루어진 DFA 상태의 전이는 각 상태의 전이 결과를 합집합해 구한다.
      δ'([q₀, q₁], a) = δ(q₀, a) ∪ δ(q₁, a)이다.
      공집합(Φ)과의 합집합은 다른 쪽 집합 그대로이다.
      이렇게 새로 나온 상태 집합이 없어질 때까지 표를 채우면 DFA가 완성된다.
    tags: [nfa, dfa, subset-construction]

  - id: l04-01
    type: multiple-choice
    passageRefs: [gl04-dfa-s012-01, gl04-dfa-pascal-01]
    prompt: |
      다음은 오토마타를 구현한 파스칼 프로그램의 일부이다.
      프로그램의 진행으로 보아서 전이함수표가 작성되는 곳은?
    choices:
      - { id: '1', text: 'delta' }
      - { id: '2', text: 'deltabar' }
      - { id: '3', text: 'accept' }
      - { id: '4', text: 'initialize' }
    answers: ['4']
    explanation: |
      선택지 1: delta는 상태 s와 입력기호 c를 받아 다음 상태를 돌려주는 전이함수로, 이미 만들어진 전이함수표를 참조하는 쪽이다.
      선택지 2: deltabar는 상태에서 입력 문자열 전체를 읽어 도달하는 상태를 계산하는 확장 전이함수로, delta를 반복 적용한다.
      선택지 3: accept는 deltabar(s0)의 결과가 종료상태 집합 finalstate에 속하는지 판단한다.
      선택지 4: 주 프로그램은 가장 먼저 initialize를 호출한다. 이후 accept → deltabar → delta 순으로 전이함수표를 사용하므로, 그보다 앞서 실행되는 initialize에서 전이함수표를 만들어야 한다. 정답이다.

      핵심 개념:
      DFA 프로그램은 초기화 → 입력 처리 → 인식 여부 출력 순서로 진행된다.
      initialize: 전이함수표 등 자료를 초기화한다.
      delta(s, c): 한 기호에 대한 전이, deltabar(s): 입력 문자열 전체에 대한 전이이다.
      accept: 최종 상태가 finalstate에 속하면 accepted, 아니면 rejected를 출력하게 한다.
    tags: [dfa, lexical-analyzer-implementation]

  - id: l04-02
    type: multiple-choice
    passageRefs: [gl04-dfa-s012-01, gl04-dfa-pascal-01]
    prompt: 문제1번의 오토마타를 볼 때 밑줄친 finalstate 의 값은?
    choices:
      - { id: '1', text: 'S0' }
      - { id: '2', text: 'S1' }
      - { id: '3', text: 'S2' }
      - { id: '4', text: 'S0, S2' }
    answers: ['3']
    explanation: |
      선택지 1: S0는 start 화살표가 가리키는 시작상태이며 종료상태가 아니다.
      선택지 2: S1은 이중 원으로 표시되지 않았으므로 종료상태가 아니다.
      선택지 3: 상태전이도에서 이중 원으로 표시된 S2가 종료상태이므로 finalstate의 값은 S2이다. 정답이다.
      선택지 4: S0는 종료상태가 아니므로 finalstate에 포함되지 않는다.

      핵심 개념:
      상태전이도에서 시작상태는 start 화살표로, 종료상태는 이중 원으로 표시한다.
      finalstate는 종료상태의 집합 F이다.
      accept := deltabar(s0) in finalstate는 시작상태에서 입력을 모두 읽은 상태가 F에 속하는지 검사한다.
      시작상태가 종료상태를 겸할 수도 있지만 이 오토마타에서는 그렇지 않다.
    tags: [dfa, finite-automata]

  - id: l04-03
    type: multiple-choice
    passageRefs: [gl04-dfa-min-01]
    prompt: |
      다음은 DFA의 상태수를  최소화하는 과정이다.
      다음의 함수전이표에서 동치류가 같지 않은 것은?
    choices:
      - { id: '1', text: 'B' }
      - { id: '2', text: 'C' }
      - { id: '3', text: 'D' }
      - { id: '4', text: 'E' }
    answers: ['3']
    explanation: |
      선택지 1: B는 a에 대해 B, b에 대해 D로 간다. 첫 분할 단계에서 B와 D는 모두 미종료상태 동치류에 속하므로 B는 A, C와 같은 패턴을 보인다. ※ 참고
      선택지 2: C는 a에 대해 B, b에 대해 C로 가며, 두 전이 모두 미종료상태 동치류 안에 머무르므로 A와 같은 패턴이다.
      선택지 3: D는 b에 대해 종료상태 E로 간다. 미종료상태 동치류 {A, B, C, D} 안에서 D만 다른 동치류로 전이하므로 {A, B, C}와 갈라진다. 정답이다.
      선택지 4: E는 종료상태로서 처음부터 미종료상태와 나뉜 동치류 {E}에 속한다. 미종료상태 동치류 안에서 분할을 따지는 대상이 아니다. ※ 참고

      핵심 개념:
      DFA 최소화는 먼저 종료상태 {E}와 미종료상태 {A, B, C, D} 두 동치류로 나눈다.
      같은 동치류의 상태가 어떤 입력에 대해 서로 다른 동치류로 가면 분할한다.
      D는 b로 E(종료상태 동치류)에 가므로 {A, B, C}와 {D}로 나뉜다.
      이후 B가 b로 D에 가므로 다시 {A, C}와 {B}로 나뉘어 최종 동치류는 {A, C}, {B}, {D}, {E}이다.

      ※ 발문에 종료상태가 명시되어 있지 않으며, LMS 해설("D는 종료상태 E를 포함하고 있어서 다르다")에 따라 E를 종료상태로 본다.
      ※ E는 종료상태라 처음부터 별도 동치류 {E}이므로 글자 그대로는 E도 "동치류가 같지 않은 것"에 해당하지만, 인쇄 정답은 미종료상태 동치류 안에서 첫 분할 때 갈라지는 D이므로 이를 유지한다.
      ※ 분할을 끝까지 하면 B도 {A, C}와 다른 동치류가 되지만, 인쇄 정답은 첫 분할에서 갈라지는 D이므로 이를 유지한다.
    tags: [dfa-minimization, equivalence-class]

  - id: l04-04
    type: multiple-choice
    passageRefs: [gl04-dfa-min-01, gl04-dfa-min-class-01]
    prompt: 다음은 DFA의 상태수를 최소화하는 과정이다. 동치류를 표현한 두 번째 표에서 빈칸에 알맞은 것은?
    choices:
      - { id: '1', text: '1 1' }
      - { id: '2', text: '1 2' }
      - { id: '3', text: '2 1' }
      - { id: '4', text: '2 2' }
    answers: ['2']
    explanation: |
      선택지 1: D는 b에 대해 E로 가고 E는 동치류 2에 속하므로 D 칸이 1일 수 없다.
      선택지 2: 빈칸은 입력 b에 대한 C와 D의 칸이다. C는 b에 의해 C로 가므로 동치류 1이고, D는 b에 의해 종료상태 E로 가므로 동치류 2이다. 따라서 1 2가 정답이다.
      선택지 3: C는 b에 의해 자기 자신 C(동치류 1)로 가므로 C 칸이 2일 수 없고, D 칸도 1이 아니다.
      선택지 4: C는 b에 의해 동치류 1인 C로 가므로 C 칸이 2일 수 없다.

      핵심 개념:
      동치류 표의 각 칸에는 그 상태가 입력을 읽고 도착한 상태가 속한 동치류 번호를 적는다.
      처음 동치류는 미종료상태 1 = {A, B, C, D}, 종료상태 2 = {E}이다.
      같은 동치류 안에서 번호 패턴이 다른 상태는 분할한다.
      b 행에서 D만 2가 나오므로 동치류 1은 {A, B, C}와 {D}로 나뉜다.
    tags: [dfa-minimization, equivalence-class]

  - id: l04-05
    type: multiple-choice
    passageRefs: [gl04-fa-abd-intro-01, gl04-fa-abd-01]
    prompt: 유한 오토마타를 보고 정규문법으로 바꾼 내용들이다. 틀린 것은?
    choices:
      - { id: '1', text: 'A → aA | bA' }
      - { id: '2', text: 'A → aB' }
      - { id: '3', text: 'B → bD' }
      - { id: '4', text: 'D → εD' }
    answers: ['4']
    explanation: |
      선택지 1: A에서 a 또는 b를 읽으면 다시 A로 가는 자기 자신 간선이 있으므로 A → aA | bA는 맞다.
      선택지 2: A에서 a를 읽으면 B로 가므로 A → aB는 맞다.
      선택지 3: B에서 b를 읽으면 D로 가므로 B → bD는 맞다.
      선택지 4: D는 종료상태이고 D에서 나가는 간선이 없으므로 D → ε 규칙을 추가해야 한다. D → εD는 D에서 끝없이 D를 만들어 유도를 끝낼 수 없으므로 틀린 규칙이고 정답이다.

      핵심 개념:
      유한 오토마타 → 정규문법: 전이 δ(A, t) = B를 생성규칙 A → tB로 바꾼다.
      종료상태 F에는 F → ε 규칙을 추가한다.
      상태는 논터미널, 입력기호는 터미널, 시작상태는 시작기호가 된다.
      이 오토마타의 정규문법은 A → aA | bA | aB, B → bD, D → ε이다.
    tags: [finite-automata, regular-grammar]

  - id: l04-06
    type: multiple-choice
    passageRefs: [gl04-fa-abd-intro-01, gl04-fa-abd-01]
    prompt: 정규표현으로 표현한 것은?
    choices:
      - { id: '1', text: '(a+b)*ab' }
      - { id: '2', text: '(a+a)*ab' }
      - { id: '3', text: '(a*+b*)ab' }
      - { id: '4', text: 'a(a+b)*b' }
    answers: ['1']
    explanation: |
      선택지 1: A에서 a|b 자기 자신 간선으로 a, b를 임의로 반복한 뒤 a로 B, b로 종료상태 D에 간다. 따라서 (a+b)*ab이고 정답이다.
      선택지 2: (a+a)*는 a*와 같으므로 a*ab가 되어 앞부분에 b가 들어간 bab 같은 문자열을 나타내지 못한다.
      선택지 3: (a*+b*)는 a만 반복하거나 b만 반복한 것 중 하나이므로 abab처럼 a와 b가 섞인 앞부분을 나타내지 못한다.
      선택지 4: a(a+b)*b는 a로 시작해 b로 끝나는 모든 문자열로, abb처럼 ab로 끝나지 않는 문자열도 포함하고 bab처럼 b로 시작하는 문자열은 포함하지 않는다.

      핵심 개념:
      정규문법 A → aA | bA | aB, B → bD, D → ε을 정규표현 방정식으로 풀 수 있다.
      D = ε, B = bD = b, A = aA + bA + aB = (a + b)A + ab이다.
      X = αX + β의 해는 X = α*β이므로 A = (a+b)*ab이다.
      이 오토마타는 a, b로 이루어지고 ab로 끝나는 문자열을 인식한다.
    tags: [finite-automata, regular-expression, regular-equation]

