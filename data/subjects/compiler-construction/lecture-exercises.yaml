    answers: ['4']
    explanation: |
      선택지 1: LEX는 어휘분석기 생성기로, 구문분석기 생성기가 아니다.
      선택지 2: Scan gen은 스캐너(어휘분석기) 생성기이다.
      선택지 3: YACC는 LALR(1) 구문분석기 생성기이지만 Bell 연구소(AT&T)에서 개발되어 AT&T UNIX에 포함되어 배포된 상용 도구였다. 이를 무료 소프트웨어로 다시 만든 YACC 호환 도구가 GNU Bison이다.
      선택지 4: GNU Bison은 무료 소프트웨어이며 YACC에서 사용한 문법 파일(.y)을 그대로 사용할 수 있는 LALR(1) 구문분석기 생성기이다.

      핵심 개념:
      구문분석기 생성기: YACC, Bison, LALRGen 등.
      어휘분석기 생성기: LEX(Flex), Scan gen 등.
      Bison은 GNU 프로젝트의 무료 소프트웨어로 YACC와 호환된다.
      Lex 명세 파일(.l)로 만든 어휘분석기와 Bison 문법 파일(.y)로 만든 구문분석기를 함께 컴파일해 사용한다.
    tags: [parser-generator]

  - id: l13-05
    type: multiple-choice
    passageRefs: [gl13-yacc-format-01]
    prompt: 다음과 같은 형식을 입력으로 하는 구문 분석 생성기는?
    choices:
      - { id: '1', text: 'LEX' }
      - { id: '2', text: 'Scan gen' }
      - { id: '3', text: 'YACC' }
      - { id: '4', text: 'LALR GEN' }
    answers: ['3']
    explanation: |
      선택지 1: LEX 입력도 %%로 나뉜 세 부분이지만 정의 부분, 변환규칙 부분, 사용자 부프로그램 부분이며, LEX는 구문분석기가 아니라 어휘분석기 생성기이다.
      선택지 2: Scan gen은 어휘분석기(스캐너) 생성기이다.
      선택지 3: 선언 부분 %% 변환규칙 부분 %% 사용자 프로그램 부분 형식을 입력으로 받는 구문분석기 생성기는 YACC이다.
      선택지 4: LALR GEN도 구문분석기 생성기의 하나이지만, 이 선언·변환규칙·사용자 프로그램 부분의 %% 입력 형식은 YACC의 형식이다.

      핵심 개념:
      YACC 입력 파일은 선언 부분, 변환규칙 부분, 사용자 프로그램 부분을 %%로 구분한다.
      선언 부분에는 토큰과 우선순위, 변환규칙 부분에는 생성규칙과 수행코드를 적는다.
      사용자 프로그램 부분에는 보조 C 함수를 적는다.
      LEX도 %%로 세 부분을 나누지만 어휘분석기 생성기라는 점이 다르다.
    tags: [yacc]

  # ── 14강 의미분석과 중간언어 ──
  - id: l14-01
    type: multiple-choice
    prompt: 다음은 의미분석 과정에서 하는 일들에 대한 설명이다. 틀린 것은?
    choices:
      - {
          id: '1',
          text: '상수의 이름이 기호표에 들어가고, 각 상수는 정의된 값을 기호표에 보관하여, 이후 적당한 기회에 기억장소를 배정받고 초기값을 갖는다.',
        }
      - {
          id: '2',
          text: '주어진 생성규칙들의 의미에 의하여 유형의 해당 자료구조가 구성되며, 유형설명자를 만들어서 이후 유형들이 기억장소 배정을 받을 때 필요한 정보를 제공하게 한다.',
        }
      - {
          id: '3',
          text: '선언되는 변수들이 선언된 유형에 의하여 설명자가 주어지고 변수명칭과 유형 설명자가 모두 같이 기호표에 들어가며 기억장소를 배정 받는다.',
        }
      - {
          id: '4',
          text: '문법의 각 생성규칙들과 그와 결합된 의미수행코드들을 구성하고  호출되면 중간코드를 만든다.',
        }
    answers: ['4']
    explanation: |
      선택지 1: 상수정의의 의미분석으로, 상수 이름과 값을 기호표에 보관한 뒤 기억장소를 배정받고 초기값을 갖는다. 옳은 설명이다.
      선택지 2: 유형정의의 의미분석으로, 생성규칙의 의미에 따라 유형의 자료구조와 유형설명자를 만들어 이후 기억장소 배정에 필요한 정보를 제공한다. 옳은 설명이다.
      선택지 3: 변수선언의 의미분석으로, 변수명칭과 유형 설명자를 기호표에 넣고 기억장소를 배정한다. 옳은 설명이다.
      선택지 4: 생성규칙마다 의미수행코드를 결합해 두고 그 규칙이 적용될 때 호출해 중간코드를 만드는 것은 중간코드 생성 방법인 구문지시적 변환(syntax-directed translation)에 대한 설명이다. 선언문의 의미분석에서 하는 일이 아니다.

      핵심 개념:
      선언문의 의미분석은 상수정의, 유형정의, 변수선언을 처리해 기호표에 필요한 정보를 넣고 기억장소를 배정한다.
      실행문의 의미분석은 기호표를 이용해 중간코드를 생산한다.
      구문지시적 변환은 각 생성규칙에 의미수행코드를 붙여 구문분석과 동시에 중간코드를 만드는 방법이다.
      기호표는 의미분석과 코드 생성 전 과정에서 식별자 정보를 제공한다.
    tags: [semantic-analysis, symbol-table]

  - id: l14-02
    type: multiple-choice
    prompt: |
      다음은 의미분석에 대한 설명이다.  빈칸 ‘가’, ‘나’, ‘다’ 에 각각 알맞은 것을 순서대로 나열한 것은?

      ( 가 ) 이외의 ( 나 )의 의미분석은 ( 다 ) 를 이용하여 중간코드를 생산하는 일을 하게 된다. 여러 가지 형태의 문들을 원래 뜻과 같은 중간코드로 생산하는 것이 의미분석의 목표가 된다.
    choices:
      - { id: '1', text: '선언문-실행문-기호표' }
      - { id: '2', text: '선언문-실행문-해쉬함수' }
      - { id: '3', text: '선언문-실행문-트리구조' }
      - { id: '4', text: '선언문-실행문-선형리스트' }
    answers: ['1']
    explanation: |
      선택지 1: 선언문 이외의 실행문의 의미분석은 선언문 처리에서 만든 기호표를 이용해 중간코드를 생산한다. 빈칸이 모두 맞는다.
      선택지 2: 해쉬함수는 기호표를 해시표로 구성할 때 이름의 위치를 계산하는 수단일 뿐, 실행문의 의미분석이 이용하는 정보 저장소가 아니다.
      선택지 3: 트리구조(이진트리)는 기호표를 구성하는 방법의 하나로, 실행문 의미분석이 이용하는 대상은 기호표 자체이다.
      선택지 4: 선형리스트도 기호표 구성 방법의 하나일 뿐이므로 ‘다’에 들어갈 말로 알맞지 않다.

      핵심 개념:
      의미분석은 선언문의 의미분석과 실행문의 의미분석으로 나뉜다.
      선언문의 의미분석은 식별자의 속성을 기호표에 넣고 기억장소를 배정한다.
      실행문의 의미분석은 기호표를 참조해 여러 형태의 문을 원래 뜻과 같은 중간코드로 바꾼다.
      기호표는 선형리스트, 이진트리, 해시표 등으로 구성할 수 있다.
    tags: [semantic-analysis, symbol-table]

  - id: l14-03
    type: multiple-choice
    prompt: 기호표에 n 개의 식별자 개수가 있을 때 삽입과 조회 연산의 평균시간에 대한 설명이다.  틀린 것은?
    choices:
      - {
          id: '1',
          text: '선형 리스트 구조 : t개의 이름에 대한 삽입과 m개의 조회에 대한 모든 시간은 c(t+m)이다. 단,  c 는 연산에 필요한 평균시간',
        }
      - {
          id: '2',
          text: '이진트리 구조 : t개의 이름을 삽입하는 데 필요한 시간은 t log n이고, m개의 조회를 하는 데 필요한 시간은 m log n이다.',
        }
      - {
          id: '3',
          text: '이진트리 구조 : t개의 이름 삽입과 m개의 조회에 필요한 시간은 (t+m)log n 이다. 만일 n이 50보다 크다면 선형리스트보다 효율적이다.',
        }
      - {
          id: '4',
          text: '해쉬기호표 : t개의 식별자 이름의 추가와 m개의 조회가 있다면, 전체적으로 필요한 시간은 (t+m)log k 이다. 단, 해쉬표가 k개의 단어로 구성되어 있다.',
        }
    answers: ['4']
    explanation: |
      선택지 1: 선형 리스트는 이름 하나를 삽입·조회할 때 평균 $c=\frac{n}{2}$의 시간이 들므로 전체 시간은 $c(t+m)$이다. 옳은 설명이다.
      선택지 2: 이진트리에서 이름 하나의 삽입·조회는 $\log n$에 비례하므로 삽입 $t$개는 $t\log n$, 조회 $m$개는 $m\log n$이다. 옳은 설명이다.
      선택지 3: 두 시간을 합하면 $(t+m)\log n$이고, $n$이 커질수록 $\log n$이 $\frac{n}{2}$보다 훨씬 작아 선형 리스트보다 효율적이다. 옳은 설명이다.
      선택지 4: 해시표의 크기가 $k$이면 한 번의 조회시간은 $\frac{n}{k}$에 비례하므로 전체 시간은 $\frac{n}{k}(t+m)$에 비례한다. $(t+m)\log k$는 틀린 설명이다.

      핵심 개념:
      $t$개의 식별자 추가와 $m$개의 조회에 필요한 시간은 기호표 구성 방법에 따라 다르다.
      선형 리스트: $c(t+m)$, $c=\frac{n}{2}$.
      이진 탐색 트리: $(t+m)\log n$.
      해시표(크기 $k$): $\frac{n}{k}(t+m)$으로 가장 효율적이다.
    tags: [symbol-table]

  - id: l14-04
    type: multiple-choice
    chapter: 7
    prompt: 번역과정에서 중간언어를 사용함으로써 얻어지는 장점이 아닌 것은?
    choices:
      - { id: '1', text: '원시 프로그램의 이식성(portability)을 증가시킬 수 있다.' }
      - {
          id: '2',
          text: '고급 원시언어와 저급 목적코드간의 의미적 차이를 이어주는 교량 역할을 중간코드가 담당함으로써 번역과정이 좀더 쉽게 표현되고 효율적으로 처리될 수 있다.',
        }
      - {
          id: '3',
          text: '중간코드를 이용하여 최적화를 수행함으로써 기계와 독립적인 최적화가 가능해졌으며 또한 기계코드로 바뀐 상태에서 행하는 것보다 훨씬 효율적인 최적화를 수행할 수 있다.',
        }
      - {
          id: '4',
          text: '중간언어를 사용함으로써 목적코드로 직접 번역하는 것보다 효율적인 코드를 생산한다.',
        }
    answers: ['4']
    explanation: |
      선택지 1: 중간코드까지는 기계와 무관하게 만들고 뒷단만 바꾸면 되므로 이식성이 높아진다. 장점이다.
      선택지 2: 고급 원시언어와 저급 목적코드 사이의 의미적 차이를 중간코드가 이어주어 번역과정이 단순해진다. 장점이다.
      선택지 3: 중간코드 단계에서 기계와 독립적인 최적화를 할 수 있고, 기계코드에서 하는 것보다 효율적으로 최적화할 수 있다. 장점이다.
      선택지 4: 중간코드 생성 과정을 한 번 더 거치므로 목적코드로 직접 번역하는 것보다 컴파일 시간이 더 걸리고, 일반적으로 생성되는 코드도 직접 번역한 것보다 비효율적이다. 따라서 장점이 아니다.

      핵심 개념:
      중간언어는 원시 프로그램과 목적 프로그램 사이에서 번역을 돕는 언어이다.
      장점: 이식성 증가, 번역과정의 단순화, 기계 독립적인 최적화.
      단점: 번역 단계가 늘어 컴파일 시간이 길어지고, 직접 번역보다 비효율적인 코드가 나올 수 있다.
      대표적인 중간언어로 후위표현, 3-주소 코드(triple, 간접 triple, quadruple), U코드 등이 있다.
    tags: [intermediate-language]

  - id: l14-05
    type: multiple-choice
    chapter: 7
    prompt: 다음 중 인터프리터에서 많이 사용되며 코드 이동을 할 수가 없어서 최적화에는 부적합한 중간언어는?
    choices:
      - { id: '1', text: '후위표현' }
      - { id: '2', text: 'triple 표현' }
      - { id: '3', text: '간접 triple 표현' }
      - { id: '4', text: 'quadruple 표현' }
    answers: ['1']
    explanation: |
      선택지 1: 후위표현은 산술연산자를 괄호 없이 표현하고 연산자 스택으로 쉽게 계산할 수 있으며, 원시 프로그램에서 쉽고 빠르게 변환되어 인터프리터의 중간언어로 적합하다. 그러나 코드 이동을 할 수 없어 최적화에는 부적합하다.
      선택지 2: triple은 연산자와 피연산자 2개로 구성된 3-주소 코드로, 컴파일러의 중간코드로 쓰인다. 결과를 명령어 위치로 참조하므로 코드 이동이 어렵다는 문제는 있지만 인터프리터용 중간언어로 대표되는 형태는 아니다.
      선택지 3: 간접 triple은 triple의 실행 순서를 별도 목록으로 관리해 코드 이동을 쉽게 만든 표현으로 최적화에 유리하다.
      선택지 4: quadruple은 결과 필드를 따로 두어 명령어 순서를 바꾸기 쉬우므로 최적화에 유리하다.

      핵심 개념:
      후위표현(postfix)은 연산자를 피연산자 뒤에 두어 괄호가 필요 없다.
      스택으로 바로 계산할 수 있어 인터프리터를 사용하는 언어의 중간언어로 적합하다.
      코드의 위치를 옮겨 가며 개선하는 최적화에는 3-주소 코드가 더 적합하다.
      quadruple과 간접 triple은 코드 이동이 쉬워 최적화에 유리하다.
    tags: [intermediate-language, three-address-code]

  - id: l14-06
    type: multiple-choice
    chapter: 7
    passageRefs: [gl14-quadruple-01]
    prompt: 다음은 A := -B *(C+D)를 3 주소 코드로 표현한 것이다. 이 방법의 이름은?
    choices:
      - { id: '1', text: 'triple' }
      - { id: '2', text: '간접 triple' }
      - { id: '3', text: 'U코드' }
      - { id: '4', text: 'quadruple' }
    answers: ['4']
    explanation: |
      선택지 1: triple은 op, 피연산자 1, 피연산자 2의 세 필드만 가지며, 결과는 명령어 번호((0), (1) 등)로 참조한다. 결과 필드가 있는 이 표와 다르다.
      선택지 2: 간접 triple은 triple 목록과 실행 순서를 나타내는 별도 목록으로 구성되며, 역시 결과 필드가 없다.
      선택지 3: U코드는 가상 기계를 위한 중간언어로, 이런 3-주소 코드 표 형식이 아니다.
      선택지 4: op, 피연산자 1, 피연산자 2, 결과의 네 부분으로 구성되고 임시변수 T₁, T₂, T₃에 결과를 저장하므로 quadruple이다.

      핵심 개념:
      quadruple은 (op, 피연산자 1, 피연산자 2, 결과)의 4개 필드를 가진 3-주소 코드 표현이다.
      A := -B*(C+D)는 T₁ := uminus B, T₂ := C + D, T₃ := T₁ * T₂, A := T₃ 순으로 표현된다.
      결과를 임시변수 이름으로 가리키므로 명령어 순서를 바꾸어도 참조가 깨지지 않아 최적화에 유리하다.
      triple은 임시변수 대신 명령어 위치로 결과를 참조해 기억공간을 줄인다.
    tags: [three-address-code, quadruple]

  # ── 15강 코드의 최적화와 코드의 생성 ──
  - id: l15-01
    type: multiple-choice
    prompt: 다음은 최적화의 분류에 관한 설명이다. 틀린 것은?
    choices:
      - { id: '1', text: '지역최적화(local)와 전역최적화(global)' }
      - { id: '2', text: '단일문에서의 최적화와 루프(loop)에서의 최적화' }
      - { id: '3', text: '실행속도 측면과 기억장소 절약측면에서 최적화' }
      - { id: '4', text: '중복명령어의 최적화와 제어흐름 최적화' }
    answers: ['4']
    explanation: |
      선택지 1: 최적화 범위에 따라 기본 블록 안에서 하는 지역최적화와 여러 블록에 걸친 전역최적화로 나눈다. 옳은 분류이다.
      선택지 2: 최적화 대상에 따라 단일문에서의 최적화와 반복되는 루프에서의 최적화로 나눈다. 옳은 분류이다.
      선택지 3: 최적화 목적에 따라 실행속도를 높이는 최적화와 기억장소를 절약하는 최적화로 나눈다. 옳은 분류이다.
      선택지 4: 중복명령어 제거나 제어흐름 개선은 개별 최적화 기법(예: 핍홀 최적화에서 다루는 기법)일 뿐, 최적화를 분류하는 기준이 아니므로 틀린 것이다.

      핵심 개념:
      최적화란 실행속도를 높이고 기억장소를 절약하도록 코드를 개선하는 것이다.
      최적화는 지역/전역, 단일문/루프, 실행속도/기억장소 측면으로 구분해 볼 수 있다.
      개별 기법으로는 상수전파, 복사전파, 공통 부분식 제거, 루프 최적화 등이 있다.
      분류 기준과 개별 기법을 구분해 기억해야 한다.
    tags: [code-optimization]

  - id: l15-02
    type: multiple-choice
    prompt: 최적화를 위하여 치환문을 삭제하고 삭제된 치환문의 l-value 대신에 r-value를 사용하는 것은?
    choices:
      - { id: '1', text: '상수전파' }
      - { id: '2', text: '복사전파' }
      - { id: '3', text: '루프전개' }
      - { id: '4', text: '루프융합' }
    answers: ['2']
    explanation: |
      선택지 1: 상수전파는 변수에 대입된 상수 값을 그 변수의 사용 위치에 직접 넣는 최적화로, 변수를 다른 변수로 바꾸는 것이 아니다.
      선택지 2: 복사전파는 A := B … C := A + D를 C := B + D처럼 바꾸어, 치환문 A := B를 삭제하고 l-value인 A 대신 r-value인 B를 사용하는 최적화이다.
      선택지 3: 루프전개는 루프 몸체를 여러 번 복제해 반복 횟수와 루프 제어 부담을 줄이는 최적화이다.
      선택지 4: 루프융합은 같은 범위를 도는 인접한 루프들을 하나의 루프로 합치는 최적화이다.

      핵심 개념:
      l-value는 기억장소의 주소, r-value는 기억장소에 있는 값을 뜻한다.
      A := B에서 A는 l-value이고, 뒤의 C := A + D에서 A는 값을 나타내는 r-value이다.
      복사전파는 A := B 이후 A의 사용을 B로 바꾸고 치환문 A := B를 삭제한다.
      치환문이 없어지므로 변수 A의 기억장소와 명령어를 절약할 수 있다.
    tags: [code-optimization]

  - id: l15-03
    type: multiple-choice
    prompt: 다음  코드최적화 방법 중  소요 기억용량의 최적화 방법과 가장 거리가 먼 것은?
    choices:
      - { id: '1', text: '루프전개' }
      - { id: '2', text: '복사전파' }
      - { id: '3', text: '레지스터 할당' }
      - { id: '4', text: '부프로그램화' }
    answers: ['1']
    explanation: |
      선택지 1: 루프전개는 루프 몸체를 여러 번 복제해 실행속도를 높이는 최적화로, 코드가 길어져 기억장소가 오히려 늘어날 수 있다. 소요 기억용량의 최적화와 가장 거리가 멀다.
      선택지 2: 복사전파는 A := B 같은 치환문을 삭제해 변수와 명령어를 줄이므로 기억용량을 절약한다.
      선택지 3: 레지스터 할당은 자주 쓰는 값을 레지스터에 두어 기억장소 사용과 적재·저장 명령을 줄인다.
      선택지 4: 부프로그램화는 여러 곳에 반복되는 코드를 하나의 부프로그램으로 만들어 호출하게 하므로 코드 크기를 줄인다.

      핵심 개념:
      최적화는 실행시간을 짧게 하는 최적화와 소요 기억용량의 최적화로 나눌 수 있다.
      소요 기억용량의 최적화는 명령어와 변수가 차지하는 기억장소를 줄이는 것이 목적이다.
      루프전개처럼 속도를 위해 코드를 복제하는 기법은 기억장소를 더 쓴다.
      속도와 기억장소는 서로 상충하는 경우가 많다.
    tags: [code-optimization]

  - id: l15-04
    type: multiple-choice
    chapter: 9
    prompt: 다음 중 목적코드를 생성하는 데 고려사항으로서 적합하지 않은 것은?
    choices:
      - { id: '1', text: '어떤 명령어를 생산할 것인가?' }
      - { id: '2', text: '계산과정을 어떤 순서로 할 것인가?' }
      - { id: '3', text: '중간코드를 어떻게 분석할 것인가?' }
      - { id: '4', text: '피연산자를 레지스터에 어떻게 배정할 것인가?' }
    answers: ['3']
    explanation: |
      선택지 1: 대상 기계의 명령어 중 어떤 명령어를 생산할지 정하는 명령어 선택은 목적코드 생성의 고려사항이다.
      선택지 2: 계산 순서에 따라 필요한 레지스터와 명령어 수가 달라지므로 계산과정의 순서를 정하는 것은 고려사항이다.
      선택지 3: 중간코드를 분석하는 일은 목적코드 생성에서 고려할 세 가지 사항에 들지 않는다. 중간코드는 앞 단계에서 이미 만들어져 목적코드 생성의 입력으로 주어진다.
      선택지 4: 피연산자를 어느 레지스터에 둘지 정하는 레지스터 배정은 목적코드 생성의 고려사항이다.

      핵심 개념:
      목적코드 생성은 중간코드를 입력받아 대상 기계의 목적코드를 만드는 단계이다.
      고려사항은 어떤 명령어를 생산할 것인가, 계산과정을 어떤 순서로 할 것인가, 피연산자를 레지스터에 어떻게 배정할 것인가의 세 가지이다.
      레지스터는 기억장소보다 빠르지만 수가 적으므로 배정 방법이 코드 효율을 좌우한다.
      목적코드는 기계어나 어셈블리어 형태로 생성된다.
    tags: [code-generation]

  - id: l15-05
    type: multiple-choice
    chapter: 9
    prompt: 다음 중 목적코드 설계상 중요한 것으로 볼 수 없는 것은?
    choices:
      - { id: '1', text: '프로시저의 입구/출구의 목적 프로그램' }
      - { id: '2', text: '프로시저 호출의 목적 프로그램' }
      - { id: '3', text: '변수의 기억영역 할당 목적 프로그램' }
      - { id: '4', text: '코드 이동의 목적 프로그램' }
    answers: ['4']
    explanation: |
      선택지 1: 프로시저의 입구와 출구에서 환경을 저장·복원하는 목적 프로그램은 목적코드 설계상 중요한 요소이다.
      선택지 2: 매개변수 전달과 복귀 주소 처리를 포함하는 프로시저 호출의 목적 프로그램은 중요한 요소이다.
      선택지 3: 변수의 기억영역 할당과 로드(load)/저장(store)의 목적 프로그램은 중요한 요소이다.
      선택지 4: 코드 이동은 코드를 루프 밖으로 옮기는 등의 코드 최적화 기법이며, 목적코드 설계상 중요한 목적 프로그램으로 꼽는 항목이 아니다.

      핵심 개념:
      목적코드 설계에서는 산술식과 논리식의 목적코드가 기본이 된다.
      그 밖에 프로시저의 입구/출구, 프로시저 호출, 변수의 기억영역 할당과 로드/저장의 목적 프로그램이 중요하다.
      코드 이동은 목적코드 생성이 아니라 최적화 단계에서 다루는 기법이다.
      각 목적 프로그램은 대상 기계의 명령어로 구성된다.
    tags: [code-generation, object-program]

  - id: l15-06
    type: multiple-choice
    chapter: 9
    prompt: 산술식에 대한 목적코드를 생성하기 위해서 우선적으로 알아야 하는 것은?
    choices:
      - { id: '1', text: '누산기(accumulator)의 갯수' }
      - { id: '2', text: '프로그램 카운터(program counter)' }
      - { id: '3', text: '스택 포인터(stack pointer)' }
      - { id: '4', text: '기호표의 크기' }
    answers: ['1']
    explanation: |
      선택지 1: 산술식의 계산 결과를 담는 누산기가 몇 개인지에 따라 중간 결과를 작업용 번지에 저장할지, 어떤 순서로 계산할지가 달라지므로 먼저 알아야 한다.
      선택지 2: 프로그램 카운터는 다음에 실행할 명령어의 주소를 가리키는 레지스터로, 산술식 코드 생성 방식을 정하는 요소가 아니다.
      선택지 3: 스택 포인터는 스택의 꼭대기를 가리키는 레지스터로, 프로시저 호출 등에서 쓰이며 산술식 코드 생성에서 우선 고려할 요소가 아니다.
      선택지 4: 기호표의 크기는 식별자 관리와 관련된 것으로 산술식의 목적코드 형태를 결정하지 않는다.

      핵심 개념:
      산술식의 목적코드를 생성하려면 먼저 누산기(accumulator)의 개수를 알아야 한다.
      누산기가 하나뿐이면 먼저 계산한 부분식의 결과를 작업용 번지에 STORE해 두어야 한다.
      LOAD는 기억장소 값을 누산기로 가져오고, STORE는 누산기 값을 기억장소에 저장한다.
      ADD, MULT 등은 누산기 값과 지정한 번지의 값을 연산한다.
    tags: [code-generation]
