    type: text
    body: ※(2-4) 다음은 주어진 문법을 보고 id*id+id를 shift-reduce 구문분석하는 과정이다.

  - id: gl07-sr-grammar-01
    type: code
    language: text
    body: |
      1) E → E * E
      2) E → E + E
      3) E → id

