    answers: ['3']
    explanation: |
      선택지 1: 상태 0은 시작 상태로 스택 맨 아래에 이미 있으며, GOTO[0, E]의 값은 0이 아니다.
      선택지 2: reduce는 스택 꼭대기 상태와 입력으로 ACTION 표를 찾아 정하는 동작인데, 20단계 스택 꼭대기는 상태가 아니라 비단말 E이다.
      선택지 3: 20단계 스택 0E에서 E 아래 상태는 0이고 GOTO[0, E] = 1이므로 goto 1이다. 그 결과 21단계 스택이 0E1이 된다.
      선택지 4: 비단말 E로의 전이는 shift가 아니라 GOTO 함수로 처리한다.

