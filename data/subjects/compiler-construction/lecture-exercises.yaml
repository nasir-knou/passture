  - id: gl07-grammar-etf-01
    type: code
    language: text
    body: |
      1) E → E + T
      2) E → T
      3) T → T * F
      4) T → F
      5) F → (E)
      6) F → id

  - id: gl08-precedence-01
    type: code
    language: text
    body: |
      E → E1 → T1 → T → T*F
                  → T * id  (‘가’)
                  → F * id   F ·> *
                  → id * id   id ·> *

