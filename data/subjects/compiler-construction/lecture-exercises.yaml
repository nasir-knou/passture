  - id: gl09-lr0-goto-e-01
    type: code
    language: text
    body: |
      1. canonical collection
          I₀ : closure ([S' → ·E]) ={[S' → ·E], [E → ·E+T], [E → ·T],
               [T → ·T*F], [T → ·F], [F → ·(E)], [F → ·id]}
          I₁ = GOTO (I₀, E)
          I₂ = GOTO (I₀, T)
          I₃ = GOTO (I₀, F)
            :
          I₇ = GOTO (I₂, * )

       [보기]
            (가) [T → F·]
            (나) [E → T·], [T → T·*F]
            (다) [S' → E·], [E → E·+T]
              (라) [T → T*·F], [F → (E)], [F → id]

  - id: gl09-lr0-goto-t-01
    type: code
    language: text
    body: |2
          I₀ : closure ([S' → ·E])
          ={[S' → ·E], [E → ·E+T], [E → ·T],
            [T → ·T*F], [T → ·F], [F → ·(E)], [F → ·id]}

      [보기]      (가) [F → id·]
             (나) [T → F·]
             (다) [E → T·], [T → T·*F]
             (라) [S' → E·], [E → E·+T]

  - id: gl09-lr0-i0-01
