  - id: l06-01
    type: multiple-choice
    passageRefs: [gl06-grammar-aas-intro-01, gl06-grammar-aas-01, gl06-deriv-aaaa-01]
    prompt: 다음은 aaaa를 좌단유도하는 과정이다. 빈 칸에 알맞은 것은?
    choices:
      - { id: '1', text: 'aAa' }
      - { id: '2', text: 'aaSS' }
      - { id: '3', text: 'aSSa' }
      - { id: '4', text: 'aSSS' }
    answers: ['4']
    explanation: |
      선택지 1: aAa는 aAS에서 오른쪽 S를 먼저 a로 바꾼 문장형으로, 우단유도 과정에 나타난다.
      선택지 2: aaSS는 aSSS에서 가장 왼쪽 S를 a로 바꾼 문장형으로, 좌단유도의 세 번째 단계이지 빈 칸(두 번째 단계)이 아니다.
      선택지 3: aSSa는 우단유도에서 aAa의 A에 A → SS를 적용한 문장형이다.
      선택지 4: aAS에서 가장 왼쪽 논터미널 A에 A → SS를 적용하면 aSSS가 된다. 이어서 S ⇒ a를 왼쪽부터 세 번 적용하면 aSSS ⇒ aaSS ⇒ aaaS ⇒ aaaa이므로 정답이다.

      핵심 개념:
      좌단유도는 매 단계에서 가장 왼쪽 논터미널을 대치하는 유도이다.
      aaaa의 좌단유도는 S ⇒ aAS ⇒ aSSS ⇒ aaSS ⇒ aaaS ⇒ aaaa이다.
      A → SbA나 A → b를 쓰면 b가 생기므로 aaaa를 만들려면 A → SS를 적용해야 한다.
      좌단유도에 적용된 생성규칙 순서를 좌파스(left parse)라고 한다.
    tags: [leftmost-derivation]

  - id: l06-02
    type: multiple-choice
    passageRefs: [gl06-grammar-aas-intro-01, gl06-grammar-aas-01, gl06-deriv-aaaa-01]
    prompt: 다음은 aaaa 를 우단유도하는 과정이다. 빈 칸에 알맞은 것은?
    choices:
      - { id: '1', text: 'aAa' }
      - { id: '2', text: 'aaSS' }
      - { id: '3', text: 'aSSa' }
      - { id: '4', text: 'aSSS' }
    answers: ['1']
    explanation: |
      선택지 1: aAS에서 가장 오른쪽 논터미널 S에 S → a를 적용하면 aAa가 된다. 이어서 aAa ⇒ aSSa ⇒ aSaa ⇒ aaaa로 유도되므로 정답이다.
      선택지 2: aaSS는 좌단유도에서 aSSS의 가장 왼쪽 S를 먼저 바꾼 문장형이다.
      선택지 3: aSSa는 aAa의 A에 A → SS를 적용한 우단유도의 세 번째 단계이지 빈 칸(두 번째 단계)이 아니다.
      선택지 4: aSSS는 aAS에서 가장 왼쪽 A를 먼저 대치한 좌단유도의 문장형이다.

      핵심 개념:
      우단유도는 매 단계에서 가장 오른쪽 논터미널을 대치하는 유도이다.
      aaaa의 우단유도는 S ⇒ aAS ⇒ aAa ⇒ aSSa ⇒ aSaa ⇒ aaaa이다.
      같은 문장이라도 좌단유도와 우단유도의 중간 문장형은 서로 다르다.
      우단유도를 거꾸로 따라가는 것이 bottom-up 구문분석의 과정이다.
    tags: [rightmost-derivation]

  - id: l06-03
    type: multiple-choice
    passageRefs: [gl06-ambiguous-01]
    prompt: |
      다음의 문법을 보고 답하라.

      위 문법의 특성은?
    choices:
      - { id: '1', text: '모호하다.' }
      - { id: '2', text: '정규 문법이다.' }
      - { id: '3', text: '유일한 유도트리를 생성한다.' }
      - { id: '4', text: '단일 생성 규칙을 갖는다.' }
    answers: ['1']
    explanation: |
      선택지 1: id + id * id를 우단유도하면 E ⇒ E + E ⇒ E + E * E ⇒ E + E * id ⇒ E + id * id ⇒ id + id * id와 E ⇒ E * E ⇒ E * id ⇒ E + E * id ⇒ E + id * id ⇒ id + id * id의 두 가지가 가능하다. 서로 다른 유도트리가 생기므로 모호한 문법이고 정답이다.
      선택지 2: 정규문법은 A → tB, A → t 꼴만 허용하는데, E → E + E는 오른쪽에 논터미널이 두 개 있으므로 정규문법이 아니다.
      선택지 3: 같은 문장에 대해 두 개의 유도트리가 생기므로 유일한 유도트리를 생성하지 않는다.
      선택지 4: 단일 생성규칙은 A → B처럼 오른쪽이 논터미널 하나뿐인 규칙이다. id를 토큰(터미널)으로 보면 이 문법에는 그런 규칙이 없다. ※ 참고

      핵심 개념:
      모호성은 한 문장에 대해 유도트리가 두 개 이상 존재하는 성질이다.
      E → E + E | E * E | id는 연산자 우선순위와 결합법칙이 정해져 있지 않아 모호하다.
      같은 우단유도라도 처음에 E + E를 쓰느냐 E * E를 쓰느냐에 따라 트리가 달라진다.
      연산자 우선순위와 결합법칙을 문법에 반영하면 모호성을 제거할 수 있다.

      ※ 지문에 id → 숫자 규칙이 있어 id를 논터미널로 보면 E → id는 A → B 꼴의 단일 생성규칙이 된다. 인쇄 정답은 모호성을 묻는 "모호하다." 선택지이며 이를 유지한다.
    tags: [ambiguity, unit-production]

  - id: l06-04
    type: multiple-choice
    passageRefs: [gl06-eps-free-01]
    prompt: 다음 문법을 ε-free 문법으로 바꾸려 한다.  빈칸에 알맞지 않은 것은?
    choices:
      - { id: '1', text: 'ba' }
      - { id: '2', text: 'SaS' }
      - { id: '3', text: 'baS' }
      - { id: '4', text: 'bSaS' }
    answers: ['2']
    explanation: |
      선택지 1: bSaS의 두 S에 모두 ε을 대입하면 ba가 생성되므로 빈칸에 알맞다.
      선택지 2: bSaS의 S에 ε을 대입해도 맨 앞의 터미널 b는 없어지지 않는다. 따라서 SaS는 생성되지 않으므로 알맞지 않은 것이고 정답이다.
      선택지 3: bSaS의 첫 번째 S에 ε을 대입하면 baS가 생성되므로 빈칸에 알맞다.
      선택지 4: ε을 대입하지 않은 원래 규칙 bSaS도 그대로 포함되므로 빈칸에 알맞다.

      핵심 개념:
      ε-free 문법은 시작기호 외에는 ε-생성규칙이 없는 문법이다.
      S → ε가 있으면 오른쪽의 S 각각을 남기거나 지운 모든 경우의 규칙을 추가한다.
      bSaS에서 두 S를 남기거나 지우면 bSaS, baS, bSa, ba의 4가지가 나온다.
      시작기호가 ε을 생성해야 하므로 새 시작기호 S′를 두고 S′ → S | ε를 추가한다.
    tags: [epsilon-production]

  - id: l06-05
    type: multiple-choice
    passageRefs: [gl06-left-factoring-01]
    prompt: 다음 문법과 관계없는 것은?
    choices:
      - { id: '1', text: '같은 기호들을 prefix로 갖는 2개 이상의 생성규칙이 존재한다.' }
      - { id: '2', text: 'left-factoring을 해 주면 문제가 해결된다.' }
      - { id: '3', text: '단일 생성규칙을 갖고 있다.' }
      - { id: '4', text: 'backtracking 이 발생한다.' }
    answers: ['3']
    explanation: |
      선택지 1: A → a와 A → ab는 같은 기호 a를 prefix(공통 접두사)로 가지므로 이 문법과 관계있다.
      선택지 2: A → aA', A' → ε | b처럼 공통 접두사를 묶는 left-factoring을 하면 backtracking 문제가 해결되므로 관계있다.
      선택지 3: 단일 생성규칙은 A → B처럼 오른쪽이 논터미널 하나뿐인 규칙인데, S → cAd와 A → a | ab에는 그런 규칙이 없다. 이 문법과 관계없으므로 정답이다.
      선택지 4: cabd를 top-down으로 분석할 때 A → a를 먼저 적용하면 실패해 되돌아가 A → ab를 적용해야 하므로 backtracking이 발생한다. 관계있다.

      핵심 개념:
      top-down 구문분석에서 같은 prefix를 가진 규칙이 여럿이면 어느 규칙을 쓸지 몰라 backtracking이 생긴다.
      left-factoring은 공통 접두사를 묶어 A → αβ₁ | αβ₂를 A → αA', A' → β₁ | β₂로 바꾼다.
      이 문법의 left-factoring 결과는 S → cAd, A → aA', A' → ε | b이다.
      단일 생성규칙 제거, ε-생성규칙 제거, left-factoring은 서로 다른 문법 변환이다.
    tags: [left-factoring, backtracking]

  - id: l06-06
    type: multiple-choice
    prompt: |
      푸시다운 오토마타는 7개의 요소로 구성된다.
      M = (Q, Σ, T, δ, $q_0$, $z_0$, F)
      다음 설명 중 틀린 것은?
    choices:
      - { id: '1', text: 'Q : 상태들의 유한집합' }
      - { id: '2', text: 'Σ : 입력기호들의 유한집합' }
      - { id: '3', text: 'T : 스택기호들의 유한집합' }
      - { id: '4', text: '$z_0$ : 시작상태' }
    answers: ['4']
    explanation: |
      선택지 1: Q는 푸시다운 오토마타의 상태들의 유한집합이므로 옳은 설명이다.
      선택지 2: Σ는 입력기호들의 유한집합이므로 옳은 설명이다.
      선택지 3: T는 스택에 넣을 수 있는 스택기호들의 유한집합이므로 옳은 설명이다.
      선택지 4: $z_0 \in T$는 시작상태가 아니라 스택의 시작기호이다. 시작상태는 $q_0 \in Q$이므로 틀린 설명이고 정답이다.

      핵심 개념:
      푸시다운 오토마타 $M = (Q, \Sigma, T, \delta, q_0, z_0, F)$의 요소는 7개이다.
      $q_0$는 상태 집합 Q의 원소인 시작상태, $z_0$는 스택기호 집합 T의 원소인 스택 시작기호이다.
      δ는 현재 상태, 입력기호, 스택 top 기호에 따라 다음 상태와 스택 내용을 정하는 전이함수이고, F는 종료상태의 집합이다.
      푸시다운 오토마타는 context-free 언어를 인식한다.
    tags: [pushdown-automata, context-free-language]

  - id: l07-01
    type: multiple-choice
    prompt: 다음 설명 중 잘못 설명된 것은?
    choices:
      - { id: '1', text: 'Top-down 구문분석 방법은 backtracking 문제를 갖고 있다.' }
      - {
          id: '2',
          text: 'Bottom-up 방법은 터미널 노드부터 시작하여 루트 노드로 반면에, Top-down 방법은 루트 노드로부터 터미널 노드를 향하여 파스트리를 만들어 나간다.',
        }
      - { id: '3', text: 'Shift-reduce 구문분석은 Top-down 구문분석이다.' }
      - { id: '4', text: 'backtracking을 방지하기 위하여  LL(k) 문법을 사용하게 되었다.' }
    answers: ['3']
    explanation: |
      선택지 1: Top-down 구문분석은 적용할 생성규칙을 잘못 고르면 되돌아가 다른 규칙을 시도해야 하므로 backtracking 문제가 있다. 옳은 설명이다.
      선택지 2: Bottom-up 방법은 터미널(단말) 노드에서 시작해 루트 쪽으로, Top-down 방법은 루트 노드에서 터미널 노드 쪽으로 파스트리를 만든다. 옳은 설명이다.
      선택지 3: Shift-reduce 구문분석은 입력을 스택에 옮기고(shift) 핸들을 논터미널로 줄여(reduce) 시작기호까지 거슬러 올라가는 Bottom-up 구문분석이다. Top-down이라는 설명은 잘못되었으므로 정답이다.
      선택지 4: LL(k) 문법은 입력을 k개 미리 보고 적용할 생성규칙을 하나로 결정할 수 있어 backtracking 없이 Top-down 구문분석을 할 수 있다. 옳은 설명이다.

      핵심 개념:
      Top-down 구문분석은 시작기호에서 출발해 좌단유도로 입력 문장을 만들어 가며, 파스트리를 루트에서 아래로 만든다.
      Bottom-up 구문분석은 입력 문장에서 출발해 우단유도의 역순으로 시작기호까지 줄여 가며, 파스트리를 잎에서 위로 만든다.
      Shift-reduce, 순위(precedence), LR(SLR, CLR, LALR) 구문분석은 Bottom-up 방식이다.
      재귀 하강, 예측(LL) 구문분석은 Top-down 방식이다.
    tags: [top-down-parsing, bottom-up-parsing, shift-reduce-parsing, backtracking]

  - id: l07-02
    type: multiple-choice
    passageRefs: [gl07-sr-intro-01, gl07-sr-grammar-01, gl07-sr-trace-01]
    prompt: 빈칸 ‘가’에 알맞은 것은?
    choices:
      - { id: '1', text: 'id' }
      - { id: '2', text: 'E → id' }
      - { id: '3', text: 'E → E * E' }
      - { id: '4', text: 'E → E+E' }
    answers: ['1']
    explanation: |
      선택지 1: 0단계에서 스택에는 \$만 있으므로 줄일 핸들이 없다. 입력의 첫 기호 id를 스택으로 옮겨야 1단계 스택이 \$id가 되므로 ‘가’는 id이고 정답이다.
      선택지 2: E → id는 reduce 행동에 쓰는 생성규칙이다. 0단계 스택은 \$뿐이라 줄일 핸들 id가 없고, shift 뒤에는 생성규칙이 아니라 옮길 기호가 와야 한다.
      선택지 3: E → E * E로 줄이려면 스택 top에 E*E가 있어야 하는데 0단계 스택은 \$뿐이다.
      선택지 4: E → E+E로 줄이려면 스택 top에 E+E가 있어야 하는데 0단계 스택은 \$뿐이며, shift 뒤에는 생성규칙이 올 수 없다.

      핵심 개념:
      shift-reduce 구문분석은 스택과 입력 버퍼를 사용하며 처음 스택은 \$, 입력 끝에는 \$가 있다.
      shift는 입력의 다음 기호를 스택에 넣는 행동이므로 shift 뒤에는 옮기는 기호(터미널)가 온다.
      reduce는 스택 top의 핸들을 생성규칙의 왼쪽 논터미널로 바꾸는 행동이므로 reduce 뒤에는 생성규칙이 온다.
      스택이 \$E(시작기호)이고 입력이 \$만 남으면 accept한다.
    tags: [shift-reduce-parsing]

  - id: l07-03
    type: multiple-choice
    passageRefs: [gl07-sr-intro-01, gl07-sr-grammar-01, gl07-sr-trace-01]
    prompt: 빈칸 ‘나’에 알맞은 것은?
    choices:
      - { id: '1', text: 'id' }
      - { id: '2', text: 'E → id' }
      - { id: '3', text: 'E → E * E' }
      - { id: '4', text: 'E → E+E' }
    answers: ['2']
    explanation: |
      선택지 1: id는 shift할 때 옮기는 기호이며, reduce 뒤에는 적용할 생성규칙이 와야 한다.
      선택지 2: 1단계 스택 \$id의 top에 있는 id가 핸들이므로 E → id로 줄이면 2단계 스택이 \$E가 된다. ‘나’는 E → id이고 정답이다.
      선택지 3: E → E * E로 줄이려면 스택 top에 E*E가 있어야 하는데 1단계 스택에는 id만 있다.
      선택지 4: E → E+E로 줄이려면 스택 top에 E+E가 있어야 하는데 1단계 스택에는 id만 있다.

      핵심 개념:
      핸들은 우단유도의 한 단계를 거꾸로 되돌릴 때 생성규칙의 오른쪽과 일치하는 부분 문자열이다.
      스택 top에 핸들이 나타나면 reduce 행동으로 그 생성규칙의 왼쪽 논터미널로 바꾼다.
      id*id+id를 분석할 때 id는 스택에 올라올 때마다 E → id로 줄어든다.
      shift와 reduce를 반복해 스택이 \$E, 입력이 \$가 되면 분석이 끝난다.
    tags: [shift-reduce-parsing, handle, reduce]

  - id: l07-04
    type: multiple-choice
    passageRefs: [gl07-sr-intro-01, gl07-sr-grammar-01, gl07-sr-trace-01]
    prompt: 빈칸 ‘다’에 알맞은 것은?
    choices:
      - { id: '1', text: 'id' }
      - { id: '2', text: 'E → id' }
      - { id: '3', text: 'E → E * E' }
      - { id: '4', text: 'E → E+E' }
    answers: ['4']
    explanation: |
      선택지 1: id는 shift할 때 옮기는 기호이며, reduce 뒤에는 적용할 생성규칙이 와야 한다.
      선택지 2: 8단계 스택 \$E*E+E의 top에는 id가 없으므로 E → id로 줄일 수 없다. E → id는 7단계에서 이미 적용되었다.
      선택지 3: 스택 top 쪽의 E+E를 먼저 줄여야 9단계 스택이 \$E*E가 된다. E → E * E는 9단계의 reduce E*E에서 적용된다.
      선택지 4: 8단계 스택 \$E*E+E의 top에 있는 E+E가 핸들이므로 E → E+E로 줄이면 9단계 스택이 \$E*E가 된다. ‘다’는 E → E+E이고 정답이다.

      핵심 개념:
      reduce는 항상 스택 top에 있는 핸들에 대해 수행한다.
      \$E*E+E에서 top의 E+E를 줄여 \$E*E, 다시 E*E를 줄여 \$E가 된다.
      이 문법은 모호하므로 5단계 스택 \$E*E에서 E*E를 먼저 줄이는 대신 +를 shift하는 선택도 가능하다.
      여기서는 +를 shift했으므로 id*(id+id)처럼 +를 먼저 묶는 파스트리가 만들어진다.
    tags: [shift-reduce-parsing, handle, ambiguity]

  - id: l07-05
    type: multiple-choice
    passageRefs: [gl07-grammar-etf-01]
    prompt: 다음 문법을 보고 First(E)를 구하면?
    choices:
      - { id: '1', text: '+, )' }
      - { id: '2', text: '+, *, )' }
      - { id: '3', text: '(, id' }
      - { id: '4', text: '+, ), (, id' }
    answers: ['3']
    explanation: |
      선택지 1: +와 )는 E 뒤에 올 수 있는 기호로 FOLLOW(E)에 속하며, E로부터 유도되는 문자열의 첫 기호가 아니다.
      선택지 2: *는 T 뒤에 오는 기호로 FOLLOW(T)에 속하고, +와 )도 FIRST(E)가 아니다.
      선택지 3: E ⇒ T ⇒ F이고 F → (E) | id이므로 E에서 유도되는 문자열은 ( 또는 id로 시작한다. E → E + T, T → T * F는 왼쪽 재귀라 새 첫 기호를 더하지 않는다. FIRST(E) = {(, id}이므로 정답이다.
      선택지 4: (, id는 FIRST(E)에 속하지만 +와 )는 E 뒤에 오는 기호이므로 포함되지 않는다.

      핵심 개념:
      FIRST(X)는 X로부터 유도되는 문자열의 첫 번째 터미널 집합이다.
      A → Bα이면 FIRST(B)에서 ε을 뺀 것이 FIRST(A)에 포함되고, B가 ε을 유도할 때만 FIRST(α)도 더한다.
      이 문법에서 FIRST(F) = {(, id}이고, T → F, E → T이므로 FIRST(E) = FIRST(T) = FIRST(F) = {(, id}이다.
      FIRST는 기호가 무엇으로 시작하는가, FOLLOW는 기호 뒤에 무엇이 오는가를 나타낸다.
    tags: [first-set]

  - id: l07-06
    type: multiple-choice
    passageRefs: [gl07-grammar-etf-01]
    prompt: 다음 문법을 보고 Follow(E)를 구하면?
    choices:
      - { id: '1', text: '+, )' }
      - { id: '2', text: '\$, +, )' }
      - { id: '3', text: '\$, *, )' }
      - { id: '4', text: '*, +, ), \$' }
    answers: ['2']
    explanation: |
      선택지 1: E는 시작기호이므로 FOLLOW(E)에는 입력 끝 표시 \$가 반드시 들어가야 한다.
      선택지 2: E는 시작기호이므로 \$가 들어가고, E → E + T에서 E 뒤에 +가, F → (E)에서 E 뒤에 )가 온다. FOLLOW(E) = {\$, +, )}이므로 정답이다.
      선택지 3: *는 T → T * F에서 T 뒤에 오는 기호로 FOLLOW(T)에는 속하지만, 어떤 규칙에서도 E 바로 뒤에 오지 않으므로 FOLLOW(E)에 속하지 않는다.
      선택지 4: *는 FOLLOW(E)에 속하지 않는다. 이 집합은 FOLLOW(T) = {\$, +, ), *}에 해당한다.

      핵심 개념:
      FOLLOW(A)는 문장형에서 A 바로 뒤에 올 수 있는 터미널의 집합이다.
      시작기호의 FOLLOW에는 \$를 넣는다.
      B → αAβ이면 FIRST(β)에서 ε을 뺀 것을, B → αA이거나 β가 ε을 유도하면 FOLLOW(B)를 FOLLOW(A)에 넣는다.
      이 문법에서 FOLLOW(E) = {\$, +, )}, FOLLOW(T) = FOLLOW(F) = {\$, +, ), *}이다.
    tags: [follow-set]

  # ── 8강 순위관계에 의한 구문분석 ──
  - id: l08-01
    type: multiple-choice
    prompt: 다음 중 단순 순위문법과 관계없는 것은?
    choices:
      - { id: '1', text: 'ε-생성규칙을 갖지 않는다.' }
      - { id: '2', text: '오른쪽 부분이 같은 생성규칙은 존재하지 않는다.' }
      - { id: '3', text: '두 개의 기호 사이에 많아야 한 개의 순위 관계를 갖는다.' }
      - { id: '4', text: '두 문자열 사이에 많아야 한 개의 순위관계를 갖는다.' }
    answers: ['4']
    explanation: |
      선택지 1: ε-생성규칙이 있으면 빈 핸들을 환원해야 하는 경우가 생겨 순위관계만으로 핸들을 정할 수 없으므로, 단순 순위문법은 ε-생성규칙을 갖지 않는다. 단순 순위문법의 조건이다.
      선택지 2: 오른쪽 부분이 같은 생성규칙이 둘 이상이면 핸들을 찾아도 어느 비단말로 환원할지 정할 수 없으므로, 이런 규칙이 없어야 한다. 단순 순위문법의 조건이다.
      선택지 3: 문법 기호 두 개 사이에는 ≐, <·, ·> 중 많아야 하나의 관계만 성립해야 순위관계표가 충돌 없이 만들어진다. 단순 순위문법의 조건이다.
      선택지 4: 기호 하나가 아니라 문자열(여러 기호) 사이의 순위관계를 따지는 것은 확장 순위문법(extended precedence grammar)의 정의이므로 단순 순위문법과 관계없다.

      핵심 개념:
      단순 순위문법은 순위관계를 이용해 핸들을 찾는 bottom-up 구문분석에 쓰는 문법이다.
      조건은 ε-생성규칙이 없고, 오른쪽 부분이 같은 생성규칙이 없으며, 두 기호 사이의 순위관계가 많아야 하나라는 것이다.
      두 기호 사이에 관계가 둘 이상 생기면 기호 대신 문자열 사이의 관계로 확장한 확장 순위문법을 쓴다.
      순위관계는 ≐(같은 핸들 안에서 이웃), <·(핸들의 시작), ·>(핸들의 끝) 세 가지이며, <·와 ·>는 기출문제에서 쓰는 ⋖, ⋗와 같은 기호이다.
    tags: [simple-precedence-grammar]

  - id: l08-02
    type: multiple-choice
    passageRefs: [gl08-precedence-01]
    prompt: 다음은 단순순위문법을 이용해서 기호들 사이의 순위관계를 정하는 과정이다. 빈칸 ‘가’에 알맞은 것을 고르시오.
    choices:
      - { id: '1', text: 'T <· *' }
      - { id: '2', text: '* <· id' }
      - { id: '3', text: 'T ·> *' }
      - { id: '4', text: 'id ·> *' }
    answers: ['2']
    explanation: |
      선택지 1: 생성규칙 T → T*F의 오른쪽에서 T와 *는 바로 이웃하므로 T ≐ * 관계이며 <·가 아니다.
      선택지 2: T*F에서 * ≐ F이고, 빈칸 단계(T*F → T*id)에서 F를 F → id로 대치하면 id가 * 뒤에서 새로 시작하는 핸들이 되므로 * <· id가 생긴다.
      선택지 3: * 앞의 T는 T*F나 F로 대치되어 F로 끝나므로 F ·> *는 성립하지만 T ·> *는 성립하지 않는다. 또 이 단계에서 대치된 것은 * 뒤의 F이다.
      선택지 4: id ·> *는 마지막 단계(F * id → id * id)에서 * 앞의 F를 id로 대치할 때 생기는 관계로, 빈칸 ‘가’의 단계와 관계없다.

      핵심 개념:
      같은 생성규칙 오른쪽에서 이웃한 두 기호 X, Y는 X ≐ Y이다(예: T ≐ *, * ≐ F).
      X ≐ A이고 A가 Y로 시작하는 문자열을 유도하면 X <· Y이다(예: * ≐ F, F ⇒ id이므로 * <· id).
      A ≐ Y이고 A가 X로 끝나는 문자열을 유도하면 X ·> Y이다(예: F ·> *, id ·> *).
      유도 과정의 각 대치 단계에서 새로 생기는 관계를 모아 순위관계표를 만든다.
      <·와 ·>는 기출문제에서 쓰는 ⋖, ⋗와 같은 기호이다.
    tags: [simple-precedence-grammar, precedence-relation]

  - id: l08-03
    type: multiple-choice
    passageRefs: [gl08-slr-intro-01, gl08-slr-table-01, gl08-slr-trace-01]
    prompt: 빈칸 (가)의 내용은?
    choices:
      - { id: '1', text: 'reduce 3' }
      - { id: '2', text: 'reduce 5' }
      - { id: '3', text: 'goto 3' }
      - { id: '4', text: 'shift 3' }
    answers: ['1']
    explanation: |
      선택지 1: 17단계 스택 꼭대기 상태는 10이고 입력기호는 \$이다. ACTION[10, \$] = r3이므로 3번 규칙 T → T*F로 환원하는 reduce 3이다.
      선택지 2: reduce 5는 F → (E)로 환원하는 동작으로, 상태 11에서 나타난다.
      선택지 3: goto는 환원 직후 스택 꼭대기에 비단말이 올라왔을 때의 동작이다. 17단계 스택 꼭대기는 상태 10이므로 ACTION 표를 보아야 한다.
      선택지 4: 상태 10의 \$ 칸에는 shift가 없고, 입력이 \$뿐이므로 더 옮길 기호도 없다.

      핵심 개념:
      파싱표의 환원 번호는 1) E → E+T, 2) E → T, 3) T → T*F, 4) T → F, 5) F → (E), 6) F → id 에 대응한다.
      스택 꼭대기 상태 s와 현재 입력기호 a로 ACTION[s, a]를 찾아 shift, reduce, accept를 정한다.
      reduce k는 k번 규칙 오른쪽 길이만큼 (기호, 상태) 쌍을 스택에서 꺼내고 왼쪽 비단말을 넣는다.
      T → T*F는 오른쪽이 3기호이므로 T9*7F10을 꺼내고 T를 넣어 18단계 스택 0E1+6T가 된다.
    tags: [slr-parsing, lr-parsing-trace]

  - id: l08-04
    type: multiple-choice
    passageRefs: [gl08-slr-intro-01, gl08-slr-table-01, gl08-slr-trace-01]
    prompt: 빈칸 (나)의 내용은?
    choices:
      - { id: '1', text: 'shift 6' }
      - { id: '2', text: 'reduce 6' }
      - { id: '3', text: 'goto 9' }
      - { id: '4', text: 'shift 9' }
    answers: ['3']
    explanation: |
      선택지 1: shift 6은 상태 1에서 +를 읽을 때의 동작이다. 18단계는 환원 직후라 스택 꼭대기에 비단말 T가 있다.
      선택지 2: reduce 6(F → id)은 상태 5에서 하는 동작으로, 18단계와 관계없다.
      선택지 3: 18단계 스택 0E1+6T에서 T 아래 상태는 6이고 GOTO[6, T] = 9이므로 goto 9이다. 19단계 스택이 0E1+6T9가 되는 것과도 맞는다.
      선택지 4: 비단말 T에 대한 전이는 shift가 아니라 GOTO 함수로 처리한다.

      핵심 개념:
      reduce 뒤에는 새로 드러난 스택 꼭대기 상태와 방금 넣은 비단말로 GOTO 함수를 찾는다.
      터미널 기호에 대한 전이는 ACTION 표의 shift, 비단말에 대한 전이는 GOTO 표의 goto이다.
      T → T*F 환원 후 드러난 상태 6과 T로 GOTO[6, T] = 9를 얻는다.
      이 trace는 *를 +보다 먼저 환원해 id + (id * id)로 해석한다.
    tags: [slr-parsing, lr-parsing-trace, goto-function]

  - id: l08-05
    type: multiple-choice
    passageRefs: [gl08-slr-intro-01, gl08-slr-table-01, gl08-slr-trace-01]
    prompt: 빈칸 (다)의 내용은?
    choices:
      - { id: '1', text: 'goto 1' }
      - { id: '2', text: 'reduce 1' }
      - { id: '3', text: 'goto 10' }
      - { id: '4', text: 'shift 9' }
    answers: ['2']
    explanation: |
      선택지 1: goto는 환원 직후 스택 꼭대기에 비단말이 올라왔을 때의 동작이다. 19단계 스택 꼭대기는 상태 9이므로 ACTION 표를 보아야 한다.
      선택지 2: 19단계 스택 꼭대기 상태는 9, 입력은 \$이다. ACTION[9, \$] = r1이므로 1번 규칙 E → E+T로 환원하는 reduce 1이다.
      선택지 3: goto 10은 상태 7에서 F를 만났을 때(GOTO[7, F] = 10)의 동작으로 16단계에 해당한다.
      선택지 4: 상태 9의 \$ 칸에는 shift가 없고, 입력이 \$뿐이므로 더 옮길 기호도 없다.

      핵심 개념:
      상태 9는 [E → E+T·], [T → T·*F] 항목을 가진다.
      다음 입력이 *이면 S7로 shift하고, FOLLOW(E) = {+, ), \$}에 속하는 기호이면 E → E+T로 환원한다.
      E+T 환원은 E1+6T9 세 쌍을 꺼내고 E를 넣어 20단계 스택 0E가 된다.
      SLR은 완료 항목의 환원을 그 비단말의 FOLLOW 칸에 넣는다.
    tags: [slr-parsing, lr-parsing-trace]

  - id: l08-06
    type: multiple-choice
    passageRefs: [gl08-slr-intro-01, gl08-slr-table-01, gl08-slr-trace-01]
    prompt: 빈칸 (라)의 내용은?
