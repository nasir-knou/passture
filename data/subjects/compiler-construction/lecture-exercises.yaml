  - id: gl02-grammar-sbc-intro-01
    type: text
    body: ※ (2 ~ 4) 문법 G가 다음과 같이 정의되어 있다.

  - id: gl02-grammar-sbc-01
    type: code
    language: text
    body: |
      G = ({S, B, C}, {a, b}, P, S)
      P : S → aS | aB
          B → bC
          C → aC | a

  - id: gl02-grammar-v0v1-01
    type: code
    language: text
    body: |
      P: V0 → aV1
         V1 → bV0
         V1 → a

         단, 출발 기호 = V0

  - id: gl02-bnf-integer-01
    type: code
    language: text
    body: |
      〈절대정수〉 ::= 〈숫자〉 | 〈절대정수〉 〈숫자〉
      〈숫자〉 ::= 0 | 1 | 2 | 3 | 4 | 5

