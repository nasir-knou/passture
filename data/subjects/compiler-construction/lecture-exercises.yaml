    tags: [slr-parsing, lr-parsing-trace, goto-function]

  # ── 9강 SLR 구문분석 ──
  - id: l09-01
    type: multiple-choice
    passageRefs: [gl09-lr0-goto-e-01]
    prompt: 다음은 LR(0) 항목 집합의 canonical collection을 구하는 과정이다. GOTO(I₀, E) 를 보기에서 고르시오.
    choices:
      - { id: '1', text: '(가)' }
      - { id: '2', text: '(나)' }
      - { id: '3', text: '(다)' }
      - { id: '4', text: '(라)' }
    answers: ['3']
    explanation: |
      선택지 1: (가) [T → F·]는 I₀에서 점 뒤가 F인 [T → ·F]의 점을 옮긴 GOTO(I₀, F) = I₃이다.
      선택지 2: (나) [E → T·], [T → T·*F]는 점 뒤가 T인 항목을 옮긴 GOTO(I₀, T) = I₂이다.
      선택지 3: I₀에서 점 뒤가 E인 항목은 [S′ → ·E], [E → ·E+T]이다. 점을 E 뒤로 옮기면 [S′ → E·], [E → E·+T]가 되고, 점 뒤가 비단말인 항목이 없어 closure를 해도 더 늘지 않으므로 (다)가 GOTO(I₀, E) = I₁이다.
      선택지 4: (라)는 I₂의 [T → T·*F]에서 *를 넘긴 GOTO(I₂, *) = I₇에 해당한다. 원래 I₇은 {[T → T*·F], [F → ·(E)], [F → ·id]}이다.

      핵심 개념:
      GOTO(I, X)는 I에서 점 바로 뒤가 X인 항목들의 점을 X 뒤로 옮긴 뒤 closure를 구한 집합이다.
      closure는 점 뒤가 비단말 A인 항목이 있으면 A의 모든 규칙을 점이 맨 앞인 항목으로 추가한다.
      I₀ = closure([S′ → ·E])에서 E, T, F로 GOTO를 구하면 I₁, I₂, I₃가 된다.
      이렇게 얻은 항목 집합 전체가 canonical collection이다.

      ※ 원본 표기: 보기 (라)의 [F → (E)], [F → id]는 점이 빠진 표기이며, GOTO(I₂, *)의 실제 항목은 [F → ·(E)], [F → ·id]이다.
    tags: [lr0-items, canonical-collection, goto-function]

  - id: l09-02
    type: multiple-choice
    passageRefs: [gl09-lr0-goto-t-01]
    prompt: 다음은 SLR 구문분석을 위해 LR(0) 항목 집합의 canonical collection을 구하는 과정이다. GOTO (I₀, T) 항목을 보기에서 고르시오.
    choices:
      - { id: '1', text: '(가)' }
      - { id: '2', text: '(나)' }
      - { id: '3', text: '(다)' }
      - { id: '4', text: '(라)' }
    answers: ['3']
    explanation: |
      선택지 1: (가) [F → id·]는 [F → ·id]에서 id를 넘긴 GOTO(I₀, id) = I₅이다.
      선택지 2: (나) [T → F·]는 [T → ·F]에서 F를 넘긴 GOTO(I₀, F) = I₃이다.
      선택지 3: I₀에서 점 뒤가 T인 항목은 [E → ·T], [T → ·T*F]이다. 점을 옮기면 [E → T·], [T → T·*F]이고, 점 뒤가 터미널 *뿐이라 closure로 추가되는 항목이 없으므로 (다)가 GOTO(I₀, T)이다.
      선택지 4: (라) [S′ → E·], [E → E·+T]는 GOTO(I₀, E) = I₁이다.

      핵심 개념:
      GOTO(I₀, X)는 I₀에서 점 뒤가 X인 항목만 골라 점을 한 칸 옮기고 closure를 구한다.
      점 뒤가 터미널이거나 점이 끝에 있는 항목은 closure로 새 항목을 만들지 않는다.
      GOTO(I₀, T) = {[E → T·], [T → T·*F]}는 완료 항목과 shift 항목이 함께 있는 상태이다.
      SLR은 이 상태에서 FOLLOW(E)에 대해 E → T로 환원하고 *에 대해 shift한다.
    tags: [lr0-items, canonical-collection, goto-function]

  - id: l09-03
    type: multiple-choice
    passageRefs: [gl09-lr0-i0-01]
    prompt: 다음은 SLR 구문분석을 위해 LR(0) 항목 집합의 canonical collection을 구하는 과정이다. 다음 중 GOTO (I₀, F) 항목은?
    choices:
      - { id: '1', text: '[F → id]' }
      - { id: '2', text: '[E → T·], [T → T·*F]' }
      - { id: '3', text: "[S' → E·], [E → E·+T]" }
      - { id: '4', text: '[T → F·]' }
    answers: ['4']
    explanation: |
      선택지 1: 점이 없는 [F → id]는 LR(0) 항목이 아니라 생성규칙이다. id를 넘긴 GOTO(I₀, id)도 [F → id·]이며 F에 대한 전이가 아니다.
      선택지 2: [E → T·], [T → T·*F]는 점 뒤가 T인 항목을 옮긴 GOTO(I₀, T)이다.
      선택지 3: [S′ → E·], [E → E·+T]는 점 뒤가 E인 항목을 옮긴 GOTO(I₀, E)이다.
      선택지 4: I₀에서 점 뒤가 F인 항목은 [T → ·F] 하나뿐이다. 점을 옮긴 [T → F·]는 완료 항목이라 closure로 늘지 않으므로 GOTO(I₀, F) = {[T → F·]}이다.

      핵심 개념:
      GOTO(I₀, F)를 구하려면 I₀에서 F 바로 앞에 점이 있는 항목을 찾는다.
      [T → ·F]의 점을 옮기면 [T → F·]이고 closure({[T → F·]}) = {[T → F·]}이다.
      점이 오른쪽 끝에 있는 항목을 완료 항목이라 하며 환원(reduce) 동작을 만든다.
      SLR에서 이 상태는 FOLLOW(T)의 기호에 대해 T → F로 환원한다.
    tags: [lr0-items, goto-function]

  - id: l09-04
    type: multiple-choice
    passageRefs: [gl09-slr-caption-01, gl08-slr-table-01, gl09-slr-trace-01]
    prompt: 파싱표를 이용하여 문장 id+id 을 구문분석하는 과정이다. 빈칸 (가)의 내용은?
    choices:
      - { id: '1', text: 'shift 5' }
      - { id: '2', text: 'reduce 4' }
      - { id: '3', text: 'goto 3' }
      - { id: '4', text: 'reduce 6' }
    answers: ['3']
    explanation: |
      선택지 1: shift 5는 0단계처럼 상태 0에서 입력 id를 읽을 때의 동작이다.
      선택지 2: reduce 4(T → F)는 3단계에서 스택 꼭대기 상태가 3일 때 하는 동작이다.
      선택지 3: 1단계에서 F → id로 환원한 뒤 스택은 0F이다. F 아래 상태 0과 F로 GOTO[0, F] = 3을 찾으므로 goto 3이고, 3단계 스택이 0F3이 된다.
      선택지 4: reduce 6(F → id)은 1단계에서 이미 수행되었다.

      핵심 개념:
      reduce 직후 스택 꼭대기에는 상태가 아니라 비단말이 올라와 있다.
      이때 그 아래 상태와 비단말로 GOTO 표를 찾아 새 상태를 쌓는다.
      id+id의 앞부분은 id → F → T 순으로 환원되고 각 환원 뒤에 goto 3, goto 2가 이어진다.
      터미널에는 ACTION, 비단말에는 GOTO를 사용한다.
    tags: [slr-parsing, lr-parsing-trace, goto-function]

  - id: l09-05
    type: multiple-choice
    passageRefs: [gl09-goto-graph-01, gl09-slr-table-caption-01, gl09-slr-table-part-01]
    prompt: 다음은 GOTO 그래프를 이용하여 SLR 파싱표를 구하는 과정이다. ‘가’에 알맞은 내용은?
    choices:
      - { id: '1', text: '1' }
      - { id: '2', text: 'S4' }
      - { id: '3', text: 'S5' }
      - { id: '4', text: 'accept' }
    answers: ['3']
    explanation: |
      선택지 1: 1은 비단말 간선 I₀ →E I₁에서 나온 GOTO[0, E] 값으로, 표에 이미 채워져 있다.
      선택지 2: S4는 I₀에서 ( 를 읽고 I₄로 가는 동작으로, 상태 0의 ( 칸에 이미 들어 있다.
      선택지 3: GOTO 그래프에서 I₀는 id로 I₅에 전이하므로 ACTION[0, id] = S5이다.
      선택지 4: accept는 [S′ → E·]를 가진 상태 1에서 입력 \$일 때의 동작이다.

      핵심 개념:
      GOTO 그래프의 터미널 간선 Iᵢ →a Iⱼ는 ACTION[i, a] = Sj가 된다.
      비단말 간선 Iᵢ →A Iⱼ는 GOTO[i, A] = j가 된다.
      I₅ = {[F → id·]}는 완료 항목이므로 FOLLOW(F)의 칸에 F → id 환원(r6)을 넣는다.
      증가 규칙의 완료 항목 [S′ → E·]가 있는 상태의 \$ 칸이 acc이다.
    tags: [slr-parsing-table, goto-function]

  # ── 10강 CLR 구문분석 ──
  - id: l10-01
    type: multiple-choice
    passageRefs:
      [
        gl10-clr-graph-caption-01,
        gl10-clr-graph-01,
        gl10-clr-table-caption-01,
        gl10-clr-table-blank-0d-01,
      ]
    prompt: 다음은 CLR 그래프를 이용하여 파싱표를 구성하고 구문분석을 하는 과정이다. 빈칸 ‘가’에 알맞은 것은?
    choices:
      - { id: '1', text: 'S4' }
      - { id: '2', text: 'S7' }
      - { id: '3', text: '2' }
      - { id: '4', text: 'r3' }
    answers: ['1']
    explanation: |
      선택지 1: CLR 그래프에서 I₀는 터미널 d로 I₄에 전이하므로 ACTION[0, d] = S4이다.
      선택지 2: S7은 I₂(또는 I₆)에서 d를 읽고 lookahead가 \$인 I₇로 가는 동작이다.
      선택지 3: 2는 I₀에서 비단말 C로 전이하는 GOTO[0, C] 값으로, GOTO 칸에 들어간다.
      선택지 4: r3은 I₄ = {[C → d·, c/d]}처럼 C → d 완료 항목이 있는 상태에서 하는 환원이며, 상태 0의 동작이 아니다.

      핵심 개념:
      CLR 파싱표도 그래프의 간선으로 shift와 GOTO를 채운다.
      터미널 간선 Iᵢ →a Iⱼ는 ACTION[i, a] = Sj, 비단말 간선은 GOTO[i, A] = j이다.
      완료 항목 [A → α·, a]는 lookahead a 칸에만 reduce를 넣는다.
      I₀의 d 간선은 두 번째가 아닌 첫 번째 C를 분석하는 I₄(lookahead c/d)로 간다.
    tags: [clr-parsing-table, lr1-items]

  - id: l10-02
    type: multiple-choice
    passageRefs: [gl10-lr1-i0-01]
    prompt: 다음은 LR(1) 항목 집합의 canonical collection 들이다. 보기에서 I₀ 는?
    choices:
      - { id: '1', text: '(가)' }
      - { id: '2', text: '(나)' }
      - { id: '3', text: '(다)' }
      - { id: '4', text: '(라)' }
    answers: ['1']
    explanation: |
      선택지 1: closure([S′ → ·S, \$])는 S의 규칙 [S → ·CC, \$]를 추가하고, 첫 번째 C 뒤에 C가 오므로 FIRST(C\$) = {c, d}를 lookahead로 하여 [C → ·cC, c/d], [C → ·d, c/d]를 추가한다. 따라서 (가)가 I₀이다.
      선택지 2: (나)는 [S → ·CC, \$]의 점을 C 뒤로 옮긴 GOTO(I₀, C) = I₂이다.
      선택지 3: (다)는 [S′ → ·S, \$]의 점을 S 뒤로 옮긴 GOTO(I₀, S) = I₁이다.
      선택지 4: (라)는 [C → ·d, c/d]에서 d를 넘긴 GOTO(I₀, d) = I₄이다.

      핵심 개념:
      LR(1) 항목 [A → α·Bβ, a]의 closure는 B의 규칙 B → γ에 대해 [B → ·γ, b]를 추가하며, b는 FIRST(βa)의 원소이다.
      [S → ·CC, \$]에서 B = C, β = C, a = \$이므로 lookahead는 FIRST(C\$) = {c, d}이다.
      I₀는 증가문법의 시작 항목 [S′ → ·S, \$]에서 출발한다.
      lookahead까지 포함하므로 같은 핵심 항목이라도 lookahead가 다르면 다른 상태가 된다.
    tags: [lr1-items, closure, canonical-collection]

  - id: l10-03
    type: multiple-choice
    passageRefs:
      [gl10-clr-table-caption-01, gl10-clr-table-full-01, gl10-cdcd-note-01, gl10-clr-trace-01]
    prompt: 다음은 CLR 파싱표를 이용하여 구문분석하는 과정이다. 빈칸 ‘가’에 알맞은 것은?
    choices:
      - { id: '1', text: 'shift 6' }
      - { id: '2', text: 'shift 7' }
      - { id: '3', text: 'reduce 3' }
      - { id: '4', text: 'goto 2' }
    answers: ['4']
    explanation: |
      선택지 1: shift 6은 6단계에서 상태 2와 입력 c로 ACTION[2, c] = S6을 찾아 수행하는 동작이다.
      선택지 2: shift 7은 7단계에서 상태 6과 입력 d로 수행하는 동작이다.
      선택지 3: reduce 3(C → d)은 2단계와 8단계처럼 스택 꼭대기에 d와 상태 4 또는 7이 있을 때의 동작이다.
      선택지 4: 4단계에서 C → cC로 환원하면 c3C8을 꺼내고 C를 넣어 스택이 0C가 된다. C 아래 상태 0과 C로 GOTO[0, C] = 2를 찾으므로 goto 2이고, 6단계 스택이 0C2가 된다.

      핵심 개념:
      CLR 구문분석기의 동작 방식은 SLR과 같고 파싱표만 다르다.
      reduce 뒤에는 드러난 상태와 넣은 비단말로 GOTO 표를 찾는다.
      cdcd는 앞의 cd가 첫 번째 C, 뒤의 cd가 두 번째 C로 환원된다.
      두 번째 C를 분석할 때는 lookahead가 \$인 상태 6, 7, 9를 사용한다.
    tags: [clr-parsing-table, lr-parsing-trace, goto-function]

  - id: l10-04
    type: multiple-choice
    passageRefs:
      [
        gl10-clr-graph-caption-01,
        gl10-clr-graph-01,
        gl10-clr-table-caption-01,
        gl10-clr-table-blank-7-01,
      ]
    prompt: 다음은 CLR 그래프를 이용하여 파싱표를 구성하는 과정이다. 빈칸 ‘가’에 알맞은 것은?
    choices:
      - { id: '1', text: 'r1' }
      - { id: '2', text: 'r2' }
      - { id: '3', text: 'r3' }
      - { id: '4', text: 'r4' }
    answers: ['3']
    explanation: |
      선택지 1: r1은 S → CC로 환원하는 동작으로, [S → CC·, \$]를 가진 I₅의 \$ 칸에 들어간다.
      선택지 2: r2는 C → cC로 환원하는 동작으로, I₈(c/d 칸)과 I₉(\$ 칸)에 들어간다.
      선택지 3: I₇ = {[C → d·, \$]}는 lookahead가 \$인 완료 항목이다. 따라서 ACTION[7, \$]에 3번 규칙 C → d의 환원 r3을 넣는다.
      선택지 4: 증가문법의 규칙은 0~3번뿐이므로 r4에 해당하는 규칙이 없다.

      핵심 개념:
      CLR에서 완료 항목 [A → α·, a]는 lookahead a 칸에만 reduce를 넣는다.
      I₄ = {[C → d·, c/d]}는 c, d 칸에, I₇ = {[C → d·, \$]}는 \$ 칸에 r3을 넣는다.
      같은 규칙의 환원이라도 lookahead에 따라 들어가는 칸이 다르다.
      SLR은 FOLLOW 전체를 쓰지만 CLR은 항목별 lookahead만 쓰므로 충돌이 줄어든다.
    tags: [clr-parsing-table, lr1-items]

  - id: l10-05
    type: multiple-choice
    passageRefs:
      [
        gl10-clr-graph-caption-01,
        gl10-clr-graph-01,
        gl10-clr-table-caption-01,
        gl10-clr-table-blank-1-01,
      ]
    prompt: 다음은 CLR 그래프를 이용하여 파싱표를 구성하는 과정이다. 빈칸 ‘가’에 알맞은 것은?
    choices:
      - { id: '1', text: 'S6' }
      - { id: '2', text: 'S7' }
      - { id: '3', text: 'r3' }
      - { id: '4', text: 'acc' }
    answers: ['4']
    explanation: |
      선택지 1: S6은 I₂나 I₆에서 c를 읽고 I₆으로 가는 동작이다. I₁에는 나가는 간선이 없다.
      선택지 2: S7은 I₂나 I₆에서 d를 읽고 I₇로 가는 동작이다.
      선택지 3: r3은 C → d 완료 항목을 가진 I₄, I₇의 동작이다.
      선택지 4: I₁ = {[S′ → S·, \$]}는 증가 규칙의 완료 항목이므로 입력 \$에서 accept한다. 따라서 ACTION[1, \$] = acc이다.

      핵심 개념:
      증가문법 S′ → S는 구문분석의 끝을 알리기 위해 추가한 규칙이다.
      [S′ → S·, \$]가 있는 상태에서 입력이 \$이면 reduce 대신 acc를 넣는다.
      I₁은 GOTO(I₀, S)이며 다른 상태로 나가는 간선이 없다.
      스택에 시작기호만 남고 입력이 끝나면 문장이 문법에 맞는 것으로 판정한다.
    tags: [clr-parsing-table]

  # ── 11강 LALR 구문분석 ──
  - id: l11-01
    type: multiple-choice
    prompt: 다음은 LALR 구문분석에 관한 설명이다. 틀린 것은?
    choices:
      - { id: '1', text: 'lookahead 정보를 이용하기 때문에 SLR 방법보다 훨씬 강력하다.' }
      - { id: '2', text: 'LALR 파싱표를 구성하기 위해서는 반드시 CLR 파싱표를 구해야만 한다.' }
      - { id: '3', text: 'lookahead 기호를 구하는데 상당한 시간과 노력이 소요된다.' }
      - { id: '4', text: 'CLR 파싱표보다 LALR 파싱표가 훨씬 작다.' }
    answers: ['2']
    explanation: |
      선택지 1: LALR은 FOLLOW 전체 대신 상태별 lookahead를 쓰므로 SLR에서 충돌이 나는 문법도 분석할 수 있어 SLR보다 강력하다. 옳은 설명이다.
      선택지 2: LALR 파싱표는 CLR의 LR(1) 항목에서 core가 같은 상태를 합쳐 구할 수도 있고, LR(0) 항목 집합에 lookahead를 계산해 붙여 구할 수도 있다. 반드시 CLR 파싱표를 거쳐야 하는 것은 아니므로 틀린 설명이다.
      선택지 3: 어느 방법이든 상태마다 lookahead 기호를 계산해야 하므로 SLR보다 시간과 노력이 더 든다. 옳은 설명이다.
      선택지 4: LALR은 core가 같은 CLR 상태를 합치므로 상태 수가 SLR과 같아 CLR 파싱표보다 훨씬 작다. 옳은 설명이다.

      핵심 개념:
      LALR(Lookahead LR)은 SLR과 CLR의 절충 방법이다.
      CLR 그래프에서 core(점까지의 LR(0) 부분)가 같은 상태를 합쳐 lookahead를 합집합으로 만든다.
      LR(0) 항목 집합에서 직접 lookahead를 구해 만드는 방법도 있다.
      강력함은 SLR < LALR < CLR 순이고, 파싱표 크기는 LALR이 SLR과 같다.
    tags: [lalr-parsing]

  - id: l11-02
    type: multiple-choice
    passageRefs: [gl10-clr-graph-01]
    prompt: 다음은 CLR 그래프를 이용하여 파싱표를 구성하는 과정이다. CLR 그래프로부터 LALR의 파싱표를 구할 수 있다. 다음은 core가 같은 상태를 찾는 과정인데 틀리는 것은?
    choices:
      - { id: '1', text: 'I₁ ∪ I₅ ₌⇒ I₁₅' }
      - { id: '2', text: 'I₃ ∪ I₆ ₌⇒ I₃₆' }
      - { id: '3', text: 'I₄ ∪ I₇ ₌⇒ I₄₇' }
      - { id: '4', text: 'I₈ ∪ I₉ ₌⇒ I₈₉' }
    answers: ['1']
    explanation: |
      선택지 1: I₁ = {[S′ → S·, \$]}와 I₅ = {[S → CC·, \$]}는 core(LR(0) 부분)가 서로 달라 합칠 수 없으므로 틀린 과정이다.
      선택지 2: I₃와 I₆은 모두 [C → c·C], [C → ·cC], [C → ·d]를 core로 가지고 lookahead만 c/d와 \$로 다르므로 합쳐 I₃₆ = {[C → c·C, c/d/\$], [C → ·cC, c/d/\$], [C → ·d, c/d/\$]}가 된다.
      선택지 3: I₄ = {[C → d·, c/d]}와 I₇ = {[C → d·, \$]}는 core가 같아 I₄₇ = {[C → d·, c/d/\$]}가 된다.
      선택지 4: I₈ = {[C → cC·, c/d]}와 I₉ = {[C → cC·, \$]}는 core가 같아 I₈₉ = {[C → cC·, c/d/\$]}가 된다.

      핵심 개념:
      core는 LR(1) 항목에서 lookahead를 뺀 LR(0) 항목 부분이다.
      CLR 그래프에서 core가 같은 상태를 하나로 합치고 lookahead는 합집합으로 만든다.
      이 문법의 CLR 상태 10개는 I₃₆, I₄₇, I₈₉를 합쳐 LALR 상태 7개가 된다.
      core가 다른 상태는 서로 다른 구문분석 위치를 뜻하므로 합치지 않는다.
    tags: [lalr-parsing, lr1-items]

  - id: l11-03
    type: multiple-choice
    passageRefs: [gl11-lalr-intro-01, gl10-clr-graph-01]
    prompt: I₄₇ 을 구하면?
    choices:
      - { id: '1', text: '[[C → d ·]' }
      - { id: '2', text: '[[C → d ·, \$]' }
      - { id: '3', text: '[[C → d ·, c/d]' }
      - { id: '4', text: '[[C → d ·, c/d/\$]' }
    answers: ['4']
    explanation: |
      선택지 1: [C → d ·]는 lookahead가 없는 LR(0) 항목, 즉 core만 적은 것이다. LALR 상태는 lookahead까지 가진다.
      선택지 2: [C → d ·, \$]는 합치기 전의 I₇이다.
      선택지 3: [C → d ·, c/d]는 합치기 전의 I₄이다.
      선택지 4: I₄ = {[C → d·, c/d]}와 I₇ = {[C → d·, \$]}는 core가 같으므로 lookahead를 합집합으로 모아 I₄₇ = {[C → d·, c/d/\$]}가 된다.

      핵심 개념:
      LALR 상태는 core가 같은 CLR 상태를 합치고 lookahead를 합집합으로 만든 것이다.
      I₄₇은 c, d, \$ 세 칸 모두에서 C → d(r3)로 환원한다.
      상태를 합치면 파싱표 크기는 줄지만 reduce-reduce 충돌이 새로 생길 수도 있다.
      이 문법은 합친 뒤에도 충돌이 없으므로 LALR(1) 문법이다.
    tags: [lalr-parsing, lr1-items]

  - id: l11-04
    type: multiple-choice
    passageRefs: [gl11-lalr-intro-01, gl10-clr-graph-01]
    prompt: I₈₉ 을 구하면?
    choices:
      - { id: '1', text: '[C → cC ·]' }
      - { id: '2', text: '[C →  cC ·,\$]' }
      - { id: '3', text: '[C →  cC ·, c/d]' }
      - { id: '4', text: '[C →  cC ·, c/d/\$]' }
    answers: ['4']
    explanation: |
      선택지 1: [C → cC ·]는 lookahead 없이 core만 적은 것이다.
      선택지 2: [C → cC·, \$]는 합치기 전의 I₉이다.
      선택지 3: [C → cC·, c/d]는 합치기 전의 I₈이다.
      선택지 4: I₈ = {[C → cC·, c/d]}와 I₉ = {[C → cC·, \$]}는 core가 [C → cC·]로 같으므로 합쳐 I₈₉ = {[C → cC·, c/d/\$]}가 된다.

      핵심 개념:
      core가 같은 상태를 합칠 때 항목은 그대로 두고 lookahead만 합집합으로 만든다.
      I₈₉는 c, d, \$ 칸 모두에서 C → cC(r2)로 환원한다.
      GOTO도 합친 상태 번호로 바꾼다(예: GOTO[36, C] = 89).
      이렇게 만든 LALR 파싱표는 SLR 파싱표와 상태 수가 같다.
    tags: [lalr-parsing, lr1-items]

  - id: l11-05
    type: multiple-choice
    passageRefs: [gl11-lr0-graph-01]
    prompt: 다음은 LALR 파싱표를 구하기 위하여 LR(0) 항목집합의 Canonical Collection으로 구성된  GOTO 그래프이다. I₈ 에서 lookahead를 구하면?
    choices:
      - { id: '1', text: '=' }
      - { id: '2', text: '\$' }
      - { id: '3', text: '=, \$' }
      - { id: '4', text: '=, *, \$' }
    answers: ['3']
    explanation: |
      선택지 1: =는 I₄를 거쳐 I₈에 오는 경로에서만 들어오는 lookahead이다. I₄ 경로({=, \$})와 I₆ 경로({\$})에서 함께 들어오는 \$가 빠졌다.
      선택지 2: \$는 I₄ 경로와 I₆ 경로 모두에서 들어오지만, I₄ 경로에서만 들어오는 =가 빠졌다.
      선택지 3: I₈ = {[R → L·]}은 I₄와 I₆에서 L로 전이해 온다. I₄의 [R → ·L]은 [L → *·R]의 lookahead {=, \$}를 물려받고, I₆의 [R → ·L]은 [S → L=·R]의 lookahead {\$}를 물려받으므로 합집합 {=, \$}가 I₈의 lookahead이다.
      선택지 4: *는 L이나 R 뒤에 올 수 없는 기호이다. *는 L → *R처럼 L의 맨 앞에만 나타나므로 lookahead가 될 수 없다.

      핵심 개념:
      LR(0) 상태에 lookahead를 붙이려면 완료 항목 [A → α·]이 어느 상태에서 A 앞의 항목([A → ·α])으로 시작했는지 거슬러 올라간다.
      I₀에서 [L → ·*R], [L → ·id]의 lookahead는 [S → ·L=R]의 =와 [R → ·L]의 \$를 합친 {=, \$}이고, 이것이 I₄의 [L → *·R], [R → ·L]로 전파된다.
      I₆의 항목은 [S → L=·R, \$]에서 나오므로 [R → ·L]의 lookahead는 \$이다.
      SLR은 FOLLOW(R) = {=, \$}를 쓰므로 I₂에서 =에 대해 shift-reduce 충돌이 생기지만, LALR은 I₂의 [R → L·] lookahead가 \$뿐이라 충돌이 없다.
    tags: [lalr-parsing, lr0-items]

  # ── 12강 Top-down 구문분석 ──
  - id: l12-01
    type: multiple-choice
    prompt: 다음 구문분석에 대한 설명 중 틀린 것은?
    choices:
      - { id: '1', text: 'LR 파싱표를 구성하는 방법은 SLR, CLR, LALR 방법이 있다.' }
      - {
          id: '2',
          text: 'SLR은 구현하기 쉽지만 완전하지 못하고, CLR은 완전하지만 파싱표가 크고 lookahead를 구해야 하므로 구현하는데 비효율적이다.',
        }
      - {
          id: '3',
          text: 'Top-down 구문분석 중 backtracking과 left-recursion 문제가 해결된 것을 LL 구문분석이라고 한다.',
        }
      - {
          id: '4',
          text: 'Bottom-up 구문분석의 종류에는 Recursive-descent 구문분석과 Predictive 구문분석이 있다.',
        }
    answers: ['4']
    explanation: |
      선택지 1: LR 파싱표는 SLR(Simple LR), CLR(Canonical LR), LALR(Lookahead LR) 방법으로 구성한다. 옳은 설명이다.
      선택지 2: SLR은 LR(0) 항목과 FOLLOW만 쓰므로 쉽지만 충돌이 나는 문법이 많고, CLR은 가장 강력하지만 lookahead 계산이 복잡하고 파싱표가 커진다. 옳은 설명이다.
      선택지 3: backtracking과 left-recursion 문제를 없애 결정적으로 분석하는 top-down 방법을 LL 구문분석이라 한다. 옳은 설명이다.
      선택지 4: Recursive-descent 구문분석과 Predictive 구문분석은 루트에서 시작해 좌단유도를 하는 Top-down 구문분석의 종류이므로 틀린 설명이다.

      핵심 개념:
      Bottom-up 구문분석: shift-reduce, 순위 구문분석, LR 계열(SLR, CLR, LALR)이 있으며 우파스를 만든다.
      Top-down 구문분석: Recursive-descent, Predictive(LL) 구문분석이 있으며 좌파스를 만든다.
      Top-down은 backtracking과 left-recursion 문제를 해결해야 결정적으로 분석할 수 있다.
      LR 방법의 강력함은 SLR < LALR < CLR 순이다.
    tags: [top-down-parsing, lr-parsing]

  - id: l12-02
    type: multiple-choice
    prompt: 다음 중 Top-down 구문분석과 관계 있는 것은?
    choices:
      - { id: '1', text: 'LL 구문분석' }
      - { id: '2', text: 'SLR 구문분석' }
      - { id: '3', text: 'CLR 구문분석' }
      - { id: '4', text: 'LALR 구문분석' }
    answers: ['1']
    explanation: |
      선택지 1: LL 구문분석은 입력을 왼쪽에서 오른쪽으로 읽으며(Left-to-right) 좌단유도(Leftmost derivation)를 하는 결정적 Top-down 구문분석이다.
      선택지 2: SLR 구문분석은 LR(0) 항목과 FOLLOW를 이용하는 Bottom-up 구문분석이다.
      선택지 3: CLR 구문분석은 LR(1) 항목을 이용하는 Bottom-up 구문분석이다.
      선택지 4: LALR 구문분석은 CLR 상태 중 core가 같은 것을 합친 Bottom-up 구문분석이다.

      핵심 개념:
      일반적인 Top-down 방법은 backtracking 때문에 실제 컴파일러의 구문분석 알고리즘으로 쓰기에 부적당하다.
      그래서 backtracking 없이 결정적으로 분석하는 방법이 필요하며, 이를 LL 구문분석이라 한다.
      LL 구문분석으로 분석할 수 있는 조건을 만족하는 문법을 LL 문법이라 한다.
      SLR, CLR, LALR은 모두 LR 계열 Bottom-up 방법이다.
    tags: [top-down-parsing]

  - id: l12-03
    type: multiple-choice
    prompt: Top-down 구문분석과 관계 없는 것은?
    choices:
      - { id: '1', text: 'back tracking' }
      - { id: '2', text: 'left recursion' }
      - { id: '3', text: '우파스' }
      - { id: '4', text: 'left factoring' }
    answers: ['3']
    explanation: |
      선택지 1: Top-down 구문분석은 잘못된 생성규칙을 적용하면 되돌아가 다른 규칙을 적용하는 backtracking이 생길 수 있어 효율이 떨어진다.
      선택지 2: A → Aα 같은 left recursion이 있으면 Top-down 구문분석이 같은 비단말을 계속 전개해 무한 루프에 빠진다.
      선택지 3: 우파스(right parse)는 우단유도에 적용된 생성규칙 순서의 역순으로, Bottom-up 구문분석의 결과이므로 Top-down 구문분석과 관계없다.
      선택지 4: left factoring은 공통 앞부분을 묶어 backtracking을 없애는 Top-down 구문분석용 문법 변환이다.

      핵심 개념:
      Top-down 구문분석은 시작기호에서 좌단유도로 입력 문자열을 만들어 가며 좌파스를 생성한다.
      Bottom-up 구문분석은 입력에서 reduce로 시작기호를 찾아 가며 우파스를 생성한다.
      Top-down의 문제점인 backtracking은 left factoring으로, left recursion은 right recursion으로 바꾸어 해결한다.
      두 문제를 해결한 결정적 Top-down 방법이 LL 구문분석이다.
    tags: [top-down-parsing, backtracking, left-recursion, left-factoring]

  - id: l12-04
    type: multiple-choice
    prompt: 다음 중 Top-down 구문분석에 대한 설명 중 틀린 것은?
    choices:
      - { id: '1', text: 'backtracking의 경우 효율을 떨어뜨리므로 left-factoring을 해야 한다.' }
      - {
          id: '2',
          text: 'left-recursion의 경우 무한 루프에 빠지므로 right-recursion으로 바꾸어주어야 한다.',
        }
      - { id: '3', text: '이러한 문제점을 해결한 결정적인 구문분석을 LL 구문분석이라고 한다.' }
      - {
          id: '4',
          text: '문법에 제약이 없어 일반적으로 Bottom up 방식보다 편리하므로 자주 사용된다.',
        }
    answers: ['4']
    explanation: |
      선택지 1: 같은 앞부분을 가진 규칙이 여럿이면 잘못 고를 때마다 backtracking이 생기므로 left-factoring으로 공통 부분을 묶는다. 옳은 설명이다.
      선택지 2: left-recursion이 있으면 같은 비단말을 끝없이 전개하므로 right-recursion으로 바꾼다. 옳은 설명이다.
      선택지 3: backtracking과 left-recursion을 없애 결정적으로 분석하는 방법이 LL 구문분석이다. 옳은 설명이다.
      선택지 4: Top-down 방식은 left-recursion이 없고 left-factoring이 되어 있어야 하는 등 문법에 제약이 많다. 일반적으로는 문법적 제약이 적은 Bottom-up 방식을 더 많이 쓰므로 틀린 설명이다.

      핵심 개념:
      Top-down 구문분석은 backtracking과 left-recursion이라는 두 가지 문제를 가진다.
      left-factoring과 left-recursion 제거로 문법을 바꾸면 결정적인 LL 구문분석이 가능해진다.
      이런 문법 변형이 필요하다는 점이 Top-down 방식의 제약이다.
      실제 컴파일러는 제약이 적은 Bottom-up(LR 계열) 방식을 많이 사용한다.
    tags: [top-down-parsing, backtracking, left-recursion]

  - id: l12-05
    type: multiple-choice
    passageRefs: [gl12-predictive-01, gl12-predictive-table-01]
    prompt: 다음은 Top-Down 구문분석에서 predictive 파싱표를 구성하는 과정이다. 빈칸 ‘가’에 들어갈 내용은?
    choices:
      - { id: '1', text: "E' → ε" }
      - { id: '2', text: "E → TE'" }
      - { id: '3', text: 'F → (E)' }
      - { id: '4', text: "E' → +TE'" }
    answers: ['1']
    explanation: |
      선택지 1: E' → ε는 오른쪽이 ε이므로 FOLLOW(E') = {), \$}의 각 기호 칸에 넣는다. 따라서 M[E', )]와 M[E', \$]가 E' → ε이다.
      선택지 2: E → TE'는 FIRST(TE') = FIRST(T) = {(, id}의 칸, 즉 M[E, (]와 M[E, id]에 들어가며 E' 행에는 들어가지 않는다.
      선택지 3: F → (E)는 FIRST((E)) = {(}이므로 M[F, (]에 들어간다.
      선택지 4: E' → +TE'는 FIRST(+TE') = {+}이므로 M[E', +]에 들어간다.

      핵심 개념:
      predictive 파싱표 M[A, a]는 생성규칙 A → α마다 FIRST(α)의 각 터미널 a에 대해 A → α를 넣는다.
      α가 ε을 유도할 수 있으면 FOLLOW(A)의 각 기호(\$ 포함)에도 A → α를 넣는다.
      E'는 E의 오른쪽 끝에 오므로 FOLLOW(E') = FOLLOW(E) = {), \$}이다.
      한 칸에 규칙이 둘 이상 들어가지 않으면 그 문법은 LL(1) 문법이다.
    tags: [predictive-parsing, ll1-parsing-table, follow-set]

  # ── 13강 YACC와 BISON ──
  - id: l13-01
    type: multiple-choice
    prompt: Bell 연구소에서 Stephen C. Johnson을 중심으로 개발된 LALR(1) 구문분석기 생성기로  선언부분(declation), 변환규칙 부분(translation rules), 사용자 프로그램 부분(user program) 등의 세 부분으로 구성된 것은?
    choices:
      - { id: '1', text: 'Lex' }
      - { id: '2', text: 'Scan gen' }
      - { id: '3', text: 'YACC' }
      - { id: '4', text: 'Bison' }
    answers: ['3']
    explanation: |
      선택지 1: Lex는 Bell 연구소의 Lesk와 Schmidt가 개발한 어휘분석기 생성기로, 구문분석기 생성기가 아니다.
      선택지 2: Scan gen은 스캐너(어휘분석기) 생성기이다.
      선택지 3: YACC(Yet Another Compiler-Compiler)는 Bell 연구소의 Stephen C. Johnson이 개발한 LALR(1) 구문분석기 생성기이며, 입력은 선언부분, 변환규칙 부분, 사용자 프로그램 부분으로 구성된다.
      선택지 4: Bison은 YACC와 호환되는 GNU의 무료 LALR(1) 구문분석기 생성기로, Bell 연구소에서 Johnson이 개발한 도구가 아니다.

      핵심 개념:
      YACC는 문법규칙과 각 규칙의 수행코드를 입력받아 LALR(1) 구문분석기를 C 프로그램으로 생성한다.
      입력은 선언부분 %% 변환규칙 부분 %% 사용자 프로그램 부분의 세 부분이다.
      YACC가 만든 구문분석기는 Lex가 만든 어휘분석기에서 토큰을 받아 사용한다.
      Bison은 YACC와 호환되는 GNU의 무료 구문분석기 생성기이다.
    tags: [yacc, parser-generator]

