      선택지 2: 10001101에서 1을 빼면 10001100, 보수를 취하면 01110011 = 115이고 부호 비트가 1이므로 −115이다. 정답이다.
      선택지 3: −120의 2의 보수 표현은 10001000이므로 주어진 패턴과 다르다.
