      - { id: '3', text: 'SJF 스케줄링 기법' }
      - { id: '4', text: 'RR 스케줄링 기법' }
    answers: ['3']
    explanation: |
      선택지 1: 우선순위 스케줄링 기법은 우선순위가 높은 프로세스부터 먼저 처리하는 방식으로, 기준이 수행시간이 아니라 우선순위이다.
      선택지 2: FCFS(First-Come First-Served) 스케줄링 기법은 준비 큐에 도착한 순서대로 CPU를 할당하는 방식으로, 수행시간을 고려하지 않는다.
      선택지 3: SJF(Shortest Job First) 스케줄링 기법은 준비 큐의 프로세스 중 수행시간이 가장 짧을 것으로 예상되는 프로세스를 먼저 처리하므로 정답이다.
      선택지 4: RR(Round Robin) 스케줄링 기법은 도착 순서대로 CPU를 할당하되 시간 할당량으로 실행을 제한하는 방식으로, 수행시간이 짧은 작업을 먼저 고르지 않는다.

      핵심 개념:
      SJF는 대기하는 프로세스 수를 최소화해 빠른 응답시간을 제공할 수 있다.
      예상 수행 시간을 실행 전에 알아야 하므로 일괄처리 환경에서는 구현하기 쉽지만 대화식 시스템에서는 사용하기 어렵다.
      수행시간이 긴 프로세스는 CPU를 할당받지 못하고 계속 기다릴 수 있다는 단점이 있다.
      FCFS는 도착 순서, 우선순위 기법은 우선순위, RR은 도착 순서와 시간 할당량을 기준으로 한다.

