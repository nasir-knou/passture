      초과표기법으로 표시된 지수는 표현 과정의 역순으로 해석한다.
      ㉠ 2진수를 10진수로 변환한다.
      ㉡ 그 결과에서 매직넘버를 뺀다.
      8비트 초과_127에서 저장값 − 127이 실제 지수이다.

  - id: b01-20
    type: multiple-choice
    prompt: 110101.0101을 부동소수점으로 표현할 때 지수 부분의 표현으로 알맞은 것은? (단, 초과_127을 사용한다.)
    choices:
      - { id: '1', text: '00000101' }
