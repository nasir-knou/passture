    explanation: |
      선택지 1: 전가산기는 기억소자 없이 두 비트와 올림수를 더하는 조합회로로, 플립플롭과 클록으로 구성된 그림과 맞지 않는다.
      선택지 2: 레지스터는 플립플롭에 외부 데이터를 병렬로 저장하는 순서회로로, 그림처럼 입력이 1로 고정된 채 상태가 스스로 변해 가지 않는다.
      선택지 3: 인코더는 활성화된 입력선을 이진 코드로 바꾸는 조합회로로, 플립플롭을 사용하지 않는다.
      선택지 4: $A_0$은 T = 1이라 클록마다 반전되고, $A_1$은 $A_0 = 1$일 때, $A_2$는 $A_0 \cdot A_1 = 1$일 때 반전된다. 클록펄스가 입력될 때마다 저장된 2진수가 1씩 증가하는 3비트 카운터이므로 정답이다.

      핵심 개념:
      카운터는 클록펄스가 입력될 때마다 미리 정해진 순서에 따라 상태가 변하는 순서회로이다.
      T(Toggle) 플립플롭은 C = 0이면 작동하지 않고, C = 1일 때 T = 1이면 $Q(t+1) = Q(t)'$, T = 0이면 $Q(t+1) = Q(t)$가 된다.
      아랫자리 비트가 모두 1일 때만 윗자리 비트를 반전시키면 2진수 1 증가와 같은 동작이 된다.
      C(clock pulse)는 주기적으로 생성되는 신호로 시스템 구성요소들의 작동을 동기화한다.

  - id: b05-13
    type: multiple-choice
    prompt: 다음 회로도에 해당하는 논리회로는?
    images:
      - path: images/subjects/introduction-to-computer-science/workbook/b05-13.png
        alt: 'A와 B가 XOR 게이트에 들어가고 그 출력과 C가 다시 XOR 게이트에 들어가 X를 출력하며, A와 B의 AND 출력과 첫 XOR 출력과 C의 AND 출력이 OR 게이트에 들어가 Y를 출력하는 회로'
    choices:
      - { id: '1', text: '인코더' }
      - { id: '2', text: '전가산기' }
      - { id: '3', text: '멀티플렉서' }
      - { id: '4', text: '디코더' }
    answers: ['2']
    explanation: |
      선택지 1: 인코더는 여러 입력선 중 활성화된 하나를 이진 코드로 바꾸는 회로로, 입력들을 XOR로 더하는 구조가 아니다.
      선택지 2: $X = A \oplus B \oplus C$는 세 비트의 합이고, $Y = A \cdot B + (A \oplus B) \cdot C$는 윗자리로 보내는 올림수이다. 두 2진수 입력(A, B)과 아랫자리 올림수(C)를 더해 합(X)과 올림수(Y)를 출력하므로 1비트 전가산기이며 정답이다.
      선택지 3: 멀티플렉서는 선택 변수로 여러 입력 중 하나를 골라 출력하는 회로로, 선택 변수 입력이 없는 그림과 맞지 않는다.
      선택지 4: 디코더는 $n$비트 입력을 $2^n$개의 출력 중 하나로 변환하는 회로로, 3비트 입력이면 출력이 8개여야 하지만 그림의 출력은 2개이다.

      핵심 개념:
      1비트 전가산기는 두 개의 2진수 입력과 바로 아랫자리에서 올라온 올림수를 입력으로 받아 덧셈한다.
      결과로 합과 바로 윗자리로의 올림수를 출력하며, 일반식은 $(S, C_{out}) = X + Y + C_{in}$(X, Y는 두 입력 비트)이다.
      이 문제의 회로에서는 입력이 A, B, C이고 출력 X가 합, Y가 올림수이다.
      합은 세 입력의 XOR, 올림수는 두 입력의 AND와 첫 XOR 결과·올림수 입력의 AND를 OR한 값이다.
      1비트 전가산기 여러 개를 직렬로 연결하면 $n$비트 전가산기를 구성할 수 있다.

  - id: b05-14
    type: multiple-choice
    prompt: ROM은 개념적으로 하나의 디코더와 여러 개의 논리 게이트를 사용한 조합회로로 구현될 수 있다. 이때 사용되는 논리 게이트는 어느 것인가?
    choices:
      - { id: '1', text: 'AND 게이트' }
      - { id: '2', text: 'XOR 게이트' }
      - { id: '3', text: 'OR 게이트' }
      - { id: '4', text: '인버터' }
    answers: ['3']
    explanation: |
      선택지 1: AND 게이트는 모든 입력이 1일 때만 1을 출력하므로, 디코더 출력선 중 하나만 1이 되는 ROM 구조에서 저장 내용을 꺼내는 용도로 쓰이지 않는다.
      선택지 2: XOR 게이트는 입력이 서로 다를 때 1을 출력하는 게이트로, ROM의 개념적 구성에 사용되지 않는다.
      선택지 3: ROM은 주소를 해독하는 디코더와 여러 개의 OR 게이트로 구성된다. 각 OR 게이트는 저장 내용이 1인 위치의 디코더 출력선에 연결되어 선택된 주소의 비트를 출력하므로 정답이다.
      선택지 4: 인버터(NOT 게이트)는 입력을 반전할 뿐이며 ROM의 저장 내용을 출력하는 역할을 하지 않는다.

      핵심 개념:
      ROM은 읽기 전용 기억장치로, 하나의 디코더와 여러 개의 OR 게이트를 사용한 조합회로로 구성할 수 있다.
      예를 들어 $2^2 \times 5$ ROM은 주소 2비트, 저장된 내용 $2^2$개, 각 내용의 길이가 5비트이다.
      주소 2비트는 2×4 디코더로 해독되어 4개의 출력선 중 하나가 1이 된다.
      5개의 OR 게이트가 각각 출력 비트 하나를 담당하며, 저장값이 1인 위치에서만 디코더 출력선과 연결된다.

  - id: b05-15
    type: multiple-choice
    prompt: RS 플립플롭을 사용한 RAM의 1비트 기억소자에서 읽기/쓰기 선택을 위한 라인은?
    images:
      - path: images/subjects/introduction-to-computer-science/workbook/b05-15.png
        alt: 'RS 플립플롭과 AND 게이트·NOT 게이트로 구성된 1비트 기억소자 회로. 위쪽 라인 (A), 왼쪽 입력 라인 (B), 아래쪽에서 NOT 게이트를 거쳐 들어오는 라인 (C), 오른쪽 출력 라인 (D)가 표시되어 있다'
    choices:
      - { id: '1', text: '(A)' }
      - { id: '2', text: '(B)' }
      - { id: '3', text: '(C)' }
      - { id: '4', text: '(D)' }
    answers: ['3']
    explanation: |
      선택지 1: (A)는 R·S 쪽 AND 게이트와 출력 AND 게이트에 모두 연결되어 이 기억소자를 사용할지 정하는 소자 선택 라인이다.
      선택지 2: (B)는 기억소자에 저장할 값이 들어오는 입력값 라인이다.
      선택지 3: (C)는 출력 AND 게이트에 직접 연결되고, NOT 게이트를 거쳐 R·S 쪽 AND 게이트에도 연결되는 읽기(1)/쓰기(0) 선택 라인이므로 정답이다. 값이 1이면 출력 쪽이 열려 읽기가, 0이면 입력 쪽이 열려 쓰기가 이루어진다.
      선택지 4: (D)는 플립플롭에 저장된 값이 나가는 출력값 라인이다.

      핵심 개념:
      RAM의 1비트 기억소자는 하나의 플립플롭과 논리 게이트들로 구성된다.
      세 가지 라인(입력값, 소자 선택, 읽기/쓰기 선택)이 필요하다.
      $2^m \times n$ RAM은 개념적으로 하나의 디코더, $2^m \times n$개의 1비트 기억소자, $n$개의 OR 게이트로 구성할 수 있다.
      디코더 출력은 소자 선택으로 연결되어 원하는 주소를 고르고, 기억소자의 출력값은 OR 게이트로 모여 RAM의 출력이 된다.

  - id: b05-16
    type: multiple-choice
    prompt: 기억장치의 계층구조에서 (B)에 대한 설명으로 적절한 것은?
    images:
      - path: images/subjects/introduction-to-computer-science/workbook/b05-16.png
        alt: '위에서부터 (A), (B), (C), (D)로 나뉜 피라미드와, 위쪽으로 갈수록 속도 상승·가격 상승·용량 감소를 나타내는 화살표'
    choices:
      - { id: '1', text: '주로 정적 RAM으로 구성되는 기억장치이다.' }
      - { id: '2', text: '반영구적인 프로그램 코드와 데이터가 저장되어 있다.' }
      - { id: '3', text: '중앙처리장치 내부에 존재하며 ALU와 함께 처리장치를 구성한다.' }
      - { id: '4', text: 'CPU가 접근하기 위해서는 주기억장치로 적재되어야 한다.' }
    answers: ['1']
    explanation: |
      선택지 1: (B)는 캐시기억장치로, CPU와 주기억장치 사이에 설치된 접근 속도가 매우 빠른 소규모 기억장치이며 SRAM(Static RAM, 정적 RAM)을 사용하여 구현하므로 정답이다.
      선택지 2: 반영구적으로 프로그램과 데이터를 저장하는 것은 (D) 보조기억장치에 대한 설명이다.
      선택지 3: CPU 내부에 존재하며 ALU(Arithmetic and Logic Unit, 산술논리연산장치)와 함께 처리장치를 구성하는 것은 (A) 레지스터에 대한 설명이다.
      선택지 4: 사용하려면 먼저 주기억장치에 적재되어야 하는 것은 (D) 보조기억장치에 대한 설명이다.

      핵심 개념:
      기억장치는 접근 속도와 저장 용량에 따라 레지스터, 캐시기억장치, 주기억장치, 보조기억장치로 계층을 이룬다.
      이는 CPU가 데이터에 접근할 때 가장 적은 비용으로 가장 높은 성능을 얻기 위한 전략이며, 이론적 근거는 참조의 지역성(공간적·시간적 지역성)이다.
      캐시기억장치는 수행 중인 명령어와 자주 사용하는 데이터 일부를 저장해 두었다가 CPU 요청 시 즉시 제공해 접근 시간을 단축한다.
      주기억장치는 현재 수행 중인 프로그램과 데이터를 저장한다.

  - id: b05-17
    type: multiple-choice
    prompt: 명령어 형식 중에서 연산의 대상이 되는 값의 추출과 연산 결과의 저장이 누산기(AC)에 의해서 이루어지는 방식은?
    choices:
      - { id: '1', text: '0-주소 명령어' }
      - { id: '2', text: '1-주소 명령어' }
      - { id: '3', text: '2-주소 명령어' }
      - { id: '4', text: '3-주소 명령어' }
    answers: ['2']
    explanation: |
      선택지 1: 0-주소 명령어는 오퍼랜드 없이 연산자코드만 있으며, 연산 대상과 결과를 스택에서 처리한다.
      선택지 2: 1-주소 명령어는 연산자코드와 오퍼랜드 1개로 구성되고, 나머지 연산 대상의 추출과 결과 저장을 누산기(AC: ACcumulator)가 담당하므로 정답이다.
      선택지 3: 2-주소 명령어는 오퍼랜드 2개를 가지며 가장 많이 사용되는 형식으로, 결과를 오퍼랜드가 가리키는 곳에 저장한다.
      선택지 4: 3-주소 명령어는 오퍼랜드 3개를 가져 두 연산 대상과 결과 저장 위치를 모두 명령어 안에서 지정한다.

      핵심 개념:
      명령어의 기본 형식은 연산자코드(OP code)와 오퍼랜드(operand)로 이루어진다.
      연산자코드는 수행할 연산의 종류를 지정하고, 그 비트 수가 CPU가 수행할 수 있는 연산의 개수를 결정한다.
      오퍼랜드는 명령어가 사용할 데이터가 저장된 기억장치의 주소를 지정하며, 개수는 컴퓨터 구조에 따라 달라진다.
      오퍼랜드 개수에 따라 3-주소, 2-주소, 1-주소(누산기 사용), 0-주소(스택 사용) 명령어로 나뉜다.

  - id: b05-18
    type: multiple-choice
    prompt: 명령어의 오퍼랜드 내용과 CPU의 레지스터 내용을 더해서 유효 주소를 얻는 주소지정방식은?
    choices:
      - { id: '1', text: '직접 주소지정방식' }
      - { id: '2', text: '간접 주소지정방식' }
      - { id: '3', text: '상대 주소지정방식' }
      - { id: '4', text: '레지스터 주소지정방식' }
    answers: ['3']
    explanation: |
      선택지 1: 직접 주소지정방식은 오퍼랜드의 내용이 실제 데이터가 저장된 기억장치의 주소 자체이므로 레지스터 내용과 더하지 않는다.
      선택지 2: 간접 주소지정방식은 오퍼랜드의 내용이 실제 데이터 주소를 가지고 있는 기억장치의 주소이므로, 두 번의 기억장치 접근으로 데이터를 얻는다.
      선택지 3: 상대 주소지정방식은 CPU 내의 특정 레지스터의 내용에 명령어의 오퍼랜드 내용을 더해서 실제 데이터가 저장된 기억장치 주소를 계산하므로 정답이다.
      선택지 4: 레지스터 주소지정방식은 오퍼랜드가 실제 데이터가 들어 있는 레지스터를 나타내므로 주소 계산 없이 한 번의 레지스터 접근으로 데이터를 얻는다.

      핵심 개념:
      주소지정방식(addressing mode)은 연산에 사용될 데이터가 기억장치의 어디에 위치하는지를 지정하는 방법이다.
      종류로는 즉시, 직접, 간접, 레지스터, 레지스터 간접, 상대, 인덱스된 주소지정방식 등이 있다.
      상대 주소지정방식은 레지스터 값과 오퍼랜드를 더해 유효 주소를 구하므로 한 번의 레지스터 접근과 한 번의 기억장치 접근이 요구된다.
      유효 주소는 실제 데이터가 저장된 기억장치의 주소를 뜻한다.

  - id: b05-19
    type: multiple-choice
    prompt: 주소지정방식 중에서 처리 속도가 가장 느린 것은?
    choices:
      - { id: '1', text: '레지스터 주소지정방식' }
      - { id: '2', text: '상대 주소지정방식' }
      - { id: '3', text: '즉시 주소지정방식' }
      - { id: '4', text: '간접 주소지정방식' }
    answers: ['4']
    explanation: |
      선택지 1: 레지스터 주소지정방식은 오퍼랜드가 데이터가 들어 있는 레지스터를 나타내므로 한 번의 레지스터 접근으로 데이터를 얻어 빠르다.
      선택지 2: 상대 주소지정방식은 레지스터 내용과 오퍼랜드를 더해 주소를 계산하므로 한 번의 레지스터 접근과 한 번의 기억장치 접근이 필요하다. 간접 주소지정방식보다는 빠르다.
      선택지 3: 즉시 주소지정방식은 오퍼랜드 필드의 내용이 실제 데이터이므로 레지스터나 기억장치에 접근할 필요가 없어 가장 빠르다.
      선택지 4: 간접 주소지정방식은 오퍼랜드가 실제 데이터 주소를 담은 기억장치의 주소이므로 두 번의 기억장치 접근이 필요해 가장 느리다. 정답이다.

      핵심 개념:
      실제 데이터를 얻기 위해 레지스터와 기억장치에 접근하는 횟수가 많을수록 처리 속도가 느려진다.
      처리 속도는 즉시, 레지스터, 직접, 상대, 간접 주소지정방식의 순서로 느려진다.
      직접 주소지정방식은 한 번의 기억장치 접근으로 데이터를 얻는다.
      기억장치 접근은 레지스터 접근보다 훨씬 느리므로 기억장치 접근 횟수가 속도를 크게 좌우한다.

  - id: b05-20
    type: multiple-choice
    prompt: 다음에 실행될 명령어가 있는 기억장치의 주소를 저장하고 있는 레지스터는?
    choices:
      - { id: '1', text: 'MBR' }
      - { id: '2', text: 'IR' }
      - { id: '3', text: 'CMAR' }
      - { id: '4', text: 'PC' }
    answers: ['4']
    explanation: |
      선택지 1: MBR(Memory Buffer Register, 기억장치 버퍼 레지스터)은 기억장치에 저장될 또는 기억장치에서 읽어 온 데이터를 임시로 저장하는 레지스터이다.
      선택지 2: IR(Instruction Register, 명령어 레지스터)은 기억장치에서 가져와서 현재 실행 중인 명령어를 저장하는 레지스터이다.
      선택지 3: CMAR(Control Memory Address Register, 제어기억장치 주소 레지스터)은 제어기억장치에서 다음에 수행할 마이크로명령의 위치를 가리키는 주소를 저장하는 레지스터로, 주기억장치의 명령어 주소를 저장하지 않는다.
      선택지 4: PC(Program Counter, 프로그램 카운터)는 다음에 수행될 명령어가 있는 기억장치의 주소를 저장하고 있는 레지스터이므로 정답이다.

      핵심 개념:
      레지스터는 범용 레지스터와 특수 레지스터(AC, MBR, MAR, PC, IR 등)로 나뉜다.
      AC(ACcumulator, 누산기)는 CPU가 연산을 수행한 후 그 결과를 반드시 저장하는 레지스터이다.
      MAR(Memory Address Register, 기억장치 주소 레지스터)은 PC의 내용(주소)이 주소 버스로 출력되기 전에 일시적으로 저장되는 레지스터이다.
      CMDR(Control Memory Data Register, 제어기억장치 데이터 레지스터)은 제어기억장치에서 가져온 다음에 수행할 마이크로연산을 저장한다.

  - id: b05-21
    type: multiple-choice
    prompt: 프로그램 수행 중에 기억장치로부터 인출되어 현재 실행 중인 명령어를 저장하고 있는 레지스터는?
    choices:
      - { id: '1', text: '기억장치 버퍼 레지스터' }
      - { id: '2', text: '프로그램 카운터' }
      - { id: '3', text: '인덱스 레지스터' }
      - { id: '4', text: '명령어 레지스터' }
    answers: ['4']
    explanation: |
      선택지 1: 기억장치 버퍼 레지스터(MBR: Memory Buffer Register)는 기억장치에 저장될 또는 기억장치에서 읽어 온 데이터를 임시로 저장하는 레지스터로, 현재 실행 중인 명령어를 보관하는 전용 레지스터가 아니다.
      선택지 2: 프로그램 카운터(PC: Program Counter)는 다음에 수행될 명령어의 주소를 저장하는 레지스터로, 명령어 자체를 저장하지 않는다.
      선택지 3: 인덱스 레지스터는 인덱스된 주소지정방식에서 주소 계산에 쓰이는 값을 담는 레지스터로, 현재 명령어를 저장하지 않는다.
      선택지 4: 명령어 레지스터(IR: Instruction Register)는 프로그램 수행 중에 기억장치에서 가져와서 현재 실행 중인 명령어를 저장하는 레지스터이므로 정답이다.

      핵심 개념:
      명령어 인출 시 PC가 가리키는 주소의 내용이 주기억장치에서 MBR을 거쳐 IR에 저장된다.
      IR에 저장된 명령어는 명령어 해독기로 보내져 해독된다.
      PC는 다음 명령어의 주소, IR은 현재 명령어 자체를 저장한다는 점을 구분해야 한다.
      MAR은 주소를, MBR은 기억장치와 주고받는 데이터를 임시로 저장한다.

  - id: b05-22
    type: multiple-choice
    prompt: 프로그램 카운터의 내용이 시스템 버스의 주소 버스로 출력되기 전에 일시적으로 저장되는 레지스터는?
    choices:
      - { id: '1', text: '명령어 레지스터' }
      - { id: '2', text: '제어기억장치 데이터 레지스터' }
      - { id: '3', text: '기억장치 주소 레지스터' }
      - { id: '4', text: '기억장치 버퍼 레지스터' }
    answers: ['3']
    explanation: |
      선택지 1: 명령어 레지스터(IR: Instruction Register)는 현재 실행 중인 명령어를 저장하는 레지스터로, 주소를 버스로 내보내기 위한 레지스터가 아니다.
      선택지 2: 제어기억장치 데이터 레지스터(CMDR: Control Memory Data Register)는 제어기억장치에서 가져온 다음에 수행할 마이크로연산을 저장하는 레지스터이다.
      선택지 3: 기억장치 주소 레지스터(MAR: Memory Address Register)는 프로그램 카운터에 들어 있는 내용(주소)이 시스템 버스의 주소 버스로 출력되기 전에 일시적으로 저장되는 레지스터이므로 정답이다.
      선택지 4: 기억장치 버퍼 레지스터(MBR: Memory Buffer Register)는 기억장치에 저장될 또는 기억장치에서 읽어 온 데이터를 임시로 저장하는 레지스터로, 주소가 아닌 데이터를 다룬다.

      핵심 개념:
      기억장치 접근 시 주소는 MAR을 통해 주소 버스로, 데이터는 MBR을 통해 데이터 버스로 오간다.
      명령어 인출 과정은 PC → MAR → 주기억장치 → MBR → IR의 순서로 진행된다.
      CMAR과 CMDR은 제어기억장치에 대해 MAR·MBR과 비슷한 역할을 하는 레지스터이다.
      각 레지스터가 주소를 담는지, 데이터나 명령어를 담는지 구분하는 것이 핵심이다.

  - id: b05-23
    type: multiple-choice
    prompt: 처리장치에서 디코더가 사용되는 곳은?
    choices:
      - { id: '1', text: '상태 레지스터 출력' }
      - { id: '2', text: '산술논리연산장치의 입력 레지스터 선택' }
      - { id: '3', text: '사용할 레지스터 선택' }
      - { id: '4', text: '시프트 선택' }
    answers: ['3']
    explanation: |
      선택지 1: 상태 레지스터는 산술논리연산장치의 연산 결과 상태를 저장하며, 그 출력은 디코더를 거치지 않고 제어장치로 연결된다.
      선택지 2: 산술논리연산장치에 들어갈 입력 레지스터는 멀티플렉서(MUX1, MUX2)가 입력 선택 신호에 따라 고른다.
      선택지 3: 레지스터 쓰기 선택 신호를 디코더가 해독해 R0~R3 중 연산 결과를 기록할 레지스터 하나를 활성화하므로 정답이다.
      선택지 4: 시프트 선택은 시프터에 직접 전달되는 제어신호로, 디코더를 사용하지 않는다.

      핵심 개념:
      처리장치는 레지스터들, 멀티플렉서, 산술논리연산장치, 시프터, 상태 레지스터, 디코더로 구성된다.
      멀티플렉서는 여러 레지스터 중 산술논리연산장치에 입력할 데이터를 선택한다.
      디코더는 레지스터 쓰기 선택 코드를 해독해 결과를 저장할 레지스터 하나만 활성화한다.
      $n$비트 코드로 $2^n$개 중 하나만 활성화한다는 디코더의 특성이 레지스터 선택에 쓰이는 것이다.

  - id: b05-24
    type: multiple-choice
    prompt: 제어장치의 명령어 사이클의 순서가 올바르게 나열된 것은?
    choices:
      - { id: '1', text: '인출 − 실행 − 해독 − 저장' }
      - { id: '2', text: '해독 − 인출 − 실행 − 저장' }
      - { id: '3', text: '인출 − 해독 − 실행 − 저장' }
      - { id: '4', text: '해독 − 실행 − 인출 − 저장' }
    answers: ['3']
    explanation: |
      선택지 1: 명령어를 해독하기 전에는 무엇을 실행할지 알 수 없으므로 실행이 해독보다 앞설 수 없다.
      선택지 2: 명령어를 기억장치에서 가져오기 전에는 해독할 대상이 없으므로 해독이 인출보다 앞설 수 없다.
      선택지 3: 기억장치에서 명령어를 가져와(fetch) 해독(decode)하고 실행(execute)한 뒤 레지스터에 되쓰는(write-back) 순서이므로 정답이다.
      선택지 4: 인출이 해독과 실행 뒤에 오면 해독·실행할 명령어가 없으므로 올바른 순서가 아니다.

      핵심 개념:
      제어장치는 처리장치 및 기억장치와 연결되어 있다.
      기억장치로부터 다음에 수행할 명령어를 가져와서 상응하는 마이크로연산들로 해독한 후 수행하고 레지스터에 되쓴다.
      이 일련의 과정을 명령어 사이클이라 하며, 인출(fetch) → 해독(decode) → 실행(execute) → 저장(write-back)을 반복한다.
      제어장치는 현재 명령을 수행한 다음에 수행할 명령의 주소 정보도 생성한다.

  - id: b05-25
    type: multiple-choice
    prompt: 다음 그림에서 A～D에 적합한 레지스터들을 올바르게 나열한 것은?
    images:
      - path: images/subjects/introduction-to-computer-science/workbook/b05-25.png
        alt: '주기억장치와 중앙처리장치 구성도. 주기억장치를 가리키는 A, 주기억장치에서 데이터를 받는 B, B에서 명령어 해독기/주소결정회로로, 다시 C로, C가 제어기억장치(ROM)를 가리키고, 제어기억장치의 내용이 D로 들어가 제어단어가 처리장치로 전달되는 그림'
    choices:
      - { id: '1', text: 'IR − PC − CMDR − CMAR' }
      - { id: '2', text: 'IR − PC − CMAR − CMDR' }
      - { id: '3', text: 'PC − IR − CMDR − CMAR' }
      - { id: '4', text: 'PC − IR − CMAR − CMDR' }
    answers: ['4']
    explanation: |
      선택지 1: A를 IR, B를 PC로 두면 주기억장치의 주소를 가리키는 레지스터와 명령어를 받는 레지스터가 뒤바뀌고, C와 D도 제어기억장치의 주소·데이터 역할이 뒤바뀐다.
      선택지 2: C·D는 CMAR·CMDR로 맞지만, 주기억장치의 주소를 가리키는 A는 PC, 주기억장치에서 가져온 명령어를 받는 B는 IR이어야 하므로 A와 B가 뒤바뀌었다.
      선택지 3: A·B는 PC·IR로 맞지만, 제어기억장치의 주소를 가리키는 C는 CMAR, 제어기억장치에서 읽은 제어단어를 받는 D는 CMDR이어야 하므로 C와 D가 뒤바뀌었다.
      선택지 4: A는 프로그램 카운터(PC), B는 명령어 레지스터(IR), C는 제어기억장치 주소 레지스터(CMAR), D는 제어기억장치 데이터 레지스터(CMDR)이므로 정답이다.

      핵심 개념:
      PC에 저장된 주소가 가리키는 곳의 내용물을 주기억장치에서 가져와서 IR에 저장한다.
      명령어 해독기/주소결정회로가 주어진 명령어로부터 제어기억장치의 해당 마이크로명령의 주소를 생성해서 CMAR에 저장한다.
      제어기억장치에서 CMAR에 저장된 주소가 가리키는 곳의 내용을 읽어서 CMDR에 저장한다.
      CMDR의 제어단어 비트들이 처리장치로 보내져 연산이 수행된다.

      ※ 원본 표기: 해설에서 D를 '제어기억장치 데이터 레지스터(CMBR)'로 표기했다. 선택지와 문제 20 해설의 표기는 CMDR이다.

  - id: b05-26
    type: multiple-choice
    prompt: 입출력장치와 CPU 또는 주기억장치와의 데이터 전송 속도, 데이터 처리 단위, 오류 확률 등의 차이를 상쇄해서 올바른 전송을 위한 방법을 제공하기 위한 입출력 시스템의 구성요소는?
    choices:
      - { id: '1', text: '입출력장치 중재기' }
      - { id: '2', text: '입출력장치 인터페이스' }
      - { id: '3', text: '입출력장치 제어기' }
      - { id: '4', text: '입출력장치 버스' }
    answers: ['2']
    explanation: |
      선택지 1: 중재기(arbiter)는 여러 입출력장치가 하나의 버스를 공유할 때 동시에 버스에 접근해서 생기는 충돌을 막는 장치로, 전송 특성의 차이를 상쇄하는 구성요소가 아니다.
      선택지 2: 입출력장치 인터페이스는 입출력장치와 컴퓨터 내부의 중앙처리장치/주기억장치와의 상이한 데이터 전송 속도, 데이터 처리 단위, 오류 확률 등의 차이를 상쇄하기 위한 것이므로 정답이다.
      선택지 3: 입출력장치 제어기는 모터를 회전시키거나 기계적인 요소를 이동시키는 등 입출력장치를 구동시키는 작업을 수행하는 기기이다.
      선택지 4: 입출력 버스는 입출력 전용으로 사용되는 정보 회선의 묶음으로, 입출력장치와 중앙처리장치 사이의 정보 교환에 사용된다.

      핵심 개념:
      입출력 시스템의 구성요소는 입출력장치, 입출력장치 제어기, 입출력장치 인터페이스, 입출력 버스이다.
      입출력장치는 키보드, 모니터처럼 사용자와 컴퓨터 시스템을 연결해 준다.
      인터페이스는 입출력장치와 CPU·주기억장치 사이의 속도·처리 단위·오류 확률 차이를 조정한다.
      입출력 버스는 여러 장치가 공유하므로 충돌을 막기 위한 중재기가 필요하다.

  - id: b05-27
    type: multiple-choice
    prompt: 입출력 제어 방식 중에서 중앙처리장치와 같이 연산 작업도 수행 가능한 별도의 입출력 프로세서를 사용하는 방식은?
    choices:
      - { id: '1', text: '프로그램에 의한 방식' }
      - { id: '2', text: 'DMA에 의한 방식' }
      - { id: '3', text: '인터럽트에 의한 방식' }
      - { id: '4', text: '채널에 의한 방식' }
    answers: ['4']
    explanation: |
      선택지 1: 프로그램에 의한 방식은 CPU가 주기적으로 입출력장치에 신호를 보내 입출력이 필요한지를 물어보는 CPU에 의한 방식으로, 별도의 프로세서를 사용하지 않는다.
      선택지 2: DMA(Direct Memory Access)에 의한 방식은 전용 하드웨어인 DMA 제어기가 주기억장치와 입출력장치 사이의 데이터 전송을 담당하지만, 연산 작업까지 수행하는 입출력 프로세서는 아니다.
      선택지 3: 인터럽트에 의한 방식은 입출력장치가 인터럽트를 걸 때만 CPU가 해당 장치와 연락하는 CPU에 의한 방식이다.
      선택지 4: 채널에 의한 방식은 채널이라고 하는 입출력 전용의 별도 처리장치(산술/논리/분기 등의 다양한 연산 작업도 가능)를 사용하여 입출력 작업을 지능적으로 전담하도록 하는 방식이므로 정답이다.

      핵심 개념:
      입출력 제어 방식은 CPU에 의한 방식(프로그램, 인터럽트), DMA에 의한 방식, 채널에 의한 방식으로 나뉜다.
      DMA 방식에서 CPU는 초기 설정과 허가에만 관여하고, 전송이 끝나면 DMA가 CPU에 인터럽트 신호를 보낸다.
      채널 방식은 입출력에 대한 CPU의 부담이 거의 없다.
      채널은 CPU에게서 입출력 명령을 받은 뒤 채널 프로그램을 스스로 실행하며, 주기억장치와 입출력장치 사이의 데이터 전송을 CPU 대신 처리한다.

      ※ 원본 표기: 워크북 해설은 채널이 "DMA와는 달리 CPU를 거쳐서 주기억장치에 접근"한다고 인쇄되어 있으나, 일반적인 컴퓨터 구조에서 채널은 DMA처럼 CPU를 거치지 않고 주기억장치에 직접 접근한다. 인쇄된 정답은 그대로 둔다.

  - id: b05-28
    type: multiple-choice
    prompt: CPU가 주기적으로 입출력장치에 신호를 보내 입출력이 필요한지를 물어보기 때문에 시간적 낭비가 심하고 처리 효율이 떨어지기는 하지만 입출력 요구가 발생했을 때 CPU가 입출력 작업만을 수행함으로써 고속의 처리가 가능한 입출력 제어 방식은?
    choices:
      - { id: '1', text: '인터럽트에 의한 방식' }
      - { id: '2', text: '채널에 의한 방식' }
      - { id: '3', text: '프로그램에 의한 방식' }
      - { id: '4', text: 'DMA에 의한 방식' }
    answers: ['3']
    explanation: |
      선택지 1: 인터럽트에 의한 방식은 입출력장치가 인터럽트를 걸 때만 CPU가 해당 장치와 연락하므로 CPU가 주기적으로 물어보지 않는다.
      선택지 2: 채널에 의한 방식은 채널이라는 별도의 입출력 전용 처리장치가 입출력을 전담하므로 CPU가 입출력 작업만을 수행하지 않는다.
      선택지 3: 프로그램에 의한 방식은 CPU가 주기적으로 입출력장치에 신호를 보내 입출력이 필요한지를 물어보는 방식으로, 시간 낭비가 크지만 입출력 요구 시 CPU가 입출력만 처리해 빠르므로 정답이다.
      선택지 4: DMA(Direct Memory Access)에 의한 방식은 DMA 제어기가 CPU를 거치지 않고 주기억장치와 입출력장치 사이의 데이터를 전송하므로 CPU가 입출력 작업을 직접 수행하지 않는다.

      핵심 개념:
      CPU에 의한 입출력 제어 방식은 입출력장치의 정보가 CPU를 통해 주기억장치에 쓰이고 읽히는 방식이다.
      프로그램에 의한 방식은 CPU가 장치 상태를 반복해서 확인(폴링)하므로 CPU 시간이 낭비된다.
      인터럽트에 의한 방식은 장치가 준비되었을 때만 CPU에 알려 낭비를 줄인다.
      DMA와 채널 방식은 CPU의 입출력 부담을 더 줄이기 위한 방식이다.

  - id: b05-29
    type: multiple-choice
    prompt: 컴퓨터의 실행 주기 동안에 여러 단계를 서로 겹치게 함으로써 실행 속도를 직접적으로 향상시키지 않고도 컴퓨터의 처리율을 증가시킬 수 있는 기술은?
    choices:
      - { id: '1', text: '멀티코어' }
      - { id: '2', text: '파이프라이닝' }
      - { id: '3', text: 'GPGPU' }
      - { id: '4', text: '오버래핑' }
    answers: ['2']
    explanation: |
      선택지 1: 멀티코어는 명령을 가져와서 수행하는 코어를 여러 개 사용해 코어의 개수만큼의 명령어를 동시에 처리하는 기술로, 한 실행 주기의 단계를 겹치는 기술이 아니다.
      선택지 2: 파이프라이닝은 명령어 처리 단계를 여러 단계로 구성하여, 한 단계를 처리 중일 때 다른 명령어가 다른 단계를 처리하도록 겹쳐 수행함으로써 처리율을 높이는 기술이므로 정답이다.
      선택지 3: GPGPU(General-Purpose computing on Graphics Processing Unit, 그래픽스 처리 장치를 사용한 범용 연산)는 그래픽스 카드의 고도의 병렬처리 능력을 거꾸로 연산에 사용하는 기술이다.
      선택지 4: 오버래핑(overlapping)은 '겹친다'는 뜻의 일반적인 말이다. 명령어 처리를 여러 단계로 나누고 각 단계를 겹쳐 수행해 처리율을 높이는 기술을 가리키는 이름은 파이프라이닝이다.

      핵심 개념:
      파이프라인 처리기는 명령어 수준의 병렬처리 방식이다.
      CPU 내에 있는 하드웨어 요소의 일부를 파이프라인 형태로 구성하여 필요한 작업을 시간상으로 중첩하여 수행한다.
      연달아 수행될 명령어들이 서로 간섭이 없으면, 현재 명령의 첫 단계가 끝나자마자 다음 명령의 첫 단계를 처리한다.
      이 밖의 병렬처리 기술로 멀티코어 구조와 그래픽 카드를 활용한 GPGPU 등이 있다.

  - id: b05-30
    type: multiple-choice
    prompt: 파이프라인 구조가 4단계로 구성되어 있고 10개의 명령어가 주어졌을 때 모든 명령어를 처리하기 위해서는 최소 몇 번의 클록이 필요한가? (단, 각 명령어 수행에 4단계가 필요하다고 가정한다.)
    choices:
      - { id: '1', text: '40' }
      - { id: '2', text: '30' }
      - { id: '3', text: '13' }
      - { id: '4', text: '12' }
    answers: ['3']
    explanation: |
      선택지 1: 40은 파이프라인 없이 10개의 명령어를 각각 4단계씩 순차 처리할 때($10 \times 4$)의 클록 수이다.
      선택지 2: 30은 단계 겹침을 고려한 계산 결과가 아니며, 파이프라인에서 필요한 최소 클록 수보다 많다.
      선택지 3: 첫 명령어가 4클록에 끝난 뒤 나머지 9개가 1클록마다 하나씩 완료되므로 $4 + (10 - 1) = 10 + 3 = 13$클록이 필요하다. 정답이다.
      선택지 4: 12클록 시점에는 열 번째 명령어가 아직 4단계 중 3단계까지만 처리되어 완료되지 않는다.

      핵심 개념:
      10개 명령어의 처리가 완료되는 시점은 마지막 열 번째 명령어의 처리가 끝나는 시점이다.
      열 번째 명령어는 열 번째 클록에 단계1의 처리를 시작하고 나머지 3단계를 더 거쳐야 완료된다.
      일반적으로 $k$단계 파이프라인에서 $n$개 명령어의 최소 클록 수는 $k + (n - 1)$이다.
      $4 + (10 - 1) = 13$이므로 파이프라인이 없는 경우의 40클록보다 크게 줄어든다.

  - id: b06-01
    type: multiple-choice
    passageRefs: [gb06-lisp-code-01]
    prompt: 다음의 프로그램 작성에 사용된 언어와 같은 유형의 프로그래밍 언어는 무엇인가?
    choices:
      - { id: '1', text: 'C' }
      - { id: '2', text: '리스프(LISP)' }
      - { id: '3', text: '기계어' }
      - { id: '4', text: 'COBOL' }
    answers: ['2']
    explanation: |
      선택지 1: C는 조건문·반복문·블록 구조·함수 호출로 실행 흐름을 제어하는 구조적(절차적) 프로그래밍 언어로, 괄호로 감싼 전위 표기 수식을 연속으로 평가하는 제시된 코드와 유형이 다르다.
      선택지 2: 제시된 코드는 `(+ 3 2)`처럼 함수(연산자)를 앞에 두고 인자를 괄호로 묶는 수식(expression)의 연속으로 이루어져 있으며, 이는 리스프(LISP, LISt Processor) 계열의 함수형 프로그래밍 언어 형태이므로 정답이다.
      선택지 3: 기계어는 0과 1의 2진수로 구성되어 하드웨어를 직접 제어하는 저급 언어로, 기호로 된 수식이 나타나는 제시된 코드와 다르다.
      선택지 4: COBOL(COmmon Business-Oriented Language)은 사무 처리용 절차적 언어로, 문장 단위 명령을 순서대로 기술하므로 함수형 언어가 아니다.

      핵심 개념:
      함수형 프로그래밍 언어는 기본적으로 수식(expression)의 연속으로 이루어져 있고 함수들을 사용해 수식을 변환한다.
      수식은 사칙연산뿐 아니라 일반적인 의미의 모든 함수를 뜻하며, 함수의 결과를 다른 함수의 입력값으로 사용한다.
      `(+ 1 (if t 2 3))`처럼 한 함수의 결과가 다른 함수의 인자가 되는 중첩 수식이 전형적인 형태다.
      리스프(LISP), 스킴(Scheme), ML 등이 함수형 언어에 속한다.

  - id: b06-02
    type: multiple-choice
    prompt: 다음 중 스크립트 언어에 해당되는 것은?
    choices:
      - { id: '1', text: '펄(Perl)' }
      - { id: '2', text: '리스프(LISP)' }
      - { id: '3', text: '프롤로그(Prolog)' }
      - { id: '4', text: 'HTML' }
    answers: ['1']
    explanation: |
      선택지 1: 펄(Perl)은 파이썬(Python)과 함께 웹 기반 서비스에서 많이 사용되는 대표적인 스크립트 언어이므로 정답이다.
      선택지 2: 리스프(LISP)는 수식의 연속으로 프로그램을 구성하는 함수형 프로그래밍 언어로, 스크립트 언어로 분류하지 않는다.
      선택지 3: 프롤로그(Prolog)는 사실(fact)과 규칙(rule)을 정의하고 질의(query)로 결과를 얻는 논리형 프로그래밍 언어이다.
      선택지 4: HTML(HyperText Markup Language)은 웹 문서의 구조를 표시하는 마크업 언어로, 실행 흐름을 기술하는 스크립트 언어가 아니다.

      핵심 개념:
      스크립트 언어는 유닉스(Unix) 같은 운영체제의 관리와 자동화를 위해 만들어져 사용되기 시작한 언어다.
      셸 스크립트(sh, bash, csh 등)와 패턴 처리 스크립트 언어(awk, sed) 등에서 시작되었다.
      최근에는 펄(Perl), 파이썬(Python) 등의 스크립트 언어가 웹 기반 서비스에서 많이 사용된다.
      논리형(Prolog), 함수형(LISP), 마크업 언어(HTML)와 구분해 기억한다.

  - id: b06-03
    type: multiple-choice
    passageRefs: [gb06-lisp-code-01]
    prompt: 다음과 같은 프로그램이 속하는 언어 부류는 무엇인가?
    choices:
      - { id: '1', text: '객체지향 프로그래밍 언어' }
      - { id: '2', text: '구조적 프로그래밍 언어' }
      - { id: '3', text: '논리형 프로그래밍 언어' }
      - { id: '4', text: '함수형 프로그래밍 언어' }
    answers: ['4']
    explanation: |
      선택지 1: 객체지향 프로그래밍 언어는 객체(object) 개념[클래스(class) 개념]을 정의하고 객체에 대한 연산(메소드)과 성질(멤버변수)로 프로그램을 작성하는 언어(C++, 스몰토크-80, 자바 등)로, 제시된 코드에는 클래스나 객체 정의가 없다.
      선택지 2: 구조적 프로그래밍 언어는 알골 60(Algol 60)처럼 조건문과 반복문으로 실행 흐름을 제어하고 블록(block) 구조, 함수 호출 등을 도입한 언어로, 수식만 나열된 제시된 코드와 형태가 다르다.
      선택지 3: 논리형 프로그래밍 언어는 형식 논리(formal logic)로 사실(fact)과 규칙(rule)으로 이루어진 문제 도메인 모델을 정의하고 질의(query)로 결과를 얻는 선언형 언어로, 제시된 코드에는 사실·규칙·질의가 없다.
      선택지 4: 제시된 코드는 `(+ 3 2)`, `(length (a b c))`처럼 함수를 적용하는 수식(expression)의 연속이며, 함수의 결과를 다른 함수의 입력값으로 쓰므로 함수형 프로그래밍 언어에 속한다.

      핵심 개념:
      기계어는 0과 1로 하드웨어를 직접 제어하고, 어셈블리어는 기계어 명령을 알파벳 기호로 바꾼 언어다.
      함수형 언어는 수식의 연속으로 이루어지고 함수들로 수식을 변환한다(스킴, ML 등).
      구조적 언어는 조건문·반복문·블록 구조·함수 호출을 도입했고, 논리형 언어는 사실과 규칙에 질의를 주어 논리적 추론으로 결과를 얻는다.
      객체지향 언어는 객체 중심 사고의 틀을 제공하고, 스크립트 언어는 운영체제 관리·자동화에서 출발했다.

      ※ 원본 표기: 해설의 논리형 프로그래밍 언어 설명에 "프롤로그(Prolog)와 리스프(LISP)가 대표적인 예"라고 인쇄되어 있으나, 문제 1의 정답과 같이 리스프(LISP)는 함수형 언어이다.

  - id: b06-04
    type: multiple-choice
    prompt: 객체지향 프로그래밍 언어에서 같은 속성과 함수를 갖는 객체들의 모임을 무엇이라고 하는가?
    choices:
      - { id: '1', text: '클래스' }
      - { id: '2', text: '바인딩' }
      - { id: '3', text: '메시지' }
      - { id: '4', text: '메소드' }
    answers: ['1']
    explanation: |
      선택지 1: 클래스(class)는 같은 속성(멤버 변수)과 함수(메소드)를 갖는 객체들을 묶어 정의한 틀로, 객체의 추상화를 구현한 것이므로 정답이다.
      선택지 2: 바인딩(binding)은 변수·함수 이름 등의 프로그램 요소를 그 값이나 기억장소, 실제 코드와 연결하는 것으로, 객체들의 모임을 뜻하지 않는다.
      선택지 3: 메시지(message)는 한 객체가 다른 객체에게 메소드 실행을 요청하는 수단으로, 객체들의 모임이 아니다.
      선택지 4: 메소드(method)는 객체에 대해 수행되는 연산(함수) 하나를 뜻하며, 객체들을 묶는 단위가 아니다.

      핵심 개념:
      개발자는 클래스의 이름과 메소드를 통해서만 객체에 처리를 요청할 수 있으며, 이러한 객체의 추상화를 구현한 것이 클래스다.
      프로시저의 추상화는 객체지향 프로그램에서 클래스의 호출을 통해 구현된다.
      캡슐화는 추상화된 객체의 이름을 통해 객체를 호출하도록 하는 윈도(window)를 제공하며, 외부에 알려 주는 부분을 공용부(public part), 보호되는 구현 부분을 전용부(private part)라 한다.
      객체 캡슐화 구조로 객체 추상화를 구현하여 프로그램의 재사용성과 안전성을 향상시킨다.

  - id: b06-05
    type: multiple-choice
    prompt: 형식 문법의 파스 트리에서 중간 노드에 해당하는 것은?
    choices:
      - { id: '1', text: '단말 기호' }
      - { id: '2', text: '비단말 기호' }
      - { id: '3', text: '생성 규칙' }
      - { id: '4', text: '시작 기호' }
    answers: ['2']
    explanation: |
      선택지 1: 단말 기호(terminal symbol)는 문장을 이루는 단어들로, 파스 트리의 단말(잎) 노드에 해당한다.
      선택지 2: 비단말 기호(non-terminal symbol)는 단말 기호가 아니면서 단말 기호와 비단말 기호의 조합으로 구성되는 기호로, 파스 트리의 내부(중간) 노드에 해당하므로 정답이다.
      선택지 3: 생성 규칙(production rule)은 하나의 비단말 기호가 다른 단말·비단말 기호로 어떻게 대체되는지 정의하는 규칙으로, 파스 트리의 노드가 아니라 노드 간 부모-자식 관계를 만드는 근거다.
      선택지 4: 시작 기호(start symbol)는 가장 상위 계층의 비단말 기호(보통 〈문장〉)로, 파스 트리의 루트 노드에 해당한다.

      핵심 개념:
      자연어에서는 사전의 단어(관사, 명사, 동사 등)가 단말 기호, 〈명사구〉·〈동사구〉·〈문장〉 등이 비단말 기호다.
      생성 규칙의 예: 〈문장〉 → 〈명사구〉+〈동사구〉, 〈명사구〉 → 〈관사〉+〈명사〉.
      파스 트리에서 루트 = 시작 기호, 내부 노드 = 비단말 기호, 단말 노드 = 단말 기호다.
      생성 규칙을 적용할 때마다 비단말 기호 노드 아래에 자식 노드가 생긴다.

  - id: b06-06
    type: multiple-choice
    prompt: 컴파일 과정 중에서 토큰들을 입력받아 결과로서 파스 트리를 생성하는 단계는?
    choices:
      - { id: '1', text: '어휘 분석 단계' }
      - { id: '2', text: '구문 분석 단계' }
      - { id: '3', text: '의미 분석 단계' }
      - { id: '4', text: '코드 생성 단계' }
    answers: ['2']
    explanation: |
      선택지 1: 어휘 분석(lexical analysis)은 프로그램을 구성하는 문자들의 나열로부터 단어[토큰(token), 단말 기호]를 추출하는 단계로, 토큰을 입력받는 것이 아니라 토큰을 만들어 낸다.
      선택지 2: 구문 분석(syntax analysis)은 어휘 분석의 결과로 나온 토큰들의 나열이 해당 프로그래밍 언어의 문법에 맞는지 확인하는 단계이며, 문법 적합성 확인을 위해 파스 트리를 생성하므로 정답이다.
      선택지 3: 의미 분석(semantic analysis)은 구문적으로 올바른 프로그램의 의미(변수형 호환 등)를 검사하는 단계로, 파스 트리를 입력으로 사용하며 파스 트리를 생성하는 단계가 아니다.
      선택지 4: 코드 생성(code generation)은 구문 분석 결과로 변수, 상수, 제어의 흐름 등이 결정되면 명령어를 어셈블리어로 풀어 쓰거나 직접 기계어 이진 코드를 생성하는 단계이다.

      핵심 개념:
      어휘 분석은 빈 칸을 기준으로 단어를 구분하고, 각 단어를 이름·숫자·수식기호 등으로 분류하여 토큰을 만든다.
      구문 분석은 토큰 나열의 문법 적합성을 확인하며 파스 트리를 생성한다.
      코드 생성은 구문 분석 결과를 바탕으로 어셈블리어 또는 기계어 이진 코드를 만든다.
      컴파일 과정: 프로그램 작성 → 어휘 분석 → 구문 분석 → 코드 생성 → 실행 코드.

  - id: b06-07
    type: multiple-choice
    prompt: 고급언어 프로그램에서 실행 코드까지의 변환 순서로 올바른 것은?
    choices:
      - { id: '1', text: '구문 분석, 코드 생성, 어휘 분석' }
      - { id: '2', text: '코드 생성, 구문 분석, 어휘 분석' }
      - { id: '3', text: '어휘 분석, 구문 분석, 코드 생성' }
      - { id: '4', text: '어휘 분석, 코드 생성, 구문 분석' }
    answers: ['3']
    explanation: |
      선택지 1: 구문 분석은 어휘 분석이 만든 토큰을 입력으로 받으므로 어휘 분석보다 먼저 올 수 없다.
      선택지 2: 코드 생성은 구문 분석 결과로 변수, 상수, 제어의 흐름이 결정된 뒤에 수행되므로 가장 먼저 올 수 없고, 순서가 완전히 거꾸로 되어 있다.
      선택지 3: 문자 나열에서 토큰을 추출(어휘 분석)하고, 토큰 나열의 문법 적합성을 확인하며 파스 트리를 만든(구문 분석) 뒤, 그 결과로 기계어 코드를 만드는(코드 생성) 순서이므로 정답이다.
      선택지 4: 코드 생성은 구문 분석의 결과가 있어야 수행할 수 있으므로 구문 분석보다 앞설 수 없다.

      핵심 개념:
      컴파일 과정은 프로그램 작성 → 어휘 분석 → 구문 분석 → 코드 생성 → 실행 코드 순이다.
      각 단계의 출력이 다음 단계의 입력이 된다: 문자열 → 토큰 → 파스 트리 → 어셈블리어/기계어 코드.
      어휘 분석은 단어(토큰) 단위, 구문 분석은 문법 구조 단위로 프로그램을 다룬다.
      코드 생성은 변수, 상수, 제어의 흐름이 결정된 뒤 이루어진다.

  - id: b06-08
    type: multiple-choice
    prompt: C언어에서 int x=10+“hello”;의 명령이 주어졌을 때 어떤 오류나 경고가 뜨는가?
    choices:
      - { id: '1', text: '문법 오류(syntax error)' }
      - { id: '2', text: '실행 오류(runtime error)' }
      - { id: '3', text: '논리 오류(logic error)' }
      - { id: '4', text: '형검사(type checking)' }
    answers: ['4']
    explanation: |
      선택지 1: 문법 오류(syntax error)는 토큰의 나열이 언어의 문법에 맞지 않을 때 구문 분석에서 발견되는 오류로, 제시된 문장은 `변수형 이름 = 수식;`의 문법 형태는 갖추고 있다.
      선택지 2: 실행 오류(runtime error)는 0으로 나누기처럼 프로그램 실행 중에 발생하는 오류이다. 이 문장의 변수형 불일치(포인터 값을 int형 변수에 대입)는 실행하기 전, 컴파일 과정에서 드러난다.
      선택지 3: 논리 오류(logic error)는 프로그램이 정상 실행되지만 의도와 다른 결과를 내는 알고리즘상의 잘못으로, 변수형 호환성 문제와 다르다.
      선택지 4: C에서 문자열 상수 "hello"는 문자 배열의 시작 주소(char * 포인터)로 쓰이므로 10+"hello"는 포인터에 정수를 더하는 연산이 되고, 그 결과인 포인터 값을 int형 변수 x에 대입하게 된다. 포인터형과 int형은 호환되지 않으므로 컴파일 과정의 형검사(type checking)에서 오류나 경고가 발생한다. 따라서 정답이다.

      핵심 개념:
      변수형은 상수(constant)나 변수(variable)의 종류를 지정해 호환성이 없는 변수형 간의 연산을 막는다.
      호환성 없는 연산은 데이터 손실을 일으키거나(정수·실수 덧셈을 정수형으로 수행) 의미가 없다(정수를 문자열로 나누기).
      변수형이 호환되지 않는 연산을 찾아내는 것을 형검사(type checking)라 한다.
      형검사에는 컴파일 과정의 정적(static)형 검사와 실행(run-time) 중의 동적(dynamic)형 검사가 있다.

  - id: b06-09
    type: multiple-choice
    prompt: 다음 중 프로그램에 관한 사고를 간소화하기 위한 방법이 ==아닌== 것은?
    choices:
      - { id: '1', text: '암호화' }
      - { id: '2', text: '추상화' }
      - { id: '3', text: '코드 숨기기' }
      - { id: '4', text: '캡슐화' }
    answers: ['1']
    explanation: |
      선택지 1: 암호화는 데이터를 제3자가 읽을 수 없도록 변환하는 보안 기법으로, 프로그램에 관한 사고를 간소화하는 방법이 아니므로 정답이다.
      선택지 2: 추상화는 필수적인 속성만으로 대상을 묘사하고 부수적이거나 불필요한 속성은 숨기거나 삭제하여 동일한 부류의 객체들을 하나로 묶어 표현하므로 사고를 간소화하는 방법이다.
      선택지 3: 코드 숨기기(정보 은닉)는 구현 부분을 전용부(private part)로 감추어 외부에서 알 필요가 없게 하므로 사고를 간소화하는 방법이다.
      선택지 4: 캡슐화(encapsulation)는 자료형의 표현과 관련 연산을 함께 묶고, 추상화된 객체의 이름을 통해 호출하는 윈도(window)만 제공하므로 사고를 간소화하는 방법이다.

      핵심 개념:
      추상화는 공통의 유사성을 표현하고 차이점을 삭제하여 동일한 부류의 객체를 하나로 묶어 표현하는 방법이다.
      추상 자료형은 객체들의 집합과 이들 객체에 적용되는 연산들의 집합이다.
      캡슐화는 외부에 알려 주는 공용부(public part, 가시부)와 보호되는 구현 부분인 전용부(private part)를 나눈다.
      추상화·캡슐화·코드 숨기기는 모두 불필요한 세부를 감춰 프로그램에 관한 사고를 간소화한다.

  - id: b06-10
    type: multiple-choice
    prompt: 프로그래머에게 추상화된 객체의 이름을 통해 객체를 호출하여 사용하도록 하는 윈도(window)를 제공하는 것은?
    choices:
      - { id: '1', text: '클래스' }
      - { id: '2', text: '캡슐화' }
      - { id: '3', text: '메시지' }
      - { id: '4', text: '메소드' }
    answers: ['2']
    explanation: |
      선택지 1: 클래스(class)는 같은 속성과 함수를 갖는 객체들의 모임을 정의한 틀로, 객체의 추상화를 구현한 것이지 호출용 윈도를 제공하는 기법 자체는 아니다.
      선택지 2: 캡슐화(encapsulation)는 프로그래머에게 추상화된 객체의 이름을 통해 객체를 호출하여 사용하도록 하는 윈도(window)를 제공하므로 정답이다.
      선택지 3: 메시지(message)는 객체에게 메소드 실행을 요청하는 수단으로, 객체 호출 창구를 구성하는 기법이 아니다.
      선택지 4: 메소드(method)는 객체에 대한 연산(함수)으로, 윈도를 통해 호출되는 대상일 뿐 윈도를 제공하는 개념이 아니다.

      핵심 개념:
      윈도를 통해 객체의 호출을 외부에 알려 주는 부분을 공용부(public part) 또는 가시부(visible part)라 한다.
      캡슐화로 보호되는 구현 부분을 전용부(private part)라 한다.
      자동차 운전자는 엑셀·브레이크 같은 공용부만 알면 되고, 엔진의 상세 기능 같은 전용부는 몰라도 운전할 수 있다.
      자료 추상화는 자료형의 표현과 관련 연산을 함께 묶어 캡슐화하는 기법이다.

  - id: b07-01
    type: multiple-choice
    prompt: 데이터베이스 정의에 대한 설명으로 올바르지 ==못한== 것은?
    choices:
      - { id: '1', text: '컴퓨터가 접근 가능한 저장매체에 저장된 데이터 집합이다.' }
      - { id: '2', text: '단순 입출력 데이터를 포함하지 않는 운영 데이터의 집합이다.' }
      - { id: '3', text: '각 응용 프로그램이 독립적으로 소유하고 사용하기 위한 데이터의 집합이다.' }
      - {
          id: '4',
          text: '제한적으로 통제된 범위 내에서 데이터의 중복을 허용하는 통합 데이터의 집합이다.',
        }
    answers: ['3']
    explanation: |
      선택지 1: 저장 데이터(stored data)의 설명이다. 데이터베이스는 컴퓨터가 접근할 수 있는 저장매체에 저장되므로 올바른 설명이다.
      선택지 2: 운영 데이터(operational data)의 설명이다. 단순한 입출력 데이터나 작업 처리 과정의 일시적인 데이터를 제외하고, 조직의 목적과 유용성 측면에서 반드시 유지해야 할 데이터이므로 올바른 설명이다.
      선택지 3: 데이터베이스의 공유 데이터(shared data)는 한 조직의 여러 응용 프로그램이 공동으로 소유하고 사용하는 데이터다. 각 응용 프로그램이 독립적으로 소유하는 것은 데이터베이스 이전의 파일 처리 방식이므로 올바르지 못한 설명이다.
      선택지 4: 통합 데이터(integrated data)의 설명이다. 중복을 배제해 일관성을 유지하되, 시스템 성능 향상을 위해 제한적으로 통제된 범위 내의 최소한의 중복은 허용하므로 올바른 설명이다.

      핵심 개념:
      데이터베이스(DB: Database)는 한 조직의 여러 응용 시스템이 공유해서 사용하기 위한 통합, 저장, 운영 데이터의 집합이다.
      공유: 여러 응용 프로그램이 공동으로 소유하고 사용한다.
      통합: 중복을 배제하되 성능을 위한 최소한의 통제된 중복은 허용한다.
      저장: 컴퓨터가 접근할 수 있는 저장매체에 저장한다.
      운영: 조직의 목적상 반드시 유지해야 할 데이터로, 일시적인 입출력 데이터는 제외한다.

  - id: b07-02
    type: multiple-choice
    prompt: 데이터베이스의 특징에 대한 설명으로 적절하지 ==않은== 것은?
    choices:
      - { id: '1', text: '주소에 의한 참조' }
      - { id: '2', text: '동시 공유' }
      - { id: '3', text: '실시간 접근성' }
      - { id: '4', text: '계속적인 변화' }
    answers: ['1']
    explanation: |
      선택지 1: 데이터베이스는 데이터가 저장된 위치나 주소가 아니라, 사용자가 요구하는 내용인 데이터의 값에 따라 참조하는 내용에 의한 참조(contents reference)를 특징으로 한다. 주소에 의한 참조는 적절하지 않으므로 정답이다.
      선택지 2: 동시 공유(concurrent sharing)는 서로 다른 목적을 가진 여러 사용자가 동시에 원하는 데이터에 접근할 수 있다는 특징이다.
      선택지 3: 실시간 접근성(real-time accessibility)은 수시로 접근하는 사용자의 요구를 즉시 처리하여 응답할 수 있다는 특징이다.
      선택지 4: 계속적인 변화(continuous evolution)는 현실 세계의 상태를 정확히 반영하기 위해 삽입, 삭제, 갱신으로 데이터가 계속 변한다는 특징이다.

      핵심 개념:
      데이터베이스의 4가지 특징은 실시간 접근성, 계속적인 변화, 동시 공유, 내용에 의한 참조이다.
      실시간 접근성: 사용자 요구에 즉시 응답한다.
      계속적인 변화: 삽입·삭제·갱신으로 현재의 정확한 데이터를 유지한다.
      동시 공유: 여러 사용자가 동시에 같은 데이터에 접근한다.
      내용에 의한 참조: 위치나 주소가 아닌 데이터 값으로 참조한다.

  - id: b07-03
    type: multiple-choice
    prompt: 데이터베이스에 들어 있는 데이터의 값과 그것이 표현하는 현실 세계의 실제값이 일치하는 정확성을 의미하는 용어는?
    choices:
      - { id: '1', text: '데이터의 일관성' }
      - { id: '2', text: '데이터의 무결성' }
      - { id: '3', text: '데이터의 독립성' }
      - { id: '4', text: '데이터의 종속성' }
    answers: ['2']
    explanation: |
      선택지 1: 데이터의 일관성(consistency)은 중복된 데이터 사이에 값이 서로 어긋나지 않고 같은 상태를 유지하는 성질로, 저장된 값과 현실 세계 실제값의 일치를 뜻하지 않는다.
      선택지 2: 데이터의 무결성(integrity)은 데이터베이스에 들어 있는 데이터의 값과 그것이 표현하는 현실 세계의 실제값이 일치하는 정확성을 의미하므로 정답이다.
      선택지 3: 데이터의 독립성(independence)은 한 단계의 구조를 바꿔도 다른 단계(응용 프로그램 등)에 영향을 주지 않는 성질로, 정확성과는 다른 개념이다.
      선택지 4: 데이터의 종속성(dependence)은 파일 처리 방식에서 응용 프로그램과 데이터 구조가 서로 의존하는 문제점을 가리키며, 정확성을 뜻하지 않는다.

      핵심 개념:
      데이터 무결성은 DB에 저장된 값과 현실 세계의 실제값이 일치하는 정확성이다.
      DB는 데이터가 다루어질 때마다 다양한 제어 기능으로 유효성을 검사하여 무결성을 유지한다.
      일관성은 중복 데이터 간 값의 일치, 독립성은 단계 간 구조 변경의 영향 차단을 뜻한다.
      종속성과 중복성은 파일 처리 방식의 문제점으로 데이터베이스 등장의 배경이 되었다.

  - id: b07-04
    type: multiple-choice
    prompt: 개별 사용자나 응용 프로그래머가 필요로 하는 데이터베이스 구조를 정의한 것은?
    choices:
      - { id: '1', text: '개념 스키마' }
      - { id: '2', text: '내부 스키마' }
      - { id: '3', text: '외부 스키마' }
      - { id: '4', text: '저장 스키마' }
    answers: ['3']
    explanation: |
      선택지 1: 개념 스키마는 기관(조직)의 전체적인 DB 구조를 정의한 것으로, 모든 응용에 대한 통합된 데이터 구조이며 오직 하나만 존재한다. 개별 사용자용 구조가 아니다.
      선택지 2: 내부 스키마는 물리적인 데이터 구조(내부 레코드 형식, 인덱스 유무, 저장 필드 표현 방법 등)를 정의한 것으로, 개별 사용자의 관점과는 다르다.
      선택지 3: 외부 스키마는 개별 사용자나 응용 프로그래머가 관심을 갖는 DB 구조만을 정의한 스키마다. 전체 DB의 한 논리적 부분만 표현하므로 서브스키마라고도 하며, 정답이다.
      선택지 4: 저장 스키마는 내부 스키마의 다른 이름으로, 저장장치 관점에서 DB가 저장되는 방법을 표현한다.

      핵심 개념:
      스키마(schema)는 DB 구조에 대한 정의와 제약 조건의 명세를 기술한 것이다.
      3단계 데이터베이스 구조(외부·개념·내부 단계)에 맞춰 외부 스키마, 개념 스키마, 내부 스키마가 존재한다.
      외부 스키마(서브스키마): 개별 사용자·응용별 논리적 구조로, 사용자마다 여러 개 존재한다.
      개념 스키마: 조직 전체의 통합된 구조로, 하나만 존재한다.
      내부 스키마(저장 스키마): 물리적 저장 구조를 정의한다.

  - id: b07-05
    type: multiple-choice
    passageRefs: [gb07-three-level-01]
    prompt: 3단계 데이터베이스 구조에서 기관의 전체적인 데이터베이스 구조를 정의한 것은?
    choices:
      - { id: '1', text: 'A' }
      - { id: '2', text: 'B' }
      - { id: '3', text: 'D' }
      - { id: '4', text: 'E' }
    answers: ['3']
    explanation: |
      선택지 1: A는 사용자1의 질의어와 연결된 외부 스키마로, 개별 사용자가 관심을 갖는 부분 구조만 정의한다.
      선택지 2: B는 사용자2의 응용프로그램과 연결된 외부 스키마로, 역시 특정 응용에 한정된 논리적 구조다.
      선택지 3: D는 여러 외부 스키마(A, B, C)가 모두 사상되는 개념 스키마로, 기관의 전체적인 DB 구조를 정의하므로 정답이다.
      선택지 4: E는 개념 스키마와 저장 DB 사이에 있는 내부 스키마로, 물리적인 저장 구조를 정의한다.

      핵심 개념:
      3단계 구조는 외부 단계(외부 스키마 1~n), 개념 단계(개념 스키마), 내부 단계(내부 스키마)로 이루어진다.
      여러 외부 스키마는 하나의 개념 스키마로 사상되고, 개념 스키마는 내부 스키마를 거쳐 저장 DB에 대응된다.
      외부/개념 사상은 논리적 데이터 독립성을, 개념/내부 사상은 물리적 데이터 독립성을 제공한다.
      그림에서 사용자 쪽에 여러 개 있으면 외부 스키마, 가운데 하나뿐이면 개념 스키마, 저장 DB 바로 위는 내부 스키마다.

  - id: b07-06
    type: multiple-choice
    prompt: 데이터베이스에서 논리적 데이터 독립성을 제공하기 위한 사상은?
    choices:
      - { id: '1', text: '외부/개념 사상' }
      - { id: '2', text: '외부/내부 사상' }
      - { id: '3', text: '개념/내부 사상' }
      - { id: '4', text: '내부/저장 사상' }
    answers: ['1']
    explanation: |
      선택지 1: 외부/개념 사상(응용 인터페이스)은 응용 프로그램이나 사용자가 보는 관점을 변경시키지 않고 DB의 논리적 구조를 변경할 수 있게 하므로 논리적 데이터 독립성을 제공한다. 정답이다.
      선택지 2: 3단계 구조의 사상은 인접한 단계 사이(외부/개념, 개념/내부)에만 정의되며, 외부 단계와 내부 단계를 직접 잇는 사상은 없다.
      선택지 3: 개념/내부 사상(저장 인터페이스)은 논리적 구조에 영향을 주지 않고 저장 양식을 변경할 수 있게 하므로 물리적 데이터 독립성을 제공한다. 논리적 독립성이 아니다.
      선택지 4: 내부 스키마는 저장 스키마라고도 부르는 같은 단계이므로 내부/저장 사상은 3단계 구조의 사상이 아니다.

      핵심 개념:
      사상(mapping)은 3단계 구조의 인접 단계를 연결하여 데이터 독립성을 제공하는 개념이다.
      외부/개념 사상(응용 인터페이스) → 논리적 데이터 독립성: 사용자 관점을 바꾸지 않고 논리적 구조 변경 가능.
      개념/내부 사상(저장 인터페이스) → 물리적 데이터 독립성: 논리적 구조를 바꾸지 않고 저장 양식 변경 가능.
      데이터 독립성 덕분에 한 단계를 변경해도 다른 단계에 영향이 적다.

  - id: b07-07
    type: multiple-choice
    prompt: DBMS의 세 가지 필수 기능에 해당하지 ==않는== 것은?
    choices:
      - { id: '1', text: '정의' }
      - { id: '2', text: '저장' }
      - { id: '3', text: '조작' }
      - { id: '4', text: '제어' }
    answers: ['2']
    explanation: |
      선택지 1: 정의(definition)는 응용 프로그램과 DB가 상호작용할 수 있는 방법을 제공하고, 여러 사용자의 요구에 부응하는 DB 구조를 정의하는 필수 기능이다.
      선택지 2: 저장은 DBMS(Database Management System, 데이터베이스 관리 시스템)의 세 가지 필수 기능(정의, 조작, 제어)에 포함되지 않으므로 정답이다.
      선택지 3: 조작(manipulation)은 사용자의 요구에 따라 연산 도구를 통해 DB에 체계적으로 접근하고 조작하는 필수 기능이다.
      선택지 4: 제어(control)는 공용으로 관리되는 DB의 내용을 항상 정확하고 안전하게 유지하는 필수 기능으로, 무결성 유지, 보안 유지 및 권한 검사, 동시 처리의 정확성 유지를 담당한다.

      핵심 개념:
      DBMS는 데이터베이스의 구성, 접근 방법, 관리 유지에 대한 책임과 권한을 갖고 응용 프로그램과 데이터의 중재자 역할을 하는 소프트웨어 시스템이다.
      필수 기능은 정의, 조작, 제어의 세 가지이다.
      정의: DB 구조 정의 / 조작: 검색·삽입·삭제·갱신 등 접근과 조작 / 제어: 무결성·보안·동시성 제어.
      각 기능은 데이터 정의어, 데이터 조작어, 데이터 제어어와 대응된다.

  - id: b07-08
    type: multiple-choice
    prompt: 데이터 정의어와 데이터 제어어를 통해 데이터베이스에 접근하는 사용자를 무엇이라고 하는가?
    choices:
      - { id: '1', text: '일반 사용자' }
      - { id: '2', text: '데이터베이스 개발자' }
      - { id: '3', text: '응용 프로그래머' }
      - { id: '4', text: '데이터베이스 관리자' }
    answers: ['4']
    explanation: |
      선택지 1: 일반 사용자는 주로 질의어 등을 이용해 데이터를 검색·조작하는 사용자로, DDL과 DCL로 DB를 정의·제어하지 않는다.
      선택지 2: 데이터베이스 개발자는 데이터베이스 사용자의 구분(일반 사용자, 응용 프로그래머, 데이터베이스 관리자)에 없는 명칭이다. DDL과 DCL로 DB를 정의하고 제어하는 역할은 데이터베이스 관리자(DBA)가 맡는다.
      선택지 3: 응용 프로그래머는 응용 프로그램에 데이터 조작어(DML: Data Manipulation Language)를 삽입해 DB에 접근하는 사용자다.
      선택지 4: 데이터베이스 관리자(DBA: DB Administrator)는 데이터 정의어(DDL: Data Definition Language)와 데이터 제어어(DCL: Data Control Language)를 통해 DB를 정의하고 제어할 목적으로 접근·관리하는 사람이므로 정답이다.

      핵심 개념:
      데이터 언어는 DB를 정의하고 접근하기 위해 DBMS와 통신하는 수단이다.
      DDL: DB 구조·데이터 형식·처리 방식 정의 / DCL: 데이터 공유와 정확하고 안전한 사용을 위한 제어 정의 / DML: 검색·수정·삭제·삽입 조작.
      데이터베이스 사용자는 일반 사용자, 응용 프로그래머, 데이터베이스 관리자로 나뉜다.
      DBA는 DB에 대한 접근 권한 설정, 제작과 갱신, 보전과 관리, 성능 변경 요구에 대한 응답 등의 의무를 진다.

  - id: b07-09
    type: multiple-choice
    prompt: 현실 세계에서 주요 데이터를 추출하여 개념 세계의 데이터로 변환하는 과정에 사용되는 데이터 모델은?
    choices:
      - { id: '1', text: '관계형 모델' }
      - { id: '2', text: '개체-관계 모델' }
      - { id: '3', text: '네트워크형 모델' }
      - { id: '4', text: '계층형 모델' }
    answers: ['2']
    explanation: |
      선택지 1: 관계형 모델은 개념 세계의 데이터를 데이터베이스에 저장할 구조로 표현하는 논리적 모델(구현 모델)이다.
      선택지 2: 개체-관계 모델(E-R 모델: Entity-Relationship model)은 많은 사용자가 데이터를 인식하는 방법과 밀접한 개념을 제공하는 개념적 모델로, 현실 세계의 데이터를 개념 세계로 변환하는 데 사용되므로 정답이다.
      선택지 3: 네트워크형 모델은 그래프 형태로 데이터를 표현하는 논리적 모델(구현 모델)이다.
      선택지 4: 계층형 모델은 트리 형태로 데이터를 표현하는 논리적 모델(구현 모델)이다.

      핵심 개념:
      데이터 모델링은 실세계 데이터를 데이터 모델상의 DB 구조로 변환하는 과정이다.
      데이터 모델은 개념적 모델, 논리적 모델, 물리적 모델로 분류한다.
      개념적 모델(E-R 모델): 현실 세계 → 개념 세계 변환.
      논리적 모델(구현 모델): 관계형, 네트워크형, 계층형, 객체지향형, 객체 관계형 모델.
      물리적 모델: 레코드 형식, 순서, 접근 경로 등 컴퓨터 내부 저장 방식을 기술한다.

  - id: b07-10
    type: multiple-choice
    passageRefs: [gb07-network-model-01]
    prompt: 다음과 같은 그래프 구조를 기반으로 표현되는 데이터베이스의 구현 모델은?
    choices:
      - { id: '1', text: '관계형 모델' }
      - { id: '2', text: 'E-R 모델' }
      - { id: '3', text: '네트워크형 모델' }
      - { id: '4', text: '계층형 모델' }
    answers: ['3']
    explanation: |
      선택지 1: 관계형 모델은 DB를 2차원 테이블(릴레이션)의 집합으로 간주하고 테이블로 데이터와 관계를 표현하므로 그래프 구조가 아니다.
      선택지 2: E-R 모델은 개념적 모델이며 구현 모델(논리적 모델)이 아니다.
      선택지 3: 네트워크형 모델(망형 모델)은 그래프 형태로 데이터를 표현하며 오너-멤버 관계를 가진다. 그림처럼 학생과 과목이 서로 여러 관계(등록, 수강)로 얽힌 그래프 구조이므로 정답이다.
      선택지 4: 계층형 모델은 트리 형태로 부모-자식 관계를 표현한다. 그림에는 학생과 과목 사이에 양방향 관계가 있어 트리가 아니다.

      핵심 개념:
      논리적 모델(구현 모델)의 종류와 표현 형태는 다음과 같다.
      관계형 모델: 2차원 테이블(릴레이션)의 집합.
      네트워크형 모델(망형 모델): 그래프 형태, 오너-멤버 관계.
      계층형 모델: 트리 형태, 부모-자식 관계.
      객체지향형 모델은 데이터와 절차를 일체화된 단위로 다루고, 객체 관계형 모델은 관계형에 객체 저장 능력을 추가한 형태다.

  - id: b07-11
    type: multiple-choice
    passageRefs: [gb07-er-advise-01]
    prompt: 다음과 같은 E-R 다이어그램에서 ‘학생’ 및 ‘교수’에 해당하는 구성요소를 무엇이라 하는가?
    choices:
      - { id: '1', text: '개체' }
      - { id: '2', text: '관계' }
      - { id: '3', text: '속성' }
      - { id: '4', text: '투플' }
    answers: ['1']
    explanation: |
      선택지 1: 개체(entity)는 데이터로 표현하려는 실세계의 유무형의 모든 것으로, E-R 다이어그램에서 사각형으로 나타낸다. 사각형으로 그려진 ‘학생’과 ‘교수’는 개체이므로 정답이다.
      선택지 2: 관계(relationship)는 개체 집합 사이의 대응성을 표현하며 마름모로 나타낸다. 그림에서는 ‘지도’가 관계다.
      선택지 3: 속성(attribute)은 개체의 고유한 특성이나 상태를 나타내며 타원으로 나타낸다. 학번, 이름, 학과, 교수번호 등이 속성이다.
      선택지 4: 투플(tuple)은 관계형 모델에서 릴레이션의 행(레코드)을 가리키는 용어로, E-R 다이어그램의 구성요소가 아니다.

      핵심 개념:
      E-R 모델은 개체 타입과 이들 간의 관계 타입을 이용해 실세계를 개념적으로 표현하는 방법이다.
      E-R 다이어그램: 개체 타입은 사각형, 관계 타입은 마름모, 속성은 타원, 이들을 연결하는 링크는 직선으로 표시한다.
      개체는 파일의 레코드에 대응하며 속성을 가진다.
      밑줄 친 속성(학번, 교수번호)은 키 속성이다.

  - id: b07-12
    type: multiple-choice
    prompt: E-R 다이어그램에서 키 속성을 나타내는 기호는?
    choices:
      - id: '1'
        text: ''
        image:
          path: images/subjects/introduction-to-computer-science/workbook/b07-12-choice-1.png
          alt: 점선으로 그린 타원
      - id: '2'
        text: ''
        image:
          path: images/subjects/introduction-to-computer-science/workbook/b07-12-choice-2.png
          alt: 실선으로 그린 타원
      - id: '3'
        text: ''
        image:
          path: images/subjects/introduction-to-computer-science/workbook/b07-12-choice-3.png
          alt: 이중선으로 그린 타원
      - id: '4'
        text: ''
        image:
          path: images/subjects/introduction-to-computer-science/workbook/b07-12-choice-4.png
          alt: 안쪽에 밑줄이 그어진 타원
    answers: ['4']
    explanation: |
      선택지 1: 점선 타원은 다른 속성 값으로부터 계산해 얻는 유도 속성을 나타낸다.
      선택지 2: 실선 타원은 일반 속성을 나타낸다.
      선택지 3: 이중선 타원은 하나의 개체가 여러 값을 가질 수 있는 다중값 속성을 나타낸다.
      선택지 4: 속성 이름에 밑줄을 그은 타원은 키 속성을 나타내므로 정답이다.

      핵심 개념:
      E-R 다이어그램 기호: 사각형(개체 타입), 이중 사각형(약한 개체 타입), 마름모(관계 타입), 이중 마름모(약한 관계 타입).
      속성 기호: 타원(속성), 밑줄 타원(키 속성), 이중 타원(다중값 속성), 점선 타원(유도 속성).
      타원에 하위 타원이 연결된 형태는 복합 속성이다.
      이중선 연결은 전체 참여, 링크 위의 1, N은 관계의 사상 원소 비율을 나타낸다.

  - id: b07-13
    type: multiple-choice
    passageRefs: [gb07-relational-tables-01]
    prompt: 다음 그림과 같은 방식으로 실세계의 정보를 표현하는 논리적 모델은?
    choices:
      - { id: '1', text: '개체-관계 모델' }
      - { id: '2', text: '관계형 모델' }
      - { id: '3', text: '네트워크형 모델' }
      - { id: '4', text: '객체지향형 모델' }
    answers: ['2']
    explanation: |
      선택지 1: 개체-관계 모델(E-R 모델)은 논리적 모델이 아니라 개념적 모델이며, 사각형·마름모·타원으로 된 다이어그램으로 표현한다.
      선택지 2: 관계형 모델은 실세계의 정보를 행과 열로 구성된 테이블(릴레이션) 형식으로 표현한다. 그림은 고객, 계좌, 계좌 거래를 각각 열(속성)로 구성된 테이블로 나타내고 키 속성에 밑줄을 그었으므로 정답이다.
      선택지 3: 네트워크형 모델은 레코드를 그래프 형태의 오너-멤버 관계로 연결해 표현하므로 테이블 형식과 다르다.
      선택지 4: 객체지향형 모델은 데이터와 절차를 일체화된 객체 단위로 다루는 모델로, 그림과 같은 테이블 집합 표현이 아니다.

      핵심 개념:
      관계형 모델은 DB를 2차원 테이블(릴레이션)의 집합으로 간주하고 테이블로 데이터와 데이터의 관계를 표현한다.
      현재 가장 많이 사용되는 논리적 모델이다.
      개체뿐 아니라 개체 사이의 관계(계좌 거래)도 테이블로 표현하며, 다른 테이블의 키(주민등록번호, 계좌번호)를 속성으로 포함해 관계를 나타낸다.
      E-R 모델은 개념적 모델이므로 논리적 모델을 묻는 문제의 답이 될 수 없다.

  - id: b07-14
    type: multiple-choice
    prompt: 릴레이션에서 속성이 가질 수 있는 값의 집합을 의미하는 용어는?
    choices:
      - { id: '1', text: '카디널리티' }
      - { id: '2', text: '도메인' }
      - { id: '3', text: '투플' }
      - { id: '4', text: '차수' }
    answers: ['2']
    explanation: |
      선택지 1: 카디널리티(cardinality)는 릴레이션에 포함된 투플의 개수다.
      선택지 2: 도메인(domain, 영역)은 속성이 가질 수 있는 값의 집합이므로 정답이다.
      선택지 3: 투플(tuple)은 릴레이션의 행, 즉 레코드다.
      선택지 4: 차수(degree)는 릴레이션을 구성하는 속성의 개수다.

      핵심 개념:
      관계형 데이터 모델의 용어는 다음과 같다.
      릴레이션 = 테이블, 투플 = 행(레코드), 속성 = 열(필드, 데이터 항목).
      차수 = 속성의 개수, 카디널리티 = 투플의 개수.
      영역(도메인) = 속성이 가질 수 있는 값의 집합.

  - id: b07-15
    type: multiple-choice
    passageRefs: [gb07-student-table-01]
    prompt: 다음과 같은 관계형 모델의 테이블에서 차수와 카디널리티의 합은 얼마인가?
    choices:
      - { id: '1', text: '4' }
      - { id: '2', text: '6' }
      - { id: '3', text: '8' }
      - { id: '4', text: '10' }
    answers: ['4']
    explanation: |
      선택지 1: 4는 카디널리티(투플 4개)와 같은 값이며, 차수와 카디널리티의 합이 아니다.
      선택지 2: 6은 차수(속성 6개: 학번, 이름, 나이, 성별, 주소, 학과)와 같은 값이며, 차수와 카디널리티의 합이 아니다.
      선택지 3: 8은 차수 6과 카디널리티 4의 합인 10과 다르다.
      선택지 4: 차수(속성의 개수) 6과 카디널리티(투플의 개수) 4를 더하면 $6 + 4 = 10$이므로 정답이다.

      핵심 개념:
      차수(degree)는 릴레이션의 속성(열) 개수이고, 카디널리티(cardinality)는 투플(행) 개수이다.
      제목 행은 속성 이름(릴레이션 스키마)이므로 카디널리티에 포함하지 않는다.
      투플이 삽입·삭제되면 카디널리티는 바뀌지만, 차수는 스키마가 바뀌지 않는 한 그대로다.
      이 테이블은 차수 6, 카디널리티 4이다.

  - id: b07-16
    type: multiple-choice
    prompt: 관계형 모델에서 키의 성질 중 유일성만을 만족하는 키를 무엇이라고 하는가?
    choices:
      - { id: '1', text: '대체키' }
      - { id: '2', text: '후보키' }
      - { id: '3', text: '슈퍼키' }
      - { id: '4', text: '기본키' }
    answers: ['3']
    explanation: |
      선택지 1: 대체키(alternate key)는 후보키 중에서 기본키로 선택되지 못한 키로, 후보키이므로 유일성과 최소성을 모두 만족한다.
      선택지 2: 후보키(candidate key)는 슈퍼키 중에서 최소성(모든 투플을 유일하게 식별할 수 있는 최소의 속성들로 구성)까지 만족하는 키다.
      선택지 3: 슈퍼키(super key)는 키값으로 하나의 투플을 유일하게 식별한다는 유일성만을 만족하는 키이므로 정답이다.
      선택지 4: 기본키(primary key)는 후보키 중에서 DB 설계자나 관리자가 기본적으로 사용할 키로 선택한 키로, 유일성과 최소성을 모두 만족한다.

      핵심 개념:
      키는 릴레이션의 투플을 유일하게 구별하기 위한 속성 또는 속성의 집합이며, 성질은 유일성과 최소성이다.
      슈퍼키: 유일성만 만족 / 후보키: 유일성 + 최소성.
      기본키: 후보키 중 선택된 키 / 대체키: 후보키 중 기본키로 선택되지 못한 키.
      외래키(foreign key): 어떤 릴레이션의 속성(집합)이 다른 릴레이션의 기본키가 되는 키.

  - id: b07-17
    type: multiple-choice
    prompt: 관계형 모델에서 릴레이션의 특징이 ==아닌== 것은?
    choices:
      - { id: '1', text: '투플의 유일성' }
      - { id: '2', text: '투플의 무순서성' }
      - { id: '3', text: '속성의 유일성' }
      - { id: '4', text: '속성의 무순서성' }
    answers: ['3']
    explanation: |
      선택지 1: 투플의 유일성은 하나의 릴레이션에 중복되는 투플이 없으며 하나의 키값으로 하나의 투플을 유일하게 식별한다는 특징이다.
      선택지 2: 투플의 무순서성은 한 릴레이션에 포함된 투플들이 순서를 가지지 않는다는 특징이다.
      선택지 3: 속성의 유일성은 릴레이션의 네 가지 특징(투플의 유일성, 투플의 무순서성, 속성의 무순서성, 속성값의 원자성)에 포함되지 않으므로 정답이다.
      선택지 4: 속성의 무순서성은 릴레이션을 구성하는 속성들 사이에 순서가 없고 이름과 값의 쌍으로 구성된다는 특징이다.

      핵심 개념:
      릴레이션은 투플의 집합이므로 다음 네 가지 특징을 갖는다.
      투플의 유일성: 중복 투플이 없다.
      투플의 무순서성: 투플 사이에 순서가 없다.
      속성의 무순서성: 속성 사이에 순서가 없다.
      속성값의 원자성: 모든 속성값은 분해 불가능한 원자값이며, 널값도 원자값으로 취급한다.

  - id: b07-18
    type: multiple-choice
    prompt: 관계형 모델에서 어떤 두 투플도 릴레이션의 모든 속성에 대해서 같은 속성값의 조합을 가질 수 없다는 제약 조건은?
    choices:
      - { id: '1', text: '개체 무결성 제약 조건' }
      - { id: '2', text: '영역 제약 조건' }
      - { id: '3', text: '참조 무결성 제약 조건' }
      - { id: '4', text: '키 제약 조건' }
    answers: ['4']
    explanation: |
      선택지 1: 개체 무결성 제약 조건은 어떠한 기본키값도 널값이 될 수 없다는 조건이다.
      선택지 2: 영역 제약 조건은 각 속성값이 반드시 해당 영역의 원자값이어야 한다는 조건이다.
      선택지 3: 참조 무결성 제약 조건은 한 릴레이션의 투플이 다른 릴레이션의 투플을 참조하려면 참조되는 투플이 그 릴레이션 내에 반드시 존재해야 한다는 조건이다.
      선택지 4: 키 제약 조건은 어떤 두 투플도 릴레이션의 모든 속성에 대해서 같은 속성값의 조합을 가질 수 없다는 조건이므로 정답이다.

      핵심 개념:
      관계 데이터 모델의 제약 조건은 모든 릴레이션 인스턴스가 만족해야 하는 조건이다.
      영역 제약 조건: 속성값은 해당 영역의 원자값.
      키 제약 조건: 모든 속성값 조합이 같은 두 투플은 없다(투플의 유일성).
      개체 무결성 제약 조건: 기본키는 널값 불가.
      참조 무결성 제약 조건: 참조되는 투플이 반드시 존재해야 한다.

  - id: b07-19
    type: multiple-choice
    prompt: 데이터베이스의 설계 과정을 올바르게 나열한 것은?
    choices:
      - { id: '1', text: '사용자 요구 사항 분석 – 논리적 설계 – 개념적 설계 – 물리적 설계 – 구현' }
      - { id: '2', text: '사용자 요구 사항 분석 – 개념적 설계 – 논리적 설계 – 물리적 설계 – 구현' }
      - { id: '3', text: '사용자 요구 사항 분석 – 개념적 설계 – 물리적 설계 – 논리적 설계 – 구현' }
      - { id: '4', text: '사용자 요구 사항 분석 – 논리적 설계 – 물리적 설계 – 개념적 설계 – 구현' }
    answers: ['2']
    explanation: |
      선택지 1: 논리적 설계는 개념적 설계로 만든 개념 스키마를 목표 DBMS에 맞는 논리적 스키마로 변환하는 단계이므로 개념적 설계보다 먼저 올 수 없다.
      선택지 2: 요구 사항 분석 → 개념적 설계(E-R 모델 등으로 DBMS에 독립적인 개념 스키마 설계) → 논리적 설계(목표 DBMS에 맞는 논리적 스키마 변환) → 물리적 설계(물리적 구조 설계) → 구현 순서이므로 정답이다.
      선택지 3: 물리적 설계는 논리적 스키마를 바탕으로 저장 구조를 설계하므로 논리적 설계보다 먼저 올 수 없다.
      선택지 4: 개념적 설계는 요구 사항 분석 직후 DBMS에 독립적으로 수행되는 단계이므로 논리적·물리적 설계 뒤에 올 수 없다.

      핵심 개념:
      데이터베이스 설계는 사용자의 요구 조건으로부터 DB 구조를 도출해 내는 과정이다.
      사용자 요구 사항 분석: 데이터 및 처리 요구 조건 분석.
      개념적 설계: 특정 DBMS에 독립적인 개념 스키마 설계(E-R 모델).
      논리적 설계: 목표 DBMS에 맞는 논리적 스키마 변환 → 물리적 설계: 목표 DBMS에 맞는 물리적 구조 설계.
      구현: 목표 DBMS의 DDL로 스키마를 작성해 빈 데이터베이스 파일을 생성한다.

  - id: b07-20
    type: multiple-choice
    prompt: SQL 명령문 중에서 데이터 정의어에 속하지 ==않는== 것은?
    choices:
      - { id: '1', text: 'CREATE문' }
      - { id: '2', text: 'DELETE문' }
      - { id: '3', text: 'ALTER문' }
      - { id: '4', text: 'DROP문' }
    answers: ['2']
    explanation: |
      선택지 1: CREATE문은 스키마, 도메인, 테이블, 뷰, 인덱스를 정의(생성)하는 데이터 정의어다.
      선택지 2: DELETE문은 테이블의 데이터(투플)를 삭제하는 데이터 조작어(DML)이므로 데이터 정의어에 속하지 않는다. 정답이다.
      선택지 3: ALTER문은 정의된 테이블 등의 구조를 변경(수정)하는 데이터 정의어다.
      선택지 4: DROP문은 스키마, 테이블, 뷰, 인덱스 등을 제거하는 데이터 정의어다.

      핵심 개념:
      SQL(Structured Query Language, 구조화된 질의어)은 관계 대수를 기초로 한 언어로 정의, 조작, 제어 기능을 모두 제공한다.
      데이터 정의어(DDL): CREATE(생성), ALTER(변경), DROP(삭제) — 구조를 다룬다.
      데이터 조작어(DML): SELECT(검색), INSERT(삽입), DELETE(삭제), UPDATE(갱신) — 저장된 데이터를 다룬다.
      같은 ‘삭제’라도 구조를 없애면 DROP, 데이터를 지우면 DELETE다.

  - id: b07-21
    type: multiple-choice
    prompt: SQL 명령문 중에서 데이터의 검색을 위해서 사용되는 데이터 조작어는?
    choices:
      - { id: '1', text: 'SEARCH문' }
      - { id: '2', text: 'RETRIVE문' }
      - { id: '3', text: 'ALTER문' }
      - { id: '4', text: 'SELECT문' }
    answers: ['4']
    explanation: |
      선택지 1: SEARCH는 SQL 명령문이 아니다.
      선택지 2: RETRIVE는 SQL 명령문이 아니다. 검색에 해당하는 SQL 명령문은 SELECT이다.
      선택지 3: ALTER문은 테이블 등의 구조를 변경하는 데이터 정의어(DDL)이며 데이터 검색에 쓰지 않는다.
      선택지 4: SELECT문은 기본 테이블이나 뷰에서 데이터를 검색하는 데이터 조작어(DML)이므로 정답이다.

      핵심 개념:
      데이터 조작어의 조작 대상은 기본 테이블과 뷰이다.
      명령문: SELECT(검색), INSERT(삽입), DELETE(삭제), UPDATE(갱신).
      SQL은 레코드 집합 단위로 연산하는 비절차적 언어이며, 대화식으로도 프로그램 삽입으로도 사용할 수 있다.
      SQL은 릴레이션·투플·속성보다 테이블·행·열이라는 용어를 선호한다.

  - id: b07-22
    type: multiple-choice
    passageRefs: [gb07-employee-table-01, gb07-group-by-sql-01]
    prompt: 다음과 같은 직원 테이블에 대해서 주어진 SQL문을 수행한 후 얻어지는 결과 테이블에 포함되는 내용은?
    choices:
      - { id: '1', text: 'A' }
      - { id: '2', text: 'A, B' }
      - { id: '3', text: 'A, B, C' }
      - { id: '4', text: 'A, B, C, D' }
    answers: ['1']
    explanation: |
      선택지 1: 부서번호별 직원 수는 A 3명(100, 330, 450), B 2명(150, 340), C 1명(478), D 1명(201)이다. HAVING COUNT(*) >= 3을 만족하는 그룹은 A뿐이므로 정답이다.
      선택지 2: B 부서는 직원이 2명이어서 COUNT(*) >= 3 조건을 만족하지 못하므로 결과에 포함되지 않는다.
      선택지 3: B(2명)와 C(1명)는 조건을 만족하지 못하므로 결과에 포함되지 않는다.
      선택지 4: 이는 HAVING 조건 없이 GROUP BY만 수행했을 때의 결과로, 조건을 적용하면 A만 남는다.

      핵심 개념:
      GROUP BY 부서번호는 같은 부서번호를 가진 행들을 하나의 그룹으로 묶는다.
      HAVING은 그룹 단위의 조건으로, COUNT(*)는 각 그룹의 레코드 개수이다.
      이 SQL문은 같은 부서에 속하는 직원이 3명 이상인 부서번호를 출력한다.
      WHERE가 개별 행을 거른다면 HAVING은 그룹화된 결과를 거른다.

  - id: b07-23
    type: multiple-choice
    prompt: 다음 중 주어진 테이블의 모든 내용을 삭제해서 빈 테이블로 만드는 SQL 명령문에 해당하는 것은? (단, 직원 테이블은 문제 22번을 참조한다.)
    choices:
      - { id: '1', text: 'DROP TABLE 직원;' }
      - { id: '2', text: 'DROP TABLE FROM 직원;' }
      - { id: '3', text: 'DELETE FROM 직원;' }
      - { id: '4', text: 'DELETE FROM 직원 WHERE 번호=‘*’;' }
    answers: ['3']
    explanation: |
      선택지 1: DROP TABLE은 테이블의 내용뿐 아니라 테이블 자체를 제거하므로 빈 테이블이 남지 않는다.
      선택지 2: DROP TABLE에는 FROM 절을 쓰지 않으므로 올바른 SQL 형식이 아니며, 형식이 맞더라도 테이블 자체를 제거하는 명령이다.
      선택지 3: WHERE 조건 없이 DELETE FROM 직원; 을 수행하면 테이블 구조는 남기고 모든 행을 삭제하므로 빈 테이블이 된다. 정답이다.
      선택지 4: WHERE 조건을 사용하면 조건을 만족하는 행만 삭제된다. 번호가 문자 ‘*’인 행은 없으므로 아무 행도 삭제되지 않는다.

      핵심 개념:
      DROP TABLE은 테이블 자체(구조와 내용)를 제거하는 데이터 정의어 명령이다.
      DELETE는 테이블 자체가 아니라 테이블의 내용을 삭제하는 데이터 조작어 명령이다.
      모든 내용을 삭제해 빈 테이블로 만들려면 “DELETE FROM 테이블;”을 사용한다.
      WHERE 조건을 붙이면 조건을 만족하는 내용만 삭제된다.

  - id: b07-24
    type: multiple-choice
    prompt: SQL 문장의 사용 형식으로 올바르지 ==못한== 것은?
    choices:
      - id: '1'
        text: ''
        diagram:
          type: data-table
          cellFormat: code
          columns: ['형식']
          rows:
            - ["DELETE\nFROM 테이블\nWHERE 조건;"]
      - id: '2'
        text: ''
        diagram:
          type: data-table
          cellFormat: code
          columns: ['형식']
          rows:
            - ["UPDATE 테이블\nSET 열이름 = 산술식\nWHERE 조건;"]
      - id: '3'
        text: ''
        diagram:
          type: data-table
          cellFormat: code
          columns: ['형식']
          rows:
            - ["SELECT 열이름\nFROM 테이블\nWHERE 조건;"]
      - id: '4'
        text: ''
        diagram:
          type: data-table
          cellFormat: code
          columns: ['형식']
          rows:
            - ["INSERT 테이블\nINTO 열값리스트\nWHERE 조건;"]
    answers: ['4']
    explanation: |
      선택지 1: DELETE FROM 테이블 WHERE 조건; 은 조건을 만족하는 행을 삭제하는 올바른 DELETE문 형식이다.
      선택지 2: UPDATE 테이블 SET 열이름 = 산술식 WHERE 조건; 은 조건을 만족하는 행의 열 값을 갱신하는 올바른 UPDATE문 형식이다.
      선택지 3: SELECT 열이름 FROM 테이블 WHERE 조건; 은 조건을 만족하는 행의 열을 검색하는 올바른 SELECT문 형식이다.
      선택지 4: 데이터 삽입문의 기본 형식은 INSERT INTO 테이블[(열_이름{, 열_이름}*)] VALUES (열_값_리스트); 이다. INSERT 뒤에 바로 테이블이 오지 않고 INTO 뒤에 테이블, VALUES 뒤에 값 리스트가 오며, 새 행을 추가하므로 WHERE 조건도 없다. 올바르지 못한 형식이므로 정답이다.

      핵심 개념:
      SQL 데이터 조작어의 기본 형식은 다음과 같다.
      검색: SELECT 열이름 FROM 테이블 WHERE 조건;
      갱신: UPDATE 테이블 SET 열이름 = 산술식 WHERE 조건; / 삭제: DELETE FROM 테이블 WHERE 조건;
      삽입: INSERT INTO 테이블[(열_이름 목록)] VALUES (열_값_리스트); — WHERE절이 없다.

  - id: b07-25
    type: multiple-choice
    prompt: 하나 이상의 기본 테이블로부터 유도되어 만들어진 가상 테이블을 무엇이라고 하는가?
    choices:
      - { id: '1', text: '스키마' }
      - { id: '2', text: '도메인' }
      - { id: '3', text: '뷰' }
      - { id: '4', text: '인덱스' }
    answers: ['3']
    explanation: |
      선택지 1: 스키마는 데이터베이스의 논리적 정의(자료구조와 제약 조건에 대한 명세)를 기술한 것으로 테이블이 아니다.
      선택지 2: 도메인은 속성이 가질 수 있는 값의 집합이다.
      선택지 3: 뷰(view)는 하나 이상의 기본 테이블로부터 유도되어 만들어지는 가상 테이블이므로 정답이다. 내용이 물리적으로 존재하지 않고, 뷰에 대한 조작을 요구할 때마다 기본 테이블의 데이터를 이용해 만들어진다.
      선택지 4: 인덱스(index)는 검색 속도를 높이기 위해 정의하는 접근 구조로, 가상 테이블이 아니다.

      핵심 개념:
      뷰는 하나 이상의 기본 테이블로부터 유도된 가상 테이블이다.
      검색에서는 사용자에게 기본 테이블과 차이가 없지만, 갱신 연산은 기본키 보유 여부에 따라 처리가 달라진다.
      CREATE VIEW와 AS SELECT문으로 생성하며, 이때 SELECT문에서 UNION과 ORDER BY는 사용할 수 없다.
      기본 테이블이 제거되면 그것을 기초로 만든 인덱스나 뷰도 자동으로 제거된다.

  - id: b08-01
    type: multiple-choice
    prompt: 인터넷의 전신인 네트워크는 무엇인가?
    choices:
      - { id: '1', text: 'BITNET' }
      - { id: '2', text: 'ARPANet' }
      - { id: '3', text: 'ALOHANet' }
      - { id: '4', text: 'Ethernet' }
    answers: ['2']
    explanation: |
      선택지 1: BITNET은 1981년 미국 대학들을 연결하기 위해 개발된 네트워크로, 인터넷으로 대체되기 전까지 교육기관을 중심으로 쓰였으며 이메일이나 파일 단위로 서버에서 서버로 전송하는 방식을 채택했다. 인터넷의 전신은 아니다.
      선택지 2: ARPANet은 미국 국방부 고등연구계획국(ARPA, 현재의 DARPA: Defense Advanced Research Projects Agency)의 주도로 구축한 패킷 교환 네트워크로, 1969년 첫 서비스를 시작했다. 1970년대에 개발된 TCP/IP(Transmission Control Protocol/Internet Protocol)가 1983년 ARPANet의 표준 프로토콜로 적용되었으며, 현재 인터넷의 전신이므로 정답이다.
      선택지 3: ALOHANet은 하와이 섬들을 연결하기 위해 개발된 무선 네트워크로, 초기 이더넷 개발에 영향을 주었을 뿐 인터넷의 전신은 아니다.
      선택지 4: Ethernet은 제록스 파크(Xerox PARC) 연구소가 컴퓨터 간 하드웨어 수준의 연결을 위해 개발한 인터페이스 장치 기반 네트워크 기술로, 인터넷의 전신이 아니다.

      핵심 개념:
      1960년대 ARPANet: ARPA(현재의 DARPA) 주도로 구축된 패킷 교환 네트워크, 인터넷의 전신이다.
      1970년대 Ethernet: 제록스 파크가 개발한 하드웨어 수준 연결 기술이다.
      1980년대 BITNET: 미국 대학 간 연결, 교육기관 중심으로 사용되었다.
      1980년대 NSFNET: 미국 국립과학재단(NSF: National Science Foundation)이 ARPANet의 TCP/IP 프로토콜을 기반으로 구축했다.

      ※ 원본 표기: 워크북은 ARPANet을 "MIT가 주축이 되어 구축"했고 "1973년에는 … TCP/IP가 개발되어 ARPANet에 적용되었다"고 하며 기관 영문명을 "Defense Advanced Research Project Agency"로 인쇄했다. 실제로 첫 노드는 UCLA·SRI·UCSB·유타 대학이었고, TCP/IP는 1973년에 설계가 시작되어 1983년 ARPANet에 적용되었으며, 영문명은 Defense Advanced Research Projects Agency(1969년 당시 ARPA)이다. 인쇄된 정답은 그대로 둔다.

  - id: b08-02
    type: multiple-choice
    prompt: 중앙의 제어 노드에 다른 모든 노드를 점대점 방식으로 연결한 중앙집중식 구조를 띠고 있어 유지보수가 쉽고 전송 제어가 간단한 회선망의 유형은?
    choices:
      - { id: '1', text: '버스형' }
      - { id: '2', text: '성형' }
      - { id: '3', text: '매시형' }
      - { id: '4', text: '트리형' }
    answers: ['2']
    explanation: |
      선택지 1: 버스형은 컴퓨터들이 하나의 버스(대역폭이 넓은 채널)를 공유하며 메시지를 버스에 연결된 모든 컴퓨터에 보내고 수신자만 주소를 보고 선택적으로 수신하는 형태로, 중앙 제어 노드가 없다. 대표적인 예는 이더넷이다.
      선택지 2: 성형(star)은 중앙의 컴퓨터가 모든 메시지의 중계자 역할을 하여, 모든 메시지가 먼저 중앙으로 보내진 뒤 목적지 컴퓨터로 전달되는 중앙집중식 구조이므로 정답이다. 대표적인 예는 와이파이 액세스 포인트(WiFi AP: Access Point)로 구성된 네트워크이다.
      선택지 3: 메시형(mesh)은 노드들이 서로 여러 경로로 직접 연결된 구조로, 중앙 제어 노드 없이 분산되어 있어 조건과 맞지 않는다.
      선택지 4: 트리형은 노드들이 계층적으로 가지를 뻗어 연결된 구조로, 하나의 중앙 노드에 모든 노드가 점대점으로 연결된 형태가 아니다.

      핵심 개념:
      연결 형태에 따라 버스형, 성형, 원형(ring) 등으로 분류한다.
      버스형은 하나의 공용 버스를 공유하며 대표 예는 이더넷이다.
      성형은 중앙 컴퓨터가 모든 메시지를 중계하며 대표 예는 와이파이 AP 네트워크이다.
      원형은 메시지가 원형 네트워크를 돌며 차례로 전달되며 대표 예는 토큰링(token ring)이다.

  - id: b08-03
    type: multiple-choice
    passageRefs: [gb08-message-switching-01]
    prompt: 다음은 무엇에 대한 설명인가?
    choices:
      - { id: '1', text: '회선 교환 방식' }
      - { id: '2', text: '패킷 교환 방식' }
      - { id: '3', text: '메시지 교환 방식' }
      - { id: '4', text: '데이터 교환 방식' }
    answers: ['3']
    explanation: |
      선택지 1: 회선 교환 방식(circuit switching)은 송신 컴퓨터에서 수신 컴퓨터까지 여러 스위치를 통해 물리적으로 연결된 임시 전용 회선을 동적으로 구성한 후 그 회선으로 메시지를 주고받는 방식으로, 일반 전화가 대표적이다. 메시지를 단계별로 스위치에 전달하는 방식이 아니다.
      선택지 2: 패킷 교환 방식(packet switching)은 메시지를 패킷이라는 작은 단위로 나누어 패킷별로 보내는 방식이다. 제시문은 메시지 전체를 크기에 상관없이 전달한다고 했으므로 맞지 않는다.
      선택지 3: 메시지 교환 방식(message switching)은 메시지 전체를 한 단계씩 목적지 방향의 스위치(또는 컴퓨터, 라우터 등)를 거쳐 전송하며, 중간 스위치는 메시지 크기에 상관없이 전달하고 몰릴 경우 대기행렬(queue)에 저장했다가 순서대로 전달하므로 정답이다.
      선택지 4: 데이터 교환 방식은 교환 방식의 분류(회선 교환, 메시지 교환, 패킷 교환)에 있는 명칭이 아니다. 제시문처럼 메시지 전체를 한 단계씩 스위치로 전달하는 방식은 메시지 교환 방식이다.

      핵심 개념:
      메시지 교환 방식에 따라 회선 교환, 메시지 교환, 패킷 교환으로 분류한다.
      회선 교환은 임시 전용 회선을 구성한 뒤 통신한다.
      메시지 교환은 메시지 전체를 단계별로 스위치에 전달하며 대기행렬을 사용한다.
      패킷 교환은 메시지를 패킷으로 나누어 전달하며 역시 대기행렬을 사용한다.

  - id: b08-04
    type: multiple-choice
    prompt: 네트워크와 네트워크 간의 연결에 사용되는 장비가 ==아닌== 것은?
    choices:
      - { id: '1', text: '브리지' }
      - { id: '2', text: '스위치' }
      - { id: '3', text: '리피터' }
      - { id: '4', text: '호스트' }
    answers: ['4']
    explanation: |
      선택지 1: 브리지(bridge)는 2개의 버스에 동시에 연결되어 목적지에 해당하는 버스 방향으로만 브로드캐스트하는 연결 장비로, 일반적으로 하드웨어 기반이다.
      선택지 2: 스위치(switch)는 브리지와 비슷하지만 2개 이상의 버스에 연결되고 일반적으로 소프트웨어 기반으로 구현되며, 목적지 방향의 버스 쪽으로만 메시지를 브로드캐스트하는 연결 장비이다.
      선택지 3: 리피터(repeater)는 2개의 버스에 동시에 연결되어 수신된 정보를 양쪽 버스 모두에 브로드캐스트하는 연결 장비이다.
      선택지 4: 호스트는 네트워크에 연결되어 데이터를 주고받는 컴퓨터(노드) 자체로, 네트워크와 네트워크를 연결하는 장비가 아니므로 정답이다.

      핵심 개념:
      리피터는 수신 정보를 양쪽 버스 모두에 브로드캐스트한다.
      브리지는 목적지 방향 버스로만 브로드캐스트하며 하드웨어 기반이다.
      스위치는 2개 이상의 버스에 연결되며 소프트웨어 기반이다.
      라우터는 라우팅 테이블로 데이터그램을 수신 주소 방향으로 전달(forwarding)한다.

  - id: b08-05
    type: multiple-choice
    prompt: OSI 계층 모델의 네트워크 계층에서 동작하는 장비로서, 송신 측과 수신 측 간의 가장 빠르고 신뢰성 있는 경로를 설정 관리하며, 데이터를 전달하는 역할을 기본적으로 담당하는 것은?
    choices:
      - { id: '1', text: '라우터' }
      - { id: '2', text: '스위치' }
      - { id: '3', text: '브리지' }
      - { id: '4', text: '게이트웨이' }
    answers: ['1']
    explanation: |
      선택지 1: 라우터(router)는 네트워크 계층에서 동작하며, 라우팅 테이블을 사용해 도착한 데이터그램을 수신 주소 방향으로 전달(forwarding)하고 경로를 결정하므로 정답이다.
      선택지 2: 스위치는 2개 이상의 버스에 연결되어 목적지 방향의 버스 쪽으로만 메시지를 브로드캐스트하는 장비로, 경로 설정·관리를 기본 역할로 하지 않는다.
      선택지 3: 브리지는 2개의 버스에 연결되어 목적지 버스 방향으로만 브로드캐스트하는 하드웨어 기반 장비로, 네트워크 계층의 경로 설정 장비가 아니다.
      선택지 4: 게이트웨이는 서로 다른 프로토콜을 쓰는 네트워크 사이에서 프로토콜을 변환해 주는 장비로, 경로 설정·관리가 기본 역할이 아니다.

      핵심 개념:
      라우터는 OSI(Open Systems Interconnection) 모델의 네트워크 계층 장비이다.
      각 라우터는 라우팅 테이블을 가지고 있다.
      도착한 데이터그램을 수신 주소 방향으로 전달(forwarding)한다.
      라우터는 최소 2개의 네트워크에 동시에 접속되어 있다.

  - id: b08-06
    type: multiple-choice
    prompt: OSI 계층 모델의 네트워크 계층에서 동작하는 장비로서, 도착한 데이터그램의 수신 주소 방향으로 데이터그램을 전달(forwarding)해 주는 역할을 하는 것은?
    choices:
      - { id: '1', text: '라우터' }
      - { id: '2', text: '스위치' }
      - { id: '3', text: '브리지' }
      - { id: '4', text: '게이트웨이' }
    answers: ['1']
    explanation: |
      선택지 1: 라우터(router)는 각 라우터가 가진 라우팅 테이블을 사용해 도착한 데이터그램의 수신 주소 방향으로 패킷을 전달(forwarding)하는 네트워크 계층 장비이므로 정답이다.
      선택지 2: 스위치(switch)는 브리지와 비슷하지만 2개 이상의 버스에 연결되고 일반적으로 소프트웨어 기반으로 구현되며, 목적지 방향 버스로 메시지를 브로드캐스트하는 장비이다.
      선택지 3: 브리지(bridge)는 리피터와 비슷하지만 목적지에 해당하는 버스 방향으로만 브로드캐스트하며, 2개의 버스에 연결되고 하드웨어 기반으로 구현된다.
      선택지 4: 게이트웨이는 서로 다른 프로토콜의 네트워크를 연결하기 위해 프로토콜을 변환하는 장비로, 라우팅 테이블 기반 데이터그램 전달이 기본 역할이 아니다.

      핵심 개념:
      리피터는 어느 버스에서 왔는지와 상관없이 양쪽 버스 모두에 브로드캐스트한다.
      브리지는 목적지 버스 방향으로만 브로드캐스트하며 하드웨어 기반이다.
      스위치는 2개 이상의 버스에 연결되며 소프트웨어 기반이다.
      라우터는 라우팅 테이블로 데이터그램을 수신 주소 방향으로 전달한다.

  - id: b08-07
    type: multiple-choice
    passageRefs: [gb08-osi-order-01]
    prompt: OSI 모델의 계층에서 ⓑ에 들어가는 계층은?
    choices:
      - { id: '1', text: '네트워크 계층' }
      - { id: '2', text: '표현 계층' }
      - { id: '3', text: '전송 계층' }
      - { id: '4', text: '세션 계층' }
    answers: ['4']
    explanation: |
      선택지 1: 네트워크 계층은 위에서 다섯 번째 계층으로 ⓓ에 들어간다.
      선택지 2: 표현 계층은 응용 계층 바로 아래 계층으로 ⓐ에 들어간다.
      선택지 3: 전송 계층은 세션 계층 아래 계층으로 ⓒ에 들어간다.
      선택지 4: 세션 계층은 표현 계층 바로 아래, 위에서 세 번째 계층이므로 ⓑ에 들어가는 정답이다.

      핵심 개념:
      OSI(Open Systems Interconnection) 7계층은 위에서부터 응용 - 표현 - 세션 - 전송 - 네트워크 - 데이터링크 - 물리 계층 순서이다.
      따라서 ⓐ 표현, ⓑ 세션, ⓒ 전송, ⓓ 네트워크, ⓔ 데이터링크 계층이다.
      물리 계층은 비트, 데이터링크 계층은 프레임, 네트워크 계층은 패킷 단위로 전송한다.
      전송 계층은 세그먼트 또는 데이터그램 단위로 종단 간 신뢰성을 보장한다.

  - id: b08-08
    type: multiple-choice
    passageRefs: [gb08-presentation-01]
    prompt: OSI 7계층 구조의 기능 중에서 다음과 같은 기능을 담당하는 계층은 무엇인가?
    choices:
      - { id: '1', text: '데이터링크 계층' }
      - { id: '2', text: '응용 계층' }
      - { id: '3', text: '세션 계층' }
      - { id: '4', text: '표현 계층' }
    answers: ['4']
    explanation: |
      선택지 1: 데이터링크 계층은 직접 연결된 두 장비 간에 프레임 단위로 전송하며 프레임의 시작과 끝·수신자 주소 추가, 오류 발견 및 수정, 흐름 제어를 담당한다. 표현 형식 변환과는 관계가 없다.
      선택지 2: 응용 계층은 HTTP, FTP, SMTP 등 응용 프로토콜의 기능을 지원하는 계층이다.
      선택지 3: 세션 계층은 통신 컴퓨터 간 연결의 접속/차단과 데이터 통신 방식(양쪽이 동시에 주고받을지 등)을 결정한다.
      선택지 4: 표현 계층은 송수신 데이터의 표현 방식에 대한 표준화된 구문 형식을 제공하여 시스템 간 데이터 변환이 잘 작동하도록 하며, 표현 형식 변환·압축·암호화를 담당하므로 정답이다.

      핵심 개념:
      표현 계층(presentation layer)은 표준 구문 형식을 제공한다.
      컴퓨터 구조가 달라 데이터 저장·표현 방식이 달라도 올바르게 해석되도록 변환한다.
      데이터 압축과 암호화도 표현 계층의 기능이다.
      세션 계층은 연결 관리, 응용 계층은 응용 프로토콜 지원을 담당한다.

  - id: b08-09
    type: multiple-choice
    passageRefs: [gb08-application-01]
    prompt: OSI 7계층 구조의 기능 중에서 다음과 같은 기능을 담당하는 계층은 무엇인가?
    choices:
      - { id: '1', text: '데이터 링크 계층' }
      - { id: '2', text: '응용 계층' }
      - { id: '3', text: '세션 계층' }
      - { id: '4', text: '표현 계층' }
    answers: ['2']
    explanation: |
      선택지 1: 데이터 링크 계층은 직접 연결된 장비 간 프레임 단위 전송과 오류 제어·흐름 제어를 담당하며, 대표 프로토콜은 이더넷과 와이파이이다.
      선택지 2: 응용 계층은 웹에서 사용하는 HTTP(HyperText Transfer Protocol), 파일 전송을 위한 FTP(File Transfer Protocol), 이메일 전송을 위한 SMTP(Simple Mail Transfer Protocol) 등 응용 프로토콜의 기능을 지원하므로 정답이다.
      선택지 3: 세션 계층은 통신 컴퓨터 간 연결의 접속/차단과 데이터 통신 방식을 결정하는 계층이다.
      선택지 4: 표현 계층은 송수신 데이터의 표현 방식에 대한 표준 구문 형식을 제공하여 데이터 변환을 담당하는 계층이다.

      핵심 개념:
      응용 계층(application layer)은 OSI 모델의 최상위 계층이다.
      사용자가 쓰는 응용 프로토콜(HTTP, FTP, SMTP 등)의 기능을 지원한다.
      데이터링크 계층 프로토콜은 이더넷·와이파이, 네트워크 계층 프로토콜은 IPv4·IPv6이다.
      전송 계층 프로토콜은 TCP이다.

  - id: b08-10
    type: multiple-choice
    prompt: OSI 모델에서 전체 메시지를 패킷 단위로 분할하거나, 패킷들의 순서를 조정해서 전체 메시지를 재생성하는 등의 출발지와 목적지 간의 전체 메시지 전송을 담당하는 계층은?
    choices:
      - { id: '1', text: '전송 계층' }
      - { id: '2', text: '데이터링크 계층' }
      - { id: '3', text: '네트워크 계층' }
      - { id: '4', text: '세션 계층' }
    answers: ['1']
    explanation: |
      선택지 1: 전송 계층(transport layer)은 세그먼트 또는 데이터그램 단위의 메시지를 송신 컴퓨터에서 수신 컴퓨터까지 신뢰성을 보장하며 전달하고, 메시지를 패킷 단위로 잘라 보낸 뒤 사라지거나 순서가 바뀐 패킷을 오류 없이 다시 구성하므로 정답이다. 인터넷의 TCP(Transmission Control Protocol)가 이 계층에서 정의된다.
      선택지 2: 데이터링크 계층은 직접 연결된 두 컴퓨터나 장비 간에 프레임 단위로 전송하며 오류 발견·수정과 흐름 제어를 담당한다. 출발지와 목적지 간 전체 메시지 전송을 담당하지 않는다.
      선택지 3: 네트워크 계층은 패킷 단위 전송과 계층적 주소 지정, 라우팅, 혼잡 제어(congestion control)를 담당하며 IP(Internet Protocol)가 정의된다. 전체 메시지의 분할·재조립은 전송 계층의 역할이다.
      선택지 4: 세션 계층은 통신 컴퓨터 간 연결의 접속/차단 시점과 데이터 통신 방식을 결정하는 계층이다.

      핵심 개념:
      물리 계층은 비트 단위 전송, 데이터링크 계층은 프레임 단위 전송과 오류·흐름 제어를 담당한다.
      네트워크 계층은 패킷 단위 전송, 라우팅, 혼잡 제어를 담당하며 IP가 정의된다.
      전송 계층은 종단 간 신뢰성 있는 전송, 메시지 분할과 재조립을 담당하며 TCP가 정의된다.
      세션 계층은 연결 관리, 표현 계층은 표현 형식 변환, 응용 계층은 응용 프로토콜 지원을 담당한다.

  - id: b08-11
    type: multiple-choice
    prompt: OSI 모델의 네트워크 계층에서 취급되는 데이터 단위이며, 일반적으로 인터넷에서의 전송 단위로 사용되는 것은?
    choices:
      - { id: '1', text: '패킷' }
      - { id: '2', text: '프레임' }
      - { id: '3', text: 'BPS' }
      - { id: '4', text: '비트' }
    answers: ['1']
    explanation: |
      선택지 1: 패킷(packet)은 네트워크 계층에서 취급되는 데이터 단위로, IP를 사용해 보내는 인터넷의 기본 전송 단위이므로 정답이다. 패킷은 헤더(header)와 데이터 부분으로 구성된다.
      선택지 2: 프레임(frame)은 데이터링크 계층에서 직접 연결된 장비 간에 전송하는 블록 단위의 정보이다.
      선택지 3: BPS(Bits Per Second)는 초당 전송되는 비트 수를 나타내는 전송 속도 단위로, 데이터 단위가 아니다.
      선택지 4: 비트(bit)는 물리 계층에서 물리적 채널을 통해 전송되는 단위이다.

      핵심 개념:
      계층별 데이터 단위: 물리 계층은 비트, 데이터링크 계층은 프레임이다.
      네트워크 계층은 패킷이며, IP로 보내는 패킷을 데이터그램이라고도 한다.
      전송 계층은 세그먼트 또는 데이터그램이다.
      패킷 헤더에는 버전 정보, 패킷 길이, 송수신 IP 주소 등 제어 정보가 담긴다.

  - id: b08-12
    type: multiple-choice
    prompt: 회선 교환망과 메시지 교환망의 장점을 결합한 전송망에서는 데이터 전체가 아니라 송신 측 주소와 수신 측 주소를 포함하는 일정 형식의 데이터 블록을 기본 단위로 통신이 이루진다. 이와 같은 통신의 기본 단위를 무엇이라고 하는가?
    choices:
      - { id: '1', text: '패킷' }
      - { id: '2', text: '블록' }
      - { id: '3', text: '코드' }
      - { id: '4', text: '데이터그램' }
    answers: ['1']
    explanation: |
      선택지 1: 패킷(packet)은 패킷 교환 방식에서 메시지를 나눈 작은 단위로, 송수신 주소 등 제어 정보를 담은 헤더와 데이터 부분으로 구성되므로 정답이다.
      선택지 2: 블록은 일정 크기의 데이터 묶음을 가리키는 일반 용어로, 패킷 교환망의 통신 기본 단위를 가리키는 명칭이 아니다.
      선택지 3: 코드는 정보를 표현하는 부호 체계를 뜻하며 통신의 전송 단위가 아니다.
      선택지 4: 데이터그램은 IP를 사용해 보내는 패킷을 달리 부르는 이름으로, 패킷 교환망의 일반적인 기본 단위의 명칭은 패킷이다.

      핵심 개념:
      패킷 교환 방식은 메시지를 패킷이라는 작은 단위로 나누어 패킷별로 보낸다.
      중간 스위치들은 수신한 패킷을 목적지 방향의 스위치로 전달한다.
      패킷은 헤더와 데이터 부분으로 구성되며, 헤더에 송수신 IP 주소 등이 들어 있다.
      IP는 패킷을 출발지에서 목적지로 전달하는 것을 목적으로 한다.

  - id: b08-13
    type: multiple-choice
    prompt: 다음 중 인터넷 응용 계층 프로토콜이 ==아닌== 것은?
    choices:
      - { id: '1', text: 'FTP' }
      - { id: '2', text: 'HTTP' }
      - { id: '3', text: 'UDP' }
      - { id: '4', text: 'SMTP' }
    answers: ['3']
    explanation: |
      선택지 1: FTP(File Transfer Protocol)는 파일 전송에 사용되는 응용 계층 프로토콜이다.
      선택지 2: HTTP(HyperText Transfer Protocol)는 웹 서버와 웹 브라우저 간의 멀티미디어 통신에 사용되는 응용 계층 프로토콜이다.
      선택지 3: UDP(User Datagram Protocol)는 TCP와 함께 전송 계층에서 동작하는 프로토콜이므로 응용 계층 프로토콜이 아닌 정답이다.
      선택지 4: SMTP(Simple Mail Transfer Protocol)는 메일 서버 간 또는 사용자에서 메일 서버로의 이메일 전송에 사용되는 응용 계층 프로토콜이다.

      핵심 개념:
      응용 계층 프로토콜로 FTP, HTTP/HTTPS, SMTP, DHCP 등이 있다.
      ICMP(Internet Control Message Protocol)는 전송 오류에 관한 메시지를 주고받는 프로토콜로, IP와 함께 네트워크 계층에서 동작한다.
      메일 서버에서 사용자로 메일을 전달할 때는 POP3, IMAP4가 사용된다.
      DHCP(Dynamic Host Configuration Protocol)는 IP 주소를 동적으로 할당받는 데 사용된다.

  - id: b08-14
    type: multiple-choice
    prompt: 송신 노드로부터 수신 노드까지 신뢰성 있게 순서대로 나열된 메시지를 보낼 수 있게 해 주는 통신 프로토콜은 무엇인가?
    choices:
      - { id: '1', text: 'TCP' }
      - { id: '2', text: 'UDP' }
      - { id: '3', text: 'SMTP' }
      - { id: '4', text: 'IP' }
    answers: ['1']
    explanation: |
      선택지 1: TCP(Transmission Control Protocol)는 신뢰성 있는 연결 지향형(connection-oriented) 전송을 지원하며, 수신 확인(acknowledgment)과 재전송, 세그먼트의 순서 복원, 중복 세그먼트 삭제, 흐름 제어를 제공하므로 정답이다.
      선택지 2: UDP(User Datagram Protocol)는 연결 설정이나 수신 확인 없이 데이터그램을 보내는 비연결형 전송 계층 프로토콜로, 신뢰성과 순서를 보장하지 않는다.
      선택지 3: SMTP(Simple Mail Transfer Protocol)는 이메일 전송을 위한 응용 계층 프로토콜이다.
      선택지 4: IP(Internet Protocol)는 패킷을 출발지에서 목적지로 전달하는 네트워크 계층 프로토콜로, 전달 순서나 신뢰성을 보장하지 않는다.

      핵심 개념:
      TCP는 송신자와 수신자(노드에서 실행되는 프로세스) 간 연결 지향형 전송을 한다.
      메시지나 확인 메시지가 사라지면 송신자가 재전송한다.
      메시지는 세그먼트로 잘려 IP 데이터그램으로 전달되며 TCP가 원래 순서로 복원한다.
      중복 세그먼트 삭제와 흐름 제어 서비스도 TCP가 담당한다.
