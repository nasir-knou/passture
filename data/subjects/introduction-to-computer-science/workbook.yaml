      선택지 2: 11101101은 −109를 부호화-크기 방식으로 표현한 것(부호 비트 1 + 절댓값 1101101)이다.
      선택지 3: 10010010은 109의 각 비트에 보수만 취한 1의 보수 표현으로, 1을 더하지 않았다.
