      - { id: '4', text: '선택 정렬' }
    answers: ['4']
    explanation: |
      선택지 1: 퀵 정렬은 피벗을 기준으로 두 부분배열로 분할하는 방식이며, 분할 비율에 따라 최선·평균 $O(n \log n)$, 최악 $O(n^2)$로 성능이 달라진다.
      선택지 2: 삽입 정렬은 데이터를 하나씩 정렬된 부분의 제자리에 삽입하며, 거의 정렬된 입력이면 $O(n)$, 최악 $O(n^2)$로 입력 순서에 민감하다.
      선택지 3: 버블 정렬은 인접한 두 값을 비교·교환하며, 정렬된 입력이면 $O(n)$, 역순이면 $O(n^2)$로 입력 순서에 민감하다.
      선택지 4: 선택 정렬은 미정렬 데이터에서 최솟값을 골라 미정렬 부분의 첫 번째 데이터와 교환하며, 입력 상태와 무관하게 언제나 $O(n^2)$이므로 정답이다.

      핵심 개념:
      선택 정렬: 가장 작은 값, 두 번째로 작은 값 등을 순서대로 골라 재배열하며 최악·최선·평균이 모두 $O(n^2)$이다.
      버블 정렬: 모든 인접한 두 값을 차례로 비교해 필요하면 자리를 바꾸며, 최선 $O(n)$, 최악 $O(n^2)$이다.
      삽입 정렬: 데이터를 하나씩 뽑아 정렬된 부분의 제자리에 삽입하며, 최선 $O(n)$, 최악 $O(n^2)$이다.
      입력 순서에 무관한 성능은 선택 정렬의 특징이다.

  - id: b03-17
    type: multiple-choice
    passageRefs: [gb03-bubble-data-01]
    prompt: 주어진 데이터를 버블 정렬로 정렬할 때, 밑줄 친 부분이 이미 정렬된 부분이라면 다음 단계에 해당하는 결과는? (단, 오름차순으로 정렬한다.)
    choices:
      - { id: '1', text: '10 5 15 25 20 30 35 40' }
      - { id: '2', text: '10 15 5 20 25 30 35 40' }
      - { id: '3', text: '10 5 15 20 25 30 35 40' }
      - { id: '4', text: '10 15 5 25 20 30 35 40' }
    answers: ['1']
    explanation: |
      선택지 1: 왼쪽부터 인접한 두 값을 비교하면 25↔10, 25↔5, 25↔15 교환 후 25와 30은 그대로, 30↔20 교환으로 단계가 끝나 10 5 15 25 20 30 35 40이 되므로 정답이다.
      선택지 2: 한 단계에서 25가 10, 5, 15와 차례로 자리를 바꾸므로 앞부분은 10 5 15가 되어야 한다. 10 15 5는 이와 맞지 않고, 25와 20도 아직 교환되지 않아 25 20 순서여야 한다.
      선택지 3: 한 단계에서는 25와 30을 비교한 뒤 30과 20을 교환하므로 25와 20은 교환되지 않는다. 20 25 순서는 한 단계 결과가 아니며, 다음 단계에서는 10과 5도 교환되어 5 10 15 20 25 30 35 40이 된다.
      선택지 4: 25가 5, 15와 차례로 자리를 바꾸면 10 5 15 순서가 되므로 10 15 5는 한 단계 결과와 맞지 않는다.

      핵심 개념:
      버블 정렬은 왼쪽부터 모든 인접한 두 값을 비교해 왼쪽 값이 더 크면 자리를 바꾸는 과정을 반복한다.
      한 단계가 끝나면 미정렬 부분의 최댓값(여기서는 30)이 정렬된 부분 바로 앞에 놓인다.
      처리 과정: 25 10 5 15 30 20 → 10 25 5 … → 10 5 25 15 … → 10 5 15 25 30 20 → (30과 20 교환) 10 5 15 25 20 30 35 40.
      최선 $O(n)$(이미 정렬된 경우), 최악 $O(n^2)$(역순으로 정렬된 경우)이며, 선택 정렬보다 교환이 많이 발생한다.

  - id: b03-18
