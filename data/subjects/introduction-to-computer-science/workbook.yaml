      ㉡ 각 비트의 보수를 취한다.
      ㉢ 10진수로 변환하고 부호 비트(맨 왼쪽)가 1이면 음수를 붙인다.

  - id: b01-17
    type: multiple-choice
    prompt: $1.001011\times2^{-7}$과 같은 형태의 수를 컴퓨터 내에 표현할 때 −7에 해당하는 지수 부분을 표현하기 위한 정수 표현 방법은?
    choices:
      - { id: '1', text: '초과표기법' }
      - { id: '2', text: '1의 보수 방식' }
      - { id: '3', text: '부호화-크기 방식' }
      - { id: '4', text: '2의 보수 방식' }
    answers: ['1']
    explanation: |
      선택지 1: 부동소수점의 지수 부분은 양수와 음수가 모두 가능하므로 부호 비트를 따로 쓰지 않고 매직넘버를 더해 부호와 값을 함께 표현하는 초과표기법을 사용한다. 정답이다.
      선택지 2: 1의 보수 방식은 부호 비트를 사용하는 일반적인 정수 표현 방법으로 지수 표현에 쓰지 않는다.
      선택지 3: 부호화-크기 방식도 부호 비트를 별도로 사용하는 일반 정수 표현 방법이다.
      선택지 4: 2의 보수 방식은 일반 정수 표현에 널리 쓰이지만 부동소수점 지수 부분에는 초과표기법을 쓴다.

      핵심 개념:
      실수는 부동소수점 방식 $(-1)^{\text{부호}}\times\text{가수}\times2^{\text{지수}}$ 형태로 표현한다.
      지수 부분은 양수·음수가 모두 가능하다.
      초과표기법은 n비트에서 매직넘버 $2^{n-1}$ 또는 $2^{n-1}-1$을 더해 표현한다.
      부호 비트 없이 부호와 값을 함께 표현한다.

  - id: b01-18
    type: multiple-choice
    prompt: 부호화-크기 방식으로 표현된 8비트 패턴이 11100111이다. 이 값을 8비트 초과표기법으로 올바르게 표현한 것은? (단, 초과_127을 사용한다.)
    choices:
      - { id: '1', text: '00011000' }
      - { id: '2', text: '00011001' }
      - { id: '3', text: '01100110' }
      - { id: '4', text: '01100111' }
    answers: ['1']
    explanation: |
      선택지 1: 부호 비트 1을 제외한 1100111 = 103이므로 값은 −103이다. 매직넘버 127을 더하면 −103 + 127 = 24 = 00011000이므로 정답이다.
      선택지 2: 00011001은 25로, 초과_127에서는 −102에 해당한다.
      선택지 3: 01100110은 102로, 초과_127에서는 −25에 해당한다.
      선택지 4: 01100111은 103으로, 부호 비트를 떼어 낸 절댓값을 그대로 쓴 것이며 초과_127에서는 −24에 해당한다.

      핵심 개념:
      초과표기법은 주어진 값에 매직넘버를 더해 n비트 2진수로 나타낸다.
      8비트 초과_127은 값 + 127을 저장한다.
      부호화-크기 방식은 최상위 비트가 부호, 나머지가 절댓값이다.
      먼저 10진수로 바꾼 뒤 매직넘버를 더한다.

  - id: b01-19
    type: multiple-choice
    prompt: 부동소수점의 지수를 8비트 초과표기법으로 나타낸 결과가 10000101일 때 지수에 해당하는 10진수 값은 얼마인가? (단, 초과_127을 사용한다.)
