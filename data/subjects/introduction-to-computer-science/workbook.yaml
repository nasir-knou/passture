questions:
  - id: b01-01
    type: multiple-choice
    prompt: 컴퓨터라는 데이터 처리기에서 처리 가능한 작업의 유형과 연산의 집합을 결정하는 것은?
    choices:
      - { id: '1', text: '인터넷' }
      - { id: '2', text: '정보' }
      - { id: '3', text: '프로그램' }
      - { id: '4', text: '데이터' }
    answers: ['3']
    explanation: |
      선택지 1: 인터넷은 전 세계 컴퓨터를 연결하는 통신망으로, 데이터 처리기가 수행할 작업과 연산을 정하는 요소가 아니다.
      선택지 2: 정보는 데이터를 처리한 결과물이므로 처리 가능한 작업을 결정하는 쪽이 아니라 처리의 산출물이다.
      선택지 3: 컴퓨터는 프로그램이 가능한 데이터 처리기(programmable data processor)이며, 프로그램이 컴퓨터가 처리 가능한 작업의 유형과 연산의 집합을 결정하므로 정답이다.
      선택지 4: 데이터는 입력되어 처리되는 대상(원재료)이지 작업과 연산의 종류를 정하는 것이 아니다.

      핵심 개념:
      컴퓨터는 프로그램이 가능한 데이터 처리기이다.
      데이터 처리기의 기본 기능은 입력(input) → 처리(process) → 출력(output)이다.
      프로그램이 처리 가능한 작업의 유형과 연산의 집합을 결정한다.
      따라서 프로그램을 바꾸면 같은 하드웨어로 다른 작업을 수행할 수 있다.

  - id: b01-02
    type: multiple-choice
    prompt: 컴퓨터를 특수 목적의 작업만을 처리하는 기계가 아닌, 다양한 유형의 작업을 처리할 수 있는 범용의 기계로 만드는 역할을 담당하는 것은?
    choices:
      - { id: '1', text: '중앙처리장치' }
      - { id: '2', text: '프로그램' }
      - { id: '3', text: '기억장치' }
      - { id: '4', text: '데이터' }
    answers: ['2']
    explanation: |
      선택지 1: 중앙처리장치(CPU, Central Processing Unit)는 명령어를 해석·실행하는 하드웨어로, 무엇을 실행할지는 프로그램이 정하므로 범용성을 부여하는 주체가 아니다.
      선택지 2: 프로그램이 컴퓨터에서 처리 가능한 작업을 결정하므로 원하는 프로그램을 실행하면 컴퓨터는 다양한 유형의 작업을 처리하는 범용 기계가 된다. 정답이다.
      선택지 3: 기억장치는 프로그램과 데이터를 저장하는 하드웨어로, 저장 기능만으로 작업의 종류가 달라지지 않는다.
      선택지 4: 데이터는 처리 대상일 뿐 작업의 유형을 결정하지 않는다.

      핵심 개념:
      컴퓨터가 범용 기계인 이유는 프로그램으로 작업을 바꿀 수 있기 때문이다.
      하드웨어는 고정되어 있어도 프로그램을 교체하면 다른 작업을 수행한다.
      프로그램은 처리 가능한 작업과 연산의 집합을 결정한다.
      특수 목적 기계는 정해진 한 가지 작업만 처리한다.

  - id: b01-03
    type: multiple-choice
    prompt: 다음 시간 단위 중에서 $10^{-9}$초를 나타내는 것은?
    choices:
      - { id: '1', text: 'ps' }
      - { id: '2', text: 'ms' }
      - { id: '3', text: 'ns' }
      - { id: '4', text: 'µs' }
    answers: ['3']
    explanation: |
      선택지 1: ps(picosecond, 피코초)는 $10^{-12}$초이다.
      선택지 2: ms(millisecond, 밀리초)는 $10^{-3}$초이다.
      선택지 3: ns(nanosecond, 나노초)는 $10^{-9}$초이므로 정답이다.
      선택지 4: µs(microsecond, 마이크로초)는 $10^{-6}$초이다.

      핵심 개념:
      시간 단위는 $10^{-3}$씩 작아진다.
      ms = $10^{-3}$초, µs = $10^{-6}$초.
      ns = $10^{-9}$초, ps = $10^{-12}$초.
      작은 순서: ps < ns < µs < ms.

  - id: b01-04
    type: multiple-choice
    passageRefs: [gb01-cs-def-01]
    prompt: 다음과 같은 두 관점의 컴퓨터과학 정의 (a)와 (b)의 빈칸에 공통으로 들어갈 수 있는 가장 적절한 단어는?
    choices:
      - { id: '1', text: '컴퓨터' }
      - { id: '2', text: '프로그램' }
      - { id: '3', text: '데이터' }
      - { id: '4', text: '알고리즘' }
    answers: ['4']
    explanation: |
      선택지 1: 컴퓨터는 (a)의 빈칸 네 개 중 하나에는 들어가지만, (b)의 "문제 해결을 위해 관련된 이슈를 다루는" 중심 개념은 아니다.
      선택지 2: 프로그램은 (a)에는 들어가지만 (b)에서 모든 관련 분야를 설명하는 중심 개념은 아니다.
      선택지 3: 데이터는 (a)에는 들어가지만 (b)의 중심 개념이 아니다.
      선택지 4: (a)는 컴퓨터, 데이터, 프로그램, 알고리즘 분야의 연구를 통한 학문이고, (b)는 알고리즘과 관련된 이슈를 다루는 학문이며 모든 관련 분야는 알고리즘을 중심으로 이해할 수 있으므로 공통으로 들어갈 단어는 알고리즘이다. 정답이다.

      핵심 개념:
      컴퓨터과학의 다양한 정의가 있다.
      데이터의 획득·표현·처리·저장·통신·접근 방법의 실행 가능성, 구조화, 표현, 기계화를 다루는 학문이다.
      컴퓨터, 데이터, 프로그램, 알고리즘 분야의 연구로 효율적인 데이터 처리 기술과 방법을 제공하는 학문이다.
      알고리즘과 관련된 이슈를 다루는 학문으로, 모든 관련 분야는 알고리즘을 중심으로 이해할 수 있다.

  - id: b01-05
    type: multiple-choice
    prompt: 하나의 완전한 컴퓨터 시스템이 갖추어야 할 요소로서 거리가 ==먼== 것은?
    choices:
      - { id: '1', text: '소프트웨어' }
      - { id: '2', text: '하드웨어' }
      - { id: '3', text: '사용자' }
      - { id: '4', text: '정보' }
    answers: ['4']
    explanation: |
      선택지 1: 소프트웨어는 컴퓨터 시스템의 구성요소이다.
      선택지 2: 하드웨어는 컴퓨터 시스템의 구성요소이다.
      선택지 3: 사용자는 컴퓨터 시스템의 구성요소이다.
      선택지 4: 정보는 데이터를 처리한 결과이며 컴퓨터 시스템의 구성요소가 아니다. 구성요소에 해당하는 것은 정보가 아니라 데이터이므로 정답이다.

      핵심 개념:
      컴퓨터는 여러 요소로 이루어진 시스템으로 존재한다.
      하나의 완전한 컴퓨터 시스템의 구성요소는 하드웨어, 소프트웨어, 데이터, 사용자이다.
      정보는 데이터를 처리한 결과물로 구성요소와 구별된다.
      구성요소 중 데이터와 정보를 혼동하지 않도록 한다.

  - id: b01-06
    type: multiple-choice
    prompt: 폰 노이만 모델에 관련된 설명으로 올바른 것은?
    choices:
      - { id: '1', text: '컴퓨터의 내부 구조, 처리 과정 및 데이터의 저장 형태를 정의한 모델이다.' }
      - { id: '2', text: '폰 노이만 모델은 하드웨어, 소프트웨어, 사용자, 데이터로 구성된다.' }
      - { id: '3', text: '데이터만 메모리에 저장되어 처리된다.' }
      - { id: '4', text: '프로그램은 유한개의 기본 명령어로 구성되어 순차적으로 실행된다.' }
    answers: ['4']
    explanation: |
      선택지 1: 폰 노이만 모델은 컴퓨터의 내부 구조와 처리 과정을 정의한 모델이지만, 데이터가 컴퓨터에 어떻게 저장되어야 하는지는 실제로 정의하지 않는다.
      선택지 2: 하드웨어, 소프트웨어, 사용자, 데이터는 컴퓨터 시스템의 구성요소이다. 폰 노이만 모델은 기억장치, 산술논리연산장치, 제어장치, 입출력장치의 4개 서브시스템으로 구성된다.
      선택지 3: 데이터만 기억장치에 적재되어 처리되던 것은 폰 노이만 모델 이전의 방식이다. 폰 노이만 모델은 내장 프로그램(stored program) 방식으로 프로그램도 데이터와 함께 메모리에 저장된다.
      선택지 4: 프로그램은 유한개의 기본 명령어로 구성되며, 제어장치가 메모리의 명령어를 하나씩 가져와 해석하고 산술논리연산장치가 실행하므로 정답이다.

      핵심 개념:
      폰 노이만 모델은 컴퓨터의 내부 구조와 처리 과정을 정의한 모델이다.
      4개 서브시스템: 기억장치, 산술논리연산장치, 제어장치, 입출력장치.
      내장 프로그램 방식: 프로그램과 데이터가 같은 기억장치에 같은 형식으로 저장된다.
      프로그램은 유한개의 기본 명령어로 구성되어 하나씩 가져와 해석·실행된다.

  - id: b01-07
    type: multiple-choice
    prompt: 다음 설명 중 적절한 것은?
    choices:
      - { id: '1', text: '데이터는 적절한 의사결정을 수행할 수 있게 하는 지식으로 직접 사용된다.' }
      - {
          id: '2',
          text: '정보는 현실 세계로부터 관찰이나 측정을 통해 단순히 얻어지는 사실이나 값을 나타낸다.',
        }
      - {
          id: '3',
          text: '정보처리란 정보를 처리해서 데이터로 가공/변환하는 일련의 과정을 일컫는다.',
        }
      - { id: '4', text: '컴퓨터에서 데이터는 유형에 상관없이 동일한 방식으로 표현된다.' }
    answers: ['4']
    explanation: |
      선택지 1: 적절한 의사결정을 수행할 수 있게 하는 지식은 데이터가 아니라 정보에 대한 설명이다.
      선택지 2: 현실 세계로부터 관찰이나 측정을 통해 단순히 얻어지는 사실이나 값은 정보가 아니라 데이터에 대한 설명이다.
      선택지 3: 정보처리(데이터 처리)는 데이터를 정보로 가공·변환하는 과정이므로 방향이 반대로 서술되어 있다.
      선택지 4: 모든 데이터는 문자, 숫자, 이미지, 오디오, 비디오 등 유형에 상관없이 비트 패턴(비트의 나열)이라는 일관된 방식으로 표현되므로 정답이다.

      핵심 개념:
      데이터와 정보의 관계는 I = P(D)이다(D: 데이터, P: 처리기, I: 정보).
      데이터는 관찰·측정으로 얻은 사실이나 값으로, 처리 대상이자 정보의 원재료이다.
      정보는 의사결정에 쓰이는 지식으로, 데이터를 처리한 결과이다.
      컴퓨터에서 모든 유형의 데이터는 비트 패턴으로 표현된다.

  - id: b01-08
    type: multiple-choice
    prompt: 컴퓨터에서 연산의 기본 단위가 되는 정보의 양을 무엇이라 하는가?
    choices:
      - { id: '1', text: '워드' }
      - { id: '2', text: '바이트' }
      - { id: '3', text: '패킷' }
      - { id: '4', text: '비트' }
    answers: ['1']
    explanation: |
      선택지 1: 워드(word)는 컴퓨터 연산의 기본 단위가 되는 정보의 양으로, 크기는 시스템에 따라 달라진다. 정답이다.
      선택지 2: 바이트(byte)는 길이가 8인 비트의 나열로 $2^8=256$가지를 표현하는 단위이며, 연산의 기본 단위라는 정의와는 다르다.
      선택지 3: 패킷(packet)은 네트워크에서 데이터를 전송할 때 쓰는 전송 단위로 연산 단위가 아니다.
      선택지 4: 비트(bit)는 0 또는 1의 두 상태 중 하나를 표시하는 논리적인 최소 단위이지 연산의 기본 단위는 아니다.

      핵심 개념:
      비트: 0 또는 1을 나타내는 논리적 최소 단위.
      바이트: 8비트, 256가지 표현 가능.
      워드: 연산의 기본 단위, 시스템마다 크기가 다르다.
      KB($2^{10}$), MB($2^{20}$), GB($2^{30}$), TB($2^{40}$), PB($2^{50}$), EB($2^{60}$), ZB($2^{70}$), YB($2^{80}$) 바이트 순으로 커진다.

  - id: b01-09
    type: multiple-choice
    prompt: 다음 단위 중에서 가장 적은 데이터의 양을 나타내는 것은?
    choices:
      - { id: '1', text: 'EB' }
      - { id: '2', text: 'PB' }
      - { id: '3', text: 'TB' }
      - { id: '4', text: 'YB' }
    answers: ['3']
    explanation: |
      선택지 1: EB(exabyte)는 $2^{60} \approx 10^{18}$바이트로 TB보다 크다.
      선택지 2: PB(petabyte)는 $2^{50} \approx 10^{15}$바이트로 TB보다 크다.
      선택지 3: TB(terabyte)는 $2^{40} \approx 10^{12}$바이트로 보기 중 가장 작으므로 정답이다.
      선택지 4: YB(yottabyte)는 $2^{80} \approx 10^{24}$바이트로 보기 중 가장 크다.

      핵심 개념:
      바이트 단위는 $2^{10}$배씩 커진다.
      KB < MB < GB < TB < PB < EB < ZB < YB.
      TB = $2^{40}$, PB = $2^{50}$, EB = $2^{60}$, YB = $2^{80}$바이트.
      각 단위는 대략 $10^3$배씩 커진다.

  - id: b01-10
    type: multiple-choice
    prompt: 10진수 43.6875를 8진수와 16진수로 각각 올바르게 표현한 것은?
    choices:
      - { id: '1', text: '53.54   2B.B' }
      - { id: '2', text: '54.53   2C.C' }
      - { id: '3', text: '53.54   2C.C' }
      - { id: '4', text: '54.53   2B.B' }
    answers: ['1']
    explanation: |
      선택지 1: $43 = 101011_{(2)}$, $0.6875 = 0.1011_{(2)}$이므로 $43.6875_{(10)} = 101011.1011_{(2)}$이다. 3자리씩 묶으면 $101\ 011.101\ 100 = 53.54_{(8)}$, 4자리씩 묶으면 $0010\ 1011.1011 = \mathrm{2B.B}_{(16)}$이므로 정답이다.
      선택지 2: 8진수 54.53과 16진수 2C.C는 모두 올바른 변환 결과가 아니다.
      선택지 3: 8진수 53.54는 맞지만 16진수는 2C.C가 아니라 2B.B이다.
      선택지 4: 16진수 2B.B는 맞지만 8진수는 54.53이 아니라 53.54이다.

      핵심 개념:
      10진수를 r진수로 바꿀 때는 정수 부분과 소수 부분을 나눠서 변환한 후 합친다.
      정수 부분은 r로 나눈 나머지를, 소수 부분은 r을 곱한 정수 부분을 차례로 취한다.
      2진수 3자리는 8진수 1자리, 2진수 4자리는 16진수 1자리에 대응한다.
      소수점을 기준으로 좌우 방향으로 묶는다.

  - id: b01-11
    type: multiple-choice
    prompt: $159.\mathrm{F}_{(16)}$를 8진수로 올바르게 표현한 것은?
    choices:
      - { id: '1', text: '530.17' }
      - { id: '2', text: '531.74' }
      - { id: '3', text: '531.17' }
      - { id: '4', text: '530.74' }
    answers: ['2']
    explanation: |
      선택지 1: 정수 부분 530과 소수 부분 17 모두 올바르지 않다.
      선택지 2: 16진수 한 자리를 2진수 네 자리로 바꾸면 $0001\ 0101\ 1001.1111_{(2)}$이고, 소수점을 기준으로 좌우 3비트씩 묶으면 $101\ 011\ 001.111\ 100_{(2)} = 531.74_{(8)}$이므로 정답이다.
      선택지 3: 정수 부분 531은 맞지만 소수 부분은 $.111\ 100 = .74$이다. 소수 부분을 오른쪽 끝에서부터 묶으면 17이 되는 잘못이 생긴다.
      선택지 4: 소수 부분 74는 맞지만 정수 부분은 530이 아니라 531이다.

      핵심 개념:
      2진수와 8진수/16진수 간 변환은 소수점을 중심으로 좌우로 묶는다.
      2진수 세 자리는 8진수 한 자리, 네 자리는 16진수 한 자리이다.
      16진수 → 8진수는 2진수를 거쳐 변환한다.
      소수 부분은 소수점 바로 오른쪽부터 묶고 모자라는 자리에 0을 채운다.

  - id: b01-12
    type: multiple-choice
    prompt: 다음 중에서 나머지와 ==다른== 하나의 값을 나타내는 것은?
    choices:
      - { id: '1', text: '$13.59375_{(10)}$' }
      - { id: '2', text: '$15.43_{(8)}$' }
      - { id: '3', text: '$\mathrm{D.98}_{(16)}$' }
      - { id: '4', text: '$1101.10011_{(2)}$' }
    answers: ['2']
    explanation: |
      선택지 1: $13 = 1101_{(2)}$, $0.59375 = 0.10011_{(2)}$이므로 $1101.10011_{(2)}$이다.
      선택지 2: $15.43_{(8)} = 001\ 101.100\ 011 = 1101.100011_{(2)}$로, 소수점 이하 부분에서 다른 값들과 차이가 나므로 정답이다.
      선택지 3: $\mathrm{D.98}_{(16)} = 1101.1001\ 1000 = 1101.10011_{(2)}$이다.
      선택지 4: $1101.10011_{(2)}$ 그대로이다.

      핵심 개념:
      서로 다른 진법의 값은 2진수로 변환해 비교하면 편리하다.
      8진수 한 자리는 2진수 세 자리, 16진수 한 자리는 2진수 네 자리이다.
      10진수 소수 부분은 2를 곱해 나오는 정수 부분을 차례로 취한다.
      소수 부분 끝의 0은 값에 영향을 주지 않는다.

  - id: b01-13
    type: multiple-choice
    passageRefs: [gb01-radix-values-01]
    prompt: 다음 중 가장 큰 수를 나타내는 진법은?
    choices:
      - { id: '1', text: '2진법' }
      - { id: '2', text: '8진법' }
      - { id: '3', text: '10진법' }
      - { id: '4', text: '16진법' }
    answers: ['4']
    explanation: |
      선택지 1: $11100101_{(2)} = 2^7+2^6+2^5+2^2+2^0 = 229$이다.
      선택지 2: $343_{(8)} = 3\times8^2+4\times8^1+3\times8^0 = 227$이다.
      선택지 3: $227_{(10)}$은 그대로 227이다.
      선택지 4: $\mathrm{E7}_{(16)} = 14\times16+7 = 231$로 가장 크므로 정답이다.

      핵심 개념:
      r진수를 10진수로 바꿀 때는 각 자리 숫자에 자리값 $r^i$를 곱해 모두 더한다.
      r진법은 0부터 r−1까지의 숫자만 사용한다.
      16진수에서 A~F는 10~15를 나타낸다.
      서로 다른 진법의 수는 10진수로 통일해 비교한다.

  - id: b01-14
    type: multiple-choice
    prompt: 8비트 패턴 10000000을 정수로 해석할 때 가장 큰 값을 나타내는 표현 방법은?
    choices:
      - { id: '1', text: '부호화-크기 방식' }
      - { id: '2', text: '1의 보수 방식' }
      - { id: '3', text: '2의 보수 방식' }
      - { id: '4', text: '부호 없는 정수' }
    answers: ['4']
    explanation: |
      선택지 1: 부호화-크기 방식은 최상위 비트가 부호, 나머지가 절댓값이다. 부호 비트 1, 크기 0000000 = 0이므로 −0이다.
      선택지 2: 1의 보수 방식은 음수를 양수의 각 비트 보수로 표현한다. 부호 비트가 1이므로 음수이고 보수를 취하면 01111111 = 127이므로 −127이다.
      선택지 3: 2의 보수 방식은 1의 보수에 1을 더해 음수를 표현한다. 1을 뺀 01111111의 보수 10000000 = 128이므로 −128이다.
      선택지 4: 부호 없는 정수는 0과 양수만 표현하며 패턴을 그대로 10진수로 바꾸면 128이다. 네 값 중 가장 크므로 정답이다.

      핵심 개념:
      부호 있는 정수는 최상위 1비트를 부호 비트로 쓰며 0이면 양수, 1이면 음수이다.
      부호화-크기, 1의 보수, 2의 보수 방식은 양수 표현은 같고 음수 표현이 다르다.
      부호 없는 정수는 비트 패턴을 그대로 2진수 값으로 해석한다.
      10000000은 부호 없는 정수 128, 부호화-크기 −0, 1의 보수 −127, 2의 보수 −128이다.

  - id: b01-15
