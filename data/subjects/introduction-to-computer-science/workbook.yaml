  - id: gb01-cs-def-01
    type: text
    body: |
      (a) 컴퓨터과학은 (      ), (      ), (      ), (      )의 연구를 통해 효율적인 데이터 처리를 위한 기술과 방법을 제공하는 학문이다.

      (b) 컴퓨터과학은 문제 해결을 위해 (      )와(과) 관련된 이슈를 다루는 학문으로, 컴퓨터과학과 관련된 모든 분야는 이를 중심으로 설명될 수 있다.

