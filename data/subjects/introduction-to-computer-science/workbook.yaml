      선택지 2: 수행 시간은 같은 입력 크기라도 입력 데이터의 상태(예: 이미 정렬되었는지)에 영향을 받는다.
      선택지 3: 시간 복잡도는 실제 실행 시간을 측정하는 것이 아니라 각 단위 문장(연산)의 수행 횟수의 합으로 나타낸다.
      선택지 4: 수행 시간이 입력 데이터의 상태에 영향을 받으므로 최악의 수행 시간을 일반적인 척도로 사용한다. 정답이다.

      핵심 개념:
      효율성 분석은 알고리즘 수행에 필요한 컴퓨터 자원의 양을 측정하며, 공간 복잡도와 시간 복잡도로 나눈다.
      공간 복잡도는 알고리즘을 실행시켜 완료될 때까지 필요한 총 메모리의 양이다.
      시간 복잡도는 각 단위 문장(연산)의 수행 횟수의 합이며 입력 크기의 함수로 표현한다.
      입력 데이터의 상태에 영향을 받으므로 최악의 수행 시간으로 표현한다.

  - id: b03-09
    type: multiple-choice
    prompt: 알고리즘의 점근성능이란 무엇인가?
    choices:
      - { id: '1', text: '알고리즘의 해가 얼마만큼의 오차를 포함하는지를 나타내는 성능이다.' }
      - { id: '2', text: '확률적으로 구한 성능의 추정치이다.' }
      - { id: '3', text: '입력 크기가 충분히 커질 때 결정되는 성능이다.' }
      - { id: '4', text: '입력 데이터 상태가 최악인 경우의 알고리즘 성능이다.' }
    answers: ['3']
    explanation: |
      선택지 1: 해의 오차 정도는 근사 알고리즘의 정확도에 관한 개념으로 점근성능과 관계없다.
      선택지 2: 확률적으로 구한 추정치는 평균적 분석이나 확률 알고리즘에 관한 개념으로 점근성능의 정의가 아니다.
      선택지 3: 점근성능은 입력 크기 $n$이 충분히 커짐에 따라 결정되는 성능이므로 정답이다.
      선택지 4: 입력 데이터 상태가 최악인 경우의 성능은 최악의 수행 시간을 말하며, 점근성능의 정의가 아니다.

      핵심 개념:
      점근성능은 입력 크기 $n$이 충분히 커짐에 따라 결정되는 성능이다.
      다항식으로 표현된 수행 시간의 함수에서 계수 없이 최고차항만을 취해서 표현한다.
      표기법으로 점근적 상한 $O$, 점근적 하한 $\Omega$, 점근적 상하한 $\Theta$가 있다.
      정확한 수행 시간은 알 수 없지만 알고리즘 간 성능 비교와 증가 추이 파악이 쉽다.

  - id: b03-10
    type: multiple-choice
    prompt: 점근성능의 표기법을 나타내는 그림 중에서 수행 시간이 $f(n) = O(g(n))$에 해당하는 것은?
    choices:
      - id: '1'
        text: ''
        image:
          path: images/subjects/introduction-to-computer-science/workbook/b03-10-1.png
          alt: '선택지 1 그래프: n0 이후 f(n)이 c·g(n)보다 항상 위에 있음'
      - id: '2'
        text: ''
        image:
          path: images/subjects/introduction-to-computer-science/workbook/b03-10-2.png
          alt: '선택지 2 그래프: n0 이후 f(n)이 c1·g(n)과 c2·g(n) 사이에 있음'
      - id: '3'
        text: ''
        image:
          path: images/subjects/introduction-to-computer-science/workbook/b03-10-3.png
          alt: '선택지 3 그래프: n0 이후 f(n)이 c·g(n)보다 항상 아래에 있음'
      - id: '4'
        text: ''
        image:
          path: images/subjects/introduction-to-computer-science/workbook/b03-10-4.png
          alt: '선택지 4 그래프: n0부터 n1 사이에서만 f(n)이 c·g(n)보다 아래에 있음'
    answers: ['3']
    explanation: |
      선택지 1: $n_0$ 이후 $f(n)$이 항상 $c \cdot g(n)$ 위에 있으므로 $c \cdot g(n)$이 하한이 되는 Big-omega $\Omega$ 표기에 해당한다.
      선택지 2: $n_0$ 이후 $f(n)$이 $c_1 \cdot g(n)$과 $c_2 \cdot g(n)$ 사이에 있으므로 상한과 하한을 동시에 표현하는 Big-theta $\Theta$ 표기에 해당한다.
      선택지 3: $n_0$ 이후 $f(n)$이 항상 $c \cdot g(n)$ 아래에 있으므로 $c \cdot g(n)$이 점근적 상한이 되는 Big-oh $O$ 표기에 해당하여 정답이다.
      선택지 4: $f(n)$이 $c \cdot g(n)$ 아래에 있는 구간이 $n_0$부터 $n_1$까지로 한정되고 이후 다시 위로 올라가므로, 충분히 큰 모든 $n$에서 상한이 성립하지 않아 $O$ 표기가 아니다.

      핵심 개념:
      Big-oh $O$: 점근적 상한, 즉 수행 시간 $f(n)$의 상한을 표현한다.
      Big-omega $\Omega$: 점근적 하한, 즉 $f(n)$의 하한을 표현한다.
      Big-theta $\Theta$: 점근적 상하한, $f(n)$의 상한과 하한을 동시에 표현한다.
      점근 표기는 $n_0$ 이상의 모든 입력 크기에서 관계가 성립해야 한다.

  - id: b03-11
    type: multiple-choice
    passageRefs: [gb03-omega-def-01]
    prompt: 다음과 같은 정의에 해당하는 점근성능의 표기법은?
    choices:
      - { id: '1', text: '$f(n) = \Theta(g(n))$' }
      - { id: '2', text: '$f(n) = \Omega(g(n))$' }
      - { id: '3', text: '$f(n) = O(g(n))$' }
      - { id: '4', text: '$f(n) = \Phi(g(n))$' }
    answers: ['2']
    explanation: |
      선택지 1: $\Theta$는 $c_1 \cdot g(n) \le f(n) \le c_2 \cdot g(n)$처럼 상한과 하한을 동시에 표현하는 점근적 상하한이므로 정의와 맞지 않는다.
      선택지 2: 모든 $n \ge n_0$에서 $f(n) \ge c \cdot g(n)$이라는 것은 $c \cdot g(n)$이 $f(n)$의 하한이라는 뜻이므로 점근적 하한 $\Omega$이며 정답이다.
      선택지 3: $O$는 $f(n) \le c \cdot g(n)$인 점근적 상한이므로 부등호 방향이 반대이다.
      선택지 4: $\Phi$는 교재에서 다루는 점근성능 표기법이 아니다.

      핵심 개념:
      $f(n) = O(g(n))$: 모든 $n \ge n_0$에 대해 $f(n) \le c \cdot g(n)$(점근적 상한).
      $f(n) = \Omega(g(n))$: 모든 $n \ge n_0$에 대해 $f(n) \ge c \cdot g(n)$(점근적 하한).
      $f(n) = \Theta(g(n))$: 모든 $n \ge n_0$에 대해 $c_1 \cdot g(n) \le f(n) \le c_2 \cdot g(n)$(점근적 상하한).
      부등호의 방향으로 상한과 하한을 구분한다.

  - id: b03-12
    type: multiple-choice
    prompt: 일반적으로 ‘알고리즘의 수행 시간이 $O(n^2)$이다’라는 표현의 의미로 올바른 것은?
    choices:
      - { id: '1', text: '최악의 수행 시간이 $O(n^2)$이다.' }
      - { id: '2', text: '최선의 수행 시간이 $O(n^2)$이다.' }
      - { id: '3', text: '평균 수행 시간이 $O(n^2)$이다.' }
      - { id: '4', text: '최악 및 최선 수행 시간이 모두 $O(n^2)$이다.' }
    answers: ['1']
    explanation: |
      선택지 1: 빅오 $O$는 점근적 상한, 즉 알고리즘의 최악의 수행 시간을 나타내므로 정답이다.
      선택지 2: 최선의 수행 시간은 입력이 가장 유리한 경우의 시간으로, 상한인 $O$ 표기가 일반적으로 뜻하는 바가 아니다.
      선택지 3: 평균 수행 시간은 가능한 입력 전반의 기대 시간으로, 일반적인 $O$ 표현의 의미가 아니다.
      선택지 4: 일반적으로 '수행 시간이 $O(n^2)$이다'라는 표현은 최악의 수행 시간을 가리키는 것이며, 최선 수행 시간까지 함께 말하는 표현이 아니다(예: 삽입 정렬은 최악 $O(n^2)$이지만 최선은 $O(n)$으로 따로 말한다).

      핵심 개념:
      빅오 $O$는 점근적 상한으로, 알고리즘의 최악의 수행 시간을 나타낸다.
      시간 복잡도는 입력 데이터의 상태에 영향을 받으므로 최악의 수행 시간을 척도로 쓴다.
      예를 들어 삽입 정렬은 최악 $O(n^2)$, 최선 $O(n)$이다.
      "수행 시간이 $O(n^2)$"는 어떤 입력이든 $n^2$에 비례하는 시간을 넘지 않는다는 의미이다.

  - id: b03-13
    type: multiple-choice
    prompt: 빅오 함수 중에서 가장 효율적인 성능을 나타내는 것은?
    choices:
      - { id: '1', text: '$O(\log n)$' }
      - { id: '2', text: '$O(n)$' }
      - { id: '3', text: '$O(n \log n)$' }
      - { id: '4', text: '$O(n^2)$' }
    answers: ['1']
    explanation: |
      선택지 1: $O(\log n)$은 보기 중 연산시간이 가장 느리게 증가하므로 가장 효율적이며 정답이다.
      선택지 2: $O(n)$은 입력 크기에 비례하여 증가하므로 $O(\log n)$보다 비효율적이다.
      선택지 3: $O(n \log n)$은 $O(n)$보다 빠르게 증가하므로 더 비효율적이다.
      선택지 4: $O(n^2)$은 보기 중 가장 빠르게 증가하므로 가장 비효율적이다.

      핵심 개념:
      주요 빅오 함수의 크기 관계: $O(1) < O(\log n) < O(n) < O(n \log n) < O(n^2) < O(n^3) < O(2^n)$.
      연산시간이 크다는 것은 알고리즘 수행에 더 많은 시간이 필요하다는 뜻이다.
      크기 관계에서 오른쪽에 위치할수록 비효율적인 함수이다.
      이진 탐색 $O(\log n)$, 순차 탐색 $O(n)$, 합병 정렬 $O(n \log n)$, 버블 정렬 $O(n^2)$이 대표 예이다.

  - id: b03-14
    type: multiple-choice
    prompt: 입력 크기 $n$에 대해서 $O(n^2)$보다 적은 횟수의 데이터 간의 비교를 통해서 정렬을 수행하는 알고리즘은?
    choices:
      - { id: '1', text: '버블 정렬' }
      - { id: '2', text: '합병 정렬' }
      - { id: '3', text: '삽입 정렬' }
      - { id: '4', text: '선택 정렬' }
    answers: ['2']
    explanation: |
      선택지 1: 버블 정렬은 인접한 두 값을 차례로 비교·교환하며, $n$개의 데이터에 $O(n^2)$의 비교가 필요하다.
      선택지 2: 합병 정렬은 분할정복 방법으로 $O(n \log n)$의 비교만 수행하므로 $O(n^2)$보다 적어 정답이다.
      선택지 3: 삽입 정렬은 데이터를 하나씩 정렬된 부분의 제자리에 삽입하며, 최악의 경우 $O(n^2)$의 비교가 필요하다.
      선택지 4: 선택 정렬은 미정렬 부분에서 최솟값을 고르는 과정을 반복하며, 언제나 $O(n^2)$의 비교가 필요하다.

      핵심 개념:
      비교 기반 정렬은 데이터의 키값을 직접 비교해서 정렬한다.
      선택 정렬, 버블 정렬, 삽입 정렬은 $O(n^2)$의 비교가 필요하다.
      향상된 성능의 합병 정렬과 퀵 정렬은 $O(n \log n)$의 비교를 수행한다(퀵 정렬은 최악 $O(n^2)$).
      합병 정렬은 최선·최악·평균 모두 $O(n \log n)$이다.

  - id: b03-16
    type: multiple-choice
    prompt: 미정렬 데이터 중에서 최소값을 선택하고, 이를 미정렬 부분의 첫 번째 데이터와 교환하기 때문에 데이터의 입력 순서에 무관하게 언제나 동일한 시간 복잡도를 갖는 정렬 알고리즘은?
    choices:
