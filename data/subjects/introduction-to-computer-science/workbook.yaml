  - id: gb03-omega-def-01
    type: text
    body: |
      함수 $f$와 $g$를 각각 양의 정수를 갖는 함수라고 할 때, 어떤 양의 상수 $c$와 $n_0$이 존재하여 모든 $n \ge n_0$에 대하여 $f(n) \ge c \cdot g(n)$이다.
