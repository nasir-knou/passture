      핵심 개념:
      RR은 대화형 시스템에 사용되는 스케줄링 기법이다.
      시간 할당량을 매 프로세스에 주고, 그 시간 안에 끝나지 않으면 준비 큐의 맨 뒤에 배치한 뒤 다음 프로세스에 CPU를 할당한다.
      한 프로세스가 CPU를 독점하지 않고 공평하게 이용할 수 있다는 장점이 있다.
      우선순위가 높은 작업을 빨리 처리하기 어렵다는 단점이 있다.

  - id: b04-08
    type: multiple-choice
    prompt: 다중 프로그래밍 시스템에서 프로세스가 아무리 기다려도 결코 발생하지 않을 사건을 기다리고 있는 상황으로 제한된 자원에 대한 공유와 병행 처리로 인해 발생하는 문제는 무엇인가?
    choices:
      - { id: '1', text: '임계영역' }
      - { id: '2', text: '동기화' }
      - { id: '3', text: '교착상태' }
      - { id: '4', text: '상호배제' }
    answers: ['3']
    explanation: |
      선택지 1: 임계영역(critical section)은 공유 데이터에 접근하는 프로그램 코드 부분을 가리키며, 문제 상황 자체가 아니다.
      선택지 2: 동기화(synchronization)는 병행 프로세스들이 공유 자원을 올바른 순서로 사용하도록 실행 순서를 맞추는 제어 방법으로, 발생하는 문제가 아니라 문제를 해결하는 수단이다.
      선택지 3: 교착상태(deadlock)는 2개 이상의 프로세스가 제한된 자원을 동시에 공유하면서 서로 대기 상태가 되어, 대기 중인 프로세스들 중 하나에 의해서만 발생할 수 있는 사건을 무작정 기다리는 상태이므로 정답이다.
      선택지 4: 상호배제(mutual exclusion)는 한 프로세스가 공유 데이터를 사용하는 동안 다른 프로세스의 접근을 금지하는 제어 기법으로, 문제를 해결하는 방법이다.

      핵심 개념:
      교착상태는 제한된 자원의 공유와 병행 처리로 인해 발생한다.
      교착상태에 빠진 프로세스는 결코 일어나지 않을 사건을 기다린다.
      상호배제 조건, 대기 조건, 비선점 조건, 원형 대기 조건이 동시에 만족될 때 발생한다.
      임계영역, 상호배제, 동기화는 병행 프로세스의 공유 자원 접근을 다루는 개념이다.

  - id: b04-09
    type: multiple-choice
    prompt: 병행 프로세스의 비동기성으로 인해 발생하는 문제들을 해결하기 위한 방법으로, 하나의 프로세스가 공유 데이터의 사용을 완료할 때까지 다른 프로세스의 공유 데이터 접근을 금지하는 제어 기법은 무엇인가?
    choices:
      - { id: '1', text: '동기화' }
      - { id: '2', text: '임계영역' }
      - { id: '3', text: '교착상태' }
      - { id: '4', text: '상호배제' }
    answers: ['4']
    explanation: |
      선택지 1: 동기화(synchronization)는 병행 프로세스들의 실행 순서를 맞춰 협력하게 하는 방법으로, 한 프로세스가 사용하는 동안 다른 프로세스의 접근을 금지하는 것 자체를 가리키는 이름이 아니다.
      선택지 2: 임계영역(critical section)은 공유 데이터에 접근하는 코드 부분으로, 접근을 금지하는 제어 기법이 아니라 보호 대상이다.
      선택지 3: 교착상태(deadlock)는 프로세스들이 서로 결코 발생하지 않을 사건을 기다리는 문제 상황으로, 해결 방법이 아니다.
      선택지 4: 상호배제(mutual exclusion)는 한 프로세스가 컴퓨터 자원을 사용 중이면 다른 프로세스는 해제될 때까지 반드시 기다리게 하는 기법이므로 정답이다.

      핵심 개념:
      병행 프로세스는 비동기적으로 실행되므로 공유 데이터에 동시에 접근하면 문제가 생긴다.
      상호배제는 한 번에 하나의 프로세스만 공유 데이터를 사용하도록 보장한다.
      공유 데이터에 접근하는 코드 구간을 임계영역이라 한다.
      상호배제 조건은 교착상태 발생의 네 가지 조건 중 하나이기도 하다.

  - id: b04-10
    type: multiple-choice
    prompt: 교착상태가 발생하는 네 가지 조건에 해당하지 ==않는== 것은?
    choices:
      - { id: '1', text: '대기 조건' }
      - { id: '2', text: '선점 조건' }
      - { id: '3', text: '원형 대기 조건' }
      - { id: '4', text: '상호배제 조건' }
    answers: ['2']
    explanation: |
      선택지 1: 대기 조건은 프로세스가 하나 이상의 자원을 할당받아 점유하고 있으면서 다른 프로세스가 할당받은 자원을 요청하고 해제되기를 기다린다는 것으로, 교착상태 발생 조건에 해당한다.
      선택지 2: 선점 조건은 교착상태 발생 조건이 아니므로 정답이다. 발생 조건은 비선점 조건으로, 할당된 자원이 작업 종료 후 자발적으로만 해제되고 타의에 의해서는 해제되지 않는다는 것이다.
      선택지 3: 원형 대기 조건은 프로세스의 원형 사슬이 존재해 각 프로세스가 사슬 내 다음 프로세스가 요구하는 자원을 하나 이상 가지고 있다는 것으로, 교착상태 발생 조건에 해당한다.
      선택지 4: 상호배제 조건은 한 프로세스가 자원을 사용 중이면 다른 프로세스는 해제될 때까지 반드시 기다려야 한다는 것으로, 교착상태 발생 조건에 해당한다.

      핵심 개념:
      교착상태는 상호배제, 대기, 비선점, 원형 대기의 네 가지 조건이 동시에 만족할 때만 발생한다.
      대기 조건은 자원을 점유한 채 다른 자원을 기다리는 것이다.
      비선점 조건은 할당된 자원을 강제로 빼앗을 수 없다는 것이다.
      원형 대기 조건은 프로세스들이 사슬 모양으로 서로의 자원을 기다리는 것이다.

  - id: b04-11
    type: multiple-choice
    prompt: 한쪽 방향에서 가장 짧은 탐색거리의 디스크 접근 요청을 먼저 서비스하는 방식은 무엇인가 ?
    choices:
      - { id: '1', text: 'FCFS 스케줄링 기법' }
      - { id: '2', text: 'SCAN 스케줄링 기법' }
      - { id: '3', text: 'SLTF 스케줄링 기법' }
      - { id: '4', text: 'SSTF 스케줄링 기법' }
    answers: ['2']
    explanation: |
      선택지 1: FCFS(First-Come First-Served) 스케줄링 기법은 먼저 도착한 디스크 접근 요청을 먼저 서비스하는 방식으로, 탐색거리를 고려하지 않는다.
      선택지 2: SCAN 스케줄링 기법은 한쪽 방향에서 가장 짧은 탐색거리의 요청을 먼저 서비스하고, 마지막 실린더를 만나거나 요구가 없으면 방향을 바꾸어 서비스를 계속하므로 정답이다.
      선택지 3: SLTF(Shortest Latency Time First) 스케줄링 기법은 헤드가 도착한 실린더 내에서 회전지연이 가장 짧은 요구부터 서비스하는 방식으로, 탐색거리가 아니라 회전지연시간을 최적화한다.
      선택지 4: SSTF(Shortest Seek Time First) 스케줄링 기법은 현재 헤드 위치에서 가장 짧은 탐색거리의 요청을 먼저 처리하지만, 방향을 한쪽으로 정하지 않고 양쪽 중 가까운 요청을 고른다.

      핵심 개념:
      FCFS는 부하가 적을 때 좋지만 부하가 커지면 응답시간이 길어진다.
      SSTF는 평균 응답시간이 짧지만 안쪽·바깥쪽 트랙이 서비스를 받지 못할 수 있어 대화식 시스템에는 쓰지 않는다.
      SCAN은 SSTF의 불공평성 문제를 극복하려고 제안된 방법으로, 한 방향으로 진행하며 가장 짧은 탐색거리의 요청을 처리한다.
      SLTF는 탐색시간이 아니라 회전지연시간을 최적화하는 기법이다.

  - id: b05-01
    type: multiple-choice
    prompt: 다음 중 시스템 버스에 포함되지 ==않는== 것은?
    choices:
      - { id: '1', text: '상태 버스' }
      - { id: '2', text: '데이터 버스' }
      - { id: '3', text: '주소 버스' }
      - { id: '4', text: '제어 버스' }
    answers: ['1']
    explanation: |
      선택지 1: 시스템 버스의 종류는 주소 버스, 데이터 버스, 제어 버스의 세 가지이며 상태 버스라는 구분은 없다. 따라서 시스템 버스에 포함되지 않는 것으로 정답이다.
      선택지 2: 데이터 버스는 CPU(Central Processing Unit, 중앙처리장치)와 기억장치·입출력장치 사이에서 실제 데이터를 주고받는 통로로 시스템 버스에 포함된다.
      선택지 3: 주소 버스는 CPU가 접근할 기억장치나 입출력장치의 위치(주소)를 전달하는 통로로 시스템 버스에 포함된다.
      선택지 4: 제어 버스는 읽기·쓰기 등 장치의 동작을 지시하는 제어 신호를 전달하는 통로로 시스템 버스에 포함된다.

      핵심 개념:
      시스템 버스는 CPU와 다른 장치 간의 물리적 연결 및 데이터를 교환하는 통로이다.
      전달하는 정보에 따라 주소 버스, 데이터 버스, 제어 버스로 구분한다.
      주소 버스는 위치, 데이터 버스는 내용, 제어 버스는 동작 신호를 전달한다.
      컴퓨터 하드웨어는 중앙처리장치, 기억장치, 입력장치, 출력장치와 이들을 잇는 시스템 버스로 구성된다.

  - id: b05-02
    type: multiple-choice
    prompt: 중앙처리장치(CPU)의 구성요소가 ==아닌== 것은?
    choices:
      - { id: '1', text: 'ALU' }
      - { id: '2', text: '시스템 클록' }
      - { id: '3', text: 'CU' }
      - { id: '4', text: '레지스터' }
    answers: ['2']
    explanation: |
      선택지 1: ALU(Arithmetic and Logic Unit, 산술논리연산장치)는 데이터에 대한 산술 연산과 논리 연산을 수행해 직접적인 데이터 처리가 이루어지는 장치로 CPU의 구성요소이다.
      선택지 2: 시스템 클록은 컴퓨터의 하드웨어적 요소들의 동작을 일정한 클록 신호에 따라 동기화하기 위한 것으로, CPU를 구성하는 제어장치·산술논리연산장치·레지스터에 속하지 않으므로 정답이다.
      선택지 3: CU(Control Unit, 제어장치)는 기억장치, 산술논리연산장치, 입출력장치의 동작을 제어하는 장치로 CPU의 구성요소이다.
      선택지 4: 레지스터는 연산 수행에 필요한 데이터와 연산 결과를 임시로 저장하는 기억장치로 CPU의 구성요소이다.

      핵심 개념:
      중앙처리장치는 제어장치, 산술논리연산장치, 레지스터로 구성된다.
      제어장치는 각 장치의 동작을 제어하고, 산술논리연산장치는 실제 연산을 수행한다.
      레지스터는 연산에 필요한 데이터와 결과를 임시로 저장한다.
      산술논리연산장치와 레지스터를 합쳐서 '처리장치'라고 부른다.

  - id: b05-03
    type: multiple-choice
    passageRefs: [gb05-nor-truth-table-01]
    prompt: 다음과 같은 진리표에 해당하는 논리 게이트 기호는? (단, X와 Y는 입력, F는 출력이다.)
    choices:
      - id: '1'
        text: ''
        image:
          path: images/subjects/introduction-to-computer-science/workbook/b05-03-choice-1.png
          alt: '선택지 1 논리 게이트 기호: AND 몸체 출력에 부정 원이 붙은 기호'
      - id: '2'
        text: ''
        image:
          path: images/subjects/introduction-to-computer-science/workbook/b05-03-choice-2.png
          alt: '선택지 2 논리 게이트 기호: OR 몸체 입력 쪽에 곡선이 하나 더 있는 기호'
      - id: '3'
        text: ''
        image:
          path: images/subjects/introduction-to-computer-science/workbook/b05-03-choice-3.png
          alt: '선택지 3 논리 게이트 기호: OR 몸체 출력에 부정 원이 붙은 기호'
      - id: '4'
        text: ''
        image:
          path: images/subjects/introduction-to-computer-science/workbook/b05-03-choice-4.png
          alt: '선택지 4 논리 게이트 기호: OR 몸체 기호'
    answers: ['3']
    explanation: |
      선택지 1: AND 몸체에 부정 원이 붙은 NAND 게이트 기호이다. NAND는 두 입력이 모두 1일 때만 0을 출력하므로 (0, 1), (1, 0) 입력에서 1을 출력해 진리표와 맞지 않는다.
      선택지 2: OR 몸체 입력 쪽에 곡선이 한 줄 더 있는 XOR(exclusive OR, 배타적 논리합) 게이트 기호이다. XOR은 (0, 0) 입력에서 0을 출력하므로 진리표와 맞지 않는다.
      선택지 3: OR 몸체에 부정 원이 붙은 NOR 게이트 기호이다. 진리표는 두 입력이 모두 0일 때만 1이고 나머지는 0이므로 OR 연산의 출력에 NOT 연산을 적용한 NOR 연산 $F = (X + Y)'$에 해당해 정답이다.
      선택지 4: 부정 원이 없는 OR 게이트 기호이다. OR은 입력 중 하나 이상이 1이면 1을 출력하므로 진리표와 정반대의 결과를 낸다.

      핵심 개념:
      기본 논리연산은 논리합(OR), 논리곱(AND), 논리부정(NOT)이며, 이들의 조합으로 임의의 논리 수식을 만들 수 있다.
      NOR은 OR의 출력을 부정한 것으로, 모든 입력이 0일 때만 1을 출력한다.
      NAND는 AND의 출력을 부정한 것으로, 모든 입력이 1일 때만 0을 출력한다.
      게이트 기호 끝의 작은 원은 출력을 부정한다는 뜻이다.

  - id: b05-04
    type: multiple-choice
    prompt: 다음 회로에 대해서 출력(F)이 0이 되는 입력은?
    images:
