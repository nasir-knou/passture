      정규화된 가수는 소수점 왼쪽의 1을 생략하고 소수점 이하만 저장한다.
      지수값에 매직넘버를 더해 지수 부분을 표현한다.
      저장된 가수를 사용할 때는 맨 왼쪽에 '1.'을 붙여 해석한다.

  - id: b01-21
    type: multiple-choice
    prompt: 주어진 컴퓨터 시스템은 부동소수점을 표현하기 위해 16비트를 사용하며, 이 중에서 지수 부분은 5비트를 할당하여 초과_15로 표현하고 나머지 비트는 부호와 가수를 표현한다. 이와 같은 시스템에서 부동소수점으로 표현된 0 10010 1011110000은 10진수로 얼마인가?
    choices:
      - { id: '1', text: '2.9375' }
      - { id: '2', text: '11.75' }
      - { id: '3', text: '13.875' }
      - { id: '4', text: '23.5' }
    answers: ['3']
    explanation: |
      선택지 1: 2.9375 = $10.1111_{(2)}$로, 주어진 패턴을 해석한 값 $1.1011110000\times2^3$과 다르다.
      선택지 2: 11.75 = $1011.11_{(2)}$로, 주어진 패턴을 해석한 값 $1101.111_{(2)}$와 다르다.
      선택지 3: 부호 0이므로 양수, 지수 10010 = 18에서 매직넘버 15를 빼면 3, 가수 앞에 1.을 붙이면 $1.1011110000\times2^3 = 1101.1110000_{(2)} = 13.875$이므로 정답이다.
      선택지 4: 23.5 = $10111.1_{(2)}$로, 주어진 패턴을 해석한 값 $1101.111_{(2)}$와 다르다.

      핵심 개념:
      부동소수점 비트 패턴은 부호, 지수, 가수 순으로 나눠 해석한다.
      부호 비트 0은 양수, 1은 음수이다.
      지수는 저장값에서 매직넘버를 빼서 구한다.
      가수 앞에 '1.'을 붙인 뒤 지수만큼 소수점을 옮겨 10진수로 변환한다.

  - id: b01-22
    type: multiple-choice
    passageRefs: [gb01-unicode-desc-01]
    prompt: 다음 설명에 해당하는 문자 코드 체계는 무엇인가?
    choices:
      - { id: '1', text: 'ASCII' }
      - { id: '2', text: 'EBCDIC' }
      - { id: '3', text: '유니코드' }
      - { id: '4', text: '확장된 ASCII' }
    answers: ['3']
    explanation: |
      선택지 1: ASCII(American Standard Code for Information Interchange)는 미국표준협회에서 개발한 7비트 코드로 128개($2^7$) 문자만 표현하므로 전 세계 문자를 표현하지 못한다.
      선택지 2: EBCDIC(Extended Binary Coded Decimal Interchange Code)은 IBM이 초기에 개발한 8비트 코드로 256개를 표현할 수 있으나 실제 사용 문자는 128개이며, IBM 메인프레임 외에는 쓰이지 않는다.
      선택지 3: 기존 코드의 한계를 극복하고 전 세계 문자를 표현하며, 플랫폼·프로그램·언어에 무관하고, 1990년 첫 버전 발표 후 1995년 국제 표준이 된 것은 유니코드이므로 정답이다.
      선택지 4: 확장된 ASCII는 ASCII를 1바이트에 맞추려고 왼쪽에 1비트를 추가한 형태로, 추가 비트는 0으로 채우거나 패리티(parity) 비트로 쓴다. 전 세계 문자를 표현하지 못한다.

      핵심 개념:
      ASCII는 7비트, 128개 문자를 표현한다.
      확장된 ASCII는 8비트로 맞춘 것이며 추가 비트는 0 또는 패리티 비트이다.
      EBCDIC은 IBM의 8비트 코드이다.
      유니코드는 전 세계 문자를 표현하는 국제 표준 코드 체계이다.

  - id: b01-23
    type: multiple-choice
    prompt: 컴퓨터의 문자 코드 체계 중에서 가장 많은 문자를 나타낼 수 있는 것은?
    choices:
      - { id: '1', text: 'EBCDIC' }
      - { id: '2', text: 'ASCII' }
      - { id: '3', text: '유니코드' }
      - { id: '4', text: '확장 ASCII' }
    answers: ['3']
    explanation: |
      선택지 1: EBCDIC(Extended Binary Coded Decimal Interchange Code)은 8비트 코드로 최대 256개이며 실제 사용 문자는 128개이다.
      선택지 2: ASCII(American Standard Code for Information Interchange)는 7비트로 128개 문자를 표현한다.
      선택지 3: 유니코드는 전 세계의 문자를 표현하기 위한 코드 체계로 보기 중 가장 많은 문자를 나타낼 수 있으므로 정답이다.
      선택지 4: 확장 ASCII는 ASCII에 1비트를 추가해 8비트로 맞춘 것이며, 추가 비트를 0이나 패리티 비트로 쓰므로 표현 문자 수가 크게 늘지 않는다.

      핵심 개념:
      문자 코드 체계는 표현 가능한 문자 수가 다르다.
      ASCII는 7비트, 128개 문자이다.
      확장 ASCII와 EBCDIC은 8비트 코드이다.
      유니코드는 전 세계 문자를 표현하므로 가장 많은 문자를 나타낸다.

  - id: b02-01
    type: multiple-choice
    prompt: 추상화를 통해 자료의 논리적 관계를 구조화한 것을 무엇이라고 하는가?
    choices:
      - { id: '1', text: 자료구조 }
      - { id: '2', text: 계층구조 }
      - { id: '3', text: 알고리즘 }
      - { id: '4', text: 프로세스 }
    answers: ['1']
    explanation: |
      선택지 1: 자료의 구조화된 형태를 표현하려면 자료의 추상화가 필요하며, 추상화를 통해 자료의 논리적 관계를 구조화한 것이 자료구조(data structures)이다.
      선택지 2: 계층구조는 상위·하위 관계로 요소를 배치하는 구조 형태의 한 종류일 뿐, 추상화로 자료의 논리적 관계를 구조화한 것 전체를 가리키는 용어가 아니다.
      선택지 3: 알고리즘은 일렬화된 추상화된 명령어들, 즉 문제를 해결하는 명령의 순서이므로 자료의 관계를 구조화한 것과 다르다.
      선택지 4: 프로세스는 실행 중인 프로그램을 뜻하는 운영체제 용어로, 자료의 논리적 관계와 무관하다.

      핵심 개념:
      추상화는 공통적인 개념을 이용하여 같은 종류의 다양한 객체를 정의하는 것이다.
      데이터의 추상화는 객체를 컴퓨터에서 표현·활용하기 위해 데이터 구조의 공통 특징만 뽑아 정의한 것이다.
      자료구조는 추상화를 통해 자료의 논리적 관계를 구조화한 것이다.
      자료의 추상화와 구조화가 적절하지 못하면 소프트웨어가 비효율적으로 수행되거나 확장성에 문제가 생긴다.

  - id: b02-02
    type: multiple-choice
    prompt: 배열에 대한 설명으로 올바른 것은?
    choices:
      - {
          id: '1',
          text: 삽입과 삭제 연산 수행 시 추가적인 연산으로 인해 오버헤드가 발생하는 정적 구조를 갖는다.,
        }
      - {
          id: '2',
          text: 2개 이상의 서로 다른 구조를 가진 데이터 항목을 하나의 변수 이름으로 묶고 인덱스를 사용해서 구분하는 자료구조이다.,
        }
      - { id: '3', text: 배열의 기억공간은 포트란과 코볼에서처럼 항상 동적으로 할당이 이루어진다. }
      - {
          id: '4',
          text: 배열에서 각 원소에 대한 접근 시간은 원소가 어느 위치에 저장되어 있느냐에 따라 차이가 발생한다.,
        }
    answers: ['1']
    explanation: |
      선택지 1: 배열은 크기가 선언 시 정해지는 정적 구조이므로, 중간에 원소를 삽입·삭제하면 뒤 원소들을 옮기는 추가 연산이 필요해 오버헤드가 발생한다.
      선택지 2: 서로 다른 구조를 가진 데이터 항목을 하나의 이름으로 묶는 것은 레코드 자료구조이다. 배열은 동일한 자료형의 데이터를 모은 집합체이다.
      선택지 3: 배열의 기억공간은 선언문을 통해 정의되어 정적으로 할당된다. 항상 동적으로 할당된다는 설명은 틀리다.
      선택지 4: 배열 원소는 인덱스로 직접 접근하므로 모든 원소의 접근 시간이 동일하다. 위치에 따라 접근 시간이 달라지는 대표적인 자료구조는 리스트이다.

      핵심 개념:
      배열(array)은 동일한 자료형의 여러 데이터를 동일한 변수 이름의 방에 일렬로 저장하는 자료의 집합체이다.
      원소는 배열의 각 자료 항목이고, 인덱스(첨자)는 원소가 저장된 방 번호에 해당한다.
      배열은 선언 시 기억공간이 정적으로 할당되고, 인덱스로 모든 원소에 같은 시간에 접근한다.
      삽입·삭제 시에는 원소 이동이 필요해 오버헤드가 생긴다.

  - id: b02-03
    type: multiple-choice
    passageRefs: [gb02-sparse-matrix-01]
    prompt: 다음 행렬 A를 ‘희소행렬 표현 행렬 B’로 구현할 경우에 B[1,0]의 값은 무엇인가?
    choices:
      - { id: '1', text: '0' }
      - { id: '2', text: '1' }
      - { id: '3', text: '2' }
      - { id: '4', text: '3' }
    answers: ['1']
    explanation: |
      선택지 1: 희소행렬 표현 B의 첫 번째 행 B[0]은 (8, 9, 10)으로 A의 행 크기·열 크기·0이 아닌 원소 개수이다. 두 번째 행 B[1]부터 0이 아닌 원소를 행 우선으로 (행번호, 열번호, 원소값) 형태로 저장하므로 B[1]은 첫 원소 20의 (0, 1, 20)이고, B[1,0]은 행번호 0이다.
      선택지 2: 1은 B[1]의 열번호인 B[1,1]의 값이다. B[1,0]은 행번호이므로 1이 아니다.
      선택지 3: 2는 원소 78의 행번호로 B[4,0]의 값이다. B[1]에는 첫 번째 0이 아닌 원소가 들어가므로 해당하지 않는다.
      선택지 4: 3은 원소 67의 행번호로 B[5,0]의 값이다. B[1,0]과는 다른 위치이다.

      핵심 개념:
      희소행렬(sparse matrix)은 원소값이 0인 원소가 그렇지 않은 원소보다 상대적으로 많은 행렬이다.
      0을 저장하는 메모리 낭비를 막기 위해 0이 아닌 원소만 (행번호, 열번호, 원소값)으로 모아 저장한다.
      표현 행렬의 첫 번째 행은 원래 행렬의 행 크기, 열 크기, 0이 아닌 원소의 개수를 나타낸다.
      두 번째 행부터 0이 아닌 원소의 행 좌표값, 열 좌표값, 원소값을 차례로 나타낸다.

  - id: b02-04
    type: multiple-choice
    passageRefs: [gb02-stack-ops-01]
    prompt: 다음 스택 연산을 완료한 후, 스택에 남아 있는 모든 값을 더하면 얼마인가?
    choices:
      - { id: '1', text: '10' }
      - { id: '2', text: '12' }
      - { id: '3', text: '13' }
      - { id: '4', text: '17' }
    answers: ['4']
    explanation: |
      선택지 1: 10은 마지막 push(S, 7)을 빼고 계산한 값이다. 마지막에 7이 삽입되므로 답이 아니다.
      선택지 2: 12는 첫 pop(S)으로 제거된 2를 남아 있다고 본 값(10+2)이다. 2는 pop 함수로 제거되었다.
      선택지 3: 13은 if문의 pop(S)으로 제거된 3을 남아 있다고 본 값(10+3)이다. 스택이 비어 있지 않으므로 pop이 수행되어 3은 삭제된다.
      선택지 4: push로 10, 2가 삽입되고 pop으로 2가 제거된다. 다시 3이 삽입되고, 스택이 빈 상태가 아니므로 pop으로 3이 삭제된다. 마지막으로 7이 삽입되어 스택에는 10과 7이 남으므로 합은 10+7=17이다.

      핵심 개념:
      스택(stack)은 데이터의 삽입과 삭제가 한쪽 끝(더미의 가장 위쪽)에서만 이루어지는 자료구조이다.
      push는 맨 위에 삽입하고, pop은 맨 위(가장 최근에 삽입된) 원소를 삭제하는 후입선출(LIFO, Last In First Out) 방식이다.
      연산을 순서대로 따라가며 스택 상태를 적어 보면 남은 원소를 정확히 구할 수 있다.
      조건 연산(if not empty)은 스택이 비었는지 먼저 확인한 뒤 수행한다.

  - id: b02-05
    type: multiple-choice
    prompt: 한쪽 끝에서 모든 삽입을 수행하고 다른 쪽 끝에서 모든 삭제를 수행하는 구조의 리스트 자료구조를 무엇이라 하는가?
    choices:
      - { id: '1', text: 큐 }
      - { id: '2', text: 스택 }
      - { id: '3', text: 이중 연결 리스트 }
      - { id: '4', text: 배열 }
    answers: ['1']
    explanation: |
      선택지 1: 기차표를 사려고 줄 선 사람들이 앞에서 표를 사서 빠지고 새로 온 사람은 줄 맨 끝에 서듯이, 한쪽 끝에서는 삭제만, 다른 한쪽 끝에서는 삽입만 이루어지는 자료구조가 큐(queue)이다.
      선택지 2: 스택은 쌓인 접시 더미처럼 삽입과 삭제가 같은 한쪽 끝에서만 이루어지므로 조건과 다르다.
      선택지 3: 이중 연결 리스트는 각 노드가 앞뒤 노드를 가리키는 포인터를 가져 임의 위치에서 삽입·삭제가 가능한 리스트로, 삽입과 삭제 위치가 양 끝으로 나뉘어 고정된 구조가 아니다.
      선택지 4: 배열은 똑같이 생긴 방을 연속해서 만들고 그 안에 같은 종류의 자료를 저장하는 구조로, 삽입·삭제 위치에 대한 제한 규칙이 없다.

      핵심 개념:
      큐는 리스트의 한쪽 끝에서는 데이터의 삭제만, 다른 한쪽 끝에서는 데이터의 삽입만 이루어지는 자료구조이다.
      먼저 들어온 데이터가 먼저 나가는 선입선출(FIFO, First In First Out) 방식이다.
      스택은 한쪽 끝에서만 삽입·삭제가 이루어지는 후입선출(LIFO) 방식이다.
      큐는 대기 줄, 스택은 쌓인 접시·책 더미로 비유된다.

  - id: b02-06
    type: multiple-choice
    prompt: 트리의 루트 노드에서 리프 노드에 이르는 가장 긴 경로를 무엇이라고 하는가?
    choices:
      - { id: '1', text: 가지 수 }
      - { id: '2', text: 차수 }
      - { id: '3', text: 레벨 }
      - { id: '4', text: 깊이 }
    answers: ['4']
    explanation: |
      선택지 1: 노드를 연결하는 것을 가지(branch, edge)라고 하며, 가지 수는 연결선의 개수일 뿐 루트에서 리프까지의 가장 긴 경로를 뜻하지 않는다.
      선택지 2: 차수(degree)는 각 노드에 있는 가지의 수이므로 경로의 길이와 다른 개념이다.
      선택지 3: 레벨은 루트 노드로부터 특정 노드까지의 거리(가지의 개수)로, 노드마다 다를 수 있는 개별 노드의 값이다.
      선택지 4: 레벨에서 가장 큰 값에 1을 더한 값, 즉 루트에서 리프에 이르는 가장 긴 경로에 해당하는 값을 트리의 깊이라고 한다.

      핵심 개념:
      트리는 노드와 노드를 연결하는 가지로 이루어진, 계층적 관계를 갖는 비선형 자료구조이다.
      차수는 노드에 있는 가지의 수, 레벨은 루트로부터의 거리이다.
      트리의 깊이(depth) 또는 높이(height)는 가장 긴 경로에 있는 단말 노드의 레벨에 1을 더한 값이다.
      루트 레벨이 0이면 최대 레벨이 k인 트리의 깊이는 k+1이다.

  - id: b02-07
    type: multiple-choice
    passageRefs: [gb02-tree-01]
    prompt: 주어진 트리에 대한 설명으로 올바르지 ==않은== 것은? (단, 루트 레벨은 0부터 시작한다.)
    choices:
      - { id: '1', text: 트리의 차수는 3이다. }
      - { id: '2', text: 비단말 노드의 수는 모두 7이다. }
      - { id: '3', text: '단말 노드는 C, J, K, L, M, N, I밖에 없다.' }
      - { id: '4', text: 트리의 깊이는 3이다. }
    answers: ['4']
    explanation: |
      선택지 1: 노드 A의 차수는 3, B는 2, C는 0, D는 3, G는 1이다. 트리의 차수는 모든 노드의 차수 중 가장 큰 값이므로 3이 맞다.
      선택지 2: 자식 노드를 가진 노드는 A, B, D, E, F, G, H로 모두 7개이므로 비단말 노드의 수는 7이 맞다.
      선택지 3: 단말 노드(terminal node, 잎 노드)는 차수가 0인 노드로 C, J, K, L, M, N, I의 7개이므로 맞다.
      선택지 4: 트리의 깊이는 가장 긴 경로에 있는 단말 노드의 레벨에 1을 더한 값이다. 이 트리는 레벨 0, 1, 2, 3의 노드를 가지므로 깊이는 4이다. 따라서 3이라는 설명이 틀리다.

      핵심 개념:
      차수(degree)는 노드에서 아래로 향하는 가지의 수이고, 트리의 차수는 노드 차수 중 최댓값이다.
      단말 노드(잎 노드)는 차수가 0인 노드이고, 자식을 가진 나머지 노드는 비단말 노드이다.
      레벨은 루트로부터의 거리(가지의 개수)이며 루트 레벨은 0이다.
      트리의 깊이(높이)는 최대 레벨에 1을 더한 값이다.

  - id: b02-08
    type: multiple-choice
    prompt: 트리의 최대 레벨이 $k$일 때, 레벨 $k-1$까지는 포화 이진트리를 형성하고, 레벨 $k$에서는 왼쪽부터 오른쪽으로 채워진 트리는 무엇인가?
    choices:
      - { id: '1', text: 불완전 트리 }
      - { id: '2', text: 완전 이진트리 }
      - { id: '3', text: 경사 이진트리 }
      - { id: '4', text: 불포화 이진트리 }
    answers: ['2']
    explanation: |
      선택지 1: 불완전 트리는 이진트리의 분류 용어가 아니며, 마지막 레벨을 왼쪽부터 채운다는 조건을 정의하지 않는다.
      선택지 2: 완전 이진트리(complete binary tree)는 최대 레벨이 $k$일 때 레벨 $k-1$까지 포화 이진트리를 이루고 레벨 $k$는 왼쪽부터 오른쪽으로 채워진 트리이다. 루트를 1번으로 레벨별 왼쪽에서 오른쪽으로 번호를 붙이면 포화 이진트리의 번호와 연속적으로 일치한다.
      선택지 3: 경사 이진트리는 모든 노드가 한쪽 방향 자식만 가져 한쪽으로 기울어진 트리이므로 각 레벨이 채워지는 조건과 맞지 않는다.
      선택지 4: 불포화 이진트리는 표준 분류 용어가 아니며, 마지막 레벨의 채움 순서를 규정하지 않는다.

      핵심 개념:
      포화 이진트리는 각 레벨에 빈 자리 없이 노드를 모두 가진 이진트리이다.
      완전 이진트리는 마지막 레벨 직전까지 포화 상태이고 마지막 레벨은 왼쪽부터 채운 이진트리이다.
      완전 이진트리의 노드 수는 $2^{k+1}-1$을 넘지 않으며 노드 번호가 연속적이다.
      경사 이진트리는 한쪽 방향으로만 자식이 이어진 트리이다.

  - id: b02-09
    type: multiple-choice
    passageRefs: [gb02-binary-tree-01]
    prompt: 다음의 이진트리를 전위 순회할 때, 노드 C는 몇 번째로 방문되는가?
    choices:
      - { id: '1', text: '5' }
      - { id: '2', text: '6' }
      - { id: '3', text: '7' }
      - { id: '4', text: '8' }
    answers: ['2']
    explanation: |
      선택지 1: 5번째로 방문되는 노드는 H이다. C는 A의 왼쪽 서브트리(B, D, E, H)를 모두 방문한 뒤에 방문되므로 5번째가 될 수 없다.
      선택지 2: 전위 순회 순서는 A, B, D, E, H, C, F, G, I, J이다. 루트 A 다음 왼쪽 서브트리 B, D, E, H를 모두 방문한 후 C를 방문하므로 C는 여섯 번째이다.
      선택지 3: 7번째로 방문되는 노드는 C의 왼쪽 자식 F이다.
      선택지 4: 8번째로 방문되는 노드는 G이다.

      핵심 개념:
      전위(preorder) 순회는 루트 → 왼쪽 서브트리 → 오른쪽 서브트리 순으로 방문한다.
      중위(inorder) 순회는 왼쪽 서브트리 → 루트 → 오른쪽 서브트리 순이다.
      후위(postorder) 순회는 왼쪽 서브트리 → 오른쪽 서브트리 → 루트 순이다.
      서브트리도 같은 규칙을 재귀적으로 적용하므로, 왼쪽 서브트리 전체를 방문한 뒤에 오른쪽 자식으로 넘어간다.

  - id: b02-10
    type: multiple-choice
    passageRefs: [gb02-binary-tree-02, gb02-traversal-box-01]
    prompt: 주어진 이진트리를 순회하였더니, 다음과 같은 순회 결과를 얻었다. 어떤 순회 방법을 사용하였는가?
    choices:
      - { id: '1', text: 너비 우선 순회 }
      - { id: '2', text: 중위 순회 }
      - { id: '3', text: 후위 순회 }
      - { id: '4', text: 전위 순회 }
    answers: ['3']
    explanation: |
      선택지 1: 너비 우선 순회는 레벨 순서로 방문하므로 루트 H를 가장 먼저 방문한다. G를 H보다 먼저 방문했다는 조건과 맞지 않는다.
      선택지 2: 중위 순회 결과는 B, E, G, H, J, K, M, N, P로, N을 P보다 먼저 방문하므로 P를 N보다 먼저 방문했다는 조건과 맞지 않는다.
      선택지 3: 후위 순회 결과는 B, G, E, J, M, K, P, N, H이다. G는 H보다 먼저, P는 N보다 먼저, J는 M보다 먼저 방문되어 세 조건을 모두 만족한다.
      선택지 4: 전위 순회는 루트 H를 가장 먼저 방문하므로 G를 H보다 먼저 방문했다는 조건과 맞지 않는다.

      핵심 개념:
      G는 H의 왼쪽 서브트리, P는 N의 오른쪽 자식, J는 M의 왼쪽 형제이다.
      루트(부모)보다 왼쪽·오른쪽 자식을 먼저 방문하고, 왼쪽을 오른쪽보다 먼저 방문하는 순회는 후위 순회이다.
      후위 순회는 왼쪽 노드 - 오른쪽 노드 - 루트 노드 순서로 방문한다.
      전위 순회와 너비 우선 순회는 루트를 가장 먼저 방문한다.

  - id: b02-11
    type: multiple-choice
    prompt: 이진트리에 대한 설명으로 올바른 것은?
    choices:
      - { id: '1', text: 각 노드의 차수 중에서 최소 차수가 2 이상이다. }
      - { id: '2', text: 포화 이진트리는 각 레벨에서 빈 자리가 없이 노드를 모두 가진다. }
      - { id: '3', text: 루트 레벨이 0이고 깊이가 2인 이진트리의 최대 노드의 수는 8개이다. }
      - {
          id: '4',
          text: 한 노드에 대한 서브트리의 순서는 대칭적인 관계를 갖기 때문에 중요하지 않다.,
        }
    answers: ['2']
    explanation: |
      선택지 1: 이진트리의 최대 차수가 2로, 각 노드는 2개까지의 자식 노드를 가질 수 있다. 최소 차수가 2 이상이라는 조건은 없으며 단말 노드의 차수는 0이다.
      선택지 2: 포화 이진트리는 각 레벨에서 빈 자리 없이 노드를 모두 가진 이진트리이므로 올바르다.
      선택지 3: 루트 레벨이 0일 때 깊이는 최대 레벨에 1을 더한 값이므로, 깊이가 2인 이진트리는 레벨 0과 1만 가진다. 최대 노드 수는 $2^2-1=3$개이므로 8개라는 설명은 틀리다.
      선택지 4: 이진트리에서 왼쪽 서브트리와 오른쪽 서브트리는 구별되므로 서브트리는 대칭적인 관계를 갖지 않고 순서가 중요하다.

      핵심 개념:
      이진트리는 모든 노드의 차수가 최대 2이고 최대 2개의 서브트리를 갖는 트리이다.
      왼쪽 서브트리와 오른쪽 서브트리는 순서가 있어 서로 구별된다.
      레벨 $i$(루트 0)에 올 수 있는 최대 노드 수는 $2^i$이다.
      포화 이진트리는 모든 레벨이 빈 자리 없이 채워진 이진트리이다.

  - id: b02-12
    type: multiple-choice
    prompt: 각 레벨에서 빈 자리가 없이 노드를 모두 가지고 있고, 모든 내부 노드는 2개의 자식 노드를 가지고 있는 트리는 무엇인가?
    choices:
      - { id: '1', text: 경사 이진트리 }
      - { id: '2', text: 탐색 이진트리 }
      - { id: '3', text: 완전 이진트리 }
      - { id: '4', text: 포화 이진트리 }
    answers: ['4']
    explanation: |
      선택지 1: 경사 이진트리는 모든 노드가 한쪽 방향 자식만 가진 트리이므로 내부 노드가 2개의 자식을 갖는다는 조건과 맞지 않는다.
      선택지 2: 탐색 이진트리는 왼쪽 서브트리의 키는 작고 오른쪽 서브트리의 키는 큰 값의 대소 규칙으로 정의되는 트리로, 모양(레벨이 가득 찼는지)과 무관하다.
      선택지 3: 완전 이진트리는 마지막 레벨이 왼쪽부터 채워지기만 하면 되므로 마지막 레벨에 빈 자리가 있을 수 있어 조건과 다르다.
      선택지 4: 포화 이진트리(full binary tree)는 각 레벨에서 빈 자리 없이 노드를 모두 가지고, 모든 내부 노드가 2개의 자식 노드를 갖는다.

      핵심 개념:
      포화 이진트리는 깊이가 $k$인 이진트리 중 노드의 개수가 $2^k-1$개인 이진트리이다.
      깊이가 $k$인 이진트리가 가질 수 있는 노드의 최대 개수가 $2^k-1$이며, 이때 단말 노드는 $2^{k-1}$개이다.
      완전 이진트리는 마지막 레벨만 왼쪽부터 채워져 있으면 되므로 포화 이진트리보다 조건이 약하다.
      모든 포화 이진트리는 완전 이진트리이지만 그 역은 성립하지 않는다.

  - id: b02-13
    type: multiple-choice
    prompt: 그래프 관련 용어에 대한 설명으로 ==틀린== 것은?
    choices:
      - {
          id: '1',
          text: 간선이 두 정점을 직접적으로 연결시키고 있을 때 두 정점을 인접한 정점이라고 한다.,
        }
      - { id: '2', text: 각 정점과 인접해 있는 정점들의 나열을 사이클이라고 한다. }
      - { id: '3', text: 두 정점 사이에 경로가 존재하는 경우를 연결되었다고 한다. }
      - {
          id: '4',
          text: 방향 그래프에서 적어도 두 정점이 어느 한 방향의 경로만 존재할 때 약하게 연결되었다고 한다.,
        }
    answers: ['2']
    explanation: |
      선택지 1: 간선으로 직접 연결된 두 정점을 인접한(adjacent) 정점이라고 하므로 옳은 설명이다.
      선택지 2: 인접한 정점들을 차례로 나열한 것은 경로(path)이다. 사이클(cycle)은 3개 이상의 정점을 가진 경로 중에서 시작 정점과 끝 정점이 같은 경로이므로 틀린 설명이다.
      선택지 3: 두 정점 사이에 경로가 존재하면 두 정점이 연결되었다(connected)고 하므로 옳은 설명이다.
      선택지 4: 방향 그래프에서 어떤 두 정점 사이에 한 방향의 경로만 존재하면 약하게 연결되었다고 하므로 옳은 설명이다.

      핵심 개념:
      인접: 간선이 두 정점을 직접 연결하는 관계이다.
      경로: 인접한 정점들을 간선을 따라 나열한 순서이다.
      사이클: 3개 이상의 정점을 가진 경로에서 시작 정점과 끝 정점이 같은 경로이다.
      연결: 두 정점 사이에 경로가 존재하는 것이며, 방향 그래프에서 한 방향 경로만 있으면 약하게 연결되었다고 한다.

  - id: b02-14
    type: multiple-choice
    prompt: 그래프 순회 방법 중에서 최근의 주변 정점을 먼저 방문하는 방식은 무엇인가?
    choices:
      - { id: '1', text: 피보나치 탐색 }
      - { id: '2', text: 깊이 우선 탐색 }
      - { id: '3', text: 이진 탐색 }
      - { id: '4', text: 너비 우선 탐색 }
    answers: ['2']
    explanation: |
      선택지 1: 피보나치 탐색은 정렬된 배열에서 피보나치 수열로 구간을 나누어 값을 찾는 탐색 기법으로, 그래프 순회 방법이 아니다.
      선택지 2: 깊이 우선 탐색(DFS, Depth First Search)은 가장 최근에 방문한 정점을 중심으로, 그 정점과 인접했지만 방문하지 않은 정점 중 하나를 다음 방문 정점으로 결정하므로 최근의 주변 정점을 먼저 방문한다.
      선택지 3: 이진 탐색은 정렬된 자료에서 중간값과 비교해 범위를 절반씩 줄이는 탐색 기법으로, 그래프 순회 방법이 아니다.
      선택지 4: 너비 우선 탐색은 한 정점에 인접한 정점들을 모두 차례로 방문한 뒤 다음 단계로 넘어가므로, 최근 방문 정점의 주변을 먼저 파고드는 방식이 아니다.

      핵심 개념:
      그래프 탐색은 그래프의 모든 정점을 체계적으로 방문하는 것이다.
      깊이 우선 탐색은 가장 최근에 방문한 정점의 방문하지 않은 인접 정점으로 계속 깊이 들어가고, 더 없으면 되돌아간다.
      너비 우선 탐색(BFS, Breadth First Search)은 한 정점의 인접 정점을 모두 차례로 방문한 후 다음 정점으로 넘어간다.
      피보나치 탐색과 이진 탐색은 배열 탐색 기법이다.

  - id: b02-15
    type: multiple-choice
    prompt: 그래프 순회 방법 중에서 인접했지만 방문하지 않은 모든 정점을 하나씩 차례로 방문하는 방식은 무엇인가?
    choices:
      - { id: '1', text: 피보나치 탐색 }
      - { id: '2', text: 깊이 우선 탐색 }
      - { id: '3', text: 이진 탐색 }
      - { id: '4', text: 너비 우선 탐색 }
    answers: ['4']
    explanation: |
      선택지 1: 피보나치 탐색은 정렬된 배열에서 피보나치 수열로 구간을 나누어 값을 찾는 기법으로, 그래프 순회 방법이 아니다.
      선택지 2: 깊이 우선 탐색은 인접한 미방문 정점 중 하나만 골라 계속 깊이 들어가므로, 인접한 모든 정점을 차례로 방문하는 방식이 아니다.
      선택지 3: 이진 탐색은 정렬된 자료에서 범위를 절반씩 줄이는 탐색 기법으로, 그래프 순회 방법이 아니다.
      선택지 4: 너비 우선 탐색(BFS, Breadth First Search)은 현재 정점과 인접했지만 방문하지 않은 정점들을 하나씩 모두 차례로 방문한 뒤, 방문한 정점들의 인접 정점으로 넘어간다.

      핵심 개념:
      너비 우선 탐색은 시작 정점에서 가까운 정점부터 레벨 순서처럼 넓게 방문한다.
      깊이 우선 탐색(DFS, Depth First Search)은 한 방향으로 끝까지 들어갔다가 되돌아오며 방문한다.
      너비 우선 탐색은 보통 큐, 깊이 우선 탐색은 스택(또는 재귀)으로 구현한다.
      두 방법 모두 그래프의 모든 정점을 체계적으로 방문하는 그래프 탐색 방법이다.

  - id: b02-16
    type: multiple-choice
    passageRefs: [gb02-dfs-graph-01]
    prompt: 다음과 같은 무방향 그래프를 깊이 우선 탐색을 수행할 때 방문한 노드를 순서대로 나열한 것은?
    choices:
      - { id: '1', text: '1 − 2 − 4 − 5 − 8 − 6 − 7 − 3' }
      - { id: '2', text: '1 − 2 − 4 − 8 − 5 − 6 − 3 − 7' }
      - { id: '3', text: '1 − 2 − 3 − 4 − 5 − 6 − 7 − 8' }
      - { id: '4', text: '1 − 2 − 4 − 8 − 5 − 6 − 7 − 3' }
    answers: ['2']
    explanation: |
      선택지 1: 정점 4를 방문한 뒤 4와 인접한 정점(2, 8) 중 방문하지 않은 정점은 8뿐이므로 다음은 8이어야 한다. 4 다음에 5를 방문하는 것은 깊이 우선 탐색이 아니다.
      선택지 2: 1에서 시작해 인접한 2를 방문하고, 2와 인접한 4, 4의 유일한 미방문 인접 정점 8, 8의 미방문 인접 정점 5, 6, 7 중 번호가 가장 작은 5를 방문한다. 5에는 방문하지 않은 인접 정점이 없어 8로 되돌아가 6을 방문하고, 6과 인접한 미방문 정점 3을 방문한다. 3과 인접한 정점 중 7이 아직 방문되지 않았으므로 7을 방문하여 1−2−4−8−5−6−3−7이다.
      선택지 3: 1−2−3−4−5−6−7−8은 가까운 정점부터 차례로 방문한 너비 우선 탐색의 순서이다.
      선택지 4: 6을 방문한 뒤에는 6과 인접한 미방문 정점 3으로 먼저 깊이 들어가야 하므로, 6 다음에 7을 방문하는 것은 깊이 우선 탐색 순서가 아니다.

      핵심 개념:
      깊이 우선 탐색은 현재 정점과 인접했지만 방문하지 않은 정점 중 하나를 골라 계속 진행한다.
      더 이상 방문할 인접 정점이 없으면 직전 정점으로 되돌아가(backtracking) 다른 미방문 정점을 찾는다.
      후보가 여러 개일 때는 번호가 작은 정점부터 선택하는 것이 일반적이다.
      모든 정점을 방문하면 탐색을 마친다.

  - id: b02-17
    type: multiple-choice
    passageRefs: [gb02-adjacency-01]
    prompt: 다음의 (가) 그래프를 (나)와 같이 표현하는 방법을 무엇이라고 하는가?
    choices:
      - { id: '1', text: 그래프리스트 }
      - { id: '2', text: 인접 리스트 }
      - { id: '3', text: 인접행렬 }
      - { id: '4', text: 그래프 행렬 }
    answers: ['3']
    explanation: |
      선택지 1: 그래프리스트는 그래프 표현 방법의 표준 용어가 아니다.
      선택지 2: 인접 리스트(adjacency list)는 각 정점 $v_i$에 인접한 정점들을 1개의 연결 리스트로 표현해 $n$개의 연결 리스트를 만드는 방법으로, (나)처럼 2차원 배열로 나타내지 않는다.
      선택지 3: 인접행렬(adjacency matrix)은 $n$개의 정점을 가진 그래프를 $n \times n$ 크기의 2차원 배열로 표현하고, 정점 $i$와 정점 $j$ 사이에 간선이 있으면 $A[i][j]$를 1, 없으면 0으로 정한다. (나)는 4개의 정점을 $4 \times 4$ 배열의 0과 1로 나타낸 인접행렬이다.
      선택지 4: 그래프 행렬은 그래프 표현 방법의 표준 용어가 아니다.

      핵심 개념:
      그래프를 프로그래밍 언어로 구현할 때는 인접행렬이나 인접 리스트를 이용한다.
      인접행렬은 $n \times n$ 2차원 배열로, 간선이 있으면 1, 없으면 0을 저장한다.
      무방향 그래프의 인접행렬은 대각선을 기준으로 대칭이다.
      인접 리스트는 정점마다 인접 정점을 연결 리스트로 저장하며, 각 노드는 (정점번호, 포인터) 2개의 필드로 구성된다.

      ※ 원본 표기: (나)의 행렬은 간선 1-2, 1-4, 2-3, 3-4를 나타내어, (가) 그림의 간선 1-2, 1-3, 2-4, 3-4와 맞지 않는다.

  - id: b03-01
    type: multiple-choice
    prompt: 알고리즘이 만족해야 할 조건에 해당하지 ==않는== 것은?
    choices:
      - { id: '1', text: '외부에서 1개 이상의 입력이 제공되어야 한다.' }
      - { id: '2', text: '각 명령은 모호하지 않고 단순 명확해야 한다.' }
      - { id: '3', text: '한정된 수의 단계를 거친 후에는 반드시 종료해야 한다.' }
      - { id: '4', text: '모든 명령은 컴퓨터에서 실행 가능해야 한다.' }
    answers: ['1']
    explanation: |
      선택지 1: 입출력 조건은 0개 이상의 외부 입력과 1개 이상의 출력을 요구한다. 입력은 없어도 되므로 "1개 이상의 입력"은 조건이 아니며 정답이다.
      선택지 2: 명확성 조건으로, 각 명령은 모호하지 않고 단순 명확해야 한다.
      선택지 3: 유한성 조건으로, 한정된 수의 단계를 거친 후에는 반드시 종료해야 한다.
      선택지 4: 유효성 조건으로, 모든 명령은 컴퓨터에서 실행 가능해야 한다.

      핵심 개념:
      알고리즘은 주어진 문제의 결과를 생성하기 위해 모호하지 않고 간단하며 컴퓨터가 수행 가능한 유한개의 명령을 순서에 따라 구성한 것이다.
      입출력: 0개 이상의 외부 입력과 1개 이상의 출력이 있어야 한다.
      명확성: 각 명령은 모호하지 않고 단순 명확해야 한다.
      유한성: 한정된 수의 단계 후 반드시 종료해야 하고, 유효성: 모든 명령은 실행 가능해야 한다.
      실용적 관점에서는 효율성(알고리즘은 효율적이어야 함)이 추가된다.

  - id: b03-02
    type: multiple-choice
    prompt: 컴퓨터를 사용한 문제 해결의 가능성이라는 이론적인 측면에서 알고리즘이 만족하지 ==않아도== 되는 조건은?
    choices:
      - { id: '1', text: '효율성' }
      - { id: '2', text: '유한성' }
      - { id: '3', text: '명확성' }
      - { id: '4', text: '유효성' }
    answers: ['1']
    explanation: |
      선택지 1: 효율성은 알고리즘이 효율적이어야 한다는 실용적인 관점의 조건이다. 문제 해결 가능성이라는 이론적 측면에서는 필수 조건이 아니므로 정답이다.
      선택지 2: 유한성은 한정된 수의 단계 후 반드시 종료해야 한다는 조건으로, 종료하지 않으면 결과를 얻을 수 없으므로 이론적으로도 필수다.
      선택지 3: 명확성은 각 명령이 모호하지 않고 단순 명확해야 한다는 조건으로 필수다.
      선택지 4: 유효성은 모든 명령이 컴퓨터에서 실행 가능해야 한다는 조건으로 필수다.

      핵심 개념:
      알고리즘의 기본 조건은 입출력, 명확성, 유한성, 유효성이다.
      효율성은 실용적인 관점에서 덧붙는 조건이다.
      이론적으로는 비효율적이어도 네 가지 기본 조건을 만족하면 문제를 해결하는 알고리즘이다.
      실제 프로그램에서는 효율성이 중요한 평가 기준이 된다.

  - id: b03-03
    type: multiple-choice
    prompt: 알고리즘의 대표적인 설계 기법으로 거리가 ==먼== 것은?
    choices:
      - { id: '1', text: '욕심쟁이 방법' }
      - { id: '2', text: '선형회귀 방법' }
      - { id: '3', text: '동적 프로그래밍 방법' }
      - { id: '4', text: '분할정복 방법' }
    answers: ['2']
    explanation: |
      선택지 1: 욕심쟁이 방법은 각 선택 단계에서 국부적인 최적해를 선택해 전체 최적해를 구하려는 대표적인 설계 기법이다.
      선택지 2: 선형회귀는 데이터 사이의 선형 관계를 추정하는 통계·예측 기법으로, 알고리즘 설계 기법이 아니므로 정답이다.
      선택지 3: 동적 프로그래밍 방법은 작은 소문제의 해를 테이블에 저장하고 이를 이용해 큰 문제의 해를 만들어 가는 대표적인 설계 기법이다.
      선택지 4: 분할정복 방법은 문제를 더 이상 나눌 수 없을 때까지 나누어 해결한 뒤 결합하는 대표적인 설계 기법이다.

      핵심 개념:
      욕심쟁이 방법: 전후 단계와 상관없이 해당 단계에서 가장 최선인 국부적 최적해를 선택해 나가는 방법이다(거스름돈 문제, 배낭 문제).
      동적 프로그래밍 방법: 소문제의 해를 테이블에 저장해 원래 문제의 해를 점진적으로 만드는 상향식 접근이다(모든 정점 간의 최단 경로 문제, 플로이드 알고리즘).
      분할정복 방법: 나누어진 문제들을 각각 해결한 후 해를 결합하는 하향식 접근이다(이진 탐색, 퀵 정렬, 합병 정렬).
      세 가지가 교재에서 다루는 대표적인 알고리즘 설계 기법이다.

  - id: b03-04
    type: multiple-choice
    prompt: 분할정복 방법에 대한 설명으로 적합하지 ==않은== 것은?
    choices:
      - { id: '1', text: '하향식 접근 방법이다.' }
      - { id: '2', text: '분할된 작은 문제들은 서로 독립적이다.' }
      - { id: '3', text: '거스름돈 문제의 해결에 적합하다.' }
      - { id: '4', text: '각 순환 호출마다 분할, 정복, 결합의 단계를 거친다.' }
    answers: ['3']
    explanation: |
      선택지 1: 분할정복은 큰 문제를 작은 문제로 나누어 내려가는 하향식 접근 방법이므로 옳은 설명이다.
      선택지 2: 분할된 작은 문제들은 서로 독립적으로 해결되므로 옳은 설명이다.
      선택지 3: 거스름돈 문제는 욕심쟁이 방법을 적용해서 해결하는 대표적인 문제이므로 적합하지 않은 설명이며 정답이다.
      선택지 4: 분할정복은 각 순환 호출마다 분할, 정복, 결합의 단계를 거치므로 옳은 설명이다.

      핵심 개념:
      분할정복 방법은 주어진 문제를 더 이상 나눌 수 없을 때까지 나누고, 나누어진 문제를 각각 해결한 후 해를 결합하는 하향식 접근 방법이다.
      분할정복을 적용한 대표적인 알고리즘은 이진 탐색, 퀵 정렬, 합병 정렬이다.
      거스름돈 문제와 배낭 문제는 욕심쟁이 방법으로 해결한다.
      모든 정점 간의 최단 경로 문제는 동적 프로그래밍 방법으로 해결한다.

  - id: b03-05
    type: multiple-choice
    prompt: 쪼갤 수 있는 n개의 물체에 대한 배낭 문제의 해결에 가장 적합한 알고리즘 설계 기법은?
    choices:
      - { id: '1', text: '선형회귀 방법' }
      - { id: '2', text: '분할정복 방법' }
      - { id: '3', text: '욕심쟁이 방법' }
      - { id: '4', text: '동적 프로그래밍 방법' }
    answers: ['3']
    explanation: |
      선택지 1: 선형회귀는 데이터의 선형 관계를 추정하는 통계 기법으로 알고리즘 설계 기법이 아니다.
      선택지 2: 분할정복은 이진 탐색, 퀵 정렬, 합병 정렬처럼 문제를 독립적인 작은 문제로 나누어 결합하는 기법으로, 배낭 문제의 대표 해법이 아니다.
      선택지 3: 물체를 쪼갤 수 있는 배낭 문제는 단위 무게당 이익이 큰 순서대로 최대한 배낭에 넣는 욕심쟁이 방법으로 최적해를 구할 수 있으므로 정답이다.
      선택지 4: 동적 프로그래밍은 소문제의 해를 테이블에 저장해 사용하는 기법으로, 교재에서는 모든 정점 간의 최단 경로 문제(플로이드 알고리즘)에 적용한다.

      핵심 개념:
      배낭 문제는 배낭의 용량을 초과하지 않는 범위에서 물체 이익의 합이 최대가 되도록 물체를 넣는 방법을 찾는 문제이다.
      물체를 쪼갤 수 있으면 단위 무게당 이익을 계산하고, 그 값이 큰 순서대로 최대한 배낭에 넣는 욕심쟁이 방법으로 해결한다.
      0/1 배낭 문제(물체를 쪼갤 수 없는 배낭 문제)는 욕심쟁이 방법으로 해결할 수 없다.
      거스름돈 문제(동전 개수를 최소로 해서 거스름돈을 돌려주는 문제)도 욕심쟁이 방법을 적용하는 대표 문제이다.

  - id: b03-06
    type: multiple-choice
    passageRefs: [gb03-knapsack-01]
    prompt: 다음과 같은 조건의 배낭 문제에 대해 욕심쟁이 방법으로 해를 구하였을 때 배낭에 들어가지 ==않는== 물체는? (단, 물체를 쪼갤 수 있다고 가정하고, 각 물체는 $X_i$로 표시한다.)
    choices:
      - { id: '1', text: '$X_1$' }
      - { id: '2', text: '$X_2$' }
      - { id: '3', text: '$X_3$' }
      - { id: '4', text: '$X_4$' }
    answers: ['4']
    explanation: |
      선택지 1: $X_1$은 단위 무게당 이익이 $15/4 = 3.75$로 세 번째로 크다. $X_3$, $X_2$를 넣은 뒤 남은 용량 2만큼 절반으로 쪼개져 들어가므로 배낭에 들어간다.
      선택지 2: $X_2$는 단위 무게당 이익이 $20/5 = 4$로 두 번째로 크고, 남은 용량 7에 무게 5가 모두 들어가므로 배낭에 들어간다.
      선택지 3: $X_3$은 단위 무게당 이익이 $16/3 \approx 5.33$으로 가장 커서 가장 먼저 배낭에 들어간다.
      선택지 4: $X_4$는 단위 무게당 이익이 $24/7 \approx 3.43$으로 가장 작다. 앞의 세 물체로 용량 10이 모두 채워지므로 배낭에 들어가지 않아 정답이다.

      핵심 개념:
      쪼갤 수 있는 배낭 문제는 각 물체의 단위 무게당 이익 $p_i/w_i$를 구하고 큰 순서대로 넣는다.
      순서는 $X_3(5.33) \rightarrow X_2(4) \rightarrow X_1(3.75) \rightarrow X_4(3.43)$이다.
      용량은 $10 \rightarrow 7$($X_3$) $\rightarrow 2$($X_2$)가 되고, $X_1$은 무게 4 중 절반만 넣는다.
      최대 이익은 $16 + 20 + 15/2 = 43.5$이다.

