    answers: ['1']
    explanation: |
      선택지 1: 퀵 정렬은 피벗(분할원소)을 기준으로 데이터를 두 부분배열로 나누어 피벗이 제자리를 잡게 하고, 각 부분배열에 순환적으로 퀵 정렬을 적용하므로 정답이다.
      선택지 2: 합병 정렬은 배열을 같은 크기로 나누어 정렬한 뒤 두 정렬된 부분배열을 합병하는 방식으로 피벗을 사용하지 않는다.
      선택지 3: 삽입 정렬은 데이터를 하나씩 뽑아 정렬된 부분의 제자리에 삽입하는 방식으로 피벗을 사용하지 않는다.
      선택지 4: 히프 정렬은 히프(완전 이진 트리 형태의 우선순위 구조)에서 최댓값이나 최솟값을 반복해서 꺼내는 방식으로 피벗을 사용하지 않는다.

      핵심 개념:
      퀵 정렬은 분할정복 방법을 적용한 정렬 알고리즘이며, 일반적으로 배열의 첫 번째 원소를 피벗으로 지정한다.
      최악의 경우(피벗이 항상 부분배열의 최솟값/최댓값, 즉 입력이 이미 정렬된 경우) $O(n^2)$이다.
      최선의 경우(동일한 크기의 두 부분배열로 나뉘는 경우)와 평균적인 경우는 $O(n \log n)$이다.
      분할 과정은 $O(n)$이며, 피벗 선택의 임의성이 보장되면 평균 수행 시간을 보일 가능성이 크다.

