    answers: ['1']
    explanation: |
      선택지 1: 가상기억장치(virtual memory)는 주기억장치보다 큰 프로그램을 작은 단위로 쪼개 실행하기 위해 보조기억장치의 주소를 주기억장치의 주소로 변환하여 프로그램에 제공하는 가상의 기억장치이므로 정답이다.
      선택지 2: 다중 프로그래밍 시스템(multi-programming system)은 한 작업이 입출력을 하는 동안 CPU를 다른 작업에 할당해 자원 활용을 높이는 방식으로, 메모리 영역을 넓게 보이게 하는 기법이 아니다.
      선택지 3: 스풀링(SPOOLing, Simultaneous Peripheral Operation On-Line)은 느린 입출력 데이터를 디스크에 모아 두었다가 처리해 CPU와 입출력장치의 속도 차이를 줄이는 기법으로, 사용 가능한 메모리를 넓히는 것이 목적이 아니다.
      선택지 4: 요구 페이징(demand paging)은 프로세스가 필요한 페이지를 요구할 때만 주기억장치로 옮기는 페이지 반입 방식으로, 가상기억장치를 구현하는 세부 기법이지 기법 전체를 가리키는 이름이 아니다.

      핵심 개념:
      가상기억장치는 보조기억장치를 이용해 프로그램이 보는 기억 공간을 실제 주기억장치보다 크게 만든다.
