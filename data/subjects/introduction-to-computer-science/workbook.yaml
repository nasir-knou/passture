    explanation: |
      선택지 1: 퀵 정렬은 최선·평균 $O(n \log n)$이지만 최악의 경우 $O(n^2)$이다.
      선택지 2: 버블 정렬은 최악의 경우 $O(n^2)$이다.
      선택지 3: 삽입 정렬은 최악의 경우 $O(n^2)$이다.
      선택지 4: 합병 정렬은 최선·최악·평균 모두 $O(n \log n)$이므로 최악의 경우 가장 효율적이며 정답이다.

      핵심 개념:
      합병 정렬은 분할정복 방법을 적용한 정렬 알고리즘이다.
      동일한 크기의 두 부분배열로 나눈 뒤 각 부분배열을 순환적으로 정렬하고, 정렬된 두 부분배열을 합병하여 하나의 정렬된 배열을 만든다.
      최선/최악/평균 수행 시간이 모두 $O(n \log n)$이다.
      선택·버블·삽입 정렬은 최악 $O(n^2)$, 퀵 정렬은 최악 $O(n^2)$이다.

  - id: b03-25
    type: multiple-choice
    prompt: 분할정복 방법이 적용된 정렬 알고리즘끼리 올바르게 나열된 것은?
    choices:
      - { id: '1', text: '합병 정렬, 퀵 정렬' }
      - { id: '2', text: '합병 정렬, 삽입 정렬' }
      - { id: '3', text: '퀵 정렬, 버블 정렬' }
      - { id: '4', text: '버블 정렬, 삽입 정렬' }
    answers: ['1']
    explanation: |
      선택지 1: 합병 정렬은 반으로 나누어 정렬한 뒤 합병하고, 퀵 정렬은 피벗으로 분할한 뒤 순환 정렬하므로 둘 다 분할정복 방법이 적용되어 정답이다.
      선택지 2: 삽입 정렬은 데이터를 하나씩 정렬된 부분에 삽입하는 방식으로 분할정복이 아니다.
      선택지 3: 버블 정렬은 인접한 두 값을 반복 비교·교환하는 방식으로 분할정복이 아니다.
      선택지 4: 버블 정렬과 삽입 정렬 모두 분할정복 방법이 적용되지 않은 $O(n^2)$ 정렬이다.

      핵심 개념:
      분할정복 방법이 적용된 정렬 알고리즘은 합병 정렬과 퀵 정렬이다.
      분할정복은 문제를 나누고(분할), 각각 해결한 후(정복), 해를 결합하는 하향식 접근이다.
      합병 정렬과 퀵 정렬은 최선/평균 $O(n \log n)$의 성능을 보인다.
      이진 탐색도 분할정복 방법을 적용한 탐색 알고리즘이다.

  - id: b03-26
    type: multiple-choice
    prompt: 합병 정렬 알고리즘의 합병 과정의 입력으로 주어지는 두 부분배열 X, Y는 어떠한 상태이어야 하는가?
    choices:
      - { id: '1', text: 'X의 모든 원소는 Y의 최소 원소보다 작은 값이어야 한다.' }
      - { id: '2', text: 'X의 모든 원소는 Y의 최대 원소보다 큰 값이어야 한다.' }
      - { id: '3', text: 'X, Y 각각 제 순서로 정렬되어 있어야 한다.' }
      - { id: '4', text: 'X는 제 순서, Y는 역순으로 정렬되어 있어야 한다.' }
    answers: ['3']
    explanation: |
      선택지 1: X와 Y 사이의 값 크기 관계는 요구되지 않는다. 합병 과정에서 두 부분배열의 값을 비교하며 순서를 맞추기 때문이다.
      선택지 2: 두 부분배열 간의 값 크기 관계는 합병의 조건이 아니며, 이 관계는 오히려 정렬 순서와도 반대이다.
      선택지 3: 합병은 2개의 정렬된 부분배열을 왼쪽부터 차례로 비교하여 작은 값을 합병 배열로 옮기는 과정이므로, X와 Y가 각각 제 순서로 정렬되어 있어야 한다. 정답이다.
      선택지 4: 한쪽이 역순이면 왼쪽부터 차례로 비교해 작은 값을 옮기는 방식이 성립하지 않는다.

      핵심 개념:
      합병 정렬의 합병(merge) 과정은 2개의 정렬된 부분배열(왼쪽, 오른쪽 부분배열)을 대상으로 한다.
      왼쪽부터 차례로 서로의 값을 비교하면서 작은 값을 합병(정렬된) 배열로 옮기는 과정을 반복한다.
      한쪽 부분배열의 모든 원소가 옮겨지면 다른 쪽에 남은 원소를 순서대로 합병 배열로 옮긴다.
      합병 과정은 $O(n)$이며, 전체 합병 정렬은 $O(n \log n)$이다.

  - id: b03-27
    type: multiple-choice
    prompt: 임의의 순서로 데이터가 저장된 배열 $A[0..n-1]$에서 특정한 값을 가진 데이터를 찾을 때 가장 효과적으로 적용될 수 있는 방법은?
    choices:
      - { id: '1', text: '이진 탐색' }
      - { id: '2', text: '이진 탐색 트리' }
      - { id: '3', text: '순차 탐색' }
      - { id: '4', text: '흑적 트리' }
    answers: ['3']
    explanation: |
      선택지 1: 이진 탐색은 정렬된 데이터에만 적용할 수 있으므로 임의의 순서로 저장된 배열에 바로 적용할 수 없다.
      선택지 2: 이진 탐색 트리는 데이터를 트리 구조로 새로 구성해야 하는 자료구조로, 주어진 배열에서 한 번 찾기에는 효과적이지 않다.
      선택지 3: 순차 탐색은 처음부터 하나씩 차례대로 비교하므로 모든 리스트에 적용 가능하며, 비정렬 데이터 탐색에 적합하여 정답이다.
      선택지 4: 흑적 트리(레드-블랙 트리)는 균형을 유지하는 이진 탐색 트리의 일종으로, 역시 트리를 구성해야 하며 배열에 바로 적용하는 방법이 아니다.

      핵심 개념:
      순차 탐색은 리스트(배열, 연결 리스트) 형태의 데이터를 처음부터 하나씩 차례로 비교하면서 원하는 키값을 찾는 방법이다.
      수행 시간은 $O(n)$이며, 모든 리스트에 적용 가능해 비정렬 데이터 탐색에 적합하다.
      이진 탐색은 정렬된 데이터에만 적용 가능하며 $O(\log n)$이다.
      이진 탐색 트리는 평균 $O(\log n)$, 최악 $O(n)$이다.

  - id: b03-28
    type: multiple-choice
    prompt: 주어진 데이터에 대해서 이진 탐색을 적용하면 가장 빠르게 찾아낼 수 있는 데이터의 위치는?
    choices:
      - { id: '1', text: '맨 앞에 있는 데이터' }
      - { id: '2', text: '가운데 위치한 데이터' }
      - { id: '3', text: '맨 뒤에 있는 데이터' }
      - { id: '4', text: '존재하지 않는 데이터' }
    answers: ['2']
    explanation: |
      선택지 1: 맨 앞의 데이터는 가운데 데이터와 비교 후 전반부로 범위를 계속 절반씩 줄여 가야 하므로 여러 번의 비교가 필요하다.
      선택지 2: 이진 탐색은 가장 먼저 가운데 데이터와 탐색키를 비교하므로, 가운데 위치한 데이터는 첫 비교에서 탐색에 성공해 가장 빠르며 정답이다.
      선택지 3: 맨 뒤의 데이터도 후반부로 범위를 계속 줄여 가야 하므로 여러 번의 비교가 필요하다.
      선택지 4: 존재하지 않는 데이터는 탐색 범위가 빌 때까지 비교를 반복해야 실패를 알 수 있으므로 가장 느린 편이다.

      핵심 개념:
      이진 탐색은 정렬된 배열의 데이터를 절반씩 줄여 가면서 원하는 데이터를 찾는 분할정복 방법이며 $O(\log n)$이다.
      가운데 데이터 = 탐색키이면 탐색 성공(인덱스 반환 후 종료)이다.
      가운데 데이터 > 탐색키이면 전반부, 가운데 데이터 < 탐색키이면 후반부를 대상으로 순환 호출한다.
      정렬된 데이터에서만 적용 가능하므로 삽입/삭제 시 정렬 상태를 유지하기 위한 데이터 이동이 필요하다.

  - id: b03-29
    type: multiple-choice
    prompt: $n$개의 데이터에 대한 이진 탐색과 이진 탐색 트리의 최악의 탐색 시간이 바르게 연결된 것은?
    choices:
      - { id: '1', text: '$O(\log n) - O(\log n)$' }
      - { id: '2', text: '$O(\log n) - O(n)$' }
      - { id: '3', text: '$O(n) - O(\log n)$' }
      - { id: '4', text: '$O(n) - O(n)$' }
    answers: ['2']
    explanation: |
      선택지 1: 이진 탐색 트리의 $O(\log n)$은 최선/평균 탐색 시간이며, 한쪽으로 치우친 트리에서는 최악 $O(n)$이다.
      선택지 2: 이진 탐색은 매번 범위를 절반으로 줄여 최악에도 $O(\log n)$이고, 이진 탐색 트리는 한쪽으로 치우친 경우 최악 $O(n)$이므로 정답이다.
      선택지 3: 이진 탐색의 최악은 $O(n)$이 아니라 $O(\log n)$이며, 이진 탐색 트리의 최악은 $O(\log n)$이 아니라 $O(n)$이다.
      선택지 4: 이진 탐색의 최악 탐색 시간은 $O(n)$이 아니라 $O(\log n)$이다.

      핵심 개념:
      이진 탐색: $O(\log n)$.
      이진 탐색 트리: 최선/평균 수행 시간 $O(\log n)$, 최악 수행 시간 $O(n)$.
      이진 탐색 트리는 키가 정렬된 순서로 삽입되면 한쪽으로 치우친 경사 트리가 되어 최악이 된다.
      순차 탐색은 $O(n)$이다.

  - id: b03-30
    type: multiple-choice
    prompt: 다음 중 문제 해결을 위해서 적용된 알고리즘의 설계 기법이 나머지와 ==다른== 하나는?
    choices:
      - { id: '1', text: '퀵 정렬' }
      - { id: '2', text: '합병 정렬' }
      - { id: '3', text: '이진 탐색' }
      - { id: '4', text: '배낭 문제' }
    answers: ['4']
    explanation: |
      선택지 1: 퀵 정렬은 피벗을 기준으로 분할해 순환 정렬하는 분할정복 방법을 적용한다.
      선택지 2: 합병 정렬은 반으로 나누어 정렬한 뒤 합병하는 분할정복 방법을 적용한다.
      선택지 3: 이진 탐색은 탐색 범위를 절반씩 줄이는 분할정복 방법을 적용한다.
      선택지 4: 물체를 쪼갤 수 있는 배낭 문제는 단위 무게당 이익이 큰 순서로 넣는 욕심쟁이 방법으로 해결하므로 나머지와 다르며 정답이다.

      핵심 개념:
      분할정복 방법: 이진 탐색, 퀵 정렬, 합병 정렬.
      욕심쟁이 방법: 거스름돈 문제, 배낭 문제.
      동적 프로그래밍 방법: 모든 정점 간의 최단 경로 문제(플로이드 알고리즘).
      0/1 배낭 문제는 욕심쟁이 방법으로 해결할 수 없다.

  - id: b03-31
    type: multiple-choice
    passageRefs: [gb03-bst-01]
    prompt: 주어진 이진 탐색 트리에서 노드 35를 삭제하려고 한다. 삭제 후 노드 35의 위치에 오게 되는 노드는?
    choices:
      - { id: '1', text: '30' }
      - { id: '2', text: '40' }
      - { id: '3', text: '44' }
      - { id: '4', text: '55' }
    answers: ['2']
    explanation: |
      선택지 1: 30은 35의 왼쪽 자식으로, 교재 방식인 후속자(오른쪽 서브트리의 최솟값) 노드가 아니다.
      선택지 2: 35는 자식이 2개이므로 후속자 노드, 즉 오른쪽 서브트리(55, 44, 88, 40)의 최솟값인 40을 35의 위치로 올린다. 정답이다.
      선택지 3: 44는 오른쪽 서브트리에 있지만 그 왼쪽에 더 작은 40이 있으므로 최솟값이 아니다.
      선택지 4: 55는 35의 오른쪽 자식일 뿐 오른쪽 서브트리의 최솟값이 아니다.

      핵심 개념:
      이진 탐색 트리는 각 노드의 왼쪽 서브트리의 모든 키값이 그 노드보다 작고, 오른쪽 서브트리의 모든 키값이 그 노드보다 큰 이진 트리이다.
      삭제는 삭제되는 노드의 자식 개수에 따라 세 가지 경우로 처리한다.
      자식이 없으면 그대로 삭제하고, 하나만 있으면 자식 노드를 서브트리째 삭제 위치로 올린다.
      자식이 2개이면 후속자(successor) 노드를 삭제 위치로 올리고, 후속자 노드의 자식 개수에 따라 다시 삭제 연산을 처리한다.

  - id: b03-32
    type: multiple-choice
    prompt: 빈 이진 탐색 트리에 키값들을 차례대로 삽입한 후 키 10을 탐색하려고 한다. 이때 탐색 시간이 가장 오래 걸리는 키의 삽입 순서는 어느 것인가?
    choices:
      - { id: '1', text: '10, 20, 30, 40, 50, 60, 70' }
      - { id: '2', text: '20, 50, 60, 70, 40, 30, 10' }
      - { id: '3', text: '50, 40, 30, 20, 10, 60, 70' }
      - { id: '4', text: '60, 20, 30, 10, 50, 40, 70' }
    answers: ['3']
    explanation: |
      선택지 1: 10이 루트가 되므로 한 번의 비교로 찾는다.
      선택지 2: 루트 20의 왼쪽 자식이 10이므로 두 번의 비교로 찾는다.
      선택지 3: 50 → 40 → 30 → 20 → 10으로 왼쪽으로만 이어져 10이 루트(레벨 0)로부터 네 단계 아래인 레벨 4에 놓이므로 다섯 번의 비교가 필요해 가장 오래 걸리며 정답이다.
      선택지 4: 60 → 20 → 10 순으로 내려가 세 번의 비교로 찾는다.

      핵심 개념:
      트리에서의 탐색 시간은 키를 비교하는 횟수, 즉 루트 노드로부터 얼마나 떨어져 있는가에 의해 결정된다.
      키값을 차례대로 삽입해 트리를 만들면 각 키의 레벨로 비교 횟수를 파악할 수 있다.
      루트로부터의 거리가 멀수록(레벨이 클수록) 비교 횟수와 탐색 시간이 커진다.
      이진 탐색 트리는 평균 $O(\log n)$, 한쪽으로 치우치면 최악 $O(n)$이다.

  - id: b03-33
    type: multiple-choice
    prompt: 최악의 수행 시간이 가장 효율적인 것은?
    choices:
      - { id: '1', text: '순차 탐색' }
      - { id: '2', text: '이진 탐색 트리' }
      - { id: '3', text: '이진 탐색' }
      - { id: '4', text: '버블 정렬' }
    answers: ['3']
    explanation: |
      선택지 1: 순차 탐색은 $O(n)$이다.
      선택지 2: 이진 탐색 트리는 평균 $O(\log n)$이지만 최악 $O(n)$이다.
      선택지 3: 이진 탐색은 최악의 경우에도 $O(\log n)$으로 보기 중 가장 효율적이며 정답이다.
      선택지 4: 버블 정렬은 최악 $O(n^2)$이다.

      핵심 개념:
      순차 탐색 $O(n)$, 이진 탐색 $O(\log n)$, 이진 탐색 트리 $O(\log n)/O(n)$.
      선택/버블/삽입 정렬 $O(n^2)$, 퀵 정렬 $O(n \log n)/O(n^2)$, 합병 정렬 $O(n \log n)$.
      최악의 수행 시간을 비교할 때는 평균이 아닌 최악의 경우 값을 기준으로 한다.
      빅오 크기 관계 $O(\log n) < O(n) < O(n \log n) < O(n^2)$로 효율을 비교한다.

