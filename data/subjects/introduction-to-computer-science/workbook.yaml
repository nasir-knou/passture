      선택지 2: 선택 정렬은 입력 상태와 무관하게 언제나 $O(n^2)$이다.
      선택지 3: 삽입 정렬은 이미 정렬된 입력이면 각 데이터가 한 번의 비교로 제자리에 놓여 최선의 경우 $O(n)$이 되므로 정답이다.
      선택지 4: 합병 정렬은 입력 상태와 무관하게 최선·최악·평균 모두 $O(n \log n)$이다.

      핵심 개념:
      삽입 정렬은 미정렬 부분의 왼쪽부터 한 데이터씩 꺼내어 정렬 부분에서 제자리를 찾아 삽입하는 방식이다.
      최선의 경우(이미 원하는 순서로 정렬된 경우) $O(n)$이다.
      최악의 경우(역순으로 정렬된 경우) $O(n^2)$이다.
      정렬된 입력은 퀵 정렬에는 최악의 경우가 되지만 삽입 정렬에는 최선의 경우가 된다.

  - id: b03-19
    type: multiple-choice
    prompt: 피벗이 제자리를 잡도록 해서 정렬하는 알고리즘은?
