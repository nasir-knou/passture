    body: |
      $11100101_{(2)}$ $343_{(8)}$ $227_{(10)}$ $\mathrm{E7}_{(16)}$

  - id: gb01-unicode-desc-01
    type: text
    body: |
      - 알파벳만을 부호화하는 데 사용되는 기존 코드의 한계점을 극복하고 전 세계의 문자를 표현하기 위한 코드 체계이다.
      - 사용 중인 플랫폼, 프로그램, 언어에 무관한 특징을 가진다.
      - 컴퓨터 하드웨어 및 소프트웨어 업체들이 모여서 1990년에 첫 버전을 발표하였고, 1995년에 국제 표준으로 제정되었다.

