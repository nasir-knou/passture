  - id: b03-21
    type: multiple-choice
    prompt: 퀵 정렬에 대한 설명으로 올바른 것은? (단, 피벗은 배열의 첫 번째 원소로 정한다.)
    choices:
      - {
          id: '1',
          text: '피벗을 기준으로 같은 크기의 두 부분배열로 분할될 때의 수행 시간은 $O(\log n)$이다.',
        }
      - { id: '2', text: '최악의 경우에도 수행 시간 $O(n\log n)$이 보장된다.' }
      - { id: '3', text: '입력 데이터가 제 순서대로 정렬된 경우 최악의 수행 시간을 나타낸다.' }
      - { id: '4', text: '피벗 선택의 임의성이 보장된다면 평균적인 수행 시간 $O(n^2)$이 보장된다.' }
    answers: ['3']
    explanation: |
      선택지 1: 같은 크기의 두 부분배열로 분할되는 최선의 경우 수행 시간은 $O(\log n)$이 아니라 $O(n \log n)$이다.
      선택지 2: 퀵 정렬의 최악 수행 시간은 $O(n^2)$이므로 $O(n \log n)$이 보장되지 않는다.
      선택지 3: 첫 번째 원소를 피벗으로 하면 이미 정렬된 입력에서 피벗이 항상 부분배열의 최솟값이 되어 한쪽으로만 분할되므로 최악의 수행 시간 $O(n^2)$을 나타낸다. 정답이다.
      선택지 4: 피벗 선택의 임의성이 보장되면 평균 수행 시간 $O(n^2)$이 아니라 $O(n \log n)$을 보일 가능성이 크다.

      핵심 개념:
      퀵 정렬의 최악의 경우는 피벗만 제자리를 잡고 나머지 모든 데이터가 하나의 부분배열로 분할되는 경우이다.
      첫 번째 원소를 피벗으로 하면 입력이 이미 정렬된 경우가 최악이 되며 $O(n^2)$이다.
      피벗을 중심으로 동일한 크기의 두 부분배열로 나뉘는 최선의 경우와 평균적인 경우는 $O(n \log n)$이다.
      한 번의 분할 과정은 $O(n)$이다.

