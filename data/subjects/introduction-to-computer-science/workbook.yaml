            - ['0', '0', '1']
      - id: '2'
        text: ''
        diagram:
          type: data-table
          columns: ['X', 'Y', 'Z']
          rows:
            - ['0', '1', '1']
      - id: '3'
        text: ''
        diagram:
          type: data-table
          columns: ['X', 'Y', 'Z']
          rows:
            - ['1', '0', '0']
      - id: '4'
        text: ''
        diagram:
          type: data-table
          columns: ['X', 'Y', 'Z']
          rows:
            - ['1', '1', '0']
    answers: ['4']
    explanation: |
      선택지 1: X와 Y가 모두 0이므로 XOR 출력은 0이지만 Z가 1이므로 OR 출력 $F = 0 + 1 = 1$이 된다.
      선택지 2: X와 Y가 서로 다르므로 XOR 출력은 1이고, Z도 1이므로 $F = 1 + 1 = 1$이 된다.
      선택지 3: X와 Y가 서로 다르므로 XOR 출력은 1이고, Z가 0이어도 $F = 1 + 0 = 1$이 된다.
      선택지 4: X와 Y가 모두 1이므로 XOR 출력은 0이고, Z도 0이므로 $F = 0 + 0 = 0$이 되어 정답이다.

      핵심 개념:
      회로의 출력은 $F = (X \oplus Y) + Z$이며, $X \oplus Y = X \cdot Y' + X' \cdot Y$이다.
      XOR은 두 입력이 서로 다를 때만 1을, OR은 입력 중 하나라도 1이면 1을 출력한다.
      따라서 F가 0이 되려면 XOR 출력과 Z가 모두 0이어야 하므로 X = Y이고 Z = 0이어야 한다.
      보기 중 이 조건을 만족하는 것은 (1, 1, 0)뿐이다.

  - id: b05-05
    type: multiple-choice
    prompt: 불 대수의 기본 법칙 중에서 드모르간 법칙에 해당하는 것은?
    choices:
      - { id: '1', text: '$A \cdot B = B \cdot A$' }
      - { id: '2', text: '$(A + B) + C = A + (B + C)$' }
      - { id: '3', text: '$A \cdot (B + C) = A \cdot B + A \cdot C$' }
      - { id: '4', text: '$(A \cdot B)'' = A'' + B''$' }
    answers: ['4']
    explanation: |
      선택지 1: 두 변수의 순서를 바꾸어도 결과가 같다는 교환법칙이다.
      선택지 2: 연산의 묶는 순서를 바꾸어도 결과가 같다는 결합법칙이다.
      선택지 3: 논리곱을 논리합에 대해 나누어 적용하는 분배법칙이다.
      선택지 4: 논리곱 전체의 부정이 각 변수 부정의 논리합과 같다는 드모르간 법칙으로 정답이다.

      핵심 개념:
      불 대수는 이진 변수의 논리연산을 다루는 대수이다.
      드모르간 법칙은 $(X + Y)' = X' \cdot Y'$, $(X \cdot Y)' = X' + Y'$의 두 식으로 표현된다.
      즉, 전체를 부정하면 각 변수를 부정하고 AND와 OR를 서로 바꾼 것과 같다.
      불 대수의 법칙을 이용해 논리 수식을 간소화하면 보다 단순한 논리회로를 구성할 수 있다.

  - id: b05-06
    type: multiple-choice
    prompt: 다음 논리회로 중 출력값을 결정하는 방식이 나머지와 ==다른== 하나는?
    choices:
      - { id: '1', text: '멀티플렉서' }
      - { id: '2', text: '디코더' }
      - { id: '3', text: '카운터' }
      - { id: '4', text: '전가산기' }
    answers: ['3']
    explanation: |
      선택지 1: 멀티플렉서는 여러 입력선 중 하나를 선택해 출력하는 회로로, 출력이 현재 입력에 의해서만 결정되는 조합회로이다.
      선택지 2: 디코더는 $n$비트 이진 코드를 $2^n$개의 출력 중 하나로 변환하는 회로로, 출력이 현재 입력에 의해서만 결정되는 조합회로이다.
      선택지 3: 카운터는 플립플롭에 회로의 상태를 저장하고, 출력이 입력과 저장된 상태값에 의해 결정되는 순서회로이다. 나머지 셋은 조합회로이므로 정답이다.
      선택지 4: 전가산기는 두 비트와 아랫자리 올림수를 더해 합과 올림수를 내는 회로로, 출력이 현재 입력에 의해서만 결정되는 조합회로이다.

      핵심 개념:
      논리회로는 조합회로와 순서회로로 구분한다.
      조합회로는 출력이 주어진 입력에 의해서만 결정되며 전가산기, 디코더, 인코더, 멀티플렉서, 디멀티플렉서 등이 있다.
      순서회로는 출력이 주어진 입력과 저장된 회로의 상태값에 의해 결정된다.
      순서회로는 상태를 저장하기 위해 1비트 기억소자인 플립플롭을 사용하며 카운터, 레지스터 등이 있다.

  - id: b05-07
    type: multiple-choice
    prompt: 다음 중 플립플롭을 사용하는 논리회로는?
    choices:
      - { id: '1', text: '카운터' }
      - { id: '2', text: '디코더' }
      - { id: '3', text: '멀티플렉서' }
      - { id: '4', text: '전가산기' }
    answers: ['1']
    explanation: |
      선택지 1: 카운터는 클록펄스가 입력될 때마다 미리 정해진 순서에 따라 상태가 변하는 순서회로로, 현재 상태를 저장하기 위해 플립플롭을 사용하므로 정답이다.
      선택지 2: 디코더는 입력 코드만으로 출력이 정해지는 조합회로로, 상태를 저장하는 플립플롭이 필요 없다.
      선택지 3: 멀티플렉서는 선택 변수로 입력선 하나를 골라 출력하는 조합회로로, 플립플롭을 사용하지 않는다.
      선택지 4: 전가산기는 입력 비트들의 덧셈 결과만 출력하는 조합회로로, 플립플롭을 사용하지 않는다.

      핵심 개념:
      플립플롭은 1비트의 정보를 저장할 수 있는 기억소자이다.
      순서회로는 연산의 각 단계마다 회로의 특정 상태를 플립플롭에 저장하고 참조한다.
      대표적인 순서회로는 카운터와 레지스터이다.
      조합회로(전가산기, 디코더, 인코더, 멀티플렉서 등)는 기억소자 없이 현재 입력만으로 출력이 정해진다.

  - id: b05-08
    type: multiple-choice
    prompt: NOR 게이트 2개로 구성된 RS 플립플롭에서 출력값이 변하지 않고 현재의 상태를 그대로 유지하기 위한 입력값의 구성으로 올바른 것은?
    choices:
      - id: '1'
        text: ''
        diagram:
          type: data-table
          columns: ['R', 'S']
          rows:
            - ['0', '0']
      - id: '2'
        text: ''
        diagram:
          type: data-table
          columns: ['R', 'S']
          rows:
            - ['0', '1']
      - id: '3'
        text: ''
        diagram:
          type: data-table
          columns: ['R', 'S']
          rows:
            - ['1', '0']
      - id: '4'
        text: ''
        diagram:
          type: data-table
          columns: ['R', 'S']
          rows:
            - ['1', '1']
    answers: ['1']
    explanation: |
      선택지 1: S = 0, R = 0이면 무변화 상태로 $Q(t+1) = Q(t)$가 되어 현재 상태를 그대로 유지하므로 정답이다.
      선택지 2: S = 1, R = 0이면 세트 상태로 출력 Q가 1이 되므로 현재 상태가 유지되지 않는다.
      선택지 3: S = 0, R = 1이면 리셋 상태로 출력 Q가 0이 되므로 현재 상태가 유지되지 않는다.
      선택지 4: S = 1, R = 1은 두 출력이 모두 0이 되어 Q와 Q′의 관계가 깨지는 불가(미정 상태) 입력이다.

      핵심 개념:
      RS 플립플롭은 NOR 게이트 2개의 출력을 서로의 입력으로 되먹임한 구조로, 엄밀히는 '래치'라고 한다.
      입력 S(set)는 Q를 1로, R(reset)은 Q를 0으로 만든다.
      S와 R가 모두 0이면 이전 상태를 유지하며, 이것이 1비트를 기억하는 원리이다.
      S와 R가 모두 1인 입력은 다음 상태를 정할 수 없어 사용하지 않는다.

  - id: b05-09
    type: multiple-choice
    passageRefs: [gb05-decoder-desc-01]
    prompt: 다음 설명에 해당하는 논리회로는?
    choices:
      - { id: '1', text: '멀티플렉서' }
      - { id: '2', text: '카운터' }
      - { id: '3', text: '레지스터' }
      - { id: '4', text: '디코더' }
    answers: ['4']
    explanation: |
      선택지 1: 멀티플렉서는 $2^n$개의 입력선 중 하나를 $n$개의 선택 변수로 골라 단일 출력으로 내보내는 회로로, 출력이 여러 개가 아니다.
      선택지 2: 카운터는 클록펄스가 입력될 때마다 정해진 순서로 상태가 변하는 순서회로로, 입력 코드를 해독하는 회로가 아니다.
      선택지 3: 레지스터는 플립플롭으로 여러 비트의 데이터를 저장하는 순서회로로, 입력을 여러 출력 중 하나로 변환하지 않는다.
      선택지 4: 디코더는 $n$비트의 이진 코드를 최대 $2^n$개의 서로 다른 출력으로 변환하며, 하나의 출력만 1이 되고 나머지는 모두 0이 되므로 정답이다.

      핵심 개념:
      디코더는 $n$비트 이진 입력을 해독해 $2^n$개의 출력선 중 하나만 활성화하는 조합회로이다.
      주소 방식으로 주어진 입력으로부터 각각의 해당 하드웨어 구성요소를 개별적으로 구동하기 위해 주로 사용된다.
      인코더는 디코더와 반대로 활성화된 입력선 하나를 이진 코드로 변환한다.
      멀티플렉서는 여러 입력 중 하나를 선택해 단일 출력으로 내보내는 회로로 디코더와 구별해야 한다.

