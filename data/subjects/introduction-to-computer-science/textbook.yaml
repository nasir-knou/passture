      퀵 정렬은 평균 $O(n\log n)$, 최악 $O(n^2)$이다.
      합병 정렬은 $T(n)=2T(n/2)+O(n)$이므로 어떤 경우에도 $O(n\log n)$이다.
      합병 정렬은 합병 과정에서 추가 저장 공간이 필요하다.

