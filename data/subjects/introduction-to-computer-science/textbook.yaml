      선택지 4: 존재하지 않는 데이터는 탐색 범위가 빌 때까지 비교해야 실패로 판정되므로 최대 비교 횟수가 필요하다.

      핵심 개념:
      이진 탐색은 정렬된 데이터의 가운데 값과 찾는 값을 비교하여 탐색 범위를 절반으로 줄여 나간다.
      찾는 값이 가운데 값보다 작으면 왼쪽 절반, 크면 오른쪽 절반을 탐색한다.
      최선의 경우(가운데 값)는 1번, 최악의 경우는 약 $\log_2 n$번 비교한다.
      수행 시간은 $O(\log n)$이다.

  - id: t03-15
    type: multiple-choice
    prompt: n개인 데이터에 대한 이진 탐색과 이진 탐색 트리의 최악의 탐색 시간이 바르게 연결된 것은?
    choices:
      - { id: '1', text: '$O(\log n)-O(\log n)$' }
      - { id: '2', text: '$O(\log n)-O(n)$' }
      - { id: '3', text: '$O(n)-O(\log n)$' }
      - { id: '4', text: '$O(n)-O(n)$' }
    answers: ['2']
    explanation: |
      선택지 1: 이진 탐색은 최악에도 $O(\log n)$이지만, 이진 탐색 트리는 한쪽으로 치우친 경사 트리가 되면 최악 $O(n)$이므로 틀리다.
      선택지 2: 이진 탐색은 매번 범위를 절반으로 줄이므로 최악 $O(\log n)$이고, 이진 탐색 트리는 데이터가 정렬된 순서로 삽입되어 경사 트리가 되면 높이가 $n$이 되어 최악 $O(n)$이다. 정답이다.
      선택지 3: 이진 탐색의 최악은 $O(n)$이 아니라 $O(\log n)$이고, 이진 탐색 트리의 최악은 $O(\log n)$이 아니라 $O(n)$이므로 순서가 반대이다.
      선택지 4: 이진 탐색 트리의 최악 $O(n)$은 맞지만, 이진 탐색의 최악은 $O(\log n)$이므로 틀리다.

      핵심 개념:
      이진 탐색은 정렬된 배열에서 범위를 절반씩 줄이므로 최악 탐색 시간이 $O(\log n)$이다.
      이진 탐색 트리의 탐색 시간은 트리의 높이 $h$에 비례하는 $O(h)$이다.
      균형 잡힌 이진 탐색 트리는 $h \approx \log n$이지만, 경사 트리는 $h = n$이 된다.
      따라서 이진 탐색 트리의 최악 탐색 시간은 $O(n)$이다.

  - id: t03-16
    type: multiple-choice
    passageRefs: [gt03-bst-successor-01]
    prompt: 주어진 이진 탐색 트리에서 노드 35의 후속자 노드는 무엇인가?
    choices:
      - { id: '1', text: '30' }
      - { id: '2', text: '40' }
      - { id: '3', text: '44' }
      - { id: '4', text: '55' }
    answers: ['2']
    explanation: |
      선택지 1: 30은 35의 왼쪽 서브트리에서 가장 큰 값으로, 35의 선행자(predecessor) 노드이다.
      선택지 2: 후속자(successor)는 35보다 큰 값 중 가장 작은 값으로, 35의 오른쪽 서브트리(55, 44, 88, 40)에서 왼쪽 링크를 끝까지 따라간 노드 40이다. 정답이다.
      선택지 3: 44는 35보다 크지만 40보다도 크므로 35 바로 다음 값이 아니다.
      선택지 4: 55는 35의 오른쪽 자식일 뿐, 오른쪽 서브트리의 최솟값이 아니므로 후속자가 아니다.

      핵심 개념:
      이진 탐색 트리에서 어떤 노드의 후속자는 그 노드보다 큰 키 중 가장 작은 키를 가진 노드이다.
      오른쪽 서브트리가 있으면 오른쪽 서브트리의 최솟값(맨 왼쪽 노드)이 후속자이다.
      선행자는 왼쪽 서브트리의 최댓값(맨 오른쪽 노드)이다.
      자식이 둘인 노드를 삭제할 때 후속자나 선행자로 그 자리를 대체한다.

  - id: t04-01
    type: multiple-choice
    prompt: CPU의 시간을 일정 간격의 작은 시간으로 쪼개서 각 사용자에게 시간 간격이 할당되고, 그동안 직접 컴퓨터와 대화식으로 작업을 수행하는 방식을 무엇이라 하는가?
    choices:
      - { id: '1', text: '실시간처리 시스템' }
      - { id: '2', text: '시분할처리 시스템' }
      - { id: '3', text: '일괄처리 시스템' }
      - { id: '4', text: '다중 프로그래밍 시스템' }
    answers: ['2']
    explanation: |
      선택지 1: 실시간처리 시스템은 데이터가 발생하는 즉시 처리하여 정해진 시간 안에 결과를 내는 방식으로, CPU 시간을 사용자별로 쪼개 할당하는 방식이 아니다.
      선택지 2: 시분할처리 시스템(time sharing system)은 CPU 시간을 작은 시간 간격(time slice)으로 나누어 여러 사용자에게 번갈아 할당하고, 각 사용자가 대화식으로 작업하게 하는 방식이므로 정답이다.
      선택지 3: 일괄처리 시스템(batch processing system)은 작업을 일정량 모아 한꺼번에 처리하는 방식으로, 사용자와의 대화식 처리가 불가능하다.
      선택지 4: 다중 프로그래밍 시스템은 여러 프로그램을 주기억장치에 함께 적재해 두고 한 프로그램이 입출력을 기다리는 동안 다른 프로그램에 CPU를 할당하여 CPU 이용률을 높이는 방식으로, 사용자별 시간 간격 할당과 대화식 처리를 뜻하지 않는다.

      핵심 개념:
      운영체제의 운영 방식에는 일괄처리, 다중 프로그래밍, 시분할처리, 실시간처리, 다중처리, 분산처리 시스템 등이 있다.
      시분할처리 시스템은 CPU 시간을 작은 단위로 나누어 여러 사용자에게 순환 할당한다.
      각 사용자는 컴퓨터를 혼자 사용하는 것처럼 대화식으로 작업할 수 있다.
      일괄처리는 모아서 한 번에, 실시간처리는 발생 즉시 처리한다.

  - id: t04-02
    type: multiple-choice
    prompt: 디스크와 같은 장치를 사용해서 프로그램 관점에서 사용 가능한 메모리 영역을 넓게 보이는 기법을 무엇이라 하는가?
    choices:
      - { id: '1', text: '가상기억장치' }
      - { id: '2', text: '다중 프로그래밍' }
      - { id: '3', text: '스풀링' }
      - { id: '4', text: '요구 페이징' }
    answers: ['1']
    explanation: |
      선택지 1: 가상기억장치(virtual memory)는 디스크 같은 보조기억장치의 일부를 주기억장치처럼 사용하여, 프로그램이 실제 주기억장치보다 큰 메모리 공간을 사용할 수 있는 것처럼 보이게 하는 기법이므로 정답이다.
      선택지 2: 다중 프로그래밍은 여러 프로그램을 주기억장치에 동시에 적재해 CPU를 번갈아 사용하게 하는 방식으로, 메모리 영역을 넓게 보이게 하는 기법이 아니다.
      선택지 3: 스풀링(SPOOLing, Simultaneous Peripheral Operation On-Line)은 프린터 같은 느린 입출력 장치의 데이터를 디스크에 임시 저장해 두고 처리하여 CPU와 입출력 장치의 속도 차이를 줄이는 기법이다.
      선택지 4: 요구 페이징(demand paging)은 가상기억장치를 구현할 때 필요한 페이지만 요청 시점에 주기억장치로 가져오는 페이지 적재 방식으로, 가상기억장치라는 기법 자체가 아니라 그 구현 방법의 하나이다.

      핵심 개념:
      가상기억장치는 보조기억장치를 이용해 주기억장치보다 큰 논리적 주소 공간을 제공한다.
      프로그램 전체가 아니라 실행에 필요한 부분만 주기억장치에 적재한다.
      구현 기법에는 동일한 크기로 나누는 페이징과 논리적 단위로 나누는 세그먼테이션이 있다.
      요구 페이징은 필요한 페이지를 요청이 있을 때 적재하는 방식이다.

  - id: t04-03
    type: multiple-choice
    prompt: 한쪽 방향에서 가장 짧은 탐색거리의 디스크 접근 요청을 먼저 서비스하는 방식은 무엇인가 ?
    choices:
      - { id: '1', text: 'FCFS 스케줄링 기법' }
      - { id: '2', text: 'SCAN 스케줄링 기법' }
      - { id: '3', text: 'SLTF 스케줄링 기법' }
      - { id: '4', text: 'SSTF 스케줄링 기법' }
    answers: ['2']
    explanation: |
      선택지 1: FCFS(First Come First Served) 스케줄링은 도착한 순서대로 디스크 접근 요청을 서비스하며, 탐색거리를 고려하지 않는다.
      선택지 2: SCAN 스케줄링은 헤드가 한쪽 방향으로 이동하면서 그 방향에서 가장 짧은 탐색거리의 요청부터 서비스하고, 끝에 도달하면 방향을 바꾸는 방식이므로 정답이다.
      선택지 3: SLTF(Shortest Latency Time First) 스케줄링은 탐색거리가 아니라 회전 지연 시간이 가장 짧은 요청부터 서비스하는 방식이다.
      선택지 4: SSTF(Shortest Seek Time First) 스케줄링은 방향과 관계없이 현재 헤드 위치에서 탐색거리가 가장 짧은 요청을 먼저 서비스하므로 '한쪽 방향'이라는 조건과 맞지 않는다.

      핵심 개념:
      디스크 스케줄링은 디스크 접근 요청의 서비스 순서를 정해 탐색 시간을 줄이는 기법이다.
      FCFS는 도착 순서, SSTF는 방향과 무관하게 가장 가까운 요청 순서로 서비스한다.
      SSTF는 헤드에서 먼 요청이 오래 기다리는 기아 상태가 생길 수 있다.
      SCAN은 한 방향으로 진행하며 가장 가까운 요청을 서비스하고 끝에서 방향을 바꾼다.

  - id: t04-04
    type: multiple-choice
    prompt: 처리할 작업이 발생할 때마다 즉각적으로 처리하지 않고 처리해야 할 작업이 일정량에 도달할 때까지 여러 작업을 모아 놓고 작업을 한꺼번에 처리하는 방식은 무엇인가?
    choices:
      - { id: '1', text: '실시간처리 시스템' }
      - { id: '2', text: '시분할처리 시스템' }
      - { id: '3', text: '다중처리 시스템' }
      - { id: '4', text: '일괄처리 시스템' }
    answers: ['4']
    explanation: |
      선택지 1: 실시간처리 시스템은 작업이 발생하는 즉시 처리하는 방식으로, 문제의 설명과 반대이다.
      선택지 2: 시분할처리 시스템은 CPU 시간을 작은 간격으로 나누어 여러 사용자에게 할당하고 대화식으로 처리하는 방식이다.
      선택지 3: 다중처리 시스템(multiprocessing system)은 여러 개의 CPU를 사용하여 작업을 병렬로 처리하는 방식으로, 작업을 모아서 처리하는 방식이 아니다.
      선택지 4: 일괄처리 시스템은 작업을 일정량이 될 때까지 모아 두었다가 한꺼번에 처리하는 방식이므로 정답이다.

      핵심 개념:
      일괄처리 시스템은 초기 컴퓨터 운영 방식으로, 작업을 모아서 순서대로 한 번에 처리한다.
      급여 계산, 월말 결산처럼 즉시 응답이 필요 없는 업무에 적합하다.
      사용자와의 상호작용이 불가능하고 결과를 얻기까지 오래 걸린다.
      실시간처리는 발생 즉시, 시분할처리는 대화식으로 처리한다는 점에서 구별된다.

  - id: t04-05
    type: multiple-choice
    prompt: 교착상태가 발생하는 네 가지 조건에 해당하지 ==않는== 것은?
    choices:
      - { id: '1', text: '대기 조건' }
      - { id: '2', text: '선점 조건' }
      - { id: '3', text: '원형 대기 조건' }
      - { id: '4', text: '상호배제 조건' }
    answers: ['2']
    explanation: |
      선택지 1: 대기 조건(점유와 대기)은 프로세스가 자원을 점유한 채 다른 자원을 기다리는 상태로, 교착상태 발생 조건이다.
      선택지 2: 교착상태의 조건은 할당된 자원을 강제로 빼앗을 수 없다는 비선점 조건이다. 선점이 가능하면 자원을 회수해 교착상태를 풀 수 있으므로 선점 조건은 발생 조건이 아니다. 정답이다.
      선택지 3: 원형 대기 조건(환형 대기)은 프로세스들이 원형으로 서로 상대가 가진 자원을 기다리는 상태로, 교착상태 발생 조건이다.
      선택지 4: 상호배제 조건은 한 자원을 한 번에 하나의 프로세스만 사용할 수 있다는 조건으로, 교착상태 발생 조건이다.

      핵심 개념:
      교착상태(deadlock)는 네 가지 조건이 동시에 만족될 때 발생한다.
      상호배제, 점유와 대기(대기), 비선점, 원형 대기(환형 대기)가 그 조건이다.
      네 조건 중 하나라도 성립하지 않게 하면 교착상태를 예방할 수 있다.
      비선점 조건을 없애려면 자원을 선점(회수)할 수 있게 한다.

  - id: t04-06
    type: multiple-choice
    prompt: 가상기억장치 구현 기법에서 프로그램을 동일한 크기의 영역으로 나눈 것을 무엇이라 부르는가?
    choices:
      - { id: '1', text: '세그먼트' }
      - { id: '2', text: '프레임' }
      - { id: '3', text: '파티션' }
      - { id: '4', text: '페이지' }
    answers: ['4']
    explanation: |
      선택지 1: 세그먼트(segment)는 프로그램을 함수, 데이터 등 논리적 단위로 나눈 것으로, 크기가 서로 다를 수 있다.
      선택지 2: 프레임(frame)은 주기억장치를 페이지와 같은 크기로 나눈 영역으로, 프로그램이 아니라 주기억장치를 나눈 단위이다.
      선택지 3: 파티션(partition)은 다중 프로그래밍에서 주기억장치를 여러 영역으로 분할한 것으로, 가상기억장치의 프로그램 분할 단위가 아니다.
      선택지 4: 페이지(page)는 페이징 기법에서 프로그램(가상 주소 공간)을 동일한 크기로 나눈 단위이므로 정답이다.

      핵심 개념:
      가상기억장치 구현 기법에는 페이징과 세그먼테이션이 있다.
      페이징은 프로그램을 동일한 크기의 페이지로, 주기억장치를 같은 크기의 프레임으로 나눈다.
      세그먼테이션은 프로그램을 크기가 다른 논리적 단위인 세그먼트로 나눈다.
      페이지 테이블은 페이지와 프레임의 대응 관계를 저장한다.

  - id: t04-07
    type: multiple-choice
    prompt: 프로세스가 도착한 순서대로 CPU가 할당되지만, CPU의 시간 할당량 또는 시간 간격에 의해 제한하는 방식은 무엇인가?
    choices:
      - { id: '1', text: 'RR 스케줄링 기법' }
      - { id: '2', text: 'HRN 스케줄링 기법' }
      - { id: '3', text: 'MFQ 스케줄링 기법' }
      - { id: '4', text: 'SCAN 스케줄링 기법' }
    answers: ['1']
    explanation: |
      선택지 1: RR(Round Robin) 스케줄링은 도착 순서대로 CPU를 할당하되 각 프로세스가 정해진 시간 할당량(time quantum)만큼만 사용하고, 시간이 끝나면 대기 큐의 맨 뒤로 보내는 방식이므로 정답이다.
      선택지 2: HRN(Highest Response ratio Next) 스케줄링은 (대기 시간 + 서비스 시간) / 서비스 시간으로 계산한 응답률이 가장 높은 프로세스를 먼저 실행하는 방식으로, 도착 순서 기준이 아니다.
      선택지 3: MFQ(Multi-level Feedback Queue) 스케줄링은 우선순위가 다른 여러 단계의 큐를 두고 프로세스의 실행 특성에 따라 큐 사이를 이동시키는 방식이다.
      선택지 4: SCAN 스케줄링은 프로세스 스케줄링이 아니라 디스크 헤드의 이동 방향에 따라 요청을 서비스하는 디스크 스케줄링 기법이다.

      핵심 개념:
      RR 스케줄링은 FCFS(First Come First Served)에 시간 할당량을 더한 선점형 스케줄링이다.
      시간 할당량이 너무 크면 FCFS와 같아지고, 너무 작으면 문맥 교환 오버헤드가 커진다.
      시분할처리 시스템에 적합하다.
      HRN은 대기 시간이 길수록 우선순위가 높아져 기아 상태를 줄인다.

  - id: t04-08
    type: multiple-choice
    prompt: 병행 프로세스의 비동기성으로 인해 발생하는 문제들을 해결하기 위한 방법으로, 하나의 프로세스가 공유 데이터의 사용을 완료할 때까지 다른 프로세스의 공유 데이터 접근을 금지하는 제어 기법은 무엇인가?
    choices:
      - { id: '1', text: '동기화' }
      - { id: '2', text: '임계영역' }
      - { id: '3', text: '교착상태' }
      - { id: '4', text: '상호배제' }
    answers: ['4']
    explanation: |
      선택지 1: 동기화(synchronization)는 병행 프로세스들이 실행 순서를 맞추어 협력하도록 하는 기법으로, 한 프로세스의 공유 데이터 사용 중 다른 프로세스의 접근을 금지하는 것 자체를 가리키지는 않는다.
      선택지 2: 임계영역(critical section)은 공유 데이터에 접근하는 프로그램 코드 부분을 가리키는 말로, 제어 기법이 아니라 보호 대상 영역이다.
      선택지 3: 교착상태는 프로세스들이 서로 상대가 가진 자원을 기다리며 진행하지 못하는 문제 상황으로, 해결 기법이 아니다.
      선택지 4: 상호배제(mutual exclusion)는 한 프로세스가 공유 데이터를 사용하는 동안 다른 프로세스가 그 데이터에 접근하지 못하게 하는 제어 기법이므로 정답이다.

      핵심 개념:
      병행 프로세스는 비동기적으로 실행되므로 공유 데이터를 동시에 변경하면 결과가 잘못될 수 있다.
      임계영역은 공유 데이터를 접근하는 코드 부분이다.
      상호배제는 한 번에 하나의 프로세스만 임계영역에 들어가도록 보장한다.
      세마포어, 모니터 등이 상호배제와 동기화를 구현하는 도구이다.

  - id: t04-09
    type: multiple-choice
    prompt: 다음의 프로세스 스케줄링 기법 중에서 먼저 도착한 디스크 접근 요청이 가장 먼저 서비스를 받는 기법은 어느 것인가?
    choices:
      - { id: '1', text: 'RR 스케줄링 기법' }
      - { id: '2', text: 'MFQ 스케줄링 기법' }
      - { id: '3', text: 'SRT 스케줄링 기법' }
      - { id: '4', text: 'FCFS 스케줄링 기법' }
    answers: ['4']
    explanation: |
      선택지 1: RR(Round Robin) 스케줄링은 도착 순서대로 할당하되 시간 할당량이 끝나면 CPU를 빼앗아 다음 프로세스에 넘기므로, 먼저 도착한 요청이 끝까지 먼저 서비스된다고 할 수 없다.
      선택지 2: MFQ(Multi-level Feedback Queue) 스케줄링은 여러 단계의 우선순위 큐 사이를 이동시키는 방식으로, 도착 순서만으로 서비스 순서가 정해지지 않는다.
      선택지 3: SRT(Shortest Remaining Time) 스케줄링은 남은 실행 시간이 가장 짧은 프로세스를 먼저 실행하는 선점형 방식으로, 도착 순서 기준이 아니다.
      선택지 4: FCFS(First Come First Served) 스케줄링은 먼저 도착한 요청을 먼저 서비스하는 가장 단순한 방식으로, 프로세스 스케줄링과 디스크 스케줄링 모두에 쓰이므로 정답이다.

      핵심 개념:
      FCFS는 요청이 도착한 순서대로 서비스하는 비선점 방식이다.
      구현이 간단하고 공평하지만, 긴 작업 뒤의 짧은 작업이 오래 기다릴 수 있다.
      FCFS는 CPU 스케줄링과 디스크 스케줄링 모두에 적용된다.
      RR은 FCFS에 시간 할당량을 추가한 방식이고, SRT는 SJF(Shortest Job First)의 선점형 방식이다.

  - id: t04-10
    type: multiple-choice
    prompt: 다중 프로그래밍 시스템에서 프로세스가 아무리 기다려도 결코 발생하지 않을 사건을 기다리고 있는 상황으로 제한된 자원에 대한 공유와 병행처리로 인해 발생하는 문제는 무엇인가?
    choices:
      - { id: '1', text: '임계영역' }
      - { id: '2', text: '동기화' }
      - { id: '3', text: '교착상태' }
      - { id: '4', text: '상호배제' }
    answers: ['3']
    explanation: |
      선택지 1: 임계영역은 공유 데이터에 접근하는 프로그램 코드 부분으로, 문제 상황이 아니다.
      선택지 2: 동기화는 병행 프로세스가 실행 순서를 맞추어 협력하도록 하는 기법으로, 문제 상황이 아니라 해결 방법이다.
      선택지 3: 교착상태(deadlock)는 프로세스들이 서로 상대가 점유한 자원을 기다리며 결코 일어나지 않을 사건을 무한히 기다리는 상황으로, 제한된 자원의 공유와 병행처리로 인해 발생하므로 정답이다.
      선택지 4: 상호배제는 한 번에 하나의 프로세스만 공유 자원을 사용하게 하는 제어 기법으로, 문제 상황이 아니다.

      핵심 개념:
      교착상태는 둘 이상의 프로세스가 서로의 자원을 기다리며 영원히 진행하지 못하는 상태이다.
      상호배제, 점유와 대기, 비선점, 원형 대기의 네 조건이 동시에 성립할 때 발생한다.
      해결 방법에는 예방, 회피, 탐지, 회복이 있다.
      회피 기법의 대표적인 예는 은행원 알고리즘이다.

  - id: t05-01
    type: multiple-choice
    prompt: 다음 중 시스템 버스에 포함되지 ==않는== 것은?
    choices:
      - { id: '1', text: '상태 버스' }
      - { id: '2', text: '데이터 버스' }
      - { id: '3', text: '주소 버스' }
      - { id: '4', text: '제어 버스' }
    answers: ['1']
    explanation: |
      선택지 1: 시스템 버스를 구성하는 버스 종류에 상태 버스는 없다. 장치의 상태 정보는 별도 버스가 아니라 제어 버스의 신호나 상태 레지스터를 통해 전달되므로 정답이다.
      선택지 2: 데이터 버스는 CPU(Central Processing Unit, 중앙처리장치)와 기억장치·입출력장치 사이에서 실제 데이터를 주고받는 통로로 시스템 버스에 포함된다.
      선택지 3: 주소 버스는 CPU가 접근할 기억장치 위치나 입출력장치의 주소를 전달하는 통로로 시스템 버스에 포함된다.
      선택지 4: 제어 버스는 읽기·쓰기·인터럽트 등 동작을 지시하는 제어 신호를 전달하는 통로로 시스템 버스에 포함된다.

      핵심 개념:
      시스템 버스는 CPU, 주기억장치, 입출력장치를 연결해 정보를 교환하는 공용 통로이다.
      전달하는 정보의 종류에 따라 데이터 버스, 주소 버스, 제어 버스의 세 가지로 구분한다.
      주소 버스는 위치, 데이터 버스는 내용, 제어 버스는 동작 신호를 전달한다.
      주소 버스는 CPU에서 나가는 단방향, 데이터 버스는 양방향으로 동작한다.

  - id: t05-02
    type: multiple-choice
    prompt: 다음 회로에 대해서 출력이 0이 되는 입력은?
    images:
      - path: images/subjects/introduction-to-computer-science/textbook/t05-02.png
        alt: 'X와 Y가 XOR 게이트에 입력되고, 그 출력과 Z가 OR 게이트에 입력되어 F를 출력하는 회로'
    choices:
      - id: '1'
        text: ''
        diagram:
          type: data-table
          columns: ['X', 'Y', 'Z']
          rows:
            - ['0', '0', '1']
      - id: '2'
        text: ''
        diagram:
          type: data-table
          columns: ['X', 'Y', 'Z']
          rows:
            - ['0', '1', '1']
      - id: '3'
        text: ''
        diagram:
          type: data-table
          columns: ['X', 'Y', 'Z']
          rows:
            - ['1', '0', '0']
      - id: '4'
        text: ''
        diagram:
          type: data-table
          columns: ['X', 'Y', 'Z']
          rows:
            - ['1', '1', '0']
    answers: ['4']
    explanation: |
      선택지 1: $X \oplus Y = 0 \oplus 0 = 0$이지만 $Z = 1$이므로 $F = 0 + 1 = 1$이다.
      선택지 2: $X \oplus Y = 0 \oplus 1 = 1$이고 $Z = 1$이므로 $F = 1 + 1 = 1$이다.
      선택지 3: $X \oplus Y = 1 \oplus 0 = 1$이므로 $Z = 0$이어도 $F = 1 + 0 = 1$이다.
      선택지 4: $X \oplus Y = 1 \oplus 1 = 0$이고 $Z = 0$이므로 $F = 0 + 0 = 0$이 되어 정답이다.

      핵심 개념:
      앞단 게이트는 입력 쪽에 곡선이 한 줄 더 있는 XOR(exclusive OR, 배타적 논리합) 게이트, 뒷단은 OR 게이트이다.
      따라서 회로의 출력은 $F = (X \oplus Y) + Z$이다.
      OR의 출력이 0이 되려면 두 입력이 모두 0이어야 하므로 $Z = 0$이고 $X \oplus Y = 0$이어야 한다.
      XOR은 두 입력이 같을 때 0이므로 $X = Y$이고 $Z = 0$인 입력(000, 110)에서만 $F = 0$이다.

  - id: t05-03
    type: multiple-choice
    prompt: 다음 중 플립플롭을 사용하는 논리회로는?
    choices:
      - { id: '1', text: '멀티플렉서' }
      - { id: '2', text: '디코더' }
      - { id: '3', text: '카운터' }
      - { id: '4', text: '전가산기' }
    answers: ['3']
    explanation: |
      선택지 1: 멀티플렉서는 선택 신호에 따라 여러 입력 중 하나를 출력으로 내보내는 조합회로로, 기억 소자인 플립플롭이 필요 없다.
      선택지 2: 디코더는 $n$비트 입력을 해독해 $2^n$개 출력 중 하나만 1로 만드는 조합회로로, 현재 입력만으로 출력이 정해진다.
      선택지 3: 카운터는 입력 펄스가 들어올 때마다 저장된 값을 차례로 바꾸는 순서회로로, 현재 상태를 기억하기 위해 플립플롭을 사용하므로 정답이다.
      선택지 4: 전가산기는 두 비트와 아래 자리 올림수를 더해 합과 올림수를 내는 조합회로로, 상태를 저장하지 않는다.

      핵심 개념:
      논리회로는 조합회로와 순서회로로 나뉜다.
      조합회로(멀티플렉서, 디코더, 인코더, 가산기 등)는 현재 입력만으로 출력이 결정된다.
      순서회로(레지스터, 카운터 등)는 현재 입력과 저장된 상태에 따라 출력이 결정된다.
      순서회로는 1비트 기억 소자인 플립플롭으로 상태를 저장한다.

  - id: t05-04
    type: multiple-choice
    prompt: RS 플립플롭에서 출력값이 변하지 않고 현재의 상태를 그대로 유지시키기 위한 입력값의 구성으로 올바른 것은?
    choices:
      - id: '1'
        text: ''
        diagram:
          type: data-table
          columns: ['R', 'S']
          rows:
            - ['0', '0']
      - id: '2'
        text: ''
        diagram:
          type: data-table
          columns: ['R', 'S']
          rows:
            - ['0', '1']
      - id: '3'
        text: ''
        diagram:
          type: data-table
          columns: ['R', 'S']
          rows:
            - ['1', '0']
      - id: '4'
        text: ''
        diagram:
          type: data-table
          columns: ['R', 'S']
          rows:
            - ['1', '1']
    answers: ['1']
    explanation: |
      선택지 1: R = 0, S = 0이면 리셋과 셋 어느 쪽도 요구하지 않으므로 출력이 이전 상태 $Q$를 그대로 유지해 정답이다.
      선택지 2: R = 0, S = 1은 셋(set) 입력으로, 이전 상태와 관계없이 출력 $Q$를 1로 만든다.
      선택지 3: R = 1, S = 0은 리셋(reset) 입력으로, 이전 상태와 관계없이 출력 $Q$를 0으로 만든다.
      선택지 4: R = 1, S = 1은 셋과 리셋을 동시에 요구하는 입력으로, 출력이 정의되지 않아 사용하지 않는 금지 입력이다.

      핵심 개념:
      RS 플립플롭은 S(Set)와 R(Reset) 두 입력으로 1비트 상태를 저장하는 기억 소자이다.
      S = 0, R = 0이면 상태 유지, S = 1, R = 0이면 1로 셋, S = 0, R = 1이면 0으로 리셋된다.
      S = 1, R = 1은 출력이 부정(불확정)이 되므로 허용되지 않는다.
      이 금지 입력 문제를 해결한 것이 JK 플립플롭이다.

  - id: t05-05
    type: multiple-choice
    passageRefs: [gt05-decoder-desc-01]
    prompt: 다음 설명에 해당하는 논리회로는?
    choices:
      - { id: '1', text: '멀티플렉서' }
      - { id: '2', text: '카운터' }
      - { id: '3', text: '레지스터' }
      - { id: '4', text: '디코더' }
    answers: ['4']
    explanation: |
      선택지 1: 멀티플렉서는 $2^n$개의 입력 중 $n$개의 선택 신호로 하나를 골라 단일 출력으로 내보내는 회로로, 입력과 출력의 관계가 설명과 반대이다.
      선택지 2: 카운터는 입력 펄스 수를 세어 저장값을 차례로 바꾸는 순서회로로, 하나의 출력만 1이 되는 해독 기능과 관계없다.
      선택지 3: 레지스터는 여러 개의 플립플롭으로 여러 비트의 데이터를 임시 저장하는 순서회로이다.
      선택지 4: 디코더는 $n$비트 입력을 해독해 최대 $2^n$개의 출력선 중 입력값에 해당하는 하나만 1로 만들고 나머지는 0으로 만드는 조합회로이므로 정답이다.

      핵심 개념:
      디코더(해독기)는 $n$개의 입력으로 최대 $2^n$개의 출력 중 하나를 활성화하는 조합회로이다.
      예를 들어 2×4 디코더는 입력 00, 01, 10, 11에 따라 네 출력 중 하나만 1이 된다.
      인코더는 디코더의 반대 기능을 하여 $2^n$개 입력 중 활성화된 하나를 $n$비트 코드로 바꾼다.
      디코더는 레지스터 선택, 기억장치 주소 해독, 명령어 해독 등에 쓰인다.

  - id: t05-06
    type: multiple-choice
    prompt: 장치 4개가 하나의 데이터 전송 통로를 공유하고 있을 때 어떤 장치로부터 들어오는 데이터가 버스를 사용할 것인가를 정할 때 사용하는 논리회로는?
    choices:
      - { id: '1', text: '인코더' }
      - { id: '2', text: '멀티플렉서' }
      - { id: '3', text: '디코더' }
      - { id: '4', text: '디멀티플렉서' }
    answers: ['2']
    explanation: |
      선택지 1: 인코더는 $2^n$개 입력 중 활성화된 하나를 $n$비트 코드로 변환하는 회로로, 여러 장치의 데이터 중 하나를 통로로 내보내는 선택 기능은 없다.
      선택지 2: 멀티플렉서는 선택 신호에 따라 여러 입력 중 하나를 골라 하나의 출력선으로 보내는 회로이다. 4개 장치의 데이터 중 버스를 사용할 하나를 고르는 데 쓰이므로 정답이다.
      선택지 3: 디코더는 $n$비트 입력을 해독해 $2^n$개 출력 중 하나만 1로 만드는 회로로, 데이터를 선택해 전달하는 회로가 아니다.
      선택지 4: 디멀티플렉서는 하나의 입력을 선택 신호에 따라 여러 출력 중 하나로 분배하는 회로로, 멀티플렉서와 방향이 반대이다.

      핵심 개념:
      멀티플렉서(MUX, multiplexer)는 $2^n$개의 입력선 중 $n$개의 선택선으로 하나를 골라 출력하는 데이터 선택기이다.
      장치 4개면 선택선 2개로 버스를 사용할 장치를 정할 수 있다.
      여러 장치가 하나의 버스를 공유할 때 버스 사용 장치를 결정하는 데 쓰인다.
      디멀티플렉서는 한 입력을 여러 출력 중 하나로 보내는 데이터 분배기이다.

  - id: t05-07
    type: multiple-choice
    prompt: ROM은 개념적으로 하나의 디코더와 여러 개의 논리 게이트를 사용해서 구현될 수 있다. 이때 사용되는 논리 게이트는 어느 것인가?
    choices:
      - id: '1'
        text: ''
        image:
          path: images/subjects/introduction-to-computer-science/textbook/t05-07-choice-1.png
          alt: '선택지 1 논리 게이트 기호'
      - id: '2'
        text: ''
        image:
          path: images/subjects/introduction-to-computer-science/textbook/t05-07-choice-2.png
          alt: '선택지 2 논리 게이트 기호'
      - id: '3'
        text: ''
        image:
          path: images/subjects/introduction-to-computer-science/textbook/t05-07-choice-3.png
          alt: '선택지 3 논리 게이트 기호'
      - id: '4'
        text: ''
        image:
          path: images/subjects/introduction-to-computer-science/textbook/t05-07-choice-4.png
          alt: '선택지 4 논리 게이트 기호'
    answers: ['3']
    explanation: |
      선택지 1: 입력 쪽이 직선이고 출력 쪽이 반원인 AND 게이트 기호이다. AND는 모든 입력이 1일 때만 1을 내므로 디코더 출력들을 모아 해당 비트를 만드는 ROM 구조에 쓰이지 않는다.
      선택지 2: OR 게이트 몸체 앞에 곡선이 한 줄 더 있는 XOR(exclusive OR, 배타적 논리합) 게이트 기호이다. XOR은 두 입력이 서로 다를 때 1을 내는 게이트로, 디코더 출력선들을 모아 저장 비트를 만드는 ROM의 개념적 구조(디코더 + OR 게이트)에 쓰이는 게이트가 아니다.
      선택지 3: 입력 쪽이 오목한 곡선인 OR 게이트 기호이다. ROM은 디코더가 주소에 해당하는 출력선 하나만 1로 만들고, 각 출력 비트의 OR 게이트가 연결된 디코더 출력선들을 모아 저장값을 내므로 정답이다.
      선택지 4: 입력이 하나이고 끝에 부정 원이 붙은 NOT 게이트 기호로, 입력을 반전할 뿐 여러 디코더 출력을 모으지 못한다.

      핵심 개념:
      ROM(Read Only Memory)은 개념적으로 디코더와 OR 게이트들로 구성된다.
      $n$비트 주소가 디코더에 들어가면 $2^n$개 출력선 중 해당 주소의 선 하나만 1이 된다.
      각 출력 비트마다 OR 게이트가 있고, 그 비트가 1이어야 하는 주소의 디코더 출력선이 OR 게이트 입력에 연결된다.
      따라서 연결 패턴 자체가 저장된 데이터가 되며, 이 연결은 제조 시 고정된다.

  - id: t05-08
    type: multiple-choice
    prompt: 기억장치의 계층구조에서 주로 정적 RAM(SRAM)을 사용하는 소량 기억장치에 해당하는 것은?
    images:
      - path: images/subjects/introduction-to-computer-science/textbook/t05-08.png
        alt: '위로 갈수록 속도 상승, 가격 상승, 용량 감소를 나타내는 화살표와 아래부터 A, B, C, D 순으로 쌓인 기억장치 계층 피라미드'
    choices:
      - { id: '1', text: 'A' }
      - { id: '2', text: 'B' }
      - { id: '3', text: 'C' }
      - { id: '4', text: 'D' }
    answers: ['3']
    explanation: |
      선택지 1: A는 피라미드 맨 아래로 가장 느리고 용량이 큰 보조기억장치(하드디스크, SSD(Solid State Drive) 등)에 해당한다.
      선택지 2: B는 주기억장치에 해당하며, 주기억장치는 주로 동적 RAM(DRAM, Dynamic RAM)으로 구성된다.
      선택지 3: C는 레지스터 바로 아래 계층인 캐시 기억장치에 해당한다. 캐시는 빠른 접근을 위해 정적 RAM(SRAM, Static Random Access Memory)으로 만든 소량 기억장치이므로 정답이다.
      선택지 4: D는 피라미드 꼭대기로 CPU(Central Processing Unit, 중앙처리장치) 내부의 레지스터에 해당하며, 캐시보다 더 빠르고 용량이 더 작다.

      핵심 개념:
      기억장치 계층구조는 위에서부터 레지스터, 캐시 기억장치, 주기억장치, 보조기억장치 순이다.
      위로 갈수록 속도와 비트당 가격이 올라가고 용량은 줄어든다.
      캐시는 SRAM으로 만들어 주기억장치(DRAM)와 CPU의 속도 차이를 줄인다.
      SRAM은 재충전이 필요 없어 빠르지만 집적도가 낮고 비싸 소량으로만 사용된다.

  - id: t05-09
    type: multiple-choice
    prompt: 스택 구조의 컴퓨터에서 사용되며 연산 속도가 가장 빠른 명령어 형식은?
    choices:
      - { id: '1', text: '0-주소 명령어' }
      - { id: '2', text: '1-주소 명령어' }
      - { id: '3', text: '2-주소 명령어' }
      - { id: '4', text: '3-주소 명령어' }
    answers: ['1']
    explanation: |
      선택지 1: 0-주소 명령어는 주소 필드 없이 연산 코드만 가지며, 피연산자를 스택의 top에서 꺼내고 결과를 다시 스택에 넣는다. 스택 구조 컴퓨터에서 쓰이고 주소 해석이 없어 연산 속도가 가장 빠르므로 정답이다.
      선택지 2: 1-주소 명령어는 하나의 주소 필드와 누산기(AC, accumulator)를 사용하는 누산기 구조 컴퓨터의 형식이다.
      선택지 3: 2-주소 명령어는 두 개의 주소 필드를 가지며 범용 레지스터 구조에서 흔히 쓰인다. 한 피연산자 위치에 결과를 저장한다.
      선택지 4: 3-주소 명령어는 두 피연산자와 결과 저장 위치를 모두 명시하는 형식으로, 프로그램 길이는 짧아지지만 명령어가 길고 주소 해석이 많다.

      핵심 개념:
      명령어 형식은 주소 필드의 개수에 따라 0-주소, 1-주소, 2-주소, 3-주소 명령어로 나뉜다.
      0-주소 명령어는 스택, 1-주소 명령어는 누산기, 2·3-주소 명령어는 범용 레지스터 구조에서 사용된다.
      0-주소 명령어는 피연산자를 스택에서 암묵적으로 가져오므로 명령어가 짧고 수행이 빠르다.
      주소 필드가 많을수록 명령어 하나의 표현력은 커지지만 명령어 길이와 해석 부담이 늘어난다.

  - id: t05-10
    type: multiple-choice
    prompt: 주소지정방식 중에서 처리 속도가 가장 ==느린== 것은?
    choices:
      - { id: '1', text: '레지스터 주소지정방식' }
      - { id: '2', text: '간접 주소지정방식' }
      - { id: '3', text: '즉시 주소지정방식' }
      - { id: '4', text: '상대 주소지정방식' }
    answers: ['2']
    explanation: |
      선택지 1: 레지스터 주소지정방식은 피연산자가 CPU(Central Processing Unit, 중앙처리장치) 안의 레지스터에 있어 기억장치 접근 없이 처리되므로 빠르다.
      선택지 2: 간접 주소지정방식은 주소 필드가 가리키는 기억장치 위치에 다시 실제 피연산자의 주소가 들어 있어, 피연산자를 얻기까지 기억장치를 두 번 이상 접근해야 하므로 가장 느려 정답이다.
      선택지 3: 즉시 주소지정방식은 피연산자 값이 명령어의 주소 필드에 직접 들어 있어 기억장치 접근이 필요 없으므로 가장 빠르다.
      선택지 4: 상대 주소지정방식은 프로그램 카운터 값에 주소 필드 값을 더해 유효 주소를 구하고 기억장치를 한 번 접근하므로 간접 방식보다 빠르다.

      핵심 개념:
      주소지정방식은 명령어의 주소 필드로부터 피연산자의 실제 위치(유효 주소)를 구하는 방법이다.
      즉시 방식은 기억장치 접근 0회, 직접·상대·인덱스 방식은 1회, 간접 방식은 2회 이상 접근한다.
      기억장치 접근 횟수가 많을수록 처리 속도가 느려진다.
      간접 방식은 느리지만 짧은 주소 필드로 넓은 기억공간을 지정할 수 있는 장점이 있다.

  - id: t05-11
    type: multiple-choice
    prompt: 처리장치에서 디코더가 사용되는 곳은?
    choices:
      - { id: '1', text: '상태 레지스터 출력' }
      - { id: '2', text: '산술논리연산장치의 입력 레지스터 선택' }
      - { id: '3', text: '사용할 레지스터 선택' }
      - { id: '4', text: '시프트 선택' }
    answers: ['3']
    explanation: |
      선택지 1: 상태 레지스터는 연산 결과의 부호, 자리올림, 0 여부 등 상태 비트를 저장해 출력하는 레지스터로, 디코더로 해독하는 대상이 아니다.
      선택지 2: 산술논리연산장치(ALU, Arithmetic Logic Unit)의 입력으로 들어갈 레지스터 값을 고르는 일은 여러 레지스터 출력 중 하나를 선택하는 멀티플렉서가 담당한다.
      선택지 3: 처리장치에서는 레지스터 번호를 디코더로 해독해 결과를 저장할 레지스터 하나만 활성화한다. 디코더 출력 중 하나만 1이 되는 성질로 사용할 레지스터를 선택하므로 정답이다.
      선택지 4: 시프트 연산의 종류(좌·우 이동, 이동 안 함)를 고르는 것은 시프터 내부의 멀티플렉서가 선택 신호에 따라 처리한다.

      핵심 개념:
      처리장치는 레지스터 세트, 산술논리연산장치, 시프터와 이들을 연결하는 버스로 구성된다.
      여러 레지스터의 값 중 하나를 버스나 ALU 입력으로 내보낼 때는 멀티플렉서를 사용한다.
      연산 결과를 받을 레지스터를 지정할 때는 디코더가 레지스터 번호를 해독해 하나의 레지스터만 적재 가능하게 한다.
      디코더는 $n$비트 입력으로 $2^n$개 출력 중 하나만 1로 만드는 조합회로이다.

  - id: t05-12
    type: multiple-choice
    prompt: 제어장치의 명령어 사이클을 올바르게 나열한 것은?
    choices:
      - { id: '1', text: '인출 – 실행 – 해독 – 저장' }
      - { id: '2', text: '인출 – 해독 – 실행 – 저장' }
      - { id: '3', text: '해독 – 인출 – 실행 – 저장' }
      - { id: '4', text: '해독 – 실행 – 인출 – 저장' }
    answers: ['2']
    explanation: |
      선택지 1: 명령어를 해독하기 전에는 어떤 연산을 할지 알 수 없으므로 실행이 해독보다 먼저 올 수 없다.
      선택지 2: 기억장치에서 명령어를 가져오고(인출), 무슨 명령인지 분석한 뒤(해독), 연산을 수행하고(실행), 결과를 기록하는(저장) 순서이므로 정답이다.
      선택지 3: 해독할 명령어가 CPU(Central Processing Unit, 중앙처리장치) 안에 들어와 있어야 해독할 수 있으므로 인출이 해독보다 먼저 와야 한다.
      선택지 4: 해독과 실행이 인출보다 앞서 있어, 가져오지도 않은 명령어를 분석·수행하는 순서가 되므로 틀렸다.

      핵심 개념:
      명령어 사이클은 CPU가 명령어 하나를 처리하는 일련의 과정이다.
      인출 단계에서는 프로그램 카운터(PC)가 가리키는 명령어를 기억장치에서 명령어 레지스터(IR)로 가져온다.
      해독 단계에서는 명령어 해독기가 연산 코드를 분석하고, 실행 단계에서는 해당 연산을 수행한다.
      저장 단계에서는 결과를 레지스터나 기억장치에 기록하고 다음 명령어의 인출로 넘어간다.

  - id: t05-13
    type: multiple-choice
    prompt: 다음 그림에서 A에 해당하는 제어장치의 구성요소는?
    images:
      - path: images/subjects/introduction-to-computer-science/textbook/t05-13.png
        alt: '주기억장치, A, B, C, D, 명령어 해독기/주소결정회로, 제어기억장치(ROM), 처리장치가 제어선과 데이터선으로 연결된 중앙처리장치 제어장치 구성도'
    choices:
      - { id: '1', text: 'PC' }
      - { id: '2', text: 'MBR' }
      - { id: '3', text: 'CMDR' }
      - { id: '4', text: 'IR' }
    answers: ['1']
    explanation: |
      선택지 1: A는 주기억장치로 제어선(점선)을 보내 인출할 명령어의 위치를 지정하는 요소이다. 다음에 실행할 명령어의 주소를 가지고 주기억장치에 제공하는 PC(Program Counter, 프로그램 카운터)이므로 정답이다.
      선택지 2: MBR(Memory Buffer Register, 메모리 버퍼 레지스터)은 기억장치에서 읽거나 기억장치에 쓸 데이터를 임시로 보관하는 레지스터로, 주소를 지정하는 A의 역할과 다르다.
      선택지 3: CMDR(Control Memory Data Register, 제어기억장치 데이터 레지스터)은 제어기억장치(ROM)에서 읽은 제어단어를 보관해 처리장치로 제어 신호를 보내는 요소로, 그림의 D에 해당한다.
      선택지 4: IR(Instruction Register, 명령어 레지스터)은 주기억장치에서 인출된 명령어(데이터선)를 받아 명령어 해독기로 넘기는 요소로, 그림의 B에 해당한다.

      핵심 개념:
      마이크로프로그램 방식 제어장치는 PC, IR, 명령어 해독기/주소결정회로, CMAR, 제어기억장치, CMDR로 구성된다.
      PC가 가리키는 주소의 명령어를 주기억장치에서 읽어 IR에 저장한다.
      명령어 해독기/주소결정회로는 IR의 명령어를 해석해 해당 마이크로프로그램의 주소를 CMAR(Control Memory Address Register, 그림의 C)에 넣는다.
      제어기억장치에서 읽은 제어단어는 CMDR(그림의 D)을 거쳐 처리장치에 제어 신호로 전달된다.

  - id: t05-14
    type: multiple-choice
    prompt: 프로그램 수행 중에 기억장치로부터 인출되어 현재 실행 중인 명령어를 저장하고 있는 레지스터는?
    choices:
      - { id: '1', text: '메모리 버퍼 레지스터' }
      - { id: '2', text: '프로그램 카운터' }
      - { id: '3', text: '인덱스 레지스터' }
      - { id: '4', text: '명령어 레지스터' }
    answers: ['4']
    explanation: |
      선택지 1: 메모리 버퍼 레지스터(MBR, Memory Buffer Register)는 기억장치와 주고받는 데이터를 임시 보관하는 레지스터로, 인출된 명령어가 거쳐 가지만 실행 중인 명령어를 유지하는 곳은 아니다.
      선택지 2: 프로그램 카운터(PC, Program Counter)는 다음에 인출할 명령어의 주소를 저장하는 레지스터로, 명령어 자체를 저장하지 않는다.
      선택지 3: 인덱스 레지스터는 인덱스 주소지정방식에서 기준 주소에 더할 변위 값을 저장하는 레지스터이다.
      선택지 4: 명령어 레지스터(IR, Instruction Register)는 기억장치에서 인출된 명령어를 저장해 해독·실행하는 동안 유지하는 레지스터이므로 정답이다.

      핵심 개념:
      제어장치와 관련된 주요 레지스터는 역할에 따라 구분된다.
      PC는 다음 명령어의 주소, IR은 현재 실행 중인 명령어, MAR(Memory Address Register)은 접근할 기억장치 주소를 저장한다.
      MBR은 기억장치에서 읽거나 쓸 데이터를 임시 저장한다.
      인출 단계에서 PC의 주소가 MAR로 전달되고, 읽힌 명령어가 MBR을 거쳐 IR에 저장된다.

  - id: t05-15
    type: multiple-choice
    prompt: 입출력 제어 방식 중에서 중앙처리장치와 같이 연산 작업도 수행 가능한 별도의 입출력 프로세서를 사용하는 방식은?
    choices:
      - { id: '1', text: '프로그램에 의한 방식' }
      - { id: '2', text: 'DMA에 의한 방식' }
      - { id: '3', text: '인터럽트에 의한 방식' }
      - { id: '4', text: '채널에 의한 방식' }
    answers: ['4']
    explanation: |
      선택지 1: 프로그램에 의한 방식은 CPU(Central Processing Unit, 중앙처리장치)가 입출력장치의 상태를 계속 확인하며 데이터 전송을 직접 수행하는 방식으로, 별도 프로세서가 없다.
      선택지 2: DMA(Direct Memory Access, 직접 기억장치 접근)에 의한 방식은 DMA 제어기가 CPU 대신 기억장치와 입출력장치 사이의 블록 전송을 수행하지만, 연산 작업을 수행하는 프로세서는 아니다.
      선택지 3: 인터럽트에 의한 방식은 입출력장치가 준비되면 인터럽트로 CPU에 알리고 CPU가 전송을 처리하는 방식으로, 별도 입출력 프로세서를 쓰지 않는다.
      선택지 4: 채널에 의한 방식은 입출력 명령어를 스스로 해석·실행하고 연산도 수행할 수 있는 입출력 전용 프로세서(채널)를 두어 CPU 개입 없이 입출력을 처리하므로 정답이다.

      핵심 개념:
      입출력 제어 방식은 CPU의 개입 정도에 따라 프로그램, 인터럽트, DMA, 채널 방식으로 발전해 왔다.
      프로그램·인터럽트 방식은 CPU가 데이터를 직접 옮기므로 CPU 부담이 크다.
      DMA 방식은 전용 제어기가 기억장치에 직접 접근해 블록 단위로 전송한다.
      채널 방식은 CPU처럼 명령을 실행할 수 있는 입출력 프로세서가 여러 입출력 작업을 독립적으로 관리한다.

  - id: t05-16
    type: multiple-choice
    prompt: 컴퓨터의 실행 주기 동안에 여러 단계를 서로 겹치게 함으로써 실행 속도를 직접적으로 향상시키지 않고도 컴퓨터의 처리율을 증가시킬 수 있는 기술은?
    choices:
      - { id: '1', text: '멀티코어' }
      - { id: '2', text: '파이프라이닝' }
      - { id: '3', text: 'GPGPU' }
      - { id: '4', text: '오버래핑' }
    answers: ['2']
    explanation: |
      선택지 1: 멀티코어는 하나의 칩에 여러 개의 처리 코어를 넣어 여러 작업을 동시에 병렬 처리하는 기술로, 한 명령어 흐름의 실행 단계를 겹치는 기술이 아니다.
      선택지 2: 파이프라이닝은 명령어 처리를 인출·해독·실행 등 여러 단계로 나누고 각 단계를 서로 다른 명령어가 동시에 수행하도록 겹쳐, 명령어 하나의 실행 시간은 그대로 두고 단위 시간당 처리량을 늘리므로 정답이다.
      선택지 3: GPGPU(General-Purpose computing on Graphics Processing Units)는 그래픽 처리 장치를 그래픽 이외의 일반 계산에 활용해 대량 병렬 연산을 수행하는 기술이다.
      선택지 4: 오버래핑은 겹친다는 일반적 의미의 용어일 뿐, 실행 주기의 단계를 나누어 겹치는 기법을 가리키는 교재의 기술 명칭은 파이프라이닝이다.

      핵심 개념:
      파이프라이닝은 명령어 실행 과정을 여러 단계로 나누어 공장의 조립 라인처럼 겹쳐 처리하는 기법이다.
      각 명령어의 실행 시간(지연 시간)은 줄지 않지만 매 클록마다 명령어가 하나씩 완료되어 처리율이 높아진다.
      $k$단계 파이프라인은 이상적으로 최대 $k$배의 처리율 향상을 얻는다.
      분기, 자료 의존성 등으로 파이프라인이 멈추는 해저드가 발생하면 성능 향상이 줄어든다.

  - id: t06-01
    type: multiple-choice
    prompt: 컴파일 과정 중에서 토큰들을 입력받아 결과로서 파스 트리를 생성하는 단계는?
    choices:
      - { id: '1', text: '어휘 분석 단계' }
      - { id: '2', text: '구문 분석 단계' }
      - { id: '3', text: '의미 분석 단계' }
      - { id: '4', text: '코드 생성 단계' }
    answers: ['2']
    explanation: |
      선택지 1: 어휘 분석 단계는 원시 프로그램의 문자열을 읽어 의미 있는 최소 단위인 토큰으로 분리하는 단계로, 토큰을 입력받는 것이 아니라 토큰을 만들어 낸다.
      선택지 2: 구문 분석 단계는 어휘 분석기가 만든 토큰들을 입력받아 문법 규칙에 맞는지 검사하고 그 구조를 파스 트리로 생성하므로 정답이다.
      선택지 3: 의미 분석 단계는 파스 트리를 바탕으로 자료형 일치, 선언 여부 등 문법만으로 검사할 수 없는 의미적 오류를 검사하는 단계이다.
      선택지 4: 코드 생성 단계는 분석 결과를 바탕으로 목적 기계에서 실행할 코드를 만들어 내는 단계이다.

      핵심 개념:
      컴파일러는 원시 프로그램을 어휘 분석, 구문 분석, 의미 분석, (중간 코드 생성·최적화), 코드 생성 순으로 처리한다.
      어휘 분석기(스캐너)는 문자열을 토큰으로 나눈다.
      구문 분석기(파서)는 토큰열이 문법에 맞는지 확인하고 파스 트리를 만든다.
      이후 단계는 파스 트리를 이용해 의미를 검사하고 목적 코드를 생성한다.

  - id: t06-02
    type: multiple-choice
    prompt: 다음 중 스크립트 언어에 해당되는 것은?
    choices:
      - { id: '1', text: '펄(Perl)' }
      - { id: '2', text: '리스프(LISP)' }
      - { id: '3', text: '프롤로그(Prolog)' }
      - { id: '4', text: 'HTML' }
    answers: ['1']
    explanation: |
      선택지 1: 펄(Perl)은 텍스트 처리와 시스템 관리 작업을 위해 만들어진 대표적인 스크립트 언어로, 인터프리터로 바로 실행되므로 정답이다.
      선택지 2: 리스프(LISP, LISt Processing)는 리스트 처리를 기반으로 하는 함수형 언어이다.
      선택지 3: 프롤로그(Prolog, PROgramming in LOGic)는 사실과 규칙으로 문제를 기술하고 추론으로 답을 구하는 논리형 언어이다.
      선택지 4: HTML(HyperText Markup Language)은 웹 문서의 구조를 태그로 표시하는 마크업 언어로, 프로그래밍 언어나 스크립트 언어로 분류하지 않는다.

      핵심 개념:
      스크립트 언어는 컴파일 과정 없이 인터프리터로 바로 실행되며, 다른 프로그램의 제어나 작업 자동화에 많이 쓰인다.
      펄, 파이썬, 자바스크립트, PHP 등이 대표적인 스크립트 언어이다.
      프로그래밍 언어는 패러다임에 따라 명령형, 객체지향형, 함수형(LISP), 논리형(Prolog) 등으로 구분한다.
      HTML처럼 문서 구조를 표시하는 언어는 마크업 언어로 따로 구분한다.

  - id: t06-03
    type: multiple-choice
    prompt: 다음 중 프로그램에 관한 접근 및 사용을 간소화하기 위한 방법이 ==아닌== 것은?
    choices:
      - { id: '1', text: '암호화' }
      - { id: '2', text: '추상화' }
      - { id: '3', text: '코드 숨기기' }
      - { id: '4', text: '캡슐화' }
    answers: ['1']
    explanation: |
      선택지 1: 암호화는 데이터를 제3자가 읽지 못하도록 변환하는 보안 기법으로, 프로그램을 쉽게 이해하고 사용하게 하는 방법이 아니므로 정답이다.
      선택지 2: 추상화는 복잡한 세부 사항은 감추고 핵심적인 기능과 개념만 드러내어 프로그램을 간단하게 다룰 수 있게 하는 방법이다.
      선택지 3: 코드 숨기기(정보 은닉)는 내부 구현을 외부에서 보지 못하게 하고 정해진 인터페이스로만 사용하게 하여 사용을 간소화하는 방법이다.
      선택지 4: 캡슐화는 데이터와 그 데이터를 다루는 함수를 하나의 단위로 묶어 외부에는 필요한 부분만 공개하는 방법이다.

      핵심 개념:
      프로그램의 복잡도를 줄이고 사용을 간소화하는 대표적 방법은 추상화, 캡슐화, 정보 은닉(코드 숨기기)이다.
      추상화는 핵심만 남기고 세부 사항을 제거한다.
      캡슐화는 관련 데이터와 연산을 하나로 묶고, 정보 은닉은 내부 구현을 외부로부터 감춘다.
      이 개념들은 객체지향 언어의 클래스 설계에서 특히 중요하게 쓰인다.

  - id: t06-04
    type: multiple-choice
    passageRefs: [gt06-lisp-code-01]
    prompt: 다음과 같은 프로그램이 속하는 언어 부류는 무엇인가?
    choices:
      - { id: '1', text: '객체지향형 언어' }
      - { id: '2', text: '명령형 언어' }
      - { id: '3', text: '논리형 언어' }
      - { id: '4', text: '함수형 언어' }
    answers: ['4']
    explanation: |
      선택지 1: 객체지향형 언어는 클래스와 객체, 메소드, 상속 등을 중심으로 프로그램을 구성하지만, 제시된 코드에는 그러한 요소가 없다.
      선택지 2: 명령형 언어는 변수에 값을 대입하고 반복문으로 상태를 바꾸어 가며 계산하지만, 제시된 코드는 대입문이나 반복문 없이 재귀 함수 호출로만 계산한다.
      선택지 3: 논리형 언어(Prolog 등)는 사실과 규칙을 선언하고 질의에 대해 추론하는 방식이며, 제시된 코드처럼 함수를 정의하고 값을 반환하지 않는다.
      선택지 4: 제시된 코드는 LISP(LISt Processing)로 작성된 함수로, DEFUN으로 함수를 정의하고 COND 조건식과 재귀 호출로 리스트의 길이를 계산한다. 함수의 적용과 조합으로 계산하는 함수형 언어이므로 정답이다.

      핵심 개념:
      함수형 언어는 수학의 함수처럼 입력을 받아 값을 돌려주는 함수의 정의와 적용으로 프로그램을 구성한다.
      대입문과 반복문 대신 재귀 호출을 주로 사용하며, LISP, Scheme, Haskell 등이 대표적이다.
      예시 코드는 리스트 lst가 비어 있으면(NULL) 0을, 그렇지 않으면 나머지 리스트(CDR lst)의 길이에 1을 더한 값을 돌려준다.
      LISP은 모든 프로그램과 데이터를 괄호로 둘러싼 리스트 형태로 표현한다.

  - id: t06-05
    type: multiple-choice
    prompt: 객체지향 언어에서 같은 속성과 함수를 갖는 객체들의 모임을 무엇이라고 하는가?
    choices:
      - { id: '1', text: '클래스' }
      - { id: '2', text: '바인딩' }
      - { id: '3', text: '메시지' }
      - { id: '4', text: '메소드' }
    answers: ['1']
    explanation: |
      선택지 1: 클래스는 같은 속성(데이터)과 함수(메소드)를 갖는 객체들을 묶어 정의한 틀로, 객체는 클래스의 인스턴스이므로 정답이다.
      선택지 2: 바인딩은 변수, 함수 호출 등의 프로그램 요소를 그 속성(자료형, 값, 실제 수행 코드 등)과 연결하는 것이다.
      선택지 3: 메시지는 한 객체가 다른 객체에게 특정 메소드를 수행하도록 요청하는 수단이다.
      선택지 4: 메소드는 객체가 수행할 수 있는 동작, 즉 클래스 안에 정의된 함수를 말한다.

      핵심 개념:
      객체지향 언어는 데이터와 그 데이터를 처리하는 함수를 하나로 묶은 객체를 중심으로 프로그램을 구성한다.
      클래스는 같은 속성과 메소드를 가진 객체들의 공통 틀이며, 객체는 클래스로부터 생성된 인스턴스이다.
      객체들은 메시지를 주고받아 서로의 메소드를 호출하며 협력한다.
      상속, 캡슐화, 다형성이 객체지향 언어의 주요 특징이다.

  - id: t06-06
    type: multiple-choice
    prompt: 형식문법의 파스 트리에서 중간 노드에 해당하는 것은?
    choices:
      - { id: '1', text: '단말 기호' }
      - { id: '2', text: '비단말 기호' }
      - { id: '3', text: '생성 규칙' }
      - { id: '4', text: '시작 기호' }
    answers: ['2']
    explanation: |
      선택지 1: 단말 기호는 더 이상 다른 기호로 바뀌지 않는 실제 문장 구성 기호로, 파스 트리의 잎(단말) 노드에 위치한다.
      선택지 2: 비단말 기호는 생성 규칙에 의해 다른 기호열로 바뀌는 문법 구성 요소로, 자식 노드를 가지는 파스 트리의 중간 노드가 되므로 정답이다.
      선택지 3: 생성 규칙은 비단말 기호를 어떤 기호열로 바꿀 수 있는지 정한 규칙으로, 노드 자체가 아니라 부모 노드와 자식 노드의 관계로 나타난다.
      선택지 4: 시작 기호는 유도가 시작되는 특별한 비단말 기호로 파스 트리의 루트 노드에 위치한다.

      핵심 개념:
      형식문법은 단말 기호, 비단말 기호, 생성 규칙, 시작 기호의 네 요소로 정의된다.
      파스 트리는 시작 기호에서 생성 규칙을 적용해 문장을 유도하는 과정을 트리로 나타낸 것이다.
      루트는 시작 기호, 중간 노드는 비단말 기호, 잎 노드는 단말 기호이다.
      잎 노드를 왼쪽에서 오른쪽으로 읽으면 유도된 문장이 된다.

  - id: t06-07
    type: multiple-choice
    prompt: 고급언어 프로그램에서 실행 코드까지의 변환 순서로 올바른 것은?
    choices:
      - { id: '1', text: '구문 분석, 코드 생성, 어휘 분석' }
      - { id: '2', text: '코드 생성, 구문 분석, 어휘 분석' }
      - { id: '3', text: '어휘 분석, 구문 분석, 코드 생성' }
      - { id: '4', text: '어휘 분석, 코드 생성, 구문 분석' }
    answers: ['3']
    explanation: |
      선택지 1: 구문 분석은 어휘 분석이 만든 토큰을 입력으로 받으므로 어휘 분석보다 먼저 올 수 없다.
      선택지 2: 코드 생성은 분석이 모두 끝난 결과를 바탕으로 수행하는 마지막 단계이므로 맨 앞에 올 수 없다.
      선택지 3: 문자열을 토큰으로 나누는 어휘 분석, 토큰으로 파스 트리를 만드는 구문 분석, 목적 코드를 만드는 코드 생성 순이므로 정답이다.
      선택지 4: 코드 생성 전에 문법 구조를 파악하는 구문 분석이 끝나야 하므로 코드 생성이 구문 분석보다 먼저 올 수 없다.

      핵심 개념:
      컴파일러는 고급언어 원시 프로그램을 여러 단계를 거쳐 실행 가능한 목적 코드로 변환한다.
      어휘 분석은 문자열을 토큰으로, 구문 분석은 토큰열을 파스 트리로 바꾼다.
      의미 분석과 중간 코드 생성·최적화를 거친 뒤 코드 생성 단계에서 목적 코드가 만들어진다.
      각 단계의 출력이 다음 단계의 입력이 되므로 순서가 바뀔 수 없다.

  - id: t07-01
    type: multiple-choice
    prompt: 데이터베이스 정의에 대한 설명으로 올바르지 ==못한== 것은?
    choices:
      - { id: '1', text: '컴퓨터가 접근 가능한 저장매체에 저장된 데이터 집합이다.' }
      - { id: '2', text: '단순 입출력 데이터를 포함하지 않는 운영 데이터의 집합이다.' }
      - { id: '3', text: '각 응용 프로그램이 독립적으로 소유하고 사용하기 위한 데이터의 집합이다.' }
      - { id: '4', text: '제한적으로 통제된 범위 내에서 데이터의 중복을 허용하는 통합 데이터의 집합이다.' }
    answers: ['3']
    explanation: |
      선택지 1: 데이터베이스는 컴퓨터가 접근할 수 있는 저장매체에 저장된 저장 데이터(stored data)이므로 올바른 설명이다.
      선택지 2: 데이터베이스는 조직의 업무 수행에 반드시 필요한 운영 데이터(operational data)의 집합이며, 일시적인 단순 입출력 데이터는 포함하지 않으므로 올바른 설명이다.
      선택지 3: 데이터베이스는 여러 응용 프로그램과 사용자가 함께 소유하고 사용하는 공용 데이터(shared data)이다. 각 응용 프로그램이 독립적으로 소유하는 것은 파일 시스템의 특징이므로 올바르지 못한 설명이며 정답이다.
      선택지 4: 데이터베이스는 중복을 최소화하되 필요에 따라 통제된 범위 내에서 중복을 허용하는 통합 데이터(integrated data)이므로 올바른 설명이다.

      핵심 개념:
      데이터베이스는 한 조직의 여러 응용 시스템이 공용하기 위해 통합·저장한 운영 데이터의 집합이다.
      정의의 네 요소: 통합 데이터, 저장 데이터, 운영 데이터, 공용 데이터.
      통합 데이터는 중복을 최소화하고 통제된 중복만 허용한다.
      응용 프로그램마다 데이터를 따로 소유하는 방식은 파일 시스템의 방식으로, 데이터 중복과 불일치의 원인이 된다.

  - id: t07-02
    type: multiple-choice
    prompt: 데이터베이스의 특징에 대한 설명으로 적절하지 ==않은== 것은?
    choices:
      - { id: '1', text: '주소에 의한 참조' }
      - { id: '2', text: '동시 공유' }
      - { id: '3', text: '실시간 접근성' }
      - { id: '4', text: '계속적인 변화' }
    answers: ['1']
    explanation: |
      선택지 1: 데이터베이스의 데이터는 저장된 위치(주소)가 아니라 데이터의 값, 즉 내용으로 참조한다(내용에 의한 참조). 주소에 의한 참조는 데이터베이스의 특징이 아니므로 정답이다.
      선택지 2: 여러 사용자가 같은 데이터를 동시에 이용할 수 있는 동시 공유는 데이터베이스의 특징이다.
      선택지 3: 사용자의 질의에 즉시 응답해 처리하는 실시간 접근성은 데이터베이스의 특징이다.
      선택지 4: 삽입·삭제·갱신으로 데이터가 항상 최신 상태를 유지하는 계속적인 변화는 데이터베이스의 특징이다.

      핵심 개념:
      데이터베이스의 네 가지 특징은 실시간 접근성, 계속적인 변화, 동시 공유, 내용에 의한 참조이다.
      실시간 접근성: 질의에 대해 즉시 처리하고 응답한다.
      계속적인 변화: 데이터의 삽입, 삭제, 갱신으로 현재의 정확한 데이터를 유지한다.
      내용에 의한 참조: 주소나 위치가 아니라 데이터의 값으로 원하는 데이터를 찾는다.

  - id: t07-03
    type: multiple-choice
    prompt: 오직 하나만 존재해서 모든 외부 스키마의 생성을 지원하는 스키마는?
    choices:
      - { id: '1', text: '내부 스키마' }
      - { id: '2', text: '구현 스키마' }
      - { id: '3', text: '서브스키마' }
      - { id: '4', text: '개념 스키마' }
    answers: ['4']
    explanation: |
      선택지 1: 내부 스키마는 데이터가 저장장치에 실제로 저장되는 물리적 구조를 정의한 것으로, 외부 스키마의 생성을 직접 지원하는 스키마가 아니다.
      선택지 2: 구현 스키마는 3단계 스키마(외부·개념·내부)에 속하지 않는 용어로, 조건에 맞지 않는다.
      선택지 3: 서브스키마는 외부 스키마의 다른 이름으로, 사용자마다 여러 개 존재할 수 있으므로 오직 하나만 존재한다는 조건과 맞지 않는다.
      선택지 4: 개념 스키마는 조직 전체의 관점에서 데이터베이스의 전체 논리적 구조를 정의한 것으로, 데이터베이스마다 하나만 존재하며 이를 바탕으로 모든 외부 스키마가 만들어진다. 정답이다.

      핵심 개념:
      ANSI/SPARC(American National Standards Institute/Standards Planning And Requirements Committee)의 3단계 구조는 외부 스키마, 개념 스키마, 내부 스키마로 이루어진다.
      외부 스키마(서브스키마): 개별 사용자·응용 프로그래머의 관점, 여러 개 존재할 수 있다.
      개념 스키마: 조직 전체 관점의 논리적 구조, 하나만 존재하며 모든 외부 스키마의 생성을 지원한다.
      내부 스키마: 저장장치 관점의 물리적 저장 구조를 정의한다.

  - id: t07-04
    type: multiple-choice
    prompt: 개별 사용자나 응용 프로그래머가 관심을 두는 데이터베이스 구조를 정의한 것은?
    choices:
      - { id: '1', text: '개념 스키마' }
      - { id: '2', text: '외부 스키마' }
      - { id: '3', text: '내부 스키마' }
      - { id: '4', text: '저장 스키마' }
    answers: ['2']
    explanation: |
      선택지 1: 개념 스키마는 개별 사용자가 아니라 조직 전체의 관점에서 데이터베이스의 전체 논리적 구조를 정의한 것이다.
      선택지 2: 외부 스키마는 개별 사용자나 응용 프로그래머가 필요로 하는 데이터베이스의 일부 구조를 각자의 관점에서 정의한 것이므로 정답이다.
      선택지 3: 내부 스키마는 물리적 저장장치의 관점에서 데이터가 실제로 저장되는 방식을 정의한 것이다.
      선택지 4: 저장 스키마는 내부 스키마를 가리키는 말로, 물리적 저장 구조를 다루므로 사용자 관점의 구조가 아니다.

      핵심 개념:
      3단계 스키마는 관점에 따라 구분한다.
      외부 스키마: 개별 사용자·응용 프로그래머 관점의 논리적 구조(서브스키마라고도 한다).
      개념 스키마: 조직 전체 관점의 논리적 구조.
      내부 스키마(저장 스키마): 물리적 저장장치 관점의 저장 구조.

  - id: t07-05
    type: multiple-choice
    prompt: 데이터베이스에서 논리적 데이터 독립성을 제공하기 위한 사상은?
    choices:
      - { id: '1', text: '외부/개념 사상' }
      - { id: '2', text: '외부/내부 사상' }
      - { id: '3', text: '개념/내부 사상' }
      - { id: '4', text: '내부/저장 사상' }
    answers: ['1']
    explanation: |
      선택지 1: 외부/개념 사상은 외부 스키마와 개념 스키마 사이의 대응 관계를 정의한다. 개념 스키마가 바뀌어도 이 사상만 수정하면 외부 스키마와 응용 프로그램은 영향을 받지 않으므로 논리적 데이터 독립성을 제공한다. 정답이다.
      선택지 2: 3단계 구조에서 외부 스키마와 내부 스키마는 직접 사상되지 않고 개념 스키마를 거쳐 연결되므로 외부/내부 사상은 없다.
      선택지 3: 개념/내부 사상은 개념 스키마와 내부 스키마 사이의 대응 관계로, 내부 저장 구조가 바뀌어도 개념 스키마에 영향을 주지 않게 하는 물리적 데이터 독립성을 제공한다.
      선택지 4: 내부 스키마와 저장 스키마는 같은 단계를 가리키므로 내부/저장 사상은 3단계 구조의 사상이 아니다.

      핵심 개념:
      사상(mapping)은 서로 다른 단계의 스키마 사이의 대응 관계를 정의한다.
      외부/개념 사상 → 논리적 데이터 독립성: 개념 스키마 변경이 외부 스키마에 영향을 주지 않는다.
      개념/내부 사상 → 물리적 데이터 독립성: 내부 스키마 변경이 개념 스키마에 영향을 주지 않는다.
      데이터 독립성은 3단계 구조를 두는 주된 목적이다.

  - id: t07-06
    type: multiple-choice
    prompt: 데이터 모델을 지원하는 개념의 타입을 기준으로 구분할 때 나머지와 ==다른== 하나의 모델은?
    choices:
      - { id: '1', text: '관계형 모델' }
      - { id: '2', text: '개체-관계 모델' }
      - { id: '3', text: '네트워크형 모델' }
      - { id: '4', text: '계층형 모델' }
    answers: ['2']
    explanation: |
      선택지 1: 관계형 모델은 데이터를 테이블(릴레이션) 형태로 표현하는 논리적 데이터 모델이다.
      선택지 2: 개체-관계 모델(E-R model, Entity-Relationship model)은 실세계를 개체, 속성, 관계라는 개념으로 표현하는 개념적 데이터 모델이다. 나머지 세 모델은 논리적 데이터 모델이므로 이것만 다르다. 정답이다.
      선택지 3: 네트워크형 모델은 레코드 간의 관계를 그래프(망) 형태로 표현하는 논리적 데이터 모델이다.
      선택지 4: 계층형 모델은 레코드 간의 관계를 트리 형태로 표현하는 논리적 데이터 모델이다.

      핵심 개념:
      데이터 모델은 지원하는 개념의 타입에 따라 개념적 데이터 모델과 논리적 데이터 모델로 나뉜다.
      개념적 데이터 모델: 사람이 이해하기 쉬운 개념으로 실세계를 표현하며 대표적으로 개체-관계 모델이 있다.
      논리적 데이터 모델: 컴퓨터(DBMS)가 처리할 수 있는 구조로 표현하며 관계형, 네트워크형, 계층형 모델이 있다.
      개념적 설계에서 E-R 모델로 표현한 뒤 논리적 설계에서 관계형 모델 등으로 변환한다.

  - id: t07-07
    type: multiple-choice
    prompt: 2차원 테이블 형태로 데이터가 조직되는 데이터베이스 모델은 무엇인가?
    choices:
      - { id: '1', text: '계층형 모델' }
      - { id: '2', text: '네트워크 모델' }
      - { id: '3', text: '관계형 모델' }
      - { id: '4', text: '객체지향형 모델' }
    answers: ['3']
    explanation: |
      선택지 1: 계층형 모델은 레코드를 부모-자식 관계의 트리 구조로 조직한다.
      선택지 2: 네트워크 모델은 레코드를 여러 부모를 가질 수 있는 그래프(망) 구조로 조직한다.
      선택지 3: 관계형 모델은 데이터를 행(투플)과 열(속성)로 이루어진 2차원 테이블인 릴레이션으로 조직하므로 정답이다.
      선택지 4: 객체지향형 모델은 데이터와 연산을 묶은 객체와 클래스, 상속 등의 개념으로 데이터를 조직한다.

      핵심 개념:
      논리적 데이터 모델은 데이터를 조직하는 구조에 따라 구분한다.
      계층형: 트리 구조, 네트워크형: 그래프 구조, 관계형: 2차원 테이블 구조.
      관계형 모델의 테이블을 릴레이션, 행을 투플, 열을 속성이라고 한다.
      관계형 모델은 구조가 단순하고 SQL(Structured Query Language) 같은 비절차적 언어를 지원해 가장 널리 쓰인다.

  - id: t07-08
    type: multiple-choice
    passageRefs: [gt07-er-advise-01]
    prompt: 다음과 같은 E-R 다이어그램에서 개체 집합들 사이의 사상을 통해서 개체 집합 간의 유용한 의미와 정보를 표현하기 위한 것은?
    choices:
      - { id: '1', text: '학생' }
      - { id: '2', text: '교수' }
      - { id: '3', text: '지도' }
      - { id: '4', text: '이름' }
    answers: ['3']
    explanation: |
      선택지 1: 학생은 사각형으로 표시된 개체 집합으로, 개체 집합들 사이의 사상을 나타내는 것이 아니다.
      선택지 2: 교수도 사각형으로 표시된 개체 집합이다.
      선택지 3: 지도는 마름모로 표시된 관계 집합으로, 학생 개체 집합과 교수 개체 집합 사이의 사상을 통해 "교수가 학생을 지도한다"는 의미와 정보를 표현한다. 정답이다.
      선택지 4: 이름은 타원으로 표시된 속성으로, 개체의 성질을 나타낼 뿐 개체 집합 간의 관계를 나타내지 않는다.

      핵심 개념:
      E-R 다이어그램(Entity-Relationship diagram)은 개체, 속성, 관계를 도형으로 표현한다.
      사각형: 개체 집합, 타원: 속성, 마름모: 관계 집합, 선: 개체와 속성·관계의 연결.
      관계 집합은 개체 집합들 사이의 사상으로 개체 간의 유용한 의미와 정보를 표현한다.
      키 속성은 타원 안의 속성 이름에 밑줄을 그어 표시한다.

  - id: t07-09
    type: multiple-choice
    prompt: E-R 다이어그램에서 키 속성을 나타내는 기호는?
    choices:
      - id: '1'
        text: ''
        image:
          path: images/subjects/introduction-to-computer-science/textbook/t07-09-choice-1.png
          alt: 점선 테두리의 타원
      - id: '2'
        text: ''
        image:
          path: images/subjects/introduction-to-computer-science/textbook/t07-09-choice-2.png
          alt: 실선 테두리의 타원
      - id: '3'
        text: ''
        image:
          path: images/subjects/introduction-to-computer-science/textbook/t07-09-choice-3.png
          alt: 이중선 테두리의 타원
      - id: '4'
        text: ''
        image:
          path: images/subjects/introduction-to-computer-science/textbook/t07-09-choice-4.png
          alt: 안쪽에 밑줄이 그어진 타원
    answers: ['4']
    explanation: |
      선택지 1: 점선 타원은 다른 속성 값으로부터 계산해서 얻을 수 있는 유도 속성(derived attribute)을 나타낸다.
      선택지 2: 실선 타원은 일반 속성을 나타낸다.
      선택지 3: 이중선 타원은 하나의 개체가 여러 값을 가질 수 있는 다중값 속성(multivalued attribute)을 나타낸다.
      선택지 4: 타원 안의 속성 이름에 밑줄을 그은 기호는 개체를 유일하게 식별하는 키 속성을 나타내므로 정답이다.

      핵심 개념:
      E-R 다이어그램에서 속성은 타원으로 표시하고, 속성의 종류는 타원의 모양으로 구분한다.
      실선 타원: 일반 속성, 밑줄 친 타원: 키 속성.
      이중 타원: 다중값 속성, 점선 타원: 유도 속성.
      개체 집합은 사각형, 관계 집합은 마름모로 표시한다.

  - id: t07-10
    type: multiple-choice
    passageRefs: [gt07-relation-account-01]
    prompt: 다음과 같은 방식으로 실세계의 정보를 표현하는 논리적 모델은?
    choices:
      - { id: '1', text: '개체-관계 모델' }
      - { id: '2', text: '관계형 모델' }
      - { id: '3', text: '네트워크 모델' }
      - { id: '4', text: '객체지향형 모델' }
    answers: ['2']
    explanation: |
      선택지 1: 개체-관계 모델은 개체(사각형), 속성(타원), 관계(마름모)로 표현하는 개념적 모델이므로 그림과 같은 테이블 방식이 아니며, 논리적 모델도 아니다.
      선택지 2: 그림은 고객, 계좌, 계좌 거래를 각각 속성(열)으로 이루어진 릴레이션(테이블)으로 표현하고, 계좌 거래 릴레이션이 주민등록번호와 계좌번호를 속성으로 가져 두 릴레이션의 관계를 값으로 나타낸다. 이는 관계형 모델의 표현 방식이므로 정답이다.
      선택지 3: 네트워크 모델은 레코드 타입 사이의 관계를 링크(포인터)로 연결한 그래프 구조로 표현한다.
      선택지 4: 객체지향형 모델은 속성과 메소드를 묶은 객체와 클래스로 정보를 표현한다.

      핵심 개념:
      관계형 모델은 실세계의 개체와 관계를 모두 릴레이션(2차원 테이블)으로 표현한다.
      릴레이션 스키마는 릴레이션 이름과 속성 이름의 집합으로 나타내며, 기본키에 밑줄을 긋는다.
      개체 간의 관계는 다른 릴레이션의 키를 속성(외래키)으로 포함해 표현한다.
      같은 정보를 E-R 모델로 그리면 고객·계좌는 개체, 계좌 거래는 관계로 표현된다.

  - id: t07-11
    type: multiple-choice
    prompt: 릴레이션에서 속성이 가질 수 있는 값의 집합을 의미하는 것은?
    choices:
      - { id: '1', text: '카디널리티' }
      - { id: '2', text: '도메인' }
      - { id: '3', text: '투플' }
      - { id: '4', text: '차수' }
    answers: ['2']
    explanation: |
      선택지 1: 카디널리티(cardinality)는 릴레이션에 포함된 투플의 개수이다.
      선택지 2: 도메인(domain)은 하나의 속성이 가질 수 있는 원자값들의 집합이므로 정답이다.
      선택지 3: 투플(tuple)은 릴레이션의 한 행으로, 속성 값들의 모임인 하나의 레코드이다.
      선택지 4: 차수(degree)는 릴레이션을 구성하는 속성의 개수이다.

      핵심 개념:
      릴레이션은 행과 열로 이루어진 2차원 테이블이다.
      속성(attribute): 열, 투플(tuple): 행.
      도메인: 한 속성이 가질 수 있는 값의 집합.
      차수: 속성의 수, 카디널리티: 투플의 수.

  - id: t07-12
    type: multiple-choice
    prompt: 관계형 모델에서 키의 성질 중 유일성만을 만족하는 키를 무엇이라고 하는가?
    choices:
      - { id: '1', text: '대체키' }
      - { id: '2', text: '후보키' }
      - { id: '3', text: '슈퍼키' }
      - { id: '4', text: '기본키' }
    answers: ['3']
    explanation: |
      선택지 1: 대체키는 후보키 중에서 기본키로 선택되지 않은 나머지 키로, 후보키이므로 유일성과 최소성을 모두 만족한다.
      선택지 2: 후보키는 투플을 유일하게 식별하는 속성 집합 중 유일성과 최소성을 모두 만족하는 키이다.
      선택지 3: 슈퍼키는 투플을 유일하게 식별할 수 있는 속성의 집합으로, 유일성은 만족하지만 불필요한 속성이 포함될 수 있어 최소성은 만족하지 않아도 된다. 정답이다.
      선택지 4: 기본키는 후보키 중에서 선택된 대표 키이므로 유일성과 최소성을 모두 만족한다.

      핵심 개념:
      키의 두 성질은 유일성(모든 투플을 유일하게 식별)과 최소성(식별에 꼭 필요한 속성만 포함)이다.
      슈퍼키: 유일성만 만족한다.
      후보키: 유일성과 최소성을 모두 만족한다.
      기본키는 후보키 중 선택된 키, 대체키는 선택되지 않은 나머지 후보키이다.

  - id: t07-13
    type: multiple-choice
    prompt: 관계형 모델의 제약 조건 중에서 어떠한 기본키값도 널값이 될 수 없다는 조건은?
    choices:
      - { id: '1', text: '개체 무결성 제약 조건' }
      - { id: '2', text: '영역 제약 조건' }
      - { id: '3', text: '참조 무결성 제약 조건' }
      - { id: '4', text: '키 제약 조건' }
    answers: ['1']
    explanation: |
      선택지 1: 개체 무결성 제약 조건은 기본키를 구성하는 어떤 속성 값도 널값(null)이 될 수 없다는 조건이므로 정답이다.
      선택지 2: 영역 제약 조건(도메인 제약 조건)은 각 속성 값이 해당 속성의 도메인에 속하는 원자값이어야 한다는 조건이다.
      선택지 3: 참조 무결성 제약 조건은 외래키 값이 널값이거나 참조되는 릴레이션의 기본키 값과 같아야 한다는 조건이다.
      선택지 4: 키 제약 조건은 릴레이션에 같은 키 값을 가진 투플이 둘 이상 존재할 수 없다는 조건이다.

      핵심 개념:
      관계형 모델의 무결성 제약 조건은 데이터의 정확성과 일관성을 보장한다.
      개체 무결성: 기본키 값은 널값을 가질 수 없다.
      참조 무결성: 외래키 값은 널이거나 참조 릴레이션의 기본키 값 중 하나여야 한다.
      영역 제약: 속성 값은 도메인의 원자값이어야 하고, 키 제약: 키 값은 중복될 수 없다.

  - id: t07-14
    type: multiple-choice
    prompt: SQL 명령문 중에서 데이터 조작어에 속하지 ==않는== 것은?
    choices:
      - { id: '1', text: 'SELECT문' }
      - { id: '2', text: 'DELETE문' }
      - { id: '3', text: 'UPDATE문' }
      - { id: '4', text: 'ALTER문' }
    answers: ['4']
    explanation: |
      선택지 1: SELECT문은 테이블에서 조건에 맞는 데이터를 검색하는 데이터 조작어(DML, Data Manipulation Language)이다.
      선택지 2: DELETE문은 테이블에서 조건에 맞는 투플을 삭제하는 데이터 조작어이다.
      선택지 3: UPDATE문은 테이블의 투플 값을 수정하는 데이터 조작어이다.
      선택지 4: ALTER문은 이미 정의된 테이블의 구조(속성 추가·삭제·변경 등)를 변경하는 데이터 정의어(DDL, Data Definition Language)이므로 데이터 조작어가 아니다. 정답이다.

      핵심 개념:
      SQL(Structured Query Language)은 데이터 정의어, 데이터 조작어, 데이터 제어어로 나뉜다.
      데이터 정의어(DDL): CREATE, ALTER, DROP — 테이블 등 구조를 정의·변경·제거한다.
      데이터 조작어(DML): SELECT, INSERT, UPDATE, DELETE — 저장된 데이터를 검색·삽입·수정·삭제한다.
      데이터 제어어(DCL): GRANT, REVOKE 등 — 권한과 보안을 제어한다.

  - id: t07-15
    type: multiple-choice
    passageRefs: [gt07-employee-table-01, gt07-sql-group-01]
    prompt: 다음과 같은 직원 테이블에 대해서 SQL문을 수행한 후 얻어지는 결과 테이블에 포함되는 내용은?
    choices:
      - { id: '1', text: 'A' }
      - { id: '2', text: 'A, B' }
      - { id: '3', text: 'A, B, C' }
      - { id: '4', text: 'A, B, C, D' }
    answers: ['1']
    explanation: |
      부서번호별 직원 수는 A가 3명(100, 330, 450), B가 2명(150, 340), C가 1명(478), D가 1명(201)이다. HAVING COUNT(*) >= 3 조건을 만족하는 그룹은 A뿐이다.
      선택지 1: 직원 수가 3명 이상인 부서는 A 하나이므로 결과 테이블에는 A만 포함된다. 정답이다.
      선택지 2: B 부서는 2명이라 COUNT(*) >= 3 조건을 만족하지 않으므로 포함되지 않는다.
      선택지 3: B(2명), C(1명)는 조건을 만족하지 않는다.
      선택지 4: 그룹 조건 없이 GROUP BY 부서번호만 수행했을 때의 결과로, HAVING절의 조건을 적용하지 않은 것이다.

      핵심 개념:
      GROUP BY절은 지정한 속성의 값이 같은 투플들을 하나의 그룹으로 묶는다.
      HAVING절은 그룹에 대한 조건을 지정하며, 집계 함수(COUNT, SUM, AVG 등)를 사용할 수 있다.
      COUNT(*)는 그룹에 속한 투플의 수를 센다.
      WHERE절은 그룹화 전의 개별 투플에, HAVING절은 그룹화 후의 그룹에 조건을 적용한다.

  - id: t07-16
    type: multiple-choice
    passageRefs: [gt07-employee-table-01]
    prompt: 다음 중에서 주어진 테이블의 모든 내용을 삭제해서 빈 테이블로 만드는 SQL 명령문에 해당하는 것은?(단, 직원 테이블은 위의 문제 15번을 참조한다.)
    choices:
      - { id: '1', text: 'DROP TABLE 직원;' }
      - { id: '2', text: 'DROP TABLE FROM 직원;' }
      - { id: '3', text: 'DELETE FROM 직원;' }
      - { id: '4', text: 'DELETE FROM 직원 WHERE 번호=‘*’;' }
    answers: ['3']
    explanation: |
      선택지 1: DROP TABLE 직원; 은 테이블의 내용뿐 아니라 테이블 정의 자체를 제거하므로 빈 테이블이 남지 않는다.
      선택지 2: DROP TABLE문에는 FROM을 쓰지 않으므로 올바른 SQL 형식이 아니다.
      선택지 3: DELETE FROM 직원; 은 WHERE절이 없으므로 직원 테이블의 모든 투플을 삭제하고 테이블 구조는 남겨 빈 테이블을 만든다. 정답이다.
      선택지 4: WHERE 번호='*'는 번호 값이 문자 '*'와 같은 투플만 삭제하라는 조건이다. '*'는 모든 값을 뜻하는 와일드카드로 해석되지 않으므로 일치하는 투플이 없어 아무것도 삭제되지 않는다.

      핵심 개념:
      DELETE문(데이터 조작어)은 투플을 삭제하고 테이블 구조는 유지한다. 형식: DELETE FROM 테이블 [WHERE 조건];
      WHERE절을 생략하면 테이블의 모든 투플이 삭제되어 빈 테이블이 된다.
      DROP TABLE문(데이터 정의어)은 테이블 자체를 데이터베이스에서 제거한다. 형식: DROP TABLE 테이블;
      내용만 비울 때는 DELETE, 테이블을 없앨 때는 DROP을 사용한다.

  - id: t07-17
    type: multiple-choice
    prompt: SQL 문장의 사용 형식으로 올바르지 ==못한== 것은?
    choices:
      - id: '1'
        text: ''
        diagram:
          type: data-table
          cellFormat: code
          columns: ['형식']
          rows:
            - ["DELETE\nFROM 테이블\nWHERE 조건;"]
      - id: '2'
        text: ''
        diagram:
          type: data-table
          cellFormat: code
          columns: ['형식']
          rows:
            - ["UPDATE 테이블\nSET 열이름 = 산술식\nWHERE 조건;"]
      - id: '3'
        text: ''
        diagram:
          type: data-table
          cellFormat: code
          columns: ['형식']
          rows:
            - ["SELECT 열이름\nFROM 테이블\nWHERE 조건;"]
      - id: '4'
        text: ''
        diagram:
          type: data-table
          cellFormat: code
          columns: ['형식']
          rows:
            - ["INSERT 테이블\nINTO 열값리스트\nWHERE 조건;"]
    answers: ['4']
    explanation: |
      선택지 1: DELETE FROM 테이블 WHERE 조건; 은 조건을 만족하는 투플을 삭제하는 올바른 DELETE문 형식이다.
      선택지 2: UPDATE 테이블 SET 열이름 = 산술식 WHERE 조건; 은 조건을 만족하는 투플의 열 값을 수정하는 올바른 UPDATE문 형식이다.
      선택지 3: SELECT 열이름 FROM 테이블 WHERE 조건; 은 조건을 만족하는 투플의 열을 검색하는 올바른 SELECT문 형식이다.
      선택지 4: 삽입문은 INSERT INTO 테이블 [(열이름 리스트)] VALUES (열값리스트); 형식이다. INSERT 다음에는 INTO와 테이블이, VALUES 다음에 값 리스트가 와야 하며, 새 투플을 추가하는 문장이므로 WHERE 조건도 붙지 않는다. 올바르지 못한 형식이므로 정답이다.

      핵심 개념:
      SQL(Structured Query Language) 데이터 조작어는 SELECT(검색), INSERT(삽입), UPDATE(수정), DELETE(삭제)이다.
      SELECT … FROM … WHERE, UPDATE … SET … WHERE, DELETE FROM … WHERE 형식은 WHERE 조건으로 대상 투플을 고른다.
      INSERT INTO 테이블 [(열 목록)] VALUES (값 목록) 형식은 새 투플을 추가하므로 WHERE절이 없다.
      키워드의 순서(INSERT INTO, DELETE FROM)를 정확히 기억해야 한다.

  - id: t08-01
    type: multiple-choice
    prompt: OSI 모델에서 전체 메시지를 패킷 단위로 분할하거나, 패킷들의 순서를 조정해서 전체 메시지를 재생성하는 등의 출발지와 목적지 간의 전체 메시지 전송을 담당하는 계층은?
    choices:
      - { id: '1', text: '전송 계층' }
      - { id: '2', text: '데이터링크 계층' }
      - { id: '3', text: '네트워크 계층' }
      - { id: '4', text: '세션 계층' }
    answers: ['1']
    explanation: |
      선택지 1: 전송 계층은 출발지와 목적지 사이의 종단 간(end-to-end) 전체 메시지 전송을 담당하며, 메시지를 패킷(세그먼트)으로 분할하고 수신 측에서 순서를 맞춰 전체 메시지로 재조립한다. 정답이다.
      선택지 2: 데이터링크 계층은 물리적으로 인접한 두 노드 사이에서 프레임을 오류 없이 전달하는 노드 간(hop-to-hop) 전송을 담당한다.
      선택지 3: 네트워크 계층은 개별 패킷을 출발지에서 목적지까지 경로를 선택해 전달(라우팅)하지만, 패킷들 사이의 순서를 맞춰 전체 메시지를 재생성하지는 않는다.
      선택지 4: 세션 계층은 통신하는 응용 프로세스 사이의 대화(세션)를 설정·유지·동기화하는 역할을 한다.

      핵심 개념:
      OSI(Open Systems Interconnection) 모델은 응용-표현-세션-전송-네트워크-데이터링크-물리의 7계층으로 이루어진다.
      데이터링크 계층: 인접 노드 간 프레임 전송.
      네트워크 계층: 개별 패킷의 출발지~목적지 전달과 경로 선택.
      전송 계층: 전체 메시지의 종단 간 전송, 분할·재조립, 순서·흐름·오류 제어.

  - id: t08-02
    type: multiple-choice
    passageRefs: [gt08-lan-bus-01]
    prompt: 다음과 같은 특징을 가지고 있는 LAN의 위상 구조는 어느 것인가?
    choices:
      - { id: '1', text: '원형' }
      - { id: '2', text: '링형' }
      - { id: '3', text: '성(star)형' }
      - { id: '4', text: '버스형' }
    answers: ['4']
    explanation: |
      선택지 1: 원형은 노드들을 원 모양의 폐회로로 연결한 링형의 다른 이름으로, 하나의 공용 회선에 모든 노드를 연결하는 구조가 아니다.
      선택지 2: 링형은 인접 노드끼리 원형으로 연결해 메시지가 한 방향으로 노드를 차례로 거쳐 전달되므로, 모든 노드에 동시에 전달되는 브로드캐스팅 구조가 아니다.
      선택지 3: 성(star)형은 중앙 제어 노드에 모든 노드를 점대점으로 연결하는 중앙 집중식 구조로, 공용 회선을 쓰지 않는다.
      선택지 4: 버스형은 하나의 공용 회선(버스)에 모든 노드를 연결하므로 구조가 간단하고, 단말 장치의 증설·삭제가 쉬우며, 전송된 메시지가 모든 노드에 전달(브로드캐스팅)된다. 정답이다.

      핵심 개념:
      LAN(Local Area Network)의 대표적인 위상 구조는 성형, 버스형, 링형, 트리형, 메시형이다.
      버스형: 공용 회선 하나에 모든 노드 연결, 브로드캐스팅, 증설·삭제 용이.
      성형: 중앙 노드에 점대점 연결, 유지보수 쉽지만 중앙 노드 고장 시 전체 마비.
      링형: 인접 노드를 원형으로 연결, 메시지가 순차적으로 전달된다.

  - id: t08-03
    type: multiple-choice
    prompt: OSI 모델의 네트워크 계층에서 취급되는 데이터 단위이며, 일반적으로 인터넷에서의 전송 단위로 사용되는 것은?
    choices:
      - { id: '1', text: '패킷' }
      - { id: '2', text: '프레임' }
      - { id: '3', text: 'BPS' }
      - { id: '4', text: '비트' }
    answers: ['1']
    explanation: |
      선택지 1: 패킷은 네트워크 계층에서 다루는 데이터 단위이며, 인터넷에서 데이터를 전송하는 기본 단위로 사용된다. 정답이다.
      선택지 2: 프레임은 데이터링크 계층에서 취급하는 데이터 단위이다.
      선택지 3: BPS(Bits Per Second)는 초당 전송되는 비트 수로, 데이터 단위가 아니라 전송 속도의 단위이다.
      선택지 4: 비트는 물리 계층에서 전송되는 신호의 단위이다.

      핵심 개념:
      OSI 계층마다 취급하는 데이터 단위(PDU, Protocol Data Unit)가 다르다.
      물리 계층: 비트, 데이터링크 계층: 프레임.
      네트워크 계층: 패킷(데이터그램), 전송 계층: 세그먼트.
      인터넷은 데이터를 패킷 단위로 나누어 전송하는 패킷 교환 방식을 사용한다.

  - id: t08-04
    type: multiple-choice
    prompt: 다음 중 인터넷 응용 계층 프로토콜이 ==아닌== 것은?
    choices:
      - { id: '1', text: 'FTP' }
      - { id: '2', text: 'HTTPS' }
      - { id: '3', text: 'UDP' }
      - { id: '4', text: 'SMTP' }
    answers: ['3']
    explanation: |
      선택지 1: FTP(File Transfer Protocol)는 파일 전송을 위한 응용 계층 프로토콜이다.
      선택지 2: HTTPS(HyperText Transfer Protocol Secure)는 암호화된 웹 문서 전송을 위한 응용 계층 프로토콜이다.
      선택지 3: UDP(User Datagram Protocol)는 비연결형 데이터그램 전송을 제공하는 전송 계층 프로토콜이므로 응용 계층 프로토콜이 아니다. 정답이다.
      선택지 4: SMTP(Simple Mail Transfer Protocol)는 전자우편 전송을 위한 응용 계층 프로토콜이다.

      핵심 개념:
      TCP/IP(Transmission Control Protocol/Internet Protocol) 프로토콜 계층은 응용, 전송, 인터넷(네트워크), 네트워크 접근 계층으로 나뉜다.
      응용 계층: HTTP, HTTPS, FTP, SMTP, Telnet, DNS 등.
      전송 계층: TCP(연결형·신뢰성), UDP(비연결형·비신뢰성).
      인터넷 계층: IP 등.

  - id: t08-05
    type: multiple-choice
    prompt: IPv6에 대한 설명으로 올바른 것은?
    choices:
      - { id: '1', text: '32비트의 주소를 4개의 필드로 구분한다.' }
      - { id: '2', text: '호스트 식별자와 네트워크 식별자의 비트 수와 역할에 따라 5개의 클래스로 구분된다.' }
      - { id: '3', text: '네트워크 규모와 단말기 수에 따라 순차적으로 주소를 할당한다.' }
      - { id: '4', text: '각 필드를 10진수로 표현한다.' }
    answers: ['3']
    explanation: |
      선택지 1: 32비트 주소를 8비트씩 4개의 필드로 구분하는 것은 IPv4(Internet Protocol version 4)의 특징이다. IPv6는 128비트 주소를 16비트씩 8개의 필드로 구분한다.
      선택지 2: 네트워크 식별자와 호스트 식별자의 비트 수에 따라 A~E의 5개 클래스로 구분하는 것은 IPv4의 주소 체계이다. IPv6는 클래스 구분을 사용하지 않는다.
      선택지 3: IPv6(Internet Protocol version 6)는 클래스 없이 네트워크 규모와 단말기 수에 따라 순차적으로 주소를 할당하므로 올바른 설명이다. 정답이다.
      선택지 4: 각 필드를 10진수로 표현하는 것은 IPv4의 표기법(예: 192.168.0.1)이다. IPv6는 각 필드를 16진수로 표현하고 콜론(:)으로 구분한다.

      핵심 개념:
      IPv4: 32비트 주소, 8비트씩 4개 필드, 10진수 표기, 점(.)으로 구분, A~E 5개 클래스.
      IPv6: 128비트 주소, 16비트씩 8개 필드, 16진수 표기, 콜론(:)으로 구분.
      IPv6는 IPv4 주소 고갈 문제를 해결하기 위해 등장했다.
      IPv6는 클래스 없이 네트워크 규모와 단말기 수에 따라 순차적으로 주소를 할당한다.

  - id: t08-06
    type: multiple-choice
    passageRefs: [gt08-app-layer-01]
    prompt: OSI 모델의 계층 중 다음과 같은 기능을 담당하는 계층은 무엇인가?
    choices:
      - { id: '1', text: '데이터 링크 계층' }
      - { id: '2', text: '응용 계층' }
      - { id: '3', text: '세션 계층' }
      - { id: '4', text: '표현 계층' }
    answers: ['4']
    explanation: |
      선택지 1: 데이터 링크 계층은 인접한 두 노드 사이에서 프레임 단위로 오류 없이 데이터를 전달하는 계층으로, 응용 프로토콜 기능과 관계가 없다.
      선택지 2: 응용 계층은 사용자가 네트워크에 접근할 수 있게 하는 최상위 계층으로, 웹의 HTTP, 파일 전송의 FTP, 이메일 전송의 SMTP 같은 응용 프로토콜의 기능을 지원한다. 내용상으로는 이 보기가 지문에 맞는다(아래 ※ 참고).
      선택지 3: 세션 계층은 통신하는 두 프로세스 사이의 대화(세션)를 설정·유지·종료하고 동기화하는 계층이다.
      선택지 4: 교재 정답표는 이 보기를 정답으로 인쇄했다. 그러나 표현 계층은 데이터의 형식 변환, 암호화, 압축 등 데이터 표현 방식을 다루는 계층으로, HTTP·FTP·SMTP 같은 응용 프로토콜을 지원하는 계층이 아니다(아래 ※ 참고).

      핵심 개념:
      OSI(Open Systems Interconnection) 모델의 상위 3계층은 응용, 표현, 세션 계층이다.
      응용 계층: HTTP, FTP, SMTP 등 응용 프로토콜로 사용자 서비스를 제공한다.
      표현 계층: 데이터 형식 변환, 암호화, 압축.
      세션 계층: 대화 설정·유지·동기화.

      ※ 원본 표기: 교재 정답표는 표현 계층을 정답으로 인쇄했으나, 지문의 HTTP·FTP·SMTP 등 응용 프로토콜 기능 지원은 응용 계층의 기능이다. 채점은 인쇄된 정답을 그대로 따른다.

  - id: t08-07
    type: multiple-choice
    prompt: OSI 모델의 네트워크 계층에서 동작하는 장비로서, 도착한 데이터그램의 수신 주소 방향으로 데이터그램을 전달(forwarding)해 주는 역할을 하는 것은?
    choices:
      - { id: '1', text: '라우터' }
      - { id: '2', text: '스위치' }
      - { id: '3', text: '브리지' }
      - { id: '4', text: '게이트웨이' }
    answers: ['1']
    explanation: |
      선택지 1: 라우터는 네트워크 계층에서 동작하며, 도착한 데이터그램의 목적지 주소(IP 주소)를 보고 최적 경로를 선택해 해당 방향으로 전달(forwarding)한다. 정답이다.
      선택지 2: 스위치는 주로 데이터링크 계층에서 동작하며, MAC(Media Access Control) 주소를 보고 프레임을 해당 포트로 전달한다.
      선택지 3: 브리지는 데이터링크 계층에서 동작하며, 같은 종류의 LAN을 연결하고 MAC 주소로 프레임을 걸러 전달한다.
      선택지 4: 게이트웨이는 전송 계층 이상의 상위 계층에서 동작하며, 프로토콜이 서로 다른 네트워크를 연결하기 위해 프로토콜을 변환한다.

      핵심 개념:
      네트워크 연결 장비는 동작하는 OSI 계층으로 구분한다.
      물리 계층: 리피터, 허브 — 신호를 증폭·재생한다.
      데이터링크 계층: 브리지, 스위치 — MAC 주소로 프레임을 전달한다.
      네트워크 계층: 라우터 — IP 주소로 경로를 선택해 패킷(데이터그램)을 전달한다. 상위 계층: 게이트웨이 — 프로토콜을 변환한다.

  - id: t08-08
    type: multiple-choice
    prompt: 중앙의 제어 노드에 다른 모든 노드를 점대점 방식으로 연결한 중앙 집중식 구조를 띠고 있어 유지보수가 쉽고 전송 제어가 간단한 회선망의 유형은?
    choices:
      - { id: '1', text: '버스형' }
      - { id: '2', text: '성형' }
      - { id: '3', text: '매시형' }
      - { id: '4', text: '트리형' }
    answers: ['2']
    explanation: |
      선택지 1: 버스형은 하나의 공용 회선에 모든 노드를 연결하는 구조로, 중앙 제어 노드가 없다.
      선택지 2: 성형(star)은 중앙 제어 노드에 모든 노드를 점대점으로 연결한 중앙 집중식 구조로, 유지보수가 쉽고 전송 제어가 간단하다. 정답이다.
      선택지 3: 메시형(mesh)은 모든 노드를 서로 점대점으로 직접 연결한 구조로, 중앙 제어 노드 없이 신뢰성이 높지만 회선이 많이 필요하다.
      선택지 4: 트리형은 중앙 노드에서 하위 노드로 계층적으로 가지를 뻗어 연결한 구조로, 모든 노드가 중앙 노드에 직접 점대점 연결되지 않는다.

      핵심 개념:
      회선망(네트워크 위상)의 유형은 성형, 버스형, 링형, 트리형, 메시형이다.
      성형: 중앙 제어 노드에 점대점 연결, 유지보수·전송 제어가 쉽지만 중앙 노드 고장 시 전체가 마비된다.
      메시형: 모든 노드를 서로 직접 연결, 신뢰성이 높지만 비용이 크다.
      트리형: 계층적 연결, 버스형: 공용 회선 하나에 연결.

  - id: t08-09
    type: multiple-choice
    passageRefs: [gt08-osi-order-01]
    prompt: OSI 모델의 계층에서 ⓑ에 들어가는 계층은?
    choices:
      - { id: '1', text: '네트워크 계층' }
      - { id: '2', text: '표현 계층' }
      - { id: '3', text: '전송 계층' }
      - { id: '4', text: '세션 계층' }
    answers: ['4']
    explanation: |
      OSI 7계층을 위에서부터 나열하면 응용 − 표현(ⓐ) − 세션(ⓑ) − 전송(ⓒ) − 네트워크(ⓓ) − 데이터링크(ⓔ) − 물리 계층이다.
      선택지 1: 네트워크 계층은 위에서 다섯 번째 계층으로 ⓓ에 들어간다.
      선택지 2: 표현 계층은 응용 계층 바로 아래인 ⓐ에 들어간다.
      선택지 3: 전송 계층은 위에서 네 번째 계층으로 ⓒ에 들어간다.
      선택지 4: 세션 계층은 표현 계층 아래, 전송 계층 위에 있는 세 번째 계층이므로 ⓑ에 들어간다. 정답이다.

      핵심 개념:
      OSI(Open Systems Interconnection) 모델은 7계층으로 이루어진다.
      상위(7→5): 응용, 표현, 세션 계층.
      하위(4→1): 전송, 네트워크, 데이터링크, 물리 계층.
      위에서부터 "응·표·세·전·네·데·물" 순서로 기억한다.

  - id: t08-10
    type: multiple-choice
    prompt: 송신 노드로부터 수신 노드까지 신뢰성 있게 순서대로 나열된 메시지를 보낼 수 있게 해 주는 통신 프로토콜은 무엇인가?
    choices:
      - { id: '1', text: 'TCP' }
      - { id: '2', text: 'UDP' }
      - { id: '3', text: 'SMTP' }
      - { id: '4', text: 'IP' }
    answers: ['1']
    explanation: |
      선택지 1: TCP(Transmission Control Protocol)는 연결형 전송 계층 프로토콜로, 순서 번호와 확인 응답, 재전송을 이용해 메시지를 신뢰성 있게 순서대로 전달한다. 정답이다.
      선택지 2: UDP(User Datagram Protocol)는 비연결형 전송 계층 프로토콜로, 전달 순서와 도착을 보장하지 않는다.
      선택지 3: SMTP(Simple Mail Transfer Protocol)는 전자우편 전송을 위한 응용 계층 프로토콜이다.
      선택지 4: IP(Internet Protocol)는 패킷을 목적지까지 전달하는 인터넷 계층 프로토콜이지만, 전달의 신뢰성과 순서를 보장하지 않는 비연결형 최선형 서비스이다.

      핵심 개념:
      전송 계층 프로토콜에는 TCP와 UDP가 있다.
      TCP: 연결형, 신뢰성 있는 전송, 순서 보장, 흐름·오류 제어.
      UDP: 비연결형, 신뢰성·순서 보장 없음, 오버헤드가 적어 빠르다.
      IP는 TCP 아래에서 패킷의 주소 지정과 경로 전달만 담당한다.

  - id: t08-11
    type: multiple-choice
    prompt: 인터넷의 전신인 네트워크는 무엇인가?
    choices:
      - { id: '1', text: 'BITNET' }
      - { id: '2', text: 'ARPANet' }
      - { id: '3', text: 'ALOHAnet' }
      - { id: '4', text: 'Ethernet' }
    answers: ['2']
    explanation: |
      선택지 1: BITNET(Because It's Time NETwork)은 미국 대학 간 전자우편·파일 교환을 위해 만든 네트워크로, 인터넷의 전신이 아니다.
      선택지 2: ARPANet(Advanced Research Projects Agency Network)은 미국 국방부 고등연구계획국(ARPA)이 1969년에 구축한 패킷 교환 네트워크로, TCP/IP를 채택해 오늘날 인터넷으로 발전했다. 정답이다.
      선택지 3: ALOHAnet은 하와이 대학에서 개발한 무선 패킷 네트워크로, 다중 접근 방식(ALOHA 프로토콜)의 기원이 되었지만 인터넷의 전신은 아니다.
      선택지 4: Ethernet은 LAN(Local Area Network)의 대표적인 기술 표준으로, 인터넷의 전신이 아니다.

      핵심 개념:
      인터넷은 1969년 미국 국방부의 ARPANet에서 시작되었다.
      ARPANet은 패킷 교환 방식을 사용했고, 1983년 TCP/IP를 표준 프로토콜로 채택했다.
      이후 군사용 네트워크가 분리되고 민간·학술 네트워크가 연결되면서 인터넷으로 발전했다.
      ALOHAnet은 무선 다중 접근, Ethernet은 LAN 기술의 기원이다.

  - id: t08-12
    type: multiple-choice
    prompt: 네트워크와 네트워크 간의 연결에 사용되는 장비가 ==아닌== 것은?
    choices:
      - { id: '1', text: '브리지' }
      - { id: '2', text: '스위치' }
      - { id: '3', text: '리피터' }
      - { id: '4', text: '호스트' }
    answers: ['4']
    explanation: |
      선택지 1: 브리지는 데이터링크 계층에서 동작하며 두 LAN을 연결하는 네트워크 연결 장비이다.
      선택지 2: 스위치는 여러 노드나 네트워크 세그먼트를 연결해 프레임을 목적지 포트로 전달하는 네트워크 연결 장비이다.
      선택지 3: 리피터는 물리 계층에서 약해진 신호를 증폭·재생해 네트워크 구간을 연장·연결하는 장비이다.
      선택지 4: 호스트는 네트워크에 연결되어 데이터를 주고받는 최종 단말(컴퓨터)로, 네트워크와 네트워크를 연결하는 장비가 아니다. 정답이다.

      핵심 개념:
      네트워크 연결 장비는 동작 계층에 따라 구분한다.
      리피터·허브(물리 계층), 브리지·스위치(데이터링크 계층), 라우터(네트워크 계층), 게이트웨이(상위 계층).
      호스트는 네트워크에 연결된 컴퓨터 등 통신의 주체(단말)이다.
      연결 장비는 데이터를 전달·중계하고, 호스트는 데이터를 생성·소비한다.
