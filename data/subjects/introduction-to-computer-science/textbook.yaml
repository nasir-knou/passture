      - { id: '2', text: '데이터가 갖는 값의 범위를 알고 있는 경우' }
      - { id: '3', text: '데이터가 임의의 순서로 나열된 경우' }
      - { id: '4', text: '데이터가 오름차순으로 정렬된 경우' }
    answers: ['3']
    explanation: |
      선택지 1: 순차 탐색은 $O(n)$이므로 데이터가 매우 많으면 탐색 시간이 길어져 비효율적이다.
      선택지 2: 값의 범위를 알고 있다는 조건은 순차 탐색에 도움이 되지 않으며, 보간 탐색처럼 값의 분포를 이용하는 방법에 유리한 조건이다.
      선택지 3: 순차 탐색은 데이터를 처음부터 하나씩 비교하므로 정렬되어 있지 않은 임의 순서의 데이터에도 그대로 적용할 수 있다. 정렬이 되어 있지 않아 이진 탐색을 쓸 수 없을 때 가장 효과적으로 적용되므로 정답이다.
      선택지 4: 오름차순으로 정렬된 데이터에는 $O(\log n)$인 이진 탐색을 적용하는 것이 더 효과적이다.

      핵심 개념:
      순차 탐색은 첫 데이터부터 차례로 찾는 값과 비교하는 탐색 방법이다.
      데이터의 정렬 여부와 관계없이 적용할 수 있으며 수행 시간은 $O(n)$이다.
      이진 탐색은 정렬된 데이터에만 적용할 수 있으며 수행 시간은 $O(\log n)$이다.
      데이터가 적거나 정렬되어 있지 않을 때 순차 탐색이 적합하다.

  - id: t03-14
