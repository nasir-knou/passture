questions:
  # ── 제1장 컴퓨터와 데이터 (교재 37~39쪽) ──
  - id: t01-01
    type: multiple-choice
    passageRefs: [gt01-computer-def-01]
    prompt: 다음과 같은 컴퓨터 정의에서 빈칸에 들어갈 적합한 단어는?
    choices:
      - { id: '1', text: '통신' }
      - { id: '2', text: '알고리즘' }
      - { id: '3', text: '프로그램' }
      - { id: '4', text: '저장' }
    answers: ['3']
    explanation: |
      선택지 1: 통신은 컴퓨터 사이에서 데이터를 주고받는 기능으로, 컴퓨터를 정의하는 핵심 성질이 아니다.
      선택지 2: 알고리즘은 문제를 해결하는 절차이며, 컴퓨터를 "프로그램이 가능한 데이터 처리기"로 정의할 때의 빈칸 단어가 아니다.
      선택지 3: 컴퓨터는 프로그램이 가능한(programmable) 데이터 처리기로 정의되므로 정답이다. 프로그램을 바꾸면 같은 기계로 다른 작업을 수행할 수 있다.
      선택지 4: 저장은 데이터 처리기가 갖는 기능의 하나일 뿐, 컴퓨터를 다른 데이터 처리기와 구별하는 성질이 아니다.

      핵심 개념:
      컴퓨터는 프로그램이 가능한 데이터 처리기(programmable data processor)이다.
      데이터 처리기의 기본 동작은 데이터 입력 → 처리 → 결과 출력이다.
      프로그램은 컴퓨터가 처리할 수 있는 작업의 유형과 연산의 집합을 결정한다.
      프로그램을 교체할 수 있으므로 컴퓨터는 범용 기계가 된다.

  - id: t01-02
    type: multiple-choice
    prompt: 컴퓨터에서 사용될 수 있는 시간 단위 중에서 가장 빠른 것을 나타내는 것은?
    choices:
      - { id: '1', text: 'ps' }
      - { id: '2', text: 'ms' }
      - { id: '3', text: 'ns' }
      - { id: '4', text: 'µs' }
    answers: ['1']
    explanation: |
      선택지 1: ps(피코초, picosecond)는 $10^{-12}$초로 보기 중 가장 짧은 시간 단위이므로 정답이다.
      선택지 2: ms(밀리초, millisecond)는 $10^{-3}$초로 보기 중 가장 긴 단위이다.
      선택지 3: ns(나노초, nanosecond)는 $10^{-9}$초로 ps보다 1000배 길다.
      선택지 4: µs(마이크로초, microsecond)는 $10^{-6}$초로 ns보다도 1000배 길다.

      핵심 개념:
      컴퓨터 시간 단위는 ms($10^{-3}$) > µs($10^{-6}$) > ns($10^{-9}$) > ps($10^{-12}$) 순으로 짧아진다.
      단위가 한 단계 작아질 때마다 1000분의 1이 된다.
      "가장 빠른" 단위는 가장 짧은 시간 간격을 나타내는 단위를 뜻한다.
      프로세서의 클록 주기처럼 매우 짧은 시간은 ns나 ps 단위로 나타낸다.

  - id: t01-03
    type: multiple-choice
    passageRefs: [gt01-cs-def-01]
    prompt: 다음과 같은 컴퓨터과학의 정의에서 빈칸 ⓐ〜ⓓ에 적합한 단어가 ==아닌== 것은?
    choices:
      - { id: '1', text: '컴퓨터' }
      - { id: '2', text: '프로그램' }
      - { id: '3', text: '알고리즘' }
      - { id: '4', text: '정보' }
    answers: ['4']
    explanation: |
      선택지 1: 컴퓨터는 컴퓨터과학이 연구하는 대상의 하나로 빈칸에 들어간다.
      선택지 2: 프로그램은 컴퓨터가 수행할 작업을 기술한 것으로 컴퓨터과학의 연구 대상이므로 빈칸에 들어간다.
      선택지 3: 알고리즘은 문제 해결 절차로 컴퓨터과학의 핵심 연구 대상이므로 빈칸에 들어간다.
      선택지 4: 정보는 데이터를 처리해서 얻는 결과이며, 정의의 네 연구 대상(컴퓨터, 프로그램, 알고리즘, 데이터)에 포함되지 않으므로 정답이다.

      핵심 개념:
      컴퓨터과학은 컴퓨터, 프로그램, 알고리즘, 데이터의 연구를 통해 효율적인 데이터 처리를 위한 원리와 방법을 제공하는 학문이다.
      데이터는 처리의 대상이고, 정보는 데이터를 처리하여 얻는 의미 있는 결과이다.
      알고리즘은 문제를 해결하는 단계적 절차이고, 프로그램은 알고리즘을 프로그래밍 언어로 표현한 것이다.
      빈칸에 들어가는 네 단어와 결과물인 정보를 구분해야 한다.

  - id: t01-04
    type: multiple-choice
    prompt: 하나의 완전한 컴퓨터 시스템을 구성하는 요소로서 거리가 ==먼== 것은?
    choices:
      - { id: '1', text: '사용자' }
      - { id: '2', text: '하드웨어' }
      - { id: '3', text: '소프트웨어' }
      - { id: '4', text: '인터넷' }
    answers: ['4']
    explanation: |
      선택지 1: 사용자는 컴퓨터를 이용해 작업을 수행하는 사람으로 컴퓨터 시스템의 구성 요소에 포함된다.
      선택지 2: 하드웨어는 컴퓨터를 이루는 물리적 장치(처리기, 기억장치, 입출력장치)로 핵심 구성 요소이다.
      선택지 3: 소프트웨어는 하드웨어를 동작시키는 프로그램(시스템 소프트웨어, 응용 소프트웨어)으로 구성 요소에 포함된다.
      선택지 4: 인터넷은 전 세계 컴퓨터를 연결하는 통신망으로, 하나의 컴퓨터 시스템 자체를 이루는 요소가 아니므로 정답이다.

      핵심 개념:
      하나의 완전한 컴퓨터 시스템은 하드웨어, 소프트웨어, 데이터, 사용자로 구성된다.
      하드웨어는 물리적 장치, 소프트웨어는 이를 동작시키는 프로그램이다.
      데이터는 처리 대상이고, 사용자는 시스템을 이용하는 사람이다.
      네트워크나 인터넷은 여러 컴퓨터 시스템을 연결하는 외부 환경이다.

  - id: t01-05
    type: multiple-choice
    prompt: 다음 설명 중 가장 적절한 것은?
    choices:
      - { id: '1', text: '운영체제는 가장 대표적인 응용 소프트웨어이다.' }
      - { id: '2', text: '데이터는 컴퓨터에서 처리 가능한 작업 유형과 연산의 집합을 결정한다.' }
      - { id: '3', text: '폰 노이만 모델에서는 비트 패턴 형태의 데이터 저장 방식을 제안하고 있다.' }
      - { id: '4', text: '데이터는 현실 세계로부터 관찰이나 측정을 통해 단순히 얻어지는 값이나 사실이다.' }
    answers: ['4']
    explanation: |
      선택지 1: 운영체제는 하드웨어를 관리하고 응용 프로그램의 실행 환경을 제공하는 대표적인 시스템 소프트웨어이며, 응용 소프트웨어가 아니다.
      선택지 2: 처리 가능한 작업 유형과 연산의 집합을 결정하는 것은 프로그램이며, 데이터는 처리 대상이다.
      선택지 3: 폰 노이만 모델의 핵심 제안은 프로그램을 데이터와 함께 주기억장치에 저장하는 프로그램 내장 방식이며, 비트 패턴 형태의 데이터 저장 방식을 제안한 모델이 아니다.
      선택지 4: 데이터는 현실 세계에서 관찰이나 측정으로 얻은 단순한 값이나 사실이므로 정답이다.

      핵심 개념:
      데이터는 관찰·측정으로 얻은 가공되지 않은 값이고, 정보는 데이터를 처리하여 얻은 의미 있는 결과이다.
      프로그램은 컴퓨터가 수행할 수 있는 작업의 유형과 연산 집합을 결정한다.
      소프트웨어는 운영체제 같은 시스템 소프트웨어와 워드프로세서 같은 응용 소프트웨어로 나뉜다.
      폰 노이만 모델은 프로그램 내장(stored program) 개념을 제시했다.

  - id: t01-06
    type: multiple-choice
    prompt: 10진수 0.625를 8진수와 16진수로 각각 올바르게 표현한 것은?
    choices:
      - { id: '1', text: '0.5 0.A' }
      - { id: '2', text: '0.7 0.A' }
      - { id: '3', text: '0.5 0.B' }
      - { id: '4', text: '0.7 0.B' }
    answers: ['1']
    explanation: |
      선택지 1: 8진수는 $0.625 \times 8 = 5.0$이므로 $0.5_{(8)}$, 16진수는 $0.625 \times 16 = 10.0$이므로 $0.\mathrm{A}_{(16)}$이다. 따라서 정답이다.
      선택지 2: $0.7_{(8)} = 7/8 = 0.875$이므로 8진수 표현이 틀렸다.
      선택지 3: $0.\mathrm{B}_{(16)} = 11/16 = 0.6875$이므로 16진수 표현이 틀렸다.
      선택지 4: $0.7_{(8)} = 0.875$, $0.\mathrm{B}_{(16)} = 0.6875$로 두 표현 모두 틀렸다.

      핵심 개념:
      10진 소수를 r진수로 바꿀 때는 소수 부분에 r을 반복해서 곱하고, 나온 정수 부분을 차례로 적는다.
      $0.625 = 5/8 = 10/16$이므로 8진수 0.5, 16진수 0.A이다.
      2진수로는 $0.101_{(2)}$이며, 3비트씩 묶으면 8진수(101 → 5), 4비트씩 묶으면 16진수(1010 → A)가 된다.
      16진수에서 A~F는 10~15를 나타낸다.

  - id: t01-07
    type: multiple-choice
    prompt: '$531.74_{(8)}$를 16진법의 표현으로 알맞게 나타낸 것은?'
    choices:
      - { id: '1', text: '159.F' }
      - { id: '2', text: 'AC1.3C' }
      - { id: '3', text: '159.3C' }
      - { id: '4', text: 'AC1.F' }
    answers: ['1']
    explanation: |
      선택지 1: 8진수 각 자리를 3비트로 바꾸면 101 011 001 . 111 100이고, 정수부는 소수점에서 왼쪽으로, 소수부는 오른쪽으로 4비트씩 묶으면 0001 0101 1001 . 1111 0000 → 159.F이다. 따라서 정답이다.
      선택지 2: AC1.3C는 정수부를 왼쪽 끝부터(1010 1100 1), 소수부를 오른쪽 끝부터(11 1100) 묶어 만든 잘못된 값으로, $531.74_{(8)} = 345.9375$와 같지 않다.
      선택지 3: 정수부 159는 맞지만 소수부 .111100을 오른쪽부터 묶어 .3C로 만든 잘못된 변환이다. 소수부는 소수점 바로 뒤부터 4비트씩 묶어야 .F이다.
      선택지 4: 소수부 F는 맞지만 정수부 AC1은 비트열을 왼쪽 끝부터 4비트씩 묶은 잘못된 값이다. 정수부는 소수점에서 왼쪽 방향으로 묶어야 159이다.

      핵심 개념:
      8진수 → 16진수 변환은 2진수를 거친다(8진 1자리 = 3비트, 16진 1자리 = 4비트).
      정수부는 소수점에서 왼쪽 방향으로, 소수부는 소수점에서 오른쪽 방향으로 4비트씩 묶고 모자란 자리는 0으로 채운다.
      $531.74_{(8)} = 101011001.1111_{(2)} = 159.\mathrm{F}_{(16)} = 345.9375_{(10)}$이다.
      검산: $1 \times 256 + 5 \times 16 + 9 + 15/16 = 345.9375$이다.

  - id: t01-08
    type: multiple-choice
    passageRefs: [gt01-radix-values-01]
    prompt: 다음 중 가장 큰 수를 나타내는 진법은?
    choices:
      - { id: '1', text: '2진법' }
      - { id: '2', text: '8진법' }
      - { id: '3', text: '10진법' }
      - { id: '4', text: '16진법' }
    answers: ['4']
    explanation: |
      선택지 1: $11100101_{(2)} = 128 + 64 + 32 + 4 + 1 = 229$이다.
      선택지 2: $343_{(8)} = 3 \times 64 + 4 \times 8 + 3 = 227$이다.
      선택지 3: $227_{(10)} = 227$이다.
      선택지 4: $\mathrm{E7}_{(16)} = 14 \times 16 + 7 = 231$로 네 수 중 가장 크므로 정답이다.

      핵심 개념:
      서로 다른 진법의 수를 비교할 때는 모두 10진수로 바꾸어 비교한다.
      r진수 각 자리의 값은 (자릿수) × r^(자리 위치)의 합이다.
      16진수 E는 14를 뜻한다.
      크기 순서는 231(16진) > 229(2진) > 227(8진) = 227(10진)이다.

  - id: t01-09
    type: multiple-choice
    prompt: 십진수 −109를 8비트의 2의 보수 방식으로 올바르게 표현한 것은?
    choices:
      - { id: '1', text: '10010010' }
      - { id: '2', text: '10010011' }
      - { id: '3', text: '11101100' }
      - { id: '4', text: '11101101' }
    answers: ['2']
    explanation: |
      선택지 1: 10010010은 109(01101101)의 각 비트를 반전한 1의 보수 표현으로, 2의 보수를 얻으려면 1을 더해야 한다.
      선택지 2: 109 = 01101101을 비트 반전하면 10010010이고, 1을 더하면 10010011이므로 정답이다.
      선택지 3: 11101100은 2의 보수로 해석하면 −20으로 −109가 아니다.
      선택지 4: 11101101은 부호화-크기 방식에서 −109(부호 1 + 크기 1101101)를 나타내는 패턴이며, 2의 보수 표현이 아니다.

      핵심 개념:
      2의 보수는 양수의 2진 표현을 모두 반전(1의 보수)한 뒤 1을 더해 음수를 표현한다.
      109 = 64 + 32 + 8 + 4 + 1 = 01101101이다.
      검산: $10010011 = -128 + 16 + 2 + 1 = -109$이다.
      8비트 2의 보수의 표현 범위는 −128~127이다.

  - id: t01-10
    type: multiple-choice
    prompt: 8비트를 사용한 비트 패턴 10000000을 정수로 해석할 때 가장 작은 값을 나타내는 정수의 표현 방법은?
    choices:
      - { id: '1', text: '부호화-크기 방법' }
      - { id: '2', text: '1의 보수 방법' }
      - { id: '3', text: '2의 보수 방법' }
      - { id: '4', text: '초과표기법' }
    answers: ['3']
    explanation: |
      선택지 1: 부호화-크기 방법에서는 부호 비트 1, 크기 0000000이므로 −0(0)을 나타낸다.
      선택지 2: 1의 보수 방법에서는 10000000을 반전하면 01111111(127)이므로 −127을 나타낸다.
      선택지 3: 2의 보수 방법에서는 10000000이 −128로, 네 방법 중 가장 작은 값이므로 정답이다.
      선택지 4: 8비트 초과표기법(초과_127)에서는 128 − 127 = 1을 나타낸다.

      핵심 개념:
      같은 비트 패턴도 정수 표현 방법에 따라 값이 달라진다.
      부호화-크기와 1의 보수에는 +0과 −0이 따로 존재하고, 2의 보수에는 0이 하나뿐이다.
      8비트 2의 보수에서 10000000은 표현 가능한 최솟값 −128이다.
      초과표기법은 저장값에서 바이어스(초과_127이면 127)를 빼서 실제 값을 얻는다.

  - id: t01-11
    type: multiple-choice
    prompt: 실수 1101001.0101을 정규화하여 부동소수점으로 표현할 때 지수 부분에 해당하는 값은 얼마인가?
    choices:
      - { id: '1', text: '7' }
      - { id: '2', text: '6' }
      - { id: '3', text: '5' }
      - { id: '4', text: '4' }
    answers: ['2']
    explanation: |
      선택지 1: 지수가 7이면 $0.11010010101 \times 2^7$이 되어 소수점 왼쪽이 0이므로, 소수점 왼쪽에 1을 한 자리 남기는 정규화 형태가 아니다.
      선택지 2: $1101001.0101 = 1.1010010101 \times 2^6$이므로 소수점을 왼쪽으로 6자리 옮겨 지수는 6이다. 따라서 정답이다.
      선택지 3: 지수 5로는 $11.010010101 \times 2^5$가 되어 소수점 왼쪽에 두 자리가 남으므로 정규화 형태가 아니다.
      선택지 4: 지수 4로는 $110.10010101 \times 2^4$가 되어 정규화 형태가 아니다.

      핵심 개념:
      정규화는 2진 실수를 $1.xxx \times 2^E$ 꼴로, 소수점 왼쪽에 1 하나만 남도록 소수점을 옮기는 것이다.
      소수점을 왼쪽으로 k자리 옮기면 지수는 +k, 오른쪽으로 옮기면 −k이다.
      1101001.0101은 정수부가 7자리이므로 6자리를 옮겨 지수가 6이다.
      실제 저장 시에는 지수에 바이어스를 더한 초과표기법 값을 저장한다.

  - id: t01-12
    type: multiple-choice
    prompt: 부동소수점 표현에서 지수 부분의 비트 표현이 10000101일 때 10진수에 해당하는 지수값은 얼마인가? (단, 초과_127을 사용한다.)
    choices:
      - { id: '1', text: '−5' }
      - { id: '2', text: '6' }
      - { id: '3', text: '122' }
      - { id: '4', text: '133' }
    answers: ['2']
    explanation: |
      선택지 1: $10000101_{(2)} = 133$은 바이어스 127보다 크므로 실제 지수는 양수이고, −5가 될 수 없다.
      선택지 2: $10000101_{(2)} = 133$이고, 초과_127이므로 $133 - 127 = 6$이다. 따라서 정답이다.
      선택지 3: 122는 $133 - 127 = 6$과 다르다. 초과_127에서 저장값 122는 지수 $122 - 127 = -5$에 해당한다.
      선택지 4: 133은 비트 패턴을 그대로 부호 없는 정수로 읽은 값이며, 바이어스 127을 빼지 않았다.

      핵심 개념:
      부동소수점의 지수 부분은 초과표기법(바이어스 표기)으로 저장한다.
      실제 지수 = 저장된 비트 패턴의 부호 없는 값 − 바이어스이다.
      8비트 지수에 초과_127을 쓰면 저장값 127이 지수 0에 해당한다.
      $10000101_{(2)} = 128 + 4 + 1 = 133$이다.

  - id: t01-13
    type: multiple-choice
    prompt: 8비트를 사용한 2의 보수 방법으로 표현된 정수의 비트 패턴이 11100111이다. 이 값을 8비트 초과표기법으로 올바르게 표현한 것은? (단, 초과_127을 사용한다.)
    choices:
      - { id: '1', text: '00011001' }
      - { id: '2', text: '00011000' }
      - { id: '3', text: '01100111' }
      - { id: '4', text: '01100110' }
    answers: ['4']
    explanation: |
      선택지 1: 00011001은 25로, 2의 보수 값 −25의 크기만 나타낸 패턴이며 초과표기법 값이 아니다.
      선택지 2: 00011000은 24로, 11100111의 1의 보수(비트 반전) 결과이다.
      선택지 3: 01100111은 103으로, 초과_127에서 −24를 나타내므로 −25와 1 차이가 난다.
      선택지 4: 11100111은 2의 보수로 −25(반전 00011000 + 1 = 00011001 = 25)이고, 초과_127 표현은 −25 + 127 = 102 = 01100110이다. 따라서 정답이다.

      핵심 개념:
      2의 보수 음수의 크기는 비트 반전 후 1을 더해 구한다.
      초과_127 표기법은 실제 값에 127을 더한 결과를 부호 없는 2진수로 저장한다.
      $11100111_{(2)}$(2의 보수) $= -128 + 64 + 32 + 4 + 2 + 1 = -25$이다.
      $-25 + 127 = 102 = 01100110_{(2)}$이다.

  - id: t01-14
    type: multiple-choice
    prompt: 주어진 컴퓨터 시스템은 부동소수점을 표현하기 위해 16비트를 사용하며, 이 중에서 지수 부분은 5비트를 할당하여 초과_15로 표현하고 나머지 비트는 부호와 가수를 표현한다. 이와 같은 시스템에서 부동소수점으로 표현된 0 10010 1011110000은 10진수로 얼마인가?
    choices:
      - { id: '1', text: '13.875' }
      - { id: '2', text: '23.5' }
      - { id: '3', text: '11.75' }
      - { id: '4', text: '2.9375' }
    answers: ['1']
    explanation: |
      선택지 1: 부호 0(양수), 지수 $10010_{(2)} = 18$에서 $18 - 15 = 3$, 가수 1011110000 앞에 정규화의 1을 붙이면 $1.101111 \times 2^3 = 1101.111_{(2)} = 13.875$이다. 따라서 정답이다.
      선택지 2: 23.5 = $10111.1_{(2)} = 1.01111 \times 2^4$로, 지수와 가수가 모두 주어진 비트 패턴과 다르다.
      선택지 3: 11.75 = $1011.11_{(2)}$로, 정규화의 숨은 1을 빼고 가수 비트 1011110000을 그대로 $1.011110000$처럼 읽은 잘못된 해석에 해당한다.
      선택지 4: 2.9375 = $10.1111_{(2)} = 1.01111 \times 2^1$로, 지수 3과 가수 1.1011110000이 나타내는 값과 다르다.

      핵심 개념:
      부동소수점 = 부호 비트 + 지수(바이어스 표기) + 가수(정규화된 소수 부분)로 구성된다.
      실제 지수 = 저장된 지수 − 바이어스(여기서는 15)이다.
      정규화 형태 $1.xxx$의 맨 앞 1은 저장하지 않으므로 복원할 때 붙여야 한다.
      $1101.111_{(2)} = 8 + 4 + 1 + 0.5 + 0.25 + 0.125 = 13.875$이다.

  - id: t01-15
    type: multiple-choice
    prompt: 컴퓨터의 문자 코드 체계 중에서 가장 많은 문자를 나타낼 수 있는 것은?
    choices:
      - { id: '1', text: 'EBCDIC' }
      - { id: '2', text: 'ASCII' }
      - { id: '3', text: '유니코드' }
      - { id: '4', text: '확장 ASCII' }
    answers: ['3']
    explanation: |
      선택지 1: EBCDIC(Extended Binary Coded Decimal Interchange Code)는 8비트 코드로 최대 256개 문자를 표현한다.
      선택지 2: ASCII(American Standard Code for Information Interchange)는 7비트 코드로 128개 문자만 표현한다.
      선택지 3: 유니코드는 16비트 이상을 사용해 전 세계 문자를 표현하는 코드 체계로, 보기 중 가장 많은 문자를 나타내므로 정답이다.
      선택지 4: 확장 ASCII는 ASCII를 8비트로 확장한 코드로 256개 문자를 표현한다.

      핵심 개념:
      표현할 수 있는 문자 수는 코드에 쓰는 비트 수 n에 따라 $2^n$개이다.
      ASCII는 7비트(128자), 확장 ASCII와 EBCDIC은 8비트(256자)이다.
      유니코드는 16비트 이상을 사용하여 한글을 포함한 전 세계 언어의 문자를 하나의 체계로 표현한다.
      다국어 처리를 위해 현재 대부분의 시스템이 유니코드를 사용한다.

  # ── 제2장 자료구조 (교재 70~73쪽) ──
  - id: t02-01
    type: multiple-choice
    passageRefs: [gt02-tree-01]
    prompt: 주어진 트리에 대한 설명으로 올바르지 ==않은== 것은? (단, 루트 레벨은 0부터 시작한다.)
    choices:
      - { id: '1', text: '트리의 차수는 3이다.' }
      - { id: '2', text: '비단말 노드의 수는 모두 7이다.' }
      - { id: '3', text: '단말 노드는 C, J, K, L, M, N, I밖에 없다.' }
      - { id: '4', text: '트리의 깊이는 3이다.' }
    answers: ['4']
    explanation: |
      선택지 1: 노드 A와 D가 각각 서브트리 3개를 가져 최대 차수가 3이므로 트리의 차수는 3이다. 올바른 설명이다.
      선택지 2: 자식을 가진 비단말 노드는 A, B, D, E, F, G, H로 7개이다. 올바른 설명이다.
      선택지 3: 자식이 없는 단말 노드는 C, I, J, K, L, M, N이다. 올바른 설명이다.
      선택지 4: 트리의 깊이는 루트에서 리프에 이르는 가장 긴 경로(예: A-B-E-J)에 있는 노드의 개수로 4이다. 레벨은 0~3이지만 깊이는 3이 아니므로 올바르지 않은 설명이며 정답이다.

      핵심 개념:
      노드의 차수는 그 노드의 서브트리(자식) 수이고, 트리의 차수는 노드 차수 중 최댓값이다.
      단말 노드(리프)는 차수가 0인 노드, 비단말 노드는 차수가 1 이상인 노드이다.
      레벨은 루트를 0(또는 1)으로 두고 아래로 1씩 증가한다.
      깊이는 루트에서 리프까지 가장 긴 경로의 노드 개수로, 루트 레벨이 0이면 최대 레벨 + 1이다.

  - id: t02-02
    type: multiple-choice
    prompt: 이진트리에 대한 설명으로 올바른 것은?
    choices:
      - { id: '1', text: '각 노드의 차수 중에서 최소 차수가 2 이상이다.' }
      - { id: '2', text: '포화 이진트리는 각 레벨에서 빈 자리가 없이 노드를 모두 가진다.' }
      - { id: '3', text: '루트 레벨이 0이고 깊이가 2인 이진트리의 최대 노드의 수는 8개이다.' }
      - { id: '4', text: '한 노드에 대한 서브트리의 순서는 대칭적인 관계를 갖기 때문에 중요하지 않다.' }
    answers: ['2']
    explanation: |
      선택지 1: 이진트리는 모든 노드의 차수가 2 이하(최대 차수 2)인 트리이며, 리프의 차수는 0이므로 최소 차수가 2 이상일 수 없다.
      선택지 2: 포화 이진트리는 모든 레벨이 빈 자리 없이 노드로 꽉 찬 이진트리이므로 올바른 설명이며 정답이다.
      선택지 3: 깊이가 k인 이진트리의 최대 노드 수는 $2^k - 1$이므로 깊이 2이면 3개이다. 8개는 어떤 깊이에서도 $2^k - 1$ 꼴이 될 수 없다.
      선택지 4: 이진트리는 왼쪽 서브트리와 오른쪽 서브트리를 구별하는 순서 트리이므로 서브트리의 순서가 중요하다.

      핵심 개념:
      이진트리는 각 노드가 최대 두 개의 자식(왼쪽, 오른쪽)을 갖는 트리로, 좌우 서브트리를 구별한다.
      포화 이진트리는 모든 레벨이 꽉 찬 이진트리이고, 완전 이진트리는 마지막 레벨을 제외하고 꽉 차며 마지막 레벨은 왼쪽부터 채워진 이진트리이다.
      깊이 k인 이진트리의 최대 노드 수는 $2^k - 1$이다.
      레벨 i(루트 레벨 0)의 최대 노드 수는 $2^i$이다.

  - id: t02-03
    type: multiple-choice
    prompt: 한쪽 끝에서 모든 삽입을 수행하고 다른 쪽 끝에서 모든 삭제를 수행하는 구조의 리스트 자료구조를 무엇이라 하는가?
    choices:
      - { id: '1', text: '큐' }
      - { id: '2', text: '스택' }
      - { id: '3', text: '이중 연결 리스트' }
      - { id: '4', text: '배열' }
    answers: ['1']
    explanation: |
      선택지 1: 큐는 한쪽 끝(rear)에서 삽입하고 다른 쪽 끝(front)에서 삭제하는 선입선출(FIFO, First-In First-Out) 구조이므로 정답이다.
      선택지 2: 스택은 삽입과 삭제가 모두 한쪽 끝(top)에서만 일어나는 후입선출(LIFO, Last-In First-Out) 구조이다.
      선택지 3: 이중 연결 리스트는 각 노드가 앞뒤 노드를 가리키는 포인터를 가진 리스트로, 삽입·삭제 위치가 양 끝으로 제한되지 않는다.
      선택지 4: 배열은 같은 자료형의 원소를 연속된 기억공간에 저장하고 인덱스로 접근하는 구조로, 삽입·삭제 위치에 제한이 없다.

      핵심 개념:
      큐는 rear에서 삽입(enqueue), front에서 삭제(dequeue)하는 FIFO 구조이다.
      스택은 top 한 곳에서만 삽입(push)과 삭제(pop)가 일어나는 LIFO 구조이다.
      큐는 작업 대기열, 버퍼 등에 쓰이고 스택은 함수 호출, 수식 계산 등에 쓰인다.
      양쪽 끝에서 삽입·삭제가 모두 가능한 구조는 데크(deque)라고 한다.

  - id: t02-04
    type: multiple-choice
    prompt: 트리의 루트 노드에서 리프 노드에 이르는 가장 긴 경로에 존재하는 노드의 개수를 무엇이라고 하는가?
    choices:
      - { id: '1', text: '가지 수' }
      - { id: '2', text: '차수' }
      - { id: '3', text: '레벨' }
      - { id: '4', text: '깊이' }
    answers: ['4']
    explanation: |
      선택지 1: 가지(branch)는 노드와 노드를 연결하는 선으로, 가지 수는 경로상의 노드 수가 아니다.
      선택지 2: 차수는 한 노드가 가진 서브트리(자식)의 개수이다.
      선택지 3: 레벨은 루트로부터 각 노드까지의 층 번호로, 개별 노드의 위치를 나타낸다.
      선택지 4: 깊이(높이)는 루트에서 리프에 이르는 가장 긴 경로에 존재하는 노드의 개수이므로 정답이다.

      핵심 개념:
      차수는 노드의 자식 수, 트리의 차수는 노드 차수의 최댓값이다.
      레벨은 루트를 기준으로 한 각 노드의 층 번호이다.
      깊이는 루트부터 가장 먼 리프까지 경로상의 노드 개수이다.
      가지는 노드 사이를 잇는 연결선이다.

  - id: t02-05
    type: multiple-choice
    passageRefs: [gt02-stack-ops-01]
    prompt: 다음 스택 연산을 완료한 후, 스택에 남아 있는 모든 값을 더하면 얼마인가?
    choices:
      - { id: '1', text: '10' }
      - { id: '2', text: '12' }
      - { id: '3', text: '13' }
      - { id: '4', text: '17' }
    answers: ['4']
    explanation: |
      선택지 1: 10은 마지막 push(S, 7) 직전 스택 [10]의 합으로, 연산을 모두 마친 뒤의 합이 아니다.
      선택지 2: 12는 두 번째 연산 직후 스택 [10, 2]의 합으로, 이어지는 pop(S)에서 2가 제거된다.
      선택지 3: 13은 네 번째 연산 직후 스택 [10, 3]의 합으로, 이어지는 if 문의 pop(S)에서 3이 제거되고 7이 들어간다.
      선택지 4: [10] → [10, 2] → pop으로 2 제거 [10] → [10, 3] → 스택이 비어 있지 않으므로 pop으로 3 제거 [10] → [10, 7]이 되어 합은 17이다. 따라서 정답이다.

      핵심 개념:
      스택은 top에서만 삽입(push)과 삭제(pop)가 일어나는 후입선출(LIFO) 구조이다.
      pop은 가장 마지막에 push된 원소를 꺼낸다.
      empty(S)는 스택이 비어 있는지 검사하는 연산으로, 빈 스택에서 pop하면 언더플로가 발생한다.
      연산을 한 단계씩 따라가며 스택 상태를 기록하면 실수를 줄일 수 있다.

  - id: t02-06
    type: multiple-choice
    passageRefs: [gt02-bintree-traversal-01, gt02-traversal-result-01]
    prompt: 주어진 이진트리를 순회하여 다음과 같은 순회 결과를 얻었다. 어떤 순회 방법을 사용하였는가?
    choices:
      - { id: '1', text: '너비 우선 순회' }
      - { id: '2', text: '중위 순회' }
      - { id: '3', text: '후위 순회' }
      - { id: '4', text: '전위 순회' }
    answers: ['3']
    explanation: |
      선택지 1: 너비 우선 순회는 레벨 순으로 H, E, N, B, G, K, P, J, M을 방문하므로 H가 G보다 먼저, N이 P보다 먼저 방문되어 조건에 맞지 않는다.
      선택지 2: 중위 순회는 B, E, G, H, J, K, M, N, P로 G가 H보다 먼저이지만 N이 P보다 먼저 방문되어 두 번째 조건에 맞지 않는다.
      선택지 3: 후위 순회는 B, G, E, J, M, K, P, N, H로 G는 H보다, P는 N보다, J는 M보다 먼저 방문되어 세 조건을 모두 만족하므로 정답이다.
      선택지 4: 전위 순회는 H, E, B, G, N, K, J, M, P로 루트 H가 가장 먼저 방문되어 첫 번째 조건에 맞지 않는다.

      핵심 개념:
      전위 순회는 루트 → 왼쪽 서브트리 → 오른쪽 서브트리 순으로 방문한다.
      중위 순회는 왼쪽 서브트리 → 루트 → 오른쪽 서브트리 순으로 방문한다.
      후위 순회는 왼쪽 서브트리 → 오른쪽 서브트리 → 루트 순으로, 자식이 항상 부모보다 먼저 방문된다.
      "자식(P)이 부모(N)보다 먼저"이면서 "오른쪽 자식이 부모보다 먼저"인 순회는 후위 순회뿐이다.

  - id: t02-07
    type: multiple-choice
    prompt: 그래프 관련 용어에 대한 설명으로 ==틀린== 것은?
    choices:
      - { id: '1', text: '간선이 두 정점을 직접적으로 연결시키고 있을 때 두 정점을 인접한 정점이라고 한다.' }
      - { id: '2', text: '각 정점과 인접해 있는 정점들의 나열을 사이클이라고 한다.' }
      - { id: '3', text: '두 정점 사이에 경로가 존재하는 경우를 연결되었다고 한다.' }
      - { id: '4', text: '방향 그래프에서 적어도 두 정점이 어느 한 방향의 경로만 존재할 때 약하게 연결되었다고 한다.' }
    answers: ['2']
    explanation: |
      선택지 1: 한 간선으로 직접 연결된 두 정점을 인접(adjacent)하다고 하므로 올바른 설명이다.
      선택지 2: 사이클은 시작 정점과 끝 정점이 같은 경로를 말한다. 각 정점과 인접한 정점들을 나열한 것은 인접 리스트 등으로 표현하는 인접 관계이지 사이클이 아니므로 틀린 설명이며 정답이다.
      선택지 3: 두 정점 사이에 경로가 있으면 두 정점이 연결되었다고 하므로 올바른 설명이다.
      선택지 4: 방향 그래프에서 어떤 두 정점 사이에 한 방향의 경로만 존재하면 약하게 연결(weakly connected)되었다고 하므로 올바른 설명이다.

      핵심 개념:
      인접은 두 정점이 하나의 간선으로 직접 연결된 관계이다.
      경로는 간선으로 이어진 정점의 나열이고, 사이클은 시작 정점과 끝 정점이 같은 경로이다.
      모든 정점 쌍 사이에 경로가 있으면 연결 그래프이다.
      방향 그래프에서 모든 정점 쌍에 양방향 경로가 있으면 강하게 연결, 한 방향 경로만 있는 쌍이 있으면 약하게 연결되었다고 한다.

  - id: t02-08
    type: multiple-choice
    passageRefs: [gt02-bintree-preorder-01]
    prompt: 다음의 이진트리를 전위 순회할 때, 노드 C는 몇 번째로 방문되는가?
    choices:
      - { id: '1', text: '5' }
      - { id: '2', text: '6' }
      - { id: '3', text: '7' }
      - { id: '4', text: '8' }
    answers: ['2']
    explanation: |
      선택지 1: 전위 순회에서 5번째로 방문되는 노드는 H이다.
      선택지 2: 전위 순회 순서는 A, B, D, E, H, C, F, G, I, J이므로 C는 6번째로 방문된다. 따라서 정답이다.
      선택지 3: 7번째로 방문되는 노드는 F이다.
      선택지 4: 8번째로 방문되는 노드는 G이다.

      핵심 개념:
      전위 순회는 루트 → 왼쪽 서브트리 → 오른쪽 서브트리 순서로 재귀적으로 방문한다.
      오른쪽 서브트리의 루트 C는 왼쪽 서브트리(B, D, E, H)를 모두 방문한 뒤에 방문된다.
      왼쪽 서브트리 노드 수가 4개이므로 C는 1(루트) + 4 + 1 = 6번째이다.
      중위 순회라면 D, B, H, E, A, F, C, I, G, J로 C는 7번째가 된다.

  - id: t02-09
    type: multiple-choice
    passageRefs: [gt02-graph-dfs-01]
    prompt: 다음과 같은 무방향 그래프를 깊이 우선 탐색을 수행할 때 방문한 노드를 순서대로 나열한 것은?
    choices:
      - { id: '1', text: '1−2−4−5−8−6−7−3' }
      - { id: '2', text: '1−2−4−8−5−6−3−7' }
      - { id: '3', text: '1−2−3−4−5−6−7−8' }
      - { id: '4', text: '1−2−4−8−5−6−7−3' }
    answers: ['2']
    explanation: |
      선택지 1: 4를 방문한 뒤 4에는 아직 방문하지 않은 인접 정점 8이 남아 있다. 깊이 우선 탐색은 미방문 인접 정점이 없을 때만 되돌아가므로 4 다음에는 8을 방문해야 하며, 곧바로 5로 넘어갈 수 없다.
      선택지 2: 1 → 2 → 4 → 8 → (8의 미방문 인접 정점 중 작은 번호) 5 → 5는 더 갈 곳이 없어 8로 되돌아와 6 → 6의 인접 정점 3 → 3의 미방문 인접 정점 7 순으로 방문하므로 정답이다.
      선택지 3: 1−2−3−4−5−6−7−8은 레벨 순으로 방문한 너비 우선 탐색 결과이다.
      선택지 4: 6을 방문한 뒤 6에는 아직 방문하지 않은 인접 정점 3이 남아 있다. 깊이 우선 탐색은 미방문 인접 정점이 없을 때만 되돌아가므로 6 다음에는 3을 방문해야 하며, 8로 되돌아가 7을 먼저 방문할 수 없다.

      핵심 개념:
      깊이 우선 탐색(DFS, Depth-First Search)은 현재 정점의 미방문 인접 정점으로 계속 깊이 들어가고, 더 갈 곳이 없으면 되돌아간다(백트래킹).
      인접 정점이 여럿이면 일반적으로 번호가 작은 정점부터 방문한다.
      스택(또는 재귀 호출)을 사용하여 구현한다.
      너비 우선 탐색(BFS, Breadth-First Search)은 큐를 사용해 가까운 정점부터 차례로 방문한다.

  - id: t02-10
    type: multiple-choice
    prompt: 배열에 대한 설명으로 올바른 것은?
    choices:
      - { id: '1', text: '삽입과 삭제 연산 수행 시 추가적인 연산으로 인해 오버헤드가 발생하는 정적 구조를 갖는다.' }
      - { id: '2', text: '2개 이상의 서로 다른 구조를 가진 데이터 항목을 하나의 변수 이름으로 묶고 인덱스를 사용해서 구분하는 자료구조이다.' }
      - { id: '3', text: '배열의 기억공간은 포트란과 코볼에서처럼 항상 동적으로 할당이 이루어진다.' }
      - { id: '4', text: '배열에서 각 원소에 대한 접근 시간은 원소가 어느 위치에 저장되어 있느냐에 따라 차이가 발생한다.' }
    answers: ['1']
    explanation: |
      선택지 1: 배열은 크기가 고정된 정적 구조이며, 중간에 삽입·삭제하면 뒤 원소들을 이동해야 하므로 오버헤드가 발생한다. 올바른 설명이며 정답이다.
      선택지 2: 배열은 같은 자료형(같은 구조)의 데이터 항목을 하나의 이름으로 묶고 인덱스로 구분하는 자료구조이다. 서로 다른 구조의 항목을 묶는 것은 구조체(레코드)이다.
      선택지 3: 포트란과 코볼의 배열은 컴파일 시간에 크기가 정해지는 정적 할당 방식이므로 틀린 설명이다.
      선택지 4: 배열은 연속된 기억공간에 저장되어 인덱스로 주소를 바로 계산하므로 모든 원소의 접근 시간이 같다(직접 접근).

      핵심 개념:
      배열은 같은 자료형의 원소들을 연속된 기억공간에 저장하고 인덱스로 구분하는 정적 자료구조이다.
      인덱스로 주소를 계산하므로 임의 원소 접근 시간은 위치와 무관하게 일정하다.
      중간 삽입·삭제는 원소 이동이 필요하여 비용이 크다.
      크기 변화나 잦은 삽입·삭제가 필요하면 연결 리스트가 유리하다.

  - id: t02-11
    type: multiple-choice
    prompt: 그래프 순회 방법 중에서 인접했지만 방문하지 않은 모든 정점을 하나씩 차례로 방문하는 방식은 무엇인가?
    choices:
      - { id: '1', text: '피보나치 탐색' }
      - { id: '2', text: '깊이 우선 탐색' }
      - { id: '3', text: '이진 탐색' }
      - { id: '4', text: '너비 우선 탐색' }
    answers: ['4']
    explanation: |
      선택지 1: 피보나치 탐색은 정렬된 배열에서 피보나치 수열을 이용해 탐색 구간을 나누는 탐색 알고리즘으로 그래프 순회 방법이 아니다.
      선택지 2: 깊이 우선 탐색은 인접한 미방문 정점 하나로 계속 깊이 들어가다가 막히면 되돌아오는 방식으로, 인접 정점을 모두 차례로 방문하지 않는다.
      선택지 3: 이진 탐색은 정렬된 배열에서 중간값과 비교하여 탐색 범위를 절반씩 줄이는 알고리즘으로 그래프 순회 방법이 아니다.
      선택지 4: 너비 우선 탐색은 현재 정점에 인접하면서 방문하지 않은 모든 정점을 하나씩 차례로 방문한 뒤 다음 단계로 넘어가므로 정답이다.

      핵심 개념:
      그래프 순회 방법에는 깊이 우선 탐색(DFS)과 너비 우선 탐색(BFS)이 있다.
      BFS는 시작 정점에서 가까운 정점부터 차례로 방문하며 큐를 사용한다.
      DFS는 한 경로를 끝까지 따라간 뒤 되돌아오며 스택(재귀)을 사용한다.
      이진 탐색과 피보나치 탐색은 정렬된 배열에서 값을 찾는 탐색 알고리즘이다.

  - id: t03-01
    type: multiple-choice
    prompt: 컴퓨터를 사용한 문제 해결의 가능성이라는 이론적인 측면에서 알고리즘이 만족해야 할 조건이 ==아닌== 것은?
    choices:
      - { id: '1', text: '효율성' }
      - { id: '2', text: '유한성' }
      - { id: '3', text: '명확성' }
      - { id: '4', text: '유효성' }
    answers: ['1']
    explanation: |
      선택지 1: 효율성은 알고리즘의 품질(수행 시간·메모리 사용량)을 비교하는 평가 기준이며, 문제 해결 가능성 측면에서 알고리즘이 되기 위해 반드시 만족해야 하는 조건에는 포함되지 않으므로 정답이다.
      선택지 2: 유한성은 알고리즘이 유한한 단계를 거친 뒤 반드시 종료되어야 한다는 조건으로, 알고리즘의 필수 조건이다.
      선택지 3: 명확성은 각 명령어가 모호하지 않고 뜻이 분명해야 한다는 조건으로, 알고리즘의 필수 조건이다.
      선택지 4: 유효성은 각 명령어가 사람이 종이와 연필로도 수행할 수 있을 만큼 기본적이고 실행 가능해야 한다는 조건으로, 알고리즘의 필수 조건이다.

      핵심 개념:
      알고리즘은 주어진 문제를 해결하기 위한 명령어들의 유한 집합이다.
      알고리즘이 만족해야 할 조건은 입력, 출력, 명확성, 유한성, 유효성이다.
      입력은 0개 이상, 출력은 1개 이상이어야 한다.
      효율성은 알고리즘의 조건이 아니라 여러 알고리즘 중 더 좋은 것을 고르는 평가 기준이다.

  - id: t03-02
    type: multiple-choice
    prompt: 다음 중 알고리즘의 대표적인 설계 기법으로 거리가 ==먼== 것은?
    choices:
      - { id: '1', text: '욕심쟁이 방법' }
      - { id: '2', text: '선형회귀 방법' }
      - { id: '3', text: '동적 프로그래밍 방법' }
      - { id: '4', text: '분할정복 방법' }
    answers: ['2']
    explanation: |
      선택지 1: 욕심쟁이 방법(greedy method)은 매 단계에서 가장 좋아 보이는 선택을 하여 해를 구성하는 대표적인 알고리즘 설계 기법이다.
      선택지 2: 선형회귀 방법은 변수 사이의 선형 관계를 추정하는 통계적 분석 기법으로, 알고리즘 설계 기법이 아니므로 정답이다.
      선택지 3: 동적 프로그래밍 방법(dynamic programming)은 작은 부분 문제의 해를 저장해 두고 이를 이용해 큰 문제의 해를 구하는 대표적인 설계 기법이다.
      선택지 4: 분할정복 방법(divide and conquer)은 문제를 작은 문제로 나누어 해결한 뒤 결합하는 대표적인 설계 기법이다.

      핵심 개념:
      대표적인 알고리즘 설계 기법에는 분할정복 방법, 동적 프로그래밍 방법, 욕심쟁이 방법이 있다.
      분할정복은 분할 → 정복 → 결합의 순서로 문제를 푼다.
      동적 프로그래밍은 부분 문제의 해를 표에 저장해 중복 계산을 피한다.
      욕심쟁이 방법은 각 단계의 최선 선택이 전체 최적해로 이어지는 문제에 적합하다.

  - id: t03-03
    type: multiple-choice
    prompt: n개의 물체에 대한 배낭 문제의 해결에 가장 적합한 알고리즘 설계 기법은? (단, 물체는 쪼갤 수 있다고 가정한다.)
    choices:
      - { id: '1', text: '선형회귀 방법' }
      - { id: '2', text: '분할정복 방법' }
      - { id: '3', text: '욕심쟁이 방법' }
      - { id: '4', text: '동적 프로그래밍 방법' }
    answers: ['3']
    explanation: |
      선택지 1: 선형회귀 방법은 통계적 분석 기법으로, 알고리즘 설계 기법이 아니므로 배낭 문제 해결과 관련이 없다.
      선택지 2: 분할정복 방법은 문제를 독립적인 작은 문제로 나누어 푸는 기법으로, 배낭 문제처럼 선택이 서로 영향을 주는 최적화 문제에는 적합하지 않다.
      선택지 3: 물체를 쪼갈 수 있는 배낭 문제(fractional knapsack)는 단위 무게당 이익이 큰 물체부터 담는 욕심쟁이 방법으로 최적해를 구할 수 있으므로 정답이다.
      선택지 4: 동적 프로그래밍 방법은 물체를 쪼갤 수 없는 0/1 배낭 문제에 적합한 기법이며, 쪼갤 수 있는 경우에는 더 간단한 욕심쟁이 방법으로 충분하다.

      핵심 개념:
      배낭 문제는 무게 제한이 있는 배낭에 이익의 합이 최대가 되도록 물체를 담는 문제이다.
      물체를 쪼갤 수 있으면 단위 무게당 이익(이익/무게)이 큰 순서로 담는 욕심쟁이 방법이 최적해를 준다.
      물체를 쪼갤 수 없는 0/1 배낭 문제는 욕심쟁이 방법으로 최적해가 보장되지 않아 동적 프로그래밍을 사용한다.
      욕심쟁이 방법은 매 단계에서 가장 좋아 보이는 선택을 하는 설계 기법이다.

  - id: t03-04
    type: multiple-choice
    prompt: 알고리즘의 수행 시간에 대한 설명으로 적절한 것은?
    choices:
      - { id: '1', text: '입력되는 데이터의 상태에 무관하다.' }
      - { id: '2', text: '알고리즘을 실제 실행시켜 측정된 수행 시간을 이용한다.' }
      - { id: '3', text: '프로그램 길이에 대한 함수로 표현한다.' }
      - { id: '4', text: '일반적으로 최악의 수행 시간을 평가 척도로 사용한다.' }
    answers: ['4']
    explanation: |
      선택지 1: 같은 크기의 입력이라도 데이터가 이미 정렬되어 있는지 등 입력 상태에 따라 수행 시간이 달라질 수 있으므로(예: 삽입 정렬) 틀린 설명이다.
      선택지 2: 실제 실행 시간은 컴퓨터 성능, 프로그래밍 언어, 컴파일러 등에 따라 달라지므로, 알고리즘의 수행 시간은 단위 연산의 실행 횟수로 분석한다.
      선택지 3: 수행 시간은 프로그램 길이가 아니라 입력 크기 n에 대한 함수로 표현한다.
      선택지 4: 최악의 수행 시간은 어떤 입력에 대해서도 그 시간을 넘지 않는다는 상한을 보장하므로 일반적인 평가 척도로 사용된다. 정답이다.

      핵심 개념:
      알고리즘의 수행 시간은 입력 크기 n에 대한 함수로, 단위 연산의 실행 횟수로 나타낸다.
      입력 데이터의 상태에 따라 최선, 평균, 최악의 수행 시간으로 구분한다.
      최악의 수행 시간은 성능의 상한을 보장하므로 일반적인 평가 척도가 된다.
      평균 수행 시간은 입력 분포를 가정해야 하므로 분석이 어렵다.

  - id: t03-05
    type: multiple-choice
    prompt: 알고리즘의 점근성능이란?
    choices:
      - { id: '1', text: '알고리즘의 해가 얼마만큼의 오차를 포함하는지를 나타내는 성능' }
      - { id: '2', text: '확률적으로 구한 성능의 추정치' }
      - { id: '3', text: '입력 크기가 무한히 커질 때 결정되는 성능' }
      - { id: '4', text: '최악의 경우의 알고리즘 성능' }
    answers: ['3']
    explanation: |
      선택지 1: 해가 포함하는 오차는 근사 알고리즘의 정확도(근사 비율)에 관한 개념으로, 점근성능과 관계가 없다.
      선택지 2: 확률적으로 구한 추정치는 평균 수행 시간이나 확률적 분석에 해당하는 설명이며 점근성능의 정의가 아니다.
      선택지 3: 점근성능은 입력 크기 n이 무한히 커질 때 수행 시간 함수의 증가 추세(최고차항)로 결정되는 성능이므로 정답이다.
      선택지 4: 최악의 경우 성능은 입력 상태에 따른 분류(최선·평균·최악) 중 하나이며, 점근성능은 최선·평균·최악 어느 경우에도 적용하는 표현 방식이다.

      핵심 개념:
      점근성능은 입력 크기가 충분히 클 때 수행 시간이 증가하는 비율로 성능을 나타낸다.
      수행 시간 함수에서 최고차항만 남기고 계수와 낮은 차수 항은 무시한다.
      점근성능은 빅오(O), 빅오메가(Ω), 빅세타(Θ) 등의 점근 표기법으로 나타낸다.
      입력 크기가 작을 때의 차이보다 큰 입력에서의 증가율이 알고리즘 비교에 중요하다.

  - id: t03-06
    type: multiple-choice
    prompt: 다음 그림이 의미하는 점근성능의 표기법은?
    images:
      - path: images/subjects/introduction-to-computer-science/textbook/t03-06.png
        alt: 가로축 입력 크기, 세로축 수행 시간 그래프. 입력 크기 n0 이후로 c·g(n) 곡선이 f(n) 곡선보다 항상 위에 있다.
    choices:
      - { id: '1', text: '$f(n)=\Omega(g(n))$' }
      - { id: '2', text: '$f(n)=o(g(n))$' }
      - { id: '3', text: '$f(n)=\Theta(g(n))$' }
      - { id: '4', text: '$f(n)=O(g(n))$' }
    answers: ['4']
    explanation: |
      선택지 1: 빅오메가 표기 $f(n)=\Omega(g(n))$는 $n \ge n_0$에서 $f(n) \ge c \cdot g(n)$, 즉 $c \cdot g(n)$이 하한일 때 쓰므로 그림과 반대이다.
      선택지 2: 스몰오 표기 $f(n)=o(g(n))$는 모든 양의 상수 $c$에 대해 $f(n) < c \cdot g(n)$이 성립하는 엄격한 상한을 뜻하며, 그림은 특정 상수 $c$ 하나에 대한 상한만 보여 준다.
      선택지 3: 빅세타 표기 $f(n)=\Theta(g(n))$는 $c_1 g(n) \le f(n) \le c_2 g(n)$처럼 위아래 두 곡선 사이에 $f(n)$이 놓여야 하는데, 그림에는 위쪽 곡선 하나만 있다.
      선택지 4: 그림은 $n_0$ 이후 모든 입력 크기에서 $f(n) \le c \cdot g(n)$, 즉 $c \cdot g(n)$이 $f(n)$의 상한임을 나타내므로 빅오 표기 $f(n)=O(g(n))$이다. 정답이다.

      핵심 개념:
      $f(n)=O(g(n))$: $n \ge n_0$인 모든 $n$에 대해 $f(n) \le c \cdot g(n)$을 만족하는 양의 상수 $c$, $n_0$가 존재한다(점근적 상한).
      $f(n)=\Omega(g(n))$: $n \ge n_0$에서 $f(n) \ge c \cdot g(n)$(점근적 하한).
      $f(n)=\Theta(g(n))$: $c_1 g(n) \le f(n) \le c_2 g(n)$(점근적 상한이자 하한).
      $n_0$ 이전 구간에서는 $f(n)$이 $c \cdot g(n)$보다 커도 된다.

  - id: t03-07
    type: multiple-choice
    prompt: 다음 빅오 함수 중에서 가장 효율적인 성능을 나타내는 것은?
    choices:
      - { id: '1', text: '$O(\log n)$' }
      - { id: '2', text: '$O(n)$' }
      - { id: '3', text: '$O(n\log n)$' }
      - { id: '4', text: '$O(n^2)$' }
    answers: ['1']
    explanation: |
      선택지 1: $O(\log n)$은 입력 크기가 두 배가 되어도 수행 시간이 상수만큼만 늘어나는 로그 시간으로, 보기 중 증가율이 가장 작아 가장 효율적이다. 정답이다.
      선택지 2: $O(n)$은 입력 크기에 비례하는 선형 시간으로, $n$이 커지면 $O(\log n)$보다 빠르게 증가한다.
      선택지 3: $O(n\log n)$은 선형 시간에 로그 인자가 곱해진 시간으로, $O(n)$보다 증가율이 크다.
      선택지 4: $O(n^2)$은 입력 크기의 제곱에 비례하는 2차 시간으로, 보기 중 증가율이 가장 커서 가장 비효율적이다.

      핵심 개념:
      빅오 함수는 증가율이 작을수록 효율적인 알고리즘이다.
      증가율 순서는 $O(1) < O(\log n) < O(n) < O(n\log n) < O(n^2) < O(n^3) < O(2^n)$이다.
      이진 탐색은 $O(\log n)$, 순차 탐색은 $O(n)$의 대표적인 예이다.
      합병 정렬은 $O(n\log n)$, 버블·선택·삽입 정렬은 $O(n^2)$이다.

  - id: t03-08
    type: multiple-choice
    prompt: 주어진 입력 배열에서 가장 작은 값, 두 번째로 작은 값 등의 데이터를 순서대로 골라 재배열시켜 정렬하기 때문에 알고리즘의 수행 시간이 입력 데이터의 상태와 무관하게 일정한 알고리즘은?
    choices:
      - { id: '1', text: '퀵 정렬' }
      - { id: '2', text: '선택 정렬' }
      - { id: '3', text: '삽입 정렬' }
      - { id: '4', text: '버블 정렬' }
    answers: ['2']
    explanation: |
      선택지 1: 퀵 정렬(quick sort)은 피벗을 기준으로 분할하는 방식이며, 피벗 선택과 입력 상태에 따라 수행 시간이 $O(n\log n)$에서 $O(n^2)$까지 달라진다.
      선택지 2: 선택 정렬(selection sort)은 남은 데이터 중 가장 작은 값을 골라 차례로 앞에 놓는 방식으로, 입력 상태와 관계없이 항상 $n(n-1)/2$번 비교하여 수행 시간이 $O(n^2)$으로 일정하다. 정답이다.
      선택지 3: 삽입 정렬(insertion sort)은 데이터를 정렬된 부분의 알맞은 위치에 끼워 넣는 방식으로, 이미 정렬된 입력이면 $O(n)$, 역순이면 $O(n^2)$처럼 입력 상태에 따라 수행 시간이 달라진다.
      선택지 4: 버블 정렬(bubble sort)은 인접한 두 데이터를 비교·교환하는 방식이며, 교환이 없으면 조기 종료하는 구현에서는 입력 상태에 따라 수행 시간이 달라진다.

      핵심 개념:
      선택 정렬은 최솟값을 찾아 맨 앞과 교환하는 과정을 반복한다.
      비교 횟수는 입력 상태와 무관하게 항상 $(n-1)+(n-2)+\cdots+1 = n(n-1)/2$이다.
      따라서 최선·평균·최악의 수행 시간이 모두 $O(n^2)$이다.
      삽입 정렬은 입력이 거의 정렬되어 있을수록 빨라진다.

  - id: t03-09
    type: multiple-choice
    passageRefs: [gt03-bubble-pass-01]
    prompt: 주어진 데이터를 버블 정렬로 정렬할 때, 밑줄 친 부분이 이미 정렬된 부분이라면 다음 단계에 해당하는 결과는?
    choices:
      - { id: '1', text: '10 5 15 25 20 30 35 40' }
      - { id: '2', text: '10 15 5 20 25 30 35 40' }
      - { id: '3', text: '10 5 15 20 25 30 35 40' }
      - { id: '4', text: '10 15 5 25 20 30 35 40' }
    answers: ['1']
    explanation: |
      선택지 1: 정렬되지 않은 부분 25 10 5 15 30 20에 대해 앞에서부터 인접한 두 값을 비교·교환하면 25↔10 → 10 25 5 15 30 20, 25↔5 → 10 5 25 15 30 20, 25↔15 → 10 5 15 25 30 20, 25<30 유지, 30↔20 → 10 5 15 25 20 30이 된다. 여기에 35 40을 붙인 결과와 같으므로 정답이다.
      선택지 2: 버블 정렬 한 단계에서는 뒤로 밀려 가는 값(25, 30)을 제외한 나머지 값 10, 5, 15, 20의 상대 순서가 그대로 유지되어야 한다. 이 보기는 5와 15의 순서가 뒤바뀌어 있고 20도 25 앞에 있어 한 단계의 결과가 될 수 없다.
      선택지 3: 한 단계에서는 25가 30 앞에서 멈춘 뒤 30과 20이 교환되므로 20은 25 뒤에 남는다(10 5 15 25 20 30). 한 단계를 더 진행하면 10과 5도 교환되어 5 10 15 20 25 30이 되므로, 이 보기는 어느 단계의 결과도 아니다.
      선택지 4: 25와 30의 이동은 맞지만, 한 단계에서 뒤로 밀리지 않는 값 5와 15는 원래 순서(5 → 15)를 유지해야 하는데 이 보기는 15 5로 되어 있어 교환 과정과 맞지 않는다.

      핵심 개념:
      버블 정렬은 인접한 두 데이터를 비교하여 앞의 값이 크면 교환하는 과정을 반복한다.
      한 단계가 끝나면 정렬되지 않은 부분의 가장 큰 값이 그 부분의 맨 끝으로 이동한다.
      이 문제에서는 30이 35 앞에 자리 잡아 정렬된 부분이 30 35 40으로 늘어난다.
      전체 수행 시간은 $O(n^2)$이다.

  - id: t03-10
    type: multiple-choice
    prompt: 주어진 배열에 대해서 피벗이 제자리를 잡도록 해서 정렬하는 알고리즘은?
    choices:
      - { id: '1', text: '버블 정렬' }
      - { id: '2', text: '퀵 정렬' }
      - { id: '3', text: '합병 정렬' }
      - { id: '4', text: '삽입 정렬' }
    answers: ['2']
    explanation: |
      선택지 1: 버블 정렬은 인접한 두 데이터를 비교·교환하는 방식으로, 피벗을 사용하지 않는다.
      선택지 2: 퀵 정렬은 피벗을 기준으로 작은 값은 왼쪽, 큰 값은 오른쪽으로 분할하여 피벗이 최종 위치(제자리)를 잡도록 한 뒤 양쪽 부분 배열을 재귀적으로 정렬하므로 정답이다.
      선택지 3: 합병 정렬(merge sort)은 배열을 절반으로 나누어 각각 정렬한 뒤 두 정렬된 배열을 합병하는 방식으로, 피벗을 사용하지 않는다.
      선택지 4: 삽입 정렬은 데이터를 하나씩 정렬된 부분의 알맞은 위치에 끼워 넣는 방식으로, 피벗을 사용하지 않는다.

      핵심 개념:
      퀵 정렬은 분할정복 방법을 적용한 정렬 알고리즘이다.
      피벗을 기준으로 배열을 두 부분으로 분할하면 피벗은 최종 정렬 위치에 놓인다.
      평균 수행 시간은 $O(n\log n)$, 최악 수행 시간은 $O(n^2)$이다.
      최악의 경우는 피벗이 매번 최솟값이나 최댓값으로 선택될 때 발생한다.

  - id: t03-11
