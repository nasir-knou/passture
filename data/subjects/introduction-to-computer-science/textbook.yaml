      선택지 2: 선택 정렬은 입력 상태와 무관하게 항상 $O(n^2)$이므로 최악도 $O(n^2)$이다.
      선택지 3: 합병 정렬은 입력을 항상 절반으로 나누고 합병에 $O(n)$이 들므로 최선·평균·최악 모두 $O(n\log n)$이다. 최악이 $O(n^2)$이 아니므로 정답이다.
      선택지 4: 삽입 정렬은 역순으로 정렬된 입력에서 매번 모든 원소를 이동해야 하므로 최악 $O(n^2)$이다.

      핵심 개념:
