      선택지 2: 분할정복 방법은 문제를 작은 문제로 나누어 해결한 뒤 결합하는 대표적인 설계 기법이다.
      선택지 3: 욕심쟁이 방법은 매 단계에서 가장 좋아 보이는 선택을 하는 대표적인 설계 기법이다.
      선택지 4: 회귀분석 방법은 변수 사이의 관계를 추정하는 통계 분석 기법으로 알고리즘 설계 기법이 아니므로 정답이다.

      핵심 개념:
      주어진 문제와 조건이 매우 다양하므로 범용적인 알고리즘 설계 방법론은 존재하지 않는다.
      하지만 많은 부류의 문제에 적용될 수 있는 대표적인 설계 기법이 있다.
      대표적인 설계 기법은 욕심쟁이 방법, 분할정복 방법, 동적 프로그래밍 방법이다.
