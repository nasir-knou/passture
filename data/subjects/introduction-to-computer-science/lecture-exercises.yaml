  - id: l05-03
    type: multiple-choice
    passageRefs: [gla-knapsack-01]
    prompt: |
      다음과 같은 조건의 배낭 문제를 욕심쟁이 방법으로 해결할 때 가장 먼저 배낭에 넣는 물체는? (단, 물체는 쪼개서 배낭에 넣을 수 있다.)

      - 배낭의 무게: 10kg
    choices:
      - { id: '1', text: '물체1' }
      - { id: '2', text: '물체2' }
      - { id: '3', text: '물체3' }
      - { id: '4', text: '물체4' }
    answers: ['2']
    explanation: |
      선택지 1: 물체1의 단위 무게당 이익은 $20/5=4$로 두 번째로 크므로 물체2 다음에 넣는다. 이익 자체가 가장 크다고 먼저 넣는 것이 아니다.
      선택지 2: 물체2의 단위 무게당 이익은 $15/3=5$로 가장 크므로 가장 먼저 배낭에 넣는다. 정답이다.
      선택지 3: 물체3의 단위 무게당 이익은 $14/4=3.5$로 세 번째이다.
      선택지 4: 물체4의 단위 무게당 이익은 $9/3=3$으로 가장 작다.

      핵심 개념:
      물체를 쪼갤 수 있는 배낭 문제는 욕심쟁이 방법으로 최적해를 구할 수 있다.
      배낭 용량을 넘지 않으면서 최대 이익을 얻으려면 무게는 적고 이익은 큰 물체부터 넣는다.
      따라서 각 물체의 단위 무게당 이익(이익 ÷ 무게)을 계산해 큰 순서대로 최대한 넣는다.
      이 문제의 순서는 물체2(5) → 물체1(4) → 물체3(3.5) → 물체4(3)이다.

  - id: l05-04
