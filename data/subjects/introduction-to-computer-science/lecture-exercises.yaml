      선택지 2: 시간 복잡도는 코드 길이나 단위 연산의 개수가 아니라 입력 크기 $n$의 함수로 표현한다.
      선택지 3: 같은 입력 크기라도 입력 데이터의 상태에 따라 수행 횟수가 달라지므로 옳은 설명이며 정답이다.
      선택지 4: 입력 상태에 따라 수행 시간이 달라지므로 일반적으로 최선이 아닌 최악의 수행 시간을 평가 척도로 사용한다.

      핵심 개념:
      시간 복잡도는 알고리즘에서 수행되는 기본 연산들의 수행 횟수의 합으로 정의한다.
      단순히 단위 연산의 개수가 아니라 입력 크기 $n$의 함수로 표현한다.
      입력 데이터의 상태에 따라 수행 시간이 달라진다.
      따라서 일반적으로 최악의 수행 시간을 알고리즘의 평가 척도로 사용한다.

  - id: l05-05
    type: multiple-choice
    prompt: '$f(n)=3n^3+3n-1$이라고 하고 $g(n)=n^3$이라고 하자. $n>1$에 대하여 $f(n)\le 7g(n)$일 때 $f(n)$에 대한 올바른 점근성능의 표기는?'
    choices:
      - { id: '1', text: '$f(n)=O(n^3)$' }
      - { id: '2', text: '$f(n)=\Omega(n^3)$' }
      - { id: '3', text: '$f(n)=\Theta(n^3)$' }
      - { id: '4', text: '$f(n)=\Phi(n^3)$' }
    answers: ['1']
    explanation: |
      선택지 1: 1보다 큰 모든 $n$에 대해 $f(n)\le 7\cdot g(n)$이라는 것은 $f(n)$이 아무리 커져도 $7\cdot g(n)$을 넘지 않는다는 점근적 상한을 의미하므로, 빅오(Big-Oh) 표기 $f(n)=O(n^3)$이 정답이다.
      선택지 2: 빅오메가(Big-Omega) 표기 $\Omega$는 $f(n)\ge c\cdot g(n)$인 점근적 하한을 나타낸다. 실제로 $n\ge1$에서 $f(n)\ge 3n^3$이므로 $f(n)=\Omega(n^3)$도 수학적으로는 성립하지만, 문제에 주어진 조건 $f(n)\le 7g(n)$이 나타내는 것은 하한이 아니라 상한이므로 이 조건에 대한 표기로는 맞지 않다.
      선택지 3: 빅세타(Big-Theta) 표기 $\Theta$는 $c_1\cdot g(n)\le f(n)\le c_2\cdot g(n)$인 점근적 상하한을 나타낸다. $3n^3\le f(n)\le 7n^3$이므로 $f(n)=\Theta(n^3)$도 성립하지만, 문제의 조건은 상한 한쪽만 제시하므로 그 조건이 보여 주는 표기는 빅오이다.
      선택지 4: $\Phi$는 점근 성능을 나타내는 표기법이 아니다.

      핵심 개념:
      빅오 $O$: 어떤 $n_0$ 이후 모든 $n$에 대해 $f(n)\le c\cdot g(n)$이면 $f(n)=O(g(n))$이며, 점근적 상한을 뜻한다.
      빅오메가 $\Omega$: $f(n)\ge c\cdot g(n)$이면 $f(n)=\Omega(g(n))$이며, 점근적 하한을 뜻한다.
      빅세타 $\Theta$: $c_1\cdot g(n)\le f(n)\le c_2\cdot g(n)$이면 $f(n)=\Theta(g(n))$이며, 점근적 상하한을 뜻한다.
      문제의 조건 $f(n)\le 7g(n)$ ($n>1$)이 직접 보여 주는 것은 상한 관계이므로 $O(n^3)$으로 표기한다(하한까지 따지면 $\Theta(n^3)$도 성립한다).

  - id: l05-06
    type: multiple-choice
    prompt: |
      미정렬 데이터 중에서 가장 작은 키값을 갖는 데이터를 선택하고, 선택된 값과 미정렬 데이터 부분의 첫 번째 데이터와 교환하는 방식의 정렬 알고리즘은?
      (단, 오름차순으로 정렬한다.)
    choices:
      - { id: '1', text: '합병 정렬' }
      - { id: '2', text: '버블 정렬' }
      - { id: '3', text: '삽입 정렬' }
      - { id: '4', text: '선택 정렬' }
    answers: ['4']
    explanation: |
      선택지 1: 합병 정렬은 데이터를 절반씩 나누어 각각 정렬한 뒤 합치는 분할정복 방식이다.
      선택지 2: 버블 정렬은 인접한 두 데이터를 비교해 순서가 맞지 않으면 교환하는 과정을 반복하는 방식이다.
      선택지 3: 삽입 정렬은 미정렬 부분의 첫 번째 데이터를 꺼내 정렬된 부분의 알맞은 위치에 삽입하는 방식이다.
      선택지 4: 선택 정렬은 미정렬 데이터 중 가장 작은 값을 선택해 미정렬 부분의 첫 번째 데이터와 교환하는 방식이므로 정답이다.

      핵심 개념:
      선택 정렬은 주어진 데이터 중에서 가장 작은 값부터 차례대로 선택해서 나열하는 방식이다.
      매 단계마다 미정렬 부분의 최솟값을 찾아 미정렬 부분의 맨 앞과 교환한다.
      한 단계가 끝날 때마다 정렬된 부분이 앞쪽에서 한 칸씩 늘어난다.
      교환은 단계마다 한 번만 일어나므로 버블 정렬보다 데이터 교환이 적다.

  - id: l05-07
    type: multiple-choice
    prompt: 버블 정렬에 대한 설명으로 올바른 것은?
    choices:
      - { id: '1', text: '역순으로 정렬된 입력 데이터에 대한 성능은 $O(n)$이다.' }
      - { id: '2', text: '데이터의 입력 상태에 민감하지 않은 수행 시간을 갖는다.' }
      - { id: '3', text: '선택 정렬에 비해 데이터 교환이 많이 발생한다.' }
      - { id: '4', text: '정렬되지 않는 부분의 첫 번째 데이터를 선택해서 정렬된 부분에 위치시킨다.' }
    answers: ['3']
    explanation: |
      선택지 1: 입력 데이터가 역순으로 정렬된 경우는 버블 정렬의 최악 경우로 성능은 $O(n^2)$이다.
      선택지 2: 데이터의 입력 상태에 민감하지 않은 수행 시간을 갖는 것은 선택 정렬에 대한 설명이다.
      선택지 3: 버블 정렬은 인접한 데이터를 비교할 때마다 교환이 일어날 수 있어 선택 정렬에 비해 데이터 교환이 많이 발생하므로 옳은 설명이며 정답이다. 이 때문에 선택 정렬보다 비효율적이다.
      선택지 4: 정렬되지 않은 부분의 첫 번째 데이터를 선택해 정렬된 부분의 알맞은 위치에 넣는 것은 삽입 정렬에 대한 설명이다.

      핵심 개념:
      버블 정렬은 인접한 두 데이터를 비교해 순서가 맞지 않으면 교환하는 과정을 반복한다.
      역순 입력은 최악의 경우로 $O(n^2)$의 성능을 가진다.
      선택 정렬은 입력 상태와 무관하게 비교 횟수가 같고, 단계마다 교환이 한 번뿐이다.
      버블 정렬은 교환이 많이 발생해 선택 정렬보다 비효율적이다.

  - id: l06-01
    type: multiple-choice
    prompt: 퀵 정렬에 대한 설명으로 틀린 것은?
    choices:
      - { id: '1', text: '항상 동일한 크기의 두 부분배열로 분할된다.' }
      - { id: '2', text: '분할정복 방법을 적용하였다.' }
      - { id: '3', text: '최악의 시간 복잡도는 $O(n^2)$이다.' }
      - { id: '4', text: '최선 수행 시간은 $O(n\log n)$이다.' }
    answers: ['1']
    explanation: |
      선택지 1: 항상 동일한 크기로 분할되는 것은 합병 정렬의 특징이다. 퀵 정렬은 피벗이라는 특정 데이터를 기준으로 분할하므로 왼쪽과 오른쪽 부분배열의 크기가 일정하지 않아 틀린 설명이다.
      선택지 2: 퀵 정렬은 피벗을 기준으로 배열을 두 부분으로 나누고 각 부분을 재귀적으로 정렬하는 분할정복 방법이므로 옳은 설명이다.
      선택지 3: 피벗이 매번 최솟값이나 최댓값으로 선택되어 한쪽 부분배열이 비는 경우 분할이 $n-1$번 일어나 최악의 시간 복잡도는 $O(n^2)$이 되므로 옳은 설명이다.
      선택지 4: 피벗이 매번 배열을 거의 같은 크기로 나누면 분할 깊이가 $\log n$이 되어 최선 수행 시간은 $O(n\log n)$이므로 옳은 설명이다.

      핵심 개념:
      퀵 정렬은 피벗을 기준으로 작은 값은 왼쪽, 큰 값은 오른쪽으로 모으는 분할을 반복하는 분할정복 정렬이다.
      분할 결과 두 부분배열의 크기는 피벗 값에 따라 달라진다.
      균등하게 분할되면 $O(n\log n)$, 한쪽으로 치우치면 $O(n^2)$의 수행 시간이 걸린다.
      반면 합병 정렬은 항상 배열을 절반 크기로 나누므로 분할 크기가 일정하다.
    tags: [quick-sort, divide-and-conquer]

  - id: l06-02
    type: multiple-choice
    passageRefs: [glb-quick-partition-data-01]
    prompt: 주어진 데이터에 대해 퀵 정렬의 분할 과정을 한 번 적용한 후의 왼쪽 부분배열의 첫 번째 데이터는? (단, 배열의 첫 번째 원소를 피벗으로 사용한다.)
    choices:
      - { id: '1', text: '10' }
      - { id: '2', text: '11' }
      - { id: '3', text: '15' }
      - { id: '4', text: '17' }
    answers: ['2']
    explanation: |
      선택지 1: 10은 분할 후 왼쪽 부분배열의 다섯 번째 위치에 남으며 첫 번째 데이터가 아니다.
      선택지 2: 피벗 35로 분할하면 L은 35보다 큰 값, R은 35보다 작은 값을 찾아 77과 19, 61과 17을 교환한다. 이어서 L이 59, R이 11에서 교차하므로 피벗 35와 11을 교환하여 11 26 15 19 10 17 | 35 | 59 61 48 77 40이 된다. 왼쪽 부분배열의 첫 번째 데이터는 11이므로 정답이다.
      선택지 3: 15는 처음부터 세 번째 위치에 있고 분할 과정에서 이동하지 않으므로 첫 번째 데이터가 될 수 없다.
      선택지 4: 17은 61과 교환되어 여섯 번째 위치로 옮겨질 뿐 왼쪽 부분배열의 첫 번째 데이터가 아니다.

      핵심 개념:
      퀵 정렬의 분할에서는 왼쪽 포인터 L이 피벗보다 큰 값을, 오른쪽 포인터 R이 피벗보다 작은 값을 찾아 서로 교환한다.
      L과 R이 교차하면 R 위치의 값과 피벗을 교환해 피벗을 제자리에 놓는다.
      교환 과정: (77 ↔ 19), (61 ↔ 17), 교차 후 (35 ↔ 11).
      결과적으로 피벗 왼쪽에는 피벗보다 작은 값, 오른쪽에는 큰 값만 남는다.
    tags: [quick-sort, partition]

  - id: l06-03
    type: multiple-choice
    prompt: 합병 정렬 알고리즘의 합병(merge) 과정에 입력으로 주어지는 두 부분배열 X, Y는 어떠한 상태이어야 하는가?
    choices:
      - { id: '1', text: 'X의 모든 원소는 Y의 최소 원소보다 작은 값이어야 한다.' }
      - { id: '2', text: 'X의 모든 원소는 Y의 최대 원소보다 큰 값이어야 한다.' }
      - { id: '3', text: 'X, Y 각각 제 순서로 정렬되어 있어야 한다.' }
      - { id: '4', text: 'X는 제 순서, Y는 역순으로 정렬되어 있어야 한다.' }
    answers: ['3']
    explanation: |
      선택지 1: X의 모든 원소가 Y보다 작아야 한다는 조건은 퀵 정렬의 분할 결과에 가까운 성질이다. 합병 정렬의 합병은 두 부분배열 값의 대소 범위와 무관하게 수행되므로 틀렸다.
      선택지 2: X의 모든 원소가 Y의 최대 원소보다 커야 한다는 조건은 합병 과정의 전제가 아니며, 두 부분배열의 값 범위에는 아무 제약이 없다.
      선택지 3: 합병은 각각 정렬된 두 부분배열의 원소를 앞에서부터 하나씩 비교해 작은 값을 먼저 취하는 방식이므로, X와 Y가 각각 제 순서로 정렬되어 있어야 한다. 정답이다.
      선택지 4: Y가 역순이면 앞에서부터 비교해 작은 값을 취하는 방식으로 올바른 정렬 결과를 얻을 수 없으므로 틀렸다.

      핵심 개념:
      합병 정렬은 배열을 동일한 크기의 두 부분배열로 분할하고, 각각을 재귀적으로 정렬한 뒤 합병한다.
      합병 과정의 입력은 각각 정렬된 두 부분배열이다.
      두 부분배열의 맨 앞 원소를 비교해 작은 값을 결과에 먼저 넣는 과정을 반복한다.
      한쪽이 모두 소진되면 남은 원소를 그대로 이어 붙인다.
    tags: [merge-sort, merge]

  - id: l06-04
    type: multiple-choice
    prompt: 순차 탐색과 이진 탐색에 대한 설명으로 올바른 것은?
    choices:
      - { id: '1', text: '이진 탐색에서는 빈번한 데이터의 삽입과 삭제의 처리가 효율적이다.' }
      - { id: '2', text: '순차 탐색의 최악의 수행 시간은 $O(\log n)$이다.' }
      - { id: '3', text: '이진 탐색은 데이터가 정렬되지 않은 경우에 적합하다.' }
      - { id: '4', text: '순차 탐색은 정렬된 리스트에 적용할 수 있다.' }
    answers: ['4']
    explanation: |
      선택지 1: 이진 탐색은 삽입·삭제 시 정렬 상태를 유지하기 위해 데이터 이동이 발생하므로 삽입·삭제가 빈번한 응용에는 부적합하다.
      선택지 2: 순차 탐색은 처음부터 하나씩 비교하므로 최악의 수행 시간이 $O(n)$이다. $O(\log n)$은 이진 탐색의 성능이다.
      선택지 3: 이진 탐색은 정렬된 데이터를 전제로 가운데 값과 비교해 범위를 절반씩 줄인다. 정렬되지 않은 경우에 적합한 것은 순차 탐색이다.
      선택지 4: 순차 탐색은 데이터의 정렬 여부와 관계없이 모든 리스트에 적용 가능하므로 정렬된 리스트에도 적용할 수 있다. 정답이다.

      핵심 개념:
      순차 탐색은 리스트의 처음부터 끝까지 차례로 비교하며, 수행 시간은 $O(n)$이다.
      이진 탐색은 정렬된 리스트에서 가운데 원소와 비교해 탐색 범위를 절반씩 줄이며, 수행 시간은 $O(\log n)$이다.
      이진 탐색은 정렬 상태 유지 비용 때문에 삽입·삭제가 잦은 경우에는 불리하다.
      순차 탐색은 정렬 여부와 무관하게 적용할 수 있다는 장점이 있다.
    tags: [sequential-search, binary-search]

  - id: l06-05
    type: multiple-choice
    passageRefs: [glb-bst-successor-01]
    prompt: 이진 탐색 트리에서 노드 30의 후속자 노드의 키값은?
    choices:
      - { id: '1', text: '7' }
      - { id: '2', text: '15' }
      - { id: '3', text: '22' }
      - { id: '4', text: '35' }
    answers: ['4']
    explanation: |
      선택지 1: 7은 트리 전체의 최솟값으로, 30보다 작으므로 30의 후속자가 될 수 없다.
      선택지 2: 15는 30의 왼쪽 자식으로 30보다 작은 값이다. 후속자는 30보다 큰 값이어야 한다.
      선택지 3: 22는 30의 왼쪽 서브트리에서 가장 큰 값으로, 30의 선행자(predecessor)에 해당한다.
      선택지 4: 30은 오른쪽 서브트리가 없으므로, 30을 왼쪽 서브트리에 포함하는 가장 가까운 조상 35가 30 바로 다음 키값을 갖는다. 정답이다.

      핵심 개념:
      어떤 노드의 바로 다음 키값을 갖는 노드를 후속자(successor) 노드라고 한다.
      오른쪽 서브트리가 있으면 그 서브트리의 최솟값(가장 왼쪽 노드)이 후속자이다.
      오른쪽 서브트리가 없으면 해당 노드를 왼쪽 서브트리에 포함하는 가장 가까운 조상이 후속자이다.
      중위 순회 결과 7, 15, 22, 30, 35, 40, … 에서 30 바로 다음 값이 35임을 확인할 수 있다.
    tags: [binary-search-tree, successor]

  - id: l06-06
    type: multiple-choice
    prompt: 이진 탐색 트리의 탐색 과정에 대한 최악의 시간 복잡도와 평균 시간 복잡도가 올바르게 짝지어진 것은?
    choices:
      - { id: '1', text: '$O(n)$ - $O(\log n)$' }
      - { id: '2', text: '$O(n\log n)$ - $O(n)$' }
      - { id: '3', text: '$O(n)$ - $O(n)$' }
      - { id: '4', text: '$O(n\log n)$ - $O(\log n)$' }
    answers: ['1']
    explanation: |
      선택지 1: 이미 정렬된 순서로 데이터가 입력되어 경사 트리가 되면 최악 $O(n)$이고, 평균적으로는 트리 높이가 $\log n$ 수준이라 $O(\log n)$이다. 정답이다.
      선택지 2: $O(n\log n)$은 효율적인 비교 정렬의 수행 시간이며, 탐색 한 번의 최악 시간은 트리 높이인 $O(n)$을 넘지 않는다. 평균도 $O(n)$이 아니다.
      선택지 3: 최악은 $O(n)$이 맞지만 평균 탐색 시간은 $O(\log n)$이므로 틀렸다.
      선택지 4: 평균 $O(\log n)$은 맞지만 최악의 탐색 시간은 $O(n\log n)$이 아니라 $O(n)$이다.

      핵심 개념:
      이진 탐색 트리의 탐색 시간은 트리의 높이에 비례한다.
      데이터가 무작위 순서로 입력되면 높이가 약 $\log n$이 되어 평균 탐색 시간은 $O(\log n)$이다.
      이미 정렬된 순서로 입력되면 한쪽으로만 뻗은 경사 트리가 되어 높이가 $n$이 된다.
      이 경우 순차 탐색과 같아져 최악의 시간 복잡도는 $O(n)$이다.
    tags: [binary-search-tree, time-complexity]

  - id: l07-01
    type: multiple-choice
    prompt: 다음 설명 중 올바른 것은?
    choices:
      - { id: '1', text: '페이징 기법은 주기억장치를 페이지라고 불리는 고정 크기의 블록으로 나누고 보조기억장치에 저장된 프로그램이나 데이터를 고정된 크기의 페이지로 쪼개서 주기억장치의 페이지프레임에 올려서 수행하는 기법이다.' }
      - { id: '2', text: '페이징 기법에서 주기억장치의 부분적인 기억 공간이 프로그램에 의해 사용되지 않고 낭비되는 현상을 해결하기 위한 방법으로는 통합과 압축(집약) 기법이 있다.' }
      - { id: '3', text: '세그먼테이션 기법에서는 작은 기억장치 조각이 발생하지 않아서 통합과 압축 기법이 필요없다.' }
      - { id: '4', text: '가상기억장치 기법은 주기억장치의 크기를 넘어서는 프로그램을 실행시킬 수 없다.' }
    answers: ['1']
    explanation: |
      선택지 1: 페이징 기법은 보조기억장치의 프로그램 코드나 데이터를 페이지(page)라는 동일한 크기의 블록으로 쪼개어 같은 크기로 나뉜 주기억장치의 페이지 프레임에 적재하여 접근하는 기법이므로 옳은 설명이다. 다만 엄밀히는 주기억장치를 나눈 단위는 페이지 프레임이고, 프로그램을 나눈 단위가 페이지이다(l07-02 참고). 나머지 선택지가 명백히 틀렸으므로 공식 정답은 1이다.
      선택지 2: 통합과 압축(집약)은 크기가 다른 블록이 출입하면서 생기는 작은 빈 공간(외부 단편화)을 해결하는 기법으로, 세그먼테이션이나 가변 분할 방식에서 필요하다. 페이징은 모든 블록이 같은 크기라 블록 사이의 작은 빈 공간(외부 단편화)이 생기지 않으므로 통합·압축이 필요 없다. 마지막 페이지 안의 남는 공간(내부 단편화)은 생길 수 있지만 통합·압축으로 해결하는 대상이 아니므로 틀렸다.
      선택지 3: 세그먼테이션 기법에서는 다양한 크기의 세그먼트가 출입하므로 작은 기억장치 조각이 발생하며, 이를 해결하려고 통합과 압축 기법이 필요하다.
      선택지 4: 가상기억장치 기법은 프로그램을 페이지나 세그먼트라는 작은 단위로 나눠 주기억장치에 적재하므로 주기억장치의 크기를 벗어나는 프로그램도 실행시킬 수 있다.

      핵심 개념:
      페이징은 프로그램을 고정 크기의 페이지로, 주기억장치를 같은 크기의 페이지 프레임으로 나누어 대응시키는 기법이다.
      세그먼테이션은 프로그램을 논리적 의미에 따라 서로 다른 크기의 세그먼트로 나누므로 작은 기억장치 조각이 생긴다.
      이러한 조각은 인접한 빈 공간을 합치는 통합, 빈 공간을 한쪽으로 모으는 압축(집약)으로 해결한다.
      가상기억장치는 이러한 분할 단위를 이용해 주기억장치보다 큰 프로그램도 실행할 수 있게 한다.
    tags: [paging, segmentation, virtual-memory]

  - id: l07-02
    type: multiple-choice
    prompt: 가상기억장치 구현기법에서 프로그램을 동일한 크기의 영역으로 나눈 것을 무엇이라 부르는가?
    choices:
