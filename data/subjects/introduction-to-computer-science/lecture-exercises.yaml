questions:
  - id: l01-01
    type: multiple-choice
    prompt: 컴퓨터를 데이터 처리기라는 관점으로 정의하려고 한다. 이때 처리 가능한 작업의 유형과 연산의 집합을 결정하는 것은 무엇인가?
    choices:
      - { id: '1', text: '프로그램' }
      - { id: '2', text: '데이터' }
      - { id: '3', text: '입출력' }
      - { id: '4', text: '정보' }
    answers: ['1']
    explanation: |
      선택지 1: 프로그램은 컴퓨터가 처리할 수 있는 작업의 유형과 연산의 집합을 결정하므로 정답이다. 프로그램을 바꾸면 같은 기계로 다른 작업을 할 수 있다.
      선택지 2: 데이터는 입력되어 처리되는 대상일 뿐, 어떤 연산을 수행할지를 결정하지는 않는다.
      선택지 3: 입출력은 데이터 처리기의 기본 기능인 입력과 결과 출력 단계를 가리키며, 처리할 작업의 종류를 정하는 요소가 아니다.
      선택지 4: 정보는 데이터를 처리한 결과로 얻는 의미 있는 값이므로 처리 방식을 결정하는 요소가 아니다.

      핵심 개념:
      컴퓨터는 프로그램이 가능한 데이터 처리기(programmable data processor)로 정의할 수 있다.
      데이터 처리기의 기본 기능은 데이터의 입력(input) → 처리(process) → 결과 출력(output)이다.
      프로그램은 처리 가능한 작업의 유형과 연산의 집합을 결정한다.
      프로그램을 바꿀 수 있기 때문에 컴퓨터는 다양한 작업을 처리하는 범용 기계가 된다.

  - id: l01-02
    type: multiple-choice
    prompt: |
      컴퓨터과학은 데이터 처리 관점에 필요한 다음과 같은 4가지 요소를 통해서 정의할 수 있다. 빈칸에 들어갈 내용으로 적절하지 못한 것은?

      - 컴퓨터과학은 ( ), ( ), ( ), ( ) 분야의 연구를 통해 효율적인 자료 처리를 위한 제반 기술과 방법을 제공한다.
    choices:
      - { id: '1', text: '정보' }
      - { id: '2', text: '데이터' }
      - { id: '3', text: '프로그램' }
      - { id: '4', text: '알고리즘' }
    answers: ['1']
    explanation: |
      선택지 1: 정보는 데이터를 처리한 결과물로, 컴퓨터과학을 정의하는 4가지 연구 분야(컴퓨터, 데이터, 프로그램, 알고리즘)에 포함되지 않으므로 정답이다.
      선택지 2: 데이터는 획득·표현·처리·저장·통신·접근의 대상이 되는 요소로 4가지 분야에 포함된다.
      선택지 3: 프로그램은 컴퓨터가 수행할 작업을 정하는 요소로 4가지 분야에 포함된다.
      선택지 4: 알고리즘은 문제 해결 절차로, 컴퓨터과학의 모든 관련 분야를 알고리즘 중심으로 이해할 수 있을 만큼 핵심 분야에 포함된다.

      핵심 개념:
      컴퓨터과학은 컴퓨터, 데이터, 프로그램, 알고리즘 분야의 연구를 통해 효율적인 자료 처리를 위한 제반 기술과 방법을 제공하는 학문이다.
      데이터의 획득, 표현, 처리, 저장, 통신, 접근을 위한 방법들의 실행 가능성, 구조화, 표현, 기계화를 다루는 학문으로도 정의한다.
      알고리즘과 관련된 이슈를 다루는 학문으로 보아 모든 분야를 알고리즘 중심으로 이해할 수도 있다.
      넓게는 컴퓨터를 활용한 문제 해결에 대한 학문이다.

  - id: l01-03
    type: multiple-choice
    prompt: 하나의 완전한 컴퓨터 시스템을 구성하는 4가지 요소로서 거리가 먼 것은?
    choices:
      - { id: '1', text: '사용자' }
      - { id: '2', text: '인터넷' }
      - { id: '3', text: '소프트웨어' }
      - { id: '4', text: '데이터' }
    answers: ['2']
    explanation: |
      선택지 1: 사용자는 컴퓨터 시스템을 이용해 작업을 수행하는 주체로 4가지 구성 요소에 포함된다.
      선택지 2: 인터넷은 컴퓨터들을 연결하는 네트워크일 뿐, 하나의 완전한 컴퓨터 시스템을 이루는 4가지 요소가 아니므로 정답이다.
      선택지 3: 소프트웨어는 하드웨어를 동작시키는 프로그램으로 4가지 구성 요소에 포함된다.
      선택지 4: 데이터는 컴퓨터가 입력받아 처리하는 대상으로 4가지 구성 요소에 포함된다.

      핵심 개념:
      완전한 컴퓨터 시스템은 하드웨어, 소프트웨어, 데이터, 사용자의 4가지 요소로 구성된다.
      하드웨어는 물리적 장치, 소프트웨어는 이를 동작시키는 프로그램이다.
      데이터는 처리 대상이고, 사용자는 시스템을 활용하는 주체이다.
      네트워크나 인터넷은 시스템 간 연결 수단으로, 4가지 기본 요소와 구분된다.

  - id: l01-04
    type: multiple-choice
    prompt: 폰 노이만 모델과 관련된 설명 중 올바르지 못한 것은?
    choices:
      - { id: '1', text: '컴퓨터의 내부 구조와 처리 과정을 정의한 모델이다.' }
      - { id: '2', text: '내장 프로그램(stored-program) 방식을 제안하고 있다.' }
      - { id: '3', text: '데이터와 함께 실행될 프로그램도 메모리에 저장되어야 한다.' }
      - { id: '4', text: '데이터는 비트 패턴으로 저장되어야 함을 정의하고 있다.' }
    answers: ['4']
    explanation: |
      선택지 1: 폰 노이만 모델은 컴퓨터의 내부 구조와 처리 과정을 정의한 모델이므로 옳은 설명이다.
      선택지 2: 폰 노이만 모델은 기존 프로그래밍 개념을 바꾼 내장 프로그램(stored-program) 방식을 제안했으므로 옳은 설명이다.
      선택지 3: 내장 프로그램 방식에서는 데이터와 함께 실행될 프로그램도 메모리에 저장되어야 하므로 옳은 설명이다.
      선택지 4: 데이터와 프로그램이 같은 메모리에 저장된다는 것은 같은 형식(비트 패턴)으로 저장된다는 의미를 내포할 뿐, 데이터가 컴퓨터에 어떻게 저장되어야 하는지는 정의하지 않으므로 올바르지 못한 설명이다.

      핵심 개념:
      폰 노이만 모델은 컴퓨터의 내부 구조와 처리 과정을 정의한 모델이다.
      기억장치, 산술논리연산장치, 제어장치, 입출력 장치의 4개 서브시스템으로 구성된다.
      내장 프로그램 방식: 데이터와 함께 실행될 프로그램도 메모리에 저장되어야 한다.
      프로그램은 명령어의 나열이며, 미리 정의한 기본 명령어들의 유한한 조합으로 원하는 프로그램을 작성한다.
      명령어들을 재사용할 수 있어 프로그래밍 작업이 간단해진다.

  - id: l02-01
    type: multiple-choice
    prompt: 주어진 여러 진법의 수 중에서 가장 작은 값을 나타내는 것은?
    choices:
      - { id: '1', text: '$0.59375_{(10)}$' }
      - { id: '2', text: '$0.43_{(8)}$' }
      - { id: '3', text: '$0.98_{(16)}$' }
      - { id: '4', text: '$0.10011_{(2)}$' }
    answers: ['2']
    explanation: |
      선택지 1: 십진수 $0.59375_{(10)}$는 그대로 $0.59375$이다.
      선택지 2: $0.43_{(8)} = 4\times8^{-1}+3\times8^{-2} = 0.546875_{(10)}$로 가장 작은 값이므로 정답이다.
      선택지 3: $0.98_{(16)} = 9\times16^{-1}+8\times16^{-2} = 0.59375_{(10)}$이다.
      선택지 4: $0.10011_{(2)} = 1\times2^{-1}+0\times2^{-2}+0\times2^{-3}+1\times2^{-4}+1\times2^{-5} = 0.59375_{(10)}$이다.

      핵심 개념:
      서로 다른 진법의 수를 비교할 때는 모두 십진수로 변환한 뒤 비교한다.
      $r$진수의 소수 부분은 소수점 오른쪽 $k$번째 자리 숫자에 $r^{-k}$를 곱해 더하면 십진수가 된다.
      이 문제에서 선택지 1, 3, 4는 모두 $0.59375$로 같은 값이다.
      $0.43_{(8)}$만 $0.546875$로 더 작다.

  - id: l02-02
    type: multiple-choice
    prompt: 이진수 1100101.10011을 8진수와 16진수로 각각 올바르게 변환한 것은?
    choices:
      - { id: '1', text: '145.46  65.98' }
      - { id: '2', text: '145.23  65.13' }
      - { id: '3', text: '621.46  C5.98' }
      - { id: '4', text: '621.23  C5.13' }
    answers: ['1']
    explanation: |
      선택지 1: 정수 부분은 왼쪽, 소수 부분은 오른쪽으로 묶으면 8진수는 001 100 101 . 100 110 → 145.46, 16진수는 0110 0101 . 1001 1000 → 65.98이므로 정답이다.
      선택지 2: 소수 부분을 오른쪽 끝(10011)부터 묶어 010 011 → 23, 0001 0011 → 13으로 잘못 변환한 결과이다. 소수 부분은 소수점에서 오른쪽 방향으로 묶고 부족한 자리는 뒤에 0을 채워야 한다.
      선택지 3: 정수 부분을 소수점이 아닌 왼쪽 끝(1100101)부터 묶어 110 010 1 → 621, 1100 101 → C5로 잘못 변환한 결과이다. 정수 부분은 소수점에서 왼쪽 방향으로 묶고 앞에 0을 채워야 한다.
      선택지 4: 정수 부분과 소수 부분 모두 묶는 방향을 반대로 한 결과이다.

      핵심 개념:
      2진수를 8진수 또는 16진수로 바꿀 때는 소수점을 기준으로 묶는다.
      정수 부분은 소수점에서 왼쪽 방향, 소수 부분은 소수점에서 오른쪽 방향으로 묶는다.
      세 자리씩 묶으면 8진수 한 자리, 네 자리씩 묶으면 16진수 한 자리가 된다.
      모자라는 자리는 정수 부분은 앞쪽, 소수 부분은 뒤쪽에 0을 채운다.

  - id: l02-03
    type: multiple-choice
    prompt: 2의 보수 방식을 사용해서 8비트로 표현된 정수 10100001은 십진수로 얼마인가?
    choices:
      - { id: '1', text: '-110' }
      - { id: '2', text: '-105' }
      - { id: '3', text: '-100' }
      - { id: '4', text: '-95' }
    answers: ['4']
    explanation: |
      선택지 1: $-110$의 2의 보수 표현은 10010010이므로 주어진 비트 패턴과 다르다.
      선택지 2: $-105$의 2의 보수 표현은 10010111이므로 주어진 비트 패턴과 다르다.
      선택지 3: $-100$의 2의 보수 표현은 10011100이므로 주어진 비트 패턴과 다르다.
      선택지 4: 10100001에서 1을 빼면 10100000이고, 각 비트의 보수를 취하면 01011111 $= 95$이다. 부호 비트가 1이므로 $-95$가 되어 정답이다.

      핵심 개념:
      음수를 2의 보수로 표현하려면 ① 절댓값을 이진수로 바꾸고 ② 각 비트의 보수(0↔1)를 취한 뒤 ③ 1을 더한다.
      2의 보수로 표현된 음수를 십진수로 되돌릴 때는 이 과정을 역순으로 처리한다.
      즉 1을 뺀 뒤 보수를 취해 절댓값을 구하고, 부호 비트가 1이면 음수로 읽는다.
      검산: $256 - 161 = 95$이므로 10100001($161$)은 $-95$를 나타낸다.

  - id: l02-04
    type: multiple-choice
    prompt: |
      십진수 53.625를 부동소수점 방식의 실수 표현으로 올바르게 것은?
      (단, 주어진 부동소수점은 16비트를 사용한다. 이 중에서 지수를 위해 5비트를 할당하며 초과_15 표기법을 사용한다.)
    choices:
      - { id: '1', text: '0 10100 1010110100' }
      - { id: '2', text: '0 01111 1101011010' }
      - { id: '3', text: '0 10100 1101011010' }
      - { id: '4', text: '0 01111 1010110100' }
    answers: ['1']
    explanation: |
      선택지 1: $53.625 = 110101.101_{(2)} = 1.10101101\times2^{5}$이므로 부호 0, 지수 $5+15=20$ → 10100, 가수 1010110100이 되어 정답이다.
      선택지 2: 지수 01111($15$)은 지수값 $5$에 초과 15를 더하지 않고 매직넘버만 적은 값이며, 가수 1101011010은 정규화 전 비트열(110101101)을 그대로 넣은 것이라 틀렸다.
      선택지 3: 지수 10100은 맞지만, 가수에 소수점 왼쪽의 1까지 포함해 1101011010을 넣었으므로 틀렸다. 정규화된 수의 선행 1은 저장하지 않는다.
      선택지 4: 가수 1010110100은 맞지만, 지수를 01111($15$)로 적어 지수값 $5$를 반영하지 않았으므로 틀렸다.

      핵심 개념:
      실수를 정수 부분과 소수 부분으로 나눠 이진수로 바꾼 뒤 $1.xxx\times2^{e}$ 형태로 정규화한다.
      부호 비트(1비트): 양수이면 0, 음수이면 1이다.
      지수(5비트): 초과_15 표기법이므로 지수값 $e$에 매직넘버 15를 더해 저장한다($5+15=20$ → 10100).
      가수(10비트): 소수점 왼쪽의 1을 제외한 나머지(10101101)를 왼쪽부터 채우고 남은 자리는 0으로 채운다.

  - id: l02-05
    type: multiple-choice
    prompt: |
      다음 설명에 해당하는 문자 코드 체계는 무엇인가?

      - 1995년 국제 표준으로 제정되었으며, 공식 명칭은 ISO/IEC 10646-1이다.
      - 16비트 코드 체계로서, 세계의 모든 문자를 표현할 수 있다.
    choices:
      - { id: '1', text: 'ASCII 코드' }
      - { id: '2', text: 'EBCDIC 코드' }
      - { id: '3', text: '유니코드' }
      - { id: '4', text: '확장된 ASCII 코드' }
    answers: ['3']
    explanation: |
      선택지 1: ASCII(American Standard Code for Information Interchange) 코드는 7비트로 영문자·숫자·특수문자 128개를 표현하는 코드로, 세계의 모든 문자를 표현할 수 없다.
      선택지 2: EBCDIC(Extended Binary Coded Decimal Interchange Code) 코드는 IBM(International Business Machines)의 대형 컴퓨터에서 쓰인 8비트 코드로, 국제 표준 문자 코드가 아니다.
      선택지 3: 유니코드는 ISO/IEC(International Organization for Standardization / International Electrotechnical Commission) 10646-1로 국제 표준화된 16비트 코드 체계로 세계의 모든 문자를 표현할 수 있으므로 정답이다.
      선택지 4: 확장된 ASCII 코드는 ASCII에 1비트를 더한 8비트 코드로 256개 문자만 표현하므로 세계의 모든 문자를 담을 수 없다.

      핵심 개념:
      유니코드는 애플, IBM, MS(Microsoft) 등의 컨소시엄을 통해 설계된 산업 표준이다.
      세계의 모든 문자를 컴퓨터에서 일관되게 표현하고 다룰 수 있도록 만들어졌다.
      사용 중인 플랫폼, 프로그램 등에 무관하게 같은 코드값을 가진다는 특징이 있다.
      ASCII(7비트), 확장된 ASCII·EBCDIC(8비트)는 표현할 수 있는 문자 수가 제한된다.

  - id: l03-01
    type: multiple-choice
    prompt: 자료들 사이의 논리적인 인접 구조에 따라 자료 구조를 구분할 때 비선형 자료 구조에 속하는 것은 어느 것인가?
    choices:
      - { id: '1', text: '배열' }
      - { id: '2', text: '리스트' }
      - { id: '3', text: '트리' }
      - { id: '4', text: '큐' }
    answers: ['3']
    explanation: |
      선택지 1: 배열은 원소들이 하나의 일렬 구조(1:1 대응 관계)를 이루는 선형 자료 구조이다.
      선택지 2: 리스트는 원소들이 순서대로 연결된 일렬 구조를 이루는 선형 자료 구조이다.
      선택지 3: 트리는 한 노드가 여러 자식 노드를 가지는 계층 구조(1:n 대응 관계)로 일렬 구조를 따르지 않는 비선형 자료 구조이므로 정답이다.
      선택지 4: 큐는 한쪽에서 삽입하고 다른 쪽에서 삭제하는 일렬 구조를 이루는 선형 자료 구조이다.

      핵심 개념:
      선형 구조는 원소들이 일렬로 나열된 구조(1:1 대응 관계)를 의미한다.
      비선형 구조는 원소의 나열이 일렬로 이루어지지 않은 구조(1:n 또는 n:m 대응 관계)를 의미한다.
      배열, 리스트, 스택, 큐는 선형 자료 구조이다.
      트리(1:n)와 그래프(n:m)는 비선형 자료 구조이다.

  - id: l03-02
    type: multiple-choice
    prompt: 배열에 대한 설명으로 올바른 것은?
    choices:
      - { id: '1', text: '삽입과 삭제 연산 수행 시 추가적인 연산으로 인해 오버헤드가 발생하는 정적구조를 갖는다.' }
      - { id: '2', text: '두 개 이상의 서로 다른 구조를 가진 데이터항목을 하나의 변수이름으로 묶고 인덱스를 사용해서 구분하는 자료구조이다.' }
      - { id: '3', text: '배열의 기억공간은 포트란과 코볼에서처럼 항상 동적으로 할당이 이루어진다.' }
      - { id: '4', text: '배열에서 각 원소에 대한 접근시간은 원소가 어느 위치에 저장되어 있느냐에 따라 차이가 발생한다.' }
    answers: ['1']
    explanation: |
      선택지 1: 배열은 크기가 고정된 정적 구조이므로 중간에 삽입·삭제하면 뒤 원소들을 이동하는 추가 연산이 필요해 오버헤드가 발생한다. 옳은 설명이므로 정답이다.
      선택지 2: 서로 다른 구조를 가진 데이터 항목을 하나의 이름으로 묶는 자료 구조는 레코드이다. 배열은 같은 자료형의 원소들을 모은 구조이다.
      선택지 3: 배열의 기억공간은 선언문을 통해 정의되며 정적으로 할당된다. 포트란(FORTRAN)과 코볼(COBOL)도 배열을 정적으로 할당한다.
      선택지 4: 배열은 인덱스로 원소 위치를 바로 계산해 접근하므로 모든 원소의 접근 시간이 동일하다. 위치에 따라 접근 시간이 달라지는 대표적인 자료 구조는 리스트이다.

      핵심 개념:
      배열은 같은 자료형의 원소들을 연속된 기억공간에 저장하고 인덱스로 구분하는 자료 구조이다.
      배열의 기억공간은 선언문을 통해 정의되며 정적으로 할당된다.
      인덱스로 직접 접근하므로 모든 원소의 접근 시간이 동일하다.
      정적 구조이므로 삽입·삭제 시 원소 이동에 따른 오버헤드가 생긴다.

  - id: l03-03
    type: multiple-choice
    prompt: 한쪽 끝에서 모든 삽입을 수행하고 다른 쪽 끝에서 모든 삭제를 수행하는 구조의 리스트 자료 구조를 무엇이라 하는가?
    choices:
      - { id: '1', text: '큐' }
      - { id: '2', text: '스택' }
      - { id: '3', text: '이중 연결 리스트' }
      - { id: '4', text: '배열' }
    answers: ['1']
    explanation: |
      선택지 1: 큐는 한쪽 끝(rear)에서 삽입하고 다른 쪽 끝(front)에서 삭제하는 선입선출(FIFO, First-In First-Out) 구조이므로 정답이다. 매표창구에 줄 선 사람들처럼 먼저 온 사람이 먼저 나가고 새로 온 사람은 줄 끝에 선다.
      선택지 2: 스택은 삽입과 삭제가 모두 한쪽 끝(top)에서만 일어나는 후입선출(LIFO, Last-In First-Out) 구조이다. 쌓인 접시나 책 더미가 대표적인 예이다.
      선택지 3: 이중 연결 리스트는 각 노드가 앞·뒤 노드를 가리키는 두 개의 링크를 가져 양방향으로 순회할 수 있는 리스트로, 삽입·삭제 위치가 양 끝으로 제한되지 않는다.
      선택지 4: 배열은 같은 모양의 방을 연속해서 만들고 그 안에 같은 종류의 자료를 저장하는 구조로, 삽입·삭제 위치를 제한하는 구조가 아니다.

      핵심 개념:
      큐는 삽입은 한쪽 끝, 삭제는 다른 쪽 끝에서만 수행하는 선입선출 구조이다.
      스택은 삽입과 삭제를 같은 한쪽 끝에서 수행하는 후입선출 구조이다.
      큐의 예: 매표창구 앞의 대기 줄.
      스택의 예: 뷔페식당의 쌓인 접시, 책상 위에 쌓인 책 더미.

  - id: l04-01
    type: multiple-choice
    prompt: 트리의 루트 노드에서 리프 노드에 이르는 가장 긴 경로에 존재하는 노드의 개수를 무엇이라고 하는가?
    choices:
      - { id: '1', text: '가지 수' }
      - { id: '2', text: '차수' }
      - { id: '3', text: '레벨' }
      - { id: '4', text: '깊이' }
    answers: ['4']
    explanation: |
      선택지 1: 가지(branch, edge)는 노드를 연결하는 선이며, 가지 수는 경로의 노드 개수를 뜻하지 않는다.
      선택지 2: 차수(degree)는 각 노드에 있는 가지의 수(자식 노드 수)이므로 문제의 정의와 다르다.
      선택지 3: 레벨은 루트 노드로부터의 거리(가지의 개수)로, 노드마다 다를 수 있는 값이다.
      선택지 4: 깊이는 레벨 중 가장 큰 값으로, 루트에서 리프에 이르는 가장 긴 경로를 나타내므로 정답이다.

      핵심 개념:
      가지(branch, edge): 노드와 노드를 연결하는 선이다.
      차수(degree): 한 노드에 연결된 자식 가지의 수이다.
      레벨: 루트 노드로부터의 거리이며, 하나의 트리 안에서도 노드마다 다르다.
      깊이: 트리의 레벨 중 가장 큰 값으로, 루트에서 가장 먼 리프까지의 경로 길이를 나타낸다.
      루트의 레벨을 1로 두면 깊이는 가장 긴 경로에 있는 노드 수와 같고, 루트 레벨을 0으로 두면(l04-02처럼) 가장 긴 경로의 가지 수와 같다. 어느 쪽이든 트리 깊이는 레벨의 최댓값이다.

  - id: l04-02
    type: multiple-choice
    prompt: 이진트리에 대한 설명으로 올바른 것은?
    choices:
      - { id: '1', text: '각 노드의 차수 중에서 최소 차수가 2이상이다.' }
      - { id: '2', text: '노드가 하나도 없는 공백트리도 이진트리이다.' }
      - { id: '3', text: '루트레벨이 0이고 깊이가 2인 이진트리의 최대노드의 수는 8개이다.' }
      - { id: '4', text: '한 노드에 대한 서브트리의 순서는 대칭적인 관계를 갖기 때문에 중요하지 않다.' }
    answers: ['2']
    explanation: |
      선택지 1: 이진 트리는 각 노드가 최대 2개의 자식 노드를 가지므로 최대 차수가 2이다. 차수가 0이나 1인 노드도 있을 수 있으므로 최소 차수가 2 이상이라는 설명은 틀렸다.
      선택지 2: 이진 트리는 공백이거나 루트와 왼쪽·오른쪽 서브트리로 이루어지므로 노드가 하나도 없는 공백 트리도 이진 트리이다. 옳은 설명이므로 정답이다.
      선택지 3: 깊이가 2인 이진 트리는 레벨 0에 1개, 레벨 1에 2개, 레벨 2에 4개의 노드를 가지므로 최대 노드 수는 $1+2+4=7$개이다.
      선택지 4: 이진 트리는 왼쪽 서브트리와 오른쪽 서브트리를 구분하므로 서브트리의 순서가 중요하며, 대칭적인 관계를 가지는 것이 아니다.

      핵심 개념:
      이진 트리는 모든 노드의 차수가 2 이하인 트리로, 각 노드는 최대 두 개의 자식 노드를 가진다.
      노드가 하나도 없는 공백 트리도 이진 트리로 본다.
      루트 레벨이 0일 때 레벨 $i$의 최대 노드 수는 $2^{i}$개, 깊이 $k$인 이진 트리의 최대 노드 수는 $2^{k+1}-1$개이다.
      왼쪽 서브트리와 오른쪽 서브트리는 서로 구분되므로 순서가 바뀌면 다른 이진 트리가 된다.

  - id: l04-03
    type: multiple-choice
    prompt: 그래프 관련 용어에 대한 설명으로 틀린 것은?
    choices:
      - { id: '1', text: '간선이 두 정점을 직접적으로 연결시키고 있을 때 두 정점을 인접한 정점이라고 한다.' }
      - { id: '2', text: '각 정점과 인접해 있는 정점들의 나열을 사이클이라고 한다.' }
      - { id: '3', text: '두 정점 사이에 경로가 존재하는 경우를 연결되었다고 한다.' }
      - { id: '4', text: '방향 그래프에서 적어도 두 정점사이에 어느 한쪽으로만 경로가 존재할 때, 약하게 연결되었다고 한다.' }
    answers: ['2']
    explanation: |
      선택지 1: 간선으로 직접 연결된 두 정점을 인접한 정점이라고 하므로 옳은 설명이다.
      선택지 2: 사이클은 세 개 이상의 정점을 가진 경로 중에서 시작 정점과 끝 정점이 같은 경로이다. 인접한 정점들을 나열한 것은 경로에 해당하므로 틀린 설명이며 정답이다.
      선택지 3: 두 정점 사이에 경로가 존재하면 두 정점이 연결되었다고 하므로 옳은 설명이다.
      선택지 4: 방향 그래프에서 적어도 두 정점 사이에 어느 한쪽 방향으로만 경로가 존재하면 약하게 연결되었다고 하므로 옳은 설명이다. (원본 화면에는 "적어도 두 정점이 연결되어 있지 않을 때 약하게 연결되었다고 한다"라는 문장 뒤에 "=>"로 정정 문장이 병기되어 있어, 정정된 문장을 선택지로 사용했다.)

      핵심 개념:
      인접: 간선이 두 정점을 직접 연결하고 있는 관계이다.
      경로: 인접한 정점들을 차례로 나열한 것이며, 경로가 존재하면 두 정점이 연결되었다고 한다.
      사이클: 세 개 이상의 정점을 가진 경로 중 시작 정점과 끝 정점이 같은 경로이다.
      방향 그래프에서 모든 두 정점 사이에 양방향 경로가 있으면 강하게 연결, 한쪽 방향으로만 경로가 있는 쌍이 있으면 약하게 연결되었다고 한다.

