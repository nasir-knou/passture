      선택지 2: 유효성은 모든 명령이 컴퓨터에서 실행 가능해야 한다는 조건으로 4가지 조건에 포함된다.
      선택지 3: 명확성은 각 명령이 모호하지 않고 단순 명확해야 한다는 조건으로 4가지 조건에 포함된다.
      선택지 4: 유한성은 한정된 수의 단계를 거친 후에는 반드시 종료해야 한다는 조건으로 4가지 조건에 포함된다.

